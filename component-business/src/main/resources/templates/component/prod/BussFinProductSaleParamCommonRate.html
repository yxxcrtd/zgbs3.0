<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org">
<head>
</head>
<body>
	<div th:id="|${entityName}_div|" class="pro-module-wrap">
		<div class="pro-module">
			<h3 class="pro-module-title">
				<span class="title-des">募集要素</span><i
					class="iconfont icon-arrow-down pro-down-icon"></i>
			</h3>
			<div class="pro-module-item">
				<input type="text" th:name="|${entityName}.pageId|"
					data-th-value='${pageId}' style="display: none;">
				<div class="layui-form-item">
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{BussFinProductSaleParam.issueType}">募集方式</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:name="|issueType|"
								th:id="|${entityName}_issueType|"
								class="layui-input form-input input-checkbox" required
								data-th-initValue='${issueType}'
								data-th-data-result="${RAISE_TYPE}" />
						</div>
						<!-- 
						<label class="layui-form-label form-label-wrap"
							th:text="#{BussFinProductSaleParam.prdBand}">产品品牌</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:id="|${entityName}_prdBand|" th:name="|${entityName}.prdBand|"
								class="layui-input form-input" data-th-required="${pageId} eq 'FinProductBuild002'"
								data-th-placeholder="#{SysCommon.placeholder}" maxlength=10
								data-th-value='${entity?.prdBand}'>
						</div> -->
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{BussFinProductSaleParam.firstSaleVdate}">募集开始日</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:name="|firstSaleVdate|"
								th:id="|${entityName}_firstSaleVdate|"
								class="layui-input form-input input-dateSelect" required
								data-th-value='${#dates.format(entity?.firstSaleVdate,"yyyy-MM-dd")}'>
						</div>
						<!-- 
						<label class="layui-form-label form-label-wrap"
							th:text="#{BussFinProductSaleParam.cyyType}">币种钞汇标志</label>
						<div class="layui-input-inline input-inline">
							<select th:id="|${entityName}_cyyType|"
								th:name="|${entityName}.cyyType|"
								class="layui-input form-input input-select"
								th:initValue="${pageModel} eq ${pageModelNew} ? ${NOTE_EXCHANGE_FLAG_01} : ${entity?.cyyType}"
								data-th-data-result="${NOTE_EXCHANGE_FLAG}" searchable="true"
								placeholder="请输入内容" data-th-required="${pageId} eq 'FinProductBuild002'"
								data-th-placeholder="#{SysCommon.placeholder}">
							</select>
						</div> -->
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{BussFinProductSaleParam.firstSaleMdate}">募集结束日</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:name="|firstSaleMdate|"
								th:id="|${entityName}_firstSaleMdate|"
								class="layui-input form-input input-dateSelect" required
								data-th-value='${#dates.format(entity?.firstSaleMdate,"yyyy-MM-dd")}'>
						</div> 
					</div>
				</div>
				<div class="layui-form-item">
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{BussFinProductSaleParam.ccy}">募集币种</label>
						<div class="layui-input-inline input-inline">
							<select th:id="|${entityName}_ccy|" th:name="|ccy|"
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-initValue='${ccy}' data-th-data-result="${CCY}" required>
							</select>
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{BussFinProductSaleParam.repCashPrinCcy}">兑付本金币种</label>
						<div class="layui-input-inline input-inline">
							<select th:id="|${entityName}_repCashPrinCcy|"
								th:name="|bussRepFinProductInfoDto.repCashPrinCcy|"
								class="layui-input form-input input-select"
								data-th-data-result="${CCY}" placeholder="请输入内容"
								data-th-initValue="${repCashPrinCcy}"
								data-th-placeholder="#{SysCommon.placeholder}" required>
							</select>
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{BussFinProductSaleParam.repCashProfCcy}">兑付收益币种</label>
						<div class="layui-input-inline input-inline">
							<select th:id="|${entityName}_repCashProfCcy|"
								th:name="|bussRepFinProductInfoDto.repCashProfCcy|"
								class="layui-input form-input input-select"
								data-th-data-result="${CCY}" placeholder="请输入内容"
								data-th-initValue="${repCashProfCcy}"
								data-th-placeholder="#{SysCommon.placeholder}" required>
							</select>
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{BussFinProductSaleParam.repRaiseAmtPlan}">计划募集金额</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:id="|${entityName}_raiseAmtPlan|"
								th:name="|${entityName}.raiseAmtPlan|" data-textrange="2" maxlength="19"
								data-th-value="${entity?.raiseAmtPlan}"
								data-th-required="${pageId} neq 'FinProductModule002'"
								   onkeyup="if(/^\d{1,17}(\.\d{1,2})?$/.test(this.value) ){ }else{this.value= this.value.substr(0,16) }"
								class="layui-input form-input text-number"> <span
								class="input-right-show">元</span>
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							th:text="#{BussFinProductSaleParam.saleMax}">募集上限</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:id="|${entityName}_saleMax|"
								th:name="|${entityName}.saleMax|" th:value="${entity?.saleMax}"
								   onkeyup="if(/^\d{1,17}(\.\d{1,2})?$/.test(this.value) ){ }else{this.value= this.value.substr(0,16) }"
								class="layui-input form-input text-number" data-textrange="2" maxlength="19" />
							<span class="input-right-show">元</span>
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							th:text="#{BussFinProductSaleParam.saleMin}">募集下限</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:id="|${entityName}_saleMin|"
								th:name="|${entityName}.saleMin|" 
								th:value="${entity?.saleMin}"
								   onkeyup="if(/^\d{1,17}(\.\d{1,2})?$/.test(this.value) ){ }else{this.value= this.value.substr(0,16) }"
								class="layui-input form-input text-number" data-textrange="2" maxlength="19" />
							<span class="input-right-show">元</span>
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							th:text="#{BussFinProductSaleParam.toffStart}">认购起点</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:id="|${entityName}_toffStart|"
								th:name="|${entityName}.toffStart|"
								th:value="${entity?.toffStart}"
								   onkeyup="if(/^\d{1,17}(\.\d{1,2})?$/.test(this.value) ){ }else{this.value= this.value.substr(0,16) }"
								data-th-required="(${pageId} eq 'FinProductBuild002') or (${pageId} eq 'FinNetValueProductBuild002')"
								class="layui-input form-input text-number" data-textrange="2" maxlength="19" />
							<span class="input-right-show">元</span>
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							th:text="#{BussFinProductSaleParam.lowestAmt}">最少追加金额</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:id="|${entityName}_lowestAmt|"
								th:name="|${entityName}.lowestAmt|"
								th:value="${entity?.lowestAmt}"
								   onkeyup="if(/^\d{1,17}(\.\d{1,2})?$/.test(this.value) ){ }else{this.value= this.value.substr(0,16) }"
								class="layui-input form-input text-number" data-textrange="2" maxlength="19" />
							<span class="input-right-show">元</span>
						</div>
					</div>
					<div class="form-inline-wrap" id="hugeRedRatioDiv">
						<label class="layui-form-label form-label-wrap"
							th:text="#{BussFinProductSaleParam.hugeRedRatio}">巨额赎回比例</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:id="|${entityName}_hugeRedRatio|"
								th:name="|${entityName}.hugeRedRatio|"
								th:value="${entity?.hugeRedRatio}"
								class="layui-input form-input" maxlength="6" />
							<span class="input-right-show">%</span>
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							th:text="#{BussFinProductSaleParam.saleArea}">销售地区</label>
						<div class="layui-input-inline input-inline">
							<select th:id="|${entityName}_saleArea|"
								th:name="|${entityName}.saleArea|"
								class="layui-input form-input input-select"
								th:initValue="${entity?.saleArea}" showAll="true"
								data-th-data-result="${SVR_BUY_PLACE}" searchable="false" 
								placeholder="请输入内容" multiple="multiple"
								data-th-placeholder="#{SysCommon.placeholder}" required>
							</select>
						</div>
					</div>
					<div class="form-inline-wrap" id='investorTypeDiv'>
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{BussRepFinProductInfo.repInvestorType}">目标客户类型</label>
						<div class="layui-input-inline input-inline">
							<select th:id="|${entityName}_investorType|"
								th:name="|${entityName}.investorType|"
								data-th-data-result="${SALETARGET_DECLARE}"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-initValue="${repInvestorType}"  multiple="multiple"
							    data-th-placeholder="#{SysCommon.placeholder}" required>
							</select>
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							th:text="#{BussFinProductSaleParam.sameOrg}">同业机构</label>
						<div class="layui-input-inline input-inline">
							<select th:id="|${entityName}_sameOrg|"
								th:name="|sameOrg|"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-initValue="${sameOrg}"  multiple="multiple"
								data-th-data-url="@{/invest/product/common/getCustomerName}"
							    data-th-placeholder="#{SysCommon.placeholder}" disabled>
							</select>
							<!-- <input type="text" th:id="|${entityName}_sameOrg|"
								th:name="|sameOrg|"
								th:value="${sameOrg}"
								class="layui-input form-input " disabled/> -->
						</div>
					</div>
				</div>
				
				<!--  
				<div class="layui-form-item">
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							th:text="#{BussFinProductSaleParam.minPaperQty}">最低账面份额</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:id="|${entityName}_minPaperQty|"
								th:name="|${entityName}.minPaperQty|"
								th:value="${entity?.minPaperQty}"
								data-th-required="${pageId} eq 'FinProductBuild002'"
								class="layui-input form-input text-number" data-textrange="2" />
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							th:text="#{BussFinProductSaleParam.minRedmQty}">最低赎回份额</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:id="|${entityName}_minRedmQty|"
								th:name="|${entityName}.minRedmQty|"
								th:value="${entity?.minRedmQty}"
								data-th-required="${pageId} eq 'FinProductBuild002'"
								class="layui-input form-input text-number" data-textrange="2" />
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							th:text="#{BussFinProductSaleParam.canPlge}">是否可质押</label>
						<div class="layui-input-inline input-inline">
							<input type="checkbox" th:id="|${entityName}_canPlge|"
								th:name="|${entityName}.canPlge|"
								data-th-required="${pageId} eq 'FinProductBuild002'"
								lay-skin="switch" data-th-value="${YES_OR_NO_Y}" lay-text="是|否"
								data-th-checked="${entity?.plge}" />
						</div>
					</div>
				</div>-->
				<div class="layui-form-item">
					<div class="form-inline-wrap" id='saleChannelDiv'>
						<label class="layui-form-label form-label-wrap"
								th:text="#{BussFinProductSaleParam.saleChannel}">销售渠道</label>
						<div class="layui-input-inline input-inline">
							<select th:id="|${entityName}_saleChannel|"
									th:name="|${entityName}.saleChannel|"
									class="layui-input form-input input-select"
									th:initValue="${entity?.saleChannel}"
									data-th-data-result="${SALECHANNELCHB}" searchable="true" 
									placeholder="请输入内容" multiple="multiple"
									data-th-placeholder="#{SysCommon.placeholder}" required>
							</select>
						</div>
					</div>
					<div class="form-inline-wrap" id='saleDepartmentDiv'>
						<label class="layui-form-label form-label-wrap"
									data-th-text="#{BussFinProductSaleParam.saleDepartment}">销售部门</label>
						<div class="layui-input-inline input-inline">
							<select th:id="|${entityName}_saleDepartment|"
									th:name="|saleDepartment|" 
									class="layui-input form-input input-select"
									data-th-placeholder="#{SysCommon.placeholder}" searchable="true"
									data-th-initValue='${saleDepartment}' multiple="multiple"
									data-th-data-result="${SALE_DEPT}">
							</select>
						</div>
					</div>
					
						
						<!--  
						<label class="layui-form-label form-label-wrap"
							th:text="#{BussFinProductSaleParam.maxPlgeRate}">质押率上限</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:id="|${entityName}_maxPlgeRate|"
								th:name="|${entityName}.maxPlgeRate|"
								th:value="${entity?.maxPlgeRate}"
								class="layui-input form-input text-number" data-textrange="4" />
						</div>-->
					</div>

					<div class="layui-form-item">

						<div class="form-inline-wrap" id='holdingMaxDiv'>
							<label class="layui-form-label form-label-wrap"
								   data-th-text="#{BussFinProductSaleParam.singleInvestorholdingMax}">单一投资者持有上限%</label>
							<div class="layui-input-inline input-inline">
								<input type="text" th:id="|${entityName}_singleInvestorholdingMax|"
									   th:name="|${entityName}.singleInvestorholdingMax|"
									   data-th-value="${entity?.singleInvestorholdingMax?:49}"
									   placeholder="请输入0-100间数值"
									   class="layui-input form-input input-text" data-textrange="2"
									   onblur="if(!/^(\d{1,2}(\.\d+)?|100)$/.test(this.value))$(this).val('').trigger('change')" required/>
							</div>
						</div>

						<div class="form-inline-wrap" id='isFaceSingleInvestorDiv' style="display:none;">
							<label class="layui-form-label form-label-wrap"
								   data-th-text="#{BussFinProductSaleParam.isFaceSingleInvestor}">是否面向单一投资者</label>
							<div class="layui-input-inline input-inline">
								<select th:id="|${entityName}_isFaceSingleInvestor|"
										th:name="|${entityName}.isFaceSingleInvestor|"
										class="layui-input form-input input-select"
										data-th-data-result="${YES_OR_NO}"
										data-th-initValue="${entity?.isFaceSingleInvestor?:YES_OR_NO_N}"
										data-th-placeholder="#{SysCommon.placeholder}" required>
								</select>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
<div layout:fragment="script">	
  <script data-th-inline="javascript" type="text/javascript">
		var bussFinProductSaleParamDto = /*[[${entityName}]]*/'bussFinProductSaleParamDto'; // 实体类字段名

		var dealMode=/*[[${dealMode}]]*/'';//传过来的父页面的id
		var profitType=/*[[${profitType}]]*/'';//传过来的父页面的id
		var operationType=/*[[${operationType}]]*/'';//传过来的父页面的id
		var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
		
	</script>
	<script
		data-th-src="@{/js/component/prod/BussFinProductSaleParamCommonRate.js}"
		type="text/javascript">
   </script>
</div>   
</body>

</html>
