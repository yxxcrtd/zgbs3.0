<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	  xmlns:th="http://www.thymeleaf.org">
<head>
	<style>
		.buss-inline .select2-container{
			width: 90px !important;
		}
	</style>


</head>
<body>
<div th:id="|${bussFinProductOpenPlanDto}_div|" class="pro-module-wrap">
	<div class="pro-module">
		<h3 class="pro-module-title"><span class="title-des">开放计划信息</span>(<span class="star-sign">*</span>必填)<i class="iconfont icon-arrow-down pro-down-icon"></i>
		</h3>
		<input type="text" th:id="|${bussFinProductOpenPlanDto}_dealMode|" th:name="|${bussFinProductOpenPlanDto}.dealMode|" hidden>
		<input type="text" th:name="|${bussFinProductOpenPlanDto}.pageId|" data-th-value="${pageId}" hidden>
		<input type="text" id="openNdateStart"  name="openNdateStart" hidden>
		<input type="text" id="openNdateEnd" name="openNdateEnd" hidden>
		<input type="text" id="openNdateRedStart"  name="openNdateRedStart" hidden>
		<input type="text" id="openNdateRedEnd" name="openNdateRedEnd" hidden>
		<input type="text" id="workflowIdBackUp" data-th-value="${workflowId}" hidden>
		<input type="text" id="isClick" data-th-value="false" hidden>
		<input type="text" id="isClickRed" data-th-value="false" hidden>
		<div class="pro-module-item">
			<h4 class="pro-module-title">
				<span class="title-des">申购</span><i
					class="iconfont icon-arrow-down pro-down-icon"></i>
			</h4>
			<!-- modify by mashukai 20201116 BS-2025 草稿箱开放模式反显值不对 start -->
			<div class="layui-form-item">
				<div class="form-inline-wrap" >
					<label class="layui-form-label form-label-wrap"
						   th:text="#{FinProductOpenRule.openMode}">开放模式</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${bussFinProductOpenPlanDto}_openMode|"
								th:name="|${bussFinProductOpenPlanDto}.openMode|"
								class="layui-input form-input input-select"
								th:initValue="${pageModel} eq ${pageModelNew} and (${workflowId}=='' or ${workflowId}== null)? ${OPENMODE_01} : ${entity?.openMode}"
								data-th-data-result="${OPENMODE}" searchable="false"
								placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-required="${pageId} eq 'FinProductBuild002' or ${pageId} eq 'FinNetValueProductBuild002' "
						>
						</select>
					</div>
				</div>
				<div class="form-inline-wrap" >
					<label class="layui-form-label form-label-wrap"
						   th:text="#{FinProductOpenRule.openDaysType}">开放天数类型</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${bussFinProductOpenPlanDto}_openDaysType|"
								th:name="|${bussFinProductOpenPlanDto}.openDaysType|"
								class="layui-input form-input input-select"
								th:initValue="${pageModel} eq ${pageModelNew} and (${workflowId}=='' or ${workflowId}== null)? ${OPEN_DAYS_TYPE_01} : ${entity?.openDaysType}"
								data-th-data-result="${OPEN_DAYS_TYPE}" searchable="false"
								placeholder="请输入内容"
								allowClear="false"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-required="${pageId} eq 'FinProductBuild002'">
						</select>
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap"
						   th:text="#{FinProductOpenRule.openDays}">开放天数</label>
					<div class="layui-input-inline input-inline">
						<input type="text"
							   th:id="|${bussFinProductOpenPlanDto}_openDays|"
							   th:name="|${bussFinProductOpenPlanDto}.openDays|" length="3"
							   th:value="${entity?.openDays}"
							   class="layui-input form-input text-number" data-textrange="0" />
						<span class="input-right-show">天</span>
					</div>
				</div>
			</div>
			<div class="layui-form-item" >

				<div class="form-inline-wrap" style="width: 24% !important; margin-left: 3.2%" >
					<label class="layui-form-label form-label-wrap"
						   th:text="#{FinProductOpenRule.openCycle}">开放周期</label>
					<div class="layui-input-inline input-inline" style="width: 110px !important;">
						<input th:id="|${bussFinProductOpenPlanDto}_openCycle|"
							   th:name="|${bussFinProductOpenPlanDto}.openCycle|"
							   style="width: 56%; float: left; border-right: none;"
							   class="layui-input form-input text-number" data-textrange="0"
							   placeholder="请输入" th:value="${entity?.openCycle}"
							   data-th-placeholder="#{SysCommon.placeholder1}">
						<div style="width: 40%; float: left;">
							<select th:id="|${bussFinProductOpenPlanDto}_openCycleUnit|"
									th:name="|${bussFinProductOpenPlanDto}.openCycleUnit|"
									class="layui-input form-input input-select" searchable="false"
									formatoption="false" placeholder="请输入"
									data-th-placeholder="#{SysCommon.placeholder1}"
									data-th-data-result="${PERIOD_UNIT}" allowClear="false"
									th:initValue="${entity?.openCycleUnit} ? ${entity?.openCycleUnit}:${PERIOD_UNIT_01} ">
							</select>
						</div>
					</div>
				</div>
				<div class="form-inline-wrap" th:id="|${bussFinProductOpenPlanDto}_radioDiv|" style="width: 71% !important;">
					<div class="form-day-wrap" style="width: auto !important;">
						<label class="layui-form-label form-label-wrap"
							   style="width: auto !important;">周</label>
						<div class="layui-input-inline input-inline"
							 style="width: 90px !important;">
							<select th:id="|${bussFinProductOpenPlanDto}_dayOfWeek|"
									th:name="|${bussFinProductOpenPlanDto}.dayOfWeek|"
									class="layui-input form-input input-select" disabled
									formatoption="true" th:initValue="${entity?.dayOfWeek}"
									data-th-data-result="${WEEK}" searchable="false"
									placeholder="请输入" multiple="true" autosort="false"
									data-th-placeholder="#{SysCommon.placeholder}">
							</select>
						</div>
					</div>
					<div class="form-day-wrap">
						<label class="layui-form-label form-label-wrap radio-wrap"
							   style="width: auto !important;">&nbsp; <input type="radio"
																			 th:name="|${bussFinProductOpenPlanDto}.openDateRadio|" value="0"
																			 th:checked="${entity?.dayOfMonth != null}"
																			 lay-filter="openDateFilter"/>几号
						</label>
						<div class="layui-input-inline input-inline"
							 style="width: 90px !important;">
							<select th:id="|${bussFinProductOpenPlanDto}_dayOfMonth|"
									th:name="|${bussFinProductOpenPlanDto}.dayOfMonth|"
									class="layui-input form-input input-select" disabled
									th:initValue="${entity?.dayOfMonth}"
									data-th-data-result="${DAY_OF_MONTH}" searchable="false" autosort="false"
									formatoption="false" placeholder="请输入" multiple="true"
									data-th-placeholder="#{SysCommon.placeholder1}">
							</select>
						</div>
					</div>
					<div class="form-day-wrap">
						<label class="layui-form-label form-label-wrap radio-wrap"
							   style="width: auto !important;">&nbsp;<input type="radio"
																			th:name="|${bussFinProductOpenPlanDto}.openDateRadio|" value="1"
																			th:checked="${entity?.workdayOfMonth != null}"
																			lay-filter="openDateFilter"/>第几工作日</label>
						<div class="layui-input-inline input-inline"
							 style="width: 90px !important;">
							<select th:id="|${bussFinProductOpenPlanDto}_workdayOfMonth|"
									th:name="|${bussFinProductOpenPlanDto}.workdayOfMonth|"
									class="layui-input form-input input-select" disabled
									th:initValue="${entity?.workdayOfMonth}" formatoption="false" autosort="false"
									data-th-data-result="${WORKDAY_OF_MONTH}" searchable="false"
									placeholder="请输入" multiple="true"
									data-th-placeholder="#{SysCommon.placeholder1}">
							</select>
						</div>
					</div>
					<div class="form-day-wrap">
						<label class="layui-form-label form-label-wrap radio-wrap"
							   style="width: auto !important;">&nbsp; <input type="radio"
																			 th:name="|${bussFinProductOpenPlanDto}.openDateRadio|" value="2"
																			 th:checked="${entity?.weekOfMonth !=null}"
																			 lay-filter="openDateFilter"/>第几
						</label>

						<div class="layui-input-inline input-inline"
							 style="width: 90px !important;">
							<select th:id="|${bussFinProductOpenPlanDto}_weekOfMonth|"
									th:name="|${bussFinProductOpenPlanDto}.weekOfMonth|"
									class="layui-input form-input input-select" disabled
									formatoption="false" th:initValue="${entity?.weekOfMonth}"
									data-th-data-result="${WEEK_OF_MONTH}" searchable="false"
									placeholder="请输入" multiple="true"
									data-th-placeholder="#{SysCommon.placeholder1}">
							</select>
						</div>
						<label class="layui-form-label form-label-wrap"
							   style="width: auto !important;">&nbsp;周</label>
						<div class="layui-input-inline input-inline"
							 style="width: 90px !important;">
							<select th:id="|${bussFinProductOpenPlanDto}_workdayOfWeek|"
									th:name="|${bussFinProductOpenPlanDto}.workdayOfWeek|"
									class="layui-input form-input input-select" disabled
									formatoption="false" th:initValue="${entity?.workdayOfWeek}"
									data-th-data-result="${WEEK}" searchable="false" autosort="false"
									placeholder="请输入" multiple="true"
									data-th-placeholder="#{SysCommon.placeholder1}">
							</select>
						</div>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="form-inline-wrap">
					<div id="hidden_div_1">
						<label class="layui-form-label form-label-wrap"
							   th:text="#{FinProductOpenRule.calcMethod}">推算方法<span class="star-sign">*</span></label>
						<div class="layui-input-inline input-inline">
							<!--
								<select th:id="|${bussFinProductOpenPlanDto}_calcMethod|"
									th:name="|${bussFinProductOpenPlanDto}.calcMethod|"
									th:initValue="${pageModel} eq ${pageModelNew} ? ${CALC_METHOD_01} : ${entity?.calcMethod}"
									searchable="false" class="layui-input form-input input-select"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result="${CALC_METHOD}"
									data-th-required="${pageId} eq 'FinProductBuild002'">
								</select> -->
							<select th:id="|${bussFinProductOpenPlanDto}_calcMethod|" th:name="|${bussFinProductOpenPlanDto}.calcMethod|"
									th:initValue="${pageModel} eq ${pageModelNew} and (${workflowId}=='' or ${workflowId}== null)? ${CALC_RULE_01} : ${entity?.calcMethod}" searchable="false"
									class="layui-input form-input input-select" placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result="${CALC_RULE}"
							        data-th-required="true">
								<!--data-th-required="${pageId} eq 'FinProductBuild002' or ${pageId} eq 'FinNetValueProductBuild002' or ${pageId} eq 'FinOpenPlanMaintenance002'"-->
							</select>
						</div>
					</div>
				</div>
				<div class="form-inline-wrap">
					<div id="hidden_div_2">
						<label class="layui-form-label form-label-wrap"
							   th:text="#{FinProductOpenRule.firstOpenDate}">首次开放日</label>
						<div class="layui-input-inline input-inline">
							<input type="text"
								   th:id="|${bussFinProductOpenPlanDto}_firstOpenDate|"
								   th:name="|${bussFinProductOpenPlanDto}.firstOpenDate|"
								   data-th-value='${#dates.format(entity?.firstOpenDate,"yyyy-MM-dd")}'
								   disabled class="layui-input form-input input-dateSelect" />
						</div>
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap"
						   th:text="#{FinProductOpenRule.tradedayRule}">营业日准则<span class="star-sign">*</span></label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${bussFinProductOpenPlanDto}_tradedayRule|"
								th:name="|${bussFinProductOpenPlanDto}.tradedayRule|"
								th:initValue="${pageModel} eq ${pageModelNew} and (${workflowId}=='' or ${workflowId}== null)? ${TDAY_RULE_02} : ${entity?.tradedayRule}"
								searchable="false" class="layui-input form-input input-select"
								placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result="${TDAY_RULE}"
							    data-th-required="true">
						</select>
					</div>
				</div>
			</div>
			<!-- modify by mashukai 20201116 BS-2025 草稿箱开放模式反显值不对 end -->
			<div class="layui-form-item">
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap" th:text="#{FinProductOpenRule.calcRule}">推算规则<span class="star-sign">*</span></label>
					<div class="layui-input-inline input-inline">
						<!-- 一体化对应etliu -->
						<!-- <select th:id="|${bussFinProductOpenPlanDto}_calcRule|" th:name="|${bussFinProductOpenPlanDto}.calcRule|"
                            searchable="false" class="layui-input form-input input-select"
                            placeholder="请输入内容" th:initValue="${entity?.calcRule}"
                            data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${CALC_RULE}">
                        </select> -->
						<select th:id="|${bussFinProductOpenPlanDto}_calcRule|" th:name="|${bussFinProductOpenPlanDto}.calcRule|"
								searchable="false" class="layui-input form-input input-select"
								placeholder="请输入内容" th:initValue="${entity?.calcRule}"
								data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${CALC_METHOD}"
								data-th-required="true">
							<!--data-th-required="${pageId} eq 'FinProductBuild002' or ${pageId} eq 'FinNetValueProductBuild002'"-->
						</select>
					</div>
				</div>
				<div class="form-inline-wrap" >
					<label class="layui-form-label form-label-wrap">节假日开放</label>
					<div class="layui-input-inline input-inline">
						<input type="checkbox"
							   th:id="|${bussFinProductOpenPlanDto}_hdayOpenFlag|"
							   th:name="|${bussFinProductOpenPlanDto}.hdayOpenFlag|"
							   lay-skin="switch" th:value="${YES}" lay-text="是|否"
							   lay-filter="isOpenHolidayFilter"
							   data-th-checked="${YES} == ${entity?.hdayOpenFlag}"
							   data-th-required="${pageId} eq 'FinProductBuild002'">
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{FinProductOpenRule.purSpeed}">申赎确认天数</label>
					<div class="layui-input-inline input-inline text-number">
						<span class="input-left-show">T+</span> <input type="text"
																	   th:id="|${bussFinProductOpenPlanDto}_purSpeed|" th:name="${pageId} eq 'FinPlanNetAsset002' or ${pageId} eq 'FinPlanProfitAsset002' or ${pageId} eq 'FinPlanAssetC002'  ? |${bussFinProductOpenPlanDto}.purSpeed|  : |purSpeed|" min="0"
																	   class="layui-input form-input form-input-left text-number"
																	   data-textrange="0" placeholder="请输入内容" maxlength="2"
																	   data-th-placeholder="#{SysCommon.placeholder}" required
																	   data-th-value="${pageId} eq 'FinPlanNetAsset002' or ${pageId} eq 'FinPlanProfitAsset002' or ${pageId} eq 'FinPlanAssetC002'  ? ${entity?.purSpeed?:1} : ${purSpeed?:1}">
					</div>
				</div>
				<div class="form-inline-wrap" id="div1">
					<label class="layui-form-label form-label-wrap"
						   th:text="#{FinProductOpenRule.sameFLag}">申赎同频</label>
					<div class="layui-input-inline input-inline">
						<input type="checkbox"
							   th:id="|${bussFinProductOpenPlanDto}_sameFLag|"
							   th:name="|${bussFinProductOpenPlanDto}.sameFLag|"
							   lay-skin="switch" th:value="${YES}" lay-text="是|否"
							   lay-filter="isSameFLagFilter"
							   data-th-checked="${YES} == ${sameFlag}"
							   data-th-required="true">
						<input type="hidden"
							   th:id="|${bussFinProductOpenPlanDto}_openType|"
							   th:name="|${bussFinProductOpenPlanDto}.openType|"
							   th:initValue=" ${entity?.openType}" value="03"
						>
					</div>
				</div>
			</div>
			<div class="layui-form-item">

				<div class="form-inline-wrap" th:id="|${bussFinProductOpenPlanDto}_cpriceRuleDiv|">
					<label class="layui-form-label form-label-wrap"
						   th:text="#{FinProductOpenRule.cpriceRule}">净值日准则<span class="star-sign">*</span></label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${bussFinProductOpenPlanDto}_cpriceRule|"
								th:name="|${bussFinProductOpenPlanDto}.cpriceRule|"
								th:initValue=" ${entity?.cpriceRule}"
								searchable="false" class="layui-input form-input input-select"
								placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result="${CPRICE_RULE}"
								data-th-required="true" >
						</select>
					</div>
				</div>
			</div>

			<div class="layui-form-item" th:if="${pageId} eq 'FinProductBuild002' or ${pageId} eq 'FinPlanNetAsset002' or ${pageId} eq 'FinPlanProfitAsset002' or ${pageId} eq 'FinPlanAssetC002' or ${pageId} eq 'FinNetValueProductBuild002' or ${pageId} eq 'FinOpenPlanMaintenance002'" th:id="|${bussFinProductOpenPlanDto}_tableDiv|">
				<div style="padding-left: 10px;">
					<a th:id="|${bussFinProductOpenPlanDto}_btn_preview|"
					   class="layui-btn layui-btn-sm" data-icon="iconfont icon-search">生成计划</a>
					<span id="bussOpenPlandiv"><a id="bussOpenPlan_btn_preview" data-ignore="true" class="layui-btn layui-btn-sm"><i
							class="iconfont icon-search"></i>预览</a></span>
				</div>
				<table class="layui-table" th:id="|${bussFinProductOpenPlanDto}_dataTable|" th:name="|${bussFinProductOpenPlanDto}.finOpenPlanList|"></table>
			</div>
		</div>
	</div>
	<div class="pro-module" id="red_div" style="display:none" >
		<h4 class="pro-module-title">
			<span class="title-des">赎回</span><i
				class="iconfont icon-arrow-down pro-down-icon"></i>
		</h4>
		<!-- modify by mashukai 20201116 BS-1993,BS-1996 开放计划，赎回计划反显值不对 start -->
		<div class="pro-module-item">
			<div class="layui-form-item">
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap"
						   th:text="#{FinProductOpenRule.openMode}">开放模式</label>
					<div class="layui-input-inline input-inline" >
						<select th:id="|${bussFinProductOpenPlanRedDto}_openMode|"
								th:name="|${bussFinProductOpenPlanRedDto}.openMode|"
								class="layui-input form-input input-select"
								th:initValue="${pageModel} eq ${pageModelNew} and ${isDraft}=='false'? ${OPENMODE_01} : ${redentity?.openMode}"
								data-th-data-result="${OPENMODE}" searchable="false"
								placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-required="${pageId} eq 'FinProductBuild002' or ${pageId} eq 'FinNetValueProductBuild002' "
						>
						</select>
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap"
						   th:text="#{FinProductOpenRule.openDaysType}">开放天数类型</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${bussFinProductOpenPlanRedDto}_openDaysType|"
								th:name="|${bussFinProductOpenPlanRedDto}.openDaysType|"
								class="layui-input form-input input-select"
								th:initValue="${pageModel} eq ${pageModelNew} and ${isDraft}=='false'? ${OPEN_DAYS_TYPE_01} : ${entity?.openDaysType}"
								data-th-data-result="${OPEN_DAYS_TYPE}" searchable="false"
								placeholder="请输入内容"
								allowClear="false"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-required="${pageId} eq 'FinProductBuild002'">
						</select>
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap"
						   th:text="#{FinProductOpenRule.openDays}">开放天数</label>
					<div class="layui-input-inline input-inline">
						<input type="text"
							   th:id="|${bussFinProductOpenPlanRedDto}_openDays|"
							   th:name="|${bussFinProductOpenPlanRedDto}.openDays|" length="3"
							   th:value="${redentity?.openDays}"
							   class="layui-input form-input text-number" data-textrange="0" />
						<span class="input-right-show">天</span>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="form-inline-wrap" style="width: 20% !important; margin-left: 8.3%" >
					<label class="layui-form-label form-label-wrap"
						   th:text="#{FinProductOpenRule.openCycle}"
						   style="width: auto !important;">开放周期</label>
					<div class="layui-input-inline input-inline" style="width: 110px !important;">
						<input th:id="|${bussFinProductOpenPlanRedDto}_openCycle|"
							   th:name="|${bussFinProductOpenPlanRedDto}.openCycle|"
							   style="width: 58%; float: left; border-right: none;"
							   class="layui-input form-input text-number" data-textrange="0"
							   placeholder="请输入" th:value="${redentity?.openCycle}"
							   data-th-placeholder="#{SysCommon.placeholder1}">
						<div style="width: 40%; float: left;">
							<select th:id="|${bussFinProductOpenPlanRedDto}_openCycleUnit|"
									th:name="|${bussFinProductOpenPlanRedDto}.openCycleUnit|"
									class="layui-input form-input input-select" searchable="false"
									formatoption="false" placeholder="请输入"
									data-th-placeholder="#{SysCommon.placeholder1}"
									data-th-data-result="${PERIOD_UNIT}" allowClear="false"
									th:initValue="${redentity?.openCycleUnit} ? ${redentity?.openCycleUnit} : ${PERIOD_UNIT_01} ">
							</select>
						</div>
					</div>
				</div>
				<div class="form-inline-wrap" style="width: 71% !important;" th:id="|${bussFinProductOpenPlanRedDto}_radioDiv|">
					<div class="form-day-wrap" style="width: auto !important;">
