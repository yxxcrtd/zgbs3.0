<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
       xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">

<body>
<div layout:fragment="content">
    <div class="pro-module-wrap" th:id="|${entityName}_detail|">
        <div class="joyin-form-wrap condition-area curr-form" line='100'>
            <form class="layui-form" th:id="|${entityName}_submitForm|">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4" id="portfolioId_div">
                        <label class="layui-form-label form-label-wrap"
                               data-th-utext="#{BussRepoSec.portfolioId}">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <input disabled type="text" th:id="|${entityName}_portfolioId|"
                                   th:name="|${entityName}.portfolioId|"
                                   class="layui-input form-input input-lenovoselect" maxlength="50"
                                   placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   th:value="${portfolioId}">
                            <input type="hidden" th:id="|${entityName}_ps|" th:name="|${entityName}.ps|" th:value="${ps}"></input>
                            <input type="hidden" th:id="|${entityName}_secAcctId|" th:name="|${entityName}.secAcctId|" th:value="${secAcctId}"></input>
                            <input type="hidden" th:id="|${entityName}_chlId|" th:name="|${entityName}.chlId|" th:value="${chlId}"></input>
                            <input type="hidden" th:id="|${entityName}_securitiesCust|" th:name="|${entityName}.securitiesCust|" th:value="${securitiesCust}"></input>
                            <input type="hidden" th:id="|${entityName}_repoType|" th:name="|${entityName}.repoType|" th:value="${repoType}"></input>
                            <input type="hidden" th:id="|${entityName}_assetType1|" th:name="|${entityName}.assetType1|" th:value="${assetType1}"></input>
                            <!-- add by gaopeng 2019/10/12 添加委托代码回显 start -->
                            <input type="hidden" th:id="|${entityName}_entrustId|" th:name="|${entityName}.entrustId|" th:value="${entrustId}"></input>
                            <!-- add by gaopeng 2019/10/12 添加委托代码回显 end -->
                            <!--产品化_质押式回购交易界面,正回购时：点击添加后的可质押券范围为投资经理移入可质押库的、该组合下的债券，不可选不在质押库里债券 add by zhangpei 20201125 start -->
                            <input type="hidden" th:id="|${entityName}_pageFromTz|" th:name="|${entityName}.pageFromTz|" th:value="${pageFromTz}"></input>
                            <!--产品化_质押式回购交易界面,正回购时：点击添加后的可质押券范围为投资经理移入可质押库的、该组合下的债券，不可选不在质押库里债券 add by zhangpei 20201125 end -->
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-utext="#{BussRepoSec.secType}">债券类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" th:id="|${entityName}_bondType|" th:name="|${entityName}.bondType|"
                                    class="layui-input form-input input-select" th:childrenIds="|${entityName}_bondCode|"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    allowClear="true" formatoption="true" multiple="multiple"
                                    data-th-data-result='${WINDTYPEONE}'>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               th:text="#{BussRepoSec.secId}">债券代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" th:id="|${entityName}_bondCode|" th:name="|${entityName}.bondCode|"
                                    th:parentIds="|${entityName}_bondType|"
                                    class="layui-input form-input input-select"
                                    placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                    th:data-url="|@{/component/trade/BussRepoSecDialog/getBondCode}?tradePlace=${tradePlace}|"
                                    allowClear="true">
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-utext="#{BussRepoSec.repRegistOrg}">登记托管机构</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" th:id="|${entityName}_repRegistOrg|"
                                    th:name="|${entityName}.repRegistOrg|"
                                    class="layui-input form-input input-select"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    allowClear="true" formatoption="true"
                                    data-th-data-result='${SVR_REGIST_ORG}'>
                            </select>
                        </div>
                    </div>
                    <!-- 可质押列表增加“债项评级”、“到期日”、“登记托管机构”、“剩余期限”字段 add by renping 20191012 start -->
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepoSec.avaPledgeBondDetailTBL.colmodel.endDays1}">剩余期限</label>
                        <div class="layui-input-inline input-inline">
                            <nobr>
                            <input type="text" th:id="|${entityName}_endDays1Start|" style="width:38%; padding-left: 10px;" th:name="|${entityName}.endDays1Start|" maxlength="12"
                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                   data-textrange="2" data-fixtype="2" class="form-input text-number rateCal"/>
                            <label style ="width:1%;display:inline-block;text-align:center" >-</label>
                            <input type="text" th:id="|${entityName}_endDays1End|" style="width:38%; padding-left: 10px;float:right" th:name="|${entityName}.endDays1End|" maxlength="12"
                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                   data-textrange="2" data-fixtype="2" class="form-input text-number rateCal"/>
                            </nobr>
                        </div>
                    </div>
                    <!-- 可质押列表增加“债项评级”、“到期日”、“登记托管机构”、“剩余期限”字段 add by renping 20191012 end -->
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <a th:id="|${entityName}_btn_add|" class="layui-btn layui-btn-sm btn-create" data-th-utext="#{BussRepoSec.secCreate}">债券新建</a>
                    </div>
                </div>
            </form>
        </div>
        <!--银行间上下行-->
        <div class="page-component" th:data-path="@{/invest/bankuplink/common/CfetsPledgedBond/init}"
             th:data-params="|{pageFrom: 'BussRepoSecDialog',quoteId:'${quoteId}'}|"></div>
        <!-- 汇总券面总额字段增加 add by renping 20190920 start -->
        <div class="pro-module-wrap">
            <div class="pro-module">
                <div class="pro-module-item">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap" style="float:right;margin-right:50px">
                            <label class="layui-form-label form-label-wrap"
				                    data-th-utext="#{BussRepoSec.totalPrinAmt}">汇总券面总额</label>
				             <div class="layui-input-inline input-inline">
				                 <input disabled type="text" th:id="|${entityName}_totalPrinAmt|"
				                        th:name="|${entityName}.totalPrinAmt|" maxlength="16" data-textrange="4"
				                        class="layui-input form-input text-number" placeholder="请输入内容"
				                        th:placeholder="#{SysCommon.placeholder}">
				                 <span class="input-right-show unitNum"
				                       data-th-utext="#{BussRepoSec.yuan}">元</span>
				             </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- 汇总券面总额字段增加 add by renping 20190920 end -->
        <div class="repo-trade-wrap">
            <div class="repo-trade-left">
                <h3 class="repo-trade-title">
                        <span class="title-des"
                              data-th-utext="#{BussRepoSec.avaPledgeBondList}">可质押债券列表</span>
                </h3>
                <table class="layui-table" th:id="|${entityName}_avaPledgeBondDetailList|"
                       th:name="|${entityName}.avaPledgeBondDetailList|"></table>
            </div>
            <div class="repo-trade-middle">
                <a class="trade-btn-wrap trade-add-btn" th:id="|${entityName}_btn_joyin|" href="javascript:;">
                    <i class="iconfont icon-batch-down"></i>
                    <span data-th-utext="#{BussRepoSec.joyin}">加入</span>
                </a>
                <a class="trade-btn-wrap trade-romove-btn" th:id="|${entityName}_btn_remove|" href="javascript:;">
                    <i class="iconfont icon-batch-upturn"></i>
                    <span data-th-utext="#{BussRepoSec.remove}">移除</span>
                </a>
            </div>
            <div class="repo-trade-right">
                <h3 class="repo-trade-title">
                        <span class="title-des"
                              data-th-utext="#{BussRepoSec.pledgeoBondList}">质押债券列表</span>
                </h3>
                <table class="layui-table" th:id="|${entityName}_pledgeBondDetailList|"
                       th:name="|${entityName}.pledgeBondDetailList|"></table>
            </div>
        </div>
        <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
            <div class="text-center">
                <a class="layui-btn layui-btn-sm btn-save" th:id="|${entityName}_save|" data-th-text="#{SysCommon.save}">保存</a>
                <a class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
</div>

<div layout:fragment="script">
    <style>
        .repo-trade-wrap {
            overflow: hidden;
        }

        .repo-trade-left, .repo-trade-right {
            width: 45%;
            float: left;
        }

        .repo-trade-middle {
            width: 10%;
            float: left;
            margin-top: 90px;
        }

        .trade-btn-wrap {
            display: block;
            text-align: center;
            margin: 0 12px;
            color: #0b72f1;
            padding: 5px 0;
            background: #f5f5f5;
            border: 1px solid #dddddd;
        }

        .trade-btn-wrap:hover {
            color: #0b72f1;
        }

        .trade-btn-wrap i {
            display: block;
        }

        .trade-romove-btn {
            margin-top: 15px;
        }

        .repo-trade-title {
            padding: 5px 0;
        }
    </style>

    <script data-th-inline="javascript" type="text/javascript">
        var entity = eval(/*[[${entity}]]*/'');

        var statusValid = /*[[${statusValid}]]*/'';
        var tradeMarket = /*[[${tradeMarket}]]*/'';
        //add by meifaxin 20190929 区分银行间 start
        var tradePlace = /*[[${tradePlace}]]*/'';
        //add by meifaxin 20190929 区分银行间 end
        var bizCode = /*[[${bizCode}]]*/'';
        var pageModel = /*[[${pageModel}]]*/'';
        var entityName = /*[[${entityName}]]*/'';
        var workflowId = /*[[${workflowId}]]*/'';
        var operationType = /*[[${operationType}]]*/'';
        var BACK_LEND_DIRECTION_04 = /*[[${BACK_LEND_DIRECTION_04}]]*/'';
        var BACK_LEND_DIRECTION_03 = /*[[${BACK_LEND_DIRECTION_03}]]*/'';
        var BACK_LEND_DIRECTION_06 = /*[[${BACK_LEND_DIRECTION_06}]]*/'';
        var ibuFlag_repoOverAvaCanContinue = /*[[${ibuFlag_repoOverAvaCanContinue}]]*/'';
        // add by etliu 20210303 银行间上下行 start
        var ignoreFlowTradeId = /*[[${ignoreFlowTradeId}]]*/'';
        // add by etliu 20210303 银行间上下行 end
        var isDzh = /*[[${isDzh}]]*/'';
        var entrustAmtUnit = /*[[${entrustAmtUnit}]]*/'';
        var mdate = /*[[${mdate}]]*/'';
        var isBondLendTrade = /*[[${isBondLendTrade}]]*/'';
    </script>
    <script data-th-src="@{/js/component/trade/BussRepoSecDialog.js}" type="text/javascript"></script>
</div>
</body>
</html>
