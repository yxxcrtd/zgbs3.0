<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{PbcPrdBaseinfoSub}">产品基本信息</title>
</head>
<body>
	<div layout:fragment="content">
		<div class="form-button-area" export="false">
			<a id="PbcPrdBaseinfoSub_btn_submit" class="layui-btn layui-btn-sm btn-default">
				<i class="iconfont icon-sent"></i>数据检查</a>
			<a id="PbcPrdBaseinfoSub_btn_manual"
			   class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-hand"></i>手工处理</a>
			<a id="PbcPrdBaseinfoSub_btn_cancelManual"
			   class="layui-btn layui-btn-sm btn-default">取消手工处理</a>
<!--			<a id="PbcPrdBaseinfoSub_btn_chbexport"-->
<!--			   class="layui-btn layui-btn-sm btn-export btn-default">导出</a>-->
			<a id="PbcPrdBaseinfoSub_btn_chbexportxls"
			   class="layui-btn layui-btn-sm btn-export btn-default">导出人行Excel</a>
		</div>
		<div class="joyin-form-wrap joyin-filter-form condition-area">
			<form class="layui-form" id="searchForm">
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">产品代码</label>
						<div class="layui-input-inline input-inline">
                           <select id="pbcProdId" name="prodId" data-th-data-url='@{/pbc/classic/manuallygeneratingpbcdata/ManuallyGeneratingPbcData001/getPbcProdId}' data-th-data-formatoption=true class="input-select" placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true" multiple="multiple">
                            </select>
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">内部产品代码</label>
						<div class="layui-input-inline input-inline">
                           <select id="prodId" name="prodId" data-th-data-url='@{/svreport/system/proregistcodemanage/ProRegistCodeManage001/getProdID}' data-th-data-formatoption=true class="input-select" placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true" multiple="multiple">
                            </select>
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">产品类型</label>
						<div class="layui-input-inline input-inline">
							<select id="ivstorientation" name="ivstorientation"
								class="layui-input form-input input-select"
								data-th-data-result="${SVR_PBC_IVSTORIENTATION}" placeholder="请选择"
								data-th-placeholder="#{SysCommon.selectplaceholder}"
								allowClear="true" multiple="multiple">
							</select>
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">运行方式</label>
						<div class="layui-input-inline input-inline">
							<select id="operateMode" name="operateMode"
								class="layui-input form-input input-select"
								data-th-data-result="${SVR_PBC_OPERATEMODE}"
								placeholder="请选择"
								data-th-placeholder="#{SysCommon.selectplaceholder}"
								allowClear="true" multiple="multiple">
							</select>
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
							<label class="layui-form-label form-lable">产品起始日期</label>
							<div class="layui-input-inline input-inline">
								<input id=vdate type="text" name="timeControl"
									class="layui-input form-input timeControl input-dateRangeSelect"
									placeholder="请选择日期区间" />
							</div>
					</div> 
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">报送状态</label>
						<div class="layui-input-inline input-inline">
							<select id="sendStatus" name="sendStatus"
								class="layui-input form-input input-select"
								data-th-data-result='${SUBMIT_STATUS}'
								data-th-initvalue="${submitStatus}" placeholder="请选择"
								data-th-placeholder="#{SysCommon.selectplaceholder}"
								allowClear="true" multiple="multiple">
							</select>
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">报送日期</label>
						<div class="layui-input-inline input-inline">
							<input id="submitTime" type="text" name="timeControl"
								class="layui-input form-input timeControl input-dateRangeSelect"
								placeholder="请选择日期区间" />
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">报送截止日</label>
						<div class="layui-input-inline input-inline">
							<input id="pbcSubmitDeadline" type="text" name="timeControl"
								class="layui-input form-input timeControl input-dateRangeSelect"
								placeholder="请选择日期区间" />
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">反馈状态</label>
						<div class="layui-input-inline input-inline">
							<select id="submitFeedbackStatus" class="input-select"
								data-th-data-result='${SVR_PBC_SUBMIT_FEEDBACK_STATUS}'
								data-th-initvalue="${submitFeedbackStatus}" placeholder="请选择"
								data-th-placeholder="#{SysCommon.selectplaceholder}"
								allowClear="true" multiple="multiple">
							</select>
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">数据日期</label>
						<div class="layui-input-inline input-inline">
							<input id="statusDate" type="text" name="timeControl"
								class="layui-input form-input timeControl input-dateRangeSelect"
								placeholder="请选择日期区间" />
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">数据状态</label>
						<div class="layui-input-inline input-inline">
							<select id="status" class="input-select"
								data-th-data-result='${SUBMITTED_STATUS}' placeholder="请选择"
								data-th-initvalue="${status}"
								data-th-placeholder="#{SysCommon.selectplaceholder}"
								allowClear="true" multiple="multiple">
							</select>
						</div>
					</div>
				</div>
				
			</form>
		</div>

		<div>
			<table class="layui-table" id="dataTable">
			</table>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var isMain = /*[[${isMain}]]*/'';
			var searchDataStart = /*[[${searchDataStart}]]*/'';
			var searchDataEnd = /*[[${searchDataEnd}]]*/'';
			var submitStatus = /*[[${submitStatus}]]*/'';
			var indentifyMark = /*[[${indentifyMark}]]*/'';
			var submitFeedbackStatus = /*[[${submitFeedbackStatus}]]*/'';
			var dataTitle = '<h4 class="modal-title" id="myModalLabel">产品基本信息数据检查 </h4>';
			var checkUrl = '/pbc/prdbaseinfosub/PbcPrdBaseinfoSub/reportCheck';
		</script>
		<script data-th-src="@{/js/report/report-common.js}"
			type="text/javascript"></script>
		<script data-th-src="@{/js/report/jquery.validate.js}"
			type="text/javascript"></script>
		<script data-th-src="@{/js/report/joyinvalid.js}"
			type="text/javascript"></script>
		<script data-th-src="@{/js/report/pbc/classic/prdbaseinfosub/PbcPrdBaseinfoSub.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
