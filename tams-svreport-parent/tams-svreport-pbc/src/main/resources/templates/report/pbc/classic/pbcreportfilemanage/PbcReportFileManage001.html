<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{PbcReportFileManage001}">人行报送文件管理</title>
<link rel="stylesheet" type="text/css"
	data-th-href="@{/css/report/report.css}">
<style>
.input-checkbox .layui-form-checkbox {
	margin-top: 0;
	height: 28px;
}
</style>
</head>

<body>
	<div layout:fragment="content">
		<div filter="false">
			<a class="layui-btn layui-btn-sm" lay-event="download" id="PbcReportFileManage001_btn_download">下载</a>
		</div>
		<div class="joyin-form-wrap condition-area">
			<form class="layui-form" id="searchForm">
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md3">
						<label class="layui-form-label form-lable">文件标识码</label>
						<div class="layui-input-inline input-inline">
							<select id="fileCode" class="input-select"
								data-th-formatoption="false"
								data-th-data-url="@{/pbc/classic/pbcreportfilemanage/PbcReportFileManage001/getFileCode}"
								placeholder="请选择" allowClear="true" multiple="multiple"></select>
						</div>
					</div>
					<div class="layui-inline layui-col-md3">
						<label class="layui-form-label form-lable">生成日期</label>
						<div class="layui-input-inline input-inline">
							<input id="PbcReportFileCreateDate" type="text"
								name="timeControl"
								class="layui-input form-input input-dateRangeSelect"
								placeholder="请选择日期区间" />
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md3" id="hiddenInput">
						<label class="layui-form-label form-lable"></label>
						<div class="layui-input-inline input-inline">
							<select id="orgCode" class="input-select" placeholder="请选择"
								allowClear="true" multiple="multiple"></select>
						</div>
					</div>
				</div>
			</form>
		</div>
		<div>
            <table class="layui-table" id="dataTable"></table>
        </div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var isFromMain = /*[[${isFromMain}]]*/'01';
		</script>
		<script data-th-src="@{/js/report/jquery.validate.js}"
			type="text/javascript"></script>
		<script data-th-src="@{/js/report/joyinvalid.js}"
			type="text/javascript"></script>
		<script data-th-src="@{/js/report/report-common.js}"
			type="text/javascript"></script>
		<script
			data-th-src="@{/js/report/pbc/classic/pbcreportfilemanage/PbcReportFileManage001.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
