<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ExportDeleteExcelConfirm001}">导出删除模板页面</title>
</head>
<body>
	<div layout:fragment="content">
        <div>
		<form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
			<div class="layui-form-item">
				<label class="layui-form-label form-lable" style="width: 10%;">删除原因</label>
				<div class="layui-input-inline input-inline">
					<textarea id="remark" name="remark" maxlength="200"
						class="layui-textarea" placeholder="请输入内容" required></textarea>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md12">
                    <div class="layui-input-inline input-inline">
						<input type="checkbox" id="isUpdate" name="isUpdate"
							lay-skin="primary" title="更新导出数据的报送状态为手工报送" checked>
				    </div>
				</div>
			</div>
			<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="position: fixed;bottom: 30px;margin: 50px;">
				<div class="text-center">
					<a id="ExportDeleteExcelConfirm001_btn_save"
						class="layui-btn layui-btn-sm btn-save"
						data-th-text="#{SysCommon.submit}">提交</a> <a
						id="ExportDeleteExcelConfirm001_btn_cancel"
						class="layui-btn layui-btn-sm btn-cancel"
						data-th-text="#{SysCommon.cancel}">取消</a>
				</div>
			</div>
		</form>
		</div>
		</div>
    <!-- <div layout:fragment="script">
        <script data-th-src="@{/js/basicdata/exchangerateinfo/MstExchangeQuotationInfo002.js}" type="text/javascript"></script>
    </div> -->
		<div layout:fragment="script">
			<script data-th-inline="javascript" type="text/javascript">
				var isFromMain = /*[[${isMain}]]*/'';
	            var orgPageId = /*[[${orgPageId}]]*/'';
                var expKeys = /*[[${expKeys}]]*/'';
			</script>
			<script data-th-src="@{/js/report/report-common.js}"
				type="text/javascript"></script>
			<script
				data-th-src="@{/js/report/chb/common/ExportDeleteExcelConfirm001.js}"
				type="text/javascript"></script>
		</div>
</body>
</html>
