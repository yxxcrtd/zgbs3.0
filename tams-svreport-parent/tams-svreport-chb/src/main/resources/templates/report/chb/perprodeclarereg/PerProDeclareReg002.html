<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{DocumentManagement002}">附件上传</title>
    <style>
    .download{
      color:#0078F0;
      font-style: normal;
    }
    .delete{
        color:#0078F0;
        font-style: normal;
    }
</style>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm">
	        <div class="pro-module-container">
				<div class="pro-module-wrapper pro-module-base">
					<!-- 文件上传 -->
                	<div class="page-component" th:data-path="@{/svreport/busicom/filecommonutil/SvrFileCommon/init}" th:data-params="|{entityName: 'svrFileCommonDto'}|"></div>
				</div>
			</div>	
			<div class="pro-module-wrapper pro-module-block">
			<div
				class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11"
				style="margin: 50px;">
				<div class="text-center">
					<a
						id="SvrPerProDeclareReg002_btn_submit"
						class="layui-btn layui-btn-sm btn-submit"
						data-th-text="#{SysCommon.submit}">提交</a> <a
						id="SvrPerProDeclareReg002_btn_cancel"
						class="layui-btn layui-btn-sm btn-cancel"
						data-th-text="#{SysCommon.cancel}">取消</a>
				</div>
			</div>
		</div>
         </form>
           
        <div class='layui-fluid'>
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
		<script th:inline="javascript" type="text/javascript">
    	 var dataArrStr = /*[[${dataArrStr}]]*/'';
    	</script>
        <script data-th-src="@{/js/report/chb/perprodeclarereg/PerProDeclareReg002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
