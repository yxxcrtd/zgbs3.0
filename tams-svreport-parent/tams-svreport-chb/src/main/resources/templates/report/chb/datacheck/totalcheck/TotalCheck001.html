<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{TotalCheck001}">总体核查</title>
<link rel="stylesheet" type="text/css"
    data-th-href="@{/css/report/report.css}">
<style type="text/css">
	.layui-tab-brief>.layui-tab-title .layui-this {
        padding:3px 15px 3px 15px;
	    border: none;
	    border-radius: 0;
        border-bottom: 2px solid #009688;
    }
    .layui-tab-brief>.layui-tab-title .layui-this:after {
        border: none;
        border-radius: 0;
    }

</style>
<!--[if lt IE 9]>
<script data-th-src="@{/js/report/excanvas.js}" type="text/javascript"></script>
<![endif]-->
</head>

<body>
    <div layout:fragment="content">
        <div class="form-button-area" export="false">
        </div>
        <div class="joyin-form-wrap condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md3">
                        <label class="layui-form-label form-lable">机构代码</label>
                        <div class="layui-input-inline input-inline">
                            <select id="issuePraty" name="issuePraty" class="input-select" 
                            data-th-data-url="@{/chb/datacheck/totalcheck/TotalCheck001/getIssuePartyidList}" 
                            placeholder="请选择" allowClear="true" multiple="multiple"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md3">
                        <label class="layui-form-label form-lable">查询日期</label>
                        <div class="layui-input-inline input-inline">
                            <input id="searchDate" type="text" name="timeControl"
                                data-th-value="${QUERY_DATE}" required
                                class="layui-input form-input input-dateSelect"
                                placeholder="请选择日期区间" />
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <p class="menu-title-wrap">
                <span class="menu-title">报送合格率</span>
            </p>
            <form class="layui-clear" role="form">
                <div class="whole-form-wrap joy-pie"
                    style="width: 100%; height: 150px; position: relative;">
                    <div class="delay-des-wrap">
                        <ul class="layui-clear" id="colorTitle">
                            <li id="top"><i class="youxiu" style="background-color:rgb(168,222,100)"></i>&ge;tp%</li>
                            <li id="mid"><i class="hege" style="background-color:rgb(135,206,250)"></i>&ge;md%&lt;tp%</li>
                            <li id="end"><i class="yujing" style="background-color:rgb(255,153,153)"></i>&lt;md%</li>
                        </ul>
                    </div>
                    <div class="joy-pie-div" style="width: 100%; height: 100%"></div>
                </div>
            </form>
            <div class="layui-tab layui-tab-brief " id="tabList" lay-filter="tabList" style="margin-bottom: 0px;" overflow>
	            <ul class="layui-tab-title" style="height: 50px;">
					<li class="layui-this" id="tab01" lay-tab-id="01"
						style="width: 10%;">
						<p style="height: 20px;">存续余额与</p>
						<p style="height: 20px;">月度报表对比</p>
					</li>
					<li id="tab02" lay-tab-id="02" style="width: 10%;">
                        <p style="height: 20px;">产品存续金额</p>
                        <p style="height: 20px;">和资产持仓偏差情况</p>
					</li>
	                <li id="tab03" lay-tab-id="03" style="width: 10%;">
                        <p style="height: 20px;">募集总量登记</p>
                        <p style="height: 20px;">明细</p>
                    </li>
	                <li id="tab04" lay-tab-id="04" style="width: 10%;">
                        <p style="height: 20px;">月末底层持仓</p>
                        <p style="height: 20px;">报送情况</p>
                    </li>
	                <li id="tab05" lay-tab-id="05" style="width: 10%;">
                        <p style="height: 20px;">资产持仓为负</p>
                        <p style="height: 20px;">的产品</p>
                    </li>
	                <li id="tab06" lay-tab-id="06" style="width: 10%;">
                        <p style="height: 20px;">现金持仓为负</p>
                        <p style="height: 20px;">的产品</p>
                    </li>
	                <li id="tab07" lay-tab-id="07" style="width: 10%;">
                        <p style="height: 20px;">交易价格偏差过大</p>
                        <p style="height: 20px;">的产品</p>
                    </li>
	                <li id="tab08" lay-tab-id="08" style="width: 10%;">
                        <p style="height: 20px;">资管计划底层金额</p>
                        <p style="height: 20px;">偏差过大</p>
                    </li>
	            </ul>
	            <div class="layui-clear whole-tab-wrap tab-content" id="TabContent">
	                <div class="tab-pane active" id="tabpan01">
	                    <table class="layui-table" id="table01"></table>
	                </div>
	                <div class="tab-pane active" id="tabpan02">
	                    <table class="layui-table" id="table02"></table>
	                </div>
	                <div class="tab-pane" id="tabpan03">
	                    <table class="layui-table" id="table03"></table>
	                </div>
	                <div class="tab-pane" id="tabpan04">
	                    <table class="layui-table" id="table04"></table>
	                </div>
	                <div class="tab-pane" id="tabpan05">
	                    <table class="layui-table" id="table05"></table>
	                </div>
	                <div class="tab-pane" id="tabpan06">
	                    <table class="layui-table" id="table06"></table>
	                </div>
	                <div class="tab-pane" id="tabpan07">
	                    <table class="layui-table" id="table07"></table>
	                </div>
	                <div class="tab-pane" id="tabpan08">
	                    <table class="layui-table" id="table08"></table>
	                </div>
	            </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
            var isFromMain = "${isFromMain}";
            var QUERY_DATE = /*[[${QUERY_DATE}]]*/'';
        </script>
        <script data-th-src="@{/js/report/jquery.validate.js}"
            type="text/javascript"></script>
        <script data-th-src="@{/js/report/joyinvalid.js}"
            type="text/javascript"></script>
        <script data-th-src="@{/js/report/report-common.js}"
            type="text/javascript"></script>
        <script data-th-src="@{/js/report/moment-with-locales.min.js}"
            type="text/javascript"></script>
        <script data-th-src="@{/js/report/echarts.min.js}"
            type="text/javascript"></script>
        <script
            data-th-src="@{/js/report/chb/datacheck/totalcheck/TotalCheck001.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
