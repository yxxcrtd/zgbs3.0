<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/default}">
<head>
	<meta charset="utf-8">
	<title data-th-text="#{AssetInfoDetail001}">资产基本信息</title>
	<link rel="stylesheet" type="text/css"
		  data-th-href="@{/css/report/report.css}">
	<style>
		.input-checkbox .layui-form-checkbox {
			margin-top: 0;
			height: 28px;
		}
	</style>
</head>

<body>
<div layout:fragment="content">
	<div class="form-button-area" filter="false">
		<a id="AssetInfoDetail001_btn_add" class="layui-btn layui-btn-sm btn-create">新建</a>
		<a id="AssetInfoDetail001_btn_import" class="layui-btn layui-btn-sm btn-default btn-import">导入</a>
	</div>


	<div class="joyin-form-wrap condition-area">
		<form class="layui-form" id="searchForm">
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">资产代码</label>
					<div class="layui-input-inline input-inline">
						<select id="assetCode" class="input-select"
								data-th-data-url='@{/chb/assetinfodetail/AssetInfoDetail001/getAssetCode}'
								initvalue="" placeholder="请选择"
								data-th-placeholder="#{SysCommon.selectplaceholder}"
								allowClear="true" multiple="multiple">
						</select>

					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">资产一级分类</label>
					<div class="layui-input-inline input-inline">
						<select id="orgAssetType1" class="layui-input form-input input-select"
								data-th-data-result='${SVR_ORG_ASSET_TYPE1}' placeholder="请选择"
								data-th-initvalue="${orgAssetType1}"
								data-th-placeholder="#{SysCommon.selectplaceholder}"
								allowClear="true" multiple="true">
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable" >资产二级分类</label>
					<div class="layui-input-inline input-inline">
						<select id="orgAssetType2" class="layui-input form-input input-select"
								data-th-data-result='${SVR_ORG_ASSET_TYPE2}' placeholder="请选择"
								data-th-initvalue="${orgAssetType2}"
								data-th-placeholder="#{SysCommon.selectplaceholder}"
								allowClear="true" multiple="true">
						</select>
					</div>
				</div>


			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">资产/负债类别</label>
					<div class="layui-input-inline input-inline">
						<select id="assetType" class="layui-input form-input input-select"
								data-th-data-result='${SVR_ASSETDEBT_TYPE}' placeholder="请选择"
								data-th-initvalue="${assetType}"
								data-th-placeholder="#{SysCommon.selectplaceholder}"
								allowClear="true" multiple="true">
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">资产/负债二级类别</label>
					<div class="layui-input-inline input-inline">
						<select id="assetType2" class="layui-input form-input input-select"
								data-th-data-result='${SVR_ASSET_TYPE_SECOND_LEVEL}' placeholder="请选择"
								data-th-initvalue="${assetType2}"
								data-th-placeholder="#{SysCommon.selectplaceholder}"
								allowClear="true" multiple="true">
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">报送信息维护状态</label>
					<div class="layui-input-inline input-inline">
							<select id="dataStatus" class="layui-input form-input input-select"
									data-th-data-result='${DATA_STATUS}' placeholder="请选择"
									data-th-initvalue="${dataStatus}"
									data-th-placeholder="#{SysCommon.selectplaceholder}"
									allowClear="true">
							</select>
					</div>
				</div>
			</div>
		</form>
	</div>
	<table class="layui-table"
		   id="dataTable"></table>
</div>
<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">

	</script>
	<script data-th-src="@{/js/report/jquery.validate.js}"
			type="text/javascript"></script>
	<script data-th-src="@{/js/report/joyinvalid.js}"
			type="text/javascript"></script>
	<script data-th-src="@{/js/report/report-common.js}"
			type="text/javascript"></script>
	<script
			data-th-src="@{/js/report/chb/assetinfodetail/AssetInfoDetail001.js}"
			type="text/javascript"></script>
</div>
</body>
</html>
