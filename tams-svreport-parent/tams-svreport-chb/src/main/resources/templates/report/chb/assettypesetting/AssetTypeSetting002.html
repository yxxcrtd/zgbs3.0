<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>资产/负债类别配置</title>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm" style="margin-bottom: 20px;">
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i
                            class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item pro-item-wrap">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable">资产一级分类</label>
                                <div class="layui-input-inline input-inline">
                                    <select type="text" id="assetType1" name="assetType1" required="required"
                                            class="layui-input form-input input-select" placeholder="请选择" maxlength="75"
                                            data-th-data-result='${SVR_ORG_ASSET_TYPE1}' childrenIds="assetType2"
                                            data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-initValue='${entity?.assetType1}'>
                                    </select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable">资产二级分类</label>
                                <div class="layui-input-inline input-inline">
                                    <select type="text" id="assetType2" name="assetType2" required="required"
                                            class="layui-input form-input input-select" placeholder="请选择" maxlength="75"
                                            data-th-data-result='${SVR_ORG_ASSET_TYPE2}' parentIds="assetType1"
                                            data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-initValue='${entity?.assetType2}'>
                                    </select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable">资产三级分类</label>
                                <div class="layui-input-inline input-inline">
                                    <select type="text" id="assetType3" name="assetType3"
                                            class="layui-input form-input input-select" placeholder="请选择" maxlength="75"
                                            data-th-data-result='${SVR_ORG_ASSET_TYPE3}'
                                            data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-initValue='${entity?.assetType3}'>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
<!--                            <div class="form-inline-wrap">-->
<!--                                <label class="layui-form-label form-lable">业务分类</label>-->
<!--                                <div class="layui-input-inline input-inline">-->
<!--                                    <select type="text" id="assetBusiType" name="assetBusiType" required="required"-->
<!--                                            class="layui-input form-input input-select" placeholder="请选择" maxlength="75"-->
<!--                                            data-th-data-result='${SVR_ORG_ASSET_TYPE4}'-->
<!--                                            data-th-placeholder="#{SysCommon.placeholder}"-->
<!--                                            data-th-initValue='${entity?.assetBusiType}'>-->
<!--                                    </select>-->
<!--                                </div>-->
<!--                            </div>-->
                            <div class="form-inline-wrap" style="display: none">
                                <label class="layui-form-label form-lable">主键</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="typeuuid" name="typeuuid"
                                            class="layui-input form-input" placeholder="请选择" maxlength="75"
                                            data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-value='${entity?.typeuuid}'/>
                                </div>
                            </div>
                        </div>
                        <div class='table-wrap'>
                            <table class="layui-table" id="dataTable"></table>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        <div class="row text-center" style="height: 30px">
            <a id="AssetTypeSetting002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
            <a id="AssetTypeSetting002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var SVR_ASSETDEBT_TYPE = /*[[${SVR_ASSETDEBT_TYPE}]]*/'';
        var SVR_ASSET_TYPE_SECOND_LEVEL = /*[[${SVR_ASSET_TYPE_SECOND_LEVEL}]]*/'';
    </script>
    <script data-th-src="@{/js/report/chb/assettypesetting/AssetTypeSetting002.js}" type="text/javascript"></script>
</div>
</body>
</html>
