<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">

<head>
    <title>资产/负债类别配置</title>
</head>

<body>
<div layout:fragment="content">
    <!-- 按钮区域 -->
    <div class="form-button-area">
        <a id="AssetTypeSetting001_btn_reset" class="layui-btn layui-btn-sm btn-reset" data-th-text="#{SysCommon.reset}">重置</a>
        <a id="AssetTypeSetting001_btn_delete" class="layui-btn layui-btn-sm btn-delete"><span>删除</span></a>
        <a id="AssetTypeSetting001_btn_create" class="layui-btn layui-btn-sm btn-create">新建</a>
    </div>
    <!-- 查询条件 -->
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <!-- 第一行 -->
            <div class="layui-form-item">
                <div class="ayui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">资产一级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select id="assetType1" name="assetType1" style="width: 120px"
                                class="input-select" childrenIds="assetType2"
                                data-th-data-result='${SVR_ORG_ASSET_TYPE1}'
                                placeholder="请选择" data-th-value="${entity?.assetType1}"
                                data-th-placeholder="#{SysCommon.selectplaceholder}"
                                allowClear="true">
                        </select>
                    </div>
                </div>
                <div class="ayui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">资产二级分类</label>
                    <div class="layui-input-inline input-inline" id="assetTypeInput">
                        <select id="assetType2" name="assetType2" style="width: 120px"
                                class="input-select" parentIds="assetType1"
                                data-th-data-result='${SVR_ORG_ASSET_TYPE2}'
                                placeholder="请选择" data-th-value="${entity?.assetType2}"
                                data-th-placeholder="#{SysCommon.selectplaceholder}"
                                allowClear="true">
                        </select>
                    </div>
                </div>
                <div class="ayui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">资产三级分类</label>
                    <div class="layui-input-inline input-inline" id="assetTypeThree">
                        <select id="assetType3" name="assetType3"
                                class="input-select"
                                data-th-data-result='${SVR_ORG_ASSET_TYPE3}'
                                placeholder="请选择" data-th-value="${entity?.assetType3}"
                                data-th-placeholder="#{SysCommon.selectplaceholder}"
                                allowClear="true">
                        </select>
                    </div>
                </div>
            </div>
            <!-- 第二行 -->
<!--            <div class="layui-form-item">-->
<!--                <div class="ayui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">-->
<!--                    <label class="layui-form-label form-lable">业务分类</label>-->
<!--                    <div class="layui-input-inline input-inline" id="assetTypeThr">-->
<!--                        <select id="assetBusiType" name="assetBusiType" style="width: 120px"-->
<!--                                class="input-select"-->
<!--                                data-th-data-result='${SVR_ORG_ASSET_TYPE4}'-->
<!--                                placeholder="请选择" data-th-value="${entity?.assetBusiType}"-->
<!--                                data-th-placeholder="#{SysCommon.selectplaceholder}"-->
<!--                                allowClear="true">-->
<!--                        </select>-->
<!--                    </div>-->
<!--                </div>-->
<!--            </div>-->
        </form>
    </div>
    <div>
        <div class="layui-inline layui-col-md12 layui-col-sm12 layui-col-lg12">
            <!-- 投管 -->
            <div class="layui-inline layui-col-md5 layui-col-sm5 layui-col-lg5" style="float: left">
                <table class="layui-table" id="dataTable1"></table>
            </div>
            <!-- 中债 -->
            <div class="layui-inline layui-col-md6 layui-col-sm6 layui-col-lg6" style="float: right">
                <table class="layui-table" id="dataTable2"></table>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript"></script>
    <script data-th-src="@{/js/report/chb/assettypesetting/AssetTypeSetting001.js}" type="text/javascript"></script>
</div>
</body>

</html>
