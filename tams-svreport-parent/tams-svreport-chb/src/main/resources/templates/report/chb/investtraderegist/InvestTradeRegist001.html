<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">

<head>
<title data-th-text="#{InvestTradeRegist001}">资产交易信息登记</title>
</head>

<body>
	<div layout:fragment="content">
		<div class="form-button-area" export="false">
            <a id="InvestTradeRegist001_btn_checkData" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-datacheck"></i>数据检查</a>
			<a id="InvestTradeRegist001_btn_manual"
				class="layui-btn layui-btn-sm btn-default"><i
				class="iconfont icon-hand"></i>手工处理</a> <a
				id="InvestTradeRegist001_btn_cancelManual"
				class="layui-btn layui-btn-sm btn-default">取消手工处理</a> <a
				id="InvestTradeRegist001_btn_chbexport"
				class="layui-btn layui-btn-sm btn-export btn-default">导出中债Excel</a>
            <a id="InvestTradeRegist001_btn_exportDel" class="layui-btn layui-btn-sm btn-export btn-default">导出删除Excel</a>
            <a id="InvestTradeRegist001_btn_submit" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-sent"></i>报送</a>
            <a id="InvestTradeRegist001_btn_reSubmit" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-sent"></i>重新报送</a>
		</div>
		<div class="joyin-form-wrap joyin-filter-form condition-area" line="2">
			<form class="layui-form" id="searchForm">
				<div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">产品</label>
                        <div class="layui-input-inline input-inline">
                            <select id="prodName" name="prodName"
                                data-th-data-url='@{/svreport/system/proregistcodemanage/ProRegistCodeManage001/getProdID}'
                                data-th-data-formatoption=true data-th-data-parentids="orgCode"
                                class="input-select" placeholder="请选择"
                                data-th-placeholder="#{SysCommon.selectplaceholder}"
                                allowClear="true" multiple="multiple">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">产品登记编码</label>
                        <div class="layui-input-inline input-inline">
                            <select id="prodRegCode" name="prodRegCode"
                                data-th-data-url='@{/svreport/system/proregistcodemanage/ProRegistCodeManage001/getRegCode}'
                                data-th-data-formatoption=true data-th-data-parentids="orgCode"
                                class="input-select" placeholder="请选择"
                                data-th-placeholder="#{SysCommon.selectplaceholder}"
                                allowClear="true" multiple="multiple">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">行内交易编码</label>
                        <div class="layui-input-inline input-inline">
                            <select id="tradeCode" name="tradeCode" class="input-select"
                                allowClear="true" multiple="multiple" placeholder="请选择" formatOption="false"
                                data-th-data-url='@{/chb/investtraderegist/InvestTradeRegist001/getTradeNo}'
                                data-th-placeholder="#{SysCommon.selectplaceholder}" data-th-data-result='${TRADE_NO}'></select>
                        </div>
                    </div>
				</div>
				<div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <input id="assetCode" name="assetCode" class="layui-input form-input input-lenovoselect"
                                allowClear="true" data-rules="code;maxlength:30" autocomplete="off"
                                data-th-data-formatoption=true placeholder="请输入"
                                data-th-placeholder="#{SysCommon.selectplaceholder}"></input>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">交易日</label>
                        <div class="layui-input-inline input-inline">
                            <input id="dealdate" type="text" name="dealtimeControl"
                                class="layui-input form-input timeControl input-dateRangeSelect"
                                placeholder="请选择日期区间" />
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">报送状态</label>
                        <div class="layui-input-inline input-inline">
                            <select id="submitStatus" name="submitStatus"
                                class="layui-input form-input input-select"
                                data-th-data-result='${SUBMIT_STATUS}'
                                data-th-initvalue="${submitStatus}" placeholder="请选择"
                                data-th-placeholder="#{SysCommon.selectplaceholder}"
                                allowClear="true" multiple="multiple">
                            </select>
                        </div>
                    </div>
                </div>
				<div class="layui-form-item">
                     <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">报送日期</label>
                        <div class="layui-input-inline input-inline">
                            <input id="submitDate" type="text" name="timeControl"
                                class="layui-input form-input timeControl input-dateRangeSelect"
                                placeholder="请选择日期区间"/>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">报送截止日</label>
                        <div class="layui-input-inline input-inline">
                            <input id="submitDeadLine" type="text"  name="timeControl"  class="layui-input form-input timeControl input-dateRangeSelect" 
                            placeholder="请选择日期区间" />
                        </div>
                    </div>
                     <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">反馈状态</label>
                        <div class="layui-input-inline input-inline">
                            <select id="submitFeedbackStatus" class="input-select"
                                data-th-data-result='${SUBMIT_FEEDBACK_STATUS}' data-th-initvalue="${submitFeedbackStatus}"
                                placeholder="请选择"
                                data-th-placeholder="#{SysCommon.selectplaceholder}"
                                allowClear="true" multiple="multiple">
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">数据日期</label>
                        <div class="layui-input-inline input-inline">
                            <input id="dataDate" type="text" name="datatimeControl"
                                class="layui-input form-input timeControl input-dateRangeSelect"
                                placeholder="请选择日期区间" />
                        </div>
                    </div>
                     <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">数据状态</label>
                        <div class="layui-input-inline input-inline">
                            <select id="status" class="input-select"
                                data-th-data-result='${SUBMITTED_STATUS}' placeholder="请选择"
                                data-th-placeholder="#{SysCommon.selectplaceholder}"
                                data-th-initvalue="${status}" allowClear="true" multiple="multiple">
                            </select>
                        </div>
                    </div>
                   
                </div>
				<!-- <div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">资产已登记</label>
						<div class="layui-input-inline input-inline">
							<select id="assetRegist" name="assetRegist" class="input-select"
								allowClear="true" multiple="multiple"
								data-th-data-result='${YES_NO}' data-th-formatoption="false"
								placeholder="请选择"
								data-th-placeholder="#{SysCommon.selectplaceholder}"></select>
						</div>
					</div>
				</div> -->
			</form>
		</div>
		<table class="layui-table" id="dataTable"></table>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
        	var isMain=/*[[${isMain}]]*/'';
        	var searchDataStart=/*[[${searchDataStart}]]*/'';
        	var searchDataEnd=/*[[${searchDataEnd}]]*/'';
            var statusT=/*[[${statusT}]]*/'';
            var sendStatusT=/*[[${sendStatusT}]]*/'';
        	var validKey=/*[[${validKey}]]*/'';
        	var submitFeedbackStatus=/*[[${submitFeedbackStatus}]]*/'';
            var SVR_REPORT_CODE=/*[[${SVR_REPORT_CODE}]]*/'';
            var FILE_HANDLE_STATUS=/*[[${FILE_HANDLE_STATUS}]]*/'';
            var dataTitle = '<h4 class="modal-title" id="myModalLabel">资产交易登记数据检查 </h4>';
            var checkUrl = '/chb/submitmanagement/investtraderegist/InvestTradeRegist001/reportCheck';
        </script>
		<script
			data-th-src="@{/js/report/chb/investtraderegist/InvestTradeRegist001.js}"
			type="text/javascript"></script>
        <script data-th-src="@{/js/report/chb/datacheck/totalcheck/ChbCommonCheck.js}" type="text/javascript"></script>
		<script data-th-src="@{/js/report/report-common.js}"
			type="text/javascript"></script>
	</div>
</body>

</html>
