<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{ChbMonthReportDetailAssetB001}">银行月度报表</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="form-button-area" export="true">
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
            	<div class="layui-form-item"> 
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">统计年月</label>
                        <div class="layui-input-inline input-inline">
                            <input id="enddate" type="text"  name="timeControl"  class="layui-input form-input input-dateSelect"
                                   placeholder="请选择年月" data-th-value='${defDate}' />
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">产品代码</label>
                        <div class="layui-input-inline input-inline">
                            <select id="prodId" class="input-select"
                                    data-th-data-url='@{/svreport/system/proregistcodemanage/ProRegistCodeManage001/getProdID}'
                                    initvalue="" placeholder="请选择"
                                    data-th-placeholder="#{SysCommon.selectplaceholder}"
                                    allowClear="true" multiple="multiple">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">资产代码/科目号</label>
                        <div class="layui-input-inline input-inline">
                            <select id="assetCode" class="input-select"
                                    data-th-data-url='@{/chb/monthreportdetail/ChbMonthReportDetailAsset001/getAssetCode}'
                                    initvalue="" placeholder="请选择"
                                    data-th-placeholder="#{SysCommon.selectplaceholder}"
                                    allowClear="true" multiple="multiple">
                            </select>
                        </div>
                    </div>
                </div>

            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">

        </script>
        <script data-th-src="@{/js/report/chb/monthreportdetail/ChbMonthReportDetailAssetB001.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
    </div>
</body>

</html>
