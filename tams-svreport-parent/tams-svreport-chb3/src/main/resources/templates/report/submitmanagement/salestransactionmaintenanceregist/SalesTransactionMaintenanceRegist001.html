<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title>销售结算资金交易登记</title>
</head>
<body>
<div layout:fragment="content">
  <div class="form-button-area" export="false">
<!--    <a id="SalesTransactionMaintenanceRegist001_btn_checkData" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-datacheck"></i>数据检查</a>-->
<!--    <a id="SalesTransactionMaintenanceRegist001_btn_submit" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-sent"></i>报送</a>-->
<!--    <a id="SalesTransactionMaintenanceRegist001_btn_submitAgain" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-sent"></i>重新报送</a>-->
    <a id="SalesTransactionMaintenanceRegist001_btn_manual" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-hand"></i>手工处理</a>
    <a id="SalesTransactionMaintenanceRegist001_btn_canManual" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-hand"></i>取消手工处理</a>
<!--    <a id="SalesTransactionMaintenanceRegist001_btn_export" class="layui-btn layui-btn-sm btn-export btn-default">导出查询结果</a>-->
    <a id="SalesTransactionMaintenanceRegist001_btn_chbexport" class="layui-btn layui-btn-sm btn-export btn-default">导出中债Excel</a>
<!--     <a id="SvrSalesTransactionMaintenanceRegist001_btn_exportDel" class="layui-btn layui-btn-sm btn-export btn-default">导出删除Excel</a>-->
  </div>
  <div class="joyin-form-wrap joyin-filter-form condition-area">
  <form class="layui-form" id="searchForm">
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable">报送截止日</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="submitDeadline" name="submitDeadline" placeholder="请选择、支持区间"
                 class="layui-input form-input input-dateRangeSelect"
                 data-th-placeholder="#{SysCommon.placeholder}">
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable">报送状态</label>
        <div class="layui-input-inline input-inline">
          <select id="sendStatus" name="sendStatus" class="layui-input form-input input-select" data-th-data-result='${SUBMIT_STATUS}' data-th-initvalue="${submitStatus}" placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true">
          </select>
        </div>
      </div>
      
       <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable">数据状态</label>
        <div class="layui-input-inline input-inline">
          <select id="dataStatus" name="dataStatus" class="layui-input form-input input-select" data-th-data-result='${SUBMITTED_STATUS}' data-th-initvalue="${status}" placeholder="请选择"  data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true">
          </select>
        </div>
      </div>
    </div>
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable">数据日期</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="statusDate" name="statusDate" placeholder="请选择、支持区间"
                 class="layui-input form-input input-dateRangeSelect"
                 data-th-placeholder="#{SysCommon.placeholder}">
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable">报送日期</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="submitTime" name="submitTime" placeholder="请选择、支持区间"
                 class="layui-input form-input input-dateRangeSelect"
                 data-th-placeholder="#{SysCommon.placeholder}">
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable">反馈状态</label>
        <div class="layui-input-inline input-inline">
          <select id="submitFeedbackStatus" name="submitFeedbackStatus" class="layui-input form-input input-select" data-th-data-result='${SUBMIT_FEEDBACK_STATUS}' data-th-initvalue="${submitFeedbackStatus}" placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true">
          </select>
        </div>
      </div>
    </div>
  </form>
  </div>
  <div>
    <table class="layui-table" id="SalesTransactionMaintenanceRegist">
    </table>
  </div>
</div>
<div layout:fragment="script"> 
  <script data-th-inline="javascript" type="text/javascript">
	var isMain=/*[[${isMain}]]*/'';
	var searchDataStart=/*[[${searchDataStart}]]*/'';
	var searchDataEnd=/*[[${searchDataEnd}]]*/'';
	var submitStatus=/*[[${submitStatus}]]*/'';
	var submitFeedbackStatus=/*[[${submitFeedbackStatus}]]*/'';
	var indentifyMark=/*[[${indentifyMark}]]*/'';
	var newPageTitle = '<h4 class="modal-title" id="myModalLabel">请输入删除原因</h4>';
	var dataTitle = '<h4 class="modal-title" id="myModalLabel">销售结算资金交易数据检查 </h4>';
	var pageUrl = '/submitmanagement/SalesTransactionMaintenanceRegist/SalesTransactionMaintenanceRegist002/init';
	var checkUrl = '/submitmanagement/SalesTransactionMaintenanceRegist/SalesTransactionMaintenanceRegist001/reportCheck';
	var CHB_REGIST_013 = '<spring:message code="CHB_REGIST_013" />';
	var institutionCode=/*[[${institutionCode}]]*/'';
	var prdRegistCode=/*[[${prdRegistCode}]]*/'';
	var tradeNo=/*[[${tradeNo}]]*/'';
	var accountNo=/*[[${accountNo}]]*/'';
  </script> 
  <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script> 
  <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script> 
  <script data-th-src="@{/js/report/submitManagement/salestransactionmaintenanceregist/SalesTransactionMaintenanceRegist001.js}" type="text/javascript"></script>
</div>
</body>
</html>
