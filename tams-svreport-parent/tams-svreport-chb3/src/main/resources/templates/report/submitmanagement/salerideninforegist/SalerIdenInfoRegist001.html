<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>销售人员身份信息登记</title>
    <style>
        .height30{
            height:30px;
            padding-top:0px;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area" export="false">
        <a id="SalerIdenInfoRegist001_btn_manual" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-hand"></i>手工处理</a>
        <a id="SalerIdenInfoRegist001_btn_canManual" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-hand"></i>取消手工处理</a>
        <a id="SalerIdenInfoRegist001_btn_chbexport" class="layui-btn layui-btn-sm btn-export btn-default">导出中债Excel</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">报送日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="submitTime" name="submitTime" placeholder="请选择、支持区间"
                               class="layui-input form-input input-dateRangeSelect"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">报送状态</label>
                    <div class="layui-input-inline input-inline">
                        <select id="sendStatus" name="sendStatus" class="layui-input form-input input-select" data-th-data-result='${SUBMIT_STATUS}' data-th-initvalue="${submitStatus}" placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">报送截止日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="submitDeadline" name="submitDeadline" placeholder="请选择、支持区间"
                               class="layui-input form-input input-dateRangeSelect"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">数据日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="dataDate" name="dataDate" placeholder="请选择、支持区间"
                               class="layui-input form-input input-dateRangeSelect"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">反馈状态</label>
                    <div class="layui-input-inline input-inline">
                        <select id="submitFeedbackStatus" name="submitFeedbackStatus" class="layui-input form-input input-select" data-th-data-result='${SUBMIT_FEEDBACK_STATUS}' data-th-initvalue="${submitFeedbackStatus}" placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">姓名</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="salerName" name="salerName"
                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-data-url="@{/report/submitmanagement/salerideninforegist/SalerIdenInfoRegist001/getSalerName}"
                               data-idfield="code" data-parentIds="salerName" data-effectiveFields="code"
                               data-th-data-effectivefieldsalias='|{"code":"姓名"}|'
                        />
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">性别</label>
                    <div class="layui-input-inline input-inline">
                        <select id="salerSex" name="salerSex" class="layui-input form-input input-select" data-th-data-result='${SVR_SEX}' data-th-initvalue="${salerSex}" placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">证件类型</label>
                    <div class="layui-input-inline input-inline">
                        <select id="salerCredentType" name="salerCredentType"
                                class="layui-input form-input input-select"
                                data-th-data-result='${SALER_CREDENT_TYPE}' data-th-initvalue="${salerCredentType}" multiple = "true"
                                placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true">
                        </select>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
	var isMain=/*[[${isMain}]]*/'';
	var searchDataStart=/*[[${searchDataStart}]]*/'';
	var searchDataEnd=/*[[${searchDataEnd}]]*/'';
	var submitStatus=/*[[${submitStatus}]]*/'';
	var submitFeedbackStatus=/*[[${submitFeedbackStatus}]]*/'';
	var agentInstitutionCode=/*[[${agentInstitutionCode}]]*/'';
	var prodRegistCode=/*[[${prodRegistCode}]]*/'';
	var salerName=/*[[${salerName}]]*/'';
  </script>
    <script data-th-src="@{/js/report/submitManagement/salerideninforegist/SalerIdenInfoRegist001.js}" type="text/javascript"></script>
</div>
</body>
</html>
