<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title>理财销售人员信息登记</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="layui-tab" style="margin-bottom: 0px;">
		  <ul class="layui-tab-title">
			  <li class="layui-this" id="li01">&nbsp;
				  <span data-th-text="总部或分支机构信息">总部或分支机构信息登记</span>
			  </li>
			  <li id="li02">&nbsp;
				  <span data-th-text="销售人员身份信息">销售人员身份信息登记</span>
			  </li>
			  <li id="li03">&nbsp;
				  <span data-th-text="销售人员奖惩投诉记录信息">销售人员奖惩投诉记录信息登记</span>
			  </li>
		  </ul>
		  <div class="layui-tab-content">
		    <!--  总部或分支机构信息登记 -->
		    <div class="layui-tab-item  layui-show" id="tab01">
                <iframe id="ifram1" th:src="@{/report/submitmanagement/salerinstinforegist/SalerInstInfoRegist001/init(submitStatus=${submitStatus},
                status=${status},submitFeedbackStatus=${submitFeedbackStatus},searchDataStart=${searchDataStart},searchDataEnd=${searchDataEnd})}" width="100%"
                        height="100%" frameborder="0" style="border:none;min-height:550px;"></iframe>
            </div>
		    <!--  销售人员身份信息登记-->
		    <div  class="layui-tab-item " id="tab02">
			  <iframe th:src="@{/report/submitmanagement/salerideninforegist/SalerIdenInfoRegist001/init(submitStatus=${submitStatus},
                status=${status},submitFeedbackStatus=${submitFeedbackStatus},searchDataStart=${searchDataStart},searchDataEnd=${searchDataEnd})}" width="100%"
					  height="100%" frameborder="0" style="border:none;min-height:550px;"></iframe>
		    </div>
			  <!--  销售人员奖惩投诉记录信息登记-->
			<div  class="layui-tab-item " id="tab03">
			   <iframe th:src="@{/report/submitmanagement/salerrewpenainforegist/SalerRewPenaInfoRegist001/init(submitStatus=${submitStatus},
                status=${status},submitFeedbackStatus=${submitFeedbackStatus},searchDataStart=${searchDataStart},searchDataEnd=${searchDataEnd})}" width="100%"
					   height="100%" frameborder="0" style="border:none;min-height:550px;"></iframe>
			</div>
		  </div>
		</div>
    </div>
    <div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var pageType = /*[[${pageType}]]*/;
			if (pageType=='1') {
				$("#li01").addClass("layui-this");
				$("#li02").removeClass("layui-this");
				$("#li03").removeClass("layui-this");
				$("#tab01").addClass("layui-show");
				$("#tab02").removeClass("layui-show");
				$("#tab03").removeClass("layui-show");
			}
			if (pageType=='2') {
				$("#li02").addClass("layui-this");
				$("#li01").removeClass("layui-this");
				$("#li03").removeClass("layui-this");
				$("#tab02").addClass("layui-show");
				$("#tab01").removeClass("layui-show");
				$("#tab03").removeClass("layui-show");
			}
			if (pageType=='3') {
				$("#li03").addClass("layui-this");
				$("#li02").removeClass("layui-this");
				$("#li01").removeClass("layui-this");
				$("#tab03").addClass("layui-show");
				$("#tab02").removeClass("layui-show");
				$("#tab01").removeClass("layui-show");
			}
		</script>
    </div>
</body>
</html>
