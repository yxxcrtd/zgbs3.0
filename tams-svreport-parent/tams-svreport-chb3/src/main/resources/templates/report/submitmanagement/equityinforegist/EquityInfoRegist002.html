<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{EquityBusiInfo002}">投资者身份信息登记</title>
<link rel="stylesheet" type="text/css" data-th-href="@{/css/report/report.css}">
</head>
<body>
<div layout:fragment="content">
<form class="delet-wrap" role="form" id="dataForm">
  <div class="clearfix form-group">
    <div class="input-group input-group-sm form-input" style="width: 100%;">
      <textarea id="remark" name="remark" class="form-control" maxlength="50" style="height: 100px;" placeholder="请输入原因，限50字"></textarea>
      <input id="deleteKeys" name="deleteKeys" value="${entity }" type="hidden" class="form-control" placeholder="请输入真实姓名">
    </div>
    <label class="delet-des">
      <input type="checkbox"/>
      更新导出数据的报送状态为手工报送</label>
  </div>
</form>
<div class="modal-footer alert-footer">
  <button id="EquityInfoRegist002_submit" type="button" class="btn btn-common btn-submit" id="SystemUser002_BTN_submit">
  提交
  </button>
  <button id="EquityInfoRegist002_cancel" type="button" class="btn btn-common btn-cancel text-cancel" data-dismiss="modal">取消 </button>
</div>
<div layout:fragment="script"> 
  <script data-th-inline="javascript" type="text/javascript">
    var isFromMain="${isFromMain}";
  </script> 
  <script data-th-src="@{/js/report/js/submitManagement/equityInfoRegist002.js}" type="text/javascript"></script> 
</div>
</body>
</html>
