<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>委托销售产品编码信息登记</title>
    <style>
        .height30{
            height:30px;
            padding-top:0px;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area" export="false">
        <a id="AgentPrdInfoRegist001_btn_manual" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-hand"></i>手工处理</a>
        <a id="AgentPrdInfoRegist001_btn_canManual" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-hand"></i>取消手工处理</a>
        <a id="AgentPrdInfoRegist001_btn_chbexport" class="layui-btn layui-btn-sm btn-export btn-default">导出中债Excel</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">报送截止日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="submitDeadline" name="submitDeadline" placeholder="请选择、支持区间"
                               class="layui-input form-input input-dateRangeSelect"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">报送状态</label>
                    <div class="layui-input-inline input-inline">
                        <select id="sendStatus" name="sendStatus" class="layui-input form-input input-select" data-th-data-result='${SUBMIT_STATUS}' data-th-initvalue="${submitStatus}" placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true">
                        </select>
                    </div>
                </div>

                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">数据状态</label>
                    <div class="layui-input-inline input-inline">
                        <select id="status" name="status" class="layui-input form-input input-select" data-th-data-result='${SUBMITTED_STATUS}' data-th-initvalue="${status}" placeholder="请选择"  data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">数据日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="dataDate" name="dataDate" placeholder="请选择、支持区间"
                               class="layui-input form-input input-dateRangeSelect"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">报送日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="submitTime" name="submitTime" placeholder="请选择、支持区间"
                               class="layui-input form-input input-dateRangeSelect"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">反馈状态</label>
                    <div class="layui-input-inline input-inline">
                        <select id="submitFeedbackStatus" name="submitFeedbackStatus" class="layui-input form-input input-select" data-th-data-result='${SUBMIT_FEEDBACK_STATUS}' data-th-initvalue="${submitFeedbackStatus}" placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">代理销售机构代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="agentInstitutionCode" name="agentInstitutionCode"
                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-data-url="@{/report/submitmanagement/agentprdinforegist/AgentPrdInfoRegist001/getAgentInstitutionCode}"
                               data-idfield="code" data-parentIds="agentInstitutionCode"
                               data-th-data-effectivefieldsalias='|{"code":"代理销售机构代码","shortName":"代理销售机构代码名称"}|'
                        />
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">产品代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="prodId" name="prodId"
                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-data-url="@{/report/submitmanagement/agentprdinforegist/AgentPrdInfoRegist001/getProdId}"
                               data-idfield="code" data-parentIds="prodId"
                               data-th-data-effectivefieldsalias='|{"code":"产品代码","shortName":"产品代码名称"}|'
                        />
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">产品登记编码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="prodRegistCode" name="prodRegistCode"
                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-data-url="@{/report/submitmanagement/agentprdinforegist/AgentPrdInfoRegist001/getProdRegistCode}"
                               data-idfield="code" data-effectivefields="code" data-parentIds="prodRegistCode"
                               data-th-data-effectivefieldsalias='|{"code":"产品登记编码"}|'
                        />
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
	var isMain=/*[[${isMain}]]*/'';
	var searchDataStart=/*[[${searchDataDateStart}]]*/'';
	var searchDataEnd=/*[[${searchDataDateEnd}]]*/'';
	var submitStatus=/*[[${submitStatus}]]*/'';
	var submitFeedbackStatus=/*[[${submitFeedbackStatus}]]*/'';
	var agentInstitutionCode=/*[[${agentInstitutionCode}]]*/'';
	var prodRegistCode=/*[[${prodRegistCode}]]*/'';
  </script>
    <script data-th-src="@{/js/report/submitManagement/agentprdinforegist/AgentPrdInfoRegist001.js}" type="text/javascript"></script>
</div>
</body>
</html>
