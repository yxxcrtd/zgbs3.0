<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title>代理销售信息登记</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="layui-tab" style="margin-bottom: 0px;">
		  <ul class="layui-tab-title">
			  <li class="layui-this" id="li01">&nbsp;
				  <span data-th-text="代理销售机构信息登记">代理销售机构信息登记</span>
			  </li>
			  <li id="li02">&nbsp;
				  <span data-th-text="委托销售产品编码信息登记">委托销售产品编码信息登记</span>
			  </li>
		  </ul>
		  <div class="layui-tab-content">
		    <!--  代理销售机构信息登记 -->
		    <div class="layui-tab-item  layui-show" id="tab01">
                <iframe th:src="@{/report/submitmanagement/agentinstitutionregist/AgentInstitutionRegist001/init(submitStatus=${submitStatus},
                status=${status},submitFeedbackStatus=${submitFeedbackStatus},searchDataDateStart=${searchDataStart},searchDataDateEnd=${searchDataEnd})}" width="100%"
                        height="100%" frameborder="0" style="border:none;min-height:550px;"></iframe>
            </div>
		    <!--  委托销售产品编码信息登记-->
		    <div  class="layui-tab-item " id="tab02">
			  <iframe th:src="@{/report/submitmanagement/agentprdinforegist/AgentPrdInfoRegist001/init(submitStatus=${submitStatus},
                status=${status},submitFeedbackStatus=${submitFeedbackStatus},searchDataDateStart=${searchDataStart},searchDataDateEnd=${searchDataEnd})}" width="100%"
					  height="100%" frameborder="0" style="border:none;min-height:550px;"></iframe>
		    </div>
		  </div>
		</div>
    </div>
    <div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var pageType = /*[[${pageType}]]*/;
			if (pageType=='1') {
				$("#li01").addClass("layui-this");
				$("#li02").removeClass("layui-this");
				$("#tab01").addClass("layui-show");
				$("#tab02").removeClass("layui-show");
			}
			if (pageType=='2') {
				$("#li02").addClass("layui-this");
				$("#li01").removeClass("layui-this");
				$("#tab02").addClass("layui-show");
				$("#tab01").removeClass("layui-show");
			}
		</script>
    </div>
</body>
</html>
