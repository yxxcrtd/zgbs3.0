<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{SvrInvestorMerger001}">识别标识合并</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="form-button-area" export="false">
        	<a id="SvrInvestorMerger001_btn_export" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-hand"></i>导出</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                	<div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">投资者名称</label>
                        <div class="layui-input-inline input-inline">
                            <input id="holderName" type="text"  name="holderName"  class="layui-input form-input input-lenovoselect" placeholder="请输入内容" />
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">个人证件类别</label>
						<div class="layui-input-inline input-inline">
							<select id="personalIdentifyType" class="input-select" data-th-data-result='${PERSONAL_IDENTIFY_TYPE}'
								placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true" multiple="multiple">
							</select>
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">机构证件类别</label>
						<div class="layui-input-inline input-inline">
							<select id="institutionIdentifyType" class="input-select" data-th-data-result='${INSTITUTION_IDENTIFY_TYPE}'
								placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true" multiple="multiple">
							</select>
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
				        <label class="layui-form-label form-lable">证件号码</label>
				        <div class="layui-input-inline input-inline">
				          <input id="identifyNumber" name="identifyNumber" type="text" class="layui-input form-input input-lenovoselect" maxlength="18" data-rules="code;maxlength:18" placeholder="请输入关键词" data-th-placeholder="#{SysCommon.placeholder}">
				        </div>
				    </div>
                    <div class="layui-inline layui-col-md4">
				        <label class="layui-form-label form-lable">合并状态</label>
				        <div class="layui-input-inline input-inline">
				          <select id="operateStatus" name="operateStatus" class="layui-input form-input input-select" data-th-data-result='${SVR_OPERATE_STATUS}' data-th-initvalue="${statusA}" placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true" multiple="multiple">
				          </select>
				        </div>
				    </div>
				    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">合并后识别标识</label>
                        <div class="layui-input-inline input-inline">
                            <input id="mergerIndentifyMark" type="text"  name="mergerIndentifyMark"  class="layui-input form-input input-lenovoselect" placeholder="请输入内容" />
                        </div>
                    </div>
				</div>
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">数据日期</label>
						<div class="layui-input-inline input-inline">
							<input id="dataTime" type="text" name="timeControl" class="layui-input form-input timeControl input-dateRangeSelect" placeholder="请选择日期区间" />
						</div>
					</div>
				</div>
			</form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
        	var isMain=/*[[${isMain}]]*/'';
        	var searchDataStart=/*[[${searchDataStart}]]*/'';
        	var searchDataEnd=/*[[${searchDataEnd}]]*/'';
        	var validKey=/*[[${validKey}]]*/'';
        </script>
		<script data-th-src="@{/js/report/investormerger/InvestorMerger001.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
    </div>
</body>
</html>
