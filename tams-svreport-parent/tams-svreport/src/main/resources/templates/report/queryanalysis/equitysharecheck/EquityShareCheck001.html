<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">

<head>
<title data-th-text="#{SvrEquityShareCheck001}">投资者份额检查</title>
</head>

<body>
	<div layout:fragment="content">
		<div class="form-button-area" filter="false"></div>
		<div class="joyin-form-wrap condition-area">
			<form class="layui-form" id="searchForm">
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">查询日期</label>
						<div class="layui-input-inline input-inline">
							<input id="date" type="text" name="date"
								class="layui-input form-input input-dateSelect"
								placeholder="请选择查询日期" />
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">产品</label>
						<div class="layui-input-inline input-inline">
							<select id="prdCode" name="prdCode"
								data-th-data-parentids="orgCode" data-th-data-code="prdCode"
								data-th-data-url='@{/svreport/queryanalysis/equitysharecheck/SvrEquityShareCheck001/getProd}'
								data-th-data-formatoption=true class="input-select"
								placeholder="请选择"
								data-th-placeholder="#{SysCommon.selectplaceholder}"
								allowClear="true" multiple="multiple">
							</select>
						</div>
					</div>
					<!-- 					<div class="layui-inline layui-col-md4"> -->
					<!-- 						<label class="layui-form-label form-lable">识别标识</label> -->
					<!-- 						<div class="layui-input-inline input-inline"> -->
					<!-- 							<select id="indentifyMark" name="indentifyMark" -->
					<!-- 								data-th-data-url='@{/svreport/queryanalysis/equitysharecheck/SvrEquityShareCheck001/getIndentifyMark}' -->
					<!-- 								data-th-data-formatoption=true data-th-data-parentids="orgCode" -->
					<!-- 								class="input-select" placeholder="请选择" -->
					<!-- 								data-th-placeholder="#{SysCommon.selectplaceholder}" -->
					<!-- 								allowClear="true" multiple="multiple"> -->
					<!-- 							</select> -->
					<!-- 						</div> -->
					<!-- 					</div> -->


					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">识别标识</label>
						<div class="layui-input-inline input-inline">
							<input id="indentifyMark" name="indentifyMark" type="text"
								class="layui-input form-input input-lenovoselect" maxlength="30"
								data-rules="code;maxlength:30" placeholder="请输入关键词"
								data-th-placeholder="#{SysCommon.placeholder}">
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">产品登记编码</label>
						<div class="layui-input-inline input-inline">
							<select id="prdRegistCode" name="prdRegistCode"
								data-th-data-url='@{/svreport/system/proregistcodemanage/ProRegistCodeManage001/getRegCode}'
								data-th-data-formatoption=true class="input-select"
								data-th-data-parentids="orgCode" placeholder="请选择"
								data-th-placeholder="#{SysCommon.selectplaceholder}"
								allowClear="true" multiple="multiple">
							</select>
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">检查结果</label>
						<div class="layui-input-inline input-inline">
							<input id="checkResult" searchable="false" name="checkResult" 
							class="input-select" allowClear="true" 
							data-th-data-result='${SVR_EQUDET_RESULT}' 
							data-th-initValue='${EQUDET_RESULT_NG}'/>
						</div>
					</div>
				</div>
			</form>
		</div>
		<div>
			<table class="layui-table" id="dataTable"></table>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var defaultDate = /*[[${defaultDate}]]*/'';
		</script>
		<script
			data-th-src="@{/js/report/queryanalysis/equitysharecheck/EquityShareCheck001.js}"
			type="text/javascript"></script>
	</div>
</body>

</html>
