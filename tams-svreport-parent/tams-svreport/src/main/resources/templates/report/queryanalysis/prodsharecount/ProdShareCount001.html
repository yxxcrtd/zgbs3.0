<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{ProdShareCount001}">产品份额统计</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="form-button-area" filter="false">
        </div>
        <div class="joyin-form-wrap condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">查询日</label>
                        <div class="layui-input-inline input-inline">
                            <input id="holdDate" type="text"  name="timeControl"  class="layui-input form-input timeControl input-dateRangeSelect" placeholder="请选择日期区间" />
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">产品登记编码</label>
                        <div class="layui-input-inline input-inline">
                           <select id="prdRegistCode" name="prdRegistCode" data-th-data-url='@{/svreport/system/proregistcodemanage/ProRegistCodeManage001/getRegCode}' data-th-data-formatoption=true data-th-data-parentids="orgCode" class="input-select" placeholder="请选择" data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true" multiple="multiple">
                            </select>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
            var nowSysDate=/*[[${nowSysDate}]]*/'';
        </script>
        <script data-th-src="@{/js/report/queryanalysis/prodsharecount/ProdShareCount001.js}" type="text/javascript"></script>
    </div>
</body>

</html>
