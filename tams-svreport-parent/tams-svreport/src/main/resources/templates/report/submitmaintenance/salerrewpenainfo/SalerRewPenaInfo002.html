<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>销售人员奖惩投诉记录信息信息新建</title>
    <style>
        .height30{
            height:30px;
            padding-top:0px;
        }

        .checkRed{
            font-weight: bolder;
            vertical-align: middle;
            display: inline-block;
            height: 22px;
            color: red;
            font-size: 20px !important;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
            <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
                <input hidden type="text" id="erroOrInfo" name ="erroOrInfo" data-th-value="${entity?.erroOrInfo}" style="display:none;">
                <input hidden type="text" id="salerRewPenaNo" name ="salerRewPenaNo" data-th-value="${entity?.salerRewPenaNo}" style="display:none;">
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">销售机构代码</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="salerInstCode" data-th-value='${entity?.salerInstCode}' name="salerInstCode"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-initValue="${entity?.salerInstCode}"
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">内部编号</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="salerInsNo" name="salerInsNo" class="input-select" formatoption = "false"
                                                    data-th-data-url="@{/report/submitmaintenance/salerrewpenainfo/SalerRewPenaInfo002/selectSalerInsNo}"
                                                    placeholder="请选择" th:initValue="*{entity?.salerInsNo}" allowClear="true" required></select>
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">姓名</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="salerName" data-th-value='${entity?.salerName}' name="salerName"
                                                   class="layui-input form-input" placeholder="请输入内容"
                                                   data-th-initValue="${entity?.salerName}"
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">记录分类</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="salerRewPenaTyep" name="salerRewPenaTyep"
                                                    class="layui-input form-input input-select"
                                                    required="required" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue='${entity?.salerRewPenaTyep}' data-th-data-result='${SALER_REW_PENA_TYEP}' >
                                            </select>
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">奖惩名称</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="salerRewPenaName" data-th-value='${entity?.salerRewPenaName}'
                                                   name="salerRewPenaName"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">奖惩说明</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="salerRewPenaComments" data-th-value='${entity?.salerRewPenaComments}'
                                                   name="salerRewPenaComments"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">奖惩单位</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="salerRewPenaInst" name="salerRewPenaInst"
                                                    class="layui-input form-input input-select"
                                                    required="required" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue='${entity?.salerRewPenaInst}' data-th-data-result='${SALER_REW_PENA_INST}' >
                                            </select>
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">奖惩单位具体名称</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="salerRewPenaInstName" data-th-value='${entity?.salerRewPenaInstName}'
                                                   name="salerRewPenaInstName"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">奖惩起始日期</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="salerRewPenaStart" name="salerRewPenaStart" data-th-required="true"
                                                   data-th-value='${#dates.format(entity?.salerRewPenaStart,"yyyy-MM-dd")}'
                                                   class="layui-input form-input input-dateSelect"
                                            >
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">奖惩结束日期</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="salerRewPenaEnd" name="salerRewPenaEnd" data-th-required="true"
                                                   data-th-value='${#dates.format(entity?.salerRewPenaEnd,"yyyy-MM-dd")}'
                                                   class="layui-input form-input input-dateSelect"
                                            >
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">投诉详情</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="salerComplainDetail" data-th-value='${entity?.salerComplainDetail}'
                                                   name="salerComplainDetail"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">投诉处理结果</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="salerComplainResult" data-th-value='${entity?.salerComplainResult}'
                                                   name="salerComplainResult"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md4">
                                         <label class="layui-form-label form-lable">投诉日期</label>
                                         <div class="layui-input-inline input-inline">
                                             <input type="text" id="salerComplainDate" name="salerComplainDate" data-th-required="true"
                                                    data-th-value='${#dates.format(entity?.salerComplainDate,"yyyy-MM-dd")}'
                                                    class="layui-input form-input input-dateSelect">
                                         </div>
                                    </div>
                                </div>
                    <div class="text-center">
                        <a id="SalerRewPenaInfo002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                           data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="SalerRewPenaInfo002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                           data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
            </form>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/report/submitmaintenance/salerrewpenainfo/SalerRewPenaInfo002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
