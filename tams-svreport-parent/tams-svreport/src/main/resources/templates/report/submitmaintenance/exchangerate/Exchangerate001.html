<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{Exchangerate001}">汇率行情维护</title>
<link rel="stylesheet" type="text/css" data-th-href="@{/css/report/report.css}">
</head>

<body>
<div layout:fragment="content">
  <div class="form-button-area" filter="false">
    <a id="Exchangerate001_btn_add" class="layui-btn layui-btn-sm btn-create">新建</a>
    <a id="Exchangerate001_btn_delete" class="layui-btn layui-btn-sm btn-delete btn-default" data-th-text="#{SysCommon.delete}">删除</a>
    <a id="Exchangerate001_btn_import" class="layui-btn layui-btn-sm btn-import btn-default">导入</a>
  </div>
  <div class="joyin-form-wrap condition-area">
      <form class="layui-form" id="searchForm">
        <div class="layui-form-item">
          <div class="layui-inline layui-col-md4">
            <label class="layui-form-label form-lable">公布日期</label>
            <div class="layui-input-inline input-inline">
              <input id="publishDate" name="timeControl" type="text" class="layui-input form-input input-dateRangeSelect" placeholder="请选择日期区间" />
            </div>
          </div>
          <div class="layui-inline layui-col-md4">
            <label class="layui-form-label form-lable">币种</label>
            <div class="layui-input-inline input-inline">
              <select id="ccyOriginal" class="input-select" allowClear="true" multiple="multiple" data-th-data-result='${CURRENCY_CHB}'></select>
            </div>
          </div>
          <div class="layui-inline layui-col-md4">
            <label class="layui-form-label form-lable">折算币种</label>
            <div class="layui-input-inline input-inline">
              <select id="ccyConvert" class="input-select" allowClear="true" multiple="multiple" data-th-data-result='${CURRENCY_CHB}'></select>
            </div>
          </div>
        </div>
      </form>
    </div>
   <table class="layui-table" id="exchangerate001"></table>
</div>
<div layout:fragment="script">
  <script data-th-inline="javascript" type="text/javascript">
    var isFromMain="${isFromMain}";
  </script>
  <script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/submitmaintenance/exchangerate/Exchangerate001.js}" type="text/javascript"></script> 
</div>
</body>
</html>
