<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{SvrMstCalendarType002}">日历类型管理新建</title>
	<style>
		.mst-lable{
			width: 20%;
		}
	</style>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap" id="submitForm">
			<div class="layui-form-item">
				<div >
					<label class="layui-form-label form-lable mst-lable"
						data-th-text="#{MstCalendarType002.calendarName}">交易日历名称</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="calendarName"
							name="calendarName" required="required"
							class="layui-input form-input" placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}" 
							data-th-value="${entity?.calendarName}"/>
					</div>
				</div>
				<div style="display:none" >
					<input type="text" id="tradeCalendarId"
						name="tradeCalendarId" required="required"
						class="layui-input form-input" placeholder="请输入内容"
						data-th-placeholder="#{SysCommon.placeholder}" 
						data-th-value="${entity?.tradeCalendarId}"/>
				</div>
			</div>
			<div class="layui-form-item">
				<div>
					<label class="layui-form-label form-lable mst-lable"
						data-th-text="#{MstCalendarType002.calendarTypeInclude}">包含市场日历类型</label>
					<div class="layui-input-inline input-inline">
						<select type="text" id="calendarType"
							name="calendarType" required="required"
							class="layui-input form-input input-select" multiple="true"
							data-th-data-url="@{/submitmaintenance/mstcalendartype/SvrMstCalendarType002/getCalendarTypeList}"
							allowClear="true"  placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-initValue="${entity?.calendarType}">
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div>
					<label class="layui-form-label form-lable mst-lable"
						data-th-text="#{MstCalendarType002.remark}">备注</label>
					<div class="layui-input-inline input-inline">
						<textarea id="remark" name="remark" placeholder="请输入内容"
							class="layui-textarea" data-th-text ="${entity?.remark}"></textarea>
					</div>
				</div>
			</div>
		</form>
		<div class="layui-col-md10" style="margin:30px 0;">
			<div class="text-center">
				<a id="SvrMstCalendarType002_btn_submit"
					class="layui-btn layui-btn-sm btn-submit"
					data-th-text="#{SysCommon.submit}">提交</a> <a
					id="SvrMstCalendarType002_btn_cancel"
					class="layui-btn layui-btn-sm btn-cancel"
					data-th-text="#{SysCommon.cancel}">取消</a>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
  <script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
  <!-- 先引用 -->
  <script data-th-src="@{/js/report/moment-with-locales.min.js}" type="text/javascript"></script>
  <!-- 再引用日期组件 -->
  <script data-th-src="@{/js/report/lunar.js}" type="text/javascript"></script> 
  <script data-th-src="@{/js/report/fullcalendar.js}" type="text/javascript"></script> 
  <script data-th-src="@{/js/report/zh-cn.js}" type="text/javascript"></script> 
	<script data-th-src="@{/js/report/submitmaintenance/mstcalendartype/SvrMstCalendarType002.js}"></script>
	</div>
</body>

</html>
