<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{SvrMstCalendarType001}">日历类型信息管理</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				<a id="SvrMstCalendarType001_btn_add"
					class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a> 
			    <a id="SvrMstCalendarType001_btn_delete"
					class="layui-btn layui-btn-sm btn-delete"
					data-th-text="#{SysCommon.delete}" style="display: none;">删除</a> 
				<a id="SvrMstCalendarType001_btn_holidays"
					class="layui-btn layui-btn-sm btn-holidays"><i class="iconfont icon-holiday"></i><span data-th-text="#{MstCalendarType001.holidays}">节假日查询</span></a>
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md6 layui-col-sm6 layui-col-lg6">
							<label class="layui-form-label form-lable"
								data-th-text="#{MstCalendarType001.calendarName}">交易日历名称</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="calendarName" name="calendarName" class="layui-input form-input input-lenovoselect" 
								placeholder="请输入内容"  data-th-data-url="@{/submitmaintenance/mstcalendartype/SvrMstCalendarType001/getCalendarNameList}"
                             data-idfield="name" data-keyfield="name" data-th-data-effectivefieldsalias='|{"code":"#{MstCalendarType001.tradeCalendarId}",
                             "shortName":"#{MstCalendarType001.calendarName}"}|' data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
						<div class="layui-inline layui-col-md6 layui-col-sm6 layui-col-lg6">
							<label class="layui-form-label form-lable"
								data-th-text="#{MstCalendarType001.calendarType}">市场日历类型</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="calendarType" name="calendarType"  class="layui-input form-input input-select" 
									 allowClear="true" multiple="true" placeholder="请输入内容"
									  data-th-data-url="@{/submitmaintenance/mstcalendartype/SvrMstCalendarType001/getCalendarType}" 
									data-th-placeholder="#{SysCommon.placeholder}">
									<option></option>
                                </select>
							</div>
						</div>
					</div>				
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
  <script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
  <!-- 先引用 -->
  <script data-th-src="@{/js/report/moment-with-locales.min.js}" type="text/javascript"></script>
  <!-- 再引用日期组件 -->
  <script data-th-src="@{/js/report/lunar.js}" type="text/javascript"></script> 
  <script data-th-src="@{/js/report/fullcalendar.js}" type="text/javascript"></script> 
  <script data-th-src="@{/js/report/zh-cn.js}" type="text/javascript"></script> 
	<script data-th-src="@{/js/report/submitmaintenance/mstcalendartype/SvrMstCalendarType001.js}"></script>
	</div>
</body>
</html>
