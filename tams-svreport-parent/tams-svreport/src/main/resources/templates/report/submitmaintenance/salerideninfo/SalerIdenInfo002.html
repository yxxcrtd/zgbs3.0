<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>销售人员身份信息新建</title>
    <style>
        .height30{
            height:30px;
            padding-top:0px;
        }

        .checkRed{
            font-weight: bolder;
            vertical-align: middle;
            display: inline-block;
            height: 22px;
            color: red;
            font-size: 20px !important;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
            <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
                <input hidden type="text" id="erroOrInfo" name ="erroOrInfo" data-th-value="${entity?.erroOrInfo}" style="display:none;">
                <input hidden type="text" id="workflowId" name ="workflowId" data-th-value="${entity?.workflowId}" style="display:none;">
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">销售机构代码</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="salerInstCode" data-th-value='${entity?.salerInstCode}' name="salerInstCode"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-initValue="${entity?.salerInstCode}"
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">姓名</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="salerName" data-th-value='${entity?.salerName}' name="salerName"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-initValue="${entity?.salerName}"
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">性别</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="salerSex" name="salerSex"
                                                    class="layui-input form-input input-select"
                                                    required="required" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue='${entity?.salerSex}' data-th-data-result='${SVR_SEX}' >
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">出生日期</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="salerBirthday" name="salerBirthday" data-th-required="true"
                                                   data-th-value='${#dates.format(entity?.salerBirthday,"yyyy-MM-dd")}'
                                                   class="layui-input form-input input-dateSelect"
                                            >
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">证件类别</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="salerCredentType" name="salerCredentType"
                                                    class="layui-input form-input input-select"
                                                    required="required" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue='${entity?.salerCredentType}' data-th-data-result='${SALER_CREDENT_TYPE}' >
                                            </select>
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">其他证件名称</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="salerOtherCredentName" data-th-value='${entity?.salerOtherCredentName}' name="salerOtherCredentName"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-initValue="${entity?.salerOtherCredentName}"
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">证件号码</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="salerCredentNo" data-th-value='${entity?.salerCredentNo}' name="salerCredentNo"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-initValue="${entity?.salerCredentNo}"
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">内部编号</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="salerInsNo" data-th-value='${entity?.salerInsNo}' name="salerInsNo"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-initValue="${entity?.salerInsNo}"
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">销售人员登记编码</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="salerRegistNo" data-th-value='${entity?.salerRegistNo}' name="salerRegistNo"
                                                   class="layui-input form-input" placeholder="请输入内容"
                                                   data-th-initValue="${entity?.salerRegistNo}"
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">所属区域</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="salerAreaType" name="salerAreaType"
                                                    class="layui-input form-input input-select"
                                                    required="required" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue='${entity?.salerAreaType}' data-th-data-result='${SVR_BUY_PLACE}' >
                                            </select>
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">所属总部或分支机构</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="salerOrgCode" name="salerOrgCode" class="input-select"  formatoption = "false"
                                                    data-th-data-url="@{/report/submitmaintenance/salerideninfo/SalerIdenInfo002/selectSalerOrgCode}"
                                                    placeholder="请选择" th:initValue="*{entity?.salerOrgCode}" allowClear="true" required></select>
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">所属部门</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="salerDept" data-th-value='${entity?.salerDept}' name="salerDept"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-initValue="${entity?.salerDept}"
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">职位</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="salerPosition" data-th-value='${entity?.salerPosition}' name="salerPosition"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-initValue="${entity?.salerPosition}"
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">学历</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="salerEduLevel" name="salerEduLevel"
                                                    class="layui-input form-input input-select"
                                                    required="required" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue='${entity?.salerEduLevel}' data-th-data-result='${SALER_EDU_LEVEL}' >
                                            </select>
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">学位</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="salerDegree" name="salerDegree"
                                                    class="layui-input form-input input-select"
                                                    required="required" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue='${entity?.salerDegree}' data-th-data-result='${SALER_DEGREE}' >
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">首次参加工作时间</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="salerWorkStartYmd" name="salerWorkStartYmd" data-th-required="true"
                                                   data-th-value="${entity?.salerWorkStartYmd}"
                                                   class="layui-input form-input input-dateSelect"
                                            >
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">首次从事金融工作时间</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="salerFinanceStartYmd" name="salerFinanceStartYmd" data-th-required="true"
                                                   data-th-value="${entity?.salerFinanceStartYmd}"
                                                   class="layui-input form-input input-dateSelect"
                                            >
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">首次从事理财销售时间</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="salerStartYmd" name="salerStartYmd" data-th-required="true"
                                                   data-th-value="${entity?.salerStartYmd}"
                                                   class="layui-input form-input input-dateSelect"
                                            >
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">专业技术职称</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="salerLevle" name="salerLevle"
                                                    class="layui-input form-input input-select"
                                                    required="required" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue='${entity?.salerLevle}' data-th-data-result='${SALER_LEVLE}' >
                                            </select>
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">理财专业证书</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="salerCertificateType" name="salerCertificateType"
                                                    class="layui-input form-input input-select"
                                                    required="required" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}" multiple="multiple"
                                                    data-th-initValue='${entity?.salerCertificateType}'
                                                    data-th-data-result='${SALER_CERTIFICATE_TYPE}' >
                                            </select>
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">理财登记培训证书编号</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="salerChbTrainNo" data-th-value='${entity?.salerChbTrainNo}' name="salerChbTrainNo"
                                                   class="layui-input form-input" placeholder="请输入内容"
                                                   data-th-initValue="${entity?.salerChbTrainNo}"
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">可销售产品风险等级</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="salerRiskLevel" name="salerRiskLevel"
                                                    class="layui-input form-input input-select"
                                                    required="required" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}" multiple="multiple"
                                                    data-th-initValue='${entity?.salerRiskLevel}'
                                                    data-th-data-result='${SALER_RISK_LEVEL}' >
                                            </select>
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">销售资质</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="salerQualification" data-th-value='${entity?.salerQualification}' name="salerQualification"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-initValue="${entity?.salerQualification}"
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">办公电话</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="salerTel" data-th-value='${entity?.salerTel}' name="salerTel"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-initValue="${entity?.salerTel}"
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">移动电话</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="salerMobile" data-th-value='${entity?.salerMobile}' name="salerMobile"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-initValue="${entity?.salerMobile}"
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">邮箱</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="salerMail" data-th-value='${entity?.salerMail}' name="salerMail"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-initValue="${entity?.salerMail}"
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">当前状态</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="salerStatus" name="salerStatus"
                                                    class="layui-input form-input input-select"
                                                    required="required" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue='${entity?.salerStatus}' data-th-data-result='${SALER_STATUS}' >
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div>
                                        <label class="layui-form-label form-lable" style='width: 11.9%;'>备注</label>
                                        <div class="layui-input-inline input-inline" style="width: 85%!important;">
                                            <textarea id="remark" name="remark" placeholder="请输入内容" maxlength="256"
                                                      data-th-placeholder="#{SysCommon.placeholder}" class="layui-textarea mst-textarea"
                                                      data-th-text="${entity?.remark}"></textarea>
                                        </div>
                                    </div>
                                </div>
                    <div class="text-center">
                        <a id="SalerIdenInfo002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                           data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="SalerIdenInfo002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                           data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
            </form>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/report/submitmaintenance/salerideninfo/SalerIdenInfo002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
