<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>销售结算资金交易信息维护新建</title>
</head>
<body>
    <div layout:fragment="content">
            <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
                <input hidden type="text" id="disabledThing" name="disabledThing" data-th-value="${entity?.disabledThing}" style="display:none;">
                <input hidden type="text" id="maintainStatus" name="maintainStatus" data-th-value="${entity?.maintainStatus}" style="display:none;">
                <input hidden type="text" id="registSeqno" name ="registSeqno" data-th-value="${entity?.registSeqno}" style="display:none;">
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">提供销售结算资金服务机构代码</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="institutionCode" data-th-value='${entity?.institutionCode}' name="institutionCode"
                                                   class="layui-input form-input" placeholder="请输入内容" required maxlength="6"
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">产品登记编码</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="prdRegistCode" data-th-value='${entity?.prdRegistCode}' name="prdRegistCode"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">销售结算资金账号</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="accountNo" data-th-value='${entity?.accountNo}' name="accountNo"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">销售结算资金账户名称</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="accountName" data-th-value='${entity?.accountName}' name="accountName"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">销售结算资金交易流水号</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="tradeNo" data-th-value='${entity?.tradeNo}' name="tradeNo"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">销售结算资金流动方向</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="tradePs" name="tradePs" formatoption="true"
                                                    data-th-initValue='${entity?.tradePs}'
                                                    class="layui-input form-input input-select"
                                                    data-th-data-result="${TRADE_PS}" placeholder="请输入内容" required
                                                    data-th-placeholder="#{SysCommon.placeholder}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">销售结算资金交易对手方账号</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="tradeCounterAccNo" data-th-value='${entity?.tradeCounterAccNo}' name="tradeCounterAccNo"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">销售结算资金交易对手方账户名称</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="tradeCounterAccName" data-th-value='${entity?.tradeCounterAccName}' name="tradeCounterAccName"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">销售结算资金交易对手方开户行名称</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="tradeCounterAccBankName" data-th-value='${entity?.tradeCounterAccBankName}' name="tradeCounterAccBankName"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">销售结算资金交易对手方账户开户行号</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="tradeCounterAccBankNo" data-th-value='${entity?.tradeCounterAccBankNo}' name="tradeCounterAccBankNo"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">销售结算资金交易币种</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="tradeCcy" name="tradeCcy"
                                                    class="layui-input form-input input-select"
                                                    required="required" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue='${entity?.tradeCcy}' data-th-data-result='${CURRENCY_CHB}' >
                                            </select>
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">销售结算资金交易金额</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="tradeAmt" data-th-value='${entity?.tradeAmt}' name="tradeAmt"
                                                   class="layui-input form-input text-number" placeholder="请输入内容" required
                                                   data-textrange="2" maxlength="18"
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">销售结算资金交易日期</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="tradeVdate" name="tradeVdate"
                                                   class="layui-input form-input input-dateSelect"
                                                   required="required" placeholder="请输入内容"
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value='${#dates.format(entity?.tradeVdate,"yyyy-MM-dd")}'/>

                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">销售结算资金交易时间</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="tradeTime" data-th-value='${entity?.tradeTime}' name="tradeTime" maxlength="6"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div>
                                        <label class="layui-form-label form-lable" style='width: 11.9%;'>销售结算资金交易附言</label>
                                        <div class="layui-input-inline input-inline" style="width: 85%!important;">
                                            <textarea id="postscript" name="postscript" placeholder="请输入内容" maxlength="200"
                                                      data-th-placeholder="#{SysCommon.placeholder}" class="layui-textarea mst-textarea"
                                                      data-th-text="${entity?.postscript}"></textarea>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div>
                                        <label class="layui-form-label form-lable" style='width: 11.9%;'>备注</label>
                                        <div class="layui-input-inline input-inline" style="width: 85%!important;">
                                            <textarea id="remark" name="remark" placeholder="请输入内容" maxlength="200"
                                                      data-th-placeholder="#{SysCommon.placeholder}" class="layui-textarea mst-textarea"
                                                      data-th-text="${entity?.remark}"></textarea>
                                        </div>
                                    </div>
                                </div>
                    <div class="text-center">
                        <a id="SalesTransactionMaintenance002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                           data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="SalesTransactionMaintenance002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                           data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
            </form>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/report/submitmaintenance/salestransactionmaintenance/SalesTransactionMaintenance002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
