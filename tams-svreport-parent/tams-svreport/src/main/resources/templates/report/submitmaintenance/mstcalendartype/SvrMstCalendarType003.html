<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{SvrMstCalendarType003}">节假日查询</title>
	<style>
		.mst-lable{
			width: 20%;
		}
	</style>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap" id="submitForm">
			<div class="layui-form-item">
				<div>
					<label class="layui-form-label form-lable mst-lable"
						data-th-text="#{MstCalendarType003.calendarName}">交易日历名称</label>
					<div class="layui-input-inline input-inline">
						<select type="text" id="calendarName" name="calendarName" 
							class="layui-input form-input input-select"
							data-th-data-url="@{/submitmaintenance/mstcalendartype/SvrMstCalendarType003/getCalendarNameList}"
							 allowClear="true"  placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}">
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div>
					<label class="layui-form-label form-lable mst-lable"
						data-th-text="#{MstCalendarType003.queryDate}">查询日期</label>
					<div class="layui-input-inline input-inline">
						<input id="cDate" name="cDate"
							class="layui-input form-input input-dateSelect" placeholder="请输入日期" 
							data-th-placeholder="#{SysCommon.placeholder}">
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div>
					<label class="layui-form-label form-lable mst-lable"
						data-th-text="#{MstCalendarType003.searchResult}">查询结果</label>
					<div class="layui-input-inline input-inline">
						<textarea id="result" name="result"
							placeholder="是否节假日" class="layui-textarea"></textarea>
					</div>
				</div>
			</div>
		</form>
		<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="position: fixed;bottom: 30px;">
			<div class="text-center">
				<a id="SvrMstCalendarType003_btn_cancel"
					class="layui-btn layui-btn-sm btn-cancel"
					data-th-text="#{SysCommon.cancel}">取消</a>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
  <script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
  <!-- 先引用 -->
  <script data-th-src="@{/js/report/moment-with-locales.min.js}" type="text/javascript"></script>
  <!-- 再引用日期组件 -->
  <script data-th-src="@{/js/report/lunar.js}" type="text/javascript"></script> 
  <script data-th-src="@{/js/report/fullcalendar.js}" type="text/javascript"></script> 
  <script data-th-src="@{/js/report/zh-cn.js}" type="text/javascript"></script> 
	<script data-th-src="@{/js/report/submitmaintenance/mstcalendartype/SvrMstCalendarType003.js}"></script>
	</div>
</body>

</html>
