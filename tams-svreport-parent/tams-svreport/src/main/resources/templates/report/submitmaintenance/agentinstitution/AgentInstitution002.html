<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>代理销售机构信息新建</title>
    <style>
        .height30{
            height:30px;
            padding-top:0px;
        }

        .checkRed{
            font-weight: bolder;
            vertical-align: middle;
            display: inline-block;
            height: 22px;
            color: red;
            font-size: 20px !important;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
            <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">发行机构代码</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="issuePartyId" data-th-value='${entity?.issuePartyId}' name="issuePartyId"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-initValue="${entity?.issuePartyId}"
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">代理销售机构代码</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="agentInstitutionCode" data-th-value='${entity?.agentInstitutionCode}' name="agentInstitutionCode"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">代理销售机构名称</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="agentInstitutionName" data-th-value='${entity?.agentInstitutionName}' name="agentInstitutionName"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div>
                                        <label class="layui-form-label form-lable" style='width: 11.9%;'>备注</label>
                                        <div class="layui-input-inline input-inline" style="width: 85%!important;">
                                            <textarea id="remark" name="remark" placeholder="请输入内容" maxlength="200"
                                                      data-th-placeholder="#{SysCommon.placeholder}" class="layui-textarea mst-textarea"
                                                      data-th-text="${entity?.remark}"></textarea>
                                        </div>
                                    </div>
                                </div>
                    <div class="text-center">
                        <a id="AgentInstitution002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                           data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="AgentInstitution002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                           data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
            </form>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/report/submitmaintenance/agentinstitution/AgentInstitution002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
