<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{MonthReportFBB001}">非保本银行月度统计报表</title>
<link rel="stylesheet" type="text/css" data-th-href="@{/css/report/report.css}">
</head>

<body>
<div layout:fragment="content">
  <div class="form-button-area">
    <a id="MonthReportFBB001_btn_manual" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-hand"></i>手工处理</a>
    <a id="MonthReportFBB001_btn_cancelManual" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-hand"></i>取消手工处理</a>
    <a id="MonthReportFBB001_btn_export" class="layui-btn layui-btn-sm btn-export btn-default">导出中债excel</a>
    <a id="MonthReportFBB001_btn_recal" class="layui-btn layui-btn-sm btn-export btn-default">重新计算</a>
  </div>
  <div class="joyin-form-wrap joyin-filter-form condition-area">
      <form class="layui-form" id="searchForm">
        <div class="layui-form-item">
          <div class="layui-inline layui-col-md3">
            <label class="layui-form-label form-lable">日期</label>
             <span class="input-append date" style="padding-top: 3px;position: relative;">
                  <input id="searchDate" type="text"  name="timeControl"  lay-verify="searchDate" data-format ="YYYYMM" data-th-value="${nowSysDate}" class="layui-input form-input input-dateSelect" placeholder="请选择日期" style="width: 125px;"/>
                  <input type="hidden" id="yesterdayDate" value="${yesterdayDate}" >
             </span>
          </div>
          <div class="layui-inline layui-col-md3">
	        <label class="layui-form-label form-lable">报表月份</label>
	        <div class="layui-input-inline input-inline">
	          <input id="reportmonth" name="reportmonth" type="text" class="layui-input form-input input-lenovoselect" data-rules="maxlength:200" placeholder="" data-th-placeholder="#{SysCommon.placeholder}"  readonly>
	        </div>
        </div>
         <div class="layui-inline layui-col-md3">
	        <label class="layui-form-label form-lable">报送状态</label>
	        <div class="layui-input-inline input-inline">
	          <input id="submitstatus" name="submitstatus" type="text" class="layui-input form-input input-lenovoselect" data-rules="maxlength:200" placeholder="" data-th-placeholder="#{SysCommon.placeholder}" readonly>
	        </div>
        </div>
      </form>
    </div>
  <table class="layui-table" id="monthReportFBB001ist"></table>
</div>
<div layout:fragment="script">
  <script data-th-inline="javascript" type="text/javascript">
      var isFromMain=/*[[${isFromMain}]]*/'';
  </script>
  <script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/submitmaintenance/monthreport/MonthReportFBB001.js}" type="text/javascript"></script>
</div>
</body>
</html>
