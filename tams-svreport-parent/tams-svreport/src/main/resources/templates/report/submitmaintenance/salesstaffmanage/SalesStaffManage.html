<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title>理财销售人员信息维护</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="layui-tab" style="margin-bottom: 0px;">
		  <ul class="layui-tab-title">
			  <li class="layui-this">&nbsp;
				  <span data-th-text="总部或分支机构信息">总部或分支机构信息</span>
			  </li>
			  <li>&nbsp;
				  <span data-th-text="销售人员身份信息">销售人员身份信息</span>
			  </li>
			  <li>&nbsp;
				  <span data-th-text="销售人员奖惩投诉记录信息">销售人员奖惩投诉记录信息</span>
			  </li>
		  </ul>
		  <div class="layui-tab-content">
		    <!--  总部或分支机构信息 -->
		    <div class="layui-tab-item  layui-show">
                <iframe th:src="@{/report/submitmaintenance/salerinstinfo/SalerInstInfo001/init}" width="100%"
                        height="100%" frameborder="0" style="border:none;min-height:600px;"></iframe>
            </div>
		    <!--  销售人员身份信息-->
		    <div  class="layui-tab-item ">
			  <iframe th:src="@{/report/submitmaintenance/salerideninfo/SalerIdenInfo001/init}" width="100%"
					  height="100%" frameborder="0" style="border:none;min-height:600px;"></iframe>
		    </div>
			  <!--  销售人员奖惩投诉记录信息-->
			<div  class="layui-tab-item ">
			   <iframe th:src="@{/report/submitmaintenance/salerrewpenainfo/SalerRewPenaInfo001/init}" width="100%"
					  height="100%" frameborder="0" style="border:none;min-height:600px;"></iframe>
			</div>
		  </div>
		</div>
    </div>
    <div layout:fragment="script">
     
    </div>
</body>
</html>
