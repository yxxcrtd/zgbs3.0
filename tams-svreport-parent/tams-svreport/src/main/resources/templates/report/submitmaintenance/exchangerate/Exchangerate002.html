<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{Exchangerate002}">新建汇率行情</title>
<link rel="stylesheet" type="text/css" data-th-href="@{/css/report/report.css}">
</head>
<body>
<div layout:fragment="content">
  <form id="Exchangerate002_newForm">
    <div class="layui-form" style=" margin-top:10px;">
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>公布日期</label>
        <div class="layui-input-block input-inline">
          <input id="publishDate" name="publishDate" type="text" data-th-value="${entity?.publishDate}" class="layui-input form-input input-dateSelect" placeholder="请选择日期">
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>币种</label>
        <div class="layui-input-block input-inline">
         <input id="build_ccyOriginal" name="ccyOriginal" type="text" class="layui-input form-input input-select" th:initValue="*{entity?.ccyOriginal}" data-th-data-result="${CURRENCY_CHB}" placeholder="请选择">
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>折算币种</label>
        <div class="layui-input-block input-inline">
          <input id="build_ccyConvert" name="ccyConvert" type="text" class="layui-input form-input input-select" th:initValue="*{entity?.ccyConvert}"data-th-data-result="${CURRENCY_CHB}"  placeholder="请选择">
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>汇率</label>
        <div class="layui-input-block input-inline">
          <input id="build_exchangePrice" name="exchangePrice" type="text" data-th-value="${entity?.exchangeRate}" class="layui-input form-input" step="0.1" data-th-rules="code" placeholder="请输入">
        </div>
      </div>
    </div>
  </form>
  <div class="layui-col-md11" style="margin:15px;">
    <div class="text-center">
        <a id="Exchangerate002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a> 
        <a id="Exchangerate002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a> 
    </div>
  </div>
</div>
<div layout:fragment="script">
  <script data-th-inline="javascript" type="text/javascript">
    var isFromMain="${isFromMain}";
  </script>
  <script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/submitmaintenance/exchangerate/Exchangerate002.js}" type="text/javascript"></script> 
</div>
</body>
</html>
