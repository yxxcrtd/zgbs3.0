<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{SvrEquityBusinessDetails002}">投资者明细信息新建</title>
<link rel="stylesheet" type="text/css" data-th-href="@{/css/report/report.css}">
</head>

<body>
<div layout:fragment="content">
  <form class="layui-form joyin-form-wrap" id="submitForm">
  	<!-- 隐藏字段 产品代码 -->
	<input type="text" name="account" data-th-value='${account}' hidden>
	<div class="layui-form-item">
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable" 
        	data-th-text="#{SvrEquityBusinessDetails002.registBankCode}">发行机构代码</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="registBankCode" name="registBankCode" class="layui-input form-input" 
          data-th-value="${entity?.registBankCode}" placeholder="请输入内容" required>
        </div>
      </div>
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-label-wrap"
		    data-th-text="#{SvrEquityBusinessDetails002.busiSeqno}">核心交易流水号</label>
		<div class="layui-input-inline input-inline">
		    <input type="text" id="busiSeqno" name="busiSeqno" class="layui-input form-input" placeholder="请输入内容"
		        data-th-placeholder="#{SysCommon.placeholder}" required
		        data-th-value="${entity?.busiSeqno}">
		</div>
	  </div>
    </div>
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable"
        	data-th-text="#{SvrEquityBusinessDetails002.regCode}">产品登记编码</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="regCode" name="regCode" class="layui-input form-input input-select" 
          placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" 
          data-th-initValue="${entity?.regCode}" data-th-data-result='${REGIST_CODE}' required>
        </div>
      </div>
      <div class="layui-inline layui-col-md6">
	    <label class="layui-form-label form-lable"
	    	data-th-text="#{SvrEquityBusinessDetails002.busiType}">业务种类</label>
	    <div class="layui-input-inline input-inline">
	      <select id="busiType" class="input-select" data-th-data-result='${SVR_BUSINESS_TYPE}'
	      	placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" 
            data-th-initValue="${entity?.busiType}" required>
          </select>
	    </div>
      </div>
    </div>
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable" 
        	data-th-text="#{SvrEquityBusinessDetails002.equityConfDate}">业务确认日期</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id=equityConfDate class="layui-input form-input input-dateSelect" required 
          data-th-value="${#dates.format(entity?.equityConfDate, 'yyyy-MM-dd')}"/>
        </div>
      </div>
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable" 
        	data-th-text="#{SvrEquityBusinessDetails002.shareConfDatetime}">业务确认时间</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id=shareConfDatetime  class="layui-input form-input" required 
          data-th-value="${entity?.shareConfDatetime}" />
        </div>
      </div>
    </div>
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable" data-th-text="#{SvrEquityBusinessDetails002.ccy}">币种</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="ccy" name="ccy" class="layui-input form-input input-select" placeholder="请输入内容" 
          data-th-placeholder="#{SysCommon.placeholder}" data-th-initValue="${entity?.ccy}"  
          data-th-data-result='${CURRENCY_CHB}' required >
        </div>
      </div>
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable" 
        	data-th-text="#{SvrEquityBusinessDetails002.amount}">金额</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="amount" name="amount" class="layui-input form-input text-money" 
          placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" 
          data-th-value="${entity?.amount}" 
          data-pattern='##.##' data-textrange=2 data-fixtype=2 required>
        </div>
      </div>
    </div>
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable" 
        	data-th-text="#{SvrEquityBusinessDetails002.amountCny}">折算人民币金额（元）</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="amountCny" name="amountCny" class="layui-input form-input text-money" placeholder="请输入内容" 
          data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.amountCny}" 
          data-pattern='##.##' data-textrange=2 data-fixtype=2 required>
        </div>
      </div>
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable " 
        	data-th-text="#{SvrEquityBusinessDetails002.prodValue}">确认净值</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="prodValue" name="prodValue" 
          class="text-money layui-input form-input" placeholder="请输入内容" 
          data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.prodValue}" 
          data-pattern='##.##' data-textrange=5 data-fixtype=2 >
        </div>
      </div>
    </div>
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable " 
	        data-th-text="#{SvrEquityBusinessDetails002.shares}">份额</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="shares" name="shares" 
          class="text-money layui-input form-input" placeholder="请输入内容" 
          data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.shares}" 
          data-pattern='##.##' data-textrange=5 data-fixtype=2 required >
        </div>
      </div>
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable " 
	        data-th-text="#{SvrEquityBusinessDetails002.feeAmt}">费用</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="feeAmt" name="feeAmt" 
          class="text-money layui-input form-input" placeholder="请输入内容" 
          data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.feeAmt}" 
          data-pattern='##.##' data-textrange=2 data-fixtype=2 required >
        </div>
      </div>
    </div>
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md6">
	  	<label class="layui-form-label form-lable"
	  		data-th-text="#{SvrEquityBusinessDetails002.channel}">渠道</label>
    	<div class="layui-input-inline input-inline">
        	<select id="channel" name="channel" class="layui-input form-input input-select"
            data-th-data-result='${SVR_CHANNEL}' allowClear="true" placeholder="请输入内容"
            data-th-placeholder="#{SysCommon.placeholder}" required
            data-th-initValue="${entity?.channel}" >
            </select>
        </div>
      </div>
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-label-wrap"
		    data-th-text="#{SvrEquityBusinessDetails002.contractNo}">销售合同号</label>
		<div class="layui-input-inline input-inline">
		    <input type="text" id="contractNo" name="contractNo" class="layui-input form-input" placeholder="请输入内容"
		        data-th-placeholder="#{SysCommon.placeholder}" required
		        data-th-value="${entity?.contractNo}" >
		</div>
	  </div>
    </div>
    <div class="layui-form-item">
	  <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable" 
        	data-th-text="#{SvrEquityBusinessDetails002.indentifyMark}">识别标识</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="indentifyMark" name="indentifyMark" class="layui-input form-input" 
          data-th-value="${entity?.indentifyMark}" required >
        </div>
      </div>
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-label-wrap"
		    data-th-text="#{SvrEquityBusinessDetails002.finAcc}">理财账号</label>
		<div class="layui-input-inline input-inline">
		    <input type="text" id="finAcc" name="finAcc" class="layui-input form-input" placeholder="请输入内容"
		        data-th-placeholder="#{SysCommon.placeholder}" required
		        data-th-value="${entity?.finAcc}" >
		</div>
	  </div>
    </div>
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-label-wrap"
		    data-th-text="#{SvrEquityBusinessDetails002.custContractNo}">客户统一编号</label>
		<div class="layui-input-inline input-inline">
		    <input type="text" id="custContractNo" name="custContractNo" class="layui-input form-input" placeholder="请输入内容"
		        data-th-placeholder="#{SysCommon.placeholder}" required
		        data-th-value="${entity?.custContractNo}" >
		</div>
	  </div>
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-label-wrap"
		    data-th-text="#{SvrEquityBusinessDetails002.custName}">客户姓名</label>
		<div class="layui-input-inline input-inline">
		    <input type="text" id="custName" name="custName" class="layui-input form-input" placeholder="请输入内容"
		        data-th-placeholder="#{SysCommon.placeholder}" required
		        data-th-value="${entity?.custName}" >
		</div>
	  </div>
    </div>
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-label-wrap"
		    data-th-text="#{SvrEquityBusinessDetails002.fundAcc}">关联活期存款账号</label>
		<div class="layui-input-inline input-inline">
		    <input type="text" id="fundAcc" name="fundAcc" class="layui-input form-input" placeholder="请输入内容"
		        data-th-placeholder="#{SysCommon.placeholder}" required
		        data-th-value="${entity?.fundAcc}" >
		</div>
	  </div>
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-label-wrap"
		    data-th-text="#{SvrEquityBusinessDetails002.fundAccPlace}">关联账号开户所在地</label>
		<div class="layui-input-inline input-inline">
		    <select id="fundAccPlace" name="fundAccPlace" class="layui-input form-input input-select"
            data-th-data-result='${SVR_BUY_PLACE}' allowClear="true" placeholder="请输入内容"
            data-th-placeholder="#{SysCommon.placeholder}" required
            data-th-initValue="${entity?.fundAccPlace}" >
            </select>
		</div>
	  </div>
    </div>
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable"
        	data-th-text="#{SvrEquityBusinessDetails002.isConsign}">是否代销</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="isConsign" name="isConsign" class="layui-input form-input input-select" placeholder="请输入内容" 
          data-th-placeholder="#{SysCommon.placeholder}" 
          data-th-initValue="${entity?.isConsign}" data-th-data-result='${SVR_YES_OR_NO}' required >
        </div>
      </div>
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable"
        	data-th-text="#{SvrEquityBusinessDetails002.agencyCode}">代销机构代码</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="agencyCode" name="agencyCode" class="layui-input form-input" 
          placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" 
          data-th-value="${entity?.agencyCode}" >
        </div>
      </div>
    </div>
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable"
        	data-th-text="#{SvrEquityBusinessDetails002.agencyName}">代销机构名称</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="agencyName" name="agencyName" class="layui-input form-input" placeholder="请输入内容" 
          data-th-placeholder="#{SysCommon.placeholder}" 
          data-th-value="${entity?.agencyName}" >
        </div>
      </div>
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable"
        	data-th-text="#{SvrEquityBusinessDetails002.agencyFsa}">代销机构所属监管机构</label>
        <div class="layui-input-inline input-inline">
          <select id="agencyFsa" name="agencyFsa" class="layui-input form-input input-select"
            data-th-data-result='${SVR_BANK_REGU_BURE}' allowClear="true" placeholder="请输入内容"
            data-th-placeholder="#{SysCommon.placeholder}" data-th-initValue="${entity?.agencyFsa}" >
          </select>
        </div>
      </div>
    </div>
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable"
        	data-th-text="#{SvrEquityBusinessDetails002.busiFsa}">业务发生地所属监管</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="busiFsa" name="busiFsa" class="layui-input form-input input-select" placeholder="请输入内容" 
          data-th-placeholder="#{SysCommon.placeholder}" 
          data-th-value="${entity?.busiFsa}" data-th-data-result='${SVR_BANK_REGU_BURE2}' required >
        </div>
      </div>
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable"
        	data-th-text="#{SvrEquityBusinessDetails002.tranTellName}">交易柜员号</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="tranTellName" name="tranTellName" class="layui-input form-input" 
          placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" 
          data-th-value="${entity?.tranTellName}" required >
        </div>
      </div>
    </div>
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable" 
        	data-th-text="#{SvrEquityBusinessDetails002.orgIndentifyMark}">合并前识别标识</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="orgIndentifyMark" name="orgIndentifyMark" class="layui-input form-input" 
          data-th-value="${entity?.orgIndentifyMark}" >
        </div>
      </div>
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable"
        	data-th-text="#{SvrEquityBusinessDetails002.remark}">备注</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="remark" name="remark" class="layui-input form-input" 
          placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" 
          data-th-value="${entity?.remark}">
        </div>
      </div>
    </div>
    <!--  按钮 -->
	<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 30px;">
	    <div class="text-center">
	        <a id="EquityBusinessDetails002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
	           data-th-text="#{SysCommon.submit}">提交</a>
	        <a id="EquityBusinessDetails002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
	           data-th-text="#{SysCommon.cancel}">取消</a>
	    </div>
	</div>
  </form>
</div>
<div layout:fragment="script">
  <!-- <script data-th-inline="javascript" type="text/javascript">
    /* var CNY="${CNY}"; */
    /* var entity = '${entity}'; */
  </script>
  <script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script> -->
  <script data-th-src="@{/js/report/submitmaintenance/businessdetailed/EquityBusinessDetails002.js}" type="text/javascript"></script> 
</div>
</body>
</html>
