<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>总部或分支机构信息新建</title>
    <style>
        .height30{
            height:30px;
            padding-top:0px;
        }

        .checkRed{
            font-weight: bolder;
            vertical-align: middle;
            display: inline-block;
            height: 22px;
            color: red;
            font-size: 20px !important;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
            <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
                <input hidden type="text" id="erroOrInfo" name ="erroOrInfo" data-th-value="${entity?.erroOrInfo}" style="display:none;">
                <input hidden type="text" id="workflowId" name ="workflowId" data-th-value="${entity?.workflowId}" style="display:none;">
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">销售机构代码</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="salerInstCode" data-th-value='${entity?.salerInstCode}' name="salerInstCode"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-initValue="${entity?.salerInstCode}"
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">总部或分支机构编码</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="salerOrgCode" data-th-value='${entity?.salerOrgCode}'
                                                   name="salerOrgCode"  maxlength="20"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">总部或分支机构名称</label>
                                        <div class="layui-input-inline input-inline ">
                                            <input id="salerOrgName" data-th-value='${entity?.salerOrgName}'
                                                   name="salerOrgName"
                                                   class="layui-input form-input" placeholder="请输入内容" required
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">机构层级</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="salerOrgLevel" name="salerOrgLevel"
                                                    class="layui-input form-input input-select"
                                                    required="required" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue='${entity?.salerOrgLevel}' data-th-data-result='${SALER_ORG_LEVEL}' >
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">




                                </div>
                    <div class="text-center">
                        <a id="SalerInstInfo002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                           data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="SalerInstInfo002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                           data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
            </form>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/report/submitmaintenance/salerinstinfo/SalerInstInfo002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
