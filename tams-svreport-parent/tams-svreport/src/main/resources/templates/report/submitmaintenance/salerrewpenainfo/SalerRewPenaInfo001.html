<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>销售人员奖惩投诉记录信息</title>
    <style>
        .height30{
            height:30px;
            padding-top:0px;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area" export="false" >
        <a id="SalerRewPenaInfo001_btn_add" class="layui-btn layui-btn-sm btn-create"><span>新建</span></a>
        <a id="SalerRewPenaInfo001_btn_delete" class="layui-btn layui-btn-sm btn-delete"><span>删除</span></a>
        <a id="SalerRewPenaInfo001_btn_import" class="layui-btn layui-btn-sm btn-import"><span>导入</span></a>
        <a id="SalerRewPenaInfo001_btn_export" class="layui-btn layui-btn-sm btn-export"><span>导出</span></a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">内部编号</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="salerInsNo" name="salerInsNo"
                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-data-url="@{/report/submitmaintenance/salerrewpenainfo/SalerRewPenaInfo001/getSalerInsNo}"
                               data-idfield="code" data-effectiveFields="code"
                               data-th-data-effectivefieldsalias='|{"code":"内部编号"}|'
                        />
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">记录分类</label>
                    <div class="layui-input-inline input-inline">
                        <select id="salerRewPenaTyep" class="input-select" name="salerRewPenaTyep"
                                allowClear="true" data-th-data-result='${SALER_REW_PENA_TYEP}'
                                data-th-initvalue="${salerRewPenaTyep}" placeholder="请选择"
                                data-th-placeholder="#{SysCommon.selectplaceholder}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">奖惩单位</label>
                    <div class="layui-input-inline input-inline">
                        <select id="salerRewPenaInst" class="input-select" name="salerRewPenaInst"
                                allowClear="true" data-th-data-result='${SALER_REW_PENA_INST}'
                                data-th-initvalue="${salerRewPenaInst}" placeholder="请选择"
                                data-th-placeholder="#{SysCommon.selectplaceholder}">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">奖惩起始日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="salerRewPenaStart" name="salerRewPenaStart" placeholder="请选择、支持区间"
                               class="layui-input form-input input-dateRangeSelect"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">投诉日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="salerComplainDate" name="salerComplainDate" placeholder="请选择、支持区间"
                               class="layui-input form-input input-dateRangeSelect"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/report/submitmaintenance/salerrewpenainfo/SalerRewPenaInfo001.js}" type="text/javascript"></script>
</div>
</body>
</html>
