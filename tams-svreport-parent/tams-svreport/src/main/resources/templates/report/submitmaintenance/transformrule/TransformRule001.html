<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{SvrTransformRule001}">变形转换规则</title>
<link rel="stylesheet" type="text/css"
	data-th-href="@{/css/report/report.css}">
</head>
<body>
	<div layout:fragment="content">
		<div class="form-button-area">
			<a id="TransformRule001_btn_add"
				class="layui-btn layui-btn-sm btn-create btn-default"
				data-th-text="#{SysCommon.create}">新建</a> <a
				id="TransformRule001_btn_delete"
				class="layui-btn layui-btn-sm btn-delete btn-default"
				data-th-text="#{SysCommon.delete}">删除</a>
		</div>
		<div class="joyin-form-wrap condition-area">
			<form class="layui-form" id="searchForm">
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">类型</label>
						<div class="layui-input-inline input-inline">
							<select id="transType" searchable="false" name="transType"
								class="input-select" allowClear="true"
								data-th-data-result='${TRANS_TYPE}'
								data-th-initValue='${TRANS_TYPE_UNC}'></select>
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">原始值</label>
						<div class="layui-input-inline input-inline">
							<input id="orgField" name="orgField" type="text"
								class="layui-input form-input input-lenovoselect" maxlength="30"
								data-rules="code;maxlength:30" placeholder="请输入关键词"
								data-th-placeholder="#{SysCommon.placeholder}">
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">数据状态</label>
						<div class="layui-input-inline input-inline">
							<select id="status" class="input-select" allowClear="true"
								multiple="multiple" data-th-data-result='${MAINTAIN_STATUS}'
								placeholder="请选择"
								data-th-placeholder="#{SysCommon.selectplaceholder}"></select>
						</div>
					</div>
				</div>
			</form>
		</div>
		<div>
			<table class="layui-table" id="dataTable"></table>
		</div>
	</div>

	<div layout:fragment="script">
	   <script data-th-inline="javascript" type="text/javascript">
    	var isFromMain = /*[[${isFromMain}]]*/'';
  		</script>
		<script
			data-th-src="@{/js/report/submitmaintenance/transformrule/TransformRule001.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
