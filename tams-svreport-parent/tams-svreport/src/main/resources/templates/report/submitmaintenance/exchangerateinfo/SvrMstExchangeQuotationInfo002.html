<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{SvrMstExchangeQuotationInfo002}">汇率行情信息</title>
    <style>
        .mst-lable{
            width: 20%;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable"
                               data-th-text="#{SvrMstExchangeQuotationInfo001.exchargeCode}">币种对</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="exchargeCode" name="exchargeCode"
                                    class="layui-input form-input input-select"
                                    data-th-data-result='${CYY_PAIR}' allowClear="true" placeholder="请输入内容"
                                    data-th-initValue="${entity?.exchargeCode}" required="required"
                                    data-th-placeholder="#{SysCommon.placeholder}" formatoption="true">
                                <option></option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable"
                               data-th-text="#{SvrMstExchangeQuotationInfo001.tradeDate}">生效日</label>
                        <div class="layui-input-inline input-inline">
                            <input id="tradeDate" name="tradeDate"
                                   class="layui-input form-input input-dateSelect"
                                   data-th-data-result='${COMMON_BUSINESS_TYPE}' placeholder="请输入内容"
                                   data-th-value="${#dates.format(entity?.tradeDate,'yyyy-MM-dd')}"
                                   required="required" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable"
                               data-th-text="#{SvrMstExchangeQuotationInfo002.openPrice}">开盘价</label>
                        <div class="layui-input-inline input-inline">
                            <input id="openPrice" name="openPrice" type="text"
                                   class="layui-input form-input text-number" placeholder="请输入内容"
                                   maxlength="20" data-th-value="${entity?.openPrice}" required="required"
                                   data-fixtype="2" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable"
                               data-th-text="#{SvrMstExchangeQuotationInfo002.closePrice}">收盘价</label>
                        <div class="layui-input-inline input-inline">
                            <input id="closePrice" name="closePrice" type="text"
                                   class="layui-input form-input text-number" placeholder="请输入内容"
                                   maxlength="20" data-th-value="${entity?.closePrice}" required="required"
                                   data-fixtype="2" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable"
                               data-th-text="#{SvrMstExchangeQuotationInfo002.highPrice}">最高价</label>
                        <div class="layui-input-inline input-inline">
                            <input id="highPrice" name="highPrice" type="text"
                                   class="layui-input form-input text-number" placeholder="请输入内容"
                                   data-th-value="${entity?.highPrice}" required="required" maxlength="20"
                                   data-fixtype="2" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable"
                               data-th-text="#{SvrMstExchangeQuotationInfo002.lowPrice}">最低价</label>
                        <div class="layui-input-inline input-inline">
                            <input id="lowPrice" name="lowPrice" maxlength="20" type="text"
                                   class="layui-input form-input text-number" placeholder="请输入内容"
                                   data-th-value="${entity?.lowPrice}" required="required" data-fixtype="2"
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable"
                               data-th-text="#{SvrMstExchangeQuotationInfo002.midPrice}">中间价</label>
                        <div class="layui-input-inline input-inline">
                            <input id="midPrice" name="midPrice" maxlength="20" type="text"
                                   class="layui-input form-input text-number" placeholder="请输入内容"
                                   data-th-value="${entity?.midPrice}" required="required" data-fixtype="2"
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
            </form>
            <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="position: fixed;bottom: 30px;">
                <div class="text-center">
                    <a id="SvrMstExchangeQuotationInfo002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                       data-th-text="#{SysCommon.submit}">提交</a>
                    <a id="SvrMstExchangeQuotationInfo002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                       data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </div>
        </div>
    </div>
    <!-- <div layout:fragment="script">
        <script data-th-src="@{/js/basicdata/exchangerateinfo/SvrMstExchangeQuotationInfo002.js}" type="text/javascript"></script>
    </div> -->
    <div layout:fragment="script">
  <script data-th-inline="javascript" type="text/javascript">
    var isFromMain="${isFromMain}";
  </script>
  <script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/report/submitmaintenance/exchangerateinfo/SvrMstExchangeQuotationInfo002.js}" type="text/javascript"></script> 
</div>
</body>
</html>
