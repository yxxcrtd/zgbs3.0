<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{SvrMstCalendarType004}">交易日历明细查询</title>
</head>
<body>
<div layout:fragment="content">
	<div class='layui-fluid'>
		<div class="layui-col-md12 form-button-area" style="margin: 10px;">
		</div>
		<div class='joyin-form-wrap joyin-filter-form condition-area'>
			<form class="layui-form" id="submitForm">
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							   data-th-text="#{MstCalendarType004.calendarName}">交易日历名称</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="calendarName" data-th-value="${calendarName}"
								   name="calendarName" required="required"
								   class="layui-input form-input" disabled/>
						</div>
					</div>
					<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							   data-th-text="#{MstCalendarType004.isHoliday}">是否节假日</label>
						<div class="layui-input-inline input-inline">
							<select type="text" id="isHoliday" name="isHoliday"
								class="layui-input form-input input-select"
								data-th-data-result='${SVR_YES_OR_NO}' formatoption="true"
								allowClear="true" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}">
							</select>
						</div>
					</div>
					<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							   data-th-text="#{MstCalendarType004.cDate}">查询日期</label>
						<div class="layui-input-inline input-inline">
							<input id="cDate" name="cDate"
								   class="layui-input form-input input-dateRangeSelect"
								   placeholder="请选择时间区间" required
								   data-th-placeholder="#{SysCommon.placeholder}">
						</div>
					</div>
				</div>
			</form>
		</div>
		<div>
			<table class="layui-table" id="dataTable"></table>
		</div>
	</div>
</div>
<div layout:fragment="script">
		<script data-th-src="@{/js/report/submitmaintenance/mstcalendartype/SvrMstCalendarType004.js}"></script>
		<script data-th-inline="javascript" type="text/javascript">
        var tradeCalendarId = /*[[${tradeCalendarId}]]*/;
        </script>
		
</div>
</body>
</html>
