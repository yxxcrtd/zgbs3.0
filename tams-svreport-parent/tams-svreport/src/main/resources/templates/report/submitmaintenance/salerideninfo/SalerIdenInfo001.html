<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>销售人员身份信息</title>
    <style>
        .height30{
            height:30px;
            padding-top:0px;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area" export="false">
        <a id="SalerIdenInfo001_btn_add" class="layui-btn layui-btn-sm btn-create"><span>新建</span></a>
        <a id="SalerIdenInfo001_btn_delete" class="layui-btn layui-btn-sm btn-delete"><span>删除</span></a>
        <a id="SalerIdenInfo001_btn_importCode" class="layui-btn layui-btn-sm btn-import"><span>导入销售人员登记编码</span></a>
        <a id="SalerIdenInfo001_btn_import" class="layui-btn layui-btn-sm btn-import"><span>导入</span></a>
        <a id="SalerIdenInfo001_btn_export" class="layui-btn layui-btn-sm btn-export"><span>导出</span></a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">姓名</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="salerName" name="salerName"
                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-data-url="@{/report/submitmaintenance/salerideninfo/SalerIdenInfo001/getSalerName}"
                               data-idfield="code" data-effectiveFields="code"
                               data-th-data-effectivefieldsalias='|{"code":"姓名"}|'
                        />
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">性别</label>
                    <div class="layui-input-inline input-inline">
                        <select id="salerSex" class="input-select" name="salerSex"
                                allowClear="true" data-th-data-result='${SVR_SEX}'
                                data-th-initvalue="${salerSex}" placeholder="请选择"
                                data-th-placeholder="#{SysCommon.selectplaceholder}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">证件类型</label>
                    <div class="layui-input-inline input-inline">
                        <select id="salerCredentType" class="input-select" name="salerCredentType"
                                allowClear="true" data-th-data-result='${SALER_CREDENT_TYPE}'
                                data-th-initvalue="${salerCredentType}" placeholder="请选择"
                                data-th-placeholder="#{SysCommon.selectplaceholder}">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">所属总部或分支机构</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="salerOrgCode" name="salerOrgCode"
                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-data-url="@{/report/submitmaintenance/salerideninfo/SalerIdenInfo001/getSalerOrgCode}"
                               data-idfield="code" data-parentIds="salerOrgCode"
                               data-th-data-effectivefieldsalias='|{"code":"总部或分支机构编码","shortName":"总部或分支机构名称"}|'
                        />
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">数据状态</label>
                    <div class="layui-input-inline input-inline">
                        <select id="status" class="input-select" name="status"
                                allowClear="true" data-th-data-result='${MAINTAIN_STATUS}'
                                data-th-initvalue="${status}" placeholder="请选择"
                                data-th-placeholder="#{SysCommon.selectplaceholder}">
                        </select>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/report/submitmaintenance/salerideninfo/SalerIdenInfo001.js}" type="text/javascript"></script>
</div>
</body>
</html>
