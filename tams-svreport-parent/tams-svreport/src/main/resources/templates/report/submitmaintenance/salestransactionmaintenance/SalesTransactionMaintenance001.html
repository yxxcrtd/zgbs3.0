<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>销售结算资金交易信息维护</title>
</head>
<body>

</body>
<div layout:fragment="content">
    <div class="form-button-area" >
        <a id="SalesTransactionMaintenance001_btn_add" class="layui-btn layui-btn-sm btn-create"><span>新建</span></a>
        <a id="SalesTransactionMaintenance001_btn_delete" class="layui-btn layui-btn-sm btn-delete"><span>删除</span></a>
        <a id="SalesTransactionMaintenance001_btn_import" class="layui-btn layui-btn-sm btn-import"><span>导入</span></a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">销售结算资金流动方向</label>
                    <div class="layui-input-inline input-inline">
                        <select id="tradePs" name="tradePs" class="input-select"
                                allowClear="true" data-th-data-result='${TRADE_PS}' data-th-initvalue="${tradePs}"
                                placeholder="请选择"
                                data-th-placeholder="#{SysCommon.selectplaceholder}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{SalesTransactionMaintenance001.institutionCode}">提供销售结算资金服务机构代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="institutionCode" name="institutionCode"
                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                               data-parentIds="institutionCode"
                               data-th-data-url="@{/report/submitmaintenance/salestransactionmaintenance/SalesTransactionMaintenance001/getInstitutionCode}"
                               data-idfield="code" data-effectivefields="code"
                               data-th-data-effectivefieldsalias='|{"code":"#{SalesTransactionMaintenance001.institutionCode}"}|'
                        />
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">数据状态</label>
                    <div class="layui-input-inline input-inline">
                        <select id="dataStatus" class="input-select" name="dataStatus"
                                allowClear="true" data-th-data-result='${MAINTAIN_STATUS}'
                                data-th-initvalue="${dataStatus}" placeholder="请选择"
                                data-th-placeholder="#{SysCommon.selectplaceholder}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{SalesTransactionMaintenance001.prdRegistCode}">产品登记编码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="prdRegistCode" name="prdRegistCode"
                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                               data-parentIds="prdRegistCode"
                               data-th-data-url="@{/report/submitmaintenance/salestransactionmaintenance/SalesTransactionMaintenance001/getPrdRegistCode}"
                               data-idfield="code" data-effectivefields="code"
                               data-th-data-effectivefieldsalias='|{"code":"#{SalesTransactionMaintenance001.prdRegistCode}"}|'
                        />
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">销售结算资金交易流水号</label>
                    <div class="layui-input-inline input-inline">
                        <select id="tradeNo" class="input-select" name="tradeNo" formatoption="false"
                                data-th-data-url='@{/report/submitmaintenance/salestransactionmaintenance/SalesTransactionMaintenance001/getTradeNo}'
                                initvalue="" placeholder="请选择"
                                data-th-placeholder="#{SysCommon.selectplaceholder}"
                                allowClear="true">
                        </select>

                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">销售结算资金交易日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="tradeVdate" name="tradeVdate" placeholder="请选择、支持区间"
                               class="layui-input form-input input-dateRangeSelect"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/report/submitmaintenance/salestransactionmaintenance/SalesTransactionMaintenance001.js}" type="text/javascript"></script>
</div>
</html>
