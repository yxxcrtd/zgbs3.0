<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form" id="searchForm">
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md9">
                <label class="layui-form-label form-lable">汇总开始日</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="startDate" name="startDate"
                           class="layui-input form-input input-dateSelect"
                           placeholder="请选择日期" />
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md9">
                <label class="layui-form-label form-lable">汇总结束日</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="endDate" name="endDate"
                           class="layui-input form-input input-dateSelect"
                           placeholder="请选择日期" />
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md12">
                <label class="layui-form-label form-lable" style="width: 100%;text-align: center;"
                       th:text="'上次汇总时间：'+${lastSummaryTime}"></label>
            </div>
        </div>
        <div style="text-align:center;">
            <a class="layui-btn layui-btn-sm" id="InvestorsQualityCheck002_btn_execute"  style="height:26px;">
	            		<span class="jyiconfont jyicon-execute" style="font-size:16px"></span>&nbsp;
	            		<span style="font-size:12px">执行</span>&nbsp;&nbsp;
            </a>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <style>
        .form-lable{
            width: 25%;
        }
    </style>

    <script data-th-inline="javascript" type="text/javascript">
        var entity = eval(/*[[${entity}]]*/'');
    </script>
    <script
            data-th-src="@{/js/report/submitexamination/investorsqualitycheck/InvestorsQualityCheck002.js}"
            type="text/javascript"></script>
</div>
</body>
</html>
