<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
    <meta charset="utf-8">
    <title data-th-text="#{CheckReport001}">报送前检查</title>
    <link rel="stylesheet" type="text/css" data-th-href="@{/css/report/report.css}">
</head>

<body>
<div layout:fragment="content">
    <div class="form-button-area"></div>
    <div class="joyin-form-wrap condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">检查日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="checkDate" name="timeControl" class="layui-input form-input input-dateRangeSelect" data-th-start="${nowSysDate}" data-th-end ="${nowSysDate}" placeholder="请选择日期区间" />
                    </div>
                </div>
               <!-- <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">机构代码</label>
                    <div class="layui-input-inline input-inline">
                        <select id="orgCode" class="input-select" allowClear="true" multiple="multiple" data-th-data-url="@{/svreport/system/proregistcodemanage/ProRegistCodeManage001/getInstitutionCode}" placeholder="请选择"></select>
                    </div>
                </div>-->
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">报表名称</label>
                    <div class="layui-input-inline input-inline">
                        <!--      <select id="repName" name="repName" class="input-select" allowClear="true" multiple="multiple" data-th-initvalue="${repCode}" data-th-data-url="@{/svreport/submitexamination/checkreport/CheckReport001/getReportCode}" ></select> -->
                        <select id="repName" name="repName" class="input-select" allowClear="true" multiple="multiple" data-th-initvalue="${repCode}"
                                data-th-data-result='${REPORT_CODE_RESULT}' ></select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">检查结果</label>
                    <div class="layui-input-inline input-inline">
                        <select id="checkResult" searchable="false" name="checkResult" data-th-initvalue="${checkResult}" class="input-select" allowClear="true" multiple="multiple" data-th-data-result='${SVR_CHECK_RESULT}'  ></select>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="checkReportTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var isFromMain = /*[[${isFromMain}]]*/'';
        var searchDataStart=/*[[${searchDataStart}]]*/'';
        var searchDataEnd=/*[[${searchDataEnd}]]*/'';
        var title01 = /*[[${title01}]]*/'';
        var title02 = /*[[${title02}]]*/'';
        var repCode01 = /*[[${repCode01}]]*/'';
        var repCode02 = /*[[${repCode02}]]*/'';
        var repCode = /*[[${repCode}]]*/'';
        var checkResult = /*[[${checkResult}]]*/'';
    </script>
    <script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/report/submitexamination/checkreport/CheckReport001.js}" type="text/javascript"></script>
</div>
</body>
</html>
