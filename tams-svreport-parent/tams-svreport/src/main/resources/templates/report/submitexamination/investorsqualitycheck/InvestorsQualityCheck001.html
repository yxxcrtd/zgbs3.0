<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{SvrInvestorsQualityCheck001}">投资者质量核查</title>
<link rel="stylesheet" type="text/css"
	data-th-href="@{/css/report/report.css}">
<style>
.indexIdTable01 thread {
	background: #FFFFF0;
}

.indexIdTable01 tbody {
	background: #EEE9E9;
}
</style>
</head>

<body>
	<div layout:fragment="content">
		<div class="form-button-area" export="false">
			<a id="SvrInvestorsQualityCheck001_btn_summary" class="layui-btn layui-btn-sm btn-default">
				<i class="iconfont icon-hand"></i>持有信息汇总
			</a>
		</div>
		<div class="joyin-form-wrap condition-area">
			<form class="layui-form" id="searchForm">
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md3">
						<label class="layui-form-label form-lable">机构代码</label>
						<div class="layui-input-inline input-inline">
							<select id="orgCode" class="input-select" allowClear="true"
								multiple="multiple"
								data-th-data-url="@{/svreport/system/proregistcodemanage/ProRegistCodeManage001/getInstitutionCode}"
								placeholder="请选择"></select>
						</div>
					</div>
					<div class="layui-inline layui-col-md3">
						<label class="layui-form-label form-lable">查询日期</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="searchDate" name="timeControl"
								data-th-value="${DATE}"
								class="layui-input form-input input-dateSelect"
								placeholder="请选择日期" />
						</div>
					</div>
				</div>

			</form>
		</div>
		<div class="layui-tab layui-tab-brief " id="tabList"
			lay-filter="tabList" style="margin-bottom: 0px;" overflow>
			<!-- <p class="menu-title-wrap"><span class="menu-title">质量核查不合格数量/总数量</span></p> -->
			<div class="layui-col-md4">
				<div class="tab-pane active" id="tabpan01" style="width: 100%;">
					<!--左表格  -->
					<table class="table" id="indexIdTable01" lay-skin="line"
						style="border-style: none;">
					</table>
				</div>
			</div>
			<div class="layui-col-md8"
				style="padding-left: 10px; padding-right: 10px">
				<div class='layui-form-item'>
				<table>
				<span class="menu-title" id="registrationTitle"></span>
					<span id="registration" style="padding-left: 8px;"></span>
				</table>
					
				</div>
				<div>
					<div id="tableDiv0" display="none">
						<table class="layui-table" id="table0"></table>
					</div>
					<div id="tableDiv1" display="none">
						<table class="layui-table" id="table1"></table>
					</div>
					<div id="tableDiv2" display="none">
						<table class="layui-table" id="table2"></table>
					</div>
					<div id="tableDivCPZT" display="none">
						<table class="layui-table" id="tableCPZT"></table>
					</div>
					<div id="tableDivSLPP" display="none">
						<table class="layui-table" id="tableSLPP"></table>
					</div>
					<div id="tableDivMJZFE" display="none">
						<table class="layui-table" id="tableMJZFE"></table>
					</div>
					<div id="tableDivSJMJJE" display="none">
						<table class="layui-table" id="tableSJMJJE"></table>
					</div>
					<div id="tableDivDJWZX" display="none">
						<table class="layui-table" id="tableDJWZX"></table>
					</div>
					<div id="tableDivCPYEFBS" display="none">
						<table class="layui-table" id="tableCPYEFBS"></table>
					</div>
					<div id="tableDivCPYEKFS" display="none">
						<table class="layui-table" id="tableCPYEKFS"></table>
					</div>
					<div id="tableDivCPFEFBS" display="none">
						<table class="layui-table" id="tableCPFEFBS"></table>
					</div>
					<div id="tableDivCPFEKFS" display="none">
						<table class="layui-table" id="tableCPFEKFS"></table>
					</div>
				</div>
			</div>
		</div>
	</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
        	var isFromMain = "${isFromMain}";
        </script>
		<script data-th-src="@{/js/report/jquery.validate.js}"
			type="text/javascript"></script>
		<script data-th-src="@{/js/report/joyinvalid.js}"
			type="text/javascript"></script>
		<script data-th-src="@{/js/report/report-common.js}"
			type="text/javascript"></script>
		<script data-th-src="@{/js/report/moment-with-locales.min.js}"
			type="text/javascript"></script>
		<script data-th-src="@{/js/report/echarts.min.js}"
			type="text/javascript"></script>
		<script
			data-th-src="@{/js/report/submitexamination/investorsqualitycheck/InvestorsQualityCheck001.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
