<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{ChbSubinfoBatchLog001}">中债报送Excel下载</title>
</head>
<body>
    <div class="container" layout:fragment="content">
    	<div class="form-button-area" export="false">
            <a id="ChbSubinfoBatchLog001_btn_export" class="layui-btn layui-btn-sm btn-export btn-default">导出</a>
        </div>
    	<div class="joyin-form-wrap condition-area">
	        <form class="layui-form" role="form" id="ChbSubinfoBatchLog001_searchForm" access="enter">
	            <div class="layui-form-item">
	            	<div class="layui-inline layui-col-md4">
	                    <label class="layui-form-label form-lable">业务确认日期</label>
	                    <div class="layui-input-inline input-inline">
	                        <input id="busiConfirmDate" type="text"  name="busiConfirmDate"  class="layui-input form-input input-dateRangeSelect" 
	                        	placeholder="请选择日期区间" data-th-value="${DATE_START}+' - '+${DATE_END}"/>
	                    </div>
	                </div>
	                <div class="layui-inline layui-col-md4">
	                    <label class="layui-form-label form-lable">文件类别</label>
	                    <div class="layui-input-inline input-inline">
	                        <select id="fileType" name="fileType" class="layui-input form-input input-select" data-th-data-result='${SVR_FILE_TYPE}' placeholder="请选择" 
	                        	data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true" initvalue="01">
	                        </select>
	                    </div>
	                </div>
	                <div class="layui-inline layui-col-md4">
	                    <label class="layui-form-label form-lable">处理状态</label>
	                    <div class="layui-input-inline input-inline">
	                        <select id="dealStatus" name="dealStatus" class="layui-input form-input input-select" data-th-data-result='${SVR_DEAL_STATUS}' placeholder="请选择" 
	                        	data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true">
	                        </select>
	                    </div>
	                </div>
	            </div>
	            <div class="layui-form-item">
	            	<div class="layui-inline layui-col-md4">
	                    <label class="layui-form-label form-lable">操作日期</label>
	                    <div class="layui-input-inline input-inline">
	                        <input id="queryDate" type="text"  name="queryDate"  class="layui-input form-input input-dateRangeSelect" placeholder="请选择日期区间" 
	                        	data-th-value="${OPERATE_DATE_START}+' - '+${OPERATE_DATE_END}"/>
	                    </div>
	                </div>
	                <div class="layui-inline layui-col-md4">
	                    <label class="layui-form-label form-lable">操作人</label>
	                    <div class="layui-input-inline input-inline">
	                        <select id="operator" name="operator" class="layui-input form-input input-select" data-th-data-result='${userList}' placeholder="请选择" 
	                        	data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true">
	                        </select>
	                    </div>
	                </div>
	            </div>
	        </form>
        </div>
        <div>
            <table class="layui-table" id="ChbSubinfoBatchLog001"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/report/system/subinfobatchlog/ChbSubinfoBatchLog001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
