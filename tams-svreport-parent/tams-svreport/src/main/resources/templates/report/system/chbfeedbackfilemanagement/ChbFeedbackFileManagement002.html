<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{ChbFeedbackFileManagement002}">中债报送信息反馈匹配</title>
    <style>
        .form-lable{
            width: 26%;
        }
        .layui-btn-disabled{
            background: #e1f0ff!important;
            color: #333;
        }
        th[data-field^='reg']{
            background:#ffd3a8;
        }
        th[data-field='keyCode']{
            background:#ffd3a8;
        }
        th[data-field='fileInfo'],th[data-field='regInfo']{
            text-align: center;
        }
        .form-search-btns{
            display: none;
        }
        .joyin-form-wrap{
            background: none;
            padding: 0px;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area" export="false">
            <a id="ChbFeedbackFileManagement002_btn_handle" class="layui-btn layui-btn-sm btn-default"  style="display: none"
               th:classappend="${entity.matchedFlag == MATCHED_SUCCESS} ? '' : 'layui-btn-disabled'">
                <i class="iconfont icon-hand"></i>文件处理
            </a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area" line="8">
            <form class="layui-form" filter='false' id="searchForm" style="padding-bottom: 0px;">
                <div style="display: inline-block;background: #e3f1ff;height: 155px;width: 500px;padding-top: 5px;">
                    <div><label class="layui-form-label form-lable" style="font-weight: bold;">文件明细信息</label></div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md12">
                            <label class="layui-form-label form-lable">反馈文件明细数</label>
                            <div class="layui-input-inline input-inline">
                                <input id="feedbackFileNum" name="feedbackFileNum" class="layui-input form-input input-lenovoselect"
                                       placeholder="请输入关键词" data-th-Value="${entity.feedbackFileNum}" type="text"
                                       data-th-placeholder="#{SysCommon.placeholder}" disabled="disabled">
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md12">
                            <label class="layui-form-label form-lable">中债通过数</label>
                            <div class="layui-input-inline input-inline">
                                <input id="chbCorrectNum" name="chbCorrectNum" class="layui-input form-input input-lenovoselect"
                                       placeholder="请输入关键词" data-th-Value="${entity.chbCorrectNum}" type="text"
                                       data-th-placeholder="#{SysCommon.placeholder}" disabled="disabled">
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md12">
                            <label class="layui-form-label form-lable">中债退回数</label>
                            <div class="layui-input-inline input-inline">
                                <input id="chbErrorNum" name="chbErrorNum" class="layui-input form-input input-lenovoselect"
                                       placeholder="请输入关键词" data-th-Value="${entity.chbErrorNum}" type="text"
                                       data-th-placeholder="#{SysCommon.placeholder}" disabled="disabled">
                            </div>
                        </div>
                    </div>
                </div>
                <div style="display: inline-block;background: #eff6e8;height: 155px;width: 500px;margin-left: 30px;padding-top: 5px;">
                    <div><label class="layui-form-label form-lable" style="font-weight: bold;">登记表匹配结果信息</label></div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md12">
                            <label class="layui-form-label form-lable">登记表匹配明细数</label>
                            <div class="layui-input-inline input-inline">
                                <input id="regMatchNum" name="regMatchNum" class="layui-input form-input input-lenovoselect"
                                       placeholder="请输入关键词" data-th-Value="${entity.regMatchNum}" type="text"
                                       data-th-placeholder="#{SysCommon.placeholder}" disabled="disabled">
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md12">
                            <label class="layui-form-label form-lable">登记表异常明细数</label>
                            <div class="layui-input-inline input-inline">
                                <input id="regErrorNum" name="regErrorNum" class="layui-input form-input input-lenovoselect"
                                       placeholder="请输入关键词" data-th-Value="${entity.regErrorNum}" type="text"
                                       data-th-placeholder="#{SysCommon.placeholder}" disabled="disabled">
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md12">
                            <label class="layui-form-label form-lable">登记表发送中明细数</label>
                            <div class="layui-input-inline input-inline">
                                <input id="regSendingNum" name="regSendingNum" class="layui-input form-input input-lenovoselect"
                                       placeholder="请输入关键词" data-th-Value="${entity.regSendingNum}" type="text"
                                       data-th-placeholder="#{SysCommon.placeholder}" disabled="disabled">
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md12">
                            <label class="layui-form-label form-lable">登记表其他状态明细数</label>
                            <div class="layui-input-inline input-inline">
                                <input id="regOthersNum" name="regOthersNum" class="layui-input form-input input-lenovoselect"
                                       placeholder="请输入关键词" data-th-Value="${entity.regOthersNum}" type="text"
                                       data-th-placeholder="#{SysCommon.placeholder}" disabled="disabled">
                            </div>
                        </div>
                    </div>
                </div>
                <div style="display: inline-block;background: #f5f5f5;width: 1030px;margin-top:5px;padding-bottom: 5px;">

                    <div class="layui-form-item">
                        <label class="layui-form-label form-lable"
                               style="width: 11.9%;">匹配结果概述</label>
                        <div class="layui-input-inline input-inline"
                             style="width: 86% !important;">
                                            <textarea type="text" class="layui-textarea" id="matchResultMsg"
                                                      name="matchResultMsg" required placeholder="请输入内容"
                                                      data-th-placeholder="#{SysCommon.placeholder}" disabled="disabled"
                                                      data-th-text="${entity?.matchResultMsg}" maxlength="1024"></textarea>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="ChbFeedbackFileTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
            var entity = /*[[${entity}]]*/'';
            var MATCHED_SUCCESS = /*[[${MATCHED_SUCCESS}]]*/'';
        </script>
        <script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/report/system/chbfeedbackfilemanagement/ChbFeedbackFileManagement002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
