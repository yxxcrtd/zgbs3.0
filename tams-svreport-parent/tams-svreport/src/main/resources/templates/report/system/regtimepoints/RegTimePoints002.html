<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
    <meta charset="utf-8">
    <title data-th-text="#{RegTimePoints002}">监管报送时点维护</title>
    <link rel="stylesheet" type="text/css" data-th-href="@{/css/report/report.css}">
</head>

<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <input hidden type="text" id="seqno" name="seqno" data-th-value="${entity?.seqno}" style="display:none;">
        <div class="layui-form-item">
            <div id="editOrNew" class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable">报表名称</label>
                <div class="layui-input-inline input-inline">
                    <input disabled type="text" id="reportCode" name="reportCode" class="layui-input form-input" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.reportCode}" >
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div id="editOrNew" class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable">细分类</label>
                <div class="layui-input-inline input-inline">
                    <input disabled type="text" id="typeDetail" name="typeDetail" class="layui-input form-input" placeholder="" data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.typeDetail}" >
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable">报送说明要求</label>
                <div class="layui-input-inline input-inline">
                    <input disabled type="text" id="submitRequire" name="submitRequire" class="layui-input form-input" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.submitRequire}"  >
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable">行内报送时点要求</label>
                <div class="layui-input-inline input-inline">
                    <input type="number" id="submitPointBond" name="submitPointBond" class="layui-input form-input" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.submitPointBond}" required>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable">监管报送时点要求</label>
                <div class="layui-input-inline input-inline">
                    <input type="number" id="submitPointBank" name="submitPointBank" class="layui-input form-input" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.submitPointBank}" required>
                </div>
            </div>
        </div>

        <div class="layui-col-md11" style="margin:50px;">
            <div class="text-center"> <a id="RegTimePoints002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.submit}">提交</a> <a id="RegTimePoints002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a> </div>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">

    </script>
    <script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/report/system/regtimepoints/regTimePoints002.js}" type="text/javascript"></script>
</div>
</body>
</html>
