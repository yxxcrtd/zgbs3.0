<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{SysInstRegBankCode001}">机构登记银行代码管理</title>
</head>
<body>
    <div class="container" layout:fragment="content">
        <div class="form-button-area">
            <a id="SysInstRegBankCode001_btn_add" class="layui-btn layui-btn-sm btn-create">新建</a>
            <a id="SysInstRegBankCode001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}">删除</a>
            <a id="SysInstRegBankCode001_btn_import" class="layui-btn layui-btn-sm btn-create">导入</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" role="form" id="SysInstRegBankCode001_searchForm" access="enter">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md3">
                    <label class="layui-form-label form-lable">机构代码</label>
                    <div class="layui-input-inline input-inline">
                        <select id="SysInstRegBankCode001_orgCode" name="orgCode" class="input-select" data-th-data-url="@{/svreport/system/proregistcodemanage/ProRegistCodeManage001/getInstitutionCode}" placeholder="请选择" allowClear="true" multiple="multiple"></select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md3">
			        <label class="layui-form-label form-lable">中债登记机构代码</label>
			        <div class="layui-input-inline input-inline">
			          <input type="text" id="SysInstRegBankCode001_registBankCode" name="registBankCode" class="layui-input form-input" placeholder="请输入内容">
			        </div>
                </div>
            </div>
        </form>
        </div>
        <div>
            <table class="layui-table" id="SysInstRegBankCode001_table001"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/report/system/instregbankcode/SysInstRegBankCode001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
