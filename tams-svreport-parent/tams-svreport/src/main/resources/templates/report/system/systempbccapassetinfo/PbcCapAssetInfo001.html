<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="utf-8">
    <title data-th-text="#{PbcCapAssetInfo001}">人行资金信托代码管理</title>
    <link rel="stylesheet" type="text/css"
          data-th-href="@{/css/report/report.css}">
    <style>
        .input-checkbox .layui-form-checkbox {
            margin-top: 0;
            height: 28px;
        }
    </style>
</head>

<body>
<div layout:fragment="content">
    <div class="form-button-area" filter="false">
        <a id="PbcCapAssetInfo001_btn_delete" class="layui-btn layui-btn-sm btn-delete btn-default" data-th-text="#{SysCommon.delete}">删除</a>
        <a id="PbcCapAssetInfo001_btn_import" class="layui-btn layui-btn-sm btn-import btn-default">导入</a>
    </div>


    <div class="joyin-form-wrap condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md3">
                    <label class="layui-form-label form-lable">行内资产/负债编码</label>
                    <div class="layui-input-inline input-inline">
                        <select id="PbcCapAssetInfo001_assetCode"
                                name="getAssetCode"
                                data-th-data-url='@{/svreport/system/systempbccapassetinfo/PbcCapAssetInfo001/getAssetCode}'
                                data-th-data-formatoption=true
                                data-th-data-parentids="getAssetCode" class="input-select"
                                placeholder="请选择"
                                data-th-placeholder="#{SysCommon.selectplaceholder}"
                                allowClear="true" multiple="multiple">
                        </select>
                    </div>
                </div>

                <div class="layui-inline layui-col-md3">
                    <label class="layui-form-label form-lable">资产起息日</label>
                    <div class="layui-input-inline input-inline">
                        <input id="PbcCapAssetInfo001_planStartDate" type="text"  name="timeControl"  class="layui-input form-input input-dateRangeSelect" placeholder="请选择日期区间" />
                    </div>
                </div>
                <div class="layui-inline layui-col-md3">
                    <label class="layui-form-label form-lable">人行资金信托代码</label>
                    <div class="layui-input-inline input-inline">
                        <select id="PbcCapAssetInfo001_pobcassetid"
                                name="getAssetCode"
                                data-th-data-url='@{/svreport/system/systempbccapassetinfo/PbcCapAssetInfo001/getPobCasSeTidList}'
                                data-th-data-formatoption=true
                                data-th-data-parentids="getPobCasSeTidList" class="input-select"
                                placeholder="请选择"
                                data-th-placeholder="#{SysCommon.selectplaceholder}"
                                allowClear="true" multiple="multiple">
                        </select>
                    </div>
                </div>


            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md3">
                    <label class="layui-form-label form-lable">资产到期日</label>
                    <div class="layui-input-inline input-inline">
                        <input id="PbcCapAssetInfo001_planEndDate" type="text"  name="timeControl"  class="layui-input form-input input-dateRangeSelect" placeholder="请选择日期区间" />
                    </div>
                </div>
            </div>
            <!--<div id="selectedColumns" class="layui-form-item"></div>-->
        </form>
    </div>
    <table class="layui-table"
           id="PbcCapAssetInfo001_PbcCapAssetInfo001"></table>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var isFromMain=/*[[${isFromMain}]]*/'01';
        var YES = /*[[${YES}]]*/'Y'; // 数据字典.是否_是
        var isSendStatusTableShow = [[${isEleShow['send_status_table']}]];
        var isSendStatusTableLinkShow = [[${isEleShow['send_status_table_link']}]];
        var isSendRemarkTableShow = [[${isEleShow['send_remark_table']}]];
    </script>
    <script data-th-src="@{/js/report/jquery.validate.js}"
            type="text/javascript"></script>
    <script data-th-src="@{/js/report/joyinvalid.js}"
            type="text/javascript"></script>
    <script data-th-src="@{/js/report/report-common.js}"
            type="text/javascript"></script>
    <script
            data-th-src="@{/js/report/system/systempbccapassetinfo/PbcCapAssetInfo001.js}"
            type="text/javascript"></script>
</div>
</body>
</html>
