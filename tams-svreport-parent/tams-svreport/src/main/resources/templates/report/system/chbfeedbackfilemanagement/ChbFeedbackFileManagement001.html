<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{ChbFeedbackFileManagement001}">中债报送信息反馈</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area" export="false">
            <a id="ChbFeedbackFileManagement001_btn_match" class="layui-btn layui-btn-sm btn-default">报送信息匹配</a>
            <a id="ChbFeedbackFileManagement001_btn_backup" class="layui-btn layui-btn-sm btn-default">文件移除备份</a>
        </div>
        <div class="joyin-form-wrap condition-area">
            <form class="layui-form" filter='false' id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">报送类型</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="reportEtrType"
                                   name="reportEtrType"
                                   data-th-initValue="${reportEtrType}"
                                   class="layui-input form-input input-select"
                                   data-th-data-result="${SVR_REPORT_CODE}" />
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">报送流水号</label>
                        <div class="layui-input-inline input-inline">
                            <input id="repSeqNo" name="repSeqNo" class="layui-input form-input input-lenovoselect"
                                   placeholder="请输入关键词" data-th-Value="${repSeqNo}" type="text"
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">处理状态</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="handleStatus"
                                   name="handleStatus"
                                   data-th-initValue="${handleStatus}"
                                   class="layui-input form-input input-select"
                                   data-th-data-result="${FILE_HANDLE_STATUS}" />
                        </div>
                    </div>

                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">报文发送时间</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="reportSendDate" name="reportSendDate"
                                   data-th-value='${reportSendDate}'
                                   class="layui-input form-input input-dateSelect" />
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">报文接收时间</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="reportAcceptDate" name="reportAcceptDate"
                                   data-th-value='${reportAcceptDate}'
                                   class="layui-input form-input input-dateSelect" />
                        </div>
                    </div>
                </div>
              </form>
           </div>
        <div>
            <table class="layui-table" id="ChbFeedbackFileTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
            var SEARCH_ON_INIT = /*[[${searchOnInit}]]*/'N';
        </script>
        <script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/report/system/chbfeedbackfilemanagement/ChbFeedbackFileManagement001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
