<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{ReportStatusInfo001}">中债报送信息反馈</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area" export="false"></div>
        <div class="joyin-form-wrap condition-area">
            <form class="layui-form" filter='false' id="searchForm">
                <input type="hidden" id="registSeqNo" name="registSeqNo" data-th-value="${registSeqNo}">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">报送类型</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="repType"
                                   name="repType"
                                   data-th-initValue="${repType}"
                                   class="layui-input form-input input-select"
                                   data-th-data-result="${SVR_REPORT_CODE}" />
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">报送状态</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="repStatus"
                                   name="repStatus"
                                   data-th-initValue="${repStatus}"
                                   class="layui-input form-input input-select"
                                   data-th-data-result="${SUBMIT_STATUS}" />
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">反馈状态</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="feedbackStatus"
                                   name="feedbackStatus"
                                   data-th-initValue="${feedbackStatus}"
                                   class="layui-input form-input input-select"
                                   data-th-data-result="${SUBMIT_FEEDBACK_STATUS}" />
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">报送日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="reportDate" name="reportDate"
                                   data-th-value="${sysDate}?${sysDate}+' - '+${sysDate}:''"
                                   class="layui-input form-input input-dateRangeSelect" />
                        </div>
                    </div>
                </div>
              </form>
           </div>
        <div>
            <table class="layui-table" id="ReportStatusTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
            var SEARCH_ON_INIT = /*[[${searchOnInit}]]*/'N';
            var dataList = /*[[${dataList}]]*/[];
        </script>
        <script data-th-src="@{/js/report/jquery.validate.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/report/joyinvalid.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/report/system/reportstatusinfo/ReportStatusInfo001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
