<!DOCTYPE html>

    layout:decorate="~{layout/default}">
<head>
<title>产品登记编码新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
                                           
                                <div class="layui-form-item">

                                     <div class="form-inline-wrap">
                                       <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{ProRegistCodeManage003.finprodMarketId}">产品代码</label>
                                     <div class="layui-input-inline input-inline">
                                   <input id="prodId" name="prodId" class="layui-input form-input input-lenovoselect" 
                                              data-th-data-parentids="orgCode" data-th-data-code="prdCode" placeholder="请输入"
                                              data-th-data-url="@{/svreport/system/proregistcodemanage/ProRegistCodeManage003/getProdInfo}"
                                              data-idfield="code" data-keyfield="code"  data-th-value="${entity?.prodId}" 
                                               data-effectivefieldsalias='{"code":"产品代码","shortName":"产品名称"}' 
                                               data-showindex = 'false'
                                               required="required">
                                       </div>
                                       </div>
                                    
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
												data-th-text="#{ProRegistCodeManage003.finprodName}">产品名称</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" class="layui-input form-input" id="prodName"
                                                name="prodName" placeholder="请输入内容" 
                                                data-th-placeholder="#{SysCommon.placeholder}" 
                                                data-th-value="${entity?.prodName}" maxlength="60">
                                        </div>
                                    </div>                                                                        
                                </div>
                                <div class="layui-form-item">
                                     <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
												data-th-text="#{ProRegistCodeManage003.prodRegistCode}">产品登记编码</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" class="layui-input form-input" id="regCode"
                                                name="regCode" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" required="required"
                                                data-th-value="${entity?.regCode}" maxlength="60">
                                        </div>
                                    </div>   
                                     <div class="form-inline-wrap">
							              <label class="layui-form-label form-label-wrap"
								                     data-th-text="#{ProRegistCodeManage003.repOperateMode}">产品运作模式</label>
							               <div class="layui-input-inline input-inline">
								       <select th:id="operateMode"
									   th:name="operateMode"
									   class="layui-input form-input input-select"
									   data-th-data-result="${SVR_OPERATEMODE_DECLARE}"
									   placeholder="请输入内容"
									   data-th-initValue="${entity?.operateMode}"
									  data-th-placeholder="#{SysCommon.placeholder}" 
							     	</select>
							    </div>                             
                            </div>  
                          </div>                            
                                 <div class="layui-form-item">
                                  <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
												data-th-text="#{ProRegistCodeManage003.finprodName}">产品名称</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" style="visibility:hidden;" class="layui-input form-input" id="prodName"
                                                name="prodName" placeholder="请输入内容" 
                                                data-th-placeholder="#{SysCommon.placeholder}" 
                                                data-th-value="${entity?.prodName}" maxlength="60">
                                        </div>
                                    </div>  
                                       <!-- <div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinProductBuild002.vdate}">起息日</label>

												<input type="text" name="vdate"
													id="vdate" 
													class="layui-input form-input input-dateSelect"
													data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'
													>
											</div>
										</div>
                                    
                                     <div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"

											<div class="layui-input-inline input-inline">
												<input type="text" name="mdate"
													id="mdate"  
													class="layui-input form-input input-dateSelect"
													data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
													>
											</div>
										</div>                 -->  
                                </div> 
                               
                                                   
                <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 40px 0 30px 0;">
                    <div class="text-center">
                        <a id="ProRegistCodeManage003_btn_save" class="layui-btn layui-btn-sm btn-save"
                           data-th-text="#{SysCommon.save}">保存</a>
                        <a id="ProRegistCodeManage003_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                           data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="ProRegistCodeManage003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                           data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div layout:fragment="script">       
        <script data-th-src="@{/js/report/system/proregistcodemanage/ProRegistCodeManage003.js}" type="text/javascript"></script>
    </div>
</body>
</html>
