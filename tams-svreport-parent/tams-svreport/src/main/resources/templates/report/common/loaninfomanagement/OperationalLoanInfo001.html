<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/default}">
<head>
	<title data-th-text="#{OperationalLoanInfo001}">贷款明细信息维护</title>
</head>

<body>
<div layout:fragment="content">
	<div class="form-button-area">
		<a id="OperationalLoanInfo001_btn_add" class="layui-btn layui-btn-sm btn-import btn-default">新建</a>
		<a id="OperationalLoanInfo001_btn_delete" class="layui-btn layui-btn-sm btn-delete btn-default">删除</a>
		<a id="OperationalLoanInfo001_btn_import" class="layui-btn layui-btn-sm btn-import btn-default">导入</a>
	</div>
	<div class="joyin-form-wrap condition-area">
		<form class="layui-form" id="searchForm">
			<div class="layui-form-item" style="display:none">
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">选择字段</label>
					<div class="layui-input-inline input-inline">
						<select type="text" id="columnType" name="columnType"
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								allowClear="true"  multiple lay-filter='multi'
								onchange="showSelectColumns()" ></select>
					</div>
				</div>
				<div class="layui-inline layui-col-md4" style="visibility: hidden;">
					<label class="layui-form-label form-lable">数据源表</label>
					<div class="layui-input-inline input-inline">
						<select id="baseTableName" name="baseTableName"
								class="layui-input form-input input-select"
								data-th-formatoption="false"
								data-th-data-result='${tableNames}' allowClear="true"
								data-th-placeholder="#{SysCommon.selectplaceholder}"
								onchange="getColumns()"></select>
						<input type="hidden" th:value="${tableId}" id="interfType"/>
					</div>
				</div>
				<!-- <div class="layui-inline layui-col-md4"
                    style="visibility: hidden;">
                    <label class="layui-form-label form-lable"></label>
                    <select class="layui-input form-input input-select"></select>
                    <div class="layui-input-inline input-inline">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4"
                    style="visibility: hidden;">
                    <label class="layui-form-label form-lable"></label>
                    <select class="layui-input form-input input-select"></select>
                    <div class="layui-input-inline input-inline">
                    </div>
                </div> -->
			</div>
			<div  id="selectedColumns" >
			</div>
		</form>
	</div>
	<table class="layui-hide" id="dataTable" lay-filter="dataTable"></table>
</div>
<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">
		var isFromMain = /*[[${isFromMain}]]*/'';
		var interfType = /*[[${interfType}]]*/'';
		var searchDataStart = /*[[${searchDataStart}]]*/'';
		var searchDataEnd = /*[[${searchDataEnd}]]*/'';
		var filterId = /*[[${filterId}]]*/'';
	</script>
	<script data-th-src="@{/js/report/common/loaninfomanagement/OperationalLoanInfo001.js}" type="text/javascript"></script>
	<script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
	<script type="text/html" id="buttonDemo">
		<a class="layui-btn layui-btn-xs" lay-event="edit" title="编辑" style="background-color:white"><i class="layui-icon">&#xe642;</i></a>
		<a class="layui-btn layui-btn-xs" lay-event="del" title="删除" style="background-color:white"><i class="layui-icon">&#xe640;</i></a>
	</script>
</div>

</body>

</html>
