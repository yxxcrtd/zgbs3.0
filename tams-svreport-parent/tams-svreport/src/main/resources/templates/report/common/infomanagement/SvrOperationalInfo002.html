<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{SvrOperationalInfo002}">待维护表详情</title>
<link rel="stylesheet" type="text/css"
	data-th-href="@{/css/report/report.css}">
<style type="text/css">
.layui-btn-sm {
	height: 30px;
	line-height: 30px;
	padding: 0 5px;
	font-size: 12px;
}
</style>
</head>
<body>
	<div layout:fragment="content">
		<div class="form-button-area">
			<a id="SvrOperationalInfo002_btn_add"
				class="layui-btn layui-btn-sm btn-create">新建</a>
		</div>
		<form class="layui-form" role="form" id="SvrOperationalInfo002_searchForm" access="enter">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md3">
			        <label class="layui-form-label form-lable">数据源表</label>
			        <div class="layui-input-inline input-inline">
			          <input type="text" id="SvrOperationalInfo002_tableName" name="tableName" class="layui-input form-input" placeholder="请输入内容">
			        </div>
                </div>
                 <div class="layui-inline layui-col-md3">
			        <label class="layui-form-label form-lable">接口名称</label>
			        <div class="layui-input-inline input-inline">
			          <input type="text" id="SvrOperationalInfo002_dataObject" name="dataObject" class="layui-input form-input" placeholder="请输入内容">
			        </div>
                </div>
                <div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">数据状态</label>
					<div class="layui-input-inline input-inline">
						<select  type="text" id="status" name="status"
							class="layui-input form-input input-select"
							data-th-formatoption="false" data-th-data-result='${statusList}'
							data-th-placeholder="#{SysCommon.selectplaceholder}" 
							multiple
							lay-filter='multi'></select>
					</div>
				</div>
				<button id="searchTable" type="button" class="layui-btn">查询</button>
            </div>
        </form>
		<div class="layui-table" id="dataTable"></div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			
		</script>
		<script data-th-src="@{/js/report/jquery.validate.js}"
			type="text/javascript"></script>
		<script data-th-src="@{/js/report/joyinvalid.js}"
			type="text/javascript"></script>
		<script data-th-src="@{/js/report/report-common.js}"
			type="text/javascript"></script>
		<script
			data-th-src="@{/js/report/common/infomanagement/SvrOperationalInfo002.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
