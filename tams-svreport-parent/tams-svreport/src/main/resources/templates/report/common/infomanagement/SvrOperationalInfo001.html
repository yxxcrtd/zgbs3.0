<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
	

<head>
<title data-th-text="#{SvrOperationalInfo001}">业务数据维护</title>
<style>
.layui-icon-loading:before {content: "\e63d";display: none;}
</style>
</head>

<body>

	<div layout:fragment="content">
		<div class="layui-col-md3" style="width: 22%;margin-top:-5px">
            <div class="joyin-form-wrap joyin-form-container">
                <form class="layui-form" id="schemeForm">
                    <div class="layui-form-item">
                        <input type="text" id="searchKey" name="searchKey"
                            class="layui-input form-input input-fuzzy-text" placeholder="请输入方案库关键字">
                    </div>
                </form>
            </div>
            <div class="layui-collapse">
                <div class="layui-colla-item" style="padding: 0">
                    <div class="layui-row layui-colla-title" style="margin: 0; line-height: 30px;height:30px;">
                        <div class="layui-col-md6">
                            <span>方案库</span>
                        </div>
                        <div class="layui-col-md3 layui-col-md-offset3" style="visibility: hidden;" >
                            <button type="button" class="layui-btn layui-btn-sm btn-create"  style="margin-top: -3px;"></button>
                        </div>
                    </div>
                    <!--左表格  -->
                    <div class="layui-colla-content layui-show report-colla-wrap" style="padding: 0">
                        <table class="layui-table" id="indexIdTable"></table>
                    </div>
                </div>
            </div>
        </div>
		<div class="layui-col-md9" style="width: 78%;margin-top: -9px;">
			<div class="form-button-area">
			<a id="SvrOperationalInfo001_btn_resource"
					class="layui-btn layui-btn-sm btn-default">数据源表配置</a>
				<a id="SvrOperationalInfo001_btn_save"
					class="layui-btn layui-btn-sm btn-save">保存方案</a> 
					<a id="SvrOperationalInfo001_btn_delete" class="layui-btn layui-btn-sm btn-delete btn-default" >删除</a>
				<a id="SvrOperationalInfo001_btn_import"
					class="layui-btn layui-btn-sm btn-import btn-default">导入</a>
			</div>
			<div class="joyin-form-wrap condition-area">
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-md4">
							<label class="layui-form-label form-lable">数据源表</label>
							<div class="layui-input-inline input-inline">
								<select id="baseTableName" name="baseTableName"
									class="layui-input form-input input-select"
									data-th-formatoption="false"
									data-th-data-result='${tableNames}' allowClear="true"
									data-th-placeholder="#{SysCommon.selectplaceholder}"
									onchange="getColumns()"></select>
									<input type="hidden" th:value="${tableId}" id="interfType"/>
							</div>
						</div>

						<div
							class="layui-inline layui-col-md4">
							<label class="layui-form-label form-lable">选择字段</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="columnType" name="columnType" 
									class="layui-input form-input input-select"
									data-th-placeholder="#{SysCommon.placeholder}"
									allowClear="true"  multiple lay-filter='multi'
									onchange="showSelectColumns()" ></select>
							</div>
						</div>
						<!-- <div
							class="layui-inline layui-col-md4">
							<label class="layui-form-label form-lable">查询结果字段</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="resultColumn" name="resultColumn" 
									class="layui-input form-input input-select"
									data-th-placeholder="#{SysCommon.placeholder}"
									allowClear="true"  multiple lay-filter='multi'
									onchange="showResultColumns()" ></select>
							</div>
						</div> -->
						<div
							class="layui-inline layui-col-md4"
							style="visibility: hidden;">
							<label class="layui-form-label form-lable"></label>
							<select class="layui-input form-input input-select"></select>
							<div class="layui-input-inline input-inline">
							</div>
						</div>
						<div
							class="layui-inline layui-col-md4"
							style="visibility: hidden;">
							<label class="layui-form-label form-lable"></label>
							<select class="layui-input form-input input-select"></select>
							<div class="layui-input-inline input-inline">
							</div>
						</div>
					</div>
					<div  id="selectedColumns" class="layui-form-item" >
					
					</div>
				</form>
			</div>

				<table class="layui-hide" id="dataTable" lay-filter="dataTable"></table>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
		var isFromMain = /*[[${isFromMain}]]*/'';
	    var interfType = /*[[${interfType}]]*/'';
		var searchDataStart = /*[[${searchDataStart}]]*/'';
		var searchDataEnd = /*[[${searchDataEnd}]]*/'';
		</script>
		<script
			data-th-src="@{/js/report/common/infomanagement/SvrOperationalInfo001.js}" type="text/javascript"></script>
		<script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
	</div>

</body>

</html>
