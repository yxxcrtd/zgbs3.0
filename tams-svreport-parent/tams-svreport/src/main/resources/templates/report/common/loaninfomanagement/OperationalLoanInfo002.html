<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/default}">
<head>
	<title data-th-text="#{OperationalLoanInfo002}">贷款明细信息新建</title>
</head>
<body>
<div layout:fragment="content">
	<form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
		<!-- 隐藏字段 金融产品代码 -->
		<input type="text" name="assetUuid" data-th-value='${assetUuid}' hidden>
		<div class="layui-form-item">
			<div class="layui-inline layui-col-md6">
				<label class="layui-form-label form-label-wrap">资产代码</label>
				<div class="layui-input-inline input-inline">
					<select id="assetCode" name="assetCode" class="input-select" placeholder="请选择"
							data-th-data-url='@{/svreport/loaninfomanagement/OperationalLoanInfo002/queryPbcAssetCode}'
							data-th-initValue='${entity?.assetCode}' data-th-data-formatoption=true
							data-th-placeholder="#{SysCommon.selectplaceholder}" allowClear="true" required>
					</select>
				</div>
			</div>
			<div class="layui-inline layui-col-md6">
				<label class="layui-form-label form-label-wrap">资产类型</label>
				<div class="layui-input-inline input-inline">
					<select id="assetType" name="assetType"
							class="layui-input form-input input-select"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-initValue='${entity?.assetType}'
							data-th-data-result="${SVR_LOANS_ASSET_TYPE}"  disabled>
					</select>
				</div>
			</div>
		</div>
		<div id="syqDiv" style="display:none">
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.assetsInvest}">基础资产投向分类</label>
					<div class="layui-input-inline input-inline">
						<select id="assetsInvest" name="assetsInvest"
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-initValue='${entity?.assetsInvest}'
								data-th-data-result="${SVR_CUSTOMER_TYPE1}" multiple="multiple" required>
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.eachProportion}">各比例</label>
					<div class="layui-input-inline input-inline">
						<input type="text" name="eachProportion" id="eachProportion"
							   class="layui-input form-input"
							   placeholder="注：填写格式：10:20:70(冒号为英文半角标点，比例值相加等于100)"
							   data-th-value='${entity?.eachProportion}' required>
					</div>
				</div>
			</div>
		</div>
		<div id="loannDiv" style="display:none">
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.loansType}">贷款种类</label>
					<div class="layui-input-inline input-inline">
						<select id="loansType" name="loansType"
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-initValue='${entity?.loansType}'
								data-th-data-result="${SVR_LOAN_TYPE}" required>
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.loanTransferorId}">贷款转让方机构代码</label>
					<div class="layui-input-inline input-inline">
						<input type="text" name="loanTransferorId" id="loanTransferorId"
							   class="layui-input form-input"
							   data-th-placeholder="#{SysCommon.placeholder}"
							   data-th-value='${entity?.loanTransferorId}'>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.loanTransferorName}">贷款转让方机构名称</label>
					<div class="layui-input-inline input-inline">
						<input type="text" name="loanTransferorName" id="loanTransferorName"
							   class="layui-input form-input"
							   data-th-placeholder="#{SysCommon.placeholder}"
							   data-th-value='${entity?.loanTransferorName}'>
					</div>
				</div>
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.loanContractOrgId}">贷款合同原始发放机构代码</label>
					<div class="layui-input-inline input-inline">
						<input type="text" name="loanContractOrgId" id="loanContractOrgId"
							   class="layui-input form-input"
							   data-th-placeholder="#{SysCommon.placeholder}"
							   data-th-value='${entity?.loanContractOrgId}'>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.loanContractOrgName}">贷款合同原始发放机构名称</label>
					<div class="layui-input-inline input-inline">
						<input type="text" name="loanContractOrgName" id="loanContractOrgName"
							   class="layui-input form-input"
							   data-th-placeholder="#{SysCommon.placeholder}"
							   data-th-value='${entity?.loanContractOrgName}'>
					</div>
				</div>
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.loanContractOrgProvince}">贷款合同原始发放机构所在地(省)</label>
					<div class="layui-input-inline input-inline">
						<select name="loanContractOrgProvince" id="loanContractOrgProvince"
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-initValue='${entity?.loanContractOrgProvince}'
								data-th-data-result="${AREA_TYPE1}"
								childrenIds="loanContractOrgCity">
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.loanContractOrgCity}">贷款合同原始发放机构所在地(市)</label>
					<div class="layui-input-inline input-inline">
						<select name="loanContractOrgCity" id="loanContractOrgCity"
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-initValue='${entity?.loanContractOrgCity}'
								data-th-data-url="@{/svreport/loaninfomanagement/OperationalLoanInfo002/getLoanCities}"
								parentIds="loanContractOrgProvince" childrenIds="loanContractOrgCounty">
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.loanContractOrgCounty}">贷款合同原始发放机构所在地(县)</label>
					<div class="layui-input-inline input-inline">
						<select id="loanContractOrgCounty" name="loanContractOrgCounty"
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-initValue='${entity?.loanContractOrgCounty}'
								data-th-data-url="@{/svreport/loaninfomanagement/OperationalLoanInfo002/getLoanCounties}"
								parentIds="loanContractOrgCity">
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.borrowerType}">借款人类型</label>
					<div class="layui-input-inline input-inline">
						<select name="borrowerType" id="borrowerType"
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-initValue='${entity?.borrowerType}'
								data-th-data-result="${SVR_DEPT_TYPE}" required >
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.industryInfo}">行业信息</label>
					<div class="layui-input-inline input-inline">
						<select name="industryInfo" id="industryInfo"
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-initValue='${entity?.industryInfo}'
								data-th-data-result="${SVR_INDUSTRY_DOOR_CODE}" required>
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.borrowerNationality}">借款人国别</label>
					<div class="layui-input-inline input-inline">
						<select name="borrowerNationality" id="borrowerNationality"
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-initValue='${entity?.borrowerNationality}'
								data-th-data-result="${SVR_COUNTRY_AREA}">
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.borrowerProvince}">借款人地区(省)</label>
					<div class="layui-input-inline input-inline">
						<select name="borrowerProvince" id="borrowerProvince"
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-initValue='${entity?.borrowerProvince}'
								data-th-data-result="${AREA_TYPE1}"
								childrenIds="borrowerCity" >
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.borrowerCity}">借款人地区(市)</label>
					<div class="layui-input-inline input-inline">
						<select name="borrowerCity" id="borrowerCity"
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-initValue='${entity?.borrowerCity}'
								data-th-data-url="@{/svreport/loaninfomanagement/OperationalLoanInfo002/getBorrowerCities}"
								parentIds="borrowerProvince" childrenIds="borrowerCounty">
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.borrowerCounty}">借款人地区(县)</label>
					<div class="layui-input-inline input-inline">
						<select name="borrowerCounty" id="borrowerCounty"
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-initValue='${entity?.borrowerCounty}'
								data-th-data-url="@{/svreport/loaninfomanagement/OperationalLoanInfo002/getBorrowerCounties}"
								parentIds="borrowerCity">
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.borrowerId}">借款人代码</label>
					<div class="layui-input-inline input-inline">
						<input type="text" name="borrowerId" id="borrowerId"
							   class="layui-input form-input"
							   data-th-placeholder="#{SysCommon.placeholder}"
							   data-th-value='${entity?.borrowerId}' required>
					</div>
				</div>
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.enterpriseInvestorTypeFirst}">企业出资人经济成分（一级）</label>
					<div class="layui-input-inline input-inline">
						<select name="enterpriseInvestorTypeFirst" id="enterpriseInvestorTypeFirst"
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-initValue='${entity?.enterpriseInvestorTypeFirst}'
								data-th-data-result="${SVR_ECONOMIC_FIRST_LEVEL}"
								childrenIds="enterpriseInvestorTypeSec">
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.enterpriseInvestorTypeSec}">企业出资人经济成分（二级）</label>
					<div class="layui-input-inline input-inline">
						<select name="enterpriseInvestorTypeSec" id="enterpriseInvestorTypeSec"
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-initValue='${entity?.enterpriseInvestorTypeSec}'
								data-th-data-result="${SVR_ECONOMIC_SECOND_LEVEL}"
								parentIds="enterpriseInvestorTypeFirst" childrenIds="enterpriseInvestorTypeThird">
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.enterpriseInvestorTypeThird}">企业出资人经济成分（三级）</label>
					<div class="layui-input-inline input-inline">
						<select name="enterpriseInvestorTypeThird" id="enterpriseInvestorTypeThird"
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-initValue='${entity?.enterpriseInvestorTypeThird}'
								data-th-data-result="${SVR_ECONOMIC_THIRD_LEVEL}"
								parentIds="enterpriseInvestorTypeSec">
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.enterpriseScale}">企业规模</label>
					<div class="layui-input-inline input-inline">
						<select name="enterpriseScale" id="enterpriseScale"
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-initValue='${entity?.enterpriseScale}'
								data-th-data-result="${SVR_SCALE}">
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.loanBasisId}">贷款借据编码</label>
					<div class="layui-input-inline input-inline">
						<input type="text" name="loanBasisId" id="loanBasisId"
							   class="layui-input form-input"
							   data-th-placeholder="#{SysCommon.placeholder}"
							   data-th-value='${entity?.loanBasisId}'>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.loanPrdType}">贷款产品类别</label>
					<div class="layui-input-inline input-inline">
						<select name="loanPrdType" id="loanPrdType"
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-initValue='${entity?.loanPrdType}'
								data-th-data-result="${SVR_LOAN_PEOD_TYPE}" required>
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.loanActualInvest}">贷款实际投向</label>
					<div class="layui-input-inline input-inline">
						<select name="loanActualInvest" id="loanActualInvest"
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-initValue='${entity?.loanActualInvest}'
								data-th-data-result="${SVR_INDUSTRY_CATE_CODE}" required>
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.loanVdate}">贷款发放日期</label>
					<div class="layui-input-inline input-inline">
						<input type="text" name="loanVdate" id="loanVdate"
							   class="layui-input form-input input-dateSelect"
							   data-th-value='${#dates.format(entity?.loanVdate,"yyyy-MM-dd")}' required>
					</div>
				</div>
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.loanMdate}">贷款到期日期</label>
					<div class="layui-input-inline input-inline">
						<input type="text" name="loanMdate" id="loanMdate"
							   class="layui-input form-input input-dateSelect"
							   data-th-value='${#dates.format(entity?.loanMdate,"yyyy-MM-dd")}'
							   required>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.loanExtensionDueDate}">贷款展期到期日期</label>
					<div class="layui-input-inline input-inline">
						<input type="text" name="loanExtensionDueDate" id="loanExtensionDueDate"
							   class="layui-input form-input input-dateSelect"
							   data-th-value='${#dates.format(entity?.loanExtensionDueDate,"yyyy-MM-dd")}'>
					</div>
				</div>
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.rateFixed}">利率是否固定</label>
					<div class="layui-input-inline input-inline">
						<select name="rateFixed" id="rateFixed"
								class="layui-input form-input input-select"
								data-th-initValue='${entity?.rateFixed}'
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result="${SVR_INTEREST_TYPE}" required>
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.rateLevel}">利率水平(%)</label>
					<div class="layui-input-inline input-inline">
						<input type="text" name="rateLevel" id="rateLevel"
							   class="layui-input form-input text-number"
							   data-th-placeholder="#{SysCommon.placeholder}"
							   data-textrange="2" data-th-value='${entity?.rateLevel}' required>
					</div>
				</div>
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.loanGuaranteeMode}">贷款担保方式</label>
					<div class="layui-input-inline input-inline">
						<select name="loanGuaranteeMode" id="loanGuaranteeMode"
								class="layui-input form-input input-select"
								data-th-initValue='${entity?.loanGuaranteeMode}'
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result="${SVR_LOAN_GUA_TYPE}" required>
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.loanQuality}">贷款质量</label>
					<div class="layui-input-inline input-inline">
						<select name="loanQuality" id="loanQuality"
								class="layui-input form-input input-select"
								data-th-initValue='${entity?.loanQuality}'
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result="${SVR_LOAN_QUALITY}">
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.loanState}">贷款状态</label>
					<div class="layui-input-inline input-inline">
						<select name="loanState" id="loanState"
								class="layui-input form-input input-select"
								data-th-initValue='${entity?.loanState}'
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result="${SVR_LOAN_STATUS}">
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.loanTransferorRate}">贷款转让折扣率(%)</label>
					<div class="layui-input-inline input-inline">
						<input type="text" name="loanTransferorRate" id="loanTransferorRate"
							   class="layui-input form-input text-number"
							   data-th-placeholder="#{SysCommon.placeholder}"
							   data-textrange="2" data-th-value='${entity?.loanTransferorRate}'>
					</div>
				</div>
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{OperationalLoanInfo002.origCcy}">原始合同币种代码</label>
					<div class="layui-input-inline input-inline">
						<select name="origCcy" id="origCcy"
								class="layui-input form-input input-select"
