<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title>About</title>
<style type="text/css">
    .edition-container{
        background: #2e2d2d;
    }
    .edition-wrap{
        background: url("[[@{/public/images/copy-bg.png}]]");
        background-repeat:no-repeat;
        background-size:100% 100%;
        -moz-background-size:100% 100%;
        height: 458px;
    }
    .edition-wrapper{
        padding-top: 80px;
    }
    .edition-logo{
        text-align: center;
        margin-bottom: 0;
    }
    .edition-title{
        color: #006CD8;
        font-size: 30px;
        margin: 25px 0;
        text-align: center;
    }
    .edition-type{
        font-size: 14px;
        color: #000;
        padding-top: 10px;
    }
    .messageContainer{
    	font-size:20px;
    	padding-left:25%;
    	padding-top:30px;
    }
    .message-line{
    	padding-bottom:10px;
    }
    .right-text{
      position:absolute;
      left:60%;
    }
</style>
</head>
<body>
    <div layout:fragment="content">
        <div class="edition-container">
            <div class="edition-wrap">
                <div class="edition-wrapper">
                      <p class="edition-logo"><img data-th-src="@{${logoAbout}}" /></p> 
                      <h1 class="edition-title" data-th-text="#{aplication.title}">系统管理</h1>
                      <div class="messageContainer">
                      	<p class = "message-line">
                      	<span data-th-text="#{aplication.systemversion}+':'"></span><span data-th-text="${systemVersion}" class="right-text"></span>
                      	</p>
                      	<p class = "message-line">
                      	<span data-th-text="#{aplication.customerName}+':'"></span><span data-th-text="${customerName}" class="right-text"></span>
                      	</p>
                      	<p  class = "message-line">
                      	<span data-th-text="|#{aplication.supportedBrowsers}:|"></span><span data-th-text="|${lastChromeVersion}|" class="right-text"></span>
                      	</p>
                      </div>
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script>
        	$('.edition-container').parents('.layui-fluid').removeClass('layui-fluid');
        </script>
    </div>
</body>

</html>
