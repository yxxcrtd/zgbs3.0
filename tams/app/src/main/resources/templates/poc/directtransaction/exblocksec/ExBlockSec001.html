<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>新增报价</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm" style="background: #fff;">
        <div class="pro-module-wrap">
            <div class="pro-module">
                <h3 class="pro-module-title" style="border-top: 1px solid #ccc;"><span class="title-des">基本信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                <div class="pro-module-item">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">委托代码</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" th:value="${entity?.entrustId}"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">组合名称</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:data-url="@{/business/common/CommonSelect/selectPortfolioId}"
                                                th:initvalue="${entity?.portfolioId}">
                                            </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">交易日期</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input input-dateRangeSelect" placeholder="请选择时间"/>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdBondInvestTrade002.finprodId}">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="finprodId" name="finprodId"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:data-url="@{/invest/trade/bond/TrdBondInvestTrade002/getFinprodId}"
                                                allowClear="true" th:initValue="${entity?.finprodId}"></select>
                                    </div>
                                </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">资产名称</label>
                            <div class="layui-input-inline input-inline">
                                <input disabled="disabled" id="finprodName" name="finprodName" type="text" class="layui-input form-input" th:value="${entity?.abbr}"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">交易场所</label>
                            <div class="layui-input-inline input-inline">
                                <select id="tradeMarket" type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${TRADE_PLACE}' th:initvalue="${entity?.tradeMarket}">
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">交易平台</label>
                            <div class="layui-input-inline input-inline">
                                <select id="tradePlat" type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-data-result='${SHARES_TRADE_PLATFORM}' data-th-placeholder="#{SysCommon.placeholder}" th:initvalue="${entity?.tradePlat}">
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">申报类型</label>
                            <div class="layui-input-inline input-inline">
                                <select id="declareType" type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                    <option value="01">意向申报</option>
                                    <option value="02">成交申报</option>
                                    <option value="03">定价申报</option>
                                    <option value="04">盘后定价申报</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">清算速度</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                    <option value="01">T+0</option>
                                    <option value="02">T+1</option>
                                    <option value="03">T+2</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div id="price_div" class="layui-form-item" style="display:none">
                    	<div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">收盘价格</label>
                            <div class="layui-input-inline input-inline">
                                <input id="closprice" type="text" class="layui-input form-input " />
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">成交量加权平均价</label>
                            <div class="layui-input-inline input-inline">
                                <input id="averageprice" type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">价格类型</label>
                            <div class="layui-input-inline input-inline">
                                <select id="pricetype" type="text" class="layui-input form-input input-select" >
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">交易方向</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}" th:value="${entity?.ps}">
                                    <option value="01">买入</option>
                                    <option value="02">卖出</option>
                                    <option value="03">申购</option>
                                    <option value="04">赎回</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">交割日期</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input input-dateRangeSelect"/>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="pro-module-wrap">
            <div class="pro-module">
                <h3 class="pro-module-title"><span class="title-des">金额信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                <div class="pro-module-item">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">券面总额</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" th:value="${entity?.entrustNum}"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">净价</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" th:value="${entity?.price}"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">全价</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" />
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">净价总额</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" />
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">到期收益率</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" th:value="${entity?.exerYield}"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">行权收益率</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" th:value="${entity?.matureYield}"/>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="pro-module-wrap">
            <div class="pro-module">
                <h3 class="pro-module-title"><span class="title-des">交易信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                <div class="pro-module-item">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">交易对手名称</label>
                            <div class="layui-input-inline input-inline">
                                <select id="conterName" type="text" class="layui-input form-input input-select" data-th-data-url="@{/component/trade/BussEtrInvestPersonInfo/getCounterId}">
                            	</select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">对手方席位号</label>
                            <div class="layui-input-inline input-inline">
                                <input id="conterId" type="text" class="layui-input form-input" />
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">约定号</label>
                            <div class="layui-input-inline input-inline">
                                <input id="appointNum" type="text" class="layui-input form-input" />
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">对手方主体机构</label>
                            <div class="layui-input-inline input-inline">
                                <input id="contermech" type="text" class="layui-input form-input" />
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">联系人</label>
                            <div class="layui-input-inline input-inline">
                                <input id="connect" type="text" class="layui-input form-input" />
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">联系方式</label>
                            <div class="layui-input-inline input-inline">
                                <input id="connectway" type="text" class="layui-input form-input" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
    <div class="layui-col-md12 layui-col-xs12 layui-col-sm12 layui-col-lg12" style="margin:50px 0;">
        <div class="text-center">
            <a id="ExBlockSec002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="ExBlockSec002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="ExBlockSec002_btn_reset" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">重置</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/trade/exblocksec/ExBlockSec001.js}" type="text/javascript"></script>
</div>
</body>
</html>
