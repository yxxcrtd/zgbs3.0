<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>成交报价</title>
    <style>
        .input-radio-inline .layui-form-radio{
            margin: 0;
        }
        .input-radio-inline .layui-form-radio .layui-icon{
            color: #6d9ed9;
            font-size: 18px;
        }
        .repo-trade-wrap {
            overflow: hidden;
        }

        .repo-trade-left, .repo-trade-right {
            width: 45%;
            float: left;
        }

        .repo-trade-middle {
            width: 10%;
            float: left;
            margin-top: 90px;
        }

        .trade-btn-wrap {
            display: block;
            text-align: center;
            margin: 0 12px;
            color: #0b72f1;
            padding: 5px 0;
            background: #f5f5f5;
            border: 1px solid #dddddd;
        }

        .trade-btn-wrap:hover {
            color: #0b72f1;
        }

        .trade-btn-wrap i {
            display: block;
        }

        .trade-romove-btn {
            margin-top: 15px;
        }

        .repo-trade-title {
            padding: 5px 0;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <div class="pro-module-wrap">
            <div class="pro-module">
                <h3 class="pro-module-title" style="border-top: 1px solid #ccc;"><span class="title-des">报价信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                <div class="pro-module-item">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <div class="layui-input-inline input-inline input-radio-inline" style="padding-left: 92px;">
                                <input type="radio" name="sex" value="买入" title="买入" checked="checked"><div class="layui-unselect layui-form-radio"><i class="layui-anim layui-icon"></i><div>买入</div></div>
                                <input type="radio" name="sex" value="卖出" title="卖出"><div class="layui-unselect layui-form-radio layui-form-radioed"><i class="layui-anim layui-icon layui-anim-scaleSpring"></i><div>卖出</div></div>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                    	<div class="form-inline-wrap" style="width:100%">
                    		<hr style=" height:1px;border:none; solid #CCCCCC;" />
                    	</div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">资产代码</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" data-th-value="${bondNum}" required/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">券面总额（万元）</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" data-th-value="${totalArea}" required/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">资产名称</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" data-th-value="${finprodName}" required/>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">清算速度</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}" required>
                                    <option></option>
                                    <option value="01">T+0</option>
                                    <option value="02">T+1</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">请求有效时间</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input input-dateRangeSelect" placeholder="请选择时间" required/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">发出请求机构</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                    <option></option>
                                    <option value="01">中国银行</option>
                                    <option value="02">农业银行</option>
                                    <option value="03">建设银行</option>
                                    <option value="04">交通银行</option>
                                    <option value="05">中金公司</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <h3 class="repo-trade-title" style="padding-left: 5px;"></h3>
                    <table class="layui-table" id="requiredTable"></table>
                </div>
            </div>
        </div>
        <div class="pro-module-wrap">
            <div class="pro-module">
                <h3 class="pro-module-title"><span class="title-des">限价请求</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                <div class="pro-module-item">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable input-radio-inline">
                                <input type="radio" name="sex" value="限价净价（元）" title="限价净价（元）">
                                <div class="layui-unselect layui-form-radio"><i class="layui-anim layui-icon"></i>
                                    <div>限价净价（元）</div>
                                </div>
                            </label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">限价收益率（%）</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <a class="layui-btn layui-btn-sm btn-cancel">启用限价</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="pro-module-wrap">
            <div class="pro-module">
                <h3 class="pro-module-title"><span class="title-des">账户信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                <div class="pro-module-item">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">委托代码</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" disabled/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">组合名称</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" data-th-value="${proName}" required/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable" style="color: #4893e6;">组合可用现金:</label>
                            <div class="layui-input-inline input-inline">
                                <span style="color: #4893e6;line-height: 24px;">20000</span>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap" style="width: 66%;">
                            <label class="layui-form-label form-lable" style="width: 18%;">资金账户信息</label>
                            <div class="layui-input-inline input-inline" style="width: 80%!important;">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable" style="color: #4893e6;">组合可用持仓:</label>
                            <div class="layui-input-inline input-inline">
                                <span style="color: #4893e6;line-height: 24px;">180000</span>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap" style="width: 66%;">
                            <label class="layui-form-label form-lable" style="width: 18%;">托管账户信息</label>
                            <div class="layui-input-inline input-inline" style="width: 80%!important;">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
    <div class="layui-col-md12 layui-col-xs12 layui-col-sm12 layui-col-lg12" style="margin:20px 0;">
        <div class="text-center">
            <a id="Do_btn_success" class="layui-btn layui-btn-sm btn-save" >成交</a>
            <a id="UpTrQuoTedSec003_submit" class="layui-btn layui-btn-sm btn-submit" >保存</a>
            <a id="UpTrQuoTedSec003_reset" class="layui-btn layui-btn-sm btn-cancel" >终止</a>
            <a id="UpTrQuoTedSec003_btn_reset" class="layui-btn layui-btn-sm btn-cancel" >拒绝</a>
        </div>
    </div>
    
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/poc/directtransaction/uptrquotedsec/UpTrQuoTedSec003.js}" type="text/javascript"></script>
</div>
</body>
</html>
