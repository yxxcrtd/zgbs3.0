<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>新增报价</title>
    <style>
        .input-radio-inline .layui-form-radio{
            margin: 0;
        }
        .input-radio-inline .layui-form-radio .layui-icon{
            color: #6d9ed9;
            font-size: 18px;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <div class="pro-module-wrap">
            <div class="pro-module">
                <h3 class="pro-module-title" style="border-top: 1px solid #ccc;"><span class="title-des">报价信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                <div class="pro-module-item">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <div class="layui-input-inline input-inline input-radio-inline" style="padding-left: 92px;">
                                <input type="radio" name="sex" id="psBuy" title="买入" data-th-value='${entity?.ps}' checked=""><div class="layui-unselect layui-form-radio"><i class="layui-anim layui-icon"></i><div>买入</div></div>
                                <input type="radio" name="sex" id="psSell" title="卖出" data-th-value='${entity?.ps}' ><div class="layui-unselect layui-form-radio layui-form-radioed"><i class="layui-anim layui-icon layui-anim-scaleSpring"></i><div>卖出</div></div>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                    	<div class="form-inline-wrap" style="width:100%">
                    		<hr style=" height:1px;border:none; solid #CCCCCC;" />
                    	</div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">交易对手</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="tradeCounter" name="tradeCounter" class="layui-input form-input input-select" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}" required 
                                        data-th-data-url="@{/invest/trade/uptrinqsec/UpTrInqSec002/getCounterId}"
                                        data-th-initValue='${entity?.counterId}'>
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">对手方交易员</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" required data-th-value='${entity?.counterTrader}'/>
                            </div>
                        </div>
                        <!-- <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">资产代码</label>
                            <div class="layui-input-inline input-inline">
	                            <select id="finprodMarketId" name="finprodMarketId" class="layui-input form-input input-select" 
	                            data-th-data-url="@{/trade/uptrinqsec/UpTrInqSec002/getFinprodMarketId}" data-th-initValue='${entity?.finprodId}' required>
	                            </select>
                                <input type="text" class="layui-input form-input" required/>
                            </div>
                        </div> -->
                        
                        <div class="form-inline-wrap">
                             <label class="layui-form-label form-lable">资产代码</label>
                             <div class="layui-input-inline input-inline">
                                 <select type="text" id="finprodId" name="finprodId"
                                     class="layui-input form-input input-select" allowClear="true"
                                     placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                     required="required"   formatoption="false"
                                     data-th-data-url="@{/invest/trade/uptrinqsec/UpTrInqSec002/getfinprodIdForAdd}"
                                     data-th-initValue="${entity?.finprodMarketId}">
                                 </select>
                             </div>
                             <!-- <div class="layui-input-inline input-inline">
	                             <input type="text" id="finprodId" name="finprodId"
	                                    class="layui-input form-input" placeholder="请输入内容"
	                                    data-th-placeholder="#{SysCommon.placeholder}"
	                                    data-th-value="${entity?.finprodId}">
                             </div> -->
                         </div>
                    
                    </div>
                    <div class="layui-form-item">
                        <!-- <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">资产名称</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" data-th-value='${entity?.finprodId}' required/>
                            </div>
                        </div> -->
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">资产名称</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="finprodName" name="finprodName" disabled="disabled"
                                    class="layui-input form-input" placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-value="${entity?.finprodName}">
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">报价有效时间</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input input-dateSelect" placeholder="请选择时间" required/>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                    	<div class="form-inline-wrap" style="width:100%">
                    		<hr style=" height:1px;border:none; solid #CCCCCC;" />
                    	</div>
                    </div>
                    <div class="layui-form-item">
                        <!-- <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">清算速度</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}" data-th-initValue='${entity?.settleSpreed}' required >
                                    <option></option>
                                    <option value="0">T+0</option>
                                    <option value="1">T+1</option>
                                </select>
                            </div>
                        </div> -->
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">券面总额</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="entrustNum" name="entrustNum" class="layui-input form-input text-money" data-th-value='${entity?.entrustNum}' required/>
                                <!-- <input type="text" placeholder="请输入内容" data-pattern="" data-fixtype="2" unit="" class="layui-input form-input text-money"> -->
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">净价</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="price" name="price" class="layui-input form-input text-money" data-th-value='${entity?.price}' required/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">到期收益率%</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="matureYield" name="matureYield" class="layui-input form-input" data-th-value='${entity?.matureYield}' required/>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <!-- <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">券面总额</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="entrustNum" name="entrustNum" class="layui-input form-input" data-th-value='${entity?.entrustNum}' required/>
                            </div>
                        </div> -->
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">清算速度</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}" data-th-initValue='${entity?.settleSpreed}' required >
                                    <option></option>
                                    <option value="0">T+0</option>
                                    <option value="1">T+1</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">结算方式</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}" required>
                                    <option></option>
                                    <option value="01">券款对付</option>
                                    <option value="02">见券付款</option>
                                    <option value="03">见款付券</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">行权收益率%</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" data-th-value='${entity?.exerYield}'/>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">结算币种</label>
                            <div class="layui-input-inline input-inline">
                                <!-- <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}" data-th-initValue='${entity?.ccy}'>
                                    <option value="01">CNY</option>
                                </select> -->
                                <input type="text" class="layui-input form-input" data-th-value='${entity?.ccy}'/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">汇率</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">清算类型</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                    <option></option>    
                                    <option value="01">净额清算</option>
                                    <option value="02">全额清算</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap" style="width: 66%;">
                            <label class="layui-form-label form-lable" style="width: 18%;">补充条款</label>
                            <div class="layui-input-inline input-inline" style="width: 80%!important;">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                        <!-- <div class="form-inline-wrap">
                            <a class="layui-btn layui-btn-sm">计算</a>
                        </div> -->
                    </div>
                    <div class="layui-form-item">
                    	<div class="form-inline-wrap" style="width:100%">
                    		<hr style=" height:1px;border:none; solid #CCCCCC;" />
                    	</div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">全价</label>
                            <div class="layui-input-inline input-inline">
                                <input id="fullPrice" name="fullPrice" type="text" class="layui-input form-input" data-th-value='${entity?.fullPrice}'/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">应计利息</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="unitIntAmt" name="unitIntAmt" class="layui-input form-input" data-th-value='${entity?.unitIntAmt}'/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">交易金额</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="tradeAmt" name="tradeAmt" class="layui-input form-input" data-th-value='${entity?.tradeAmt}'/>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">应计利息总额</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="intAmt" name="intAmt" class="layui-input form-input" data-th-value='${entity?.intAmt}'/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">结算金额</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="settleAmt" name="settleAmt" class="layui-input form-input" data-th-value='${entity?.settleAmt}'/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">结算日</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">每百元本金额</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">本金额</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="pro-module-wrap">
            <div class="pro-module">
                <h3 class="pro-module-title"><span class="title-des">账户信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                <div class="pro-module-item">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">委托代码</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" data-th-value='${entity?.entrustId}'/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">组合名称</label>
                            <div class="layui-input-inline input-inline">
                                <!-- <input type="text" class="layui-input form-input"/> -->
                                <select id="portfolioId" name="portfolioId" class="layui-input form-input input-select" allowClear="true"
                            	    data-th-data-url="@{/invest/trade/uptrinqsec/UpTrInqSec002/getPortfolioId}" data-th-initValue='${entity?.portfolioId}'>
                            	</select>
                            	<!-- <input type="text" id="portfolioName" name="portfolioName"
	                                    class="layui-input form-input" placeholder="请输入内容"
	                                    data-th-placeholder="#{SysCommon.placeholder}"
	                                    data-th-value="${entity?.portfolioName}"> -->
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable" style="color: #4893e6;">组合可用现金:</label>
                            <div class="layui-input-inline input-inline">
                                <span style="color: #4893e6;line-height: 24px;">20000</span>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap" style="width: 66%;">
                            <label class="layui-form-label form-lable" style="width: 18%;">资金账户信息</label>
                            <div class="layui-input-inline input-inline" style="width: 80%!important;">
                                <!-- <input type="text" class="layui-input form-input"/> -->
                                <select id="assetAccount" name="assetAccount" class="layui-input form-input input-select" allowClear="true"
                            	    data-th-data-url="@{/invest/trade/uptrinqsec/UpTrInqSec002/getTrdAcctId}" >
                            	</select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable" style="color: #4893e6;">组合可用持仓:</label>
                            <div class="layui-input-inline input-inline">
                                <span style="color: #4893e6;line-height: 24px;">180000</span>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap" style="width: 66%;">
                            <label class="layui-form-label form-lable" style="width: 18%;">证券账户信息</label>
                            <div class="layui-input-inline input-inline" style="width: 80%!important;">
                                <!-- <input type="text" class="layui-input form-input"/> -->
                                <select id="secuAccount" name="secuAccount" class="layui-input form-input input-select" allowClear="true"
                            	    data-th-data-url="@{/invest/trade/uptrinqsec/UpTrInqSec002/getAcctNo}" >
                            	</select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
    <div class="layui-col-md12 layui-col-xs12 layui-col-sm12 layui-col-lg12" style="margin:20px 0;">
        <div class="text-center">
            <a id="UpTrInqSec001_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="UpTrInqSec001_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="UpTrInqSec001_btn_reset" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">重置</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/poc/directtransaction/uptrinqsec/UpTrInqSec002.js}" type="text/javascript"></script>
</div>
</body>
</html>
