<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>新增报价</title>
    <style>
        .input-radio-inline .layui-form-radio{
            margin: 0;
        }
        .input-radio-inline .layui-form-radio .layui-icon{
            color: #6d9ed9;
            font-size: 18px;
        }
        .repo-trade-wrap {
            overflow: hidden;
        }

        .repo-trade-left, .repo-trade-right {
            width: 45%;
            float: left;
        }

        .repo-trade-middle {
            width: 10%;
            float: left;
            margin-top: 90px;
        }

        .trade-btn-wrap {
            display: block;
            text-align: center;
            margin: 0 12px;
            color: #0b72f1;
            padding: 5px 0;
            background: #f5f5f5;
            border: 1px solid #dddddd;
        }

        .trade-btn-wrap:hover {
            color: #0b72f1;
        }

        .trade-btn-wrap i {
            display: block;
        }

        .trade-romove-btn {
            margin-top: 15px;
        }

        .repo-trade-title {
            padding: 5px 0;
        }
        .batch-type .select2-container{
            width: 10%!important;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <div class="pro-module-wrap">
            <div class="pro-module">
                <h3 class="pro-module-title" style="border-top: 1px solid #ccc;"><span class="title-des">基本信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                <div class="pro-module-item">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">策略代码</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">策略名称</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div>
                            <label class="layui-form-label form-lable" style="width: 11.9%;">激活类型</label>
                            <div class="layui-input-inline input-inline batch-type" style="width: 80%!important;">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                        <option value=01>启动时自动激活</option>
                                        <option value=02>时间激活</option>
                                        <option value=03>指数激活</option>
                                </select>
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                        <option value=01>&lt;=</option>
                                        <option value=02>&gt;=</option>
                                </select>
                                <input type="text" class="layui-input form-input" style="width: 10%;display: inline-block;"/>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="pro-module-wrap">
            <div class="pro-module">
                <h3 class="pro-module-title"><span class="title-des">策略配置</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                <div class="pro-module-item">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable input-radio-inline"><input type="radio" name="sex" title="交易价格策略" checked=""><div class="layui-unselect layui-form-radio"><i class="layui-anim layui-icon"></i><div>交易价格策略</div></div></label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="tradePricePlan" name="tradePricePlan" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                    <option value="01">绝对价格</option>
                                    <option value="02">行情价格</option>
                                    <option value="03">由委托量和行情决定</option>
                                    <option value="04">价格增幅模式</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap" id="priceType_div" style="display: none;">
                            <label class="layui-form-label form-lable">价格类型</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" di="priceType" name="priceType" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                        <option value="01">对手方一档价格</option>
                                        <option value="02">对手方二档价格</option>
                                        <option value="03">对手方三档价格</option>
                                        <option value="04">对手方四档价格</option>
                                        <option value="05">对手方五档价格</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap" id="priceAmpType_div" style="display: none;">
                            <label class="layui-form-label form-lable">价格增幅类型</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="priceAmpType" name="priceAmpType" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                        <option value="01">绝对增幅</option>
                                        <option value="02">比例增幅</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item" style="border-top: 1px solid #ccc;">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable input-radio-inline"><input type="radio" name="sex" title="交易数量策略" checked=""><div class="layui-unselect layui-form-radio"><i class="layui-anim layui-icon"></i><div>交易数量策略</div></div></label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="tradeAmountPlan" name="tradeAmountPlan" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                    <option value="01">固定数量</option>
                                    <option value="02">行情量比例</option>
                                    <option value="03">市场成交量比例</option>
                                    <option value="04">偏移模式</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap" id="quotqtionRatio_div" style="display: none;">
                            <label class="layui-form-label form-lable">行情量比例</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                        <option value="01">前一档</option>
                                        <option value="02">前二档</option>
                                        <option value="03">前三档</option>
                                        <option value="04">前四档</option>
                                        <option value="05">前五档</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap" id="amountRatio_div"style="display: none;">
                            <label class="layui-form-label form-lable">数量比例</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap" style="display: none;" id="deviation_div">
                            <label class="layui-form-label form-lable">偏移模式</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                        <option value="01">绝对偏移</option>
                                        <option value="02">比例偏移</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item" style="border-top: 1px solid #ccc;">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable input-radio-inline"><input type="radio" name="sex" title="交易选股策略" checked=""><div class="layui-unselect layui-form-radio"><i class="layui-anim layui-icon"></i><div>交易选股策略</div></div></label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="tradeStockPlan" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                    <option value="01">集合竞价选股</option>
                                    <option value="02">多因子选股</option>
                                    <option value="03">指数增强选股</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap" id="dayNum_div" style="display: block;">
                            <label class="layui-form-label form-lable">开盘价大于前收盘价天数</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap" id="weightRatio_div" style="display: none;">
                            <label class="layui-form-label form-lable">权重比例</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item"  style="border-top: 1px solid #ccc;">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable input-radio-inline"><input type="radio" name="sex" title="自定义策略" checked=""><div class="layui-unselect layui-form-radio"><i class="layui-anim layui-icon"></i><div>自定义策略</div></div></label>
                            <a class="layui-btn layui-btn-sm btn-import">导入</a>
                            <a class="layui-btn layui-btn-sm btn-preview">预览</a>
                        </div>
                        <div class="layui-form-item">
                                <label class="layui-form-label form-label-wrap" style="width: 11.9%;">自定义代码</label>
                                <div class="layui-input-inline input-inline" style="width: 85%!important;">
                                    <textarea name="remark" maxlength="200" th:text="${entity?.remark}"
                                              class="layui-textarea" placeholder="请输入内容"
                                              th:placeholder="#{SysCommon.placeholder}"></textarea>
                                </div>
                            </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
    <div class="layui-col-md12 layui-col-xs12 layui-col-sm12 layui-col-lg12" style="margin:20px 0;">
        <div class="text-center">
            <a id="UpTrInqSec001_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="UpTrInqSec001_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="UpTrInqSec001_btn_reset" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">重置</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/trade/batchordermanage/BatchOrderMenege003.js}" type="text/javascript"></script>
</div>
</body>
</html>
