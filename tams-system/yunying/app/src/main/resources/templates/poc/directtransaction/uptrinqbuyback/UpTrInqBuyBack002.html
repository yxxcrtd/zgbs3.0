<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>新增报价</title>
    <style>
        .input-radio-inline .layui-form-radio{
            margin: 0;
        }
        .input-radio-inline .layui-form-radio .layui-icon{
            color: #6d9ed9;
            font-size: 18px;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <div class="pro-module-wrap">
            <div class="pro-module">
                <h3 class="pro-module-title" style="border-top: 1px solid #ccc;"><span class="title-des">报价信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                <div class="pro-module-item">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <div class="layui-input-inline input-inline input-radio-inline" style="padding-left: 92px;">
                                <input type="radio" name="sex" id="psBuy" title="正回购" data-th-value='${entity?.ps}' checked=""><div class="layui-unselect layui-form-radio"><i class="layui-anim layui-icon"></i><div>正回购</div></div>
                                <input type="radio" name="sex" id="psSell" title="逆回购" data-th-value='${entity?.ps}' ><div class="layui-unselect layui-form-radio layui-form-radioed"><i class="layui-anim layui-icon layui-anim-scaleSpring"></i><div>逆回购</div></div>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">回购方式</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="false" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}" required="required">
                                    <option value="01">双向回购</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                    	<div class="form-inline-wrap" style="width:100%">
                    		<hr style=" height:1px;border:none; solid #CCCCCC;" />
                    	</div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">交易对手</label>
                            <div class="layui-input-inline input-inline">
									<select type="text" class="layui-input form-input input-select"
										th:data-url="@{/invest/trade/uptrinqbuyback/UpTrInqBuyBack002/selectCounterId}"
										allowClear="true" placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}" data-th-initValue='${entity?.counterId}' required>
									</select>
								</div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">对手方交易员</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" data-th-value="${entity?.counterTrader}" required/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">报价有效时间</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="searchDate" name="searchDate" class="layui-input form-input input-dateSelect" placeholder="请选择时间" required />
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                    	<div class="form-inline-wrap" style="width:100%">
                    		<hr style=" height:1px;border:none; solid #CCCCCC;" />
                    	</div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">回购期限</label>
                            <div class="layui-input-inline input-inline">
                                <!-- <input type="text" id="repoTerm" name="repoTerm" class="layui-input form-input text-number" data-th-value='${entity?.termDays}' required/> -->
                                <input type="text" id="repoTerm" name="repoTerm" placeholder="请输入内容"
                                                data-pattern="" data-fixtype="2"
                                                class="layui-input form-input"
                                                data-th-value="${entity?.termDays}" maxlength="10" required="required"/>
                                            <span class="input-right-show">天</span>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">回购利率%</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="price" name="price" class="layui-input form-input" data-th-value='${entity?.price}' required/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">清算速度</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="settleSpreed" name="settleSpreed" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}" data-th-initValue='${entity?.settleSpreed}'  required>
                                    <option></option>
                                    <option value="0">T+0</option>
                                    <option value="1">T+1</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">首次结算方式</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}" required>
                                    <option></option>
                                    <option value="01">券款对付</option>
                                    <option value="02">见券付款</option>
                                    <option value="03">见款付券</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">到期结算方式</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}" required>
                                    <option></option>
                                    <option value="01">券款对付</option>
                                    <option value="02">见券付款</option>
                                    <option value="03">见款付券</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">清算类型</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}" required>
                                    <option></option>    
                                    <option value="01">全额清算</option>
                                    <option value="02">净额结算</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">债券币种</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${CCY}' data-th-initValue='${entity?.ccy}' required>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="pro-module-wrap">
            <div class="pro-module">
                <h3 class="pro-module-title"><span class="title-des">质押券信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                <div class="pro-module-item">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">汇总券面总额</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="totalPrinAmt" name="totalPrinAmt" class="layui-input form-input" disabled/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <a id="UpTrInqBuyBack002_btn_add" class="layui-btn layui-btn-sm">添加</a>
                            <a id="UpTrInqBuyBack002_btn_del" class="layui-btn layui-btn-sm">删除</a>
                        </div>
                    </div>
                    <div>
                        <table class="layui-table" id="dataTable"></table>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap" style="width: 66%;">
                            <label class="layui-form-label form-lable" style="width: 18%;">补充条款</label>
                            <div class="layui-input-inline input-inline" style="width: 80%!important;">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">券面总额合计</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="totalAmt" name="totalAmt" class="layui-input form-input" disabled/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">应计利息</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="unitIntAmt" name="unitIntAmt" class="layui-input form-input" disabled/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">实际占款天数（天）</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="actualDay" name="actualDay" class="layui-input form-input" disabled/>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">到期结算金额</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="endDateAmt" name="endDateAmt" class="layui-input form-input" disabled/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">首次结算日</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="vdateAdd" name="vdateAdd" class="layui-input form-input input-dateSelect" disabled/>
                                <!-- layui-input form-input input-dateSelect -->
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">到期结算日</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="mdateAdd" name="mdateAdd" class="layui-input form-input input-dateSelect" disabled/>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">结算币种</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="ccy" name="ccy" class="layui-input form-input" disabled/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">交易品种</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="termType" name="termType" class="layui-input form-input" disabled/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">交易金额</label>
                            <div class="layui-input-inline input-inline">
                                <input id="tradeAmt" name="tradeAmt" type="text" class="layui-input form-input" required/>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">质押券折算总额（元）</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" disabled/>
                            </div>
                        </div>
                    </div>
                    <!-- <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">汇总券面总额</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" disabled/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <a id="UpTrInqBuyBack002_btn_add" class="layui-btn layui-btn-sm">添加</a>
                            <a id="UpTrInqBuyBack002_btn_del" class="layui-btn layui-btn-sm">删除</a>
                        </div>
                    </div>
                    <div>
                        <table class="layui-table" id="dataTable"></table>
                    </div> -->
                </div>
            </div>
        </div>
        <div class="pro-module-wrap">
            <div class="pro-module">
                <h3 class="pro-module-title"><span class="title-des">账户信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                <div class="pro-module-item">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">委托代码</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="entrustId" name="entrustId" class="layui-input form-input" data-th-value='${entity?.entrustId}'/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">组合名称</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="portfolioId" name="portfolioId" class="layui-input form-input input-select"
										data-th-data-url="@{/invest/trade/uptrinqbuyback/UpTrInqBuyBack002/getPortfolioId}"
										allowClear="true" placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}" data-th-initValue='${entity?.portfolioId}' required>
								</select>
								
								<!-- <select id="portfolioId" name="portfolioId" class="layui-input form-input input-select" allowClear="true"
                            	    data-th-data-url="@{/trade/uptrinqsec/UpTrInqSec002/getPortfolioId}" data-th-initValue='${entity?.portfolioId}'>
                            	</select> -->
								
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable" style="color: #4893e6;">组合可用现金:</label>
                            <div class="layui-input-inline input-inline">
                                <span style="color: #4893e6;line-height: 24px;">20000</span>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap" style="width: 66%;">
                            <label class="layui-form-label form-lable" style="width: 18%;">资金账户信息</label>
                            <div class="layui-input-inline input-inline" style="width: 80%!important;">
                                <select type="text" id="trdAcctId" name="trdAcctId" class="layui-input form-input input-select" parentIds="portfolioId"
										th:data-url="@{/invest/trade/uptrinqbuyback/UpTrInqBuyBack002/getTrdAcctId}"
										allowClear="true" placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}">
								</select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable" style="color: #4893e6;">组合可用持仓:</label>
                            <div class="layui-input-inline input-inline">
                                <span style="color: #4893e6;line-height: 24px;">180000</span>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap" style="width: 66%;">
                            <label class="layui-form-label form-lable" style="width: 18%;">托管账户信息</label>
                            <div class="layui-input-inline input-inline" style="width: 80%!important;">
                               <select type="text" id="acctNo" name="acctNo" class="layui-input form-input input-select"
										th:data-url="@{/invest/trade/uptrinqbuyback/UpTrInqBuyBack002/getAcctNo}"
										allowClear="true" placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}">
								</select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
    <div class="layui-col-md12 layui-col-xs12 layui-col-sm12 layui-col-lg12" style="margin:20px 0;">
        <div class="text-center">
            <a id="UpTrInqSec001_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="UpTrInqSec001_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="UpTrInqSec001_btn_reset" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">重置</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/poc/directtransaction/uptrinqbuyback/UpTrInqBuyBack002.js}" type="text/javascript"></script>
</div>
</body>
</html>
