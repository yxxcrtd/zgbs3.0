<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PtlMockTest001}">模拟试算查询</title>
</head>
<body>
    <div layout:fragment="content">
        <div class='layui-fluid'>
            <div class="layui-col-md12 form-button-area" style="margin: 10px;">
                <a id="PtlMockTest001_btn_add" class="layui-btn layui-btn-sm btn-create"
                    data-th-text="新建试算">新建试算</a>
                <a id="PtlMockTest001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
                    data-th-text="#{SysCommon.delete}">删除</a>
            </div>
            <div class='joyin-form-wrap joyin-filter-form condition-area'>
                <form class="layui-form" id="searchForm">
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable" data-th-text="#{PtlMockTest001.portfolioId}">组合代码</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="portfolioId" name="portfolioId" allowClear="true"
                                    class="layui-input form-input input-select"
                                    data-th-data-url="@{/poc/portfolio/ptlmock/PtlMockTest001/getPtlInfo}"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable" data-th-text="#{PtlMockTest001.mockDate}">试算日期</label>
                            <div class="layui-input-inline input-inline">
                                <input name="mockDateStr" id="mockDateStr"
                                    class="layui-input form-input input-dateRangeSelect" placeholder="请选择、支持区间"
                                    data-th-placeholder="#{SysCommon.dateInterval}">
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
	    </script>
        <script data-th-src="@{/js/poc/portfolio/ptlmock/PtlMockTest001.js}"></script>
    </div>
</body>
</html>
