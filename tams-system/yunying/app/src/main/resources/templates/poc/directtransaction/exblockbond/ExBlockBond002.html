<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>新增报价</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <div class="pro-module-wrap">
            <div class="pro-module">
                <h3 class="pro-module-title" style="border-top: 1px solid #ccc;"><span class="title-des">基本信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                <div class="pro-module-item">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">委托代码</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" />
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">组合代码</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" />
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">组合名称</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" />
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">资产代码</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" />
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">资产名称</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" />
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">交易场所</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                    <option></option>
                                    <option value="01">上海证券交易所</option>
                                    <option value="02">深圳证券交易所</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                    	<div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">交易平台</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                    <option></option>
                                    <option value="01">上交所大宗交易平台</option>
                                    <option value="02">深交所综合协议交易平台</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">申报类型</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                    <option></option>
                                    <option value="01">意向申报</option>
                                    <option value="02">定价申报</option>
                                    <option value="03">成交申报</option>
                                    <option value="04">盘后定价申报</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">交易方向</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                    <option></option>
                                    <option value="01">买入</option>
                                    <option value="02">卖出</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">收盘价格</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" />
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">成交量加权平均价</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" />
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">价格类型</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">交易日期</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input form-input input-dateRangeSelect" placeholder="请选择时间"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">交易价格</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">交易数量</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="pro-module-wrap">
            <div class="pro-module">
                <h3 class="pro-module-title"><span class="title-des">交易信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                <div class="pro-module-item">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">交易对手名称</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" />
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">对手方席位号</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" />
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">对手方交易单元代码</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" />
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">约定号</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" />
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">联系人</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" />
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">联系方式</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" />
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
    <div class="layui-col-md12 layui-col-xs12 layui-col-sm12 layui-col-lg12" style="margin:20px 0;">
        <div class="text-center">
            <a id="ExBlockBond002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="ExBlockBond002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="ExBlockBond002_btn_reset" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">重置</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/trade/exblockbond/ExBlockBond002.js}" type="text/javascript"></script>
</div>
</body>
</html>
