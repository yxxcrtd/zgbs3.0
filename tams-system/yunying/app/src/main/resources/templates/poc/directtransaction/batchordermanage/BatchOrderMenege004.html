<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>新增报价</title>
    <style>
        .input-radio-inline .layui-form-radio{
            margin: 0;
        }
        .input-radio-inline .layui-form-radio .layui-icon{
            color: #6d9ed9;
            font-size: 18px;
        }
        .repo-trade-wrap {
            overflow: hidden;
        }

        .repo-trade-left, .repo-trade-right {
            width: 45%;
            float: left;
        }

        .repo-trade-middle {
            width: 10%;
            float: left;
            margin-top: 90px;
        }

        .trade-btn-wrap {
            display: block;
            text-align: center;
            margin: 0 12px;
            color: #0b72f1;
            padding: 5px 0;
            background: #f5f5f5;
            border: 1px solid #dddddd;
        }

        .trade-btn-wrap:hover {
            color: #0b72f1;
        }

        .trade-btn-wrap i {
            display: block;
        }

        .trade-romove-btn {
            margin-top: 15px;
        }

        .repo-trade-title {
            padding: 5px 0;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <div class="pro-module-wrap">
            <div class="pro-module">
                <h3 class="pro-module-title" style="border-top: 1px solid #ccc;"><span class="title-des">基本信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                <div class="pro-module-item">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">股票池代码</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">股票池名称</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">策略代码</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">策略名称</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">委托时间</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input input-dateSelect" placeholder="请选择、支持区间">
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">委托频率</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                        <option value="01">1S</option>
                                        <option value="02">2S</option>
                                        <option value="03">3S</option>
                                        <option value="04">4S</option>
                                        <option value="05">5S</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <a class="layui-btn layui-btn-sm">刷新下单信息</a>
                    </div>
                </div>
            </div>
        </div>
    </form>
    <div class="layui-col-md12 layui-col-xs12 layui-col-sm12 layui-col-lg12" style="margin:20px 0;">
        <div class="text-center">
            <a class="layui-btn layui-btn-sm">下单</a>
            <a class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/trade/batchordermanage/BatchOrderMenege004.js}" type="text/javascript"></script>
</div>
</body>
</html>
