<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>回复报价</title>
    <style>
        .input-radio-inline .layui-form-radio{
            margin: 0;
        }
        .input-radio-inline .layui-form-radio .layui-icon{
            color: #6d9ed9;
            font-size: 18px;
        }
        .color-red{
            color: red;
        }
        .item-text{
            padding: 10px 15px 0 15px;
            margin: 0 106px;
            height: 85px;
            background-color: #ddd;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <div class="pro-module-wrap">
            <div class="pro-module">
                <h3 class="pro-module-title" style="border-top: 1px solid #ccc;"><span class="title-des">报价信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                <div class="pro-module-item">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <div class="layui-input-inline input-inline input-radio-inline" style="padding-left: 95px;">
                                <input type="radio" name="sex" value="买入" title="买入"><div class="layui-unselect layui-form-radio"><i class="layui-anim layui-icon"></i><div>买入</div></div>
                                <input type="radio" name="sex" value="卖出" title="卖出" checked><div class="layui-unselect layui-form-radio layui-form-radioed"><i class="layui-anim layui-icon layui-anim-scaleSpring"></i><div>卖出</div></div>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">报价编号</label>
                            <div class="layui-input-inline input-inline">
                                <!-- <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${quotationNum}">
                                </select> -->
                                <input type="text" class="layui-input form-input" data-th-value="${quotationNum}"/>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                    	<div class="form-inline-wrap" style="width:100%">
                    		<hr style=" height:1px;border:none; solid #CCCCCC;" />
                    	</div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">交易对手</label>
                            <div class="layui-input-inline input-inline">
                                <!-- <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${tradeCounter}">
                                </select> -->
                                <input type="text" class="layui-input form-input" data-th-value="${tradeCounter}"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">对手方交易员</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" data-th-value="${rivalTraders}"/>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">资产代码</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" data-th-value="${bondNum}"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">资产名称</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" data-th-value="${finprodName}"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">报价有效时间</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input input-dateRangeSelect" th:value="2019-11-02" placeholder="请选择时间"/>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                    	<div class="form-inline-wrap" style="width:100%">
                    		<hr style=" height:1px;border:none; solid #CCCCCC;" />
                    	</div>
                    </div>
                    <div class="layui-form-item">
                        <div class="item-text">
                        14:02 张三将 <span class="color-red">净价（元）</span> 从  <span class="color-red">96.0000</span> 修改为 <span class="color-red">97.0000</span> ，将<span class="color-red">收益率（%）</span> 从 <span class="color-red">8.490698</span> 修改为 <span class="color-red">6.097889</span>
                        <br>
                        14:20 
                        </div>
                    </div>
                    <div class="layui-form-item">
                    	<div class="form-inline-wrap" style="width:100%">
                    		<hr style=" height:1px;border:none; solid #CCCCCC;" />
                    	</div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">清算速度</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                    <option></option>
                                    <option value="01">T+0</option>
                                    <option value="02">T+1</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">净价</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" data-th-value="${netPrice}"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">到期收益率%</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" data-th-value="${yields}"/>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">券面总额</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" data-th-value="${totalArea}"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">结算方式</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                    <option></option>
                                    <option value="01">券款对付</option>
                                    <option value="02">见券付款</option>
                                    <option value="03">见款付券</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">行权收益率%</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">币种</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" data-th-value="${ccy}"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">汇率</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">清算类型</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                    <option></option>
                                    <option value="01">净额清算</option>
                                    <option value="02">全额清算</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap" style="width: 66%;">
                            <label class="layui-form-label form-lable" style="width: 18%;">补充条款</label>
                            <div class="layui-input-inline input-inline" style="width: 80%!important;">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <a class="layui-btn layui-btn-sm">计算</a>
                        </div>
                    </div>
                    <div class="layui-form-item">
                    	<div class="form-inline-wrap" style="width:100%">
                    		<hr style=" height:1px;border:none; solid #CCCCCC;" />
                    	</div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">全价</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" data-th-value="${fullPrice}"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">应计利息</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" data-th-value="${fullPrice}"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">交易金额</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">应计利息总额</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">结算金额</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">结算日</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">每百元本金额</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">本金额</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="pro-module-wrap">
            <div class="pro-module">
                <h3 class="pro-module-title"><span class="title-des">账户信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                <div class="pro-module-item">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">委托代码</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">组合名称</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input" data-th-value="${proName}"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable" style="color: #4893e6;">产品可用现金:</label>
                            <div class="layui-input-inline input-inline">
                                <span style="color: #4893e6;line-height: 24px;">20000</span>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap" style="width: 66%;">
                            <label class="layui-form-label form-lable" style="width: 18%;">资金账户信息</label>
                            <div class="layui-input-inline input-inline" style="width: 80%!important;">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable" style="color: #4893e6;">产品可用持仓:</label>
                            <div class="layui-input-inline input-inline">
                                <span style="color: #4893e6;line-height: 24px;">180000</span>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap" style="width: 66%;">
                            <label class="layui-form-label form-lable" style="width: 18%;">托管账户信息</label>
                            <div class="layui-input-inline input-inline" style="width: 80%!important;">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
    <div class="layui-col-md12 layui-col-xs12 layui-col-sm12 layui-col-lg12" style="margin:20px 0;">
        <div class="text-center">
            <a id="UpTrInqSec001_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="UpTrInqSec001_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="UpTrInqSec001_btn_reset" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">重置</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/poc/directtransaction/uptrinqsec/UpTrInqSec004.js}" type="text/javascript"></script>
</div>
</body>
</html>
