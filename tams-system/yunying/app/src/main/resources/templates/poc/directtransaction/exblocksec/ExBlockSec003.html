<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>股票竞价交易查询</title>
    <style>
        .table1 .layui-table-view{
            height: 275px!important;
        }
        .table1 .layui-table-view .layui-table-body{
            height: 190px!important;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area" >
            <a id="ExBlockSec001_btn_add" class="layui-btn layui-btn-sm">债券交易下单</a>
            <a id="ExBlockSec001_btn_revoke" class="layui-btn layui-btn-sm">交易撤单</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
            <form class="layui-form"  id="submitForm" >
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">委托代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" class="layui-input form-input">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">组合名称</label>
                        <div class="layui-input-inline input-inline">
                            <select class="layui-input form-input input-select" allowClear="true">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <select class="layui-input form-input input-select" allowClear="true">
                                <option value="01">SP-001</option>
                                <option value="02">SP-002</option>
                                <option value="03">SP-003</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">资产名称</label>
                        <div class="layui-input-inline input-inline">
                            <select class="layui-input form-input input-select" allowClear="true">
                                <option value="01">0001产品</option>
                                <option value="02">0002产品</option>
                                <option value="03">0003产品</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">业务发生时间</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" class="layui-input form-input input-dateRangeSelect" placeholder="请选择、支持区间">
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="table">
            <table class="layui-table" id="dataTable"></table>
        </div>
        <div class="table1" style="display: none;" >
            <div class="table-top">
                <table class="layui-table" id="dataTable1"></table>
            </div>
            <div>
                <table class="layui-table" id="dataTable2"></table>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/trade/exblocksec/ExBlockSec001.js}" type="text/javascript"></script>
</div>
</body>

</html>
