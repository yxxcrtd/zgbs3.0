<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="#{PtlMockTest002}">组合模拟试算</title>

</head>
<body>
<div class="container" layout:fragment="content">
    <style type="text/css">
        .layui-table {
            width: 100% !important;
        }
        
        .trast-list-left {
            float: left;
            width: 60%;
        }
        
        .trast-list-right {
            float: left;
            width: 30%;
            position: relative;
        }
        
        .trast-list-left .layui-table-view {
            height: 200px !important;
        }
        
        .trast-list-left .layui-table-view .layui-table-box .layui-table-body {
            height: 156px !important;
        }
        
        .trast-list-show {
            position: absolute;
            top: 10px;
            right: 15px;
        }
        
        .trast-icon-wrap {
            text-align: right;
        }
        
        .trast-icon-wrap i {
            color: #666;
            background: #d9ecff;
            font-size: 25px;
        }
        
        .trast-print-wrap {
            border: 1px solid #ddd;
        }
        
        .trast-print-wrap h3 {
            padding: 10px 0 10px 10px;
            border-bottom: 1px solid #ddd;
            color: #999;
        }
        
        .trast-print-wrap ul {
            padding: 0 10px 10px 10px;
        }
        
        .trast-print-wrap ul li {
            padding-top: 10px;
        }
        
        .trast-print-wrap ul li a {
            color: #999;
        }
        
        table thead tr th {
            background-color: #d9ecff;
        }
        
        .ptl-table .layui-table-view .layui-table-box .layui-table-header table thead tr th
            {
            padding: 1px 0;
            text-align: center;
        }
        
        .ptl-table .layui-table-view .layui-table-box .layui-table-body {
            height: 504px !important;
        }
        
        .input-radio-inline .layui-form-radio {
            margin: 0;
        }
        
        .input-radio-inline .layui-form-radio .layui-icon {
            color: #6d9ed9;
            font-size: 18px;
        }
    </style>
    <div class="pro-module-container" style="margin-bottom: 20px;" id="content_div">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap" id="baseInfo_div">
                    <input id="mockDate" name="mockDate" th:value="${platDate}" type="hidden">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" th:text="#{PtlMockTest002.baseInfo}">基本信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlMockTest002.portfolioId}">组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                th:data-url="@{/poc/portfolio/ptlmock/PtlMockTest002/getPtlInfo}"
                                                data-th-allowClear="true"
                                                th:initValue="${entity?.portfolioId}">
                                        </select>

                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlMockTest002.portfolioName}">组合名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="portfolioName" name="portfolioName"
                                               disabled="disabled"
                                               class="layui-input form-input"
                                               data-th-placeholder="#{SysCommon.placeholder}" maxLength="200"
                                               data-th-value="${entity?.portfolioName}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlMockTest002.portfolioType}">组合类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="portfolioType" name="portfolioType"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${PORTFOLIO_TYPE}'
                                                disabled="disabled"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                th:initValue="${entity?.portfolioType}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlMockTest002.profitType}">收益类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="profitType" name="profitType"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${PROFIT_TYPE}'
                                                disabled="disabled"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                th:initValue="${entity?.profitType}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlMockTest002.vdate}">起息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="vdate" name="vdate"
                                               class="layui-input form-input input-dateSelect"
                                               data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlMockTest002.mdate}">到期日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="mdate" name="mdate"
                                               class="layui-input form-input input-dateSelect"
                                               data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlMockTest002.baseRule}">业绩基准%</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="baseRule" name="baseRule" placeholder="请输入内容"
                                               class="layui-input form-input text-number" data-textrange='4'
                                               data-th-value='${entity?.baseRule}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlMockTest002.mgrFeeRate}">管理费率%</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="mgrFeeRate" name="mgrFeeRate"

                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${entity?.mgrFeeRate}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" id="raiseAmtPlanDiv" >

                                               data-fixtype='2' required>
                                        <span class="input-right-show" style="width: auto">万元</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
                <div class="pro-module-wrap" id="preDay_div">

                                </div>

                                               th:placeholder="#{SysCommon.placeholder}" data-textrange="2">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">

                                               th:placeholder="#{SysCommon.placeholder}" data-textrange="2">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{PtlMockTest002.DayLeverRate}">杠杆率%
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="preDayLeverRate" name="preDayLeverRate"
                                               class="layui-input form-input text-number" disabled
                                               data-th-value="${entity?.preDayLeverRate}"
                                               th:placeholder="#{SysCommon.placeholder}" data-textrange="2">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{PtlMockTest002.DayBpvalue}">基点价值
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="preDayBpvalue" name="preDayBpvalue"
                                               class="layui-input form-input" disabled
                                               data-th-value="${entity?.preDayBpvalue}"
                                               th:placeholder="#{SysCommon.placeholder}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{PtlMockTest002.DayPtlMDuration}">组合久期
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="preDayPtlMDuration" name="preDayPtlMDuration"
                                               class="layui-input form-input" disabled
                                               data-th-value="${entity?.preDayPtlMDuration}"
                                               th:placeholder="#{SysCommon.placeholder}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"

                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="preDaySevenDayRate" name="preDaySevenDayRate"
                                               class="layui-input form-input text-number" disabled
                                               data-th-value="${entity?.preDaySevenDayRate}"
                                               th:placeholder="#{SysCommon.placeholder}" data-textrange="2">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" name="ccy_div" style="display: none;">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{PtlMockTest002.DayAvgsurplustime}">平均剩余期限
                                    </label>
                                    <div class="layui-input-inline input-inline">

                                        <input type="text" id="preDayAvgsurplustimeP" name="preDayAvgsurplustimeP"

                                               data-th-value="${entity?.preDayAvgsurplustimeP}"
                                               th:placeholder="#{SysCommon.placeholder}" data-textrange="2">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                            <span class="title-des" th:text="#{PtlMockTest002.real}">实时组合表现</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" name="value_div">

                                               class="layui-input form-input text-number" disabled

                                    </div>
                                </div>

                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{PtlMockTest002.dayPYield}">万份收益
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="realTimePYield" name="realTimePYield"
                                               class="layui-input form-input text-number" disabled
                                               data-th-value="${entity?.realTimePYield}"
                                               th:placeholder="#{SysCommon.placeholder}" data-textrange="4">
                                    </div>
                                </div>
                                <div class="form-inline-wrap" name="value_div">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{PtlMockTest002.dayValChg}">涨跌幅%
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="realTimeValChg" name="realTimeValChg"

                                               data-th-value="${entity?.realTimeValChg}"

                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"

                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="realTimeCashPosition" name="realTimeCashPosition"
                                               class="layui-input form-input text-number" disabled
                                               data-th-value="${entity?.realTimeCashPosition}"
                                               th:placeholder="#{SysCommon.placeholder}" data-textrange="2">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{PtlMockTest002.DayAssetValue}">总资产
                                    </label>

                                        <input type="text" id="realTimeAssetValue" name="realTimeAssetValue"
                                               class="layui-input form-input text-number" disabled
                                               data-th-value="${entity?.realTimeAssetValue}"
                                               th:placeholder="#{SysCommon.placeholder}" data-textrange="2">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{PtlMockTest002.DayAssetNetvalue}">净资产

                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{PtlMockTest002.DayLeverRate}">杠杆率%

                                <div class="form-inline-wrap">

                                               class="layui-input form-input" disabled

                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
