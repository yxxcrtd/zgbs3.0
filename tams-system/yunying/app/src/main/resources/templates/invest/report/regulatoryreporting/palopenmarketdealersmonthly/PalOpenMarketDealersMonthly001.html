<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PalOpenMarketDealersMonthly001}">G06余额明细表</title>

</head>
<body>
    <div layout:fragment="content">
       <div class="joyin-form-wrap condition-area">
            <form class="layui-form" filter='false' id="searchForm">
                <div class="layui-form-item">
                 <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">统计月份</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="statisticsMonth" name="statisticsMonth"  class="layui-input form-input input-dateSelect" placeholder="统计月份" />
                        </div>
                    </div>
                     
                     <div class="layui-inline layui-col-md7" style = "visibility:hidden;">
                     <div class="layui-input-inline input-inliner" style="width:236px, visibility:hidden;" >
                            <select id="identification" name="identification" class="input-select" data-th-data-result='${identificationList}' data-th-initvalue="${defaultIdentification}" disabled="disabled">
                            </select>
                        </div>
                     </div>
                      <div class="layui-inline layui-col-md1" >
                      <a id="PalOpenMarketDealersMonthly001_btn_export" class="layui-btn layui-btn-sm btn-export btn-default">导出</a>
                     </div>
                </div>
              </form>
           </div>
    </div>
    <div layout:fragment="script">
    	<script data-th-inline="javascript" type="text/javascript">
        	var isMain=/*[[${isMain}]]*/'';
        	var searchDataStart=/*[[${searchDataStart}]]*/'';
        	var searchDataEnd=/*[[${searchDataEnd}]]*/'';
        	var searchDataTime=/*[[${searchDataTime}]]*/'';
        	var validKey=/*[[${validKey}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/report/regulatoryreporting/palopenmarketdealersmonthly/PalOpenMarketDealersMonthly001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
