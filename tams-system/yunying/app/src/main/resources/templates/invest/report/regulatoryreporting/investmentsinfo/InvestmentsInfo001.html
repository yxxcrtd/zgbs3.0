<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{InvestmentsInfo001}">表内外投资业务情况统计表</title>

</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area" export="false">
            <a id="InvestmentsInfo001_btn_export" class="layui-btn layui-btn-sm btn-export btn-default">导出</a>
        </div>
       <div class="joyin-form-wrap condition-area">
            <form class="layui-form" filter='false' id="searchForm">
                <div class="layui-form-item">
                 	<div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">年份</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="exportYear" name="exportYear"  class="layui-input form-input input-dateSelect" placeholder="年份" />
                        </div>
                    </div>
                     
                     <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">季度</label>
                        <div class="layui-input-inline input-inliner" >
                            <select id="exportQuarter" name="exportQuarter" class="input-select"  data-th-data-result='${quarterList}' allowClear="false">
                            </select>
                        </div>
                    </div>
                     <div class="layui-inline layui-col-md3" style = "visibility:hidden;">
                     <div class="layui-input-inline input-inliner" style="visibility:hidden;" >
                            <select id="identification" name="identification" class="input-select"  disabled="disabled">
                            </select>
                        </div>
                     </div>
                </div>
              </form>
           </div>
    </div>
    <div layout:fragment="script">
    	<script data-th-inline="javascript" type="text/javascript">
        	var isMain=/*[[${isMain}]]*/'';
        	var searchDataStart=/*[[${searchDataStart}]]*/'';
        	var searchDataEnd=/*[[${searchDataEnd}]]*/'';
        	var submitStatus=/*[[${submitStatus}]]*/'';
        	var validKey=/*[[${validKey}]]*/'';
        	var submitFeedbackStatus=/*[[${submitFeedbackStatus}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/report/regulatoryreporting/investmentsinfo/InvestmentsInfo001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
