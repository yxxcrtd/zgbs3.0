prod:
  bussRep: 1
server:
  port: 8081
  address: 0.0.0.0
  maxHttpHeaderSize: 102400
  context-path: /tamsyy
listener:
  port: 8888
  length: 8
  encode: UTF-8
spring:
  jmx:
    enabled: false
  thymeleaf:
    cache: false
  profiles:
    active: allinone
  application:
    name: tamsyy-server
    dfstype: 2
  datasource:
    type: org.apache.commons.dbcp2.BasicDataSource
    validationQuery: SELECT 1 FROM DUAL
    testOnBorrow: true   #从连接池获取一个连接时，验证有效性
    testOnReturn: true   #连接被归还到连接池时，验证有效性
    testOnCreate: true   #连接创建后，马上验证有效性
    testWhileIdle: true  #连接空闲时，验证有效性
    minEvictableIdleTimeMillis: 1800000   #空闲的连接最低要待N毫秒后，才会被释放
    removeAbandonedTimeout: 300  #一个被抛弃连接可以被移除的超时时间
    initialSize: 10   #连接池被启动时初始化的创建的连接个数
    maxTotal: 50     #最大活动连接数
    maxIdle: 50      #最大空闲连接数
    minIdle: 20       #最小空闲连接数
    timeBetweenEvictionRunsMillis: 60000   #空闲对象驱逐线程运行时的休眠毫秒数
    numTestsPerEvictionRun: 10  #在每个空闲对象驱逐线程运行过程中中进行检查的对象个数
    removeAbandonedOnBorrow: true   #是否删除超过removeAbandonedTimout所指定时间的被遗弃的连接
    removeAbandonedOnMaintenance: true  #是否删除超过removeAbandonedTimout所指定时间的被遗弃的连接
    logAbandoned: true  #程序在回收连接的同时是否打印日志
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  http:
    multipart:
      maxFileSize: 10Mb
      maxRequestSize: 100Mb
  #静态资源配置:js和css变更时无需手工清缓存
  resources:
    chain:
      strategy:
        fixed:
          enabled: true
base:
  datasource:
    type: org.apache.commons.dbcp2.BasicDataSource
    testOnBorrow: true
    testOnReturn: true
    testOnCreate: true
    testWhileIdle: true
    minEvictableIdleTimeMillis: 1800000
    removeAbandonedTimeout: 300
    initialSize: 10
    maxTotal: 50
    maxIdle: 50
    minIdle: 20
    timeBetweenEvictionRunsMillis: 60000
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
interf:
  hostname: localhost
  port: 28080   #接口id
  contextPath: /interf   #估值接口程序文根
  datasource:
    type: org.apache.commons.dbcp2.BasicDataSource
    validationQuery: SELECT 1 FROM DUAL
    testOnBorrow: true
    testOnReturn: true
    testOnCreate: true
    testWhileIdle: true
    minEvictableIdleTimeMillis: 1800000
    removeAbandonedTimeout: 300
    initialSize: 5
    maxTotal: 10
    maxIdle: 10
    minIdle: 5
    timeBetweenEvictionRunsMillis: 60000
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
stresstest:
  datasource:
    type: org.apache.commons.dbcp2.BasicDataSource
    validationQuery: select 1 from dual
    testOnBorrow: true
    testOnReturn: true
    testOnCreate: true
    testWhileIdle: true
    minEvictableIdleTimeMillis: 1800000
    removeAbandonedTimeout: 300
    initialSize: 5
    maxTotal: 10
    maxIdle: 10
    minIdle: 5
    timeBetweenEvictionRunsMillis: 60000
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
#wind数据库配置
wind:
  datasource:
    type: org.apache.commons.dbcp2.BasicDataSource
    validationQuery: SELECT 1 FROM DUAL
    testOnBorrow: true
    testOnReturn: true
    testOnCreate: true
    testWhileIdle: true
    minEvictableIdleTimeMillis: 1800000
    removeAbandonedTimeout: 300
    initialSize: 10
    maxTotal: 50
    maxIdle: 50
    minIdle: 20
    timeBetweenEvictionRunsMillis: 60000  # 默认是-1
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
    connectionProperties: oracle.net.CONNECT_TIMEOUT=50000;oracle.jdbc.ReadTimeout=50000
