<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>凭证查询</title>
</head>

<body>

<div layout:fragment="content">
	<div class="form-button-area" >
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">所属账套</label>
                    <div class="layui-input-inline input-inline">
                    	<!-- <select id="booksetId" name="booksetId" class="layui-input form-input input-select" 
                            		data-th-data-url="@{/psbc/bankvoucherquery/BankValVoucherQuery001/getBooksetId}"
                            		multiple="multiple"
                                  allowClear="true" placeholder="请输入内容">
                        </select> -->
                         <select type="text" id="booksetId" name="booksetId"
                                class="layui-input form-input input-select" data-th-data-result='${booksetIds}'
                                allowClear="true"  placeholder="请输入内容"  data-th-initValue='${booksetId}' multiple="multiple"
                                data-th-placeholder="#{SysCommon.placeholder}" formatoption = "true">
                         </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">业务类别</label>
                    <div class="layui-input-inline input-inline">
                    	<select id="tableId" name="tableId" class="layui-input form-input input-select" 
                            		data-th-data-url="@{/psbc/bankvoucherquery/BankValVoucherQuery001/getTableId}"
                            		multiple="multiple"
                                  allowClear="true" placeholder="请输入内容">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">资产/负债代码</label>
                    <div class="layui-input-inline input-inline">
                      <input type="text" id="busiId" name="busiId" class="layui-input form-input" value="" placeholder="请输入">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">业务编号</label>
                    <div class="layui-input-inline input-inline">
                      <input type="text" id="tradeId" name="tradeId" class="layui-input form-input" placeholder="请输入" value="">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">原始业务编号</label>
                    <div class="layui-input-inline input-inline">
                      <input type="text" id="pTradeId" name="pTradeId" class="layui-input form-input" placeholder="请输入" value="">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">记账日期</label>
                    <div class="layui-input-inline input-inline">
                      <input type="text" id="bookDate" name="bookDate" data-th-value="${sysDate}" placeholder="请选择、支持区间" class="layui-input form-input input-dateRangeSelect" allowClear="true">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">生成日期</label>
                    <div class="layui-input-inline input-inline">
                      <input type="text" id="happenDate" name="happenDate" placeholder="请选择、支持区间" class="layui-input form-input input-dateRangeSelect" value="" >
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">凭证类型</label>
                    <div class="layui-input-inline input-inline">
                      <input type="text" id="bookType" name="bookType" class="layui-input form-input input-select"  data-th-data-result="${BOOK_TYPE}" placeholder="请选择" allowClear="true">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">凭证编号</label>
                    <div class="layui-input-inline input-inline">
                      <input type="text" id="busVouchnum" name="busVouchnum" class="layui-input form-input" placeholder="请输入" value="">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">凭证是否展示分录</label>
                            <div class="layui-input-inline input-inline">
                                    <input type="checkbox" id="isShowfl"  name="isShowfl" lay-skin="switch"  lay-text="是|否" lay-filter="isShowfl" checked>
                            </div>
                    </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
</body>
<div layout:fragment="script">
  <script data-th-src="@{/js/psbc/bankvoucherquery/BankValVoucherQuery001.js}" type="text/javascript"></script>
</div>

</html>
