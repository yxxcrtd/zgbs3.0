<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<titl></title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area" export="false" filter="false">
        </div>
        <div class='joyin-form-wrap joyin-filter-form condition-area curr-form' >
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="portfolioId" name="portfolioId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId}" required>
                             </select>
                        </div>
                    </div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
		                    <label class="layui-form-label form-lable">查询日期</label>
		                    <div class="layui-input-inline input-inline">
		                        <input type="text" id="queryDate" name="queryDate" class="layui-input form-input input-dateSelect" required></input>
		                    </div>
		                </div>
					</div>
				</form>
			</div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/poc/creditrisk/riskmanagement/CreditRiskManagement001.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
