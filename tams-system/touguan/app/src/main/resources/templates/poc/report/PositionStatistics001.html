<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title>头寸统计表</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="form-button-area">
				
			</div>
			<div
				class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
				<form class="layui-form" id="searchForm">
                    <input id="platformDate" name='platformDate' data-th-value='${platformDate}' hidden/>
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable">查询日</label>
							<div class="layui-input-inline input-inline">
								<input id="PositionStatistics001_date_searchdate" name='searchdate'
									class="layui-input form-input input-dateSelect"
									data-th-value="|${currentDate}|"
									placeholder="请选择时间区间"
									data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>	
                        <div
                            class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable">产品经理</label>
                            <div class="layui-input-inline input-inline">           
                                <select type="text" name="manager"
                                    class="layui-input form-input input-select" allowClear="true"
                                    placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    formatoption=true multiple="true"
                                    data-th-data-url="@{/poc/report/PositionStatistics001/queryManagerInfo}">
                                </select>
                            </div>
                        </div>      	
					</div>                   
				</form>
			</div>
			<div>
            <table class="layui-table" id="dataTable"></table>
        </div>
		</div>
	</div>
	<div layout:fragment="script">
		<script
			data-th-src="@{/js/poc/report/PositionStatistics001.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
