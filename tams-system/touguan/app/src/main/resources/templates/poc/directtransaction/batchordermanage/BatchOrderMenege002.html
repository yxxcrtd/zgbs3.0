<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>新增报价</title>
    <style>
        .input-radio-inline .layui-form-radio{
            margin: 0;
        }
        .input-radio-inline .layui-form-radio .layui-icon{
            color: #6d9ed9;
            font-size: 18px;
        }
         .repo-trade-wrap {
             overflow: hidden;
         }

        .repo-trade-left, .repo-trade-right {
            width: 45%;
            float: left;
        }

        .repo-trade-middle {
            width: 10%;
            float: left;
            margin-top: 90px;
        }

        .trade-btn-wrap {
            display: block;
            text-align: center;
            margin: 0 12px;
            color: #0b72f1;
            padding: 5px 0;
            background: #f5f5f5;
            border: 1px solid #dddddd;
        }

        .trade-btn-wrap:hover {
            color: #0b72f1;
        }

        .trade-btn-wrap i {
            display: block;
        }

        .trade-romove-btn {
            margin-top: 15px;
        }

        .repo-trade-title {
            padding: 5px 0;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <div class="pro-module-wrap">
            <div class="pro-module">
                <h3 class="pro-module-title" style="border-top: 1px solid #ccc;"><span class="title-des">基本信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                <div class="pro-module-item">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">股票池代码</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">股票池名称</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">启用时间</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input input-dateSelect" placeholder="请选择时间"/>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="pro-module-wrap">
            <div class="pro-module">
                <h3 class="pro-module-title"><span class="title-des">股票配置</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                <div class="pro-module-item">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable input-radio-inline"><input type="radio" name="sex" title="指数板块" checked=""><div class="layui-unselect layui-form-radio"><i class="layui-anim layui-icon"></i><div>指数板块</div></div></label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                    <option value="01">上证180</option>
                                    <option value="02">上证150</option>
                                    <option value="03">沪深300</option>
                                    <option value="04">中证100</option>
                                    <option value="05">中证500</option>
                                    <option value="06">中证800</option>
                                    <option value="07">300金融</option>
                                    <option value="08">沪股通</option>
                                    <option value="09">深圳300</option>
                                    <option value="10">中小300</option>
                                    <option value="11">中小板综</option>
                                    <option value="12">创业板综</option>
                                    <option value="13">上证周期</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable input-radio-inline"><input type="radio" name="sex" title="地区板块" checked=""><div class="layui-unselect layui-form-radio"><i class="layui-anim layui-icon"></i><div>地区板块</div></div></label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                    <option value="01">西藏板块</option>
                                    <option value="02">陕西板块</option>
                                    <option value="03">湖南板块</option>
                                    <option value="04">四川板块</option>
                                    <option value="05">福建板块</option>
                                    <option value="06">湖北板块</option>
                                    <option value="07">安徽板块</option>
                                    <option value="08">江西板块</option>
                                    <option value="09">山东板块</option>
                                    <option value="10">浙江板块</option>
                                    <option value="11">海南板块</option>
                                    <option value="12">天津板块</option>
                                    <option value="13">北京板块</option>
                                    <option value="14">内蒙古板块</option>
                                    <option value="15">新疆板块</option>
                                    <option value="16">重庆板块</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable input-radio-inline"><input type="radio" name="sex" title="行业板块" checked=""><div class="layui-unselect layui-form-radio"><i class="layui-anim layui-icon"></i><div>行业板块</div></div></label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                    <option value="01">通信</option>
                                    <option value="02">计算机</option>
                                    <option value="03">电子</option>
                                    <option value="04">农林牧渔</option>
                                    <option value="05">电力设备与新能源</option>
                                    <option value="06">汽车和汽车零部件</option>
                                    <option value="07">机械</option>
                                    <option value="08">传播与文化</option>
                                    <option value="09">基础化工</option>
                                    <option value="10">房地产</option>
                                    <option value="11">食品饮料</option>
                                    <option value="12">造纸印刷</option>
                                    <option value="13">刚铁</option>
                                    <option value="14">有色金属</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable input-radio-inline"><input type="radio" name="sex" title="概念板块" checked=""><div class="layui-unselect layui-form-radio"><i class="layui-anim layui-icon"></i><div>概念板块</div></div></label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                    <option value="01">多晶硅</option>
                                    <option value="02">租购同权</option>
                                    <option value="03">5G概念</option>
                                    <option value="04">华为概念</option>
                                    <option value="05">智能交通</option>
                                    <option value="06">猪肉</option>
                                    <option value="07">IP变现</option>
                                    <option value="08">三网融合</option>
                                    <option value="09">智能医疗</option>
                                    <option value="10">云计算</option>
                                    <option value="11">知识产权</option>
                                    <option value="12">充电桩</option>
                                    <option value="13">蓝宝石</option>
                                    <option value="14">虚拟现实</option>
                                    <option value="15">苹果概念</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable input-radio-inline"><input type="radio" name="sex" title="风格板块" checked=""><div class="layui-unselect layui-form-radio"><i class="layui-anim layui-icon"></i><div>概念板块</div></div></label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                    <option value="01">融资融券</option>
                                    <option value="02">近期解禁</option>
                                    <option value="03">预高转送</option>
                                    <option value="04">已高转送</option>
                                    <option value="05">商誉减值</option>
                                    <option value="06">破净资产</option>
                                    <option value="07">高管增持</option>
                                    <option value="08">高管减持</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable input-radio-inline"><input type="radio" name="sex" title="证监会行业板块" checked=""><div class="layui-unselect layui-form-radio"><i class="layui-anim layui-icon"></i><div>概念板块</div></div></label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                    <option value="01">农业</option>
                                    <option value="02">林业</option>
                                    <option value="03">畜牧业</option>
                                    <option value="04">渔业</option>
                                    <option value="05">农林牧渔服务业</option>
                                    <option value="06">煤炭采选业</option>
                                    <option value="07">石油和天然气开采业</option>
                                    <option value="08">黑色金属矿采选业</option>
                                	<option value="09">有色金属矿采选业</option>
                                    <option value="10">非金属矿采选业</option>
                                    <option value="11">食品加工业</option>
                                    <option value="12">食品制造业</option>
                                    <option value="13">纺织业</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="repo-trade-wrap">
                        <div class="repo-trade-left">
                            <h3 class="repo-trade-title">
                        <span class="title-des">已选股票</span>
                            </h3>
                            <!-- <table class="layui-table" th:id="|${entityName}_avaPledgeBondDetailList|"
                                   th:name="|${entityName}.avaPledgeBondDetailList|"></table> -->
                            <table class="layui-table" id="avaPledgeBondDetailList"></table>
                        </div>
                        <div class="repo-trade-middle">
                            <a class="trade-btn-wrap trade-add-btn" th:id="batch_btn_joyin" href="javascript:;">
                                <i class="iconfont icon-batch-down"></i>
                                <span data-th-utext="#{BussRepoSec.joyin}">加入</span>
                            </a>
                            <a class="trade-btn-wrap trade-romove-btn" th:id="batch_btn_remove" href="javascript:;">
                                <i class="iconfont icon-batch-upturn"></i>
                                <span data-th-utext="#{BussRepoSec.remove}">移除</span>
                            </a>
                        </div>
                        <div class="repo-trade-right">
                            <h3 class="repo-trade-title">
                        <span class="title-des">已移除股票</span>
                            </h3>
                            <!-- <table class="layui-table" th:id="|${entityName}_pledgeBondDetailList|"
                                   th:name="|${entityName}.pledgeBondDetailList|"></table> -->
                            <table class="layui-table" id="pledgeBondDetailTbl"></table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="pro-module-wrap">
            <div class="pro-module">
                <h3 class="pro-module-title"><span class="title-des">交易金额配置</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                <div class="pro-module-item">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">可用交易金额</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">证券权重分配方式</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable">剩余可用金额</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input"/>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                    	<a class="layui-btn layui-btn-sm">首次分配</a>
                        <a class="layui-btn layui-btn-sm">再次分配</a>
                        <a class="layui-btn layui-btn-sm">刷新</a>
                    </div>
                    <div class="layui-form-item">
                        <table class="layui-table" id="layuiTable"></table>
                    </div>
                </div>
            </div>
        </div>
    </form>
    <div class="layui-col-md12 layui-col-xs12 layui-col-sm12 layui-col-lg12" style="margin:20px 0;">
        <div class="text-center">
            <a id="UpTrInqSec001_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="UpTrInqSec001_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="UpTrInqSec001_btn_reset" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">重置</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/trade/batchordermanage/BatchOrderMenege002.js}" type="text/javascript"></script>
</div>
</body>
</html>
