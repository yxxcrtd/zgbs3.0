<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>询价交易-现券买卖交易查询</title>
    <style>
        .pool-table .layui-table-view{
            height: 275px!important;
        }
        .pool-table .layui-table-view .layui-table-body{
            height: 190px!important;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area" >
            <a id="UpTrInqBuyBack001_btn_add" class="layui-btn layui-btn-sm">新增报价</a>
            <a id="UpTrInqBuyBack001_btn_modify" class="layui-btn layui-btn-sm">修改报价</a>
            <a id="UpTrInqBuyBack001_btn_reply" class="layui-btn layui-btn-sm">回复报价</a>
            <a id="UpTrInqBuyBack001_btn_revoke" class="layui-btn layui-btn-sm">撤回报价</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
            <form class="layui-form"  id="submitForm" >
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">报价编号</label>
                        <div class="layui-input-inline input-inline">
                            <select id="quotationNum" name="quotationNum" class="layui-input form-input input-select" allowClear="true">
                            	<option></option>
	                            <option value="01">2018082001</option>
	                            <option value="02">2018082002</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">组合名称</label>
                        <div class="layui-input-inline input-inline">
                            <select id="portfolioId" name="portfolioId" class="layui-input form-input input-select" allowClear="true"
                            data-th-data-url="@{/invest/trade/uptrinqbuyback/UpTrInqBuyBack001/getPortfolioId}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">交易对手</label>
                        <div class="layui-input-inline input-inline">
                            <select id="tradeCounter" name="tradeCounter" class="layui-input form-input input-select" allowClear="true"
                            	    data-th-data-url="@{/invest/trade/uptrinqbuyback/UpTrInqBuyBack001/getCounterId}">
                                <!-- <option value="01">xx银行</option> -->
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">本方交易方向</label>
                        <div class="layui-input-inline input-inline">
                            <select id="tradeDirection" name="tradeDirection" class="layui-input form-input input-select" allowClear="true">
                            	<option></option>
                                <option value="01">正回购</option>
                                <option value="02">逆回购</option>
                                <!-- <option value="01">正回购</option> -->
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">交易状态</label>
                        <div class="layui-input-inline input-inline">
                            <select id="tradeState" name="tradeState" class="layui-input form-input input-select" allowClear="true">
                                <!-- <option value="01">待回复</option> -->
                                <option></option>
                                <option value="01">成功</option>
                                <option value="02">已回复</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">报价状态</label>
                        <div class="layui-input-inline input-inline">
                            <select id="quotationState" name="quotationState" class="layui-input form-input input-select" allowClear="true">
                                <!-- <option value="01">成功</option> -->
                                <option></option>
                                <option value="01">成功</option>
                                <option value="02">失败</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">本方角色</label>
                        <div class="layui-input-inline input-inline">
                            <select id="partyRole" name="partyRole" class="layui-input form-input input-select" allowClear="true">
                                <!-- <option value="01">确认方</option> -->
                                <option></option>
                                <option value="01">询价方</option>
                                <option value="02">确认方</option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">业务发生时间</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="searchDate" name="searchDate" class="layui-input form-input input-dateRangeSelect" placeholder="请选择、支持区间">
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="pool-table1" style="display: none;">
            <table class="layui-table" id="dataTable2"></table>
        </div>
        <div class="pool-table"style="display: block;" >
            <div class="pool-table-top">
                <table class="layui-table" id="dataTable"></table>
            </div>
            <div>
                <table class="layui-table" id="dataTable1"></table>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/poc/directtransaction/uptrinqbuyback/UpTrInqBuyBack001.js}" type="text/javascript"></script>
</div>
</body>

</html>
