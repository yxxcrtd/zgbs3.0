<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>批量下单管理</title>
    <style>
        .ptl-table .layui-table-view{
            height: 490px!important;
        }
        .ptl-table .layui-table-body{
            height: 405px!important;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area">
            <a class="layui-btn layui-btn-sm" id="BatchOrderMenege001_btn_share">股票池配置</a>
            <a class="layui-btn layui-btn-sm" id="BatchOrderMenege001_btn_strategy">策略配置</a>
            <a class="layui-btn layui-btn-sm" id="BatchOrderMenege001_btn_order">批量下单</a>
            <a class="layui-btn layui-btn-sm" id="BatchOrderMenege001_btn_chechan">批量撤单</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
            <form class="layui-form"  id="submitForm" >
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">股票池代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" class="layui-input form-input">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">股票池名称</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" class="layui-input form-input">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">策略代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" class="layui-input form-input">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">策略名称</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" class="layui-input form-input">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">委托时间</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" class="layui-input form-input input-dateRangeSelect" placeholder="请选择、支持区间">
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/trade/batchordermanage/BatchOrderMenege001.js}" type="text/javascript"></script>
</div>
</body>

</html>
