prod:
  bussRep: 1
############################开源框架的配置############################

#============Server配置============#
server:
  port: 8080
  port: 8080                      # Server HTTP port
  address: 0.0.0.0
  maxHttpHeaderSize: 102400
  context-path: /tams
listener:
  port: 8888
  length: 8
  encode: UTF-8
  servlet:
    contextPath: /tams            # Context path of the application.  
  ssl:
   enabled: false                 # 是否启用SSL支持  
  tomcat:
    accept-count: 100             # 当所有可能的请求处理线程都在使用时，传入的连接请求的最大队列长度  
    max-connections: 300          # 服务器在任何给定时间内接受和处理的最大连接数  
    max-http-form-post-size: 50MB # 整个POST请求的最大大小    
    uri-encoding: UTF-8           # 用来解码URI的字符编码
    threads:
      max: 200                    # Tomcat工作线程的最大数量
      min-spare: 200              # Tomcat工作线程的最小数量 
      
#============logging配置============#            
logging:
  level: 
    root: info
  file:
    path: /tmp/logs
    
#============mybatis配置============#  
mybatis:
  mapper-locations:
  - classpath*:com/joyintech/**/dao/sqlmap/**/*Mapper*.xml

#============Spring配置============#  
spring:
  jmx:
    enabled: false
  thymeleaf:
    cache: false
  profiles:
    active: allinone
  application:
    name: tams-server
    dfstype: 2
  datasource:
    type: org.apache.commons.dbcp2.BasicDataSource
    validationQuery: SELECT 1 FROM DUAL
    testOnBorrow: true   #从连接池获取一个连接时，验证有效性
    testOnReturn: true   #连接被归还到连接池时，验证有效性
    testOnCreate: true   #连接创建后，马上验证有效性
    testWhileIdle: true  #连接空闲时，验证有效性
    minEvictableIdleTimeMillis: 1800000   #空闲的连接最低要待N毫秒后，才会被释放
    removeAbandonedTimeout: 300  #一个被抛弃连接可以被移除的超时时间
    initialSize: 10   #连接池被启动时初始化的创建的连接个数  (开发和测试本地启动服务可适当减小)
    maxTotal: 50     #最大活动连接数  (开发和测试本地启动服务可适当减小)
    maxIdle: 50      #最大空闲连接数  (开发和测试本地启动服务可适当减小)
    minIdle: 20       #最小空闲连接数  (开发和测试本地启动服务可适当减小)
    timeBetweenEvictionRunsMillis: 60000   #空闲对象驱逐线程运行时的休眠毫秒数
    numTestsPerEvictionRun: 10  #在每个空闲对象驱逐线程运行过程中中进行检查的对象个数
    removeAbandonedOnBorrow: true   #是否删除超过removeAbandonedTimout所指定时间的被遗弃的连接
    removeAbandonedOnMaintenance: true  #是否删除超过removeAbandonedTimout所指定时间的被遗弃的连接
    logAbandoned: true  #程序在回收连接的同时是否打印日志
  rabbitmq:
    publisher-confirms: true  #确保生产者到交换器exchange消息有没有发送成功
    publisher-returns: true   #消息没有被路由到指定的queue时将消息返回
    listener:
      simple:
        max-concurrency: 20
        concurrency: 1
        acknowledge-mode: manual
        retry:
          enabled: true
    template:
      retry:
    
  profiles:
    include:
    - framework    #资管框架
    - rmdb         #关系数据库
    - tams         #资管配置
    - redis        #Redis
    - rabbitmq     #RabbitMQ
    - microservice #微服务
    - exchange     #场内、银行间
    - postion      #头寸
  
  cloud:
    nacos:
      discovery:
        enabled: false
      mandatory: true
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  http:
          
  ## 附件上传 ##    
  servlet:
    multipart:
      maxFileSize: 10Mb
      maxRequestSize: 100Mb
  resources:
    chain:
      strategy:
        fixed:
          enabled: true    #静态资源配置:js和css变更时无需手工清缓存
base:
  datasource:
    type: org.apache.commons.dbcp2.BasicDataSource
    testOnBorrow: true
    testOnReturn: true
    testOnCreate: true
    testWhileIdle: true
    minEvictableIdleTimeMillis: 1800000
    removeAbandonedTimeout: 300
    initialSize: 10
    maxTotal: 50
    maxIdle: 50
    minIdle: 20
    timeBetweenEvictionRunsMillis: 60000
    numTestsPerEvictionRun: 10
    removeAbandonedOnBorrow: true
    removeAbandonedOnMaintenance: true
    logAbandoned: true
    connectionProperties: oracle.net.CONNECT_TIMEOUT=50000;oracle.net.ReadTimeout=50000

