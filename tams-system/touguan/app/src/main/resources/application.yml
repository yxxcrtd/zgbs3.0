    type: ehcache
    ehcache:
      config: classpath:ehcache_app.xml
  autoconfigure:
    exclude:
    - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
  mvc:
    format:
      date: yyyy-MM-dd            # 时间格式化(非json报文时,服务端参数是日期)
  web:
    resources:
      chain:
        strategy:
          fixed:
            enabled: true         #静态资源配置:js和css变更时无需手工清缓存
  ## JSON ##  
  jackson:
    locale: zh                           # 当地时区
    deserialization:
      fail-on-unknown-properties: false  # json中含pojo不存在属性时是否失败报错,默认true
    generator:
      ignore-unknown: true               # 忽略将要解析的任何JSON的未知属性
    default-property-inclusion: NON_NULL # 返回日期格式字符串
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      indent-output: true                # 格式化输出json字符串
        