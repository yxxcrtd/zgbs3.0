<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title data-th-text="#{RskPortAutoRelatePoint001}">组合自动关联指标</title>
    <style>
        .input-btn-append a{
            line-height: 20px;
        }
        .icon-upload{
            color:limegreen;
        }
        .delt{
            color: red;
        }
        .del{
            color: red;
        }
        .iconinput{color:blue}
        .mixtree-node{
            overflow: hidden;
            padding: 8px 0 8px 10px;
            color:rgb(119, 119, 119);
            border-bottom: dashed 1px #dbdbdb;
        }
        .btn-trans:hover {
            boder-right: solid 1px #dbdbdb;
            boder-bottom: solid 1px #dbdbdb;
        }
        .mixtree-node:hover { background-color: #D9ECFF;}
        .node_div{float:left;width: 70%; display: inline-block;}
        .operate_div{
            width:30%;
            float:left;
            display: none;
            }
        .btn-trans{background-color: transparent!important;border: 0px;font-weight: bold;}
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="layui-row">
        <form class="layui-form layui-col-md3" id="submitForm">
            <div class="layui-form-item" style="border: 1px solid #ccc; padding: 5px; min-height: 460px; overflow:auto;position:relative">
                <div class="input-btn-append" style="    position: absolute; right: 8px;">
                    <a id="RskPortAutoRelatePoint001_btn_creat" class="layui-btn layui-btn-sm btn-create btn-trans"
                       data-th-text="#{SysCommon.create}" style="float: right; padding-right: 5px;margin-top: 3px;color: yellowgreen;border: 0px!important;">鏂板缓</a>
                </div>
                <div id="mixTree">
                </div>
            </div>
        </form>
        <div class="layui-col-md9" style="float:right;padding-left:10px;">
        	<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-label-wrap"
								data-th-text="#{RskPortAutoRelatePoint001.indName}" style="width: 25%">指标名称</label>
							<div class="layui-input-inline input-inline">
								<input id="indName" name="indName"
									class="layui-input form-input" maxlength=32
									data-th-placeholder="#{SysCommon.placeholder}"/>
								
							</div>
						</div>
						<div class= "layui-col-md-offset4 "style="float:right">
					<a id="RskPortAutoRelatePoint001_btn_search" style="margin-left: 29px" class="layui-btn layui-btn-sm btn-search" data-th-text="#{SysCommon.search}">查询</a>
                    <a id="RskPortAutoRelatePoint001_btn_add" class="layui-btn layui-btn-sm"><i class="iconfont icon-plus"></i><span data-th-text="#{SysCommon.add}">添加</span></a>
                    <a id="RskPortAutoRelatePoint001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}">删除</a>
            </div>
					</div>
				</form>
				
            <div>
                <table class="layui-table" id="dataTable" ></table>
            </div>
        </div>
        </div>
    </div>
</div>
<div layout:fragment="script">

    <script th:inline="javascript" type="text/javascript">
	        var SUP_OPERATOR=/*[[${SUP_OPERATOR}]]*/ ;  //操作符数据字典下拉
	        var SUP_CONNECTOR=/*[[${SUP_CONNECTOR}]]*/''; //运算符数据字典下拉
	        var SUP_LINK_TYPE=/*[[${SUP_LINK_TYPE}]]*/''; //连接符数据字典下拉
	        var SUP_UNIT=/*[[${SUP_UNIT}]]*/'';  //单位数据字典下拉
	        var IND_TYPE_TOTAL_ENUM=/*[[${IND_TYPE_TOTAL_ENUM}]]*/'';
	        var relateIndType=/*[[${IND_TYPE_LINK_ENCODE}]]*/'';
	        var NONE = /*[[${NONE}]]*/'';
        </script>
    <script data-th-src="@{/js/invest/riskredis/quota/common/RskQuotaCommon.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/invest/riskredis/quota/rskportautorelatepoint/RskPortAutoRelatePoint001.js}"></script>
</div>
</body>
</html>
