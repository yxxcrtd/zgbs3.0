<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RskSupervisionPortfPoint003}">新增组合包信息</title>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap pro-module-form"
			id="rskSupervisionPortfPoint003Form" style="padding: 0px 0px">
			<input type="hidden" data-th-value='${entity?.ptlBagId}'
				name="ptlBagId">
			<div class="pro-module-item">
				<div class="layui-form-item">
					<div class="form-inline-wrap" style="width: 100%">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{RskSupervisionPortfPoint003.portfolioBagName}"
							style="width: 13% !important">组合包名称</label>
						<div class="layui-input-inline input-inline"
							style="width: 74% !important">
							<input type="text" th:id="|${pageId}_ptlBagName|"
								name="ptlBagName" class="layui-input form-input"
								placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-value='${entity?.ptlBagName}' required>
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<label class="layui-form-label form-label-wrap" style="width: 13%"
						data-th-text="#{RskSupervisionPortfPoint003.portfolioMix}">组合成分</label>
					<div style="float: left; width: 32%">
						<div class="pro-module-title"
							style="border-bottom: 0px; overflow: hidden">
							<div style="width: 80% !important; float: left">
								<select id="sortType" name="sortType"
									class="layui-input form-input input-select"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-initValue="'01'"
									data-th-data-result='${CLASSIFY_DIMENSION}' allowClear="false">
								</select>
							</div>
							<div
								style="width: 18%; margin-left: 5px; float: left; text-align: center">
								<a
									style="width: 80px; height: 30px; font-weight: bold; line-height: 30px; font-size: 14px"
									id="selectorAtag">筛选</a>
								<div id="selectorConditionFilter"
									style="display: none; border: 1px solid #ccc; position: absolute; background: #fff; z-index: 1">
									<div class="sgePortDiv">
										<label class="layui-form-label form-label-wrap"
											style="width: 17%; padding-right: 2px !important"
											data-th-text="组合代码">组合代码</label>
										<div class="layui-input-inline input-inline"
											style="width: 32% !important">
											<input type="text" id="portfolioSingleName"
												name="portfolioSingleName" class="layui-input form-input"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}">
										</div>
										<label class="layui-form-label form-label-wrap"
											style="width: 17%; padding-right: 2px !important"
											data-th-text="收益类型">收益类型</label>
										<div class="layui-input-inline input-inline sgePort14sub">
											<select id="profitType" name="profitType"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-result='${PROFIT_TYPE}'></select>
										</div>

									</div>
									<div class="sgePortDiv">
										<label class="layui-form-label form-label-wrap"
											style="width: 17%; padding-right: 2px !important"
											data-th-text="开放类型">开放类型</label>
										<div class="layui-input-inline input-inline sgePort14sub">
											<select id="issueMode" name="issueMode"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-result='${ISSUE_MODE}'></select>
										</div>
										<label class="layui-form-label form-label-wrap"
											style="width: 17%; padding-right: 2px !important"
											data-th-text="募集方式">募集方式</label>
										<div class="layui-input-inline input-inline sgePort14sub">
											<select id="raiseType" name="raiseType"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-result='${RAISE_TYPE}'></select>
										</div>
									</div>
									<div class="sgePortDiv">
										<label class="layui-form-label form-label-wrap"
											style="width: 17%; padding-right: 2px !important"
											data-th-text="投资性质">投资性质</label>
										<div class="layui-input-inline input-inline"
											style="width: 32% !important">
											<select id="investType" name="investType"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-result='${INVEST_TYPE}'></select>
										</div>
									</div>
									<div class="sgePortDiv" style="margin-bottom: 10px">
										<a id="RskSupervisionPortfPoint003_btn_portQuery"
											style="margin-left: 9px" class="layui-btn layui-btn-sm"
											data-th-text="#{SysCommon.search}">查询</a> <a
											id="RskSupervisionPortfPoint003_btn_portClose"
											style="margin-left: 9px" class="layui-btn layui-btn-sm"
											data-th-text="关闭">关闭</a>
									</div>
								</div>
							</div>
						</div>
						<div class="" id="singleTree">
							<div class="layui-input"
								style="border: 1px solid #dbdbdb; scroll-y: auto; scroll-x: hidden; height: 250px; overflow-y: scroll; margin-left: 0px; margin-right: 50px;"
								id="treeDataSingle"
								data-th-url='|@{/invest/riskredis/quota/superviseindicator/RskSupervisionIndicator002/getAllPortfolioBySort?type=01}'>
							</div>
						</div>
					</div>
					<div class="repo-trade-middle">
						<a class="trade-btn-wrap trade-add-btn addPortf"><i
							class="iconfont icon-batch-down"></i><span>加入</span></a> <a
							class="trade-btn-wrap trade-romove-btn removePortf"><i
							class="iconfont icon-batch-upturn"></i><span>移除</span></a>
					</div>
					<!-- <div class="" style="float: left;width:8%;margin-top: 130px" >
					    <div class="addPortf" ><span class="control-label" style="color:#2882C1;margin-left:10px">》加入</span></div>
						<div class="removePortf" ><span class="control-label" style="color:#FB3A3A;margin-left:5px">《  移除</span></div>
					</div> -->
					<div class="" style="float: left; height: 250px; width: 32%">
						<h3 class="pro-module-title"
							style="height: 24px; border-bottom: 0px">
							<span class="title-des" style="float: left;">已选</span>
							<div style="width: 60% !important; float: left;">
								<input id="portfoliohaveSelName" name="portfoliohaveSelName"
									class="layui-input form-input"
									style="width: 70% !important; display: inline-block;"
									placeholder="组合名称"/> <a id="RskSupervisionPortfPoint003_btn_selQuery"
									style="width: 25% !important" class="layui-btn layui-btn-sm"
									data-th-text="#{SysCommon.search}">查询</a>
							</div>
							<span class="manage-info-item"
								style="float: right; padding-right: 0px"><input id="selPortfck"
								type="checkbox" data-th-lay-filter="haveSelPortfck"> 全选</span>
						</h3>

						<div class="layui-input"
							style="border: 1px solid #dbdbdb; scroll-y: auto; scroll-x: hidden; height: 250px; overflow-y: scroll; margin-left: 0px; margin-right: 50px;"
							id="treeDataSelected">
							<ul id="treeDepartmentYxuan" class="manage-info-item"
								style="overflow: hidden; padding-left: 5px; margin-top: 1px; border: 0px solid #ccc;">
							</ul>
						</div>
					</div>
				</div>

				<div class="layui-form-item"
					style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #dbdbdb">
					<span style="padding: 0px 5px; border-left: 4px solid #2693ff">自定义组合参数：</span>
				</div>
				<div>
					<table class="layui-table" id="definePortfTable"></table>
				</div>
				<div>
					<span style="color: #D42823">说明：设置组合参数后，新增组合满足参数条件时，自动增加到组合包中</span>
				</div>
			</div>
			<div class="layui-col-md10" style="margin: 20px;">
				<div class="text-center">
					<a id="RskSupervisionPortfPoint003_btn_save"
						class="layui-btn layui-btn-sm btn-save"
						data-th-text="#{SysCommon.save}">保存</a><a
						id="RskSupervisionPortfPoint003_btn_submit"
						class="layui-btn layui-btn-sm btn-submit"
						data-th-text="#{SysCommon.submit}">提交</a> <a
						id="RskSupervisionPortfPoint003_btn_cancel"
						class="layui-btn layui-btn-sm btn-cancel"
						data-th-text="#{SysCommon.cancel}">取消</a>
				</div>
			</div>
		</form>
	</div>
	<div layout:fragment="script">
		<style type="text/css">
.control-label {
	padding: 0px;
	font-weight: bold;
	text-align: right;
	width: 100%;
	font-size: 1.2em
}

.btn-detail-del {
	margin-left: 2px;
}

.layui-col-md6 {
	float: left;
	width: 48%;
	margin-left: 16px
}

div.input-btn-append a {
	line-height: 20px !important
}

.manage-info-item li {
	padding-right: 15px;
	line-height: 24px;
	margin-bottom: 3px;
}

.manage-info-item {
	float: left;
	padding-right: 10px;
}

.manage-info-item .layui-form-checkbox {
	margin-right: 2px;
	margin-top: -2px;
	padding-right: 0;
	line-height: 15px;
	width: 15px;
	height: 15px;
}

.manage-info-item .layui-form-checkbox i {
	line-height: 15px;
	width: 15px;
	height: 15px;
	border-left: 1px solid #d2d2d2;
	font-size: 15px;
}

.layui-table-body {
	overflow: hidden !important
}

.repo-trade-middle {
	width: 10%;
	float: left;
	margin-top: 90px;
}

.trade-btn-wrap {
	display: block;
	text-align: center;
	margin: 0 12px;
	color: #0b72f1;
	padding: 5px 0;
	background: #f5f5f5;
	border: 1px solid #dddddd;
	cursor: pointer;
}

.trade-btn-wrap:hover {
	color: #0b72f1;
}

.trade-btn-wrap i {
	display: block;
}

.trade-romove-btn {
	margin-top: 15px;
}

.sgePortDiv {
	width: 100%;
	overflow: hidden;
	clear: both;
	padding-top: 8px;
}

.sgePort23sub {
	width: 23% !important
}

.sgePort14sub {
	width: 32% !important
}
</style>
		<script data-th-inline="javascript" type="text/javascript">
			var getAllRelationUrl = /*[[@{/invest/riskredis/quota/superviseindicator/RskSupervisionIndicator002/getAllPortfolioBySort}]]*/'';
			var entity=/*[[${entity}]]*/'';
		  	var CLASS_DIMENSION_SOURCE = /*[[${CLASS_DIMENSION_SOURCE}]]*/ ;
		  	var CLASSIFY_DIMENSION = /*[[${CLASSIFY_DIMENSION}]]*/ ;
		  	var SUP_LINK_TYPE = /*[[${SUP_LINK_TYPE}]]*/ ;
		</script>
		<script
			data-th-src="@{/js/invest/riskredis/quota/portfolioindicator/RskSupervisionPortfPoint003.js}">
		</script>
	</div>
</body>
</html>
