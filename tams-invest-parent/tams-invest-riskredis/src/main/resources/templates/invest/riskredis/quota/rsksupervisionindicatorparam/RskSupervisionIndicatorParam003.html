<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorator="~{layout/default}">
<head>
<title data-th-text="#{RskSupervisionIndicatorParam003}">固定值参数新建</title>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap" id="submitForm">
			<div class="pro-module-wrapper pro-module-base">
				<div class="pro-module-wrap">
					<div class="pro-module">
						<div class="pro-module-item">
							<input type="text" id="workflowId"
								data-th-value="${entity?.workflowId}" style="display: none;" />
							<input type="text" id="paraCode"
								data-th-value="${entity?.paraCode}" style="display: none;" />
							<div class="layui-form-item">
								<div class="layui-col-md12 layui-col-sm12 layui-col-lg12">
									<label class="layui-form-label form-lable" style="width: 22%;"
										data-th-text="#{RskSupervisionIndicatorParam003.paraName}">参数名称</label>
									<div class="layui-input-inline input-inline">
										<input type="text" class="layui-input form-input"
											id="paraName" name="paraName"
											data-th-value="${entity?.paraName}" 
											data-th-placeholder="#{SysCommon.placeholder}"
											required="required" maxlength="60" />
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="layui-col-md12 layui-col-sm12 layui-col-lg12">
									<label class="layui-form-label form-lable" style="width: 22%;"
										data-th-text="#{RskSupervisionIndicatorParam003.content}">参数值ֵ</label>
									<div class="layui-input-inline input-inline">
										<input type="text" class="layui-input form-input" id="content" oninput="value=value.replace(/[^\d]/g,'')"
											name="content" data-th-value="${entity?.content}"
											data-th-placeholder="#{SysCommon.placeholder}"
											required="required" maxlength="32" />
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="layui-col-md12 layui-col-sm12 layui-col-lg12">
									<label class="layui-form-label form-lable" style="width: 22%;"
										data-th-text="#{RskSupervisionIndicatorParam003.validDate}">有效日期</label>
									<!-- <div class="layui-input-inline input-inline">
										<input id="validDate" name="validDate"
											class="layui-input form-input input-dateSelect"
											placeholder="��ѡ��ʱ��"
											data-th-value="${#dates.format(entity?.validDate,'yyyy-MM-dd')}"
											data-th-placeholder="#{SysCommon.placeholder}"
											required="required">
									</div> -->
									<div class="layui-input-inline input-inline" style="width:60%!important">
										<input style="float: left; margin-right: 5px" type="text"
											id="validDate" name="validDate"
											data-th-value='${#dates.format(entity?.validDate,"yyyy-MM-dd")}'
											required="required"
											class="layui-input form-input input-dateSelect" />
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="layui-col-md12 layui-col-sm12 layui-col-lg12">
									<label class="layui-form-label form-lable" style="width: 22%;"
										data-th-text="#{RskSupervisionIndicatorParam003.notifyDate}">下次提醒日期</label>
									<div class="layui-input-inline input-inline" style="width:60%!important">
										<input id="notifyDate" name="notifyDate"
											class="layui-input form-input input-dateSelect"
											data-th-value="${#dates.format(entity?.notifyDate,'yyyy-MM-dd')}"
											data-th-placeholder="#{SysCommon.placeholder}">
									</div>
								</div>
							</div>
                            <div class="layui-form-item">
                                <div class="layui-col-md12 layui-col-sm12 layui-col-lg12" id="depositInstitutionCode">
                                    <label class="layui-form-label form-lable" style="width: 22%;"
                                        data-th-text="#{RskSupervisionIndicatorParam003.institutionName}">机构名称</label>
                                    <div class="layui-input-inline input-inline" style="width:60%!important">
                                       <select type="text" id="institutionId"
                                        name="institutionId" required="required"
                                        class="layui-input form-input input-select" placeholder=""
                                        data-th-placeholder="#{SysCommon.placeholder}" multiple="true"
                                        data-th-data-url="@{/invest/riskredis/quota/rsksupervisionindicatorparam/RskSupervisionIndicatorParam003/getInstitutionId}"
                                        data-th-initValue="${entity?.institutionCode}">
                                       </select>
                                   </div>
                                </div>
                            </div>
						</div>
					</div>
				</div>
			</div>

			<div class="layui-col-md10" style="margin: 50px;">
				<div class="text-center">
					<a id="RskSupervisionIndicatorParam003_btn_save"
						class="layui-btn layui-btn-sm btn-save"
						data-th-text="#{SysCommon.save}">保存</a> <a
						id="RskSupervisionIndicatorParam003_btn_submit"
						class="layui-btn layui-btn-sm btn-submit"
						data-th-text="#{SysCommon.submit}">提交</a><a
						id="RskSupervisionIndicatorParam003_btn_cancel"
						class="layui-btn layui-btn-sm btn-cancel"
						data-th-text="#{SysCommon.cancel}">取消</a>
				</div>
			</div>
		</form>
	</div>
	<div layout:fragment="script">
		<style>
.form-label-wrap {
	width: 36% !important;
}

.manage-info-item li {
	float: left;
	padding-right: 10px;
	line-height: 24px;
}

.manage-info-item {
	float: left;
	padding-right: 10px;
}

.manage-info-item .layui-form-checkbox {
	margin-right: 2px;
	margin-top: -2px;
	padding-right: 0;
	line-height: 15px;
	width: 15px;
	height: 15px;
}

.manage-info-item .layui-form-checkbox i {
	line-height: 15px;
	width: 15px;
	height: 15px;
	border-left: 1px solid #d2d2d2;
	font-size: 15px;
}

.manage-info-item .layui-form-checked i, .manage-info-item .layui-form-checked:hover i
	{
	border-color: #2693ff;
	color: #2693ff;
}
</style>
		<script data-th-inline="javascript" type="text/javascript">
    	var entity=/*[[${entity}]]*/'';
        var paraDisplayTypeFix = /*[[${paraDisplayTypeFix}]]*/'';
        var SYS_DATE = /*[[${SYS_DATE}]]*/'';
    </script>
		<script
			data-th-src="@{/js/invest/riskredis/quota/rsksupervisionindicatorparam/RskSupervisionIndicatorParam003.js}"
			type="text/javascript">
    </script>
	</div>
</body>
</html>
