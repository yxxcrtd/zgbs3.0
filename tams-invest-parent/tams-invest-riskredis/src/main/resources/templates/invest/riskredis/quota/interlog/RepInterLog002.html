<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RepInterLog002}">接口日志管理详细</title>
</head>
<body>
	<div layout:fragment="content">
		<input id="uuid" name="uuid" data-th-value="${entity?.uuid}"
			style="display: none;">
		<form class="layui-form joyin-form-wrap" id="submitForm">
			<div class="layui-form-item">
				<input type="text" id="sysCode1"
					data-th-value="${entity?.sysCodeAbbr}" style="display: none" /> <input
					type="text" id="ipAddress" data-th-value="${entity?.ipAddress}"
					style="display: none" /> <input type="text" id="port"
					data-th-value="${entity?.port}" style="display: none" />
				<div class="layui-inline layui-col-md9 layui-col-sm9 layui-col-lg9">
					<label class="layui-form-label form-label-wrap"
						data-th-text="#{RepInterLog001.infId}">接口</label>
					<div class="layui-input-inline input-inline">
						<input type="text" class="layui-input form-input" id="infId"
							name="infId" data-th-value="${entity?.infIdAbbr}"
							data-th-placeholder="#{SysCommon.placeholder}"
							required="required" maxlength="120" disabled="disabled" />
					</div>
				</div>

			</div>

			<div class="layui-form-item">
				<div class="layui-inline layui-col-md9 layui-col-sm9 layui-col-lg9">
					<label class="layui-form-label form-label-wrap"
						data-th-text="#{RepInterLog001.sysCode}">消费系统</label>
					<div class="layui-input-inline input-inline">
						<input type="text" class="layui-input form-input" id="sysCode"
							name="sysCode" data-th-value="${entity?.sysCode}"
							data-th-placeholder="#{SysCommon.placeholder}"
							required="required" maxlength="60" disabled="disabled" />
					</div>
				</div>
			</div>

			<div class="layui-form-item">
				<div class="layui-inline layui-col-md9 layui-col-sm9 layui-col-lg9">
					<label class="layui-form-label form-label-wrap"
						data-th-text="#{RepInterLog001.seqNo}">报文流水号</label>
					<div class="layui-input-inline input-inline">
						<input type="text" class="layui-input form-input" id="seqNo"
							name="seqNo" data-th-value="${entity?.seqNo}"
							data-th-placeholder="#{SysCommon.placeholder}"
							required="required" maxlength="60" disabled="disabled" />
					</div>
				</div>
			</div>

			<div class="layui-form-item">
				<div class="layui-inline layui-col-md9 layui-col-sm9 layui-col-lg9">
					<label class="layui-form-label form-label-wrap"
						data-th-text="#{RepInterLog001.tranDate}">接收日期</label>
					<div class="layui-input-inline input-inline">
						<input type="text" class="layui-input form-input" id="tranTime"
							name="tranDate" data-th-value="${entity?.tranDateRet}"
							data-th-placeholder="#{SysCommon.placeholder}"
							required="required" maxlength="60" disabled="disabled" />
					</div>
				</div>
			</div>

			<div class="layui-form-item">
				<div class="layui-inline layui-col-md9 layui-col-sm9 layui-col-lg9">
					<label class="layui-form-label form-label-wrap"
						data-th-text="#{RepInterLog001.tranTime}">接收时间</label>
					<div class="layui-input-inline input-inline">
						<input type="text" class="layui-input form-input" id="tranTime"
							name="tranTime" data-th-value="${entity?.tranTimeRet}"
							data-th-placeholder="#{SysCommon.placeholder}"
							required="required" maxlength="60" disabled="disabled" />
					</div>
				</div>
			</div>

			<div class="layui-form-item">
				<div class="layui-inline layui-col-md9 layui-col-sm9 layui-col-lg9">
					<label class="layui-form-label form-label-wrap"
						data-th-text="#{RepInterLog001.doStatus}">处理状态</label>
					<div class="layui-input-inline input-inline">
						<input type="text" class="layui-input form-input" id="doStatus"
							name="doStatus" data-th-value="${entity?.doStatusAbbr}"
							data-th-placeholder="#{SysCommon.placeholder}"
							required="required" maxlength="60" disabled="disabled" />
					</div>
				</div>
			</div>

			<div class="layui-form-item">
				<div class="layui-inline layui-col-md9 layui-col-sm9 layui-col-lg9">
					<label class="layui-form-label form-label-wrap"
						data-th-text="#{RepInterLog001.rtnCode}">返回码</label>
					<div class="layui-input-inline input-inline">
						<input type="text" class="layui-input form-input" id="rtnCode"
							name="rtnCode" data-th-value="${entity?.rtnCode}"
							data-th-placeholder="#{SysCommon.placeholder}"
							required="required" maxlength="60" disabled="disabled" />
					</div>
				</div>
			</div>

			<div class="layui-form-item">
				<div class="layui-inline layui-col-md9 layui-col-sm9 layui-col-lg9">
					<label class="layui-form-label form-label-wrap"
						data-th-text="#{RepInterLog001.rtnMsg}">返回消息</label>
					<div class="layui-input-inline input-inline">
						<input type="text" class="layui-input form-input" id="rtnMsg"
							name="rtnMsg" data-th-value="${entity?.rtnMsg}"
							data-th-placeholder="#{SysCommon.placeholder}"
							required="required" maxlength="60" disabled="disabled" />
					</div>
				</div>
			</div>

			<div class="layui-form-item">
				<div class="layui-inline layui-col-md9 layui-col-sm9 layui-col-lg9">
					<label class="layui-form-label form-label-wrap"
						data-th-text="#{RepInterLog001.requestData}">请求报文</label>
					<div class="layui-input-inline input-inline">
						<input type="text" class="layui-input form-input" id="requestData"
							name="requestData" data-th-value="${entity?.requestData}"
							data-th-placeholder="#{SysCommon.placeholder}"
							required="required" maxlength="60" disabled="disabled" />
					</div>
				</div>
			</div>

			<div class="layui-form-item">
				<div class="layui-inline layui-col-md9 layui-col-sm9 layui-col-lg9">
					<label class="layui-form-label form-label-wrap"
						data-th-text="#{RepInterLog001.responseData}">应答报文</label>
					<div class="layui-input-inline input-inline">
						<input type="text" class="layui-input form-input"
							id="responseData" name="responseData"
							data-th-value="${entity?.responseData}"
							data-th-placeholder="#{SysCommon.placeholder}"
							required="required" maxlength="60" disabled="disabled"
							style="width: 87% !important; display: inline-block;" /><a
							id="RepInterLog002_btn_detail" class="layui-btn layui-btn-sm"
							data-th-text="#{RepInterLog002.detail}"
							style="width: 10% !important;float: right;">明细</a>


					</div>
				</div>
			</div>

			<div
				class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11"
				style="margin-top: 40px;">
				<div class="text-center">
					<a id="RepInterLog002_btn_cancel"
						class="layui-btn layui-btn-sm btn-cancel"
						data-th-text="#{SysCommon.cancel}">取消</a>
				</div>
			</div>
		</form>
	</div>

	<div class="layui-form-item">
		<div class="layui-col-md10" style="margin: 50px;">
			<div class="text-center">
				<a id="RepInterLog002_btn_cancel"
					class="layui-btn layui-btn-sm btn-cancel"
					data-th-text="#{SysCommon.cancel}">取消</a>
			</div>
		</div>
	</div>


	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
    
            var SUP_UNIT=/*[[${SUP_UNIT}]]*/'';  //单位数据字典下拉
            
		    var uuid=/*[[${uuid}]]*/''; 
    </script>
		<script data-th-src="@{/js/invest/riskredis/quota/interlog/RepInterLog002.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
