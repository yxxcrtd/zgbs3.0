<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<title data-th-text="#{RskSupervisionPortfPoint004}">组合包成分查询</title>
</head>
<body>
    <div layout:fragment="content">
     		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
				    
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								data-th-text="#{RskSupervisionPortfPoint005.portfolioName}">组合名称</label>
							<div class="layui-input-inline input-inline">
								<input type="text" name="portfolioName" data-th-placeholder="#{SysCommon.placeholder}" id="portfolioName"
							class="layui-input form-input input-text" />		
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							  <label class="layui-form-label form-label-wrap" 
									data-th-text="#{RskSupervisionPortfPoint005.profitType}">收益类型</label>
								<div class="layui-input-inline input-inline ">
									<select  id="profitType" name="profitType"
										class="layui-input form-input input-select" 
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-data-result='${PROFIT_TYPE}'></select>
								</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							 <label class="layui-form-label form-label-wrap"
									data-th-text="#{RskSupervisionPortfPoint005.openType}">开放类型</label>
								<div class="layui-input-inline input-inline">
									<select  id="issueMode" name="issueMode"
										class="layui-input form-input input-select" 
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-data-result='${ISSUE_MODE}'></select>
								</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-label-wrap" 
								data-th-text="#{RskSupervisionPortfPoint005.raiseType}">募集方式</label>
							<div class="layui-input-inline input-inline">
								<select  id="raiseType" name="raiseType"
									class="layui-input form-input input-select" 
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result='${RAISE_TYPE}'></select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							 <label class="layui-form-label form-label-wrap" 
									data-th-text="#{RskSupervisionPortfPoint005.investNature}">投资性质</label>
								<div class="layui-input-inline input-inline">
									<select  id="investNature" name="investNature"
										class="layui-input form-input input-select" 
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-data-result='${INVEST_TYPE}'></select>
								</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap" 
									data-th-text="#{RskSupervisionPortfPoint005.portfolioType}">产品类型</label>
								<div class="layui-input-inline input-inline ">
									<select  id="portfolioType" name="portfolioType"
										class="layui-input form-input input-select" 
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-data-result='${PORTFOLIO_TYPE}'></select>
								</div>
						</div>
					</div>
				</form>
			</div>

			<div >
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
    </div>
    <div layout:fragment="script">
		<style>
		.line24{
		line-height: 24px;
		padding:0px 10px 0px 0px;
		}
		.width30{
		width:30%;
		}
		</style>
		<script data-th-inline="javascript" type="text/javascript">
		     var ptlBagId=/*[[${ptlBagId}]]*/'';
			 var isRule=/*[[${isRule}]]*/'';
		</script>
        <script data-th-src="@{/js/invest/riskredis/quota/portfolioindicator/RskSupervisionPortfPoint005.js}"></script>
    </div>
</body>

</html>
