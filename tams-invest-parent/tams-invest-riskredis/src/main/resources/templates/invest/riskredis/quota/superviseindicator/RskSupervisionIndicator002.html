<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorator="~{layout/default}">
<head>
<title data-th-text="#{RskSupervisionIndicator002}">监督指标新建</title>
</head>
<body>
	<div layout:fragment="content">
		<div id="superIndicatorDiv" class="pro-module-container page-step" style="border-bottom: 0px;min-height:500px">
			<form class="layui-form joyin-form-wrap pro-module-form"
				id="rskSupervisionIndicatorForm">
				  <input type="hidden" id="rskSupervisionIndId" name="rskSupervisionIndicatorDto.indId" data-th-value="${entity?.rskSupervisionIndicatorDto?.indId}" >
				 <input type="hidden" name="rskSupervisionIndicatorDto.expr" data-th-value="${entity?.rskSupervisionIndicatorDto?.expr}"/>
				 <input type="hidden" name="rskSupervisionIndicatorDto.isEnabled" data-th-value="${entity?.rskSupervisionIndicatorDto?.isEnabled}"/>
				<input id="workflowId" name="workflowId" data-th-value="${workflowId}" type="hidden">
				<input id="startWfType" name="startWfType" data-th-value="${startWfType}" type="hidden">
				<div class="pro-module-wrapper pro-module-base step" title="指标表达式" id="oneStepDiv">
					<div class="pro-module-wrap">
						<div class="pro-module">
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap" style="width: 68%">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{RskSupervisionIndicator002.indName}"
											style="width: 19% !important">指标名称</label>
										<div class="layui-input-inline input-inline" style="width: 75% !important"> 
											<input type="text" th:id="|${pageId}_indName|"
												name="rskSupervisionIndicatorDto.indName"
												class="layui-input form-input" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" maxlength="60"
												data-th-value='${entity?.rskSupervisionIndicatorDto?.indName}' required>
										</div>
									</div>
									<div class="form-inline-wrap" style="width: 32%">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{RskSupervisionIndicator002.indType}"
											style="width: 26% !important">指标类型</label>
										<div class="layui-input-inline input-inline" style="width: 52.5% !important">
											<select th:id="|${pageId}_indType|"
												name="rskSupervisionIndicatorDto.indType"
												formatoption="false" childrenIds="RskSupervisionIndicator002_supDirection"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue='${entity?.rskSupervisionIndicatorDto?.indType}' required
												data-th-data-result="${IND_TYPE}">
											</select>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap" style="width: 35%">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{RskSupervisionIndicator002.indNum}"
											   style="width: 37% !important">指标编号</label>
										<div class="layui-input-inline input-inline" style="width: 55% !important">
											<input type="text" th:id="|${pageId}_indNum|"
												   name="rskSupervisionIndicatorDto.indNum"
												   class="layui-input form-input" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}" maxlength="9"
												   data-th-value='${entity?.rskSupervisionIndicatorDto?.indNum}' required>
										</div>
									</div>
									<div class="form-inline-wrap" style="width: 65%">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{RskSupervisionIndicator002.supDoc}"
											   style="width: 14% !important">监管文件说明</label>
										<div class="layui-input-inline input-inline"
											 style="width: 75% !important">
											<input type="text" th:id="|${pageId}_supDoc|"
												   name="rskSupervisionIndicatorDto.supDoc"
												   class="layui-input form-input" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}"
												   data-th-value='${entity?.rskSupervisionIndicatorDto?.supDoc}' maxlength="300">
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap" style="width: 100%">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{RskSupervisionIndicator002.memo}" 
											style="width: 13% !important">备注</label>
										<div class="layui-input-inline input-inline"
											style="width: 80.1% !important">
											<input type="text" th:id="|${pageId}_memo|"
												name="rskSupervisionIndicatorDto.memo"
												class="layui-input form-input" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-value='${entity?.rskSupervisionIndicatorDto?.memo}' maxlength="300">
										</div>
									</div>
								</div>
								 <div class="layui-form-item">
									<div class="form-inline-wrap" style="width: 26%;">
										<label class="layui-form-label form-label-wrap"
										data-th-text="#{RskSupervisionIndicator002.isAdjust}"
											style="width: 49% !important">调整期</label>
										<div class="layui-input-block input-inline" style="width: 46.5% !important">
											<input type="radio" name="isAdjust" id="yes" value="Y" title="是" />
											<input type="radio" name="isAdjust" id="no" value="N" title="否" checked required>
										</div>
									</div>
									<div class="form-inline-wrap" style="width: 25%;">
										<label class="layui-form-label form-label-wrap"
										data-th-text="#{RskSupervisionIndicator002.adjust}"
											style="width: 26% !important">调整时间</label>
										<div class="layui-input-inline input-inline" 
										style="width: 40.1% !important">
											<input type="text" th:id="|${pageId}_adjust|" 
											name="rskSupervisionIndicatorDto.adjust"
											class="layui-input form-input text-number"
											data-th-placeholder="请输入天数" data-fixtype="1" data-textrange="0"
											 maxlength="10" data-th-value='${entity?.rskSupervisionIndicatorDto?.adjust}'>
											 <span class="input-right-show" style=" display: block;line-height: 30px; padding-left: 5px;overflow: hidden;height: 27px">天</span>
										</div>
									</div>
									<div class="form-inline-wrap" style="width: 28%">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{RskSupervisionIndicator002.isExcpWhenDivZero}"
											style="width: 36% !important">除0是否异常</label>
										<div class="layui-input-inline input-inline"
											style="width: 42.5% !important">
												<select th:id="|${pageId}_isExcpWhenDivZero|"
												name="rskSupervisionIndicatorDto.isExcpWhenDivZero"
												formatoption="false"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue='${entity?.rskSupervisionIndicatorDto?.isExcpWhenDivZero}'
												data-th-data-result="${DIV_ZERO_PASS_COND}" required>
											</select>
										</div>
									</div>
									 <div class="form-inline-wrap" style="width: 20%">
										 <label class="layui-form-label form-label-wrap" style="width: 55%;"
												data-th-text="#{RskSupervisionIndicator002.isDisplayOriginal}">是否显示原值</label>
										 <div class="layui-input-inline input-inline" style="width: 30%!important;">
											 <input type="checkbox" th:id="|${pageId}_isDisplayOriginal|"  name="rskSupervisionIndicatorDto.isDisplayOriginal"
													lay-skin="switch" lay-filter="isDisplayOriginalFilter"
													data-th-value="Y" lay-text="是|否" required
													data-th-checked="${'Y' == entity?.rskSupervisionIndicatorDto?.isDisplayOriginal}">
										 </div>
									 </div>
								 </div>
							</div>
							<h3 class="pro-module-title">
								<span class="title-des">指标表达式配置(必填)</span><i id="btn-pz-add"
									class="iconfont icon-found" title="添加指标表达式"
									style="color: #5cb85c; font-weight: bold;cursor: pointer;"></i><i
									class="iconfont icon-arrow-down pro-down-icon"></i>
							</h3>
							<div class="pro-module-item"
								style="height: 230px; overflow: auto">
								<div class="layui-form-item">
									<div class="form-inline-wrap" style="width: 99%"
										id="dt-pz-info-add"></div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="pro-module-wrapper step" title="指标监控条件" id="secStepDiv">
					<!-- 申报参数基本信息 -->
					<div
						th:replace="invest/riskredis/quota/superviseindicator/RskSupervisionIndicator003 :: #RskSupervisionIndicator003Div">
					</div>
				</div>
				<div class="pro-module-wrapper step" title="指标关联组合" id="threeStepDiv">
					<div id="rskSupervisionIndicator004Div"
						th:replace="invest/riskredis/quota/superviseindicator/RskSupervisionIndicator004 :: #RskSupervisionIndicator004Div">
					</div>
					<div class="row text-center stepbar" style="margin: 10px 0;">
						<a th:id="|${pageId}_btn_save|"
							class="layui-btn layui-btn-sm btn-save"
							data-th-text="#{SysCommon.save}">保存</a> <a
							th:id="|${pageId}_btn_submit|"
							class="layui-btn layui-btn-sm btn-submit"
							data-th-text="#{SysCommon.submit}">提交</a> <a
							th:id="|${pageId}_btn_cancel|"
							class="layui-btn layui-btn-sm btn-cancel"
							data-th-text="#{SysCommon.cancel}">取消</a>
					</div>
				</div>
				<div>
			</form>
		</div>
	</div>
	<div layout:fragment="script">
		<style type="text/css">
		.select-ind-rr {
			margin-left: 10px;
			width: 63% !important;
			float: left;
		}
		
		.select-ind-fh {
			margin-left: 10px;
			width: 12% !important;
			float: left;
		}
		
		.btn-detail-del {
			margin-left: 2px;
		}
		
		.btn-detail-del i {
			margin-left: 4px;
		}
		
		.layui-col-md6 {
			float: left;
			width: 48%;
			margin-left: 16px
		}
		
		.manager_fh_fh .select2-container {
			width: 90px !important
		}
		
		.layui-form-radio {
			line-height: 14px !important
		}
		
		.layui-form-radio>i {
			font-size: 16px !important
		}
		
		.layui-chcekbox {
			margin-right: 14px !important
		}
		
		.layui-inline {
			float: left;
		}
		
		.manage-info-item li {
			float: left;
			padding-right: 15px;
			line-height: 24px;
			margin-bottom:3px;
		}
		
		.manage-info-item {
			float: left;
			padding-right: 10px;
		}
		
		.manage-info-item .layui-form-checkbox {
			margin-right: 2px;
			margin-top: -2px;
			padding-right: 0;
			line-height: 15px;
			width: 15px;
			height: 15px;
		}
		
		.manage-info-item .layui-form-checkbox i {
			line-height: 15px;
			width: 15px;
			height: 15px;
			border-left: 1px solid #d2d2d2;
			font-size: 15px;
		}
		
		.manage-info-item .layui-form-checked i, .manage-info-item .layui-form-checked:hover i{
			border-color: #2693ff;
			color: #2693ff;
		}
		
		.manage-info-item .layui-form-radio {
			margin-top: 0px
		}
		
		div.input-btn-append a {
			line-height: 20px !important
		}
		.input-btn-append{
		height:24px!important
		}
		.rsk-tree .layui-input .ztree #treeDataSingle_tree_2_a{
				white-space: nowrap;
		     width: 350px; 
		    text-overflow: ellipsis;
		    overflow: hidden;
				}
				
		.sgePortDiv{
			   width:100%;
			   overflow:hidden;
			   clear:both;
			   padding-top: 8px;
			   }
		 .sgePort23sub{
		 width:23%!important
		 }
		 .sgePort14sub{
		 width:14%!important
		 }
		 span.select2-selection__rendered{
		 max-width: 250px;
		 }
		</style>
		<script data-th-inline="javascript" type="text/javascript">
			var entity=/*[[${entity}]]*/'';
		  	var IND_TYPE = /*[[${IND_TYPE}]]*/ ;
	        var SUP_FREQUENCY=/*[[${SUP_FREQUENCY}]]*/'';
	        var SUP_OPERATOR=/*[[${SUP_OPERATOR}]]*/ ;  //操作符数据字典下拉
	        var SUP_CONNECTOR=/*[[${SUP_CONNECTOR}]]*/''; //运算符数据字典下拉
	        var SUP_LINK_TYPE=/*[[${SUP_LINK_TYPE}]]*/''; //连接符数据字典下拉
	        var SUP_UNIT=/*[[${SUP_LINK_TYPE}]]*/'';  //单位数据字典下拉
	        var PORTFOLIO_LEVEL=/*[[${PORTFOLIO_LEVEL}]]*/'';  //组合层次数据字典下拉
	        var SW_INDUSTRY_ONE_TYPE=/*[[${SW_INDUSTRY_ONE_TYPE}]]*/'';  //申万行业一级分类
		    var pageId = /*[[${pageId}]]*/''; // 画面Id
		    var INDICATOR_PARAM=/*[[${INDICATOR_PARAM}]]*/''; //指标参数
		    var PORTFOLIO_LEVEL_01=/*[[${PORTFOLIO_LEVEL_01}]]*/''; // 组合层次-单组合
		    var CLASSIFY_DIMENSION_01=/*[[${CLASSIFY_DIMENSION_01}]]*/''; // 分类维度-收益类型
		    
		    var workflowId = /*[[${workflowId}]]*/'';
		    var relateIndType=/*[[${IND_TYPE_LINK_ENCODE}]]*/'';
		    var ALARM_OPER = /*[[${ALARM_OPER}]]*/'';//触警操作
		    
		    var xztzje = /*[[${xztzje}]]*/'';
		    var drjyl = /*[[${drjyl}]]*/'';
		    var jzd = /*[[${jzd}]]*/'';
		    var zxjgkz = /*[[${zxjgkz}]]*/'';
		    var lzxgl = /*[[${lzxgl}]]*/'';
		    var txkz = /*[[${txkz}]]*/'';
		    var ggkz = /*[[${ggkz}]]*/'';
		    var qxkz = /*[[${qxkz}]]*/'';
		    var jyekz = /*[[${jyekz}]]*/'';
		    
		    var wtjk = /*[[${wtjk}]]*/'';
		    var jyjk = /*[[${jyjk}]]*/'';
		    var shjk = /*[[${shjk}]]*/'';
		    var cfjk = /*[[${cfjk}]]*/'';
		    
		    var cjcz_yj = /*[[${cjcz_yj}]]*/'';//预警
		    var cjcz_sp = /*[[${cjcz_sp}]]*/'';//审批
		    var cjcz_jz = /*[[${cjcz_jz}]]*/'';//禁止
		    var SYS_DATE = /*[[${SYS_DATE}]]*/'';//平台日
		    
		    var clsfyc_tsyc = /*[[${clsfyc_tsyc}]]*/'';//提示异常
		</script>
		<script
			data-th-src="@{/js/invest/riskredis/quota/superviseindicator/RskSupervisionIndicator002.js}"></script>
		<script
			data-th-src="@{/js/invest/riskredis/quota/superviseindicator/RskSupervisionIndicator003.js}"></script>
		<script
			data-th-src="@{/js/invest/riskredis/quota/superviseindicator/RskSupervisionIndicator004.js}"></script>
		<script data-th-src="@{/js/invest/riskredis/quota/common/RskQuotaCommon.js}" type="text/javascript"></script>
	</div>
</body>
</html>
