<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RskSupervisionPortfPoint004}">编辑指标有效区间</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm">
              <input id="workflowId" name="workflowId" data-th-value="${workflowId}" type="hidden">
               <input type="hidden" id="portfolioCode" name="portfolioId"  data-th-value="${entity?.portfolioId}" >
               <input type="hidden" id="portfolioLevel" name="portfolioLevel"  data-th-value="${entity?.portfolioLevel}" >
                <input type="hidden" id="indId" name="indId"  data-th-value="${entity?.indId}" >
             <div class="layui-form-item" style="margin-left: 20px">
                <label class="layui-form-label line24" data-th-text="#{RskSupervisionPortfPoint004.indName}">指标名称</label>
                <div class="layui-input-inline input-inline" style="width:85%!important">
                   <input class="layui-input form-input" id="indName" name="indName"  data-th-value="${entity?.indName}" disabled>					          
                </div>
            </div>
             <div class="layui-form-item" style="margin-left: 20px">
                <label class="layui-form-label line24" data-th-text="#{RskSupervisionPortfPoint004.portfolioName}">组合名称</label>
                <div class="layui-input-inline input-inline" style="width:85%!important">
                   <input class="layui-input form-input" id="portfolioName" name="portfolioName" data-th-value="${entity?.portfolioName}" disabled>					          
                </div>
            </div>
           <div class="layui-form-item" id="portfMixDiv" style="margin-left: 20px;display: none">
                <label class="layui-form-label line24" data-th-text="#{RskSupervisionPortfPoint004.portfolioMix}">组合成分</label>
                <div class="layui-input-inline input-inline" style="width:85%!important">
                   <input class="layui-input form-input" id="portfolioMix"   data-th-value="${portfolioMixName}" disabled>					          
                </div>
            </div>
            <div class="layui-form-item"  style="margin-bottom:8px;margin-left: 20px">
					<label class="layui-form-label line24"
						data-th-text="#{RskSupervisionPortfPoint004.effDate}">有效区间</label>
					<div class="layui-input-inline input-inline" style="width:85%!important">
						<input style="float: left;width:48%;margin-right:5px" type="text" id="startDate" name="startDate" data-th-value='${#dates.format(entity?.startDate,"yyyy-MM-dd")}' 
						 required="required" class="layui-input form-input input-dateSelect"/>
						 <span style="float: left;;margin-right:11px;margin-left:8px">-</span>
						 <input style="float: right;width:48%" type="text" id="endDate" name="endDate" data-th-value='${#dates.format(entity?.endDate,"yyyy-MM-dd")}' 
						 class="layui-input form-input input-dateSelect"/>
					</div>
			</div>
		</form>
        <div class="layui-col-md11" style="margin:20px;">
            <div class="text-center">
                <a id="RskSupervisionPortfPoint004_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                <a id="RskSupervisionPortfPoint004_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">保存</a>
                <a id="RskSupervisionPortfPoint004_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div> 
    </div>
    <div layout:fragment="script">
		<style>
		.line24{
		line-height: 24px;
		padding:0px 10px 0px 0px;
		}
		.width30{
		width:30%;
		}
		</style>
		<script data-th-inline="javascript" type="text/javascript">
		     var entity=/*[[${entity}]]*/'';
		     var formTodoList = /*[[${formTodoList}]]*/false;
		</script>
        <script data-th-src="@{/js/invest/riskredis/quota/portfolioindicator/RskSupervisionPortfPoint004.js}"></script>
    </div>
</body>

</html>
