<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RskSupervisionIndividuation007}">自定义条件新建</title>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap" id="submitForm">
			<input type="text" id="operateType" name="operateType" data-th-value="${operateType}" style="display: none;" />
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-label-wrap" data-th-text="#{RskSupervisionIndividuation001.conditionName}">条件名称</label>
					<div class="layui-input-inline input-inline">
						<input type="text" class="layui-input form-input" id="conditionName" placeholder="请输入内容"
						   	name="conditionName" data-th-value="${entity?.conditionName}" maxlength="32"
						   	data-th-placeholder="#{SysCommon.placeholder}" required="required" />
					</div>
				</div>
				<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{RskSupervisionIndividuation001.conditionItem}">条件代码</label>
					<div class="layui-input-inline input-inline">
						<input type="text" class="layui-input form-input" id="conditionItem" placeholder="请输入内容"
						   	name="conditionItem" data-th-value="${entity?.conditionItem}"
						   	data-th-placeholder="#{SysCommon.placeholder}" required="required" maxlength="32" />
					</div>
				</div>
				<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{RskSupervisionIndividuation001.conditionUnit}">单位</label>
					<div class="layui-input-inline input-inline">
						<select class="layui-input form-input input-select" id="conditionUnit" placeholder="请输入内容"
							   name="conditionUnit" data-th-initValue="${entity?.conditionUnit}" data-th-data-result='${SUP_UNIT}'
							   data-th-placeholder="#{SysCommon.placeholder}" required="required">
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item" style="width: 1020px; height: 20px; padding-top: 20px;padding-left: 20px;">
				<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-lable-wrap"
						   style="padding-left: 70px; padding-bottom: 0px; padding-top: 0px;"
						   data-th-text="#{RskSupervisionIndicatorParam002.reminder}">温馨提示:</label>
				</div>
			</div>
			<div class="layui-form-item" style="padding-top: 10px;">
				<div class=" layui-col-md10 layui-col-sm10 layui-col-lg10">
					<div>
						<span style="margin-left: 156px">1、当类型为SQL时，里面运用系统变量必须带上$符号；</span>
						<span style="margin-left: 184px">2、当类型为类名时，请输入相应的插件类名；</span>
					</div>
				</div>
			</div>
			<div class="layui-form-item" style="padding-top: 10px;">
				<div class=" layui-col-md10 layui-col-sm10 layui-col-lg10">
					<div>
						<span style="margin-left: 156px">3、若查询SQL语句中出现常用函数时，必须赋予别名；</span>
						<span style="margin-left: 190px">4、当类型为SQL且列数为一列值时，第一列为实际值且起别名为RVALUE；</span>
					</div>
				</div>
			</div>
			<div class="layui-form-item" style="padding-top: 10px;">
				<div class=" layui-col-md10 layui-col-sm10 layui-col-lg10">
					<div>
						<span style="margin-left: 156px">5、当SQL且两列时，第一列(必写)为实际值且别名为RVALUE，第二列(必写)为资产代码且别名为RKEY。</span>
					</div>
				</div>
			</div>
			<div class="layui-form-item" style="height: 25px;">
				<div class="layui-inline layui-col-md6 layui-col-sm6 layui-col-lg6" style="width: 28% !important">
					<label class="layui-form-label form-label-wrap" data-th-text="#{RskSupervisionIndividuation001.conditionType}">类型</label>
					<div class="layui-input-inline input-inline" style="width: 70%;">
						<input type="text" id="conditionType" name="conditionType"
						   	required="required" class="layui-input form-input input-checkbox"
						   	data-th-data-result='${PARA_DISPLAY_TYPE}' data-th-initValue='${entity?.conditionType}' />
					</div>
				</div>
			</div>
			<div class="layui-form-item" style="height: 50px;">
				<div class="layui-inline  content" style="width: 100%;">
					<label class="layui-form-label form-label-wrap" style="width: 10%;">内容</label>
					<div class="layui-input-inline input-inline" style="width: 70%;">
						<textarea id="content" name="content" placeholder="请输入内容" required="required"
						  	class="layui-input layui-textarea" data-th-placeholder="#{SysCommon.placeholder}" data-th-text="${entity?.content}">
						</textarea>
					</div>
				</div>
			</div>
			<div class="layui-col-md10" style="margin: 50px;">
				<div class="text-center">
					<a id="RskSupervisionIndividuation007_btn_save"
					   class="layui-btn layui-btn-sm btn-save"
					   data-th-text="#{SysCommon.save}">保存</a>
					<a id="RskSupervisionIndividuation007_btn_cancel"
						class="layui-btn layui-btn-sm btn-cancel"
						data-th-text="#{SysCommon.cancel}">取消</a>
				</div>
			</div>
		</form>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var pageModel = /*[[${pageModel}]]*/'';
		</script>
		<script data-th-src="@{/js/invest/riskredis/quota/supervisionindividuation/RskSupervisionIndividuation007.js}"></script>
	</div>
	<style>
		.param-span{
			color: #2693ff;
			font-weight: bold;
			margin-right: 20px;
		}
		.form-label-wrap {
			width: 36% !important;
		}

		.manage-info-item li {
			float: left;
			padding-right: 10px;
			line-height: 24px;
		}

		.manage-info-item {
			float: left;
			padding-right: 10px;
		}

		.manage-info-item .layui-form-checkbox {
			margin-right: 2px;
			margin-top: -2px;
			padding-right: 0;
			line-height: 15px;
			width: 15px;
			height: 15px;
		}

		.manage-info-item .layui-form-checkbox i {
			line-height: 15px;
			width: 15px;
			height: 15px;
			border-left: 1px solid #d2d2d2;
			font-size: 15px;
		}

		.manage-info-item .layui-form-checked i, .manage-info-item .layui-form-checked:hover i
		{
			border-color: #2693ff;
			color: #2693ff;
		}
	</style>
</body>

</html>
