<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{BankAsset001}">商业银行净资产维护</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				<a id="BankAsset001_btn_add" class="layui-btn layui-btn-sm btn-create"
	                    data-th-text="#{SysCommon.create}">新建</a>
	            <a id="BankAsset001_btn_import" class="layui-btn layui-btn-sm btn-import"
                    data-th-text="#{SysCommon.import}">导入</a>       
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area curr-form' >
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
								data-th-text="#{BankAsset001.customerId}">主体代码</label>
							<div class="layui-input-inline input-inline">
								<select type="text"  name="insitituteCode"
									class="layui-input form-input input-select" id="insitituteCode" 
									allowclear="true" placeholder="请输入内容" multiple="true"
									formatoption="true"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-url="@{/invest/riskredis/quota/bankasset/BankAsset001/selectCustomerId}">

								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
	                        <label class="layui-form-label form-lable"
	                               data-th-text="#{BankAsset001.valStatus}">有效状态</label>
	                        <div class="layui-input-inline input-inline">
	                            <select type="text" id="valStatus" name="valStatus"
	                                class="layui-input form-input input-select" data-th-data-result='${BANK_ASSET_STATUS}'
	                                formatoption="true" allowClear="true" placeholder="请输入内容"
	                                data-th-placeholder="#{SysCommon.placeholder}">
	                            </select>
	                        </div>
	                  	</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
		                      <label class="layui-form-label form-label-wrap" 
		                               data-th-text="#{BankAsset001.effDate}">更新时间</label>
		                      <div class="layui-input-inline input-inline">
		                          <input id="effDate" name="effDate" class="layui-input form-input input-dateRangeSelect"
		                             placeholder="请选择时间区间" data-th-value="${platDate}" required="required" 
		                              data-th-placeholder="#{SysCommon.dateInterval}">
		                      </div>
	                  	</div>
					</div>
					<div class="layui-form-item" style="margin-top: 20px">
                    <label class="layui-form-label form-lable"></label>
                </div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-src="@{/js/invest/riskredis/quota/bankasset/BankAsset001.js}"></script>
	</div>
</body>
</html>
