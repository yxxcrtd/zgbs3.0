<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
	<title data-th-text="#{RepEntrustedApproval002}">委托审批</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm">
        
        <div class="pro-module">
				  	<h3 class="pro-module-title"><span class="title-des">基本信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
		<div class="pro-module-item">
        
        <div class="layui-form-item">
           <input type="text" id="assetRate1" data-th-value="${entity?.assetRate}" style="display:none"  />
           <input type="text" id="market1" data-th-value="${entity?.marketAbbr}" style="display:none"  />
           <input type="text" id="workflowId" data-th-value="${entity?.workflowId}" style="display:none"  /> 
           <input type="text" id="eventDate" name="eventDate" data-th-value="${#dates.format(entity?.eventDate,'yyyy-MM-dd')}" style="display:none"   /> 
           <input type="text" id="tradeNum" name="tradeNum" data-th-value="${entity?.tradeNum}" style="display:none"  /> 
           <input type="text" id="priceAmt" name="priceAmt" data-th-value="${entity?.priceAmt}" style="display:none"  /> 
           <input type="text" id="tradeId" name="tradeId" data-th-value="${entity?.tradeId}" style="display:none" /> 
           <input type="text" id="tradeType" name="tradeType" data-th-value="${entity?.tradeType}" style="display:none"  /> 
           <input type="text" id="eventType" name="eventType" data-th-value="${entity?.eventType}" style="display:none"  /> 
           <input type="text" id="wflStatus" name="wflStatus" data-th-value="${entity?.wflStatus}" style="display:none"  /> 
           <input type="text" id="conclusion" name="conclusion" data-th-value="${entity?.conclusion}" style="display:none"  /> 
           <input type="text" id="indId" name="indId" data-th-value="${entity?.indId}" style="display:none"  /> 
    					<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
									data-th-text="#{RepEntrustedApproval.eventId}">委托代码</label>
							<div class="layui-input-inline input-inline">
							<input type="text" class="layui-input form-input" id="eventId"
								name="eventId" data-th-value="${entity?.eventId}"
								data-th-placeholder="#{SysCommon.placeholder}"
								required="required" maxlength="60" disabled/>
							</div>
						</div>
				
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
									data-th-text="#{RepEntrustedApproval.prodId}">产品代码</label>
							<div class="layui-input-inline input-inline">
							<input type="text" class="layui-input form-input" id="prodId"
								name="prodId" data-th-value="${entity?.prodId}"
								data-th-placeholder="#{SysCommon.placeholder}"
								required="required" maxlength="60" disabled/>
							</div>
						</div>
						
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap" data-th-text="#{RepEntrustedApproval.startDate}">委托开始日</label>
							<div class="layui-input-inline input-inline">
							<input type="text" class="layui-input form-input" id="startDate"
								name="startDate" data-th-value="${#dates.format(entity?.startDate,'yyyy-MM-dd')}"
								data-th-placeholder="#{SysCommon.placeholder}"
								required="required" maxlength="60" disabled/>
							</div>
						</div>
						
       				</div>
            		<div class="layui-form-item">
            
    					<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
									data-th-text="#{RepEntrustedApproval.endDate}">委托结束日</label>
							<div class="layui-input-inline input-inline">
							<input type="text" class="layui-input form-input" id="endDate"
								name="endDate" data-th-value="${#dates.format(entity?.endDate,'yyyy-MM-dd')}"
								data-th-placeholder="#{SysCommon.placeholder}"
								required="required" maxlength="60" disabled/>
							</div>
						</div>
				
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
									data-th-text="#{RepEntrustedApproval002.ps}">交易方向</label>
							<div class="layui-input-inline input-inline">
							<select type="text" class="layui-input form-input input-select" id="ps"
								name="ps" data-th-initvalue="${entity?.ps}"
								data-th-placeholder="#{SysCommon.placeholder}"
								required="required" maxlength="60" disabled data-th-data-result="${PS}"></select>
							</div>
						</div>
						
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
									data-th-text="#{RepEntrustedApproval.assetCode}">资产代码</label>
							<div class="layui-input-inline input-inline">
							<input type="text" class="layui-input form-input" id="assetCode"
								name="assetCode" data-th-value="${entity?.assetCode}"
								data-th-placeholder="#{SysCommon.placeholder}"
								required="required" maxlength="60" disabled/>
							</div>
						</div>
						
       				</div>
       				
       				<div class="layui-form-item">
            
    					<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
									data-th-text="#{RepEntrustedApproval002.finprodName}">资产名称</label>
							<div class="layui-input-inline input-inline">
							<input type="text" class="layui-input form-input" id="finprodName"
								name="finprodName" data-th-value="${entity?.finprodName}"
								data-th-placeholder="#{SysCommon.placeholder}"
								required="required" maxlength="60" disabled/>
							</div>
						</div>
				
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
									data-th-text="#{RepEntrustedApproval.market}">交易场所</label>
							<div class="layui-input-inline input-inline">
							<select type="text" class="layui-input form-input input-select" id="market"
								name="market" data-th-initvalue="${entity?.market}"
								data-th-placeholder="#{SysCommon.placeholder}" disabled
								required="required" maxlength="60" data-th-data-result="${TRADE_MARKET}"></select>
							</div>
						</div>
						
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
									data-th-text="#{RepEntrustedApproval.amount}">委托金额</label>
							<div class="layui-input-inline input-inline">
							<input type="text" class="layui-input form-input" id="amount"
								name="amount" data-th-value="${entity?.amount}"
								data-th-placeholder="#{SysCommon.placeholder}"
								required="required" maxlength="60" disabled/>
							</div>
						</div>
						
       				</div>
       				
       				<div class="layui-form-item">
            
    					<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
									data-th-text="#{RepEntrustedApproval.netPrice}">净价</label>
							<div class="layui-input-inline input-inline">
							<input type="text" class="layui-input form-input" id="netPrice"
								name="netPrice" data-th-value="${entity?.netPrice}"
								data-th-placeholder="#{SysCommon.placeholder}"
								required="required" maxlength="60" disabled />
							</div>
						</div>
				
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
									data-th-text="#{RepEntrustedApproval002.yieldMaturity}">到期收益率%</label>
							<div class="layui-input-inline input-inline">
							<input type="text" class="layui-input form-input" id="yieldMaturity"
								name="yieldMaturity" data-th-value="${entity?.yieldMaturity}"
								data-th-placeholder="#{SysCommon.placeholder}"
								required="required" maxlength="60" disabled/>
								<span class="input-right-show">%</span>
							</div>
						</div>
						
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 box_list">
							<label class="layui-form-label form-label-wrap"
									data-th-text="#{RepEntrustedApproval.assetRate}">利率%</label>
							<div class="layui-input-inline input-inline">
							<input type="text" class="layui-input form-input" id="assetRate"
								name="assetRate" data-th-value="${entity?.assetRate}"
								data-th-placeholder="#{SysCommon.placeholder}"
								required="required" maxlength="60" disabled/>
								<span class="input-right-show">%</span>
							</div>
						</div>
						
       				</div>
       				
       				<div class="layui-form-item">
            
    					<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
									data-th-text="#{RepEntrustedApproval.manager}">投资经理</label>
							<div class="layui-input-inline input-inline">
							<input type="text" class="layui-input form-input" id="manager"
								name="manager" data-th-value="${entity?.manager}"
								data-th-placeholder="#{SysCommon.placeholder}"
								required="required" maxlength="60" disabled/>
							</div>
						</div>
						
       				</div>
			
			
		</form>
		
		   <div class="pro-module-wrap" style="border-top:1px solid #ccc;margin-top: 5px; ">
               <div class="pro-module">
				  	<h3 class="pro-module-title"><span class="title-des">试算结果</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
			        <div class="pro-module-item">
						<div class="layui-form-item">
			       		 </div>
			       	
			       </div>
			       <div class="layui-inline layui-col-md12 layui-col-sm12 layui-col-lg12" style="margin-left: 5px;">
						<div class="layui-input-inline" style="width:99% !important;">
						<textarea id="conclusion" name="conclusion" 
          					class="layui-input layui-textarea" required="required"
          					data-th-text="${entity?.conclusion}" disabled>
                        </textarea>
						</div>
				  </div>
			       
			        <div class="layui-row" id="singleTableDiv">
		            <table class="layui-table" id="portfRelateIndTable" ></table>
		        	</div>
		        	
		        	
	       		</div>
	       </div>
       
        <div class="layui-form-item" align="center">
            <a id="RepEntrustedApproval002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="RskSupervisionPortfPoint002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div> 
        
    </div>
    <div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
		     var entity=/*[[${entity}]]*/;
		     var SUP_UNIT=/*[[${SUP_UNIT}]]*/;  //单位数据字典下拉
		     var EVENT_ID=/*[[${EVENT_ID}]]*/;
		</script>
		<style>
			.line24{
			line-height: 24px;
			padding:0px 10px 0px 0px;
			}
			.width30{
			width:30%;
			}
		</style>
        <script data-th-src="@{/js/invest/riskredis/quota/entrustedapproval/RepEntrustedApproval002.js}" type="text/javascript"></script>
    </div>
</body>

</html>
