<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorator="~{layout/default}">
<head>
<title data-th-text="#{RskSupervisionIndividuation001}">个性化参数设置</title>
</head>
<body>
	<div layout:fragment="content">
		<div class="layui-tab layui-tab-brief" lay-filter="docDemoTabBrief">
			<input id="workflowId" name="workflowId"
				data-th-value="${workflowId}" type="hidden"> 
			<input type="hidden" id="prtBagId"
				data-th-value="${entity?.prtBagId}">
			<input id="indId" name="indId"
				data-th-value="${entity?.indId}" type="hidden">
			<input id="indType" name="indType" data-th-value="${entity?.indType}" type="hidden">
			<ul class="layui-tab-title">
				<li class="layui-this" id="tjsz">条件设置</li>
				<li id="tsjd">特殊阶段</li>
				<li id="tszqqz">特殊证券阈值</li>
				<li id="tczc">剔除资产</li>
				<li id="lhsz">联合设置</li>
				<li id="zdytjfz">自定义条件阈值</li>
			</ul>
			<div class="layui-tab-content">
				<!-- 条件设置 -->
				<div class="layui-tab-item layui-show" id="tjszDiv">
					<div style="color: #5897fb; float: left;">启用条件</div>
					<div style="float: right;">
						<a id="RskSupervisionIndividuation001_btn_tjsz_add"
							class="layui-btn layui-btn-sm btn-create"
							data-th-text="#{SysCommon.create}">新建</a>
					</div>
					<table class="layui-table" id="dataTable"
						data-target="#getdataTable"></table>
				</div>
				<!-- 特殊阶段 -->
				<div class="layui-tab-item" id="tsjdDiv">
					<div style="float: right;">
						<a id="RskSupervisionIndividuation001_btn_tsjd_add"
							class="layui-btn layui-btn-sm btn-create"
							data-th-text="#{SysCommon.create}">新建</a>
					</div>
					<table class="layui-table" id="dataTable1"
						data-target="#getdataTable"></table>
				</div>
				<!-- 特殊证券设置 -->
				<div class="layui-tab-item" id="tszqDiv">
					<div style="float: right;">
						<a id="RskSupervisionIndividuation001_btn_tszqsz_add"
							class="layui-btn layui-btn-sm btn-create"
							data-th-text="#{SysCommon.create}">新建</a>
					</div>
					<table class="layui-table" id="dataTable2"
						data-target="#getdataTable"></table>
				</div>
				<!-- 剔除资产 -->
				<div class="layui-tab-item" id="tczcDiv">
					<div style="float: right;">
						<!-- <a id="RskSupervisionIndividuation001_btn_tczc_add"
							class="layui-btn layui-btn-sm btn-create"
							data-th-text="#{SysCommon.create}">新建</a> -->
					</div>
					<table class="layui-table" id="dataTable3"
						data-target="#getdataTable"></table>
				</div>
				<!-- 联合设置-->
				<div class="layui-tab-item" id="lhszDiv">
					<div style="float: right;">
						<!-- <a id="RskSupervisionIndividuation001_btn_lhsz_add"
							class="layui-btn layui-btn-sm btn-create"
							data-th-text="#{SysCommon.create}">新建</a> -->
					</div>
					<table class="layui-table" id="dataTable4"
						data-target="#getdataTable"></table>
				</div>
				<!-- 条件设置 -->
				<div class="layui-tab-item" id="zdytjfzDiv">
					<input type="hidden" id="oldWarnCond"   data-th-value="${yzInfo?.warnCond}" >
					<input type="hidden" id="oldFoulCond"   data-th-value="${yzInfo?.foulCond}" >
					<input type="hidden" id="oldApproveCond"   data-th-value="${yzInfo?.approveCond}" >
					<div style="color: #5897fb; float: left;">自定义条件</div>
					<div style="float: right;">
						<a id="RskSupervisionIndividuation001_btn_zdytjfz_add"
						   class="layui-btn layui-btn-sm btn-create"
						   data-th-text="#{SysCommon.create}">新建</a>
					</div>
					<table class="layui-table" id="dataTable5_1"
						   data-target="#getdataTable"></table>
					<div style="color: #5897fb; float: left;">自定义条件阈值</div>
					<div class="pro-module-item">
						<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap"
								   data-th-text="#{RskSupervisionIndividuation003.comparison}"
								   style="width: 26% !important">比较符</label>
							<div class="layui-input-inline input-inline">
								<select th:id="comparison" name=".comparison"
										class="layui-input form-input input-select"
										data-th-placeholder="#{SysCommon.placeholder}"
										searchable="false" required
										data-th-data-result="${SUP_OPERATOR}">
								</select>
							</div>
						</div>
						<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap"
								   data-th-text="#{RskSupervisionIndividuation003.unit}"
								   style="width: 26% !important">单位</label>
							<div class="layui-input-inline input-inline">
								<select th:id="unit" name="unit"
										class="layui-input form-input input-select"
										data-th-placeholder="#{SysCommon.placeholder}"
										searchable="false" required data-th-data-result="${SUP_UNIT}">
								</select>
							</div>
						</div>
					</div>
					<table class="layui-table" id="dataTable5_2"
						   data-target="#getdataTable"></table>
				</div>
			</div>
		</div>
		<div class="layui-form-item" align="center">
			<a id="RskSupervisionIndividuation001_btn_save"
				class="layui-btn layui-btn-sm btn-save"
				data-th-text="#{SysCommon.save}">保存</a><a
					id="RskSupervisionIndividuation001_btn_submit"
					class="layui-btn layui-btn-sm btn-submit"
					data-th-text="#{SysCommon.submit}">提交</a><a
				id="RskSupervisionIndividuation001_btn_cancel"
				class="layui-btn layui-btn-sm btn-cancel"
				data-th-text="#{SysCommon.cancel}">取消</a>
		</div>
	</div>
	<div layout:fragment="script">
		<style type="text/css">
.select-ind-rr {
	margin-left: 10px;
	width: 63% !important;
	float: left;
}

.select-ind-fh {
	margin-left: 10px;
	width: 12% !important;
	float: left;
}

.btn-detail-del {
	margin-left: 2px;
}

.btn-detail-del i {
	margin-left: 4px;
}

.layui-col-md6 {
	float: left;
	width: 48%;
	margin-left: 16px
}

.manager_fh_fh .select2-container {
	width: 90px !important
}

.layui-form-radio {
	line-height: 14px !important
}

.layui-form-radio>i {
	font-size: 16px !important
}

.layui-chcekbox {
	margin-right: 14px !important
}

.layui-inline {
	float: left;
}

.manage-info-item li {
	float: left;
	padding-right: 15px;
	line-height: 24px;
	margin-bottom: 3px;
}

.manage-info-item {
	float: left;
	padding-right: 10px;
}

.manage-info-item .layui-form-checkbox {
	margin-right: 2px;
	margin-top: -2px;
	padding-right: 0;
	line-height: 15px;
	width: 15px;
	height: 15px;
}

.manage-info-item .layui-form-checkbox i {
	line-height: 15px;
	width: 15px;
	height: 15px;
	border-left: 1px solid #d2d2d2;
	font-size: 15px;
}

.manage-info-item .layui-form-checked i, .manage-info-item .layui-form-checked:hover i
	{
	border-color: #2693ff;
	color: #2693ff;
}

.manage-info-item .layui-form-radio {
	margin-top: 0px
}

div.input-btn-append a {
	line-height: 20px !important
}

.input-btn-append {
	height: 24px !important
}

.rsk-tree .layui-input .ztree #treeDataSingle_tree_2_a {
	white-space: nowrap;
	width: 350px;
	text-overflow: ellipsis;
	overflow: hidden;
}

.sgePortDiv {
	width: 100%;
	overflow: hidden;
	clear: both;
	padding-top: 8px;
}

.sgePort23sub {
	width: 23% !important
}

.sgePort14sub {
	width: 14% !important
}

span.select2-selection__rendered {
	max-width: 250px;
}
</style>
		<script data-th-inline="javascript" type="text/javascript">
		/* var UNITE_ID = /*[[${UNITE_ID}]]*/'';//联合指标
		var FINPROD_ID = /*[[${FINPROD_ID}]]*/'';//金融产品代码 */
		var SUP_UNIT = /*[[${SUP_UNIT}]]*/'';
		var CONTROL_TYPE = /*[[${CONTROL_TYPE}]]*/'';
		var YES_OR_NO = /*[[${YES_OR_NO}]]*/'';
		var IND_TYPE = /*[[${IND_TYPE}]]*/'';
		var NONE = /*[[${NONE}]]*/'';
		var CONDITION_ITEM_04 = /*[[${CONDITION_ITEM_04}]]*/'';
		var CONDITION_ITEM_03 = /*[[${CONDITION_ITEM_03}]]*/'';
		var CONDITION_ITEM_02 = /*[[${CONDITION_ITEM_02}]]*/'';
		var VDATE = /*[[${VDATE}]]*/'';
		var portfolioLevel=/*[[${portfolioLevel}]]*/'';
		var UNITE_SOURCE=/*[[${UNITE_SOURCE}]]*/'';
		var PROCESSMODEL_RULE=/*[[${PROCESSMODEL_RULE}]]*/'';
		</script>
		<script
			data-th-src="@{/js/invest/riskredis/quota/supervisionindividuation/RskSupervisionIndividuation001.js}"></script>
	</div>
</body>
</html>
