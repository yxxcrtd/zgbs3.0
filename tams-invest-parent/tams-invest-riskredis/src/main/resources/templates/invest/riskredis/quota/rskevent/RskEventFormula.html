<!DOCTYPE html>

<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RskEventFormula}">公式配置</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{RskEventFormula.paraCode}">参数名称</label>
                    <div class="layui-input-inline input-inline">
                        <select name="paraCode" id="paraCode" formatoption="false"
                                class="layui-input form-input input-select"
                                data-th-initValue="${entity?.paraCode}" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${IND_PARAM}" required >
                         </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{RskEventFormula.oprType}">操作符</label>
                    <div class="layui-input-inline input-inline">
                        <select name="oprType" id="oprType" formatoption="false"
                                class="layui-input form-input input-select"
                                data-th-initValue='${entity?.oprType}' placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${SUP_CONNECTOR}" required>
                         </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{RskEventFormula.relItem}">计算对象</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" name="relItem" id="relItem" formatoption="false"
                                class="layui-input form-input input-select"
                                data-th-initValue='${entity?.relItem}' placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${EVENT_REL_ITEM}" required>
                         </select>
                    </div>
                </div>
            </div>
            <div class="layui-col-md10" style="margin: 50px;">
                <div class="text-center">
                    <a id="RskEventFormula_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                    <a id="RskEventFormula_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </div>
        </form>
    </div>

    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
            var IND_PARAM = /*[[${IND_PARAM}]]*/'[]'; // 指标参数
            var EVENT_REL_ITEM = /*[[${EVENT_REL_ITEM}]]*/'[]'; // 风险事项运算关系对象
            var SUP_CONNECTOR = /*[[${SUP_CONNECTOR}]]*/'[]'; // 操作符
        </script>
        <script
            data-th-src="@{/js/invest/riskredis/quota/rskevent/RskEventFormula.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
