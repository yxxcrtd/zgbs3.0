<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{RskSupervisionIndicatorParam001}">指标参数管理</title>
    <!--modify by etliu 20200902 该引用找不到对应js文件，前台加载画面时会报js错误 start-->
    <!--<script type="text/javascript" src="/tams-invest/public/js/message"></script>-->
    <!--modify by etliu 20200902 该引用找不到对应js文件，前台加载画面时会报js错误 end-->
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area">
            <a id="RskSupervisionIndicatorParam001_btn_yycs_create"
               class="layui-btn layui-btn-sm btn-create">语言参数</a>
            <a id="RskSupervisionIndicatorParam001_btn_zdy_create"
               class="layui-btn layui-btn-sm btn-create">自定义参数</a>
               <a id="RskSupervisionIndicatorParam001_btn_gdz_create"
               class="layui-btn layui-btn-sm btn-create">固定值参数</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{RskSupervisionIndicatorParam001.paraName}">参数名称</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" class="layui-input form-input" id="paraName" name="paraName" data-th-value="${paraCode}" maxlength="60"/>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{RskSupervisionIndicatorParam001.paraType}">参数类型</label>
                        <div class="layui-input-inline input-inline">
                            <select  id="paraType" name="paraType"
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result='${PARA_DISPLAY_TYPE}'
                                data-th-initValue='${paraType}'>
							</select>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">
        var FIX = /*[[${FIX}]]*/'';
        var CUSTOM = /*[[${CUSTOM}]]*/'';

        var ssoUserName = /*[[${ssoUserName}]]*/'';
        var paraNameInit = /*[[${paraNameInit}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/riskredis/quota/rsksupervisionindicatorparam/RskSupervisionIndicatorParam001.js}" type="text/javascript"></script>
</div>
</body>
</html>
