<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">

<div class="pro-module-wrap" id="RskSupervisionIndicator003Div">
    <input type="hidden" id="warnCond" name="rskSupervisionIndicatorDto.warnCond"  data-th-value="${entity?.rskSupervisionIndicatorDto?.warnCond}" >
    <input type="hidden" id="foulCond" name="rskSupervisionIndicatorDto.foulCond"  data-th-value="${entity?.rskSupervisionIndicatorDto?.foulCond}" >
    <input type="hidden" id="approveCond" name="rskSupervisionIndicatorDto.approveCond"  data-th-value="${entity?.rskSupervisionIndicatorDto?.approveCond}" >
    <!-- <input type="hidden" id="prohibitProj" name="rskSupervisionIndicatorDto.prohibitProj"  data-th-value="${entity?.rskSupervisionIndicatorDto?.prohibitProj}" > -->
	<div class="pro-module">
		<div class="pro-module-item">
			<div class="layui-form-item">
				<div class="form-inline-wrap" style="width: 65%">
					<label class="layui-form-label form-label-wrap"
						data-th-text="#{RskSupervisionIndicator002.indName}"
						style="width: 26% !important">指标名称</label>
					<div class="layui-input-inline input-inline">
						<input type="text" th:id="|${pageId}_indNameTwo|"
							class="layui-input form-input" placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-value='${entity?.rskSupervisionIndicatorDto?.indName}' disabled="disabled">
					</div>
				</div>
				<div class="form-inline-wrap" style="width: 35%">
					<label id="jiduLabel" class="layui-form-label form-label-wrap"
						data-th-text="#{RskSupervisionIndicator002.supType}"
						style="width: 26% !important">监督类型</label>
					<div class="layui-input-inline input-inline" style="width: 52.5% !important">
						<select th:id="|${pageId}_supType|"
							name="rskSupervisionIndicatorDto.supType" formatoption="false"
							class="layui-input form-input input-select"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-initValue='${entity?.rskSupervisionIndicatorDto?.supType}' 
							data-th-data-result="${SUP_TYPE}" >
						</select>
						<!--   <input type="radio" name="supType" value="SUPERVISION" title="监管"     lay-filter="supType" th:checked="${entity?.supType=='SUPERVISION'||entity?.supType==null||entity?.supType==''} ? 'checked' : 'false'">
                    					<input type="radio" name="supType" value="INTERNAL" title="内控"  lay-filter="supType" th:checked="${entity?.supType=='INTERNAL'} ? 'checked' : 'false'"> -->
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="form-inline-wrap" style="width: 65%">
					<label id="jikongLabel" class="layui-form-label form-label-wrap"
						data-th-text="#{RskSupervisionIndicator002.timePoint}"
						style="width: 26% !important">监控时点</label>
					<div class="layui-input-inline input-inline">
						<div class="element">
							<ul class="manage-info-item">
								<li data-th-each="key,list : ${mapJdsf}">
									<div data-th-each="option : ${list.current.value}" >
										<input type="checkbox" 
											th:checked="${#strings.contains(#strings.isEmpty(entity?.rskSupervisionIndicatorDto?.timePoint) ?'' : entity?.rskSupervisionIndicatorDto?.timePoint, option?.id)}"
											class='layui-input form-input'
											name="rskSupervisionIndicatorDto.timePoint"
											data-th-lay-filter="|${option?.id}_timePoint|"
											data-th-value="${option?.id}" th:text="${option.text}" />
									</div>
								</li>
							</ul>
						</div>
					</div>
				</div>
				<div class="form-inline-wrap" id="frequencyDiv"
					style="width: 35%; display: none">
					<label class="layui-form-label form-label-wrap"
						data-th-text="#{RskSupervisionIndicator002.supFrequency}"
						style="width: 26% !important">事后监控频率</label>
					<div class="layui-input-inline input-inline">
						<!-- <input th:id="|${pageId}_supFrequency|"
							name="rskSupervisionIndicatorDto.supFrequency"
							class="layui-input form-input input-checkbox" 
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-initValue='${entity?.rskSupervisionIndicatorDto?.supFrequency}'  searchable="false" required
							data-th-data-result="${SUP_FREQUENCY}"/> -->
						<select th:id="|${pageId}_supFrequency|"
							name="rskSupervisionIndicatorDto.supFrequency" formatoption="false"
							class="layui-input form-input input-select" multiple="multiple"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-initValue='${entity?.rskSupervisionIndicatorDto?.supFrequency}' 
							data-th-data-result="${SUP_FREQUENCY}">
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="form-inline-wrap" id="supDirectionDiv"
					style="width: 50%; display: none">
					<label class="layui-form-label form-label-wrap"
						data-th-text="#{RskSupervisionIndicator002.supDirection}"
						style="width: 33% !important">监控方向</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${pageId}_supDirection|"
							name="rskSupervisionIndicatorDto.supDirection"
							class="layui-input form-input input-select" 
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-initValue='${entity?.rskSupervisionIndicatorDto?.supDirection}'  searchable="false" required
							data-th-data-result="${SUP_DIRECTION}" parentIds="RskSupervisionIndicator002_indType">
						</select>
					</div>
				</div>
			</div>
		</div>
		<div id="xzx_qzsz_div">
			<h3 class="pro-module-title">
				<span class="title-des">阈值设置</span>
			</h3>
			<div class="pro-module-item" style="overflow: hidden;padding-top: 10px;margin-left:70px;">
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap"
						data-th-text="#{RskSupervisionIndicator002.comparison}"
						style="width: 26% !important">比较符</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${pageId}_comparison|"
							name="rskSupervisionIndicatorDto.comparison"
							class="layui-input form-input input-select" 
							data-th-placeholder="#{SysCommon.placeholder}"
							 searchable="false" required
							data-th-data-result="${SUP_OPERATOR}">
						</select>
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap"
						data-th-text="#{RskSupervisionIndicator002.unit}"
						style="width: 26% !important">单位</label>
					<div class="layui-input-inline input-inline">
						<select th:id="|${pageId}_unit|"
							name="rskSupervisionIndicatorDto.unit"
							class="layui-input form-input input-select" 
							data-th-placeholder="#{SysCommon.placeholder}"
							searchable="false" required
							data-th-data-result="${SUP_UNIT}">
						</select>
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap"
						data-th-text="#{RskSupervisionIndicator002.isModel}"
						style="width: 46% !important">处理为绝对值</label>
					<div class="layui-input-inline input-inline" style="width:20%!important;">
						<div class="element">
							<ul class="manage-info-item">
								<li>
									<div>
										<input type="checkbox" th:id="|${pageId}_isModel|"
											th:checked="false"
											class='layui-input form-input input-checkbox'
											name="rskSupervisionIndicatorDto.isModel"
											data-th-lay-filter="|${pageId}_isModel|"
											/>
									</div>
								</li>
							</ul>
						</div>
					</div>
				</div>
			</div>
			<div class="pro-module-wrap" style="border: 0px solid #ccc">
                        <div class="pro-module">
                            <div class="pro-module-item cus-table-wrap">
                                <table class="layui-table" id="dataTable"></table>
                            </div>
                        </div>
                </div>
		</div>
		<div id="jzx_wg_div" style="display: none">
			<h3 class="pro-module-title">
				<span class="title-des">阈值设置</span>
			</h3>
			<div class="pro-module-item">
				<div class="layui-form-item" style="margin-bottom: 5px;">
					<div class="layui-input-inline input-inline manage-info-item" style="float: left;width: 60%!important;">
						<ul class="manage-info-item" style="margin-left:60px;color:blue">
							<li style="width:100px;padding-right:1px"><input type="radio"  name="forbidOrAgreeRadio" data-th-value="Y" th:title="禁投项" />
							</li>
							<li style="width:100px;padding-right:1px"><input type="radio"  name="forbidOrAgreeRadio" data-th-value="N" th:title="可投项" />
							</li>
						</ul>
					</div>
					<div class="layui-input-inline input-inline manage-info-item" style="float: right;width: 6%!important;color:blue">
						<input type="checkbox" class='layui-input form-input' data-th-lay-filter="|forbid_SelChk|" id="forbidCkboxSel" th:text="全选"/>
					</div>
					<div class="layui-form-item" style="height: 160px; overflow: auto">
						<div class="layui-inline layui-col-xs1 ">
							<label class="layui-form-label"
								style="text-align: left;  font-weight: bold; width: 99%">枚举项:</label>
						</div>
						<div class="layui-inline layui-col-xs11" id="jztz_zclx"
							style="display: block; margin-top: 5px">
						</div>
							
					</div>
				</div>
			</div>
		</div>

			<h3 class="pro-module-title">
				<span class="title-des">阙值设置</span>
			</h3>
			<div class="pro-module-item" style="overflow: hidden;padding-top: 10px;margin-left:70px;">

						<input type="text" th:id="|${pageId}_compareDays|"

					</div>
				</div>
			</div>
		</div>-->
	</div>
</div>
