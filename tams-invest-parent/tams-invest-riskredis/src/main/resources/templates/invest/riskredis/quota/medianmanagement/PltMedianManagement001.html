<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PltMedianManagement001}">指标参数中间值管理</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area curr-form' >
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
								data-th-text="#{PltMedianManagement001.paraCode}">参数代码(参数名称)(联想框多选)</label>
							<div class="layui-input-inline input-inline">
								<select type="text"  name="paraCode"
									class="layui-input form-input input-select" id="paraCode" 
									allowclear="true" placeholder="请输入内容" multiple="true"
									formatoption="true"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-url="@{/invest/riskredis/quota/medianmanagement/PltMedianManagement001/selectMedianManagement}">
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{PltMedianManagement001.tradeId}">事件编码</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="tradeId" name="tradeId" class="layui-input form-input " 
								maxLength="32"  formatoption = true placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
		                      <label class="layui-form-label form-label-wrap" 
		                               data-th-text="#{PltMedianManagement001.supDate}">日期</label>
		                      <div class="layui-input-inline input-inline">
		                          <input id="supDate" name="supDate" class="layui-input form-input input-dateRangeSelect"
		                             placeholder="请选择时间区间" data-th-value="${platDate}" data-th-placeholder="#{SysCommon.dateInterval}" required>
		                              
		                      </div>
	                  	</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{PltMedianManagement001.portfolioId}">参数维度产品代码</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="portfolioId" name="portfolioId" class="layui-input form-input " 
								maxLength="32"  formatoption = true placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{PltMedianManagement001.assetCode}">资产代码</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="assetCode" name="assetCode" class="layui-input form-input " 
								maxLength="32"  formatoption = true placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
	                        <label class="layui-form-label form-lable"
	                               data-th-text="#{PltMedianManagement001.paraGranularity}">参数粒度</label>
	                        <div class="layui-input-inline input-inline">
	                            <select type="text" id="paraGranularity" name="paraGranularity"
	                                class="layui-input form-input input-select" data-th-data-result='${PARA_GRAIN}'
	                                formatoption="true" allowClear="true" placeholder="请输入内容"
	                                data-th-placeholder="#{SysCommon.placeholder}">
	                            </select>
	                        </div>
	                  </div>
					</div>
					<div class="layui-form-item">
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-label-wrap"
                                   data-th-text="#{PltMedianManagement001.blank}">不显示发生额为0的数据</label>
                            <div class="layui-input-inline input-inline" >
                                <div class="element" >
                                    <ul class="manage-info-item">
                                        <li>
                                            <div style="width:10%">
                                                <input type="checkbox" th:id="blank"
                                                       th:checked="true"
                                                       class='layui-input form-input input-checkbox'
                                                       name="blank" style="transform:scale(.7)"
                                                />
                                            </div>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>
					</div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<style type="text/css">
.manage-info-item li {
	padding-right: 15px;
	line-height: 24px;
	margin-bottom: 3px;
}

.manage-info-item {
	float: left;
	padding-right: 10px;
}

.manage-info-item .layui-form-checkbox {
	margin-right: 2px;
	margin-top: 4px;
	padding-right: 0;
	line-height: 15px;
	width: 15px;
	height: 15px;
}

.manage-info-item .layui-form-checkbox i {
	line-height: 15px;
	width: 15px;
	height: 15px;
	border-left: 1px solid #d2d2d2;
	font-size: 15px;
}



</style>
		<script data-th-src="@{/js/invest/riskredis/quota/medianmanagement/PltMedianManagement001.js}"></script>
	</div>
</body>
</html>
