<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
	<title data-th-text="#{RepTradeApproval002}">交易审批</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm">
        
        <div class="pro-module">
				  	<h3 class="pro-module-title"><span class="title-des">基本信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
		<div class="pro-module-item">
        
        <div class="layui-form-item">
             <input type="text" id="workflowId" data-th-value="${entity?.workflowId}" style="display:none"  /> 
					<input type="hidden" id="tradeId" name="tradeId" data-th-value="${entity?.tradeId}">
					<input type="text" id="assetRate1" data-th-value="${entity?.assetRate}" style="display:none"  />
					<input type="hidden" id="tradeType" name="tradeType" data-th-value="${entity?.tradeType}">
					<input type="hidden" id="stopType" name="stopType" data-th-value="${entity?.stopType}">
					<input type="hidden" id="createDept" name="createDept" data-th-value="${entity?.createDept}">
					<input type="hidden" id="portfolioId" name="portfolioId" data-th-value="${entity?.portfolioId}">
					<input type="hidden" id="indId" name="indId" data-th-value="${entity?.indId}">
					<input type="hidden" id="supVal" name="supVal" data-th-value="${entity?.supVal}" >
					<input type="hidden" id="supStat" name="supStat" data-th-value="${entity?.supStat}" >
					<input type="hidden" id="uniteSupStat" name="uniteSupStat" data-th-value="${entity?.uniteSupStat}" >
					<input type="hidden" id="warnCond" name="warnCond" data-th-value="${entity?.warnCond}" >
					<input type="hidden" id="approveCond" name="approveCond" data-th-value="${entity?.approveCond}" >
					<input type="hidden" id="foulCond" name="foulCond" data-th-value="${entity?.foulCond}" >
					<div style="display: none">
						<input type="text" id="supDate" name="supDate" data-th-value='${#dates.format(entity?.supDate,"yyyy-MM-dd")}'/>
					</div>
					<input type="hidden" id="priceAmt" name="priceAmt" data-th-value="${entity?.priceAmt}" >
					<input type="hidden" id="tradeNum" name="tradeNum" data-th-value="${entity?.tradeNum}" >
					<input type="hidden" id="wflStatus" name="wflStatus" data-th-value="${entity?.wflStatus}" >
    					<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
									data-th-text="#{RepTradeApproval001.eventId}">交易代码</label>
							<div class="layui-input-inline input-inline">
							<input type="text" class="layui-input form-input" id="eventId"
								name="eventId" data-th-value="${entity?.eventId}"
								data-th-placeholder="#{SysCommon.placeholder}"
								required="required" maxlength="60" disabled/>
							</div>
						</div>
				
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
									data-th-text="#{RepTradeApproval001.prodId}">产品代码</label>
							<div class="layui-input-inline input-inline">
							<input type="text" class="layui-input form-input" id="prodId"
								name="prodId" data-th-value="${entity?.prodId}"
								data-th-placeholder="#{SysCommon.placeholder}"
								required="required" maxlength="60" disabled/>
							</div>
						</div>
						
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap" data-th-text="#{RepTradeApproval001.eventDate}">交易日</label>
							<div class="layui-input-inline input-inline">
							<input type="text" class="layui-input form-input" id="eventDate"
								name="eventDate" data-th-value="${#dates.format(entity?.eventDate,'yyyy-MM-dd')}"
								data-th-placeholder="#{SysCommon.placeholder}"
								required="required" maxlength="60" disabled/>
							</div>
						</div>
						
       				</div>
            		<div class="layui-form-item">
            
    					<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
									data-th-text="#{RepTradeApproval001.deliveryDate}">交割日</label>
							<div class="layui-input-inline input-inline">
							<input type="text" class="layui-input form-input" id="deliveryDate"
								name="deliveryDate" data-th-value="${#dates.format(entity?.deliveryDate,'yyyy-MM-dd')}"
								data-th-placeholder="#{SysCommon.placeholder}"
								required="required" maxlength="60" disabled/>
							</div>
						</div>
				
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
									data-th-text="#{RepTradeApproval001.ps}">交易方向</label>
							<div class="layui-input-inline input-inline">
							<select type="text" class="layui-input form-input input-select" id="ps"
								name="ps" data-th-initvalue="${entity?.ps}"
								data-th-placeholder="#{SysCommon.placeholder}"
								required="required" maxlength="60" disabled data-th-data-result="${PS}"></select>
							</div>
						</div>
						
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
									data-th-text="#{RepTradeApproval001.assetCode}">资产代码</label>
							<div class="layui-input-inline input-inline">
							<input type="text" class="layui-input form-input" id="assetCode"
								name="assetCode" data-th-value="${entity?.assetCode}"
								data-th-placeholder="#{SysCommon.placeholder}"
								required="required" maxlength="60" disabled/>
							</div>
						</div>
						
       				</div>
       				
       				<div class="layui-form-item">
            
    					<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
									data-th-text="#{RepTradeApproval001.assetName}">资产名称</label>
							<div class="layui-input-inline input-inline">
							<input type="text" class="layui-input form-input" id="assetName"
								name="assetName" data-th-value="${entity?.assetName}"
								data-th-placeholder="#{SysCommon.placeholder}"
								required="required" maxlength="60" disabled/>
							</div>
						</div>
				
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
									data-th-text="#{RepTradeApproval001.market}">交易场所</label>
							<div class="layui-input-inline input-inline">
							<select type="text" class="layui-input form-input input-select" id="market"
								name="market" data-th-initvalue="${entity?.market}"
								data-th-placeholder="#{SysCommon.placeholder}"
								required="required" maxlength="60" data-th-data-result="${TRADE_MARKET}" disabled></select>
							</div>
						</div>
						
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
									data-th-text="#{RepTradeApproval001.amount}">交易金额</label>
							<div class="layui-input-inline input-inline">
							<input type="text" class="layui-input form-input" id="amount"
								name="amount" data-th-value="${entity?.amount}"
								data-th-placeholder="#{SysCommon.placeholder}"
								required="required" maxlength="60" disabled/>
							</div>
						</div>
						
       				</div>
       				
       				<div class="layui-form-item">
            
    					<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
									data-th-text="#{RepTradeApproval001.priceAmt}">交易价格</label>
							<div class="layui-input-inline input-inline">
							<input type="text" class="layui-input form-input" id="priceAmt"
								name="priceAmt" data-th-value="${entity?.priceAmt}"
								data-th-placeholder="#{SysCommon.placeholder}"
								required="required" maxlength="60" disabled/>
							</div>
						</div>
				
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
									data-th-text="#{RepTradeApproval001.yieldMaturity}">到期收益率%</label>
							<div class="layui-input-inline input-inline">
							<input type="text" class="layui-input form-input" id="yieldMaturity"
								name="yieldMaturity" data-th-value="${entity?.yieldMaturity}"
								data-th-placeholder="#{SysCommon.placeholder}"
								required="required" maxlength="60" disabled/>
							</div>
						</div>
						
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
									data-th-text="#{RepTradeApproval001.assetRate}">利率%</label>
							<div class="layui-input-inline input-inline">
							<input type="text" class="layui-input form-input" id="assetRate"
								name="assetRate" data-th-value="${entity?.assetRate}"
								data-th-placeholder="#{SysCommon.placeholder}"
								required="required" maxlength="60" disabled/>
							</div>
						</div>
						
       				</div>
       				
       				<div class="layui-form-item">
       				
       				<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
									data-th-text="#{RepTradeApproval001.trader}">交易员</label>
							<div class="layui-input-inline input-inline">
							<input type="text" class="layui-input form-input" id="trader"
								name="trader" data-th-value="${entity?.trader}"
								data-th-placeholder="#{SysCommon.placeholder}"
								required="required" maxlength="60" disabled/>
							</div>
						</div>
            
    					<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
									data-th-text="#{RepTradeApproval001.manager}">投资经理</label>
							<div class="layui-input-inline input-inline">
							<input type="text" class="layui-input form-input" id="manager"
								name="manager" data-th-value="${entity?.manager}"
								data-th-placeholder="#{SysCommon.placeholder}"
								required="required" maxlength="60" disabled/>
							</div>
						</div>
       				</div>
		</form>

		<div class="pro-module-wrap"
			style="border-top: 1px solid #ccc; margin-top: 5px;">
			<div class="pro-module">
				<h3 class="pro-module-title">
					<span class="title-des">试算结果</span><i
						class="iconfont icon-arrow-down pro-down-icon"></i>
				</h3>
				<div class="pro-module-item">
					<div class="layui-form-item"></div>

				</div>
				<div
					class="layui-inline layui-col-md12 layui-col-sm12 layui-col-lg12"
					style="margin-left: 5px;">
					<div class="layui-input-inline" style="width: 99% !important;">
						<textarea id="conclusion" name="conclusion"
							class="layui-input layui-textarea" required="required"
							data-th-text="${entity?.conclusion}" disabled><!-- content -->
                        </textarea>
					</div>
				</div>

				<div class="layui-row" id="singleTableDiv">
					<table class="layui-table" id="dataTable"></table>
				</div>
			</div>
		</div>

		<div class="layui-form-item" align="center">
            <a id="RepTradeApproval002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="RepTradeApproval002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div> 
        
    </div>
    <div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
		     var entity=/*[[${entity}]]*/'';
		     var SUP_UNIT=/*[[${SUP_UNIT}]]*/'';  //单位数据字典下拉
		     var ENTRUST_ID=/*[[${ENTRUST_ID}]]*/'';
		</script>
		<style>
			.line24{
			line-height: 24px;
			padding:0px 10px 0px 0px;
			}
			.width30{
			width:30%;
			}
		</style>
        <script data-th-src="@{/js/invest/riskredis/quota/tradeapproval/RepTradeApproval002.js}" type="text/javascript"></script>
    </div>
</body>

</html>
