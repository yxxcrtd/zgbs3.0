<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
	<title data-th-text="#{RskApproval001}">精确委托审批</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm">
        <div class="pro-module">
		    <h3 class="pro-module-title"><span class="title-des">基本信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
		    <div class="pro-module-item">
		    <div class="layui-form-item">
                <input type="text" id="workflowId" data-th-value="${entity?.workflowId}" style="display:none"  /> 
                <input type="text" id="uuid" data-th-value="${entity?.uuid}" style="display:none"  />
                <input type="text" id="eventId" data-th-value="${entity?.eventId}" style="display:none"  /> 
    			<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-label-wrap"
							data-th-text="#{RskApproval001.entrustCode}">委托代码</label>
					<div class="layui-input-inline input-inline">
						<input type="text" class="layui-input form-input" id="entrustCode"
							name="entrustCode" data-th-value="${entity?.entrustCode ?: entity?.eventIdStr}"
							data-th-placeholder="#{SysCommon.placeholder}" />
					</div>
				</div>

				<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-label-wrap"
							data-th-text="#{RskApproval001.prodId}">产品代码</label>
					<div class="layui-input-inline input-inline">
						<input type="text" class="layui-input form-input" id="prodId"
							name="prodId" data-th-value="${entity?.prodId}"
							data-th-placeholder="#{SysCommon.placeholder}" />
					</div>
				</div>

				<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-label-wrap" data-th-text="#{RskApproval001.startDate}">委托开始日</label>
					<div class="layui-input-inline input-inline">
						<input type="text" class="layui-input form-input" id="startDate"
							name="startDate" data-th-value="${#dates.format(entity?.startDate,'yyyy-MM-dd')}"
							data-th-placeholder="#{SysCommon.placeholder}" />
					</div>
				</div>
       		</div>
            <div class="layui-form-item">
    			<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-label-wrap"
							data-th-text="#{RskApproval001.endDate}">委托结束日</label>
					<div class="layui-input-inline input-inline">
						<input type="text" class="layui-input form-input" id="endDate"
							name="endDate" data-th-value="${#dates.format(entity?.endDate,'yyyy-MM-dd')}"
							data-th-placeholder="#{SysCommon.placeholder}" />
					</div>
				</div>
				<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-label-wrap"
							data-th-text="#{RskApproval001.ps}">交易方向</label>
					<div class="layui-input-inline input-inline">
						<select type="text" class="layui-input form-input input-select" id="ps"
							name="ps" data-th-initvalue="${entity?.ps}"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-data-result="${PS}"></select>
					</div>
				</div>
				<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-label-wrap"
							data-th-text="#{RskApproval001.assetCode}">资产代码</label>
					<div class="layui-input-inline input-inline">
						<input type="text" class="layui-input form-input" id="assetCode"
							name="assetCode" data-th-value="${entity?.assetCode}"
							data-th-placeholder="#{SysCommon.placeholder}" />
					</div>
				</div>
       		</div>

       		<div class="layui-form-item">
    			<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-label-wrap"
							data-th-text="#{RskApproval001.assetName}">资产名称</label>
					<div class="layui-input-inline input-inline">
						<input type="text" class="layui-input form-input" id="assetName"
							name="assetName" data-th-value="${entity?.assetName}"
							data-th-placeholder="#{SysCommon.placeholder}" />
					</div>
				</div>
				
				<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-label-wrap"
							data-th-text="#{RskApproval001.market}">交易场所</label>
					<div class="layui-input-inline input-inline">
						<select type="text" class="layui-input form-input input-select" id="market"
							name="market" data-th-initvalue="${entity?.market}"
							data-th-placeholder="#{SysCommon.placeholder}" 
							data-th-data-result="${TRADE_PLACE}"></select>
					</div>
				</div>
						
				<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-label-wrap"
							data-th-text="#{RskApproval001.amount}">委托金额</label>
					<div class="layui-input-inline input-inline">
						<input type="text" class="layui-input form-input" id="amout"
							name="amount" data-th-value="${entity?.amount}"
							data-th-placeholder="#{SysCommon.placeholder}" />
					</div>
				</div>	
       		</div>

       		<div class="layui-form-item">
    			<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-label-wrap"
							data-th-text="#{RskApproval001.tradeNum}">委托数量</label>
					<div class="layui-input-inline input-inline">
						<input type="text" class="layui-input form-input" id="tradeNum"
							name="tradeNum" data-th-value="${entity?.tradeNum}"
							data-th-placeholder="#{SysCommon.placeholder}" />
					</div>
				</div>
    			<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-label-wrap"
							data-th-text="#{RskApproval001.priceAmt}">委托价格</label>
					<div class="layui-input-inline input-inline">
						<input type="text" class="layui-input form-input" id="priceAmt"
							name="priceAmt" data-th-value="${entity?.priceAmt ?: entity?.netPrice}"
							data-th-placeholder="#{SysCommon.placeholder}" />
					</div>
				</div>
    			<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-label-wrap"
							data-th-text="#{RskApproval001.manager}">投资经理</label>
					<div class="layui-input-inline input-inline">
						<input type="text" class="layui-input form-input" id="manager"
							name="manager" data-th-value="${entity?.manager}"
							data-th-placeholder="#{SysCommon.placeholder}" />
					</div>
				</div>
			</div>

       	    </div>
        </div>
        </form>
		<div class="pro-module-wrap" style="border-top:1px solid #ccc;margin-top: 5px; ">
            <div class="pro-module">
				<h3 class="pro-module-title"><span class="title-des">试算结果</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
			    <div class="pro-module-item">
				    <div class="layui-form-item">
			    <div class="layui-inline layui-col-md12 layui-col-sm12 layui-col-lg12" style="margin-left: 5px;">
					<div class="layui-input-inline" style="width:99% !important;">
						<textarea id="conclusion" name="conclusion" 
          					class="layui-input layui-textarea" required="required"
          					data-th-text="${entity?.conclusion}" >
                        </textarea>
					</div>
				</div>
			    <div class="layui-row" id="singleTableDiv">
		              <table class="layui-table" id="data_table" ></table>
		        </div>
			        </div>
			    </div>
	       	</div>
	    </div>
        <div class="layui-form-item" align="center">
            <a id="RskApproval001_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="RskApproval001_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="RskApproval001_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div> 
    </div>
    <div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
		     var entity=/*[[${entity}]]*/;
		     var SUP_UNIT=/*[[${SUP_UNIT}]]*/;  //单位数据字典下拉
		     var ENTRUST_ID=/*[[${ENTRUST_ID}]]*/;
		</script>
		<style>
			.line24{
			line-height: 24px;
			padding:0px 10px 0px 0px;
			}
			.width30{
			width:30%;
			}
		</style>
        <script data-th-src="@{/js/invest/riskredis/quota/rskapproval/RskApproval001.js}" type="text/javascript"></script>
    </div>
</body>

</html>
