<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RskEvent003}">关联指标参数</title>
</head>
<body>
	<div layout:fragment="content">
		<div class="pro-module-wrapper pro-module-base" title="关联指标参数">
			<div class="pro-module-wrap">
				<div class="pro-module">
					<h3 class="pro-module-title">
						<span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i
							class="iconfont icon-arrow-down pro-down-icon"></i>
					</h3>
					<form class="layui-form joyin-form-wrap" id="submitForm">
						<!-- 隐藏字段 工作流代码 -->
						<input type="text" name="workflowId" data-th-value='${workflowId}'
							hidden /> 
						<input type="text" id="eventCode" name="eventCode"
							data-th-value='${entity?.eventCode}' hidden />
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{RskEvent003.eventName}">事项名称</label>
									<div class="layui-input-inline input-inline">
										<input type="text" name="eventName" id="eventName"
											class="layui-input form-input" maxlength=32 disabled
											data-th-value='${entity?.eventName}' placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}" required />
									</div>
								</div>
							</div>
						</div>
					</form>
				</div>
			</div>
			<div class="pro-module-wrap" id="TargetItemConf002_characterItem">
				<div class="pro-module">
					<h3 class="pro-module-title">
						<span class="title-des">指标参数项</span><i
							class="iconfont icon-arrow-down pro-down-icon"></i>
					</h3>
					<div id="table_character_item" class="pro-module-item">
					<table class="layui-table" id="dataTable_relate_param"></table>
					</div>
				</div>
				
			</div>

			<div class="text-center" id="RskEvent003_btn" style="padding:10px 0px">
				<a id="RskEvent003_btn_save" class="layui-btn layui-btn-sm btn-save"
					data-th-text="#{SysCommon.save}">保存</a> <a
					id="RskEvent003_btn_submit"
					class="layui-btn layui-btn-sm btn-submit"
					data-th-text="#{SysCommon.submit}">提交</a> <a
					id="RskEvent003_btn_cancel"
					class="layui-btn layui-btn-sm btn-cancel"
					data-th-text="#{SysCommon.cancel}">取消</a>
			</div>
		</div>
	</div>

	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var IND_PARAM = /*[[${IND_PARAM}]]*/'[]'; // 指标参数
			var PARA_GRAIN = /*[[${PARA_GRAIN}]]*/'[]'; // 参数粒度
    	    var EVENT_REL_ITEM = /*[[${EVENT_REL_ITEM}]]*/'[]'; // 风险事项运算关系对象
    	    var SUP_CONNECTOR = /*[[${SUP_CONNECTOR}]]*/'[]'; // 操作符
    	    var entity=/*[[${entity}]]*/'';
    	    // add by zhangrui1 公式配置 start
    	    var EVENT_REL_ITEM_FORMULA = /*[[${EVENT_REL_ITEM_FORMULA}]]*/'formula';
    	    // add by zhangrui1 公式配置 end
        </script>
		<script
			data-th-src="@{/js/invest/riskredis/quota/rskevent/RskEvent003.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
