<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RskPortAutoRelatePoint002}">规则新建<span class="star-sign">*</span>规则新建<i
								class="iconfont icon-arrow-down pro-down-icon"></i></title>
	<style>
        .mst-textarea{
            min-height: auto;
        }
        .cus-table-wrap .layui-border-box{
            height: 180px;
        }
        .cus-table-wrap .layui-border-box .layui-table-box{
            height: 140px;
        }
        .cus-table-wrap .layui-border-box .layui-table-box .layui-table-body{
            height: 101px;
        }
    </style>
</head>
<body>
	<div layout:fragment="content">
	<form class="layui-form joyin-form-wrap" id="submitForm">
		<div class="">
			<div class="pro-module-wrapper pro-module-base">
				<div class="pro-module-wrap">
					<div class="pro-module">
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div style="display: none">
									<input type="text" id="ruleId" name="ruleId" data-th-value="${entity?.ruleId}"/>
								</div>
								<div style="display: none">
									<input type="text" id="workflowId" name="workflowId" data-th-value="${entity?.workflowId}"/>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{RskPortAutoRelatePoint002.ruleName}">规则名称</label>
									<div class="layui-input-inline input-inline">
                                           <input id="ruleName" name="ruleName" required="required"
											class="layui-input form-input"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-value="${entity?.ruleName}" maxlength=32/>
                                       </div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="pro-module-wrap">
                        <div class="pro-module">
                            <div class="pro-module-item cus-table-wrap">
                                <table class="layui-table" id="dataTable"></table>
                            </div>
                        </div>
                </div>
			</div>
		</div>
		<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin-top: 40px;">
			<div class="text-center">
				<a id="RskPortAutoRelatePoint002_btn_save"
				   class="layui-btn layui-btn-sm btn-save"
				   data-th-text="#{SysCommon.save}">保存</a> <a
						id="RskPortAutoRelatePoint002_btn_submit"
						class="layui-btn layui-btn-sm btn-submit"
						data-th-text="#{SysCommon.submit}">提交</a> <a
					id="RskPortAutoRelatePoint002_btn_cancel"
					class="layui-btn layui-btn-sm btn-cancel"
					data-th-text="#{SysCommon.cancel}">取消</a>
			</div>
		</div>
		</form>
	</div>
	<div layout:fragment="script">
		<script th:inline="javascript" type="text/javascript">
		    var CLASSIFY_DIMENSION = /*[[${CLASSIFY_DIMENSION}]]*/'';
			var CLASS_DIMENSION_SOURCE = /*[[${CLASS_DIMENSION_SOURCE}]]*/'';
			var SUP_LINK_TYPE = /*[[${SUP_LINK_TYPE}]]*/'';
        </script>  
		<script data-th-src="@{/js/invest/riskredis/quota/rskportautorelatepoint/RskPortAutoRelatePoint002.js}" type="text/javascript"></script>
		
	</div>
</body>
</html>
