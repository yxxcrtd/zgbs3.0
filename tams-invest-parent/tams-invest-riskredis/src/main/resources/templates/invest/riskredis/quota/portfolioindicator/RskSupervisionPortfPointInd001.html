<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RskSupervisionIndicator001}">组合关联监督指标</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid' style="padding-left:1px">
		   <div class="layui-form-item" style="width:18%;float: left;border-right: 1px solid #ccc;min-height:460px;">
		       <form class="layui-form  pro-module-form" style="background: #fff">
					<div class="layui-form-item" style="margin-left: 10px;padding-bottom:8px" >
						<div class="layui-input-inline input-inline"
						style="width: 95% !important">
						<select  id="indType" name="indType" formatoption="false"
							class="layui-input form-input input-select" 
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-data-result='${IND_TYPE}'>
						</select>
						</div>
					</div>
                    <div th:if="${entity} == null" data-checkall="false" data-checkable="false" style="scroll-y: auto; scroll-x: hidden;height:670px" id='treeIndPortf' data-canedit='0' data-roottitle='列表信息' >
                    </div>
                    </form>
		    </div>
		    <div class="layui-col-lg9" style="width:81%">
				<div class="layui-col-md12 form-button-area" style="margin: 10px;" filter="false">
					<a id="RskSupervisionPortfPointInd001_btn_add" class="layui-btn layui-btn-sm btn-create"
						data-th-text="#{SysCommon.create}">新建</a>
					<a id="RskSupervisionPortfPointInd001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
					data-th-text="#{SysCommon.delete}">删除</a>
				</div>
				<div class='joyin-form-wrap joyin-filter-form condition-area'>
					<form class="layui-form" id="searchForm">
					  <input type="hidden" id="indId">
					   <input type="hidden" id="indName">
						<div class="layui-form-item">
						    <div class="form-inline-wrap width30">
				                <label class="layui-form-label form-label-wrap" data-th-text="#{RskSupervisionPortfPointInd001.portfolioLevel}">组合层次</label>             
				                <div class="layui-input-inline input-inline">
				                      <input type="text" id="portfolioLevel"   class="layui-input form-input input-checkbox" data-th-data-result="${PORTFOLIO_LEVEL}"/>
				                </div>
				            </div>
							<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
								<label class="layui-form-label form-lable"
									data-th-text="#{RskSupervisionPortfPointInd001.portfolioOrBagName}">组合(包)名称</label>
								<div class="layui-input-inline input-inline">
									<input type="text" id="portfolioName"
										class="layui-input form-input"  maxlength=32
										data-th-placeholder="#{SysCommon.placeholder}"
	 									>
								</div>
							</div>
							
						</div>
					</form>
				</div>

				<div>
					<table class="layui-table" id="dataIndTable"></table>
				</div>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<style type="text/css">
		.mixtree-div i.icon-showorder{
			display: none;
		}
		.mixtree-div a.portBagAddAicon,a.refreshAicon{
			float: right; 
			padding-right: 10px;
			color:#90C321;
			height:30px;
			line-height:28px;
			cursor: pointer;
		}
		.layui-form-radio {
			line-height: 14px !important
		}
		.layui-form-radio>i {
			font-size: 16px !important
		}
		.manage-info-item li {
			float: left;
			padding-right: 15px;
			line-height: 24px;
		}
		.manage-info-item {
			float: left;
			padding-right: 10px;
		}
		.layui-fluid{
			padding-left:0px;
			padding-right:0px;
		}
		div.input-btn-append a {
			line-height: 20px !important
		}
		a.portBagAicon{
			display:inline-block!important;
			height:20px!important;
			line-height: 20px!important;
			width:92%;
			margin-left:10px!important;
		}
		li.portBagLi:hover,li.active,li.active:hover{
			background: #D9ECFF
		}
		li.portBagLi:hover{
			background: #FFFFCA
		}
		li.portBagLi i{
		 	font-size:15px;
		}
		li.portBagLi i:hover{
			background: #B7DBFA
		}
		.width30{
		width:30%;
		}
		</style>
		<script data-th-inline="javascript" type="text/javascript">
			var getAllRelationUrl = /*[[@{/invest/riskredis/quota/portfolioindicator/RskSupervisionPortfPointMain/getTreeIndicatorByIndType}]]*/'';
		</script>
		<script data-th-src="@{/js/invest/riskredis/quota/portfolioindicator/RskSupervisionPortfPointInd001.js}"></script>
	</div>
</body>
</html>
