<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RepInterLog003}">应答报文明细</title>
</head>
<body>
	<div layout:fragment="content">
		<div class="pro-module-wrapper pro-module-base">
			<form class="layui-form joyin-form-wrap" id="submitForm">
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title">
							<span class="title-des">风险试算结果</span><i
								class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="layui-form-item pro-module-item">
							<div class="form-inline-wrap" style="width: 100%;">
								<div class="layui-input-inline input-inline"
									style="width: 80% !important;">
									<textarea id="result" name="result" class="layui-textarea"
										data-th-placeholder="#{SysCommon.placeholder}"></textarea>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="pro-module-wrap" id="TargetItemConf002_characterItem">
					<div class="pro-module" id="groupTable">
						<div id="table_character_item" class="pro-module-item">
							<table class="layui-table" id="dataTable"></table>
						</div>
					</div>

				</div>
			</form>
			<div class="text-center" id="RepInterLog003_btn">
				<a id="RepInterLog003_btn_cancel"
					class="layui-btn layui-btn-sm btn-cancel"
					data-th-text="#{SysCommon.cancel}">取消</a>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
    	    var responseData=/*[[${responseData}]]*/'';
    	    var IND_TYPE=/*[[${IND_TYPE}]]*/'';
    	    var INF_KRI_STATUS=/*[[${INF_KRI_STATUS}]]*/
        </script>
		<script data-th-src="@{/js/invest/riskredis/quota/interlog/RepInterLog003.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
