<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorator="~{layout/default}">
<head>
<title data-th-text="#{RskSupervisionIndicator001}">组合关联监督指标</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid' style="padding-left:1px">
		   <div class="layui-form-item" style="width:18%;float: left;overflow:auto;border-right: 1px solid #ccc;min-height:460px;">
		       <form class="layui-form  pro-module-form" style="background: #fff">
		           <div class="layui-form-item" style="margin-left: 10px;">
			    		<div class="layui-input-inline input-inline" style="width:99%!important">
						   	<div class="element">
								<ul class="manage-info-item">
									<li data-th-each="key,list : ${mapZhcc}">
										<div data-th-each="option : ${list.current.value}">
											<input type="radio"
												th:checked="${#strings.contains(#strings.isEmpty(entity?.portfolioLevel) ?'' : entity?.portfolioLevel, option?.id)}"
												name="portfolioLevel" data-th-lay-filter="portfolioLevel"
												data-th-value="${option?.id}" th:title="${option.text}" />
										</div>
									</li>
								</ul>
							</div>
						</div>
					</div>
					<div class="layui-form-item" style="margin-left: 10px;padding-bottom:8px" id="singlePortfolioDiv">
						<div class="layui-input-inline input-inline"
						style="width: 77% !important">
							<select  id="sortType" name="sortType"
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-initValue="${entity}==null?'01':(${entity.type}==null?'01':${entity.type})"
								data-th-data-result='${CLASSIFY_DIMENSION}'>
							</select>
						</div>
						<!--add by jjpei 20190727---增加组合筛选条件--start-->
						<div style="width:18%;margin-left:5px;float:left;text-align: center">
							<a style="width:80px;height:30px;font-weight: bold;line-height: 30px;font-size: 14px;cursor: pointer" id="selectorAtag001">筛选</a>
							<div id="selectorConditionFilter001" style="display:none;border: 1px solid #ccc;position: absolute;background: #fff;z-index: 999">
								<div class="sgePortDiv">
									<label class="layui-form-label form-label-wrap" style="width:17%;padding-right:2px!important"
										   data-th-text="组合名称">组合名称</label>
									<div class="layui-input-inline input-inline"
										 style="width:32%!important">
										<input type="text" id="portfolioSingleName" name="portfolioSingleName"
											   class="layui-input form-input" placeholder="请输入内容"
											   data-th-placeholder="#{SysCommon.placeholder}" >
									</div>
									<label class="layui-form-label form-label-wrap" style="width:17%;padding-right:2px!important"
										   data-th-text="收益类型">收益类型</label>
									<div class="layui-input-inline input-inline sgePort14sub"
									>
										<select  id="profitType" name="profitType"
												 class="layui-input form-input input-select"
												 data-th-placeholder="#{SysCommon.placeholder}"
												 data-th-data-result='${PROFIT_TYPE}'></select>
									</div>

								</div>
								<div class="sgePortDiv">
									<label class="layui-form-label form-label-wrap" style="width:17%;padding-right:2px!important"
										   data-th-text="开放类型">开放类型</label>
									<div class="layui-input-inline input-inline sgePort14sub"
									>
										<select  id="issueMode" name="issueMode"
												 class="layui-input form-input input-select"
												 data-th-placeholder="#{SysCommon.placeholder}"
												 data-th-data-result='${ISSUE_MODE}'></select>
									</div>
									<label class="layui-form-label form-label-wrap" style="width:17%;padding-right:2px!important"
										   data-th-text="募集方式">募集方式</label>
									<div class="layui-input-inline input-inline sgePort14sub"
									>
										<select  id="raiseType" name="raiseType"
												 class="layui-input form-input input-select"
												 data-th-placeholder="#{SysCommon.placeholder}"
												 data-th-data-result='${RAISE_TYPE}'></select>
									</div>
								</div>
								<div class="sgePortDiv">
									<label class="layui-form-label form-label-wrap" style="width:17%;padding-right:2px!important"
										   data-th-text="投资性质">投资性质</label>
									<div class="layui-input-inline input-inline" style="width:32%!important"
									>
										<select  id="investType" name="investType"
												 class="layui-input form-input input-select"
												 data-th-placeholder="#{SysCommon.placeholder}"
												 data-th-data-result='${INVEST_TYPE}'></select>
									</div>
									<label class="layui-form-label form-label-wrap" style="width:17%;padding-right:2px!important"
										   data-th-text="是否面向单一投资者">是否面向单一投资者</label>
									<div class="layui-input-inline input-inline" style="width:32%!important"
									>
										<select  id="isFaceSingleInvestor" name="isFaceSingleInvestor"
												 class="layui-input form-input input-select"
												 data-th-placeholder="#{SysCommon.placeholder}"
												 data-th-data-result='${IS_SINGLE_INVESTOR}'></select>
									</div>
								</div>
								<div class="sgePortDiv" style="margin-bottom: 10px">
									<a id="RskSupervisionPortfPoint001_btn_portQuery" style="margin-left: 9px" class="layui-btn layui-btn-sm"
									   data-th-text="#{SysCommon.search}">查询</a>
									<a id="RskSupervisionPortfPoint001_btn_portClose" style="margin-left: 9px" class="layui-btn layui-btn-sm"
									   data-th-text="关闭">关闭</a>
								</div>
							</div>
						</div>
						<!--add by jjpei 20190727---增加组合筛选条件--end-->
					</div>
					<div class="layui-form-item" style="margin-left: 10px;padding-bottom:8px;display: none" id="portfolioBagNameDiv" >
						<div class="layui-input-inline input-inline" style="width: 95% !important" >
						<input type="text" id="portfolioBagName" name="portfolioBagName"
							class="layui-input form-input input-fuzzy-text" style="height:24px" placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}" >
						</div>
					</div>
                    <div th:if="${entity} == null" data-checkall="false" data-checkable="false" style="scroll-y: auto; scroll-x: hidden;height:670px" id='treePortfInd' data-canedit='0' data-roottitle='列表信息' >
                    </div>
                    </form>
		    </div>
		    <div class="layui-col-lg9" style="width:81%">
				<div class="layui-col-md12 form-button-area" style="margin: 10px;" filter="false">
					<a id="RskSupervisionPortfPoint001_btn_add" class="layui-btn layui-btn-sm btn-create"
						data-th-text="#{SysCommon.create}">新建</a>
					<a id="RskSupervisionPortfPoint001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
					data-th-text="#{SysCommon.delete}">删除</a>
					<a id="RskSupervisionPortfPoint001_btn_play" class="layui-btn layui-btn-sm btn-play"
					data-th-text="#{RskSupervisionPortfPoint001.play}" style="display: none">风险启动</a>
				</div>
				<div class='joyin-form-wrap joyin-filter-form condition-area'>
					<form class="layui-form" id="searchForm">
					  <input type="hidden" id="portfolioId">
					   <input type="hidden" id="portfolioName">
					   <input type="hidden" id="riskEnabled">
						<div class="layui-form-item">
							<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
								<label class="layui-form-label form-lable"
									data-th-text="#{RskSupervisionPortfPoint001.indName}">指标名称</label>
								<div class="layui-input-inline input-inline">
									<input type="text" id="indName" name="indName"
										class="layui-input form-input"  maxlength=32
										data-th-placeholder="#{SysCommon.placeholder}"
	 									>
								</div>
							</div>
							<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
				                <label class="layui-form-label form-label-wrap" data-th-text="#{RskSupervisionPortfPoint002.supType}">监督类型</label>             
				                <div class="layui-input-inline input-inline">
				                      <select type="text" id="supType" name="supType"  class="layui-input form-input input-select" data-th-data-result="${SUP_TYPE}"></select>
				                </div>
				            </div>
						</div>
					</form>
				</div>

				<div>
					<table class="layui-table" id="dataTable"></table>
				</div>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<style type="text/css">
		.mixtree-div i.icon-showorder{
			display: none;
		}
		.mixtree-div a.portBagAddAicon,a.refreshAicon{
			float: right; 
			padding-right: 10px;
			color:#90C321;
			height:30px;
			line-height:28px;
			cursor: pointer;
		}
		.layui-form-radio {
			line-height: 14px !important
		}
		.layui-form-radio>i {
			font-size: 16px !important
		}
		.manage-info-item li {
			float: left;
			padding-right: 8px;
			line-height: 24px;
		}
		.manage-info-item {
			float: left;
			padding-right: 10px;
		}
		.layui-fluid{
			padding-left:0px;
			padding-right:0px;
		}
		div.input-btn-append a {
			line-height: 20px !important
		}
		a.portBagAicon{
			display:inline-block!important;
			height:20px!important;
			line-height: 20px!important;
			width:92%;
			margin-left:10px!important;
		}
		li.portBagLi:hover,li.active,li.active:hover{
			background: #D9ECFF
		}
		li.portBagLi:hover{
			background: #FFFFCA
		}
		li.portBagLi i{
		 	font-size:15px;
		}
		li.portBagLi i:hover{
			background: #B7DBFA
		}
		.tree-left-width{
		    overflow: hidden;
		    text-overflow: ellipsis;
		    white-space: nowrap;
		    width: 145px;
		}
		.sgePortDiv{
			width:100%;
			overflow:hidden;
			clear:both;
			padding-top: 8px;
		}
		.sgePort23sub{
			width:23%!important
		}
		.sgePort14sub{
			width:32%!important
		}
		</style>
		<script data-th-inline="javascript" type="text/javascript">
			var getAllRelationUrl = /*[[@{/invest/riskredis/quota/superviseindicator/RskSupervisionIndicator002/getAllPortfolioBySort}]]*/'';
			var getPortfolioBagUrl = /*[[@{/invest/riskredis/quota/superviseindicator/RskSupervisionIndicator002/getAllPortfolioBag}]]*/'';
		</script>
		<script data-th-src="@{/js/invest/riskredis/quota/portfolioindicator/RskSupervisionPortfPoint001.js}"></script>
	</div>
</body>
</html>
