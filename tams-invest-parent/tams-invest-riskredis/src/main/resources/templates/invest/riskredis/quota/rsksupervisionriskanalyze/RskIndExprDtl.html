<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RskIndExprDtl}">监控值计算明细</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="pro-module-wrapper pro-module-base" title="监控值计算明细">
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="title-des">指标表达式配置</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item" style="height: 180px; overflow: auto">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap" style="width: 99%" id="dt-pz-info-add"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pro-module-wrap">
                <div class="pro-module" id="groupTable">
                    <h3 class="pro-module-title">
                        <span class="title-des">指标表达式结果</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item">
                        <table class="layui-table" id="dataTable" name="dataTable"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <style type="text/css">
        .select-ind-rr {
            margin-left: 10px;
            width: 63% !important;
            float: left;
        }

        .select-ind-fh {
            margin-left: 10px;
            width: 12% !important;
            float: left;
        }

        .btn-detail-del {
            margin-left: 2px;
        }

        .btn-detail-del i {
            margin-left: 4px;
        }

        .layui-col-md6 {
            float: left;
            width: 48%;
            margin-left: 16px
        }

        .manager_fh_fh .select2-container {
            width: 90px !important
        }

        .layui-form-radio {
            line-height: 14px !important
        }

        .layui-form-radio>i {
            font-size: 16px !important
        }

        .layui-chcekbox {
            margin-right: 14px !important
        }

        .layui-inline {
            float: left;
        }

        .manage-info-item li {
            float: left;
            padding-right: 15px;
            line-height: 24px;
            margin-bottom:3px;
        }

        .manage-info-item {
            float: left;
            padding-right: 10px;
        }

        .manage-info-item .layui-form-checkbox {
            margin-right: 2px;
            margin-top: -2px;
            padding-right: 0;
            line-height: 15px;
            width: 15px;
            height: 15px;
        }

        .manage-info-item .layui-form-checkbox i {
            line-height: 15px;
            width: 15px;
            height: 15px;
            border-left: 1px solid #d2d2d2;
            font-size: 15px;
        }

        .manage-info-item .layui-form-checked i, .manage-info-item .layui-form-checked:hover i{
            border-color: #2693ff;
            color: #2693ff;
        }

        .manage-info-item .layui-form-radio {
            margin-top: 0px
        }

        div.input-btn-append a {
            line-height: 20px !important
        }

        .input-btn-append{
            height:24px!important
        }

        .rsk-tree .layui-input .ztree #treeDataSingle_tree_2_a {
            white-space: nowrap;
            width: 350px; 
            text-overflow: ellipsis;
            overflow: hidden;
        }

        .sgePortDiv{
            width:100%;
            overflow:hidden;
            clear:both;
            padding-top: 8px;
        }

        .sgePort23sub{
            width:23%!important
        }

        .sgePort14sub{
            width:14%!important
        }

        span.select2-selection__rendered{
            max-width: 250px;
        }
        </style>
        <script data-th-inline="javascript" type="text/javascript">
            var entity = /*[[${entity}]]*/'';
            var SUP_CONNECTOR = /*[[${SUP_CONNECTOR}]]*/[];
            var INDICATOR_PARAM = /*[[${INDICATOR_PARAM}]]*/[];
        </script>
        <script data-th-src="@{/js/invest/riskredis/quota/rsksupervisionriskanalyze/RskIndExprDtl.js}"></script>
    </div>
</body>
</html>
