<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RskPortAutoRelatePoint003}">组合自动关联指标新建<span
	class="star-sign">*</span>蹇呭～锛�<i
	class="iconfont icon-arrow-down pro-down-icon"></i></title>
<style>
.mst-textarea {
	min-height: auto;
}


</style>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap" id="submitForm">
			<div class="">
				<div class="pro-module-wrapper pro-module-base">
					<div class="pro-module-wrap">
						<div class="pro-module">
							<div class="pro-module-item">
								<div style="border-bottom: 1px solid #ccc; min-height: 60px;">
									<div class="layui-form-item">
										<div style="margin-top: 12px;"
											class="layui-inline layui-col-md12 layui-col-sm12 layui-col-lg12">
											<label class="layui-form-label form-lable" style="width: 13%"
												data-th-text="#{RskPortAutoRelatePoint003.ruleName}">规则名称</label>
											<div class="layui-input-inline input-inline">
												<input type="text" class="layui-input form-input"
													id="ruleName" name="ruleName" disabled
													data-th-value="${entity?.ruleName}"
													data-th-placeholder="#{SysCommon.placeholder}"
													required="required" maxlength="60" />
											</div>
										</div>
									</div>
								</div>
								<div style="min-height: 35px;">
									<div class="layui-form-item" style="margin-top: 10px;">
										<div style="display: none">
											<input type="text" id="ruleId" name="ruleId"
												data-th-value="${entity?.ruleId}" />
										</div>
										<div style="display: none">
											<input type="text" id="workflowId" name="workflowId"
												data-th-value="${entity?.workflowId}" />
										</div>
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{RskPortAutoRelatePoint003.indName}">指标类型</label>
											<div class="layui-input-inline input-inline">
												<input id="indName" name="indName"
													class="layui-input form-input"
													data-th-placeholder="#{SysCommon.placeholder}" />
											</div>
										</div>
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{RskPortAutoRelatePoint003.indType}">指标类型</label>
											<div class="layui-input-inline input-inline">
												<select id="indType" name="indType"
													class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-data-result="${IND_TYPE}">
												</select>
											</div>
										</div>
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{RskPortAutoRelatePoint003.supType}">监控类型</label>
											<div class="layui-input-inline input-inline"
												style="width: 31% !important;">
												<select id="supType" name="supType"
													class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-data-result="${SUP_TYPE}">
												</select>
											</div>
											<a id="RskPortAutoRelatePoint003_btn_search"
												style="margin-left: 29px"
												class="layui-btn layui-btn-sm btn-search"
												data-th-text="#{SysCommon.search}">查询</a>
										</div>
									</div>
								</div>

							</div>
						</div>
					</div>
					<div class="pro-module-wrap">
						<div class="pro-module">
							<div class="pro-module-item cus-table-wrap">
								<table class="layui-table" id="dataTable"></table>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div
				class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11"
				style="margin-top: 20px;margin-bottom:20px;">
				<div class="text-center">
					<a id="RskPortAutoRelatePoint003_btn_save"
						class="layui-btn layui-btn-sm btn-save"
						data-th-text="#{SysCommon.save}">保存</a><a
						id="RskPortAutoRelatePoint003_btn_submit"
						class="layui-btn layui-btn-sm btn-submit"
						data-th-text="#{SysCommon.submit}">提交</a><a
						id="RskPortAutoRelatePoint003_btn_cancel"
						class="layui-btn layui-btn-sm btn-cancel"
						data-th-text="#{SysCommon.cancel}">取消</a>
				</div>
			</div>
		</form>
	</div>
	<div layout:fragment="script">
		<script th:inline="javascript" type="text/javascript">
		    var CLASSIFY_DIMENSION = /*[[${CLASSIFY_DIMENSION}]]*/'';
			var CLASSIFY_DIMENSION_VAL = /*[[${CLASSIFY_DIMENSION_VAL}]]*/'';
			var IND_TYPE = /*[[${IND_TYPE}]]*/ ;
	        var SUP_FREQUENCY=/*[[${SUP_FREQUENCY}]]*/'';
	        var SUP_OPERATOR=/*[[${SUP_OPERATOR}]]*/ ;  //鎿嶄綔绗︽暟鎹瓧鍏镐笅鎷�
	        var SUP_CONNECTOR=/*[[${SUP_CONNECTOR}]]*/''; //杩愮畻绗︽暟鎹瓧鍏镐笅鎷�
	        var SUP_LINK_TYPE=/*[[${SUP_LINK_TYPE}]]*/''; //杩炴帴绗︽暟鎹瓧鍏镐笅鎷�
	        var SUP_UNIT=/*[[${SUP_UNIT}]]*/'';  //鍗曚綅鏁版嵁瀛楀吀涓嬫媺
	        var PORTFOLIO_LEVEL=/*[[${PORTFOLIO_LEVEL}]]*/'';  //缁勫悎灞傛鏁版嵁瀛楀吀涓嬫媺
	        var IND_TYPE_TOTAL_ENUM=/*[[${IND_TYPE_TOTAL_ENUM}]]*/'';
	        var relateIndType=/*[[${IND_TYPE_LINK_ENCODE}]]*/'';
	        var NONE = /*[[${NONE}]]*/'';
        </script>
		<script data-th-src="@{/js/invest/riskredis/quota/common/RskQuotaCommon.js}" type="text/javascript"></script>
		<script
			data-th-src="@{/js/invest/riskredis/quota/rskportautorelatepoint/RskPortAutoRelatePoint003.js}"
			type="text/javascript"></script>

	</div>
</body>
</html>
