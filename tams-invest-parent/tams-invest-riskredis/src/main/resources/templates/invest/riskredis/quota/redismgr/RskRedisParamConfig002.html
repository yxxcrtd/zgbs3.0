<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{RskRedisParamConfig002}">REDIS功能参数配置</title>
</head>
<body>
<div layout:fragment="content" >
        <form class="layui-form joyin-form-wrap"
              id="submitForm">
            <div class="layui-form-item" style="height: 120px">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{RskRedisParamConfig001.commonBusinessType}">共通业务类型</label>
                    <div class="layui-input-inline input-inline">
                        <select id="commonBusinessType" name="commonBusinessType"
                                th:initValue="*{entity?.commonBusinessType}"
                                class="layui-input form-input input-select"
                                placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${COMMON_BUSINESS_TYPE}">
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{RskRedisParamConfig001.paraCode}">资产名称</label>
                    <div class="layui-input-inline input-inline">
                        <select  id="paraCode" name="paraCode"
                                th:initValue="*{entity?.paraCode}"
                                class="layui-input form-input input-select"
                                placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${INDICATOR_PARAM}">
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{RskRedisParamConfig001.redisModel}">redis模块</label>
                    <div class="layui-input-inline input-inline">
                        <select id="redisModel" name="redisModel"
                                th:initValue="*{entity?.redisModel}"
                                class="layui-input form-input input-select"
                                placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${REDIS_MODEL}">
                        </select>
                    </div>
                </div>
            </div>
        </form>
    <div class="layui-col-md12" style="margin-top: 20px;">
        <div class="text-center">
            <a id="RskRedisParamConfig002_btn_save"
               class="layui-btn layui-btn-sm btn-save"
               data-th-text="#{SysCommon.save}">保存</a> <a
                id="RskRedisParamConfig002_btn_submit"
                class="layui-btn layui-btn-sm btn-submit"
                data-th-text="#{SysCommon.submit}">提交</a> <a
                id="RskRedisParamConfig002_btn_cancel"
                class="layui-btn layui-btn-sm btn-cancel"
                data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
    </script>
    <script data-th-src="@{/js/invest/riskredis/quota/redismgr/RedisView002.js}"
            type="text/javascript"></script>
</div>
</body>

</html>
