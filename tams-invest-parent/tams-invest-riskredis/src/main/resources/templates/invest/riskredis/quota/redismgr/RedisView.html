<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
	<title data-th-text="#{RedisItemVal}">Redis存储的单项目信息</title>
</head>
<body>
<div layout:fragment="content">
	<div class="layui-tab layui-tab-brief" lay-filter="docDemoTabBrief1">
		<ul class="layui-tab-title">
			<li class="layui-this">Redis功能模块查询</li>
			<li>功能模块影响参数设置</li>
		</ul>
		<div class="layui-tab-content" style="height: 100px;">
			<div class="layui-tab-item layui-show">
				<div class='layui-fluid'>
					<div class="form-button-area"  export="false">
						<a id="RedisView_btn_refresh"
						   class="layui-btn layui-btn-sm btn-search">刷新</a>
					</div>
					<div class='joyin-form-wrap joyin-filter-form condition-area searchForm'>
						<form class="layui-form" id="searchForm">
							<div class="layui-form-item">
								<div
										class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
									<label class="layui-form-label form-lable"
										   data-th-text="#{RedisView.model}">模块</label>
									<div class="layui-input-inline input-inline">
										<select type="text" name="model" id="model"
												class="layui-input form-input input-select"
												allowClear=false
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-result="${REDIS_MODEL}" required>
										</select>
									</div>
								</div>
								<div id="div_key"
									 class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
									<label class="layui-form-label form-lable"
										   data-th-text="#{RedisView.key}">KEY</label>
									<div class="layui-input-inline input-inline">
										<select type="text" name="rdsKey" id="rdsKey"
												class="layui-input form-input input-select" allowClear="true"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												formatoption=true multiple=false
												data-th-data-url="@{/invest/riskredis/quota/redismgr/RedisView/queryItemInfo}" required>
										</select>
									</div>
								</div>
								<div id="div_field"
									 class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
									<label class="layui-form-label form-lable"
										   data-th-text="#{RedisView.field}">FILED</label>
									<div class="layui-input-inline input-inline">
										<input type="text" name="rdsField" id="rdsField"  class="layui-input form-input" placeholder="请输入内容"
											   data-th-placeholder="#{SysCommon.placeholder}" maxLength="128"
											   data-th-value="${entity?.rdsField}" />
									</div>
								</div>
								<div class="form-inline-wrap" id="isUpParamValDiv" style="display: none">
									<label class="layui-form-label form-label-wrap"
										   style="width: 46% !important">是否更新参数值</label>
									<div class="layui-input-inline input-inline" style="width:20%!important;">
										<div class="element">
											<ul class="manage-info-item" >
												<li>
													<div>
														<input type="checkbox" id="isUpParamVal"
															   th:checked="false"
															   class='layui-input form-input input-checkbox'
															   name="isUpParamVal"
															   data-th-lay-filter="isUpParamVal"
														/>
													</div>
												</li>
											</ul>
										</div>
									</div>
								</div>
							</div>
						</form>
					</div>
					<div>
						<table class="layui-table" id="dataTable"></table>
					</div>
				</div>
			</div>
			<div class="layui-tab-item">
				<div class='layui-fluid'>
					<div class="layui-col-md12 form-button-area" export="false">
						<a id="RedisView001_btn_add" class="layui-btn layui-btn-sm btn-create"
						   data-th-text="#{SysCommon.create}">新建</a>
						<a id="RedisView001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
                        data-th-text="#{SysCommon.delete}">删除</a>
					</div>
					<div class="joyin-form-wrap joyin-filter-form condition-area searchParamForm">
						<form class="layui-form" id="searchParamForm">
							<div class="layui-form-item">
								<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
									<label class="layui-form-label form-lable"
										   data-th-text="#{RskRedisParamConfig001.commonBusinessType}">共通业务类型</label>
									<div class="layui-input-inline input-inline">
										<select type="text" name="commonBusinessType" id="commonBusinessType"
												class="layui-input form-input input-select" multiple="true"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-result="${COMMON_BUSINESS_TYPE}" >
										</select>
									</div>
								</div>
								<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{RskRedisParamConfig001.paraName}">参数名称</label>
									<div class="layui-input-inline input-inline">
										<input type="text" class="layui-input form-input" id="paraCode"name="paraCode"  maxlength="600" />
									</div>
								</div>
							</div>
						</form>
					</div>
					<div>
						<table class="layui-table" id="dataParamTable"></table>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
<div layout:fragment="script">
	<style>
		.manage-info-item li {
			float: left;
			padding-right: 15px;
			line-height: 24px;
			margin-bottom:3px;
		}

		.manage-info-item {
			float: left;
			padding-right: 10px;
			height: 24px!important;
		}

		.manage-info-item .layui-form-checkbox {
			margin-right: 2px;
			margin-top: -2px;
			padding-right: 0;
			line-height: 15px;
			width: 15px;
			height: 15px;
		}

		.manage-info-item .layui-form-checkbox i {
			line-height: 15px;
			width: 15px;
			height: 15px;
			border-left: 1px solid #d2d2d2;
			font-size: 15px;
		}

		.manage-info-item .layui-form-checked i, .manage-info-item .layui-form-checked:hover i{
			border-color: #2693ff;
			color: #2693ff;
		}
	</style>
	<script data-th-inline="javascript" type="text/javascript">
		var REDIS_MODEL = /*[[${REDIS_MODEL}]]*/[];
		var REDIS_MODEL_PARAMVAL = /*[[${REDIS_MODEL_PARAMVAL}]]*/'';
		var REDIS_MODEL_EVENT = /*[[${REDIS_MODEL_EVENT}]]*/'';
		var REDIS_MODEL_PARAM_CONFIG = /*[[${REDIS_MODEL_PARAM_CONFIG}]]*/'';

		// add by etliu 20210925 start
		var localNeedWorkflow = /*[[${localNeedWorkflow}]]*/'01';
		if (localNeedWorkflow) {
			needWorkflow = localNeedWorkflow;
		}
		// add by etliu 20210925 end
	</script>
	<script
			data-th-src="@{/js/invest/riskredis/quota/redismgr/RedisView.js}"
			type="text/javascript"></script>
</div>
</body>
</html>
