<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorator="~{layout/default}">
<div class="pro-module-wrap" id="RskSupervisionIndicator004Div">
	<script data-th-inline="javascript" type="text/javascript">
		var getAllRelationUrl = /*[[@{/invest/riskredis/quota/superviseindicator/RskSupervisionIndicator002/getAllPortfolioBySort}]]*/'';
		var getPortfolioBagUrl = /*[[@{/invest/riskredis/quota/superviseindicator/RskSupervisionIndicator002/getAllPortfolioBag}]]*/'';
	</script>
	<div class="pro-module">
		<div class="pro-module-item" style="margin-left: 70px">
			<div class="layui-form-item">
				<label class="layui-form-label form-label-wrap"
					data-th-text="#{RskSupervisionIndicator002.indName}"
					style="width: 13% !important">指标名称</label>
				<div class="layui-input-inline input-inline">
					<input type="text" th:id="|${pageId}_indNameThree|"
						class="layui-input form-input" placeholder="请输入内容"
						data-th-placeholder="#{SysCommon.placeholder}"
						data-th-value='${entity?.rskSupervisionIndicatorDto?.indName}'
						disabled="disabled">
				</div>
			</div>
			<div class="layui-form-item">
				<div class="form-inline-wrap" style="width:30%">
					<label class="layui-form-label form-label-wrap"
						   data-th-text="#{RskSupervisionIndicator002.endDate}"
						   style="width: 30% !important">有效区间</label>
					<div class="layui-input-inline input-inline"
						 style="width: 70% !important">
						<input style="float: left; margin-right: 5px" type="text"
							id="startDate" name="rskPortfolioIndicatorDto.startDate"
							data-th-value='${#dates.format(entity?.rskPortfolioIndicatorDto?.startDate,"yyyy-MM-dd")}'
							class="layui-input form-input input-dateSelect" required = "required"/>
					</div>
				</div>
				<div class="form-inline-wrap" style="width: 45%">
					<label class="layui-form-label form-label-wrap"
						data-th-text="#{RskSupervisionIndicator002.endDate}"
						style="width: 14% !important">有效区间</label>
					<div class="layui-input-inline input-inline"
						style="width: 48% !important">
						<input style="float: left;" type="text" id="endDate"
							name="rskPortfolioIndicatorDto.endDate"
							data-th-value='${#dates.format(entity?.rskPortfolioIndicatorDto?.endDate,"yyyy-MM-dd")}'
							class="layui-input form-input input-dateSelect" />
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="form-inline-wrap" style="width: 45%">
					<label class="layui-form-label form-label-wrap"
						data-th-text="#{RskSupervisionIndicator002.portfoliolevel}"
						style="width: 29% !important">组合层次</label>
					<div class="layui-input-inline input-inline">
						<div class="element">
							<ul class="manage-info-item">
								<li style="padding-right: 1px"
									data-th-each="key,list : ${mapZhcc}">
									<div data-th-each="option : ${list.current.value}">
										<input type="radio"
											th:checked="${#strings.contains(#strings.isEmpty(entity?.rskPortfolioIndicatorDto?.portfolioLevel) ?'' : entity?.rskPortfolioIndicatorDto?.portfolioLevel, option?.id)}"
											name="rskPortfolioIndicatorDto.portfolioLevel"
											data-th-lay-filter="portfolioLevel"
											data-th-value="${option?.id}" th:title="${option.text}" />
									</div>
								</li>
							</ul>
						</div>
						<!-- 	<input type="radio" name="portfolioLevel" value="01" title="单组合"
							lay-filter="01"
							th:checked="${entity?.portfolioLevel=='01'||entity?.supType==null||entity?.portfolioLevel==''} ? 'checked' : 'false'">
						<input type="radio" name="portfolioLevel" value="02" title="组合包"
							lay-filter="02"
							th:checked="${entity?.portfolioLevel=='02'} ? 'checked' : 'false'"> -->
					</div>
				</div>
			</div>
			<div class="layui-form-item" id="singlePortfolioDiv">
				<label class="layui-form-label form-label-wrap" style="width: 13%;line-height: 40px!important;"
					data-th-text="#{RskSupervisionIndicator002.sortType}">分类维度</label>
				<div style="float: left; width: 57%">
					<div class="pro-module-title"
						style="border-bottom: 0px; overflow: hidden">
						<div style="width: 80% !important; float: left">
							<select id="sortType" name="sortType"
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-initValue="'01'"
								data-th-data-result='${CLASSIFY_DIMENSION}' allowClear="false">
							</select>
						</div>

						<div
							style="width: 18%; margin-left: 5px; float: left; text-align: center">
							<a
								style="width: 80px; height: 30px; font-weight: bold; line-height: 30px; font-size: 14px; cursor: pointer"
								id="selectorAtag">筛选</a>
							<div id="selectorConditionFilter"
								style="display: none; border: 1px solid #ccc; position: absolute; background: #fff; z-index: 1;width: 290px;">
								<div class="sgePortDiv">
									<label class="layui-form-label form-label-wrap"
										style="width: 17%; padding-right: 0px" data-th-text="组合名称">组合名称</label>
									<div class="layui-input-inline input-inline"
										style="width: 80px !important">
										<input type="text" id="portfolioSingleName"
											name="portfolioSingleName" class="layui-input form-input"
											placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}">
									</div>
									<label class="layui-form-label form-label-wrap"
										style="width: 17%; padding-right: 0px" data-th-text="收益类型">收益类型</label>
									<div class="layui-input-inline input-inline sgePort14sub" style="width:80px!important">
										<select id="profitType" name="profitType"
											class="layui-input form-input input-select"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-data-result='${PROFIT_TYPE}'></select>
									</div>
								</div>
								<div class="sgePortDiv">
									<label class="layui-form-label form-label-wrap"
										style="width: 50px; padding-right: 0px" data-th-text="开放类型">开放类型</label>
									<div class="layui-input-inline input-inline sgePort14sub" style="width:80px!important">
										<select id="issueMode" name="issueMode"
											class="layui-input form-input input-select"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-data-result='${ISSUE_MODE}'></select>
									</div>
									<label class="layui-form-label form-label-wrap"
										style="width: 50px; padding-right: 0px" data-th-text="募集方式">募集方式</label>
									<div class="layui-input-inline input-inline sgePort14sub" style="width:80px!important">
										<select id="raiseType" name="raiseType"
											class="layui-input form-input input-select"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-data-result='${RAISE_TYPE}'></select>
									</div>
								</div>
								<div class="sgePortDiv">
									<label class="layui-form-label form-label-wrap"
										style="width: 17%; padding-right: 0px" data-th-text="投资性质">投资性质</label>
									<div class="layui-input-inline input-inline"
										style="width: 80px !important"><!-- 13.7% -->
										<select id="investType" name="investType"
											class="layui-input form-input input-select"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-data-result='${INVEST_TYPE}'></select>
									</div>
								</div>
								<div class="sgePortDiv" style="margin-bottom: 10px">
									<a id="RskSupervisionIndicator004_btn_query"
										style="margin-left: 9px" class="layui-btn layui-btn-sm"
										data-th-text="#{SysCommon.search}">查询</a> <a
										id="RskSupervisionIndicator004_btn_close"
										style="margin-left: 9px" class="layui-btn layui-btn-sm"
										data-th-text="关闭">关闭</a>
								</div>
							</div>
						</div>
					</div>
					<!-- 		<div class="" id="singleTree">
						<div class="layui-input"
							style="border: 1px solid #dbdbdb; scroll-y: auto; scroll-x: hidden; height: 250px; overflow-y: scroll; margin-left: 60px; margin-right: 50px;"
							id="treeDataSingle"
							data-th-url='|@{/invest/riskredis/quota/superviseindicator/RskSupervisionIndicator002/getAllPortfolioBySort?type=01}'>
						</div>
					</div> -->
				</div>

			</div>
			<div class="layui-form-item" style="display: none"
				id="portfolioBagNameDiv">
				<label class="layui-form-label form-label-wrap" style="width: 13%"
					data-th-text="#{RskSupervisionIndicator002.portfBag}">组合包名称</label>
				<div class="layui-input-inline input-inline">
					<input type="text" id="portfolioBagName" name="portfolioBagName"
						class="layui-input form-input input-fuzzy-text"
						placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
				</div>
			</div>
			<div class="layui-form-item">
				<div class="" id="singleTree"
					style="margin-right: 232px;margin-left: 81px; height: 350px">
					<div class="layui-input"
						style="border: 1px solid #dbdbdb; scroll-y: auto; scroll-x: hidden; height: 270px; overflow-y: scroll; margin-right: 50px;"
						id="treeDataSingle"
						data-th-url='|@{/invest/riskredis/quota/superviseindicator/RskSupervisionIndicator002/getAllPortfolioBySort?type=01}'>
					</div>
				</div>
				<!-- <div class="layui-input-block input-inline rsk-tree"
					style="margin-left: 14.2%;" id="singleTree"></div> -->
			</div>
		</div>
	</div>
</div>
</html>
