<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap" id="submitForm">
			<input
				type="hidden" id="prtBagId" name="prtBagId"
				data-th-value="${entity?.prtBagId} ?:${prtBagId}"> <input
				type="hidden" id="indId" name="indId"
				data-th-value="${entity?.indId} ?:${indId} "> <input
				type="hidden" id="delId" name="delId"
				data-th-value="${entity?.delId}">
			<div class="pro-module">
				<div class="pro-module-item">
					<div class="layui-form-item">
						<div class="form-inline-wrap" style="width: 50%">
							<label class="layui-form-label form-lable"
								data-th-text="#{RskSupervisionIndividuation005.finprodId}">资产代码</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="finprodId" name="finprodId"
									class="layui-input form-input input-select"
									data-th-initvalue='${entity?.finprodId}' parentIds="prtBagId,indId"
									data-th-data-url="@{/invest/riskredis/quota/supervisionindividuation/RskSupervisionIndividuation001/queryFinprodIdList}"
									placeholder="请输入内容" required>
								</select>
							</div>
						</div>
						<div class="form-inline-wrap" style="width: 50%">
							<label class="layui-form-label form-lable"
								data-th-text="#{RskSupervisionIndividuation005.finprodName}">资产名称</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="finprodName" name="finprodName"
									class="layui-input form-input" disabled="disabled"
									data-th-value='${entity?.finprodName}' placeholder="请输入内容"
									required>
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="form-inline-wrap" style="width: 50%">
							<label class="layui-form-label form-lable"
								data-th-text="#{RskSupervisionIndividuation005.startDate}">开始日期</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="startDate" name="startDate"
									class="layui-input form-input input-dateSelect"
									data-th-value='${#dates.format(entity?.startDate,"yyyy-MM-dd")}'
									placeholder="请输入内容" required>
							</div>
						</div>
						<div class="form-inline-wrap" style="width: 50%">
							<label class="layui-form-label form-lable"
								data-th-text="#{RskSupervisionIndividuation005.endDate}">结束日期</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="endDate" name="endDate"
									class="layui-input form-input input-dateSelect"
									data-th-value='${#dates.format(entity?.endDate,"yyyy-MM-dd")}'
									placeholder="请输入内容" required>
							</div>
						</div>
					</div>


				</div>
			</div>
		</form>
		<div class="layui-form-item" align="center">
			<a id="RskSupervisionIndividuation005_btn_save"
				class="layui-btn layui-btn-sm btn-save"
				data-th-text="#{SysCommon.save}">保存</a> <a
				id="RskSupervisionIndividuation005_btn_cancel"
				class="layui-btn layui-btn-sm btn-cancel"
				data-th-text="#{SysCommon.cancel}">取消</a>
		</div>
	</div>
	<div layout:fragment="script">
		<style type="text/css">
.layui-form-radio {
	line-height: 14px !important
}

.layui-form-radio>i {
	font-size: 16px !important
}

.layui-chcekbox {
	margin-right: 14px !important
}

.manage-info-item li {
	float: left;
	padding-right: 15px;
	line-height: 24px;
	margin-bottom: 3px;
}

.manage-info-item {
	float: left;
	padding-right: 10px;
}

.manage-info-item .layui-form-checkbox {
	margin-right: 2px;
	margin-top: -2px;
	padding-right: 0;
	line-height: 15px;
	width: 15px;
	height: 15px;
}

.manage-info-item .layui-form-checkbox i {
	line-height: 15px;
	width: 15px;
	height: 15px;
	border-left: 1px solid #d2d2d2;
	font-size: 15px;
}

.manage-info-item .layui-form-checked i, .manage-info-item .layui-form-checked:hover i
	{
	border-color: #2693ff;
	color: #2693ff;
}

.manage-info-item .layui-form-radio {
	margin-top: 0px
}
</style>

		<script
			data-th-src="@{/js/invest/riskredis/quota/supervisionindividuation/RskSupervisionIndividuation005.js}"></script>
	</div>
</body>
</html>
