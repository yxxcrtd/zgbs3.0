<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{RedisViewParam}">REDIS参数值修改</title>
</head>
<body>
<div layout:fragment="content" >
        <form class="layui-form joyin-form-wrap"
              id="submitForm">
            <div class="layui-form-item" >
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{RedisViewParam.key}">参数代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" name="key" disabled="disabled" data-th-placeholder="#{SysCommon.placeholder}" id="key"
                               data-th-value='${key}'  class="layui-input form-input input-text" />
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{RedisViewParam.field}">REDIS识别域</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" name="field" disabled="disabled" data-th-placeholder="#{SysCommon.placeholder}" id="field"
                               data-th-value='${field}' class="layui-input form-input input-text" />
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{RedisViewParam.oldValue}">原值</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="oldValue" name="oldValue" disabled="disabled" data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-value='${oldValue}'  class="layui-input form-input input-text" />
                    </div>
                </div>
            </div>
            <div class="layui-form-item" >
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{RedisViewParam.supConnector}">操作符</label>
                    <div class="layui-input-inline input-inline">
                        <select  id="supConnector" name="supConnector" formatoption="false"
                                 class="layui-input form-input input-select"
                                 data-th-placeholder="#{SysCommon.placeholder}">
                            <OPTION value="+">+</OPTION>
                            <OPTION value="-">-</OPTION>
                            <OPTION value="*">*</OPTION>
                            <OPTION value="/">/</OPTION>
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{RedisViewParam.changeValue}">变化值</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="changeValue" name="changeValue" data-th-placeholder="#{SysCommon.placeholder}"
                                 class="layui-input form-input input-text" />
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{RedisViewParam.value}">现值</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" name="value"  data-th-placeholder="#{SysCommon.placeholder}" id="value"
                               class="layui-input form-input input-text" />
                    </div>
                </div>
            </div>
        </form>
    <div class="layui-col-md12" style="margin-top: 20px;">
        <div class="text-center">
          <a id="RedisViewParam_btn_submit"
                class="layui-btn layui-btn-sm btn-submit"
                data-th-text="#{SysCommon.submit}">提交</a> <a
                id="RedisViewParam_btn_cancel"
                class="layui-btn layui-btn-sm btn-cancel"
                data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
    </script>
    <script data-th-src="@{/js/invest/riskredis/quota/redismgr/RedisViewParam.js}"
            type="text/javascript"></script>
</div>
</body>

</html>
