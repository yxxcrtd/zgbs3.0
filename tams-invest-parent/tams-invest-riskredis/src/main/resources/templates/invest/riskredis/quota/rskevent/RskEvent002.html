<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RskEvent002}">风险事项新建</title>
</head>
<body>
	<div layout:fragment="content">
		<div class="pro-module-wrapper pro-module-base" title="风险事项新建">
			<div class="pro-module-wrap">
				<div class="pro-module">
					<h3 class="pro-module-title">
						<span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i
							class="iconfont icon-arrow-down pro-down-icon"></i>
					</h3>
					<form class="layui-form joyin-form-wrap" id="submitForm">
						<!-- 隐藏字段 工作流代码 -->
						<input type="text" name="workflowId" data-th-value='${workflowId}'
							hidden /> <!-- <input type="text" id="eventCode" name="eventCode"
							data-th-value='${entity?.eventCode}' hidden /> -->
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{RskEvent002.eventCode}">事项代码</label>
									<div class="layui-input-inline input-inline">
										<input type="text" name="eventCode" id="eventCode"
											class="layui-input form-input" maxlength=32
											data-th-value='${entity?.eventCode}' placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}" />
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{RskEvent002.eventName}">事项名称</label>
									<div class="layui-input-inline input-inline">
										<input type="text" name="eventName" id="eventName"
											class="layui-input form-input" maxlength=32
											data-th-value='${entity?.eventName}' placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}" required />
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{RskEvent002.isCalcIndicator}"
										style="width: 30% !important">是否计算指标</label>
									<div class="layui-input-inline input-inline">
										<div class="element">
											<ul class="manage-info-item">
												<li>
													<div>
														<input type="checkbox" id="isCalcIndicator"
															th:checked="${entity?.isCalcIndicator}=='Y'?true:false"
															class='layui-input form-input input-checkbox'
															name="isCalcIndicator"
															data-th-lay-filter="RskEvent002_isCalcIndicator" />
													</div>
												</li>
											</ul>
										</div>
									</div>
								</div>
							</div>
						</div>
					</form>
				</div>
			</div>
			<div class="pro-module-wrap" id="TargetItemConf002_characterItem">
				<div class="pro-module" id="groupTable">
					<h3 class="pro-module-title">
						<span class="title-des">特征值</span>
							<i id="btn-tzz-add"
									class="iconfont icon-found" title="添加特征值组"
									style="color: #5cb85c; font-weight: bold;cursor: pointer;"></i>
					</h3>
					<div id="table_character_item" class="pro-module-item">
						<table class="layui-table" id="dataTable_character_item" name="dataTable_character_item"></table>
					</div>
				</div>

			</div>
			<div class="pro-module-wrap">
				<div class="pro-module">
					<h3 class="pro-module-title">
						<span class="title-des">备注</span><i
							class="iconfont icon-arrow-down pro-down-icon"></i>
					</h3>
					<div class="layui-form-item pro-module-item">
						<div class="form-inline-wrap" style="width: 100%;">
							<div class="layui-input-inline input-inline"
								style="width: 100% !important;">
								<textarea id="remark" name="remark" th:value="${entity?.remark}"
									data-th-text="${entity?.remark}" class="layui-textarea"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}" maxlength="1000"></textarea>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="text-center" id="RskEvent002_btn">
				<a id="RskEvent002_btn_save" class="layui-btn layui-btn-sm btn-save"
					data-th-text="#{SysCommon.save}">保存</a> <a
					id="RskEvent002_btn_submit"
					class="layui-btn layui-btn-sm btn-submit"
					data-th-text="#{SysCommon.submit}">提交</a> <a
					id="RskEvent002_btn_cancel"
					class="layui-btn layui-btn-sm btn-cancel"
					data-th-text="#{SysCommon.cancel}">取消</a>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
				<style type="text/css">
.btn-detail-del {
			margin-left: 47%;
		}
		
		.btn-detail-del i {
			margin-left: 6px;
		}
.layui-form-radio {
	line-height: 14px !important
}

.layui-form-radio>i {
	font-size: 16px !important
}

.layui-chcekbox {
	margin-right: 14px !important
}

.manage-info-item li {
	float: left;
	padding-right: 15px;
	line-height: 24px;
	margin-bottom: 3px;
}

.manage-info-item {
	float: left;
	padding-right: 10px;
}

.manage-info-item .layui-form-checkbox {
	margin-right: 2px;
	margin-top: -2px;
	padding-right: 0;
	line-height: 15px;
	width: 15px;
	height: 15px;
}

.manage-info-item .layui-form-checkbox i {
	line-height: 15px;
	width: 15px;
	height: 15px;
	border-left: 1px solid #d2d2d2;
	font-size: 15px;
}

.manage-info-item .layui-form-checked i, .manage-info-item .layui-form-checked:hover i
	{
	border-color: #2693ff;
	color: #2693ff;
}

.manage-info-item .layui-form-radio {
	margin-top: 0px
}
</style>
		<script data-th-inline="javascript" type="text/javascript">
    	    var RISK_EVENT_CHARA_TYPE = /*[[${RISK_EVENT_CHARA_TYPE}]]*/'[]'; // 风险特征值类型
    	    var SUP_OPERATOR = /*[[${SUP_OPERATOR}]]*/'[]'; // 特征值匹配方式
    	    var SUP_CONNECTOR = /*[[${SUP_CONNECTOR}]]*/'[]'; // 特征值偏移方向
    	    var RISK_EVENT_CHARA_OFFSET_UNIT = /*[[${RISK_EVENT_CHARA_OFFSET_UNIT}]]*/'[]'; // 特征值偏移单位
    	    var entity=/*[[${entity}]]*/'';
        </script>
		<script data-th-src="@{/js/invest/riskredis/quota/rskevent/RskEvent002.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
