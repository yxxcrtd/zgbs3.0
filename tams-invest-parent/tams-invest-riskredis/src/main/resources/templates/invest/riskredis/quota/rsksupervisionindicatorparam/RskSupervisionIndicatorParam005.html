<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorator="~{layout/default}">
<head>
<title data-th-text="#{RskSupervisionIndicatorParam005}">自定义参数</title>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap" id="submitForm">
			<div class="pro-module-wrapper pro-module-base">
				<div class="pro-module-wrap">
					<div class="pro-module">
						<div class="pro-module-item" style="padding-bottom: 0px;">
							<input type="text" id="workflowId"
								data-th-value="${entity?.workflowId}" style="display: none;" />
							<input type="text" id="paraCode"
								data-th-value="${entity?.paraCode}" style="display: none;" /> <input
								type="text" id="paraDisplayType"
								data-th-value="${entity?.paraDisplayType}"
								style="display: none;" /> <input type="text" id="redisField"
								name="redisField" data-th-value="${entity?.redisField}"
								style="display: none;" /> <input type="text" id="content"
								name="content" data-th-value="${entity?.content}"
								style="display: none;" /><input type="text" id="modelCode"
								name="modelCode" data-th-value="${entity?.modelCode}"
								style="display: none;" /><input type="text" id="modelValue"
								name="modelValue" data-th-value="${entity?.modelValue}"
								style="display: none;" />
							<div class="layui-form-item" style="margin-bottom: 6px;">
								<div
									class="layui-inline layui-col-md6 layui-col-sm6 layui-col-lg6">
									<label class="layui-form-label form-lable" style="width: 22%;"
										data-th-text="#{RskSupervisionIndicatorParam005.paraName}">参数名称</label>
									<div class="layui-input-inline input-inline">
										<input type="text" class="layui-input form-input"
											id="paraName" name="paraName"
											data-th-value="${entity?.paraName}"
											data-th-placeholder="#{SysCommon.placeholder}"
											required="required" maxlength="60" />
									</div>
								</div>
								<div
									class="layui-inline layui-col-md6 layui-col-sm6 layui-col-lg6">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{RskSupervisionIndicatorParam005.paraCode}">参数代码</label>
									<div class="layui-input-inline input-inline">
										<input type="text" class="layui-input form-input"
											id="paraCode" name="paraCode" disabled
											data-th-value="${entity?.paraCode}" placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}" />
									</div>
								</div>
							</div>
							<div style="border: 1px solid #ccc; /*min-height: 422px;*/ overflow:auto">
								<div
									style="width: 35%;height:422px; line-height:50px; float: left; overflow: auto;  background: #f1f1f1;  padding-top: 0px; border-right: 1px solid #ccc;">
									<div class="layui-form-item">
										<div class=" layui-col-md10 layui-col-sm10 layui-col-lg10">
											<div>
												<span
													style="margin-left: 80px; color: red; font-size: 12px !important;">参数模板</span>
											</div>
										</div>
									</div>
									<div class="layui-form-item" style="padding-top: 0px;line-height:50px">
										<div class=" layui-col-md10 layui-col-sm10 layui-col-lg10">
											<div style="cursor:pointer;">
												<span style="margin-left: 80px; font-size: 12px !important;"
													ondblclick="changeContent(this)">前N日净资产市值</span>
											</div>
										</div>
									</div>
									<div class="layui-form-item" style="padding-top: 0px;line-height:50px">
										<div class=" layui-col-md10 layui-col-sm10 layui-col-lg10">
											<div style="cursor:pointer;" class="modelCss" onselectstart="return false">
												<span style="margin-left: 80px; font-size: 12px !important;"
													ondblclick="changeContent(this)">前N日净资产成本</span>
											</div>
										</div>
									</div>
									<div class="layui-form-item" style="padding-top: 0px;line-height:50px">
										<div class=" layui-col-md10 layui-col-sm10 layui-col-lg10">
											<div style="cursor:pointer;" class="modelCss" onselectstart="return false">
												<span style="margin-left: 80px; font-size: 12px !important;"
													ondblclick="changeContent(this)">复合模板</span>
											</div>
										</div>
									</div>
									<div class="layui-form-item"
										style="padding-top: 0px; margin-top: 130px;">
										<div class=" layui-col-md10 layui-col-sm10 layui-col-lg10">
											<div>
												<span
													style="margin-left: 80px; color: red; font-size: 12px !important; padding-bottom: 5px; display: block;">友情提示:双击选中模板调整参数</span>
											</div>
										</div>
									</div>
								</div>
								<div style="width: 64%; float: left;">
									<!-- 复合模板 -->
									<div id="fhmbDiv">
										<div class="layui-form-item">
											<div
												class="layui-inline layui-col-md12 layui-col-sm12 layui-col-lg12" style="margin:15px">
												<label class="layui-form-label form-label-wrap"
													style="width: 14% !important"
													data-th-text="#{RskSupervisionIndicatorParam005.assetType}">资产类型</label>
												<div class="layui-input-inline" style="width: 41%">
													<select type="text"
														class="layui-input form-input input-select" id="assetType"
														name="assetType" data-th-data-result='${ASSET_TYPE_SORT}'
														data-th-initvalue="${entity?.assetType}"
														required="required"
														data-th-placeholder="#{SysCommon.placeholder}"></select>
												</div>
												<div class="layui-input-inline" style="width: 41.5%">
													<div id="assetDetailType" multiple="true" searchable="true"
														data-th-data-url="@{/invest/riskredis/quota/rsksupervisionindicatorparam/RskSupervisionIndicatorParam005/getAssetTreeNode}"
														 name="assetDetailType" class="input-selectTree"
														placeholder="请选择" parentIds="assetType"></div>
												</div>
											</div>
										</div>
										<div class="layui-form-item">
											<div
												class="layui-inline layui-col-md12 layui-col-sm12 layui-col-lg12" style="margin:15px">
												<label class="layui-form-label form-label-wrap"
													style="width: 14% !important"
													data-th-text="#{RskSupervisionIndicatorParam005.category}">所属行业</label>
												<div class="layui-input-inline" style="width: 41%">
													<select class="layui-input form-input input-select"
														id="category" name="category"
														data-th-data-result='${INDUSTRY_TYPE}'
														data-th-initvalue="${entity?.category}"
														data-th-placeholder="#{SysCommon.placeholder}"></select>
												</div>
												<div class="layui-input-inline" style="width: 41.5%">
													<div id="industry" multiple="true" searchable="true"
														data-th-data-url="@{/invest/riskredis/quota/rsksupervisionindicatorparam/RskSupervisionIndicatorParam005/getIndustryTreeNode}"
														 name="treeSelectInput" class="input-selectTree"
														placeholder="请选择" parentIds="category"></div>
												</div>
											</div>
										</div>
										<div class="layui-form-item">
											<div
												class="layui-inline layui-col-md12 layui-col-sm12 layui-col-lg12" style="margin:15px">
												<label class="layui-form-label form-label-wrap"
													style="width: 14% !important"
													data-th-text="#{RskSupervisionIndicatorParam005.subRate}">主体评级</label>
												<div class="layui-input-inline" style="width: 41%">
													<select type="text"
														class="layui-input form-input input-select"
														id="subRateType" name="subRateType"
														data-th-data-result='${GRADE_TYPE}'
														data-th-initvalue="${entity?.subRateType}"
														childrenIds="subRateType2"
														data-th-placeholder="#{SysCommon.placeholder}"></select>
												</div>
												<div class="layui-input-inline" style="width: 41.5%">
													<select type="text"
														class="layui-input form-input input-select"
														id="subRateType2" name="subRateType2"
														formatoption="false"
														parentIds="subRateType" multiple="multiple"
														data-th-initvalue="${entity?.subRateType2}"
														data-th-data-result="${BODY_GRADE}"
														data-th-placeholder="#{SysCommon.placeholder}"></select>
												</div>
											</div>
										</div>
										<div class="layui-form-item">
											<div
												class="layui-inline layui-col-md12 layui-col-sm12 layui-col-lg12" style="margin:15px">
												<label class="layui-form-label form-label-wrap"
													style="width: 14% !important"
													data-th-text="#{RskSupervisionIndicatorParam005.debRate}">债项评级</label>
												<div class="layui-input-inline" style="width: 41%">
													<select class="layui-input form-input input-select"
														id="debRateType" name="debRateType"
														data-th-data-result='${GRADE_TYPE}'
														data-th-initvalue="${entity?.debRateType}"
														childrenIds="debRateType2"
														data-th-placeholder="#{SysCommon.placeholder}"></select>
												</div>
												<div class="layui-input-inline" style="width: 41.5%">
													<select class="layui-input form-input input-select"
														multiple="multiple" id="debRateType2" name="debRateType2"
														parentIds="debRateType"
														formatoption="false"
														data-th-initvalue="${entity?.debRateType2}"
														data-th-data-result="${BODY_GRADE}"
														data-th-placeholder="#{SysCommon.placeholder}"></select>
												</div>
											</div>
										</div>
										<div class="layui-form-item" style="margin-bottom: 5px;">
											<div
												class="layui-inline layui-col-md12 layui-col-sm12 layui-col-lg12" style="margin:15px">
												<label class="layui-form-label form-label-wrap"
													style="width: 14% !important"
													data-th-text="#{RskSupervisionIndicatorParam005.nDayExpire}">N日内到期</label>
												<div class="layui-input-inline" style="width: 27.1%">
													<select class="layui-input form-input input-select"
														id="dateRange" name="dateRange"
														data-th-initvalue="${entity?.dateRange}"
														data-th-data-result='${DATE_RANGE}'
														data-th-placeholder="#{SysCommon.placeholder}"></select>
												</div>
												<div class="layui-input-inline" style="width: 27.1%">
													<select class="layui-input form-input input-select"
															id="dateType" name="dateType" disabled
															data-th-data-result='${DATE_RISK_TYPE}'
															data-th-initvalue="${entity?.dateType}"
															data-th-placeholder="#{SysCommon.placeholder}"></select>
												</div>
												<div class="layui-input-inline" style="width: 26.1%">
													<input type="number" class="layui-input form-input"
														id="definDate" name="definDate" disabled
														data-th-value="${entity?.definDate}" min="1"
														data-th-placeholder="#{SysCommon.placeholder}">
												</div>
											</div>
										</div>
										<div class="layui-form-item"
											style="border-top: 1px solid #ccc;" >
											<div
												class="layui-inline layui-col-md12 layui-col-sm12 layui-col-lg12" style="margin:15px">
												<label class="layui-form-label form-label-wrap"
													style="width: 14% !important"
													data-th-text="#{RskSupervisionIndicatorParam005.value}">取值</label>
												<div class="layui-input-inline" style="width: 41%">
													<select class="layui-input form-input input-select"
														id="value" name="value"
														data-th-data-result='${CPL_MODEL_VAL_TYPE}'
														data-th-initvalue="${entity?.value}" required="required"
														data-th-placeholder="#{SysCommon.placeholder}"></select>
												</div>
											</div>
										</div>
									</div>
									<!-- 前N日净值资产市值或前N日净值资产成本 -->
									<div id="jzzcDiv" style="display: none;">
										<div class="layui-form-item" style="padding-top: 5px;">
											<div
												class="layui-inline layui-col-md12 layui-col-sm12 layui-col-lg12" style="margin:15px">
												<label class="layui-form-label form-label-wrap"
													style="width: 15% !important">参数模板</label>
												<div style="line-height: 24px">
													<span id="parameter" style="font-size: 12px !important;"></span>
												</div>
											</div>
										</div>
										<div class="layui-form-item" style="padding-top: 5px;">
											<div
												class="layui-inline layui-col-md12 layui-col-sm12 layui-col-lg12" style="margin:15px">
												<label class="layui-form-label form-label-wrap"
													style="width: 15% !important">变量值</label>
												<div class="layui-input-inline" style="width: 39%">
													<select class="layui-input form-input input-select"
														id="variable" name="variable" required="required"
														data-th-initvalue="${entity?.variable}"
														data-th-data-result='${VARIABLE_RANGE}'
														data-th-placeholder="#{SysCommon.placeholder}"></select>
												</div>
												<div class="layui-input-inline" style="width: 39%">
													<input type="number" class="layui-input form-input"
														id="variableDefinDate" name="variableDefinDate" disabled
														data-th-value="${entity?.variableDefinDate}"
														data-th-placeholder="#{SysCommon.placeholder}" >
												</div>
											</div>
										</div>
										<div class="layui-form-item" style="padding-top: 5px;">
											<div
												class="layui-inline layui-col-md12 layui-col-sm12 layui-col-lg12" style="margin:15px">
												<label class="layui-form-label form-label-wrap"
													style="width: 15% !important">模板已设置变量</label>
												<div style="line-height: 24px">
													<span style="font-size: 12px !important;">一年内;半月内;3;4;5;10</span>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="layui-col-md10" style="margin: 50px;">
				<div class="text-center">
					<a id="RskSupervisionIndicatorParam005_btn_save"
						class="layui-btn layui-btn-sm btn-save"
						data-th-text="#{SysCommon.save}">保存</a> <a
						id="RskSupervisionIndicatorParam005_btn_submit"
						class="layui-btn layui-btn-sm btn-submit"
						data-th-text="#{SysCommon.submit}">提交</a><a
						id="RskSupervisionIndicatorParam005_btn_cancel"
						class="layui-btn layui-btn-sm btn-cancel"
						data-th-text="#{SysCommon.cancel}">取消</a>
				</div>
			</div>
		</form>
	</div>
	<div layout:fragment="script">
<style>
.modelCss span{
	margin-left: 80px; 
	font-size: 12px;
}
.modelCss span:hover{
	color:red;
	font-size: 13px;
}
.form-label-wrap {
	width: 36% !important;
}

.manage-info-item li {
	float: left;
	padding-right: 10px;
	line-height: 24px;
}

.manage-info-item {
	float: left;
	padding-right: 10px;
}

.manage-info-item .layui-form-checkbox {
	margin-right: 2px;
	margin-top: -2px;
	padding-right: 0;
	line-height: 15px;
	width: 15px;
	height: 15px;
}

.manage-info-item .layui-form-checkbox i {
	line-height: 15px;
	width: 15px;
	height: 15px;
	border-left: 1px solid #d2d2d2;
	font-size: 15px;
}

.manage-info-item .layui-form-checked i, .manage-info-item .layui-form-checked:hover i
	{
	border-color: #2693ff;
	color: #2693ff;
}
</style>
		<script data-th-inline="javascript" type="text/javascript">
    	var entity=/*[[${entity}]]*/'';
        var DATE_RANGE_TYPE_CUSTOM = /*[[${DATE_RANGE_TYPE_CUSTOM}]]*/'';
        var PARA_TEMPLATE_FHMB = /*[[${PARA_TEMPLATE_FHMB}]]*/'';
        var PARA_TEMPLATE_ZCSZ = /*[[${PARA_TEMPLATE_ZCSZ}]]*/'';
        var PARA_TEMPLATE_ZCCB = /*[[${PARA_TEMPLATE_ZCCB}]]*/'';
        var PARA_DISPLAY_TYPE_CUSTOM = /*[[${PARA_DISPLAY_TYPE_CUSTOM}]]*/'';
    </script>
		<script
			data-th-src="@{/js/invest/riskredis/quota/rsksupervisionindicatorparam/RskSupervisionIndicatorParam005.js}"
			type="text/javascript">
    </script>
	</div>
</body>
</html>
