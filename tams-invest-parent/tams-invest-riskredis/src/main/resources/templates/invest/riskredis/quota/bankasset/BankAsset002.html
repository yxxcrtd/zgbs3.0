<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
<title>商业银行净资产维护</title>
    <style>
        .mst-lable{
            width: 20%;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
                <input type="hidden" id="customerId" name="customerId" data-th-value="${entity?.customerId}">
                <div class="layui-form-item">
                    <label class="layui-form-label form-lable mst-lable">主体代码</label>
                    <div class="layui-input-inline input-inline">
                    <!--  
                 	<input type="text" id="insitituteCode" name="insitituteCode" class="layui-input form-input input-lenovoselect"
                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-value="${entity?.insitituteCode}" required="required" 
                               data-th-data-url="@{/invest/riskredis/quota/bankasset/BankAsset002/getCustomerIdList}"
                               data-idfield="shortName" data-keyfield="code" 
                               data-th-data-effectivefieldsalias='|{"shortName":"#{BankAsset001.customerName}","code":"#{BankAsset001.customerId}"}|'
                              />-->
                    	<select id="insitituteCode"  name="insitituteCode" required="required" 
									class="layui-input form-input input-select"  
									 th:placeholder="#{SysCommon.placeholder}"
									 th:data-url="@{/invest/riskredis/quota/bankasset/BankAsset002/selectCustomerId}" allowClear="true"
									formatoption="true"  th:initValue="${entity?.insitituteCode}">
								</select>
								         
                                  </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label form-lable mst-lable">净资产（亿元）</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="netValue" name="netValue" required="required"
                               class="layui-input form-input text-number"
                               data-th-value="${entity?.netValue}"
                               data-th-placeholder="#{SysCommon.placeholder}" />
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label form-lable mst-lable">更新时间</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="effDate" name="effDate" required="required"
                               class="layui-input form-input input-dateSelect"
                               data-th-value='${#dates.format(entity?.effDate,"yyyy-MM-dd")}'
                               placeholder="请输入日期" data-th-placeholder="#{SysCommon.placeholder}"/>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label form-lable mst-lable">备注</label>
                    <div class="layui-input-inline input-inline">
                            <textarea id="remark" name="remark" th:value="${remark}" data-th-text="${entity?.remark}"
                            class="layui-textarea" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"></textarea>
                    </div>
                </div>
            </form>
            <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="position: fixed;bottom: 30px;">
                <div class="text-center">
                    <a id="BankAsset002_btn_save" class="layui-btn layui-btn-sm btn-save"
                       data-th-text="#{SysCommon.save}">保存</a>
                    <a id="BankAsset002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                       data-th-text="#{SysCommon.submit}">提交</a>
                    <a id="BankAsset002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                       data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/riskredis/quota/bankasset/BankAsset002.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
