<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{RskSupervisionRiskAnalyze001}">监控值查询</title>
    <!--<script type="text/javascript" src="/tams-invest/public/js/message"></script>-->
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area">
            <!--<a id="RskSupervisionIndicatorParam001_btn_create"-->
               <!--class="layui-btn layui-btn-sm btn-create"-->
               <!--data-th-text="#{SysCommon.create}">新建</a>-->
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{RskSupervisionRiskAnalyze001.groupName}">组合/组合包名称</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" class="layui-input form-input input-select" id="groupName"
                                   data-th-value="${portfolioId}" name="groupName"
                                   formatOption="false"
                                    data-th-data-url="@{/invest/riskredis/quota/rsksupervisionriskanalyze/RskSupervisionRiskAnalyze001/selectGroupName}"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{RskSupervisionRiskAnalyze001.indName}">指标名称</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" class="layui-input form-input input-select" allowClear="true"
                                   id="indName" name="indName" formatOption="false"
                                    data-th-data-url="@{/invest/riskredis/quota/rsksupervisionriskanalyze/RskSupervisionRiskAnalyze001/selectIndName}" ></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{RskSupervisionRiskAnalyze001.supType}">监督类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="supType" name="supType"
                                class="layui-input form-input input-select" data-th-data-result='${SUP_TYPE}'
                                formatoption="true" allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                  </div>
                </div>
              <div class="layui-form-item">
                  <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                      <label class="layui-form-label form-label-wrap"
                               data-th-text="#{RskSupervisionRiskAnalyze001.supStat}">监督状态</label>
                      <div class="layui-input-inline input-inline">
                          <select type="text" id="supStat" name="supStat"
                              class="layui-input form-input input-select" data-th-data-result='${SUP_STAT}'
                              formatoption="true"allowClear="true" placeholder="请输入内容"
                              data-th-placeholder="#{SysCommon.placeholder}">
                          </select>
                      </div>
                  </div>
                  <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                      <label class="layui-form-label form-label-wrap"
                               data-th-text="#{RskSupervisionRiskAnalyze001.supDate}">监督日期</label>
                      <div class="layui-input-inline input-inline">
                          <input id="supDate" name="supDate" class="layui-input form-input input-dateRangeSelect"
                             placeholder="请选择时间区间" data-th-value='${valDate}' data-th-placeholder="#{SysCommon.dateInterval}">
                      </div>
                  </div>
                  <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                      <label class="layui-form-label form-lable">产品经理</label>
                      <div class="layui-input-inline input-inline">
                          <select type="text" id="prodManager" name="prodManager" class="layui-input form-input input-select"
                                  data-th-data-url="@{/invest/riskredis/quota/rsksupervisionriskanalyze/RskSupervisionRiskAnalyze001/getUserName}" multiple="multiple"
                                  placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                          </select>
                          <!--<input type="text" id="finprodId"  name="finprodId" class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                 data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-url="@{/invest/asset/common/getAssetId(finprodType2=${FINPROD_TYPE_TG_F01})}"
                                 data-idfield="code" data-keyfield="code"
                                 data-th-data-effectivefieldsalias='|{"shortName":"#{FinBondTargetAsset002.finprodName}","code":"#{FinBondTargetAsset002.finprodId}"}|'>-->
                      </div>
                  </div>
              </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
            var normal = /*[[${normal}]]*/'';
            var warning = /*[[${warning}]]*/'';
            var violation = /*[[${violation}]]*/'';
            var approve = /*[[${approve}]]*/'';
            var error = /*[[${error}]]*/'';
            var SUP_UNIT=/*[[${SUP_UNIT}]]*/'';  //单位数据字典下拉
            
            var IND_TYPE_TOTAL_ENUM=/*[[${IND_TYPE_TOTAL_ENUM}]]*/'';
		    var relateIndType=/*[[${IND_TYPE_LINK_ENCODE}]]*/'';

		     var ssoUserName = /*[[${ssoUserName}]]*/'';
		     var NONE = /*[[${NONE}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/riskredis/quota/common/RskQuotaCommon.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/invest/riskredis/quota/rsksupervisionriskanalyze/RskSupervisionRiskAnalyze001.js}" type="text/javascript"></script>

</div>
</body>
</html>
