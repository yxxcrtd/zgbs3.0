<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
	<title data-th-text="#{RskApproval003}">委托审批</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm">
        <div class="pro-module">
		    <h3 class="pro-module-title"><span class="title-des">基本信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
		    <div class="pro-module-item">
		    <div class="layui-form-item">
                <input type="text" id="workflowId" data-th-value="${entity?.workflowId}" style="display:none"  /> 
                <input type="text" id="uuid" data-th-value="${entity?.uuid}" style="display:none"  /> 
    			<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-label-wrap"
							data-th-text="#{RskApproval003.eventId}">委托代码</label>
					<div class="layui-input-inline input-inline">
						<input type="text" class="layui-input form-input" id="eventId"
							name="eventId" data-th-value="${entity?.eventId}"
							data-th-placeholder="#{SysCommon.placeholder}" />
					</div>
				</div>

				<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-label-wrap"
							data-th-text="#{RskApproval003.portfolioId}">产品代码</label>
					<div class="layui-input-inline input-inline">
						<input type="text" class="layui-input form-input" id="prodId"
							name="prodId" data-th-value="${entity?.prodId}"
							data-th-placeholder="#{SysCommon.placeholder}" />
					</div>
				</div>

				<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-label-wrap" data-th-text="#{RskApproval003.startDate}">委托开始日</label>
					<div class="layui-input-inline input-inline">
						<input type="text" class="layui-input form-input" id="startDate"
							name="startDate" data-th-value="${#dates.format(entity?.startDate,'yyyy-MM-dd')}"
							data-th-placeholder="#{SysCommon.placeholder}" />
					</div>
				</div>
       		</div>
            <div class="layui-form-item">
    			<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-label-wrap"
							data-th-text="#{RskApproval003.endDate}">委托结束日</label>
					<div class="layui-input-inline input-inline">
						<input type="text" class="layui-input form-input" id="endDate"
							name="endDate" data-th-value="${#dates.format(entity?.endDate,'yyyy-MM-dd')}"
							data-th-placeholder="#{SysCommon.placeholder}" />
					</div>
				</div>
				<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-label-wrap"
							data-th-text="#{RskApproval003.ps}">交易方向</label>
					<div class="layui-input-inline input-inline">
						<select class="layui-input form-input input-select" id="ps"
							name="ps" data-th-initvalue="${entity?.ps}"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-data-result="${PS}"></select>
					</div>
				</div>
    			<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-label-wrap"
							data-th-text="#{RskApproval003.manager}">投资经理</label>
					<div class="layui-input-inline input-inline">
						<input type="text" class="layui-input form-input" id="manager"
							name="manager" data-th-value="${entity?.manager}"
							data-th-placeholder="#{SysCommon.placeholder}" />
					</div>
				</div>
       		</div>
       	    </div>
        </div>
        </form>
        <div class="pro-module-wrap" style="border-top:1px solid #ccc;margin-top: 5px; " id="data_assetTable_div">
            <div class="pro-module">
				<h3 class="pro-module-title"><span class="title-des">资产信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
			    <div class="pro-module-item">
				    <div class="layui-row" >
		                <table class="layui-table" id="data_assetTable" ></table>
				    </div>
	       	    </div>
	       	</div>
	    </div>
		<div class="pro-module-wrap" style="border-top:1px solid #ccc;margin-top: 5px; ">
            <div class="pro-module">
				<h3 class="pro-module-title"><span class="title-des">试算结果</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
			    <div class="pro-module-item">
				    <div class="layui-form-item">
				        <div class="layui-inline layui-col-md12 layui-col-sm12 layui-col-lg12" style="margin-left: 5px;">
				            <div class="layui-input-inline" style="width:99% !important;">
						        <textarea id="conclusion" name="conclusion" 
          					        class="layui-input layui-textarea" required="required"
          					        data-th-text="${entity?.conclusion}" >
						        </textarea>
				            </div>
				        </div>
				    </div>
				    <ul class="manage-info-item">
				        <li style="padding-right: 1px"
				            data-th-each="option : ${ASSETLIST}">
				            <div class="pro-module" style="border-top:1px solid #ccc;margin-top: 5px; ">
				                <h3 class="pro-module-title">
				                    <span class="title-des" style="color:#888" data-th-text="${option?.assetLabel}"></span>
				                </h3>
				                <div class="layui-row">
				                    <table class="layui-table" data-th-id="${option?.assetCodeStr}" ></table>
				                </div>
				            </div>
				        </li>
				    </ul>
				    <div class="layui-row" id="data_table_div">
		                <table class="layui-table" id="data_table" ></table>
				    </div>
	       	    </div>
	       	</div>
	    </div>
        <div class="layui-form-item" align="center">
            <a id="RskApproval003_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="RskApproval003_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="RskApproval003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div> 
    </div>
    <div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
		     var entity=/*[[${entity}]]*/;
		     var SUP_UNIT=/*[[${SUP_UNIT}]]*/;  //单位数据字典下拉
		     var ENTRUST_ID=/*[[${ENTRUST_ID}]]*/;
		     var ASSETLIST=/*[[${ASSETLIST}]]*/[];
		     var NOLIST=/*[[${NOLIST}]]*/'';
		     var TRADE_PLACE=/*[[${TRADE_PLACE}]]*/'';
		</script>
		<style>
			.line24{
			line-height: 24px;
			padding:0px 10px 0px 0px;
			}
			.width30{
			width:30%;
			}
		</style>
        <script data-th-src="@{/js/invest/riskredis/quota/rskapproval/RskApproval003.js}" type="text/javascript"></script>
    </div>
</body>

</html>
