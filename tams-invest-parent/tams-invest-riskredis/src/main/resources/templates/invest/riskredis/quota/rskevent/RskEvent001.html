<!DOCTYPE html>

<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RskEvent001}">风险事件管理</title>
	<style>
		.relParamEdit ,.relParamQuery{
			cursor: pointer;
			display: block;
			width: 40px;
			background: #2693ff;
			color: #fff!important;
			border-radius: 2px;
			display:block;
			float: left;
			text-align: center;
			line-height: 22px;
			margin-top: 1px;
		}
	</style>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				<a id="RskEvent001_btn_create"
					class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a> <a
					id="RskEvent001_btn_delete"
					class="layui-btn layui-btn-sm btn-delete"
					data-th-text="#{SysCommon.delete}">删除</a>
			</div>

			<div class="joyin-form-wrap joyin-filter-form condition-area">
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
								data-th-text="#{RskEvent001.eventName}">事项名称（联想框多选）</label>
							<div class="layui-input-inline input-inline">
								<select type="text" name="eventCode"
									class="layui-input form-input input-select" id="eventCode"
									allowclear="true" placeholder="请输入内容" multiple="true"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-url="@{/invest/riskredis/quota/rskevent/RskEvent001/selectMultiOptionEvent}">
								</select>
							</div>
						</div>
					</div>
				</form>
			</div>
		</div>
		<div>
			<table class="layui-table" id="dataTable"></table>
		</div>
	</div>
	<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">
            var EVENT_CODE=/*[[${EVENT_CODE}]]*/'';  //单位数据字典下拉
            
    </script>
		<script
			data-th-src="@{/js/invest/riskredis/quota/rskevent/RskEvent001.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
