<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{RepInterLog001}">接口日志管理</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
    <div class="form-button-area">
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
              <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{RepInterLog001.infId}">接口</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="infId" name="infId"
                                class="layui-input form-input input-select" data-th-data-result='${INF_ID}'
                                formatoption="true" allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                  </div>
                    
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{RepInterLog001.sysCode}">消费系统</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="sysCode" name="sysCode"
                                class="layui-input form-input input-select" data-th-data-result='${SYS_CODE}'
                                formatoption="true" allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                  </div>
              
                 <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{RepInterLog001.seqNo}">报文流水号</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" class="layui-input form-input" id="seqNo" name="seqNo"/>
                        </div>
                    </div>
                  
              </div>
              
              <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{RepInterLog001.doStatus}">处理状态</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="doStatus" name="doStatus"
                                class="layui-input form-input input-select" data-th-data-result='${DO_STATUS}'
                                formatoption="true" allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                  </div>
                  <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                      <label class="layui-form-label form-label-wrap" 
                               data-th-text="#{RepInterLog001.tranDate}">发送日期</label>
                      <div class="layui-input-inline input-inline">
                          <input id="tranDate" name="tranDate" class="layui-input form-input input-dateRangeSelect"
                             placeholder="请选择时间区间" data-th-value="${platDate}" data-th-placeholder="#{SysCommon.dateInterval}">
                      </div>
                  </div>
                  <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{RepInterLog001.requestData}">请求报文</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" class="layui-input form-input" id="requestData" name="requestData"/>
                        </div>
                   </div>
                  
              </div>
              
              <div class="layui-form-item">
                  <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{RepInterLog001.responseData}">应答报文</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" class="layui-input form-input" id="responseData" name="responseData"/>
                        </div>
                   </div>
                  
              </div>
              
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
    
            var SUP_UNIT=/*[[${SUP_UNIT}]]*/'';  //单位数据字典下拉
		    
    </script>
    <script data-th-src="@{/js/invest/riskredis/quota/interlog/RepInterLog001.js}" type="text/javascript"></script>
</div>
</body>
</html>
