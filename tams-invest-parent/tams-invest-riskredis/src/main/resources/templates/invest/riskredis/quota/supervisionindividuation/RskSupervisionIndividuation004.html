<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap" id="submitForm">
			<input type="hidden" id="oldWarnCond"   data-th-value="${yzInfo?.warnCond}" >
			<input type="hidden" id="oldFoulCond"   data-th-value="${yzInfo?.foulCond}" >
			<input type="hidden" id="oldApproveCond"   data-th-value="${yzInfo?.approveCond}" >
			<input type="hidden" id="warnCond" name="warnCond"
				data-th-value="${entity?.warnCond}"> <input type="hidden"
				id="foulCond" name="foulCond" data-th-value="${entity?.foulCond}">
			<input type="hidden" id="approveCond" name="approveCond"
				data-th-value="${entity?.approveCond}"> <input
				type="hidden" id="uniteId" name="uniteId"
				data-th-value="${entity?.uniteId}"> <input type="hidden"
				id="indType" name="indType" data-th-value="${IND_TYPE}">
			<div class="pro-module">
				<div class="pro-module-item">
					<div class="layui-form-item">
						<div class="form-inline-wrap" style="width: 50%">
							<label class="layui-form-label form-lable"
								data-th-text="#{RskSupervisionIndividuation004.finprodId}">资产代码</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="finprodId" name="finprodId"
									class="layui-input form-input input-select"
									data-th-initvalue='${entity?.finprodId}'
									data-th-data-url="@{/invest/riskredis/quota/supervisionindividuation/RskSupervisionIndividuation004/getFinprodId}"
									placeholder="请输入内容" required>
								</select>
							</div>
						</div>
						<div class="form-inline-wrap" style="width: 50%">
							<label class="layui-form-label form-lable"
								data-th-text="#{RskSupervisionIndividuation004.finprodName}">资产名称</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="finprodName" name="finprodName"
									class="layui-input form-input" disabled="disabled"
									data-th-value='${entity?.finprodName}' placeholder="请输入内容"
									required>
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="form-inline-wrap" style="width: 50%">
							<label class="layui-form-label form-lable"
								data-th-text="#{RskSupervisionIndividuation004.startDate}">开始日期</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="startDate" name="startDate"
									class="layui-input form-input input-dateSelect"
									data-th-value='${#dates.format(entity?.startDate,"yyyy-MM-dd")}'
									placeholder="请输入内容" required>
							</div>
						</div>
						<div class="form-inline-wrap" style="width: 50%">
							<label class="layui-form-label form-lable"
								data-th-text="#{RskSupervisionIndividuation004.endDate}">结束日期</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="endDate" name="endDate"
									class="layui-input form-input input-dateSelect"
									data-th-value='${#dates.format(entity?.endDate,"yyyy-MM-dd")}'
									placeholder="请输入内容" required>
							</div>
						</div>
					</div>


				</div>
				<div id="xzx_qzsz_div">
					<h3 class="pro-module-title">
						<span class="title-des">阈值设置</span>
					</h3>
					<div
						style="border-right: 1px solid #ccc; border-left: 1px solid #ccc; padding-top: 7px;">
						<div class="pro-module-item">
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{RskSupervisionIndividuation004.comparison}"
									style="width: 26% !important">比较符</label>
								<div class="layui-input-inline input-inline">
									<select th:id="comparison" name=".comparison"
										class="layui-input form-input input-select"
										data-th-placeholder="#{SysCommon.placeholder}"
										searchable="false" required
										data-th-data-result="${SUP_OPERATOR}">
									</select>
								</div>
							</div>
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{RskSupervisionIndividuation004.unit}"
									style="width: 26% !important">单位</label>
								<div class="layui-input-inline input-inline">
									<select th:id="unit" name="unit"
										class="layui-input form-input input-select"
										data-th-placeholder="#{SysCommon.placeholder}"
										searchable="false" required data-th-data-result="${SUP_UNIT}">
									</select>
								</div>
							</div>
							<!-- <div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{RskSupervisionIndividuation004.floatingRatio}"
									style="width: 30% !important">按浮动比例设置</label>
								<div class="layui-input-inline input-inline">
									<div class="element">
										<ul class="manage-info-item">
											<li>
												<div>
													<input type="checkbox" th:id="floatingRatio"
														th:checked="false"
														class='layui-input form-input input-checkbox'
														name="floatingRatio"
														data-th-lay-filter="RskSupervisionIndividuation004_floatingRatio" />
												</div>
											</li>
										</ul>
									</div>
								</div>
							</div> -->
						</div>
						<!-- <div class="pro-module-item">
							<div class="form-inline-wrap" id="standardValueDiv"
								style="display: none">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{RskSupervisionIndividuation004.standardValue}"
									style="width: 26% !important">标准值</label>
								<div class="layui-input-inline input-inline">
									<input th:id="standardValue" name="standardValue" 
										class="layui-input form-input text-number" data-textrange="4"
										data-th-placeholder="#{SysCommon.placeholder}"
										searchable="false" required />
								</div>
							</div>
						</div> -->
					</div>
					<div class="pro-module-wrap">
							<div class="pro-module">
								<div class="pro-module-item cus-table-wrap">
									<table class="layui-table" id="dataTable"></table>
								</div>
							</div>
						</div>
				</div>
			</div>
		</form>
		<div class="layui-form-item" align="center">
			<a id="RskSupervisionIndividuation004_btn_save"
				class="layui-btn layui-btn-sm btn-save"
				data-th-text="#{SysCommon.save}">保存</a> <a
				id="RskSupervisionIndividuation004_btn_cancel"
				class="layui-btn layui-btn-sm btn-cancel"
				data-th-text="#{SysCommon.cancel}">取消</a>
		</div>
	</div>
	<div layout:fragment="script">
		<style type="text/css">
.layui-form-radio {
	line-height: 14px !important
}

.layui-form-radio>i {
	font-size: 16px !important
}

.layui-chcekbox {
	margin-right: 14px !important
}

.manage-info-item li {
	float: left;
	padding-right: 15px;
	line-height: 24px;
	margin-bottom: 3px;
}

.manage-info-item {
	float: left;
	padding-right: 10px;
}

.manage-info-item .layui-form-checkbox {
	margin-right: 2px;
	margin-top: -2px;
	padding-right: 0;
	line-height: 15px;
	width: 15px;
	height: 15px;
}

.manage-info-item .layui-form-checkbox i {
	line-height: 15px;
	width: 15px;
	height: 15px;
	border-left: 1px solid #d2d2d2;
	font-size: 15px;
}

.manage-info-item .layui-form-checked i, .manage-info-item .layui-form-checked:hover i
	{
	border-color: #2693ff;
	color: #2693ff;
}

.manage-info-item .layui-form-radio {
	margin-top: 0px
}
</style>
		<script data-th-inline="javascript" type="text/javascript">
			var ALARM_OPER = /*[[${ALARM_OPER}]]*/'';//范围控制
			var cjcz_yj = /*[[${cjcz_yj}]]*/'';//预警
		    var cjcz_sp = /*[[${cjcz_sp}]]*/'';//审批
		    var cjcz_jz = /*[[${cjcz_jz}]]*/'';//禁止
		    var IND_TYPE_TOTAL_ENUM=/*[[${IND_TYPE_TOTAL_ENUM}]]*/'';
		    var SUP_UNIT=/*[[${SUP_UNIT}]]*/'';  //单位数据字典下拉
		    var entity=/*[[${entity}]]*/'';
		</script>

		<script
			data-th-src="@{/js/invest/riskredis/quota/supervisionindividuation/RskSupervisionIndividuation004.js}"></script>
		<script data-th-src="@{/js/invest/riskredis/quota/common/RskQuotaCommon.js}" type="text/javascript"></script>
	</div>
</body>
</html>
