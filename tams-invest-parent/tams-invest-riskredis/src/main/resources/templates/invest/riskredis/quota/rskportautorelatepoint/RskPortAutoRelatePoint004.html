<!DOCTYPE html>
<div style="border: 1px solid rgb(255, 255, 255); height: auto;">
    <div class="mixtree-div">
        <!-- <input type="checkbox" lay-skin="primary" lay-filter="tree_all"> -->
        <div class="layui-unselect layui-form-checkbox" lay-skin="primary" style="display: none;">
            <i class="layui-icon layui-icon-ok"></i>
        </div>
        <a class="mixtree-head">
            <i class="iconfont icon-downarrow"></i><span>&nbsp;规则名称</span></a>
        <a class="mixtree-head" style="float: right; padding-right: 5px; display: none;">
            <i class="iconfont icon-showorder fsize18"></i></a>
    </div>
    <div style="height: 490px; width: 100%; overflow: auto;" class="tree_node_div">
        <div data-th-each="node,nodeStat : ${list}" class="mixtree-node" data-th-ruleid="${node.id}" data-th-rulename="${node.name}">
            <div data-th-text="|${node.name}|" class="node_div"></div>
            <div class="operate_div">
                <a class="btn-trans node_modify" data-th-ruleid="${node.id}" data-th-rulename="${node.name}" style="color: #006dd9;cursor: pointer;"><i class="iconfont icon-edit"></i><span>&nbsp;</span></a>
                <a class="btn-trans node_delete" data-th-ruleid="${node.id}" data-th-rulename="${node.name}" style="color: red;cursor: pointer;"><i class="iconfont icon-delete"></i><span>&nbsp;</span></a>
                <a class="btn-trans node_search" data-th-ruleid="${node.id}" data-th-rulename="${node.name}" style="color: #fff;cursor: pointer;"><i class="iconfont icon-search"></i><span>&nbsp;</span></a>
            </div>
        </div>
    </div>
</div>
