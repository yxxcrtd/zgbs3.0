<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorator="~{layout/default}">
<head>
<title data-th-text="#{RskSupervisionIndividuation002}">新增条件</title>
	<style>
		.line24{
			padding:1px 15px 9px 15px;
		}
		.line24 i{
			height:12px;
		}
		.time-line{
			float: left;
			width: 35px !important;
			line-height: 25px;
		}
	</style>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap" id="submitForm">
			<input id="workflowId" name="workflowId"
				data-th-value="${workflowId}" type="hidden" /> <input type="hidden"
				id="prtBagId" name="prtBagId"
				data-th-value="${entity?.prtBagId} ?:${prtBagId}" /> <input
				type="hidden" id="indId" name="indId"
				data-th-value="${entity?.indId} ?:${indId}" /> <input type="hidden"
				id="conditionId" name="conditionId"
				data-th-value="${entity?.conditionId}" />
			<div class="pro-module">
				<div class="pro-module-item">
					<div class="layui-form-item" style="margin-left: 20px">
						<label class="layui-form-label line24" style="width: 10% !important"
							data-th-text="#{RskSupervisionIndividuation002.ruleName}">条件项</label>
						<div class="layui-input-inline input-inline"
							style="width: 70% !important">
							<select id="conditionItem" name="conditionItem"
								required="required" class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-initValue="${entity?.conditionItem}"
								data-th-data-result='${CONDITION_ITEM}'>
							</select>
						</div>
					</div>
					<div class="layui-form-item" style="margin-left: 20px;">
						<label class="layui-form-label line24" style="width: 10% !important"
							data-th-text="#{RskSupervisionIndividuation002.controlType}">控制类型</label>
						<div class="layui-input-inline input-inline"
							style="width: 70% !important">
							<select id="controlType" name="controlType" required="required"
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-initValue="${entity?.controlType}"
								data-th-data-result='${CONTROL_TYPE}'>
							</select>
						</div>
					</div>
					<div class="layui-form-item"
						style="margin-bottom: 8px; margin-left: 20px">
						<label class="layui-form-label line24" style="width: 10% !important"
							data-th-text="#{RskSupervisionIndividuation002.value}">数值</label>
						<div id="valueRangeDiv">
							<div class="layui-input-inline input-inline"
								style="width: 35% !important">
								<input type="text" id="valueStr" name="valueStr"
									class="layui-input form-input text-number"
									style="width: 83% !important; display: inline-block;"
									placeholder="请输入内容" data-textrange="4"
									data-th-value='${entity?.valueStr}'
									data-th-placeholder="#{SysCommon.placeholder}" required /> <input
									type="text" id="unit1" name="unit1"
									class="layui-input form-input"
									style="width: 15% !important; display: inline-block;" readonly />
							</div>
							<div style="float: left">
								<span style="margin: 0px 2px 0px 2px">-</span>
							</div>
							<div class="layui-input-inline input-inline"
								style="width: 35% !important">
								<input type="text" id="valueEnd" name="valueEnd"
									class="layui-input form-input text-number"
									style="width: 83% !important; display: inline-block;"
									placeholder="请输入内容" data-textrange="4"
									data-th-value='${entity?.valueEnd}'
									data-th-placeholder="#{SysCommon.placeholder}" required /> <input
									type="text" id="unit2" name="unit2"
									class="layui-input form-input"
									style="width: 15% !important; display: inline-block;" readonly />
							</div>
						</div>
						<div class="layui-input-inline input-inline" id="valueSingleDiv">
							<div class="layui-input-inline input-inline">
								<input type="text" id="valueStr2" name="valueStr2"
									class="layui-input form-input text-number"
									style="width: 83% !important; display: inline-block;"
									placeholder="请输入内容" data-textrange="4"
									data-th-value='${entity?.valueStr}'
									data-th-placeholder="#{SysCommon.placeholder}" required /> <input
									type="text" id="unit3" name="unit3"
									class="layui-input form-input"
									style="width: 15% !important; display: inline-block;" readonly />
							</div>
						</div>
						<div id="dateRangeDiv">
							<div class="layui-input-inline input-inline"
								style="width: 35% !important">
								<input id="valueStr3" name="valueStr3"
									class="layui-input form-input input-dateSelect"
									placeholder="请输入内容" required />
							</div>
							<div style="float: left">
								<span style="margin: 0px 2px 0px 2px">-</span>
							</div>
							<div class="layui-input-inline input-inline"
								style="width: 35% !important">
								<input id="valueEnd3" name="valueEnd3"
									class="layui-input form-input input-dateSelect"
									placeholder="请输入内容" required />
							</div>
						</div>
						<div id="onDateRangeDiv">
							<div class="time-line">
								<span style="margin: 0px 2px 0px 2px">前置</span>
							</div>
							<div class="layui-input-inline input-inline" style="width: 14% !important">
								<select id="dateStr" name="dateStr" required="required"
										class="layui-input form-input input-select"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-initValue="${entity?.dateStr}"
										data-th-data-result='${DATE_OPTIONS}'>
								</select>
							</div>
							<div style="float: left;width: 20px !important;" class="text-center">
								<span style="margin: 0px 2px 0px 2px;font-size: 18px;">-</span>
							</div>
							<div class="layui-input-inline input-inline" style="width: 80px !important;">
								<input type="text" id="valueStr4" name="valueStr4"
									   class="layui-input form-input text-number"
									   style="display: inline-block;"
									   placeholder="请输入内容" data-textrange="0" maxlength=3
									   data-th-value='${entity?.valueStr}'
									   data-th-placeholder="#{SysCommon.placeholder}" required />
							</div>
							<div class="layui-input-inline input-inline" style="width: 100px !important">
								<select id="dateUnitStr" name="dateUnitStr" required="required"
										class="layui-input form-input input-select"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-initValue="${entity?.dateUnitStr}"
										data-th-data-result='${DIS_DATE_TYPE}'>
								</select>
							</div>
							<div class="text-center time-line">
								<span style="margin: 0px 2px 0px 2px">至</span>
							</div>
							<div class="time-line">
								<span style="margin: 0px 2px 0px 2px">后置</span>
							</div>
							<div class="layui-input-inline input-inline" style="width: 14% !important">
								<select id="dateEnd" name="dateEnd" required="required"
										class="layui-input form-input input-select"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-initValue="${entity?.dateEnd}"
										data-th-data-result='${DATE_OPTIONS}'>
								</select>
							</div>
							<div style="float: left;width: 20px !important;" class="text-center">
								<span style="margin: 0px 2px 0px 2px;font-size: 18px;">+</span>
							</div>
							<div class="layui-input-inline input-inline" style="width: 80px !important">
								<input type="text" id="valueEnd4" name="valueEnd4"
									   class="layui-input form-input text-number"
									   style="display: inline-block;"
									   placeholder="请输入内容" data-textrange="0" maxlength=3
									   data-th-value='${entity?.valueEnd}'
									   data-th-placeholder="#{SysCommon.placeholder}" required />
							</div>
							<div class="layui-input-inline input-inline" style="width: 100px !important">
								<select id="dateUnitEnd" name="dateUnitEnd" required="required"
										class="layui-input form-input input-select"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-initValue="${entity?.dateUnitEnd}"
										data-th-data-result='${DIS_DATE_TYPE}'>
								</select>
							</div>
						</div>
					</div>
				</div>
			</div>
		</form>
		<div class="layui-form-item" align="center">
			<a id="RskSupervisionIndividuation002_btn_save"
				class="layui-btn layui-btn-sm btn-save"
				data-th-text="#{SysCommon.save}">保存</a> <a
				id="RskSupervisionIndividuation002_btn_cancel"
				class="layui-btn layui-btn-sm btn-cancel"
				data-th-text="#{SysCommon.cancel}">取消</a>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var CONTROL_TYPE_05 = /*[[${CONTROL_TYPE_05}]]*/'';//范围控制
			var CONDITION_ITEM_04 = /*[[${CONDITION_ITEM_04}]]*/'';//启用时间
			var CONDITION_ITEM_03 = /*[[${CONDITION_ITEM_03}]]*/'';//建仓期时间
			var CONDITION_ITEM_02 = /*[[${CONDITION_ITEM_02}]]*/'';//单位净值控制
			var DIS_DATE_TYPE_01 = /*[[${DIS_DATE_TYPE_01}]]*/'';//工作日
			var DIS_DATE_TYPE_02 = /*[[${DIS_DATE_TYPE_02}]]*/'';//自然日
			var entity = /*[[${entity}]]*/'';
			var VDATE = /*[[${VDATE}]]*/'';
			var OPTION1 = /*[[${OPTION1}]]*/'';
			var OPTION2 = /*[[${OPTION2}]]*/'';
			var OPTION3 = /*[[${OPTION3}]]*/'';
			var OPTION4 = /*[[${OPTION4}]]*/'';
			var OPTION5 = /*[[${OPTION5}]]*/'';
			var OPTION6 = /*[[${OPTION6}]]*/'';
		</script>

		<script
			data-th-src="@{/js/invest/riskredis/quota/supervisionindividuation/RskSupervisionIndividuation002.js}"></script>
	</div>
</body>

</html>
