<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RskSupervisionIndicatorParam006}">固定值参数</title>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap" id="submitForm">
			<div class="pro-module-wrapper pro-module-base">
				<div class="pro-module-wrap">
					<div class="pro-module">
						<div class="pro-module-item">
							<div class="layui-form-item">
								<input id="workflowId" name="workflowId" data-th-value="${entity?.workflowId}" style="display:none;"/>
								<div class="layui-col-md6 layui-col-sm6 layui-col-lg6">
									<label class="layui-form-label form-lable" style="width: 22%;"
										data-th-text="#{RskSupervisionIndicatorParam006.paraName}">参数名称</label>
									<div class="layui-input-inline input-inline">
										<input type="text" class="layui-input form-input"
											id="paraName" name="paraName"
											data-th-value="${entity?.paraName}" 
											data-th-placeholder="#{SysCommon.placeholder}"
											required="required" maxlength="60" />
									</div>
								</div>
								<div class="layui-col-md6 layui-col-sm6 layui-col-lg6">
									<label class="layui-form-label form-lable" style="width: 22%;"
										data-th-text="#{RskSupervisionIndicatorParam006.paraCode}">参数代码</label>
									<div class="layui-input-inline input-inline">
										<input type="text" class="layui-input form-input" id="paraCode"
											name="paraCode" data-th-value="${entity?.paraCode}"
											data-th-placeholder="#{SysCommon.placeholder}"
											required="required" maxlength="32" disabled="disabled"/>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="pro-module-wrap">
                        <div class="pro-module">
                            <div class="pro-module-item cus-table-wrap">
                                <table class="layui-table" id="dataTable"></table>
                            </div>
                        </div>
                </div>
			</div>

			<div class="layui-col-md10" style="margin: 50px;">
				<div class="text-center">
					<a id="RskSupervisionIndicatorParam006_btn_save"
						class="layui-btn layui-btn-sm btn-save"
						data-th-text="#{SysCommon.save}">保存</a> <a
						id="RskSupervisionIndicatorParam006_btn_submit"
						class="layui-btn layui-btn-sm btn-submit"
						data-th-text="#{SysCommon.submit}">提交</a><a
						id="RskSupervisionIndicatorParam006_btn_cancel"
						class="layui-btn layui-btn-sm btn-cancel"
						data-th-text="#{SysCommon.cancel}">取消</a>
				</div>
			</div>
		</form>
	</div>
	<div layout:fragment="script">
		<style>
.form-label-wrap {
	width: 36% !important;
}

.manage-info-item li {
	float: left;
	padding-right: 10px;
	line-height: 24px;
}

.manage-info-item {
	float: left;
	padding-right: 10px;
}

.manage-info-item .layui-form-checkbox {
	margin-right: 2px;
	margin-top: -2px;
	padding-right: 0;
	line-height: 15px;
	width: 15px;
	height: 15px;
}

.manage-info-item .layui-form-checkbox i {
	line-height: 15px;
	width: 15px;
	height: 15px;
	border-left: 1px solid #d2d2d2;
	font-size: 15px;
}

.manage-info-item .layui-form-checked i, .manage-info-item .layui-form-checked:hover i
	{
	border-color: #2693ff;
	color: #2693ff;
}
</style>
		<script data-th-inline="javascript" type="text/javascript">
    	var entity=/*[[${entity}]]*/'';
        var paraDisplayTypeFix = /*[[${paraDisplayTypeFix}]]*/'';
        var SYS_DATE = /*[[${SYS_DATE}]]*/'';
    </script>
		<script
			data-th-src="@{/js/invest/riskredis/quota/rsksupervisionindicatorparam/RskSupervisionIndicatorParam006.js}"
			type="text/javascript">
    </script>
	</div>
</body>
</html>
