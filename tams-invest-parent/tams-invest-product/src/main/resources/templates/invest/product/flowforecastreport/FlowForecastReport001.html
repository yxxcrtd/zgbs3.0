<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FlowForecastReport001}">流动性预测表</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area" export="false">
            
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">查询日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="queryDate" name="queryDate" placeholder="请选择日期"
                                class="layui-input form-input input-dateSelect" required
                                data-th-Value="${queryDate}"
                                >
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md6">
                    </div>
                </div>
            </form>
        </div>
        <div id="reverseDiv" style="display: none">
            <fieldset class="layui-elem-field layui-field-title" style="margin: 0px 0px 0px;">
                <legend>
                    <span href="javascript:;" style="color: #0875ec; font-size: 10px;" id="div_cpfy">流动性储备情况</span>
                </legend>
            </fieldset>
            <div id="div_dataTable_cpfy" style="margin-top: 0px;">
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
        <div id="forecastDiv" style="display: none;">
            <fieldset class="layui-elem-field layui-field-title" style="margin: 0px 0px 0px;">
                <legend>
                    <span href="javascript:;" style="color: #0875ec; font-size: 10px;" id="div_cpfy">流动性预测</span>
                </legend>
            </fieldset>
            <div id="div_dataTable_cpfy" style="margin-top: 0px;">
                <table class="layui-table" id="dataTableForecast"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script
            data-th-src="@{/js/invest/product/flowforecastreport/FlowForecastReport001.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
