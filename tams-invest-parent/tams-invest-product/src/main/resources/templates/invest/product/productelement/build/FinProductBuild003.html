<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinProductBuild003}">发行状态管理</title>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form" id="issueStatusForm">
			<div class="layui-form-item" hidden>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap"
						data-th-text="#{FinProductBuild003.newIssueStatus}">新发行状态</label>
					<div class="layui-input-inline input-inline">
						<select id="FinProductBuild003_newIssueStatus"
							class="layui-input form-input input-select"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-data-result="${ISSUE_STATUS}">
						</select>
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-label-wrap"
						data-th-text="#{FinProductBuild003.issueStatusRemark}">状态备注</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="FinProductBuild003_issueStatusRemark"
							class="layui-input form-input input-text" />
					</div>
				</div>
			</div>
			<div>
				<table class="layui-table" id="FinProductBuild003_dataTable" name="selectedItem"></table>
			</div>
			<div class="layui-form-item" align="center">
				<a id="FinProductBuild003_btn_save"
					class="layui-btn layui-btn-sm btn-save"
					data-th-text="#{SysCommon.save}">保存</a> <a
					id="FinProductBuild003_btn_submit"
					class="layui-btn layui-btn-sm  btn-submit"
					data-th-text="#{SysCommon.submit}">提交</a> <a
					id="FinProductBuild003_btn_cancel"
					class="layui-btn layui-btn-sm  btn-cancel"
					data-th-text="#{SysCommon.cancel}">取消</a>
			</div>
		</form>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var ISSUE_STATUS = /*[[${ISSUE_STATUS}]]*/;
			var issueStatusList = JSON.parse(/*[[${ISSUE_STATUS}]]*/);
			var finprodIdStr = /*[[${finprodIdStr}]]*/;
			var workflowId = /*[[${workflowId}]]*/;
		</script>
		<script
			data-th-src="@{/js/invest/product/productelement/build/FinProductBuild003.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
