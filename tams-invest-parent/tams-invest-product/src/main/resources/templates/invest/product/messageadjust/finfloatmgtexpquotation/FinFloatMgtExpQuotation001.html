<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinFloatMgtExpQuotation001}">浮动管理费报价管理</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				<a id="FinFloatMgtExpQuotation001_btn_add" class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a>
				<a id="FinFloatMgtExpQuotation001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
				data-th-text="#{SysCommon.delete}">删除</a>
				<a th:if="${isEleShow['FinFloatMgtExpQuotation001_btn_sendSale']} ne 'N'" id="FinFloatMgtExpQuotation001_btn_sendSale" class="layui-btn layui-btn-sm">
				<i class="iconfont icon-execute"></i>
				<span data-th-text="#{FinFloatMgtExpQuotation001.sendInterf}">发送</span>
				</a>
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinFloatMgtExpQuotation001.finprodId}">产品代码</label>
							<div class="layui-input-inline input-inline">
								<select id="FinFloatMgtExpQuotation001_finprodId" name="finprodId"
									class="layui-input form-input input-select" 
									data-th-placeholder="#{SysCommon.placeholder}" multiple="true" formatoption=false
 									data-th-data-url="@{/invest/product/messageadjust/finfloatmgtexpquotation/FinFloatMgtExpQuotation001/getFinprodId}">
								</select>		
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
                            <label class="layui-form-label form-lable"
                            data-th-text="#{FinFloatMgtExpQuotation002.prodStyle}">适用款型</label>
                            <div class="layui-input-inline input-inline" id="prodStyleDIV">
                                <select id="prodStyle" name="prodStyle" parentids = "FinFloatMgtExpQuotation001_finprodId"
                                    class="layui-input form-input input-select"
                                    data-th-data-url="@{/invest/product/messageadjust/finfloatmgtexpquotation/FinFloatMgtExpQuotation001/queryLayerProdStyleList}"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    formatoption=false multiple="true">
                                </select>
                            </div>
                        </div>
						<div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinFloatMgtExpQuotation001.effDate}">生效日</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="FinFloatMgtExpQuotation001_effDate" name="effDate"
									class="layui-input form-input input-dateRangeSelect"
									placeholder="请选择时间区间"
									data-th-placeholder="#{SysCommon.placeholder}" />
							</div>
						</div>
						<!-- <div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4" style="display: none;">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinFloatMgtExpQuotation001.relaeseDate}">报价日</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="FinFloatMgtExpQuotation001_relaeseDate" name="relaeseDate"
									class="layui-input form-input input-dateRangeSelect"
									placeholder="请选择时间区间"
									data-th-placeholder="#{SysCommon.placeholder}" />
							</div>
						</div> -->
					</div>
					<div class="layui-form-item" th:if="${isEleShow['FinFloatMgtExpQuotation001_sendStatus']} ne 'N'">
						<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinFloatMgtExpQuotation001.sendStatus}">发送状态</label>
							<div class="layui-input-inline input-inline">
								<select name="sendStatus"
										id="sendStatus"
										class="layui-input form-input input-select"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-initValue='${entity?.sendStatus}'
										data-th-data-result="${SEND_STATUS}">
								</select>
							</div>
						</div>
					</div>
				</form>
			</div>

			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script th:inline="javascript">
	           var isSendStatusTableShow = [[${isEleShow['send_status_table']}]];
	           var isSendStatusTableLinkShow = [[${isEleShow['send_status_table_link']}]];
	           var isSendRemarkTableShow = [[${isEleShow['send_remark_table']}]];
	           
	           
	           var YES = /*[[${YES}]]*/'Y'; // 数据字典.是否_是
		</script>
		<script
			data-th-src="@{/js/invest/product/messageadjust/finfloatmgtexpquotation/FinFloatMgtExpQuotation001.js}"
			type="text/javascript"></script>
		<script data-th-inline="javascript" type="text/javascript">
		</script>
	</div>
</body>
</html>
