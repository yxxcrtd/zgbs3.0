<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>回补信息查询</title>
</head>
<body>
</body>
<div layout:fragment="content">
	<div class="form-button-area" >
		<a id="FinProductAnapleroticInfo001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a> 
	</div>
	<div class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
		<form class="layui-form" id="searchForm">
			<div class="layui-form-item">
				<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-lable2"
						data-th-text="#{FinProductAnapleroticInfo.finprodId}">产品代码</label>
					<div class="layui-input-inline input-inline">
						<select id="finprodId" name="finprodId"
							class="layui-input form-input input-select"
							placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-data-url="@{/invest/product/productelement/anaplerotic/FinProductAnapleroticInfo001/queryProdIdInfo}"
							multiple
							>
						</select>	
					</div>
				</div>
				<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-lable"
					data-th-text="#{FinFloatMgtExpQuotation002.prodStyle}">适用款型</label>
					<div class="layui-input-inline input-inline" id="prodStyleDIV">
						<select id="prodStyle" name="prodStyle"
							class="layui-input form-input input-select"
							data-th-placeholder="#{SysCommon.placeholder}"
							formatoption=false multiple="true">
                         </select>
                     </div>
                </div>
				<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-lable" data-th-text="#{FinProductAnapleroticInfo.effDate}">生效日</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="effDate" name="effDate"
							class="layui-input form-input input-dateRangeSelect"
							placeholder="请选择时间区间">
					</div>
				</div>
			</div>
		</form>
	</div>
	<div id="dataTable">
		<table class="layui-table" th:id="finProductAnapleroticPlanTable" th:name="finProductAnapleroticPlanList"></table>
	</div>
</div>
<div layout:fragment="script">
	<script data-th-src="@{/js/invest/product/productelement/anaplerotic/FinProductAnapleroticInfo001.js}"type="text/javascript"></script>
</div>
</html>
