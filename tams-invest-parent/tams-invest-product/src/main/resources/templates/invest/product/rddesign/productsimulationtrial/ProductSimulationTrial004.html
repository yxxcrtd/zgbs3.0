<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.w3.org/1999/xhtml"
	  layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
	<title data-th-text="#{ProductSimulationTrial004.add}">模拟交易录入</title>
	<style>
		.rate-inline-wrapper .select2-container{
			width: 33%!important;
		}
	</style>
</head>
<body>
<div layout:fragment="content">
	<div class="pro-module-container">
		<form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
			<div class="pro-module-wrapper pro-module-base">
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title">
							<span class="title-des">基本信息</span>（<span class="star-sign">*</span> 必填）<i class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{ProductSimulationTrial002.assetType}">资产大类</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="assetType" name="assetType"
												class="layui-input form-input input-select" allowClear="true"
												formatoption=false
												required="required"
												data-th-data-result="${ASSET_TYPE}">
										</select>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{ProductSimulationTrial002.assetRiskLevel}">资产风险等级</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="assetRiskLevel" name="assetRiskLevel"
												class="layui-input form-input input-select" allowClear="true"
												formatoption=false
												required="required"
												data-th-data-result="${ASSET_RISK_LEVEL}">
										</select>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable" data-th-text="#{ProductSimulationTrial002.mockAmt}">模拟匹配金额（元）</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="mockAmt" name="mockAmt" placeholder="请输入内容"
											   data-pattern="" data-textrange="2"
											   required="required"
											   class="layui-input form-input text-number">
										<span class="input-right-show">元</span>
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{ProductSimulationTrial002.mockShareAmt}">模拟匹配份额</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="mockShareAmt" name="mockShareAmt" placeholder="请输入内容"
											   data-pattern=""  data-textrange="2"
											   required="required"
											   class="layui-input form-input text-number">
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{ProductSimulationTrial002.rateType}">利率类型</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="rateType" name="rateType"
												class="layui-input form-input input-select" allowClear="true"
												formatoption=false
												required="required"
												data-th-data-result="${INT_TYPE}">
										</select>
									</div>
								</div>
							</div>

							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{ProductSimulationTrial002.rateMix}">收益率下限(%)</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="rateMix" name="rateMix" placeholder="请输入内容"
											   data-pattern="" data-textrange="4"
											   required="required"
											   class="layui-input form-input text-number">
										<span class="input-right-show">%</span>
									</div>
								</div>

								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{ProductSimulationTrial002.rateMax}">收益率上限(%)</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="rateMax" name="rateMax" placeholder="请输入内容"
											   data-pattern="" data-textrange="4"
											   required="required"
											   class="layui-input form-input text-number">
										<span class="input-right-show">%</span>
									</div>
								</div>
							</div>

							<div class="layui-form-item">
								<div class="form-inline-wrap" style="width: 100%!important;">
									<label class="layui-form-label form-label-wrap" style="width: 11.9%!important;"  data-th-text="#{ProductSimulationTrial002.floatMinRate}">下限浮动利率(%)=</label>
									<div class="layui-input-inline input-inline rate-inline-wrap rate-inline-wrapper" style="width: 85%!important;">
										<select id="benchmarkMin"
												name="benchmarkMin"
												class="layui-input form-input input-select"
												searchable="true"
												placeholder="请输入内容"
												data-th-data-url="@{/invest/product/rddesign/productsimulationtrial/ProductSimulationTrial004/getIndexIdSource}"
												data-th-placeholder="#{SysCommon.placeholder}" required>
										</select>
										<input type="hidden" id="benchmarkMinSource" name="benchmarkMinSource"/>
										<span class="rate-text" data-th-text="#{ProductSimulationTrial002.coefficientMin}"></span>
										<input type="text" id="coefficientMin"
											   name="coefficientMin" length="5"
											   required="required"
											   class="layui-input form-input text-number" style="display:inline-block;width: 143px;"/>
										<span class="rate-text" data-th-text="#{ProductSimulationTrial002.spreadRateMin}"></span>
										<input type="text" id="spreadRateMin"
											   name="spreadRateMin" length="5"
											   required="required"
											   class="layui-input form-input text-number" style="display:inline-block;width: 180px;" />
									</div>
								</div>
							</div>

							<div class="layui-form-item">
								<div class="form-inline-wrap" style="width: 100%!important;">
									<label class="layui-form-label form-label-wrap" style="width: 11.9%!important;"  data-th-text="#{ProductSimulationTrial002.floatMaxRate}">上限浮动利率(%)=</label>
									<div class="layui-input-inline input-inline rate-inline-wrap rate-inline-wrapper" style="width: 85%!important;">
										<select id="benchmarkMax"
												name="benchmarkMax"
												class="layui-input form-input input-select"
												required="required"
												data-th-data-result="${INDEX_ID_SOURCE}" searchable="true"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-url="@{/invest/product/rddesign/productsimulationtrial/ProductSimulationTrial004/getIndexIdSource}">
										</select>
										<input type="hidden" id="benchmarkMaxSource" name="benchmarkMaxSource"/>
										<span class="rate-text" data-th-text="#{ProductSimulationTrial002.coefficientMax}"></span>
										<input type="text" id="coefficientMax"
											   name="coefficientMax" length="5"
											   required="required"
											   class="layui-input form-input text-number" style="display:inline-block;width: 143px;"  />
										<span class="rate-text" data-th-text="#{ProductSimulationTrial002.spreadRateMax}"></span>
										<input type="text" id="spreadRateMax"
											   name="spreadRateMax" length="5"
											   required="required"
											   class="layui-input form-input text-number" style="display:inline-block;width: 180px;"  />
									</div>
								</div>
							</div>

							<!--历史数据查询-->
							<div id="pledgeStamps_div" class="page-component" th:data-path="@{/invest/product/rddesign/productsimulationtrial/ProductSimulationTrial005/init}"
								 th:data-params="|{pageFrom: 'ProductSimulationTrial005'}|"></div>
							<div class="pro-module-wrapper pro-module-block">
								<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
									<div class="text-center">
										<a id="Productsimulationtrial004_btn_save" class="layui-btn layui-btn-sm btn-save"
										   data-th-text="#{SysCommon.save}">保存</a>
										<a id="Productsimulationtrial004_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
										   data-th-text="#{SysCommon.cancel}">取消</a>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</form>
	</div>
</div>
<div layout:fragment="script">
	<script th:inline="javascript" type="text/javascript">
		var sysDate = /*[[${sysDate}]]*/'';
	</script>
	<script data-th-src="@{/js/invest/product/rddesign/productsimulationtrial/Productsimulationtrial004.js}" type="text/javascript"></script>
</div>
</body>
</html>
