<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.w3.org/1999/xhtml"
	  layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
	<title data-th-text="#{EtrSecLend.add}">模拟交易新建</title>
</head>
<body>
<div layout:fragment="content">
	<div class="pro-module-container">
		<form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
			<div class="pro-module-wrapper pro-module-base">
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title">
							<span class="title-des">基本信息</span>（<span class="star-sign">*</span> 必填）<i class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<input type="hidden" id="seqNo" name="seqNo" th:value="${entity?.seqNo}" />
						<input type="hidden" id="requirementId" name="requirementId" th:value="${entity?.requirementId}" />
						<input type="hidden" id="batchId" name="batchId" th:value="${entity?.batchId}" />
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{ProductSimulationTrial001.mockDate}">测算日</label>
									<div class="layui-input-inline input-inline">
										<input id='mockDate' name='mockDate' class="layui-input form-input input-dateSelect"
											   placeholder="请选择时间" data-th-placeholder="#{SysCommon.placeholder}"
											   th:value="${#dates.format(entity?.mockDate,'yyyy-MM-dd')}"
											   required>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable" data-th-text="#{ProductSimulationTrial001.prdDesignId}">产品设计系列编号</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="prdDesignId" name="prdDesignId"
												class="layui-input form-input input-select" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-url="@{/invest/product/rddesign/productsimulationtrial/ProductSimulationTrial001/queryDesignIdInfo}"
												data-th-initValue='${entity?.prdDesignId}'required>
										</select>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable" data-th-text="#{ProductSimulationTrial002.prdScale}">产品规模（元）</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="prdScale" name="prdScale" placeholder="请输入内容"
											   data-pattern="" data-fixtype="2"
											   th:value="${entity?.prdScale}"
											   class="layui-input form-input text-number" required="required">
									</div>
								</div>
							</div>
							<div class="layui-form-item">

								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{ProductSimulationTrial002.prdPeriod}">产品期限（天）</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="prdPeriod" name="prdPeriod" placeholder="请输入内容"
											   data-pattern="" data-textrange="0"
											   th:value="${entity?.prdPeriod}"
											   class="layui-input form-input text-number" required="required">
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{ProductSimulationTrial002.rateMax}">收益率上限(%)</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="rateMax" name="rateMax" placeholder="请输入内容"
											   data-pattern=""
											   th:value="${entity?.rateMax}"
											   class="layui-input form-input" required>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{ProductSimulationTrial002.rateMix}">收益率下限(%)</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="rateMix" name="rateMix" placeholder="请输入内容"
											   data-pattern="" th:value="${entity?.rateMix}"
											   class="layui-input form-input" required>
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{ProductSimulationTrial002.mockAvailableAmt}">模拟可用金额</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="mockAvailableAmt" name="mockAvailableAmt" placeholder="请输入内容"
											   data-pattern="" th:value="${entity?.mockAvailableAmt}"
											   class="layui-input form-input text-number" disabled>
									</div>
								</div>
							</div>
							<div class="pro-module">
								<h3 class="pro-module-title">
	                                <span class="title-des"
										  data-th-utext="#{ProductSimulationTrial003.info}">模拟资产信息</span>
										<i class="iconfont icon-arrow-down pro-down-icon"></i>
								</h3>
								<div class="pro-module-item pro-item-wrap">
									<div class="layui-form-item">
										<div class="form-inline-wrap">
											<a class="layui-btn layui-btn-sm btn-create" id="productSimulationTrial_btn_add">
												<i class="iconfont icon-found"></i><span
													data-th-utext="#{ProductSimulationTrial003.add}">添加</span></a>
										</div>
									</div>
							  		<div>
									  <table class="layui-table" id="simulationAssetTable" name="simulationAssetsList"></table>
									</div>
								</div>
							</div>
						<div class="pro-module-wrapper pro-module-block">
							<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
								<div class="text-center">
									<a id="ProductSimulationTrial002_btn_save" class="layui-btn layui-btn-sm btn-save"
									   data-th-text="#{SysCommon.save}">保存</a>
									<a id="ProductSimulationTrial002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
									   data-th-text="#{SysCommon.submit}">提交</a>
									<a id="ProductSimulationTrial002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
									   data-th-text="#{SysCommon.cancel}">取消</a>
								</div>
							</div>
						</div>
		</form>
	</div>
</div>
<div layout:fragment="script">
	<script th:inline="javascript" type="text/javascript">
		var INT_TYPE_01 = /*[[${INT_TYPE_01}]]*/'';
		var INT_TYPE_02 = /*[[${INT_TYPE_02}]]*/'';
		var ASSET_TYPE = /*[[${ASSET_TYPE}]]*/'[]';
		var ASSET_RISK_LEVEL = /*[[${ASSET_RISK_LEVEL}]]*/'[]';
		var simulationAssetsList =  /*[[${entity?.simulationAssetsList}]]*/;
	</script>
	<script data-th-src="@{/js/invest/product/rddesign/productsimulationtrial/Productsimulationtrial002.js}" type="text/javascript"></script>
</div>
</body>
</html>
