<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>期次管理-查询</title>
</head>
<body>
<div layout:fragment="content">
        <div class="form-button-area" filter="false" delete="false">      
             <a id="PeriodicManagement001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
             <a id="PeriodicManagement001_btn_confrim" class="layui-btn layui-btn-sm btn-create" >确认</a>
        </div>
		<div class="joyin-form-wrap joyin-filter-form condition-area">
			<form class="layui-form" id="searchForm">
				<div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">产品代码</label>
                        <div class="layui-input-inline input-inline">
                            <select id="finprodId" name="finprodId"
                                class="layui-input form-input input-select"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                allowClear="true" formatoption=false multiple="true"
                                data-th-data-url="@{/invest/product/productelement/periodicmanagement/PeriodicManagement001/getFinprodIds}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">期次开始日</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="beginDate" name="beginDate"
								class="layui-input form-input input-dateRangeSelect"
								placeholder="请选择，支持区间">
						</div>
					</div>
	                <div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">期次结束日</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="endDate" name="endDate"
								class="layui-input form-input input-dateRangeSelect"
								placeholder="请选择，支持区间">
						</div>
					</div>
              	</div>
                <div class="layui-form-item">
				 	<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable">有效状态</label>
						<div class="layui-input-inline input-inline">
							<select id="validStatus" name ="validStatus"
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result="${STATUS_VALID}">
							</select>
						</div>
				 	</div>
			    </div>
		    </form>
		</div>
		<div>
			<table id="dataTable"></table>
		</div>
	</div>
</body>
<div layout:fragment="script">
	<script 
		data-th-src="@{/js/invest/product/productelement/periodicmanagement/PeriodicManagement001.js}"
		type="text/javascript"></script>
</div>
</html>
