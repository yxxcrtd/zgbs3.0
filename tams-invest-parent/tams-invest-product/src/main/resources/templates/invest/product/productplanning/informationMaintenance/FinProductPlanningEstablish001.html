<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinProductPlanningEstablish001}">产品规划信息维护</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="form-button-area">
				<a id="FinProductPlanningEstablish001_btn_new" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
		</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductPlanningEstablish001.designSerialName}">产品规划系列名称</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="FinProductPlanningEstablish001_designSerialName"
									class="layui-input form-input input-select" allowClear="true"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									formatoption=true multiple="true"
									data-th-data-url="@{/invest/product/productplanning/informationMaintenance/FinProductPlanningEstablish001/querySeriesName}">
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
								data-th-text="#{FinProductPlanningEstablish001.bdate}">规划基准日</label>
							<div class="layui-input-inline input-inline">
								<input id="FinProductPlanningEstablish001_bdate"
									class="layui-input form-input input-dateSelect"
									placeholder="请选择时间区间"
									data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
						<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
								   data-th-text="#{FinProductPlanningEstablish001.sdate}">规划开始日</label>
							<div class="layui-input-inline input-inline">
								<input id="FinProductPlanningEstablish001_sdate"
									   class="layui-input form-input input-dateSelect"
									   placeholder="请选择时间区间"
									   data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
								   data-th-text="#{FinProductPlanningEstablish001.edate}">规划结束日</label>
							<div class="layui-input-inline input-inline">
								<input id="FinProductPlanningEstablish001_edate"
									   class="layui-input form-input input-dateSelect"
									   placeholder="请选择时间区间"
									   data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
					</div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var workflowId = /*[[${workflowId}]]*/;
		</script>
		<script data-th-src="@{/js/invest/product/productplanning/informationMaintenance/FinProductPlanningEstablish001.js}" type="text/javascript"></script>
	</div>
</body>
</html>
