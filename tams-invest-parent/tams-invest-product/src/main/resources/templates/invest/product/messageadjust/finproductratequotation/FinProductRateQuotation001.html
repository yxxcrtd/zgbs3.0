<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinProductRateQuotation001}">产品费率报价管理</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				
				<a id="FinProductRateQuotation001_btn_add" class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a>
				<a id="FinProductRateQuotation001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
				data-th-text="#{SysCommon.delete}">删除</a>
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductRateQuotation001.finprodId}">产品代码</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="finprodId" name="finprodId" class="layui-input form-input input-select"
	                                allowClear="true" placeholder="请输入内容"
	                                data-th-placeholder="#{SysCommon.placeholder}" formatoption = "false"
	                                data-th-data-url="@{/invest/product/messageadjust/finproductratequotation/FinProductRateQuotation001/getFinprodId}" 
	                                multiple="true">
	                            </select>		
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4" id ='prodStyleDiv'>
                             <label class="layui-form-label form-lable" data-th-text="#{FinProductRateQuotation001.prodStyle}">适用款型</label>
                             <div class="layui-input-inline input-inline">
                                  <select id="prodStyle" name="prodStyle"
                                          class="layui-input form-input input-select"
                                          data-th-placeholder="#{SysCommon.placeholder}"
                                          data-th-initvalue="${entity?.prodStyle}" 
                                          formatoption=false
                                          parentIds='finprodId'
										  data-th-data-url="@{/invest/product/messageadjust/finproductratequotation/FinProductRateQuotation001/getSelectProdStyleByFinprodId}"
                                           >
                                    </select>
                               </div>
                        </div>
						<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductRateQuotation001.effDate}">生效日</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="effDate" name="effDate"
									class="layui-input form-input input-dateRangeSelect"
									placeholder="请选择、支持区间"
									data-th-placeholder="#{SysCommon.dateInterval}" />
							</div>
						</div>
						
					</div>
				</form>
			</div>

			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script
			data-th-src="@{/js/invest/product/messageadjust/finproductratequotation/FinProductRateQuotation001.js}"></script>
	</div>
</body>
</html>
