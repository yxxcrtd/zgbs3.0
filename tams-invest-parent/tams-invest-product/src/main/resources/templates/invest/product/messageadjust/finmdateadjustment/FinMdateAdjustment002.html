<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"

</head>

	<div layout:fragment="content">

				<input type="text" name=finprodMarketId id='FinMdateAdjustment002_hidden_finprodMarketId' data-th-value='${entity?.finprodMarketId}' hidden>
				<input type="text" name=adjustNum id='FinMdateAdjustment002_hidden_adjustNum' data-th-value='${entity?.adjustNum}' hidden>
				<input type="text" name=dealMode id='FinMdateAdjustment002_hidden_dealMode' data-th-value='${entity?.dealMode}' hidden>
				<input type="text" name=profitType id='FinMdateAdjustment002_hidden_profitType' data-th-value='${entity?.profitType}' hidden>
				<form class="layui-form joyin-form-wrap pro-module-form">

							</h3>
							<div class="pro-module-item">

										<label class="layui-form-label form-label-wrap"

											<select id="FinMdateAdjustment002_finprodId"
													name="finprodId" formatoption=false
													class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-data-url="@{/invest/product/messageadjust/finmdateadjustment/FinMdateAdjustment002/queryAdjustProdIdList?isCreate=Y}"
													data-th-initValue='${entity?.finprodId}'>
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"

										<div class="layui-input-inline input-inline">

												   class="layui-input form-input"
												   data-th-placeholder="#{SysCommon.placeholder}"

										</div>
									</div>
								</div>
								<div class="layui-form-item">

                                            <div class="layui-input-inline input-inline">
                                                <input type="text" name="adjustType" th:id="|${pageId}_adjustType|"

                                                    data-th-initValue='${entity?.adjustType} ?: ${ADJUSTTYPE_01}' 
                                                    data-th-data-result="${MDATEADJUSTTYPE}" required />
                                            </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinMdateAdjustment002.adjustBeforeMdate}">调整前到期日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="mdateUnadjust" id="FinMdateAdjustment002_mdateUnadjust"
												   class="layui-input form-input input-dateSelect" disabled
												   data-th-value='${#dates.format(entity?.mdateUnadjust,"yyyy-MM-dd")}' 
                                                   required>
										</div>
									</div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"

                                                   class="layui-input form-input input-dateSelect" disabled
                                                   data-th-value='${#dates.format(entity?.ldateUnadjust,"yyyy-MM-dd")}'
                                                   required>
                                        </div>
                                    </div>
								</div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" id="FinMdateAdjustment002.beforeEnddate">

                                               data-th-text="#{FinMdateAdjustment002.beforeEnddate}">提前终止日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="mdate" id="FinMdateAdjustment002_bdate"
                                                   class="layui-input form-input input-dateSelect" 
                                                   data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}' 
                                                   required>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" id="FinMdateAdjustment002.RolloverDate" style="display:none;">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{FinMdateAdjustment001.table.RolloverDate}">展期日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="mdate" id="FinMdateAdjustment002_rdate"
                                                   class="layui-input form-input input-dateSelect" 
                                                   data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}' 
                                                   required>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" id="FinMdateAdjustment002.adjustAfterMdate" style="display:none;">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{FinMdateAdjustment001.table.adjustAfterMdate}">调整后到期日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="mdate" id="FinMdateAdjustment002_mdate"
                                                   class="layui-input form-input input-dateSelect"
                                                   data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}' 
                                                   required>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{FinMdateAdjustment002.adjustAfterLdate}">调整后清盘日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="ldate" id="FinMdateAdjustment002_adjustAfterLdate"
                                                   class="layui-input form-input input-dateSelect"
                                                   data-th-value='${#dates.format(entity?.ldate,"yyyy-MM-dd")}'
                                                   required>
                                        </div>
                                    </div>
                                </div>
							</div>
						</div>
					</div>
                    <div class="pro-module-wrap" id="FinMdateAdjustment002_div_layering">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">关联影响</span>
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <table class="layui-table" id="dataTable" th:title="#{FinMdateAdjustment002.relate}"
                                    name="layTypeInfoList"></table>
                            </div>
                        </div>

					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title">
								<span class="title-des">备注信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i>
							</h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div>
										<label class="layui-form-label form-label-wrap" style="width: 11.9%;">备注</label>
										<div class="layui-input-inline input-inline" style="width: 85%!important;">

													  data-th-placeholder="#{SysCommon.placeholder}"
													  class="layui-textarea" data-th-text="${entity?.remark}" maxlength="300"></textarea>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

									<fieldset style="border: solid 1px #E0E0E0">

				<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin-top: 20px;margin-bottom: 20px;">

							data-th-text="#{SysCommon.cancel}">取消</a>
					</div>
				</div>
			</div>

	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
	        var REPTERM_02 = /*[[${REPTERM_02}]]*/;
	        var REPTERM_03 = /*[[${REPTERM_03}]]*/;
	        var REPTERM_04 = /*[[${REPTERM_04}]]*/;
	        var REPTERM_05 = /*[[${REPTERM_05}]]*/;
	        var REPTERM_06 = /*[[${REPTERM_06}]]*/;
	        var REPTERM_07 = /*[[${REPTERM_07}]]*/;
	        var ADJUSTTYPE_01 = '01';//调整类型_提前终止
	        var ADJUSTTYPE_02 = '02';//调整类型_产品展期
	        var ADJUSTTYPE_03 = '03';//调整类型_到期调整
	        var FEE_SPECIES_TYPE_03='03';//费用类型_固定费用
	        var FEE_SPECIES_TYPE_12='12';//费用类型_浮动管理费 
	        var workflowId = /*[[${workflowId}]]*/'';
	        var calendarId = '';
	        var vdate = /*[[${entity?.vdate}]]*/;//定义起息日
        </script>
