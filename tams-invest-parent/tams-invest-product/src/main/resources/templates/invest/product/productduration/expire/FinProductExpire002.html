		    function comdify(n) {  //金额格式转化为"###,###.00"
	        	var re=/\d{1,3}(?=(\d{3})+$)/g;
	        	var n1=n.replace(/^(\d+)((\.\d+)?)$/,function(s,s1,s2){return s1.replace(re,"$&,")+s2;});
	        	return n1;
	        }
		    function zd(){
	        	jyfx = $('#FinProductExpire002_ps').val();
	        	if(jyfx == 'C5' && jyfx != undefined && jyfx != null){
	        		zcmc = $('#FinProductExpire002_SELECT_finprodMarketId').val();
	        		var zcmc2=zcmc.substring(4);
	        		bj =  $('#FinProductExpire002_prodName').val();
	        		dqsyl = $('#FinProductExpire002_endDate').val();
	        		wyj = $('#FinProductExpire002_reduceAmt').val();//还本金额
	        		khsy = $('#FinProductExpire002_actCusProfit').val();//客户收益金额
	        		cc = $('#targetCustomer1').val();
	        		dd =" ";
	        		if(cc=='01'){dd="个人"
	        			}else if(cc == '02'){dd="机构"}else if(cc == '03'){dd="同业"}
	        		var aa=JoyinMath.doAdd(wyj,khsy,2);
	        		var s1 = "到期清算";
	        		var s2 = "产品到期,客户本金";
	        		var s3 = "元，收益";
	        		var s4 = "元,兑付客户本金及收益合计";
	        		var s5 = "元。";
