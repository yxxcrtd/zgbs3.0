<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{AssetPlanNewsDefend}">资产规划信息维护</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area">
            <a id="AssetPlanNewsDefend001_btn_add"
               class="layui-btn layui-btn-sm btn-create"
               data-th-text="#{SysCommon.create}">新建</a>
        </div>

        <div class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="form-inline-wrap layui-col-xs4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{AssetPlanNewsDefend001.benchDate}">规划基准日</label>
                        <div class="layui-input-inline input-inline">
                            <input id="benchDate" name="benchDate" class="layui-input form-input input-dateSelect"
                                   placeholder="请选择时间" data-th-value="${#dates.format(entity?.benchDate,'yyyy-MM-dd')}"
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="form-inline-wrap layui-col-xs4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{AssetPlanNewsDefend001.vdate}">规划开始日</label>
                        <div class="layui-input-inline input-inline">
                            <input id="vdate" name="vdate" class="layui-input form-input input-dateSelect"
                                   placeholder="请选择时间" data-th-value="${#dates.format(entity?.vdate,'yyyy-MM-dd')}"
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="form-inline-wrap layui-col-xs4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{AssetPlanNewsDefend001.edate}">规划结束日</label>
                        <div class="layui-input-inline input-inline">
                            <input id="edate" name="edate" class="layui-input form-input input-dateSelect"
                                   placeholder="请选择时间" data-th-value="${#dates.format(entity?.edate,'yyyy-MM-dd')}"
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{AssetPlanNewsDefend001.assetType}">资产大类</label>
                        <div class="layui-input-inline input-inline">
                            <select name="assetType"
                                    class="layui-input form-input input-select"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result="${ASSET_TYPE}">
                            </select>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript">
        //var effective = /*[[${effective}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/product/productplanning/assetplannewsdefend/AssetPlanNewsDefend001.js}" type="text/javascript"></script>
</div>
</body>
</html>
