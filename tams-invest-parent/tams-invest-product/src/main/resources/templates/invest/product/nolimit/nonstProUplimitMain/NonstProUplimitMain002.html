<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{NonstProUplimitMain002}">非标比例上限维护新建</title>
</head>
<body>
	<div layout:fragment="content">
		<div class="pro-module-wrapper pro-module-base" style="border-top: none;">
				<form class="layui-form joyin-form-wrap" id="submitForm">
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title" style="border-top: 1px solid #ccc;"><span class="title-des">基础信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
                                data-th-text="#{NonstProUplimitMain002.effdate}">生效日</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="effdate" name="effdate"
									class="layui-input form-input input-dateSelect"
									placeholder="请选择查询时间" required
									data-th-value='${#dates.format(entity?.effDate,"yyyy-MM-dd")}'>
							</div>
						</div>
								</div>
							</div>
						</div>
					</div>
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">非标比例明细表</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<table class="layui-table" id="dataTable"></table>
							</div>
						</div>
					</div>
				</form>
				<div class="layui-col-md11" style="margin:20px 0;">
					<div class="text-center">
						<a id="NonstProUplimitMain002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
						<a id="NonstProUplimitMain002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
						<a id="NonstProUplimitMain002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
					</div>
				</div>
			</div>	
	</div>
	<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">
		    var tableList = /*[[${tableList}]]*/[];
	        var workflowId = /*[[${workflowId}]]*/'';
		</script>
		<script data-th-src="@{/js/invest/product/nolimit/nonstProUplimitMain/NonstProUplimitMain002.js}"></script>
	</div>
</body>
</html>
