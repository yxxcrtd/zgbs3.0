<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{RiskLevelRating001}">存续产品风险等级评定</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="layui-col-md12 form-button-area" style="margin: 10px;" >
            <a id="RiskLevelRating001_btn_new" class="layui-btn layui-btn-sm "
               data-th-text="#{RiskLevelRating001.new}">新建</a>
        </div>
        <div class='joyin-form-wrap joyin-filter-form condition-area'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{RiskLevelRating001.finProductCode}">产品代码</label>
                        <div class="layui-input-inline input-inline">
                            <select id="finProductCode" name="finProductCode"
                                    class="layui-input form-input input-select"
                                    data-th-data-url="@{/invest/product/riskLevelRating/RiskLevelRating001/findId}"
                                    data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>
                    <div
                            class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{RiskLevelRating001.generateTime}">评定日期</label>
                        <div class="layui-input-inline input-inline">
                            <input id="generateTime" name='generateTime'
                                   class="layui-input form-input input-dateRangeSelect"
                                   placeholder="请选择时间区间" allowClear="true"
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>

                </div>

            </form>

        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript">

    </script>
    <script
            data-th-src="@{/js/invest/product/riskLevelRating/RiskLevelRating001.js}"></script>
</div>
</body>
</html>
