<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{ColProductRequirement001}">产品需求收集</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
    <a id="ColProductRequirement001_btn_add" class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a>
    </div>

    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
            	<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{ColProductRequirement001.dataStatus}">有效状态</label>
                    <div class="layui-input-inline input-inline">
                    <select type="text" id="dataStatus" name="dataStatus" 
									class="layui-input form-input input-select" allowClear="true"
									formatoption=false 
									data-th-data-result="${STATUS_VALID}">
					</select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{ColProductRequirement001.requirementSource}">需求发起端</label>
                    <div class="layui-input-inline input-inline">
                    <select type="text" id="requirementSource" name="requirementSource" 
									class="layui-input form-input input-select" allowClear="true"
									formatoption=false 
									data-th-data-result="${REQUIREMENT_SOURCE}">
					</select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{ColProductRequirement001.requirementTime}">需求发起时间</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="requirementTime" name="requirementTime" class="layui-input form-input input-dateRangeSelect" />
                    </div>
                </div>
               </div>
               <div class="layui-form-item"> 
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{ColProductRequirement001.tarCustomer}">目标客户</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="tarCustomer" name="tarCustomer" class="layui-input form-input" maxLength="50"/>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{ColProductRequirement001.reportStatus}">初评结果</label>
                    <div class="layui-input-inline input-inline">
                    <select type="text" id="reportStatus" name="reportStatus" 
									class="layui-input form-input input-select" allowClear="true"
									formatoption=false 
									data-th-data-result="${REVIEW_RESULT}">
					</select>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/product/rddesign/colproductrequirement/ColProductRequirement001.js}" type="text/javascript"></script>
</div>
</body>

</html>
