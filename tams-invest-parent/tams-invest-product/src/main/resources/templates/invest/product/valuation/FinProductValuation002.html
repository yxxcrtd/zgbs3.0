<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinProductValuation002.title}">产品日间试算明细</title>
<style type="text/css">
.layui-form-item-ex {
	padding: 0;
}
</style>
</head>
<body>
	<div layout:fragment="content">
		<div class="pro-module-container">
			<form class="layui-form joyin-form-wrap pro-module-form"
				id="productValuationForm">
				<div class="pro-module-wrapper pro-module-base">
					<div class="pro-module-wrap">
						<div class="pro-module">
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductValuation001.prodcode}">产品代码</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="FinProductValuation001_prodcode"
												class="layui-input form-input">
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductValuation001.vldate}">估值日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="FinProductValuation001_vldate"
												class="layui-input form-input input-dateSelect">
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductValuation001.prodccy}">产品币种</label>
										<div class="layui-input-inline input-inline">
											<select class="layui-input form-input input-select"
												id="FinProductValuation001_ccy"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-result="${CCY}">
											</select>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="layui-form-item layui-form-item-ex">
						<!-- 资产信息 -->
						<div
							class="page-component layui-col-xs6 layui-col-md6 layui-col-sm6 layui-col-lg6 layui-col-space2"
							th:data-path="@{/invest/product/valuation/FinProductValuation002/initAssetInfo}"></div>
						<!-- 负债信息 -->
						<div
							class="page-component layui-col-xs6 layui-col-md6 layui-col-sm6 layui-col-lg6 layui-col-space2"
							th:data-path="@{/invest/product/valuation/FinProductValuation002/initDebtsInfo}"></div>
					</div>
					<div class="layui-form-item layui-form-item-ex">
						<!-- 费用信息 -->
						<div
							class="page-component layui-col-xs6 layui-col-md6 layui-col-sm6 layui-col-lg6 layui-col-space2"
							th:data-path="@{/invest/product/valuation/FinProductValuation002/initFeeInfo}"></div>
						<!-- 估值结果 -->
						<div
							class="page-component layui-col-xs6 layui-col-md6 layui-col-sm6 layui-col-lg6 layui-col-space2"
							th:data-path="@{/invest/product/valuation/FinProductValuation002/initResultInfo}"
							th:data-params="|{valueid: '${valueid}'}|"></div>
					</div>
				</div>
			</form>
		</div>
	</div>
	<div layout:fragment="script">
		<script
			data-th-src="@{/js/invest/product/valuation/FinProductValuation002.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
