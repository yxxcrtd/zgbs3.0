<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PlanningStrategyPool001}">规划策略池维护</title>
</head>
<body>
    <div layout:fragment="content">
        <div class='layui-fluid'>
            <div class="layui-col-md12 form-button-area" style="margin: 10px;">
                <a id="PlanningStrategyPool001_btn_add" class="layui-btn layui-btn-sm btn-create"
                    data-th-text="#{SysCommon.create}">新建</a>
            </div>
            <div class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
                <form class="layui-form" id="searchForm">
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                                data-th-text="#{PlanningStrategyPool001.strategyId}">策略代码</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="strategyId" name="strategyId"
                                    class="layui-input form-input input-select" placeholder="请选择"
                                    data-th-placeholder="#{SysCommon.placeholder}" multiple="true"
                                    data-th-data-url="@{/invest/product/productplanning/planningstrategypool/PlanningStrategyPool001/getStrategyId}">
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable" data-th-text="#{PlanningStrategyPool001.type2}">资产大类</label>
                            <div class="layui-input-inline input-inline">
                                <select name="type2" id="type2" class="layui-input form-input input-select"
                                    placeholder="请选择" data-th-data-result="${ASSET_TYPE}" multiple="true">
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                                data-th-text="#{PlanningStrategyPool001.useStatus}">使用状态</label>
                            <div class="layui-input-inline input-inline">
                                <select name="useStatus" id="useStatus" class="layui-input form-input input-select"
                                    placeholder="请选择" data-th-data-result="${USE_STATUS}" multiple="true">
                                </select>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/product/productplanning/planningstrategypool/PlanningStrategyPool001.js}"></script>
    </div>
</body>
</html>
