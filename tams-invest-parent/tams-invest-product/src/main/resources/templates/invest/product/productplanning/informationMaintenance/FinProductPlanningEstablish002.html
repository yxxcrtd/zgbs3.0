<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.w3.org/1999/xhtml"
	  layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
	<title data-th-text="#{FinProductPlanningEstablish002}">产品规划信息维护新建</title>
</head>
<body>
<div layout:fragment="content">
	<div class="pro-module-container">
		<form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
			<div class="pro-module-wrapper pro-module-base">
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title">
							<span class="title-des">基本信息</span>（<span class="star-sign">*</span> 必填）<i class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<input type="hidden" id="planningNo" name="planningNo" th:value="${entity?.planningNo}" />
						<div class="pro-module-item">
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									   data-th-text="#{FinProductPlanningEstablish001.bdate}">规划基准日</label>
								<div class="layui-input-inline input-inline">
									<input  id="FinProductPlanningEstablish001_bdate" name="baseDate"
											class="layui-input form-input input-dateSelect"  placeholder="请选择时间" data-th-placeholder="#{SysCommon.placeholder}"
											data-th-value='${entity?.baseDate eq null ? "": #dates.format(entity?.baseDate,"yyyy-MM-dd")}'
											required />
								</div>
							</div>
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									   data-th-text="#{FinProductPlanningEstablish001.sdate}">规划开始日</label>
								<div class="layui-input-inline input-inline">
									<input  id="FinProductPlanningEstablish001_sdate" name="planningStartDate"
											class="layui-input form-input input-dateSelect"  placeholder="请选择时间" data-th-placeholder="#{SysCommon.placeholder}"
											data-th-value='${entity?.planningStartDate eq null ? "": #dates.format(entity?.planningStartDate,"yyyy-MM-dd")}'
											required />
								</div>
							</div>
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									   data-th-text="#{FinProductPlanningEstablish001.edate}">规划结束日</label>
								<div class="layui-input-inline input-inline">
									<input  id="FinProductPlanningEstablish001_edate" name="planningEndDate"
											class="layui-input form-input input-dateSelect"  placeholder="请选择时间" data-th-placeholder="#{SysCommon.placeholder}"
											data-th-value='${entity?.planningEndDate eq null ? "": #dates.format(entity?.planningEndDate,"yyyy-MM-dd")}'
											required />
								</div>
							</div>
							<div class="pro-module">
								<h3 class="pro-module-title">
	                                <span class="title-des"
										  data-th-utext="#{FinProductPlanningEstablish001.list}">产品系列列表</span>
										<i class="iconfont icon-arrow-down pro-down-icon"></i>
								</h3>
								<div class="pro-module-item pro-item-wrap">
									<div>
										<table class="layui-table" id="dataTable" name="detailDtoList"></table>
									</div>
								</div>
							</div>
							<div class="pro-module-wrap">
								<div class="pro-module">
									<h3 class="pro-module-title"><span class="title-des">备注</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
									<div class="pro-module-item">
										<div class="layui-form-item">
											<div>
												<label class="layui-form-label form-lable" style="width: 11.9%;">备注</label>
												<div class="layui-input-inline input-inline" style="width: 85%!important;">
											<textarea id="remark" name="remark" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" class="layui-textarea" data-th-text="${entity?.remark}"
													  maxlength="300"></textarea>
												</div>
											</div>
										</div>
									</div>
								</div>
							</div>
							<div class="layui-col-md10" style="margin: 30px 0;">
								<div class="text-center">
									<a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save"
									   data-th-text="#{SysCommon.save}">保存</a>
									<a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit"
									   data-th-text="#{SysCommon.submit}">提交</a>
									<a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel"
									   data-th-text="#{SysCommon.cancel}">取消</a>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</form>
	</div>
</div>
<div layout:fragment="script">
	<script th:inline="javascript" type="text/javascript">

	</script>
	<script data-th-inline="javascript" type="text/javascript">
		var workflowId = /*[[${workflowId}]]*/;
		var productsDue = /*[[${productsDue}]]*/;
	</script>
	<script data-th-src="@{/js/invest/product/productplanning/informationMaintenance/FinProductPlanningEstablish002.js}" type="text/javascript"></script>
</div>
</body>
</html>
