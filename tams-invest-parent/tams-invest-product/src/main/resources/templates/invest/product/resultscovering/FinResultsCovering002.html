<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinResultsCovering002}">组合新建</title>

</head>
<body>
	<div layout:fragment="content">
		<div class="pro-module-container">
			<form id="basicInfoForm"
				class="layui-form joyin-form-wrap pro-module-form">
				<div class="pro-module-wrapper pro-module-base">
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title">
								<span class="title-des">基本信息</span><i
									class="iconfont icon-arrow-down pro-down-icon"></i>
							</h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<input type="text" id="tradeId" name="tradeId"
											class="layui-input form-input"
											data-th-value="${entity?.tradeId}" style="display: none">
										<input type="text" id="isLay" name="isLay"
											class="layui-input form-input"
											data-th-value="${entity?.isLay}" style="display: none">
										<input type="text" id="portfolioId" name="portfolioId"
											class="layui-input form-input"
											data-th-value="${entity?.portfolioId}" style="display: none">
										<input type="text" id="prodStyle" name="prodStyle"
											class="layui-input form-input"
											data-th-value="${entity?.prodStyle}" style="display: none">
										<!-- 隐藏字段 工作流代码 -->
										<input type="text" name="workflowId"
											data-th-value='${workflowId}' hidden> <label
											class="layui-form-label form-label-wrap"
											data-th-text="#{FinResultsCovering001.prodId}">产品代码</label>
										<div class="layui-input-inline input-inline">
											<select  type="text" id="prodId" name="prodId"
												class="layui-input form-input input-select"
												placeholder="请输入内容"
												data-th-childrenIds="layFinprodId"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-url="@{/invest/product/resultscovering/FinResultsCovering001/queryProdIdInfo}"
												data-th-initvalue="${entity?.prodId}" required>
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinResultsCovering002.coveringWay}">贴补方式</label>
										<div class="layui-input-inline input-inline">
											<select id="coveringWay" name="coveringWay"
												class="layui-input form-input input-select"
												data-th-data-result='${ANAPLEROTIC_RULE}'
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initvalue="${entity?.coveringWay}" required>
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinResultsCovering002.coveringForm}">贴补形式</label>
										<div class="layui-input-inline input-inline">
											<select id="coveringForm" name="coveringForm"
												class="layui-input form-input input-select"
												data-th-data-result='${ANAPLEROTIC_TYPE}'
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initvalue='${entity?.coveringForm}' required>
											</select>
										</div>
									</div>

								</div>

								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinResultsCovering002.covCycleStartDate}">回补周期开始日</label>
										<div class="layui-input-inline input-inline">
											<input id="covCycleStartDate" name="covCycleStartDate"
												class="layui-input form-input input-dateSelect"
												data-th-value='${#dates.format(entity?.covCycleStartDate,"yyyy-MM-dd")}' required>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinResultsCovering002.covCycleEndDate}">回补周期结束日</label>
										<div class="layui-input-inline input-inline">
											<input id="covCycleEndDate" name="covCycleEndDate"
												class="layui-input form-input input-dateSelect"
												data-th-value='${#dates.format(entity?.covCycleEndDate,"yyyy-MM-dd")}' required>
										</div>
									</div>

									<div class="layui-inline layui-col-md4" hidden>
										<label class="layui-form-label form-lable">币种</label>
										<div class="layui-input-inline input-inline">
											<select id="ccy" name="ccy" class="input-select"
												data-th-data-result='${CCY}'
												data-th-initvalue="${entity?.ccy}" placeholder="请选择"
												data-th-placeholder="#{SysCommon.selectplaceholder}">
											</select>
										</div>
									</div>

									<!-- <div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											th:text="#{FinResultsCovering002.beforeCovNetValue}">回补前净值</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="beforeCovNetValue"
												name="beforeCovNetValue"
												th:value="${entity?.beforeCovNetValue}"
												class="layui-input form-input text-number"
												placeholder="请输入内容" data-textrange='4'
												data-th-placeholder="#{SysCommon.placeholder}" hidden>
										</div>
									</div> -->
								</div>
								<div class="layui-form-item" id="layFinprodIdDiv">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinResultsCovering001.prodStyle}">产品款型</label>
										<div class="layui-input-inline input-inline">
											<select  type="text" id="layFinprodId" name="layFinprodId"
												class="layui-input form-input input-select"
												placeholder="请输入内容"
												data-th-parentIds="prodId"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-url="@{/invest/product/resultscovering/FinResultsCovering001/queryProdStyleInfo}"
												data-th-initvalue="${entity?.layFinprodId}">
											</select>
										</div>
									</div>
								</div>								
								<!-- <div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinResultsCovering002.annualYield}">区间年化收益率(%)</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="annualYield" id="annualYield"
												class="layui-input form-input text-number"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-textrange="4" data-th-value='${entity?.annualYield}' hidden>
										</div>
									</div>
								</div> -->
							</div>
						</div>
					</div>
					<div class="pro-module-wrap" th:id="value_div">
						<div class="pro-module">
							<h3 class="pro-module-title">
								<span class="title-des">回补信息</span><i
									class="iconfont icon-arrow-down pro-down-icon"></i>
							</h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinResultsCovering001.coveringDate}">回补日</label>
										<div class="layui-input-inline input-inline">
											<input id="coveringDate" name="coveringDate"
												class="layui-input form-input input-dateSelect"
												data-th-value='${#dates.format(entity?.coveringDate,"yyyy-MM-dd")}'
												required>
										</div>
									</div>
									<!-- 	<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											th:text="#{FinResultsCovering002.afterCovFixFee}">固定管理费回补金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="afterCovFixFee" name="afterCovFixFee"
												th:value="${entity?.afterCovFixFee}"
												class="layui-input form-input text-number"
												placeholder="请输入内容" data-textrange='4'
												data-th-placeholder="#{SysCommon.placeholder}" required>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											th:text="#{FinResultsCovering002.afterCovFloatFee}">浮动管理费回补金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="afterCovFloatFee"
												name="afterCovFloatFee"
												th:value="${entity?.afterCovFloatFee}"
												class="layui-input form-input text-number"
												placeholder="请输入内容" data-textrange='4'
												data-th-placeholder="#{SysCommon.placeholder}" required>
										</div>
									</div> -->
									<div class="form-inline-wrap" id="theoryAmountDiv">
										<label class="layui-form-label form-label-wrap"
											th:text="#{FinResultsCovering001.theoryAmount}">应回补金额</label>
										<div class="layui-input-inline input-inline">
											<input disabled="disabled"  type="text" id="theoryAmount" name="theoryAmount"
												th:value="${entity?.theoryAmount}"
												class="layui-input form-input text-number"
												placeholder="请输入内容" data-textrange='4'
												data-th-placeholder="#{SysCommon.placeholder}">
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											th:text="#{FinResultsCovering001.actualAmount}">实际回补金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="actualAmount" name="actualAmount"
												th:value="${entity?.actualAmount}"
												class="layui-input form-input text-number"
												placeholder="请输入内容" data-textrange='4'
												data-th-placeholder="#{SysCommon.placeholder}" required>
										</div>
									</div>
							

								</div>
								<div class="layui-form-item"></div>
							</div>
						</div>
					</div>
				</div>
			</form>
			<div
				class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11"
				style="margin: 50px;">
				<div class="text-center">
					<a id="FinResultsCovering002_btn_save"
						class="layui-btn layui-btn-sm btn-save"
						data-th-text="#{SysCommon.save}">保存</a> <a
						id="FinResultsCovering002_btn_submit"
						class="layui-btn layui-btn-sm btn-submit"
						data-th-text="#{SysCommon.submit}">提交</a> <a
						id="FinResultsCovering002_btn_cancel"
						class="layui-btn layui-btn-sm btn-cancel"
						data-th-text="#{SysCommon.cancel}">取消</a>
				</div>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
		var ANAPLEROTIC_RULE_01 = /*[[${ANAPLEROTIC_RULE_01}]]*/;
		var ANAPLEROTIC_RULE_02 = /*[[${ANAPLEROTIC_RULE_02}]]*/;
		var ANAPLEROTIC_RULE_03 = /*[[${ANAPLEROTIC_RULE_03}]]*/;
		var YES_NO_YES = /*[[${YES_NO_YES}]]*/;
		</script>
		<script
			data-th-src="@{/js/invest/product/resultscovering/FinResultsCovering002.js}">
    	</script>
	</div>
</body>
</html>
