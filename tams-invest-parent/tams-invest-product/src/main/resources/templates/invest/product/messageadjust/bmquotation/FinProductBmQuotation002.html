<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinProductBmQuotation002}">产品业绩基准调整（<span class="star-sign">*</span>必填）<i
								class="iconfont icon-arrow-down pro-down-icon"></i></title>
</head>
<body>
	<div layout:fragment="content">
	<form class="layui-form joyin-form-wrap" id="submitForm">
		<div class="">
			<div class="pro-module-wrapper pro-module-base">
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title">
							<span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i
								class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div style="display: none">
									<input type="text" id="finprodId" name="finprodId" data-th-value="${entity?.finprodId}"/>
								</div>
								<div style="display: none">
									<input type="text" id="profitType" name="profitType" data-th-value="${entity?.profitType}"/>
								</div>
								<div style="display: none">
									<input type="text" id="baseRuleId" name="baseRuleId" data-th-value="${entity?.baseRuleId ?: entity?.bussBenchMarkInfoDto?.baseRuleId}"/>
								</div>
								<input type="hidden" id="pFinprodId" name="pFinprodId" />
								
								<input type="hidden" id="dealMode" name="dealMode" data-th-value="${entity?.dealMode}"/>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{FinProductBmQuotation001.finprodMarketId}">产品代码</label>
									<div class="layui-input-inline input-inline">
                                           <select id="finprodMarketId" name="finprodMarketId" required="required"
											class="layui-input form-input input-select" placeholder="" maxlength="20"
											data-th-data-url="@{/invest/product/messageadjust/bmquotation/FinProductBmQuotation002/getFinprodMarketIdToNew}"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-initValue="${entity?.finprodMarketId}">
											</select>
                                       </div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{FinProductBmQuotation001.finprodAbbr}">产品简称</label>
									<div class="layui-input-inline input-inline">
                                           <input type="text" id="finprodAbbr"
											name="finprodAbbr" required="required"
											class="layui-input form-input" placeholder="" maxlength="50"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-value="${entity?.finprodAbbr}" disabled="disabled">
                                       </div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{FinProductBmQuotation001.effDate}">生效日</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="effDate" name="effDate"
                            				   class="layui-input form-input input-dateSelect" 
                            				   data-th-value='${#dates.format(entity?.effDate,"yyyy-MM-dd")}' 
                            				   placeholder="请输入内容" required>
									</div>
								</div>
							</div>
						    <div class="layui-form-item">
                                 <div class="form-inline-wrap">
                                      <label class="layui-form-label form-lable"
                                      data-th-text="#{FinFloatMgtExpQuotation002.prodStyle}">适用款型</label>
                                      <div class="layui-input-inline input-inline">
                                          <select id="prodStyle" name="prodStyle"
                                              class="layui-input form-input input-select"
                                              data-th-placeholder="#{SysCommon.placeholder}"
                                              formatoption=false
                                              data-th-data-result='${PROD_STYLE}'
                                              required>
                                          </select>
                                      </div>
                                  </div>
                                  <div class="form-inline-wrap">
                                      <label class="layui-form-label form-lable"
                                      data-th-text="#{FinProductBmQuotation001.investmentCycle}">投资周期（天）</label>
                                      <div class="layui-input-inline input-inline">
                                          <select id="investmentCycle" name="investmentCycle"
                                              class="layui-input form-input input-select"
                                              data-th-placeholder="#{SysCommon.placeholder}"
                                              formatoption=false
                                              data-th-data-result='${INVESTMENT_CYCLE}'
                                              required>
                                          </select>
                                      </div>
                                  </div>
                             </div>
						</div>
					</div>
				</div>
				<!-- 业绩基准共同 -->
				<div class="page-component" th:data-path="@{/component/prod/BussBenchMarkInfo/init}" th:data-params="|{pageModel:pageModel, entityName: 'bussBenchMarkInfoDto',finprodId:'${PAGE_finprodId ?: ''}',workflowId:workflowId,profitType:'profitType',effDate:'${PAGE_effDate ?: ''}'}|"></div>
				<!-- 备注 -->
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title">
							<span class="title-des">备注</span><i
								class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div class="form-inline-wrap" style="width: 100%;">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{FinProductBmQuotation002.remark}" style="width: 11.9%;"> 备注</label>
										<div class="layui-input-inline input-inline" style="width: 80%!important;">
										<textarea id="remark" name="remark" placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}" maxlength="200"
											class="layui-textarea" data-th-text="${entity?.remark}">
										</textarea>
										</div>
									 <!-- <div class="pro-module">
		                        <div class="pro-module-item">
						            <div class="layui-field-box">
						                <div class="layui-input-block">
										<textarea id="remark" name="remark" placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}" maxlength="200"
											class="layui-textarea" data-th-text="${entity?.remark}">
										</textarea>
									</div>
								</div>
							</div>
							</div> -->
							</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>


		<div class="row text-center stepbar" >
			<div class="text-center">
				<a id="FinProductBmQuotation002_btn_save"
				   class="layui-btn layui-btn-sm btn-save"
				   data-th-text="#{SysCommon.save}">保存</a> <a
					id="FinProductBmQuotation002_btn_submit"
					class="layui-btn layui-btn-sm btn-submit"
					data-th-text="#{SysCommon.submit}">提交</a> <a
					id="FinProductBmQuotation002_btn_cancel"
					class="layui-btn layui-btn-sm btn-cancel"
					data-th-text="#{SysCommon.cancel}">取消</a>
			</div>
		</div>
		</form>
	</div>
	</div>
	<div layout:fragment="script">
		<script th:inline="javascript" type="text/javascript">
		    var profitType = /*[[${profitType}]]*/'';
			var workflowId = /*[[${entity?.workflowId}]]*/'';
			var PAGE_finprodId = /*[[${PAGE_finprodId}]]*/'';
			var opType = /*[[${entity?.opType}]]*/'';
			var PAGE_effDate =/*[[${PAGE_effDate}]]*/'';
			var PROD_STYLE = /*[[${entity?.prodStyle}]]*/'';
			var DEAL_MODE_10 = /*[[${DEAL_MODE_10}]]*/;
			var DEAL_MODE_11 = /*[[${DEAL_MODE_11}]]*/;
			var INVESTMENT_CYCLE = /*[[${entity?.investmentCycle}]]*/'';
        </script>
		<script data-th-src="@{/js/invest/product/messageadjust/bmquotation/FinProductBmQuotation002.js}"
				type="text/javascript"></script>
	</div>
</body>

</html>
