<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{MainPage}">主页</title>
    <style type="text/css">
        #dataListDiv {
            width: 100%;
            height: 330px;
            border: 1px solid #aaaaaa;
            overflow-y: auto;
        }

        .panelPattern {
            height: 362px;
            overflow-y: auto;
        }

        .dataDiv {
            min-height: 70px;
            margin-bottom: 5px;
            border: 1px solid #aaaaaa;
            display: block;
            background-color: #fff;
        }

        .dataDiv {
            text-align: center
        }

        .dataDiv p:first-child {
            margin-top: 20px
        }

        .panelPattern .dataDiv p:first-child {
            margin-top: 50px !important
        }

        .remark-left {
            text-align: center !important;
            margin-top: 10px !important;
        }

        .last-group {
            margin-top: 13px !important;
        }

        .search-left-input {
            border-radius: 0 !important;
            margin-bottom: 5px;
            width: 90%
        }

        .cus-left {
            margin-top: 0 !important;
            background-color: #f5f5f5;
        }

        #positonDiv .dataDiv p {
            font-size: 18px;
            font-weight: 600;
        }

        #dataListDiv .dataDiv i {
            display: none;
        }

        #positonDiv .layui-row {
            padding-top: 16px;
        }

        #positonDiv > .layui-row > .layui-icon {
            position: absolute;
            margin-top: -16px;
            right: 0px;
        }

        .dataDiv > .layui-icon {
            float: right;
        }

        .operationRow {
            position: absolute;
            margin-top: -42px;
            right: 0px;
        }
    </style>
    <script>
        function setIframeHeight(iframe) {
            var height = Math.max(document.documentElement.scrollHeight || 0, document.body.scrollHeight || 0);
            $(iframe).css('height', height - 55);
        }
    </script>
</head>

<body>
<div layout:fragment="content">
    <div class="layui-tab">
        <ul class="layui-tab-title">
            <li class="layui-this" id="tag1">总量/总比例维护</li>
            <li id="tag2">非标可用额度查询</li>
            <li id="tag3">非标比例上限维护</li>
            <li id="tag4">最大可发行规模查询</li>
            <li id="tag5">非标额度占用查询</li>
        </ul>
        <div class="layui-tab-content">
            <div class="layui-tab-item  layui-show">
                <iframe th:src="@{/invest/product/nolimit/totalMaintain/TotalMaintain001/init}" width="100%"
                        height="100%" frameborder="0" style="border:none;min-height:600px;"></iframe>
            </div>
             <div class="layui-tab-item">
                <iframe th:src="@{/invest/product/nolimit/nonstandardavailablecredit/NonStandardAvailableCredit001/init}" width="100%"
                        height="100%" frameborder="0" style="border:none;min-height:600px;"></iframe>
            </div>
            <div class="layui-tab-item">
                <iframe th:src="@{/invest/product/nolimit/nonstProUplimitMain/NonstProUplimitMain001/init}" width="100%"
                        height="100%" frameborder="0" style="border:none;min-height:600px;"></iframe>
            </div>
            <div class="layui-tab-item">
                 <iframe th:src="@{/invest/product/nolimit/maxissuablesize/MaxIssuableSize001/init}" width="100%"
                        height="100%" frameborder="0" style="border:none;min-height:600px;"></iframe>
            </div>
            <div class="layui-tab-item">
                <iframe th:src="@{/invest/product/nolimit/occupy/OccupyQuery001/init}" width="100%"
                        height="100%" frameborder="0" style="border:none;min-height:600px;"></iframe>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">

</div>
</body>

</html>
