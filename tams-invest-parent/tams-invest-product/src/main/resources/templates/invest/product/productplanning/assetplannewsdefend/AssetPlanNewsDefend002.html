<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{AssetPlanNewsDefend}">资产规划信息维护</title>
</head>
<body>
<div class="pro-module-wrap">
    <div layout:fragment="content">
        <div class="pro-module-wrapper pro-module-base" style="border-top: none;">
            <form class="layui-form joyin-form-wrap pro-module-form" id="AssetPlanNewsDefend002_Form">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title"><span class="title-des" style="border-top: 1px solid #cccccc;">基础信息</span><i
                                    class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                            <input type="hidden" id="assetPlanCode" name="assetPlanCode" th:value="${entity?.assetPlanCode}" />
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{AssetPlanNewsDefend001.vdate}">规划开始日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" th:name="vdate"
                                               th:id="vdate"
                                               class="layui-input form-input input-dateSelect" required
                                               data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{AssetPlanNewsDefend001.edate}">规划结束日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" th:name="edate"
                                               th:id="edate"
                                               class="layui-input form-input input-dateSelect" required
                                               data-th-value='${#dates.format(entity?.edate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{AssetPlanNewsDefend001.benchDate}">规划基准日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" th:name="benchDate"
                                               th:id="benchDate"
                                               class="layui-input form-input input-dateSelect" required
                                               data-th-value='${#dates.format(entity?.benchDate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item" style="margin-bottom: 5px">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{AssetPlanNewsDefend001.assetTargetScale}">目标资产规模</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" th:id="assetTargetScale" th:name="assetTargetScale"
                                           data-th-value="${entity?.assetTargetScale}" maxlength=15 class="layui-input form-input text-number" placeholder="请输入" required/>
                                    <span class="input-right-show">万元</span>
                                </div>
                            </div>
                        </div>
                    </div>
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des" style="border-top: 1px solid #cccccc;">资产规划系列列表</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <!--<a id="AssetPlanNewsDefend002_btn_add"
                               class="layui-btn layui-btn-sm btn-create">添加</a>-->
                            <table class="layui-table" id="dataTable"></table>
                        </div>
                    </div>
                </div>
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">备注</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div>
                                    <label class="layui-form-label form-lable" style="width: 11.9%;">备注</label>
                                    <div class="layui-input-inline input-inline" style="width: 85%!important;">
											<textarea id="remark" name="remark" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" class="layui-textarea" data-th-text="${entity?.remark}"
                                                      maxlength="300"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="row text-center stepbar">
            <div class="text-center">
                <a id="AssetPlanNewsDefend002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                <a id="AssetPlanNewsDefend002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="AssetPlanNewsDefend002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript">
        var sysDate = /*[[${sysDate}]]*/'';
        var workflowId = /*[[${workflowId}]]*/'';
        var isInit = "YES";
    </script>
    <script data-th-src="@{/js/invest/product/productplanning/assetplannewsdefend/AssetPlanNewsDefend002.js}" type="text/javascript"></script>
</div>
</body>
</html>
