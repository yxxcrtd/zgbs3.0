<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinOpenPlanMaintenance001}">开放计划维护</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				<a id="FinOpenPlanMaintenance001_btn_submit"
					class="layui-btn layui-btn-sm btn-submit"
					data-th-text="#{SysCommon.submit}">提交</a> <a
					id="FinOpenPlanMaintenance001_btn_delete"
					class="layui-btn layui-btn-sm btn-delete"
					data-th-text="#{SysCommon.delete}">删除</a>
				<a th:if="${isEleShow['FinOpenPlanMaintenance001_btn_sendSale']} ne 'N'" id="FinOpenPlanMaintenance001_btn_sendSale" class="layui-btn layui-btn-sm">
					<i class="iconfont icon-execute"></i>
					<span data-th-text="#{FinProductOpenPlanAdjust001.sendInterf}">发送</span>
				</a>
				<!-- <a id="FinOpenPlanMaintenance001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{FinOpenPlanMaintenance001.newOpenPlan}">开放规则调整</a>  -->
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div style="display: none">
							<input type="text" id="finprodId" name="finprodId" 
							data-th-value="${entity?.finprodId}"/>
						</div>
						<div style="display: none">
							<input type="text" id="isCycle" name="isCycle" />
						</div>
						<div style="display: none">
							<input type="text" id="dealMode" name="dealMode" />
						</div>
						<div style="display: none">
							<input type="text" id="cashId" name="cashId" data-th-value="${entity?.cashId}" />
						</div>
						<div style="display: none">
							<input type="text" id="workflowId" name="workflowId" 
							data-th-value="${entity?.workflowId}" />
						</div>
						<div
							class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinOpenPlanMaintenance001.finprodId}">产品代码</label>
							<div class="layui-input-inline input-inline">
								<select id="finprodMarketId" name="finprodMarketId"
                                    required
									class="layui-input form-input input-select"
									data-th-placeholder="#{SysCommon.placeholder}" data-th-initValue="${entity?.finprodMarketId}"
									data-th-data-url="@{/invest/product/messageadjust/maintenance/FinOpenPlanMaintenance001/getFinprodId}"
									>
								</select>
							</div>
						</div>
                         <div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                                data-th-text="#{FinProductOpenPlanAdjust001.scheduleType}">计划类型</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="scheduletype" name="scheduletype"
                                    class="layui-input form-input input-select" 
                                    data-th-data-result='${SVR_PLAN_TYPE}' data-th-initValue="${scheduletype}"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                     required>
                                </select>
                            </div>
                        </div>
						<div th:if="${isEleShow['FinProductOpenPlanAdjust001_sendStatus']} ne 'N'"
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductOpenPlanAdjust001.sendStatus}">发送状态</label>
							<div class="layui-input-inline input-inline">
								<select name="sendStatus"
										id="sendStatus"
										class="layui-input form-input input-select"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-initValue='${entity?.sendStatus}'
										data-th-data-result="${SEND_STATUS}">
								</select>
							</div>
						</div>
					</div>
	                
				</form>
			</div>

			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script th:inline="javascript">
	           var isSendStatusTableShow = [[${isEleShow['send_status_table']}]];
	           var isSendStatusTableLinkShow = [[${isEleShow['send_status_table_link']}]];
	           var isSendRemarkTableShow = [[${isEleShow['send_remark_table']}]];
	           
	           var YES ='Y'; // 数据字典.是否_是
		</script>
		<script th:inline="javascript" type="text/javascript">
		    var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'';
			var DISPOSE_PATTERN_05 = /*[[${DISPOSE_PATTERN_05}]]*/'';
			var SCHEDULE_TYPE_01 = '01';
			var SCHEDULE_TYPE_02 = '02';
			var PROFIT_TYPE = '';
			var PROFIT_TYPE_01 = /*[[${PROFIT_TYPE_01}]]*/'01';
			var vdate = '';
			var OPEN_TYPE = '';
			var RANSOM_ISSUE_MODE_03=/*[[${RANSOM_ISSUE_MODE_03}]]*/'03';//申赎
			var SESSION_SYS_DATE = /*[[${SESSION_SYS_DATE}]]*/'';
			var scheduletype = /*[[${scheduletype}]]*/'';
        </script>
		<script data-th-src="@{/js/invest/product/messageadjust/maintenance/FinOpenPlanMaintenance001.js}"></script>
	</div>
</body>
</html>
