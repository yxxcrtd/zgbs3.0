<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>纳税增值税新建</title>
</head>

<body>

<div layout:fragment="content">
			<form class="layui-form" id="submitForm">
				<input type="text" name="totleTradeId" id="totleTradeId" th:value="${entity?.totleTradeId}" hidden>
			    <input type="text" name="finprodId" id="finprodId" th:value="${entity?.finprodId}" hidden>
				<input type="text" name="sumLine" id="sumLine" th:value="${entity?.sumLine}" hidden>
                <input type="hidden" id="payType" name="payType" data-th-value="${payType}"/>
                <div class="layui-form-item">
				 <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">类型</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="taxidenType" name="taxidenType" class="layui-input form-input input-select"
                          data-th-data-result="${PS}"
                          data-th-initvalue="${entity?.taxidenType?: C12}"
                          required></select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4" id="paytax">
					<label class="layui-form-label form-lable">纳税日期</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="payTaxVDate" name="payTaxVDate"
							class="layui-input form-input input-dateSelect" value=""
							data-th-value="${entity?.payTaxVDate}"
							placeholder="请选择日期"  required>
					</div>
				</div>
				<div class="layui-inline layui-col-md4" id="paytax2">
					<label class="layui-form-label form-lable">纳税结束日</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="payTaxMDate" name="payTaxMDate" childrenIds="portfolioId"
							class="layui-input form-input input-dateSelect" value=""
							data-th-value="${entity?.payTaxMDate}"
							placeholder="请选择日期"  required>
					</div>
				</div>
				<div class="layui-inline layui-col-md4" id="drawback" >
					<label class="layui-form-label form-lable">退税日期</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="refundTaxVDate" name="refundTaxVDate"
							class="layui-input form-input input-dateSelect" value=""
							data-th-value="${entity?.refundTaxVDate}"
							placeholder="请选择日期"  required>
					</div>
				</div>
				<div class="layui-inline layui-col-md4" id="drawback2" >
					<label class="layui-form-label form-lable">退税截止日期</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="refundTaxMDate" name="refundTaxMDate"
							class="layui-input form-input input-dateSelect" value=""
							data-th-value="${entity?.refundTaxMDate}"
							placeholder="请选择日期"  required>
					</div>
				</div>
              	</div>
                <div class="layui-form-item">
                     <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">增值税品种</label>
                           <div class="layui-input-inline input-inline">
                                <select id="taxClass" name="taxClass" childrenIds="portfolioId"
                                        class="layui-input form-input input-select"
                                        data-th-data-result="${TAX_CLASS}"
                                        allowClear="true" placeholder="请选择组合"
                                        data-th-initValue='${entity?.taxClass}' required>
                                </select>
                          </div>
                    </div>
                    
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable" data-th-text="|#{invest.channelId}#{ChannelAsset002.finprodIdBak}|">通道代码</label>
                           <div class="layui-input-inline input-inline">
                                <select id="channelId" name="channelId" childrenIds="portfolioId"
                                        class="layui-input form-input input-select"
                                        data-th-data-url="@{/invest/product/paythevatquery/PayTheVatQuery001/queryChannelIdInfo}"
                                        allowClear="true" placeholder="请选择通道"
                                        data-th-initValue='${entity?.channelId}' disabled>
                                </select>
                          </div>
                    </div>
                    
                    
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">组合代码</label>
                           <div class="layui-input-inline input-inline">
                                <select id="portfolioId" name="portfolioId" multiple
                                        class="layui-input form-input input-select" parentIds="channelId,payTaxMDate,taxClass"
                                        data-th-data-url="@{/invest/product/paythevatquery/PayTheVatQuery002/selectPortfolioId}"
                                        allowClear="true" placeholder="请选择组合"
                                        data-th-initValue='${entity?.portfolioId}' disabled>
                                </select>
                          </div>
                    </div>
                    
			    </div>
                 <div class="layui-form-item">
                      <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">币种</label>
                            <div class="layui-input-inline input-inline">
                                <select name="ccy" id="ccy" class="layui-input form-input input-select"
                                        data-th-placeholder="#{SysCommon.placeholder}"
                                        data-th-initValue='${entity?.ccy}'
                                        data-th-data-result="${CCY}" >
                                </select>
                            </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                         <a id="FinproductPayTheVatQuery002_btn_search" class="layui-btn layui-btn-sm btn-search" data-th-text="#{SysCommon.search}">查询</a>
                   </div>
                </div>
    			<div>
    				<table id="dataTable"></table>
    			</div>
			<!-- 划款信息 -->
            <div  class="pro-module-wrap net-product fund-product income-product" th:id="bussTrdTransferOrder_div" th:style="${payType == '02'?'display:none':''}" >
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">指令信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <input type="hidden" th:id="|bussTrdTransferOrder_payAcctNo|" th:name="selectValue" value="pay">
                            <input type="hidden" th:id="|bussTrdTransferOrder_recAcctNo|" th:name="selectValue" value="rec">
                            <a th:id="|bussTrdTransferOrder_btn_generate|" class="layui-btn layui-btn-sm" th:text="#{BussTrdTransferOrder.generate}" onclick="zd()">生成指令</a>
                        </div>
                        <table class="layui-table" th:id="|bussTrdTransferOrder_table|" th:name="bussTrdTransferOrder"></table>
                    </div>
                </div>
            </div>
            <!-- 交易备注 -->
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="title-des" th:text="#{FinproductPayTheVatQuery002.remark}">交易备注</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item" id= "remarkDiv">
                        <div class="layui-form-item">
                            <div class="layui-form-item">
                                <label class="layui-form-label form-label-wrap" style="width: 7.5%;">　</label>
                                <div class="layui-input-inline input-inline" style="width: 85%!important;">
                                    <textarea name="remark" id= "remark" maxlength="200" th:text="${entity?.remark}"
                                              class="layui-textarea" placeholder="请输入内容"
                                              th:placeholder="#{SysCommon.placeholder}"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
		</form>
		<input type="text" id="workflowId" name="workflowId" class="layui-input form-input" data-th-value="${workflowId}" disabled="disabled" style = "display:none;">
		<div class="layui-col-md11" style="margin: 50px;">
            <div class="text-center">
                <a id="FinproductPayTheVatQuery002_btn_save" class="layui-btn layui-btn-sm btn-save"
                   data-th-text="#{SysCommon.save}">保存</a>
                <a id="FinproductPayTheVatQuery002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                    data-th-text="#{SysCommon.submit}">提交</a>
                <a id="FinproductPayTheVatQuery002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                    data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
	</div>
</body>
<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">
	var YES_NO = /*[[${YES_OR_NO}]]*/'';
	var TAX_CLASS_01 = /*[[${TAX_CLASS_01}]]*/'';
	var TAX_CLASS_02 = /*[[${TAX_CLASS_02}]]*/'';
	var PAY_MODE_02 = /*[[${PAY_MODE_02}]]*/'';
	var payType = /*[[${payType}]]*/'';
    var portfolioIdOld = /*[[${entity?.portfolioId}]]*/'';//add by jiangpeng on 20210512 ZGBSSE-365
	var bussTrdTransferOrder = [[${entity?.bussTrdTransferOrder}]];
	var listpayTheVatQuery002TableDto = [[${entity?.listpayTheVatQuery002TableDto}]];
		function zd(){
	        	
	        }
		</script>
	<script data-th-src="@{/js/invest/product/paythevatquery/PayTheVatQuery002.js}" type="text/javascript"></script>	
</div>

</html>
