<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinSubmittedModule003}">附件模板添加</title>
    <style>
        .sub-wrap{
            width: 12%;
        }
        .input-inline{
            width: 80% !important;
        }
        .layui-upload-drag{
            width: 98%;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm">
            <div class="layui-form-item">
                <div>
                    <label class="layui-form-label form-lable sub-wrap"
                        data-th-text="#{FinSubmittedModule003.docType}">附件类型</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="docType" name="docType" class="layui-input form-input input-select"
                            data-th-data-result='${ATTACHMENT_TYPE}' formatoption="true" required="required"
                            allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-initValue='${entity?.docType}'>
                        </select>            
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div>
                    <label class="layui-form-label form-lable sub-wrap"
                        data-th-text="#{FinSubmittedModule003.tplType}">模板类型</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="tplType" name="tplType" required="required"
                        class="layui-input form-input input-checkbox" 
                        data-th-data-result='${TEMPLATE_TYPE}'
                        data-th-initValue='${entity?.tplType}'/>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div>
                    <label class="layui-form-label form-lable sub-wrap" data-th-text="#{FinSubmittedModule003.appendix}">上传附件</label>
                    <div class="layui-input-inline input-inline">
                         <div class="upload" id="appendix" required
                              th:disabled="${pageModel} eq ${pageModelReference}"
                              th:data-data='${attachmentFiles}'
                              data-option="{allowFileType: 'xls|xlsx|doc|pdf|pptx|txt|docx|ppt|ftl', callback: 'FinSubmittedModule003.onUploaded'}">
                    </div>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div>
                    <label class="layui-form-label form-lable sub-wrap"
                        data-th-text="#{FinSubmittedModule003.remark}" style="width: 11.9%;">备注</label>
                    <div class="layui-input-inline input-inline" style="width: 80%!important;">
                        <input type="text" class="layui-input form-input" placeholder="请输入内容" 
                        data-th-placeholder="#{SysCommon.placeholder}" id="remark" name="remark"
                        data-th-value="${entity?.remark}" th:maxlength="300">
                    </div>
                </div>
                <div style="display:none" class=" layui-col-md11  layui-col-sm11 layui-col-lg11">
                    <input type="text" id="seqno"
                        name="seqno" class="layui-input form-input" />
                </div>
            </div>
        </form>
        <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px 0 30px 0;">
            <div class="text-center">
                <a id="FinSubmittedModule003_btn_submit"
                    class="layui-btn layui-btn-sm btn-submit"
                    data-th-text="#{SysCommon.submit}">提交</a>
                <a id="FinSubmittedModule003_btn_cancel"
                    class="layui-btn layui-btn-sm btn-cancel"
                    data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/product/productelement/findisclosuremodule/finsubmittedmodule/FinSubmittedModule003.js}"
            type="text/javascript">
        </script>
        <script data-th-inline="javascript" type="text/javascript">
            var schemeId =/*[[${schemeId}]]*/'';
            var seqno =/*[[${seqno}]]*/'';
  </script>
    </div>
</body>
</html>
