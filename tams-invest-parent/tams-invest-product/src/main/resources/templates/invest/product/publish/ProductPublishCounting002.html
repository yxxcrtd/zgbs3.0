<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{ProductPublishCounting002}">发行规划试算-新建</title>
</head>

<body >
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
        	<div class="pro-module-wrapper pro-module-base">
        		<div class="pro-module-wrap">
        			<div class="pro-module">
        				<h3 class="pro-module-title">
                        	<span class="title-des">基本信息</span>（<span class="star-sign">*</span> 必填）
                        	<i class="iconfont icon-arrow-down pro-down-icon"></i>
                       	</h3>
                       	<div class="pro-module-item">
                       		<div class="layui-form-item">
                       			<div class="form-inline-wrap">
                       				<input type="text" id="pageModel" name="pageModel" class="layui-input form-input" data-th-value="${pageModel}" style = "display: none">
	                            	<label class="layui-form-label form-lable"
	                                	data-th-text="#{ProductPublishCounting002.prdIssueplanCode}">规划编号</label>
	                               	<div class="layui-input-inline input-inline">
	                                   	<input type="text" id="prdIssueplanCode" name="prdIssueplanCode"
	                                       	class="layui-input form-input" data-th-value="${entity?.prdIssueplanCode}" disabled=true />
	                               	</div>
                       			</div>
                       			<div class="form-inline-wrap">
                                   	<label class="layui-form-label form-lable"
                                       	data-th-text="#{ProductPublishCounting002.prdIssueplanName}">规划名称</label>
                                   	<div class="layui-input-inline input-inline">
                                       	<input type="text" id="prdIssueplanName" name="prdIssueplanName" required="required"
                                           	class="layui-input form-input" placeholder="请输入内容"
                                           	data-th-placeholder="#{SysCommon.placeholder}"
                                           	data-th-value="${entity?.prdIssueplanName}" maxlength="60" />
                                   	</div>
                               	</div>
                       		</div>
                       		<div class="layui-form-item">
                       			<div class="form-inline-wrap">
	                            	<label class="layui-form-label form-label-wrap"
										data-th-text="#{ProductPublishCounting002.vdate}">规划起始日</label>
									<div class="layui-input-inline input-inline">
										<input type="text" name="vdate" id="vdate"
											class="layui-input form-input input-dateSelect" required
											data-th-value="${#dates.format(entity?.vdate,'yyyy-MM-dd')}">
									</div>
                       			</div>
                       			<div class="form-inline-wrap">
                                   	<label class="layui-form-label form-label-wrap"
										data-th-text="#{ProductPublishCounting002.edate}">规划结束日</label>
									<div class="layui-input-inline input-inline">
										<input type="text" name="edate" id="edate"
											class="layui-input form-input input-dateSelect" required
											data-th-value="${#dates.format(entity?.edate,'yyyy-MM-dd')}">
									</div>
                               	</div>
                       		</div>
                    	</div>	
       				</div>
				<div class="pro-module-wrap">
					<div class="pro-module-wrap" >
						<div class="pro-module" >
							<h3 class="pro-module-title" >
								<span class="title-des" data-th-text="#{ProductPublishCounting002.prdPlanInfoTable}">产品系列列表</span>
								<i class="iconfont icon-arrow-down pro-down-icon"></i>
							</h3>
							<div class="pro-module-item" >
								<div class='table-wrap' style="height: 250px;overflow-y:auto">
									<table class="layui-table" id="prdPlanInfoTable" ></table>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="pro-module-wrap">
				<div class="pro-module">
					<h3 class="pro-module-title">
						<span class="title-des" data-th-text="#{ProductPublishCounting002.prdPlanConfigTable}">产品系列配置列表</span>
						<i class="iconfont icon-arrow-down pro-down-icon"></i>
					</h3>
					<div class="pro-module-item">
						<div class='table-wrap' id="prdPlanConfigDiv">
							<table class="layui-table" id="prdPlanConfigTable" ></table>
						</div>
					</div>
				</div>
			</div>
			</div>
			<div class="pro-module-wrap">
				<div class="pro-module">
					<h3 class="pro-module-title">
						<span class="title-des" data-th-text="#{ProductPublishCounting002.assetTable}">资产大类列表</span>
						<a id="ProductPublishCounting002_count" class="layui-btn layui-btn-sm"
						   style="margin-left: 60%;">试算</a>
						<i class="iconfont icon-arrow-down pro-down-icon"></i>
					</h3>
					<div class="pro-module-item" >
						<div class='table-wrap' >
							<table class="layui-table" id="assetTable"></table>
						</div>
					</div>
				</div>
			</div>
			<div class="pro-module-wrap">
				<div class="pro-module">
					<h3 class="pro-module-title"><span class="title-des">备注</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
					<div class="pro-module-item">
						<div class="layui-form-item">
							<div>
								<label class="layui-form-label form-lable" style="width: 11.9%;">备注</label>
								<div class="layui-input-inline input-inline" style="width: 85%!important;">
											<textarea id="remark" name="remark" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" class="layui-textarea" data-th-text="${entity?.remark}"
													  maxlength="300"></textarea>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 30px 0;">
                	<div class="text-center">
                    	<a id="ProductPublishCounting002_save" class="layui-btn layui-btn-sm btn-save"
                        	data-th-text="#{SysCommon.save}">保存</a>
                      	<a id="ProductPublishCounting002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                         	data-th-text="#{SysCommon.submit}">提交</a>
                      	<a id="ProductPublishCounting002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                         	data-th-text="#{SysCommon.cancel}">取消</a>
                  	</div>
              	</div>
        </form>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
       		var workflowId = /*[[${workflowId}]]*/'';
       		var ISSUE_PLAN_STRATEGY = /*[[${ISSUE_PLAN_STRATEGY}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/product/publish/ProductPublishCounting002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
