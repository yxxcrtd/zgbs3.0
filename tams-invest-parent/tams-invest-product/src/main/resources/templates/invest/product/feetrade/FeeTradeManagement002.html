<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{FeeTradeManagement002}">费用交易管理-新建</title>
</head>

<body >
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
        	<div class="pro-module-wrapper pro-module-base">
        		<div class="pro-module-wrap">
        			<div class="pro-module">
        				<h3 class="pro-module-title">
                        	<span class="title-des">基本信息</span>（<span class="star-sign">*</span> 必填）
                        	<i class="iconfont icon-arrow-down pro-down-icon"></i>
                       	</h3>
                       	<div class="pro-module-item">
                       		<div class="layui-form-item">
                       			<div class="form-inline-wrap">
                       				<input type="text" id="pageModel" name="pageModel" class="layui-input form-input" data-th-value="${pageModel}" style = "display: none">
                       				<input type="text" id="tradeId" name="tradeId" class="layui-input form-input" data-th-value="${entity?.tradeId}" style = "display: none">
                       				<input type="text" id="pageModel" name="pageModel" class="layui-input form-input" data-th-value="${pageModel}" style = "display: none">
	                            	<label class="layui-form-label form-lable"
	                                	data-th-text="#{FeeTradeManagement002.feeType}">费用类型</label>
	                               	<div class="layui-input-inline input-inline">
	                               		<select name="feeType" id="feeType"
                                            class="layui-input form-input input-select"
                                            data-th-initValue='${entity?.feeType}'
                                            data-th-data-result="${feeTypeSelect}" required>
                                        </select>
	                               	</div>
                       			</div>
                       			<div class="form-inline-wrap" id="registOrgDiv" style="display: none;">
                                   	<label class="layui-form-label form-lable"
                                       	data-th-text="#{FeeTradeManagement002.registOrg}">登记托管机构</label>
                                   	<div class="layui-input-inline input-inline">
                                   		<select name="registOrg" id="registOrg"
                                            class="layui-input form-input input-select"
                                            data-th-initValue='${entity?.registOrg}'
                                            data-th-data-result="${REGIST_ORG}" required>
                                        </select>
                                   	</div>
                               	</div>
                     			<div class="form-inline-wrap">
	                            	<label class="layui-form-label form-label-wrap"
										data-th-text="#{FeeTradeManagement002.payDate}">支付日期</label>
									<div class="layui-input-inline input-inline">
										<input type="text" name="payDate" id="payDate"
											class="layui-input form-input input-dateSelect" required
											data-th-value="${#dates.format(entity?.payDate,'yyyy-MM-dd')}">
									</div>
                       			</div>
                       			
                               	
                       		</div>
                       		<div class="layui-form-item">
                       			<div class=" form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FeeTradeManagement002.feeAmtTotal}">费用金额合计</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" data-fixtype="2" unit="1" data-th-data-textrange="2"
                                               class="layui-input form-input text-number" required="required" disabled="disabled"
                                               id="feeAmtTotal" name="feeAmtTotal" data-th-value="${entity?.feeAmtTotal}"/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class=" form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FeeTradeManagement002.shouldAmtTotal}">理论金额合计</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" data-fixtype="2" unit="1" data-th-data-textrange="2"
                                               class="layui-input form-input text-number" required="required" disabled="disabled"
                                               id="shouldAmtTotal" name="shouldAmtTotal" data-th-value="${entity?.shouldAmtTotal}"/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                       		</div>
                    	</div>	
       				</div>
       			</div>
			</div>
			<div class="pro-module-wrap">
				<div class="pro-module">
					<h3 class="pro-module-title">
						<span class="title-des" data-th-text="#{FeeTradeManagement002.feeTradeTable}">费用交易明细列表</span>
						<i class="iconfont icon-arrow-down pro-down-icon"></i>
					</h3>
					<div class="pro-module-item" >
						<div class='table-wrap' >
							<table class="layui-table" id="feeTradeTable"></table>
						</div>
					</div>
				</div>
			</div>
			<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 30px 0;">
               	<div class="text-center">
                   	<a id="FeeTradeManagement002_save" class="layui-btn layui-btn-sm btn-save"
                       	data-th-text="#{SysCommon.save}">保存</a>
                   	<a id="FeeTradeManagement002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                       	data-th-text="#{SysCommon.submit}">提交</a>
                   	<a id="FeeTradeManagement002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                       	data-th-text="#{SysCommon.cancel}">取消</a>
               	</div>
           	</div>
        </form>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
       		var workflowId = /*[[${workflowId}]]*/'';
       		var YES_OR_NO = /*[[${YES_OR_NO}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/product/feetrade/FeeTradeManagement002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
