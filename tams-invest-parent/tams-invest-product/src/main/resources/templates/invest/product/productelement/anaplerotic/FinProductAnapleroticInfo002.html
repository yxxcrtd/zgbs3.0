<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/default}">
<head>
	<title data-th-text="#{FinProductAnapleroticInfo002}">回补信息新建</title>
	<style>
		.rate-inline-wrapper .select2-container{
			width: 33%!important;
		}
	</style>
</head>
<body>
<div layout:fragment="content">
	<div class="pro-module-wrapper pro-module-base" style="border-top: none;">
		<input id="defalutApplyType" name="defalutApplyType" type="hidden" th:value="${defalutApplyType}">
		<input id="calendarId" name="calendarId" type="hidden" th:value="${calendarId}">
		<form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
			<input id="mdate" name="mDate" type="hidden" th:value="${mdate}">    <!-- 产品到期日 -->
			<input id="vdate" name="vdate" type="hidden" th:value="${vdate}">    <!-- 产品起息日 -->
			<input id="finprodAbbr" name="finprodAbbr" type="hidden" th:value="${entity?.finprodAbbr}">
			<input id="oriEffDate" name="oriEffDate" type="hidden" th:value="${entity?.effDateStr}">
			<input id ="anapleroticId" name='anapleroticId' type="hidden" th:value="${entity?.anapleroticId}">
			<input id ="isList" name='isList' type="hidden" th:value="${entity?.isList}">
			<input id ="isAnapleroticList" name='isAnapleroticList' type="hidden" th:value="${entity?.isAnapleroticList}">
			<input id ="operationType" name='operationType' type="hidden"  th:value="${operationType}">
			<input id ="dealMode" name='dealMode' type="hidden" th:value="${dealMode}">
			<input id ="openMode" name='openMode' type="hidden" th:value="${openMode}">
            <input id="workflowId" name="workflowId"  type="hidden" th:value="${entity?.workflowId}" >
			<div class="pro-module-wrap" id = "finprodInfoDiv">
				<div class="pro-module">
					<h3 class="pro-module-title">
						<span class="title-des">产品信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i>
					</h3>
					<div class="pro-module-item">
						<div class="layui-form-item">
							<div class="form-inline-wrap" id="finprodInfo">
								<label class="layui-form-label form-label-wrap" th:text="#{FinProductAnapleroticInfo.finprodId}">产品代码</label>
								<div class="layui-input-inline input-inline">
									<select id="finprodId" name="finprodId" class="layui-input form-input input-select"
											data-th-placeholder="#{SysCommon.placeholder}"
											allowClear="true"
											data-th-data-url="@{/invest/product/productelement/anaplerotic/FinProductAnapleroticInfo001/queryProdIdInfo}"
											data-th-initValue="${entity?.finprodId}">
									</select>
								</div>
							</div>
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap" th:text="#{FinProductAnapleroticInfo.effDate}">生效日</label>
								<div class="layui-input-inline input-inline">
									<input th:id="effDate"
										   th:name="effDate"
										   class="layui-input form-input input-dateSelect" placeholder="请选择时间"
										   th:placeholder="#{SysCommon.placeholder}"
										   th:value="${entity?.effDateStr} ?: ${vdate}" required />
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="pro-module-wrap">
				<div class="pro-module">
					<h3 class="pro-module-title">
						<span class="title-des">基本信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i>
					</h3>

					<div class="pro-module-item">
						<div class="layui-form-item">
							<!-- <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                    data-th-text="#{FinProductBuild002.isAnaplerotic}">是否回补</label>
                                <div class="layui-input-inline input-inline">
                                    <select name="isAnaplerotic"
                                        id="FinProductAnapleroticInfo002_isAnaplerotic"
                                        class="layui-input form-input input-select"
                                        data-th-placeholder="#{SysCommon.placeholder}"
                                        data-th-initValue='${entity?.isAnaplerotic}?:Y'
                                        data-th-allowClear=false
                                        data-th-data-result="${YES_OR_NO}" >
                                    </select>
                                </div>
                            </div> -->
							<div class="form-inline-wrap" id="anapleroticType_div">
								<label class="layui-form-label form-label-wrap" th:text="#{FinProductAnapleroticInfo.anapleroticType}">回补形式</label>
								<div class="layui-input-inline input-inline">
									<select  id="anapleroticType" name="anapleroticType" class="layui-input form-input input-select"
											 data-th-data-result="${ANAPLEROTIC_TYPE}"
											 th:initValue="${entity?.anapleroticType}"
											 data-th-childrenids="anapleroticRule"
											 data-th-placeholder="#{SysCommon.placeholder}"
											 required>
									</select>

								</div>
							</div>
							<div class="form-inline-wrap" id="anapleroticRule_div">
								<label class="layui-form-label form-label-wrap" th:text="#{FinProductAnapleroticInfo.anapleroticRule}">回补方式</label>
								<div class="layui-input-inline input-inline">
									<select name="anapleroticRule" id="anapleroticRule"
											class="layui-input form-input input-select"
											data-th-parentids="anapleroticType"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-data-result="${ANAPLEROTIC_RULE}"
											th:initValue="${entity?.anapleroticRule}" required>
									</select>
								</div>
							</div>
						</div>

						<div class="layui-form-item">
							<div class="form-inline-wrap" id="anapleroticRatio_div" >
								<label class="layui-form-label form-label-wrap" data-th-text="#{FinProductAnapleroticInfo.anapleroticRatio}">回补比例</label>
								<div class="layui-input-inline input-inline">
									<input type="text" name="anapleroticRatio" id="anapleroticRatio"
										   class="layui-input form-input text-number"
										   data-th-placeholder="#{SysCommon.placeholder}"
										   data-th-value="${entity?.anapleroticRatio ?:100}"
										   data-textrange="6" required>
									<span class="input-right-show">%</span>
								</div>
							</div>
							<div class="form-inline-wrap" id = "prodStyleDivId">
								<label class="layui-form-label form-label-wrap"
									   data-th-text="#{BussFinProductAnapleroticInfo.prodStyle}">适用款型</label>
								<div class="layui-input-inline input-inline">
									<select th:id="prodStyle" th:name="prodStyle"
											class="layui-input form-input input-select"
											th:initValue="${entity?.prodStyle}" searchable="false"
											placeholder="请输入内容" required
											data-th-data-result="${PROD_STYLE}"
											data-th-placeholder="#{SysCommon.placeholder}">
									</select>
								</div>
							</div>
							<div class="form-inline-wrap" id="anapleroticBasic_div">
								<label class="layui-form-label form-lable" data-th-text="#{FinProductAnapleroticInfo.anapleroticBasic}">计费基础</label>
								<div class="layui-input-inline input-inline">
									<select disabled="disabled"  id="anapleroticBasic" name="anapleroticBasic"
											class="layui-input form-input input-select"
											data-th-data-result='${BASIS}'
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-allowClear=false
											data-th-value='${anapleroticBasic}' required>
									</select>
								</div>
							</div>
							<!--  <div class="form-inline-wrap" id="astVluDateType_div" >
                                 <label class="layui-form-label form-label-wrap" th:text="#{FinProductAnapleroticInfo.astVluDateType}">资产净值日</label>
                                 <div class="layui-input-inline input-inline">
                                     <select id="astVluDateType"  name="astVluDateType"
                                         class="layui-input form-input input-select"
                                         data-th-data-result="${BASE_DATE_TYPE}"
                                         data-th-initValue="${entity?.astVluDateType}"
                                         placeholder="请输入内容"
                                         data-th-placeholder="#{SysCommon.placeholder}" required>
                                     </select>
                                 </div>
                             </div>-->
						</div>
					</div>
				</div>
			</div>
			<div class="pro-module-wrap">
				<div class="pro-module">
					<h3 class="pro-module-title">
						<span class="title-des">业绩基准信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i>
					</h3>

					<div class="pro-module-item">
						<div class="layui-form-item">
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									   th:text="#{BussBenchMarkInfo.rateType}"></label>
								<div class="layui-input-inline input-inline">
									<select th:id="rateType"
											th:name="rateType"
											class="layui-input form-input input-select"
											th:initValue="${entity_benchMark?.rateType}"
											data-th-data-result="${INT_TYPE}" searchable="false"
											placeholder="请输入内容" required
											data-th-placeholder="#{SysCommon.placeholder}">
									</select>
								</div>
							</div>
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									   th:text="#{BussBenchMarkInfo.rate}"></label>
								<div class="layui-input-inline input-inline">
									<input type="text" th:id="rate"
										   th:name="rate" length="5"
										   th:value="${entity_benchMark?.rate}"
										   class="layui-input form-input text-number"
										   data-textrange="4" />
								</div>
							</div>
						</div>
						<div class="layui-form-item">
							<div class="form-inline-wrap" style="width: 100% !important;">
								<label class="layui-form-label form-label-wrap"
									   style="width: 11.9% !important;"
									   th:text="|#{BussBenchMarkInfo.indexId}=|">浮动利率(%)=</label>
								<div class="layui-input-inline input-inline rate-inline-wrap2 rate-inline-wrapper"
									 style="width: 85% !important;">
									<select th:id="indexId"
											th:name="indexId"
											class="layui-input form-input input-select"
											th:initValue="${entity_benchMark?.indexId}"
											data-th-data-result="${INDEX_ID_SOURCE}" searchable="true"
											placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}">
									</select>
									<span class="rate-text"th:text="#{BussBenchMarkInfo.coefficient}"></span>
									<input type="text" th:id="coefficient"
										   th:name="coefficient" length="5"
										   th:value="${entity_benchMark?.coefficient}"
										   class="layui-input form-input text-number"
										   style="display: inline-block; width: 143px;"
										   data-textrange="2" />
									<span class="rate-text" th:text="#{BussBenchMarkInfo.spreadRate}"></span>
									<input
											type="text" th:id="spreadRate"
											th:name="spreadRate" length="5"
											th:value="${entity_benchMark?.spreadRate}"
											class="layui-input form-input text-number"
											style="display: inline-block; width: 180px;"
											data-textrange="4" />
								</div>
							</div>
						</div>
						<div class="layui-form-item">
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									   th:text="#{BussBenchMarkInfo.resetType}"></label>
								<div class="layui-input-inline input-inline">
									<select th:id="resetType"
											th:name="resetType"
											class="layui-input form-input input-select"
											th:initValue="${entity_benchMark?.resetType}"
											data-th-data-result="${EFFECTIVE_RULE}" searchable="false"
											placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}"
											required="required">
									</select>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="pro-module-wrap" id="anapleroticPlanInfo">
				<div class="pro-module">
					<h3 class="pro-module-title">
						<span class="title-des">回补要素</span><i class="iconfont icon-arrow-down pro-down-icon"></i>
					</h3>
					<div class="pro-module-item">
						<div class="layui-form-item">
							<!-- <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" th:text="#{FinProductAnapleroticInfo.anapleroticFrequency}" >回补规则</label>
                                <div class="layui-input-inline input-inline">
                                      <select id="anapleroticFrequency"  name="anapleroticFrequency"
                                        class="layui-input form-input input-select"
                                        th:initValue="${entity?.anapleroticFrequency}"
                                        data-th-data-result="${FREQUENCY_UNIT}"
                                        placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}" required>
                                      </select>
                                </div>
                            </div>-->
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap" th:text="#{FinProductAnapleroticInfo.firstAnapleroticDate}">首次回补日</label>
								<div class="layui-input-inline input-inline">
									<input th:id="firstAnapleroticDate"
										   th:name="firstAnapleroticDate"
										   class="layui-input form-input input-dateSelect" placeholder="请选择时间"
										   th:placeholder="#{SysCommon.placeholder}"
										   th:value='${#dates.format(entity?.firstAnapleroticDate,"yyyy-MM-dd")}'
									>
								</div>
							</div>
							<div class="form-inline-wrap">
								<!-- <input th:id="firstAnapleroticCycleBegDate" th:name="firstAnapleroticCycleBegDate" 	th:value='${#dates.format(entity?.firstAnapleroticCycleBegDate,"yyyy-MM-dd")}' type="hidden"> -->
								<label class="layui-form-label form-label-wrap" th:text="#{FinProductAnapleroticInfo.anapleroticEndDate}">回补计提结束日</label>
								<div class="layui-input-inline input-inline">
									<input th:id="anapleroticEndDate"
										   th:name="anapleroticEndDate" disabled = "disabled"
										   class="layui-input form-input input-dateSelect" placeholder="请选择时间"
										   th:placeholder="#{SysCommon.placeholder}"
										   th:value='${#dates.format(entity?.anapleroticEndDate,"yyyy-MM-dd")}'
									>
								</div>
							</div>
						</div>
						<div class="layui-form-item">
							<!-- <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" th:text="#{FinProductAnapleroticInfo.cycleTdayRule}">周期营业日准则</label>
                                <div class="layui-input-inline input-inline">
                                        <select th:id="cycleTdayRule"
                                            th:name="cycleTdayRule"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            data-th-data-result="${TDAY_RULE}"
                                            th:initValue="${entity?.cycleTdayRule}">
                                        </select>
                                    </div>
                            </div> -->
							<div class="form-inline-wrap" style="display:none">
								<label class="layui-form-label form-label-wrap" th:text="#{FinProductAnapleroticInfo.firstAnapleroticCycleEndDate}">首次回补周期结束日</label>
								<div class="layui-input-inline input-inline">
									<input th:id="firstAnapleroticCycleEndDate"
										   th:name="firstAnapleroticCycleEndDate"
										   class="layui-input form-input input-dateSelect" placeholder="请选择时间"
										   th:placeholder="#{SysCommon.placeholder}"
										   th:value='${#dates.format(entity?.firstAnapleroticCycleEndDate,"yyyy-MM-dd")}'
									>
								</div>
							</div>
							<div class="form-inline-wrap"  id = 'firstAnapleroticCycleStrDateDiv'>
								<label class="layui-form-label form-label-wrap" th:text="#{FinProductAnapleroticInfo.firstAnapleroticCycleBegDate}">首次回补周期开始日</label>
								<div class="layui-input-inline input-inline">
									<input th:id="firstAnapleroticCycleBegDate"
										   th:name="firstAnapleroticCycleBegDate"
										   class="layui-input form-input input-dateSelect" placeholder="请选择时间"
										   th:placeholder="#{SysCommon.placeholder}"
										   th:value='${#dates.format(entity?.firstAnapleroticCycleBegDate,"yyyy-MM-dd")}'
									>
								</div>
							</div>
						</div>
						<!-- <div class="layui-form-item">
                                <div style="padding-left: 10px;">
                                    <a th:id="FinProductAnapleroticInfo_btn_preview" class="layui-btn layui-btn-sm" data-icon="iconfont icon-search">计划生成</a>
                                </div>
                                <table class="layui-table" th:id="finProductAnapleroticPlanTable" th:name="finProductAnapleroticPlanList"></table>
                        </div> -->
					</div>
				</div>
			</div>
			<div class="pro-module-wrap">
				<div class="pro-module">
					<h3 class="pro-module-title"><span class="title-des">回补说明</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
					<div class="pro-module-item">
						<div class="layui-form-item">
							<label class="layui-form-label form-lable" style="width: 11.9%!important;" th:text="#{FinProductAnapleroticInfo.remarkAnapleroticInfo}">回补说明</label>
							<div class="layui-input-inline input-inline" style="width: 85%!important;">
				                           <textarea id="remark" name="remark" placeholder="请输入内容"
													 data-th-placeholder="#{SysCommon.placeholder}" maxlength="300"
													 class="layui-textarea" data-th-text="${entity?.remark}">
				                           </textarea>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 40px 0 30px 0;">
				<div class="text-center">
					<a id="FinProductAnapleroticInfo002_btn_save" class="layui-btn layui-btn-sm btn-save"
					   data-th-text="#{SysCommon.save}">保存</a>
					<a id="FinProductAnapleroticInfo002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
					   data-th-text="#{SysCommon.submit}">提交</a>
					<a id="FinProductAnapleroticInfo002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
					   data-th-text="#{SysCommon.cancel}">取消</a>
				</div>
			</div>
		</form>
	</div>
</div>
<div layout:fragment="script">
	<script th:inline="javascript" type="text/javascript">
		var applyType = [[${applyType}]];
		var finprodMarketId = [[${finprodMarketId}]];
		var workflowId = [[${workflowId}]];
		var finProductAnapleroticPlan = [[${entity?.finProductAnapleroticPlanList}]];
		var INT_TYPE_AP_01  = /*[[${INT_TYPE_AP_01}]]*/'';
		var DISPOSE_PATTERN_11 = /*[[${DISPOSE_PATTERN_11}]]*/'';
		var dealMode = /*[[${dealMode}]]*/'';
		var PROD_STYLE = /*[[${PROD_STYLE}]]*/'';
		var PRODSTYLE = /*[[${entity?.prodStyle}]]*/'';
		var firstAnapleroticCycleBegDate  = /*[[${entity?.firstAnapleroticCycleBegDate}]]*/'';
		var anapleroticList  = /*[[${anapleroticList}]]*/'';
		var quickInputAnapleroticFlag  = /*[[${quickInputAnapleroticFlag}]]*/'';
		var parentId  = /*[[${parentId}]]*/'';
	</script>
	<script data-th-src="@{/js/invest/product/productelement/anaplerotic/FinProductAnapleroticInfo002.js}"type="text/javascript"></script>
</div>
</body>

</html>
