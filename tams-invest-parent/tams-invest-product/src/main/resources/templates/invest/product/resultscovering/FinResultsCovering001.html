<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{FinResultsCovering001}">业绩回补</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="form-button-area">
          <a id="FinResultsCovering001_btn_add" class="layui-btn layui-btn-sm btn-create" 
          data-th-text="#{SysCommon.create}">新建</a>
            <a id="FinResultsCovering001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke" >
            <i class="iconfont icon-revoke"></i>
           <span data-th-text="#{FinResultsCovering001.revoke}">撤销</span></a>  
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{FinResultsCovering001.prodId}">产品代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="prodId" name="prodId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-childrenIds="layFinprodId"
                                formatoption = "true" 
                                data-th-data-url="@{/invest/product/resultscovering/FinResultsCovering001/queryProdIdInfo}"
                                multiple="true" >
                             </select>
                        </div>
                    </div>
                    
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{FinResultsCovering001.prodStyle}">产品款型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="layFinprodId" name="layFinprodId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-parentIds="prodId"
                                data-th-data-url="@{/invest/product/resultscovering/FinResultsCovering001/queryProdStyleInfo}"
                                multiple="true" >
                             </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{FinResultsCovering001.coveringDate}">回补日</label>
                        <div class="layui-input-inline input-inline">
                            <input  id="coveringDate" name="coveringDate"
                                class="layui-input form-input input-dateRangeSelect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" >
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                	<div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                		<label class="layui-form-label form-lable" data-th-text="#{FinResultsCovering001.coveringWay}">回补方式</label>
                		<div class="layui-input-inline input-inline">
                			<select id="coveringWay" name="coveringWay"
									class="layui-input form-input input-select" placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result="${ANAPLEROTIC_RULE}">
							</select>
                		</div>
                	</div>
                
                	<div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                		<label class="layui-form-label form-lable" data-th-text="#{FinResultsCovering001.coveringForm}">回补形式</label>
                		<div class="layui-input-inline input-inline">
                			<select id="coveringForm" name="coveringForm"
									class="layui-input form-input input-select" placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result="${ANAPLEROTIC_TYPE}">
							</select>
                		</div>
                	</div>
                	
                	<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinResultsCovering001.effectStatus}">有效状态</label>
							<div class="layui-input-inline input-inline">
								<select id="tradeStatus" name="tradeStatus"
									class="layui-input form-input input-select"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result="${STATUS_VALID}">
								</select>
							</div>
					</div> 
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/product/resultscovering/FinResultsCovering001.js}" type="text/javascript"></script>
        <script data-th-inline="javascript" type="text/javascript">
			var coveringDate = /*[[${coveringDate}]]*/;
		</script>
    </div>

</body>

</html>
