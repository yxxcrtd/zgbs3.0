<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinFloatMgtExpQuotation002}">浮动管理费报价管理-新建</title>
<style>
.rate-inline-wrapper .select2-container{
width: 33%!important;
}
</style>
</head>
<body>
    <div layout:fragment="content">
        <div class="">
             <div class="pro-module-wrapper pro-module-base" style="border-top: none;">
                <form class="layui-form joyin-form-wrap pro-module-form" id="FinFloatMgtExpQuotation002_form">
                        <div class="pro-module-wrap">
                            <div class="pro-module">
                                <h3 class="pro-module-title" style="border-top: 1px solid #cccccc;">
                                    <span class="title-des">产品信息</span>
                                    <i class="iconfont icon-arrow-down pro-down-icon"></i>
                                </h3>
                                <input type="hidden" id="pFinprodId" name="pFinprodId" />
                                <input type="hidden" id="dealMode" name="dealMode" data-th-value="${entity?.dealMode}"/>
                                <input type="hidden" id="baseRuleId" name="baseRuleId" data-th-value="${entity_benchMark?.baseRuleId}"/>
                                <div class="pro-module-item">
                                    <div class="layui-form-item">
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-lable"
                                                data-th-text="#{FinFloatMgtExpQuotation002.finprodId}">产品代码</label>
                                            <div class="layui-input-inline input-inline">
                                                <select id="finprodId" name="finprodId"
                                                    class="layui-input form-input input-select"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initvalue="${entity?.finprodId}" formatoption=false
                                                    data-th-data-url="@{/invest/product/messageadjust/finfloatmgtexpquotation/FinFloatMgtExpQuotation002/getFinprodId}"
                                                    required>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-lable"
                                                data-th-text="#{FinFloatMgtExpQuotation001.finprodAbbr}">产品简称</label>
                                            <div class="layui-input-inline input-inline">
                                                <input type="text" id="finprodAbbr" name="finprodAbbr"
                                                    disabled=true
                                                    data-th-value="${entity?.finprodAbbr}"
                                                    class="layui-input form-input" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}" required>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                            <label class="layui-form-label form-lable"
                                                data-th-text="#{FinFloatMgtExpQuotation002.effDate}">生效日</label>
                                            <div class="layui-input-inline input-inline">
                                                <input type="text" id="effDate" name="effDate"
                                                    class="layui-input form-input input-dateSelect"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-value='${#dates.format(entity?.effDate,"yyyy-MM-dd")}' required />
                                            </div>
                                        </div>
                                    </div>
                                    <div class="layui-form-item">
                                       <div class="form-inline-wrap">
                                            <label class="layui-form-label form-lable"
                                            data-th-text="#{FinFloatMgtExpQuotation002.prodStyle}">适用款型</label>
                                            <div class="layui-input-inline input-inline">
                                                <select id="prodStyle" name="prodStyle"
                                                    class="layui-input form-input input-select"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initvalue="${entity?.prodStyle}" 
                                                    formatoption=false
                                                    data-th-data-result='${PROD_STYLE}'
                                                    required>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="form-inline-wrap">
                                      		<label class="layui-form-label form-lable"
                                     		 data-th-text="#{FinFloatMgtExpQuotation002.investmentCycle}">投资周期（天）</label>
                                      		<div class="layui-input-inline input-inline">
	                                          	<select id="investmentCycle" name="investmentCycle"
	                                              class="layui-input form-input input-select"
	                                              data-th-placeholder="#{SysCommon.placeholder}"
	                                              formatoption=false
	                                              data-th-data-result='${INVESTMENT_CYCLE}'
	                                              required>
	                                          	</select>
                                      		</div>
                                      		<input type="text" id="investmentCycleText" name="investmentCycleText" class="layui-input form-input" data-th-value="${entity?.investmentCycleText}" style = "display: none">
                                  		</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div class="pro-module-wrap">
                            <div class="pro-module">
                                <h3 class="pro-module-title" style="border-top: 1px solid #cccccc;">
                                    <span class="title-des">计提信息</span>
                                    <i class="iconfont icon-arrow-down pro-down-icon"></i>
                                </h3>
                                <div class="pro-module-item">
                                    <div class="layui-form-item">
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-lable"
                                                data-th-text="#{FinFloatMgtExpQuotation002.feeName}">费用名称</label>
                                            <div class="layui-input-inline input-inline">
                                                <select id="feeName" name="feeId"
                                                    class="layui-input form-input input-select"
                                                    data-th-initvalue="${entity?.feeId}"
                                                    data-th-data-url="@{/invest/product/messageadjust/finfloatmgtexpquotation/FinFloatMgtExpQuotation002/getFeeInfo}"
                                                    required>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-lable"
                                                data-th-text="#{FinFloatMgtExpQuotation002.basicBill}">计费基数</label>
                                            <div class="layui-input-inline input-inline">
                                                <select id="basicBill" name="basicBill" disabled
                                                    class="layui-input form-input input-select"
                                                    data-th-data-result='${BILL_BASE_FEE_KIND}'
                                                    data-th-initvalue="${entity?.basicBill}" required>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-lable"
                                                data-th-text="#{FinFloatMgtExpQuotation002.basic}">计费基础</label>
                                            <div class="layui-input-inline input-inline">
                                                <select id="basic" name="basis" disabled
                                                    class="layui-input form-input input-select"
                                                    data-th-data-result='${BASIS}'
                                                    data-th-initvalue="${entity?.basis}" required>
                                                </select>
                                            </div>
                                        </div>    
                                    </div>
                                    <div class="layui-form-item">
                                        <!-- <div class="form-inline-wrap">
                                            <label class="layui-form-label form-lable"
                                                data-th-text="#{FinFloatMgtExpQuotation002.astVdateType}">资产净值日</label>
                                            <div class="layui-input-inline input-inline">
                                                <select id="astVdateType" name="astVdateType"
                                                    class="layui-input form-input input-select"
                                                    data-th-data-result='${BASE_DATE_TYPE}'
                                                    data-th-initvalue="${entity?.astVdateType}" required>
                                                </select>
                                            </div>
                                        </div> -->
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-lable"
                                                data-th-text="#{FinFloatMgtExpQuotation002.fAccrDate}">首次计提日</label>
                                            <div class="layui-input-inline input-inline">
                                                <input type="text" id="fAccrDate" name="fAccrDate"
                                                    class="layui-input form-input input-dateSelect"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-value='${#dates.format(entity?.fAccrDate,"yyyy-MM-dd")}'
                                                    required />
                                            </div>
                                        </div>
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-lable"
                                                data-th-text="#{FinFloatMgtExpQuotation002.eAccrDate}">计提结束日</label>
                                            <div class="layui-input-inline input-inline">
                                                <input type="text" id="eAccrDate" name="eAccrDate"
                                                    class="layui-input form-input input-dateSelect"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-value='${#dates.format(entity?.eAccrDate,"yyyy-MM-dd")}'
                                                    required />
                                            </div>
                                        </div>    
                                    </div>
                                    <div class="layui-form-item">
                                        <div class="form-inline-wrap" style="display:none;">
                                            <label class="layui-form-label form-lable"
                                                data-th-text="#{FinFloatMgtExpQuotation002.baseRule}">业绩基准规则</label>
                                            <div class="layui-input-inline input-inline">
                                                <select id="baseRule" name="baseRule"
                                                    class="layui-input form-input input-select"
                                                    data-th-data-result='${FLOAT_CALC_RULE}'
                                                    data-th-initvalue='${entity?.baseRule} ?: ${FLOAT_CALC_RULE_01}' 
                                                    required>
                                                </select>
                                            </div> 
                                        </div>
                                        <!--  <div class="form-inline-wrap">
                                            <label class="layui-form-label form-lable"
                                                data-th-text="#{FinFloatMgtExpQuotation002.accrType}">计提方式</label>
                                            <div class="layui-input-inline input-inline">
                                                <select id="accrType" name="accrType"
                                                    class="layui-input form-input input-select"
                                                    data-th-data-result='${DRAW_TYPE}'
                                                    data-th-initvalue="${entity?.accrType}" required>
                                                </select>
                                            </div>
                                        </div>-->
                                        <!--  <div class="form-inline-wrap">
                                            <label class="layui-form-label form-lable"
                                                data-th-text="#{FinFloatMgtExpQuotation002.intervalRule}">区间规则</label>
                                            <div class="layui-input-inline input-inline">
                                                <select id="intervalRule" name="intervalRule"
                                                    class="layui-input form-input input-select"
                                                    data-th-data-result='${FREQUENCY_UNIT}'
                                                    data-th-initvalue="${entity?.intervalRule}" required>
                                                </select>
                                            </div>
                                        </div>-->
                                        <!--  <div class="form-inline-wrap">
                                            <label class="layui-form-label form-lable"
                                                data-th-text="#{FinFloatMgtExpQuotation002.fAccrEndDate}">首个计提区间结束日</label>
                                            <div class="layui-input-inline input-inline">
                                                <input type="text" id="fAccrEndDate" name="fAccrEndDate"
                                                    class="layui-input form-input input-dateSelect"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-value='${#dates.format(entity?.fAccrEndDate,"yyyy-MM-dd")}'
                                                    required />
                                            </div>
                                        </div>-->
                                    </div>
                                    <div class="layui-form-item">
                                            <!--  <div class="form-inline-wrap">
                                            <label class="layui-form-label form-lable" data-th-text="#{FinFloatMgtExpQuotation002.relaeseDate}">报价日</label>
                                            <div class="layui-input-inline input-inline">
                                                <input type="text" id="relaeseDate" name="relaeseDate" class="layui-input form-input input-dateSelect" 
                                                    data-th-placeholder="#{SysCommon.placeholder}" data-th-value='${#dates.format(entity?.relaeseDate,"yyyy-MM-dd")}' required/>
                                            </div>
                                        </div> -->
                                        <!--  <div class="form-inline-wrap">
                                            <label class="layui-form-label form-lable"
                                                data-th-text="#{FinFloatMgtExpQuotation002.accrTdayRule}">计提营业日准则</label>
                                            <div class="layui-input-inline input-inline">
                                                <select id="accrTdayRule" name="accrTdayRule"
                                                    class="layui-input form-input input-select"
                                                    data-th-data-result='${TDAY_RULE}'
                                                    data-th-initvalue="${entity?.accrTdayRule}" required>
                                                </select>
                                            </div>
                                        </div>-->
                                    </div>
                                </div>
                            </div>
                        </div>          
                        <div class="pro-module-wrap">
                            <div class="pro-module">
                                <h3 class="pro-module-title" style="border-top: 1px solid #cccccc;">
                                    <span class="title-des">支付信息</span>
                                    <i class="iconfont icon-arrow-down pro-down-icon"></i>
                                </h3>
                                <div class="pro-module-item">
                                    <div class="layui-form-item">
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-lable"
                                                data-th-text="#{FinFloatMgtExpQuotation002.payCycle}">付费规则</label>
                                            <div class="layui-input-inline input-inline">
                                                <select id="payCycle" name="payCycle"
                                                    class="layui-input form-input input-select"
                                                    data-th-data-result='${FREQUENCY_UNIT}'
                                                    data-th-initvalue="${entity?.payCycle}" required>
                                                </select>
                                            </div>
                                        </div>
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-lable"
                                                data-th-text="#{FinFloatMgtExpQuotation002.firstPayDate}">首次付费日</label>
                                            <div class="layui-input-inline input-inline">
                                                <input type="text" id="firstPayDate" name="firstPayDate"
                                                    class="layui-input form-input input-dateSelect"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-value='${#dates.format(entity?.firstPayDate,"yyyy-MM-dd")}'
                                                    required />
                                            </div>
                                        </div>    
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-lable"
                                                data-th-text="#{FinFloatMgtExpQuotation002.endTdayRule}">计费营业日准则</label>
                                            <div class="layui-input-inline input-inline">
                                                <select id="endTdayRule" name="endTdayRule"
                                                    class="layui-input form-input input-select"
                                                    data-th-data-result='${TDAY_RULE}'
                                                    data-th-initvalue="${entity?.endTdayRule}" required>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="layui-form-item">
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-lable"
                                                data-th-text="#{FinFloatMgtExpQuotation002.payTdayRule}">付费营业日准则</label>
                                            <div class="layui-input-inline input-inline">
                                                <select id="payTdayRule" name="payTdayRule"
                                                    class="layui-input form-input input-select"
                                                    data-th-data-result='${TDAY_RULE}'
                                                    data-th-initvalue="${entity?.payTdayRule}" required>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title"
								style="border-top: 1px solid #cccccc;">
								<span class="title-des">业绩基准信息</span> <i
									class="iconfont icon-arrow-down pro-down-icon"></i>
							</h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											th:text="#{BussBenchMarkInfo.rateType}"></label>
										<div class="layui-input-inline input-inline">
											<select th:id="rateType"
												th:name="rateType"
												class="layui-input form-input input-select"
												th:initValue="${entity_benchMark?.rateType}"
												data-th-data-result="${INT_TYPE}" searchable="false"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											th:text="#{BussBenchMarkInfo.rate}"></label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="rate"
												th:name="rate" length="5"
												th:value="${entity_benchMark?.rate}"
												class="layui-input form-input text-number"
												data-textrange="4" />
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap" style="width: 100% !important;">
										<label class="layui-form-label form-label-wrap"
											style="width: 11.9% !important;"
											th:text="|#{BussBenchMarkInfo.indexId}=|">浮动利率(%)=</label>
										<div class="layui-input-inline input-inline rate-inline-wrap rate-inline-wrapper"
											style="width: 85% !important;">
											<select th:id="indexId"
												th:name="indexId"
												class="layui-input form-input input-select"
												th:initValue="${entity_benchMark?.indexId}"
												data-th-data-result="${INDEX_ID_SOURCE}" searchable="true"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}">
											</select> 
											<span class="rate-text"th:text="#{BussBenchMarkInfo.coefficient}"></span> 
											<input type="text" th:id="coefficient"
												th:name="coefficient" length="5"
												th:value="${entity_benchMark?.coefficient}"
												class="layui-input form-input text-number"
												style="display: inline-block; width: 143px;"
												data-textrange="2" /> 
											<span class="rate-text" th:text="#{BussBenchMarkInfo.spreadRate}"></span>
											 <input
												type="text" th:id="spreadRate"
												th:name="spreadRate" length="5"
												th:value="${entity_benchMark?.spreadRate}"
												class="layui-input form-input text-number"
												style="display: inline-block; width: 180px;"
												data-textrange="4" />
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											th:text="#{BussBenchMarkInfo.resetType}"></label>
										<div class="layui-input-inline input-inline">
											<select th:id="resetType"
												th:name="resetType"
												class="layui-input form-input input-select"
												th:initValue="${entity_benchMark?.resetType}"
												data-th-data-result="${EFFECTIVE_RULE}" searchable="false"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												required="required">
											</select>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="pro-module-wrap">
                            <div class="pro-module">
                                <h3 class="pro-module-title" style="border-top: 1px solid #cccccc;">
                                    <span class="title-des">超额收益分层</span>
                                    <i class="iconfont icon-arrow-down pro-down-icon"></i>
                                </h3>
                                <div class="pro-module-item">
                                    <div id="FinFloatMgtExpQuotation002_div_layering">
                                        <table class="layui-table" id="dataTable"></table>
                                    </div>
                                    <div style="display: none;" class="layui-input-inline input-inline">
                                        <input type="text" id="workflowId" name="workflowId"
                                            class="layui-input form-input" data-th-value="${workflowId}"
                                            disabled=true />
                                    </div>
                                    <div style="display: none;" class="layui-input-inline input-inline">
                                        <input type="text" id="effDateOld" name="effDateOld"
                                            class="layui-input form-input" data-th-value="${effDateOld}"
                                            disabled=true />
                                    </div>
                                    <div style="display: none;" class="layui-input-inline input-inline">
                                        <input type="text" id="cashId" name="cashId" class="layui-input form-input"
                                            data-th-value="${entity?.cashId}" disabled=true />
                                    </div>
                                    <div style="display: none;" class="layui-input-inline input-inline">
                                        <input type="text" id="lev" name="lev" class="layui-input form-input"
                                            data-th-value="${entity?.lev}" disabled=true />
                                    </div>
                                </div>
                            </div>
                        </div>  
                                    
                        <div class="pro-module-wrap">
                            <div class="pro-module">
                                <h3 class="pro-module-title">
                                    <span class="title-des">备注信息</span>
                                    <i class="iconfont icon-arrow-down pro-down-icon"></i>
                                </h3>
                                <div class="pro-module-item">
                                    <div class="layui-form-item">
                                        <label class="layui-form-label form-lable" style="width: 11.9%;">备注</label>
                                        <div class="layui-input-inline input-inline"
                                            style="width: 85% !important;">
                                            <textarea id="remark" name="remark" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                class="layui-textarea" data-th-text="${entity?.remark}"
                                                maxlength="200">
                                            </textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                </form>
                </div>
                <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
                    <div class="text-center">
                        <a id="FinFloatMgtExpQuotation002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                        <a id="FinFloatMgtExpQuotation002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="FinFloatMgtExpQuotation002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </div>
            
        </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
            var CLIENT_RANK = /*[[${CLIENT_RANK}]]*/'';
            var PROD_STYLE = /*[[${entity?.prodStyle}]]*/'';
			var DEAL_MODE_10 = /*[[${DEAL_MODE_10}]]*/;
			var DEAL_MODE_11 = /*[[${DEAL_MODE_11}]]*/;
			var INVESTMENT_CYCLE = /*[[${entity?.investmentCycle}]]*/'';
			var entityName = /*[[${entityName}]]*/'';
			var INT_TYPE_01  = /*[[${INT_TYPE_01}]]*/''
	        var FREQUENCY_UNIT_08 = /*[[${FREQUENCY_UNIT_08}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/product/messageadjust/finfloatmgtexpquotation/FinFloatMgtExpQuotation002.js}"></script>
    </div>
