<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{OccupyQuery001}">非标额度占用查询</title>
</head>
<body>
<div layout:fragment="content">
	<div class="form-button-area"></div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
            	<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{OccupyQuery001.queryDay}">查询日</label>
                    <div class="layui-input-inline input-inline">
                    <input type="text" id="queryDay" name="queryDay" 
									class="layui-input form-input input-dateSelect"
									data-th-value="${#dates.format(queryDay,'yyyy-MM-dd')}" required/>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{OccupyQuery001.queryCaliber}">查询口径</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="queryCaliber" name="queryCaliber" 
									class="layui-input form-input input-select" allowClear="false"
									formatoption=false 
									data-th-data-result="${QUERY_CALIBER}"
									data-th-initValue="${QUERY_CALIBER_ALL}" required>
						</select>
                    </div>
               </div>
       		</div>
        </form>
    </div>
    <div id ="queryAll">
        <table class="layui-table" id="dataTableAll"></table>
    </div>
    <div id ="queryByProdSeries">
        <table class="layui-table" id="dataTableProdSeries"></table>
    </div>
</div>
<div layout:fragment="script">
	<script type="text/javascript" data-th-inline="javascript">
		var QUERY_CALIBER_ALL = /*[[${QUERY_CALIBER_ALL}]]*/; //全部查询
		var QUERY_CALIBER_PRODSERIES = /*[[${QUERY_CALIBER_PRODSERIES}]]*/; //按产品系列查询
		var platDate = /*[[${platDate}]]*/; //平台时间戳
	</script>
    <script data-th-src="@{/js/invest/product/nolimit/occupy/OccupyQuery001.js}" type="text/javascript"></script>
</div>
</body>

</html>
