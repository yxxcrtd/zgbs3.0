<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{FinProductFeaAna001}">可行性分析</title>
</head>
<body>
    <div class="pro-module-wrap">
        <div layout:fragment="content">
            <div class="pro-module-wrapper pro-module-base" style="border-top: none;">
                <form class="layui-form joyin-form-wrap pro-module-form" id="FinProductFeaAna002_Form">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title"><span class="title-des" style="border-top: 1px solid #cccccc;">基本信息</span><i
                                    class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{FinProductFeaAna002.requirementId}">需求编号</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="requirementId" id="FinProductFeaAna002_requirementId"
                                                   class="layui-input form-input" maxlength=60
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value='${entity?.requirementId}'
                                                   disabled = "disabled" required>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{FinProductFeaAna002.tarCustomer}">发行对象</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="tarCustomer" id="FinProductFeaAna002_tarCustomer"
                                                   class="layui-input form-input" maxlength=60
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value='${entity?.tarCustomer}'
                                                   disabled = "disabled" >
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{FinProductFeaAna002.prdScale}">规模</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="prdScale" id="FinProductFeaAna002_prdScale"
                                                   class="layui-input form-input" maxlength=60
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value='${entity?.prdScale}'
                                                   disabled = "disabled" >
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{FinProductFeaAna002.prdPeriod}">期限</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="prdPeriod" id="FinProductFeaAna002_prdPeriod"
                                                   class="layui-input form-input" maxlength=60
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value='${entity?.prdPeriod}'
                                                   disabled = "disabled" >
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{FinProductFeaAna002.prdRate}">收益率</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="prdRate" id="FinProductFeaAna002_prdRate"
                                                   class="layui-input form-input" maxlength=60
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value='${entity?.prdRate}'
                                                   disabled = "disabled" >
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{FinProductFeaAna002.prdRequirementDetial}">产品详细需求</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="prdRequirementDetial" id="FinProductFeaAna002_prdRequirementDetial"
                                                   class="layui-input form-input" maxlength=60
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value='${entity?.prdRequirementDetial}'
                                                   disabled = "disabled" >
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{FinProductFeaAna002.feasibilityResult}">可行性分析结论</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="feasibilityResult" id="FinProductFeaAna002_feasibilityResult"
                                                   class="layui-input form-input" maxlength=60
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value='${entity?.feasibilityResult}' required>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{FinProductFeaAna002.feasibilityStatus}">分析结论</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="FinProductFeaAna002_feasibilityStatus" name="feasibilityStatus"
                                                    class="layui-input form-input input-select"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue='${entity?.feasibilityStatus}'
                                                    data-th-data-result="${FEASIBILITY_STATUS}" required>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{FinProductFeaAna002.feasibilityType}">可行需求分类</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="FinProductFeaAna002_feasibilityType" name="feasibilityType"
                                                    class="layui-input form-input input-select"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue='${entity?.feasibilityType}'
                                                    data-th-data-result="${FEASIBILITY_TYPE}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- 附件信息 -->
                    <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                         th:data-params="|{entityName: 'fileCommonDto', businessId: '${entity?.requirementId ?: ''}'}|"></div>
                </form>
            </div>
            <div class="row text-center stepbar">
                <div class="text-center">
                    <a id="FinProductFeePay002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                    <a id="FinProductFeaAna002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                    <a id="FinProductFeaAna002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script th:inline="javascript">
            var analyse_status = /*[[${analyse_status}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/product/rddesign/feasibilityanalysis/FinProductFeaAna002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
