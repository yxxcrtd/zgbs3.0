<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinDisclosureModule001}">信息披露模板管理</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				
				<a id="FinDisclosureModule001_btn_upload" class="layui-btn layui-btn-sm"><i class="iconfont icon-upload"></i><span data-th-text="#{FinDisclosureModule001.upload}">上传</span></a>
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">

						<div
							class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinDisclosureModule001.fileType}">文档类型</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="fileType" name="fileType"
									class="layui-input form-input input-select" formatoption="true" 
									placeholder="请输入内容" data-th-data-result='${FILE_TYPE_FG}'
									data-th-placeholder="#{SysCommon.placeholder}" />
							</div>
						</div>
						<div
							class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinDisclosureModule001.fileName}">文件名</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="fileName" name="fileName"
									class="layui-input form-input input-lenovoselect" data-parentIds="fileType"
									data-th-data-url="@{/invest/product/productelement/findisclosuremodule/findisclosuremodule/FinDisclosureModule001/getFileName}"
									allowClear="true" placeholder="请输入内容" parentIds="fileType"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-idfield="code" data-keyfield="shortName"
									data-th-data-effectivefieldsalias='|{"code":"#{FinDisclosureModule001.fileId}","shortName":"#{FinDisclosureModule001.fileName}"}|' >
							</div>
						</div>
					</div>
				</form>
			</div>

			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script
			data-th-src="@{/js/invest/product/productelement/findisclosuremodule/findisclosuremodule/FinDisclosureModule001.js}"></script>
	</div>
</body>
</html>
