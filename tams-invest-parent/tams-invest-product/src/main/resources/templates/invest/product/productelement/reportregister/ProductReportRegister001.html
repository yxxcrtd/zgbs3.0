<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ProductReportRegister001}">产品新建管理</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="form-button-area">
				<a id="ProductReportRegister001_btn_add"
					class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a> 
			</div>
			<div
				class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{ProductReportRegister001.repFinprodName}">产品名称</label>
							<div class="layui-input-inline input-inline">
								<select type="text" name="repFinprodName" id="repFinprodName"
									class="layui-input form-input input-select" allowClear="true"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									formatoption=true multiple="true"
									data-th-data-url="@{/invest/product/productelement/reportregister/ProductReportRegister001/queryProdIdInfo}">
								</select>
							</div>
						</div>
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{ProductReportRegister001.repTerm}">产品期限</label>
							<div class="layui-input-inline input-inline">
								<select name="repTerm" id="repTerm"
									class="layui-input form-input input-select"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result="${SVR_PRODUCT_TERM}" >
								</select>
							</div>
						</div>
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{ProductReportRegister001.repFinprodInsId}">行内标识码</label>
							<div class="layui-input-inline input-inline">
								<select type="text" name="repFinprodInsId" id="repFinprodInsId"
									class="layui-input form-input input-select" allowClear="true"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									formatoption=true multiple="true"
									data-th-data-url="@{/invest/product/productelement/reportregister/ProductReportRegister001/queryFinprodInsId}">
								</select>
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{ProductReportRegister001.repOperateMode}">产品运作模式</label>
							<div class="layui-input-inline input-inline">
								<select type="text" name="repOperateMode" id="repOperateMode"
									class="layui-input form-input input-select" allowClear="true"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									formatoption=false 
									data-th-data-result="${SVR_OPERATEMODE_DECLARE}">
								</select>
							</div>
						</div>
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{ProductReportRegister001.repRaisePdate}">募集开始日</label>
							<div class="layui-input-inline input-inline">
								<input id="repRaisePdate" name='repRaisePdate'
									class="layui-input form-input input-dateRangeSelect"
									placeholder="请选择时间区间" allowClear="true"
									data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
					</div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script
			data-th-src="@{/js/invest/product/productelement/reportregister/ProductReportRegister001.js}"
			type="text/javascript"></script>
		<script data-th-inline="javascript" type="text/javascript">
			var issueStatusC = /*[[${issueStatusC}]]*/;
			var statusValidE = /*[[${statusValidE}]]*/;
			var issueStatusCName = /*[[${issueStatusCName}]]*/;
		</script>
	</div>
</body>
</html>
