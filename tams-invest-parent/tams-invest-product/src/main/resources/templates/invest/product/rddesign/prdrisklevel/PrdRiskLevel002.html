<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PrdRiskLevel002}">新发产品风险等级评定新建</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="PrdRiskLevel002_Form">
            <!-- 隐藏域 -->
            <input type="hidden" id="seqNo" name="seqNo" data-th-value="${entity?.seqNo}" />
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{PrdRiskLevel002.page.finProductTime}">评定时间</label>
                    <div class="layui-input-inline input-inline">
                        <input type="datetime" id="generateTime" name="generateTime"
                            class="layui-input form-input input-dateSelect"
                            data-th-value='${entity?.generateTime eq null ? "" : #dates.format(entity?.generateTime,"yyyy-MM-dd hh:mm:ss")}'
                            disabled />
                    </div>
                </div>
                
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{PrdRiskLevel002.page.finProductCode}">产品设计编码</label>
                    <div class="layui-input-inline input-inline">
                    	<select id="finProductCode" name="finProductCode"
                            class="layui-input form-input input-select"
                            data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-data-url="@{/invest/product/rddesign/prdrisklevel/PrdRiskLevel001/productDesignCode}"
                            data-th-initValue='${entity?.finProductCode}' required>
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{PrdRiskLevel002.page.finProductName}">产品设计系列名称</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" name="finProductName" id="finProductName" class="layui-input form-input"
                            maxlength=50 data-th-value="${entity?.finProductName}" disabled />
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable" data-th-text="#{PrdRiskLevel001.table.riskLevel}">风险等级</label>
                    <div class="layui-input-inline input-inline">
                        <select id="riskLevel" name="riskLevel" required="required" disabled
                        	data-th-initValue='${entity?.riskLevel}'
							class="layui-input form-input input-select" 
							data-th-placeholder="#{SysCommon.placeholder}" 
							data-th-data-result="${PRD_RISK_LEVEL}">
						</select>
					</div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                        data-th-text="#{PrdRiskLevel001.table.ajustRiskLevel}">调整后风险等级</label>
                    <div class="layui-input-inline input-inline">
                    	<select name="ajustRiskLevel" id="ajustRiskLevel" 
                        	data-th-initValue="${entity?.ajustRiskLevel}"
							class="layui-input form-input input-select" 
							data-th-placeholder="#{SysCommon.placeholder}" 
							data-th-data-result="${PRD_RISK_LEVEL}">
						</select>
                    </div>
                </div>
            </div>
            <div class="layui-col-md10" style="margin: 30px 0;">
                <div class="text-center">
                    <a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save"
                        data-th-text="#{SysCommon.save}">保存</a>
                    <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit" 
                    	data-th-text="#{SysCommon.submit}">提交</a>
                    <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel"
                        data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </div>
        </form>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/product/rddesign/prdrisklevel/PrdRiskLevel002.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
