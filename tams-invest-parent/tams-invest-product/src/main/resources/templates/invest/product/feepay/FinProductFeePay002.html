<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinProductFeePay002}">产品费用支付新建</title>
</head>
<body>
<div class="pro-module-wrap">
	<div layout:fragment="content">
		<div>
			<div class="pro-module-wrapper pro-module-base" style="border-top: none;">
				<form class="layui-form joyin-form-wrap pro-module-form" id="FinProductFeePay002_Form">
					<input type="text" name="tradeId" id="FinProductFeePay002_hidden_tradeId" th:value="${entity?.tradeId}" hidden>
					<input type="text" name="feeType" id="FinProductFeePay002_hidden_feeType" th:value="${entity?.feeType}" hidden>
					<input type="text" name="feeName" id="FinProductFeePay002_hidden_feeName" th:value="${entity?.feeName}" hidden>
					<input type="text" name="cashId" id="FinProductFeePay002_hidden_cashId" th:value="${entity?.cashId}" hidden>
					<input type="text" name="finprodId" id="FinProductFeePay002_hidden_finprodId" th:value="${entity?.finprodId}" hidden>
					<input type="text" name="mdate" id="FinProductFeePay002_hidden_mDate" hidden>
					<input type="text" name="vdate" id="FinProductFeePay002_hidden_vDate" hidden>
					<input type="text" name="confirmFlag" id="FinProductFeePay002_hidden_operateType" th:value="${entity?.confirmFlag}" hidden>
					<input type="text" id="FinProductFeePay002_hidden_tradeAmt" th:value="${entity?.actPayAmt != null? entity?.actPayAmt : '0'}" hidden>
					<input type="text" id="FinProductFeePay002_positionEndDateHide" data-th-value='${entity?.endDate eq null ? platDate : #dates.format(entity?.endDate,"yyyy-MM-dd")}' hidden>
					<input type="text" name="chargeType" id="FinProductFeePay002_hidden_chargeType" th:value="${entity?.chargeType}" hidden>
					<input type="text" name="profitType" id="FinProductFeePay002_hidden_profitType" th:value="${entity?.profitType}" hidden>
					<input type="text" name="dealMode" id="FinProductFeePay002_hidden_dealMode" th:value="${entity?.dealMode}" hidden>
					<input type="text" name="ps" id="FinProductFeePay002_hidden_ps" th:value="${entity?.ps}" hidden>
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title" style="border-top: 1px solid #cccccc;"><span class="title-des">组合信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductFeePay002.portFolioId}">组合代码</label>
										<div class="layui-input-inline input-inline">
											<select type="text" name="ptlId" id="FinProductFeePay002_ptlId"
												class="layui-input form-input input-select"
												placeholder="请输入内容" allowClear="false" formatoption=false required
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-childrenIds="FinProductFeePay002_feeId"
												data-th-initValue='${entity?.ptlId}'
												data-th-data-url="@{/invest/product/productelement/build/FinProductBuild001/queryGroupIdInfo}">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductFeePay002.feeName}">费用名称</label>
										<div class="layui-input-inline input-inline">
											<select type="text" name="feeId" id="FinProductFeePay002_feeId"
												class="layui-input form-input input-select"
												placeholder="请输入内容" allowClear="false" formatoption=false required
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue='${entity?.feeId}'
												data-th-parentIds="FinProductFeePay002_ptlId"
												data-th-data-url="|@{/invest/product/feepay/FinProductFeePay002/queryFeeInfoList}?operateType=${entity?.confirmFlag}">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap" id="FinProductFeePay002_DIV_regTrustOrg">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductFeePay002.regTrustOrg}">登记托管机构</label>
										<div class="layui-input-inline input-inline">
											<select id="FinProductFeePay002_regTrustOrg" name="regTrustOrg"
												class="layui-input form-input input-select" required
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue='${entity?.regTrustOrg}'
												data-th-data-result="${REGIST_ORG}">
											</select>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap" id="FinProductFeePay002_DIV_ccy">
	                                	<label class="layui-form-label form-label-wrap"
	                                	data-th-text="#{FinProductFeePay002.ccy}">币种</label>
		                                <div class="layui-input-inline input-inline">
		                                    <select id="FinProductFeePay002_ccy" name="ccy"  
		                                    	class="layui-input form-input input-select"   
		                                    	data-th-placeholder="#{SysCommon.placeholder}" placeholder="请输入内容"
	                                    		formatoption="true" 
	                                    		type="text"
	                                    		disabled
	                                            data-th-data-result='${CCY}' allowClear="true"
	                                            data-th-initValue="${entity?.ccy}">
		                                    </select>
		                                </div>
	                            	</div>
								</div>
                            	<!-- 组合现金、持仓查询  add by ZhouYu 2019-12-12 -->
								<div class="page-component" th:data-path="@{/component/trade/BussTrdAvailableCashQuery/init}"
									th:data-params="|{entityName: 'bussTrdAvailableCashQuery'}|">
								</div>
							</div>
						</div>
					</div>
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">费用信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap" id='FinProductFeePay002_div_positionStartDate'>
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductFeePay002.positionStartDate}">计提开始日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="startDate" id="FinProductFeePay002_positionStartDate"
												class="layui-input form-input input-dateSelect" required disabled
												data-th-value='${#dates.format(entity?.startDate,"yyyy-MM-dd")}'>
										</div>
									</div>
									<div class="form-inline-wrap" id='FinProductFeePay002_div_positionEndDate'>
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductFeePay002.positionEndDate}">付费截止日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="endDate" id="FinProductFeePay002_positionEndDate"
												class="layui-input form-input input-dateSelect" required
												data-th-value='${entity?.endDate eq null ? platDate : #dates.format(entity?.endDate,"yyyy-MM-dd")}'>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductFeePay002.payDate}">支付日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="payDate" id="FinProductFeePay002_payDate"
												class="layui-input form-input input-dateSelect" required
												data-th-value='${entity?.payDate eq null ? platDate : #dates.format(entity?.payDate,"yyyy-MM-dd")}'>
										</div>
									</div>
								</div>
								<div class="layui-form-item" id="unRegular_div" style="display: none;">
									<div class="form-inline-wrap" id='FinProductFeePay002_div_payAmt'>
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductFeePay002.payAmt}">理论金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="payAmt" id="FinProductFeePay002_payAmt"
												class="layui-input form-input text-number" required disabled
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-value='${entity?.payAmt}' >
										</div>
									</div>
									<div class="form-inline-wrap" id='FinProductFeePay002_div_actPayAmt'>
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductFeePay002.actPayAmt}">实付金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="actPayAmt" id="FinProductFeePay002_actPayAmt"
												class="layui-input form-input text-number" 
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-value='${entity?.actPayAmt}'>
										</div>
									</div>
									<div class="form-inline-wrap" id='FinProductFeePay002_div_adjustAmt'>
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductFeePay002.adjustAmt}">调整金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="adjustAmt" id="FinProductFeePay002_adjustAmt"
												class="layui-input form-input text-number" required disabled
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-value='${entity?.adjustAmt}'>
										</div>
									</div>
								</div>
								<div class="layui-form-item" id='unRegular_div2'>
									<div class="form-inline-wrap" id='FinProductFeePay002_div_isPerpaid'>
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductFeePay002.isPerpaid}">是否待摊</label>
										<div class="layui-input-inline input-inline">
											<select id="FinProductFeePay002_isPerpaid" name="isPerpaid"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue='${entity?.isPerpaid}?:${noFlag}'
												data-th-data-result="${YES_OR_NO}" required allowClear="false">
											</select>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap" id = "proAvailableCash_div">
	                                    <label class="layui-form-label form-label-wrap"
	                                    	data-th-text="#{FinProductFeePay002.proAvailableCash}">组合剩余现金</label>
	                                    <div class="layui-input-inline input-inline">
	                                        <input type="text" id="FinProductFeePay002_proAvailableCash" name="proAvailableCash"
	                                                placeholder="请输入内容" data-pattern="" data-fixtype="2"
	                                                class="layui-input form-input text-number" disabled="disabled"
	                                                data-th-value='${entity?.proAvailableCash}'/>
	                                                <span class="input-right-show">元</span>
	                                    </div>
                                	</div>
								</div>
								<div id="fee_div">
									<table class="layui-table" id="fee_dataTable" name="feeInfoList" th:title="#{FinProductFeePay002.field.feeInfo}">
									</table>
								</div>
								<div id="feelayered_div">
									<table class="layui-table" id="feelayered_dataTable" name="feelayeredInfoList" th:title="#{FinProductFeePay002.field.feeInfo}">
									</table>
								</div>
								<div class="layui-form-item" id="taxFee_div" th:if="${entity?.operateType} neq 'confirm'">
									<table class="layui-table" id="taxFee_dataTable" name="taxPositionList"></table>
								</div>
							</div>
						</div>
					</div>
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">交易备注</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<label class="layui-form-label form-label-wrap" style="width: 11.9%;">备注</label>
									<div class="layui-input-inline input-inline" style="width: 85%!important;">
											<textarea id="remark" name="remark" placeholder="请输入内容" maxlength="300"
													  data-th-placeholder="#{SysCommon.placeholder}"
													  class="layui-textarea" data-th-text="${entity?.remark}"></textarea>
									</div>
								</div>
							</div>
						</div>
					</div>
					<!-- <div class="pro-module-wrap" data-th-if="${entity?.revokeReason}">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">撤销理由</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<label class="layui-form-label form-label-wrap" style="width: 11.9%;">备注</label>
									<div class="layui-input-inline input-inline" style="width: 85%!important;">
											<textarea id="revokeReason" name="revokeReason"  
													   placeholder="请输入内容"
													  class="layui-textarea" data-th-text="${entity?.revokeReason}"></textarea>
									</div>
								</div>
							</div>
						</div>
					</div> -->
					<!-- 划款指令 -->
					<div class="page-component" th:data-path="@{/component/trade/BussTrdTransferOrder/init}"
	                 	th:data-params="|{entityName: 'bussFinProductFeePay', pageFrom: 'submitForm', entity:'${entity_bussTrdTransferOrder}', bizCode:'${entity?.tradeId}'}|">
	            	</div>
					<!-- 附件信息 -->
		            <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
		                th:data-params="|{entityName: 'fileArray', businessId: '${entity?.tradeId}'}|"></div>
				</form>
				</div>
				<div class="row text-center stepbar">
					<div class="text-center">
						<a id="FinProductFeePay002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
						<a id="FinProductFeePay002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
						<a id="FinProductFeePay002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var feeType_trustFee = /*[[${feeType_trustFee}]]*/;
			var feeType_saleFee = /*[[${feeType_saleFee}]]*/;
			var feeType_fixFee = /*[[${feeType_fixFee}]]*/;
			var feeType_float = /*[[${feeType_float}]]*/;
			var feeType_diffMid = /*[[${feeType_diffMid}]]*/;
			var feeType_tax = /*[[${feeType_tax}]]*/;
			var feeType_settle = /*[[${feeType_settle}]]*/;
			var feeType_acctno = /*[[${feeType_acctno}]]*/;
			var feeType_fdcezs = /*[[${feeType_fdcezs}]]*/;
			var feeChargetype_norule = /*[[${feeChargetype_norule}]]*/;
			var feeChargetype_prov = /*[[${feeChargetype_prov}]]*/;
			var yesFlag = /*[[${yesFlag}]]*/;
			var noFlag = /*[[${noFlag}]]*/;
		    var YES_NO = /*[[${YES_OR_NO}]]*/'';
			var ps = /*[[${ps}]]*/;
			var finprodType2 = /*[[${finprodType2}]]*/;
			var workflowId = /*[[${workflowId}]]*/;// 工作流代码
			var formTodoList = /*[[${formTodoList}]]*/;// 是否代办
			var dealMode11 = /*[[${DEAL_MODE_11}]]*/;// 产品处理模式 分档
			var profitType01 = /*[[${PROFIT_TYPE_01}]]*/;// 收益模式 净值
			var IS_NEEDSEND_YES = /*[[${IS_NEEDSEND_YES}]]*/;
			var IS_NEEDSEND_YES_NAME = /*[[${IS_NEEDSEND_YES_NAME}]]*/;
			var CUSTOMER_BANK_CODE = /*[[${CUSTOMER_BANK_CODE}]]*/;
			var feePayShow = /*[[${feePayShow}]]*/;
			var feeType_tradeFee = /*[[${feeType_tradeFee}]]*/;//交易手续费
			function zd(){
				jyfx = $('#FinProductFeePay002_hidden_feeType').val();
				if((jyfx == '03'||jyfx == '12')&& jyfx != undefined && jyfx != null){
					zcmc = $('#FinProductFeePay002_ptlId').val();
	        		bj =  $('#FinProductFeePay002_feeId').find("option:selected").text();
	        		fy = $('#FinProductFeePay002_actPayAmt').val();
	        		var s1 = "资产管理部中间业务收入";
	        		var s2 = "元";
	        		var a =zcmc+bj+s1+fy+s2;
	        		$("#remark").val(a);	
				}else if(jyfx == '02'&& jyfx != undefined && jyfx != null){
					zcmc = $('#FinProductFeePay002_ptlId').val();
	        		bj =  $('#FinProductFeePay002_feeId').find("option:selected").text();
	        		fy = $('#FinProductFeePay002_actPayAmt').val();
	        		var s1 = "分支行中间业务收入";
	        		var s2 = "元";
	        		var a =zcmc+bj+s1+fy+s2;
	        		$("#remark").val(a);
				}else if(jyfx != undefined && jyfx != null){
	        		zcmc = $('#FinProductFeePay002_ptlId').val();
	        		bj =  $('#FinProductFeePay002_feeId').find("option:selected").text();
	        		var s1 = "费用支付";
	        		var s2 = "费用名称";
	        		var a =zcmc+bj+s1;
	        		$("#remark").val(a);
	        	}
			}
        </script>
		<script
			data-th-src="@{/js/invest/product/feepay/FinProductFeePay002.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
