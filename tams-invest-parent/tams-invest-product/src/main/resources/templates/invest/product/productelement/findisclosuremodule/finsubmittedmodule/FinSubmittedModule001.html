<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinSubmittedModule001}">申报附件方案管理</title>
<style>
.input-btn-append a{
line-height: 20px;
}
.icon-upload{
    color:limegreen;
}
.delt{
    color: red;
}
.del{
    color: red;
}
.iconinput{color:blue}
.mixtree-node{
    height: 30px;
    padding: 10px;
    color:rgb(119, 119, 119);
    cursor: pointer;
    border-bottom: dashed 1px #dbdbdb;
}
.btn-trans:hover {
    boder-right: solid 1px #dbdbdb;
    boder-bottom: solid 1px #dbdbdb;
}
.mixtree-node:hover { background-color: #D9ECFF;}
.node_div{width: 80%; display: inline-block;}
.operate_div{
    width: 25%;
    padding: 3px;
    position: relative;
    display: none;
    top: -26px;
    left: 250px;}
.btn-trans{background-color: transparent!important;border: 0px;font-weight: bold;}
</style>
</head>
<body>
    <div layout:fragment="content">
        <div class="layui-row">
            <form class="layui-form layui-col-md3" id="submitForm">
                <input style = "display:none;" id="code_hidden" />
                <div class="layui-form-item" style="border: 1px solid #ccc; padding: 5px; min-height: 460px; overflow:auto;">
                    <div class="input-btn-append">
                        <input type="text" id="schemeName" name="schemeName"
                            class="layui-input form-input input-fuzzy-text"
                            placeholder="请输入申报附件代码或名称关键词" th:maxlength="200"
                            data-eventfunc="QueryFunc.serachKey">
                        <a id="FinSubmittedModule001_btn_creat" class="layui-btn layui-btn-sm btn-create btn-trans"
                           data-th-text="#{SysCommon.create}" style="float: right; padding-right: 5px;margin-top: 3px;color: yellowgreen;border: 0px!important;">新建</a>
                    </div>
                    <div id="mixTree"></div>
                </div>
            </form>
            <div class="layui-col-md9" style="float:right;padding-left:10px;">
                <div class="joyin-form-wrap condition-area" style='overflow: hidden;padding:0;'>
                    <div class="layui-inline layui-col-md5" style="float:left">
                        <label class="layui-form-label form-lable" style='text-align:left;'><i class='iconfont icon-vline' style='color:#4893e6;font-weight:bolder;'></i><span data-th-text="#{FinSubmittedModule001.schemeName}">申报附件</span></label>
                    </div>
                    <div class= " layui-col-md-offset4 "style="float:right">
                        <a id="FinSubmittedModule001_btn_add" class="layui-btn layui-btn-sm"><i class="iconfont icon-plus"></i><span data-th-text="#{SysCommon.add}">添加</span></a>
                        <a id="FinSubmittedModule001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
                            data-th-text="#{SysCommon.delete}">删除</a> 
                    </div>
                </div>
                <div>
                    <table class="layui-table" id="dataTable" ></table>
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script
            data-th-src="@{/js/invest/product/productelement/findisclosuremodule/finsubmittedmodule/FinSubmittedModule001.js}">
        </script>
    </div>
</body>
</html>
