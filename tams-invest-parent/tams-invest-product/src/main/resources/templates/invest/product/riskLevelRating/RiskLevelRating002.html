<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{RiskLevelRating002}">存续产品风险等级评定新建</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <div class="">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{RiskLevelRating001.generateTime}">评定日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input class="layui-input form-input "
                                               id="generateTime" name="generateTime" type="datetime"
                                               data-th-value='${#dates.format(entity.generateTime,"yyyy-MM-dd HH:mm:ss")}'
                                               placeholder="" disabled="disabled">
                                    </div>
                                </div>
                                <div class="form-inline-wrap layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{RiskLevelRating001.finProductCode}">产品代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="finProductCode" name="finProductCode"
                                                class="layui-input form-input input-select"
                                                data-th-data-url="@{/invest/product/riskLevelRating/RiskLevelRating001/findId}"
                                                data-th-initValue="${entity?.finProductCode}"
                                                allowClear="true"
                                                showField="id" formatoption="false"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                required>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap layui-col-md4 layui-col-sm4 layui-col-lg4">
<!--                                    <a id="RiskLevelRating002_asset" class="layui-btn layui-btn-sm">资产风险等级评定</a>-->
                                    <a id="RiskLevelRating002_prod" class="layui-btn layui-btn-sm">产品风险等级评定</a>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{RiskLevelRating001.finprodAbbr}">产品名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="finprodAbbr" name="finprodAbbr"
                                               class="layui-input form-input"
                                               data-th-value="${entity?.finprodAbbr}"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                        disabled="disabled">
                                    </div>
                                </div>
                                <div class="form-inline-wrap layui-col-md4 layui-col-sm4 layui-col-lg4" style="display: none">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{RiskLevelRating001.seqNo}">流水号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="seqNo" name="seqNo"
                                               class="layui-input form-input"
                                               data-th-value="${entity?.seqNo}?:${seqNo}"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               disabled="disabled">
                                    </div>
                                </div>
                            </div>
                            </div>
                        </div>
                    </div>
                </div>
            <div class="pro-module-wrap">
                <div class="pro-module" style="height: 300px;">
                    <h3 class="pro-module-title" style="border-top: 1px solid #cccccc;">
                        <span class="title-des">资产评定列表</span>
                    </h3>
                    <div >
                        <table class="layui-table" id="dataTable" style="height: 200px;"></table>
                    </div>
                </div>
            </div>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap layui-col-md6 layui-col-sm46 layui-col-lg6">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{RiskLevelRating001.riskLevel}">产品风险等级</label>
                                <div class="layui-input-inline input-inline">
                                    <select id="riskLevel" name="riskLevel"
                                            class="layui-input form-input input-select"
                                            th:data-result="${ASSET_RISK_LEVEL}"
                                            data-th-initValue="${entity?.riskLevel}"
                                            data-th-placeholder="#{SysCommon.placeholder}"disabled="disabled" required>
                                    </select>
                                </div>
                            </div>
                            <div class="form-inline-wrap layui-col-md6 layui-col-sm46 layui-col-lg6">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{RiskLevelRating001.ajustRiskLevel1}">调整后产品风险等级</label>
                                <div class="layui-input-inline input-inline">
                                    <select id="ajustRiskLevel" name="ajustRiskLevel"
                                            class="layui-input form-input input-select"
                                            th:data-result="${ASSET_RISK_LEVEL}"
                                            data-th-initValue="${entity?.ajustRiskLevel}"
                                            data-th-placeholder="#{SysCommon.placeholder}" >
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            </div>

        <div class="row text-center stepbar" style="margin-top: 200px">
            <div class="text-center">
                <a id="RiskLevelRating002_btn_save"
                   class="layui-btn layui-btn-sm btn-save"
                   data-th-text="#{SysCommon.save}">保存</a>
                <a id="RiskLevelRating002_btn_submit"
                    class="layui-btn layui-btn-sm btn-submit"
                    data-th-text="#{SysCommon.submit}">提交</a>
                <a id="RiskLevelRating002_btn_cancel"
                    class="layui-btn layui-btn-sm btn-cancel"
                    data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <script th:inline="javascript">
      var RISKLEVEL=/*[[${ASSET_RISK_LEVEL}]]*/'';
      var CUSTOM_ASSET_TYPE_TWO=/*[[${CUSTOM_ASSET_TYPE_TWO}]]*/'';
      var CUSTOM_ASSET_TYPE_THREE=/*[[${CUSTOM_ASSET_TYPE_THREE}]]*/'';
      var CUSTOM_ASSET_TYPE_FOUR=/*[[${CUSTOM_ASSET_TYPE_FOUR}]]*/'';
      var CUSTOM_ASSET_TYPE_FIVE=/*[[${CUSTOM_ASSET_TYPE_FIVE}]]*/'';
      var PINAN_ASSET_TYPE=/*[[${PINAN_ASSET_TYPE}]]*/'';
      var entity=/*[[${entity}]]*/'';
      var edate=/*[[${edate}]]*/'';
    </script>
    <script
            data-th-src="@{/js/invest/product/riskLevelRating/RiskLevelRating002.js}"></script>
</div>
</body>
</html>
