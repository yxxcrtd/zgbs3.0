<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinProductExpire001}">产品到期查询</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="form-button-area">
				<!-- <a id="FinProductExpire001_btn_sync" class="layui-btn layui-btn-sm"><i class="iconfont icon-cloud-sync"></i><span data-th-text="#{FinProductExpire001.sync}">同步</span></a>-->
				<!-- <a id="FinProductExpire001_btn_confirm" class="layui-btn layui-btn-sm"><i class="iconfont icon-circle-correct_fill"></i><span data-th-text="#{FinProductExpire001.confirm}">确认</span></a> --> 
				<a id="FinProductExpire001_btn_add" class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a>
				<a id="FinProductExpire001_btn_revoke" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{pingan.common.revoke}"></a>
			</div>
			<div
				class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductExpire001.finprodId}">产品代码</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="FinProductExpire001_finprodId"
									class="layui-input form-input input-select" allowClear="true"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									formatoption=true multiple="true"
									data-th-initValue='${finprodId}'
									data-th-data-url="@{/invest/product/productduration/establish/FinProductEstablish002/queryProdIdInfoIssueSuc}">
								</select>
							</div>
						</div>
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductExpire001.effectStatus}">有效状态</label>
							<div class="layui-input-inline input-inline">
								<select id="FinProductExpire001_effectStatus"
									class="layui-input form-input input-select"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result="${STATUS_VALID}">
								</select>
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductExpire001.ptlId}">组合代码</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="FinProductExpire001_ptlId"
									class="layui-input form-input input-select" allowClear="true"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									formatoption=false multiple="true"
									data-th-data-url="@{/invest/product/productelement/build/FinProductBuild001/queryGroupIdInfo?flag=02}">
								</select>
							</div>
						</div>
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductExpire001.mdate}">赎回/到期日</label>
							<div class="layui-input-inline input-inline">
								<input id="FinProductExpire001_mdate"
									class="layui-input form-input input-dateRangeSelect"
									placeholder="请选择时间区间"
									data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
					</div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-src="@{/js/invest/product/productduration/expire/FinProductExpire001.js}" type="text/javascript"></script>
		<script data-th-src="@{/js/invest/product/productelement/common/FinProductCommon.js}" type="text/javascript"></script>
		<script data-th-inline="javascript" type="text/javascript">
		
		</script>
	</div>
</body>
</html>
