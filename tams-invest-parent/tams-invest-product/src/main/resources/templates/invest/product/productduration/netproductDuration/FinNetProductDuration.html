<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{FinNetProductDuration}">净值化产品存续期交易新建</title>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                        <span class="title-des">产品要素</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class=" form-inline-wrap">
                                    <input type="text" id="finprodId" name="finprodId" class="layui-input form-input" data-th-value="${entity?.finprodId}" style = "display: none">
                                    <input type="text" id="operateType" name="operateType" class="layui-input form-input" data-th-value="${entity?.operateType}" style = "display: none">
                                    <input type="text" id="tradeId" name="tradeId" class="layui-input form-input" data-th-value="${entity?.tradeId}" style = "display: none">
                                    <input type="text" id="portfolioId" name="portfolioId" class="layui-input form-input" data-th-value="${entity?.portfolioId}" style = "display: none">
                                    <input type="text" id="operationType" name="operationType" class="layui-input form-input" data-th-value="${entity?.operationType}" style = "display: none">
                                    <input type="text" id="isCycle" name="isCycle" class="layui-input form-input" data-th-value="${entity?.isCycle}" style = "display: none">
                                    <input type="text" id="profitType" name="profitType" class="layui-input form-input" data-th-value="${entity?.profitType}" style = "display: none">
                                    <input type="text" id="calendarId" name="calendarId" class="layui-input form-input" data-th-value="${entity?.calendarId}" style = "display: none">
                                    <input type="text" id="pageModel" name="pageModel" class="layui-input form-input" data-th-value="${pageModel}" style = "display: none">
                                    <input type="text" id="dealMode" name="dealMode" class="layui-input form-input" data-th-value="${entity?.dealMode}" style = "display: none"> <!-- 处理模式 -->
                                    <input type="text" id="maneWay" name="maneWay" class="layui-input form-input" data-th-value="${entity?.maneWay}" style = "display: none"> <!-- 期次管理方式 -->
                                    <input type="text" id="termType" name="termType" class="layui-input form-input" data-th-value="${entity?.termType}" style = "display: none"> <!-- 期限类型 -->
                                    <input type="text" id="continueFlag" name="continueFlag" class="layui-input form-input"  style = "display: none"> <!-- 是否续投 -->
                                    <input type="text" id="ps" name="ps" class="layui-input form-input" data-th-value="${entity?.ps}" style = "display: none"><!-- 交易方向 -->
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductDuration.finprodMarketId}">产品代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="finprodMarketId" name="finprodMarketId"
                                                class="layui-input form-input input-select"
                                                data-th-data-url="@{/invest/product/productduration/netproductDuration/FinNetProductDuration/getFinprodMarketIdList(pageModel=${pageModel})}"
                                                required="required" allowClear="true" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" searchable="true"
                                                data-th-initValue='${entity?.finprodMarketId}'>
                                        </select>
                                    </div>
                                </div>
                                <div class=" form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductDuration.dealType}">交易类型</label>                                    
                                    <div class="layui-input-inline input-inline">
                                        <select name="dealType" id="dealType"
                                            class="layui-input form-input input-select"
                                            data-th-initValue='${entity?.dealType}'
                                            data-th-data-result="${PS}" required>
                                        </select>
                                    </div>
                                    
                                </div>
                                <div class=" form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductDuration.ccy}">币种</label>                                    
                                    <div class="layui-input-inline input-inline">
                                        <select name="ccy" id="finccy"
                                            class="layui-input form-input input-select"
                                            data-th-initValue='${entity?.ccy}'
                                            data-th-data-result="${CCY}" required disabled>
                                        </select>
                                    </div>
                                    
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap layui-col-xs4">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductDuration.vDate}">产品起息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="vDate" name="vDate" class="layui-input form-input input-dateSelect"
                                               placeholder="请选择时间" data-th-value="${#dates.format(entity?.vDate,'yyyy-MM-dd')}" required="required"
                                               data-th-placeholder="#{SysCommon.placeholder}" disabled>
                                    </div>
                                </div>
                                <div class="form-inline-wrap layui-col-xs4">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductDuration.mDate}">产品到期日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="mDate" name="mDate" class="layui-input form-input input-dateSelect"
                                               placeholder="请选择时间" data-th-value="${#dates.format(entity?.mDate,'yyyy-MM-dd')}" required="required"
                                               data-th-placeholder="#{SysCommon.placeholder}" disabled>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item" id="namediv">
                            <div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{FinNetProductDuration.prodAbbr}">产品简称</label>
									<div class="layui-input-inline input-inline">
										<input type="text" class="layui-input form-input"
										 data-th-placeholder="#{SysCommon.placeholder}" id="FinNetProductDuration_prodAbbr"
										 name="prodAbbr" data-th-value="${entity?.prodAbbr}" disabled required="required"/>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{FinNetProductDuration.prodName}">产品名称</label>
									<div class="layui-input-inline input-inline">
										<input type="text" class="layui-input form-input"
										 data-th-placeholder="#{SysCommon.placeholder}" id="FinNetProductDuration_prodName"
										 name="prodName" data-th-value="${entity?.prodName}" disabled required="required"/>
									</div>
								</div>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="subModel" class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                        <span class="title-des">认购要素</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item space">
                                <div class="form-inline-wrap layui-col-xs4">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductDuration.confirmDate}">确认日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="subConfirmDate" name="subConfirmDate" class="layui-input form-input input-dateSelect"
                                               placeholder="请选择时间" data-th-value="${#dates.format(entity?.subConfirmDate,'yyyy-MM-dd')}" required="required"
                                               data-th-placeholder="#{SysCommon.placeholder}">
                                    </div>
                                </div>
                                <div class=" form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductDuration.dealAmt}">交易金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" data-fixtype="2" unit="1" data-th-data-textrange="2"
                                               class="layui-input form-input text-number" required="required"
                                               id="subDealAmt" name="subDealAmt" data-th-value="${entity?.subDealAmt}"/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class=" form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductDuration.dealNum}">交易份额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" data-fixtype="2" unit="1" data-th-data-textrange="2"
                                               class="layui-input form-input text-number" required="required" 
                                               id="subDealNum" name="subDealNum" data-th-value="${entity?.subDealNum}" disabled/>
                                        <span class="input-right-show">份</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                            	<div id="subTermDaysDiv" class=" form-inline-wrap" style="display: none;">
	                                <label class="layui-form-label form-label-wrap"
	                                       data-th-text="#{FinNetProductDuration.termDays}">投资周期</label>
	                                <div class="layui-input-inline input-inline">
                                        <select id="subTermDays" name="subTermDays"
                                                class="layui-input form-input input-select"
                                                required="required" allowClear="true" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" searchable="true"
                                                data-th-initValue='${entity?.subTermDays}'
                                                data-th-data-result="${subTermDaysSelect}">
                                        </select>
                                    </div>
	                            </div>
	                            <div id="subPeriodIdDiv" class=" form-inline-wrap" style="display: none;">
	                                <label class="layui-form-label form-label-wrap"
	                                       data-th-text="#{FinNetProductDuration.periodId}">期次代码</label>
	                                <div class="layui-input-inline input-inline">
	                                    <select id="subPeriodId" name="subPeriodId" disabled="disabled"
                                                class="layui-input form-input input-select"
                                                required="required" allowClear="true" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" 
                                                data-th-initValue='${entity?.subPeriodId}'
                                                data-th-data-result="${subPeriodsSelect}">
                                        </select>
	                                </div>
	                            </div>
	                            <div class=" form-inline-wrap" style="display: none;">
	                                <label class="layui-form-label form-label-wrap"
	                                       data-th-text="#{FinNetProductDuration.periodId}">期次分支序号</label>
	                                <div class="layui-input-inline input-inline">
	                                	<input type="text" class="layui-input form-input" 
                                          		id="subPeriodBranch" name="subPeriodBranch" data-th-value="${entity?.subPeriodBranch}"/>
	                                </div>
	                            </div>
	                            <div id="subCycleEndDateDiv" class="form-inline-wrap layui-col-xs4" style="display: none;">
	                                <label class="layui-form-label form-label-wrap"
	                                       data-th-text="#{FinNetProductDuration.cycleEndDate}">期次结束日</label>
	                                <div class="layui-input-inline input-inline">
	                                    <input id="subCycleEndDate" name="subCycleEndDate" class="layui-input form-input input-dateSelect"
	                                           placeholder="请选择时间" data-th-value="${#dates.format(entity?.subCycleEndDate,'yyyy-MM-dd')}" required="required"
	                                           data-th-placeholder="#{SysCommon.placeholder}">
	                                </div>
	                            </div>
	                            <div id="subCyclePayDateDiv" class="form-inline-wrap layui-col-xs4" style="display: none;">
	                                <label class="layui-form-label form-label-wrap"
	                                       data-th-text="#{FinNetProductDuration.cyclePayDate}">期次支付日</label>
	                                <div class="layui-input-inline input-inline">
                                        <!--OPEX-594 【产品存续期交易查询】交易查看页面，期次支付日为空 guyunfei 20191225 start-->
	                                    <input id="subCyclePayDate" name="subCyclePayDate" class="layui-input form-input input-dateSelect"
	                                           placeholder="请选择时间" data-th-value="${#dates.format(entity?.subCyclePayDate,'yyyy-MM-dd')}" required="required"
	                                           data-th-placeholder="#{SysCommon.placeholder}" disabled>
                                        <!--OPEX-594 【产品存续期交易查询】交易查看页面，期次支付日为空 guyunfei 20191225 end-->
	                                </div>
	                            </div>
                            </div>
                            <div class="layui-form-item">
                                <div class=" form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductDuration.subFee}">认购费</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" data-fixtype="2" unit="1" data-th-data-textrange="2"
                                               class="layui-input form-input text-number"
                                               id="subFee" name="subFee" data-th-value="${entity?.subFee}"/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                            </div>
                            <!--  <div class="layui-form-item">
                            	<div id="customersBeginNumDiv" class="form-inline-wrap layui-col-xs4">
                            		<label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductDuration.customersBeginNum}">期初客户数</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" data-fixtype="2" unit="1" data-th-data-textrange="0"
                                               class="layui-input form-input text-number"
                                               id="customersBeginNum" name="customersBeginNum" data-th-value="${entity?.customersBeginNum}"/>
                                    </div>                           	
                            	</div>
                            </div>-->
                            
                            <div class="layui-form-item">
                                <div class=" form-inline-wrap" style="width:100%">
                                    <label class="layui-form-label form-label-wrap" style="width:12%"
                                           data-th-text="#{FinNetProductDuration.remark}">交易备注</label>
                                    <div class="layui-input-inline input-inline" style="width:87%">
                                    	<textarea id="subRemark" name="subRemark" placeholder="请输入内容" data-data-ignore="false"                                        
                                                  class="layui-textarea" data-th-placeholder="#{SysCommon.placeholder}"
                                                  data-th-text ="${entity?.subRemark}" maxlength="500">
                                        </textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="pro-module-wrap" id="FinNetProductDuration_div_layering" hidden=true>
                    	<div class="pro-module">
                        	<h3 class="pro-module-title">
                            	<span class="title-des">分层金额明细</span><i class="iconfont icon-arrow-down pro-down-icon"></i>
                        	</h3>
                        	<div class="pro-module-item">
                            	<div class="layui-form-item">
                                	<table class="layui-table" id="FinNetProductDuration_layAmtNetTable"></table>
                            	</div>
                        	</div>
                    	</div>
                	</div> 
                </div>                
                
                <div id="purModel" class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                        <span class="title-des">申购要素</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item space">
                                <div class="form-inline-wrap layui-col-xs4">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductDuration.confirmDate}">确认日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="purConfirmDate" name="purConfirmDate" class="layui-input form-input input-dateSelect"
                                               placeholder="请选择时间" data-th-value="${#dates.format(entity?.purConfirmDate,'yyyy-MM-dd')}" required="required"
                                               data-th-placeholder="#{SysCommon.placeholder}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap layui-col-xs4">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductDuration.netValueDate}">净值日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="purNetValueDate" name="purNetValueDate" class="layui-input form-input input-dateSelect"
                                               placeholder="请选择时间" data-th-value="${#dates.format(entity?.purNetValueDate,'yyyy-MM-dd')}" required="required"
                                               data-th-placeholder="#{SysCommon.placeholder}">
                                    </div>
                                </div>
                                
                                <div class=" form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductDuration.unitNetValue}">单位净值</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" class="layui-input form-input" required="required"
                                               id="purUnitNetValue" name="purUnitNetValue" disabled data-th-value="${entity?.purUnitNetValue}"/>
                                    </div>
                                </div>                                
                            </div>
                            <div class="layui-form-item">                                
                                <div class=" form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductDuration.dealAmt}">交易金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" data-fixtype="2" unit="1" data-th-data-textrange="2"
                                               class="layui-input form-input text-number" required="required"
                                               id="purDealAmt" name="purDealAmt" data-th-value="${entity?.purDealAmt}"/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class=" form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductDuration.dealNum}">交易份额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" data-fixtype="2" unit="1" data-th-data-textrange="2"
                                               class="layui-input form-input text-number" required="required"
                                               id="purDealNum" name="purDealNum" data-th-value="${entity?.purDealNum}"/>
                                        <span class="input-right-show">份</span>
                                    </div>
                                </div>
                                <div class=" form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductDuration.purFee}">申购费</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" data-fixtype="2" unit="1" data-th-data-textrange="2"
                                               class="layui-input form-input text-number"
                                               id="purFee" name="purFee" data-th-value="${entity?.purFee}"/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                            	<div id="purTermDaysDiv" class=" form-inline-wrap" style="display: none;">
	                                <label class="layui-form-label form-label-wrap"
	                                       data-th-text="#{FinNetProductDuration.termDays}">投资周期</label>
	                                <div class="layui-input-inline input-inline">
                                        <select id="purTermDays" name="purTermDays"
                                                class="layui-input form-input input-select"
                                                required="required" allowClear="true" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" searchable="true"
                                                data-th-initValue='${entity?.purTermDays}'
                                                data-th-data-result="${purTermDaysSelect}">
                                        </select>
                                    </div>
	                            </div>
	                            <div id="purPeriodIdDiv" class=" form-inline-wrap" style="display: none;">
	                                <label class="layui-form-label form-label-wrap"
	                                       data-th-text="#{FinNetProductDuration.periodId}">期次代码</label>
	                                <div class="layui-input-inline input-inline">
	                                	<select id="purPeriodId" name="purPeriodId"
                                                class="layui-input form-input input-select"
                                                required="required" allowClear="true" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" searchable="true"
                                                data-th-initValue='${entity?.purPeriodId}'
                                                data-th-data-result="${purPeriodsSelect}">
                                        </select>
	                                </div>
	                            </div>
	                            <div class=" form-inline-wrap" style="display: none;">
	                                <label class="layui-form-label form-label-wrap"
	                                       data-th-text="#{FinNetProductDuration.periodId}">期次分支序号</label>
	                                <div class="layui-input-inline input-inline">
	                                	<input type="text" class="layui-input form-input" 
                                          		id="purPeriodBranch" name="purPeriodBranch" data-th-value="${entity?.purPeriodBranch}"/>
	                                </div>
	                            </div>
	                            <div id="purCycleEndDateDiv" class="form-inline-wrap layui-col-xs4">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductDuration.cycleEndDate}">期次结束日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="purCycleEndDate" name="purCycleEndDate" class="layui-input form-input input-dateSelect"
                                               placeholder="请选择时间" data-th-value="${#dates.format(entity?.purCycleEndDate,'yyyy-MM-dd')}" required="required"
                                               data-th-placeholder="#{SysCommon.placeholder}">
                                    </div>
                                </div>
                                <div id="purCyclePayDateDiv" class="form-inline-wrap layui-col-xs4">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductDuration.cyclePayDate}">期次支付日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="purCyclePayDate" name="purCyclePayDate" class="layui-input form-input input-dateSelect"
                                               placeholder="请选择时间" data-th-value="${#dates.format(entity?.purCyclePayDate,'yyyy-MM-dd')}" required="required"
                                               data-th-placeholder="#{SysCommon.placeholder}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class=" form-inline-wrap" style="width:100%">
                                    <label class="layui-form-label form-label-wrap" style="width:12%"
                                           data-th-text="#{FinNetProductDuration.remark}">交易备注</label>
                                    <div class="layui-input-inline input-inline" style="width:87%">            
                                    	<textarea id="purRemark" name="purRemark" placeholder="请输入内容" data-data-ignore="false"                            
                                                  class="layui-textarea" data-th-placeholder="#{SysCommon.placeholder}"
                                                  data-th-text ="${entity?.purRemark}" maxlength="500">
                                        </textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="pro-module-wrap" id="FinNetProductDuration_div_pur_layering" hidden=true>
                    	<div class="pro-module">
                        	<h3 class="pro-module-title">
                            	<span class="title-des">分层金额明细</span><i class="iconfont icon-arrow-down pro-down-icon"></i>
                        	</h3>
                        	<div class="pro-module-item">
                            	<div class="layui-form-item">
                                	<table class="layui-table" id="FinNetProductDuration_layAmtPurNetTable"></table>
                            	</div>
                        	</div>
                    	</div>
                	</div> 
                </div> 
                
                
                <div id="redModel" class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                        <span id="redTitle" class="title-des">赎回要素</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
