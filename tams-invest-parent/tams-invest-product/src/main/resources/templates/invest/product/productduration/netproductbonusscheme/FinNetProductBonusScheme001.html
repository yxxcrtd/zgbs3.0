<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{FinNetProductBonusScheme001}">净值型分红方案管理</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area">
            <a id="FinNetProductBonusScheme001_btn_bonusScheRegister" class="layui-btn layui-btn-sm btn-create"
               data-th-text="#{FinNetProductBonusScheme001.bonusScheRegister}">分红方案登记</a>
            <a id="FinNetProductBonusScheme001_btn_bonusAmtConfirm" class="layui-btn layui-btn-sm btn-create"
               data-th-text="#{FinNetProductBonusScheme001.bonusAmtConfirm}">分红金额确认</a>
            <a id="FinNetProductBonusScheme001_btn_bonusCash" class="layui-btn layui-btn-sm btn-create"
               data-th-text="#{FinNetProductBonusScheme001.bonusCash}">现金红利下发</a>
            <a id="FinNetProductBonusScheme001_btn_bonusShareConfirm" class="layui-btn layui-btn-sm btn-create"
               data-th-text="#{FinNetProductBonusScheme001.bonusShareConfirm}">再投份额确认</a>           
            <a id="FinNetProductBonusScheme001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
				data-th-text="#{SysCommon.revoke}">撤销</a>
			<a th:if="${isEleShow['FinNetProductBonusScheme001_btn_sendSale']} ne 'N'" id="FinNetProductBonusScheme001_btn_sendSale" class="layui-btn layui-btn-sm">
				<i class="iconfont icon-execute"></i>
				<span data-th-text="#{FinNetProductBonusScheme001.sendInterf}">发送</span>
			</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                   <input type="text" id="dealMode" name="dealMode" class="layui-input form-input"  style = "display: none">
                   <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{FinNetProductBonusScheme001.finprodMarketId}">产品名称</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="finprodMarketId" name="finprodMarketId"
                                    class="layui-input form-input input-select"
                                    data-th-data-url="@{/invest/product/productduration/netproductbonusscheme/FinNetProductBonusScheme001/getFinprodMarketId}"
                                    allowClear="true" data-th-value='${entity?.finprodMarketId}'>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{FinNetProductBonusScheme001.prodStyle}">产品款型</label>
                        <div class="layui-input-inline input-inline">
                             <select name="prodStyle" id="prodStyle"
                                            class="layui-input form-input input-select"
                                            data-th-initValue='${entity?.prodStyle}'>
                             </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{FinNetProductBonusScheme001.delDate}">除权日</label>
                        <div class="layui-input-inline input-inline">
                            <input id="delDate" name="delDate"
                                   class="layui-input form-input input-dateRangeSelect"
                                   placeholder="请选择时间区间"
                                   data-th-placeholder="#{SysCommon.dateInterval}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                   <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{FinNetProductBonusScheme001.regDate}">权益登记日</label>
                        <div class="layui-input-inline input-inline">
                            <input id="regDate" name="regDate"
                                   class="layui-input form-input input-dateRangeSelect"
                                   placeholder="请选择时间区间"
                                   data-th-placeholder="#{SysCommon.dateInterval}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{FinNetProductBonusScheme001.vluRefDate}">净值参考日</label>
                        <div class="layui-input-inline input-inline">
                            <input id="vluRefDate" name="vluRefDate"
                                   class="layui-input form-input input-dateRangeSelect"
                                   placeholder="请选择时间区间"
                                   data-th-placeholder="#{SysCommon.dateInterval}"/>
                        </div>
                    </div>
                    
					<div th:if="${isEleShow['FinNetProductBonusScheme001_sendStatus']} ne 'N'"
						class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							data-th-text="#{FinNetProductBonusScheme001.sendStatus}">发送状态</label>
						<div class="layui-input-inline input-inline">
							<select name="sendStatus"
									id="sendStatus"
									class="layui-input form-input input-select"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-initValue='${entity?.sendStatus}'
									data-th-data-result="${SEND_STATUS}">
							</select>
						</div>
					</div>
                </div>
                                
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
	<script th:inline="javascript">
           var isSendStatusTableShow = [[${isEleShow['send_status_table']}]];
           var isSendStatusTableLinkShow = [[${isEleShow['send_status_table_link']}]];
           var isSendRemarkTableShow = [[${isEleShow['send_remark_table']}]];
           
           var YES = /*[[${YES}]]*/'Y'; // 数据字典.是否_是
	</script>
    <script data-th-src="@{/js/invest/product/productduration/netproductbonusscheme/FinNetProductBonusScheme001.js}" type="text/javascript"></script>
</div>
</body>
</html>
