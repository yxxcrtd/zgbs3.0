<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>期次管理-新建</title>
<style>
.rate-inline-wrapper .select2-container{
width: 33%!important;
}
</style>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form" id="PeriodicManagement002_Form">
		<input type="text" name="termType" id="termType" data-th-value='${entity?.termType}' hidden>
		<input type="text" name="finprodAbbr" id="finprodAbbr" data-th-value='${entity?.finprodAbbr}' hidden> 
		<input type="text" name="profitType" id="profitType" data-th-value='${entity?.profitType}' hidden> 
		<input type="text" name="periodCashId" id="periodCashId" data-th-value='${entity?.periodCashId}' hidden> 
		<input type="text" name="periodProdId" id="periodProdId" data-th-value='${entity?.periodProdId}' hidden> 
        <input type="text" name="periodProdId2" id="periodProdId2" data-th-value='${entity?.periodProdId}' hidden>    
		<input type="text" name="operateType" id="operateType" data-th-value='${entity?.operateType}' hidden> 
		<input type="text" name="branch" id="branch" data-th-value='${entity?.branch}' hidden>
			<div class="pro-module-wrap">
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">产品代码</label>
						<div class="layui-input-inline input-inline">
							<select id="finprodId" name="finprodId"
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}" allowClear="true"
								formatoption=false
								data-th-data-url="@{/invest/product/productelement/periodicmanagement/PeriodicManagement001/getFinprodIds}"
								data-th-initValue='${entity?.finprodId}' required>
							</select>
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">币种</label>
						<div class="layui-input-inline input-inline">
							<select th:id="ccy" th:name="ccy"
								class="layui-input form-input input-select"
								th:initValue="${entity?.ccy}" data-th-data-result="${CCY}"
								searchable="false">
							</select>
						</div>

					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">期次代码</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="periodId" class="layui-input form-input"
								name="periodId" th:value="${entity?.periodId}" />
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">期次开始日</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="startDate" name="startDate"
								class="layui-input form-input input-dateSelect"
								data-th-value='${#dates.format(entity?.startDate,"yyyy-MM-dd")}' 
								placeholder="请选择日期" 
								required>
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">投资周期(天)</label>
						<div class="layui-input-inline input-inline" id="investCycleSelect">
							<select id="investCycle" name="investCycle" 
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								formatoption=false parentIds="finprodId"
								data-th-data-url="|@{/invest/product/productelement/periodicmanagement/PeriodicManagement002/getInvestCycle}|"
								data-th-initValue='${entity?.investCycle}'>
							</select>
						</div>
						<div class="layui-input-inline input-inline" id="investCycleInput">
							<input type="text" id="investCycle2" name="investCycle2" class="layui-input form-input"
								 th:value="${entity?.investCycle2}?:${entity?.investCycle}" />
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">期次结束日</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="endDate" name="endDate"
								class="layui-input form-input input-dateSelect"
								data-th-value='${#dates.format(entity?.endDate,"yyyy-MM-dd")}' 
								placeholder="请选择日期" required>
						</div>
					</div>
				</div>
			</div>
			<div class="pro-module-wrap">
			    <div class="pro-module">
			        <h3 class="pro-module-title"><span class="title-des" th:text="#{BussBenchMarkInfo}">业绩基准</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
			        <div class="pro-module-item">
			            <div class="layui-form-item">
			            	<div class="form-inline-wrap">
			                    <label class="layui-form-label form-label-wrap" th:text="#{BussBenchMarkInfo.publishType}"></label>
			                    <div class="layui-input-inline input-inline">
			                        <select th:id="BussBenchMarkInfo_publishType"
										th:name="bussBenchMarkInfoDto.publishType"
										class="layui-input form-input input-select"
										th:initValue="${entity.bussBenchMarkInfoDto?.publishType}"
										data-th-data-result="${YES_NO}" searchable="false"
										placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}">
									</select>
			                    </div>
			                </div>
			                </div>
			                <div class="layui-form-item">
			                <div class="form-inline-wrap" id="BussBenchMarkInfo_rateType1">
			                    <label class="layui-form-label form-label-wrap" th:text="#{BussBenchMarkInfo.rateType}"></label>
			                    <div class="layui-input-inline input-inline">
			                        <select th:id="BussBenchMarkInfo_rateType"
										th:name="bussBenchMarkInfoDto.rateType"
										class="layui-input form-input input-select"
										th:initValue="${entity.bussBenchMarkInfoDto?.rateType}"
										data-th-data-result="${INT_TYPE}" searchable="false"
										placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}">
									</select>
			                    </div>
			                </div>
			                <div class="form-inline-wrap" id="BussBenchMarkInfo_rate1">
			                    <label class="layui-form-label form-label-wrap" th:text="#{BussBenchMarkInfo.rate}"></label>
			                    <div class="layui-input-inline input-inline">
			                        <input type="text" th:id="BussBenchMarkInfo_rate"
												th:name="bussBenchMarkInfoDto.rate" length="5"
												th:value="${entity.bussBenchMarkInfoDto?.rate}"
												class="layui-input form-input text-number" data-textrange="4" />
			                    </div>
			                </div>
			            </div>
			            <div class="layui-form-item">
			                <div class="form-inline-wrap" style="width: 100%!important;" id="BussBenchMarkInfo_indexId1">
			                    <label class="layui-form-label form-label-wrap" style="width: 11.9%!important;" th:text="|#{BussBenchMarkInfo.indexId}=|">浮动利率(%)=</label>
			                    <div class="layui-input-inline input-inline rate-inline-wrap rate-inline-wrapper" style="width: 85%!important;">
			                        <select th:id="BussBenchMarkInfo_indexId"
										th:name="bussBenchMarkInfoDto.indexId"
										class="layui-input form-input input-select"
										th:initValue="${entity.bussBenchMarkInfoDto?.indexId}"
										data-th-data-result="${INDEX_ID_SOURCE}" searchable="true"
										placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}">
									</select>
			                    	<span class="rate-text" th:text="#{BussBenchMarkInfo.coefficient}"></span>
			                        <input type="text" th:id="BussBenchMarkInfo_coefficient"
												th:name="bussBenchMarkInfoDto.coefficient" length="5"
												th:value="${entity.bussBenchMarkInfoDto?.coefficient}"
												class="layui-input form-input text-number" style="display:inline-block;width: 143px;" data-textrange="2" />
				                    <span class="rate-text" th:text="#{BussBenchMarkInfo.spreadRate}"></span>
			                        <input type="text" th:id="BussBenchMarkInfo_spreadRate"
												th:name="bussBenchMarkInfoDto.spreadRate" length="5"
												th:value="${entity.bussBenchMarkInfoDto?.spreadRate}"
												class="layui-input form-input text-number" style="display:inline-block;width: 180px;" data-textrange="4" />
			                    </div>
							</div>
			            </div>
			            <div class="layui-form-item">
			                <div class="form-inline-wrap" id="BussBenchMarkInfo_resetType1">
			                    <label class="layui-form-label form-label-wrap" th:text="#{BussBenchMarkInfo.resetType}"></label>
			                    <div class="layui-input-inline input-inline">
			                        <select th:id="BussBenchMarkInfo_resetType"
										th:name="bussBenchMarkInfoDto.resetType"
										class="layui-input form-input input-select"
										th:initValue="${entity.bussBenchMarkInfoDto?.resetType}"
										data-th-data-result="${EFFECTIVE_RULE}" searchable="false"
										placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}"
										required="required">
									</select>
			                    </div>
			                </div>
			            </div>
						<div class="layui-form-item" th:id="BussBenchMarkInfo_div2">
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									th:text="#{BussBenchMarkInfo.rateLower}"></label>
								<div class="layui-input-inline input-inline">
									<input type="text" th:id="BussBenchMarkInfo_rateLower"
										th:name="bussBenchMarkInfoDto.rateLower" length="5"
										th:value="${entity.bussBenchMarkInfoDto?.rateLower}"
										class="layui-input form-input text-number" data-textrange="4" />
								</div>
							</div>
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									th:text="#{BussBenchMarkInfo.rateLimit}"></label>
								<div class="layui-input-inline input-inline">
									<input type="text" th:id="BussBenchMarkInfo_rateLimit"
										th:name="bussBenchMarkInfoDto.rateLimit" length="5"
										th:value="${entity.bussBenchMarkInfoDto?.rateLimit}"
										class="layui-input form-input text-number" data-textrange="4" />
								</div>
							</div>
						</div>
					</div>
			    </div>
			</div>

			<div class="pro-module-wrap" id="BussFinProductFloatFee_DIV">
				<div class="pro-module">
					<h3 class="pro-module-title">
						<span class="title-des" th:text="#{BussFinProductFloatFee}">浮动管理费信息</span><i
							class="iconfont icon-arrow-down pro-down-icon"></i>
					</h3>
					<div class="pro-module-item">
						<div class="layui-form-item">
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									th:text="#{BussFinProductFloatFee.feeName}">费用名称</label>
								<div class="layui-input-inline input-inline">
									<select th:id="BussFinProductFloatFee_feeId"
										th:name="bussFinProductFloatFeeDto.feeId"
										class="layui-input form-input input-select"
										th:initValue="${entity.bussFinProductFloatFeeDto?.feeId}"
										data-th-data-url="@{/component/prod/BussFinProductFloatFee/queryFeeNameInfoList}"
										placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}">
									</select>
								</div>
							</div>
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									th:text="#{BussFinProductFloatFee.basicBill}">计费基数</label>
								<div class="layui-input-inline input-inline">
									<select th:id="BussFinProductFloatFee_basicBill"
										th:name="bussFinProductFloatFeeDto.basicBill"
										class="layui-input form-input input-select"
										th:initValue="${entity.bussFinProductFloatFeeDto?.basicBill}" searchable="false"
										data-th-data-result="${BILL_BASE_FEE_KIND}"
										placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}">
									</select>
								</div>
							</div>
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									th:text="#{BussFinProductFloatFee.basis}">计息基础</label>
								<div class="layui-input-inline input-inline">
									<select th:id="BussFinProductFloatFee_basis"
										th:name="bussFinProductFloatFeeDto.basis"
										class="layui-input form-input input-select"
										th:initValue="${entity.bussFinProductFloatFeeDto?.basis}" searchable="false"
										data-th-data-result="${BASIS}" placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}">
									</select>
								</div>
							</div>
						</div>
						<div class="layui-form-item">
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									th:text="#{BussBenchMarkInfo.rateType}"></label>
								<div class="layui-input-inline input-inline">
									<select th:id="BussFinProductFloatFee_rateType"
										th:name="bussFinProductFloatFeeDto.rateType"
										class="layui-input form-input input-select"
										th:initValue="${entity.bussFinProductFloatFeeDto?.rateType}"
										data-th-data-result="${INT_TYPE}" searchable="false"
										placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}">
									</select>
								</div>
							</div>
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									th:text="#{BussBenchMarkInfo.rate}"></label>
								<div class="layui-input-inline input-inline">
									<input type="text" th:id="BussFinProductFloatFee_rate"
										th:name="bussFinProductFloatFeeDto.rate" length="5"
										th:value="${entity.bussFinProductFloatFeeDto?.rate}"
										class="layui-input form-input text-number" data-textrange="4" />
								</div>
							</div>
						</div>
						<div class="layui-form-item">
							<div class="form-inline-wrap" style="width: 100% !important;">
								<label class="layui-form-label form-label-wrap"
									style="width: 11.9% !important;"
									th:text="|#{BussBenchMarkInfo.indexId}=|">浮动利率(%)=</label>
								<div class="layui-input-inline input-inline rate-inline-wrap rate-inline-wrapper"
									style="width: 85% !important;">
									<select th:id="BussFinProductFloatFee_indexId"
										th:name="bussFinProductFloatFeeDto.indexId"
										class="layui-input form-input input-select"
										th:initValue="${entity.bussFinProductFloatFeeDto?.indexId}"
										data-th-data-result="${INDEX_ID_SOURCE}" searchable="true"
										placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}">
									</select> 
									<span class="rate-text" th:text="#{BussBenchMarkInfo.coefficient}"></span> 
									<input type="text" th:id="BussFinProductFloatFee_coefficient"
										th:name="bussFinProductFloatFeeDto.coefficient" length="5"
										th:value="${entity.bussFinProductFloatFeeDto?.coefficient}"
										class="layui-input form-input text-number"
										style="display: inline-block; width: 143px;"
										data-textrange="2" /> 
									<span class="rate-text" th:text="#{BussBenchMarkInfo.spreadRate}"></span> 
									<input type="text" th:id="BussFinProductFloatFee_spreadRate"
										th:name="bussFinProductFloatFeeDto.spreadRate" length="5"
										th:value="${entity.bussFinProductFloatFeeDto?.spreadRate}"
										class="layui-input form-input text-number"
										style="display: inline-block; width: 180px;"
										data-textrange="4" />
								</div>
							</div>
						</div>
						<div class="layui-form-item">
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									th:text="#{BussBenchMarkInfo.resetType}"></label>
								<div class="layui-input-inline input-inline">
									<select th:id="BussFinProductFloatFee_resetType"
										th:name="bussFinProductFloatFeeDto.resetType"
										class="layui-input form-input input-select"
										th:initValue="${entity.bussFinProductFloatFeeDto?.resetType}"
										data-th-data-result="${EFFECTIVE_RULE}" searchable="false"
										placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}"
										required="required">
									</select>
								</div>
							</div>
						</div>
						<div class="layui-form-item">
							<table class="layui-table pro-table-wrap" th:id="dataTable"></table>
						</div>
						<div class="layui-form-item"
							style="margin-left: 10px; font-size: 16px">浮动管理费描述</div>
						<div class="layui-form-item">
							<div class="layui-input-inline input-inline"
								style="margin: 0 10px; width: 98% !important;">
								<textarea name="bussFinProductFloatFeeDto.remark" id="BussFinProductFloatFee_remark" maxlength="200"
									th:text="${entity.bussFinProductFloatFeeDto?.remark}" class="layui-textarea"
									placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"></textarea>
							</div>
						</div>
					</div>
				</div>
			</div>
			<!-- 备注 
			<div class="pro-module-wrap">
				<div class="pro-module">
					<h3 class="pro-module-title">
						<span class="title-des">备注</span><i
							class="iconfont icon-arrow-down pro-down-icon"></i>
					</h3>
					<div class="layui-form-item">
						<div class="layui-input-inline input-inline"
							style="margin: 0 10px; width: 98% !important;">
							<textarea name="remark" id="remark" maxlength="200"
								th:text="${entity?.remark}" class="layui-textarea"
								placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"></textarea>
						</div>
					</div>
				</div>
			</div>-->
			<!-- 按钮 -->
			<div class="layui-form-item" align="center">
				<a id="PeriodicManagement002_btn_save"
					class="layui-btn layui-btn-sm btn-save"
					data-th-text="#{SysCommon.save}">保存</a> <a
					id="PeriodicManagement002_btn_submit"
					class="layui-btn layui-btn-sm btn-submit"
					data-th-text="#{SysCommon.submit}">提交</a> <a
					id="PeriodicManagement002_btn_cancel"
					class="layui-btn layui-btn-sm btn-cancel"
					data-th-text="#{SysCommon.cancel}">取消</a>
			</div>
	</div>
	</form>






</body>
<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">
	var workflowId = /*[[${entity?.workflowId}]]*/'';
	var fromToDoList = /*[[${fromToDoList}]]*/'';
		</script>
	<script
		data-th-src="@{/js/invest/product/productelement/periodicmanagement/PeriodicManagement002.js}"
		type="text/javascript"></script>
</div>
</html>
