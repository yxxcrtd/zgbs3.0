<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{FinProductAddReduce001}">收益型产品提前赎回管理</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a id="FinProductAddReduce001_btn_addreduce" class="layui-btn layui-btn-sm btn-create"><i class="iconfont icon-strongadd"></i><span data-th-text="#{FinProductAddReduce001.addreduce}">强增强减</span></a>
        <a id="FinProductAddReduce001_btn_revoke" class="layui-btn layui-btn-sm btn-delete"><i class="iconfont icon-revoke"></i><span data-th-text="#{pingan.common.revoke}">撤销</span></a>
    </div>

    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FinProductAddReduce001.prodId}">产品代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="prodId" name="prodId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="false"
                                data-th-data-url="@{/invest/product/productduration/addreduce/FinProductAddReduce001/getProdId01}"
                                multiple="true" >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FinProductAddReduce001.cfmDate}">确认日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="cfmDate" class="layui-input form-input input-dateRangeSelect" />
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-lable"
						data-th-text="#{FinProductAddReduce001.effectStatus}">有效状态</label>
					<div class="layui-input-inline input-inline">
						<select id="effectStatus"
							class="layui-input form-input input-select"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-data-result="${STATUS_VALID}">
						</select>
					</div>
				</div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FinProductAddReduce001.dealType}">交易类型</label>
                    <div class="layui-input-inline input-inline">
                        <select formatoption="true" type="text" id="dealType" name="dealType" maxlength="50"
                                class="layui-input form-input input-select"
                                data-th-data-result='${PS}' allowClear="true" multiple="true"  placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FinProductAddReduce001.groupId}">组合代码</label>
                    <div class="layui-input-inline input-inline">
                    <select type="text" id="groupId" name="groupId" 
									class="layui-input form-input input-select" allowClear="true"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									formatoption=false 
									data-th-data-url="@{/invest/product/productelement/build/FinProductBuild001/queryGroupIdInfo?flag=02}">
					</select>
                      <!--   <input type="text" id="groupId" name="groupId" class="layui-input form-input input-lenovoselect"
                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-data-url="@{/invest/product/common/getGroupId}"
                               data-idfield="code" data-keyfield="shortName"
                               data-th-data-effectivefieldsalias='|{"shortName":"#{FinProductAddReduce001.groupName}","code":"#{FinProductAddReduce001.groupId}"}|'/>-->
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/product/productduration/addreduce/FinProductAddReduce001.js}" type="text/javascript"></script>
</div>
</body>

</html>
