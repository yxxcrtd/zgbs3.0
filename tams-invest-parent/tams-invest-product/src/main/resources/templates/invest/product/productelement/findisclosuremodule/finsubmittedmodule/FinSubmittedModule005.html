<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinSubmittedModule005}">附件上传</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm">
            <div class="layui-form-item">
                    <label class="layui-form-label form-lable" data-th-text="#{FinSubmittedModule003.appendix}" style="width:16%;">上传附件</label>
                    <div class="layui-input-inline input-inline">
	                    <div class="upload" id="appendix" required
	                         th:disabled="${pageModel} eq ${pageModelReference}"
	                         th:data-data='${attachmentFiles}'
	                         data-option="{allowFileType: 'xls|xlsx|doc|pdf|pptx|txt|docx|ppt|ftl', callback: 'FinSubmittedModule005.onUploaded'}">
	                    </div>
                    </div>
            </div>
                <div style="display:none" class=" layui-col-md10  layui-col-sm10 layui-col-lg10">
                    <input type="text" id="seqno"
                           name="seqno" class="layui-input form-input" />
                </div>
        </form>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/product/productelement/findisclosuremodule/finsubmittedmodule/FinSubmittedModule005.js}"
                type="text/javascript">
        </script>
        <script data-th-inline="javascript" type="text/javascript">
            var businessId =/*[[${businessId}]]*/'';
  </script>
    </div>
</body>
</html>
