<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{Productelementdes001}">产品要素设计查询</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				<a id="Productelementdes001_btn_design" class="layui-btn layui-btn-sm "
				   data-th-text="#{Productelementdes001.design}">要素设计</a>
				<a id="Productelementdes001_btn_edit" class="layui-btn layui-btn-sm  "
					data-th-text="#{Productelementdes001.edit}" style="display: none">修改</a>
				<a id="Productelementdes001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
				data-th-text="#{SysCommon.delete}" style="display: none">删除</a>
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{Productelementdes001.statusValid}">有效状态</label>
							<div class="layui-input-inline input-inline">
								<select id="dataStatus" name="dataStatus" th:data-result="${STATUS_VALID}" class="layui-input form-input input-select" data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" data-th-text="#{Productelementdes001.prdDesignId}">产品设计编号</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="prdDesignId" name="prdDesignId"
									   class="layui-input form-input" placeholder="请输入内容"
									   data-th-placeholder="#{SysCommon.placeholder}" >
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" data-th-text="#{Productelementdes001.prdDesignSerialName}">产品设计系列名称</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="prdDesignSerialName" name="prdDesignSerialName"
									   class="layui-input form-input" placeholder="请输入内容"
									   data-th-placeholder="#{SysCommon.placeholder}" >
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{Productelementdes001.raiseType}">募集方式</label>
							<div class="layui-input-inline input-inline">
								<select id="raiseType" name="raiseType" th:data-result="${RAISE_TYPE}"   class="layui-input form-input input-select"
										data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{Productelementdes001.investNature}">投资性质</label>
							<div class="layui-input-inline input-inline">
								<select id="investNature" name="investNature" th:data-result="${INVEST_TYPE}"   class="layui-input form-input input-select"
										data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{Productelementdes001.SvrOperatemodeDeclare}">产品运作模式</label>
							<div class="layui-input-inline input-inline">
								<select id="operateMode" name="operateMode" th:data-result="${SVR_OPERATEMODE_DECLARE}"   class="layui-input form-input input-select"
										data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
					</div>
					<div class="layui-form-item">

						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{Productelementdes001.SaletargetDeclare}">目标客户类型</label>
							<div class="layui-input-inline input-inline">
								<select id="SaletargetDeclare" name="SaletargetDeclare" th:data-result="${SALETARGET_DECLARE}"   class="layui-input form-input input-select"
										data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
					</div>
				</form>
			</div>

			<div class="layui-tab">
				<ul class="layui-tab-title">
					<li class="layui-this" id="table1">产品需求信息</li>
					<li id="table2">产品要素设计信息</li>
				</ul>
				<div class="layui-tab-content">
					<div class="layui-tab-item  layui-show">
						<table class="layui-table" id="detailDataTable"></table>
					</div>
					<div class="layui-tab-item">
						<table class="layui-table" id="dataTable"></table>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script
			data-th-src="@{/js/invest/product/rddesign/productelementdes/Productelementdes001.js}"></script>
	</div>
</body>
</html>
