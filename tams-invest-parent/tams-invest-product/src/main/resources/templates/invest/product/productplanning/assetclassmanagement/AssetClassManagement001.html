<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{AssetClassManagement.title}">资产分类管理</title>
</head>
<body>
    <div layout:fragment="content"> 
        <div class="form-button-area">
            <a id="AssetClassManagement001_btn_add" class="layui-btn layui-btn-sm btn-create"
                data-th-text="#{SysCommon.create}">新建</a> 
            <a id="AssetClassManagement001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
                data-th-text="#{SysCommon.delete}">删除</a>
        </div>
        <div class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{AssetClassManagement.customAssetTypeTwo}">资产二级分类</label>
                        <div class="layui-input-inline input-inline">
                            <select id="customAssetTypeTwo" name="customAssetTypeTwo" class="layui-input form-input input-select"
                                formatoption=true data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${CUSTOM_ASSET_TYPE_TWO}" 
                                
                                data-th-childrenIds="customAssetTypeThree" 
                                placeholder="请输入内容" multiple>
                                
                                
                                
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{AssetClassManagement.customAssetTypeThree}">资产三级分类</label>
                        <div class="layui-input-inline input-inline">
                            <select id="customAssetTypeThree" name="customAssetTypeThree"
                                class="layui-input form-input input-select" formatoption=true
                                 data-th-placeholder="#{SysCommon.placeholder}"
                                 data-th-data-result="${CUSTOM_ASSET_TYPE_THREE}" 
                                 data-th-parentIds="customAssetTypeTwo"
                                 data-th-childrenIds="customAssetTypeFour" 
                                 placeholder="请输入内容" multiple>
                                
                             
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{AssetClassManagement.customAssetTypeFour}">资产四级分类</label>
                        <div class="layui-input-inline input-inline">
                            <select id="customAssetTypeFour" name="customAssetTypeFour" class="layui-input form-input input-select"
                                formatoption=true data-th-placeholder="#{SysCommon.placeholder}"
                        
                                data-th-data-result="${CUSTOM_ASSET_TYPE_FOUR}"
                                data-th-parentIds="customAssetTypeThree"
                                 data-th-childrenIds="customAssetTypeFive" 
                                 placeholder="请输入内容" multiple>
                                 
                                    
                                
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{AssetClassManagement.customAssetTypeFive}">资产五级分类</label>
                        <div class="layui-input-inline input-inline">
                            <select id="customAssetTypeFive" name="customAssetTypeFive" class="layui-input form-input input-select"
                                formatoption=true data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-parentIds="customAssetTypeFour"
                                 
                                data-th-data-result="${CUSTOM_ASSET_TYPE_FIVE}" placeholder="请输入内容" multiple>
                                                 
 
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{AssetClassManagement.assetType}">资产大类</label>
                        <div class="layui-input-inline input-inline">
                            <select id="assetType" name="assetType" class="layui-input form-input input-select"
                                formatoption=true data-th-placeholder="#{SysCommon.placeholder}"
                                 data-th-data-result="${ASSET_CLASS}" placeholder="请输入内容" multiple>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                            data-th-text="#{AssetClassManagement.pinanAssetType}">大类资产配置系统类型</label>
                        <div class="layui-input-inline input-inline">
                            <select id="pinanAssetType" name="pinanAssetType"
                                class="layui-input form-input input-select" formatoption=true
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${ASSET_TYPE}"
                                placeholder="请输入内容" multiple>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{AssetClassManagement.isNonstandard}">是否非标</label>
                        <div class="layui-input-inline input-inline">
                            <select id="isNonstandard" name="isNonstandard"
                                class="layui-input form-input input-select" formatoption=true
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${YES_OR_NO}"
                                placeholder="请输入内容">
                            </select>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/product/productplanning/assetclassmanagement/AssetClassManagement001.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
