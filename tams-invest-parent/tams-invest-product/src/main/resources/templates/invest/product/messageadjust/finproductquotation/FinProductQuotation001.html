<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinProductQuotation001}">产品报价管理</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				
				<a id="FinProductQuotation001_btn_add" class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a>
				<a id="FinProductQuotation001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
				data-th-text="#{SysCommon.delete}">删除</a>
			<a th:if="${isEleShow['FinProductQuotation001_btn_sendSale']} ne 'N'" id="FinProductQuotation001_btn_sendSale" class="layui-btn layui-btn-sm">
				<i class="iconfont icon-execute"></i>
				<span data-th-text="#{FinProductQuotation001.sendInterf}">发送</span>
			</a>
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductQuotation001.finprodMarketId}">产品代码</label>
							<div class="layui-input-inline input-inline">
								<select id="FinProductQuotation001_finprodId" name="finprodId"
									class="layui-input form-input input-select" formatoption=false
									data-th-placeholder="#{SysCommon.placeholder}" multiple="true"
 									data-th-data-url="@{/invest/product/messageadjust/finproductquotation/FinProductQuotation001/queryProdIdInfoIssueSuc}">
								</select>		
							</div>
						</div>
                       <!--  <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
                            <label class="layui-form-label form-lable"
                                data-th-text="#{FinProductQuotation002.prodType}">产品款型</label>
                            <div class="layui-input-inline input-inline">
                                <select id="prodType" name="prodType"
                                    class="layui-input form-input input-select" formatoption=false
                                    data-th-placeholder="#{SysCommon.placeholder}" multiple="true"
                                    data-th-data-url="@{/invest/product/messageadjust/finproductquotation/FinProductQuotation001/getProdType}">
                                </select>       
                            </div>
                        </div>   -->
						<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductQuotation001.effDate}">生效日</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="FinProductQuotation001_effDate" name="effDate"
									class="layui-input form-input input-dateRangeSelect"
									placeholder="请选择时间区间"
									data-th-placeholder="#{SysCommon.placeholder}" />
							</div>
						</div>
						
						<div th:if="${isEleShow['FinProductQuotation001_sendStatus']} ne 'N'"
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductQuotation001.sendStatus}">发送状态</label>
							<div class="layui-input-inline input-inline">
								<select name="sendStatus"
										id="sendStatus"
										class="layui-input form-input input-select"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-initValue='${entity?.sendStatus}'
										data-th-data-result="${SEND_STATUS}">
								</select>
							</div>
						</div>
						<!-- <div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductQuotation001.releaseDate}">报价日</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="FinProductQuotation001_releaseDate" name="releaseDate"
									class="layui-input form-input input-dateRangeSelect"
									placeholder="请选择时间区间"
									data-th-placeholder="#{SysCommon.placeholder}" />
							</div>
						</div> -->
					</div>
					<!--<div class="layui-form-item">
						 <div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductQuotation001.saleDepartment}">销售部门</label>
							<div class="layui-input-inline input-inline">
								<select formatoption="true" type="text" id="FinProductQuotation001_saleDepartment" name="saleDepartment"
                                	class="layui-input form-input input-select"
                                	data-th-data-result='${SALE_DEPT}' allowClear="true" placeholder="请输入内容"
                                	data-th-placeholder="#{SysCommon.placeholder}">
                        		</select>
							</div>
						</div> 
					</div>-->
				</form>
			</div>

			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
	<script th:inline="javascript">
           var isSendStatusTableShow = [[${isEleShow['send_status_table']}]];
           var isSendStatusTableLinkShow = [[${isEleShow['send_status_table_link']}]];
	</script>
		<script
			data-th-src="@{/js/invest/product/messageadjust/finproductquotation/FinProductQuotation001.js}"></script>
	</div>
</body>
</html>
