<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{AssetClassManagement002}">资产分类维护</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="AssetClassManagement002_Form">
            <!-- 隐藏域 -->
             <input type="hidden" id="workflowId"
				name="workflowId" data-th-value="${entity?.workflowId}" />  
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{AssetClassManagement.customAssetTypeTwo}">资产二级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select id="customAssetTypeTwo" name="customAssetTypeTwo" class="layui-input form-input input-select"
                                formatoption=true data-th-placeholder="#{SysCommon.placeholder}" 
                                required
                                data-th-childrenIds="customAssetTypeThree"
                                data-th-initvalue="${entity?.customAssetTypeTwo}"
                                data-th-data-result="${CUSTOM_ASSET_TYPE_TWO}" placeholder="请输入内容" >
                            </select>
                    </div>
                </div>
                
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{AssetClassManagement.customAssetTypeThree}">资产三级分类</label>
                    <div class="layui-input-inline input-inline">
                    	 <select id="customAssetTypeThree" name="customAssetTypeThree"
                                class="layui-input form-input input-select" formatoption=true
                                data-th-placeholder="#{SysCommon.placeholder}"
                                required
                                data-th-parentIds="customAssetTypeTwo"                                                            
                                data-th-childrenIds="customAssetTypeFour"
                                data-th-initvalue="${entity?.customAssetTypeThree}"
                                data-th-data-result="${CUSTOM_ASSET_TYPE_THREE}" placeholder="请输入内容" >
                            </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{AssetClassManagement.customAssetTypeFour}">资产四级分类</label>
                    <div class="layui-input-inline input-inline">
                       <select id="customAssetTypeFour" name="customAssetTypeFour" class="layui-input form-input input-select"
                                formatoption=true data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-initvalue="${entity?.customAssetTypeFour}"
                                required
                                data-th-parentIds="customAssetTypeThree"
                                data-th-childrenIds="customAssetTypeFive"
                                
                                data-th-data-result="${CUSTOM_ASSET_TYPE_FOUR}" placeholder="请输入内容" >
                            </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable" data-th-text="#{AssetClassManagement.customAssetTypeFive}">资产五级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select id="customAssetTypeFive" name="customAssetTypeFive" class="layui-input form-input input-select"
                                formatoption=true data-th-placeholder="#{SysCommon.placeholder}"
                                 required
                                data-th-initvalue="${entity?.customAssetTypeFive}"
                               
                                data-th-parentIds="customAssetTypeFour"                              
                                data-th-data-result="${CUSTOM_ASSET_TYPE_FIVE}" placeholder="请输入内容" >
                            </select>
					</div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                        data-th-text="#{AssetClassManagement.assetType}">资产大类</label>
                    <div class="layui-input-inline input-inline">
                    	<select id="assetType" name="assetType" class="layui-input form-input input-select"
                                formatoption=true data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-initvalue="${entity?.assetType}"
                                required
                                 
                                data-th-data-result="${ASSET_CLASS}" placeholder="请输入内容" >
                            </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                        data-th-text="#{AssetClassManagement.pinanAssetType}">大类资产配置系统类型</label>
                    <div class="layui-input-inline input-inline">
                    	<select id="pinanAssetType" name="pinanAssetType" class="layui-input form-input input-select"
                                formatoption=true data-th-placeholder="#{SysCommon.placeholder}"
                                required
                                data-th-initvalue="${entity?.pinanAssetType}"
                                data-th-data-result="${ASSET_TYPE}" placeholder="请输入内容" >
                            </select>
                    </div>
                </div>
            </div>
             <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{AssetClassManagement.isNonstandard}">是否非标</label>
                        <div class="layui-input-inline input-inline">
                            <select id="isNonstandard" name="isNonstandard"
                                class="layui-input form-input input-select" formatoption=true
                                required
                                data-th-initvalue="${entity?.isNonstandard}"
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${YES_OR_NO}"
                                placeholder="请输入内容">
                            </select>
                        </div>
                    </div>
                </div>
          <div class="text-center">
						<a th:id="|${pageId}_btn_save|"
							class="layui-btn layui-btn-sm btn-save"
							data-th-text="#{SysCommon.save}">保存</a> <a
							th:id="|${pageId}_btn_submit|"
							class="layui-btn layui-btn-sm btn-submit"
							data-th-text="#{SysCommon.submit}">提交</a> <a
							th:id="|${pageId}_btn_cancel|"
							class="layui-btn layui-btn-sm btn-cancel"
							data-th-text="#{SysCommon.cancel}">取消</a>
					</div>
        </form>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/product/productplanning/assetclassmanagement/AssetClassManagement002.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
