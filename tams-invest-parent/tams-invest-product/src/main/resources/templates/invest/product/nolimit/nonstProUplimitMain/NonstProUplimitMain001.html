<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{NonstProUplimitMain001}">非标比例上限维护</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				<a id="NonstProUplimitMain001_btn_new"
					class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a>
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{NonstProUplimitMain001.sreachTime}">查询时间</label>
							<div class="layui-input-inline input-inline">
								<input id="sreachTime" name='sreachTime'
									class="layui-input form-input input-dateSelect"
									placeholder="请选择查询时间" allowClear="true"
									data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
						<div
							class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{NonstProUplimitMain001.finPrdFamily}">产品系列</label>
							<div class="layui-input-inline input-inline">
								<select id="finPrdFamily" name="finPrdFamily"
									class="layui-input form-input input-select"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-url="@{/invest/product/nolimit/nonstProUplimitMain/NonstProUplimitMain001/selectPrdFamily}">
								</select>
							</div>
						</div>
					</div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script th:inline="javascript">

		</script>
		<script
			data-th-src="@{/js/invest/product/nolimit/nonstProUplimitMain/NonstProUplimitMain001.js}"></script>
	</div>
</body>
</html>
