<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
	<title data-th-text="#{ProductSimulationTrial001}">产品模拟试算</title>
</head>

<body>
<div layout:fragment="content">
	<div class="form-button-area">
		<a id="ProductSimulationTrial001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
	</div>
	<div class="joyin-form-wrap joyin-filter-form condition-area">
		<form class="layui-form" id="searchForm">
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-lable" data-th-text="#{ProductSimulationTrial001.prdDesignId}">产品设计系列编号</label>
					<div class="layui-input-inline input-inline">
						<select type="text" id="prdDesignId" name="prdDesignId"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-url="@{/invest/product/rddesign/productsimulationtrial/ProductSimulationTrial001/queryDesignIdInfo}"
								multiple="true" >
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-lable"
						   data-th-text="#{ProductSimulationTrial001.mockDate}">测算日</label>
					<div class="layui-input-inline input-inline">
						<input id='mockDate' name='mockDate' class="layui-input form-input input-dateSelect"
							   placeholder="请选择时间" data-th-placeholder="#{SysCommon.placeholder}"
							   data-th-value='${#dates.format(entity?.mockDate,"yyyy-MM-dd")}'>
					</div>
				</div>
				<div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-lable" data-th-text="#{ProductSimulationTrial001.dataStatus}">有效状态</label>
					<div class="layui-input-inline input-inline">
						<select type="text" id="dataStatus" name="dataStatus"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${STATUS_VALID}'
								allowClear="true" formatoption="true" >
						</select>
					</div>
				</div>
			</div>
		</form>
	</div>
	<div>
		<table class="layui-table" id="dataTable"></table>
	</div>
</div>
<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">
	</script>
	<script data-th-src="@{/js/invest/product/rddesign/productsimulationtrial/Productsimulationtrial001.js}" type="text/javascript"></script>
</div>
</body>
</html>
