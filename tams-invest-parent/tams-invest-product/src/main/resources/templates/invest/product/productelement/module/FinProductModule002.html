<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinProductModule002}">产品模板新建</title>
    <style type="text/css">
    	.rate-inline-wrapper .select2-container{
			width: 33%!important;
		}
		.rate-inline-wrapper1 .select2-container{
			width: 100px!important;
			vertical-align: bottom;
		}
		.buss-inline .select2-container{
			width: 90px !important;
		}
        .layui-form-radio{
            margin: 0;
            padding-right: 0;
        }
        .layui-form-radio>i{
            font-size: 18px;
            margin-right: 2px;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div class="pro-module-container page-step">
            <form class="layui-form joyin-form-wrap pro-module-form" id="productModuleForm">
            <input id="workflowId" name="workflowId" data-th-value="${workflowId}" hidden>
			<!-- 隐藏字段 新建费用时缓存key值 -->
			<input type="text" id="FinProductModule002_finprodId" name="feeNewAddId" data-th-value='${finprodId}' hidden>
            
            <div class="pro-module-wrapper pro-module-base step" title="基本信息">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductModule001.templetId}">模板代码</label>
                                    <div class="layui-input-inline input-inline">
										<input type="text" th:id="|productModuleInfo_templateId|"
											name="productModuleInfo.templateId"
											class="layui-input form-input"
											maxLength="32"
											placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-value='${productModuleInfo?.templateId}'
											th:disabled="${pageModel ne pageModelNew}">
										<a id="FinProductModule002_btn_quickInput" class="layui-btn layui-btn-sm form-input-text"
                                            th:classappend="${pageModel ne pageModelNew} ? 'layui-btn-disabled' : ''" th:disabled="${pageModel ne pageModelNew}">快录</a>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductModule001.templetName}">模板名称</label>
                                    <div class="layui-input-inline input-inline">
										<input type="text" th:id="|productModuleInfo_templateName|"
											name="productModuleInfo.templateName"
											class="layui-input form-input"
											maxLength="50"
											placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}"
											th:disabled="${pageModel ne pageModelNew}"
											data-th-value='${productModuleInfo?.templateName}' required>
									</div>
                                </div>
                                <div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{FinProductModule002.finprodName}">产品名称</label>
									<div class="layui-input-inline input-inline">
										<input type="text" name="productModuleInfo.finprodName"
											th:id="|productModuleInfo_finprodName|"
											class="layui-input form-input" maxlength=60
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-value='${productModuleInfo?.finprodName}'>
									</div>
								</div>
                            </div>
                            <div class="layui-form-item">
                            	<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductModule002.finprodAbbr}">产品简称</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="productModuleInfo.finprodAbbr"
												th:id="|productModuleInfo_finprodAbbr|"
												class="layui-input form-input" maxlength=60
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-value='${productModuleInfo?.finprodAbbr}'>
										</div>
								</div>
								<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductModule002.prodSeries}">产品系列</label>
										<div class="layui-input-inline input-inline">
											<select name="productModuleInfo.prodSeries"
												th:id="|productModuleInfo_prodSeries|"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue='${productModuleInfo?.prodSeries} ?: ${PROD_SERIES_01}'
												data-th-data-result="${PROD_SERIES}">
											</select>
										</div>
                            	</div>
                            	<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductModule002.prodClass}">产品分类</label>
										<div class="layui-input-inline input-inline">
											<select name="productModuleInfo.prodClass"
												th:id="|productModuleInfo_prodClass|"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue='${productModuleInfo?.prodClass} ?: ${PROD_CLASS_01}'
												data-th-data-result="${PROD_CLASS}">
											</select>
										</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductModule002.prodFeature}">产品特点</label>
										<div class="layui-input-inline input-inline">
											<select name="productModuleInfo.prodFeature"
												th:id="|productModuleInfo_prodFeature|"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue='${productModuleInfo?.prodFeature}'
												data-th-data-result="${PROD_FEATURE}">
											</select>
										</div>
								</div>
								<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductModule002.saleType}">销售类型</label>
										<div class="layui-input-inline input-inline">
											<select name="roductModuleInfo.saleType" th:id="|productModuleInfo_saleType|"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue='${productModuleInfo?.saleType}'
												data-th-data-result="${SALETYPE}">
											</select>
										</div>
								</div>
								<div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductModule002.profitType}">收益类型</label>
										<div class="layui-input-inline input-inline">
											<select th:id="|productModuleInfo_profitType|"
												name="productModuleInfo.profitType"
												class="layui-input form-input input-select"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required
												data-th-data-result="${PROFIT_TYPE}"
												data-th-initValue='${productModuleInfo?.profitType ?: PROFIT_TYPE_01}'
												childrenIds ='productModuleInfo_payType'>
											</select>
										</div>
								</div>
							</div>	
                            <div class="layui-form-item">
								<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductModule001.operationType}">发行方式</label>
										<div class="layui-input-inline input-inline">
											<select th:id="|productModuleInfo_operationType|" name="productModuleInfo.operationType"
													class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}"
													formatoption=false
													data-th-data-result="${ISSUE_MODE}" required 
													data-th-initValue='${productModuleInfo?.operationType}?:${ISSUE_MODE_01}'>												
												</select>
										</div>
								</div>
								<div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductModule002.dealMode}">处理模式</label>
                                    <div class="layui-input-inline input-inline">
										<select th:id="|productModuleInfo_dealMode|"
											name="productModuleInfo.dealMode"
											class="layui-input form-input input-select"
											placeholder="请输入内容"
											allowClear="false"
											th:parentIds="|productModuleInfo_profitType|"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-initValue='${productModuleInfo?.dealMode ?: DISPOSE_PATTERN_01}' required
											data-th-data-url="@{/invest/product/productelement/module/FinProductModule002/getDealModeSelect}">
										</select>
									</div>
                                </div>
                                <div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductModule002.trusteeId}">托管机构</label>
										<div class="layui-input-inline input-inline">
											<select name="productModuleInfo.trusteeId" th:id="|productModuleInfo_trusteeId|"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue='${productModuleInfo?.trusteeId}' 
												data-th-data-url="@{/invest/product/common/queryTrusteeId}"
												>
											</select>
										</div>
								</div>
                            </div>
                            <div class="layui-form-item">
								<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductModule002.profitFlag}">产品收益标识</label>
										<div class="layui-input-inline input-inline">
											<select name="productModuleInfo.profitFlag" th:id="|productModuleInfo_profitFlag|"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue='${productModuleInfo?.profitFlag} ?: ${PROFIT_FLAG_03}'
												data-th-data-result="${PRODPROFITFLAG}" 
												>
											</select>
										</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductModule002.payType}">分红方式</label>
										<div class="layui-input-inline input-inline">
											<select th:id="|productModuleInfo_payType|"
												name="productModuleInfo.payType"
												class="layui-input form-input input-select"
												data-th-data-result="${BONUS_MODE}" searchable="false"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue='${productModuleInfo?.payType}'
												 >
											</select>
										</div>
								</div>
								<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinProductModule002.riskLevel}">产品风险等级</label>
										<div class="layui-input-inline input-inline">
											<select name="productModuleInfo.riskLevel"
													th:id="|productModuleInfo_riskLevel|"
													class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-initValue='${productModuleInfo?.riskLevel}'
													data-th-data-result="${RISKLEVEL}" >
											</select>
										</div>
								</div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductModule002.beforeEndFlag}">是否允许提前终止</label>
										<div class="layui-input-inline input-inline">
											<select name="productModuleInfo.beforeEndFlag"
												th:id="|productModuleInfo_beforeEndFlag|"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue='${productModuleInfo?.beforeEndFlag}'
												data-th-data-result="${YES_OR_NO}" >
											</select>
										</div>
								</div>
								<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductModule002.redFlag}">是否允许客户赎回</label>
										<div class="layui-input-inline input-inline">
											<select name="productModuleInfo.redFlag" th:id="|productModuleInfo_redFlag|"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue='${productModuleInfo?.redFlag}'
												data-th-data-result="${YES_OR_NO}" >
											</select>
										</div>
								</div>
								<div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductModule002.calendarId}">交易日历</label>
										<div class="layui-input-inline input-inline">
											<select th:id="|productModuleInfo_calendarId|"
												name="productModuleInfo.calendarId"
												class="layui-input form-input input-select"
												placeholder="请输入内容"
												formatoption="false"
												data-th-placeholder="#{SysCommon.placeholder}" 
												data-th-data-url="@{/invest/product/common/queryCalendarInfoList}"
												data-th-initValue='${productModuleInfo?.calendarId}'>
											</select>
										</div>
								</div>
                            </div>
                             <div class="layui-form-item">
                            	<div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductModule002.investNature}">投资性质</label>
										<div class="layui-input-inline input-inline">
											<select th:id="|productModuleInfo_investNature|"
												name="productModuleInfo.investNature"
												class="layui-input form-input input-select"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" 
												data-th-data-result="${INVEST_TYPE}"
												data-th-initValue='${productModuleInfo?.investNature ?: INVEST_TYPE_01}'>
											</select>
										</div>
								</div>
								<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductModule002.consignmentFlag}">是否支持代销</label>
										<div class="layui-input-inline input-inline">
											<select name="productModuleInfo.consignmentFlag"
												th:id="|productModuleInfo_consignmentFlag|"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue='${productModuleInfo?.consignmentFlag}'
												data-th-data-result="${YES_OR_NO}">
											</select>
										</div>
								</div>
								<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductModule002.prodManager}">产品经理</label>
										<div class="layui-input-inline input-inline">
											<select type="text" name="productModuleInfo.prodManager"
												th:id="|productModuleInfo_prodManager|"
												class="layui-input form-input input-select" maxlength=60
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue='${productModuleInfo?.prodManager}' 
												data-th-data-url="@{/invest/product/common/getUserName}">
											</select>
										</div>
								</div>
                            </div>
                            <div class="layui-form-item">
                            	<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductModule002.entruster}">所属分行</label>
										<div class="layui-input-inline input-inline">
											<select name="productModuleInfo.entruster" th:id="|productModuleInfo_entruster|"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												multiple="true"
												data-th-data-url="@{/invest/product/common/queryCounterpartyInfo}"
												data-th-initValue='${productModuleInfo?.entruster}'>
											</select>
										</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductModule002.exclusiveProd}">专属产品</label>
										<div class="layui-input-inline input-inline">
											<select name="productModuleInfo.exclusiveProd"
												th:id="|productModuleInfo_exclusiveProd|"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue='${productModuleInfo?.exclusiveProd}'
												data-th-data-result="${YES_OR_NO}" >
											</select>
										</div>
								</div>
								<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinProductModule002.isCashManage}">是否现金管理类产品</label>
											<div class="layui-input-inline input-inline">
												<select name="productModuleInfo.isCashManage"
													th:id="|productModuleInfo_isCashManage|"
													class="layui-input form-input input-select"
													data-th-initValue='${productModuleInfo?.isCashManage}'
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-data-result="${YES_OR_NO}" >
												</select>
											</div>
								</div>
                            </div>
                            <div class="layui-form-item">
                            	
								<div class="form-inline-wrap" id="period_div">
										
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductBuild002.period}">期限</label>
										<div class="layui-input-inline input-inline">
											<select name="productModuleInfo.period"
												id="productModuleInfo_period"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue='${productModuleInfo?.period} ?: ${TERM_TYPE_01}'
												data-th-data-result="${TERM_TYPE}" >
											</select>
										</div>
								</div>
								<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductModule002.investmentCycle}">投资周期（天）</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="productModuleInfo.investmentCycle" oninput="this.value = this.value.replace(/[^0-9]/g, '');"
												th:id="|productModuleInfo_investmentCycle|"
												class="layui-input form-input text-number" data-textrange="0" maxlength=4
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-value='${productModuleInfo?.investmentCycle}'>
										</div>
								</div>
								<div class="form-inline-wrap" id="isAnaplerotic_div" th:if="${isEleShow['isAnaplerotic_div']} ne 'N'">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductBuild002.isAnaplerotic}">是否回补</label>
										<div class="layui-input-inline input-inline">
											<select name="productModuleInfo.isAnaplerotic"
												id="productModuleInfo_isAnaplerotic"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue='${productModuleInfo?.isAnaplerotic}?:N'
												data-th-allowClear=false
												data-th-data-result="${YES_OR_NO}" >
											</select>
										</div>
								</div>
                            </div>
                        </div>
                    </div>
                    <div class="pro-module">
						<h3 class="pro-module-title">
							<span class="title-des">募集要素</span><i
								class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{BussFinProductSaleParam.issueType}">募集方式</label>
									<div class="layui-input-inline input-inline">
										<input type="text" th:name="|bussRepFinProductInfoDto.repIssueType|"
											th:id="|bussFinProductSaleParamDto_issueType|"
											class="layui-input form-input input-checkbox" 
											data-th-initValue='${bussRepFinProductInfoDto?.repIssueType}'
											data-th-data-result="${RAISE_TYPE}" />
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										th:text="#{BussFinProductSaleParam.saleMax}">募集上限</label>
									<div class="layui-input-inline input-inline">
										<input type="text" th:id="|bussFinProductSaleParamDto_saleMax|"
											th:name="|bussFinProductSaleParamDto.saleMax|" th:value="${bussFinProductSaleParamDto?.saleMax}"
											class="layui-input form-input text-number" maxlength="19" />
										<span class="input-right-show">元</span>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										th:text="#{BussFinProductSaleParam.saleMin}">募集下限</label>
									<div class="layui-input-inline input-inline">
										<input type="text" th:id="|bussFinProductSaleParamDto_saleMin|"
											th:name="|bussFinProductSaleParamDto.saleMin|" 
											th:value="${bussFinProductSaleParamDto?.saleMin}"
											class="layui-input form-input text-number" maxlength="19" />
										<span class="input-right-show">元</span>
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{BussFinProductSaleParam.ccy}">募集币种</label>
									<div class="layui-input-inline input-inline">
										<select th:id="|bussFinProductSaleParamDto_ccy|" th:name="|bussRepFinProductInfoDto.repRaiseCcy|"
											class="layui-input form-input input-select"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-initValue='${bussRepFinProductInfoDto?.repRaiseCcy}' data-th-data-result="${CCY}" >
										</select>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{BussFinProductSaleParam.repCashPrinCcy}">兑付本金币种</label>
