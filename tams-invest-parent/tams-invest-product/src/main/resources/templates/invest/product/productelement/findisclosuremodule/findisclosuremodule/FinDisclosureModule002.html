<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinDisclosureModule002}">信息披露模板上传1111</title>
<style type="text/css">
.mst-lable{
width:12%;
}
.input-inline{
width:80%!important;
}
.layui-upload-drag{
    width: 98%;
}
</style>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap" id="submitForm">
			<div class="layui-form-item">
				<div>
                    <label class="layui-form-label form-lable mst-lable" data-th-text="#{FinDisclosureModule001.fileType}">文件类型</label>
                    <div class="layui-input-inline input-inline">             
                        <input type="text" id="fileType" name="fileType" required="required"
                        class="layui-input form-input input-checkbox" 
                        data-th-data-result='${FILE_TYPE_FG}'
                        data-th-initValue='${entity?.fileType}'/>
                    </div>
                </div>
			</div>
			<div class="layui-form-item">
				<div id="annexDiv">
					<label class="layui-form-label form-lable mst-lable">上传附件</label>
					<div class="layui-input-inline input-inline">
					<div class="upload" id="annex" required
						th:disabled="${pageModel} eq ${pageModelReference}"
						th:data-data='${attachmentFiles}'
						data-option="{allowFileType: 'xls|xlsx', callback: 'FinDisclosureModule002.onUploaded'}">
						</div>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div>
					<label class="layui-form-label form-lable mst-lable"
						data-th-text="#{FinDisclosureModule001.remark}">备注</label>
					<div class="layui-input-inline input-inline">
						<textarea id="remark" name="remark" placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}" maxlength="300"
							class="layui-textarea" data-th-text="${entity?.remark}"></textarea>
					</div>
				</div>
			</div>
			<div class="layui-col-md11  layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
				<div class="text-center">
					<a id="FinDisclosureModule002_btn_save"
						class="layui-btn layui-btn-sm btn-save"
						data-th-text="#{SysCommon.save}">保存</a> <a
						id="FinDisclosureModule002_btn_submit"
						class="layui-btn layui-btn-sm btn-submit"
						data-th-text="#{SysCommon.submit}">提交</a> <a
						id="FinDisclosureModule002_btn_cancel"
						class="layui-btn layui-btn-sm btn-cancel"
						data-th-text="#{SysCommon.cancel}">取消</a>
				</div>
			</div>

	</form>
	</div>
	<div layout:fragment="script">
		<script th:inline="javascript" type="text/javascript">
            var revealFileId = /*[[${revealFileId}]]*/'';
			var workflowId = /*[[${workflowId}]]*/'';
        </script>
		<script
			data-th-src="@{/js/invest/product/productelement/findisclosuremodule/findisclosuremodule/FinDisclosureModule002.js}"
			type="text/javascript"></script>
	</div>
</body>

</html>
