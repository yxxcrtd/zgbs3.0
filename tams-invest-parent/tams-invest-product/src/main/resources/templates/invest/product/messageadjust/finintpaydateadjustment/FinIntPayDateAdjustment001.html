<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinIntPayDateAdjustment001}">分红日调整</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				<a id="FinIntPayDateAdjustment001_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                <a id="FinIntPayDateAdjustment001_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
				<!-- <a id="FinProductRateQuotation001_btn_add" class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a>
				<a id="FinProductRateQuotation001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
				data-th-text="#{SysCommon.delete}">删除</a> -->
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinIntPayDateAdjustment001.cashId}">产品代码</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="finprodMarketId" name="finprodMarketId" class="layui-input form-input input-select"
	                                allowClear="true" placeholder="请输入内容"
	                                data-th-placeholder="#{SysCommon.placeholder}" formatoption = "true" 
	                                required
	                                data-th-data-url="@{/invest/product/messageadjust/finintpaydateadjustment/FinIntPayDateAdjustment001/getCashId}" 
	                                data-th-initValue="${entity?.finprodMarketId}">
	                            </select>		
							</div>
						</div>
						<div style="display:none;" class="layui-input-inline input-inline">
	                        <input type="text" id="workflowId" name="workflowId" 
	                            class="layui-input form-input"
	                            data-th-value="${workflowId}"
	                            disabled=true/>
                    	</div>
					</div>
				</form>
			</div>

			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
        	var selectedItem1 = /*[[${selectedItem1}]]*/'';
    	</script>
		<script
			data-th-src="@{/js/invest/product/messageadjust/finintpaydateadjustment/FinIntPayDateAdjustment001.js}"></script>
	</div>
</body>
</html>
