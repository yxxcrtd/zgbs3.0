<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinProductEstablish002}">收益型产品新建管理</title>
</head>
<body>
	<div layout:fragment="content">
		<div class="pro-module-wrapper pro-module-base" style="border-top: none;">
			<form class="layui-form joyin-form-wrap pro-module-form" id="FinProductEstablish002_Form">
                <input type="hidden" id="ptlId" name="ptlId" data-th-value="${entity?.ptlId}" > <!-- 组合代码 -->
                <input type="hidden" id="isLay" name="isLay" data-th-value="${entity?.isLay}" > <!-- 是否分层 -->
                <input type="hidden" id="dealMode" name=dealMode data-th-value="${entity?.dealMode}" > <!-- 处理模式 -->
                <input type="hidden" id="tradeId" name="tradeId" data-th-value="${entity?.tradeId}" > <!-- 交易编号 -->
                <input type="hidden" id="tradeDate" name="tradeDate" data-th-value="${entity?.tradeDate}" > <!-- 交易日期 -->
                <input type="hidden" id="tradeAmt" name="tradeAmt" data-th-value="${entity?.tradeAmt}" > <!-- 交易金额 -->
                <input type="hidden" id="finprodType2" name="finprodType2" th:value="${finprodType2}"> 
                <input type="hidden" id="yield" name="yield" th:value="${entity?.yield}">
                <input type="hidden" id="operationType" name="operationType" th:value="${entity?.operationType}"> <!-- 运作模式 -->
                <input type="hidden" id="continueFlag" name="continueFlag" th:value="${entity?.continueFlag}">
                <input type="hidden" id="ps" name="ps" th:value="${entity?.ps}">
                <input type="hidden" id="profitType" name="profitType" th:value="${entity?.profitType}">
                <input type="text" id="operateType" name="operateType" class="layui-input form-input" data-th-value="${entity?.operateType}" style = "display: none">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">基本信息</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                        data-th-text="#{FinProductEstablish002.finprodId}">产品代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="finprodId" name="finprodId"
                                            formatoption=false class="layui-input form-input input-select"
                                            data-th-data-url="@{/invest/product/productduration/establish/FinProductEstablish002/queryProdIdInfoIssueSuc}"
                                            data-th-initValue='${entity?.finprodId}' required>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
										data-th-text="#{FinProductEstablish002.finprodAbbr}">产品简称</label>
									<div class="layui-input-inline input-inline">
										<input type="text" name="finprodAbbr" id="finprodAbbr"
											class="layui-input form-input" required
											th:value="${entity?.finprodAbbr}" disabled>
									</div>
								</div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                        data-th-text="#{FinProductEstablish002.finprodName}">产品名称</label>
									<div class="layui-input-inline input-inline">
										<input type="text" name="finprodName" id="finprodName"
											class="layui-input form-input" required
											th:value="${entity?.finprodName}" disabled>
									</div>
								</div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                        data-th-text="#{FinProductEstablish002.ccy}">币种</label>
									<div class="layui-input-inline input-inline">
										<select id="ccy" name="ccy" required
											class="layui-input form-input input-select"
											data-th-initValue='${entity?.ccy}'
											data-th-data-result="${CCY}" disabled>
										</select>
									</div>
								</div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                        data-th-text="#{FinProductEstablish002.vdate}">确认日</label>
									<div class="layui-input-inline input-inline">
										<input type="text" name="vdate" id="vdate"
											class="layui-input form-input input-dateSelect"
											data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'
											required>
										<input type="hidden" name="vdate2" id="vdate2"
											class="layui-input form-input input-dateSelect"
											data-th-value='${#dates.format(entity?.vdate2,"yyyy-MM-dd")}'
											> 
									</div>
								</div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                        data-th-text="#{FinProductEstablish002.mdate}">产品到期日</label>
									<div class="layui-input-inline input-inline">
										<input type="text" name="mdate" id="mdate"
											class="layui-input form-input input-dateSelect"
											data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
											disabled required>
									</div>
								</div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                        data-th-text="#{FinProductEstablish002.basis}">计息基础</label>
									<div class="layui-input-inline input-inline">
										<select id="basis" name="basis" required
											class="layui-input form-input input-select"
											th:initValue='${entity?.basis}'
											data-th-data-result="${BASIS}" disabled>
										</select>
									</div>
								</div>
								
								<div class="form-inline-wrap">
	                                <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductEstablish002.dealType}">交易类型</label>
	                                <div class="layui-input-inline input-inline">
	                                    <select formatoption="true" type="text" id="FinProductEstablish002_ps" name="dealType"
	                                            class="layui-input form-input input-select"
	                                            data-th-data-result='${PS}' allowClear="true" placeholder="请输入内容"
	                                            data-th-initValue="${entity?.ps}" disabled  required>
	                                    </select>
	                                </div>
	                            </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" id = "currentSubText"
                                        data-th-text="#{FinProductEstablish002.currentSub}">本期认购</label>
									<div class="layui-input-inline input-inline">
										<input type="text" data-fixtype="2"unit="1"
                                                class="layui-input form-input text-number" required="required"
                                                id="currentSub" name="currentSub" data-th-value="${entity?.currentSub}"
                                                placeholder="请输入数字" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-moneymemory = "">
                                            <span class="input-right-show">元</span>
									</div>
								</div>
                            </div>
                            <div class="layui-form-item" id="FinProductEstablish002_prinAmt">
								<div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                        data-th-text="#{FinProductEstablish002.lastAmtSub}">上期滚入金额</label>
									<div class="layui-input-inline input-inline">
										<input type="text" data-fixtype="2" unit="1"
											class="layui-input form-input text-number" required="required"
											id="lastAmtSub" name="lastAmtSub"
											data-th-value="${entity?.lastAmtSub?:0}" placeholder="请输入数字"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-moneymemory=""> <span class="input-right-show">元</span>
									</div>
								</div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                        data-th-text="#{FinProductEstablish002.accountingAmt}">本期起息金额</label>
									<div class="layui-input-inline input-inline">
										<input type="text" data-fixtype="2" unit="1"
											class="layui-input form-input text-number" required="required"
											id="accountingAmt" name="accountingAmt"
											data-th-value="${entity?.accountingAmt?:0}" placeholder="请输入数字"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-moneymemory=""> <span class="input-right-show">元</span>
									</div>
								</div>
                            </div>
                             <div class="layui-form-item">
                                <div class="form-inline-wrap" id = "customersBeginNumDiv">
                                    <label class="layui-form-label form-label-wrap"
                                        data-th-text="#{FinProductEstablish002.customersBeginNum}">期初客户数</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="customersBeginNum" name="customersBeginNum" 
											th:value="${entity?.customersBeginNum}" data-textrange="0"
											class="layui-input form-input text-number"/>
									</div>																	
								</div>
								<!-- update by leipeng 20190625 BSTWO-155【收益型产品认申购管理】新建，去掉‘期初客户数’字段 start-->
                                <!-- <div class="form-inline-wrap" id = "customersAddNumDiv">
                                    <label class="layui-form-label form-label-wrap"
                                        data-th-text="#{FinProductEstablish002.customersAddNum}">增加客户数</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="customersAddNum" name="customersAddNum"
											th:value="${entity?.customersAddNum}" data-textrange="0"
											class="layui-input form-input text-number" />
									</div>
								</div> -->
								<!-- update by leipeng 20190625 BSTWO-155【收益型产品认申购管理】新建，去掉‘期初客户数’字段 end-->
								
                            </div> 
                        </div>
                    </div>
                </div>
                <div class="pro-module-wrap" id="FinProductEstablish002_div_layering" hidden=true>
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">分层金额明细</span><i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <table class="layui-table" id="FinProductEstablish002_layAmtTable"></table>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 划款信息 -->
                <div class="page-component hkxx" th:data-path="@{/component/trade/BussTrdTransferOrder/init}"
                     th:data-params="|{entityName: 'bussTrdTransferOrder', pageFrom: 'submitForm', entity:'${entity_bussTrdTransferOrder}', bizCode:'${entity?.tradeId}'}|"></div>
                <div class="pro-module-wrap net-product fund-product income-product">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">交易备注</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div>
                            	<textarea id="remark" name="remark" data-th-text='${entity?.remark}' placeholder="请输入内容" data-ignore=false class="layui-textarea"></textarea>
                            </div>
                        </div>
                    </div>
                 </div>
             </div>
             <div class="layui-col-md11 " style="margin: 20px 0;">
	            <div class="text-center">
	                <a id="FinProductEstablish002_btn_save"
	                    class="layui-btn layui-btn-sm btn-save"
	                    data-th-text="#{SysCommon.save}">保存</a>
					<a id="FinProductEstablish002_btn_submit"
	                    class="layui-btn layui-btn-sm btn-submit"
	                    data-th-text="#{SysCommon.submit}">提交</a>
					<a id="FinProductEstablish002_btn_revoke"
					   class="layui-btn layui-btn-sm btn-revoke" data-ignore=true
					   data-th-text="#{SysCommon.revoke}">撤销</a>
					<a id="FinProductEstablish002_btn_cancel"
	                    class="layui-btn layui-btn-sm btn-cancel"
	                    data-th-text="#{SysCommon.cancel}">取消</a>
	            </div>
        	 </div>
            </form>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
		var workflowId = /*[[${entity?.workflowId}]]*/'';	
		var effectStatus = /*[[${entity?.effectStatus}]]*/'';	
		function comdify(n) {  //金额格式转化为"###,###.00"
        	var re=/\d{1,3}(?=(\d{3})+$)/g;
        	var n1=n.replace(/^(\d+)((\.\d+)?)$/,function(s,s1,s2){return s1.replace(re,"$&,")+s2;});
        	return n1;
        }
		function zd(){
	        	jyfx = $('#ps').val();
	        	if(jyfx == 'C1' && jyfx != undefined && jyfx != null){
	        		zcmc = $('#finprodId').val();
	        		var zcmc2=zcmc.substring(4);
	        		bj =  $('#finprodName').val();
	        		jc =  $('#finprodAbbr').val();
	        		khs =  $('#customersBeginNum').val();
	        		var a = zcmc2 +" "+ bj +" 起息 "+"，" +comdify(jc)+ "产品募集本金，期初客户数"+khs;
	        		$("#remark").val(a);
	        		
	        	}
	        	 if(jyfx == 'C2' && jyfx != undefined && jyfx != null ){
	        		zcmc = $('#finprodId').val();
	        		var zcmc2=zcmc.substring(4);
	        		 bj =  $('#finprodName').val();
	        		 jc =  $('#finprodAbbr').val();
	        		 sg =  $('#currentSub').val();
	        		 var a = zcmc2 +" "+ bj +" 申购 "+"，" +jc+" 申购"+comdify(sg)+"元";
	        		$("#remark").val(a);
	        	} 
	        	
	        }
		</script>
		<script data-th-src="@{/js/invest/product/productduration/establish/FinProductEstablish002.js}" type="text/javascript"></script>
	</div>
</body>
</html>
