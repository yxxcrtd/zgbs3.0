<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinProductFeePay001}">产品费用支付查询</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="form-button-area">
				<a id="FinProductFeePay001_btn_add"
					class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a> <a
					id="FinProductFeePay001_btn_confirm" class="layui-btn layui-btn-sm"
					data-th-text="#{FinProductFeePay001.confirm}">确认</a> <a
					id="FinProductFeePay001_btn_revoke"
					class="layui-btn layui-btn-sm"
					data-th-text="#{FinProductFeePay001.revoke}">撤销</a>
			</div>
			<div
				class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductFeePay001.portFolioId}">组合代码</label>
							<div class="layui-input-inline input-inline">
								<select type="text" name="ptlId"
									class="layui-input form-input input-select" allowClear="true"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									formatoption=false multiple="true"
									data-th-data-url="@{/invest/product/productelement/build/FinProductBuild001/queryGroupIdInfo}">
								</select>
							</div>
						</div>
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductFeePay001.prodId}">产品代码</label>
							<div class="layui-input-inline input-inline">
								<select id="FinProductFeePay001_finprodId" type="text" name="finprodId"
									class="layui-input form-input input-select" allowClear="true"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									formatoption=false multiple="true"
									data-th-data-url="@{/invest/product/feepay/FinProductFeePay001/queryProdIdInfoIssueSuc}"
									data-th-initValue='${finprodId}'>
								</select>
							</div>
						</div>
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductFeePay001.feeName}">费用名称</label>
							<div class="layui-input-inline input-inline">
								<select type="text" name="feeId"
									class="layui-input form-input input-select" allowClear="true"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									formatoption=false
									data-th-data-url="@{/invest/product/feepay/FinProductFeePay002/queryFeeInfoList}"
									data-th-initValue='${feeId}'>
								</select>
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductFeePay001.feeAccount}">费用账户</label>
							<div class="layui-input-inline input-inline">
								<select type="text" name="feeAccount"
									class="layui-input form-input input-select" allowClear="true"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									formatoption=false multiple="true"
									data-th-data-url="@{/invest/product/feepay/FinProductFeePay001/queryFeeAccountList}">
								</select>
							</div>
						</div>	
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductFeePay001.effectStatus}">有效状态</label>
							<div class="layui-input-inline input-inline">
								<select name="status"
									class="layui-input form-input input-select"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result="${STATUS_VALID}"
									data-th-initValue="${statusUndo}">							
								</select>
							</div>
						</div>					
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductFeePay001.payDate}">支付日</label>
							<div class="layui-input-inline input-inline">
								<input id="FinProductFeePay001_paydate" name='paydate'
									class="layui-input form-input input-dateRangeSelect"
									placeholder="请选择时间区间"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-value = '${quaryDate}'>
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div 
                        	class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                            	data-th-text="#{FinProductFeePay001.ccy}">币种</label>
                            <div class="layui-input-inline input-inline">
                                <select formatoption="true" type="text" 
	                                name="ccy"
                                    class="layui-input form-input input-select"
                                    data-th-data-result='${CCY}' 
                                    allowClear="true" 
                                    placeholder="请输入内容"
               						multiple="true"
                                    data-th-placeholder="#{SysCommon.placeholder}">
                                </select>
                            </div>
                        </div>
						<!--新增检索条件费用类型 guyunfei 20190923 start-->
						<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{FinProductFeePay001.feeType}">费用类型</label>
							<div class="layui-input-inline input-inline">
								<select formatoption="true" type="text"
										name="feeType"
										class="layui-input form-input input-select"
										data-th-data-result='${FEE_SPECIES_TYPE}'
										allowClear="true"
										placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
                        <!--新增检索条件费用类型 guyunfei 20190923 end-->
					</div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var REM_TYPE = [[${remType}]];
        </script>
		<script data-th-src="@{/js/invest/product/feepay/FinProductFeePay001.js}" type="text/javascript"></script>
		<script data-th-src="@{/js/invest/product/productelement/common/FinProductCommon.js}" type="text/javascript"></script>
		<script data-th-inline="javascript" type="text/javascript">
		
		</script>
	</div>
</body>
</html>
