<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinSubmittedModule002}">新建申报附件方案</title>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap" id="submitForm">
			<div class="layui-form-item">
				<div>
					<label class="layui-form-label form-label-wrap"
						data-th-text="#{FinSubmittedModule002.schemeId}" style="width: 25%">申报附件方案代码</label>
					<div class="layui-input-inline input-inline" style="width: 70%!important;">
						<input type="text" id="schemeId" name="schemeId"
							class="layui-input form-input" disabled
							data-th-value="${entity?.schemeId}" required="required"/>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div>
					<label class="layui-form-label form-label-wrap"
						data-th-text="#{FinSubmittedModule002.schemeName}" style="width: 25%">申报附件方案名称</label>
					<div class="layui-input-inline input-inline" style="width: 70%!important;">
						<input type="text" class="layui-input form-input" placeholder="请输入内容" 
						data-th-placeholder="#{SysCommon.placeholder}" id="schemeName" name="schemeName"
						required="required" data-th-value="${entity?.schemeName}" th:maxlength="50">
					</div>
				</div>
			</div>
		</form>
		<div class="layui-col-md10" style="margin-top: 40px;">
			<div class="text-center">
				<a id="FinSubmittedModule002_btn_submit"
					class="layui-btn layui-btn-sm btn-submit"
					data-th-text="#{SysCommon.submit}">提交</a>
				<a id="FinSubmittedModule002_btn_cancel"
					class="layui-btn layui-btn-sm btn-cancel"
					data-th-text="#{SysCommon.cancel}">取消</a>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-src="@{/js/invest/product/productelement/findisclosuremodule/finsubmittedmodule/FinSubmittedModule002.js}"
			type="text/javascript">
		</script>
	</div>
</body>
</html>
