<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="#{FinProductPayInt003}">产品中间付息新建</title>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <input type="hidden" id="portfolioId" name="portfolioId" data-th-value="${entity?.portfolioId}" /> 
            <input type="hidden" id="prodRegistCode" name="prodRegistCode" data-th-value="${entity?.prodRegistCode}" />
            <input type="hidden" id="isLay" name="isLay" data-th-value="${entity?.isLay}" />
            <!-- <input type="hidden" id="layType" name="layType" data-th-value="${entity?.layType}" /> -->
            <input type="hidden" id="bussId" name="bussId" data-th-value="${entity?.bussId}" />
            <!-- add by TISHKBS-1519 mashukai 收益型产品中间付息撤销流程中页面隐藏撤销按钮 start -->
            <input type="text" id="workflowId" name="workflowId" data-th-value='${workflowId}' hidden>
            <!-- add by TISHKBS-1519 mashukai 收益型产品中间付息撤销流程中页面隐藏撤销按钮 end -->
            <input type="hidden" id="dealMode" name="dealMode" data-th-value="${entity?.dealMode}" />
            <input type="text" id="operateType" name="operateType" class="layui-input form-input" data-th-value="${entity?.operateType}" style = "display: none">
            <!-- 产品基本信息 -->
            <div class="pro-module-wrap">
                <div class="pro-module">
    
                    <h3 class="pro-module-title">
                        <span class="title-des">产品基本信息</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{FinProductPayInt003.finprodId}">产品代码</label>
                                <div required class="layui-input-inline input-inline">
                                    <select  type="text" id="finprodId" name="finprodId"
                                      formatoption=false
                                      class="layui-input form-input input-select" placeholder="请输入内容"
                                      data-th-placeholder="#{SysCommon.placeholder}"
                                      data-th-data-url="@{/invest/product/productduration/establish/FinProductEstablish002/queryProdIdInfoIssueSuc}" required="required"
                                      data-th-initValue='${entity?.finprodId}'>
                                    </select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{FinProductPayInt003.prodAbbr}">产品简称</label>
                                <div class="layui-input-inline input-inline">
                                    <input  required type="text" id="finprodAbbr" name="finprodAbbr"
                                           class="layui-input form-input" placeholder="请输入内容"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value="${entity?.finprodAbbr}" disabled>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{FinProductPayInt003.prodName}">产品名称</label>
                                <div class="layui-input-inline input-inline">
                                    <input  required type="text" id="finprodName" name="finprodName"
                                           class="layui-input form-input" placeholder="请输入内容"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value="${entity?.finprodName}" disabled>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{FinProductPayInt003.ccy}">币种</label>
                                <div class="layui-input-inline input-inline">
                                    <select required type="text" id="ccy" name="ccy" class="layui-input form-input input-select"
                                            placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                            data-th-data-result='${CCY}' formatoption="true"
                                            data-th-initValue="${ccy?:entity?.ccy}" disabled></select>
                                            
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{FinProductPayInt003.prodVdate}">产品起息日</label>
                                <div class="layui-input-inline input-inline">
                                    <input required type="text" id="prodVdate" name="vdate"
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value="${#dates.format(entity?.vdate,'yyyy-MM-dd')}" disabled>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{FinProductPayInt003.prodMdate}">产品到期日</label>
                                <div class="layui-input-inline input-inline">
                                    <input required type="text" id="prodMdate" name="mdate"
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value="${#dates.format(entity?.mdate,'yyyy-MM-dd')}" disabled>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{FinProductPayInt003.prodPrinAmt}">产品本金</label>
                                <div class="layui-input-inline input-inline">
                                    <input required type="text" id="prinAmt" name="prinAmt"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           tdata-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.prinAmt}"disabled>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{FinProductPayInt003.thisIntAccrDay}">本次计息天数</label>
                                <div class="layui-input-inline input-inline">
                                    <input required type="text" id="thisIntAccrDay" name="thisIntAccrDay"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           data-fixtype="2" data-textrange="0"
                                           tdata-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.thisIntAccrDay}"disabled>
                                    <span class="input-right-show">天</span>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{FinProductPayInt003.payintStartDate}">本次付息起始日</label>
                                <div class="layui-input-inline input-inline">
                                    <input required type="text" id="payintStartDate" name="payintStartDate"
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           tdata-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value="${payintStartDate?:#dates.format(entity?.payintStartDate,'yyyy-MM-dd')}"disabled>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{FinProductPayInt003.payintEndDate}">本次付息结束日</label>
                                <div class="layui-input-inline input-inline">
                                    <input required type="text" id="payintEndDate" name="payintEndDate"
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           tdata-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value="${entity?.payintEndDate eq null ? platDate : #dates.format(entity?.payintEndDate,'yyyy-MM-dd')}" disabled>
                                </div>                    
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{FinProductPayInt003.theoryCusProfit}">应付客户收益</label>
                                <div class="layui-input-inline input-inline">
                                    <input  required type="text" id="theoryCusProfit" name="theoryCusProfit"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           tdata-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.theoryCusProfit}" disabled>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{FinProductPayInt003.actCusProfit}">实付客户收益</label>
                                <div class="layui-input-inline input-inline">
                                    <input required type="text" id="actCusProfit" name="actCusProfit"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           tdata-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.actCusProfit}" disabled>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{FinProductPayInt003.payDate}">支付日</label>
                                <div class="layui-input-inline input-inline">
                                    <input required type="text" id="payDate" name="payDate"
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           tdata-th-placeholderr="#{SysCommon.placeholder}"
                                           data-th-value='${entity?.payDate eq null ? platDate : #dates.format(entity?.payDate,"yyyy-MM-dd")}'>
                                </div>                    
                            </div>
                            <!-- <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{FinProductPayInt003.saleDepartment}">销售部门</label>
                                <div class="layui-input-inline input-inline">
                                    <select  required type="text" id="saleDepartment" name="saleDepartment"
                                            class="layui-input form-input input-select"
                                            placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                            th:data-result='${SALE_DEPT}' allowClear="true" formatoption="true"
                                            th:initValue="${entity?.saleDepartment}" disabled></select>
                                </div>
                            </div> -->
                        </div>
                    </div>
                </div>
            </div>
            <!-- 利息明细信息 -->
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="title-des">利息明细信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <table class="layui-table" id="intDetailInfoTable" name="intDetailDataList"></table>
                    </div>
                </div>
            </div>
            <!-- 划款信息 -->
            <!-- <div class="page-component" th:data-path="@{/component/trade/BussTrdTransferOrder/init}" id="bussTrdTransferOrder_div"
                 th:data-params="|{entityName: 'bussTrdTransferOrder', pageFrom: 'submitForm2', entity:'${entity_FinProductPayInt002}', bizCode:'${tradeId}'}|">
            </div> -->
            <div class="page-component hkxx" th:data-path="@{/component/trade/BussTrdTransferOrder/init}"
                     th:data-params="|{entityName: 'bussTrdTransferOrder', pageFrom: 'submitForm', entity:'${entity_bussTrdTransferOrder}', bizCode:'${entity?.tradeId}'}|"></div>
            <!-- 交易备注 -->
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="title-des">交易备注</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="layui-form-item">
                                <label class="layui-form-label form-label-wrap" style="width: 7.5%;">　</label>
                                <div class="layui-input-inline input-inline" style="width: 85%!important;">
                                    <textarea id="remark" name="tradeRemark" maxlength="200" data-th-text="${entity?.tradeRemark}"
                                              class="layui-textarea" placeholder="请输入内容" data-ignore=false
                                              data-th-placeholder="#{SysCommon.placeholder}"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row text-center" style="margin-top:10px; margin-bottom:20px;">
                <a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save"
                   data-th-text="#{SysCommon.save}">保存</a>
                <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit"
                   data-th-text="#{SysCommon.submit}">提交</a>
                <a th:id="|${pageId}_btn_revoke|" class="layui-btn layui-btn-sm btn-revoke" data-ignore=true
                   data-th-text="#{SysCommon.revoke}">撤销</a>
                <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel"
                   data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">
			var intDetailDataList = /*[[${entity?.intDetailDataList}]]*/'';
		</script>
    <script data-th-src="@{/js/invest/product/payint/FinProductPayInt003.js}" type="text/javascript"></script>
</div>
</body>
</html>
