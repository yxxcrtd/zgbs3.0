<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{TacticConfig001}">战术配置优化</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
    <a id="TacticConfig001_btn_add" class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a>
    </div>

    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
            	<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TacticConfig001.vdate}">修正期限起始日</label>
                    <div class="layui-input-inline input-inline">
                    <input type="text" id="vdate" name="vdate" 
									class="layui-input form-input input-dateSelect"/>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TacticConfig001.edate}">修正期限截止日</label>
                    <div class="layui-input-inline input-inline">
                    <input type="text" id="edate" name="edate" 
									class="layui-input form-input input-dateSelect"/>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TacticConfig001.corScene}">修正场景</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="corScene" name="corScene" 
									class="layui-input form-input input-select" allowClear="true"
									formatoption=false 
									data-th-data-result="${COR_SCENE}">
						</select>
                    </div>
               </div>
       		</div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/product/productplanning/tacticconfig/TacticConfig001.js}" type="text/javascript"></script>
</div>
</body>

</html>
