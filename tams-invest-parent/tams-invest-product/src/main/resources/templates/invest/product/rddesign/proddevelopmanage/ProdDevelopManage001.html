<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ProdDevelopManage001}">产品研发方案管理查询</title>
</head>
<body>
    <div layout:fragment="content">
        <div class='layui-fluid'>
            <div class="layui-col-md12 form-button-area" style="margin: 10px;">
                <a id="ProdDevelopManage001_btn_new" class="layui-btn layui-btn-sm btn-create"
                    data-th-text="#{SysCommon.create}">新建</a>
                <a id="ProdDevelopManage001_btn_edit" class="layui-btn layui-btn-sm  "
                    data-th-text="#{ProdDevelopManage001.edit}" style="display: none">修改</a>
                <a id="ProdDevelopManage001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
                    data-th-text="#{SysCommon.delete}" style="display: none">删除</a>
            </div>
            <div class='joyin-form-wrap joyin-filter-form condition-area'>
                <form class="layui-form" id="searchForm">
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                            <label class="layui-form-label form-lable" data-th-text="#{ProdDevelopManage001.queryDate}">查询日</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="queryDate" name="queryDate"
                                    class="layui-input form-input input-dateRangeSelect" />
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md8 layui-col-sm8 layui-col-lg8 layui-col-xs8">
                            <label class="layui-form-label form-lable"
                                data-th-text="#{ProdDevelopManage001.prodDesignSeries}">产品设计系列</label>
                            <div class="layui-input-inline input-inline">
                                <select id="prodDesignSeries" name="prodDesignSeries"
                                    class="layui-input form-input input-select"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-url="@{/invest/product/rddesign/proddevelopmanage/ProdDevelopManage001/getProdDesignSeries}">
                                </select>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/product/rddesign/proddevelopmanage/ProdDevelopManage001.js}"></script>
    </div>
</body>
</html>
