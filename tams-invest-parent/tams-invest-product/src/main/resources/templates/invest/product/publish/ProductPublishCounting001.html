<!DOCTYPE html>
<html
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{ProductPublishCounting001}">发行规划试算</title>
</head>
<body>
<div layout:fragment="content">
	<div class="layui-col-md12">
		<div class="layui-tab layui-tab-card" lay-filter="tabContainer">
			<ul class="layui-tab-title">
				<li id="accountDetails-title" class="layui-this">产品系列查询</li>
				<li id="specialAssets-title">资产大类查询</li>
			</ul>
			<div class="layui-tab-content" style="padding: 0">
				<div class="layui-tab-item layui-show">
					<div class="layui-col-md12" style="margin: 10px 10px">
						<button type="button" class="layui-btn layui-btn-sm btn-create"
							id="ProductPublishCounting001_btn_add">新建</button>
						<button type="button" class="layui-btn layui-btn-sm btn-modify"
							id="ProductPublishCounting001_btn_modify">试算</button>
						<button type="button" class="layui-btn layui-btn-sm btn-delete"
							id="ProductPublishCounting001_btn_delete">删除</button>
						<button type="button" class="layui-btn layui-btn-sm btn-export"
							id="ProductPublishCounting001_prd_export">导出</button>
					</div>
					<div class="layui-col-md12" id="c_fundsAllocateForm"
						style="background-color: #f5f5f5;">
						<form class="layui-form layui-col-md11" id="fundsAllocateForm">
							<div class="layui-form-item">
								<div class="layui-inline layui-col-md4">
									<label class="layui-form-label form-lable"
										data-th-text="#{ProductPublishCounting002.prdIssueplanCode}">
										规划编号</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="prdIssueplanCode"
											name="prdIssueplanCode"
											class="layui-input form-input input-select" placeholder="请选择"
											data-th-data-url="@{/invest/product/publish/ProductPublishCounting001/getPrdIssueplanCode}">
										</select>
									</div>
								</div>
								<div class="layui-inline layui-col-md4">
									<label class="layui-form-label form-lable"
										data-th-text="#{ProductPublishCounting002.vdate}">
										规划起始日</label>
									<div class="layui-input-inline input-inline">
										<input id="vdateStr" name="vdateStr"
											class="layui-input form-input input-dateSelect"
											placeholder="请输入日期">
									</div>
								</div>
								<div class="layui-inline layui-col-md4">
									<label class="layui-form-label form-lable"
										data-th-text="#{ProductPublishCounting002.edate}">
										规划结束日</label>
									<div class="layui-input-inline input-inline">
										<input id="edateStr" name="edateStr"
											class="layui-input form-input input-dateSelect"
											placeholder="请输入日期">
									</div>
								</div>
							</div>
						</form>
						<div class="layui-col-md1">
							<div class="layui-form-item">
								<button type="button" class="layui-btn layui-btn-sm btn-search"
									id="ProductPublishCounting001_pro_search">查询</button>
							</div>
						</div>
					</div>
					<table class="layui-table" id="productCountTable"></table>
				</div>
				<div class="layui-tab-item">
					<div class="layui-col-md12" style="margin: 10px 10px">
						<button type="button" class="layui-btn layui-btn-sm btn-create"
							id="ProductPublishCounting001Ast_btn_add">新建</button>
						<button type="button" class="layui-btn layui-btn-sm btn-export"
							id="ProductPublishCounting001_ast_export">导出</button>
					</div>
					<div class="layui-col-md12" id="c_incomeStatisticsForm"
						style="background-color: #f5f5f5;">
						<form class="layui-form layui-col-md11" id="incomeStatisticsForm">
							<div class="layui-form-item">
								<div class="layui-inline layui-col-md4">
									<label class="layui-form-label form-lable"
										data-th-text="#{ProductPublishCounting002.prdIssueplanCode}">
										规划编号</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="astIssueplanCode"
											name="astIssueplanCode"
											class="layui-input form-input input-select" placeholder="请选择"
											data-th-data-url="@{/invest/product/publish/ProductPublishCounting001/getPrdIssueplanCode}">
										</select>
									</div>
								</div>
								<div class="layui-inline layui-col-md4">
									<label class="layui-form-label form-lable"
										data-th-text="#{ProductPublishCounting002.vdate}">
										规划起始日</label>
									<div class="layui-input-inline input-inline">
										<input id="astVdateStr" name="astVdateStr"
											class="layui-input form-input input-dateSelect"
											placeholder="请输入日期">
									</div>
								</div>
								<div class="layui-inline layui-col-md4">
									<label class="layui-form-label form-lable"
										data-th-text="#{ProductPublishCounting002.edate}">
										规划结束日</label>
									<div class="layui-input-inline input-inline">
										<input id="astEdateStr" name="astEdateStr"
											class="layui-input form-input input-dateSelect"
											placeholder="请输入日期">
									</div>
								</div>
							</div>
						</form>
						<div class="layui-col-md1">
							<div class="layui-form-item">
								<button type="button" class="layui-btn layui-btn-sm btn-search"
									id="ProductPublishCounting001_ast_search">查询</button>
							</div>
						</div>
					</div>
					<table class="layui-table" id="assetTable"></table>
				</div>
			</div>
		</div>
	</div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
    	 	
    </script>
    <script data-th-src="@{/js/invest/product/publish/ProductPublishCounting001.js}"></script>
</div>
</body>
</html>
