<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinSupplementPlanChg002}">回补计划拆分</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="pro-module-wrapper pro-module-base" style="border-top: none;">
			<form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
				<div style="display: none">
					<input id="accrDate" name="accrDate" class="layui-input form-input input-dateSelect"  th:value="${entity?.accrDate}">  
					<input id="cashId" name="cashId" type="hidden" th:value="${entity?.cashId}"> 
					<input id="rn" name="rn" type="hidden" th:value="${entity?.rn}"> 
					<input id="finprodId" name="finprodId" type="hidden" th:value="${entity?.finprodId}">     
					<input id="accrStrDate" name="accrStrDate" class="layui-input form-input input-dateSelect"  th:value="${#dates.format(entity?.accrStrDate,'yyyy-MM-dd')}">  
					<input id="accrEndDate" name="accrEndDate" class="layui-input form-input input-dateSelect"  th:value="${#dates.format(entity?.accrEndDate,'yyyy-MM-dd')}">  
					<input id="layFinprodId" name="layFinprodId" type="hidden" th:value="${entity?.layFinprodId}"> 
					<input id="isLay" name="isLay" type="hidden" th:value="${entity?.isLay}">  
				</div>   
				<div class="pro-module-wrap" id="finprodInfo">
					<div class="pro-module">
						<h3 class="pro-module-title">
							<span class="title-des">产品信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="pro-module-item">			
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap" th:text="#{FinSupplementPlanChg001.finprodMarketId}">产品代码</label>
						            <div class="layui-input-inline input-inline">
										<input  type="text" id="finprodMarketId" name="finprodMarketId" required
											class="layui-input form-input"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-value="${entity?.finprodMarketId}" disabled="true"
											>
									</div>
								</div>
								<div class="form-inline-wrap">
						        	<label class="layui-form-label form-label-wrap" th:text="#{FinSupplementPlanChg001.finprodAbbr}">产品简称</label>
						        	<div class="layui-input-inline input-inline">
						            	<input  type="text" id="finprodAbbr" name="finprodAbbr" required
											class="layui-input form-input"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-value="${entity?.finprodAbbr}" disabled="true"
											>
						       		</div>
						        </div>
						        <div class="form-inline-wrap">
						        	<label class="layui-form-label form-label-wrap" th:text="#{FinSupplementPlanChg001.prodStyle}">产品款型</label>
						        	<div class="layui-input-inline input-inline">
						            	<input  type="text" id="prodStyle" name="prodStyle" required
											class="layui-input form-input"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-value="${entity?.prodStyle}" disabled="true"
											>
						       		</div>
						        </div>
							</div>
						    <div class="layui-form-item">
						    	<div class="form-inline-wrap">
						       		<label class="layui-form-label form-label-wrap" th:text="#{FinSupplementPlanChg002.splitDate}">新增区间拆分日</label>
						         	<div class="layui-input-inline input-inline">
										<input th:id="splitDate" th:name="splitDate" 
											class="layui-input form-input input-dateSelect" 
											placeholder="请选择时间" th:placeholder="#{SysCommon.placeholder}"
											>
									</div>
						   		</div>
						    	<div class="form-inline-wrap">
						    		<label class="layui-form-label form-label-wrap" th:text="#{FinSupplementPlanChg001.accrDate}">回补日</label>
						            <div class="layui-input-inline input-inline">
						        		<input th:id="newAccrDate" th:name="newAccrDate" disabled="true"
												class="layui-input form-input input-dateSelect" 
												placeholder="请选择时间" th:placeholder="#{SysCommon.placeholder}"
											>
						  			</div>
						       	</div>
						 	</div>
						</div>
					</div>
				</div>     	  
				<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 40px 0 30px 0;">
                    <div class="text-center">
                        <a id="FinSupplementPlanChg002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                           data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="FinSupplementPlanChg002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                           data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
			</form>
		</div>
	</div>
    <div layout:fragment="script">
	    <script th:inline="javascript" type="text/javascript">
			var sysDate = /*[[${sysDate}]]*/;
	     </script>
        <script data-th-src="@{/js/invest/product/messageadjust/supplement/FinSupplementPlanChg002.js}" type="text/javascript"></script>
    </div>
</body>

</html>
