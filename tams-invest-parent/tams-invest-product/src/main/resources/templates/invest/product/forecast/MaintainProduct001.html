<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>流动性预测表维护-产品管理处 </title>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form" id="submitForm">
			<input type="text" id="depType" name="depType" data-th-value="${entity?.depType}" hidden>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md5" style="margin: 5px;">
					<label class="layui-form-label form-lable">查询日</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="queryDate" name="queryDate"
							class="layui-input form-input input-dateSelect" value=""
							data-th-value="${entity?.queryDate}"
							placeholder="请选择日期"  required>
					</div>
				</div>
				<div class="">
		            <div class="layui-form-item layui-inline">
		                <a id="MaintainProduct001_btn_save" class="layui-btn layui-btn-sm btn-save"
		                    data-th-text="#{SysCommon.save}">保存</a>
            		</div>
        		</div>
			</div>
				<div style="margin: 5px;">流动性储备情况</div>
				<div id="divReserveDetail">
					<table class="layui-table" id="reserveDetailTable"></table>
				</div>
				<div style="margin: 5px;">流动性预测</div>
				<div id="divForecast">
					<table class="layui-table" id="forecastTable"></table>
				</div >
				<div style="margin: 5px;">净值型产品开放期净申赎预测</div>
				<div id="divNetValueOpenforecast">
					<table class="layui-table" id="netValueOpenforecastTable"></table>
				</div>

		</form>
	</div>
</body>
<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">
		var TARGETTYPE_JJCPKFQJSS = /*[[${TARGETTYPE_JJCPKFQJSS}]]*/'06';
	</script>
	<script data-th-src="@{/js/invest/product/forecast/MaintainProduct001.js}" type="text/javascript"></script>	
</div>
</html>
