<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title>最大可发行规模查询</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area"></div>
        <div class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">查询日</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="queryDate" name="queryDate" placeholder="请选择日期"
                            	class="layui-input form-input input-dateSelect" allowClear="true" required="true">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">产品规划系列</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="prdPlanSerisId" name="prdPlanSerisId" placeholder="请输入内容"
                                class="layui-input form-input input-select" allowClear="true" formatoption=true 
                                data-th-data-url="@{/invest/product/nolimit/maxissuablesize/MaxIssuableSize001/queryPrdPlanSerisIdInfo}">
                            </select>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/product/nolimit/maxissuablesize/MaxIssuableSize001.js}"
            type="text/javascript"></script>
    </div>    
</body>
</html>
