<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinProductValuation001.title}">日间试算</title>
</head>
<body>
	<div layout:fragment="content">
		<div class="layui-fluid">
			<div class="joyin-form-wrap condition-area curr-form">
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductValuation001.prodcode}">产品代码</label>
							<div class="layui-input-inline input-inline">
								<select type="text" name="prodcode"
									class="layui-input form-input input-select" allowClear=true
									placeholder="请输入内容" formatoption=true multiple=true required
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-url="@{/invest/product/productelement/netvalueproduct/FinNetValueProductBuild001/queryProdIdInfo}">
								</select>
							</div>
						</div>
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductValuation001.vldate}">估值日</label>
							<div class="layui-input-inline input-inline">
								<input id="FinProductValuation001_vldate" name="vldate"
									class="layui-input form-input input-dateRangeSelect"
									data-th-value="${platedate}"
									required/>
							</div>
						</div>
					</div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script
			data-th-src="@{/js/invest/product/valuation/FinProductValuation001.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
