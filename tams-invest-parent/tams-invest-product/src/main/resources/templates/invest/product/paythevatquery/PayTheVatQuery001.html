<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{FinproductPayTheVatQuery001}">缴纳增值税查询</title>
</head>

<body>

<div layout:fragment="content">
		<div class="form-button-area">      
             <a id="FinproductPayTheVatQuery001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>    
             <button type="button" class="layui-btn layui-btn-sm btn-default" id="FinproductPayTheVatQuery001_btn_delete"><i class="iconfont icon-revoke"></i>撤销</button>     
        </div>
		<div class="joyin-form-wrap joyin-filter-form condition-area">
			<form class="layui-form" id="searchForm">
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">组合代码</label>
                           <div class="layui-input-inline input-inline">
                                    <select id="portfolioId" name="portfolioId" multiple
                                            class="layui-input form-input input-select"
                                            data-th-data-url="@{/invest/product/paythevatquery/PayTheVatQuery001/selectPortfolioId}"
                                            allowClear="true" placeholder="请选择组合"
                                            data-th-initValue='${entity?.portfolioId}'>
                                    </select>
                          </div>
                    </div>

                    
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">纳税日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="vatDate" name="vatDate"
                                class="layui-input form-input input-dateRangeSelect" value=""
                                placeholder="请选择，支持区间">
                        </div>
                    </div>
	                <div class="layui-inline layui-col-md4">
	                    <label class="layui-form-label form-lable">类型</label>
	                    <div class="layui-input-inline input-inline">
	                        <input type="text" id="taxidenType" name="taxidenType" class="layui-input form-input input-select"
	                       	  data-th-placeholder="#{SysCommon.placeholder}"
	                          data-th-data-result="${PS}">
	                    </div>
	                </div>
              	</div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">增值税品种</label>
                        <div class="layui-input-inline input-inline">
                            <select id=taxClass name="taxClass"
                                class="layui-input form-input input-select"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                allowClear="true" formatoption=true
                                data-th-data-result="${TAX_CLASS}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">产品代码</label>
                        <div class="layui-input-inline input-inline">
                            <select id=finprodId name="finprodId"
                                class="layui-input form-input input-select"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                allowClear="true" formatoption=true
                                data-th-data-url="@{/invest/product/paythevatquery/PayTheVatQuery001/queryProdIdInfo}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable" data-th-text="|#{invest.channelId}#{ChannelAsset002.finprodIdBak}|">通道代码</label>
                        <div class="layui-input-inline input-inline">
                            <select id=channelId name="channelId"
                                class="layui-input form-input input-select"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                allowClear="true" formatoption=true
                                data-th-data-url="@{/invest/product/paythevatquery/PayTheVatQuery001/queryChannelIdInfo}" disabled>
                            </select>
                        </div>
                    </div>
			     </div>
                 <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">币种</label>
                            <div class="layui-input-inline input-inline">
                                <select name="ccy" id="ccy"
                                                    class="layui-input form-input input-select"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue='${entity?.ccy}'
                                                    data-th-data-result="${CCY}">
                                </select>
                            </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable">有效状态</label>
                            <div class="layui-input-inline input-inline">
                                <select id="tradeStatus" name ="tradeStatus"
                                    class="layui-input form-input input-select"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result="${STATUS_VALID}">
                                </select>
                            </div>
                    </div>
            </div>
		</form>
		</div>
		<div>
			<table id="dataTable"></table>
		</div>
	</div>
</body>
<div layout:fragment="script">
	<script 
		data-th-src="@{/js/invest/product/paythevatquery/PayTheVatQuery001.js}"
		type="text/javascript"></script>
</div>

</html>
