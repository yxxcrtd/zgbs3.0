<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinAssetConfigPlan002}">资产配置计划</title>
</head>
<body>
	<div layout:fragment="content">
		<div class="">
			<div class="pro-module-wrapper pro-module-base" style="border-top: none;">
				<input type="text" name='assetConfigCode' id='FinAssetConfigPlan002_assetConfigCode' data-th-value='${entity?.assetConfigCode}' hidden>
				<input type="text" name='assetType' id='FinAssetConfigPlan002_assetType' data-th-value='${entity?.assetType}' hidden>
				<form class="layui-form joyin-form-wrap pro-module-form" id="FinAssetConfigPlan002_form">
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title" style="border-top: 1px solid #cccccc;">
								<span class="title-des">配置信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i>
							</h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinAssetConfigPlan001.configMonth}">配置月份</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="configMonth2" id="FinAssetConfigPlan002_configMonth2" class="layui-input form-input input-dateSelect" 
                            					 data-th-value='${entity?.configMonth2}' placeholder="请选择年月" required />
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinAssetConfigPlan001.tagetScale}">目标总规模</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="tagetScale" id="FinAssetConfigPlan002_tagetScale"
												   class="layui-input form-input text-number" length="5" data-textrange="4" 
												   data-th-placeholder="#{SysCommon.placeholder}"
												   data-th-value='${entity?.tagetScale}' required>
										</div>
									</div>
								</div>
                                <div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinAssetConfigPlan001.benchDate}">基准日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="benchDate" id="FinAssetConfigPlan002_benchDate"
												   class="layui-input form-input input-dateSelect"
												   data-th-value='${#dates.format(entity?.benchDate,"yyyy-MM-dd")}' 
                                                   required>
										</div>
									</div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{FinAssetConfigPlan001.genDate}">生成日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="genDate" id="FinAssetConfigPlan002_genDate"
                                                   class="layui-input form-input input-dateSelect" disabled
                                                   data-th-value='${#dates.format(entity?.genDate,"yyyy-MM-dd")}'
                                                   required>
                                        </div>
                                    </div>
								</div>
							</div>
						</div>
					</div>
                    <div class="pro-module-wrap" id="FinAssetConfigPlan002_div_layering">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">产品系列列表</span>
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <table class="layui-table" id="dataTable" th:title="#{FinAssetConfigPlan002.list}"
                                    name="assetConfigPlanList"></table>
                            </div>
                        </div>
                    </div>                   
					
				</form>
				<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin-top: 20px;margin-bottom: 20px;">
					<div class="text-center">
						<a id="FinAssetConfigPlan002_btn_save"
							class="layui-btn layui-btn-sm btn-save"
							data-th-text="#{SysCommon.save}">保存</a> <a
							id="FinAssetConfigPlan002_btn_submit"
							class="layui-btn layui-btn-sm btn-submit"
							data-th-text="#{SysCommon.submit}">提交</a> <a
							id="FinAssetConfigPlan002_btn_cancel"
							class="layui-btn layui-btn-sm btn-cancel"
							data-th-text="#{SysCommon.cancel}">取消</a>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
	        var workflowId = /*[[${workflowId}]]*/'';
	        var iPlatformDate = /*[[${platDate}]]*/'';//平台日期 
        </script>
        <script data-th-src="@{/js/invest/product/productplanning/asset/FinAssetConfigPlan002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
