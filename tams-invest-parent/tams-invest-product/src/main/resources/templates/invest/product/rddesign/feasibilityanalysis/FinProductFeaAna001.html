<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{FinProductFeaAna001}">可行性分析</title>
</head>
<body>
    <div layout:fragment="content">
        <div class='layui-fluid'>
            <div class="form-button-area">
                <a id="FinProductFeaAna001_btn_analysis"
                   class="layui-btn layui-btn-sm">
                    <span data-th-text="#{FinProductFeaAna001.analysis}">可行性分析</span></a>
            </div>

            <div class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
                <form class="layui-form" id="searchForm">
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                                   data-th-text="#{FinProductFeaAna001.effectStatus}">有效状态</label>
                            <div class="layui-input-inline input-inline">
                                <select name="status"
                                        class="layui-input form-input input-select"
                                        data-th-placeholder="#{SysCommon.placeholder}"
                                        data-th-data-result="${STATUS_VALID}">
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable" data-th-text="#{FinProductFeaAna001.issueObject}">目标客户</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="tarCustomer" name="tarCustomer"
                                       class="layui-input form-input" placeholder="请输入内容"
                                       data-th-placeholder="#{SysCommon.placeholder}" >
                            </div>
                        </div>
                        <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                                   data-th-text="#{FinProductFeaAna001.feasibilityStatus}">分析结论</label>
                            <div class="layui-input-inline input-inline">
                                <select name="feasibilityStatus"
                                        id="feasibilityStatus"
                                        class="layui-input form-input input-select"
                                        data-th-placeholder="#{SysCommon.placeholder}"
                                        data-th-data-result="${FEASIBILITY_STATUS}">
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                                   data-th-text="#{FinProductFeaAna001.feasibilityType}">可行需求分类</label>
                            <div class="layui-input-inline input-inline">
                                <select name="feasibilityType"
                                        id="feasibilityType"
                                        class="layui-input form-input input-select"
                                        data-th-placeholder="#{SysCommon.placeholder}"
                                        data-th-data-result="${FEASIBILITY_TYPE}">
                                </select>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script th:inline="javascript">
            var effective = /*[[${effective}]]*/'';
            var analyse_status = /*[[${analyse_status}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/product/rddesign/feasibilityanalysis/FinProductFeaAna001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
