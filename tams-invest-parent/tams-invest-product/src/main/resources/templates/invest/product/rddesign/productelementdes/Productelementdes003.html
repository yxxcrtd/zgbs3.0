<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{Productelementdes003}">产品需求详细信息</title>
</head>
<body>
    <div class="pro-module-wrap">
        <div layout:fragment="content">
            <div class="pro-module-wrapper pro-module-base" style="border-top: none;">
                <form class="layui-form joyin-form-wrap pro-module-form" id="FinProductFeaAna002_Form">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title"><span class="title-des" style="border-top: 1px solid #cccccc;">基本信息</span><i
                                    class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{Productelementdes001.requirementId}">需求编号</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="requirementId" id="requirementId"
                                                   class="layui-input form-input" maxlength=60
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value='${entity?.requirementId}'
                                                   disabled = "disabled" >
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{Productelementdes001.prdScale}">规模</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="prdScale" id="prdScale"
                                                   class="layui-input form-input" maxlength=60
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value='${entity?.prdScale}'
                                                   disabled = "disabled" >
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{Productelementdes001.prdPeriod}">期限</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="prdPeriod" id="prdPeriod"
                                                   class="layui-input form-input" maxlength=60
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value='${entity?.prdPeriod}'
                                                   disabled = "disabled" >
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{Productelementdes001.prdRate}">收益率</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="prdRate" id="prdRate"
                                                   class="layui-input form-input" maxlength=60
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value='${entity?.prdRate}'
                                                   disabled = "disabled" >
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{Productelementdes001.prdRequirementDetial}">产品详细需求</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="prdRequirementDetial" id="prdRequirementDetial"
                                                   class="layui-input form-input" maxlength=60
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value='${entity?.prdRequirementDetial}'
                                                   disabled = "disabled" >
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{Productelementdes001.feasibilityStatus}">分析状态</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="feasibilityStatus" id="feasibilityStatus"
                                                   class="layui-input form-input" maxlength=60
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value='${entity?.feasibilityStatusStr}' disabled = "disabled">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{Productelementdes001.feasibilitType}">可行需求分类</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="feasibilitType" id="feasibilitType"
                                                   class="layui-input form-input" maxlength=60
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value='${entity?.feasibilitTypeStr}' disabled = "disabled">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                </form>
            </div>

        </div>
    </div>
    <div layout:fragment="script">
        <script th:inline="javascript">

        </script>

    </div>
</body>
</html>
