<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinProductScheduling002}">产品排期新建</title>
<style type="text/css">
        .form-label-wrap{
            width: 36% !important;
        }
        .layui-form-radio{
            margin: 0;
            padding-right: 0;
        }
        .layui-form-radio>i{
            font-size: 18px;
            margin-right: 2px;
        }
        .form-day-wrap{
            float: left;
        }
    </style>
</head>
<body>
	<div layout:fragment="content">
		<div class="pro-module-container page-step">
			<form class="layui-form joyin-form-wrap pro-module-form" id="FinProductScheduling002_submitForm">
            <div class="pro-module-wrapper pro-module-base step" title="基本信息">
            	<div class="pro-module-wrap">
            		<div class="pro-module">
            			<h3 class="pro-module-title"><span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
            			<div class="pro-module-item">
            					<input type="text" name="finprodId" data-th-value='${entity?.finprodId}' hidden>
            					<input type="text" name="workflowId" data-th-value='${workflowId}' hidden>
            					<div class="layui-form-item">
            						<div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductScheduling002.templetId}">产品模板</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="FinProductScheduling002_SELECT_templetId" name="tmplId" class="layui-input form-input input-select" data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-data-url="@{/invest/product/productelement/scheduling/FinProductScheduling002/queryProdTempleteInfo}"
                                            formatoption=false data-th-initValue='${entity?.tmplId}'>
                                            </select>
                                        </div>
                                    </div>
            						<div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductScheduling002.prodId}">产品代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="FinProductScheduling002_finprodMarketId" name="finprodMarketId" class="layui-input form-input" data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-value='${entity?.finprodMarketId}' required>
                                        </div>
                                    </div>
            						<div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductScheduling002.prodName}">产品名称</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="FinProductScheduling002_finprodName" name="finprodName" class="layui-input form-input" data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-value='${entity?.finprodName}' required>
                                        </div>
                                    </div>
            					</div>
            					<div class="layui-form-item">
            						<div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductScheduling002.prodAbbr}">产品简称</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="FinProductScheduling002_finprodAbbr" name="finprodAbbr" class="layui-input form-input" data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-value='${entity?.finprodAbbr}' required>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                    	<label class="layui-form-label form-label-wrap" data-th-text="#{FinProductScheduling002.vdate}">起息日</label>
					                    <div class="layui-input-inline input-inline">
					                        <input type="text" id="FinProductScheduling002_DATE_vdate" name="vdate"
					                            class="layui-input form-input input-dateSelect" data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}' required>
					                    </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                    	<label class="layui-form-label form-label-wrap" data-th-text="#{FinProductScheduling002.mdate}">到期日</label>
					                    <div class="layui-input-inline input-inline">
					                        <input type="text" id="FinProductScheduling002_DATE_mdate" name="mdate"
					                            class="layui-input form-input input-dateSelect" data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}' required>
					                    </div>
                                    </div>
            					</div>
            					<div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                    	<label class="layui-form-label form-label-wrap" data-th-text="#{FinProductScheduling002.raiseStrDate}">募集开始日</label>
					                    <div class="layui-input-inline input-inline">
					                        <input type="text" id="raiseStrdate" name="raiseStrdate"
					                            class="layui-input form-input input-dateSelect" data-th-value='${#dates.format(entity?.raiseStrdate,"yyyy-MM-dd")}' required>
					                    </div>
                                    </div>
                                    <div class="form-inline-wrap">

					                    <div class="layui-input-inline input-inline">
					                        <input type="text" id="raiseEnddate" name="raiseEnddate"
					                            class="layui-input form-input input-dateSelect" data-th-value='${#dates.format(entity?.raiseEnddate,"yyyy-MM-dd")}' required>
					                    </div>
                                    </div>
                                    <div class="form-inline-wrap">

                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="toffStartLow" class="layui-input form-input text-number" data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-value='${entity?.toffStartLow}' data-textrange='6' data-fixtype='2' required>
                                            <span class="input-right-show">万元</span>
                                        </div>
                                    </div>
            					</div>
            					<div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductScheduling002.subStartAmtMid}">认购起点金额(中层)</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="toffStartMid" class="layui-input form-input text-number" data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-value='${entity?.toffStartMid}' data-textrange='6' data-fixtype='2' required>
                                            <span class="input-right-show">万元</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductScheduling002.subStartAmtHei}">认购起点金额(高层)</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="toffStartHig" class="layui-input form-input text-number" data-th-placeholder="#{SysCommon.placeholder}"

                                            <span class="input-right-show">万元</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductScheduling002.customRateBot}">客户收益率(底层)</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="yieldLow" class="layui-input form-input text-number" data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-value='${entity?.yieldLow}' data-textrange='4' data-fixtype='2' required>
                                            <span class="input-right-show">%</span>
                                        </div>
                                    </div>
            					</div>
            					<div class="layui-form-item">
            						<div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductScheduling002.customRateMid}">客户收益率(中层)</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="yieldMid" class="layui-input form-input text-number" data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-value='${entity?.yieldMid}' data-textrange='4' data-fixtype='2' required>
                                            <span class="input-right-show">%</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductScheduling002.customRateHei}">客户收益率(高层)</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="yieldHig" class="layui-input form-input text-number" data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-value='${entity?.yieldHig}' data-textrange='4' data-fixtype='2' required>
                                            <span class="input-right-show">%</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductScheduling002.addAmt}">追加金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="lowestAmt" class="layui-input form-input text-number" data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-value='${entity?.lowestAmt}' required>
                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>
            					</div>
            					<div class="layui-form-item">
            						<div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductScheduling002.raiseTopLimit}">募集上限</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="raiseMax" class="layui-input form-input text-number" data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-value='${entity?.raiseMax}' required>
                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductScheduling002.saleFeeRate}">销售费率</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="saleFeeRate" class="layui-input form-input text-number" data-th-placeholder="#{SysCommon.placeholder}"

                                            <span class="input-right-show">%</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductScheduling002.trustFeeRate}">托管费率</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="trustFeeRate" class="layui-input form-input text-number" data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-value='${entity?.trustFeeRate}' data-textrange='4' data-fixtype='2' required>
                                            <span class="input-right-show">%</span>
                                        </div>
                                    </div>
            					</div>
            					<div class="layui-form-item">
            						<div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductScheduling002.issueMode}">发行方式</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="issueMode" required="required" id="FinProductScheduling002_SELECT_issueMode"
                                                   class="layui-input form-input input-checkbox" data-th-data-result="${SCHEDUAL_ISSUE}"
                                                   data-th-initValue='${entity?.issueMode}'/>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductScheduling002.payIntCycle}">付息周期</label>
                                        <div class="layui-input-inline input-inline">
                                            <select name="intpayCyc" class="layui-input form-input input-select" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${INTPAY_PERIOD}"
                                            data-th-initValue='${entity?.intpayCyc}'>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductScheduling002.ccy}">币种</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="FinProductScheduling002_SELECT_ccy" name="ccy" class="layui-input form-input input-select" data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-initValue='${entity?.ccy}' required data-th-data-result="${CCY}">
                                            </select>
                                        </div>
                                    </div>
            					</div>
            					<div class="layui-form-item">
            						<div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductScheduling002.termType}">期限品种</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="FinProductScheduling002_SELECT_termType" name="termType" class="layui-input form-input input-select" data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-initValue='${entity?.termType}' required data-th-data-result="${SVR_PRODUCT_TERM}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductScheduling002.prodRegistCode}">产品登记编码</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="prodRegistCode" disabled class="layui-input form-input" data-th-value='${entity?.prodRegistCode}'/>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductScheduling002.branch}">分行</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="FinProductScheduling002_SELECT_branch" name="branchBank" class="layui-input form-input input-select" data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-data-url="@{/invest/product/common/queryCounterpartyInfo}" formatoption=false multiple="true"
                                            data-th-initValue='${entity?.branchBank}' required>
                                            </select>
                                        </div>
                                    </div>
            					</div>

            						<div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductScheduling002.ruleOpenCycle}">规律开放周期</label>
                                        <div class="layui-input-inline input-inline">
                                            <select name="openCycle" class="layui-input form-input input-select" data-th-placeholder="#{SysCommon.placeholder}"
                                            	data-th-initValue='${entity?.openCycle}' data-th-data-result="${SVR_REGULAR_OPEN_CYCLE}">
                                            </select>
                                        </div>
                                    </div>

                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="prodId" name="openRemark" class="layui-input form-input" data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-value='${entity?.openRemark}'>
                                        </div>
                                    </div>
            					</div>
            					<div class="layui-form-item">
            						<div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductScheduling002.fristOpenCycleStrDate}">首次开放周期起始日</label>
                                        <div class="layui-input-inline input-inline">
					                        <input type="text" id="valueDate" name="firstOpenDay"
					                            class="layui-input form-input input-dateSelect" data-th-value='${#dates.format(entity?.firstOpenDay,"yyyy-MM-dd")}'>
					                    </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductScheduling002.avgOpenCount}">平均开放次数(年化)</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="prodId" name="aveOpenTime" class="layui-input form-input" data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-value='${entity?.aveOpenTime}'>
                                            <span class="input-right-show">次</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductScheduling002.openBus}">开放期业务</label>
                                        <div class="layui-input-inline input-inline">
                                            <select name="openBuss" class="layui-input form-input input-select" data-th-placeholder="#{SysCommon.placeholder}"
                                            	data-th-initValue='${entity?.openBuss}' data-th-data-result="${SVR_OPEN_BUSS}">
                                            </select>
                                        </div>
                                    </div>
            					</div> -->
            					<div class="layui-form-item">
            						<!-- <div class="form-inline-wrap">
            							<label class="layui-form-label form-label-wrap" data-th-text="#{FinProductScheduling002.openBusExplain}">开放期业务说明</label>
	                                    <div class="layui-input-inline input-inline">
	                                        <input type="text" id="openBussRemark" name="openBussRemark" class="layui-input form-input" data-th-placeholder="#{SysCommon.placeholder}"
	                                        data-th-value='${entity?.openBussRemark}'>
	                                    </div>
            						</div> -->
            						<!-- <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductScheduling002.holidayIsOpen}">节假日是否开放</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="checkbox" id="isCycle" name="hdayOpenFlag" lay-skin="switch" data-th-value="${YES}" lay-text="是|否" data-th-checked="${entity?.hdayOpenFlag}">
                                        </div>
                                    </div> -->
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductScheduling002.declareFilePlan}">申报附件方案</label>
                                        <div class="layui-input-inline input-inline">
                                            <select name="schemeId" class="layui-input form-input input-select" data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-data-url="@{/invest/product/productelement/scheduling/FinProductScheduling002/queryDeclareSchemeInfo}"
                                            data-th-initValue='${entity?.schemeId}' required>
                                            </select>
                                        </div>
                                    </div>
            					</div>
	            			</div>
	            		</div>
	            	</div>
	            	<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title">
								<span class="title-des">备注信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i>
							</h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div>
										<div class="layui-input-inline input-inline" style="width: 85%!important;">
											<textarea name="remark" th:value="${entity?.remark}"
												 	placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
													  class="layui-textarea" data-th-text="${entity?.remark}"></textarea>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
	            </div>
	            <div class="pro-module-wrapper step" title="申报参数基本信息">
	                <!-- 中债报送信息 -->
	                <div class="page-component" th:data-path="@{/component/report/prod/BussRepFinProductInfo/init}" th:data-params="|{entityName: 'bussRepFinProductInfoDto', pageId: '${pageId}', finprodId: '${finprodId}', workflowId: '${workflowId}'}|"></div>
	                <div class="row text-center stepbar">
		                 <a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
		                 <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
		                 <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
		            </div>
	            </div>

		</div>
	</div>
	<div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
	        var REPTERM_02 = /*[[${REPTERM_02}]]*/;
	        var REPTERM_03 = /*[[${REPTERM_03}]]*/;

        <script data-th-src="@{/js/invest/product/productelement/scheduling/FinProductScheduling002.js}" type="text/javascript"></script>
		<script data-th-src="@{/js/invest/product/productelement/common/FinProductCommon.js}" type="text/javascript"></script>
    </div>

</html>
