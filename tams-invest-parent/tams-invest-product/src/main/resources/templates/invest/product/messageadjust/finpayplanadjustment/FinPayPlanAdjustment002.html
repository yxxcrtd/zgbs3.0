<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinPayPlanAdjustment002}">付费规则调整</title>
</head>	
<body>
    <div layout:fragment="content">
		<div class="">
			<div class="pro-module-wrapper pro-module-base" style="border-top: none;">
				<form class="layui-form joyin-form-wrap" id="submitForm">
					<div class="pro-module-wrap">
						<input type="text" id="vdate" name="vdate" data-th-value="${entity?.vdate}" hidden>
						<input type="text" id="mdate" name="mdate" data-th-value="${entity?.mdate}" hidden>
						<input type="text" id="dealCalId" name="dealCalId" data-th-value="${entity?.dealCalId}" hidden>
						<input type="text" id="profitType" name="profitType" data-th-value="${entity?.profitType}" hidden>
						<input type="text" id="finprodId" name="finprodId" data-th-value="${entity?.finprodId}" hidden>
						<input type="text" id="isLay" name="isLay" data-th-value="${entity?.isLay}" hidden>
						<input type="text" id="liquidationDate" name="liquidationDate" data-th-value="${entity?.liquidationDate}" hidden>
						<div class="pro-module">
							<h3 class="pro-module-title" style="border-top: 1px solid #ccc;"><span class="title-des">基础信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="layui-inline layui-col-md6  layui-col-sm6 layui-col-lg6 layui-col-xs6">
										<label class="layui-form-label form-lable"
											   data-th-text="#{FinProductRateQuotation001.finprodId}">产品代码</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="finprodMarketId" name="finprodMarketId" class="layui-input form-input input-select"
													allowClear="true" placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}" formatoption = "true"
													required
													data-th-data-url="@{/invest/product/messageadjust/finpayplanadjustment/FinPayPlanAdjustment002/getSelectFinprodId}"
													data-th-initValue="${entity?.finprodMarketId}">
											</select>
										</div>
									</div>
									<div class="layui-inline layui-col-md6  layui-col-sm6 layui-col-lg6 layui-col-xs6">
										<label class="layui-form-label form-lable"
											   data-th-text="#{FinProductRateQuotation002.finprodAbbr}">产品简称</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="finprodAbbr" name="finprodAbbr"
												   class="layui-input form-input" disabled
												   data-th-value="${entity?.finprodAbbr}">
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div style="display:none;" class="layui-input-inline input-inline">
										<input type="text" id="workflowId" name="workflowId"
											   class="layui-input form-input"
											   data-th-value="${workflowId}"
											   disabled=true/>
									</div>
									<div style="display:none;" class="layui-input-inline input-inline">
										<input type="text" id="cashId" name="cashId"
											   class="layui-input form-input"
											   data-th-value="${entity?.cashId}"
											   disabled=true/>
									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<table class="layui-table" id="dataTable"></table>
							</div>
						</div>
					</div>
				</form>
				<div class="layui-col-md11" style="margin:20px 0;">
					<div class="text-center">
						<a id="FinPayPlanAdjustment002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
						<a id="FinPayPlanAdjustment002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
						<a id="FinPayPlanAdjustment002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
					</div>
				</div>
			</div>
		</div>
	</div>
    <div layout:fragment="script">
    	<script data-th-inline="javascript" type="text/javascript">
            var finprodId = /*[[${finprodId}]]*/''; // 产品代码
            var BILL_BASE_FEE_KIND = /*[[${BILL_BASE_FEE_KIND}]]*/'[]'; // 计费基数_费用品种
            var BASIS_SELECT = /*[[${BASIS_SELECT}]]*/'[]'; // 计息基础
            var BASE_DATE_TYPE = /*[[${BASE_DATE_TYPE}]]*/'[]'; // 基数日期类型
            var PAY_RULE = /*[[${FREQUENCY_UNIT}]]*/'[]'; // 付费规则
            var TDAY_RULE = /*[[${TDAY_RULE}]]*/'[]'; // 营业日准则
            var FEE_TYPE_05 = /*[[${FEE_TYPE_05}]]*/'05'; // 差额中收
            var BASIC_BILL_04 = /*[[${BASIC_BILL_04}]]*/'';
            var BASE_DATE_TYPE_01 = /*[[${BASE_DATE_TYPE_01}]]*/'';
            var BASE_DATE_TYPE_02 = /*[[${BASE_DATE_TYPE_02}]]*/'';
            var CHARGE_TYPE_02 = /*[[${CHARGE_TYPE_02}]]*/'';
            var BILL_BASE_FEE_KIND_03 = /*[[${BILL_BASE_FEE_KIND_03}]]*/; // 计费基数 资产规模
            var BASE_DATE_TYPE_03 = /*[[${BASE_DATE_TYPE_03}]]*/'';
            
            var PAY_RULE_03 = /*[[${PAY_RULE_03}]]*/'03'; // 频率_月
    		var PAY_RULE_04 = /*[[${PAY_RULE_04}]]*/'04'; // 频率_季
    		var PAY_RULE_05 = /*[[${PAY_RULE_05}]]*/'05'; // 频率_年
    		var PAY_RULE_06 = /*[[${PAY_RULE_06}]]*/'06'; // 频率_半年
    		var PAY_RULE_08 = /*[[${PAY_RULE_08}]]*/'08'; // 不规则
    		var PAY_RULE_07 = /*[[${PAY_RULE_07}]]*/'07'; // 到期一次
    		var FEE_TYPE_05 = /*[[${FEE_TYPE_05}]]*/'05'; // 差额中收
    		var FEE_TYPE_05NAME = /*[[${FEE_TYPE_05NAME}]]*/; // 差额中收
			var WORK_FLAG = /*[[${WORK_FLAG}]]*/;//是否在代办中
        </script>
        <script data-th-src="@{/js/invest/product/messageadjust/finpayplanadjustment/FinPayPlanAdjustment002.js}"></script>
    </div>
</body>

</html>
