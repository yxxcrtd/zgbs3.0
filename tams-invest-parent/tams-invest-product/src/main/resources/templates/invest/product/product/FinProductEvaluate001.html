<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{FinProductEvaluate001}">产品评价</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area" export="false">
            <!--需求没有，暂时隐藏-->
            <!--<a id="FinProductEvaluate001_btn_evaluate"
               class="layui-btn layui-btn-sm">
                <span data-th-text="#{FinProductEvaluate001.evaluate}">生成评价报告</span></a>-->
        </div>
        <div class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="form-inline-wrap layui-col-xs4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{FinProductEvaluate001.vdate}">起始日</label>
                        <div class="layui-input-inline input-inline">
                            <input id="vdate" name="vdate" class="layui-input form-input input-dateSelect"
                                   placeholder="请选择时间" data-th-value="${#dates.format(entity?.vdate,'yyyy-MM-dd')}" required="required"
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="form-inline-wrap layui-col-xs4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{FinProductEvaluate001.mdate}">评价日</label>
                        <div class="layui-input-inline input-inline">
                            <input id="mdate" name="mdate" class="layui-input form-input input-dateSelect"
                                   placeholder="请选择时间" data-th-value="${#dates.format(entity?.mdate,'yyyy-MM-dd')}" required="required"
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{FinProductEvaluate001.proName}">产品名称</label>
                        <div class="layui-input-inline input-inline">
                            <select name="proId"
                                    id="select_proName"
                                    class="layui-input form-input input-select"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    parentIds="vdate,mdate"
                                    data-th-data-url="@{/invest/product/product/FinProductEvaluate001/getProName}"
                                    required>
                            </select>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div style="overflow: auto;height: 500px;">
            <div class="pro-module-wrap" style="margin-top: 10px;">
                <div class="pro-module">
                    <h3 class="pro-module-title" style="border-top: 1px solid #ccc;">
                        <span class="title-des">产品发行前信息</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item" style="overflow:auto !important; height: 415px;">
                        <div class="nochange">
                            <table class="layui-table" id="dataTable1"></table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pro-module-wrap" style="margin-top: 10px;">
                <div class="pro-module">
                    <h3 class="pro-module-title" style="border-top: 1px solid #ccc;">
                        <span class="title-des">评价日资产配置情况</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item" style="overflow:auto !important; height: 415px;">
                        <div class="nochange">
                            <table class="layui-table" id="dataTable2"></table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pro-module-wrap" style="margin-top: 10px;">
                <div class="pro-module">
                    <h3 class="pro-module-title" style="border-top: 1px solid #ccc;">
                        <span class="title-des">产品净值表现</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item" style="overflow:auto !important; height: 270px;">
                        <div class="trast-list-left">
                            <div id="chart1" style="height: 270px;"></div>
                        </div>
                        <div class="trast-list-right">
                            <table class="layui-table" id="dataTable3"></table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pro-module-wrap" style="margin-top: 10px;">
                <div class="pro-module">
                    <h3 class="pro-module-title" style="border-top: 1px solid #ccc;">
                        <span class="title-des">收益指标</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item" style="overflow:auto !important; height: 270px;">
                        <div class="trast-list-left">
                            <div id="chart2" style="height: 270px;"></div>
                        </div>
                        <div class="trast-list-right">
                            <table class="layui-table" id="dataTable4"></table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pro-module-wrap" style="margin-top: 10px;">
                <div class="pro-module">
                    <h3 class="pro-module-title" style="border-top: 1px solid #ccc;">
                        <span class="title-des">收益结构指标</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item" style="overflow:auto !important; height: 500px;">
                        <div class="trast-list-left">
                            <div class="pie-top">
                                <div id="chart3_1"></div>
                                <div id="chart3_2"></div>
                            </div>
                            <div class="pie-bottom">
                                <div id="chart3_3"></div>
                                <div id="chart3_4"></div>
                            </div>

                        </div>
                        <div class="trast-list-right-pie">
                            <table class="layui-table" id="dataTable5"></table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pro-module-wrap" style="margin-top: 10px;">
                <div class="pro-module">
                    <h3 class="pro-module-title" style="border-top: 1px solid #ccc;">
                        <span class="title-des">风险指标</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item pro-item-wrap" style="overflow:auto !important; height: 270px;">
                        <div class="trast-list-left">
                            <div id="chart4" style="height: 270px;"></div>
                        </div>
                        <div class="trast-list-right">
                            <table class="layui-table" id="dataTable6"></table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pro-module-wrap" style="margin-top: 10px;margin-bottom: 35px">
                <div class="pro-module">
                    <h3 class="pro-module-title" style="border-top: 1px solid #ccc;">
                        <span class="title-des">风险调整收益指标</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item pro-item-wrap" style="overflow:auto !important; height: 270px;">
                        <div class="trast-list-left">
                            <div id="chart5" style="height: 270px;"></div>
                        </div>
                        <div class="trast-list-right">
                            <table class="layui-table" id="dataTable7"></table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <style>
            .layui-table {
                width: 100% !important;
            }

            .nochange .layui-table-view {
                height: 400px !important;
                overflow: auto;
            }
            .nochange .layui-table-view .layui-table-box .layui-table-body {
                height: 300px !important;
                overflow: auto;
            }
            .trast-list-left {
                float: left;
                width: 45%;
            }

            .trast-list-right {
                float: left;
                width: 55%;
                position: relative;
            }

            .trast-list-right .layui-table-view {
                height: 260px !important;
                overflow: auto;
            }

            .trast-list-right .layui-table-view .layui-table-box .layui-table-body {
                height: 175px !important;
                overflow: auto;
            }

            .trast-list-right-pie{
                float: left;
                width: 55%;
                position: relative;
            }

            .trast-list-right-pie .layui-table-view {
                height: 485px !important;
                overflow: auto;
            }

            .trast-list-right-pie .layui-table-view .layui-table-box .layui-table-body {
                height: 400px !important;
                overflow: auto;
            }

            .pie-top,.pie-bottom{
                height: 250px;
                width: 100%;
            }
            #chart3_1,#chart3_3{
                float: left;
                width: 50%;
                height: 250px;
            }
            #chart3_2,#chart3_4{
                float: right;
                width: 50%;
                height: 250px;
            }
        </style>
        <script th:inline="javascript">
            var vdate,
                mdate;
            var sysDate = /*[[${sysDate}]]*/'';
            var proType = /*[[${proType}]]*/'';
            $('#vdate').change(function () {
                vdate = $('#vdate').val();
            });
            $('#mdate').change(function () {
                mdate = $('#mdate').val();
                if(vdate > mdate){
                    Joyin.error("起始日需小于等于评价日！");
                    return;
                }
                if(mdate >= sysDate){
                    Joyin.error("评价日需小于平台时间！");
                    return;
                }
            });

            var isHB = true;
        </script>
        <script data-th-src="@{/js/invest/product/product/FinProductEvaluate001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
