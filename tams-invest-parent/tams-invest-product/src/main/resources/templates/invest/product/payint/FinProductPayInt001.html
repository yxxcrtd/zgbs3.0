<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{FinProductPayInt001}">产品中间付息查询</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="form-button-area">
            <a id="FinProductPayInt001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
            <a id="FinProductPayInt001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke" data-th-text="#{pingan.common.revoke}">撤销</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{FinProductPayInt001.prodId}">产品代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="prodId" name="prodId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/product/payint/FinProductPayInt001/queryProdIdInfo}"
                                data-th-initValue='${finprodId}'
                                multiple="true" >
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{FinProductPayInt001.payIntEndDate}">付息截止日</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="payIntEndDate" name="payIntEndDate"
                                class="layui-input form-input input-dateRangeSelect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" >
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{FinProductPayInt001.validStatus}">有效状态</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="validStatus" name="validStatus"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${PAGE_DATA_STATUS}'
                                allowClear="true" formatoption="true" >
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{FinProductPayInt001.portfolioId}">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="portfolioId" name="portfolioId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/product/payint/FinProductPayInt001/selectPortfolioId}"
                                multiple="true" >
                             </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{FinProductPayInt001.payDate}">支付日</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="payDate" name="payDate"
                                class="layui-input form-input input-dateRangeSelect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" >
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
            var PAGE_DATA_STATUS_01 = /*[[${PAGE_DATA_STATUS_01}]]*/'';
            var PAGE_DATA_STATUS_YX = /*[[${PAGE_DATA_STATUS_YX}]]*/''; 
        </script>
        <script data-th-src="@{/js/invest/product/payint/FinProductPayInt001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
