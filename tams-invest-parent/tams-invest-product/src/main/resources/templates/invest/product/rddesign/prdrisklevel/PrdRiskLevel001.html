<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PrdRiskLevel001}">新发产品风险等级评定查询</title>
</head>
<body>
    <div layout:fragment="content">
        <div class='layui-fluid'>
            <div class="layui-col-md12 form-button-area" style="margin: 10px;">
                <a id="PrdRiskLevel001_btn_new" class="layui-btn layui-btn-sm btn-create"
                    data-th-text="#{SysCommon.create}">新建</a>
                <a id="PrdRiskLevel001_btn_edit" class="layui-btn layui-btn-sm"
                    data-th-text="#{ProdDevelopManage001.edit}" style="display: none">修改</a>
                <a id="PrdRiskLevel001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
                    data-th-text="#{SysCommon.delete}" style="display: none">删除</a>
            </div>
            <div class='joyin-form-wrap joyin-filter-form condition-area'>
                <form class="layui-form" id="searchForm">
                <input id="seqNo" name=seqNo type="hidden" />
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                                data-th-text="#{PrdRiskLevel002.page.finProductCode}">产品设计编码</label>
                            <div class="layui-input-inline input-inline">
                                <select id="id" name="id"
                                    class="layui-input form-input input-select"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-url="@{/invest/product/rddesign/prdrisklevel/PrdRiskLevel001/productDesignCode}">
                                </select>
                            </div>
                        </div>
						
					<div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{PrdRiskLevel002.page.finProductName}">产品设计系列名称</label>
                        <div class="layui-input-inline input-inline">
                             <select id="finProductName" name="finProductName"
	                            class="layui-input form-input input-select"
	                            data-th-placeholder="#{SysCommon.placeholder}"
	                            data-th-data-url="@{/invest/product/rddesign/prdrisklevel/PrdRiskLevel001/finProductName}"
	                            >
	                        </select>
                        </div>
                    </div>

                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                                data-th-text="#{PrdRiskLevel002.page.finProductTime}">评定时间</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="generateTime" name="generateTime"
									class="layui-input form-input input-dateRangeSelect"
									placeholder="请选择评定时间">
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/product/rddesign/prdrisklevel/PrdRiskLevel001.js}"></script>
    </div>
</body>
</html>
