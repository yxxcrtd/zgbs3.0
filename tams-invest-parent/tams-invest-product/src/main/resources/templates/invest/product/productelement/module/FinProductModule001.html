<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinProductModule001}">产品要素模板</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				
				<a id="FinProductModule001_btn_add" class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a>
				<a id="FinProductModule001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
				data-th-text="#{SysCommon.delete}">删除</a>
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductModule001.templetName}">模板名称</label>
							<div class="layui-input-inline input-inline">
								<select id="templetName" name="templetName" multiple="true"
									class="layui-input form-input input-select" 
									data-th-placeholder="#{SysCommon.placeholder}"
 									data-th-data-url="@{/invest/product/productelement/module/FinProductModule001/getTempletNameList}">
								</select>		
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductModule001.dealMode}">产品处理模式</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="dealMode" name="dealMode"
									class="layui-input form-input input-select"
									placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result = '${DISPOSE_PATTERN}'
									>
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductModule001.profitType}">收益类型</label>
							<div class="layui-input-inline input-inline">
								<!-- <input type="text" id="profitType" name="profitType"
									class="layui-input form-input input-select"
									placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result = '${PROFIT_TYPE}'
									> -->
                                <select name="profitType"
                                    id="profitType"
                                    class="layui-input form-input input-select"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result="${PROFIT_TYPE}" allowClear="true" formatoption="true">
                                </select>    
							</div>
						</div>
					</div>
				</form>
			</div>

			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script
			data-th-src="@{/js/invest/product/productelement/module/FinProductModule001.js}"></script>
	</div>
</body>
</html>
