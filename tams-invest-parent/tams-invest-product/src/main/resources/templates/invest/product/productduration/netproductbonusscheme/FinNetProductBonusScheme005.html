<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{FinNetProductBonusScheme005}">红利再投份额确认</title>
    <style>
.space {
    padding-bottom: 8px;
}
.val-radio-wrap .layui-form-radio{
	margin:0;
	line-height:normal;
}
.val-radio-wrap .layui-form-radio i{
    font-size: 20px;
    color:#4893e6
}
</style>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">产品要素</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <input type="text" id="portfolioId" name="portfolioId" class="layui-input form-input" data-th-value="${entity?.portfolioId}" style = "display: none">
                                <input type="text" id="operateType" name="operateType" class="layui-input form-input" data-th-value="${entity?.operateType}" style = "display: none">
                                <input type="text" id="finprodId" name="finprodId" class="layui-input form-input" data-th-value="${entity?.finprodId}" style = "display: none">
                                <input type="text" id="unitvalueDec" name="unitvalueDec" class="layui-input form-input"  style = "display: none">
                                <input type="text" id="purSpeed" name="purSpeed" class="layui-input form-input"  style = "display: none">
                                <input type="text" id="tdyAssetAmt" name="tdyAssetAmt" class="layui-input form-input"  style = "display: none">
                                <input type="text" id="dealType" name="dealType" data-th-value="bonusShareConfirm" class="layui-input form-input"  style = "display: none">
                                <input type="text" id="tradeId" name="tradeId" data-th-value="${entity?.tradeId}" style = "display: none">
                                <input type="text" id="regDate" name="regDate" data-th-value="${#dates.format(entity?.regDate,'yyyy-MM-dd')}" style = "display: none">
                                <input type="text" id="baseDate" name="baseDate" data-th-value="${#dates.format(entity?.baseDate,'yyyy-MM-dd')}" style = "display: none">
                                <input type="text" id="bonuScalcFlag" name="bonuScalcFlag" data-th-value="${entity?.bonuScalcFlag}" style = "display: none">
                                <input type="text" id="bonusDate" name="bonusDate" data-th-value="${#dates.format(entity?.bonusDate,'yyyy-MM-dd')}" style = "display: none">
                                <input type="text" id="totalBonusCashAmt" name="totalBonusCashAmt" data-th-value="${entity?.totalBonusCashAmt}" style = "display: none">
                                <input type="text" id="actTotalAmt" name="actTotalAmt" data-th-value="${entity?.actTotalAmt}" style = "display: none">
                                <input type="text" id="bTradeId" name="bTradeId" class="layui-input form-input" data-th-value="${entity?.bTradeId}" style = "display: none">
                                <input type="text" id="isCycle" name="isCycle" class="layui-input form-input" data-th-value="${entity?.isCycle}" style = "display: none">
                                <div class=" form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductBonusScheme001.finprodMarketId}">产品代码</label>
                                    <div class="layui-input-inline input-inline">
                                            <select type="text" id="finprodMarketId" name="finprodMarketId"
                                                    class="layui-input form-input input-select"
                                                    data-th-data-url="@{/invest/product/productduration/netproductbonusscheme/FinNetProductBonusScheme001/getFinprodMarketIdList}"
                                                    formatoption="false" required="required" allowClear="true" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}" searchable="false"
                                                    data-th-initValue='${entity?.finprodMarketId}' disabled>
                                            </select>
                                    </div>
                                </div>
                                <div class=" form-inline-wrap" >
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductBonusScheme002.prodStyle}">产品款型</label>                                    
                                    <div class="layui-input-inline input-inline">
                                        <select name="prodStyle" id="prodStyle"
                                            class="layui-input form-input input-select"
                                            data-th-initValue='${entity?.prodStyle}' required
                                              disabled>
                                        </select>
                                    </div>
                                </div>
                                <div class=" form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductBonusScheme001.ccy}">币种</label>                                    
                                    <div class="layui-input-inline input-inline">
                                        <select name="ccy" id="finccy"
                                            class="layui-input form-input input-select"
                                            data-th-initValue='${entity?.ccy}'
                                            data-th-data-result="${CCY}" required disabled>
                                        </select>
                                    </div>
                                    
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">红利再投要素</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item space">
                                <div class=" form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductBonusScheme001.bonusPlanId}">分红方案编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" class="layui-input form-input" id="bonusPlanId"
                                               name="bonusPlanId" data-th-value="${entity?.bonusPlanId}" required disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap layui-col-xs4">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductBonusScheme001.delDate}">除权日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="delDate" name="delDate" class="layui-input form-input input-dateSelect"
                                               placeholder="请选择时间" data-th-value="${#dates.format(entity?.delDate,'yyyy-MM-dd')}" required="required"
                                               data-th-placeholder="#{SysCommon.placeholder}" disabled>
                                    </div>
                                </div>
                                <div class="form-inline-wrap layui-col-xs4">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductBonusScheme005.confirmDate}">确认日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="confirmDate" name="confirmDate" class="layui-input form-input input-dateSelect"
                                               placeholder="请选择时间" data-th-value="${#dates.format(entity?.confirmDate,'yyyy-MM-dd')}" required="required"
                                               data-th-placeholder="#{SysCommon.placeholder}" >
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap layui-col-xs4">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductBonusScheme005.netValueDate}">净值日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="vluRefDate" name="vluRefDate" class="layui-input form-input input-dateSelect"
                                               data-th-value="${#dates.format(entity?.vluRefDate,'yyyy-MM-dd')}" required="required">
                                    </div>
                                </div>
                                <div class=" form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductBonusScheme005.netValue}">净值</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" class="layui-input form-input" required="required"
                                               id="tdyUnitValue" name="tdyUnitValue" data-th-value="${entity?.tdyUnitValue}" disabled/>
                                    </div>
                                </div>
                                <div class=" form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductBonusScheme005.bonusShareAmt}">交易金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" data-fixtype="2" unit="1"
                                               class="layui-input form-input text-money" required="required"
                                               id="bonusShareAmt" name="bonusShareAmt" data-th-value="${entity?.bonusShareAmt}"
                                               placeholder="请输入数字" data-th-placeholder="#{SysCommon.placeholder}" data-moneymemory = ""/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class=" form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductBonusScheme005.bonusShareNum}">交易份额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" class="layui-input form-input text-number" 
                                            id="bonusShareNum" data-fixtype="2" unit="1"
                                               name="bonusShareNum" data-th-value="${entity?.bonusShareNum}" required/>
                                        <span class="input-right-show">份</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class=" form-inline-wrap" style="width:100%">
                                    <label class="layui-form-label form-label-wrap" style="width:12%"
                                           data-th-text="#{FinNetProductBonusScheme001.remark}">备注</label>
                                    <div class="layui-input-inline input-inline" style="width:87%">
                                        <textarea id="bonusDealRemark" name="bonusDealRemark" placeholder="请输入内容"
                                              class="layui-textarea" data-th-placeholder="#{SysCommon.placeholder}"
                                              data-th-text ="${entity?.bonusDealRemark}">
                                        </textarea>
                                    </div>
                                </div>
                            </div>
                            <div id="cycleModel" class="pro-module-wrap">
			                    <div class="pro-module">
			                        <h3 class="pro-module-title">
			                        	<span class="title-des">期次信息</span>
			                        	<i class="iconfont icon-arrow-down pro-down-icon"></i>
			                       </h3>
			                 	</div>
				                 <div>
				                    <table class="layui-table" id="cycleDataTable"></table>
				                 </div>
			                 </div>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md11" style="margin: 50px;">
                    <div class="text-center">
                        <a id="FinNetProductBonusScheme005_btn_save"
                           class="layui-btn layui-btn-sm btn-save"
                           data-th-text="#{SysCommon.save}">保存</a>
                        <a id="FinNetProductBonusScheme005_btn_submit"
                           class="layui-btn layui-btn-sm btn-submit"
                           data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="FinNetProductBonusScheme005_btn_revoke"
                           class="layui-btn layui-btn-sm btn-revoke" data-ignore=true
                           data-th-text="#{SysCommon.revoke}">撤销</a>
                        <a id="FinNetProductBonusScheme005_btn_cancel"
                           class="layui-btn layui-btn-sm btn-cancel"
                           data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var iPlatformDate = /*[[${iPlatformDate}]]*/'';
        var iPlatformDatee = /*[[${iPlatformDatee}]]*/'';
        var bonuScalcFlagUnit = /*[[${bonuScalcFlag}]]*/'';
        var isFromToDoList = /*[[${isFromToDoList}]]*/'';
        var PROD_STYLE = /*[[${entity?.prodStyle}]]*/'';
        var IS_CYCLE = /*[[${entity?.isCycle}]]*/'N';
        var workflowId = /*[[${workflowId}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/product/productduration/netproductbonusscheme/FinNetProductBonusScheme005.js}"></script>
</div>
</body>
</html>
