<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinProductQuotation002}">产品报价管理-新建</title>
</head>
<body>
	<div layout:fragment="content">
		<div class="">
			 <div class="pro-module-wrapper pro-module-base" style="border-top: none;">
							<form class="layui-form joyin-form-wrap pro-module-form" id="FinProductQuotation002_form">
								<div class="pro-module-wrap">
									<input type="text" id="FinProductQuotation002_vdate" name="vdate" data-th-value='${entity?.vdate}' hidden>
									<input type="text" id="FinProductQuotation002_finprodMarketId" name="finprodMarketId" data-th-value='${entity?.finprodMarketId}' hidden>
									<input type="text" id="FinProductQuotation002_cashId" name="cashId" data-th-value='${entity?.cashId}' hidden>
									<input type="text" id="FinProductQuotation002_isLay" name="isLay" data-th-value='${entity?.isLay}' hidden>
									<div class="pro-module">
										<h3 class="pro-module-title" style="border-top: 1px solid #ccc;"><span class="title-des">报价信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
										<div class="pro-module-item">
											<div class="layui-form-item">
												<!-- <h3 class="pro-module-title"><span class="title-des">报价信息</span></h3><br/>  -->
												<div class="form-inline-wrap">
													<label class="layui-form-label form-label-wrap" data-th-text="#{FinProductQuotation002.finprodId}">产品代码</label>
													<div class="layui-input-inline input-inline">
														<select id="FinProductQuotation002_SELECT_finprodId" name="finprodId" class="layui-input form-input input-select"
															data-th-placeholder="#{SysCommon.placeholder}" formatoption=false
															data-th-data-url="@{/invest/product/messageadjust/finproductquotation/FinProductQuotation001/queryProdIdInfoIssueSuc}" required
															data-th-initvalue="${entity?.finprodId}">
														</select>
													</div>
												</div>
												<div class="form-inline-wrap">
													<label class="layui-form-label form-label-wrap" data-th-text="#{FinProductQuotation002.finprodAbbr}">产品简称</label>
													<div class="layui-input-inline input-inline">
														<input type="text" id="FinProductQuotation002_finprodAbbr" name="finprodAbbr" class="layui-input form-input" data-th-placeholder="#{SysCommon.placeholder}"
															   data-th-value="${entity?.finprodAbbr}" disabled/>
													</div>
												</div>
												<div class="form-inline-wrap">
													<label class="layui-form-label form-label-wrap" data-th-text="#{FinProductQuotation002.effDate}">生效日</label>
													<div class="layui-input-inline input-inline">
														<input type="text" id="FinProductQuotation002_effDate" name="effDate"
															   class="layui-input form-input input-dateSelect" required
															   data-th-value='${entity?.effDate eq null ? platDate : #dates.format(entity?.effDate,"yyyy-MM-dd")}'/>
													</div>
												</div>
											</div>
											<div class="layui-form-item">
												<!-- <div class="form-inline-wrap">
													<label class="layui-form-label form-label-wrap" data-th-text="#{FinProductQuotation002.releaseDate}">报价日</label>
													<div class="layui-input-inline input-inline">
														<input type="text" id="FinProductQuotation002_releaseDate" name="releaseDate"
															   class="layui-input form-input input-dateSelect" required
															   data-th-value='${entity?.releaseDate eq null ? platDate : #dates.format(entity?.releaseDate,"yyyy-MM-dd")}'/>
													</div>
												</div> -->
												<!-- <div class="form-inline-wrap" id="FinProductQuotation002_div_saleDepartment">
													<label class="layui-form-label form-label-wrap" data-th-text="#{FinProductQuotation002.saleDepartment}">销售部门</label>
													<div class="layui-input-inline input-inline">
														<select id="FinProductQuotation002_saleDepartment" name="saleDepartment"
																class="layui-input form-input input-select" data-th-data-result='${SALE_DEPT}'
																data-th-initvalue="${entity?.saleDepartment}" disabled>
														</select>
													</div>
												</div> -->
												<div class="form-inline-wrap" id="FinProductQuotation002_div_yield" style="display:none">
													<label class="layui-form-label form-label-wrap" data-th-text="#{FinProductQuotation002.yield}">收益率</label>
													<div class="layui-input-inline input-inline">
														<input type="text" id="yield" name="yield" class="layui-input form-input text-number" data-th-placeholder="#{SysCommon.placeholder}"
															   data-th-value='${entity?.yield}' data-textrange="4"
															   />
														<span class="input-right-show">%</span>
													</div>
												</div>
												<div style="display:none;" class="layui-input-inline input-inline">
													<input type="text" id="effDateOld" name="effDateOld"
													   class="layui-input form-input"
													   data-th-value="${effDateOld}"
													   disabled=true/>
												</div>
											</div>
										</div>
									</div>
								</div>
								<div class="pro-module-wrap" id="FinProductQuotation002_div_layering" hidden="true">
									<div class="pro-module">
										<h3 class="pro-module-title"><span class="title-des">分层设置</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
										<div class="pro-module-item">
											<table class="layui-table" id="dataTable" th:title="#{FinProductQuotation002.layInfo}" name="layTypeInfoList"></table>
										</div>
									</div>
								</div>
								<div class="pro-module-wrap">
									<div class="pro-module">
										<h3 class="pro-module-title"><span class="title-des">备注信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
										<div class="pro-module-item">
											<div class="layui-form-item">
												<label class="layui-form-label form-label-wrap" style="width: 11.9%;">备注</label>
												<div class="layui-input-inline input-inline" style="width: 85%!important;">
													<textarea name="remark" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" class="layui-textarea" data-th-text="${entity?.remark}"></textarea>
												</div>
											</div>
										</div>
									</div>
								</div>
							</form>
				<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:20px 0;">
                    <div class="text-center">
                        <a id="FinProductQuotation002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                        <a id="FinProductQuotation002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="FinProductQuotation002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
			</div>
			
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
    		var CLIENT_RANK = /*[[${CLIENT_RANK}]]*/'';
    		var YES_OR_NOY = /*[[${YES_OR_NOY}]]*/'';
    		var workflowId = /*[[${workflowId}]]*/'';
    		var layTypeInfoList = /*[[${entity?.layTypeInfoList}]]*/'';
        </script>
		<script data-th-src="@{/js/invest/product/messageadjust/finproductquotation/FinProductQuotation002.js}"></script>
	</div>
</body>
</html>
