<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinMdateAdjustment001}">到期日调整管理</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="form-button-area">
				<a id="FinMdateAdjustment001_btn_add"
					class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a>
			<a th:if="${isEleShow['FinMdateAdjustment001_btn_sendSale']} ne 'N'" id="FinMdateAdjustment001_btn_sendSale" class="layui-btn layui-btn-sm">
				<i class="iconfont icon-execute"></i>
				<span data-th-text="#{FinMdateAdjustment001.sendInterf}">发送</span>
			</a>
			</div>
			<div
				class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
				<form class="layui-form">
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinMdateAdjustment001.prodId}">产品代码</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="FinMdateAdjustment001_prodId"
									class="layui-input form-input input-select" allowClear="true"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									formatoption=false multiple="true"
									data-th-data-url="@{/invest/product/messageadjust/finmdateadjustment/FinMdateAdjustment002/queryAdjustProdIdList?isCreate=N}">
								</select>
							</div>
						</div>
                        <div
                            class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                                data-th-text="#{FinMdateAdjustment001.table.adjustType}">调整类型</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="FinMdateAdjustment001_adjustType" name="adjusttype"
                                    class="layui-input form-input input-select" data-th-data-result='${MDATEADJUSTTYPE}'
                                    allowClear="true" placeholder="请输入内容"  data-th-placeholder="#{SysCommon.placeholder}">
                                </select>
                            </div>
                        </div>
					</div>
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinMdateAdjustment001.adjustAfterMdate}">调整后到期日</label>
							<div class="layui-input-inline input-inline">
								<input id="FinMdateAdjustment001_adjustAfterMdate" class="layui-input form-input input-dateRangeSelect"
									placeholder="请选择时间区间"
									data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
						<div th:if="${isEleShow['FinMdateAdjustment001_sendStatus']} ne 'N'"
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinMdateAdjustment001.sendStatus}">发送状态</label>
							<div class="layui-input-inline input-inline">
								<select name="sendStatus"
										id="sendStatus"
										class="layui-input form-input input-select"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-initValue='${entity?.sendStatus}'
										data-th-data-result="${SEND_STATUS}">
								</select>
							</div>
						</div>
	                </div>
					</div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script th:inline="javascript">
	           var isSendStatusTableShow = [[${isEleShow['send_status_table']}]];
	           var isSendStatusTableLinkShow = [[${isEleShow['send_status_table_link']}]];
	           var isSendRemarkTableShow = [[${isEleShow['send_remark_table']}]];
	           
	           var YES = /*[[${YES}]]*/'Y'; // 数据字典.是否_是
		</script>
		<script
			data-th-src="@{/js/invest/product/messageadjust/finmdateadjustment/FinMdateAdjustment001.js}"
			type="text/javascript"></script>
		<script data-th-inline="javascript" type="text/javascript">
		</script>
	</div>
</body>
</html>
