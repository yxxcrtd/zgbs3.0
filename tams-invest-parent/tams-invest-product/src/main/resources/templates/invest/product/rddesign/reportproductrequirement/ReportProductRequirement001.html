<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{ReportProductRequirement001}">产品需求上报</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
    <a id="ReportProductRequirement001_btn_report" class="layui-btn layui-btn-sm"
					data-th-text="#{ReportProductRequirement001.report}">初评</a>
    </div>

    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
            	<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{ReportProductRequirement001.dataStatus}">有效状态</label>
                    <div class="layui-input-inline input-inline">
                    <select type="text" id="dataStatus" name="dataStatus" 
									class="layui-input form-input input-select" allowClear="true"
									formatoption=false 
									data-th-data-result="${STATUS_VALID}">
					</select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{ReportProductRequirement001.requirementSource}">需求发起端</label>
                    <div class="layui-input-inline input-inline">
                    <select type="text" id="requirementSource" name="requirementSource" 
									class="layui-input form-input input-select" allowClear="true"
									formatoption=false 
									data-th-data-result="${REQUIREMENT_SOURCE}">
					</select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{ReportProductRequirement001.reportStatus}">是否上报</label>
                    <div class="layui-input-inline input-inline">
                    <select type="text" id="reportStatus" name="reportStatus" 
									class="layui-input form-input input-select" allowClear="true"
									formatoption=false 
									data-th-data-result="${REVIEW_RESULT}">
					</select>
                    </div>
                <!-- <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{ReportProductRequirement001.operatStatus}">操作状态</label>
                    <div class="layui-input-inline input-inline">
                    <select type="text" id="requirementSource" name="requirementSource" 
									class="layui-input form-input input-select" allowClear="true"
									formatoption=false 
									data-th-data-result="${STATUS}">
					</select>
                    </div>
                </div> -->
                
               </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">
		var dataStatus_effective_no = /*[[${dataStatus_effective_no}]]*/'';
	</script>
    <script data-th-src="@{/js/invest/product/rddesign/reportproductrequirement/ReportProductRequirement001.js}" type="text/javascript"></script>
</div>
</body>

</html>
