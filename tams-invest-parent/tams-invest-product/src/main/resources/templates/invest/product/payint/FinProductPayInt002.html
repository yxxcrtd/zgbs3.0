<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="#{FinProductPayInt002}">产品中间付息确认</title>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <input type="hidden" id="portfolioId" name="portfolioId" th:value="${entity?.portfolioId}" />
            <input type="hidden" id="finprodId" name="finprodId" th:value="${entity?.finprodId}" />
            <input type="hidden" id="prodRegistCode" name="prodRegistCode" th:value="${entity?.prodRegistCode}" />
            <input type="hidden" id="isLay" name="isLay" th:value="${entity?.isLay}" />
            <input type="hidden" id="layType" name="layType" th:value="${entity?.layType}" />
            <input type="hidden" id="bussId" name="bussId" th:value="${entity?.bussId}" />
            <input type="hidden" id="workflowId" name="workflowId" th:value="${workflowId?:entity?.workflowId}" />
            <!-- 一体化对应etliu start -->
            <input type="hidden" id="cashId" name="cashId" th:value="${entity?.cashId}" />
            <!-- 一体化对应etliu end -->

            <!-- 产品基本信息 -->
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="title-des" th:text="#{FinProductPayInt002.prodBaseInfo}">产品基本信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{FinProductPayInt002.prodId}">产品代码</label>
                                <div class="layui-input-inline input-inline">
                                    <input required disabled type="text" id="prodId" name="prodId"
                                           class="layui-input form-input" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${prodId?:entity?.prodId}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{FinProductPayInt002.prodAbbr}">产品简称</label>
                                <div class="layui-input-inline input-inline">
                                    <input required disabled type="text" id="prodAbbr" name="prodAbbr"
                                           class="layui-input form-input" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.prodAbbr}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{FinProductPayInt002.prodName}">产品名称</label>
                                <div class="layui-input-inline input-inline">
                                    <input required disabled type="text" id="prodName" name="prodName"
                                           class="layui-input form-input" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.prodName}">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{FinProductPayInt002.saleDepartment}">销售部门</label>
                                <div class="layui-input-inline input-inline">
                                    <select required disabled type="text" id="saleDepartment" name="saleDepartment"
                                            class="layui-input form-input input-select"
                                            placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                            th:data-result='${SALE_DEPT}' allowClear="true" formatoption="true"
                                            th:initValue="${entity?.saleDepartment}"></select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{FinProductPayInt002.profitType}">产品类型</label>
                                <div class="layui-input-inline input-inline">
                                    <select required disabled type="text" id="profitType" name="profitType"
                                            class="layui-input form-input input-select"
                                            placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                            th:data-result='${PROFIT_TYPE}' allowClear="true" formatoption="true"
                                            th:initValue="${entity?.profitType}"></select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{FinProductPayInt002.payIntRule}">付息方式</label>
                                <div class="layui-input-inline input-inline">
                                    <select required disabled type="text" id="payIntRule" name="payIntRule"
                                            class="layui-input form-input input-select"
                                            placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                            th:data-result='${INTPAY_PERIOD}' allowClear="true" formatoption="true"
                                            th:initValue="${entity?.payIntRule}"></select>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{FinProductPayInt002.ccy}">币种</label>
                                <div class="layui-input-inline input-inline">
                                    <select required disabled type="text" id="ccy" name="ccy" class="layui-input form-input input-select"
                                            placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                            th:data-result='${CCY}' allowClear="true" formatoption="true"
                                            th:initValue="${ccy?:entity?.ccy}"></select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{FinProductPayInt002.prodVdate}">产品起息日</label>
                                <div class="layui-input-inline input-inline">
                                    <input required disabled type="text" id="prodVdate" name="prodVdate"
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${#dates.format(entity?.prodVdate,'yyyy-MM-dd')}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{FinProductPayInt002.prodMdate}">产品到期日</label>
                                <div class="layui-input-inline input-inline">
                                    <input required disabled type="text" id="prodMdate" name="prodMdate"
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${#dates.format(entity?.prodMdate,'yyyy-MM-dd')}">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{FinProductPayInt002.prodPrinAmt}">产品本金</label>
                                <div class="layui-input-inline input-inline">
                                    <input required disabled type="text" id="prinAmt" name="prinAmt"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}" th:value="${prinAmt?:entity?.prinAmt}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{FinProductPayInt002.thisIntAccrDay}">本次计息天数</label>
                                <div class="layui-input-inline input-inline">
                                    <input required disabled type="text" id="thisIntAccrDay" name="thisIntAccrDay"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           data-fixtype="2" data-textrange="0"
                                           th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.thisIntAccrDay}">
                                    <span class="input-right-show">天</span>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{FinProductPayInt002.payintStartDate}">本次付息起始日</label>
                                <div class="layui-input-inline input-inline">
                                    <input required disabled type="text" id="payintStartDate" name="payintStartDate"
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${payintStartDate?:#dates.format(entity?.payintStartDate,'yyyy-MM-dd')}">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{FinProductPayInt002.payintEndDate}">本次付息结束日</label>
                                <div class="layui-input-inline input-inline">
                                    <input required disabled type="text" id="payintEndDate" name="payintEndDate"
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${payintEndDate?:#dates.format(entity?.payintEndDate,'yyyy-MM-dd')}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{FinProductPayInt002.theoryCusProfit}">应付客户收益</label>
                                <div class="layui-input-inline input-inline">
                                    <input required disabled type="text" id="theoryCusProfit" name="theoryCusProfit"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.theoryCusProfit}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{FinProductPayInt002.actCusProfit}">实付客户收益</label>
                                <div class="layui-input-inline input-inline">
                                    <input required disabled type="text" id="actCusProfit" name="actCusProfit"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.actCusProfit}">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{FinProductPayInt002.payDate}">支付日</label>
                                <div class="layui-input-inline input-inline">
                                    <input required type="text" id="payDate" name="payDate"
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${#dates.format(entity?.payDate,'yyyy-MM-dd')}">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 利息明细信息 -->
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="title-des" th:text="#{FinProductPayInt002.intDetailInfo}">利息明细信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <table class="layui-table" id="intDetailInfoTable" name="intDetailDataList"></table>
                    </div>
                </div>
            </div>
            <!-- 划款信息 -->
            <div class="page-component" th:data-path="@{/component/trade/BussTrdTransferOrder/init}" id="bussTrdTransferOrder_div"
                 th:data-params="|{entityName: 'bussTrdTransferOrder', pageFrom: 'submitForm', entity:'${entity_FinProductPayInt002}', bizCode:'${tradeId}'}|">
            </div>
            <!-- 交易备注 -->
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="title-des" th:text="#{FinProductPayInt002.tradeRemark}">交易备注</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="layui-form-item">
                                <label class="layui-form-label form-label-wrap" style="width: 7.5%;">　</label>
                                <div class="layui-input-inline input-inline" style="width: 85%!important;">
                                    <textarea name="tradeRemark" maxlength="200" th:text="${entity?.tradeRemark}"
                                              class="layui-textarea" placeholder="请输入内容"
                                              th:placeholder="#{SysCommon.placeholder}"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row text-center" style="margin-top:10px; margin-bottom:20px;">
                <a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save"
                   data-th-text="#{SysCommon.save}">保存</a>
                <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit"
                   data-th-text="#{SysCommon.submit}">提交</a>
                <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel"
                   data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'';
        var FINPROD_TYPE_TG_LCCP = /*[[${FINPROD_TYPE_TG_LCCP}]]*/'';
        var PS_ZJFX = /*[[${PS_ZJFX}]]*/'';
        var LAY_TYPE_JEFC = /*[[${LAY_TYPE_JEFC}]]*/'';
        var LAY_TYPE_QXFC = /*[[${LAY_TYPE_QXFC}]]*/'';
        var LAY_TYPE_KHFC = /*[[${LAY_TYPE_KHFC}]]*/'';
    </script>
    <script th:src="@{/js/invest/product/payint/FinProductPayInt002.js}" type="text/javascript"></script>
</div>
</body>
</html>
