<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinProductOpenPlanAdjust001}">开放计划查询</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				
				<!-- <a id="FinProductRateQuotation001_btn_add" class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a>
				<a id="FinProductRateQuotation001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
				data-th-text="#{SysCommon.delete}">删除</a> -->
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductOpenPlanAdjust001.finprodId}">产品代码</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="finprodId" name="finprodId" class="layui-input form-input input-select"
	                                allowClear="true" placeholder="请输入内容"
	                                data-th-placeholder="#{SysCommon.placeholder}" formatoption = "true" 
	                                data-th-data-url="@{/invest/product/messageadjust/finproductopenplanadjust/FinProductOpenPlanAdjust001/getFinprodId}" 
	                                multiple="true" required >
	                            </select>		
							</div>
						</div>
                        <div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                                data-th-text="#{FinProductOpenPlanAdjust001.scheduleType}">计划类型</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="scheduletype" name="scheduletype"
                                    class="layui-input form-input input-select" data-th-data-result='${RANSOM_ISSUE_MODE}'
                                    allowClear="true" placeholder="请输入内容"  data-th-placeholder="#{SysCommon.placeholder}"
                                    >
                                </select>
                            </div>
                        </div>
						<!-- <div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductRateQuotation001.effDate}">生效日</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="FinProductRateQuotation001_effDate" name="effDate"
									class="layui-input form-input input-dateRangeSelect"
									placeholder="请选择、支持区间"
									data-th-placeholder="#{SysCommon.dateInterval}" />
							</div>
						</div> -->
					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{FinProductOpenPlanAdjust001.openDateStr}">开放起始日</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="openDateStr" name="openDateStr"
									   class="layui-input form-input input-dateRangeSelect"
									   placeholder="请选择、支持区间"
									   data-th-placeholder="#{SysCommon.dateInterval}" />
							</div>
						</div>
					</div>
				</form>
			</div>

			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
	    <script th:inline="javascript" type="text/javascript">
		    var OPEN_TYPE = '';
			var RANSOM_ISSUE_MODE_03=/*[[${RANSOM_ISSUE_MODE_03}]]*/'03';//申赎
	    </script>
		<script
			data-th-src="@{/js/invest/product/messageadjust/finproductopenplanadjust/FinProductOpenPlanAdjust001.js}"></script>
	</div>
</body>
</html>
