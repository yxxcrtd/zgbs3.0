<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinSupplementPlanChg001}">回补计划调整</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;" filter="false" export="false">
				<a
					id="FinSupplementPlanChg001_btn_join"
					class="layui-btn layui-btn-sm btn-submit"
					>区间合并</a>
					<a
					id="FinSupplementPlanChg001_btn_split"
					class="layui-btn layui-btn-sm btn-submit"
					>区间拆分</a>
				<a id="FinSupplementPlanChg001_btn_submit"
					class="layui-btn layui-btn-sm btn-submit"
					data-th-text="#{SysCommon.submit}">提交</a> 
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
						<input type="hidden" id="finprodId" name="finprodId" 
								data-th-value="${entity?.finprodId}"/>
						<input type="hidden" id="cashId" name="cashId" />
						<input type="hidden" id="finprodAbbr" name="finprodAbbr" />
						<input type="hidden" id="workflowId" name="workflowId" 
								data-th-value="${entity?.workflowId}" />
						<input type="hidden" id="prodStyle" name="prodStyle" 
								data-th-value="${entity?.prodStyle}" />
						<input type="hidden" id="isLay" name="isLay" 
								data-th-value="${entity?.isLay}" />
					<div class="layui-form-item">
						<div 
							class="layui-inline layui-col-xs4 layui-col-md5 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinSupplementPlanChg001.finprodAbbr}">产品简称</label>
							<div class="layui-input-inline input-inline">
								<select id="finprodMarketId" name="finprodMarketId"
                                    required
									class="layui-input form-input input-select"
									data-th-childrenIds="layFinprodId"
									data-th-placeholder="#{SysCommon.placeholder}" data-th-initValue="${entity?.finprodMarketId}"
									data-th-data-url="@{/invest/product/messageadjust/supplement/FinSupplementPlanChg001/getFinprodId}"
									>
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md5  layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        	<label class="layui-form-label form-lable" data-th-text="#{FinSupplementPlanChg001.prodStyle}">产品款型</label>
	                        <div class="layui-input-inline input-inline">
	                            <select type="text" id="layFinprodId" name="layFinprodId"
	                                class="layui-input form-input input-select" placeholder="请输入内容"
	                                data-th-placeholder="#{SysCommon.placeholder}"
	                                data-th-parentIds="finprodMarketId"
	                                data-th-data-url="@{/invest/product/messageadjust/supplement/FinSupplementPlanChg001/queryProdStyleInfo}"
	                                multiple="true" >
	                             </select>
	                        </div>
                    	</div>
					</div>
				</form>
			</div>

			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script
			data-th-src="@{/js/invest/product/messageadjust/supplement/FinSupplementPlanChg001.js}"></script>
		<script th:inline="javascript" type="text/javascript">
			//var DISPOSE_PATTERN_05 = /*[[${DISPOSE_PATTERN_05}]]*/'';
			var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/;
			var SUPPLEMENT_STATUS_02 = /*[[${SUPPLEMENT_STATUS_02}]]*/;
        </script> 
	</div>
</body>
</html>
