<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{FinNetProductBonusScheme002}">净值型分红方案新建</title>
    <style>
.space {
    padding-bottom: 8px;
}
.val-radio-wrap .layui-form-radio{
	margin:0;
	line-height:normal;
}
.val-radio-wrap .layui-form-radio i{
    font-size: 20px;
    color:#4893e6
}
</style>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">产品要素</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                            	<input type="text" id="portfolioId" name="portfolioId" class="layui-input form-input" data-th-value="${entity?.portfolioId}" style = "display: none">
                                <input type="text" id="finprodId" name="finprodId" class="layui-input form-input" data-th-value="${entity?.finprodId}" style = "display: none">
                                <input type="text" id="unitvalueDec" name="unitvalueDec" class="layui-input form-input" data-th-value="${entity?.unitvalueDec}"  style = "display: none">
                                <input type="text" id="purSpeed" name="purSpeed" class="layui-input form-input"  style = "display: none">
                                <input type="text" id="tdyAssetAmt" name="tdyAssetAmt" class="layui-input form-input"  style = "display: none">
                                <input type="text" name="dealType" value="bonusScheRegister" class="layui-input form-input"  style = "display: none">
                                <input type="text" id="dealMode" name="dealMode" class="layui-input form-input" data-th-value="${entity?.dealMode}" style = "display: none">
                               <!--  add by yujiaping 2020-11-20 TISHKBS-809净值型产品分红方案管理，封闭式产品的除权日、权益登记日校验start -->
                                <input type="text" id="operationType" name="operationType" class="layui-input form-input"  style = "display: none">
                                <!-- add by yujiaping 2020-11-20 TISHKBS-809净值型产品分红方案管理，封闭式产品的除权日、权益登记日校验end -->
                                <div class=" form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductBonusScheme002.finprodMarketId}">产品代码</label>
                                    <div class="layui-input-inline input-inline">
                                            <select type="text" id="finprodMarketId" name="finprodMarketId"
                                                    class="layui-input form-input input-select"
                                                    data-th-data-url="@{/invest/product/productduration/netproductbonusscheme/FinNetProductBonusScheme001/getFinprodMarketIdList}"
                                                    required="required" allowClear="true" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}" searchable="true"
                                                    data-th-initValue='${entity?.finprodMarketId}'>
                                            </select>                                            
                                    </div>
                                </div>
                                <div class=" form-inline-wrap" >
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductBonusScheme002.prodStyle}">产品款型</label>                                    
                                    <div class="layui-input-inline input-inline">
                                        <select name="prodStyle" id="prodStyle"
                                            class="layui-input form-input input-select"
                                            data-th-initValue='${entity?.prodStyle}' required 
                                              disabled>
                                        </select>
                                    </div>
                                </div>
                                <div class=" form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductBonusScheme002.ccy}">币种</label>                                    
                                    <div class="layui-input-inline input-inline">
                                        <select name="ccy" id="finccy"
                                            class="layui-input form-input input-select"
                                            data-th-initValue='${entity?.ccy}'
                                            data-th-data-result="${CCY}" required disabled>
                                        </select>
                                    </div>
                                    
                                </div>
                                <!--  
                                <div class=" form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductBonusScheme002.finprodAbbr}">产品简称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" class="layui-input form-input" id="finprodAbbr" required="required"
                                               name="finprodAbbr" data-th-value="${entity?.finprodAbbr}" disabled/>
                                    </div>
                                </div>
                                <div class=" form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductBonusScheme002.finprodName}">产品名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" class="layui-input form-input" id="finprodName" required="required"
                                               name="finprodName" data-th-value="${entity?.finprodName}" disabled/>
                                    </div>
                                </div>
                                -->
                            </div>
                        </div>
                    </div>
                </div>
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">分红方案</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item space">
                                <div class=" form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductBonusScheme002.bonuScalcFlag}">分红规则</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="bonuScalcFlag" name="bonuScalcFlag"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${BONU_SCALC_FLAG}' formatoption="true"
                                                required="required" allowClear="true" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue='${entity?.bonuScalcFlag}'>
                                        </select>
                                    </div>
                                </div>
                                <div class=" form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductBonusScheme002.bonusPlanId}">分红方案编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" class="layui-input form-input" id="bonusPlanId"
                                               name="bonusPlanId" data-th-value="${entity?.bonusPlanId}" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap layui-col-xs4">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductBonusScheme002.baseDate}">收益分配基准日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="baseDate" name="baseDate" class="layui-input form-input input-dateSelect"
                                               placeholder="请选择时间" data-th-value="${#dates.format(entity?.baseDate,'yyyy-MM-dd')}" required="required"
                                               data-th-placeholder="#{SysCommon.placeholder}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class=" form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" style="line-height: inherit!important;"
                                           data-th-utext="#{FinNetProductBonusScheme002.tdyUnpaidIntincexp}">基准日未分<br>配利润余额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tdyUnpaidIntincexp" name="tdyUnpaidIntincexp" disabled
                                               class="layui-input form-input" data-th-value="${entity?.tdyUnpaidIntincexp}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap layui-col-xs4">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductBonusScheme002.delDate}">除权日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="delDate" name="delDate" class="layui-input form-input input-dateSelect"
                                               placeholder="请选择时间" data-th-value="${#dates.format(entity?.delDate,'yyyy-MM-dd')}" required="required"
                                               data-th-placeholder="#{SysCommon.placeholder}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap layui-col-xs4">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductBonusScheme002.regDate}">权益登记日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="regDate" name="regDate" class="layui-input form-input input-dateSelect"
                                               placeholder="请选择时间" data-th-value="${#dates.format(entity?.regDate,'yyyy-MM-dd')}" required="required"
                                               data-th-placeholder="#{SysCommon.placeholder}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item space">
                                <div class=" form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductBonusScheme002.netValueNormalize}">净值归一</label>
                                    	<div class="layui-input-inline input-inline val-radio-wrap">                                    		
                                            <select type="text" id="isNetMormalize" name="isNetMormalize"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${YES_OR_NO}' formatoption="true"
                                                required="required" allowClear="true" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue='${entity?.isNetMormalize}'>
                                        	</select>
										</div>
                                </div>
                                <div class="form-inline-wrap layui-col-xs4">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductBonusScheme002.vluRefDate}">净值参考日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="vluRefDate" name="vluRefDate" class="layui-input form-input input-dateSelect"
                                               data-th-value="${#dates.format(entity?.vluRefDate,'yyyy-MM-dd')}" required="required" disabled>
                                    </div>
                                </div>
                                <div class=" form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductBonusScheme002.tdyUnitValue}">参考日净值</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" data-fixtype="2" unit="1" data-th-data-textrange="${entity?.unitvalueDec} == null ? 4 : ${entity?.unitvalueDec}"
                                               class="layui-input form-input text-number" required="required"
                                               id="tdyUnitValue" name="tdyUnitValue" disabled data-th-value="${entity?.tdyUnitValue}"/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class=" form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductBonusScheme002.tdyShareAmt}">参考日份额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" data-fixtype="2" unit="1"
                                               id="tdyShareAmt" name="tdyShareAmt" disabled
                                               class="layui-input form-input text-number" data-th-value="${entity?.tdyShareAmt}">
                                        <span class="input-right-show">份</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap layui-col-xs4">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductBonusScheme002.bonusDate}">红利下发日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="bonusDate" name="bonusDate" class="layui-input form-input input-dateSelect"
                                               placeholder="请选择时间" data-th-value="${#dates.format(entity?.bonusDate,'yyyy-MM-dd')}" required="required"
                                               data-th-placeholder="#{SysCommon.placeholder}">
                                    </div>
                                </div>
                                <div class=" form-inline-wrap unitBonusVlu">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductBonusScheme002.unitBonusVlu}">单位分红金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" data-fixtype="2" unit="1" data-textrange="4"
                                               class="layui-input form-input text-money" required="required"
                                               id="unitBonusVlu" name="unitBonusVlu" data-th-value="${entity?.unitBonusVlu}"
                                               placeholder="请输入数字" data-th-placeholder="#{SysCommon.placeholder}" data-moneymemory = ""/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class=" form-inline-wrap totalAmt">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductBonusScheme002.totalAmt}">分红总金额</label>
                                    <div class="layui-input-inline input-inline ">
                                        <input type="text" data-fixtype="2"unit="1"
                                               class="layui-input form-input text-money" required="required"
                                               id="totalAmt" name="totalAmt" data-th-value="${entity?.totalAmt}"
                                               placeholder="请输入数字" data-th-placeholder="#{SysCommon.placeholder}"
                                               data-moneymemory = "">
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class=" form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinNetProductBonusScheme002.netvalue}">分红后单位净值</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="netvalue" name="netvalue" data-th-value="${entity?.netvalue}"
                                               data-th-data-textrange="${entity?.unitvalueDec} == null ? 4 : ${entity?.unitvalueDec}"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item space">
                                <div class=" form-inline-wrap" style="width:100%">
                                    <label class="layui-form-label form-label-wrap" style="width:12%"
                                           data-th-text="#{FinNetProductBonusScheme001.remark}">备注</label>
                                    <div class="layui-input-inline input-inline" style="width:87%">                                        
                                        <textarea id="remark" name="remark" placeholder="请输入内容"
                                                  class="layui-textarea" data-th-placeholder="#{SysCommon.placeholder}"
                                                  data-th-text ="${entity?.remark}">
                                        </textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md11" style="margin: 50px;">
                    <div class="text-center">
                        <a id="FinNetProductBonusScheme002_btn_save"
                           class="layui-btn layui-btn-sm btn-save"
                           data-th-text="#{SysCommon.save}">保存</a>
                        <a id="FinNetProductBonusScheme002_btn_submit"
                           class="layui-btn layui-btn-sm btn-submit"
                           data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="FinNetProductBonusScheme002_btn_cancel"
                           class="layui-btn layui-btn-sm btn-cancel"
                           data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    
    <script data-th-inline="javascript" type="text/javascript">
        var iPlatformDate = /*[[${iPlatformDate}]]*/'';
        var iPlatformDatee = /*[[${iPlatformDatee}]]*/'';
        var bonuScalcFlagUnit = /*[[${bonuScalcFlag}]]*/'';
        var getAbbrAndName = /*[[@{/invest/product/productduration/netproductbonusscheme/FinNetProductBonusScheme002/getAbbrAndName}]]*/'';
        var getTdyUnpaidIntincexp = /*[[@{/invest/product/productduration/netproductbonusscheme/FinNetProductBonusScheme002/getTdyUnpaidIntincexp}]]*/'';
        var getVluRefDate = /*[[@{/invest/product/productduration/netproductbonusscheme/FinNetProductBonusScheme002/getVluRefDate}]]*/'';
        var getTdyUnitValueAndTdyShareAmt = /*[[@{/invest/product/productduration/netproductbonusscheme/FinNetProductBonusScheme002/getTdyUnitValueAndTdyShareAmt}]]*/'';
        var getTdyAssetAmt = /*[[@{/invest/product/productduration/netproductbonusscheme/FinNetProductBonusScheme002/getTdyAssetAmt}]]*/'';
        var PROD_STYLE = /*[[${entity?.prodStyle}]]*/'';
        //BSTOZ-1270 净值分红方案管理--分红方案登记，需求要求红利下发日默认为平台日 guyunfei start
        //标识第一次打开页面
        var inintNumber = -1;
        //BSTOZ-1270 净值分红方案管理--分红方案登记，需求要求红利下发日默认为平台日 guyunfei start
    </script>
    <script data-th-src="@{/js/invest/product/productduration/netproductbonusscheme/FinNetProductBonusScheme002.js}"></script>
</div>
</body>
</html>
