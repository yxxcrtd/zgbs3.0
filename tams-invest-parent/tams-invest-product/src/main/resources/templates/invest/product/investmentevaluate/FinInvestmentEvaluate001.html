<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinInvestmentEvaluate001}">投资评价管理</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;" export="false">
				<!--需求没有，暂时隐藏-->
				<!--<a id="Productelementdes001_btn_report" class="layui-btn layui-btn-sm"
					   data-th-text="#{FinInvestmentEvaluate001.report}" >生成评价报告</a>-->
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{FinInvestmentEvaluate001.vdate}">起始日</label>
							<div class="layui-input-inline input-inline">
								<input class="layui-input form-input input-dateSelect"
									   id="startDate" name="startDate" required
									   placeholder="请选择时间">
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" data-th-text="#{FinInvestmentEvaluate001.mdate}">评价日</label>
							<div class="layui-input-inline input-inline">
								<input class="layui-input form-input input-dateSelect"
									   id="endDate" name="endDate" required
									   placeholder="请选择时间">
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{FinInvestmentEvaluate001.portfolioName}">组合名称</label>
							<div class="layui-input-inline input-inline">
								<select id="portfolioId" name="portfolioId"
										class="layui-input form-input input-select"
										parentIds="startDate,endDate"
										data-th-data-url="@{/invest/product/investmentevaluate/FinInvestmentEvaluate001/findPort}"
										required
										data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" data-th-text="#{FinInvestmentEvaluate001.strategyId}">策略代码</label>
							<div class="layui-input-inline input-inline">
								<select id="strategyId" name="strategyId"
										class="layui-input form-input input-select"
										data-th-data-url="@{/invest/product/investmentevaluate/FinInvestmentEvaluate001/findStrategyId}"
                                        data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
					</div>
					</form>

			</div>
		<div class="layui-tab"style="overflow:scroll;height:500px">
			<div class="pro-module-wrapper pro-module-base">
			<div class="pro-module-wrap" style="overflow:scroll;">
				<div class="pro-module">
					<h3 class="pro-module-title">
						<span class="title-des">组合信息</span><i
							class="iconfont icon-arrow-down pro-down-icon"></i>
					</h3>
					<div class="pro-module-item">
					<table class="layui-table" id="dataTable1"></table>
					</div>
				</div>
			</div>
			</div>
			<div class="pro-module-wrapper pro-module-base">
			<div class="pro-module-wrap"style="overflow:scroll;">
				<div class="pro-module">
					<h3 class="pro-module-title">
						<span class="title-des">评价日资产配置情况</span><i
							class="iconfont icon-arrow-down pro-down-icon"></i>
					</h3>
					<div class="pro-module-item">
					<table class="layui-table" id="dataTable2"></table>
					</div>
				</div>
			</div>
			</div>
			<div class="pro-module-wrapper pro-module-base">
			<div class="pro-module-wrap"style="overflow:scroll;">
				<div class="pro-module ">
					<h3 class="pro-module-title">
						<span class="title-des">净值表现</span><i
							class="iconfont icon-arrow-down pro-down-icon"></i>
					</h3>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md6 layui-col-xs6 layui-col-sm6 layui-col-lg6"
							 id="eChart3" style="height: 300px;">
                        </div>
						<div class="layui-inline layui-col-md6 layui-col-xs6 layui-col-sm6 layui-col-lg6">
                        <table class="layui-table" id="dataTable3"></table>
						</div>
					</div>
				</div>
			</div>
			</div>
			<div class="pro-module-wrapper pro-module-base">
				<div class="pro-module-wrap"style="overflow:scroll;">
					<div class="pro-module">
						<h3 class="pro-module-title">
							<span class="title-des">收益指标</span><i
								class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="layui-form-item">
							<div class="layui-inline layui-col-md6 layui-col-xs6 layui-col-sm6 layui-col-lg6"
								 id="eChart4" style=" height:300px;">
							</div>
						    <div class="layui-inline layui-col-md6 layui-col-xs6 layui-col-sm6 layui-col-lg6">
						    <table class="layui-table" id="dataTable4"></table>
						    </div>
						</div>
					</div>
				</div>
			</div>
			<div class="pro-module-wrapper pro-module-base">
			<div class="pro-module-wrap"style="overflow:scroll;">
				<div class="pro-module">
					<h3 class="pro-module-title">
						<span class="title-des">风险指标</span><i
							class="iconfont icon-arrow-down pro-down-icon"></i>
					</h3>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md6 layui-col-xs6 layui-col-sm6 layui-col-lg6"
							 id="eChart5" style="height: 300px;">
						</div>
					<div class="layui-inline layui-col-md6 layui-col-xs6 layui-col-sm6 layui-col-lg6">
					<table class="layui-table" id="dataTable5"></table>
					</div>
					</div>
				</div>
			</div>
		    </div>
			<div class="pro-module-wrapper pro-module-base">
				<div class="pro-module-wrap"style="overflow:scroll;">
					<div class="pro-module">
						<h3 class="pro-module-title">
							<span class="title-des">风险调整收益指标</span><i
								class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="layui-form-item">
							<div class="layui-inline layui-col-md6 layui-col-xs6 layui-col-sm6 layui-col-lg6"
								 id="eChart6" style="height: 300px;">
							</div>
						<div class="layui-inline layui-col-md6 layui-col-xs6 layui-col-sm6 layui-col-lg6">
						<table class="layui-table" id="dataTable6"></table>
						</div>
						</div>
					</div>
				</div>
			</div>
			<div class="pro-module-wrapper pro-module-base">
				<div class="pro-module-wrap"style="overflow:scroll;">
					<div class="pro-module">
						<h3 class="pro-module-title">
							<span class="title-des">策略执行有效性</span><i
								class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="pro-module-item">
						<table class="layui-table" id="dataTable7"></table>
						</div>
					</div>
				</div>
			</div>
			<div class="pro-module-wrapper pro-module-base">
				<div class="pro-module-wrap"style="overflow:scroll;">
					<div class="pro-module">
						<h3 class="pro-module-title">
							<span class="title-des">策略执收益来源</span><i
								class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="pro-module-item">
						<table class="layui-table" id="dataTable8"></table>
						</div>
					</div>
				</div>
			</div>
		</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script th:inline="javascript">
			var vdate,
			mdate;
			var sysDate = /*[[${sysdate}]]*/'';
			$('#startDate').change(function () {
				vdate = $('#startDate').val();
				mdate = $('#endDate').val();
				if(vdate >= sysDate){
					Joyin.error("起始日需小于平台日！");
					$('#startDate').val('');
				}
				if(mdate && vdate > mdate){
					Joyin.error("起始日需小于等于评价日！");
					$('#startDate').val('');
				}
			});
			$('#endDate').change(function () {
				mdate = $('#endDate').val();
				if(vdate > mdate){
					Joyin.error("起始日需小于等于评价日！");
					$('#startDate').val('');
				}
				if(mdate >= sysDate){
					Joyin.error("评价日需小于平台时间！");
					$('#endDate').val('');
				}
			});
		</script>
		<script
			data-th-src="@{/js/invest/product/investmentevaluate/FinInvestmentEvaluate001.js}"></script>
	</div>
</body>
</html>
