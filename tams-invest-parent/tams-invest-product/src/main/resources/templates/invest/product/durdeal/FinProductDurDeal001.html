<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{FinProductDurDeal001}">产品存续期交易查询</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="form-button-area">
            <!-- <a id="FinProductDurDeal001_btn_synchro" class="layui-btn layui-btn-sm btn-common" data-th-text="#{FinProductDurDeal001.synchro}">同步</a> -->
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm"> 
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{FinProductDurDeal001.portfolioId}">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="portfolioId" name="portfolioId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId}"
                                multiple="true" >
                             </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{FinProductDurDeal001.prodId}">产品代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="prodId" name="prodId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/product/durdeal/FinProductDurDeal001/queryProdIdInfo}"
                                multiple="true" >
                             </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{FinProductDurDeal001.cashDate}">现金流日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="cashDate" name="cashDate"
                                class="layui-input form-input input-dateRangeSelect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" >
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                	<div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                		<label class="layui-form-label form-lable" data-th-text="#{FinProductDurDeal001.dealMode}">处理模式</label>
                		<div class="layui-input-inline input-inline">
                			<select id="dealMode" name="dealMode"
									class="layui-input form-input input-select" placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result="${DISPOSE_PATTERN}">
							</select>
                		</div>
                	</div>
                	<div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                		<lable class="layui-form-label form-lable" data-th-text="#{FinProductDurDeal001.confirmDate}">确认日</lable>
                		<div class="layui-input-inline input-inline">
                            <input type="text" id="confirmDate" name="confirmDate"
                                class="layui-input form-input input-dateRangeSelect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" >
                        </div>
                	</div>
                	 <div class=" form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FinProductDurDeal001.dealType}">交易类型</label>                                    
                                    <div class="layui-input-inline input-inline">
                                        <select name="dealType" id="dealType"
                                            class="layui-input form-input input-select"
                                            placeholder="请输入内容"
                                            data-th-initValue='${entity?.dealType}'
                                            data-th-data-result="${PS}">
                                        </select>
                                    </div>
                                </div>
                </div>
                <div class="layui-form-item">
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductDurDeal001.effectStatus}">有效状态</label>
							<div class="layui-input-inline input-inline">
								<select id="effectStatus"
									class="layui-input form-input input-select"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result="${STATUS_VALID}">
								</select>
							</div>
						</div>
                    <div
                            class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{FinProductFeePay001.ccy}">币种</label>
                        <div class="layui-input-inline input-inline">
                            <select id="ccy" name="ccy"
                                    class="layui-input form-input input-select"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result="${CCY}">
                            </select>
                        </div>
                    </div>
                    <!--  add by wangyang1  增加 产品经理  2019年9月29日 start -->
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4" id="div_prodManager">
                        <label class="layui-form-label form-lable">产品经理</label>
                        <div class="layui-input-inline input-inline">
                          <!--   <input type="text" name="prodManager"
                                id="prodManager"
                                class="layui-input form-input input-lenovoselect" maxlength=60
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/product/common/getUserName}"> -->
                                <select type="text" name="prodManager" id="prodManager"
                                    class="layui-input form-input input-select" maxlength=60
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-url="@{/invest/product/common/getUserName}">
                                </select>  
                        </div>
                    </div>
                    <!--  add by wangyang1  增加 产品经理 end -->
				</div>
            </form>
        </div>
        <!--  
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
        -->
        <div class="layui-tab">
		  <ul class="layui-tab-title">
		    <li class="layui-this">交易明细</li>
		    <li>交易汇总</li>
		  </ul>
		  <div class="layui-tab-content">		    
		    <div class="layui-tab-item  layui-show" id="detailDataTableDiv">
		    	<table class="layui-table" id="detailDataTable"></table>
		    </div>
		    <div class="layui-tab-item" id="dataTableDiv">
		    	<table class="layui-table" id="dataTable"></table>
		    </div>
		  </div>
		</div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/product/durdeal/FinProductDurDeal001.js}" type="text/javascript"></script>
    </div>

</body>

</html>
