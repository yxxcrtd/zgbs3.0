<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinProductFeePay004}">产品费用支付确认</title>
</head>
<body>
<div class="pro-module-wrap">
	<div layout:fragment="content">
		<div>
			<div class="pro-module-wrapper pro-module-base" style="border-top: none;">
				<form class="layui-form joyin-form-wrap pro-module-form" id="FinProductFeePay004_Form">
					<input type="text" name="feeType" id="FinProductFeePay004_hidden_feeType" th:value="${entity?.feeType}" hidden>
					<input type="text" name="feeName" id="FinProductFeePay004_hidden_feeName" th:value="${entity?.feeName}" hidden>
					<input type="text" name="confirmFlag" id="FinProductFeePay004_hidden_operateType" th:value="${entity?.confirmFlag}" hidden>
					<input type="text" id="FinProductFeePay004_hidden_tradeAmtSum" th:value="${entity?.actPayAmtSum != null? entity?.actPayAmtSum : '0'}" hidden>
					<input type="text" name="profitType" id="FinProductFeePay004_hidden_profitType" th:value="${entity?.profitType}" hidden>
					<input type="text" name="dealMode" id="FinProductFeePay004_hidden_dealMode" th:value="${entity?.dealMode}" hidden>
					<input type="text" name="ps" id="FinProductFeePay004_hidden_ps" th:value="${entity?.ps}" hidden>
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title" style="border-top: 1px solid #cccccc;">
							<span class="title-des">费用信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductFeePay004.feeName}">费用名称</label>
										<div class="layui-input-inline input-inline">
											<select type="text" name="feeId" id="FinProductFeePay004_feeId"
												class="layui-input form-input input-select"
												placeholder="请输入内容" allowClear="true" formatoption=true required
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue='${entity?.feeId}'
												data-th-data-url="@{/invest/product/feepay/FinProductFeePay004/queryFeeInfoList}">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap" id="FinProductFeePay004_DIV_ccy">
	                                	<label class="layui-form-label form-label-wrap"
	                                	data-th-text="#{FinProductFeePay004.ccy}">币种</label>
		                                <div class="layui-input-inline input-inline">
		                                    <select id="FinProductFeePay004_ccy" name="ccy"  
		                                    	class="layui-input form-input input-select"   
		                                    	data-th-placeholder="#{SysCommon.placeholder}" placeholder="请输入内容"
	                                    		formatoption="true" 
	                                    		type="text"
	                                    		disabled
	                                            data-th-data-result='${CCY}' allowClear="true"
	                                            data-th-initValue="${entity?.ccy}">
		                                    </select>
		                                </div>
	                            	</div>
	                            	<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductFeePay004.payDate}">支付日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="payDate" id="FinProductFeePay004_payDate"
												class="layui-input form-input input-dateSelect" required
												data-th-value='${entity?.payDate eq null ? platDate : #dates.format(entity?.payDate,"yyyy-MM-dd")}'>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap" id='FinProductFeePay004_div_payAmtSum'>
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductFeePay004.payAmtSum}">理论金额合计</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="payAmtSum" id="FinProductFeePay004_payAmtSum"
												class="layui-input form-input text-number"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-value='${entity?.payAmtSum}' disabled>
										</div>
									</div>
									<div class="form-inline-wrap" id='FinProductFeePay004_div_actPayAmtSum'>
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductFeePay004.actPayAmtSum}">实付金额合计</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="actPayAmtSum" id="FinProductFeePay004_actPayAmtSum"
												class="layui-input form-input text-number"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-value='${entity?.actPayAmtSum}'>
										</div>
									</div>
									<div class="form-inline-wrap" id='FinProductFeePay004_div_adjustAmtSum'>
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductFeePay004.adjustAmtSum}">调整金额合计</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="adjustAmtSum" id="FinProductFeePay004_adjustAmtSum"
												class="layui-input form-input text-number"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-value='${entity?.adjustAmtSum}' disabled>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap" id = "proAvailableCash_div">
	                                    <label class="layui-form-label form-label-wrap"
	                                    	data-th-text="#{FinProductFeePay002.proAvailableCash}">组合剩余现金</label>
	                                    <div class="layui-input-inline input-inline">
	                                        <input type="text" id="FinProductFeePay004_proAvailableCash" name="proAvailableCash"
	                                                placeholder="请输入内容" data-pattern="" data-fixtype="2"
	                                                class="layui-input form-input text-number" disabled="disabled"
	                                               data-th-value='${entity?.proAvailableCash}'/>
	                                                <span class="input-right-show">元</span>
	                                    </div>
                                	</div>
								</div>
							</div>
						</div>
					</div>
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">产品列表</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item" id="prod_div">
								</div>
								<table class="layui-table" id="prod_dataTable" name="finProductFeePay" th:title="#{FinProductFeePay004.field.prodTable}">
								</table>
							</div>
						</div>
					</div>
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">交易备注</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<label class="layui-form-label form-label-wrap" style="width: 11.9%;">备注</label>
									<div class="layui-input-inline input-inline" style="width: 85%!important;">
											<textarea name="remark" placeholder="请输入内容" maxlength="300"
													  data-th-placeholder="#{SysCommon.placeholder}"
													  class="layui-textarea" data-th-text="${entity?.remark}"></textarea>
									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="pro-module-wrap" data-th-if="${entity?.revokeReason}">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">撤销理由</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<label class="layui-form-label form-label-wrap" style="width: 11.9%;">备注</label>
									<div class="layui-input-inline input-inline" style="width: 85%!important;">
											<textarea id="revokeReason" name="revokeReason"  
													   placeholder="请输入内容"
													  class="layui-textarea" data-th-text="${entity?.revokeReason}"></textarea>
									</div>
								</div>
							</div>
						</div>
					</div>
					<!-- 划款指令 -->
					<div class="page-component" th:data-path="@{/component/trade/BussTrdTransferOrder/init}"
	                 	th:data-params="|{entityName: 'bussFinProductFeePay', pageFrom: 'submitForm', 
	                 	entity:'${entity_bussTrdTransferOrder}', bizCode:''}|">
	            	</div>
					<!-- 附件信息 -->
		            <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
		                th:data-params="|{entityName: 'fileArray', businessId: '1'}|"></div>
				</form>
				</div>
				<div class="row text-center stepbar">
					<div class="text-center">
						<a id="FinProductFeePay004_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
						<a id="FinProductFeePay004_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
						<a id="FinProductFeePay004_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var yesFlag = /*[[${yesFlag}]]*/;
		    var YES_NO = /*[[${YES_OR_NO}]]*/'';
			var ps = /*[[${ps}]]*/;
			var finprodType2 = /*[[${finprodType2}]]*/;
			var workflowId = /*[[${workflowId}]]*/;// 工作流代码
			var formTodoList = /*[[${formTodoList}]]*/;// 是否代办
			var dealMode11 = /*[[${DEAL_MODE_11}]]*/;// 产品处理模式 分档
			var profitType01 = /*[[${PROFIT_TYPE_01}]]*/;// 收益模式 净值
			var ptlId = /*[[${ptlId}]]*/;// 组合Id
        </script>
		<script
			data-th-src="@{/js/invest/product/feepay/FinProductFeePay004.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
