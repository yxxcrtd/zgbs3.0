<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinProductBuild002}">产品新建管理</title>
<style type="text/css">
.layui-form-radio {
	margin: 0;
	padding-right: 0;
}

.layui-form-radio>i {
	font-size: 18px;
	margin-right: 2px;
}

.form-day-wrap {
	float: left;
}
</style>
</head>
<body>
	<div layout:fragment="content">
		<div class="pro-module-container page-step">
			<form class="layui-form joyin-form-wrap pro-module-form" id="productBuildForm">
				<!-- 隐藏字段 金融产品代码 -->
				<input type="text" name="finprodId" data-th-value='${finprodId}' hidden>
				<!-- 隐藏字段 工作流代码 -->
				<!-- modify by mashukai 行内识别码过滤流程中数据 TISHKBS-1569 20201114 start -->
				<input type="text" id="FinProductBuild002_workflowId" name="workflowId" data-th-value='${workflowId}' hidden>
				<!-- modify by mashukai 行内识别码过滤流程中数据 TISHKBS-1569 20201114 start -->
				<!-- 隐藏字段 新建费用时缓存key值 -->
				<input type="text" id="FinProductBuild002_feeNewAddId" name="feeNewAddId" data-th-value='${feeNewAddId}' hidden>
				<!-- 隐藏字段 快录、模板 -->
				<input type="text" id="FinProductBuild002_quickFlag" data-th-value='Y' hidden>
				<!-- add by tuqirong 2019-03-26 start -->
				<!-- 隐藏字段 附件Id -->
				<input type="text" id="fjId" name="fjId" class="layui-input form-input" data-th-value="${entity?.fjId}" style = "display: none">
				<!-- add by tuqirong 2019-03-26 end -->
                <!--  add by wangyang1 [吉林个性化] 2019年9月26日 start -->
                <input type="text" id="bankCode"  name="bankCode" data-th-value='${bankCode}' hidden>
                <!--  add by wangyang1 [吉林个性化] end -->
				<div class="pro-module-wrapper pro-module-base step" title="基本信息">
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title">
								<span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i
									class="iconfont icon-arrow-down pro-down-icon"></i>
							</h3>
							<div class="pro-module-item">
									<div class="layui-form-item">
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinProductBuild002.finprodMarketId}">产品代码</label>
											<div class="layui-input-inline input-inline">
												<input type="text" name="finprodMarketId" id="FinProductBuild002_finprodMarketId"
													class="layui-input form-input" maxLength="32" onKeyUp="value=value.replace(/[^\u0030-\u0039\u0041-\u005a\u0061-\u007a\u0020-\u0026\u0028-\u007B\u007D\u007E]/g,'')"
													data-th-value='${entity?.finprodMarketId}'
													data-th-placeholder="#{SysCommon.placeholder}" onblur="setFinprodAbbr();" required>
												<a id="FinProductBuild002_btn_quickInput" class="layui-btn layui-btn-sm form-input-text">快录</a>
											</div>
										</div>
										<div class="form-inline-wrap" style="display:none;">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinProductBuild002.tmplId}">模板名称</label>
											<div class="layui-input-inline input-inline">
												<select name="tmplId" id="FinProductBuild002_tmplId"
													class="layui-input form-input input-select" formatoption=false
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-data-url="@{/invest/product/productelement/scheduling/FinProductScheduling002/queryProdTempleteInfo}"
													data-th-initValue='${entity?.tmplId}'>
												</select>
											</div>
										</div>
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinProductBuild002.finprodName}">产品名称</label>
											<div class="layui-input-inline input-inline">
												<input type="text" name="finprodName" id="FinProductBuild002_finprodName"
													class="layui-input form-input" maxlength=200
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-value='${entity?.finprodName}' required>
											</div>
										</div>
									</div>
									<div class="layui-form-item">
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinProductBuild002.finprodAbbr}">产品简称</label>
											<div class="layui-input-inline input-inline">
												<input type="text" name="finprodAbbr" id="FinProductBuild002_finprodAbbr"
													class="layui-input form-input" maxlength=60
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-value='${entity?.finprodAbbr}' required>
											</div>
										</div>
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinProductBuild002.ptlId}">组合代码</label>
											<div class="layui-input-inline input-inline">
												<select name="ptlId" id="FinProductBuild002_ptlId"
													class="layui-input form-input input-select"	
													disabled = "disabled"												
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-data-url="@{/invest/product/productelement/build/FinProductBuild001/queryGroupIdInfo}"
													formatoption=false data-th-initValue='${entity?.ptlId}'>
												</select>
											</div>
										</div>
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinProductBuild002.dealMode}">产品处理模式</label>
											<div class="layui-input-inline input-inline">
												<select id="FinProductBuild002_dealMode" name="dealMode"
													class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-initValue='${entity?.dealMode}?:${DISPOSE_PATTERN_01}'													
													data-th-data-result="${DISPOSE_PATTERN}" required>
												</select>
											</div>
										</div>
									</div>
									<div class="layui-form-item">
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinProductBuild002.profitType}">收益类型</label>
											<div class="layui-input-inline input-inline">
												<select id="FinProductBuild002_profitType" name="profitType"
													class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-initValue='${entity?.profitType}?:${PROFIT_TYPE_02}'													
													data-th-data-result="${PROFIT_TYPE}" required>
												</select>
											</div>
										</div>
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinProductBuild002.operationType}">发行方式</label>
											<div class="layui-input-inline input-inline">												
												<select id="FinProductBuild002_operationType" name="operationType"
													class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}"
													formatoption=false
													data-th-initValue='${entity?.operationType}?:${ISSUE_MODE_02}'												
													data-th-data-result="${ISSUE_MODE}" 
													<!--childrenIds = 'FinProductBuild002_dealMode'--><!--BS-1992-->
													required >
												</select>
											</div>
										</div>
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductBuild002.prodSeries}">产品系列</label>
											<div class="layui-input-inline input-inline">
												<select name="prodSeries"
													id="FinProductBuild002_prodSeries"
													class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-initValue='${entity?.prodSeries} ?: ${PROD_SERIES_01}'
													data-th-data-result="${PROD_SERIES}">
												</select>
											</div>
										</div> 
									</div>
									<!--  
									<div class="layui-form-item">
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinProductBuild002.isCycle}">是否周期型</label>
											<div class="layui-input-inline input-inline">
												<input type="checkbox" id="FinProductBuild002_isCycle" name="isCycle" lay-skin="switch" lay-filter="isCycleFilter"
													data-th-value="${YES}" lay-text="是|否"
													data-th-checked="${'Y' == entity?.isCycle}">
											</div>
										</div>
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinProductBuild002.isLay}">是否分层</label>
											<div class="layui-input-inline input-inline">
												<input type="checkbox" id="FinProductBuild002_isLay" name="isLay" lay-skin="switch" lay-filter="isLayFilter"
													data-th-value="${YES}" lay-text="是|否"
													data-th-checked="${'Y' == entity?.isLay}" required>
											</div>
										</div>
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinProductBuild002.layType}">分层类型</label>
											<div class="layui-input-inline input-inline">
												<select id="FinProductBuild002_layType" name="layType"
													class="layui-input form-input input-select"
													placeholder="请输入内容" multiple="true"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-initValue="${entity?.layType}"
													data-th-data-result="${CLASSIFICATION_TYPE}">
												</select>
											</div>
										</div>
									</div>-->
									<div class="layui-form-item">
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinProductBuild002.prodFeature}">产品特点</label>
											<div class="layui-input-inline input-inline">
												<select name="prodFeature"
													id="FinProductBuild002_prodFeature"
													class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-initValue='${entity?.prodFeature}'
													data-th-data-result="${PROD_FEATURE}">
												</select>
											</div>
										</div>
										
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProductBuild002.payType}">分红方式</label>
											<div class="layui-input-inline input-inline">
												<select id="FinProductBuild002_payType"
													name="bussFinProductPayPlanDto.payType"
													class="layui-input form-input input-select"
													data-th-data-result="${BONUS_MODE}" searchable="false"
													placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-initValue='${entity?.payType}'
													required >
												</select>
											</div>
										</div>

										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinProductBuild002.truOrg}">托管机构</label>
											<div class="layui-input-inline input-inline">
												<select name="trusteeId" id="FinProductBuild002_truOrg"
													class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-initValue='${entity?.trusteeId}'  required
													data-th-data-url="@{/invest/product/common/queryTrusteeId}"
													>
												</select>
											</div>
										</div>
									</div>
									<div class="layui-form-item">
										
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinProductBuild002.calendarId}">交易日历</label>
											<div class="layui-input-inline input-inline">
												<select name="calendarId" id="FinProductBuild002_calendarId"
													class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-data-url="@{/invest/product/common/queryCalendarInfoList}"
													data-th-initValue='${entity?.calendarId==null?"01":entity?.calendarId}' required>
												</select>
											</div>
										</div>	
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinProductBuild002.prodManager}">产品经理</label>
											<div class="layui-input-inline input-inline">
												<select type="text" name="prodManager"
													id="FinProductBuild002_prodManager"
													class="layui-input form-input input-select" maxlength=60
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-initValue='${entity?.prodManager}' required
													data-th-data-url="@{/invest/product/common/getUserName1}">
												</select>
											</div>
										</div>
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinProductBuild002.prodClass}">产品分类</label>
											<div class="layui-input-inline input-inline">
												<select name="prodClass"
													id="FinProductBuild002_prodClass"
													class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-initValue='${entity?.prodClass} ?: ${PROD_CLASS_01}'
													data-th-data-result="${PROD_CLASS}">
												</select>
											</div>
										</div>
									</div>
									<div class="layui-form-item">
										
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinProductBuild002.profitFlag}">产品收益标识</label>
											<div class="layui-input-inline input-inline">
												<select name="profitFlag" id="FinProductBuild002_profitFlag"
													class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-initValue='${entity?.profitFlag}?:${PRODPROFITFLAG_03}'
													data-th-data-result="${PRODPROFITFLAG}" required>
												</select>
											</div>
										</div>
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinProductBuild002.investNature}">投资性质</label>
											<div class="layui-input-inline input-inline">
												<select name="investNature" id="FinProductBuild002_investNature"
													class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-initValue='${entity?.investNature}'
													data-th-data-result="${INVEST_TYPE}" required>
												</select>
											</div>
										</div>
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinProductBuild002.saleType}">销售类型</label>
											<div class="layui-input-inline input-inline">
												<select name="saleType" id="FinProductBuild002_saleType"
													class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-initValue='${entity?.saleType}'
													data-th-data-result="${SALETYPE}">
												</select>
											</div>
										</div>
									</div>
									<div class="layui-form-item">
									
										<!-- <div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinProductBuild002.entruster}">所属分行</label>
											<div class="layui-input-inline input-inline">
												<select name="entruster" id="FinProductBuild002_entruster"
													class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}" multiple="true"
													data-th-data-url="@{/invest/product/common/queryCounterpartyInfo}"
													data-th-initValue='${entity?.entruster}'>
												</select>
											</div>
										</div> -->
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{ProductReportRegister001.repFinprodInsId}">行内标识码</label>
											<!-- modify by mashukai 行内识别码过滤流程中数据 TISHKBS-1569 20201114 end -->
											<div class="layui-input-inline input-inline">
													<select type="text" name="repFinprodInsId"
														id="FinProductBuild002_repFinprodInsId"
														class="layui-input form-input input-select"
														data-th-parentids="|FinProductBuild002_workflowId|"
														data-th-placeholder="#{SysCommon.placeholder}"
														data-th-data-url="@{/invest/product/common/queryRepFinprodInsId?profitType=SY(repFinprodInsId=${entity?.repFinprodInsId})}"
														data-th-initValue='${entity?.repFinprodInsId}' required>
													</select>
											</div>
										</div>
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinProductBuild002.consignmentFlag}">是否支持代销</label>
											<div class="layui-input-inline input-inline">
												<select name="consignmentFlag"
													id="FinProductBuild002_consignmentFlag"
													class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-initValue='${entity?.consignmentFlag} ?:${NO}'
													data-th-data-result="${YES_OR_NO}" required>
												</select>
											</div>
											<!-- modify by mashukai 行内识别码过滤流程中数据 TISHKBS-1569 20201114 end -->
										</div>
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinProductBuild002.beforeEndFlag}">是否允许提前终止</label>
											<div class="layui-input-inline input-inline">
												<select name="beforeEndFlag"
													id="FinProductBuild002_beforeEndFlag"
													class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-initValue='${entity?.beforeEndFlag}'
													data-th-data-result="${YES_OR_NO}" required>
												</select>
											</div>
										</div>
									</div>		
									<div class="layui-form-item">
										
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinProductBuild002.redFlag}">是否允许客户赎回</label>
											<div class="layui-input-inline input-inline">
												<select name="redFlag" id="FinProductBuild002_redFlag"
													class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-initValue='${entity?.redFlag}'
													data-th-data-result="${YES_OR_NO}" required>
												</select>
											</div>
										</div>
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinProductBuild002.beforeEstablishFlag}">是否可提前成立</label>
											<div class="layui-input-inline input-inline">
												<select name="beforeEstablishFlag"
													id="FinProductBuild002_beforeEstablishFlag"
													class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-initValue='${entity?.beforeEstablishFlag} ?: ${YES}'
													data-th-data-result="${YES_OR_NO}" required>
												</select>
											</div>
										</div>
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinProductBuild002.defaultRedFlag}">是否可违约赎回</label>
											<div class="layui-input-inline input-inline">
												<select name="defaultRedFlag"
													id="FinProductBuild002_defaultRedFlag"
													class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-initValue='${entity?.defaultRedFlag} ?: ${NO}'
													data-th-data-result="${YES_OR_NO}" required>
												</select>
											</div>
										</div>
									</div>
									<div class="layui-form-item">
										
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinProductBuild002.prodRegistCode}">产品登记编码</label>
											<div class="layui-input-inline input-inline">
												<input type="text" name="prodRegistCode"
													id="FinProductBuild002_prodRegistCode"
													class="layui-input form-input" maxlength=60
													data-th-value='${entity?.prodRegistCode}' 
													data-th-placeholder="#{SysCommon.placeholder}"
													disabled = "disabled" 
													>
											</div>
										</div>
										<div class="form-inline-wrap">
												<label class="layui-form-label form-label-wrap"
														data-th-text="#{FinProductBuild002.exclusiveProd}">专属产品</label>
												<div class="layui-input-inline input-inline">
													<select name="exclusiveProd"
														id="FinProductBuild002_exclusiveProd"
														class="layui-input form-input input-select"
														data-th-placeholder="#{SysCommon.placeholder}"
														data-th-initValue='${entity?.exclusiveProd} ?: ${NO}'
														data-th-data-result="${YES_OR_NO}" required>
													</select>
											</div>
										</div>
										<div class="form-inline-wrap" id='investmentCycleDiv'>
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinProductBuild002.investmentCycle}">投资周期</label>
											<div class="layui-input-inline input-inline text-number">
												<input type="text" name="investmentCycle"
													id="FinProductBuild002_investmentCycle"
													class="layui-input form-input" maxlength=60
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-value='${entity?.investmentCycle}' required><span class="input-right-show">天</span>
											</div>
										</div>
										<!-- add by tuqirong 2019-03-23 start -->
