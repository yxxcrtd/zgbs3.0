<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{TacticConfig002}">战术配置优化新建</title>
</head>
<body>
	<div layout:fragment="content">
		<div class="pro-module-container">
			<form class="layui-form joyin-form-wrap pro-module-form" id="TacticConfig002_form">
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title">
							<span class="title-des">基础信息</span><i
								class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{TacticConfig001.tacticConfigCode}">战术配置优化编号</label>
									<div class="layui-input-inline input-inline">
										<input type="text" name="tacticConfigCode" id="tacticConfigCode"
											class="layui-input form-input" maxLength="32"
											data-th-value="${entity?.tacticConfigCode}" disabled="disabled" required/>
									</div>
								</div>
								<div class="form-inline-wrap">
				                    <label class="layui-form-label form-lable"
				                           data-th-text="#{TacticConfig001.vdate}">修正期限起始日</label>
				                    <div class="layui-input-inline input-inline">
				                    	<input type="text" id="vdate" name="vdate" 
											class="layui-input form-input input-dateSelect"
											data-th-value='${pageModel} eq ${pageModelNew} ? ${#dates.format(platDate,"yyyy-MM-dd")} : ${#dates.format(entity?.vdate,"yyyy-MM-dd")}'
											required/>
				                    </div>
                				</div>
				                <div class="form-inline-wrap">
				                    <label class="layui-form-label form-lable"
				                           data-th-text="#{TacticConfig001.edate}">修正期限截止日</label>
				                    <div class="layui-input-inline input-inline">
				                    <input type="text" id="edate" name="edate" 
										class="layui-input form-input input-dateSelect"
										data-th-value='${pageModel} eq ${pageModelNew} ? ${#dates.format(lastDay,"yyyy-MM-dd")} : ${#dates.format(entity?.edate,"yyyy-MM-dd")}'
										required/>
				                    </div>
				                </div>
							</div>
						</div>
					</div>
				</div>
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title"><span class="title-des">投研支持观点</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div>
									<label class="layui-form-label form-lable" style="width: 11.9%;">投研支持观点</label>
									<div class="layui-input-inline input-inline" style="width: 85%!important;">
										<textarea id="opinionRinv" name="opinionRinv" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" class="layui-textarea" data-th-text="${entity?.remark}"
											maxlength="1000"></textarea>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">修正列表</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<table class="layui-table" id="corTable" th:name="|tacticConfigOptDetails|" th:title="#{TacticConfig002.tacticConfigOptDetail}"></table>
							</div>
						</div>
				</div>
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title"><span class="title-des">备注</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div>
									<label class="layui-form-label form-lable" style="width: 11.9%;">备注</label>
									<div class="layui-input-inline input-inline" style="width: 85%!important;">
										<textarea id="remark" name="remark" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" class="layui-textarea" data-th-text="${entity?.remark}"
											maxlength="1000"></textarea>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="text-center">
					<a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a> 
					<a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
					<a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
				</div>
			</form>
		</div>
	</div>
	<div layout:fragment="script">
		<script type="text/javascript" data-th-inline="javascript">
			var COR_SCENE = /*[[${COR_SCENE}]]*/; //修正场景
			var ASSET_TYPE = /*[[${ASSET_TYPE}]]*/; //资产大类
			var COR_SCENE_1 = /*[[${COR_SCENE_1}]]*/; //高悲观
			var COR_SCENE_2 = /*[[${COR_SCENE_2}]]*/; //中悲观
			var COR_SCENE_3 = /*[[${COR_SCENE_3}]]*/; //轻悲观
			var COR_SCENE_4 = /*[[${COR_SCENE_4}]]*/; //中性
			var COR_SCENE_5 = /*[[${COR_SCENE_5}]]*/; //轻乐观
			var COR_SCENE_6 = /*[[${COR_SCENE_6}]]*/; //中乐观
			var COR_SCENE_7 = /*[[${COR_SCENE_7}]]*/; //高乐观
			var workflowId = /*[[${workflowId}]]*/; //流程ID
		</script>
		<script
			data-th-src="@{/js/invest/product/productplanning/tacticconfig/TacticConfig002.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
