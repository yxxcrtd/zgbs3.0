<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinProductLedger001}">产品台账</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="form-button-area">
			</div>
			<div
				class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
				<form class="layui-form" id="searchForm"> 
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductBuild001.prodId}">产品代码</label>
							<div class="layui-input-inline input-inline">
								<select type="text" name="prodId"
									class="layui-input form-input input-select" allowClear="true"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									formatoption=true multiple="true"
									data-th-data-url="@{/invest/product/productelement/ledger/FinProductLedger001/queryProdIdInfo}">
								</select>
							</div>
						</div>
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable">发行状态</label>
							<div class="layui-input-inline input-inline">
								<select name="issueStatus"
									id="FinNetValueProductBuild001_issueStatus"
									class="layui-input form-input input-select"
									data-th-placeholder="#{SysCommon.placeholder}"
									multiple="multiple" data-th-data-result="${ISSUE_STATUS}">
								</select>
							</div>
						</div> 
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable">产品存续状态</label>
							<div class="layui-input-inline input-inline">
								<select name="durationStatus" type="text"
									id="FinNetValueProductBuild001_durationStatus"
									class="layui-input form-input input-select"
									data-th-placeholder="#{SysCommon.placeholder}" formatoption = "false"
									multiple="multiple">
									<option value="新发">新发</option>
									<option value="存续">存续</option>
									<option value="到期">到期</option>
								</select>
							</div>
						</div> 
					</div>
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductLedger001.profitType}">收益类型</label>
							<div class="layui-input-inline input-inline">
								<select name="profitType"
									class="layui-input form-input input-select"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result="${PROFIT_TYPE}">
								</select>
							</div>
						</div>
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductLedger001.profitFlag}">收益标识</label>
							<div class="layui-input-inline input-inline">
								<select name="profitFlag" multiple="true"
									id="FinProductBuild001_profitFlag"
									class="layui-input form-input input-select"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result="${PRODPROFITFLAG}">
								</select>
							</div>
						</div>
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductLedger001.queryDate}">查询日</label>
							<div class="layui-input-inline input-inline">
								<input type="text" name="queryDate"
									id="FinProductBuild001_queryDate" data-th-value="${queryDate}" 
									class="layui-input form-input input-dateSelect" placeholder="请选择日期" required="required">
							</div>
						</div>
					</div>
					<div class="layui-form-item">
                        <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4" id="div_prodManager">
                            <label class="layui-form-label form-lable">产品经理</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" name="prodManager" id="prodManager"
                                    class="layui-input form-input input-select" maxlength=60
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-url="@{/invest/product/common/getUserName}">
                                </select>    
                            </div>
                        </div>
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{BussRepFinProductInfo.repInvestorType}">目标客户类型</label>
							<div class="layui-input-inline input-inline">
								<select name="targetCustomType"
									id="FinNetValueProductBuild001_targetCustomType"
									class="layui-input form-input input-select"
									data-th-placeholder="#{SysCommon.placeholder}"
									multiple="multiple" data-th-data-result="${SALETARGET_DECLARE}">
								</select>
							</div>
						</div>
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductLedger001.riskLevel}">风险等级</label>
							<div class="layui-input-inline input-inline">
								<select name="riskLevel"
									id="FinNetValueProductBuild001_riskLevel"
									class="layui-input form-input input-select"
									data-th-placeholder="#{SysCommon.placeholder}"
									multiple="multiple" placeholder="请输入内容" data-th-data-result="${RISKLEVEL}">
								</select>
							</div>
						</div>						
					</div>
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductLedger001.operationType}">是否开放式</label>
							<div class="layui-input-inline input-inline">
								<select type="text" name="operationType"
									id="FinProductBuild001_issueType"
									class="layui-input form-input input-select" allowClear="true"
									data-th-placeholder="#{SysCommon.placeholder}"
									formatoption=false multiple="true"
									data-th-data-result="${YESNO}">
								</select>
							</div>
						</div>
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductLedger001.vdate}">起息日</label>
							<div class="layui-input-inline input-inline">
								<input id="FinProductBuild001_date_vdate" name='vdate'
									class="layui-input form-input input-dateRangeSelect"
									placeholder="请选择时间区间" allowClear="true"
									data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductLedger001.mdate}">到期日</label>
							<div class="layui-input-inline input-inline">
								<input id="FinProductBuild001_date_mdate" name='mdate'
									class="layui-input form-input input-dateRangeSelect"
									placeholder="请选择时间区间"
									data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
					</div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script
			data-th-src="@{/js/invest/product/productelement/ledger/FinProductLedger001.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
