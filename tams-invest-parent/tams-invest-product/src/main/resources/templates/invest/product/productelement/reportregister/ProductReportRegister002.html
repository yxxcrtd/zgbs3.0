<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ProductReportRegister002}">产品需求新建</title>
<style type="text/css">
.layui-form-radio {
	margin: 0;
	padding-right: 0;
}

.layui-form-radio>i {
	font-size: 18px;
	margin-right: 2px;
}

.form-day-wrap {
	float: left;
}
</style>
</head>
<body>
	<div layout:fragment="content">
		<div class="pro-module-container">
			<form class="layui-form joyin-form-wrap pro-module-form" id="ProductReportRegister002_form">
				<!-- 隐藏字段 金融产品代码 -->
				<input type="text" name="repFinprodId" id="repFinprodId" data-th-value='${entity?.repFinprodId}' hidden>
				<input type="text" name="workflowId" id="workflowId" data-th-value='${entity?.workflowId}' hidden>
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title">
							<span class="title-des">申报参数基本信息</span>（<span class="star-sign">*</span>必填）<i
								class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
				<div class="pro-module-item">
				<div class="layui-form-item">
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{FinProductBuild002.finprodName}">产品名称</label>
						<div class="layui-input-inline input-inline">
							<input type="text" name="repFinprodName" id="repFinprodName"
								class="layui-input form-input" maxlength=200
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-value='${entity?.repFinprodName}' required>
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{ProductReportRegister001.repFinprodInsId}">行内标识码</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:id="repFinprodInsId" th:name="repFinprodInsId"
								class="layui-input form-input"
								data-th-value="${entity?.repFinprodInsId}" data-textrange="0" maxlength="100"
								data-th-required="true" />
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{BussRepFinProductInfo.repFinProdBrand}">产品品牌</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:id="repFinprodBrand" th:name="repFinprodBrand"
								  maxlength="120"
								data-th-value="${entity?.repFinprodBrand}" class="layui-input form-input" />
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{BussRepFinProductInfo.repFinprodStage}">产品期次</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:id="repFinprodStage" th:name="repFinprodStage"
								class="layui-input form-input text-number"
								data-th-value="${entity?.repFinprodStage}" data-textrange="0" maxlength="6"
								data-th-required="true" />
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{ProductReportRegister001.repInstituti}">发行机构代码</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:id="repIssuePartyId" th:name="repIssuePartyId"
								class="layui-input form-input"
								data-th-value="${entity?.repIssuePartyId}?:${SVR_ISSUE_PARTY_ID}"
								data-th-required="true" disabled="disabled"/>
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{FinProductBuild002.profitType}">收益类型</label>
						<div class="layui-input-inline input-inline">
							<select id="repProfitType" name="repProfitType"
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-initValue='${entity?.repProfitType}'													
								data-th-data-result="${SVR_PROD_PROFIT_TYPE}"
									childrenIds="repOperateMode" required>
							</select>
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{BussRepFinProductInfo.repApprover}">产品审批人</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:id="repApproverId" th:name="repApproverId"
								class="layui-input form-input" style="width:70%;display:inline-block;"
								data-th-value="${entity?.repApproverId}" maxlength="30"
								placeholder="请输入18位有效证件"  required/>
							<input type="text" th:id="repApproverName" th:name="repApproverName"
								class="layui-input form-input" style="width:30%;display:inline-block;"
								data-th-value="${entity?.repApproverName}" maxlength="20"
								placeholder="请输入姓名" required/>
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{BussRepFinProductInfo.repDesigner}">产品设计人</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:id="repDesignerId" th:name="repDesignerId"
								class="layui-input form-input" style="width:70%;display:inline-block;" maxlength="30"
								data-th-value="${entity?.repDesignerId}" placeholder="请输入18位有效证件" required/>
							<input type="text" th:id= "repDesignerName" th:name="repDesignerName"
								   class="layui-input form-input" style="width:30%;display:inline-block;"
								   data-th-value="${entity?.repDesignerName}" maxlength="20"
								   placeholder="请输入姓名" required/>
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{BussRepFinProductInfo.repManager}">投资经理</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:id="repManagerId" th:name="repManagerId"
								class="layui-input form-input" style="width:70%;display:inline-block;" maxlength="30"
								data-th-value="${entity?.repManagerId}" placeholder="请输入18位有效证件" required/>
								<input type="text" th:id= "repManagerName" th:name="repManagerName"
								class="layui-input form-input" style="width:30%;display:inline-block;"
								data-th-value="${entity?.repManagerName}" maxlength="200"
								placeholder="请输入姓名" required/>
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{BussRepFinProductInfo.repLiaisonName}">业务联络人姓名</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:id="repLiaisonName" th:name="repLiaisonName"
								maxlength="32" class="layui-input form-input"
								data-th-value="${entity?.repLiaisonName}" placeholder="请输入"  required/>
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{BussRepFinProductInfo.repLiaisonTel}">业务联络人座机</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:id="repLiaisonTel" th:name="repLiaisonTel"
								class="layui-input form-input" maxlength="30"
								data-th-value="${entity?.repLiaisonTel}" placeholder="请输入"  required/>
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{BussRepFinProductInfo.repLiaisonMobile}">业务联络人手机</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:id="repLiaisonMobile" th:name="repLiaisonMobile"
								class="layui-input form-input" maxlength="11"
								data-th-value="${entity?.repLiaisonMobile}" placeholder="请输入"   required/>
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{BussRepFinProductInfo.repLiaisonEmail}">业务联络人邮箱</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:id="repLiaisonEmail" th:name="repLiaisonEmail"
								class="layui-input form-input" maxlength="50"
								data-th-value="${entity?.repLiaisonEmail}" placeholder="请输入" data-th-required="true" />
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{FinProductBuild002.termDays}">产品期限</label>
						<div class="layui-input-inline input-inline">
							<div class="layui-input-inline input-inline">
								<select name="repTerm" id="repTerm"
									class="layui-input form-input input-select"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-initValue='${entity?.repTerm}'
									data-th-data-result="${SVR_PRODUCT_TERM}" required>
								</select>
							</div>
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							   data-th-text="#{BussRepFinProductInfo.excFinSector}">是否金融同业专属</label>
						<div class="layui-input-inline input-inline">
							<select th:id="excFinSector" th:name="excFinSector"
									class="layui-input form-input input-select"
									data-th-data-result="${SVR_YES_OR_NO}" placeholder="请输入内容"
									data-th-initValue="${entity?.excFinSector}" data-th-placeholder="#{SysCommon.placeholder}" data-th-required="true">
							</select>
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							   data-th-text="#{BussRepFinProductInfo.repInvestArea}">资金投向地区</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:id="repInvestArea" th:name="repInvestArea"
								   data-th-data-result="${SVR_SALEAREA_DECLARE}"
								   data-th-initValue="${entity?.repInvestArea}" class="layui-input form-input input-checkbox" data-th-required="true" />
						</div>
					</div>				
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{BussRepFinProductInfo.repInvestCountry}">产品投资国家或地区</label>
						<div class="layui-input-inline input-inline">
							<select th:id="repInvestCountry" th:name="repInvestCountry"
								class="layui-input form-input input-select" multiple="multiple"
								data-th-data-result="${SVR_COUNTRY_AREA}" placeholder="请输入内容"
								data-th-initValue="${entity?.repInvestCountry}" data-th-placeholder="#{SysCommon.placeholder}"
								>
							</select>
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{BussRepFinProductInfo.repFinanSerModel}">理财业务服务模式</label>
						<div class="layui-input-inline input-inline">
							<select th:id="repFinanSerModel" th:name="repFinanSerModel"
								class="layui-input form-input input-select"
								data-th-data-result="${SVR_SERVICEMODE}" placeholder="请输入内容"
								data-th-initValue="${entity?.repFinanSerModel}" data-th-placeholder="#{SysCommon.placeholder}"
								>
							</select>
						</div>
					</div>
				</div>	
				<div class="layui-form-item">
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{BussRepFinProductInfo.repOperateMode}">产品运作模式</label>
						<div class="layui-input-inline input-inline">
							<select th:id="repOperateMode" th:name="repOperateMode"
								class="layui-input form-input input-select"
								data-th-data-result="${SVR_OPERATEMODE_DECLARE}" placeholder="请输入内容" parentIds="repProfitType"
								data-th-initValue="${entity?.repOperateMode}" data-th-placeholder="#{SysCommon.placeholder}" 
								data-th-required="(${pageId} neq 'FinProductModule002')">
							</select>
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{BussFinProductSaleParam.issueType}">募集方式</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:name="repIssueType"
								th:id="repIssueType"
								class="layui-input form-input input-checkbox" required
								data-th-initValue='${entity?.repIssueType}'
								data-th-data-result="${RAISE_TYPE}" />
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{BussRepFinProductInfo.repCmmode}">产品资产配置方式</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:id="repCmmode" th:name="repCmmode"
								data-th-data-result="${SVR_CMMODE}"
								data-th-initValue="${entity?.repCmmode}" class="layui-input form-input input-checkbox" data-th-required="true" />
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{BussRepFinProductInfo.repPmmode}">产品管理模式</label>
						<div class="layui-input-inline input-inline">
							<select th:id="repPmmode" th:name="repPmmode"
								class="layui-input form-input input-select"
								data-th-data-result="${SVR_PROD_MANAGE}" placeholder="请输入内容"
								data-th-initValue="${entity?.repPmmode}" data-th-placeholder="#{SysCommon.placeholder}" data-th-required="true">
							</select>
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{BussRepFinProductInfo.repMname}">实际管理人名称</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:id="repMname" th:name="repMname"
								data-th-value="${entity?.repMname}" maxlength=120 class="layui-input form-input" placeholder="请输入" />
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{BussRepFinProductInfo.repPricedMode}">产品定价方式</label>
						<div class="layui-input-inline input-inline">
							<select th:id="repPricedMode" th:name="repPricedMode"
								class="layui-input form-input input-select"
								data-th-data-result="${SVR_PRODVALUETYPE}" placeholder="请输入内容"
								data-th-initValue="${entity?.repPricedMode}" data-th-placeholder="#{SysCommon.placeholder}" data-th-required="true">
							</select>
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{FinProductBuild002.investNature}">投资性质</label>
						<div class="layui-input-inline input-inline">
							<select name="repInvestNature" id="repInvestNature"
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-initValue='${entity?.repInvestNature}'
								data-th-data-result="${INVEST_TYPE}" required>
							</select>
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{ProductReportRegister001.repJizhun}">业绩比较基准</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:id="repYield" th:name="repYield" maxlength= 9 data-textrange = '5'
								data-th-value="${entity?.repYield}" class="layui-input form-input text-number"> <span
								class="input-right-show">%</span>
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							   data-th-text="#{ProductReportRegister001.repIsCashManage}">是否现金管理类</label>
						<div class="layui-input-inline input-inline">
							<select th:id="repIsCashManage" th:name="repIsCashManage"
									class="layui-input form-input input-select"
									data-th-data-result="${YES_OR_NO}" placeholder="请输入内容"
									data-th-initValue="${entity?.repIsCashManage}" data-th-placeholder="#{SysCommon.placeholder}" >
							</select>
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							   data-th-text="#{BussRepFinProductInfo.isShortTerm}">是否设置最短持有期限</label>
						<div class="layui-input-inline input-inline">
							<select th:id="isShortTerm" th:name="isShortTerm"
									class="layui-input form-input input-select"
									data-th-data-result="${SVR_YES_OR_NO}" placeholder="请输入内容"
									data-th-initValue="${entity?.isShortTerm}" data-th-placeholder="#{SysCommon.placeholder}">
							</select>
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							   data-th-text="#{BussRepFinProductInfo.shortTerm}">最短持有期限(天)</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:id="shortTerm" th:name="shortTerm"
								   class="layui-input form-input text-number"
								   data-th-value="${entity?.shortTerm}" data-textrange="0" maxlength="5"
								   onkeyup="this.value=this.value.replace(/\D/g,'')"
								   onafterpaste="this.value=this.value.replace(/\D/g,'')"
							/>
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							   data-th-text="#{BussRepFinProductInfo.isFreeRedem}">最短持有期后是否自由赎回</label>
						<div class="layui-input-inline input-inline">
							<select th:id="isFreeRedem" th:name="isFreeRedem"
									class="layui-input form-input input-select"
									data-th-data-result="${SVR_YN_REDEM}" placeholder="请输入内容"
									data-th-initValue="${entity?.isFreeRedem}" data-th-placeholder="#{SysCommon.placeholder}">
							</select>
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{BussRepFinProductInfo.repSaleArea}">产品销售区域</label>
						<div class="layui-input-inline input-inline">
							<select th:id="repSaleArea" th:name="repSaleArea"
									class="layui-input form-input input-select" multiple="multiple"
									data-th-data-result="${SVR_BUY_PLACE}" placeholder="请输入内容" showAll="true"
									data-th-initValue="${entity?.repSaleArea}" data-th-placeholder="#{SysCommon.placeholder}" data-th-required="true">
							</select>
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{BussRepFinProductInfo.repSaleAmtStr}">起点销售金额</label>
						<div class="layui-input-inline input-inline">
							<input type="text" th:id="repSaleAmtStr" th:name="repSaleAmtStr"
								data-th-value="${entity?.repSaleAmtStr}" maxlength=15 class="layui-input form-input text-number" placeholder="请输入" required/>
								<span class="input-right-show">元</span>
						</div>
					</div>
					<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap"
								data-th-text="#{BussRepFinProductInfo.repSaleFeeRate}">销售费率</label>
							<div class="layui-input-inline input-inline">
								<input type="text" th:id="repSaleFeeRate" th:name="repSaleFeeRate" data-textrange = '5'
									data-th-value="${entity?.repSaleFeeRate}" maxlength=9 class="layui-input form-input text-number" placeholder="请输入" required>
									<span class="input-right-show">%</span>
							</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{BussFinProductSaleParam.ccy}">募集币种</label>
						<div class="layui-input-inline input-inline">
							<select th:id="repRaiseCcy" th:name="repRaiseCcy"
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-initValue='${entity?.repRaiseCcy}?:${repRaiseCcyCNY}' data-th-data-result="${CCY}" required>
							</select>
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{BussFinProductSaleParam.repCashPrinCcy}">兑付本金币种</label>
						<div class="layui-input-inline input-inline">
							<select th:id="repCashPrinCcy"
								th:name="repCashPrinCcy"
								class="layui-input form-input input-select"
								data-th-data-result="${CCY}" placeholder="请输入内容"
								data-th-initValue="${entity?.repCashPrinCcy}?:${repRaiseCcyCNY}"
								data-th-placeholder="#{SysCommon.placeholder}" required>
							</select>
						</div>
					</div>
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
