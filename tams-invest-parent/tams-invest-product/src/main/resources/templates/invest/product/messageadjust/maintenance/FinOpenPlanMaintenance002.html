<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinOpenPlanMaintenance002}">新建开放计划</title>
<style type="text/css">
.layui-form-radio {
	margin: 0;
	padding-right: 0;
}

.layui-form-radio>i {
	font-size: 18px;
	margin-right: 2px;
}

.form-day-wrap {
	float: left;
}
</style>
</head>
<body>
	<div layout:fragment="content">
		<div class="pro-module-wrapper pro-module-base"
			style="border-top: none;">
			<form class="layui-form joyin-form-wrap" id="FinOpenPlanMaintenance002_form">
				<input type="text" id="FinOpenPlanMaintenance002_pageId" name="pageId" data-th-value='${entity?.pageId}' hidden>
				<!-- 隐藏字段 工作流代码 -->
				<input type="text" id="FinOpenPlanMaintenance002_workflowId" name="workflowId" data-th-value='${workflowId}' hidden>
				<!-- 隐藏字段 金融产品代码 -->
				<input type="text" id="FinOpenPlanMaintenance002_profitType" name="profitType" data-th-value='${profitType}' hidden>
				
				<!-- 产品处理模式 -->
				<input type="text" id="FinOpenPlanMaintenance002_dealMode" name="dealMode" data-th-value='${entity?.dealMode}' hidden>
				<!-- 期限 -->
				<input type="text" id="FinOpenPlanMaintenance002_termType" name="termType" data-th-value='${entity?.termType}' hidden>
				<!-- 投资周期 -->
				<input type="text" id="FinOpenPlanMaintenance002_investmentCycle" name="investmentCycle" data-th-value='${entity?.investmentCycle}' hidden>
				
				<input type="text" id="FinOpenPlanMaintenance002_operationType" name="operationType" data-th-value='${operationType}' hidden>
				<input type="text" id="FinOpenPlanMaintenance002_vdate" name="vdate" data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}' hidden>
				<input type="text" id="FinOpenPlanMaintenance002_tradCalender" name="tradCalender" data-th-value='${tradCalender}' hidden>
				<input type="text" id="FinOpenPlanMaintenance002_purConfDays" name="purConfDays" data-th-value='${purConfDays}' hidden>
				<input type="text" id="FinOpenPlanMaintenance002_isCycle" name="isCycle" data-th-value='${isCycle}' hidden>
				<input type="text" id="FinOpenPlanMaintenance002_closeTerm" name="closeTerm" data-th-value='${closeTerm}' hidden>
				<input type="text" id="FinOpenPlanMaintenance002_redSpeed" name="redSpeed" data-th-value='${redSpeed}' hidden>
				<input type="text" id="FinOpenPlanMaintenance002_purSpeed" name="purSpeed" data-th-value='${purSpeed}' hidden>
				<input type="text" id="FinOpenPlanMaintenance002_pageModel" name="pageModel" data-th-value='${pageModel}' hidden>
				<input type="text" id="FinOpenPlanMaintenance002_calendarId" name="calendarId" data-th-value='${calendarId}' hidden>
				<input type="text" id="FinOpenPlanMaintenance002_mdate" name="mdate" data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}' hidden>
				<input type="text" id="FinOpenPlanMaintenance002_cpriceRule" name="cpriceRule" data-th-value='${cpriceRule}' hidden>
				<input type="text" id="FinOpenPlanMaintenance002_cashId" name="cashId" data-th-value='${cashId}' hidden>
				<input type="text" id="FinOpenPlanMaintenance002_openType" name="openType" data-th-value='${openType}' hidden>
				<input type="text" id="FinOpenPlanMaintenance002_branch" name="branch" data-th-value='${branch}' hidden>
				
				<input type="text" id="FinNetValueProductBuild002_period" name="period" data-th-value='${period}' hidden>
				
				<div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title" style="border-top: 1px solid #cccccc;">
                            <span class="title-des">产品信息</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                        data-th-text="#{FinFloatMgtExpQuotation002.finprodId}">产品代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="finprodId" name="finprodId"
                                            class="layui-input form-input input-select"
                                            data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-initvalue="${entity?.finprodId}" formatoption=false
                                            data-th-data-url="@{/invest/product/messageadjust/maintenance/FinOpenPlanMaintenance002/productCodeList}"
                                            required>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                        data-th-text="#{FinFloatMgtExpQuotation001.finprodAbbr}">产品简称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodAbbr" name="finprodAbbr"
                                            disabled=true
                                            data-th-value="${entity?.finprodAbbr}"
                                            class="layui-input form-input" placeholder="请输入内容"
                                            data-th-placeholder="#{SysCommon.placeholder}">
                                	</div>
                            	</div>
                            	<div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                        data-th-text="#{FinOpenPlanMaintenance002.nextOpenDay}">下一开放日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="nextOpenDay" name="nextOpenDay" placeholder="请输入内容"
                                            class="layui-input form-input input-dateSelect"
                                            data-th-placeholder="#{SysCommon.placeholder}" 
                                            data-th-value="${#dates.format(entity?.nextOpenDay,'yyyy-MM-dd')}" required />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
				<!-- 开放计划共通 -->
				<div class="page-component"
						th:data-path="@{/component/prod/BussFinProductOpenPlanCommonRate/init}"
						th:data-params="|{bussFinProductOpenPlanDto: 'bussFinProductOpenPlanDto',bussFinProductOpenPlanRedDto: 'bussFinProductOpenPlanRedDto', pageId: '${pageId}', workflowId: '${workflowId}', finprodId: '${finprodId}',profitType:'FinOpenPlanMaintenance002_profitType', dealMode: 'FinOpenPlanMaintenance002_dealMode', operationType: 'FinOpenPlanMaintenance002_operationType', vdate: 'FinOpenPlanMaintenance002_vdate', mdate: 'FinOpenPlanMaintenance002_mdate', tradCalender: 'FinOpenPlanMaintenance002_calendarId', raiseStrDate: 'FinOpenPlanMaintenance002_firstSaleVdate', raiseEndDate: 'FinOpenPlanMaintenance002_firstSaleMdate', purConfDays: 'FinOpenPlanMaintenance002_purSpeed', isCycle: 'FinOpenPlanMaintenance002_isCycle', closeTerm: 'FinOpenPlanMaintenance002_closeDays',purSpeed:'${entity?.purSpeed}',pageModel: '${pageModel}',redSpeed:'${entity?.redSpeed}'}|"></div>
				<div class="layui-col-md11 " style="margin: 20px 0;">
					<div class="text-center">
						<a id="FinOpenPlanMaintenance002_btn_save"
							class="layui-btn layui-btn-sm btn-save"
							data-th-text="#{SysCommon.save}">保存</a> <a
							id="FinOpenPlanMaintenance002_btn_submit"
							class="layui-btn layui-btn-sm btn-submit"
							data-th-text="#{SysCommon.submit}">提交</a> <a
							id="FinOpenPlanMaintenance002_btn_cancel"
							class="layui-btn layui-btn-sm btn-cancel"
							data-th-text="#{SysCommon.cancel}">取消</a>
					</div>
				</div>
			</form>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var PROFIT_TYPE_01 = /*[[${PROFIT_TYPE_01}]]*/'01'; // 数据字典.收益类型_净值
			var PROFIT_TYPE_02 = /*[[${PROFIT_TYPE_02}]]*/'02'; // 数据字典.收益类型_预期收益
			var redSpeed = "";
			var purSpeed = "";
			var profitType = "01";
			
		</script>
		
		<script
			data-th-src="@{/js/invest/product/productelement/common/FinProductCommon.js}"
			type="text/javascript"></script>
		<script
			data-th-src="@{/js/invest/product/messageadjust/maintenance/FinOpenPlanMaintenance002.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
