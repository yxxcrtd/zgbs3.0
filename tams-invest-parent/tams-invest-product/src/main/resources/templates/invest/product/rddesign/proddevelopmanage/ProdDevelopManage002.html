<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ProdDevelopManage002}">产品研发方案新建</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm">
            <!-- 隐藏域 -->
            <input type="hidden" id="seqNo" name="seqNo" data-th-value="${entity?.seqNo}" />
            <input type="hidden" id="workflowId" name="workflowId" data-th-value="${entity?.workflowId}" />
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{ProdDevelopManage001.generateTime}">生成日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="generateTime" name="generateTime"
                            class="layui-input form-input input-dateSelect"
                            data-th-value='${entity?.generateTime eq null ? "": #dates.format(entity?.generateTime,"yyyy-MM-dd")}'
                            required />
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{ProdDevelopManage001.prdDesignId}">产品设计系列编号</label>
                    <div class="layui-input-inline input-inline">
                        <select id="prdDesignId" name="prdDesignId" class="layui-input form-input input-select"
                            data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-data-url="@{/invest/product/rddesign/proddevelopmanage/ProdDevelopManage001/getProdDesignSeries}"
                            data-th-initValue="${entity?.prdDesignId}" required>
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{ProdDevelopManage001.prdDesignName}">产品设计系列名称</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" name="prdDesignName" id="prdDesignName" class="layui-input form-input"
                            maxlength=50 data-th-value="${entity?.prdDesignName}" disabled />
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable" data-th-text="#{ProdDevelopManage001.schemeResulr}">是否通过</label>
                    <div class="layui-input-inline input-inline">
                        <select id="schemeResulr" name="schemeResulr" th:data-result="${PASS_STATUS}" required
                            class="layui-input form-input input-select" data-th-initValue="${entity?.schemeResulr}"
                            data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap"
                        data-th-text="#{ProdDevelopManage001.feasibilityResult}">产品可行性分析结果</label>
                    <div class="layui-input-inline input-inline">
                        <select id="feasibilityResult" name="feasibilityResult" th:data-result="${FEASIBILITY_STATUS}"
                            required class="layui-input form-input input-select"
                            data-th-initValue="${entity?.feasibilityResult}" >
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{ProdDevelopManage001.prdRiskLevel}">产品风险等级评定结果</label>
                    <div class="layui-input-inline input-inline">
                        <select id="prdRiskLevel" name="prdRiskLevel" th:data-result="${RISKLEVEL}"
                            class="layui-input form-input input-select" data-th-initValue="${entity?.prdRiskLevel}"
                            >
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style="width: 100%;">
                    <label class="layui-form-label form-label-wrap"
                        data-th-text="#{ProdDevelopManage001.prdDesignResult}" style="width: 11.9%;">产品要素设计结果</label>
                    <div class="layui-input-inline input-inline" style="width: 85.7% !important;">
                        <!--  <input th:id="prdDesignResult" th:name="prdDesignResult" th:value="${entity?.prdDesignResult}"
                            class="layui-input form-input" > -->
                        <textarea id="prdDesignResult" name="prdDesignResult" class="layui-textarea"
                            data-th-text="${entity?.prdDesignResult}"  />
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style="width: 100%;">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{ProdDevelopManage001.prdLoadResult}"
                        style="width: 11.9%;">产品压力测试结果</label>
                    <div class="layui-input-inline input-inline" style="width: 85.7% !important;">
                        <!--  <input th:id="prdLoadResult" th:name="prdLoadResult" th:value="${entity?.prdLoadResult}"
                            class="layui-input form-input" > -->
                        <textarea id="prdLoadResult" name="prdLoadResult" class="layui-textarea"
                            data-th-text="${entity?.prdLoadResult}"  />
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style="width: 100%;">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{ProdDevelopManage001.prdMockResult}"
                        style="width: 11.9%;">产品模拟测算结果</label>
                    <div class="layui-input-inline input-inline" style="width: 85.7% !important;">
                        <!--  <input th:id="prdMockResult" th:name="prdMockResult" th:value="${entity?.prdMockResult}"
                            class="layui-input form-input" > -->
                        <textarea id="prdMockResult" name="prdMockResult" class="layui-textarea"
                            data-th-text="${entity?.prdMockResult}"  />
                    </div>
                </div>
            </div>
            <div class="layui-col-md10" style="margin: 30px 0;">
                <div class="text-center">
                    <a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save"
                        data-th-text="#{SysCommon.save}">保存</a>
                    <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit"
                        data-th-text="#{SysCommon.submit}">提交</a>
                    <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel"
                        data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </div>
        </form>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/product/rddesign/proddevelopmanage/ProdDevelopManage002.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
