<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ReportProductRequirement002}">产品需求上报</title>
</head>
<body>
	<div layout:fragment="content">
		<div class="pro-module-container">
			<form class="layui-form joyin-form-wrap pro-module-form" id="ReportProductRequirement002_form">
				<input type="text" name="dataStatus" id="dataStatus" data-th-value='${entity?.dataStatus}' hidden>
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title">
							<span class="title-des">产品需求</span><i
								class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{ReportProductRequirement002.requirementId}">需求编号</label>
									<div class="layui-input-inline input-inline">
										<input type="text" name="requirementId" id="requirementId"
											class="layui-input form-input" maxLength="50"
											data-th-value="${entity?.requirementId}" disabled="disabled">
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{ReportProductRequirement002.requirementBasis}">产品形成依据</label>
									<div class="layui-input-inline input-inline">
											<input type="text" name="requirementBasis"
												id="requirementBasis" class="layui-input form-input"
												maxLength="300"
												data-th-placeholder="#{SysCommon.placeholder}" 
												data-th-value="${entity?.requirementBasis}" disabled="disabled" required>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{ReportProductRequirement002.requirementTime}">需求发起时间</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="requirementTime" name="requirementTime"
											class="layui-input form-input input-dateSelect" 
											data-th-value='${entity?.requirementTime eq null ? "": #dates.format(entity?.requirementTime,"yyyy-MM-dd")}' disabled="disabled" required />
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{ReportProductRequirement002.tarCustomer}">目标客户</label>
									<div class="layui-input-inline input-inline">
										<input type="text" name="tarCustomer" id="tarCustomer"
											class="layui-input form-input" maxlength=50
											data-th-placeholder="#{SysCommon.placeholder}" 
											data-th-value="${entity?.tarCustomer}" disabled="disabled"/>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{ReportProductRequirement002.prdScale}">规模</label>
									<div class="layui-input-inline input-inline">
										<input type="text" name="prdScale" id="prdScale"
											class="layui-input form-input" maxlength=50
											data-th-placeholder="#{SysCommon.placeholder}" 
											data-th-value="${entity?.prdScale}" disabled="disabled"/>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{ReportProductRequirement002.prdPeriod}">期限</label>
									<div class="layui-input-inline input-inline">
										<input type="text" name="prdPeriod" id="prdPeriod"
											class="layui-input form-input" maxlength=50
											data-th-placeholder="#{SysCommon.placeholder}" 
											data-th-value="${entity?.prdPeriod}" disabled="disabled"/>
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{ReportProductRequirement002.prdRate}">收益率</label>
									<div class="layui-input-inline input-inline">
										<input type="text" name="prdRate" id="prdRate"
											class="layui-input form-input text-number" maxlength=50
											data-th-placeholder="#{SysCommon.placeholder}" 
											data-th-value="${entity?.prdRate}" disabled="disabled"/>
											<span class="input-right-show">%</span>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{ReportProductRequirement002.prdRequirementDetail}">产品详细需求</label>
									<div class="layui-input-inline input-inline">
										<input type="text" name="prdRequirementDetail"
											id="prdRequirementDetail" class="layui-input form-input"
											maxlength=300 data-th-placeholder="#{SysCommon.placeholder}"
											data-th-value="${entity?.prdRequirementDetail}" disabled="disabled" required/>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{ReportProductRequirement002.requirementSource}">需求发起端</label>
									<div class="layui-input-inline input-inline">
										<select name="requirementSource" id="requirementSource"
											class="layui-input form-input input-select"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-initValue='${entity?.requirementSource}'
											data-th-data-result="${REQUIREMENT_SOURCE}" disabled="disabled" required>
										</select>
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{ReportProductRequirement001.requirementUser}">需求发起人</label>
									<!-- <div class="layui-input-inline input-inline">
										<input type="text" name="requirementUser"
											id="requirementUser" class="layui-input form-input"
											maxlength=300 data-th-placeholder="#{SysCommon.placeholder}"
											data-th-value="${entity?.requirementUser}" />
									</div> -->
									<div class="layui-input-inline input-inline">
												<select type="text" name="requirementUser"
													id="requirementUser"
													class="layui-input form-input input-select" maxlength=60
													data-th-placeholder="#{SysCommon.placeholder}" disabled="disabled"
													data-th-data-url="@{/invest/product/common/getProductUserName}"
													data-th-initValue='${pageModel} eq ${pageModelNew} ? ${requirementUser} : ${entity?.requirementUser}' required>
												</select>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{ReportProductRequirement002.reportStatus}">是否上报</label>
									<div class="layui-input-inline input-inline">
										<select name="reportStatus" id="reportStatus"
											class="layui-input form-input input-select"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-initValue='${entity?.reportStatus}'
											data-th-data-result="${REVIEW_RESULT}" required>
										</select>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{ReportProductRequirement002.reportDecr}">说明</label>
									<div class="layui-input-inline input-inline">
										<input type="text" name="reportDecr"
											id="reportDecr" class="layui-input form-input"
											maxlength=300 data-th-placeholder="#{SysCommon.placeholder}"
											data-th-value="${entity?.reportDecr}" />
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:20px 0;">
					<div class="text-center">
						<a th:id="|${pageId}_btn_save|"
							class="layui-btn layui-btn-sm btn-save"
							data-th-text="#{SysCommon.save}">保存</a> <a
							th:id="|${pageId}_btn_submit|"
							class="layui-btn layui-btn-sm btn-submit"
							data-th-text="#{SysCommon.submit}">提交</a> <a
							th:id="|${pageId}_btn_cancel|"
							class="layui-btn layui-btn-sm btn-cancel"
							data-th-text="#{SysCommon.cancel}">取消</a>
					</div>
				</div>
			</form>
		</div>
	</div>
	<div layout:fragment="script">
		<script
			data-th-src="@{/js/invest/product/rddesign/reportproductrequirement/ReportProductRequirement002.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
