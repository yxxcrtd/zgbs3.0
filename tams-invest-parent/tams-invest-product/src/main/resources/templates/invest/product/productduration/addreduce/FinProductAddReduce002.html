<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{FinProductAddReduce002}">收益型产品提前赎回交易新建</title>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-wrapper pro-module-base" style="border-top: none;">
        <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
        	<input type="text" id="finprodMarketId" name="finprodMarketId" data-th-value="${entity?.finprodMarketId}" hidden>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des" style="border-top: 1px solid #cccccc;">产品基本信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductAddReduce001.prodId}">产品代码</label>
                                <div class="layui-input-inline input-inline">
                                    <select formatoption="false" id="finprodId" name="finprodId"
                                            class="layui-input form-input input-select"
                                            data-th-data-url="@{/invest/product/productduration/addreduce/FinProductAddReduce002/getProdId}"
                                            data-th-initValue="${entity?.finprodId}"
                                            allowClear="true" placeholder="请输入内容"
                                            data-th-placeholder="#{SysCommon.placeholder}" required>
                                    </select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductAddReduce002.finprodAbbr}">产品简称</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="hidden" id="ptlId" name="ptlId" data-th-value="${entity?.ptlId}">
                                    <input type="hidden" id="prodRegistCode" name="prodRegistCode">
                                    <input type="hidden" id="isLay" name="isLay">
                                    <input type="hidden" id="operationType" name="operationType">
                                    <input type="hidden" id="layType" name="layType">
                                    <input type="hidden" id="prdVdate" name="prdVdate">
                                    <input type="hidden" id="prdMdate" name="prdMdate">
                                    <input type="hidden" id="dealMode" name="dealMode">
                                    <input type="hidden" id="acctNoList" name="selectValue" data-th-value="|${acctNoList}|">
                                    <input type="text" id="prodAbbr" name="prodAbbr" class="layui-input form-input"
                                    data-th-value="${entity?.prodAbbr}"  disabled required/>
                                    <input type="text" id="operateType" name="operateType" class="layui-input form-input" data-th-value="${entity?.operateType}" style = "display: none">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductAddReduce002.finprodName}">产品名称</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="prodName" name="prodName" class="layui-input form-input" 
                                    data-th-value="${entity?.prodName}"  disabled required/>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                        	<div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductAddReduce002.dealType}">交易类型</label>
                                <div class="layui-input-inline input-inline">
                                    <select formatoption="true" type="text" id="ps" name="ps"
                                            class="layui-input form-input input-select"
                                            data-th-data-result='${PS}' allowClear="true" placeholder="请输入内容"
                                            data-th-initValue="${entity?.ps ?: C17}" disabled required>s
                                    </select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductAddReduce002.prinAmt}">提前赎回本金</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="prinAmt" name="prinAmt" data-th-value="${entity?.prinAmt}"
                                           class="layui-input form-input text-number" disabled required/>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductAddReduce002.actCusProfit}">实付客户收益</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="actCusProfit" name="actCusProfit" data-fixtype="2" data-pattern="true"
                                           data-th-value="${entity?.actCusProfit}" disabled
                                           data-textrange="2" class="layui-input form-input text-number"  required/>
                                </div>
                            </div>
                            
                            <!-- <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap">销售部门</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="hidden" id="saleDepartmentId"/>
                                    <select formatoption="true" type="text" id="saleDepartment" name="saleDepartment"
                                            class="layui-input form-input input-select"
                                            multiple="multiple"
                                            data-th-data-result='${SALE_DEPT}' allowClear="true" placeholder="请输入内容"
                                            data-th-initValue="${entity?.saleDepartment}" disabled required>
                                    </select>
                                </div>
                            </div> -->
                        </div>
                        <div class="layui-form-item">
                            <!-- <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductAddReduce002.vdate}">计息开始日</label>
                                <div class="layui-input-inline input-inline">
                                     <input type="text" name="vDate" id="vDate"
											class="layui-input form-input input-dateSelect"
											data-th-value='${entity?.vDate}'
											required>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductAddReduce002.mdate}">计息结束日</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="mDate" name="mDate" data-th-value="${entity?.mDate == null ? sysDate : entity?.mDate}"
                                           class="layui-input form-input input-dateSelect" required/>
                                </div>
                            </div> -->
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductAddReduce002.ccy}">币种</label>
                                <div class="layui-input-inline input-inline">
                                    <select formatoption="true" type="text" id="ccy" name="ccy"
                                            class="layui-input form-input input-select" disabled
                                            data-th-data-result='${CCY}' allowClear="true" placeholder="请输入内容"
                                            data-th-initValue="${entity?.ccy}" required>
                                    </select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductAddReduce002.tradeDate}">确认日</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="tradeDate" name="tradeDate" data-th-value="${entity?.tradeDate == null ? sysDate : entity?.tradeDate}"
                                           class="layui-input form-input input-dateSelect" required/>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductAddReduce002.payDate}">支付日</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="settleDate" name="settleDate" data-th-value="${entity?.settleDate == null ? sysDate : entity?.settleDate}"
                                           class="layui-input form-input input-dateSelect" required/>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <!-- <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap">应付客户收益</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="interest" name="interest" data-fixtype="2" data-pattern="true"
                                           data-th-value="${entity?.interest}"
                                           data-textrange="2" class="layui-input form-input text-number"  required/>
                                </div>
                            </div> -->
	                        <div class="form-inline-wrap" style="display:none;" >
	                                <label class="layui-form-label form-label-wrap" data-th-text="#{FinProductAddReduce002.sdefault}">是否违约赎回</label>
	                                <div class="layui-input-inline input-inline">
	                                    <select type="text" id="sdefault" name="sdefault"
	                                            class="layui-input form-input input-select"
	                                            data-th-data-result='${YES_OR_NO}' allowClear="true" placeholder="请输入内容"
	                                            data-th-initValue="${entity?.sdefault ?: NO}" required>
	                                    </select>
	                                </div>
	                            </div>
	                        <div class="form-inline-wrap" id="FinProductAddReduce002_sdefaultAmt">
	                                <label class="layui-form-label form-label-wrap">违约金</label>
	                                <div class="layui-input-inline input-inline">
	                                    <input type="text" id="sdefaultAmt" name="sdefaultAmt" data-fixtype="2" data-pattern="true" required="required"
	                                           data-th-value="${entity?.sdefaultAmt}"
	                                           data-textrange="2" class="layui-input form-input text-number"/>
	                                </div>
	                        </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pro-module-wrap income-product">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">提前赎回信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <table class="layui-table" id="subProductTable" name="reduceInfoDtoList"></table>
                        </div>
                    </div>
                </div>
            </div>

           <!--  <div class="pro-module-wrap income-product">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">费用信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <table class="layui-table" id="productFeeTable" name="productFeeInfoList"></table>
                        </div>
                    </div>
                </div>
            </div> -->

            <!-- 划款信息 -->
            <div class="pro-module-wrap net-product fund-product income-product" th:id="|bussTrdTransferOrder_div|">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">指令信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <input type="hidden" th:id="|bussTrdTransferOrder_payAcctNo|" th:name="selectValue" value="pay">
                            <input type="hidden" th:id="|bussTrdTransferOrder_recAcctNo|" th:name="selectValue" value="rec">
                            <a th:id="|bussTrdTransferOrder_btn_generate|" class="layui-btn layui-btn-sm" th:text="#{BussTrdTransferOrder.generate}" onclick="zd()">生成指令</a>
                        </div>
                        <table class="layui-table" th:id="|bussTrdTransferOrder_table|" th:name="bussTrdTransferOrder"></table>
                    </div>
                </div>
            </div>
            <div class="pro-module-wrap net-product fund-product income-product">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">交易备注</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div>
                                <textarea id="remark" name="remark" data-th-text='${entity?.remark}' placeholder="请输入内容" class="layui-textarea"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 20px 0 40px 0;">
        <div class="text-center">
            <a id="FinProductAddReduce002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="FinProductAddReduce002_btn_submit" class="layui-btn layui-btn-sm  btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="FinProductAddReduce002_btn_revoke" class="layui-btn layui-btn-sm  btn-revoke" data-ignore=true data-th-text="#{SysCommon.revoke}">撤销</a>
            <a id="FinProductAddReduce002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var YES = /*[[${YES}]]*/'';
        var NO = /*[[${NO}]]*/'';
        var YES_NO = /*[[${YES_OR_NO}]]*/'';
        var C6 = /*[[${C6}]]*/'C6';
        var F16 = /*[[${F16}]]*/'F16';
        var C03 = /*[[${C03}]]*/'C03';
        var C05 = /*[[${C05}]]*/'C05';
        var C06 = /*[[${C06}]]*/'C06';
        var FT03 = /*[[${FT03}]]*/'';
        var FT05 = /*[[${FT05}]]*/'';
        var FT06 = /*[[${FT06}]]*/'';
        var totleTradeId = /*[[${entity?.totleTradeId}]]*/'';
        var basis360 = /*[[${basis360}]]*/'';
        var profitType = /*[[${entity?.profitType}]]*/'';
        var isLay = /*[[${entity?.isLay}]]*/'';
        var layType = /*[[${entity?.layType}]]*/'';
        var bussTrdTransferOrderDtos = /*[[${entity?.bussTrdTransferOrder}]]*/'';
        var reduceInfoDtoList = /*[[${entity?.reduceInfoDtoList}]]*/'';
        var productFeeInfoList = /*[[${entity?.productFeeInfoList}]]*/'';
        var formTodoList = /*[[${formTodoList}]]*/'';
        var CLASSIFICATION_TYPE_01 = /*[[${CLASSIFICATION_TYPE_01}]]*/'';
        var CLASSIFICATION_TYPE_02 = /*[[${CLASSIFICATION_TYPE_02}]]*/'';
        var CLASSIFICATION_TYPE_03 = /*[[${CLASSIFICATION_TYPE_03}]]*/'';
        var profitType01 = /*[[${profitType01}]]*/'';
        var profitType02 = /*[[${profitType02}]]*/'';
        var profitType03 = /*[[${profitType03}]]*/'';
        var getValueByDate = /*[[@{/invest/product/productduration/addreduce/FinProductAddReduce002/getValueByDate}]]*/'';
        var getSaleDepartment = /*[[@{/invest/product/productduration/addreduce/FinProductAddReduce002/getSaleDepartment}]]*/'';
        function comdify(num) {//金额格式转化为"###,###.00"
            return num && (num.toString().indexOf('.') != -1 ? num.toString().replace(/(\d)(?=(\d{3})+\.)/g, function($0, $1) {
                return $1 + ",";
             }) : num.toString().replace(/(\d)(?=(\d{3}))/g, function($0, $1) {
                 return $1 + ",";
             }));
         };
        function zd(){
        	jyfx = $('#sdefault').val();
        	if(jyfx == 'Y' && jyfx != undefined && jyfx != null){
        		qrr = $('#tradeDate').val();
        		jj = $('#prinAmt').val();
        		dqsyl = $('#actCusProfit').val();
        		wyj = $('#sdefaultAmt').val();
        		var bb=JoyinMath.doMinus(JoyinMath.doAdd(jj,dqsyl),wyj,2);
        		var aa=wyj;
        		var s1 = "违约赎回 ：客户违约赎回确认日";
        		var s2 = "，本金";
        		var s3 = "元，利息";
        		var s4 = "元,兑付客户清算金额";
        		var s5 = "元。客户违约赎回违约金";
        		var s6 = "元,违约赎回金入投资管理费。";
        		var a =s1+qrr+s2+comdify(jj)+s3+comdify(dqsyl)+s4+comdify(bb)+s5+comdify(aa)+s6;
        		$("#remark").val(a);
        	}
        	if(jyfx == 'N' && jyfx != undefined && jyfx != null ){
        		zcmc = $('#finprodId').val();
        		var zcmc2=zcmc.substring(4);
        		bj =  $('#prodName').val();
        		qrr = $('#tradeDate').val();
        		jj = $('#prinAmt').val();
        		dqsyl = $('#actCusProfit').val();
        		var aa=JoyinMath.doAdd(jj,dqsyl,2);
        		var s1 = "赎回";
        		var s2 = "正常赎回 ：客户赎回确认日";
        		var s3 = "，本金";
        		var s4 = "元，收益";
        		var s5 = "元,兑付客户清算金额";
        		var s6 = "元";
        		var a =zcmc2+bj+s1+"，"+s2+qrr+s3+comdify(jj)+s4+comdify(dqsyl)+s5+comdify(aa)+s6;
        		$("#remark").val(a);
        	 }
        	}
    </script>
    <script data-th-src="@{/js/invest/product/productduration/addreduce/FinProductAddReduce002.js}" type="text/javascript"></script>
</div>
</body>

</html>
