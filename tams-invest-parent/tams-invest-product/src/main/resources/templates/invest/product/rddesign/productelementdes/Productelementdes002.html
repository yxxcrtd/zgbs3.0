<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{Productelementdes002}">产品要素设计（<span class="star-sign">*</span>必填）<i
								class="iconfont icon-arrow-down pro-down-icon"></i></title>
</head>
<body>
	<div layout:fragment="content">
	<form class="layui-form joyin-form-wrap" id="submitForm">
		<div class="">
			<div class="pro-module-wrapper pro-module-base">
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title">
							<span class="title-des">产品要素设计新建</span>（<span class="star-sign">*</span>必填）<i
								class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
<!--								<div style="display: none">-->
<!--									<input type="text" id="finprodId" name="finprodId" data-th-value="${entity?.finprodId}"/>-->
<!--								</div>-->
<!--								<div style="display: none">-->
<!--									<input type="text" id="profitType" name="profitType" data-th-value="${entity?.profitType}"/>-->
<!--								</div>-->
<!--								<div style="display: none">-->
<!--									<input type="text" id="baseRuleId" name="baseRuleId" data-th-value="${entity?.baseRuleId ?: entity?.bussBenchMarkInfoDto?.baseRuleId}"/>-->
<!--								</div>-->
								<input type="hidden" id="pFinprodId" name="pFinprodId" />
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{Productelementdes001.requirementId}">需求编号</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="requirementId" name="requirementId" required
											   class="layui-input form-input" placeholder="请输入内容"
											   data-th-value="${entity?.requirementId}" disabled="disabled"
											   data-th-placeholder="#{SysCommon.placeholder}" >
										<a id="Productelementdes003_btn_search" class="layui-btn layui-btn-sm">查看</a>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{Productelementdes001.prdDesignId}">产品设计系列编号</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="prdDesignId" name="prdDesignId"
											   class="layui-input form-input"
											   data-th-value="${entity?.prdDesignId}" disabled="disabled"
											   placeholder="请输入内容" required>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{Productelementdes001.prdDesignSerialName}">产品设计系列名称</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="prdDesignSerialName" name="prdDesignSerialName"
                            				   class="layui-input form-input"
											   data-th-value="${entity?.prdDesignSerialName}"
                            				   placeholder="请输入内容" required>
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{Productelementdes001.prdBaseGoal}">产品基本目标</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="prdBaseGoal" name="prdBaseGoal"
											   class="layui-input form-input"
											   data-th-value="${entity?.prdBaseGoal}"
											   placeholder="请输入内容" required>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{Productelementdes001.prdCharater}">产品特点</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="prdCharater" name="prdCharater"
											   class="layui-input form-input"
											   data-th-value="${entity?.prdCharater}"
											   placeholder="请输入内容" required>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{Productelementdes001.raiseType}">募集方式</label>
									<div class="layui-input-inline input-inline">
										<select id="raiseType" name="raiseType" th:data-result="${RAISE_TYPE}"  required class="layui-input form-input input-select"
												data-th-initValue="${entity?.raiseType}"
												data-th-placeholder="#{SysCommon.placeholder}">
										</select>
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{Productelementdes001.investNature}">投资性质</label>
									<div class="layui-input-inline input-inline">
										<select id="investNature" name="investNature" th:data-result="${INVEST_TYPE}"  required class="layui-input form-input input-select"
												data-th-initValue="${entity?.investNature}"
												data-th-placeholder="#{SysCommon.placeholder}">
										</select>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{Productelementdes001.SvrOperatemodeDeclare}">产品运作模式</label>
									<div class="layui-input-inline input-inline">
										<select id="operateMode" name="operateMode" th:data-result="${SVR_OPERATEMODE_DECLARE}"  required class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue="${entity?.operateMode}">
										</select>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{Productelementdes001.SaletargetDeclare}">目标客户类型</label>
									<div class="layui-input-inline input-inline">
										<select id="tarCustomerType" name="tarCustomerType" th:data-result="${SALETARGET_DECLARE}"  required class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue="${entity?.tarCustomerType}">
										</select>
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{Productelementdes001.tarInvestor}">目标投资者</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="tarInvestor" name="tarInvestor"
											   class="layui-input form-input"
											   data-th-value="${entity?.tarInvestor}"
											   placeholder="请输入内容" required>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{Productelementdes001.iskLevel}">产品风险等级</label>
									<div class="layui-input-inline input-inline">
										<select id="rskLevel" name="rskLevel" th:data-result="${RISKLEVEL}"  required class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue="${entity?.rskLevel}">
										</select>
									</div>
								</div>
							    <div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{Productelementdes001.openDescribe}">开放期描述</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="openDescribe" name="openDescribe"
											   class="layui-input form-input"
											   data-th-value="${entity?.openDescribe}"
											   placeholder="请输入内容" required>
									</div>
								</div>
						        </div>
						<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{Productelementdes001.prdTerm}">产品期限</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="prdTerm" name="prdTerm"
											   class="layui-input form-input"
											   data-th-value="${entity?.prdTerm}"
											   placeholder="请输入内容" required>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{Productelementdes001.planIssueDate}">计划发行时间</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="planIssueDate" name="planIssueDate"
											   class="layui-input form-input"
											   data-th-value="${entity?.planIssueDate}"
											   placeholder="请输入内容" required>
									</div>
								</div>


								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{Productelementdes001.planIssueScale}">计划发行量</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="planIssueScale" name="planIssueScale"
											   class="layui-input form-input"
											   data-th-value="${entity?.planIssueScale}"
											   placeholder="请输入内容" required>
									</div>
								</div>
						</div>
						<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{Productelementdes001.saleArea}">销售地区</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="saleArea" name="saleArea"
											   class="layui-input form-input"
											   data-th-value="${entity?.saleArea}"
											   placeholder="请输入内容" required>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{Productelementdes001.baseRuleInfo}">业绩比较基准</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="baseRuleInfo" name="baseRuleInfo"
											   class="layui-input form-input"
											   data-th-value="${entity?.baseRuleInfo}"
											   placeholder="请输入内容" required>
									</div>
								</div>


								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{Productelementdes001.peeRate}">产品费率</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="feeRate" name="feeRate"
											   class="layui-input form-input"
											   data-th-value="${entity?.feeRate}"
											   placeholder="请输入内容" required>
									</div>
								</div>
						</div>
						<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{Productelementdes001.toffStart}">认购起点</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="toffStart" name="toffStart"
											  required class="layui-input form-input"
											   data-th-value="${entity?.toffStart}"
											 placeholder="请输入内容" >
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{Productelementdes001.hugeRedRatto}">巨额赎回比例</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="hugeRedRatio" name="hugeRedRatio"
											   class="layui-input form-input"
											   data-th-value="${entity?.hugeRedRatio}"
											   placeholder="请输入内容" required>
									</div>
								</div>
							<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{Productelementdes002.invAssetRate}">投资资产及比例情况</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="invAssetRate" name="invAssetRate"
											   class="layui-input form-input"
											   data-th-value="${entity?.invAssetRate}"
											   placeholder="请输入内容" required>
									</div>
							</div>

							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{Productelementdes002.intenInvStrategy}">意向投资策略</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="intenInvStrategy" name="intenInvStrategy"
											   class="layui-input form-input"
											   data-th-value="${entity?.intenInvStrategy}"
											   placeholder="请输入内容" required>
								</div>
								</div>
								<input type="text" id="dataStatus" name="dataStatus"
											   data-th-value="${entity?.dataStatus}"
											   placeholder="请输入内容" hidden>

							</div>

					</div>

						</div>
					</div>
				</div>
				<!-- 备注 -->
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title">
							<span class="title-des">备注</span><i
								class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div class="form-inline-wrap" style="width: 100%;">
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{Productelementdes002.remark}" style="width: 11.9%;"> 备注</label>
									<div class="layui-input-inline input-inline" style="width: 80%!important;">
										<textarea id="other" name="other" placeholder="请输入内容"
												  data-th-text="${entity?.other}"
												  data-th-placeholder="#{SysCommon.placeholder}" maxlength="200"
												  class="layui-textarea" >

										</textarea>
									</div>
									<!-- <div class="pro-module">
                               <div class="pro-module-item">
                                   <div class="layui-field-box">
                                       <div class="layui-input-block">
                                       <textarea id="remark" name="remark" placeholder="请输入内容"
                                           data-th-placeholder="#{SysCommon.placeholder}" maxlength="200"
                                           class="layui-textarea" data-th-text="${entity?.remark}">
                                       </textarea>
                                   </div>
                               </div>
                           </div>
                           </div> -->
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>



		<div class="row text-center stepbar" >
			<div class="text-center">
				<a id="Productelementdes002_btn_save"
				   class="layui-btn layui-btn-sm btn-save"
				   data-th-text="#{SysCommon.save}">保存</a> <a
					id="Productelementdes002_btn_submit"
					class="layui-btn layui-btn-sm btn-submit"
					data-th-text="#{SysCommon.submit}">提交</a> <a
					id="Productelementdes002_btn_cancel"
					class="layui-btn layui-btn-sm btn-cancel"
					data-th-text="#{SysCommon.cancel}">取消</a>
			</div>
		</div>
		</form>
	</div>

	<div layout:fragment="script">
		<script th:inline="javascript" type="text/javascript">

        </script>
		<script
				data-th-src="@{/js/invest/product/rddesign/productelementdes/Productelementdes002.js}"></script>
	</div>
</body>

</html>
