<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{TotalMaintain001}">总量/总比例维护</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <div class="">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TotalMaintain001.effDate}">生效日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input class="layui-input form-input input-dateSelect"
                                               id="effDate" name="effDate" required
                                               data-th-value="${entity?.effDate}"
                                               placeholder="请选择时间">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TotalMaintain001.nonStandardLimit}">非标资产总限额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="number" id="nonStandardLimit" name="nonStandardLimit"
                                               class="layui-input form-input"
                                               data-th-value="${entity?.nonStandardLimit}"
                                               placeholder="请输入内容" required>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TotalMaintain001.nonStandardRotio}">非标资产总比例(%)</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="number" id="nonStandardRotio" name="nonStandardRotio"
                                               class="layui-input form-input"
                                               data-th-value="${entity?.nonStandardRotio}"
                                               placeholder="请输入内容" required>
                                    </div>
                                </div>
                            </div>


                        </div>

                    </div>
                </div>
            </div>
        </div>
        <div class="row text-center stepbar">
            <div class="text-center">
                <a id="TotalMaintain002_btn_save"
                   class="layui-btn layui-btn-sm btn-save"
                   data-th-text="#{SysCommon.save}">保存</a> <a
                    id="TotalMaintain002_btn_submit"
                    class="layui-btn layui-btn-sm btn-submit"
                    data-th-text="#{SysCommon.submit}">提交</a> <a
                    id="TotalMaintain002_btn_cancel"
                    class="layui-btn layui-btn-sm btn-cancel"
                    data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <script th:inline="javascript">

    </script>
    <script
            data-th-src="@{/js/invest/product/nolimit/totalMaintain/TotalMaintain002.js}"></script>
</div>
</body>
</html>
