<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title>缴税增值税撤销</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm" style="background: #ffffff; padding: 10px 0;">
        	<input type="hidden" id="portfolioId" name="portfolioId" data-th-value="${portfolioId}" >
        	<input type="hidden" id="portfolioName" name="portfolioName" data-th-value="${portfolioName}" >
            <input type="hidden" id="finprodId" name="finprodId" data-th-value="${finprodId}" >
            <input type="hidden" id="tradeId" name="tradeId" data-th-value="${tradeId}"/> 
            <input type="hidden" id="taxTotal" name="taxTotal" data-th-value="${taxTotal}"/> 
            <input type="hidden" id="profitType" name="profitType" data-th-value="${profitType}"/> 
            <input type="hidden" id="payType" name="payType" data-th-value="${payType}"/> 
            <fieldset class="layui-elem-field layui-field-title" style="margin-top: 1px;">
                <div class="layui-collapse">
                    <div class="layui-colla-item">
                        <h2 class="layui-colla-title">
                            <a href="javascript:;">基本信息</a>
                        </h2>
                        <div class="layui-colla-content layui-show">
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">交易编号</label>
                                    <div class="layui-input-inline input-inline">
                                   		<input type="text" id="totleTradeId" name="totleTradeId"
                                            class="layui-input form-input"  data-th-value="${totleTradeId}" disabled="disabled"/>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">产品代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodMarketId" name="finprodMarketId"
                                            class="layui-input form-input" data-th-value="${finprodMarketId}" disabled="disabled">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">产品名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodAbbr" name="finprodAbbr"
                                            class="layui-input form-input" data-th-value="${finprodAbbr}" disabled="disabled">
                                    </div>
                                </div>
                            </div>
                            
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">增值税品种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="taxClass" name="taxClass" class="layui-input form-input input-select"
                                              data-th-data-result="${TAX_CLASS}" data-th-initvalue="${taxClass?: 01}" disabled="disabled"></select> 
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable" data-th-text="|#{invest.channelId}#{ChannelAsset002.finprodIdBak}|">通道代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="channelId" name="channelId"
                                            class="layui-input form-input" data-th-value="${channelId}" disabled="disabled">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable" data-th-text="|#{invest.channelId}#{ChannelAsset002.finprodNameBak}|">通道名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="channelName" name="channelName"
                                            class="layui-input form-input" data-th-value="${channelName}" disabled="disabled">
                                    </div>
                                </div>
                            </div>
                            
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="taxidenType" name="taxidenType" class="layui-input form-input input-select"
					                          data-th-data-result="${PS}"
					                          data-th-initvalue="${taxidenType?: C12}"
					                          disabled="disabled"
					                          allowClear="true"></select>    
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">纳税日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="seitleDate" name="seitleDate" class="layui-input form-input"
                                            data-th-value="${seitleDate}" disabled="disabled">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">纳税开始日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="vDate" name="vDate" class="layui-input form-input"
                                            data-th-value="${vDate}" disabled="disabled">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">缴税截止日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="mDate" name="mDate" class="layui-input form-input"
                                            data-th-value="${mDate}" disabled="disabled">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">利息收入</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="interestIncome" name="interestIncome" class="layui-input form-input"
                                            data-th-value="${interestIncome}" disabled="disabled">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">红利收入</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="dividendIncome" name="dividendIncome" class="layui-input form-input"
                                            data-th-value="${dividendIncome}" disabled="disabled">
                                    </div>
                                </div>                               
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">价差收入</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="difbetIncome" name="difbetIncome" class="layui-input form-input"
                                            data-th-value="${difbetIncome}" disabled="disabled">
                                    </div>
                                </div>  
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">增值税</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="appreciationTax" name="appreciationTax" class="layui-input form-input"
                                            data-th-value="${appreciationTax}" disabled="disabled">
                                    </div>
                                </div>  
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">城建税附加</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="constructionTax" name="constructionTax" class="layui-input form-input"
                                            data-th-value="${constructionTax}" disabled="disabled">
                                    </div>
                                </div>                                                                 
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">教育税附加</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="educationTax" name="educationTax" class="layui-input form-input"
                                            data-th-value="${educationTax}" disabled="disabled">
                                    </div>
                                </div> 
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">地方教育费附加</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="placeeducationTax" name="placeeducationTax" class="layui-input form-input"
                                            data-th-value="${placeeducationTax}" disabled="disabled">
                                    </div>
                                </div>
                                
                                <div id="waterTrafficTax_div" class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">水利基金附加税</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="waterTrafficTax" name="waterTrafficTax" class="layui-input form-input"
                                            data-th-value="${waterTrafficTax}" disabled="disabled">
                                    </div>
                                </div> 
                                                                                                
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">附加税</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="additionalTax" name="additionalTax" class="layui-input form-input"
                                            data-th-value="${additionalTax}" disabled="disabled">
                                    </div>
                                </div> 
                            </div>  
                        </div>
                    </div>
                </div>
            </fieldset>
              <!-- 划款信息 -->
                <div class="page-component hkxx" id='bussTrdTransferOrder_div' th:data-path="@{/component/trade/BussTrdTransferOrder/init}"th:style="${payType == '02'?'display:none':''}"
                     th:data-params="|{entityName: 'bussTrdTransferOrder', pageFrom: 'submitForm', entity:'${entity_bussTrdTransferOrder}', bizCode:'${totleTradeId}'}|"><!--modify by jiangpeng on 20210513 ZGBSSE-379 -->
                </div>
            <!-- 交易备注 -->
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="title-des" th:text="#{FinproductPayTheVatQuery002.remark}">交易备注</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="layui-form-item">
                                <label class="layui-form-label form-label-wrap" style="width: 7.5%;">　</label>
                                <div class="layui-input-inline input-inline" style="width: 85%!important;">
                                    <textarea name="remark" id= "remark" maxlength="200" th:text="${remark}"
                                              class="layui-textarea" placeholder="请输入内容"
                                              th:placeholder="#{SysCommon.placeholder}" disabled="disabled"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        <div class="layui-col-md11" style="margin: 50px;">
            <div class="text-center">
                <a id="FinproductPayTheVatQuery003_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="FinproductPayTheVatQuery003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
            var isShowWaterTrafficTax = /*[[${isShowWaterTrafficTax}]]*/'N';
            var payType = /*[[${payType}]]*/'';//add by jiangpeng on 20210513 ZGBSSE-379
        </script>
        <script data-th-src="@{/js/invest/product/paythevatquery/PayTheVatQuery003.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
