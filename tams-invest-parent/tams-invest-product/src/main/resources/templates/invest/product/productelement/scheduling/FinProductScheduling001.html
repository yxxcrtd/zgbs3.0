<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinProductScheduling001}">产品排期管理</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="form-button-area">
				<a id="FinProductScheduling001_btn_add"
					class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a>
			</div>
			<div
				class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductScheduling001.finprodMarketId}">产品代码</label>
							<div class="layui-input-inline input-inline">
								<input id="FinProductScheduling001_input_prodId" name="prodId"
									class="layui-input form-input input-lenovoselect"
									allowClear="true" placeholder="请输入内容"
									data-th-data-url="@{/invest/product/productelement/scheduling/FinProductScheduling001/querySchedulingProdInfo}"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-idfield="code" data-keyfield="code"
									data-th-data-effectivefieldsalias='|{"code":"#{FinProductScheduling001.finprodMarketId}","shortName":"#{FinProductScheduling001.finprodAbbr}"}|' />
							</div>
						</div>
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinProductScheduling001.vdate}">起息日</label>
							<div class="layui-input-inline input-inline">
								<input id='FinProductScheduling001_date_vdate' name='vdate'
									class="layui-input form-input input-dateRangeSelect"
									placeholder="请选择时间区间"
									data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
					</div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script
			data-th-src="@{/js/invest/product/productelement/scheduling/FinProductScheduling001.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
