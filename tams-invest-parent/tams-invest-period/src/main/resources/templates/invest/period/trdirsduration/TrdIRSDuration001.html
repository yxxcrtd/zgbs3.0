<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{[#pageId]}">[#title]</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a id="TrdIRSDuration001_btn_psIntPlan" class="layui-btn layui-btn-sm"><i class="iconfont icon-tiaozheng"></i><span data-th-text="#{TrdIRSDuration001.psIntPlan}">收付息计划</span></a>
        <a id="TrdIRSDuration001_btn_beforeEnd" class="layui-btn layui-btn-sm"><i class="iconfont icon-tiaozheng"></i><span data-th-text="#{TrdIRSDuration001.beforeEnd}">提前终止</span></a>
        <a id="TrdIRSDuration001_btn_revoke" class="layui-btn layui-btn-sm"><i class="iconfont icon-revoke"></i><span data-th-text="#{pingan.common.revoke}">撤销</span></a>
    </div>

    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TrdIRSDuration001.busiCode}">业务编号</label>
                    <div class="layui-input-inline input-inline">
                        <select id="busiCode" name="busiCode" formatoption="false"
                                class="layui-input form-input input-select"
                                data-th-data-url="@{/invest/period/trdirsduration/TrdIRSDuration001/getBusiCode}"
                                allowClear="true" placeholder="请输入内容" >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TrdIRSDuration001.portfolioId}">组合代码</label>
                    <div class="layui-input-inline input-inline">
                        <select id="portfolioId" name="portfolioId" multiple
                                class="layui-input form-input input-select"
                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId}"
                                allowClear="true" placeholder="请输入内容" >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TrdIRSDuration001.finprodId}">交易编号</label>
                    <div class="layui-input-inline input-inline">
                        <select id="finprodId" name="finprodId" formatoption="false"
                                class="layui-input form-input input-select"
                                data-th-data-url="@{/invest/period/trdirsduration/TrdIRSDuration001/getTradeId}"
                                allowClear="true" placeholder="请输入内容" >
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TrdIRSDuration001.pridBussType}">业务类型</label>
                    <div class="layui-input-inline input-inline">
                        <select id="pridBussType" name="pridBussType" class="layui-input form-input input-select"
                                data-th-data-result='${IRS_DUR_TYPE}' allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TrdIRSDuration001.irsPsIntType}">收付息类型</label>
                    <div class="layui-input-inline input-inline">
                        <select id="irsPsIntType" name="irsPsIntType" class="layui-input form-input input-select"
                                data-th-data-result='${IRS_PS_INT_TYPE}' allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TrdIRSDuration001.statusValid}">有效状态</label>
                    <div class="layui-input-inline input-inline">
                        <select id="statusValid" name="statusValid" class="layui-input form-input input-select"
                                multiple="true" data-th-data-result='${PAGE_DATA_STATUS}'
                                allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TrdIRSDuration001.vdate}">起息日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="vdate" name="vdate" class="layui-input form-input input-dateRangeSelect" />
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TrdIRSDuration001.payDate}">支付日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="payDate" name="payDate" class="layui-input form-input input-dateRangeSelect" />
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TrdIRSDuration001.mdate}">到期日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="mdate" name="mdate" class="layui-input form-input input-dateRangeSelect" />
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/period/trdirsduration/TrdIRSDuration001.js}" type="text/javascript"></script>
</div>
</body>

</html>
