<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{TrdQueryDuration001}">存续期交易查询</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="form-button-area">
			</div>
			<div class="joyin-form-wrap joyin-filter-form condition-area">
				<form class="layui-form" id="TrdQueryDuration001_searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{TrdQueryDuration001.finprodType2}">资产类型</label>
							<div class="layui-input-inline input-inline">
								<select id="TrdQueryDuration001_finprodType2" name="finprodType2"
										class="layui-input form-input input-select"  multiple="true"
										data-th-data-result='${PINAN_ASSET_TYPE}' allowClear="true"
										placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}" >
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{TrdQueryDuration001.cashType}">业务类型</label>
							<div class="layui-input-inline input-inline">
								<select id="TrdQueryDuration001_cashType" name="cashType"
										class="layui-input form-input input-select"
										data-th-data-result='${PINAN_BUSINESS_TYPE}'
										allowClear="true" placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{TrdQueryDuration001.tradeDate}">资金到账日</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="TrdQueryDuration001_tradeDate"  name="tradeDate" class="layui-input form-input input-dateRangeSelect" data-th-value="${platDate}" />
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{TrdQueryDuration001.secAcctId}">证券账户</label>
							<div class="layui-input-inline input-inline">
								<select id="TrdQueryDuration001_secManageAcctId" name="secManageAcctId"
										class="layui-input form-input input-select"
										data-th-data-url="@{/invest/period/trdbondduration/TrdBondDuration001/getSecManageAcctId}"
										allowClear="true" placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{TrdQueryDuration001.finprodMarketId}">资产代码</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="TrdQueryDuration001_finprodMarketId" name="finprodMarketId"
									   class="layui-input form-input input-lenovoselect" maxlength="32"
									   data-th-data-url="@{/invest/asset/common/getAssetId}"
									   data-idfield="code"
									   data-th-data-effectivefieldsalias='|{"code":"#{TrdQueryDuration001.finprodMarketId}",
										"shortName":"#{TrdQueryDuration001.finprodAbbr}"}|'
									   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
							</div>
						</div>
						<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{TrdQueryDuration001.statusValid}">有效状态</label>
							<div class="layui-input-inline input-inline">
								<select id="TrdQueryDuration001_statusValid" name="statusValid" 
									class="layui-input form-input input-select"
									data-th-data-result ='${PAGE_DATA_STATUS}'
									placeholder="请输入内容">
								</select>	
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{TrdQueryDuration001.portfolioId}">组合代码</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="TrdQueryDuration001_portfolioId" name="portfolioId"
										class="layui-input form-input input-select" placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}" multiple="true"
										data-th-data-url="@{/invest/period/trdqueryduration/TrdQueryDuration001/getPortfolioIds}">
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" data-th-text="#{invest.channelId}">合作资产</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="TrdQueryDuration001_chlId" name="chlId"
										class="layui-input form-input input-select" allowClear="true"
										data-th-placeholder="#{SysCommon.placeholder}" formatoption="true"
										data-th-data-url="@{/component/trade/BussChannelCommon/getChannelId}"
										data-th-initvalue="${entity?.chlId}">
								</select>
							</div>
						</div>
					</div>
				</form>
			</div>
			<div>
				 <table class="layui-table" id="dataTable"></table>
			</div>
	</div>
</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
		var PINAN_ASSET_TYPE_F01 = /*[[${PINAN_ASSET_TYPE_F01}]]*/'';
        var PINAN_ASSET_TYPE_F02 = /*[[${PINAN_ASSET_TYPE_F02}]]*/'';
        var PINAN_ASSET_TYPE_F03 = /*[[${PINAN_ASSET_TYPE_F03}]]*/'';
        var PINAN_ASSET_TYPE_F04 = /*[[${PINAN_ASSET_TYPE_F04}]]*/'';
        var PINAN_ASSET_TYPE_F05 = /*[[${PINAN_ASSET_TYPE_F05}]]*/'';
        var PINAN_ASSET_TYPE_F06 = /*[[${PINAN_ASSET_TYPE_F06}]]*/'';
        var PINAN_ASSET_TYPE_F07 = /*[[${PINAN_ASSET_TYPE_F07}]]*/'';
        var PINAN_ASSET_TYPE_F08 = /*[[${PINAN_ASSET_TYPE_F08}]]*/'';
		var PINAN_ASSET_TYPE_F09 = /*[[${PINAN_ASSET_TYPE_F09}]]*/'';
        var PINAN_ASSET_TYPE_F10 = /*[[${PINAN_ASSET_TYPE_F10}]]*/'';
        var PINAN_ASSET_TYPE_F11 = /*[[${PINAN_ASSET_TYPE_F11}]]*/'';
        var PINAN_ASSET_TYPE_F12 = /*[[${PINAN_ASSET_TYPE_F12}]]*/'';
        var PINAN_ASSET_TYPE_F13 = /*[[${PINAN_ASSET_TYPE_F13}]]*/'';
        var PINAN_ASSET_TYPE_F14 = /*[[${PINAN_ASSET_TYPE_F14}]]*/'';
        var PINAN_ASSET_TYPE_F15 = /*[[${PINAN_ASSET_TYPE_F15}]]*/'';
        var PINAN_ASSET_TYPE_F16 = /*[[${PINAN_ASSET_TYPE_F16}]]*/'';
        var PINAN_ASSET_TYPE_F17 = /*[[${PINAN_ASSET_TYPE_F17}]]*/'';
        var PINAN_ASSET_TYPE_F18 = /*[[${PINAN_ASSET_TYPE_F18}]]*/'';
        var IRS_TYPE = /*[[${IRS_TYPE}]]*/'IRS_TYPE';
        var CHANCLE_STATUS =/*[[${CHANCLE_STATUS}]]*/''; 
        var DEPO_ASSET_TYPE_03 =/*[[${DEPO_ASSET_TYPE_03}]]*/'';
        var FUND_DEAL_TYPE =/*[[${FUND_DEAL_TYPE}]]*/'';
        </script>
		<script data-th-src="@{/js/invest/period/trdqueryduration/TrdQueryDuration001.js}"></script>
	</div>
</body>
</html>
