<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{[#pageId]}">[#title]</title>
    <style>
        .form-one-col {
            width: 20%;
        }

        .input-one-col {
            width: 66% !important;
        }

        .input-one-col .form-input {
            height: 28px;
            line-height: 28px;
        }

        .input-one-col .select2-selection--single {
            height: 28px;
            line-height: 28px;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
        <div class="layui-form-item">
            <label class="layui-form-label form-label-wrap form-one-col">项目类型</label>
            <div class="layui-input-inline input-inline input-one-col">
                <select id="assetType" name="assetType"
                        class="layui-input form-input input-select"
                        data-th-childrenIds="assetId"
                        data-th-initValue="${entity?.assetType}"
                        data-th-data-result='${ASSET_TYPE_PROJECT}'
                        allowClear="false" placeholder="请输入内容"
                        data-th-placeholder="#{SysCommon.placeholder}">
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label form-label-wrap form-one-col">资产代码</label>
            <div class="layui-input-inline input-inline input-one-col">
                <select id="assetId" name="assetId"
                        class="layui-input form-input input-select"
                        data-th-parentIds="assetType"
                        data-th-formatoption="false"
                        data-th-initValue="${entity?.assetId}"
                        data-th-data-url="@{/invest/period/trdprojbuyoff/TrdProjectBuyOffInterest001/getProjAssetId}"
                        allowClear="true" placeholder="请输入内容"
                        data-th-placeholder="#{SysCommon.placeholder}">
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label form-label-wrap form-one-col">资产名称</label>
            <div class="layui-input-inline input-inline input-one-col">
                <input type="text" id="assetName" name="assetName" data-th-value="${entity?.assetName}" class="layui-input form-input" disabled/>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label form-label-wrap form-one-col">生效日期</label>
            <div class="layui-input-inline input-inline input-one-col">
                <input type="text" id="effDate" name="effDate" data-th-value="${entity?.effDate?:sysDate}" class="layui-input form-input input-dateSelect"/>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label form-label-wrap form-one-col">买断利率(%)</label>
            <div class="layui-input-inline input-inline input-one-col">
                <input type="text" id="rate" name="rate" data-th-value="${entity?.rate}" data-th-maxlength="11"
                       class="layui-input form-input text-number" data-th-data-textrange="8"/>
            </div>
        </div>
        <div class="layui-form-item" align="center" style="margin: 30px 0">
            <a id="TrdProjectBuyOffInterest002_btn_submit" class="layui-btn layui-btn-sm  btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="TrdProjectBuyOffInterest002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel" data-th-text="#{SysCommon.cancel}">关闭</a>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
    </script>
    <script data-th-src="@{/js/invest/period/trdprojbuyoff/TrdProjectBuyOffInterest002.js}" type="text/javascript"></script>
</div>
</body>
</html>
