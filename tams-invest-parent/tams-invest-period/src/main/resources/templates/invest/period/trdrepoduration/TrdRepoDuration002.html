<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{[#pageId]}">[#title]</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">基本信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" >业务编号</label>
                                       <div class="layui-input-inline input-inline">
                                        <input type="hidden" name="secManageAcctId" data-th-value="${entity?.secManageAcctId}"/>
                                        <input type="hidden" name="pstype" data-th-value="${bustype}"/>
                                        <input type="hidden" id="isPayWithTrade" name="isPayWithTrade" data-th-value="${isPayWithTrade}"/>
                                        <input type="hidden" id="ieFlag" name="ieFlag" data-th-value="${entity?.ieFlag}"/>
                                        <input type="hidden" id="mpayDate" name="mpayDate" data-th-value="${entity?.mpayDate}"/>
                                        <input type="text" id="busiCode" name="busiCode" data-th-value="${entity?.busiCode}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">原始交易编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodId" name="finprodId" data-th-value="${entity?.finprodId}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">组合名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" id="portfolioId" name="portfolioId" data-th-value="${entity?.portfolioId}">
                                        <input type="hidden" id="actPortfolioId" name="actPortfolioId" data-th-value="${entity?.actPortfolioId}">
                                        <input type="text" id="portfolioName" name="portfolioName" data-th-value="${entity?.portfolioName}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交易方向</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" name="finprodType2" data-th-value="${entity?.finprodType2}"/>
                                        <input type="text" id="finprodType2String" name="finprodType2String"
                                               data-th-value="${entity?.finprodType2String}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交易日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeDate" name="tradeDate" data-th-value="${entity?.tradeDate}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">起息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="vDate" name="vDate" data-th-value="${entity?.vDate}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">到期日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="mDate" name="mDate" data-th-value="${entity?.mDate}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">回购期限</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="term" name="term" data-th-value="${entity?.term}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">本金金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="theoryPrin" name="theoryPrin" data-th-value="${entity?.theoryPrin}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">回购利率(%)</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="intRate" name="intRate" data-th-value="${entity?.intRate}" data-textrange="4" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">计息基础</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="basis" name="basis" data-th-value="${entity?.basis}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select formatoption="true" type="text" id="ccy" name="ccy"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${CCY}' allowClear="true"
                                                data-th-initValue="${entity?.ccy?:CCY_default}" disabled>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">回购利息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="theoryInt" name="theoryInt" data-th-value="${entity?.theoryInt}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交易对手</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" id="counterId" name="counterId" data-th-value="${entity?.counterId}">
                                        <input type="text" id="counterName" name="counterName" data-th-value="${entity?.counterName}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">对手方交易员</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="counterTrader" name="counterTrader" data-th-value="${entity?.counterTrader}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" id="repoTypeDiv">
                                    <label class="layui-form-label form-label-wrap">回购类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" id="type6" name="type6" data-th-value="${entity?.type6}">
                                        <input type="text" id="type6String" name="type6String" data-th-value="${entity?.type6String}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交易场所</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" id="tradeMarket" name="tradeMarket" data-th-value="${entity?.tradeMarket}">
                                        <input type="text" id="tradeMarketString" name="tradeMarketString" data-th-value="${entity?.tradeMarketString}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">本方交易员</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="trader" name="trader" data-th-value="${entity?.trader}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">到期结算金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="fpriceAmt" name="fpriceAmt" data-th-value="${entity?.fpriceAmt}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">资金到账日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" required id="settleDate" name="settleDate" data-th-value="${entity?.settleDate}" class="layui-input form-input input-dateSelect"/>
                                    </div>
                                </div>
                                <!-- 通道交易 新增 强成西 2019/03/26 start -->
                                    <div class="form-inline-wrap" id="chlId_div">
                                    <label class="layui-form-label form-lable" data-th-text="#{invest.channelId}">通道</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="chlId" name="chlId"  class="layui-input form-input input-select" allowClear="false" formatoption="true"
                                                    data-th-data-url="@{/component/trade/BussChannelCommon/getChannelIdAndCollectType}" disabled data-th-initvalue="${entity?.chlId}">
                                            </select>
                                        </div>
                                    </div>
                                <!-- 通道交易 新增 强成西 2019/03/26 end -->
                            </div>
                            <div class="layui-form-item" th:if="${type eq PS_TQZZ}">

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">提前终止利率%</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="terminateRate" name="terminateRate" data-textrange="4" data-th-value="${entity?.terminateRate}" class="layui-input form-input text-number"/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">终止日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="deadDate" name="deadDate" data-th-value="${entity?.deadDate}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item" th:if="${type eq PS_YQFS}">

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">罚息金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="penaltyIntamt" name="penaltyIntamt" data-textrange="2" data-th-value="${entity?.penaltyIntamt}" class="layui-input form-input text-number"/>
                                    </div>
                                </div>
<!--                                <div class="form-inline-wrap">-->
<!--                                    <label class="layui-form-label form-label-wrap">实际结算金额</label>-->
<!--                                    <div class="layui-input-inline input-inline">-->
<!--                                        <input type="text" id="actTradeAmt" name="actTradeAmt" data-textrange="2" data-th-value="${entity?.tradeAmt}" class="layui-input form-input text-number"/>-->
<!--                                    </div>-->
<!--                                </div>-->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交易结算费</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="actTradeFee" name="actTradeFee" data-textrange="2" data-th-value="${entity?.actTradeFee}" class="layui-input form-input text-number"/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" id="channelFee_div" style="display: none">
                                    <label class="layui-form-label form-label-wrap" data-th-text="|#{invest.channelId}#{TrdDepoDuration002.channelFee}|">通道费</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="channelFee" name="channelFee" data-th-value="${entity?.channelFee}" class="layui-input form-input text-number"/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="ps" name="ps"  class="layui-input form-input input-select" allowClear="false" formatoption="true"
                                                th:data-result="${PS}" disabled data-th-initvalue="${type}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">实际结算金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeAmt" name="tradeAmt" data-th-value="${entity?.tradeAmt}" class="layui-input form-input text-number"/>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pro-module-wrap"  id = "endInfoTable_div" style="display: none">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">续做信息</span><i
                                class="iconfont icon-arrow-dowmDatexn pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">续做期限</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="termex" name="termex" data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.termex}"
                                               class="layui-input form-input" />
                                         <span class="input-right-show">天</span>
                                    </div>
                                </div>
                                 <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">续做期限品种</label>
                                    <div class="layui-input-inline input-inline" id="termTypeRebackDiv">
										<select type="text" id="termTypeReback" name="termTypeReback"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${TERM_TYPE_REBACK}'
                                                data-th-initvalue="${entity?.termTypeReback}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">续做到期日</label>
                                    <div class="layui-input-inline input-inline" data-th-placeholder="#{SysCommon.placeholder}">
                                        <input required type="text" id="mDatex" name="mDatex" data-th-value="${entity?.mDatex}"
                                               class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">续做本金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="theoryPrinex" name="theoryPrinex"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.theoryPrinex}"
                                               class="layui-input form-input text-number" />
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">续做利率(%)</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="intRatex" name="intRatex" th:placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.intRatex}"
                                               data-textrange="4" class="layui-input form-input text-number" />
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">续做利息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="theoryIntex" name="theoryIntex" data-th-value="${entity?.theoryIntex}"
                                               class="layui-input form-input text-number" />
                                    </div>
                                </div>

                            </div>
                            <div class="layui-form-item">
                                     <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">续做到期结算金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input required type="text" id="tradeAmtex" name="tradeAmtex"
                                                   data-th-value="${entity?.tradeAmtex}"
                                                   class="layui-input form-input text-number" disabled/>
                                        </div>
                                    </div>
                                   <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">佣金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="commissionAmt" name="commissionAmt"
                                               data-th-value="${entity?.commissionAmt}"
                                               class="layui-input form-input text-number"/>
                                    </div>
                                </div>
                                    <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">结算金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input required type="text" id="setAmt" name="setAmt"  data-th-value="${entity?.setAmt}"
                                                   class="layui-input form-input text-number " disabled
                                                   allowClear="false" formatoption="true"
                                                    >
                                        </div>
                                    </div>

                               </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">续做对手</label>
                                    <div class="layui-input-inline input-inline">
                                         <select required type="text" id="counterIdex" name="counterIdex"
                                                 class="layui-input form-input input-select" placeholder="请输入内容"
                                                 th:placeholder="#{SysCommon.placeholder}"
                                                 th:data-url="@{/component/trade/TrdInvestPersonInfo002/selectCounterId?innerTrade=false}"
                                                 allowClear="true"
                                                 formatoption="true"
                                                 th:initValue="${entity?.counterIdex}">
                                        </select>

                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">续做对手方交易员</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="counterTraderx" name="counterTraderx"
                                               data-th-value="${entity?.counterTraderx}" class="layui-input form-input" />
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">联系方式</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="counterContact" name="counterContact"
                                               data-th-value="${entity?.counterContact}" class="layui-input form-input" />
                                    </div>
                                </div>

                            </div>

                            <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" th:placeholder="#{SysCommon.placeholder}">续做交易员</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="traderx" name="traderx" data-th-value="${entity?.traderx}"
                                               class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" id="chaneFee_div" style="display: none">
                                    <label class="layui-form-label form-label-wrap" data-th-text="|#{invest.channelId}#{TrdDepoDuration002.channelFee}|">通道费</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="chaneFee" name="chaneFee"
                                               data-th-value="${entity?.chaneFee}"
                                               class="layui-input form-input text-number"/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                            </div>
                        </div>
                    </div>
                </div>


                <div class="pro-module-wrap" id = "repoInfoTable_div">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">质押券信息</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <table class="layui-table" id="repoInfoTable"></table>
                        </div>
                    </div>
                </div>
                <!-- 划款信息 -->
                <div class="page-component" th:data-path="@{/component/trade/BussTrdTransferOrder/init}" th:style="${GEN_PAY_ORDERS_AUTO == '01'?'display:none':''}"
                     th:data-params="|{entityName: 'bussTrdTransferOrder', statusValid: '${entity?.statusValid}',bizCode:'${bizCode}',pageFrom: 'informationForm', entity:'${entity_bussTrdTransferOrderDto}'}|"></div>
            </div>
            <!-- add by zhangpuyu 2019/10/30 start -->
            <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                 th:data-params="|{entityName: 'uploadFileList', businessId: '${tradeId ?: ''}'}|"></div>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"
                        style="border-top: 1px solid #ccc;">
                        <span class="title-des" th:text="#{TrdFundDuration001.remark}">备注</span><i
                            class="iconfont icon-arrow-down pro-down-icon"
                    ></i>
                    </h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap"
                                 style="width: 100%;">
                                <div class="layui-input-inline input-inline"
                                     style="margin:0 10px;width: 98% !important;">
                                            <textarea id="remark" name="remark" type="text"
                                                      maxlength="200"
                                                      class="layui-input layui-textarea"
                                                      placeholder="请输入内容"
                                                      th:text="${entity?.remark}"
                                                      data-th-placeholder="#{SysCommon.placeholder}"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
            <!-- add by zhangpuyu 2019/10/30 end -->
        </div>

        <div class="layui-form-item" align="center">
            <a id="TrdRepoDuration002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="TrdRepoDuration002_btn_submit" class="layui-btn layui-btn-sm  btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="TrdRepoDuration002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var finprodId = /*[[${entity?.finprodId}]]*/'';
        var portfolioId = /*[[${entity?.portfolioId}]]*/'';
        var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'';
        var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
        var dealString = /*[[${deal}]]*/'';
