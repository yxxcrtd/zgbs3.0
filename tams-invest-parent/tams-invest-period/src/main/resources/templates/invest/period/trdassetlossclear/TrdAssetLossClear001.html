<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{TrdAssetLossClear001}">资产减值清理</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div
				class="layui-col-md12 layui-col-sm12 layui-col-lg12 layui-col-xs12 form-button-area"
				style="margin: 10px;">
				<a id="TrdAssetLossClear001_btn_add"
					class="layui-btn layui-btn-sm btn-create">新建</a> <a
					id="TrdAssetLossClear001_btn_revoke"
					class="layui-btn layui-btn-sm btn-revoke"><i
					class="iconfont icon-revoke"></i><span
					data-th-text="#{SysCommon.revoke}"></a>
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								data-th-text="#{TrdAssetLossClear001.finprodId}">资产代码</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="finprodMarketId" name="finprodMarketId"
									class="layui-input form-input input-select" allowClear="true"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									formatoption="true"
									data-th-data-url="@{/invest/period/trdassetlossclear/TrdAssetLossClear001/getFinprodMarketId}"
									data-th-value='${finprodMarketId}'>
								</select>
							</div>
						</div>
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{TrdAssetLossClear001.tradeDate}">清理日期</label>
							<div class="layui-input-inline input-inline">
								<input id='clearDate' name='clearDate'
									class="layui-input form-input input-dateRangeSelect"
									placeholder="请选择、支持区间"
									data-th-placeholder="#{SysCommon.dateInterval}"
									data-th-value='${clearDate}'>
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4"
							style="visibility: hidden;">
							<label class="layui-form-label form-lable">资产代码</label>
						</div>
					</div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script th:inline="javascript" type="text/javascript">
			var workflowId = /*[[${workflowId}]]*/'';
			var totleTradeId = /*[[${totleTradeId}]]*/'';
			var finprodMarketId = /*[[${finprodMarketId}]]*/'';
			var clearDate = /*[[${clearDate}]]*/'';
		</script>
		<script
			data-th-src="@{/js/invest/period/trdassetlossclear/TrdAssetLossClear001.js}"
			type="text/javascript">
        </script>
	</div>
</body>
</html>
