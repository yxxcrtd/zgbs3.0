<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{TrdLendDuration002}">拆借到期确认</title>
</head>
<body>
    <div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-container">
                <div class="pro-module-wrapper pro-module-base">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">基本信息</span><i
                                    class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div
                                        class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{TrdLendDuration001.busiCode}">业务编号</label>
                                        <input type="hidden" id="busiCode" name="busiCode" data-th-value="${entity?.busiCode}" class="layui-input form-input" />
                                        <input type="hidden" id="bankLendingType" name="bankLendingType" data-th-value="${entity?.bankLendingType}" class="layui-input form-input" />
                                        <input type="hidden" id="totleTradeId" name="totleTradeId" data-th-value="${entity?.totleTradeId}" class="layui-input form-input" />
                                        <input type="hidden" id="pTradeId" name="pTradeId" data-th-value="${entity?.pTradeId}" class="layui-input form-input" />
                                        <input type="hidden" id="mode" name="mode" data-th-value="${entity?.mode}" class="layui-input form-input" />
                                        <div class="layui-input-inline input-inline">
                                            <input disabled type="text" id="finprodId" name="finprodId"
                                                class="layui-input form-input" maxlength="32"
                                                placeholder="请输入内容" th:value="${entity?.finprodId}"
                                                data-th-placeholder="#{SysCommon.placeholder}" />
                                        </div>
                                    </div>
                                    <div
                                        class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{TrdLendDuration001.portfolioName}">组合名称</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="hidden" id="portfolioId" name="portfolioId" data-th-value="${entity?.portfolioId}" class="layui-input form-input" />
                                            <select disabled id="actPortfolioId" name="actPortfolioId" allowClear="true"
                                                class="layui-input form-input input-select"
                                                th:initValue="${entity?.actPortfolioId}"
                                                data-th-data-url="@{/invest/period/trdlendduration/TrdLendDuration001/getPortfolioId}"
                                                placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                            </select>
                                        </div>
                                    </div>
                                    <div
                                        class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{TrdLendDuration001.ccy}">币种</label>
                                        <div class="layui-input-inline input-inline">
                                            <select disabled id="ccy" name="ccy" allowClear="true"
                                                class="layui-input form-input input-select"
                                                data-th-data-result="${CCY}" placeholder="请输入内容"
                                                th:initValue="${entity?.ccy?:CCY_default}"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div
                                        class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                        <input style="display:none" type="text"
                                                id="ps"
                                                name="ps"
                                                data-th-value="${entity.ps}"
                                                class="layui-input form-input"
                                                />
                                        <input style="display:none" type="text"
                                                id="finprodType2"
                                                name="finprodType2"
                                                data-th-value="${entity.finprodType2}"
                                                class="layui-input form-input"
                                                />
                                         <input style="display:none" type="text"
                                                id="paBussType"
                                                name="paBussType"
                                                data-th-value="${entity.paBussType}"
                                                class="layui-input form-input"
                                                />
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{TrdLendDuration001.ps}">交易方向</label>
                                        <div class="layui-input-inline input-inline">
                                            <input disabled type="text" id="pingAnCodeSin" name="pingAnCodeSin"
                                                class="layui-input form-input input-checkbox"
                                                data-th-data-result='${BACK_LEND_DIRECTION}' th:initValue="${entity.pingAnCodeSin}">
                                        </div>
                                    </div>
                                    <div
                                        class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{TrdLendDuration001.tradeDate}">交易日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input disabled id='tradeDate' name='tradeDate'
                                                class="layui-input form-input input-dateSelect"
                                                th:value="${#dates.format(entity?.tradeDate,'yyyy-MM-dd')}"
                                                placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                    <div
                                        class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{TrdLendDuration001.vdate}">起息日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input disabled id='vdate' name='vdate'
                                                class="layui-input form-input input-dateSelect"
                                                th:value="${#dates.format(entity?.vdate,'yyyy-MM-dd')}"
                                                placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div
                                        class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{TrdLendDuration001.mdate}">到期日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input disabled id='mdate' name='mdate'
                                                th:value="${#dates.format(entity?.mdate,'yyyy-MM-dd')}"
                                                class="layui-input form-input input-dateSelect"
                                                placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                    <div
                                        class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{TrdLendDuration001.basis}">计息基础</label>
                                        <div class="layui-input-inline input-inline">
                                            <select disabled id="basis" name="basis" allowClear="true"
                                                class="layui-input form-input input-select"
                                                data-th-data-result="${BASIS}" placeholder="请输入内容"
                                                th:initValue="${entity?.basis}"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                            </select>
                                        </div>
                                    </div>
                                    <div
                                        class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{TrdLendDuration001.settleDate}">资金到账日</label>
                                        <div class="layui-input-inline input-inline">
                                           <!-- 资金到账日处理 -->
                                            <input id='settleDate' name='settleDate'
                                                th:disabled = "${#dates.format(entity?.settleDate,'yyyy-MM-dd') ne platDate and entity.settleDate ne null}"
                                                th:value="${entity.settleDate eq null ? platDate : #dates.format(entity?.settleDate,'yyyy-MM-dd')}"
                                                class="layui-input form-input input-dateSelect"
                                                placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div
                                        class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{TrdLendDuration001.prinAmt}">本金金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input disabled type="text" id="prinAmt" name="prinAmt"
                                                placeholder="请输入内容" data-pattern=""
                                                th:value="${entity?.prinAmt}" data-fixtype="2"
                                                class="layui-input form-input text-number">
                                        </div>
                                    </div>
                                    <div
                                        class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{TrdLendDuration001.intRate}">利率</label>
                                        <div class="layui-input-inline input-inline">
                                            <input disabled type="text" id="intRate" name="intRate"
                                                placeholder="请输入内容" data-pattern=""
                                                th:value="${entity?.intRate ?:0}" data-fixtype="2" data-textrange="4"
                                                class="layui-input form-input text-number">
                                        </div>
                                    </div>
                                    <div
                                        class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{TrdLendDuration001.intAmt}">应计利息</label>
                                        <div class="layui-input-inline input-inline">
                                            <input disabled type="text" id="intAmt" name="intAmt"
                                                placeholder="请输入内容" data-pattern=""
                                                th:value="${entity?.intAmt}" data-fixtype="2"
                                                class="layui-input form-input text-number">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div
                                        class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{TrdLendDuration001.theoryAmt}">到期本息和</label>
                                        <div class="layui-input-inline input-inline">
                                            <input disabled type="text" id="theoryAmt" name="theoryAmt"
                                                placeholder="请输入内容" data-pattern=""
                                                th:value="${entity?.theoryAmt}" data-fixtype="2"
                                                class="layui-input form-input text-number">
                                        </div>
                                    </div>
                                    <div
                                        class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{TrdLendDuration001.counterId}">交易对手</label>
                                        <div class="layui-input-inline input-inline">
                                            <select disabled required th:id="counterId" th:name="counterId"
                                                    th:data-url="@{/invest/period/trdlendduration/TrdLendDuration001/getCounterId}" formatOption="false"
                                                    th:initValue="${entity?.counterId}" class="layui-input form-input input-select"
                                                    th:placeholder="#{SysCommon.placeholder}">
                                            </select>
                                        </div>
                                    </div>
                                    <div
                                        class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{TrdLendDuration001.trader}">本方交易员</label>
                                        <div class="layui-input-inline input-inline">
                                            <input disabled type="text" id="trader" name="trader"
                                                class="layui-input form-input" th:value="${entity?.trader}"
                                                placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" />
                                        </div>
                                    </div>
                                </div>

                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{EtrLendSpecInfo002.tradeMarket}">交易场所</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="tradeMarket" name="tradeMarket"
                                                    class="layui-input form-input input-select" placeholder="请输入内容" disabled
                                                    data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${TRADE_PLACE}'
                                                    allowClear="true" formatoption="true" data-th-initvalue="${entity?.tradeMarket}"></select>
                                        </div>
                                    </div>
                                    <div th:if = "${BACK_LEND_DIRECTION_CR eq entity.pingAnCodeSin}" class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{TrdLendDuration001.tradeAmt}">实付本息和</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="tradeAmt" name="tradeAmt"
                                                placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                                th:value="${entity?.tradeAmt}"
                                                class="layui-input form-input text-number">
                                        </div>
                                    </div>
                                    <div th:if = "${BACK_LEND_DIRECTION_CC eq entity.pingAnCodeSin}"
                                        class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{TrdLendDuration001.actRecPrincipa}">实收本息和</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="actRecPrincipa" name="tradeAmt"
                                                placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                                th:value="${entity?.tradeAmt}"
                                                class="layui-input form-input text-number">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                   <!-- 划款信息 -->
            <div class="page-component" th:data-path="@{/component/trade/BussTrdTransferOrder/init}"
                 th:data-params="|{entityName: 'bussTrdTransferOrder', pageFrom: 'submitForm', entity:'${entity_bussTrdTransferOrderDto}', bizCode:'${entity?.busiCode}'}|"></div>
                <!-- 附件信息 -->
            <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                th:data-params="|{entityName: 'uploadFileList', businessId: '${totleTradeId ?: ''}'}|"></div>
                    <!-- add by zhangpuyu 2019/10/30 start -->
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title"
                                style="border-top: 1px solid #ccc;">
                                <span class="title-des" th:text="#{TrdFundDuration001.remark}">备注</span><i
                                    class="iconfont icon-arrow-down pro-down-icon"
                            ></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap"
                                         style="width: 100%;">
                                        <div class="layui-input-inline input-inline"
                                             style="margin:0 10px;width: 98% !important;">
                                            <textarea id="remark" name="remark" type="text"
                                                      maxlength="200"
                                                      class="layui-input layui-textarea"
                                                      placeholder="请输入内容"
                                                      th:text="${entity?.remark}"
                                                      data-th-placeholder="#{SysCommon.placeholder}"></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- add by zhangpuyu 2019/10/30 end -->
                </div>
            </div>
            <div class="layui-form-item" align="center">
            <a id="TrdLendDuration002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="TrdLendDuration002_btn_submit" class="layui-btn layui-btn-sm  btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="TrdLendDuration002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
        </form>
    </div>
    </div>
    <div layout:fragment="script">
        <script th:inline="javascript" type="text/javascript">
        var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'';
        var GEN_PAY_ORDERS_AUTO= /*[[${GEN_PAY_ORDERS_AUTO}]]*/''; // 系统参数_是否显示划款指令
        var BACK_LEND_DIRECTION_01= /*[[${BACK_LEND_DIRECTION_01}]]*/'';
        var BACK_LEND_DIRECTION_02= /*[[${BACK_LEND_DIRECTION_02}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/period/trdlendduration/TrdLendDuration002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
