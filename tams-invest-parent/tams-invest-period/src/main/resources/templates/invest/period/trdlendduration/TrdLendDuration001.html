<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{TrdLendDuration001}">拆借存续期查询</title>
</head>
<body>
    <div layout:fragment="content">
        <div class='layui-fluid'>
            <div class="layui-col-md12 layui-col-sm12 layui-col-lg12 layui-col-xs12 form-button-area" style="margin: 10px;">
                <a id="TrdLendDuration001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="#{SysCommon.revoke}"></a>
            </div>
            <div class='joyin-form-wrap joyin-filter-form condition-area'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdLendDuration001.busiCode}">业务编号</label>
                        <div class="layui-input-inline input-inline">
                        	<select id="busiCode" name="busiCode" formatoption="false"
                                class="layui-input form-input input-select"
                                data-th-data-url="@{/invest/period/trdlendduration/TrdLendDuration001/getBusiCode}"
                                allowClear="true" placeholder="请输入内容" >
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdLendDuration001.portfolioId}">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <select id="portfolioId" name="portfolioId"
                                allowClear="true"
                                multiple="true"
                                class="layui-input form-input input-select"
                                data-th-data-url="@{/invest/period/trdlendduration/TrdLendDuration001/getPortfolioId}" 
                                placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdLendDuration001.statusValid}">有效状态</label>
                        <div class="layui-input-inline input-inline">
                            <select id="statusValid" name="statusValid"
                                class="layui-input form-input input-select"
                                data-th-data-result='${PAGE_DATA_STATUS}' multiple="true" allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdLendDuration001.ps}">交易方向</label>
	                    <div class="layui-input-inline input-inline">
	                        <input type="text" id="backLendDirection" name="backLendDirection"
	                         class="layui-input form-input input-checkbox" 
	                         data-th-data-result='${BACK_LEND_DIRECTION}'>
	                    </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdLendDuration001.tradeDate}">交易日</label>
                        <div class="layui-input-inline input-inline">
                            <input id='tradeDate' name='tradeDate' 
                                   class="layui-input form-input input-dateRangeSelect"
                                   placeholder="请选择、支持区间" data-th-placeholder="#{SysCommon.dateInterval}">
                        </div>
                    </div>
                </div>
            </form>
            </div>
           
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script th:inline="javascript" type="text/javascript">
            var PAGE_DATA_STATUS_01 = /*[[${PAGE_DATA_STATUS_01}]]*/'';
            var PAGE_DATA_STATUS_05 = /*[[${PAGE_DATA_STATUS_05}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/period/trdlendduration/TrdLendDuration001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
