<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{[#pageId]}">[#title]</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">基本信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" >业务编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="bizCode" name="bizCode" data-th-value="${entity?.bizCode}" class="layui-input form-input" disabled/>
                                        <input type="hidden" id="ps" name="ps" data-th-value="T39" />
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" >资产简称</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="finprodMarketId" name="finprodMarketId"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                data-th-parentIds="chlId"
                                                th:data-url="@{/invest/period/trdbondduration/TrdBondDuration003/getFinprodId?finprodType=F01&exercise=true(workflowId=${workflowId})}"
                                                allowClear="true" th:initValue="${entity?.finprodMarketId}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" >资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" id="finprodName" data-th-value="${entity?.finprodName}" />
                                        <input type="text" id="finprodMarketIdShow" data-th-value="${entity?.finprodMarketId}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" >类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="paBussTypeString" name="paBussTypeString" value="债券行权赎回" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" >行权申请起始日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="vdate" name="vdate" data-th-value="${#dates.format(entity?.vdate, 'yyyy-MM-dd')}" class="layui-input form-input input-dateSelect" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" >行权申请终止日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="mdate" name="mdate" data-th-value="${#dates.format(entity?.mdate, 'yyyy-MM-dd')}" class="layui-input form-input input-dateSelect" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration002.payDate}">支付日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="payDate" name="payDate" data-th-value="${#dates.format(entity?.payDate, 'yyyy-MM-dd')}" class="layui-input form-input input-dateSelect" disabled/>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">金额信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <!--通道 隐藏 by gaoshuqi 20210721 start -->
                               <!-- <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">通道</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="chlId" name="chlId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true"
                                                data-th-data-url="@{/component/trade/BussChannelCommon/getChannelIdAndCollectType}"
                                                data-th-initvalue="${entity?.chlId}">
                                        </select>
                                    </div>
                                </div>-->
                                <!-- 通道 隐藏 by gaoshuqi 20210721 end -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration001.qty}">券面总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="qty" name="qty" data-th-value="${entity?.qty}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap cash-type-02">
                                    <label class="layui-form-label form-label-wrap" >行权净价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="netPrice" name="netPrice" data-th-value="${entity?.netPrice}" class="layui-input form-input text-number"  data-textrange="6" maxlength="10" required/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap cash-type-02">
                                    <label class="layui-form-label form-label-wrap" >净价总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="cPriceAmt" name="cPriceAmt" data-th-value="${entity?.cPriceAmt}" class="layui-input form-input text-number"  data-textrange="2" maxlength="16" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap cash-type-02">
                                    <label class="layui-form-label form-label-wrap">理论应计利息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="intAmtTheory" name="intAmtTheory" data-th-value="${entity?.intAmtTheory}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap cash-type-02">
                                    <label class="layui-form-label form-label-wrap">实收利息总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="intAmtReal" name="intAmtReal" data-th-value="${entity?.intAmtReal}" class="layui-input form-input text-number" maxlength="17"/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <!-- 查询条件【通道费】隐藏 by gaoshuqi 20210721 start -->
                            <!--    <div class="form-inline-wrap cash-type-02">
                                    <label class="layui-form-label form-label-wrap" >通道费</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="channelFee" name="channelFee" data-th-value="${entity?.channelFee}" class="layui-input form-input text-number"  data-textrange="2" maxlength="16" />
                                    </div>
                                </div>-->
                                <!-- 查询条件【通道费】隐藏 by gaoshuqi 20210721 end -->
                                <div class="form-inline-wrap cash-type-02">
                                    <label class="layui-form-label form-label-wrap" >到账金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="fPriceAmt" name="fPriceAmt" data-th-value="${entity?.fPriceAmt}" class="layui-input form-input text-number"  data-textrange="2" maxlength="16" required/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" >资金到账日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="settleDate" name="settleDate" data-th-value="${#dates.format(entity?.settleDate, 'yyyy-MM-dd')}" class="layui-input form-input input-dateSelect" required/>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!--金额明细信息-->
                <div class="pro-module-wrap sjfx">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">金额明细信息</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <table class="layui-table" id="finAssetIntInfoList" th:name="trdBondPtlSecExerciseInfos"></table>
                        </div>
                    </div>
                </div>
                <div class="pro-module-wrap" th:id="|bussTrdTransferOrder_div|" th:style="${GEN_PAY_ORDERS_AUTO == '01'?'display:none':''}">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">指令信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <input type="hidden" th:id="|bussTrdTransferOrder_payAcctNo|" th:name="selectValue" value="pay">
                                <input type="hidden" th:id="|bussTrdTransferOrder_recAcctNo|" th:name="selectValue" value="rec">
                                <a th:id="|bussTrdTransferOrder_btn_generate|" class="layui-btn layui-btn-sm" th:text="#{BussTrdTransferOrder.generate}">生成指令</a>
                            </div>
                            <table class="layui-table" th:id="|bussTrdTransferOrder_table|" th:name="bussTrdTransferOrder"></table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="page-component" th:data-path="@{/component/core/FileCommon/init}" th:data-params="|{entityName: 'uploadFileList', businessId: '${entity?.bizCode ?: ''}'}|"></div>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title" style="border-top: 1px solid #ccc;">
                        <span class="title-des" th:text="#{TrdFundDuration001.remark}">备注</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap" style="width: 100%;">
                                <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98% !important;">
                                     <textarea id="remark" name="remark" type="text"
                                                      maxlength="200"
                                                      class="layui-input layui-textarea"
                                                      placeholder="请输入内容"
                                                      th:text="${entity?.remark}"
                                                      data-th-placeholder="#{SysCommon.placeholder}"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="layui-form-item" data-th-if="${entity?.revokeReason}">
                <div class="layui-inline layui-col-md12 layui-col-sm12 layui-col-lg12 layui-col-xs12">
                    <fieldset class='adver-fieldset'>
                        <legend>撤销理由</legend>
                        <div class="layui-input-block" style="margin-left:0px;">
                        <textarea id="revokeReason" name="revokeReason" data-th-text="${entity?.revokeReason}" placeholder="请输入内容"
                                  class="layui-textarea"></textarea>
                        </div>
                    </fieldset>
                </div>
            </div>
        </div>
        <div class="layui-form-item" align="center">
            <a id="TrdBondDuration003_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="TrdBondDuration003_btn_submit" class="layui-btn layui-btn-sm  btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="TrdBondDuration003_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var finAssetIntInfoList = /*[[${entity?.trdBondPtlSecExerciseInfos}]]*/'';
        var bussTrdTransferOrderDtos = /*[[${entity?.bussTrdTransferOrder}]]*/'';
        var YES_NO = /*[[${YES_OR_NO}]]*/'';
        var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'';
        var GEN_PAY_ORDERS_AUTO=/*[[${GEN_PAY_ORDERS_AUTO}]]*/'';
        var ISChongQing = /*[[${ISChongQing}]]*/'';
</script>
    <script data-th-src="@{/js/invest/period/trdbondduration/TrdBondDuration003.js}" type="text/javascript"></script>
</div>
</body>

</html>
