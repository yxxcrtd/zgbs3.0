<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{[#pageId]}">[#title]</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">基本信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdIRSDuration003.busiCode}">业务编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" name="statusValid" data-th-value="${entity?.statusValid}"/>
                                        <input type="hidden" name="paBussType" data-th-value="${entity?.paBussType}"/>
                                        <input type="text" id="busiCode" name="busiCode" data-th-value="${entity?.busiCode}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdIRSDuration003.portfolioId}">组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="portfolioId" name="portfolioId" th:initValue="${entity?.portfolioId}"
                                                class="layui-input form-input input-select available" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"  disabled
                                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdIRSDuration003.finprodId}">交易编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="finprodId" name="finprodId" formatoption="false" required
                                                class="layui-input form-input input-select" th:initValue="${entity?.finprodId}"
                                                data-th-data-url="@{/invest/period/trdirsduration/TrdIRSDuration001/getTradeId}"
                                                allowClear="true" placeholder="请输入内容" >
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdIRSDuration003.tradeDate}">交易日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeDate" name="tradeDate" data-th-value='${#dates.format(entity?.tradeDate,"yyyy-MM-dd")}'
                                            class="layui-input form-input input-dateSelect" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdIRSDuration003.irsType}">互换方式</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="irsType" name="irsType" class="layui-input form-input input-select" disabled
                                                data-th-data-result='${IRS_TYPE}' allowClear="true" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" th:initValue="${entity?.irsType}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdIRSDuration003.vdate}">起息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="vdate" name="vdate" data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'
                                            class="layui-input form-input input-dateSelect" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdIRSDuration003.mdate}">到期日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="mdate" name="mdate" data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
                                            class="layui-input form-input input-dateSelect" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdIRSDuration003.term}">期限(天)</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="term" name="term" data-th-value="${entity?.term}" class="layui-input form-input" disabled/>
                                        <span class="input-right-show">天</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdIRSDuration003.ccy}">名义本金币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="ccy" name="ccy" searchable="false" data-th-data-result="${CCY}"
                                                th:initvalue="*{entity?.ccy}" class="layui-input form-input input-select"
                                                disabled>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdIRSDuration003.prin}">名义本金（万元）</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="prin" name="prin" data-textrange='4' data-th-value="${entity?.prin}"
                                        class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdIRSDuration003.restPrin}">剩余名义本金（万元）</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="restPrin" name="restPrin" data-textrange='4' data-th-value="${entity?.restPrin}"
                                        class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" th:text="#{TrdIRSDuration003.counterId}">交易对手</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="counterId" name="counterId" th:initValue="${entity?.counterId}"
                                                data-th-data-url="@{/component/trade/TrdInvestPersonInfo002/selectCounterId}"
                                                formatOption="false" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                class="layui-input form-input input-select" disabled>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="pro-module-wrap gdll">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">提前终止信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdIRSDuration003.beforeEndDate}">提前终止日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="beforeEndDate" name="beforeEndDate" data-th-value='${#dates.format(entity?.beforeEndDate,"yyyy-MM-dd")}'
                                            class="layui-input form-input input-dateSelect" required/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdIRSDuration003.beforeEndPayDate}">支付日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="beforeEndPayDate" name="beforeEndPayDate" data-th-value='${#dates.format(entity?.beforeEndPayDate,"yyyy-MM-dd")}'
                                            class="layui-input form-input input-dateSelect" required/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdIRSDuration003.beforeEndPrin}">提前终止名义本金（万元）</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="beforeEndPrin" name="beforeEndPrin" data-th-value="${entity?.beforeEndPrin}"
                                            class="layui-input form-input text-number" required/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdIRSDuration003.beforeEndPs}">收付方向</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="beforeEndPs" name="beforeEndPs" class="layui-input form-input input-select"
                                                data-th-data-result='${PS}' allowClear="true" placeholder="请输入内容" required
                                                data-th-placeholder="#{SysCommon.placeholder}" th:initValue="${entity?.beforeEndPs}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdIRSDuration003.beforeEndAmt}">收付金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="beforeEndAmt" name="beforeEndAmt" data-th-value="${entity?.beforeEndAmt}"
                                            class="layui-input form-input text-number" required/>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 划款信息 -->
                <div class="page-component hkxx" th:data-path="@{/component/trade/BussTrdTransferOrder/init}" th:style="${GEN_PAY_ORDERS_AUTO == '01'?'display:none':''}"
                     th:data-params="|{entityList:'${entityList}',entityName: 'bussTrdTransferOrder', pageFrom: 'informationForm', entity:'', bizCode:'${entity?.busiCode}',isMulti:'1'}|"></div>
            </div>
            <!-- add by zhangpuyu 2019/10/30 start -->
            <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                 th:data-params="|{entityName: 'uploadFileList', businessId: '${tradeId ?: ''}'}|"></div>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"
                        style="border-top: 1px solid #ccc;">
                        <span class="title-des" th:text="#{TrdFundDuration001.remark}">备注</span><i
                            class="iconfont icon-arrow-down pro-down-icon"
                    ></i>
                    </h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap"
                                 style="width: 100%;">
                                <div class="layui-input-inline input-inline"
                                     style="margin:0 10px;width: 98% !important;">
                                            <textarea id="remark" name="remark" type="text"
                                                      maxlength="200"
                                                      class="layui-input layui-textarea"
                                                      placeholder="请输入内容"
                                                      th:text="${entity?.remark}"
                                                      data-th-placeholder="#{SysCommon.placeholder}"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- add by zhangpuyu 2019/10/30 end -->
            <div class="layui-form-item" data-th-if="${entity?.revokeReason}">
                <div class="layui-inline layui-col-md12 layui-col-sm12 layui-col-lg12 layui-col-xs12">
                    <fieldset class='adver-fieldset'>
                        <legend>撤销理由</legend>
                        <div class="layui-input-block" style="margin-left:0px;">
                        <textarea id="revokeReason" name="revokeReason" data-th-text="${entity?.revokeReason}" placeholder="请输入内容"
                                  class="layui-textarea"></textarea>
                        </div>
                    </fieldset>
                </div>
            </div>
        </div>
        <div class="layui-form-item" align="center">
            <a id="TrdIRSDuration003_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="TrdIRSDuration003_btn_submit" class="layui-btn layui-btn-sm  btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="TrdIRSDuration003_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
        var needInit = /*[[${needInit}]]*/'';
        var YES_NO = /*[[${YES_OR_NO}]]*/'';
        var PAY_TYPE = /*[[${PAY_TYPE}]]*/'';
        var formTodoList = /*[[${formTodoList}]]*/'';
        var bussTrdTransferOrderDtos = /*[[${entity?.bussTrdTransferOrder}]]*/'';
        var finprodType2 = /*[[${finprodType2}]]*/'';
        var GEN_PAY_ORDERS_AUTO=/*[[${GEN_PAY_ORDERS_AUTO}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/period/trdirsduration/TrdIRSDuration003.js}" type="text/javascript"></script>
</div>
</body>

</html>
