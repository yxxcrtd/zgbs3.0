<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{[#pageId]}">[#title]</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">

                    <div class="pro-module">
                        <input style="display:none" type="text"
                               id="type"
                               name="type"
                               data-th-value="${type}"
                               class="layui-input form-input"  />

                        <input style="display:none" type="text"
                               id="xqType"
                               name="xqType"
                               data-th-value="${entity?.xqType}"
                               class="layui-input form-input"/>
                        <input style="display:none" type="text"
                               id="finprodId"
                               name="finprodId"
                               data-th-value="${entity?.finprodId}"
                               class="layui-input form-input"/>
                        <input style="display:none" type="text"
                               id="finprodType2"
                               name="finprodType2"
                               data-th-value="${entity?.finprodType2}"
                               class="layui-input form-input"/>
                        <input style="display:none" type="text"
                               id="tradeDate"
                               name="tradeDate"
                               data-th-value="${#dates.format(entity?.tradeDate,'yyyy-MM-dd')}"
                               class="layui-input form-input"/>
                        <input style="display:none" type="text"
                               id="ccy"
                               name="ccy"
                               data-th-value="${entity?.ccy}"
                               class="layui-input form-input"/>

                        <h3 class="pro-module-title"><span class="title-des">基本信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">

                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="交易编号">交编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" class="layui-input form-input" id="totleTradeId" name="totleTradeId" data-th-value="${entity?.totleTradeId}" disabled/>

                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="合同编号">合同编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="contractNo" name="contractNo" data-th-value="${entity?.contractNo}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="合同名称">合同名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="contractName" name="contractName" data-th-value="${entity?.contractName}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="组合代码">组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="portfolioId" name="portfolioId" th:initValue="${entity?.portfolioId}"
                                                class="layui-input form-input input-select available" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"  disabled
                                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="合约标的">合约标的</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="targetId" name="targetId" th:initValue="${entity?.targetId}"
                                                class="layui-input form-input input-select available" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"  disabled
                                                data-th-data-url="@{/invest/period/trdoptionduration/TrdOptionDuration002/getoption}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="合约类型">合约类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="assetType11" name="assetType11"
                                               data-th-data-result="${STRUCTURE_TYPE}" disabled
                                               data-th-initValue="${entity?.assetType11}"
                                               class="layui-input form-input input-select" />
                                    </div>
                                </div>
                            </div>

                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="交易方向">交易方向</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="ps" name="ps" disabled
                                               data-th-data-result="${PS}"
                                               data-th-initValue="${entity?.ps}"
                                               class="layui-input form-inpu input-select"/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="交易日期">交易日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="cDate" name="cDate" data-th-value="${#dates.format(entity?.cDate,'yyyy-MM-dd')}"  class="layui-input form-input input-dateSelect ps02" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="到期日">到期日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="mdate" name="mdate" data-th-value="${#dates.format(entity?.mdate,'yyyy-MM-dd')}"  class="layui-input form-input input-dateSelect ps02" disabled/>
                                    </div>
                                </div>
                            </div>

                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="数量">数量</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="amount" name="amount"  data-textrange="2"  data-fixtype="2"
                                               data-th-value='${entity?.amount}' class="layui-input form-input text-number ps01" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="行权价基准日">行权价基准日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="execBaseDate" name="execBaseDate" data-th-value="${#dates.format(entity?.execBaseDate,'yyyy-MM-dd')}"
                                               class="layui-input form-input input-dateSelect ps02" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="执行价格">执行价格</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="exePrice" name="exePrice"  data-textrange="2"  data-fixtype="2"
                                               data-th-value='${entity?.exePrice}' class="layui-input form-input text-number ps01" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="敲出价格">敲出价格</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="knockPrice" name="knockPrice"  data-textrange="2"  data-fixtype="2"
                                               data-th-value='${entity?.knockPrice}' class="layui-input form-input text-number ps01" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="低障碍价">低障碍价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="lowHindPrice" name="lowHindPrice"  data-textrange="2"  data-fixtype="2"
                                               data-th-value='${entity?.lowHindPrice}' class="layui-input form-input text-number ps01" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="低价行权">低价行权</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="lowExercPrice" name="lowExercPrice"  data-textrange="2"  data-fixtype="2"
                                               data-th-value='${entity?.lowExercPrice}' class="layui-input form-input text-number ps01" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="高障碍价">高障碍价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="highHindPrice" name="highHindPrice"  data-textrange="2"  data-fixtype="2"
                                               data-th-value='${entity?.highHindPrice}' class="layui-input form-input text-number ps01" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="高行权价">高行权价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="highExercPrice" name="highExercPrice"  data-textrange="2"  data-fixtype="2"
                                               data-th-value='${entity?.highExercPrice}' class="layui-input form-input text-number ps01" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="行权方式">行权方式</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="exerciseType" name="exerciseType"
                                               data-th-data-result="${EXEC_MODE}"
                                               data-th-initValue="${entity?.exerciseType}"
                                               class="layui-input form-input input-select" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layuoptFeePayTypei-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="期权费类型">期权费类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="" name="optFeePayType"
                                               data-th-data-result="${OPT_FEE_PAY_TYPE}"
                                               data-th-initValue="${entity?.optFeePayType}"
                                               class="layui-input form-input input-select" disabled
                                        />
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="期权费率">期权费率</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="optFeeRate" name="optFeeRate"  data-textrange="2" data-fixtype="2"
                                               data-th-value='${entity?.optFeeRate}' class="layui-input form-input text-number ps01" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="期权费">期权费</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="fpriceAmt" name="fpriceAmt"  data-textrange="2"  data-fixtype="2"
                                               data-th-value='${entity?.fpriceAmt}' class="layui-input form-input text-number ps01"  disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="交易对手">交易对手</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="counterId" name="counterId" th:initValue="${entity?.counterId}"
                                                data-th-data-url="@{/component/trade/TrdInvestPersonInfo002/selectCounterId}"
                                                formatOption="false" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                class="layui-input form-input input-select" disabled>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="layui-form-item">

                            </div>
                        </div>
                    </div>
                </div>
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">行权信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="业务编号">交编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  class="layui-input form-input" type="text" disabled
                                                id="busiCode" name="busiCode" data-th-value="${entity?.busiCode}"/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="是否放弃行权">是否放弃行权</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="isfqxq" name="isfqxq"
                                               data-th-data-result="${YES_OR_NO}"
                                               data-th-initValue="${entity?.isfqxq}"
                                               class="layui-input form-input input-select"
                                               disabled
                                        />
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="放弃行权日">放弃行权日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="fqxqDate" name="fqxqDate" disabled
                                               data-th-value="${#dates.format(entity?.fqxqDate,'yyyy-MM-dd')}"
                                               class="layui-input form-input input-dateSelect ps02" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 附件信息 -->
            <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                 th:data-params="|{entityName: 'uploadFileList', businessId: '${totleTradeId ?: ''}'}|"></div>

            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"
                        style="border-top: 1px solid #ccc;">
                        <span class="title-des" th:text="#{TrdFundDuration001.remark}">备注</span><i
                            class="iconfont icon-arrow-down pro-down-icon"
                    ></i>
                    </h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap"
                                 style="width: 100%;">
                                <div class="layui-input-inline input-inline"
                                     style="margin:0 10px;width: 98% !important;">
                                            <textarea id="remark" name="remark" type="text"
                                                      maxlength="200"
                                                      class="layui-input layui-textarea"
                                                      placeholder="请输入内容"
                                                      th:text="${entity?.remark}"
                                                      data-th-placeholder="#{SysCommon.placeholder}"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-form-item" align="center">
            <a id="TrdOptionDuration003_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="TrdOptionDuration003_btn_submit" class="layui-btn layui-btn-sm  btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="TrdOptionDuration003_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var workflowId = /*[[${workflowId}]]*/'';
        var YES_OR_NO_Y = '';
    </script>
    <script data-th-src="@{/js/invest/period/trdoptionduration/TrdOptionDuration003.js}" type="text/javascript"></script>
</div>
</body>

</html>
