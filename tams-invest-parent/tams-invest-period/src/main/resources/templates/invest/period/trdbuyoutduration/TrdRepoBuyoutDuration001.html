<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{[#pageId]}">[#title]</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a id="TrdRepoBuyoutDuration001_btn_revoke" class="layui-btn layui-btn-sm btn-delete"><i class="iconfont icon-revoke"></i><span data-th-text="#{pingan.common.revoke}">撤销</span></a>
    </div>

    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TrdBondDuration001.busiCode}">业务编号</label>
                    <div class="layui-input-inline input-inline">
                        <select id="busiCode" name="busiCode" formatoption="false"
                                class="layui-input form-input input-select"
                                data-th-data-url="@{/invest/period/trdbuyoutduration/TrdRepoBuyoutDuration001/getBusiCode}"
                                allowClear="true" placeholder="请输入内容" >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TrdBondDuration001.portfolioId}">组合代码</label>
                    <div class="layui-input-inline input-inline">
                        <select id="portfolioId" name="portfolioId" multiple
                                class="layui-input form-input input-select"
                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId}"
                                allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-initValue='${finprodId}'>
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable" >交易日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="tradeDate" class="layui-input form-input input-dateRangeSelect" />
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">交易方向</label>
                    <div class="layui-input-inline input-inline">
                        <select id="ps" name="ps"
                                class="layui-input form-input input-select"
                                multiple="true"
                                data-th-data-result='${BACK_LEND_DIRECTION}'
                                allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TrdBondDuration001.statusValid}">有效状态</label>
                    <div class="layui-input-inline input-inline">
                        <select id="statusValid" name="statusValid"
                                class="layui-input form-input input-select"
                                multiple="true"
                                data-th-data-result='${PAGE_DATA_STATUS}'
                                allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-initValue = "${statusValid}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <!--update by zhangpuyu 2019/12/5 start -->
                    <label class="layui-form-label form-lable" >到期日</label>
                    <!--update by zhangpuyu 2019/12/5 end -->
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="mDate" class="layui-input form-input input-dateRangeSelect"
                        />
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" id="chlFinprodId_div">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{TrdBondDuration001.chlFinprodId}">合作资产</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="chlFinprodId" name="chlFinprodId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-url="@{/invest/asset/channel/ChannelAsset001/getSecAcctId}"
                                allowClear="true"
                                multiple="true"></select>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var PAGE_DATA_STATUS05 = /*[[${PAGE_DATA_STATUS05}]]*/'';
        var REM_TYPE = [[${remType}]];
        var BACK_LEND_DIRECTION = [[${BACK_LEND_DIRECTION}]];
    </script>
    <script data-th-src="@{/js/invest/period/trdbuyoutduration/TrdRepoBuyoutDuration001.js}" type="text/javascript"></script>
</div>
</body>

</html>
