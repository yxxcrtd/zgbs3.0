<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="#{TrdSecLendDuration002}">债券借贷到期</title>
</head>
<body>
<div layout:fragment="content">
    <style type="text/css">
        .layui-form-radio {
            line-height: 24px;
            padding-right: 0px;
            margin: 0px;
        }

        .layui-form-radio div {
            font-size: 12px;
        }

        .layui-form-radio i {
            font-size: 14px;
        }

        .label-deviation-degree {
            width: 50px;
            height: 24px;
            color: red;
            top: 0;
            right: 0;
            position: absolute;
            text-align: center;
            line-height: 24px;
        }

        #bussTrdAvailableCashQuery_div_position {
            display: none;
        }
    </style>
    <div class="pro-module-container" style="margin-bottom: 20px;">
        <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
            <div class="pro-module-wrapper pro-module-base" th:title="#{TrdBondLendInvestTrade002.baseInfo}">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" th:text="#{TrdBondLendInvestTrade002.baseInfo}">基本信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <input type="hidden" id="workflowId" name="workflowId" th:value="${workflowId}"/>
                        <input type="hidden" name="finprodType2" data-th-value="${entity?.finprodType2}"/>
                        <!--modify by jiangpeng on 20210428 start -->
                        <!--ZGZGST-125 投管系统，债券借贷到期时，TRD_PRODUCT_DEAL表的DELIVERY_TYPE存的是汉字，应该是到期结算方式的数据字典 -->
                        <input type="hidden" name="deliveryType" data-th-value="${entity?.deliveryType}"/>
                        <!--modify by jiangpeng on 20210428 end -->
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" th:text="#{TrdSecLendDuration002.tradeId}">业务编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" id="secManageAcctId" name="secManageAcctId" data-th-value="${entity?.secManageAcctId}"/>
                                        <input type="text" id="busiCode" name="busiCode" data-th-value="${entity?.busiCode}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" th:text="#{TrdSecLendDuration002.preTradeId}">原始交易编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodId" name="finprodId" data-th-value="${entity?.finprodId}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" th:text="#{TrdSecLendDuration002.portfolioName}">组合名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" id="portfolioId" name="portfolioId" data-th-value="${entity?.portfolioId}">
                                        <input type="hidden" id="actPortfolioId" name="actPortfolioId" data-th-value="${entity?.actPortfolioId}">
                                        <input type="text" id="portfolioName" name="portfolioName" data-th-value="${entity?.portfolioName}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdSecLendDuration002.tradeDate}">交易日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeDate" name="tradeDate" data-th-value="${#dates.format(entity?.tradeDate,'yyyy-MM-dd')}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdSecLendDuration002.vdate}">首次结算日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="vdate" name="vdate" data-th-value="${#dates.format(entity?.vdate,'yyyy-MM-dd')}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                 <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdSecLendDuration002.mdate}">到期结算日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="mdate" name="mdate" data-th-value="${#dates.format(entity?.mdate,'yyyy-MM-dd')}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdSecLendDuration002.termType}">期限品种</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="termType" name="termType" data-th-value="${entity?.termType}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                 <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdSecLendDuration002.term}">期限(天)</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="term" name="term" data-th-value="${entity?.term}" class="layui-input form-input" disabled/>
                                        <span class="input-right-show">天</span>
                                    </div>
                                </div>
                                 <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdSecLendDuration002.actAmtDays}">实际占券天数</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="actAmtDays" name="actAmtDays" data-th-value="${entity?.actAmtDays}" class="layui-input form-input" disabled/>
                                        <span class="input-right-show">天</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                             	<div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdSecLendDuration002.firstSettleType}">首次结算方式</label>
                                    <div class="layui-input-inline input-inline">
                                        <!--modify by jiangpeng on 20210428  -->
                                        <!--ZGZGST-125 投管系统，债券借贷到期时，TRD_PRODUCT_DEAL表的DELIVERY_TYPE存的是汉字，应该是到期结算方式的数据字典 -->
                                        <input disabled type="text" id="deliveryTypeString" name="deliveryTypeString"
                                               class="layui-input form-input" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.deliveryTypeString}"/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdSecLendDuration002.matSettleType}">到期结算方式</label>
                                    <div class="layui-input-inline input-inline">
                                        <select disabled type="text" id="mDeliveryType" name="mDeliveryType"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:data-result="${SETTLEMENT_WAY_LENDING}"
                                                allowClear="true" formatoption="false" th:initValue="${entity?.mDeliveryType}"></select>
                                    </div>
                                </div>
                                 <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdSecLendDuration002.conflictSolveWay}">争议解决方式</label>
                                    <div class="layui-input-inline input-inline">
                                        <select disabled type="text" id="conflictSolveWay" name="conflictSolveWay"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:data-result="${CONFLICT_SOLVE_WAY}"
                                                allowClear="true" formatoption="false" th:initValue="${entity?.conflictSolveWay}"></select>
                                    </div>
                                </div>
                             </div>
                            
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdSecLendDuration002.tradeMarket}">交易场所</label>
                                    <div class="layui-input-inline input-inline">
                                        <select disabled type="text" id="tradeMarket" name="tradeMarket"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${TRADE_PLACE}'
                                                allowClear="true" formatoption="true"
                                                th:initValue="${TRADE_PLACE_01}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdSecLendDuration002.ps}">借贷方向</label>
                                    <div class="layui-input-inline input-inline">
                                        <select disabled type="text" id="ps" name="ps"
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${BACK_LEND_DIRECTION}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.ps}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdSecLendDuration002.calendarId}">交易日历</label>
                                    <div class="layui-input-inline input-inline">
                                         <select disabled type="text" id="calendarId" name="calendarId"
                                                 class="layui-input form-input input-select" placeholder="请输入内容"
                                                 th:placeholder="#{SysCommon.placeholder}"
                                                 th:data-url="@{/business/common/CommonSelect/selectCalendarId}" allowClear="true"
                                                 formatoption="true"
                                                 th:initValue="${entity?.calendarId}"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                 <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdSecLendDuration002.finprodBond}">标的债券</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="pledgeFinprodId" name="pledgeFinprodId" data-th-value="${entity?.pledgeFinprodId}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
	                                <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdSecLendDuration002.tradeAmt}">券面总额</label>
	                                <div class="layui-input-inline input-inline">
                                        <input type="hidden" id="shareAmt" name="shareAmt" data-th-value="${entity?.shareAmt}">
	                                    <input disabled type="text" id="shareAmtString" name="shareAmtString"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.shareAmtString}">
	                                </div>
                            	</div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdSecLendDuration002.fTradeId}">银行间成交编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input disabled type="text" id="fTradeId" name="fTradeId"
                                               class="layui-input form-input"
                                               placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.fTradeId}">
                                    </div>
                                </div>
                             </div>
                             <div class="layui-form-item">
	                             <div class="form-inline-wrap">
	                                <label class="layui-form-label form-label-wrap" th:text="#{TrdSecLendDuration002.mYield}">借贷费率</label>
	                                <div class="layui-input-inline input-inline">
	                                    <input disabled type="text" id="mYield" name="mYield"
                                               class="layui-input form-input text-number"  data-textrange="6"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.mYield}">
	                                </div>
	                            </div>
	                             <div class="form-inline-wrap">
	                                <label class="layui-form-label form-label-wrap" th:text="#{TrdSecLendDuration002.mTradeAmt}">借贷费用</label>
	                                <div class="layui-input-inline input-inline">
	                                    <input disabled type="text" id="mTradeAmt" name="mTradeAmt"
                                               class="layui-input form-input text-number"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.mTradeAmt}">
	                                </div>
	                            </div>
                                 <div class="form-inline-wrap">
                                     <label class="layui-form-label form-label-wrap">币种</label>
                                     <div class="layui-input-inline input-inline">
                                         <select formatoption="true" type="text" id="ccy" name="ccy"
                                                 class="layui-input form-input input-select"
                                                 data-th-data-result='${CCY}' allowClear="true"
                                                 data-th-initValue="${entity?.ccy?:CCY_default}" disabled>
                                         </select>
                                     </div>
                                 </div>
                             </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">本方交易员</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="trader" name="trader" data-th-value="${entity?.trader}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交易对手</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" id="counterId" name="counterId" data-th-value="${entity?.counterId}">
                                        <input type="text" id="counterName" name="counterName" data-th-value="${entity?.counterName}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">对手方交易员</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="counterTrader" name="counterTrader" data-result="${YES_OR_NO}" data-th-value="${entity?.counterTrader}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item shortSellingSupported">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">是否现金交割</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="checkbox" name="isCashPay" id="isCashPay" lay-skin="switch" data-th-value="${YES_OR_NO}"
                                               th:checked="${entity?.isCashPay=='Y' ?true:false}"
                                               lay-filter="isCashPayFilter"
                                               lay-text="是|否" />
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">现金交割金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="prinAmt" name="prinAmt" data-th-value="${entity?.prinAmt}" class="layui-input form-input text-number"/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">实际结算金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="tradeAmt" name="tradeAmt" data-th-value="${entity?.tradeAmt}" class="layui-input form-input text-number"/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item shortSellingSupported">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" >投资目的</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="invAim" name="invAim" disabled
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:data-result='${INV_AIM}'
                                                allowClear="true" formatoption="true"
                                                th:initValue="${entity?.invAim}"></select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pro-module-wrap" id="secInfoTable_div">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">质押券信息</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <!-- 债券借贷到期确认交易增加汇总券面总额字段 modify by renping 20190923 start -->
                    <div class="pro-module-item pro-item-wrap">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-utext="#{BussRepoSec.totalPrinAmt}">汇总券面总额</label>
                                <div class="layui-input-inline input-inline">
                                    <input disabled type="text" th:id="fpriceAmt" maxlength="16"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}">
                                    <span class="input-right-show"
                                          data-th-utext="#{BussRepoSec.yuan}">元</span>
                                </div>
                            </div>
                        </div>
                        <div>
                            <table class="layui-table" id="secLendInfoTable"></table>
                        </div>
                    </div>
                    <!-- 债券借贷到期确认交易增加汇总券面总额字段 modify by renping 20190923 end -->
                </div>
            </div>
            <!-- 划款信息 -->
            <div class="page-component" th:data-path="@{/component/trade/BussTrdTransferOrder/init}" th:style="${GEN_PAY_ORDERS_AUTO == '01'?'display:none':''}"
                 th:data-params="|{entityName: 'bussTrdTransferOrder', statusValid: '${entity?.statusValid}', pageFrom: 'informationForm', entity:'${entity_bussTrdTransferOrderDto}'}|"></div>

            <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                 th:data-params="|{entityName: 'uploadFileList', businessId: '${tradeId ?: ''}'}|"></div>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des" th:text="#{TrdBondLendInvestTrade002.remark}">备注</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="layui-form-item">
                                <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                    <textarea name="remark" maxlength="200" th:text="${entity?.remark}"
                                              class="layui-textarea" placeholder="请输入内容"
                                              th:placeholder="#{SysCommon.placeholder}"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        <div class="row text-center" style="margin: 20px 0;">
            <a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save"
               data-th-text="#{SysCommon.save}">保存</a>
            <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit"
               data-th-text="#{SysCommon.submit}">提交</a>
            <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var finprodId = /*[[${entity?.finprodId}]]*/'';
        var portfolioId = /*[[${entity?.portfolioId}]]*/'';
        var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'';
        var dealString = /*[[${deal}]]*/'';
        var isTodoList = /*[[${isTodoList}]]*/'';
        var shortSellingSupported = /*[[${shortSellingSupported}]]*/'';
        var GEN_PAY_ORDERS_AUTO=/*[[${GEN_PAY_ORDERS_AUTO}]]*/'';
    </script>

    <script data-th-src="@{/js/component/common/TradeCommon.js}" type="text/javascript"></script>
    <script th:src="@{/js/invest/period/trdseclendduration/TrdSecLendDuration002.js}" type="text/javascript"></script>
</div>
</body>
</html>
