<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorator="~{layout/default}">
<head>
    <title data-th-text="#{[#pageId]}">项目资产利率型还本付息确认</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">基本信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">一级分类</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" name="needSkipInsertWfl" id="needSkipInsertWfl" data-th-value="${entity?.needSkipInsertWfl}" />
                                        <input type="hidden" name="finAssetInfo.type6" data-th-value="${entity?.finAssetInfo?.type6}"/>
                                        <input type="hidden" id="acctNoList" name="selectValue" data-th-value="[]">
                                        <input type="text" id="finAssetInfo_type6" data-th-value="${entity?.type6String}" class="layui-input form-input" disabled/>
                                        <input type="hidden" id="intAmtUnpayFlag" name="intAmtUnpayFlag" data-th-value="${entity?.intAmtUnpayFlag}"/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">二级分类</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" name="finAssetInfo.type7" data-th-value="${entity?.finAssetInfo?.type7}" class="layui-input form-input" disabled/>
                                        <input type="text" id="finAssetInfo_type7" data-th-value="${entity?.type7String}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finAssetInfo_finprodMarketId" name="finAssetInfo.finprodMarketId" data-th-value="${entity?.finAssetInfo?.finprodMarketId}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finAssetInfo_finprodName" name="finAssetInfo.finprodName" data-th-value="${entity?.finAssetInfo?.finprodName}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">初始投资金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finAssetInfo_issueAmt" name="finAssetInfo.issueAmt" data-th-value="${entity?.finAssetInfo?.issueAmt}" class="layui-input form-input input-number" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">起息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finAssetInfo_vDate" name="finAssetInfo.vDate" data-th-value="${entity?.finAssetInfo?.vDate}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">到期日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finAssetInfo_mDate" name="finAssetInfo.mDate" data-th-value="${entity?.finAssetInfo?.mDate}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">计息基础</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finAssetInfo_basis" name="finAssetInfo.basis" data-th-value="${entity?.finAssetInfo?.basis}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select formatoption="true" type="text" id="finAssetInfo_ccy" name="finAssetInfo.ccy"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${CCY}' allowClear="true" placeholder="请输入内容"
                                                data-th-initValue="${entity?.finAssetInfo?.ccy?:CCY_default}" disabled>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" id="cashType" name="cashType" data-th-value="${entity?.cashType}"/>
                                        <input type="hidden" id="cashId" name="cashId" data-th-value="${entity?.cashId}"/>
                                        <input type="text" id="paBussTypeString" name="paBussTypeString" data-th-value="${entity?.paBussTypeString}" class="layui-input form-input " disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{invest.channelId}">通道</label>
                                        <div class="layui-input-inline input-inline">
                                          <input type="hidden" id="collectType" name="collectType" data-th-value="${entity?.collectType}"/>
                                         <input type="hidden" id="channel" name="channel" data-th-value="${entity?.channel}"/>
                                            <select type="text" id="chlId" name="chlId"
                                                    class="layui-input form-input input-select" allowClear="true"
                                                    data-th-placeholder="#{SysCommon.placeholder}" formatoption="true"
                                                    data-th-initvalue="${entity?.chlId}">
                                            </select>
                                        </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pro-module-wrap llfx">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">付息还本信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">业务编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="busiCode" name="busiCode" data-th-value="${entity?.busiCode}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">总剩余本金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" id="yield" name="yield" data-th-value="${entity?.yield}"/>
                                        <input type="hidden" id="statusValid" name="statusValid" data-th-value="${entity?.statusValid}"/>
                                        <input type="hidden" id="finprodId" name="finprodId" data-th-value="${entity?.finprodId}"/>
                                        <input type="hidden" name="paBussType" data-th-value="${entity?.paBussType}" />
                                        <input type="text" id="qty" name="qty" data-th-value="${entity?.qty}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">计息开始日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="vDate" name="vDate" data-th-value="${entity?.vDate}" class="layui-input form-input " disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">计息结束日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="mDate" name="mDate" data-th-value="${entity?.mDate}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap cash-type-02">
                                    <label class="layui-form-label form-label-wrap">理论支付日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="interestPayDay" name="interestPayDay" data-th-value="${entity?.interestPayDay}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap cash-type-01">
                                    <label class="layui-form-label form-label-wrap">利息调整</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="intAdjustment" name="intAdjustment" data-th-value="${entity?.intAdjustment}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap cash-type-01 cash-type-02">
                                    <label class="layui-form-label form-label-wrap">理论应收利息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="intAmtTheory" name="intAmtTheory" data-th-value="${entity?.intAmtTheory}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap cash-type-02">
                                    <label class="layui-form-label form-label-wrap">还本金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="returnAmount" name="returnAmount" data-th-value="${entity?.returnAmount}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap cash-type-01">
                                    <label class="layui-form-label form-label-wrap">实收本息总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" data-th-value="${entity?.theoryAmt}" id="theoryAmt" name="theoryAmt"/>
                                        <input type="text" id="fpriceAmt" name="fpriceAmt" data-th-value="${entity?.fpriceAmt}" required class="layui-input form-input text-number" maxlength="30"/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <!--<div class="form-inline-wrap cash-type-01 cash-type-02">-->
                                    <!--<label class="layui-form-label form-label-wrap">税费金额</label>-->
                                    <!--<div class="layui-input-inline input-inline">-->
                                        <!--<input type="text" id="taxAmount" name="taxAmount" data-th-value="${entity?.taxAmount}" class="layui-input form-input text-number"/>-->
                                    <!--</div>-->
                                <!--</div>-->
                                <!--<div class="form-inline-wrap cash-type-02">-->
                                    <!--<label class="layui-form-label form-label-wrap">到账金额</label>-->
                                    <!--<div class="layui-input-inline input-inline">-->
                                        <!--<input type="text" id="arrivalAmt" name="arrivalAmt" data-th-value="${entity?.arrivalAmt}" class="layui-input form-input text-number"/>-->
                                    <!--</div>-->
                                <!--</div>-->
                                 
                                <div class="form-inline-wrap cash-type-01">
                                    <label class="layui-form-label form-label-wrap">资金到账日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="arrivalDate" name="arrivalDate" required data-th-value="${entity?.arrivalDate}"
                                               class="layui-input form-input input-dateSelect"/>
                                    </div>
                                   
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration002.tradeAmtArrive}">到账金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="arrivalAmt" name="arrivalAmt" data-th-value="${entity?.arrivalAmt}" class="layui-input form-input text-number" maxlength="30" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" style="display:none">
                                    <label class="layui-form-label form-label-wrap" data-th-text="|#{invest.channelId}#{TrdBondDuration002.channelFee}|">通道费</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="channelFee" name="channelFee" data-th-value="${entity?.channelFee}" class="layui-input form-input text-number" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item" >
                               <div class="form-inline-wrap" id="repayIntAmt_div" style="display: none">
										<label class="layui-form-label form-label-wrap">累计还本未付利息</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="payUnpaidintAmt" name="payUnpaidintAmt" maxLength="16" disabled="true"
                                                   data-th-value="${entity?.payUnpaidintAmt}" class="layui-input form-input text-number"
                                                   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
                               </div>
                                <div  class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">是否结清</label>
                                    <div class="layui-input-inline input-inline" required>
                                        <select id="isClean" name="isClean"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${YES_OR_NO}' allowClear="true"
                                                th:initValue="${entity?.isClean?:YES_OR_NO_Y}"
                                                data-th-placeholder="#{SysCommon.placeholder}" >
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pro-module-wrap sjfx">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">利息明细信息</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <table class="layui-table" id="intDetailTable" th:name="finAssetIntInfoList"></table>
                        </div>
                    </div>
                </div>

                <div class="pro-module-wrap" th:id="|bussTrdTransferOrder_div|">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">指令信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <input type="hidden" th:id="|bussTrdTransferOrder_payAcctNo|" th:name="selectValue" value="pay">
                                <input type="hidden" th:id="|bussTrdTransferOrder_recAcctNo|" th:name="selectValue" value="rec">
                                <a th:id="|bussTrdTransferOrder_btn_generate|" class="layui-btn layui-btn-sm" th:text="#{BussTrdTransferOrder.generate}">生成指令</a>
                            </div>
                            <table class="layui-table" th:id="|bussTrdTransferOrder_table|" th:name="bussTrdTransferOrder"></table>
                        </div>
                    </div>
                </div>
            </div>
            <!-- add by zhangpuyu 2019/10/30 start -->
            <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                 th:data-params="|{entityName: 'uploadFileList', businessId: '${tradeId ?: ''}'}|"></div>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"
                        style="border-top: 1px solid #ccc;">
                        <span class="title-des" th:text="#{TrdFundDuration001.remark}">备注</span><i
                            class="iconfont icon-arrow-down pro-down-icon"
                    ></i>
                    </h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap"
                                 style="width: 100%;">
                                <div class="layui-input-inline input-inline"
                                     style="margin:0 10px;width: 98% !important;">
                                            <textarea id="remark" name="remark" type="text"
                                                      maxlength="200"
                                                      class="layui-input layui-textarea"
                                                      placeholder="请输入内容"
                                                      th:text="${entity?.remark}"
                                                      data-th-placeholder="#{SysCommon.placeholder}"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- add by zhangpuyu 2019/10/30 end -->
            <div class="layui-form-item" data-th-if="${entity?.revokeReason}">
                <div class="layui-inline layui-col-md12 layui-col-sm12 layui-col-lg12 layui-col-xs12">
                    <fieldset class='adver-fieldset'>
                        <legend>撤销理由</legend>
                        <div class="layui-input-block" style="margin-left:0px;">
                        <textarea id="revokeReason" name="revokeReason"  data-th-text="${entity?.revokeReason}" placeholder="请输入内容"
                                  class="layui-textarea"></textarea>
                        </div>
                    </fieldset>
                </div>
            </div>
        </div>
        <div class="layui-form-item" align="center">
            <a id="TrdProjectDuration002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="TrdProjectDuration002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="TrdProjectDuration002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var finprodId = /*[[${entity?.finprodId}]]*/'';
        var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'';
        var F17 = /*[[${F17}]]*/'';
        var ps = /*[[${ps}]]*/'';
        var YES_NO = /*[[${YES_OR_NO}]]*/'';
        
     // 一体化对应etliu start
        // var PAY_TYPE = /*[[${PAY_TYPE}]]*/'';
     	var PAY_TYPE = /*[[${PA_PAY_TYPE}]]*/'';
     // 一体化对应etliu end
        var ASSET_SOURCE = /*[[${ASSET_SOURCE}]]*/'';
        var formTodoList = /*[[${formTodoList}]]*/'';
        var bussTrdTransferOrderDtos = /*[[${entity?.bussTrdTransferOrder}]]*/'';
        var finAssetIntInfoList = /*[[${entity?.finAssetIntInfoList}]]*/'';
        var workflowId = /*[[${workflowId}]]*/'';
        var COLLECT_TYPE = /*[[${entity?.collectType}]]*/'';
        var COLLECT_TYPE_01=/*[[${COLLECT_TYPE_01}]]*/'';
        var CHANNEL=/*[[${entity?.channel}]]*/'';
        var intAmtUnpayFlag=/*[[${entity?.intAmtUnpayFlag}]]*/'';
        var INV_AIM=/*[[${INV_AIM}]]*/'';
        //展示投资目的或业务模式参数
        // var SHOW_INVAIM_OR_BUSSINSSMODEL =  /*[[${SHOW_INVAIM_OR_BUSSINSSMODEL}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/asset/channel/ChannelAssetCommon.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/invest/period/trdprojduration/TrdProjectDuration002.js}" type="text/javascript"></script>
</div>
</body>

</html>
