<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title data-th-text="#{TrdSecOverdueDuration003}">债转股委托新建</title>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">基本信息</span>
                            （
                            <span class="star-sign">*</span>
                            必填）
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <input type="hidden" id="totleTradeId" name="totleTradeId" data-th-value="${entity?.totleTradeId}"/>
                                <input type="hidden" id="secAcctId" name="secAcctId" data-th-value="${entity?.secAcctId}"/>
                                <input type="hidden" id="secManageAcctId"  name="secManageAcctId" data-th-value="${entity?.secManageAcctId}"/>
                                <input type="hidden" id="chlId"  name="chlId" data-th-value="${entity?.chlId}"/>
                                <input type="hidden" id="workflowId"  name="workflowId" data-th-value="${entity?.workflowId}"/>
                                <input type="hidden" id="type8"  name="type8" data-th-value="${entity?.type8}"/>
                                <input type="hidden" id="ps"  name="ps" data-th-value="${entity?.ps}"/>
                                <input type="hidden" id="bjBranch"  name="bjBranch" data-th-value="${entity?.bjBranch}"/>
                                <input type="hidden" id="liBranch"  name="liBranch" data-th-value="${entity?.liBranch}"/>
                                <input type="hidden" id="theoryPenaltyIntBj"  name="theoryPenaltyIntBj" data-th-value="${entity?.theoryPenaltyIntBj}"/>
                                <input type="hidden" id="theoryPenaltyIntLx"  name="theoryPenaltyIntLx" data-th-value="${entity?.theoryPenaltyIntLx}"/>
                                <input type="hidden" id="finprodType2"  name="finprodType2" data-th-value="${entity?.finprodType2}"/>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdSecOverdueDuration003.portfolioId}">组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption=true required="required"
                                                parentIds="bjBranch,liBranch,secAcctId,finprodId"
                                                data-th-data-url="@{/invest/period/trdsecoverdueduration/TrdSecOverdueDuration003/selectPortfolioId?act=true}"
                                                data-th-initvalue="${entity?.portfolioId}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdSecOverdueDuration003.finprodId}">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodId" name="finprodId"
                                               class="layui-input form-input" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.finprodId}" disabled="disabled">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdSecOverdueDuration003.finprodName}">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodName" name="finprodName"
                                               class="layui-input form-input" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.finprodName}" disabled="disabled">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdSecOverdueDuration003.theoryPrin}">未支付本金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="theoryPrin" name="theoryPrin"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.theoryPrin}" disabled="disabled">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdSecOverdueDuration003.theoryInt}">未支付利息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="theoryInt" name="theoryInt"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" disabled="disabled"
                                               data-th-value="${entity?.theoryInt}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdSecOverdueDuration003.theoryPenaltyInt}">罚息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="theoryPenaltyInt" name="theoryPenaltyInt"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.theoryPenaltyInt}" disabled="disabled">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdSecOverdueDuration003.prinAmt}">转让未支付本金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="prinAmt" name="prinAmt"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.prinAmt}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdSecOverdueDuration003.intAmt}">转让未支付利息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="intAmt" name="intAmt"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.intAmt}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdSecOverdueDuration003.penaltyInt}">转让罚息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="penaltyInt" name="penaltyInt"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.penaltyInt}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdSecOverdueDuration003.transferDate}">转让日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input class="layui-input form-input input-dateSelect" id="transferDate"
                                               name="transferDate" placeholder="请选择时间"
                                               data-th-value='${#dates.format(entity?.transferDate,"yyyy-MM-dd")}'
                                               disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdSecOverdueDuration003.tradeAmt}">实际支付金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeAmt" name="tradeAmt"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.tradeAmt}">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 人员信息 -->
                <div class="page-component" th:data-path="@{/component/trade/TrdInvestPersonInfo002/init}"
                     th:data-params="|{entityName: 'trdInvestPersonInfo', pageFrom: 'submitForm', entity:'${entity_trdInvestPersonInfo}',innerTrade: true,psId : 'ps', callPageId:'TrdSecOverdueDuration003'}|"></div>
                <div id="ramark_DIV" class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">备注</span>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <label class="layui-form-label form-lable" style="width: 11.9%;">备注</label>
                                <div class="layui-input-inline input-inline" style="width: 85% !important;">
                                        <textarea id="remark" name="remark" placeholder="请输入内容"
                                                  data-th-placeholder="#{SysCommon.placeholder}" class="layui-textarea"
                                                  data-th-text="${entity?.remark}"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 划款信息 -->
                <div class="page-component" th:data-path="@{/component/trade/BussTrdTransferOrder/init}"
                     id="bussTrdTransferOrder_div"
                     th:data-params="|{entityName: 'bussTrdTransferOrder', pageFrom: 'submitForm', entity:'${entity_bussRepFinProductInfoDto}', bizCode:'${businessId}'}|">
                </div>
                <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                     th:data-params="|{entityName: 'FileCommon',businessId: '${businessId ?: ''}'}|"></div>
                <!-- 风险试算 -->
                <div th:if="${isEleShow['TrdSecOverdueDuration003_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component"
                     th:data-path="@{/component/common/BaseRiskMathComm/init}"
                     th:data-params="|{entity: '${riskTrialRetDto}',entityName:'riskTrialRetDto',tradeId:'${businessId}'}|"></div>
                <div class="layui-form-item" data-th-if="${entity?.revokeReason}">
                    <div class="layui-inline layui-col-md12 layui-col-sm12 layui-col-lg12 layui-col-xs12">
                        <fieldset class='adver-fieldset'>
                            <legend>撤销理由</legend>
                            <div class="layui-input-block" style="margin-left:0px;">
                        <textarea id="revokeReason" name="revokeReason" data-th-text="${entity?.revokeReason}"
                                  placeholder="请输入内容"
                                  class="layui-textarea"></textarea>
                            </div>
                        </fieldset>
                    </div>
                </div>
            </div>
            <div class="pro-module-wrapper pro-module-block">
                <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                    <div class="text-center">
                        <a th:if="${isEleShow['TrdSecOverdueDuration003_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'"
                           id="TrdSecOverdueDuration003_btn_riskcal" class="layui-btn layui-btn-sm"
                           data-th-text="#{TrdSecOverdueDuration003.riskcal}">风险试算</a>
                        <a id="TrdSecOverdueDuration003_btn_save" class="layui-btn layui-btn-sm btn-save"
                           data-th-text="#{SysCommon.save}">保存</a>
                        <a id="TrdSecOverdueDuration003_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                           data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="TrdSecOverdueDuration003_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                           data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
        var PS_MC = /*[[${PS_MC}]]*/'';
        var PS_MR = /*[[${PS_MR}]]*/'';
        var CCY_CNY =/*[[${CCY_CNY}]]*/'';
        var MY_SUP_TIME_TYPE_02=/*[[${MY_SUP_TIME_TYPE_02}]]*/'';
        var ACCT_TYPE_A01 = /*[[${ACCT_TYPE_A01}]]*/'';
        var ACCT_TYPE_A07 = /*[[${ACCT_TYPE_A07}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/period/trdsecoverdueduration/TrdSecOverdueDuration003.js}" type="text/javascript">
    </script>
</div>
</body>
</html>
