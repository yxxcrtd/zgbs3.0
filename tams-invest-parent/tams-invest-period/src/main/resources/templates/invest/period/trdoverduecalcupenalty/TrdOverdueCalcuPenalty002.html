<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.springframework.org/schema/mvc" xmlns:select2-search--hide="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout/default}">
<head>
    <title>计息信息维护新建</title>
    <style type="text/css">
        .form-label-wrap {
            width: 36% !important;
        }

        .layui-form-radio {
            margin: 0;
            padding-right: 0;
        }

        .layui-form-radio > i {
            font-size: 18px;
            margin-right: 2px;
        }

        .form-day-wrap {
            float: left;
        }
         .select2-search--dropdown.select2-search--hide{
             display: block;
         }
    </style>
</head>
<body>
<div layout:fragment="content">
        <form class="layui-form joyin-form-wrap pro-module-form"
              id="informationForm">
            <input type="hidden" name="doType" id="doType">
            <input type="hidden" name="oldMdate" id="oldMdate">
            <input type="hidden" name="oldBjBranch" id="oldBjBranch">
            <input type="hidden" name="oldLiBranch" id="oldLiBranch">
            <input type="hidden" name="oldFxmdate" id="oldFxmdate">
            <input type="hidden" name="oldPenaltyBaseType" id="oldPenaltyBaseType">
            <input type="hidden" name="oldIsRushBack" id="oldIsRushBack">
            <input type="hidden" name="oldYield" id="oldYield">
            <input type="hidden" name="oldwithoutBranch" id="oldwithoutBranch">
            <input type="hidden" name="oldCashIds" id="oldCashIds">
            <div class="pro-module-wrapper pro-module-base"
                 title="基本信息">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">基本信息</span>（<span
                                class="star-sign">*</span>必填）<i
                                class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            th:text="资产类型">资产类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text"
                                               name="finprodTypeName"
                                               id="finprodTypeName"
                                               class="layui-input form-input"
                                               th:value="${entity?.finprodTypeName}"
                                               placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               disabled required>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            th:text="资产代码">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text"
                                               name="finprodId"
                                               id="finprodId"
                                               class="layui-input form-input"
                                               th:value="${entity?.finprodId}"
                                               placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               disabled required>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            th:text="资产名称">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text"
                                               name="finprodName"
                                               id="finprodName"
                                               class="layui-input form-input"
                                               th:value="${entity?.finprodName}"
                                               placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               disabled required>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            th:text="计息起始日">计息起始日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text"
                                               name="vdate"
                                               id="vdate"
                                               class="layui-input form-input"
                                               th:value="${entity?.vdate}"
                                               placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               disabled required>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            th:text="计息结束日">计息结束日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text"
                                               name="mdate"
                                               id="mdate"
                                               class="layui-input form-input"
                                               th:value="${entity?.mdate}"
                                               placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               disabled required>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            th:text="是否计提罚息">是否计提罚息</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="isAccrPenaltyInt" name="isAccrPenaltyInt" class="layui-input form-input input-select" required
                                                data-th-data-result='${YES_OR_NO}' allowClear="true" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" th:initValue="${entity?.isAccrPenaltyInt}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            th:text="罚息计息本金">罚息计息本金</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="penaltyBaseType" name="penaltyBaseType" class="layui-input form-input input-select"
                                                data-th-data-result='${PENALTY_BASE_TYPE}' allowClear="true" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" th:initValue="${entity?.penaltyBaseType}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdOverdueCalcuPenalty002.yield}">罚息利率</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text"
                                               id="yield"
                                               name="yield"
                                               th:value="${entity?.yield}"
                                               class="layui-input form-input text-number"
                                               data-textrange = '4'
                                               placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                        >
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            th:text="罚息起始日">罚息起始日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text"
                                               name="fxvdate"
                                               id="fxvdate"
                                               class="layui-input form-input input-dateSelect"
                                               th:value="${entity?.fxvdate}"
                                               placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               disabled required>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            th:text="罚息截止日">罚息截止日</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                        <input type="text"
                                               id="fxmdate"
                                               name="fxmdate"
                                               th:value="${entity?.fxmdate}"
                                               class="layui-input form-input input-dateSelect"
                                               placeholder="请输入"
                                               required>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            th:text="截止后是否冲回">截止后是否冲回</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="isRushBack" name="isRushBack" class="layui-input form-input input-select" required
                                                data-th-data-result='${YES_OR_NO}' allowClear="true" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" th:initValue="${entity?.isRushBack}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                    </div>
                <div class="row text-center"
                     style="margin-top: 50px;">
                    <a th:id="|${pageId}_btn_save|"
                       class="layui-btn layui-btn-sm btn-save"
                       data-th-text="#{SysCommon.save}">保存</a> <a
                        th:id="|${pageId}_btn_submit|"
                        class="layui-btn layui-btn-sm btn-submit"
                        data-th-text="#{SysCommon.submit}">提交</a> <a
                        th:id="|${pageId}_btn_cancel|"
                        class="layui-btn layui-btn-sm btn-cancel"
                        data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </div>
            </div>
            </div>
        </form>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
        var YES_OR_NO = /*[[${YES_OR_NO}]]*/'';
        var YES_NO = /*[[${YES_OR_NO}]]*/'';
        var finprodId = /*[[${finprodId}]]*/'';
        var finprodName = /*[[${finprodName}]]*/'';
        var finprodType = /*[[${entity.finprodType}]]*/'';
        var finprodTypeGz = /*[[${entity.finprodTypeGz}]]*/'';
        var finprodTypeTg = /*[[${entity.finprodTypeTg}]]*/'';
        var vdate = /*[[${vdate}]]*/'';
        var mdate = /*[[${mdate}]]*/'';
        var bjBranch = /*[[${entity.bjBranch}]]*/'';
        var liBranch = /*[[${entity.liBranch}]]*/'';
        var withoutBranch = /*[[${entity.withoutBranch}]]*/'';
        var workflowId = /*[[${workflowId}]]*/'';
        var fxmdate = /*[[${fxmdate}]]*/'';
        var fxYield = /*[[${fxYield}]]*/'';
        var isRushBack = /*[[${isRushBack}]]*/'';
        var isAccrPenaltyInt = /*[[${isAccrPenaltyInt}]]*/'';
        var penaltyBaseType = /*[[${penaltyBaseType}]]*/'';
        var cashIds = /*[[${entity.cashIds}]]*/'';
        var basis = /*[[${entity.basis}]]*/'';
        var sysDate = /*[[${sysDate}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/period/trdoverduecalcupenalty/TrdOverdueCalcuPenalty002.js}" type="text/javascript"></script>
</div>
</body>
</html>
