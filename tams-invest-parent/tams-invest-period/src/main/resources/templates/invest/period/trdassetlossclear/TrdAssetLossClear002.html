<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{TrdAssetLossClear002}">资产减值清理新建</title>
</head>	
<body>
    <div layout:fragment="content">
		<div class="">
			<div class="pro-module-wrapper pro-module-base" style="border-top: none;">
				<form class="layui-form joyin-form-wrap" id="submitForm">
			 	<h3 class="pro-module-title" style="border-top: 1px solid #ccc;"><span class="title-des">基础信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                            <label class="layui-form-label form-lable"
                                data-th-text="#{TrdAssetLossClear001.finprodId}">资产代码</label>
                            <div class="layui-input-inline input-inline">
                                <select id="finprodMarketId"
                                    name="finprodMarketId"
                                    allowClear="true"
                                    class="layui-input form-input input-select"
                                    data-th-data-url="@{/invest/period/trdassetlossclear/TrdAssetLossClear002/getFinprodMarketId}"
                                    placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-initValue="${entity?.finprodId}">
                                </select>
                            </div>
                        </div>
                        <div
                            class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                                data-th-text="#{TrdAssetLossClear001.tradeDate}">清理日期</label>
                            <div class="layui-input-inline input-inline">
                                <input id='clearDate' name='clearDate'
                                    class="layui-input form-input input-dateSelect"
                                    placeholder="请选择日期"
                                    data-th-placeholder="#{SysCommon.dateInterval}"
                                    data-th-value='${#dates.format(clearDate,"yyyy-MM-dd")}'>
                            </div>
                        </div>                        
                    </div>
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">减值清理列表</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<table class="layui-table" id="dataTable"></table>
							</div>
						</div>
					</div>                    					
				</form>		  
				<div class="layui-col-md11" style="margin:20px 0;">
					<div class="text-center">
						<a id="TrdAssetLossClear002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
						<a id="TrdAssetLossClear002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
						<a id="TrdAssetLossClear002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
					</div>
				</div>
			</div>
		</div>
	</div>
    <div layout:fragment="script">
    	<script data-th-inline="javascript" type="text/javascript">
            var finprodMarketId = /*[[${finprodMarketId}]]*/''; // 产品代码
        </script>
        <script data-th-src="@{/js/invest/period/trdassetlossclear/TrdAssetLossClear002.js}" type="text/javascript"></script>
    </div>
</body>

</html>
