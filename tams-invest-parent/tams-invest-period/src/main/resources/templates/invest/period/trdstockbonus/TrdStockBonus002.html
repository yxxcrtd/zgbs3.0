<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{[#pageId]}">[#title]</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                    	<input style="display:none" type="text"
                           id="type"
                           name="type"
                           data-th-value="${type}"
                           class="layui-input form-input"
                    />
                    <input style="display:none" type="text"
                           id="mode"
                           name="mode"
                           data-th-value="${entity.mode}"
                           class="layui-input form-input"
                    />
                    <input style="display:none" type="text"
                             id="totleTradeId"
                             name="totleTradeId"
                             data-th-value="${entity?.totleTradeId}"
                             class="layui-input form-input"
                    />
                    <input style="display:none" type="text"
                           id="busiCode"
                           name="busiCode"
                           data-th-value="${entity?.busiCode}"
                           class="layui-input form-input"
                    />
                        <input style="display:none" type="text"
                               id="finprodId"
                               name="finprodId"
                               data-th-value="${entity?.finprodId}"
                               class="layui-input form-input"
                        />
                        <input style="display:none" type="text"
                               id="workflowId"
                               name="workflowId"
                               data-th-value="${entity?.workflowId}"
                               class="layui-input form-input"
                        />
                        <input style="display:none" type="text"
                               id="busiType"
                               name="busiType"
                               data-th-value="${entity?.busiType}"
                               class="layui-input form-input"
                        />
                        <input style="display:none" type="text"
                               id="pTradeId"
                               name="pTradeId"
                               data-th-value="${entity?.pTradeId}"
                               class="layui-input form-input"
                        />
                        <input style="display:none" type="text"
                               id="regDateAmt"
                               name="regDateAmt"
                               class="layui-input form-input"
                        />
                        <h3 class="pro-module-title"><span class="title-des">基本信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration001.finprodMarketId}">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" name="finprodMarketName" data-th-value="${entity?.finprodMarketId}"/>
                                        <select id="finprodMarketId"
                                                formatoption=false
                                                name="finprodMarketId"
                                                allowClear="true"
                                                class="layui-input form-input input-select"
                                                data-th-data-url="@{/invest/period/trdstockbonus/TrdStockBonus001/getFinprodMarketId}"
                                                placeholder="请输入内容"
                                                th:initValue="${entity?.finprodMarketId}"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                
                                                required>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdStockBonus001.finprodMarketName}">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodAbbr" name="finprodAbbr" data-th-value="${entity?.finprodAbbr}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdStockBonus001.bonusMode}">分红类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="ps"
		                                    name="ps"
		                                    allowClear="true"
		                                    class="layui-input form-input input-select"
		                                    data-th-data-result="${STOCK_DEVISION_TYPE}"
		                                    placeholder="请输入内容"
		                                     th:initValue="${entity?.ps}"
		                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                required>
		                                </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdStockBonus001.registDate}">权益登记日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="regDate" name="regDate" data-th-value="${#dates.format(entity?.regDate,'yyyy-MM-dd')}" 
                                        	class="layui-input form-input input-dateSelect" required />
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdStockBonus001.exRightsDate}">除权（除息）日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeDate" name="tradeDate" data-th-value="${#dates.format(entity?.tradeDate,'yyyy-MM-dd')}" 
                                        	class="layui-input form-input input-dateSelect" required/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdStockBonus001.dividDate}">派息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="settleDate" name="settleDate" data-th-value="${#dates.format(entity?.settleDate,'yyyy-MM-dd')}" 
                                        	class="layui-input form-input input-dateSelect" disabled="disabled" required/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="红股上市日">红股上市日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="redStockDate" name="redStockDate" data-th-value="${#dates.format(entity?.redStockDate,'yyyy-MM-dd')}"  class="layui-input form-input input-dateSelect ps02" />
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdStockBonus001.perTransfer}">每股送转</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="unitCprice" name="unitCprice" data-textrange="8" data-th-value='${entity?.unitCprice}'  class="layui-input form-input text-number ps02" required/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdStockBonus001.perDividends}">每股派息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="unitInt" name="unitInt"  data-textrange="8" data-th-value='${entity?.unitInt}' class="layui-input form-input text-number ps01" required/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                               <!--  <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">证券托管户</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="secManageAcctId"
		                                    name="secManageAcctId"
		                                    allowClear="true"
		                                    class="layui-input form-input input-select"
		                                    data-th-data-url="@{/invest/period/trdstockbonus/TrdStockBonus001/getSecManageAcctId}"
		                                    placeholder="请输入内容"
		                                    th:initValue="${entity?.secManageAcctId}"
		                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                required>
		                                </select>
                                    </div>
                                </div> -->
                                <!-- <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{invest.channelId}">通道</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="chlId"
		                                    name="chlId"
		                                    allowClear="true"
		                                    class="layui-input form-input input-select"
                                            data-th-data-url="@{/component/trade/BussChannelCommon/getChannelId}"
		                                    placeholder="请输入内容"
		                                    th:initValue="${entity?.chlId}"
		                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                required>
		                                </select>
                                    </div>
                                </div> -->
                                <!-- <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdStockBonus001.registDateShare}">权益登记日股本</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="regDateAmt" name="regDateAmt" data-textrange='4' data-th-value='${entity?.regDateAmt}'  class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div> -->
                            </div>
                           <!--  <div class="layui-form-item">
                                
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdStockBonus001.dividAmount}">分红金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="fpriceAmt" name="fpriceAmt" data-textrange='4'  data-th-value='${entity?.fpriceAmt}'
                                        	class="layui-input form-input text-number ps01" required/><span
                                                class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdStockBonus001.dividShare}">分红股本</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="shareAmt" name="shareAmt" data-textrange='4' data-th-value='${entity?.shareAmt}' class="layui-input form-input text-number ps02" required/>
                                    </div>
                                </div>
                            </div> -->
                        </div>
                    </div>
                </div>

                <div class="pro-module-wrap llfx">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">分红明细信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <table class="layui-table" id="intDetailTable" th:name="dividDetailInfoList"></table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"
                            style="border-top: 1px solid #ccc;">
                            <span class="title-des" th:text="#{TrdFundDuration001.remark}">备注</span><i
                                class="iconfont icon-arrow-down pro-down-icon"
                                ></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap"
                                     style="width: 100%;">
                                    <div class="layui-input-inline input-inline"
                                            style="margin:0 10px;width: 98% !important;">
                                            <textarea id="remark" name="remark" type="text"
                                                      maxlength="200"
                                                      class="layui-input layui-textarea"
                                                      placeholder="请输入内容"
                                                      th:text="${entity?.remark}"
                                                      data-th-placeholder="#{SysCommon.placeholder}"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
        </div>
        <div class="layui-form-item" align="center">
            <a id="TrdStockBonus002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="TrdStockBonus002_btn_submit" class="layui-btn layui-btn-sm  btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="TrdStockBonus002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
    	var formTodoList = /*[[${formTodoList}]]*/'';
    	var STOCK_DEVISION_TYPE01 = /*[[${STOCK_DEVISION_TYPE01}]]*/'';
    	var STOCK_DEVISION_TYPE02 = /*[[${STOCK_DEVISION_TYPE02}]]*/'';
    	var STOCK_DEVISION_TYPE03 = /*[[${STOCK_DEVISION_TYPE03}]]*/'';
    	var YES_OR_NO = /*[[${YES_OR_NO}]]*/'';
    	var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'';
    	var dividInfoList =  /*[[${entity?.dividDetailInfoList}]]*/'';
    	var workflowId = /*[[${workflowId}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/period/trdstockbonus/TrdStockBonus002.js}" type="text/javascript"></script>
</div>
</body>

</html>
