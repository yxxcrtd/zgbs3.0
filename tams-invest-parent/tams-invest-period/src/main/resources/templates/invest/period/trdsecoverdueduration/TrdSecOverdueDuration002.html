<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{[#pageId]}">[#title]</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">基本信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration001.busiCode}">业务编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" name="invAim" data-th-value="${entity?.invAim}"/>
                                        <input type="hidden" name="workflowId" data-th-value="${entity?.workflowId}"/>
                                        <input type="hidden" name="ccy" data-th-value="${entity?.ccy}"/>
                                        <input type="hidden" name="statusValid" data-th-value="${entity?.statusValid}"/>
                                        <input type="hidden" name="paBussType" data-th-value="${entity?.paBussType}"/>
                                        <input type="hidden" id="finprodId" name="finprodId" data-th-value="${entity?.finprodId}"/>
                                        <input type="hidden" id='tradeMarket' name="tradeMarket" data-th-value="${entity?.tradeMarket}"/>
                                        <input type="hidden" id="bjBranch" name="bjBranch" data-th-value="${entity?.bjBranch}"/><!-- 本金分支序号 -->
                                        <input type="hidden" id="liBranch" name="liBranch" data-th-value="${entity?.liBranch}"/><!-- 利息分支序号 -->
                                        <input type="text" id="busiCode" name="busiCode" data-th-value="${entity?.busiCode}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                
                                <div  class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdFundDuration001.finprodType}">资产类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" id="finprodType2" name="finprodType2" data-th-value="${entity?.finprodType2}"/>
                                        <input type="text" id="finprodTypeName" name="finprodTypeName" data-th-value="${entity?.finprodTypeName}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                 <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"  data-th-text="|#{EtrStandardBond002.secAcctId}#{invest.channelId}|">证券账户/通道</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" id="secAcctId" name="secAcctId" data-th-value="${entity?.secAcctId}"/>
                                        <input type="hidden" id="channel" name="channel" data-th-value="${entity?.channel}" />
                                        <input type="hidden" id="collectType" name="collectType" data-th-value="${entity?.collectType}"/>
                                        <input type="text" id="chIldName" name="chIldName" data-th-value="${entity?.chIldName}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                               
                            </div>
                            <div class="layui-form-item">
                            	 <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration001.finprodMarketId}">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" name="finprodMarketName" data-th-value="${entity?.finprodMarketName}"/>
                                        <input type="text" id="finprodMarketId" name="finprodMarketId" data-th-value="${entity?.finprodMarketId}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration001.finprodName}">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodName" name="finprodName" data-th-value="${entity?.finprodName}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                               
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration001.cashType}">类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" name="cashType" data-th-value="${entity?.cashType}"/>
                                        <input type="text" id="paBussTypeString" name="paBussTypeString" data-th-value="${entity?.paBussTypeString}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                
                            </div>
                            <div class="layui-form-item">
                            
                            <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" >计息起始日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="vdate" name="vdate" data-th-value="${#dates.format(entity?.vdate,'yyyy-MM-dd')}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" >计息结束日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="mdate" name="mdate" data-th-value="${#dates.format(entity?.mdate,'yyyy-MM-dd')}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                 <div class="form-inline-wrap cash-type-01">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdSecOverdueDuration002.theoryPrin}" >未支付本金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="theoryPrin" name="theoryPrin" data-th-value="${entity?.theoryPrin}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                 <div class="form-inline-wrap cash-type-02">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdSecOverdueDuration002.theoryInt}" >未支付利息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="theoryInt" name="theoryInt" data-th-value="${entity?.theoryInt}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                                 <div class="form-inline-wrap cash-type-02">
                                    <label class="layui-form-label form-label-wrap" >理论罚息总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="theoryPenaltyInt" name="theoryPenaltyInt" data-th-value="${entity?.theoryPenaltyInt}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"data-th-text="#{TrdSecOverdueDuration002.prinAmt}" >实收本金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="prinAmt" name="prinAmt"  data-th-value="${entity?.prinAmt}" required="required"class="layui-input form-input text-number" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                               <div class="form-inline-wrap cash-type-02">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdSecOverdueDuration002.intAmt}">实收利息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="intAmt" name="intAmt" data-th-value="${entity?.intAmt}"required="required" class="layui-input form-input text-number" />
                                    </div>
                                </div>
                                 <div class="form-inline-wrap cash-type-02">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdSecOverdueDuration002.penaltyIntamt}">实收罚息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="penaltyIntamt" name="penaltyIntamt"required="required" data-th-value="${entity?.penaltyIntamt}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdSecOverdueDuration002.tradeAmt}">实收本息总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeAmt" name="tradeAmt" required="required" data-th-value="${entity?.tradeAmt}" class="layui-input form-input text-number" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                            	<div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdSecOverdueDuration002.tradeDate}">资金到账日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeDate" name="tradeDate" data-th-value="${#dates.format(entity?.tradeDate,'yyyy-MM-dd')}" required="required"
                                               class="layui-input form-input input-dateSelect"/>
                                    </div>
                                </div>
                                 <div  class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdSecOverdueDuration002.isClean}">是否结清</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="isClean" name="isClean" required="required"
                                                class="layui-input form-input input-select"  
                                                th:data-result='${YES_OR_NO}' allowClear="false"
                                                th:initValue="${entity?.isClean}"
                                                data-th-placeholder="#{SysCommon.placeholder}" >
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" id='channelFee_div'style="display:none">
                                    <label class="layui-form-label form-label-wrap" data-th-text="|#{invest.channelId}#{TrdBondDuration002.channelFee}|">通道费</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="channelFee" name="channelFee" data-th-value="${entity?.channelFee}" class="layui-input form-input text-number" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!--利息明细信息-->
                <div class="pro-module-wrap sjfx">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">利息明细信息</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <table class="layui-table" id="intDetailTable" th:name="finAssetIntInfoList"></table>
                        </div>
                    </div>
                </div>
                <!-- <div class="pro-module-wrap" th:id="|bussTrdTransferOrder_div|">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">指令信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <input type="hidden" th:id="|bussTrdTransferOrder_payAcctNo|" th:name="selectValue" value="pay">
                                <input type="hidden" th:id="|bussTrdTransferOrder_recAcctNo|" th:name="selectValue" value="rec">
                                <a th:id="|bussTrdTransferOrder_btn_generate|" class="layui-btn layui-btn-sm" th:text="#{BussTrdTransferOrder.generate}">生成指令</a>
                            </div>
                            <table class="layui-table" th:id="|bussTrdTransferOrder_table|" th:name="bussTrdTransferOrder"></table>
                        </div>
                    </div>
                </div> -->
                <!-- 划款信息 -->
	            <!-- <div class="page-component" th:data-path="@{/component/trade/BussTrdTransferOrder/init}" id="bussTrdTransferOrder_div"
	                 th:data-params="|{entityName: 'bussTrdTransferOrder', pageFrom: 'submitForm', entity:'${entity_bussTrdTransferOrder}', bizCode:'${tradeId}'}|">
	            </div> -->
                <!-- 划款信息 -->
                 <div class="page-component hkxx" th:data-path="@{/component/trade/BussTrdTransferOrder/init}"
                     th:data-params="|{entityName: 'bussTrdTransferOrder', entityList:'${entity_bussTrdTransferOrderDto}', bizCode:'${entity?.busiCode}',isMulti:'1'}|"></div> 
            </div>
            <!-- add by zhangpuyu 2019/10/30 start -->
            <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                 th:data-params="|{entityName: 'uploadFileList', businessId: '${entity?.busiCode?: ''}'}|"></div>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"
                        style="border-top: 1px solid #ccc;">
                        <span class="title-des" th:text="#{TrdFundDuration001.remark}">备注</span><i
                            class="iconfont icon-arrow-down pro-down-icon"
                    ></i>
                    </h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap"
                                 style="width: 100%;">
                                <div class="layui-input-inline input-inline"
                                     style="margin:0 10px;width: 98% !important;">
                                            <textarea id="remark" name="remark" type="text"
                                                      maxlength="200"
                                                      class="layui-input layui-textarea"
                                                      placeholder="请输入内容"
                                                      th:text="${entity?.remark}"
                                                      data-th-placeholder="#{SysCommon.placeholder}"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- add by zhangpuyu 2019/10/30 end -->
            <div class="layui-form-item" data-th-if="${entity?.revokeReason}">
                <div class="layui-inline layui-col-md12 layui-col-sm12 layui-col-lg12 layui-col-xs12">
                    <fieldset class='adver-fieldset'>
                        <legend>撤销理由</legend>
                        <div class="layui-input-block" style="margin-left:0px;">
                        <textarea id="revokeReason" name="revokeReason" data-th-text="${entity?.revokeReason}" placeholder="请输入内容"
                                  class="layui-textarea"></textarea>
                        </div>
                    </fieldset>
                </div>
            </div>
        </div>
        <div class="layui-form-item" align="center">
            <a id="TrdSecOverdueDuration002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="TrdSecOverdueDuration002_btn_submit" class="layui-btn layui-btn-sm  btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="TrdSecOverdueDuration002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var CASH_CLASS_TYPE01 = /*[[${CASH_CLASS_TYPE01}]]*/'';
        var CASH_CLASS_TYPE02 = /*[[${CASH_CLASS_TYPE02}]]*/'';
        var CASH_TYPE = /*[[${entity?.cashType}]]*/'';
        var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'';
        var needInit = /*[[${needInit}]]*/'';
        var deal = /*[[${deal}]]*/'';
        var YES_NO = /*[[${YES_OR_NO}]]*/'';
        var PAY_TYPE = /*[[${PAY_TYPE}]]*/'';
        var formTodoList = /*[[${formTodoList}]]*/'';
        var getSaleDepartment = /*[[@{/invest/product/productduration/addreduce/FinProductAddReduce002/getSaleDepartment}]]*/'';
        var bussTrdTransferOrderDtos = /*[[${entity?.bussTrdTransferOrder}]]*/'';
        var finAssetIntInfoList = /*[[${entity?.finAssetIntInfoList}]]*/'';
        var YES_OR_NO = /*[[${YES_OR_NO}]]*/'';
        var CCY = /*[[${CCY}]]*/'';
        var INV_AIM = /*[[${INV_AIM}]]*/'';
        var workflowId = /*[[${workflowId}]]*/'';
        var ASSET_SOURCE = /*[[${ASSET_SOURCE}]]*/'';
        var COLLECT_TYPE = /*[[${entity?.collectType}]]*/'';
        var CHANNEL=/*[[${entity?.channel}]]*/'';
        var COLLECT_TYPE_01=/*[[${COLLECT_TYPE_01}]]*/'';
        var IS_CAL_LOADRATE = /*[[${IS_CAL_LOADRATE}]]*/'';
        var childPortfolioInfo=/*[[${childPortfolioInfo}]]*/'';
        var FINPROD_TYPE_TG_F01 = /*[[${FINPROD_TYPE_TG_F01}]]*/'';
        var FINPROD_TYPE_TG_F07 = /*[[${FINPROD_TYPE_TG_F07}]]*/'';
        var FINPROD_TYPE_TG_F18 = /*[[${FINPROD_TYPE_TG_F18}]]*/'';
        var FINPROD_TYPE_TG_F17 = /*[[${FINPROD_TYPE_TG_F17}]]*/'';
        var FINPRODMARKETID = /*[[${entity?.finprodMarketId}]]*/'';
        var mdate = /*[[${entity?.mdate}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/period/trdsecoverdueduration/TrdSecOverdueDuration002.js}" type="text/javascript"></script> 
</div>
</body>

</html>
