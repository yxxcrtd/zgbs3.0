<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{TrdSecOverTransfer001}">已到期资产查询</title>
    <style>
        .select2-search--dropdown.select2-search--hide{
            display: block;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a id="TrdSecOverTransfer001_btn_revoke" class="layui-btn layui-btn-sm"><i class="iconfont icon-revoke"></i><span data-th-text="#{pingan.common.revoke}">撤销</span></a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable" data-th-text="#{TrdSecOverTransfer001.portfolioId}">组合代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="portfolioId" name="portfolioId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId}"
                                multiple="true" >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable" data-th-text="#{TrdSecOverTransfer001.finprodId}">资产代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="finprodId" name="finprodId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/period/trdsecoverdueduration/TrdSecOverdueDuration001/getFinprodMarketId}"
                                multiple="true" >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{TrdSecOverTransfer001.transferDate}">转让日期</label>
                    <div class="layui-input-inline input-inline">
                        <input id='transferDate' name='transferDate'
                               class="layui-input form-input input-dateRangeSelect"
                               placeholder="请选择、支持区间" data-th-placeholder="#{SysCommon.dateInterval}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable" data-th-text="#{TrdSecOverTransfer001.counterId}">交易对手</label>
                    <div class="layui-input-inline input-inline">
                        <select  id="counterId" name="counterId"
                                th:data-url="@{/component/trade/TrdInvestPersonInfo002/selectCounterId?innerTrade=true}"
                                formatOption="false"
                                multiple="true" allowClear="true"
                                class="layui-input form-input input-select"
                                th:placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable" data-th-text="#{TrdSecOverTransfer001.statusValid}">有效状态</label>
                    <div class="layui-input-inline input-inline">
                        <select id="statusValid" name="statusValid"
                                class="layui-input form-input input-select"
                                data-th-data-result='${STATUS_VALID}' multiple="true" allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var PAGE_DATA_STATUS_01 = /*[[${PAGE_DATA_STATUS_01}]]*/'';
        var PAGE_DATA_STATUS_05 = /*[[${PAGE_DATA_STATUS_05}]]*/'';
        var PS_T13 = /*[[${PS_T13}]]*/'';
        var PS_T11 = /*[[${PS_T11}]]*/'';
        var F01 = /*[[${F01}]]*/'';
        var BONUS_MODE_01 = /*[[${BONUS_MODE_01}]]*/'';
        var BONUS_MODE_02 = /*[[${BONUS_MODE_02}]]*/'';
    </script>
    <script
            data-th-src="@{/js/invest/period/trdsecovertransfer/TrdSecOverTransfer001.js}"
            type="text/javascript">
    </script>
</div>
</body>
</html>
