<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    xmlns:th="http://www.springframework.org/schema/mvc"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{TrdDepoDuration003}">存续期存款类资产确认</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap pro-module-form"
            id="informationForm">
            <div class="pro-module-container">
                <div class="pro-module-wrapper pro-module-base">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">基本信息</span><i
                                    class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <input style="display: none" type="text" id="finprodId"
                                name="finprodId" data-th-value="${entity?.finprodId}"
                                class="layui-input form-input" />
                            <input style="display: none" type="text" id="totleTradeId"
                                name="totleTradeId" data-th-value="${entity?.totleTradeId}"
                                class="layui-input form-input" />
                            <input style="display: none" type="text" id="cashId"
                                name="cashId" data-th-value="${entity?.cashId}"
                                class="layui-input form-input" />
                            <input style="display: none" type="text" id="opType"
                                name="opType" data-th-value="${opType}"
                                class="layui-input form-input" />
                            <input style="display: none" type="text" id="pTradeId"
                                name="pTradeId" data-th-value="${entity?.pTradeId}"
                                class="layui-input form-input" />
                            <input style="display: none" type="text" id="mode" name="mode"
                                data-th-value="${entity?.mode}" class="layui-input form-input" />
                            <input style="display: none" type="text" id="returnAmount" name="returnAmount"
                                data-th-value="${entity?.prinAmtTheory}" class="layui-input form-input" />
                            <input type="hidden" id="collectType" name="collectType" data-th-value="${entity?.collectType}"/>
                            <input type="hidden" id="channel" name="channel" data-th-value="${entity?.channel}"/>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.busiCode}">业务编号</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="busiCode" name="busiCode"
                                                data-th-value="${entity?.busiCode}"
                                                class="layui-input form-input" disabled />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.ccy}">币种</label>
                                        <div class="layui-input-inline input-inline">
                                            <select disabled id="ccy" name="ccy" allowClear="true"
                                                class="layui-input form-input input-select"
                                                data-th-data-result="${CCY}" placeholder="请输入内容"
                                                th:initValue="${entity?.ccy}"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.assetType}">资产类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <select disabled id="assetType" name="assetType"
                                                allowClear="true"
                                                class="layui-input form-input input-select"
                                                data-th-data-result="${DEPO_ASSET_TYPE}" placeholder="请输入内容"
                                                th:initValue="${opType eq 'draw' ? DEPO_ASSET_TYPE_01 : entity?.assetType}"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.finprodMarketId}">资产代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="finprodMarketId" name="finprodMarketId"
                                                allowClear="true"
                                                class="layui-input form-input input-select"
                                                data-th-initValue="${entity?.finprodMarketId}"
                                                th:disabled="${opType eq 'edit'}" parentids="opType"
                                                formatoption="false"
                                                data-th-data-url="@{/invest/period/trddepoduration/TrdDepoDuration001/getFinprodMarketId}"
                                                placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.finprodName}">资产名称</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="finprodMarketName"
                                                name="finprodMarketName"
                                                data-th-value="${entity?.finprodMarketName}"
                                                class="layui-input form-input" disabled />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.remainPrinAmt}">剩余本金</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="remainPrinAmt" name="remainPrinAmt"
                                                data-th-value="${entity?.remainPrinAmt}"
                                                class="layui-input form-input text-number" disabled />
                                                
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.cashType}">类型</label> <input
                                            type="hidden" name="cashType"
                                            data-th-value="${entity?.cashType}" data-ignore="true"/>
                                        <div class="layui-input-inline input-inline">
                                            <select disabled id="pingAnCodeSin" name="pingAnCodeSin"
                                                allowClear="true"
                                                class="layui-input form-input input-select"
                                                data-th-data-result="${PINAN_BUSINESS_TYPE}"
                                                placeholder="请输入内容"
                                                th:initValue="${opType eq 'draw' ? pACode_10 : entity?.pingAnCodeSin}"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.vdate}">起息日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="vdate" name="vdate"
                                                data-th-value="${#dates.format(entity?.vdate,'yyyy-MM-dd')}"
                                                class="layui-input form-input" disabled />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.mdate}">到期日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="mdate" name="mdate"
                                                data-th-value="${#dates.format(entity?.mdate,'yyyy-MM-dd')}"
                                                class="layui-input form-input" disabled />
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.vdateProd}">计息开始日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="vdateProd" name="vdateProd"
                                                data-th-value="${#dates.format(entity?.vdateProd,'yyyy-MM-dd')}"
                                                class="layui-input form-input" disabled />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.mdateProd}">计息结束日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="mdateProd" name="mdateProd"
                                                data-th-value="${#dates.format(entity?.mdateProd,'yyyy-MM-dd')}"
                                                class="layui-input form-input input-dateSelect"
                                                th:disabled="${opType eq 'edit'}" />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.basis}">计息基础</label>
                                        <div class="layui-input-inline input-inline">
                                            <select disabled id="basis" name="basis" allowClear="true"
                                                class="layui-input form-input input-select"
                                                data-th-data-result="${BASIS}" placeholder="请输入内容"
                                                th:initValue="${entity?.basis}"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item" >
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.entruster}">委托行</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="entruster" name="entruster"
                                                data-th-value="${entity?.entruster}"
                                                class="layui-input form-input" disabled />
                                        </div>
                                    </div>
                                    <!--                                     <div class="form-inline-wrap">
                                        <label
                                            class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.counterId}">交易对手</label>
                                        <div
                                            class="layui-input-inline input-inline">
                                            <select disabled
                                                id="counterId"
                                                name="counterId"
                                                allowClear="true"
                                                class="layui-input form-input input-select"
                                                data-th-data-result="${BASIS}"
                                                placeholder="请输入内容"
                                                th:initValue="${entity?.counterId}"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                            </select>
                                        </div>
                                    </div> -->
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.loadRate}">借款利率</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="loadRate" name="loadRate"
                                                data-th-value="${entity?.loadRate}"
                                                class="layui-input form-input text-number"
                                                data-textrange="4" disabled />
                                        </div>
                                    </div>
                                    <!-- 通道存续期 qiangchengxi start-->
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{invest.channelId}">通道</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="hidden" id="chlId" name="chlId" data-th-value="${entity?.chlId}"/>
                                            <input type="text" id="channelName" name="channelName"
                                                   data-th-value="${entity?.channelName}"
                                                   class="layui-input form-input"
                                                   data-textrange="4" disabled/>
                                        </div>
                                    </div>
                                    <!-- 通道存续期 qiangchengxi end-->
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" th:if="${entity?.assetType eq DEPO_ASSET_TYPE_01 or opType eq 'draw'}" style="display:none">
                                        <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.yield}">资产推荐费率</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="yield" name="yield"
                                                data-th-value="${entity?.yield}"
                                                class="layui-input form-input text-number"
                                                data-textrange="4" disabled />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" th:if="${entity?.assetType eq DEPO_ASSET_TYPE_01 or opType eq 'draw'}"  style="display:none">
                                        <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.feeAmt}">资产推荐费</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="feeAmt" name="feeAmt"
                                                data-th-value="${entity?.feeAmt}"
                                                class="layui-input form-input text-number" />
                                        </div>
                                    </div>
                                    <div  class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{TrdSecOverdueDuration002.isClean}">是否结清</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="isClean" name="isClean" required="required"
                                                    class="layui-input form-input input-select"
                                                    th:data-result='${YES_OR_NO}' allowClear="true"
                                                    th:initValue="${entity?.isClean}"
                                                    data-th-placeholder="#{SysCommon.placeholder}" >
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{TrdDepoDuration001.payDateProd}">理论支付日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="payDateProd" name="payDateProd"
                                                   data-th-value="${#dates.format(entity?.payDateProd,'yyyy-MM-dd')}"
                                                   class="layui-input form-input input-dateSelect"
                                                   disabled />
                                        </div>
                                    </div>
                                </div>
<!--                                 <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.secManageAcctId}">证券托管户</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="secManageAcctId"
                                                name="secManageAcctId"
                                                data-th-value="${entity?.secManageAcctId}"
                                                class="layui-input form-input" disabled />
                                        </div>
                                    </div>
                                </div> -->
                            </div>
                        </div>
                    </div>

                    <div class="pro-module-wrap sjfx">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">付息信息</span><i
                                    class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap cash-type-02">
                                        <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.intAmtTheory}">理论应计利息</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="theoryInt" name="theoryInt"
                                                data-th-value="${entity?.theoryInt}"
                                                class="layui-input form-input text-number" disabled />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap cash-type-01 cash-type-02">
                                        <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.tradeAmtTheory}">理论本息总额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="fpriceAmt" name="fpriceAmt"
                                                data-th-value="${entity?.fpriceAmt}"
                                                class="layui-input form-input text-number" disabled />
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.intAmtReal}">实收利息总额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="intAmt" name="intAmt"
                                                data-th-value="${entity?.intAmt}"
                                                class="layui-input form-input text-number" />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap cash-type-01 cash-type-02">
                                        <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.tradeAmt}">实收本息总额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="tradeAmtReal" name="tradeAmtReal"
                                                data-th-value="${entity?.tradeAmtReal}"
                                                class="layui-input form-input text-number" maxlength="30" />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.fundAtDate}">资金到账日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="tradeDate" name="tradeDate" required
                                                data-th-value="${#dates.format(entity?.tradeDate,'yyyy-MM-dd')}"
                                                class="layui-input form-input input-dateSelect" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="pro-module-item">
	                            <div class="layui-form-item">
	                                <div class="form-inline-wrap">
	                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdDepoDuration003.tradeAmtArrive}">到账金额</label>
	                                    <div class="layui-input-inline input-inline">
	                                        <input type="text" id="tradeAmt" name="tradeAmt" data-th-value="${entity?.tradeAmt}" class="layui-input form-input text-number" maxlength="30" disabled/>
	                                    </div>
	                                </div>
	                                <div class="form-inline-wrap">
	                                    <label class="layui-form-label form-label-wrap" data-th-text="|#{invest.channelId}#{TrdDepoDuration003.channelFee}|">通道费</label>
	                                    <div class="layui-input-inline input-inline">
	                                        <input type="text" id="channelFee" name="channelFee" data-th-value="${entity?.channelFee}" class="layui-input form-input text-number" disabled/>
	                                    </div>
	                                </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!--利息明细信息-->
                    <div class="pro-module-wrap sjfx">
                        <div class="pro-module">
                            <h3 class="pro-module-title"><span class="title-des">利息明细信息</span>
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <table class="layui-table" id="intDetailTable" th:name="finAssetIntInfoList"></table>
                            </div>
                        </div>
                    </div>
                    <div class="pro-module-wrap" th:id="|bussTrdTransferOrder_div|" th:style="${GEN_PAY_ORDERS_AUTO == '01'?'display:none':''}">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">指令信息</span><i
                                    class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <a th:id="|bussTrdTransferOrder_btn_generate|" class="layui-btn layui-btn-sm" th:text="#{BussTrdTransferOrder.generate}">生成指令</a>
                                </div>
                                <table class="layui-table" th:id="|bussTrdTransferOrder_table|" th:name="bussTrdTransferOrder"></table>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- add by zhangpuyu 2019/10/30 start -->
                <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                     th:data-params="|{entityName: 'uploadFileList', businessId: '${tradeId ?: ''}'}|"></div>
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"
                            style="border-top: 1px solid #ccc;">
                            <span class="title-des" th:text="#{TrdFundDuration001.remark}">备注</span><i
                                class="iconfont icon-arrow-down pro-down-icon"
                        ></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap"
                                     style="width: 100%;">
                                    <div class="layui-input-inline input-inline"
                                         style="margin:0 10px;width: 98% !important;">
                                            <textarea id="remark" name="remark" type="text"
                                                      maxlength="200"
                                                      class="layui-input layui-textarea"
                                                      placeholder="请输入内容"
                                                      th:text="${entity?.remark}"
                                                      data-th-placeholder="#{SysCommon.placeholder}"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- add by zhangpuyu 2019/10/30 end -->
            </div>
            <div class="layui-form-item" align="center">
                <a id="TrdDepoDuration003_btn_save"
                    class="layui-btn layui-btn-sm btn-save"
                    data-th-text="#{SysCommon.save}">保存</a> <a
                    id="TrdDepoDuration003_btn_submit"
                    class="layui-btn layui-btn-sm  btn-submit"
                    data-th-text="#{SysCommon.submit}">提交</a> <a
                    id="TrdDepoDuration003_btn_cancel"
                    class="layui-btn layui-btn-sm  btn-cancel"
                    data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </form>
    </div>
    <div layout:fragment="script">
        <script th:inline="javascript" type="text/javascript">
            var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
            var YES_OR_NO = /*[[${YES_OR_NO}]]*/'';
            var YES_NO = /*[[${YES_OR_NO}]]*/'';
            var CCY = /*[[${CCY}]]*/'';
            var opType = /*[[${opType}]]*/'';
            var CASH_CLASS_TYPE01 = /*[[${CASH_CLASS_TYPE01}]]*/'';
            var CASH_CLASS_TYPE02 = /*[[${CASH_CLASS_TYPE02}]]*/'';
            var CASH_TYPE = /*[[${entity?.cashType}]]*/'';
            var pACode_10 = /*[[${pACode_10}]]*/'';
            var dealString = /*[[${deal}]]*/'';
            var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'';
            var PS_DEFAULT = /*[[${PS_DEFAULT}]]*/'';
            var FINPRODTYPE_DEFAULT = /*[[${FINPRODTYPE_DEFAULT}]]*/'';
            var bussTrdTransferOrderDtos = /*[[${entity?.bussTrdTransferOrder}]]*/'';
            var finAssetIntInfoList = /*[[${entity.finAssetIntInfoList}]]*/'';
            var formTodoList = /*[[${formTodoList}]]*/'';
            var workflowId = /*[[${workflowId}]]*/'';
            var COLLECT_TYPE = /*[[${entity?.collectType}]]*/'';
            var COLLECT_TYPE_01 = /*[[${COLLECT_TYPE_01}]]*/'';
            var CHANNEL=/*[[${entity?.channel}]]*/'';
            var IS_CAL_LOADRATE = /*[[${IS_CAL_LOADRATE}]]*/'';
            var GEN_PAY_ORDERS_AUTO=/*[[${GEN_PAY_ORDERS_AUTO}]]*/'';

        </script>
        <script
            data-th-src="@{/js/invest/period/trddepoduration/TrdDepoDuration003.js}"
            type="text/javascript"></script>
    </div>
</body>

</html>
