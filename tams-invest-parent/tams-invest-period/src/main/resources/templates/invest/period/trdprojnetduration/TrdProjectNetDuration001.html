<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{TrdProjectNetDuration001}">权益类资产分红查询</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div
                class="layui-col-md12 layui-col-sm12 layui-col-lg12 layui-col-xs12 form-button-area"
                style="margin: 10px;">
            <a id="TrdProjectNetDuration001_btn_add" class="layui-btn layui-btn-sm btn-create">新建</a>
            <a id="TrdProjectNetDuration001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="#{SysCommon.revoke}"></a>
        </div>
        <div  class='joyin-form-wrap joyin-filter-form condition-area'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable">业务编号</label>
                        <div class="layui-input-inline input-inline">
                            <select id="busiCode" name="busiCode" formatoption="false"
                                    class="layui-input form-input input-select"
                                    data-th-data-url="@{/invest/period/trdprojnetduration/TrdProjectNetDuration001/getBusiCode}"
                                    allowClear="true" placeholder="请输入内容" >
                            </select>
                        </div>
                    </div>
                    <div
                            class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{TrdProjectNetDuration001.pageDataStatus}">有效状态</label>
                        <div class="layui-input-inline input-inline">
                            <select id="statusValid"
                                    name="statusValid"
                                    multiple="true"
                                    class="layui-input form-input input-select"
                                    data-th-data-result='${PAGE_DATA_STATUS}'
                                    allowClear="true"
                                    placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>
                    <div
                            class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{TrdProjectNetDuration001.exRightsDate}">除权日</label>
                        <div class="layui-input-inline input-inline">
                            <input id='exRightsDate' name='exRightsDate'
                                   class="layui-input form-input input-dateRangeSelect"
                                   placeholder="请选择、支持区间"
                                   data-th-placeholder="#{SysCommon.dateInterval}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div
                            class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{TrdProjectNetDuration001.arriveDate}">分红到账日</label>
                        <div class="layui-input-inline input-inline">
                            <input id='arriveDate' name='arriveDate'
                                   class="layui-input form-input input-dateRangeSelect"
                                   placeholder="请选择、支持区间"
                                   data-th-placeholder="#{SysCommon.dateInterval}">
                        </div>
                    </div>
                    <div
                            class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{TrdProjectNetDuration001.finprodMarketId}">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <select id="finprodMarketId"
                                    name="finprodMarketId"
                                    allowClear="true"
                                    class="layui-input form-input input-select"
                                    data-th-data-url="@{/invest/period/trdprojnetduration/TrdProjectNetDuration001/getFinprodMarketId}"
                                    placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>
                    <div
                            class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4" style="display: none">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{TrdProjectNetDuration001.bonusMode}">类型</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="bonusMode"
                                   name="bonusMode"
                                   class="layui-input form-input input-checkbox"
                                   data-th-data-result='${BONUS_MODE}'>
                        </div>
                    </div>
                    <div
                            class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{TrdProjectNetDuration001.registDate}">权益登记日</label>
                        <div class="layui-input-inline input-inline">
                            <input id='registDate' name='registDate'
                                   class="layui-input form-input input-dateRangeSelect"
                                   placeholder="请选择、支持区间"
                                   data-th-placeholder="#{SysCommon.dateInterval}">
                        </div>
                    </div>
                </div>

                <!--<div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable">一级分类</label>
                        <div class="layui-input-inline input-inline">
                            <select id="secondAssets" name="secondAssets"
                                    class="layui-input form-input input-select"
                                    data-th-data-result='${CUSTOM_ASSET_TYPE_TWO}'
                                    allowClear="true" placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>
                </div>-->
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var PAGE_DATA_STATUS_01 = /*[[${PAGE_DATA_STATUS_01}]]*/'';
        var PAGE_DATA_STATUS_05 = /*[[${PAGE_DATA_STATUS_05}]]*/'';
        var PS_T11 = /*[[${PS_T11}]]*/'';
        var PS_T13 = /*[[${PS_T13}]]*/'';
        var BONUS_MODE_01 = /*[[${BONUS_MODE_01}]]*/'';
        var BONUS_MODE_02 = /*[[${BONUS_MODE_02}]]*/'';
    </script>
    <script
            data-th-src="@{/js/invest/period/trdprojnetduration/TrdProjectNetDuration001.js}"
            type="text/javascript">
    </script>
</div>
</body>
</html>
