<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{[#pageId]}">[#title]</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <input style="display:none" type="text" id="type"name="type" data-th-value="${type}" class="layui-input form-input"/>
                        <input style="display:none" type="text" id="mode" name="mode" data-th-value="${entity.mode}" class="layui-input form-input"/>
                        <input style="display:none" type="text" id="totleTradeId" name="totleTradeId" data-th-value="${entity?.totleTradeId}" class="layui-input form-input"/>
                        <input style="display:none" type="text" id="busiCode" name="busiCode" data-th-value="${entity?.busiCode}" class="layui-input form-input"/>
                        <input style="display:none" type="text" id="finprodId" name="finprodId" data-th-value="${entity?.finprodId}" class="layui-input form-input"/>
                        <input style="display:none" type="text" id="workflowId" name="workflowId" data-th-value="${entity?.workflowId}" class="layui-input form-input"/>
                        <input style="display:none" type="text" id="busiType" name="busiType" data-th-value="${entity?.busiType}" class="layui-input form-input"/>
                        <input style="display:none" type="text" id="pTradeId" name="pTradeId" data-th-value="${entity?.pTradeId}" class="layui-input form-input"/>
                        <input style="display:none" type="text" id="regDateAmt" name="regDateAmt" class="layui-input form-input"/>
                        <!--交易场所-香港联合交易所-->
                        <input style="display:none" type="text" id="tradeMarket" name="tradeMarket" data-th-value="${entity?.tradeMarket}" class="layui-input form-input"/>
                        <!--通知文件编号-->
                        <input style="display:none" type="text" id="bTradeId" name="bTradeId" data-th-value="${entity?.bTradeId}" class="layui-input form-input"/>
                        <!--港股通市场-->
                        <input style="display:none" type="text" id="hkseMarket" name="hkseMarket" data-th-value="${entity?.hkseMarket}" class="layui-input form-input"/>

                        <h3 class="pro-module-title"><span class="title-des">基本信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdBondDuration001.finprodMarketId}">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" name="finprodMarketName"
                                               data-th-value="${entity?.finprodMarketId}"/>
                                        <select id="finprodMarketId"
                                                formatoption=false
                                                name="finprodMarketId"
                                                allowClear="true"
                                                class="layui-input form-input input-select"
                                                data-th-data-url="@{/invest/period/trdstockconnectbonus/TrdStockConnectBonus001/getFinprodMarketId}"
                                                placeholder="请输入内容"
                                                th:initValue="${entity?.finprodMarketId}"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                required
                                                >
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdStockConnectBonus001.finprodMarketName}">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodAbbr" name="finprodAbbr"
                                               data-th-value="${entity?.finprodAbbr}" class="layui-input form-input"
                                               disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdStockConnectBonus001.ps}">分红类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="ps"
                                                name="ps"
                                                allowClear="true"
                                                class="layui-input form-input input-select"
                                                data-th-data-result="${STOCK_DEVISION_TYPE}"
                                                placeholder="请输入内容"
                                                th:initValue="${entity?.ps}"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                required>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdStockConnectBonus001.regDate}">权益登记日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="regDate" name="regDate"
                                               data-th-value="${#dates.format(entity?.regDate,'yyyy-MM-dd')}"
                                               class="layui-input form-input input-dateSelect" required/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdStockConnectBonus001.tradeDate}">除权（除息）日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeDate" name="tradeDate"
                                               data-th-value="${#dates.format(entity?.tradeDate,'yyyy-MM-dd')}"
                                               class="layui-input form-input input-dateSelect" required/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdStockConnectBonus001.settleDate}">派息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="settleDate" name="settleDate"
                                               data-th-value="${#dates.format(entity?.settleDate,'yyyy-MM-dd')}"
                                               class="layui-input form-input input-dateSelect"
                                               required/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="红股上市日">红股上市日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="redStockDate" name="redStockDate"
                                               data-th-value="${#dates.format(entity?.redStockDate,'yyyy-MM-dd')}"
                                               class="layui-input form-input input-dateSelect" required/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdStockConnectBonus001.ifDividend}">是否含股利选择权</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="ifDividend" name="ifDividend" required
                                                class="layui-input form-input input-select ps01"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${YES_OR_NO}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.ifDividend}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdStockConnectBonus001.unitCprice}">每股送转</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="unitCprice" name="unitCprice" data-textrange="8"
                                               data-th-value='${entity?.unitCprice}'
                                               class="layui-input form-input text-number ps02" required/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdStockConnectBonus001.dividCcy}">派息币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="dividCcy" name="dividCcy" required
                                                class="layui-input form-input input-select ps01"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${CCY}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.dividCcy}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdStockConnectBonus001.unitInt}">每股派息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="unitInt" name="unitInt" data-textrange="8"
                                               data-th-value='${entity?.unitInt}'
                                               class="layui-input form-input text-number ps01" required/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdStockConnectBonus001.replacePrice}">以股代息价格</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="replacePrice" name="replacePrice" data-textrange="8"
                                               data-th-value='${entity?.replacePrice}'
                                               class="layui-input form-input text-number ps01" required/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdStockConnectBonus002.exchangeRate}">汇率</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="exchangeRate" name="exchangeRate" data-textrange="8"
                                               data-th-value='${entity?.exchangeRate}'
                                               class="layui-input form-input text-number ps01" required />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="pro-module-wrap llfx">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">分红明细信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <table class="layui-table" id="intDetailTable" th:name="finAssetIntInfoList"></table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"
                        style="border-top: 1px solid #ccc;">
                        <span class="title-des" th:text="#{TrdFundDuration001.remark}">备注</span><i
                            class="iconfont icon-arrow-down pro-down-icon"
                    ></i>
                    </h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap"
                                 style="width: 100%;">
                                <div class="layui-input-inline input-inline"
                                     style="margin:0 10px;width: 98% !important;">
                                        <textarea id="remark" name="remark" type="text"
                                                  maxlength="200"
                                                  class="layui-input layui-textarea"
                                                  placeholder="请输入内容"
                                                  th:text="${entity?.remark}"
                                                  data-th-placeholder="#{SysCommon.placeholder}"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-form-item" align="center">
            <a id="TrdStockConnectBonus002_btn_save" class="layui-btn layui-btn-sm btn-save"
               data-th-text="#{SysCommon.save}">保存</a>
            <a id="TrdStockConnectBonus002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
               data-th-text="#{SysCommon.submit}">提交</a>
            <a id="TrdStockConnectBonus002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var formTodoList = /*[[${formTodoList}]]*/'';
        var STOCK_DEVISION_TYPE01 = /*[[${STOCK_DEVISION_TYPE01}]]*/'';
        var STOCK_DEVISION_TYPE02 = /*[[${STOCK_DEVISION_TYPE02}]]*/'';
        var YES_OR_NO = /*[[${YES_OR_NO}]]*/'';
        var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'';
        var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
        var dividInfoList =  /*[[${entity?.finAssetIntInfoList}]]*/'';
        var workflowId = /*[[${workflowId}]]*/'';
        var statusValid = /*[[${statusValid}]]*/'';
        var default_ccy= /*[[${default_ccy}]]*/'';
        var statusValid_01= /*[[${statusValid_01}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/period/trdstockconnectbonus/TrdStockConnectBonus002.js}"
            type="text/javascript"></script>
</div>
</body>

</html>
