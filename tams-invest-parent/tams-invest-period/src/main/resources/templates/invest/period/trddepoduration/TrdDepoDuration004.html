<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{TrdDepoDuration004}">活期存放结息</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form"
          id="informationForm">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">基本信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <input style="display:none" type="text"
                               id="finprodId"
                               name="finprodId"
                               data-th-value="${entity?.finprodId}"
                               class="layui-input form-input"
                        />
                        <input style="display:none" type="text"
                               id="totleTradeId"
                               name="totleTradeId"
                               data-th-value="${entity?.totleTradeId}"
                               class="layui-input form-input"
                        />
                        <input style="display:none" type="text"
                               id="cashId"
                               name="cashId"
                               data-th-value="${entity?.cashId}"
                               class="layui-input form-input"
                        />
                        <input style="display:none" type="text"
                               id="opType"
                               name="opType"
                               data-th-value="${opType}"
                               class="layui-input form-input"
                        />
                        <input style="display:none" type="text"
                               id="pTradeId"
                               name="pTradeId"
                               data-th-value="${entity?.pTradeId}"
                               class="layui-input form-input"
                        />
                        <input style="display:none" type="text"
                               id="mode"
                               name="mode"
                               data-th-value="${entity?.mode}"
                               class="layui-input form-input"
                        />
                        <input type="hidden" id="collectType" name="collectType" data-th-value="${entity?.collectType}"/>
                        <input type="hidden" id="channel" name="channel" data-th-value="${entity?.channel}" data-ignore="true"/>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.busiCode}">业务编号</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                        <input type="text"
                                               id="busiCode"
                                               name="busiCode"
                                               data-th-value="${entity?.busiCode}"
                                               class="layui-input form-input"
                                               disabled />
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.ccy}">币种</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                        <select disabled id="ccy"
                                                name="ccy"
                                                allowClear="true"
                                                class="layui-input form-input input-select"
                                                data-th-data-result="${CCY}"
                                                placeholder="请输入内容"
                                                th:initValue="${entity?.ccy?:CCY_default}"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.portfolioId}">组合代码</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                        <!--<select id="portfolioId" name="portfolioId"
                                                allowClear="true"
                                                class="layui-input form-input input-select"
                                                th:initValue="${entity?.portfolioId}"
                                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}"
                                                placeholder="请输入内容"
                                                formatoption = "false" required
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                th:disabled ="${opType eq 'edit' and pageModel ne '0'}">
                                        </select>-->
                                        <select required type="text" id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}" allowClear="true"
                                                formatoption="true"
                                                th:initValue="${entity?.portfolioId}"
                                                th:disabled ="${opType eq 'edit' and pageModel ne '0'}"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.portfolioName}">组合名称</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                        <input type="text"
                                               id="portfolioName"
                                               name="portfolioName"
                                               data-th-value="${entity?.portfolioName}"
                                               class="layui-input form-input"
                                               disabled />
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.assetType}">资产类型</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                        <select disabled
                                                id="assetType"
                                                name="assetType"
                                                allowClear="true"
                                                class="layui-input form-input input-select"
                                                data-th-data-result="${DEPO_ASSET_TYPE}"
                                                placeholder="请输入内容"
                                                th:initValue="${DEPO_ASSET_TYPE_03}"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.finprodMarketId}">资产代码</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                        <select id="finprodMarketId" name="finprodMarketId"
                                                allowClear="true"
                                                class="layui-input form-input input-select"
                                                data-th-initValue="${entity?.finprodMarketId}"
                                                th:disabled ="${opType eq 'edit'}"
                                                parentids ="opType"
                                                formatoption = "false"  required
                                                data-th-data-url="@{/invest/period/trddepoduration/TrdDepoDuration001/getFinprodMarketId}"
                                                placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.finprodName}">资产名称</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                        <input type="text"
                                               id="finprodMarketName"
                                               name="finprodMarketName"
                                               data-th-value="${entity?.finprodMarketName}"
                                               class="layui-input form-input"
                                               disabled />
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.remainPrinAmt}">剩余本金</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                        <input type="text"
                                               id="remainPrinAmt"
                                               name="remainPrinAmt"
                                               data-th-value="${entity?.remainPrinAmt}"
                                               class="layui-input form-input text-number"
                                               disabled />
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.cashType}">类型</label>
                                    <input type="hidden" name="cashType" data-th-value="${entity?.cashType}" />
                                    <div
                                            class="layui-input-inline input-inline">
                                        <select disabled
                                                id="pingAnCodeSin"
                                                name="pingAnCodeSin"
                                                allowClear="true"
                                                class="layui-input form-input input-select"
                                                data-th-data-result="${PINAN_BUSINESS_TYPE}"
                                                placeholder="请输入内容"
                                                th:initValue="${pACode_39}"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" id="vdate_div" >
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.vdate}">起息日</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                        <input type="text"
                                               id="vdateProd"
                                               name="vdateProd"
                                               data-th-value="${#dates.format(entity?.vdate,'yyyy-MM-dd')}"
                                               class="layui-input form-input input-dateSelect"
                                               disabled />
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.mdateProd}">计息结束日</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                       <input type="text"
                                               id="mdateProd" name="mdateProd" required
                                               class="layui-input form-input input-dateSelect"
                                               th:value="${entity?.mdateProd==null ? formatDate_1 : #dates.format(entity?.mdateProd,'yyyy-MM-dd')}"
                                               th:disabled ="${opType eq 'edit'}" />
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.basis}">计息基础</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                        <select disabled id="basis"
                                                name="basis"
                                                allowClear="true"
                                                class="layui-input form-input input-select"
                                                data-th-data-result="${BASIS}"
                                                placeholder="请输入内容"
                                                th:initValue="${entity?.basis}"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{FinPayInterestStdInfo.payCycle}">付息频率</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="payCycle" name="payCycle" th:initValue="${entity?.payCycle}" class="layui-input form-input input-select payCycle" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-result="${FREQUENCY_UNIT}" disabled>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{FinPayInterestStdInfo.payMonth}">付息月</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="payMonth"  name="payMonth" th:initValue="${entity?.payMonth}" multiple="true" class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-result="${MONTH}" disabled>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{FinPayInterestStdInfo.dayValue}">付息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="dayValue" name="dayValue" th:initValue="${entity?.dayValue}" multiple="true" class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-result="${DAY_OF_MONTH}" disabled>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.loadRate}">借款利率</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                        <input type="text"
                                               id="loadRate"
                                               name="loadRate"
                                               data-th-value="${entity?.loadRate}"
                                               class="layui-input form-input text-number"
                                               data-textrange="4"
                                               disabled />
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdDepoDuration001.intSettType}">结息方式</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="intSettType" id="intSettType"
                                               data-th-initValue="${entity?.intSettType?:INT_SETT_TYPE_01}" required="required"
                                               class="layui-input form-input input-checkbox"
                                               data-th-data-result="${INT_SETT_TYPE}" />
                                    </div>
                                </div>
                                  <!-- 通道交易 新增 强成西 2019/03/26 start -->
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" th:text="#{invest.channelId}">通道</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="chlId" name="chlId" disabled="disabled"
                                                    class="layui-input form-input input-select" allowClear="true"
                                                    data-th-placeholder="#{SysCommon.placeholder}" formatoption="true"
                                                    data-th-initvalue="${entity?.chlId}">
                                            </select>
                                        </div>
                                    </div>
                                <!-- 通道交易 新增 强成西 2019/03/26 end -->
                            </div>
                        </div>
                    </div>
                </div>
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">付息信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div
                                        class="form-inline-wrap cash-type-02" id="intAmtTheory_div" >
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.intAmtTheory}">理论应计利息</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                        <input type="text"
                                               id="theoryInt"
                                               name="theoryInt"
                                               data-th-value="${entity?.theoryInt}"
                                               class="layui-input form-input text-number"
                                               disabled />
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            data-th-text="#{TrdDepoDuration001.intAmtReal}">实收利息总额</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                        <input type="text"
                                               id="intAmt"
                                               name="intAmt" required
                                               data-th-value="${entity?.intAmt}"
                                               class="layui-input form-input text-number"
                                        />
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                <label
                                        class="layui-form-label form-label-wrap"
                                        data-th-text="#{TrdDepoDuration001.tradeDate2}">实际结息日</label>
                                <div
                                        class="layui-input-inline input-inline">
                                    <input type="text"
                                           id="tradeDate"
                                           name="tradeDate"
                                           disabled
                                           th:value="${entity?.tradeDate==null ? formatDate : #dates.format(entity?.tradeDate,'yyyy-MM-dd')}"
                                           class="layui-input form-input input-dateSelect" />
                                </div>
                            </div>
                        </div>
                        </div>
                    </div>
                </div>
                <!-- 划款信息 -->
                <div class="page-component" th:style="${GEN_PAY_ORDERS_AUTO == '01'?'display:none':''}"
                     th:data-path="@{/component/trade/BussTrdTransferOrder/init}"
                     th:data-params="|{entityName: 'bussTrdTransferOrder', pageFrom: 'informationForm', entity:'${entity_bussTrdTransferOrderDto}', bizCode:'${entity?.busiCode}'}|"></div>
            </div>
            <!-- add by zhangpuyu 2019/10/30 start -->
            <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                 th:data-params="|{entityName: 'uploadFileList', businessId: '${tradeId ?: ''}'}|"></div>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"
                        style="border-top: 1px solid #ccc;">
                        <span class="title-des" th:text="#{TrdFundDuration001.remark}">备注</span><i
                            class="iconfont icon-arrow-down pro-down-icon"
                    ></i>
                    </h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap"
                                 style="width: 100%;">
                                <div class="layui-input-inline input-inline"
                                     style="margin:0 10px;width: 98% !important;">
                                            <textarea id="remark" name="remark" type="text"
                                                      maxlength="200"
                                                      class="layui-input layui-textarea"
                                                      placeholder="请输入内容"
                                                      th:text="${entity?.remark}"
                                                      data-th-placeholder="#{SysCommon.placeholder}"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- add by zhangpuyu 2019/10/30 end -->
        </div>
        <div class="layui-form-item" align="center">
            <a id="TrdDepoDuration004_btn_save"
               class="layui-btn layui-btn-sm btn-save"
               data-th-text="#{SysCommon.save}">保存</a> <a
                id="TrdDepoDuration004_btn_submit"
                class="layui-btn layui-btn-sm  btn-submit"
                data-th-text="#{SysCommon.submit}">提交</a> <a
                id="TrdDepoDuration004_btn_cancel"
                class="layui-btn layui-btn-sm  btn-cancel"
                data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var DEPO_ASSET_TYPE_01 = /*[[${DEPO_ASSET_TYPE_01}]]*/'';
        var opType = /*[[${opType}]]*/'';
        var CASH_CLASS_TYPE01 = /*[[${CASH_CLASS_TYPE01}]]*/'';
        var CASH_CLASS_TYPE02 = /*[[${CASH_CLASS_TYPE02}]]*/'';
        var CASH_TYPE = /*[[${entity?.cashType}]]*/'';
        var pACode_10= /*[[${pACode_10}]]*/'';
        var pACode_40= /*[[${pACode_40}]]*/'';
        var pACode_39= /*[[${pACode_39}]]*/'';
        var dealString = /*[[${deal}]]*/'';
        var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'';
        var PS_DEFAULT = /*[[${PS_DEFAULT}]]*/'';
        var FINPRODTYPE_DEFAULT =/*[[${FINPRODTYPE_DEFAULT}]]*/'';
        var PS_T22 =/*[[${PS_T22}]]*/'';
        var PS_T12 =/*[[${PS_T12}]]*/'';
        var INT_SETT_TYPE_01 =/*[[${INT_SETT_TYPE_01}]]*/'';
        var INT_SETT_TYPE_02 =/*[[${INT_SETT_TYPE_02}]]*/'';
        var GEN_PAY_ORDERS_AUTO=/*[[${GEN_PAY_ORDERS_AUTO}]]*/'';
    </script>
    <script
            data-th-src="@{/js/invest/period/trddepoduration/TrdDepoDuration004.js}"
            type="text/javascript"></script>
           <script data-th-src="@{/js/invest/asset/channel/ChannelAssetCommon.js}" type="text/javascript"></script> 
</div>
</body>

</html>
