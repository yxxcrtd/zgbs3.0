<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{[#pageId]}">[#title]</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a id="TrdProjectDuration001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="#{SysCommon.revoke}"></a>
    </div>

    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">业务编号</label>
                    <div class="layui-input-inline input-inline">
                        <select id="busiCode" name="busiCode" formatoption="false"
                                class="layui-input form-input input-select"
                                data-th-data-url="@{/invest/period/trdprojduration/TrdProjectDuration001/getBusiCode}"
                                allowClear="true" placeholder="请输入内容" >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">资产代码</label>
                    <div class="layui-input-inline input-inline">
                        <select id="finprodMarketId" name="finprodMarketId" formatoption='false'
                                class="layui-input form-input input-select"
                                data-th-data-url="@{/invest/period/trdprojduration/TrdProjectDuration001/getFinprodMarketId}"
                                allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-initValue='${finprodId}'>
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">项目类型</label>
                    <div class="layui-input-inline input-inline">
                        <select id="projectType" name="projectType"
                                class="layui-input form-input input-select"
                                data-th-data-result='${ASSET_TYPE_PROJECT}'
                                allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">有效状态</label>
                    <div class="layui-input-inline input-inline">
                        <select id="statusValid" name="statusValid"
                                class="layui-input form-input input-select"
                                multiple="true"
                                data-th-data-result='${PAGE_DATA_STATUS}'
                                allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-initValue = "${statusValid}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">类型</label>
                    <div class="layui-input-inline input-inline">
                        <select id="cashType" name="cashType"
                                class="layui-input form-input input-select"
                                data-th-data-result='${PINAN_BUSINESS_TYPE}'
                                allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable" >计息结束日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="mDate" class="layui-input form-input input-dateRangeSelect"
                               data-th-value = '${quaryDate}'/>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable" >资金到账日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="arrivalDate" class="layui-input form-input input-dateRangeSelect"/>
                    </div>
                </div>
                <div class="form-inline-wrap" id="chlFinprodId_div">
                    <label class="layui-form-label form-label-wrap">合作资产</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="chlFinprodId" name="chlFinprodId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                th:placeholder="#{SysCommon.placeholder}"  th:data-url="@{/invest/asset/channel/ChannelAsset001/getSecAcctId}"
                                allowClear="true"
                                multiple="true"></select>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var PAGE_DATA_STATUS05 = /*[[${PAGE_DATA_STATUS05}]]*/'';
        var REM_TYPE = [[${remType}]];
    </script>
    <script data-th-src="@{/js/invest/period/trdprojduration/TrdProjectDuration001.js}" type="text/javascript"></script>
</div>
</body>

</html>
