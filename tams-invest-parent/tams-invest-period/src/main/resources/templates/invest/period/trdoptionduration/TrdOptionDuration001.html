<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{TrdOptionDuration001}">期权存续期查询</title>
</head>
<body>
    <div layout:fragment="content">
        <div class='layui-fluid'>
            <div class="layui-col-md12 layui-col-sm12 layui-col-lg12 layui-col-xs12 form-button-area" style="margin: 10px;">
                <a id="TrdOptionDuration001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="#{SysCommon.revoke}"></a>
            </div>
            <div  class='joyin-form-wrap joyin-filter-form condition-area'>
                <form class="layui-form" id="searchForm">
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                            <label class="layui-form-label form-lable"
                                data-th-text="#{TrdOptionDuration001.portfolioId}"><!--组合代码--></label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="portfolioId" name="portfolioId"
                                        class="layui-input form-input input-select available"
                                        allowClear="true" multiple="true"  placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}"
                                        data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId}">
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                            <label class="layui-form-label form-lable"
                                   data-th-text="#{TrdOptionDuration001.excPs}">交易方向</label>
                            <div class="layui-input-inline input-inline">
                                <select id="excPs"
                                        name="excPs"
                                        allowClear="true"
                                        class="layui-input form-input input-select"
                                        data-th-data-result="${PS}"
                                        placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                            <label class="layui-form-label form-lable"
                                   data-th-text="#{TrdOptionDuration001.targetId}">合约标的</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="targetId" name="targetId"
                                        class="layui-input form-input input-select available" allowClear="true"
                                        data-th-placeholder="#{SysCommon.placeholder}" placeholder="请输入内容"
                                        data-th-data-url="@{/invest/period/trdoptionduration/TrdOptionDuration002/getoption}">
                                </select>
                            </div>
                        </div>
                     </div>
                     <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                            <label class="layui-form-label form-lable"
                                   data-th-text="#{TrdOptionDuration001.assetType11}">合约类型</label>
                            <div class="layui-input-inline input-inline">
                                <select id="assetType11"
                                        name="assetType11"
                                        allowClear="true"
                                        class="layui-input form-input input-select"
                                        data-th-data-result='${STRUCTURE_TYPE}'
                                        placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                                   data-th-text="#{TrdOptionDuration001.mDate}">到期日</label>
                            <div class="layui-input-inline input-inline">
                                <input id='mDate' name='mDate'
                                       data-th-initValue="${mDate}"
                                       class="layui-input form-input input-dateRangeSelect"
                                       placeholder="请选择、支持区间"
                                       data-th-placeholder="#{SysCommon.dateInterval}">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                            <label class="layui-form-label form-lable"
                                   data-th-text="#{TrdOptionDuration001.exerciseType}">行权方式</label>
                            <div class="layui-input-inline input-inline">
                                <select id="exerciseType"
                                        name="exerciseType"
                                        allowClear="true"
                                        class="layui-input form-input input-select"
                                        data-th-data-result='${EXEC_MODE}'
                                        placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                </select>
                            </div>
                        </div>
                     </div>
                     <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                            <label class="layui-form-label form-lable"
                                   data-th-text="#{TrdOptionDuration001.xqzt}">行权状态</label>
                            <div class="layui-input-inline input-inline">
                                <select id="xqzt"
                                        name="xqzt"
                                        allowClear="true"
                                        class="layui-input form-input input-select"
                                        data-th-data-result='${XY_STATUS}'
                                        data-th-initValue="${xqzt}"
                                        placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                </select>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div style="margin: 10px;">
                <tr>
                <a id="TrdOptionDuration001_btn_daoqi" class="layui-btn layui-btn-sm btn-create">期权到期</a>
                <a id="TrdOptionDuration001_btn_tiqian" class="layui-btn layui-btn-sm btn-create">提前行权</a>
                <a id="TrdOptionDuration001_btn_fangqi" class="layui-btn layui-btn-sm btn-create">放弃行权</a></tr>
            </div>
            <!--<div style="margin: 10px;">

            </div>
            <div  style="margin: 10px;">

            </div>-->
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <!--<script th:inline="javascript" type="text/javascript">
            var TRADE_FLOW_STATUS_02 = /*[[${TRADE_FLOW_STATUS_02}]]*/'';
            
        </script>-->
        <script data-th-src="@{/js/invest/period/trdoptionduration/TrdOptionDuration001.js}"
                type="text/javascript"></script>
    </div>
</body>
</html>
