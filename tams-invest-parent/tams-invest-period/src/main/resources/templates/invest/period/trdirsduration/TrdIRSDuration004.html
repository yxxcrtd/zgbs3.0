<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{TrdIRSDuration004}">利率互换收付息计划维护</title>

</head>
<body>
<div layout:fragment="content" id="TrdIRSDuration004_DIV">

    <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm" >
        <input type="hidden" name="fixedPaymentPlanTableMsg" id="fixedPaymentPlanTableMsg" data-th-value="${fixedPaymentPlanTable}"/>
        <input type="hidden" name="floatPaymentPlanTableMsg" id="floatPaymentPlanTableMsg" data-th-value="${floatPaymentPlanTable}"/>
        <input type="hidden" name="fixedCashId" id="fixedCashId" data-th-value="${entity?.fixedCashId}"/>
        <input type="hidden" name="floatCashId" id="floatCashId" data-th-value="${entity?.floatCashId}"/>
        <input type="hidden" name="paymentPlanListMsg" id="paymentPlanListMsg" data-th-value="${paymentPlanListMsg}"/>
        <div class="pro-module-wrapper pro-module-base step" title="基本信息" >
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="aleft stuff">基本信息</span>
                    </h3>
                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" name="portfolioId"
                                   data-th-value="${entity?.portfolioId}"
                                   class="layui-input form-input" placeholder="请输入内容"
                                   disabled="disabled"
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap">交易编号</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" name="finprodId"
                                   data-th-value="${entity?.finprodId}"
                                   class="layui-input form-input" placeholder="请输入内容"
                                   disabled="disabled"
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>

                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap">互换方式</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" name="irsType"
                                   data-th-value="${entity?.irsType}"
                                   class="layui-input form-input" placeholder="请输入内容"
                                   disabled="disabled"
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" >交易日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="tradeDate"  name="tradeDate"  disabled="disabled" class="layui-input form-input input-dateSelect" data-th-value='${#dates.format(entity?.tradeDate,"yyyy-MM-dd")}'/>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" >起息日</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="vdate" name="vdate"  disabled="disabled" class="layui-input form-input input-dateSelect" data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'/>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" >到期日</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="mdate" name="mdate" disabled="disabled"  class="layui-input form-input input-dateSelect" data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'/>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="pro-module-wrapper pro-module-base step" title="固息端付息计划" >
            <div class="layui-form-item">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="aleft stuff">固息端付息计划</span>（<span class="star-sign">*</span>必填）<i
                                class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div>
                            <table class="layui-table" id="fixedPaymentPlanTable"  th:name="fixedPaymentPlanTable"></table>
                        </div>
                    </div>

                </div>
            </div>
        </div>
        <div class="pro-module-wrapper pro-module-base step" title="浮息端付息计划">
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="aleft stuff">浮息端付息计划</span>（<span class="star-sign">*</span>必填）<i
                            class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div>
                        <table class="layui-table" id="floatPaymentPlanTable" th:name="floatPaymentPlanTable" ></table>
                    </div>
                </div>
            </div>

        </div>
        <div class="row text-center stepbar">
            <a id="TrdIRSDuration004_btn_save"
               class="layui-btn layui-btn-sm btn-save"
               data-th-text="#{SysCommon.save}">保存</a> <a
                id="TrdIRSDuration004_btn_submit"
                class="layui-btn layui-btn-sm btn-submit"
                data-th-text="#{SysCommon.submit}">提交</a> <a
                id="TrdIRSDuration004_btn_cancel"
                class="layui-btn layui-btn-sm btn-cancel"
                data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </form>

</div>

<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">

    </script>
    <script data-th-src="@{/js/invest/period/trdirsduration/TrdIRSDuration004.js}" type="text/javascript"></script>
    <!--        <script data-th-src="@{/js/invest/asset/common/AssetCommon.js}" type="text/javascript"></script>-->
</div>

</body>

</html>
