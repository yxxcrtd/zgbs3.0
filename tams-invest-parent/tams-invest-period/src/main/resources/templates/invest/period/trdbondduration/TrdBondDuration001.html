<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{[#pageId]}">[#title]</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a id="TrdBondDuration001_btn_add" class="layui-btn layui-btn-sm btn-create" >行权赎回新建</a>
<!--        <a id="TrdBondDuration001_btn_revoke" class="layui-btn layui-btn-sm"><i class="iconfont icon-revoke"></i><span data-th-text="#{pingan.common.revoke}">撤销</span></a>-->
    </div>

    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TrdBondDuration001.busiCode}">业务编号</label>
                    <div class="layui-input-inline input-inline">
                        <select id="busiCode" name="busiCode" formatoption="false"
                                class="layui-input form-input input-select"
                                data-th-data-url="@{/invest/period/trdbondduration/TrdBondDuration001/getBusiCodeNew}"
                                allowClear="true" placeholder="请输入内容" >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TrdBondDuration001.tradeDate}">资金到账日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="tradeDate" class="layui-input form-input input-dateRangeSelect" />
                    </div>
                </div>
                <!--                 <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondDuration001.portfolioId}">组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="portfolioId" name="portfolioId" multiple
                                                class="layui-input form-input input-select"
                                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId}"
                                                allowClear="true" placeholder="请输入内容" >
                                        </select>
                                    </div>
                                </div> -->
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TrdBondDuration001.secManageAcctId}">证券账户</label>
                    <div class="layui-input-inline input-inline">
                        <select id="secManageAcctId" name="secManageAcctId"
                                class="layui-input form-input input-select"
                                data-th-data-url="@{/invest/period/trdbondduration/TrdBondDuration001/getSecManageAcctId}"
                                allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TrdBondDuration001.finprodMarketId}">资产代码</label>
                    <div class="layui-input-inline input-inline">
                        <select id="finprodMarketId" name="finprodMarketId" formatoption = 'true'
                                class="layui-input form-input input-select"
                                data-th-data-url="@{/invest/period/trdbondduration/TrdBondDuration001/getFinprodMarketId}"
                                allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                th:initValue = '${finprodId}'>
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TrdBondDuration001.cashType}">类型</label>
                    <div class="layui-input-inline input-inline">
                        <select id="cashType" name="cashType"
                                class="layui-input form-input input-select"
                                data-th-data-result='${PINAN_BUSINESS_TYPE}'
                                allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TrdBondDuration001.statusValid}">有效状态</label>
                    <div class="layui-input-inline input-inline">
                        <select id="statusValid" name="statusValid"
                                class="layui-input form-input input-select"
                                multiple="true"
                                data-th-data-result='${PAGE_DATA_STATUS}'
                                allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-initValue = "${statusValid}" >
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TrdBondDuration001.mDate}">计息结束日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="mDate" class="layui-input form-input input-dateRangeSelect" data-th-value = '${quaryDate}' />
                    </div>
                </div>
                <div class="form-inline-wrap" id="chlId_div">
                    <label class="layui-form-label form-lable" data-th-text="#{invest.channelId}">通道</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="chlId" name="chlId"
                                class="layui-input form-input input-select" allowClear="true"
                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true"
                                data-th-data-url="@{/component/trade/BussChannelCommon/getChannelId}"
                                data-th-initvalue="${entity?.chlId}"
                                multiple="true">
                        </select>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var REM_TYPE = [[${remType}]];
        var AUTHORITY_TYPE = [[${AUTHORITY_TYPE}]];
        var ISChongQing = /*[[${ISChongQing}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/period/trdbondduration/TrdBondDuration001.js}" type="text/javascript"></script>
</div>
</body>

</html>
