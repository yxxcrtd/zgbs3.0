<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title>基金分红新建</title>
    <style type="text/css">
        .form-label-wrap {
            width: 36% !important;
        }

        .layui-form-radio {
            margin: 0;
            padding-right: 0;
        }

        .layui-form-radio > i {
            font-size: 18px;
            margin-right: 2px;
        }

        .form-day-wrap {
            float: left;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
        <form class="layui-form joyin-form-wrap pro-module-form"
              id="informationForm">
            <div class="pro-module-wrapper pro-module-base"
                 title="基本信息">
                <div class="pro-module-wrap">
                    <input type="hidden" id="acctNoList" name="selectValue" data-th-value="|${acctNoList}|">
                    <input style="display:none" type="text"
                           id="finprodId"
                           name="finprodId"
                           data-th-value="${entity?.finprodId}"
                           class="layui-input form-input"
                    />
                    <input style="display:none" type="text"
                           id="trader"
                           name="trader"
                           data-th-value="${trader}"
                           class="layui-input form-input"
                    />
                    <input style="display:none" type="text"
                           id="type"
                           name="type"
                           data-th-value="${type}"
                           class="layui-input form-input"
                    />
                    <input style="display:none" type="text"
                           id="mode"
                           name="mode"
                           data-th-value="${entity.mode}"
                           class="layui-input form-input"
                    />
                    <input style="display:none" type="text"
                           id="totleTradeId"
                           name="totleTradeId"
                           data-th-value="${entity?.totleTradeId}"
                           class="layui-input form-input"
                    />
                    <input style="display:none" type="text"
                           id="issuer"
                           name="issuer"
                           data-th-value="${entity?.issuer}"
                           class="layui-input form-input"
                    />
                    <input style="display:none" type="text"
                           id="pTradeId"
                           name="pTradeId"
                           data-th-value="${entity?.pTradeId}"
                           class="layui-input form-input"
                    />
                    <input style="display:none" type="text"
                           id="bTradeId"
                           name="bTradeId"
                           data-th-value="${entity?.bTradeId}"
                           class="layui-input form-input"
                    />
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">基本信息</span>（<span
                                class="star-sign">*</span>必填）<i
                                class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <input style="display:none" type="text"
                                           id="ccy"
                                           name="ccy"
                                           data-th-value="${entity?.ccy}"
                                           class="layui-input form-input"
                                    />
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            th:text="#{TrdPlanCurrDuration001.finprodMarketId}">资产代码</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                        <select id="finprodMarketId"
                                                formatoption=false
                                                name="finprodMarketId"
                                                allowClear="true"
                                                class="layui-input form-input input-select"
                                                data-th-data-url="@{/invest/period/trdplancurrduration/TrdPlanCurrDuration001/getFinprodMarketId}"
                                                placeholder="请输入内容"
                                                th:initValue="${entity?.finprodMarketId}"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                th:disabled="${type eq '03'|| type eq '04'}"
                                                required>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            th:text="#{TrdPlanCurrDuration001.finprodMarketName}">资产名称</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                        <input type="text"
                                               name="finprodMarketName"
                                               id="finprodMarketName"
                                               class="layui-input form-input"
                                               th:value="${entity?.finprodMarketName}"
                                               placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               disabled>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            th:text="#{TrdPlanCurrDuration001.bonusMode}">分红类型</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                        <input id="bonusMode"
                                               name="bonusMode"
                                               th:initValue="${entity?.bonusMode}"
                                               class="layui-input form-input input-checkbox"
                                               placeholder="请输入内容"
                                               th:data-result="${BONUS_MODE}"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               th:disabled ="${type eq '03'|| type eq '04'|| entity?.bonusMode ne null}"
                                               required/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            th:text="#{TrdPlanCurrDuration001.registDate}">权益登记日</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                        <input type="text"
                                               id="registDate"
                                               name="registDate"
                                               th:value="${#dates.format(entity?.registDate,'yyyy-MM-dd')}"
                                               class="layui-input form-input input-dateSelect"
                                               placeholder="请输入"
                                               th:disabled="${type eq '03'|| type eq '04'}"
                                               required>
                                    </div>
                                </div>
                                <div class="form-inline-wrap currency">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            th:text="#{TrdPlanCurrDuration001.exRightsDate}">除权日</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                        <input type="text"
                                               id="exRightsDate"
                                               name="exRightsDate"
                                               th:value="${#dates.format(entity?.exRightsDate,'yyyy-MM-dd')}"
                                               class="layui-input form-input input-dateSelect"
                                               placeholder="请输入"
                                               th:disabled="${type eq '03'|| type eq '04'}"
                                               required>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="arriveDate form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            th:text="#{TrdPlanCurrDuration001.arriveDate}">分红到账日</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                        <input type="text"
                                               id="arriveDate"
                                               name="arriveDate"
                                               th:value="${#dates.format(entity?.arriveDate,'yyyy-MM-dd')}"
                                               class="layui-input form-input input-dateSelect"
                                               placeholder="请输入"
                                               th:disabled="${type eq '04'}"
                                               required>
                                    </div>
                                </div>
                                <div class="reInvesDate form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            th:text="#{TrdPlanCurrDuration001.reInvesDate}">红利再投日</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                        <input type="text"
                                               id="reInvesDate"
                                               name="reInvesDate"
                                               th:value="${#dates.format(entity?.reInvesDate,'yyyy-MM-dd')}"
                                               class="layui-input form-input input-dateSelect"
                                               placeholder="请输入"
                                               th:disabled="${type eq '03'|| type eq '04'}"
                                               required>
                                    </div>
                                </div>
                                <!--<div class="form-inline-wrap">-->
                                    <!--<label-->
                                            <!--class="layui-form-label form-label-wrap"-->
                                            <!--th:text="#{TrdPlanCurrDuration001.unitCprice }">单位分红净值</label>-->
                                    <!--<div-->
                                            <!--class="layui-input-inline input-inline">-->
                                        <!--<input type="text"-->
                                               <!--id="unitCprice"-->
                                               <!--name="unitCprice"-->
                                               <!--data-textrange='4'-->
                                               <!--th:value="${entity?.unitCprice}"-->
                                               <!--class="layui-input form-input text-number"-->
                                               <!--placeholder="请输入内容"-->
                                               <!--data-th-placeholder="#{SysCommon.placeholder}"-->
                                               <!--required> <span-->
                                            <!--class="input-right-show">元</span>-->
                                    <!--</div>-->
                                <!--</div>-->
                                <!-- 2.0维度改变 -->
<!--                                 <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            th:text="#{TrdPlanCurrDuration001.portfolioId}">组合代码</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                        <select id="portfolioId"
                                                name="portfolioId"
                                                allowClear="true"
                                                th:initValue="${entity?.portfolioId}"
                                                class="layui-input form-input input-select"
                                                data-th-data-url="@{/invest/period/trdfundduration/TrdPlanCurrDuration001/getPortfolioId}"
                                                placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                th:disabled="${type eq '03'|| type eq '04'}"
                                                required>
                                        </select>
                                    </div>
                                </div> -->
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            th:text="#{TrdFundDuration001.tradeAmt}">分红金额</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                        <input type="text"
                                               id="tradeAmt"
                                               name="tradeAmt"
                                               th:value="${entity?.tradeAmt}"
                                               class="layui-input form-input text-number"
                                               placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               th:disabled="${type eq '04'}"
                                               required> <span
                                            class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class="qty form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            th:text="#{TrdFundDuration001.qty}">分红份额</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                        <input type="text"
                                               id="qty"
                                               name="qty"
                                               th:value="${entity?.qty}"
                                               class="layui-input form-input text-number"
                                               placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               th:disabled="${type ne '04'}"
                                               required> <span
                                            class="input-right-show">份</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{invest.channelId}">通道</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="chlId" name="chlId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true"
                                                data-th-initvalue="${entity?.chlId}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                    </div>
                <!--利息明细信息-->
                <div id="intDetailDiv" class="pro-module-wrap sjfx">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">利息明细信息</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <table class="layui-table" id="intDetailTable" th:name="finAssetIntInfoList"></table>
                        </div>
                    </div>
                </div>
                 <!-- 划款信息 货币现金分红显示-->
                <div class="pro-module-wrap" th:id="|bussTrdTransferOrder_div|" th:style="${GEN_PAY_ORDERS_AUTO == '01'?'display:none':''}">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">指令信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <input type="hidden" th:id="|bussTrdTransferOrder_payAcctNo|" th:name="selectValue" value="pay">
                                <input type="hidden" th:id="|bussTrdTransferOrder_recAcctNo|" th:name="selectValue" value="rec">
                                <a th:id="|bussTrdTransferOrder_btn_generate|" class="layui-btn layui-btn-sm" th:text="#{BussTrdTransferOrder.generate}">生成指令</a>
                            </div>
                            <table class="layui-table" th:id="|bussTrdTransferOrder_table|" th:name="bussTrdTransferOrder"></table>
                        </div>
                    </div>
                </div>
                    <!-- 划款信息 非货币现金分红显示-->
                    <!-- <div class="page-component" th:if="${type eq '03'}"
                         th:data-path="@{/component/trade/BussTrdTransferOrder/init}"
                         th:data-params="|{entityName: 'bussTrdTransferOrder', pageFrom: 'informationForm', entity:'${entity_bussTrdTransferOrderDto}', bizCode:'${entity?.tradeId}'}|"></div> -->
                </div>
                    <!-- add by zhangpuyu 2019/10/30 start -->
                    <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                         th:data-params="|{entityName: 'uploadFileList', businessId: '${tradeId ?: ''}'}|"></div>
                    <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"
                            style="border-top: 1px solid #ccc;">
                            <span class="title-des" th:text="#{TrdPlanCurrDuration001.remark}">备注</span><i
                                class="iconfont icon-arrow-down pro-down-icon"
                                ></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap"
                                     style="width: 100%;">
                                    <div class="layui-input-inline input-inline"
                                            style="width: margin:0 10px;width: 98% !important;">
                                            <textarea id="remark" name="remark" type="text"
                                                      maxlength="200"
                                                      class="layui-input layui-textarea"
                                                      placeholder="请输入内容"
                                                      th:text="${entity?.remark}"
                                                      data-th-placeholder="#{SysCommon.placeholder}"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                    <!-- add by zhangpuyu 2019/10/30 end -->
                    <div class="row text-center"
                     style="margin-top: 50px;">
                    <a th:id="|${pageId}_btn_save|"
                       class="layui-btn layui-btn-sm btn-save"
                       data-th-text="#{SysCommon.save}">保存</a> <a
                        th:id="|${pageId}_btn_submit|"
                        class="layui-btn layui-btn-sm btn-submit"
                        data-th-text="#{SysCommon.submit}">提交</a> <a
                        th:id="|${pageId}_btn_cancel|"
                        class="layui-btn layui-btn-sm btn-cancel"
                        data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </div>
            </div>
        </form>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var FUND_ASSET_TYPE_F01 = /*[[${FUND_ASSET_TYPE_F01}]]*/'';
        var FUND_ASSET_TYPE_F02 = /*[[${FUND_ASSET_TYPE_F02}]]*/'';
        var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
        var YES_OR_NO = /*[[${YES_OR_NO}]]*/'';
        var YES_NO = /*[[${YES_OR_NO}]]*/'';
        var CCY = /*[[${CCY}]]*/'';
        var BONUS_MODE_01 = /*[[${BONUS_MODE_01}]]*/'';
        var BONUS_MODE_02 = /*[[${BONUS_MODE_02}]]*/'';
        var PS_DEFAULT = /*[[${PS_DEFAULT}]]*/'';
        var FINPRODTYPE_DEFAULT = /*[[${FINPRODTYPE_DEFAULT}]]*/'';
        var PS_T11 = /*[[${PS_T11}]]*/'';
        var PS_T12 = /*[[${PS_T12}]]*/'';
        var PS_T13 = /*[[${PS_T13}]]*/'';
        var PROFIT_TYPE_HB = /*[[${PROFIT_TYPE_HB}]]*/'';
        var type = /*[[${type}]]*/'';
        var bussTrdTransferOrderDtos = /*[[${entity?.bussTrdTransferOrder}]]*/'';
        var finAssetIntInfoList = /*[[${entity.finAssetIntInfoList}]]*/'';
        var workflowId = /*[[${workflowId}]]*/'';
        var GEN_PAY_ORDERS_AUTO=/*[[${GEN_PAY_ORDERS_AUTO}]]*/'';
        var isFromCheck = /*[[${isFromCheck}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/asset/channel/ChannelAssetCommon.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/invest/period/trdplancurrduration/TrdPlanCurrDuration002.js}" type="text/javascript"></script>
</div>
</body>
</html>
