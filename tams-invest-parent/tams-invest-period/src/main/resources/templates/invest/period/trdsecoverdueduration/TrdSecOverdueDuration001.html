<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{TrdSecOverdueDuration001}">已到期资产查询</title>
    <style>
        .select2-search--dropdown.select2-search--hide{
            display: block;
        }
        #commonProgerssBar{
            !important;
            top: 300px;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="layui-tab layui-tab-brief" lay-filter="docDemoTabBrief">
        <ul class="layui-tab-title">
            <li class="layui-this">未结清</li>
            <li>多次结清</li>
        </ul>
        <div class="layui-tab-content" style="height: 100px;">
            <!--未结清-->
            <div class="layui-tab-item layui-show">
                 <div class='layui-fluid'>
                     <div class="layui-col-md12 form-button-area transfer-form">
                         <a id="TrdSecOverdueDuration001_btn_intst"
                            class="layui-btn layui-btn-sm">计息要素维护</a>
                         <a id="TrdSecOverdueDuration001_btn_huanbenshouxi"
                            class="layui-btn layui-btn-sm">还本收息</a>
                         <a id="TrdSecOverdueDuration001_btn_zhuanrang"
                            class="layui-btn layui-btn-sm">转让</a>
                     </div>
                     <div class='joyin-form-wrap joyin-filter-form condition-area curr-form transfer-form'>
                        <form class="layui-form" id="searchForm">
                            <div class="layui-form-item">
                                <div
                                        class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdFundDuration001.finprodType}">资产类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="TrdInvestDealQuery001_finprodType2" name="finprodType2"
                                                class="layui-input form-input input-select"  multiple="true"
                                                data-th-data-result='${PINAN_ASSET_TYPE}' allowClear="true"
                                                data-th-childrenIds="finprodMarketId"
                                                placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" >
                                        </select>
                                    </div>
                                </div>
                                <div
                                        class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdFundDuration001.finprodMarketId}">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="finprodMarketId"
                                                name="finprodMarketId"
                                                allowClear="true"
                                                parentIds="TrdInvestDealQuery001_finprodType2"
                                                class="layui-input form-input input-select"
                                                data-th-data-url="@{/invest/period/trdsecoverdueduration/TrdSecOverdueDuration001/getFinprodMarketId}"
                                                placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                        </select>
                                    </div>
                                </div>
                                <div
                                        class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="类型">类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="caseType" name="caseType"
                                                class="layui-input form-input input-select"  multiple="true"
                                                data-th-data-result='${CASH_CLASS_TYPE}' allowClear="true"
                                                placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" >
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div
                                        class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="计息结束日">计息结束日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id='registDate' name='registDate'
                                               class="layui-input form-input input-dateRangeSelect"
                                               placeholder="请选择、支持区间"
                                               data-th-placeholder="#{SysCommon.dateInterval}">
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div>
                        <table class="layui-table" id="dataTable"></table>
                    </div>
                 </div>
            </div>
            <!--多次结清-->
            <div class="layui-tab-item">
                <div class='layui-fluid'>
                    <div class="layui-col-md12 form-button-area dvp-transfer-form">
                    </div>
                    <div class='joyin-form-wrap joyin-filter-form condition-area curr-form dvp-transfer-form'>
                        <form class="layui-form" id="searchFormTwo">
                            <div class="layui-form-item">
                                <div
                                        class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdFundDuration001.finprodType}">资产类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="TrdInvestDealQuery001_finprodType2_two" name="finprodType2"
                                                class="layui-input form-input input-select"  multiple="true"
                                                data-th-data-result='${PINAN_ASSET_TYPE}' allowClear="true"
                                                data-th-childrenIds="finprodMarketIdTwo"
                                                placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" >
                                        </select>
                                    </div>
                                </div>
                                <div
                                        class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdFundDuration001.finprodMarketId}">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="finprodMarketIdTwo"
                                                name="finprodMarketId"
                                                allowClear="true"
                                                parentIds="TrdInvestDealQuery001_finprodType2_two"
                                                class="layui-input form-input input-select"
                                                data-th-data-url="@{/invest/period/trdsecoverdueduration/TrdSecOverdueDuration001/getFinprodMarketId}"
                                                placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                        </select>
                                    </div>
                                </div>
                                <div
                                        class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="类型">类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="caseTypeTwo" name="caseType"
                                                class="layui-input form-input input-select"  multiple="true"
                                                data-th-data-result='${CASH_CLASS_TYPE}' allowClear="true"
                                                placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" >
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div
                                        class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="计息结束日">计息结束日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id='registDateTwo' name='registDate'
                                               class="layui-input form-input input-dateRangeSelect"
                                               placeholder="请选择、支持区间"
                                               data-th-placeholder="#{SysCommon.dateInterval}">
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div>
                        <table class="layui-table" id="dataTableTwo"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var PAGE_DATA_STATUS_01 = /*[[${PAGE_DATA_STATUS_01}]]*/'';
        var PAGE_DATA_STATUS_05 = /*[[${PAGE_DATA_STATUS_05}]]*/'';
        var PS_T13 = /*[[${PS_T13}]]*/'';
        var PS_T11 = /*[[${PS_T11}]]*/'';
        var F01 = /*[[${F01}]]*/'';
        var BONUS_MODE_01 = /*[[${BONUS_MODE_01}]]*/'';
        var BONUS_MODE_02 = /*[[${BONUS_MODE_02}]]*/'';
		var PINAN_ASSET_TYPE_F01 = /*[[${PINAN_ASSET_TYPE_F01}]]*/'';
        var PINAN_ASSET_TYPE_F03 = /*[[${PINAN_ASSET_TYPE_F03}]]*/'';
        var PINAN_ASSET_TYPE_F05 = /*[[${PINAN_ASSET_TYPE_F05}]]*/'';
        var PINAN_ASSET_TYPE_F06 = /*[[${PINAN_ASSET_TYPE_F06}]]*/'';
        var PINAN_ASSET_TYPE_F19 = /*[[${PINAN_ASSET_TYPE_F19}]]*/'';
    </script>
    <script
            data-th-src="@{/js/invest/period/trdsecoverdueduration/TrdSecOverdueDuration001.js}"
            type="text/javascript">
    </script>
</div>
</body>
</html>
