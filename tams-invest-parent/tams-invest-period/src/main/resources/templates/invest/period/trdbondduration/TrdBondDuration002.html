<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorator="~{layout/default}">
<head>
    <title data-th-text="#{[#pageId]}">[#title]</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">基本信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration001.busiCode}">业务编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" id="acctNoList" name="selectValue" data-th-value="[]">
                                        <input type="hidden" name="cashId" data-th-value="${entity?.cashId}"/>
                                        <input type="hidden" name="invAim" data-th-value="${entity?.invAim}"/>
                                        <input type="hidden" name="amountList" data-th-value="${entity?.amountList}"/>
                                        <input type="hidden" name="ccy" data-th-value="${entity?.ccy}"/>
                                        <input type="hidden" name="statusValid" data-th-value="${entity?.statusValid}"/>
                                        <input type="hidden" name="paBussType" data-th-value="${entity?.paBussType}"/>
                                        <input type="hidden" id="finprodId" name="finprodId" data-th-value="${entity?.finprodId}"/>
                                        <input type="hidden" name="tradeMarket" data-th-value="${entity?.tradeMarket}"/>
                                        <input type="hidden" name="needSkipInsertWfl" id="needSkipInsertWfl" data-th-value="${entity?.needSkipInsertWfl}"/>
                                        <input type="text" id="busiCode" name="busiCode" data-th-value="${entity?.busiCode}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration001.finprodMarketId}">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" name="finprodMarketName" data-th-value="${entity?.finprodMarketName}"/>
                                        <input type="text" id="finprodMarketId" name="finprodMarketId" data-th-value="${entity?.finprodMarketId}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration001.finprodName}">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodName" name="finprodName" data-th-value="${entity?.finprodMarketName}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration001.cashType}">类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" name="cashType" data-th-value="${entity?.cashType}"/>
                                        <input type="text" id="paBussTypeString" name="paBussTypeString" data-th-value="${entity?.paBussTypeString}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration001.vDateWhole}">起息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="vDateWhole" name="vDateWhole" data-th-value="${entity?.vDateWhole}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration001.mDateWhole}">到期日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="mDateWhole" name="mDateWhole" data-th-value="${entity?.mDateWhole}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration001.vDateDur}">付息起始日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="vDate" name="vDate" data-th-value="${entity?.vDate}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration001.mDateDur}">付息截止日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="mDate" name="mDate" data-th-value="${entity?.mDate}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration002.payDate}">支付日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="payDate" name="payDate" data-th-value="${entity?.payDate}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration002.yield}">区间票面利率(%)</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="yield" name="yield" data-th-value="${entity?.yield}" data-textrange="2" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">单位应计利息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="unitIntAmt" name="unitIntAmt" data-textrange="14" data-th-value="${entity?.unitIntAmt}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration002.intPrinAmt}">单位本金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="intPrinAmt" name="intPrinAmt" data-textrange='4' data-th-value="${entity?.intPrinAmt}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration002.prinAmt}">还本面额/百元</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="prinAmt" name="prinAmt" data-textrange='4' data-th-value="${entity?.prinAmt}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                                <div  class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdSecOverdueDuration002.isClean}">是否结清</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="isClean" name="isClean" required="required"
                                                class="layui-input form-input input-select"
                                                th:data-result='${YES_OR_NO}' allowClear="false"
                                                th:initValue="${entity?.isClean}"
                                                data-th-placeholder="#{SysCommon.placeholder}" >
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pro-module-wrap llfx">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">理论付息信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
<!--                                 <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration001.portfolioId}">组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="portfolioId" name="portfolioId" data-th-value="${entity?.portfolioId}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration001.portfolioName}">组合名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="portfolioName" name="portfolioName" data-th-value="${entity?.portfolioName}" class="layui-input form-input" disabled/>
                                    </div>
                                </div> -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration001.qty}">券面总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="qty" name="qty" data-th-value="${entity?.qty}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="|#{EtrStandardBond002.secAcctId1}|">证券账户</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" id="secManageAcctId" name="secManageAcctId" data-th-value="${entity?.secManageAcctId}"/>
                                        <input type="hidden" id="channel" name="channel" data-th-value="${entity?.channel}" data-ignore="true"/>
                                        <input type="hidden" id="collectType" name="collectType" data-th-value="${entity?.collectType}"/>
                                        <input type="text" id="secAcctName" name="secAcctName" data-th-value="${entity?.secAcctName}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap cash-type-02">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration002.intAmtTheory}">理论应计利息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="intAmtTheory" name="intAmtTheory" data-th-value="${entity?.intAmtTheory}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap cash-type-01">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration002.prinAmtTheory}">理论还本金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="prinAmtTheory" name="prinAmtTheory" data-th-value="${entity?.prinAmtTheory}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap cash-type-01 cash-type-02">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration002.tradeAmtTheory}">理论本息总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="fpriceAmt" name="fpriceAmt" data-th-value="${entity?.fpriceAmt}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pro-module-wrap sjfx">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">实际付息信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration002.intAmtReal}">实收利息总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="intAmt" name="intAmt" data-th-value="${entity?.intAmt}" class="layui-input form-input text-number" maxlength="17"/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap cash-type-01 cash-type-02">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration002.tradeAmtReal}">实收本息总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeAmtReal" name="tradeAmtReal" data-th-value="${entity?.tradeAmtReal}" class="layui-input form-input text-number" maxlength="17"/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration002.fundAtDate}">资金到账日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeDate" name="tradeDate" data-th-value="${entity?.tradeDate}" data-th-data-ignore='${isTodo}'
                                               class="layui-input form-input input-dateSelect"/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration002.tradeAmtArrive}">到账金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeAmt" name="tradeAmt" data-th-value="${entity?.tradeAmt}" class="layui-input form-input text-number" maxlength="30" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" style="display:none">
                                    <label class="layui-form-label form-label-wrap" data-th-text="|#{invest.channelId}#{TrdBondDuration002.channelFee}|">通道费</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="channelFee" name="channelFee" data-th-value="${entity?.channelFee}" class="layui-input form-input text-number" />
                                    </div>
                                </div>
                                </div>
                        </div>
                    </div>
                </div>
                <!--利息明细信息-->
                <div class="pro-module-wrap sjfx">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">利息明细信息</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <table class="layui-table" id="intDetailTable" th:name="finAssetIntInfoList"></table>
                        </div>
                    </div>
                </div>
                <div class="pro-module-wrap" th:id="|bussTrdTransferOrder_div|" th:style="${GEN_PAY_ORDERS_AUTO == '01'?'display:none':''}">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">指令信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <input type="hidden" th:id="|bussTrdTransferOrder_payAcctNo|" th:name="selectValue" value="pay">
                                <input type="hidden" th:id="|bussTrdTransferOrder_recAcctNo|" th:name="selectValue" value="rec">
                                <a th:id="|bussTrdTransferOrder_btn_generate|" class="layui-btn layui-btn-sm" th:text="#{BussTrdTransferOrder.generate}">生成指令</a>
                            </div>
                            <table class="layui-table" th:id="|bussTrdTransferOrder_table|" th:name="bussTrdTransferOrder"></table>
                        </div>
                    </div>
                </div>
                <!-- 划款信息 -->
                <!-- <div class="page-component hkxx" th:data-path="@{/component/trade/BussTrdTransferOrder/init}"
                     th:data-params="|{entityName: 'bussTrdTransferOrder', pageFrom: 'informationForm', entity:'${entity_bussTrdTransferOrderDto}', bizCode:'${entity?.busiCode}'}|"></div> -->
            </div>
            <!-- add by zhangpuyu 2019/10/30 start -->
            <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                 th:data-params="|{entityName: 'uploadFileList', businessId: '${tradeId ?: ''}'}|"></div>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"
                        style="border-top: 1px solid #ccc;">
                        <span class="title-des" th:text="#{TrdFundDuration001.remark}">备注</span><i
                            class="iconfont icon-arrow-down pro-down-icon"
                    ></i>
                    </h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap"
                                 style="width: 100%;">
                                <div class="layui-input-inline input-inline"
                                     style="margin:0 10px;width: 98% !important;">
                                            <textarea id="remark" name="remark" type="text"
                                                      maxlength="200"
                                                      class="layui-input layui-textarea"
                                                      placeholder="请输入内容"
                                                      th:text="${entity?.remark}"
                                                      data-th-placeholder="#{SysCommon.placeholder}"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- add by zhangpuyu 2019/10/30 end -->
            <div class="layui-form-item" data-th-if="${entity?.revokeReason}">
                <div class="layui-inline layui-col-md12 layui-col-sm12 layui-col-lg12 layui-col-xs12">
                    <fieldset class='adver-fieldset'>
                        <legend>撤销理由</legend>
                        <div class="layui-input-block" style="margin-left:0px;">
                        <textarea id="revokeReason" name="revokeReason" data-th-text="${entity?.revokeReason}" placeholder="请输入内容"
                                  class="layui-textarea"></textarea>
                        </div>
                    </fieldset>
                </div>
            </div>
        </div>
        <div class="layui-form-item" align="center">
            <a id="TrdBondDuration002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="TrdBondDuration002_btn_submit" class="layui-btn layui-btn-sm  btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="TrdBondDuration002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var CASH_CLASS_TYPE01 = /*[[${CASH_CLASS_TYPE01}]]*/'';
        var CASH_CLASS_TYPE02 = /*[[${CASH_CLASS_TYPE02}]]*/'';
        var CASH_TYPE = /*[[${entity?.cashType}]]*/'';
        var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'';
        var needInit = /*[[${needInit}]]*/'';
        var deal = /*[[${deal}]]*/'';
        var YES_NO = /*[[${YES_OR_NO}]]*/'';
        var PAY_TYPE = /*[[${PAY_TYPE}]]*/'';
        var formTodoList = /*[[${formTodoList}]]*/'';
        var getSaleDepartment = /*[[@{/invest/product/productduration/addreduce/FinProductAddReduce002/getSaleDepartment}]]*/'';
        var bussTrdTransferOrderDtos = /*[[${entity?.bussTrdTransferOrder}]]*/'';
        var finAssetIntInfoList = /*[[${entity?.finAssetIntInfoList}]]*/'';
        var YES_OR_NO = /*[[${YES_OR_NO}]]*/'';
        var CCY = /*[[${CCY}]]*/'';
        var INV_AIM = /*[[${INV_AIM}]]*/'';
        var workflowId = /*[[${workflowId}]]*/'';
        var ASSET_SOURCE = /*[[${ASSET_SOURCE}]]*/'';
        var COLLECT_TYPE = /*[[${entity?.collectType}]]*/'';
        var CHANNEL=/*[[${entity?.channel}]]*/'';
        var COLLECT_TYPE_01=/*[[${COLLECT_TYPE_01}]]*/'';
        var GEN_PAY_ORDERS_AUTO=/*[[${GEN_PAY_ORDERS_AUTO}]]*/'';
        //展示投资目的或业务模式参数
        // var SHOW_INVAIM_OR_BUSSINSSMODEL =  /*[[${SHOW_INVAIM_OR_BUSSINSSMODEL}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/period/trdbondduration/TrdBondDuration002.js}" type="text/javascript"></script>
</div>
</body>

</html>
