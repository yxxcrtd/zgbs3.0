<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{[#pageId]}">[#title]</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">基本信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" >业务编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" id="acctNoList" name="selectValue" data-th-value="[]">
                                        <input type="hidden" id="cashId"      name="cashId"      data-th-value="${entity?.cashId}"/>
                                        <input type="hidden" id="cashType"    name="cashType"   data-th-value="${entity?.cashType}"/>
                                        <input type="hidden" id="tradeType"   name="tradeType"    data-th-value="${entity?.tradeType}"/>
                                        <input type="hidden" id="ccy"         name="ccy"             data-th-value="${entity?.ccy}"/>
                                        <input type="hidden" id="branch"         name="branch"             data-th-value="${entity?.branch}"/>
                                        <input type="hidden" id="statusValid" name="statusValid"   data-th-value="${entity?.statusValid}"/>
                                        <input type="hidden" id="tradeMarket" name="tradeMarket" data-th-value="${entity?.tradeMarket}"/>
                                        <input type="hidden"  id="finprodId" name="finprodId" data-th-value="${entity?.finprodId}"/>
                                        <input type="hidden" id="registOrg" name="registOrg" data-th-value="${entity?.registOrg}"/>
                                        <input type="text" id="totleTradeId" name="totleTradeId" data-th-value="${entity?.totleTradeId}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">原始交易编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="mpFinprodId" name="mpFinprodId" data-th-value="${entity?.mpFinprodId}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交易类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeTypeString" name="tradeTypeString" data-th-value="${entity?.tradeTypeString}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">标的资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodMarketId" name="finprodMarketId" data-th-value="${entity?.finprodMarketId}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">标的资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodAbbr" name="finprodAbbr" data-th-value="${entity?.finprodAbbr}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">起息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="vDateWhole" name="vDateWhole" data-th-value="${entity?.vDateWhole}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">到期日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="mDateWhole" name="mDateWhole" data-th-value="${entity?.mDateWhole}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">付息起始日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="vdate" name="vdate" data-th-value="${entity?.vdate}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">付息截止日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="mdate" name="mdate" data-th-value="${entity?.mdate}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">支付日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="payDate" name="payDate" data-th-value="${entity?.payDate}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">区间票面利率(%)</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="rangeYield" name="rangeYield" data-th-value="${entity?.rangeYield}" data-textrange="8" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">单位应计利息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="unitIntAmt" name="unitIntAmt" data-textrange="14" data-th-value="${entity?.unitIntAmt}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">单位本金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="unitPrinAmt" name="unitPrinAmt" data-textrange='4' data-th-value="${entity?.unitPrinAmt}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">还本面额/百元</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="prinAmt" name="prinAmt" data-textrange='4' data-th-value="${entity?.prinAmt}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交易对手</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" id="counterId" name="counterId" data-th-value="${entity?.counterId}" />
                                        <input type="text" id="counterName" name="counterName" data-th-value="${entity?.counterName}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pro-module-wrap llfx">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">理论付息信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="portfolioId" name="portfolioId" data-th-value="${entity?.actPortfolioId != null ? entity?.actPortfolioId : entity?.portfolioId}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">组合名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="portfolioName" name="portfolioName" data-th-value="${entity?.portfolioName}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="|融${in_out}券面总额|"></label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="amount" name="amount" data-th-value="${entity?.amount}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">证券托管户</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" id="secManageAcctId" name="secManageAcctId" data-th-value="${entity?.secManageAcctId}"/>
                                        <input type="text" id="secAcctName" name="secAcctName" data-th-value="${entity?.secAcctName}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap cash-type-02">
                                    <label class="layui-form-label form-label-wrap">理论应计利息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="theoryInt" name="theoryInt" data-th-value="${entity?.theoryInt}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap cash-type-01">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdBondDuration002.prinAmtTheory}">理论还本金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="theoryPrinAmt" name="theoryPrinAmt" data-th-value="${entity?.theoryPrinAmt}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap cash-type-01 cash-type-02">
                                    <label class="layui-form-label form-label-wrap">理论本息总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="theoryAmt" name="theoryAmt" data-th-value="${entity?.theoryAmt}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pro-module-wrap sjfx">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">实际利息信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="|实${ps}利息总额|"></label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="intAmt" name="intAmt" data-th-value="${entity?.intAmt}" class="layui-input form-input text-number"/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap cash-type-01 cash-type-02">
                                    <label class="layui-form-label form-label-wrap" data-th-text="|实${ps}本息总额|"></label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeAmt" name="tradeAmt" data-th-value="${entity?.tradeAmt}" class="layui-input form-input text-number" maxlength="30"/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="|${tradeDateOther}|"></label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeDate" name="tradeDate" data-th-value="${entity?.payDate == null ? sysDate : entity?.payDate}"
                                               class="layui-input form-input input-dateSelect"/>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 划款信息 -->
               <div class="page-component hkxx" th:data-path="@{/component/trade/BussTrdTransferOrder/init}" th:style="${GEN_PAY_ORDERS_AUTO == '01'?'display:none':''}"
                     th:data-params="|{entityName: 'bussTrdTransferOrder', pageFrom: 'informationForm', entity:'${entity_bussTrdTransferOrderDto}', bizCode:'${entity?.totleTradeId}'}|"></div>
            </div>
            <div class="page-component" th:data-path="@{/component/core/FileCommon/init}" th:data-params="|{entityName: 'uploadFileList', businessId: '${entity?.totleTradeId ?: ''}'}|"></div>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title" style="border-top: 1px solid #ccc;">
                        <span class="title-des" th:text="#{TrdFundDuration001.remark}">备注</span><i class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap" style="width: 100%;">
                                <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98% !important;">
                                    <textarea id="remark" name="remark" type="text" maxlength="200" class="layui-input layui-textarea"
                                              placeholder="请输入内容" th:text="${entity?.remark}"
                                              data-th-placeholder="#{SysCommon.placeholder}"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="layui-form-item" data-th-if="${entity?.revokeReason}">
                <div class="layui-inline layui-col-md12 layui-col-sm12 layui-col-lg12 layui-col-xs12">
                    <fieldset class='adver-fieldset'>
                        <legend>撤销理由</legend>
                        <div class="layui-input-block" style="margin-left:0px;">
                        <textarea id="revokeReason" name="revokeReason" data-th-text="${entity?.revokeReason}" placeholder="请输入内容"
                                  class="layui-textarea"></textarea>
                        </div>
                    </fieldset>
                </div>
            </div>
        </div>
        <div class="layui-form-item" align="center">
            <a id="TrdBondLendTargetDuration002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="TrdBondLendTargetDuration002_btn_submit" class="layui-btn layui-btn-sm  btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="TrdBondLendTargetDuration002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'';
        var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
        var YES_NO = /*[[${YES_OR_NO}]]*/'';
        var formTodoList = /*[[${formTodoList}]]*/'';
        var bussTrdTransferOrderDtos = /*[[${entity?.bussTrdTransferOrder}]]*/'';
        var CCY = /*[[${CCY}]]*/'';
        var sysDate = /*[[${sysDate}]]*/'';
        var workflowId = /*[[${workflowId}]]*/'';
        var GEN_PAY_ORDERS_AUTO=/*[[${GEN_PAY_ORDERS_AUTO}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/period/trdbondlendtargetduration/TrdBondLendTargetDuration002.js}" type="text/javascript"></script>
</div>
</body>

</html>
