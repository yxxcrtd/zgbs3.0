<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{TrdStockBonus001}">股票分红查询</title>
    <!--TISHKS-211:业务编号支持下拉框模糊搜索 fuyongsheng 20211116 add start-->
    <style type="text/css">
        .select2-search--dropdown.select2-search--hide{
            display: block;
        }
    </style>
    <!--TISHKS-211:业务编号支持下拉框模糊搜索 fuyongsheng 20211116 add end-->
</head>
<body>
    <div layout:fragment="content">
        <div class='layui-fluid'>
            <div
                class="layui-col-md12 layui-col-sm12 layui-col-lg12 layui-col-xs12 form-button-area"
                style="margin: 10px;">
                <a id="TrdStockBonus001_btn_add" class="layui-btn layui-btn-sm btn-create">新建</a>
                <a id="TrdStockBonus001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="#{SysCommon.revoke}"></a>
            </div>
            <div  class='joyin-form-wrap joyin-filter-form condition-area'>
                <form class="layui-form" id="searchForm">
                    <div class="layui-form-item">
                        <div
                            class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                            <label class="layui-form-label form-lable"
                                data-th-text="#{TrdStockBonus001.businessCode}">业务编号</label>
                            <div class="layui-input-inline input-inline">
                                <select id="busiCode"
                                    name="busiCode"
                                    formatoption="false"
                                    allowClear="true"
                                    class="layui-input form-input input-select"
                                    data-th-data-url="@{/invest/period/trdstockbonus/TrdStockBonus001/getBusiCode}"
                                    placeholder="请输入内容">
                                </select>
                            </div>
                        </div>
                        <!--子交易包含多证券账户外层交易不做展示-->
<!--                        <div
                            class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                            <label class="layui-form-label form-lable"
                                data-th-text="#{TrdStockBonus001.secManageAcctId}">证券账户</label>
                            <div class="layui-input-inline input-inline">
                                <select id="secManageAcctId"
                                    name="secManageAcctId"
                                    multiple="multiple"
                                    allowClear="true"
                                    class="layui-input form-input input-select"
                                    data-th-data-url="@{/invest/period/trdstockbonus/TrdStockBonus001/getSecManageAcctId}"
                                    placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}">
                                </select>
                            </div>
                        </div>-->

                        <div
                            class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                            <label class="layui-form-label form-lable"
                                data-th-text="#{TrdStockBonus001.finprodMarketId}">资产代码</label>
                            <div class="layui-input-inline input-inline">
                                <select id="finprodMarketId"
                                    name="finprodMarketId"
                                    allowClear="true"
                                    class="layui-input form-input input-select"
                                    data-th-data-url="@{/invest/period/trdstockbonus/TrdStockBonus001/getFinprodMarketId}"
                                    placeholder="请输入内容"
                                        multiple="multiple"
                                    data-th-placeholder="#{SysCommon.placeholder}">
                                </select>
                            </div>
                        </div>

                        <div
                                class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                                   data-th-text="#{TrdStockBonus001.exRightsDate}">除权除息日</label>
                            <div class="layui-input-inline input-inline">
                                <input id='exRightsDate' name='exRightsDate'
                                       class="layui-input form-input input-dateRangeSelect"
                                       placeholder="请选择、支持区间"
                                       data-th-placeholder="#{SysCommon.dateInterval}">
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        
                       <div
                            class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                            <label class="layui-form-label form-lable"
                                data-th-text="#{TrdStockBonus001.bonusMode}">分红类型</label>
                            <div class="layui-input-inline input-inline">
                                <select id="bonusMode"
                                    name="bonusMode"
                                    multiple="multiple"
                                    allowClear="true"
                                    class="layui-input form-input input-select"
                                    data-th-data-result="${STOCK_DEVISION_TYPE}"
                                    placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}">
                                </select>
                            </div>
                        </div>
                        <div
                            class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                            <label class="layui-form-label form-lable"
                                data-th-text="#{TrdStockBonus001.pageDataStatus}">有效状态</label>
                            <div class="layui-input-inline input-inline">
                                <select id="statusValid"
                                    name="statusValid"
                                    allowClear="true"
                                    class="layui-input form-input input-select"
                                    data-th-data-result='${TRADE_FLOW_STATUS}'
                                    placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}">
                                </select>
                            </div>
                        </div>
                        <div
                                class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                                   data-th-text="#{TrdStockBonus001.registDate}">权益登记日</label>
                            <div class="layui-input-inline input-inline">
                                <input id='registDate' name='registDate'
                                       class="layui-input form-input input-dateRangeSelect"
                                       placeholder="请选择、支持区间"
                                       data-th-placeholder="#{SysCommon.dateInterval}">
                            </div>
                        </div>
                    </div>
<!--                    <div class="layui-form-item">

                    </div>-->
                </form>
            </div>
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script th:inline="javascript" type="text/javascript">
            var TRADE_FLOW_STATUS_02 = /*[[${TRADE_FLOW_STATUS_02}]]*/'';
            var TRADE_FLOW_STATUS_03 = /*[[${TRADE_FLOW_STATUS_03}]]*/'';
        </script>
        <script
            data-th-src="@{/js/invest/period/trdstockbonus/TrdStockBonus001.js}"
            type="text/javascript">
        </script>
    </div>
</body>
</html>
