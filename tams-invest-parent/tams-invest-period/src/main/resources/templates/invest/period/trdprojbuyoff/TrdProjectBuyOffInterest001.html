<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{[#pageId]}">[#title]</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a id="TrdProjectBuyOffInterest001_btn_add" class="layui-btn layui-btn-sm btn-create">新建</a>
        <a id="TrdProjectBuyOffInterest001_btn_deleteData" class="layui-btn layui-btn-sm btn-delete">删除</a>
        <a id="TrdProjectBuyOffInterest001_btn_import" class="layui-btn layui-btn-sm btn-import">导入</a>
    </div>

    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">项目类型</label>
                    <div class="layui-input-inline input-inline">
                        <select id="assetType" name="assetType"
                                class="layui-input form-input input-select"
                                multiple="true"
                                data-th-data-result='${ASSET_TYPE_PROJECT}'
                                allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">资产代码</label>
                    <div class="layui-input-inline input-inline">
                        <select id="assetId" name="assetId"
                                class="layui-input form-input input-select"
                                data-th-formatoption="true"
                                multiple
                                data-th-data-url="@{/invest/period/trdprojbuyoff/TrdProjectBuyOffInterest001/getProjAssetId}"
                                allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap">生效日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="effDate" name="effDate" data-th-value="${entity?.effDate}" class="layui-input form-input input-dateSelect"/>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/period/trdprojbuyoff/TrdProjectBuyOffInterest001.js}" type="text/javascript"></script>
</div>
</body>

</html>
