<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{[#pageId]}">[#title]</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">项目类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" name="assetType" data-th-value="${entity?.assetType}"/>
                                        <input type="hidden" id="finprodId" name="finprodId" data-th-value="${entity?.finprodId}"/>
                                        <input type="text" id="assetTypeString" name="assetTypeString" data-th-value="${entity?.assetTypeString}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="assetId" name="assetId" data-th-value="${entity?.assetId}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="assetName" name="assetName" data-th-value="${entity?.assetName}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">起息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="vdate" name="vDate" data-th-value="${entity?.vDate}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">到期日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="mdate" name="mDate" data-th-value="${entity?.mDate}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">付息周期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="payCycle" name="payCycle" data-th-value="${entity?.payCycle}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="page-component" th:data-path="@{/component/asset/FinPayInterestStdInfo/init}" th:data-params="|{entityName:'finPayInterestStdInfoDto', finprodId:'${entity?.finprodId}', vdate:'${entity?.vDate}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}'}|" ></div>
            </div>
        </div>
        <div class="layui-form-item" align="center">
            <a id="TrdProjectDurationInterest002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="TrdProjectDurationInterest002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="TrdProjectDurationInterest002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
    </script>
    <script data-th-src="@{/js/invest/period/trdprojint/TrdProjectDurationInterest002.js}" type="text/javascript"></script>
</div>
</body>

</html>
