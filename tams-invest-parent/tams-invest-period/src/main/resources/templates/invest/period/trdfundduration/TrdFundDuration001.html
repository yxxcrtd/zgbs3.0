<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{TrdFundDuration001}">基金分红查询</title>
    <style>
        .select2-search--dropdown.select2-search--hide{
            display: block;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="layui-tab layui-tab-brief" lay-filter="docDemoTabBrief">
        <ul class="layui-tab-title">
            <li class="layui-this">基金分红</li>
            <li>基金份额折算</li>
        </ul>
        <div class="layui-tab-content" style="height: 100px;">
            <!--基金分红-->
            <div class="layui-tab-item layui-show">
                 <div class='layui-fluid'>
                     <div class="layui-col-md12 form-button-area dvp-transfer-form">
                         <a id="TrdFundDuration001_btn_add" class="layui-btn layui-btn-sm btn-creatOrder"><i class="iconfont icon-bill"></i><span>&nbsp;&nbsp;新建</span></a>
                         <a id="TrdFundDuration001_btn_revoke" class="layui-btn layui-btn-sm btn-creatOrder"><i class="iconfont icon-bill"></i><span>&nbsp;&nbsp;撤销</span></a>
                     </div>
                     <div class='joyin-form-wrap joyin-filter-form condition-area curr-form dvp-transfer-form'>
                        <form class="layui-form" id="searchForm">
                            <div class="layui-form-item">
                                <div
                                        class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdFundDuration001.finprodType}">资产类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodType"
                                               name="finprodType"
                                               class="layui-input form-input input-checkbox"
                                               data-th-data-result='${FUND_ASSET_TYPE}'
                                               placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"/>
                                    </div>
                                </div>
                                <div
                                        class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdFundDuration001.exRightsDate}">除权日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id='exRightsDate' name='exRightsDate'
                                               class="layui-input form-input input-dateRangeSelect"
                                               placeholder="请选择、支持区间"
                                               data-th-placeholder="#{SysCommon.dateInterval}">
                                    </div>
                                </div>
                                <!--                         <div
                                                            class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                                                            <label class="layui-form-label form-lable"
                                                                data-th-text="#{TrdFundDuration001.portfolioId}">组合代码</label>
                                                            <div class="layui-input-inline input-inline">
                                                                <select id="portfolioId"
                                                                    name="portfolioId" allowClear="true" multiple="true"
                                                                    class="layui-input form-input input-select"
                                                                    data-th-data-url="@{/period/trdfundduration/TrdFundDuration001/getPortfolioId}"
                                                                    placeholder="请输入内容"
                                                                    data-th-placeholder="#{SysCommon.placeholder}">
                                                                </select>
                                                            </div>
                                                        </div> -->
                                <div
                                        class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdFundDuration001.pageDataStatus}">有效状态</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="statusValid"
                                                name="statusValid"
                                                multiple="true"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${PAGE_DATA_STATUS}'
                                                allowClear="true"
                                                placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div
                                        class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdFundDuration001.finprodMarketId}">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="finprodMarketId"
                                                name="finprodMarketId"
                                                allowClear="true"
                                                class="layui-input form-input input-select"
                                                data-th-data-url="@{/invest/period/trdfundduration/TrdFundDuration001/getFinprodMarketId}"
                                                placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                        </select>
                                    </div>
                                </div>
                                <div
                                        class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdFundDuration001.bonusMode}">类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="bonusMode"
                                               name="bonusMode"
                                               class="layui-input form-input input-checkbox"
                                               data-th-data-result='${BONUS_MODE}'>
                                    </div>
                                </div>
                                <div
                                        class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdFundDuration001.registDate}">权益登记日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id='registDate' name='registDate'
                                               class="layui-input form-input input-dateRangeSelect"
                                               placeholder="请选择、支持区间"
                                               data-th-placeholder="#{SysCommon.dateInterval}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <!-- 通道新增 renping 2020/01/21 start -->
                                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4" id="chlId_div">
                                    <label class="layui-form-label form-lable" data-th-text="#{invest.channelId}">通道</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="chlId" name="chlId" class="layui-input form-input input-select" allowClear="true"
                                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true" data-th-data-url="@{/component/trade/BussChannelCommon/getChannelId}"
                                                multiple="true">
                                        </select>
                                    </div>
                                </div>
                              </div>
                                <!-- 通道新增 renping 2020/01/21 start -->
                        </form>
                    </div>
                    <div>
                        <table class="layui-table" id="dataTable"></table>
                    </div>
                 </div>
            </div>
            <!--基金折算-->
            <div class="layui-tab-item">
                <div class='layui-fluid'>
                    <div class="layui-col-md12 form-button-area transfer-form">
                        <a id="TrdFundObversion001_btn_add"
                           class="layui-btn layui-btn-sm btn-print">新建</a>
                        <a id="TrdFundObversion001_btn_revoke"
                           class="layui-btn layui-btn-sm btn-delete">撤销</a>
                    </div>
                    <div class='joyin-form-wrap joyin-filter-form condition-area curr-form transfer-form'>
                        <form class="layui-form" id="searchFormTwo">
                            <div class="layui-form-item">
                                <div
                                        class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdFundObversion001.conversionType}">折算类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="conversionType" name="conversionType" class="layui-input form-input input-select" required
                                                data-th-data-result='${CONVERSION_TYPE}' allowClear="true" placeholder="请输入内容"
                                                data-th-childrenIds="finprodMarketIdTwo"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                        </select>

                                    </div>
                                </div>
                                <div
                                        class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdFundDuration001.finprodMarketId}">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="finprodMarketIdTwo"
                                                name="finprodMarketId"
                                                data-parentIds="conversionType"
                                                allowClear="true"
                                                class="layui-input form-input input-select"
                                                data-th-data-url="@{/invest/period/trdfundduration/TrdFundObversion001/getFinprodMarketId}"
                                                parentIds="conversionType"
                                                placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                        </select>
                                    </div>
                                </div>
                                <div
                                        class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdFundDuration001.pageDataStatus}">有效状态</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="statusValidTwo"
                                                name="statusValid"
                                                multiple="true"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${PAGE_DATA_STATUS}'
                                                allowClear="true"
                                                placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div
                                        class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdFundObversion001.conversionTime}">份额折算日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id='conversionTime' name='conversionTime'
                                               class="layui-input form-input input-dateRangeSelect"
                                               placeholder="请选择、支持区间"
                                               data-th-placeholder="#{SysCommon.dateInterval}">
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div>
                        <table class="layui-table" id="dataTableTwo"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var PAGE_DATA_STATUS_01 = /*[[${PAGE_DATA_STATUS_01}]]*/'';
        var PAGE_DATA_STATUS_05 = /*[[${PAGE_DATA_STATUS_05}]]*/'';
        var PS_T13 = /*[[${PS_T13}]]*/'';
        var PS_T11 = /*[[${PS_T11}]]*/'';
        var F01 = /*[[${F01}]]*/'';
        var BONUS_MODE_01 = /*[[${BONUS_MODE_01}]]*/'';
        var BONUS_MODE_02 = /*[[${BONUS_MODE_02}]]*/'';
        var AUTHORITY_TYPE = /*[[${AUTHORITY_TYPE}]]*/'';
        var IsChongQing = /*[[${IsChongQing}]]*/'';
    </script>
    <script
            data-th-src="@{/js/invest/period/trdfundduration/TrdFundDuration001.js}"
            type="text/javascript">
    </script>
</div>
</body>
</html>
