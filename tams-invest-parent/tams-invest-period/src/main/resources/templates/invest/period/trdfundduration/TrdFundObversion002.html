<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.springframework.org/schema/mvc" xmlns:select2-search--hide="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout/default}">
<head>
    <title>基金份额折算新建</title>
    <style type="text/css">
        .form-label-wrap {
            width: 36% !important;
        }

        .layui-form-radio {
            margin: 0;
            padding-right: 0;
        }

        .layui-form-radio > i {
            font-size: 18px;
            margin-right: 2px;
        }

        .form-day-wrap {
            float: left;
        }
         .select2-search--dropdown.select2-search--hide{
             display: block;
         }
    </style>
</head>
<body>
<div layout:fragment="content">
        <form class="layui-form joyin-form-wrap pro-module-form"
              id="informationForm">
            <div class="pro-module-wrapper pro-module-base"
                 title="基本信息">
                <div class="pro-module-wrap">
                    <input type="hidden" id="acctNoList" name="selectValue" data-th-value="|${acctNoList}|">
                    <input style="display:none" type="text"
                           id="finprodId"
                           name="finprodId"
                           data-th-value="${entity?.finprodId}"
                           class="layui-input form-input"
                    />
                    <input style="display:none" type="text"
                           id="trader"
                           name="trader"
                           data-th-value="${trader}"
                           class="layui-input form-input"
                    />
                    <input style="display:none" type="text"
                           id="type"
                           name="type"
                           data-th-value="${type}"
                           class="layui-input form-input"
                    />
                    <input style="display:none" type="text"
                           id="mode"
                           name="mode"
                           data-th-value="${entity.mode}"
                           class="layui-input form-input"
                    />
                    <input style="display:none" type="text"
                           id="totleTradeId"
                           name="totleTradeId"
                           data-th-value="${entity?.totleTradeId}"
                           class="layui-input form-input"
                    />
                    <input style="display:none" type="text"
                           id="issuer"
                           name="issuer"
                           data-th-value="${entity?.issuer}"
                           class="layui-input form-input"
                    />
                    <input style="display:none" type="text"
                           id="pTradeId"
                           name="pTradeId"
                           data-th-value="${entity?.pTradeId}"
                           class="layui-input form-input"
                    />
                    <input style="display:none" type="text"
                           id="bTradeId"
                           name="bTradeId"
                           data-th-value="${entity?.bTradeId}"
                           class="layui-input form-input"
                    />
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">基本信息</span>（<span
                                class="star-sign">*</span>必填）<i
                                class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            th:text="#{TrdFundObversion001.conversionType}">份额折算类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="conversionType" name="conversionType" class="layui-input form-input input-select" required
                                                data-th-data-result='${CONVERSION_TYPE}' allowClear="true" placeholder="请输入内容"
                                                data-th-childrenIds="finprodMarketId"
                                                data-th-placeholder="#{SysCommon.placeholder}" th:initValue="${entity?.conversionType}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            th:text="#{TrdFundObversion001.conversionTime}">份额折算日</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                        <input type="text"
                                               id="conversionTime"
                                               name="conversionTime"
                                               th:value="${#dates.format(entity?.conversionTime,'yyyy-MM-dd')}"
                                               class="layui-input form-input input-dateSelect"
                                               placeholder="请输入"
                                               required>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdFundObversion001.conversionRat}">折算比例</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text"
                                               id="conversionRat"
                                               name="conversionRat"
                                               th:value="${entity?.conversionRat}"
                                               class="layui-input form-input text-number"
                                               data-textrange = '8'
                                               placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               >
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <input style="display:none" type="text"
                                           id="ccy"
                                           name="ccy"
                                           data-th-value="${entity?.ccy?:CCY_default}"
                                           class="layui-input form-input"
                                    />
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            th:text="#{TrdFundDuration001.finprodMarketId}">资产代码</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                        <select id="finprodMarketId"
                                                formatoption=false
                                                name="finprodMarketId"
                                                allowClear="true"
                                                class="layui-input form-input input-select"
                                                data-th-data-url="@{/invest/period/trdfundduration/TrdFundObversion001/getFinprodMarketId}"
                                                parentIds="conversionType"
                                                placeholder="请输入内容"
                                                th:initValue="${entity?.finprodMarketId}"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                required>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            th:text="#{TrdFundDuration001.finprodMarketName}">资产名称</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                        <input type="text"
                                               name="finprodMarketName"
                                               id="finprodMarketName"
                                               class="layui-input form-input"
                                               th:value="${entity?.finprodMarketName}"
                                               placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               disabled required>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap unitCprice">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            th:text="#{TrdFundObversion001.bconUnitCprice}">折算前单位净值</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                        <input type="text"
                                               id="bconUnitCprice"
                                               name="bconUnitCprice"
                                               th:value="${entity?.bconUnitCprice}"
                                               class="layui-input form-input text-number"
                                               data-textrange = '4'
                                               placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               required> <span
                                            class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap unitCprice">
                                    <label
                                            class="layui-form-label form-label-wrap"
                                            th:text="#{TrdFundObversion001.afterUnitCprice}">折算后单位净值</label>
                                    <div
                                            class="layui-input-inline input-inline">
                                        <input type="text"
                                               id="afterUnitCprice"
                                               name="afterUnitCprice"
                                               th:value="${entity?.afterUnitCprice}"
                                               class="layui-input form-input text-number"
                                               data-textrange = '4'
                                               placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               required> <span
                                            class="input-right-show">元</span>
                                    </div>
                                </div>
                            </div>
                    </div>
                <!--利息明细信息-->
                <div id="intDetailDiv" class="pro-module-wrap sjfx">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">折算明细信息</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <table class="layui-table" id="intDetailTable" th:name="finAssetIntInfoList"></table>
                        </div>
                    </div>
                </div>
                <!-- 附件信息 -->
                <div class="page-component" th:data-path="@{/component/core/FileCommon/init}" th:data-params="|{entityName: 'fileCommonDto', businessId: '${busiCode ?: ''}'}|"></div>
                 <!-- 划款信息 非货币现金分红显示-->
<!--                <div class="pro-module-wrap" th:id="|bussTrdTransferOrder_div|">-->
<!--                    <div class="pro-module">-->
<!--                        <h3 class="pro-module-title"><span class="title-des">指令信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>-->
<!--                        <div class="pro-module-item">-->
<!--                            <div class="layui-form-item">-->
<!--                                <input type="hidden" th:id="|bussTrdTransferOrder_payAcctNo|" th:name="selectValue" value="pay">-->
<!--                                <input type="hidden" th:id="|bussTrdTransferOrder_recAcctNo|" th:name="selectValue" value="rec">-->
<!--                                <a th:id="|bussTrdTransferOrder_btn_generate|" class="layui-btn layui-btn-sm" th:text="#{BussTrdTransferOrder.generate}">生成指令</a>-->
<!--                            </div>-->
<!--                            <table class="layui-table" th:id="|bussTrdTransferOrder_table|" th:name="bussTrdTransferOrder"></table>-->
<!--                        </div>-->
<!--                    </div>-->
<!--                </div>-->
                    <!-- 划款信息 非货币现金分红显示-->
                    <!-- <div class="page-component" th:if="${type eq '03'}"
                         th:data-path="@{/component/trade/BussTrdTransferOrder/init}"
                         th:data-params="|{entityName: 'bussTrdTransferOrder', pageFrom: 'informationForm', entity:'${entity_bussTrdTransferOrderDto}', bizCode:'${entity?.tradeId}'}|"></div> -->
                </div>
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"
                            style="border-top: 1px solid #ccc;">
                            <span class="title-des" th:text="#{TrdFundDuration001.remark}">备注</span><i
                                class="iconfont icon-arrow-down pro-down-icon"
                                ></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap"
                                     style="width: 100%;">
                                    <div class="layui-input-inline input-inline"
                                            style="margin:0 10px;width: 98% !important;">
                                            <textarea id="remark" name="remark" type="text"
                                                      maxlength="200"
                                                      class="layui-input layui-textarea"
                                                      placeholder="请输入内容"
                                                      th:text="${entity?.remark}"
                                                      data-th-placeholder="#{SysCommon.placeholder}"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row text-center"
                     style="margin-top: 50px;">
                    <a th:id="|${pageId}_btn_save|"
                       class="layui-btn layui-btn-sm btn-save"
                       data-th-text="#{SysCommon.save}">保存</a> <a
                        th:id="|${pageId}_btn_submit|"
                        class="layui-btn layui-btn-sm btn-submit"
                        data-th-text="#{SysCommon.submit}">提交</a> <a
                        th:id="|${pageId}_btn_cancel|"
                        class="layui-btn layui-btn-sm btn-cancel"
                        data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </div>
            </div>
        </form>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var FUND_ASSET_TYPE_F01 = /*[[${FUND_ASSET_TYPE_F01}]]*/'';
        var FUND_ASSET_TYPE_F02 = /*[[${FUND_ASSET_TYPE_F02}]]*/'';
        var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
        var YES_OR_NO = /*[[${YES_OR_NO}]]*/'';
        var YES_NO = /*[[${YES_OR_NO}]]*/'';
        var CCY = /*[[${CCY}]]*/'';
        var BONUS_MODE_01 = /*[[${BONUS_MODE_01}]]*/'';
        var BONUS_MODE_02 = /*[[${BONUS_MODE_02}]]*/'';
        var PS_DEFAULT = /*[[${PS_DEFAULT}]]*/'';
        var FINPRODTYPE_DEFAULT = /*[[${FINPRODTYPE_DEFAULT}]]*/'';
        var PS_T11 = /*[[${PS_T11}]]*/'';
        var PS_T12 = /*[[${PS_T12}]]*/'';
        var PS_T13 = /*[[${PS_T13}]]*/'';
        var type = /*[[${type}]]*/'';
        var bussTrdTransferOrderDtos = /*[[${entity?.bussTrdTransferOrder}]]*/'';
        var finAssetIntInfoList = /*[[${entity.finAssetIntInfoList}]]*/'';
        var workflowId = /*[[${workflowId}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/period/trdfundduration/TrdFundObversion002.js}" type="text/javascript"></script>
</div>
</body>
</html>
