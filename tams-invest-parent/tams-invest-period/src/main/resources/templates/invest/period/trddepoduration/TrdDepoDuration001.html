<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{TrdDepoDuration001}">存款存续期查询</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="layui-col-md12 layui-col-sm12 layui-col-lg12 layui-col-xs12 form-button-area" style="margin: 10px;">
            <a id="TrdDepoDuration001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="#{SysCommon.revoke}"></a>
            <a id="TrdDepoDuration001_btn_draw" class="layui-btn layui-btn-sm"
               data-th-text="#{TrdDepoDuration001.draw}">提前支取</a>
            <a id="TrdDepoDuration001_btn_demand" class="layui-btn layui-btn-sm"
               data-th-text="#{TrdDepoDuration001.demand}">活期存放结息</a>
        </div>
        <div class='joyin-form-wrap joyin-filter-form condition-area'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdDepoDuration001.busiCode}">业务编号</label>
                        <div class="layui-input-inline input-inline">
                            <select id="busiCode" name="busiCode" formatoption="false"
                                    class="layui-input form-input input-select"
                                    data-th-data-url="@{/invest/period/trddepoduration/TrdDepoDuration001/getBusiCode}"
                                    allowClear="true" placeholder="请输入内容" >
                            </select>
                        </div>
                    </div>
                    <!-- <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdDepoDuration001.portfolioId}">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <select id="portfolioId" name="portfolioId"
                                allowClear="true" multiple="true"
                                class="layui-input form-input input-select"
                                data-th-data-url="@{/period/trddepoduration/TrdDepoDuration001/getPortfolioId}"
                                placeholder="请输入内容"
                                formatoption = "false"
                                data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div> -->
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdDepoDuration001.pageDataStatus}">有效状态</label>
                        <div class="layui-input-inline input-inline">
                            <select id="statusValid" name="statusValid"
                                    class="layui-input form-input input-select"
                                    data-th-data-result='${PAGE_DATA_STATUS}' multiple="true" allowClear="true" placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-initValue = "${statusValid}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdBondDuration001.tradeDate}">资金到账日</label>
                        <div class="layui-input-inline input-inline">
                            <input id='tradeDate' name='tradeDate'
                                   class="layui-input form-input input-dateRangeSelect"
                                   placeholder="请选择、支持区间" data-th-placeholder="#{SysCommon.dateInterval}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdDepoDuration001.finprodMarketId}">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <select id="finprodMarketId" name="finprodMarketId" type="text"
                                    allowClear="true"
                                    class="layui-input form-input input-select"
                                    data-th-data-url="@{/invest/period/trddepoduration/TrdDepoDuration001/getFinprodMarketId}"
                                    placeholder="请输入内容"
                                    formatoption = "false" multiple="true"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-initValue='${finprodId}'>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdDepoDuration001.cashType}">类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="cashType" name="cashType"
                                    class="layui-input form-input input-select"
                                    data-th-data-result='${PINAN_BUSINESS_TYPE}'>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdDepoDuration001.mdateProd}">计息结束日</label>
                        <div class="layui-input-inline input-inline">
                            <input id='mdateProd' name='mdateProd'
                                   class="layui-input form-input input-dateRangeSelect"
                                   placeholder="请选择、支持区间" data-th-placeholder="#{SysCommon.dateInterval}"
                                   data-th-value = '${quaryDate}'>
                        </div>
                    </div>
                </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" id="chlId_div">
                    <label class="layui-form-label form-lable" data-th-text="#{invest.channelId}">通道</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="chlId" name="chlId"
                                class="layui-input form-input input-select" allowClear="true"
                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true"
                                data-th-data-url="@{/component/trade/BussChannelCommon/getChannelId}"
                                data-th-initvalue="${entity?.chlId}"
                                multiple="true">
                        </select>
                    </div>
                </div>
            </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var PAGE_DATA_STATUS_01 = /*[[${PAGE_DATA_STATUS_01}]]*/'';
        var PAGE_DATA_STATUS_05 = /*[[${PAGE_DATA_STATUS_05}]]*/'';
        var PAGE_DATA_STATUS_06 = /*[[${PAGE_DATA_STATUS_06}]]*/'';
        var PA_TQZQ = /*[[${PA_TQZQ}]]*/'';
        var CASH_CLASS_TYPE_ZJSX = /*[[${CASH_CLASS_TYPE_ZJSX}]]*/'';
        var assetType_tyjk = /*[[${assetType_tyjk}]]*/'';
        var PAGE_DATA_STATUS05 = /*[[${PAGE_DATA_STATUS05}]]*/'';
        var REM_TYPE = [[${remType}]];
        var DEPO_ASSET_TYPE_03 = /*[[${DEPO_ASSET_TYPE_03}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/period/trddepoduration/TrdDepoDuration001.js}" type="text/javascript"></script>
</div>
</body>
</html>
