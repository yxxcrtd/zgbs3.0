<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{invest/settle/fundback/print}">
<head>
    <title data-th-text="|存款类资产 业务编号-${entity?.bizCode}|"></title>
</head>
<body>
<div data-th-if="${entity} eq null">无数据</div>
<div layout:fragment="content" data-th-if="${entity} ne null">
    <style type="text/css">
        div{
            line-height: 25px;
        }
    </style>
    <!--如果存款交易数据DTO.存款类别 = 同业存款，并且存款交易数据DTO.是否保本 = 是，则调用“保本同业存款划款单”模板，生成划款单据。-->
    <div data-th-if="${entity?.type6 eq D02} and ${entity?.isGuarantee eq YN_Y}">
        <div style="text-align:center;"><h2>人民币理财产品资金平盘/确认书</h2></div>
        <table>
            <tr>
                <td>委托分行：</td>
                <td colspan="3" data-th-text="${entity?.assetSupplyBank}"></td>
            </tr>
            <tr>
                <td>平盘金额：</td>
                <td colspan="3" data-th-text="|${entity?.ccy} ${entity?.prinAmtLowerString} (大写) ${entity?.prinAmtString}|"></td>
            </tr>
            <tr>
                <td>交易日：</td>
                <td colspan="3" data-th-text="${entity?.tradeDateString}"></td>
            </tr>
            <tr>
                <td>起息日：</td>
                <td colspan="3" data-th-text="${entity?.vDateString}"></td>
            </tr>
            <tr>
                <td>到期日：</td>
                <td colspan="3" data-th-text="${entity?.mDateString}"></td>
            </tr>
            <tr>
                <td>本息支付：</td>
                <td colspan="3" data-th-text="${entity?.payCycleString}"></td>
            </tr>
            <tr>
                <td>平盘利率：</td>
                <td colspan="3" data-th-text="|${entity?.yieldString}%  (${entity?.basisString})|"></td>
            </tr>
            <tr>
                <td>利息：</td>
                <td colspan="3" data-th-text="${entity?.interest}"></td>
            </tr>
            <tr>
                <td>业务说明：</td>
                <td colspan="3" data-th-text="${entity?.comment}"></td>
            </tr>
            <tr>
                <td>单号：</td>
                <td colspan="3"></td>
            </tr>
            <tr>
                <td>经办：</td>
                <td data-th-text="${entity?.tradeOperator}"></td>
                <td>复核：</td>
                <td data-th-text="${entity?.tradeChecker}"></td>
            </tr>
        </table>
        <div data-th-text="|经办：${entity?.backOperator} (${entity?.backOperateTime})|"></div>
        <div data-th-text="|复核：${entity?.backChecker} (${entity?.backCheckTime})|"></div>
        <div style="text-align: right">运营管理部</div>
        <br/>
        <br/>
    </div>
    <!--如果存款交易数据DTO.存款类别 = 同业存款，并且存款交易数据DTO.是否保本 = 否，则调用“非保本同业存款划款单”模板，生成划款单据。-->
    <div data-th-if="${entity.type6 eq D02} and ${entity.isGuarantee eq YN_N}" style="width: 80%; margin: 0 auto !important;">
        <style type="text/css">
            .D02 td {
                border: 1px solid #99cbe7;
                padding: 3px;
                line-height: 25px;
            }
        </style>
        <div style="text-align:center;"><h2 data-th-text="|${entity?.portfolioName}理财产品定期存款划款指令|"></h2></div>
        <div style="text-align:center;" data-th-text="${entity?.tradeDateString}"></div>
        <div style="text-align:right;" data-th-text="|编号：${entity?.bizCode}|"></div>
        <div style="text-align:left;" data-th-text="|付款方名称：${entity?.payAcctName}|"></div>
        <div style="text-align:left;" data-th-text="|付款方账号：${entity?.payAcctNo}|"></div>
        <table style="border: 1px solid #99cbe7;width: 100%;" class="D02">
            <tr>
                <td colspan="2" data-th-text="|请于${entity?.tradeDateString}支付下列款项（共    笔）：|"></td>
            </tr>
            <tr>
                <td colspan="2">
                    <div data-th-text="|金额大写：${entity?.prinAmtString}|"></div>
                    <div data-th-text="|金额小写：￥${entity?.prinAmtLowerString}|"></div>
                    <div data-th-text="|投资类型：存放同业|"></div>
                    <div data-th-text="|起息日：${entity?.vDateString}|"></div>
                    <div data-th-text="|到期日：${entity?.mDateString}(节假日顺延)|"></div>
                    <div data-th-text="|实际计息天数：${entity?.termDays}天|"></div>
                    <div data-th-text="|定期利率：${entity?.yieldString}%|"></div>
                    <div data-th-text="|（该资金到期后自动划回平安银行理财产品托管账户）|"></div>
                    <div data-th-text="|户名：${entity?.receiveAcctName}|"></div>
                    <div data-th-text="|收款账号：${entity?.receiveAcctNo}|"></div>
                    <div data-th-text="|开户银行：${entity?.bankDep}|"></div>
                </td>
            </tr>
            <tr>
                <td colspan="2">资金用途（限15个字以内）：</td>
            </tr>
            <tr>
                <td colspan="2">
                    资产管理事业部备注：<br/>
                    存放同业<br/>
                    附加____张（如有）
                </td>
            </tr>
            <tr>
                <td colspan="2" data-th-text="|交易员：${entity?.tradeOperator}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;审批：${entity?.tradeChecker}|"></td>
            </tr>
            <tr>
                <td width="40%">
                    托管部核算经办：<br/>
                    托管部核算复核：<br/>
                    托管部清算经办：<br/>
                    托管部清算复核：<br/>
                    托管部业务主管：<br/><br/>
                    托管部总经理室：<br/>
                </td>
                <td valign="top">托管部核算经办：</td>
            </tr>
        </table>
        <div data-th-text="|经办：${entity?.backOperator} (${entity?.backOperateTime})|"></div>
        <div data-th-text="|复核：${entity?.backChecker} (${entity?.backCheckTime})|"></div>
        <div style="text-align: right;" data-th-text="运营管理部"></div>
        <br/>
        <br/>
    </div>
    <!--如果存款交易数据DTO.存款类别 = 同业借款，则调用“同业借款划款单”模板，生成划款单据。-->
    <div data-th-if="${entity.type6 eq D01}" style="width: 80%; margin: 0 auto !important;">
        <style type="text/css">
            .D01 td {
                border: 1px solid #99cbe7;
                padding: 3px;
                line-height: 25px;
            }
        </style>
        <div style="text-align:center;"><h2 data-th-text="|${entity?.portfolioName}资产同业借款委托书|"></h2></div>
        <div style="text-align:right;" data-th-text="|编号：${entity?.bizCode}|"></div>
        <div style="text-align:left;" data-th-text="|${entity?.assetSupplyBank}：|"></div>
        <div style="text-align:left;" data-th-text="|现委托你分行代理${entity?.portfolioName}理财产品办理同业借款业务，要素如下：|"></div>
        <table style="border: 1px solid #99cbe7;width: 100%;" class="D01">
            <tr>
                <td data-th-text="|金额大写：|" width="30%"></td>
                <td data-th-text="|${entity?.prinAmtString}|"></td>
            <tr>
                <td data-th-text="|金额小写：|"></td>
                <td data-th-text="|￥${entity?.prinAmtLowerString}|"></td>
            </tr>
            <tr>
                <td data-th-text="|起息日：|"></td>
                <td data-th-text="|${entity?.vDateString}|"></td>
            </tr>
            <tr>
                <td data-th-text="|到期日：|"></td>
                <td data-th-text="|${entity?.mDateString}|"></td>
            </tr>
            <tr>
                <td data-th-text="|借款利率：|"></td>
                <td data-th-text="|${entity?.yieldString}%|"></td>
            </tr>
            <tr>
                <td data-th-text="|交易对手：|"></td>
                <td data-th-text="|${entity?.counterName}|"></td>
            </tr>
        </table>
        请你分行按以下条款交易和管理此笔同业借款：
        <div data-th-each="text:${entity?.textList}">
        <div data-th-text="${text}"></div>
        </div>
        <div data-th-text="|&nbsp;&nbsp;&nbsp;&nbsp;户名：${entity?.payAcctName}|"></div>
        <div data-th-text="|&nbsp;&nbsp;&nbsp;&nbsp;账号：${entity?.payAcctNo}|"></div>
        <div data-th-text="|&nbsp;&nbsp;&nbsp;&nbsp;开户行：${entity?.payBankDept}|"></div>
        <br/>
        <div>请你分行按要求处理。</div>
        <div>&nbsp;&nbsp;&nbsp;&nbsp;特此委托。</div>
        <div style="text-align: right">总行资产管理事业部</div>
        <div style="text-align: right" data-th-text="${entity?.tradeDateString}"></div>
        <br/>
        <br/>
    </div>
</div>
<div layout:fragment="script">
</div>
</body>
</html>
