<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{[#pageId]}">[#title]</title>
    <style>
        .cash-table-wrap .layui-table-view .layui-table-box .layui-table-header .layui-table thead tr{
            background-color: #d9ecff;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
    </div>

    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm"> 
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">组合代码</label>
                    <div class="layui-input-inline input-inline">
                        <select id="portfolioId" name="portfolioId" multiple="true"
                                class="layui-input form-input input-select"
                                data-th-data-url="@{/invest/settle/fundback/FundBackgroundManagement001/findPortfolioId}"
                                allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">业务类型</label>
                    <div class="layui-input-inline input-inline">
                        <select id="bizType" name="bizType" 
                                class="layui-input form-input input-select"
                                data-th-data-result='${PINAN_BUSINESS_TYPE}'
                                allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">对手方账户</label>
                    <div class="layui-input-inline input-inline">
                        <select id="counterAcctNo" name="counterAcctNo" 
                                class="layui-input form-input input-select"
                                data-th-data-url="@{/invest/settle/balance/CashFlowBalanceManagement001/findCounterAcctNo}"
                                allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </select>

                        <!--<input type="text" id="counterAcctNo" name="counterAcctNo"  maxlength="32"
                               class="layui-input form-input input-lenovoselect"
                               data-th-data-url="@{/invest/settle/balance/CashFlowBalanceManagement001/findCounterAcctNoForSugg}"
                               data-idfield="id"
                               data-th-data-effectivefieldsalias='|{"id":"账号", "text":"户名"}|'
                               placeholder="请输入内容"/>-->
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">产品/资产代码</label>
                    <div class="layui-input-inline input-inline">
                        <select id="finprodId" name="finprodId"
                                multiple="true"
                                class="layui-input form-input input-select" formatoption="false"
                                data-th-data-url="@{/invest/settle/fundback/FundBackgroundManagement001/findBizCode}"
                                allowClear="true" placeholder="请输入内容" >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">现金流日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="cashDate" data-th-value="${cashDate}" class="layui-input form-input input-dateRangeSelect"/>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">备注</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="remark" name="remark" class="layui-input form-input" maxlength="50"/>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <!-- <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4" >
                    <label class="layui-form-label form-lable">借贷方向</label>
                    <div class="layui-input-inline input-inline">
                        <select id="cdFlowFlag" name="cdFlowFlag"  class="layui-input form-input input-select"
                                data-th-data-result='${CD_FLOW_FLAG}' allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>  -->
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">匹配状态</label>
                    <div class="layui-input-inline input-inline">
                        <select id="matchStatus" name="matchStatus"  class="layui-input form-input input-select"
                                data-th-initValue="${MATCH_STATUS_02}" data-th-data-result='${MATCH_STATUS}' allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
                <!--  add by wangyang1 【吉林银行】 增加 产品经理  2019年9月29日 start -->
                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4" id="div_prodManager">
                    <label class="layui-form-label form-lable">产品经理</label>
                    <div class="layui-input-inline input-inline">
                       <!--  <input type="text" name="prodManager"
                            id="prodManager"
                            class="layui-input form-input input-lenovoselect" maxlength=60
                            data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-data-url="@{/invest/product/common/getUserName}"> -->
                             <select type="text" name="prodManager" id="prodManager"
                                    class="layui-input form-input input-select" maxlength=60
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-url="@{/invest/product/common/getUserName}">
                                </select>
                    </div>
                </div>
                <!--  add by wangyang1 【吉林银行】 增加 产品经理 end --> 
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4" id="div_tgAcctNo">
                    <label class="layui-form-label form-lable">托管账户</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="tgAcctNo" name="tgAcctNo"  maxlength="32"
                               class="layui-input form-input input-lenovoselect"
                               data-th-data-url="@{/invest/settle/balance/CashFlowBalanceManagement001/findAcctNoByTg}"
                               data-idfield="code" data-keyfield="code"
                               data-th-data-effectivefieldsalias='|{"shortName":"户名","code":"账号"}|'
                               placeholder="请输入内容"/>
                    </div>
                </div>
             </div> 
            <!-- add by wangyang1 【吉林银行】 增加 托管账户  2019年9月29日 start -->
            <!-- <div class="layui-form-item">
               
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4" id="div_tgAcctNo">
                    <label class="layui-form-label form-lable">托管账户</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="tgAcctNo" name="tgAcctNo"  maxlength="32"
                               class="layui-input form-input input-lenovoselect"
                               data-th-data-url="@{/invest/settle/balance/CashFlowBalanceManagement001/findAcctNoByTg}"
                               data-idfield="code" data-keyfield="code"
                               data-th-data-effectivefieldsalias='|{"shortName":"户名","code":"账号"}|'
                               placeholder="请输入内容"/>
                    </div>
                </div>
            </div> -->
            <!--  add by wangyang1 【吉林银行】 增加 托管账户  2019年9月29日 end -->
        </form>
    </div>
    <div class="cash-table-wrap">
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
    </script>
    <div class="commonVariable" th:replace="invest/settle/balance/settleCommon::commonVariable"></div>
    <script data-th-src="@{/js/invest/settle/balance/CashFlowBalanceManagement001.js}" type="text/javascript"></script>
</div>
</body>

</html>
