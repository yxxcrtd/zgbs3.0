<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{invest/settle/fundback/print}">
<head>
    <title data-th-text="|${entity?.portfolioName}理财产品DVP划款指令|"></title>
</head>
<body>
<div data-th-if="${entity} eq null">无数据</div>
<div layout:fragment="content" data-th-if="${entity} ne null">
    <style type="text/css">
        div {
            line-height: 25px;
        }

        table td {
            border: 1px solid #99cbe7;
            padding: 3px;
            line-height: 25px;
        }
    </style>
    <!-- 其他资产类别 -->
    <div style="width: 80%; margin: 0 auto !important;">
        <div style="text-align:center;"><h2 data-th-text="|${entity?.portfolioName}理财产品DVP划款指令|"></h2></div>
        <div style="text-align:center;" data-th-text="|${entity?.settleDateString}|"></div>
        <div style="text-align:left;" data-th-text="|付款方名称：${entity?.payAcctName}|"></div>
        <div style="text-align:left;" data-th-text="|付款方账号：${entity?.payAcctNo}|"></div>
        <div style="text-align:left;" data-th-text="|付款方开户银行：${entity?.bankDep}|"></div>
        <table style="border: 1px solid #99cbe7;width: 100%;" class="PA_BUSINESS_TYPE16">
            <tr>
                <td colspan="2" data-th-text="|请于${entity?.settleDateString}支付下列款项：|"></td>
            </tr>
            <tr>
                <td colspan="2">
                    <div data-th-text="|金额大写：${entity?.settleAmtString}|"></div>
                    <div data-th-text="|金额小写：￥${entity?.settleAmtLowerString}|"></div>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <div data-th-text="|&nbsp;&nbsp;户&nbsp;名：${entity?.recAcctName}|"></div>
                    <div data-th-text="|&nbsp;&nbsp;账&nbsp;号：${entity?.recAcctNo}|"></div>
                    <div data-th-text="|&nbsp;&nbsp;开户行：${entity?.recBankDep}|"></div>
                    <div data-th-text="|&nbsp;&nbsp;行号：${entity?.largePayNo}|"></div>
                </td>
            </tr>
            <tr>
                <td colspan="2"></td>
            </tr>
            <tr>
                <td width="40%">
                    托管部核算经办：<br/>
                    托管部核算复核：<br/>
                    托管部清算经办：<br/>
                    托管部清算复核：<br/>
                    托管部业务主管：<br/><br/>
                    托管部总经理室：<br/>
                </td>
                <td valign="top">托管部备注：</td>
            </tr>
        </table>
        <br/>
        <div data-th-text="|经办：${entity?.operatorUserName}&nbsp;(${entity?.operatorTime})|"></div>
        <div data-th-text="|复核：${entity?.checkUserName}&nbsp;(${entity?.checkTime})|"></div>
        <br/>
        <br/>
    </div>
</div>
<div layout:fragment="script">
</div>
</body>
</html>
