<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{OrderNewBuild002}">指令新建</title>
</head>
<body>
	<div layout:fragment="content">
		<div class="pro-module-container">
			<form class="layui-form joyin-form-wrap pro-module-form" id="OrderNewBuild002_form">
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title">
							<span class="title-des">指令新建</span><i
								class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{OrderNewBuild002.orderId}">业务编号</label>
									<div class="layui-input-inline input-inline">
										<input type="text" name="actOrderId" id="actOrderId"
											class="layui-input form-input" maxLength="32"
											data-th-value="${entity?.actOrderId}" required disabled="disabled">
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{OrderNewBuild002.busiType}">业务类型</label>
									<div class="layui-input-inline input-inline">
										<select type="text" name="busiType"
											id="busiType"
											class="layui-input form-input input-select" maxLength=50
											data-th-placeholder="#{SysCommon.placeholder}" 
											data-th-data-result="${PINAN_BUSINESS_TYPE}"
											data-th-initValue='${entity?.busiType}' required>
										</select>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{OrderNewBuild002.payType}">划款类型</label>
									<div class="layui-input-inline input-inline">
										<select type="text" name="payType"
											id="payType"
											class="layui-input form-input input-select" maxLength=50
											data-th-placeholder="#{SysCommon.placeholder}" 
											data-th-data-result="${PA_PAY_TYPE}"
											data-th-initValue='${entity?.payType}' required>
										</select>
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{OrderNewBuild002.settleDate}">支付日</label>
									<div class="layui-input-inline input-inline">
										<input type="text" th:name="settleDate"
											th:id="settleDate"
											class="layui-input form-input input-dateSelect" required
											data-th-value='${#dates.format(entity?.settleDate,"yyyy-MM-dd")}'>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{OrderNewBuild002.ccy}">币种</label>
									<div class="layui-input-inline input-inline">
										<select th:id="ccy" th:name="ccy"
											class="layui-input form-input input-select" data-th-required="true"
											data-th-data-result="${CCY}" placeholder="请输入内容" 
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-initValue="${pageModel} eq ${pageModelNew} ? ${CNY} : ${entity?.ccy}">
										</select>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{OrderNewBuild002.settleAmt}">金额</label>
									<div class="layui-input-inline input-inline">
										<input type="text" th:id="settleAmt" th:name="settleAmt"
											data-th-value="${entity?.settleAmt}" maxlength=30 class="layui-input form-input text-number" placeholder="请输入" required/>
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{OrderNewBuild002.myAcctNo}">付款账号</label>
									<div class="layui-input-inline input-inline">
										<select type="text" name="myAcctNo" id="myAcctNo"
											class="layui-input form-input input-select" allowClear="true"
											placeholder="请输入内容" required
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-initValue='${entity?.myAcctNo}'
											data-th-data-url="@{/invest/settle/ordernewbuild/OrderNewBuild002/queryCapacctInfo}">
										</select>
									</div>
								</div>
								<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{OrderNewBuild002.counterAcctNo}">收款账号</label>
										<div class="layui-input-inline input-inline">
												<select type="text" name="counterAcctNo" id="counterAcctNo"
													class="layui-input form-input input-select" allowClear="true"
													placeholder="请输入内容" required
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-initValue='${entity?.counterAcctNo}'
													data-th-data-url="@{/invest/settle/ordernewbuild/OrderNewBuild002/queryCapacctInfo}">
												</select>
										</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{OrderNewBuild002.purpose}">资金用途</label>
									<div class="layui-input-inline input-inline">
										<input type="text" name="purpose" id="purpose"
											class="layui-input form-input" maxLength="32"
											data-th-value="${entity?.purpose}" required>
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{OrderNewBuild002.isNeedSend}">是否发送指令</label>
									<div class="layui-input-inline input-inline">
										<select th:id="isNeedSend" th:name="isNeedSend"
											class="layui-input form-input input-select" data-th-required="true"
											data-th-data-result="${YES_OR_NO}" placeholder="请输入内容" 
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-initValue="${entity?.isNeedSend}">
										</select>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<!-- 划款信息 -->
				<div id="transferInformation" class="page-component"
					th:data-path="@{/component/trade/BussTrdTransferOrder/init}"
					th:data-params="|{entityName: 'bussTrdTransferOrder', pageFrom: 'submitForm', entity:'${stlPayOrdersList}',bizCode:'${tradeId}',orderPageId:'OrderNewBuild002'}|"></div>
				<div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="aleft stuff title-des" >备注信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item pro-item-wrap">
                            <div class="layui-form-item">
                                <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                    <textarea class="layui-textarea" id="remark" maxLength="1000" name="remark" data-th-placeholder="#{SysCommon.placeholder}"  th:text="${entity?.remark}" placeholder="请输入内容"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
					<div class="text-center">
						<a th:id="|${pageId}_btn_save|"
							class="layui-btn layui-btn-sm btn-save"
							data-th-text="#{SysCommon.save}">保存</a> <a
							th:id="|${pageId}_btn_submit|"
							class="layui-btn layui-btn-sm btn-submit"
							data-th-text="#{SysCommon.submit}">提交</a> <a
							th:id="|${pageId}_btn_cancel|"
							class="layui-btn layui-btn-sm btn-cancel"
							data-th-text="#{SysCommon.cancel}">取消</a>
					</div>
			</form>
		</div>
	</div>
	<div layout:fragment="script">
		<script type="text/javascript" data-th-inline="javascript">
			var platDate = /*[[${platDate}]]*/; //平台日
			var myAcctNoInitValue = /*[[${entity?.myAcctNo}]]*/'';
            var counterAcctNoInitValue = /*[[${entity?.counterAcctNo}]]*/'';
		</script>
		<script
			data-th-src="@{/js/invest/settle/ordernewbuild/OrderNewBuild002.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
