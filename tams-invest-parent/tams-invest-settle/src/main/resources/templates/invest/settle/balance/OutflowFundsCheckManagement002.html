<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>匹配明细</title>
</head>
<body>
<div layout:fragment="content" style="">
    <div class="flow-top-table" style="width: 49%;display: inline-block;">
        <div class="table-header-title">系统流水</div>
        <table class="layui-table" id="sysFlowTable"></table>
    </div>
    <div class="flow-top-table" style="width: 49%;display: inline-block;">
        <div class="table-header-title">托管户流水</div>
        <table class="layui-table" id="enFlowTable"></table>
    </div>
    <div class="layui-form-item">
        <div class="layui-inline layui-col-md12 layui-col-sm12 layui-col-lg12 layui-col-xs12">
            <fieldset class='adver-fieldset'>
                <legend>交易备注</legend>
                <div class="layui-input-block" style="margin-left:0px;">
                        <textarea id="remark" name="remark" data-th-text="${remark}" placeholder="请输入内容" data-th-disabled="${!match}"
                                  class="layui-textarea"></textarea>
                </div>
            </fieldset>
        </div>
    </div>
    <div class="flow-btn-wrap" style="text-align: center; margin-top:10px;">
        <span data-th-if="${match}">
            <a class="layui-btn layui-btn-sm" id="OutflowFundsCheckManagement002_btn_match"><i class="iconfont icon-automatch"></i><span>匹配</span></a>
        </span>
        <span data-th-if="${!match}">
            <a class="layui-btn layui-btn-sm" id="OutflowFundsCheckManagement002_btn_cancelMatch"><i class="iconfont icon-delete_fill"></i><span>取消匹配</span></a>
        </span>
        <a id="TrdBondDuration002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel">关闭</a>
    </div>
</div>
</div>
</div>
<div layout:fragment="script">
	<style type="text/css">
        .table-header-title {
            background-color: #d9ecff;
            line-height: 28px;
            margin-bottom: -10px;
            font-size: 14px;
            text-align: center;
            color: #666;
        }
    </style>
    <script data-th-inline="javascript" type="text/javascript">
        var sysFlow = /*[[${sysFlow}]]*/'';
        var enFlow = /*[[${enFlow}]]*/'';
        var groupId = /*[[${groupId}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/settle/balance/OutflowFundsCheckManagement002.js}" type="text/javascript"></script>
</div>
</body>

</html>
