<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{invest/settle/fundback/print}">
<head>
    <title data-th-text="|打印产品成立单|"></title>
</head>
<body>
<div data-th-if="${entity == null} ">无数据</div>
<div layout:fragment="content" data-th-if="${entity != null} ">
    <div style="width: 80%; margin: 0 auto !important;">
        <style type="text/css">
            div {
                line-height: 25px;
            }

            .D01, .D01 td {
                border: 1px solid #d9ecff;
            }
        </style>
        <div style="text-align:center;"><h2 data-th-text="|关于${entity?.portfolioName}人民币理财产品（${entity?.finprodName}）|"></h2></div>
        <div style="text-align:center;"><h2 data-th-text="|成立通知暨划款指令|"></h2></div>
        <div style="text-align:right;" data-th-text="|期数：${entity?.repFinprodStage}|"></div>
        <h3 data-th-text="|${entity?.portfolioName}人民币理财产品（${entity?.finprodName}）于${entity?.tradeDateString}起息，起息要素见下表。|"></h3>
        <table style="width: 100%;" class="D01">
            <tr>
                <td>产品系列</td>
                <td colspan="3" data-th-text="|${entity?.finprodName}|"></td>
            <tr>
            <tr>
                <td width="25%" data-th-text="|客户类型：|"></td>
                <td width="40%" data-th-text="|${entity?.saleDepartmentString}|"></td>
                <td width="15%" data-th-text="|产品类型：|"></td>
                <td data-th-text="|${entity?.dealModeString}|"></td>
            <tr>
            <tr>
                <td data-th-text="|产品代码：|"></td>
                <td colspan="3" data-th-text="|${entity?.finprodMarketId}|"></td>
            <tr>
                <td data-th-text="|产品名称及期数：|"></td>
                <td colspan="3" data-th-text="|平安理财-${entity?.finprodName}(${entity?.repFinprodStage}期)|"></td>
            </tr>
            <tr>
                <td data-th-text="|本金（大写）：|"></td>
                <td colspan="3" data-th-text="|${entity?.prinAmtString}|"></td>
            </tr>
            <tr>
                <td data-th-text="|本金（小写）：|"></td>
                <td colspan="3" data-th-text="|${entity?.prinAmtLowerString}|"></td>
            </tr>
            <tr>
                <td data-th-text="|上期滚入金额：|"></td>
                <td colspan="3" data-th-text="|${entity?.lastAmtSubLowerString}|"></td>
            </tr>
            <tr>
                <td data-th-text="|本期新认购金额：|"></td>
                <td colspan="3" data-th-text="|${entity?.currentSubLowerString}|"></td>
            </tr>
            <tr>
                <td data-th-text="|分层金额：|"></td>
                <td colspan="3" data-th-text="|${entity?.laySubString}|"></td>
            </tr>
            <tr>
                <td data-th-text="|产品起息日：|"></td>
                <td colspan="3" data-th-text="|${entity?.tradeDateString}|"></td>
            </tr>
            <tr>
                <td data-th-text="|产品到期日：|"></td>
                <td colspan="3" data-th-text="|${entity?.mDateString}|"></td>
            </tr>
            <tr>
                <td data-th-text="|期限：|"></td>
                <td colspan="3" data-th-text="|${entity?.term}天|"></td>
            </tr>
            <tr>
                <td data-th-text="|销售分行：|"></td>
                <td colspan="3" data-th-text="|${entity?.entrustTypeString}|"></td>
            </tr>
            <tr>
                <td data-th-text="|产品收益率：|"></td>
                <td colspan="3" data-th-text="|${entity?.noLayYield}|"></td>
            </tr>
            <tr>
                <td data-th-text="|分层收益率：|"></td>
                <td colspan="3" data-th-text="|${entity?.layYield}|"></td>
            </tr>
            <tr>
                <td data-th-text="|销售费率：|"></td>
                <td data-th-text="|${entity?.c06Yield}|"></td>
                <td data-th-text="|托管费率：|"></td>
                <td data-th-text="|${entity?.c05Yield}|"></td>
            </tr>
            <tr>
                <td data-th-text="|资产管理费率：|"></td>
                <td data-th-text="|${entity?.c03Yield}|"></td>
                <td data-th-text="|其他费率：|"></td>
                <td data-th-text="|${entity?.c99Yield}|"></td>
            </tr>
        </table>
        <br/>
        <br/>
        <table style="width: 100%;">
            <tr>
                <td width="30%" data-th-text="|经办：${entity?.tradeOperator}|"></td>
                <td width="30%" data-th-text="|复核：${entity?.tradeChecker}|"></td>
                <td colspan="2" data-th-text="|授权：${entity?.tradeChecker}|"></td>
            </tr>
            <tr>
                <td colspan="4">&nbsp;</td>
            </tr>
            <tr>
                <td colspan="4">&nbsp;</td>
            </tr>
            <tr>
                <td colspan="3">&nbsp;</td>
                <td align="right">资产管理事业部</td>
            </tr>
            <tr>
                <td colspan="3">&nbsp;</td>
                <td align="right" data-th-text="${entity?.tradeDateString}"></td>
            </tr>
        </table>
        <table style="width: 100%;">
            <tr>
                <td>
                    <div data-th-text="|经办：${entity?.backOperator} (${entity?.backOperateTime})|"></div>
                </td>
            </tr>

            <tr>
                <td>
                    <div data-th-text="|复核：${entity?.backChecker} (${entity?.backCheckTime})|"></div>
                </td>
            </tr>
            <tr>
                <td>
                    <div style="text-align:right;">运营管理部</div>
                </td>
            </tr>
        </table>
        <br/>

    </div>
</div>
<div layout:fragment="script">
</div>
</body>
</html>
