<!DOCTYPE html>
<html
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.w3.org/1999/xhtml"
        layout:decorate="~{layout/default}">
<head>
    <title>划款指令管理</title>
</head>
<body>
<div layout:fragment="content">
    <div class="layui-tab-content" style="height: 100px;">
        <div class="layui-tab-item layui-show">
            <div class='layui-fluid'>
                <div class="layui-col-md12 form-button-area dvp-transfer-form">
						<a id="DvpOrderManagement001_btn_resend"
							class="layui-btn layui-btn-sm btn-sent"> <span
							data-th-text="#{DvpOrderManagement001.send}">发送</span>
						</a> <a id="DvpOrderManagement001_btn_refresh"
							class="layui-btn layui-btn-sm btn-refresh"> <span
							data-th-text="#{DvpOrderManagement001.refresh}">指令查证</span>
						</a> <a id="DvpOrderManagement001_btn_invalid"
							class="layui-btn layui-btn-sm btn-sent"> <span
							data-th-text="#{DvpOrderManagement001.invalid}">作废</span>
						</a> <a th:if="${isEleShow['StlOrderManagement001_btn_download']} ne 'N'"  id="StlOrderManagement001_btn_download"
							class="layui-btn layui-btn-sm btn-rateAdj"> <span
							data-th-text="附件下载">附件下载</span>
						</a>
                </div>

                <div class='joyin-form-wrap joyin-filter-form condition-area curr-form dvp-transfer-form'>
                    <form class="layui-form" id="dvpTransferForm">                    
                        <div class="layui-form-item">
                        
                            <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-lable">组合代码</label>
                                <div class="layui-input-inline input-inline">
                                    <select id="portfolioId" name="portfolioId" multiple
                                            class="layui-input form-input input-select"
                                            data-th-data-url="@{/invest/settle/fundback/FundBackgroundManagement001/findPortfolioId}"
                                            allowClear="true" placeholder="请选择组合">
                                    </select>
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-lable">产品/资产代码</label>
                                <div class="layui-input-inline input-inline">
                                    <select id="finprodId" name="finprodId" multiple
                                            class="layui-input form-input input-select" formatoption="false"
                                            data-th-data-url="@{/invest/settle/fundback/FundBackgroundManagement001/findBizCode}"
                                            allowClear="true" placeholder="请输入内容">
                                    </select>
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-lable">业务类型</label>
                                <div class="layui-input-inline input-inline">
                                    <select id="paBusinessType" name="paBusinessType" multiple
                                            class="layui-input form-input input-select"
                                            data-th-data-result='${PINAN_BUSINESS_TYPE}' formatoption=true
                                            data-th-placeholder="#{SysCommon.placeholder}">
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-lable">指令类型</label>
                                <div class="layui-input-inline input-inline">
                                    <select id="orderType" name="orderType"
                                            class="layui-input form-input input-select"
                                            data-th-data-result='${PA_PAY_TYPE}' formatoption=true
                                            data-th-placeholder="#{SysCommon.placeholder}">
                                    </select>
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-lable">发送状态</label>
                                <div class="layui-input-inline input-inline">
                                    <select id="sendStatus" name="sendStatus" class="layui-input form-input input-select"
                                            data-th-data-result='${SEND_STATUS}' formatoption=true
                                            data-th-placeholder="#{SysCommon.placeholder}">
                                    </select>
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-lable">指令接收状态</label>
                                <div class="layui-input-inline input-inline">
                                    <select id="receiveStatus" name="receiveStatus" class="layui-input form-input input-select"
                                            data-th-data-result='${IS_SUCCESS}' formatoption=true
                                            data-th-placeholder="#{SysCommon.placeholder}">
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-lable">处理状态</label>
                                <div class="layui-input-inline input-inline">
                                    <select id="dealStatus" name="dealStatus" class="layui-input form-input input-select"
                                            data-th-data-result='${COMMAND_DEAL_STATUS}' formatoption=true
                                            data-th-placeholder="#{SysCommon.placeholder}">
                                    </select>
                                </div>
                            </div>
                             <!-- 现金流日期默认显示平台日期 modify by liupeilin begin -->
                            <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-lable" data-th-text="#{FinProductDurDeal001.cashDate}">现金流日期</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="cashDate" name="cashDate"
                                           class="layui-input form-input input-dateRangeSelect" placeholder="请输入内容"
                                           data-th-value="|${platformDate} - ${platformDate}|"
                                           data-th-placeholder="#{SysCommon.placeholder}">
                                </div>
                            </div>
                            <!-- 现金流日期默认显示平台日期 modify by liupeilin end -->
                        </div>
                    </form>
                </div>
                <div>
                    <table class="layui-table" id="orderDataTable"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
	<script th:inline="javascript">
            var isSendStatusTableLinkShow = [[${isEleShow['send_status_table_link']}]];
	</script>
    <div class="commonVariable" th:replace="invest/settle/balance/settleCommon::commonVariable"></div>
    <script data-th-src="@{/js/invest/settle/order/StlOrderManagement001.js}"></script>
</div>
</body>
</html>
