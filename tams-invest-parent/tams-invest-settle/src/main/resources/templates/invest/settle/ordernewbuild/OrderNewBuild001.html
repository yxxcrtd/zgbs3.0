<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{OrderNewBuild001}">指令新建</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
    <a id="OrderNewBuild001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
	<a id="OrderNewBuild001_btn_revoke" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{OrderNewBuild001.revoke}"><i class="iconfont icon-revoke"></i>撤销</a>
	<a id="OrderNewBuild001_btn_resend" class="layui-btn layui-btn-sm btn-sent" data-th-text="#{OrderNewBuild001.send.btn}">指令发送</a>
	<a id="OrderNewBuild001_btn_verify" class="layui-btn layui-btn-sm btn-verify" data-th-text="#{OrderNewBuild001.verify.btn}">指令查证</a>
    </div>
	<div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
        	<div class="layui-form-item">
            	<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                	<label class="layui-form-label form-lable">组合代码</label>
                    <div class="layui-input-inline input-inline">
                    	<select id="portfolioId" name="portfolioId" multiple
                             class="layui-input form-input input-select"
                             data-th-data-url="@{/invest/settle/fundback/FundBackgroundManagement001/findPortfolioId}"
                             allowClear="true" placeholder="请选择组合">
                       	</select>
                     </div>
            	</div>
                <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable">产品/资产代码</label>
                    <div class="layui-input-inline input-inline">
                        <select id="prdId" name="prdId" multiple
                                class="layui-input form-input input-select" formatoption="false"
                                data-th-data-url="@{/invest/settle/fundback/FundBackgroundManagement001/findBizCode}"
                                allowClear="true" placeholder="请输入内容">
                        </select>
                    </div>
                  </div>
                   <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                       <label class="layui-form-label form-lable">业务类型</label>
                       <div class="layui-input-inline input-inline">
                           <select id="busiType" name="busiType" multiple
                                   class="layui-input form-input input-select"
                                   data-th-data-result='${PINAN_BUSINESS_TYPE}' formatoption=true
                                   data-th-placeholder="#{SysCommon.placeholder}">
                           </select>
                       </div>
                   </div>
               </div>
               <div class="layui-form-item">
                   <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                       <label class="layui-form-label form-lable">指令类型</label>
                       <div class="layui-input-inline input-inline">
                           <select id="payType" name="payType"
                                        class="layui-input form-input input-select"
                                        data-th-data-result='${PA_PAY_TYPE}' formatoption=true
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable">发送状态</label>
                            <div class="layui-input-inline input-inline">
                                <select id="sendStatus" name="sendStatus" class="layui-input form-input input-select"
                                        data-th-data-result='${SEND_STATUS}' formatoption=true
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable">指令接收状态</label>
                            <div class="layui-input-inline input-inline">
                                <select id="orderRecStatus" name="orderRecStatus" class="layui-input form-input input-select"
                                        data-th-data-result='${IS_SUCCESS}' formatoption=true
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable">处理状态</label>
                            <div class="layui-input-inline input-inline">
                                <select id="orderRetStatus" name="orderRetStatus" class="layui-input form-input input-select"
                                        data-th-data-result='${COMMAND_DEAL_STATUS}' formatoption=true
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable" data-th-text="#{FinProductDurDeal001.cashDate}">现金流日期</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="settleDate" name="settleDate"
                                       class="layui-input form-input input-dateRangeSelect" placeholder="请输入内容"
                                       data-th-placeholder="#{SysCommon.placeholder}">
                            </div>
                        </div>
                    </div>
        </form>
    </div>    

    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
	<script type="text/javascript" data-th-inline="javascript">
		var sendStatus_success = /*[[${sendStatus_success}]]*/; //发送状态-成功
		var orderStatus_new = /*[[${orderStatus_new}]]*/; //指令状态_新建
		var orderStatus_revoke = /*[[${orderStatus_revoke}]]*/; //指令状态_撤销
	</script>
    <script data-th-src="@{/js/invest/settle/ordernewbuild/OrderNewBuild001.js}" type="text/javascript"></script>
</div>
</body>

</html>
