<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{[#pageId]}">[#title]</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a id="FundBackgroundManagement001_btn_print" class="layui-btn layui-btn-sm btn-print">打印划款单</a>
    </div>

    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">组合代码</label>
                    <div class="layui-input-inline input-inline">
                        <select id="portfolioId" name="portfolioId" multiple="true"
                                class="layui-input form-input input-select"
                                data-th-data-url="@{/invest/settle/fundback/FundBackgroundManagement001/findPortfolioId}"
                                allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">产品/资产代码</label>
                    <div class="layui-input-inline input-inline">
                        <select id="bizCode" name="bizCode" multiple="true"
                                class="layui-input form-input input-select" formatoption="false"
                                data-th-data-url="@{/invest/settle/fundback/FundBackgroundManagement001/findBizCode}"
                                allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">操作类型</label>
                    <div class="layui-input-inline input-inline">
                        <select id="operateType" name="operateType"
                                class="layui-input form-input input-select"
                                data-th-data-result='${COMMAND_STATUS}'
                                allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">业务类型</label>
                    <div class="layui-input-inline input-inline">
                        <select id="bizType" name="bizType" multiple="true"
                                class="layui-input form-input input-select"
                                data-th-data-result='${PINAN_BUSINESS_TYPE}'
                                allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">现金流日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="cashDate" data-th-value="${cashDate}" class="layui-input form-input input-dateRangeSelect"/>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">有效状态</label>
                    <div class="layui-input-inline input-inline">
                        <select id="statusValid" name="statusValid"
                                class="layui-input form-input input-select"
                                data-th-data-result='${TRADE_FLOW_STATUS}'
                                allowClear="true" placeholder="请输入内容" data-th-initvalue="${TRADE_FLOW_STATUS01}"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">划款类型</label>
                    <div class="layui-input-inline input-inline">
                    <!-- 一体化对应etliu -->
                        <!-- <select id="payType" name="payType"
                                class="layui-input form-input input-select"
                                data-th-data-result='${PAY_TYPE}'
                                allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </select> -->
                        <select id="payType" name="payType"
                                class="layui-input form-input input-select"
                                data-th-data-result='${PA_PAY_TYPE}'
                                allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
            </div>
        </form>
    </div>
     <form class="layui-form" >
   	 <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable" onclick="getCheckLength()">划拨资金合计:</label>
                    <div class="layui-input-inline input-inline">
	                    <input type="text" id="cashAmtSum" class="layui-input form-input text-number"
	                    	style="width: 220px; display: inline-block;" disabled/>
	                    <div class="layui-input-inline input-inline" style="width: 20px!important; float: right;">
	                        <a th:id="FundBackgroundManagement001_btn_calculate" class="layui-btn layui-btn-sm">计算</a>
	                    </div>
                    </div>
                </div>
            </div>
    </form>
    <div id="dataTableDiv">
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var TRADE_FLOW_STATUS01 = /*[[${TRADE_FLOW_STATUS01}]]*/'';
        var FINPROD_TYPE_TG_F32 = /*[[${FINPROD_TYPE_TG_F32}]]*/'';
    </script>
    <div class="commonVariable" th:replace="invest/settle/balance/settleCommon::commonVariable"></div>
    <script data-th-src="@{/js/invest/settle/fundback/FundBackgroundManagement001.js}" type="text/javascript"></script>
</div>
</body>

</html>
