<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{invest/settle/fundback/print}">
<head>
    <title data-th-text="|${entity?.portfolioName?:''}理财产品分配收益划款指令|"></title>
</head>
<body>
<div data-th-if="${entity} eq null">无数据</div>
<div layout:fragment="content" data-th-if="${entity} ne null">
    <style type="text/css">
        div {
            line-height: 25px;
        }

        table td {
            border: 1px solid #99cbe7;
            padding: 3px;
            line-height: 25px;
        }
    </style>
    <!-- 其他资产类别 -->
    <div style="width: 80%; margin: 0 auto !important;">
        <div style="text-align:center;"><h2 data-th-text="|${entity?.portfolioName}理财产品分配收益划款指令|"></h2></div>
        <div style="text-align:center;" data-th-text="|${entity?.tradeDateString}|"></div>
        <div style="text-align:left;" data-th-text="|付款方名称：${entity?.payAcctName}|"></div>
        <div style="text-align:left;" data-th-text="|付款方账号：${entity?.payAcctNo}|"></div>
        <table style="border: 1px solid #99cbe7;width: 100%;" class="PA_BUSINESS_TYPE16">
            <tr>
                <td colspan="2" data-th-text="|请于${entity?.tradeDateString}支付下列款项：|"></td>
            </tr>
            <tr>
                <td colspan="2">
                    <div data-th-text="|金额小写：￥${entity?.settleAmtLowerString}|"></div>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <div data-th-text="|划款路径如下：|"></div>
                    <div data-th-text="|&nbsp;&nbsp;账户户名：${entity?.receiveAcctName}|"></div>
                    <div data-th-text="|&nbsp;&nbsp;账号：${entity?.receiveAcctNo}|"></div>
                    <div data-th-text="|&nbsp;&nbsp;开户行：${entity?.bankDep}|"></div>
                    <div data-th-text="|&nbsp;&nbsp;网点号或大额支付行号：${entity?.largePayno}|"></div>
                </td>
            </tr>
            <tr>
                <td colspan="2" data-th-text="|资金用途（限15个字以内）：申购 ${entity?.finprodName}|"></td>
            </tr>
            <tr>
                <td colspan="2" data-th-text="|资产管理事业部备注：认购 ${entity?.finprodName}|">
                    <br/>
                </td>
            </tr>
            <tr>
                <td colspan="2" data-th-text="|交易员：${entity?.tradeOperator}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;审批：${entity?.tradeChecker}|"></td>
            </tr>
            <tr>
                <td width="40%">
                    托管部核算经办：<br/>
                    托管部核算复核：<br/>
                    托管部清算经办：<br/>
                    托管部清算复核：<br/>
                    托管部业务主管：<br/><br/>
                    托管部总经理室：<br/>
                </td>
                <td valign="top">托管部备注：</td>
            </tr>
        </table>
        <br/>
        <br/>
        <br/>
    </div>
</div>
<div layout:fragment="script">
</div>
</body>
</html>
