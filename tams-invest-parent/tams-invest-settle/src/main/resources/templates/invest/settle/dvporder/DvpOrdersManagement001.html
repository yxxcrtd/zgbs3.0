<!DOCTYPE html>
<html
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{DvpOrdersManagement001}">DVP清算划款查询</title>
</head>
<body>
<div layout:fragment="content">
    <div class="layui-tab layui-tab-brief" lay-filter="docDemoTabBrief">
        <ul class="layui-tab-title">
            <li class="layui-this">DVP清算划款</li>
            <li>划款信息查询</li>
        </ul>
        <div class="layui-tab-content" style="height: 100px;">
            <div class="layui-tab-item layui-show">
                <div class='layui-fluid'>
                    <div class="layui-col-md12 form-button-area dvp-transfer-form">
                        <a id="DvpOrdersManagement001_btn_creatOrder" class="layui-btn layui-btn-sm btn-creatOrder"><i class="iconfont icon-bill"></i><span>&nbsp;&nbsp;指令生成</span></a>
                    </div>
                    <div class='joyin-form-wrap joyin-filter-form condition-area curr-form dvp-transfer-form'>
                        <form class="layui-form" id="dvpTransferForm">
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable">组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="portfolioId1" name="portfolioId1" multiple
                                                class="layui-input form-input input-select"
                                                data-th-data-url="@{/invest/settle/fundback/FundBackgroundManagement001/findPortfolioId}"
                                                allowClear="true" placeholder="请选择组合">
                                        </select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodMarketId" name="finprodMarketId" maxlength="20" class="layui-input form-input" data-th-placeholder="#{SysCommon.placeholder}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable">登记托管机构</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="acctType" name="acctType" class="layui-input form-input input-select"
                                                data-th-data-result='${REGIST_ORG}' formatoption=true
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable">业务编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="bizCode" name="bizCode" maxlength="20" class="layui-input form-input" data-th-placeholder="#{SysCommon.placeholder}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable">业务类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="paBusinessType" name="paBusinessType" multiple
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${PINAN_BUSINESS_TYPE}' formatoption=true
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                        </select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable">交割日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="settleDate" class="layui-input form-input input-dateRangeSelect" data-th-placeholder="#{SysCommon.placeholder}"/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable">处理状态</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="dealStatus" name="dealStatus" class="layui-input form-input input-select"
                                                data-th-data-result='${DISPOSE_STATUS}' formatoption=true
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                        </select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable">收/付款账号</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" name="counterAcctNo1" id="counterAcctNo1"
											class="layui-input form-input input-select" allowClear="true"
											placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-data-url="@{/invest/settle/ordernewbuild/OrderNewBuild002/queryCapacctInfo}">
										</select>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div>
                        <table class="layui-table" id="dvpTransferTable"></table>
                    </div>
                </div>
            </div>
            <div class="layui-tab-item">
                <div class='layui-fluid'>
                    <div class="layui-col-md12 form-button-area transfer-form">
                        <a id="DvpOrdersManagement001_btn_print"
                           class="layui-btn layui-btn-sm btn-print">打印划款单</a>
                        <a id="DvpOrdersManagement001_btn_revoke"
                           class="layui-btn layui-btn-sm btn-delete">撤销</a>
                    </div>
                    <div class='joyin-form-wrap joyin-filter-form condition-area curr-form transfer-form'>
                        <form class="layui-form" id="transferForm">
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable">组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="portfolioId" name="portfolioId" multiple
                                                class="layui-input form-input input-select"
                                                data-th-data-url="@{/invest/settle/fundback/FundBackgroundManagement001/findPortfolioId}"
                                                allowClear="true" placeholder="请选择组合">
                                        </select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable">业务编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="bizCode" class="layui-input form-input" maxlength="20" data-th-placeholder="#{SysCommon.placeholder}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable">支付日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="payDate" name="payDate" class="layui-input form-input input-dateRangeSelect" data-th-placeholder="#{SysCommon.placeholder}"/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable">发送状态</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="sendStatus" name="sendStatus" class="layui-input form-input input-select"
                                                data-th-data-result='${IS_SUCCESS}' formatoption=true
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                        </select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable">收/付款账号</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" name="counterAcctNo" id="counterAcctNo"
											class="layui-input form-input input-select" allowClear="true"
											placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-data-url="@{/invest/settle/ordernewbuild/OrderNewBuild002/queryCapacctInfo}">
										</select>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div>
                        <table class="layui-table" id="transferTable"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var 已处理 = /*[[${DISPOSE_STATUS_01}]]*/'01';
        var PAGE_STATUS_05 = /*[[${PAGE_STATUS_05}]]*/'';
        var 债券买入 = /*[[${PINAN_BUSINESS_TYPE_09}]]*/'';
        var 债券卖出 = /*[[${PINAN_BUSINESS_TYPE_10}]]*/'';
        var 债券行权 = /*[[${PINAN_BUSINESS_TYPE_11}]]*/'';
        var 正回购 = /*[[${PINAN_BUSINESS_TYPE_20}]]*/'';
        var 逆回购 = /*[[${PINAN_BUSINESS_TYPE_19}]]*/'';
        var 买断式正回购 = /*[[${PINAN_BUSINESS_TYPE_74}]]*/'';
        var 买断式逆回购 = /*[[${PINAN_BUSINESS_TYPE_75}]]*/'';
        var 买断式正回购到期 = /*[[${PINAN_BUSINESS_TYPE_76}]]*/'';
        var 买断式逆回购到期 = /*[[${PINAN_BUSINESS_TYPE_77}]]*/'';
        var 正回购到期 = /*[[${PINAN_BUSINESS_TYPE_52}]]*/'';
        var 逆回购到期 = /*[[${PINAN_BUSINESS_TYPE_51}]]*/'';
        var 债券借贷融入到期 = /*[[${PINAN_BUSINESS_TYPE_107}]]*/'';
        var 债券借贷融出到期 = /*[[${PINAN_BUSINESS_TYPE_108}]]*/'';
        var DVP划款 = /*[[${PINAN_BUSINESS_TYPE_81}]]*/'';
        var DVP资金调拨URL = /*[[@{/invest/portfolio/ptldvpfundallocation/PtlDvpFundAllocation002/init}]]*/'';
        var 债券交易URL = /*[[@{/invest/trade/bond/TrdBondInvestTrade002/init}]]*/'';
        var 回购交易URL = /*[[@{/invest/trade/trdrepotrade/TrdRepoTrade002/init}]]*/'';
        var 回购存续URL = /*[[@{/invest/period/trdrepoduration/TrdRepoDuration002/init}]]*/'';
        var 买断式回购交易URL = /*[[@{/invest/trade/buyoutrepo/TrdOutRightRepoTrade002/init}]]*/'';
        var 买断式回购存续URL = /*[[@{/invest/period/trdbuyoutduration/TrdRepoBuyoutDuration002/init}]]*/'';
        var 债券借贷存续URL = /*[[@{/invest/period/trdseclendduration/TrdSecLendDuration002/init}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/settle/dvporder/DvpOrdersManagement001.js}"></script>
</div>
</body>
</html>
