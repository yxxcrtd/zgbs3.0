<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{[#pageId]}">流入资金核对</title>
</head>
<body>
<div layout:fragment="content" style="">
    <div class="flow-left-contain" id="flowLeftContainDiv">
        <form class="layui-form">
            <div class="layui-form-item">
                <div>
                    <select id="escrowAcctNo" name="escrowAcctNo"
                            class="layui-input form-input input-select" formatoption="false" multiple
                            data-th-data-url="@{/invest/settle/balance/InflowFundsCheckManagement001/findEscrowAcctNo}"
                            allowClear="true" placeholder="托管账户">
                    </select>
                </div>
            </div>
        </form>
        <table class="layui-table" id="flowLeftTable"></table>
    </div>
    <div class="flow-right-contain">
        <div class="flow-right-top layui-col-lg6">
            <div class="flow-top-wrap">
                <form class="layui-form flow-form" id="form_right_top">
                    <div class="layui-form-item">
                        <div class="layui-col-lg6">
                            <label class="layui-form-label form-lable">组合代码</label>
                            <div class="layui-input-inline input-inline">
                                <select  type="text" id="portfolioId" name="portfolioId" multiple
                                        class="layui-input form-input input-select"
                                        allowClear="true" placeholder="请选择组合">
                                </select>                                
                            </div>
                        </div>
                        <div class="layui-col-lg6">
                            <label class="layui-form-label form-lable">状态</label>
                            <div class="layui-input-inline input-inline">
                                <select id="statusValid" name="statusValid" multiple
                                        class="layui-input form-input input-select"
                                        data-th-data-result='${PAGE_DATA_STATUS}' allowClear="true">
                                </select>
                            </div>
                        </div>                        
                    </div>
                    <div class="layui-form-item flow-inline-show">
                        <div class="layui-col-lg6">
                            <label class="layui-form-label form-lable">
                                <div class="flow-left-icon"><i class="iconfont icon-triangle-left"></i></div>业务类型</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" class="layui-input form-input input-select" id="paBizType" name="paBizType" multiple
                                        placeholder="请输入内容" data-th-data-result='${PINAN_BUSINESS_TYPE}'>
                                </select>
                            </div>
                        </div>
                        <div class="layui-col-lg6">
                            <label class="layui-form-label form-lable">产品/资产代码</label>
                            <div class="layui-input-inline input-inline">
                                <select id="finprodId" name="finprodId"
                                        class="layui-input form-input input-select" formatoption="false" multiple
                                        data-th-data-url="@{/invest/settle/fundback/FundBackgroundManagement001/findBizCode}"
                                        allowClear="true" placeholder="请输入内容">
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item flow-inline-show">
                        <div class="layui-col-lg6">
                            <label class="layui-form-label form-lable">现金流日期</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input input-dateRangeSelect" id="cashDate" name="cashDate" data-th-value="|${sysDate} - ${sysDate}|"
                                       placeholder="请选择(支持区间)"/>
                            </div>
                        </div>
                        <div class="layui-col-lg6">
                            <label class="layui-form-label form-lable">是否匹配</label>
                            <div class="layui-input-inline input-inline" style="">
                                <select type="text" class="layui-input form-input input-select" id="isMatched" name="isMatched"
                                        placeholder="请输入内容" data-th-data-result='${YES_OR_NO}' data-th-initvalue="${NO}">
                                </select>
                            </div>
                        </div>

                    </div>
                    <div class="layui-form-item flow-inline-show">
                         <div class="flow-btn-wrap" style="margin-right: 38px;">
                            <a class="layui-btn layui-btn-sm btn-search" id="InflowFundsCheckManagement001_btn_sysSearch">查询</a>
                            <a class="layui-btn layui-btn-sm btn-confirm" id="InflowFundsCheckManagement001_btn_confirmData">确认</a>
                            <a class="layui-btn layui-btn-sm btn-default" id="InflowFundsCheckManagement001_btn_match" style="background-color: #2693ff !important;color: #fff;">
                                <i class="iconfont icon-automatch"></i><span>&nbsp;&nbsp;手工匹配</span></a>
                            <a class="layui-btn layui-btn-sm btn-default" id="InflowFundsCheckManagement001_btn_unmatch" style="background-color: #2693ff !important;color: #fff;">
                                <i class="iconfont icon-automatch"></i><span>&nbsp;&nbsp;取消匹配</span></a>
                            <a class="layui-btn layui-btn-sm btn-export btn-default" id="InflowFundsCheckManagement001_btn_sysExport">导出</a>
                        </div>
                    </div>
                </form>
            </div>
            <div class="flow-top-table">
                <table class="layui-table" id="flowTopTable"></table>
            </div>
        </div>
        <div class="flow-right-top layui-col-lg6">
            <div class="flow-top-wrap">
                <form class="layui-form flow-form" id="form_right_bot">
                    <div class="layui-form-item">
                        <div class="layui-col-lg6">
                            <label class="layui-form-label form-lable">对手方账户</label>
                            <div class="layui-input-inline input-inline">
                                <select id="counterAcctNo" name="counterAcctNo"
                                        class="layui-input form-input input-select" formatoption="false"
                                        data-th-data-url="@{/invest/settle/balance/CashFlowBalanceManagement001/findCounterAcctNo}"
                                        allowClear="true" placeholder="请输入内容">
                                </select>
                            </div>
                        </div>
                        <div class="layui-col-lg6">
                            <label class="layui-form-label form-lable">到账日</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" class="layui-input form-input input-dateRangeSelect" id="arriveDate" name="arriveDate" data-th-value="|${sysDate} - ${sysDate}|"
                                       placeholder="请选择(支持区间)"/>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label form-lable" style="width: 19%">到账金额</label>
                        <input type="text" class="layui-input form-input text-number" id="arriveAmtMin" name="arriveAmtMin" style="width: 33%; display: inline-block;"
                               placeholder="请输入最小金额">
                        -
                        <input type="text" class="layui-input form-input text-number" id="arriveAmtMax" name="arriveAmtMax" style="width: 33%; display: inline-block;"
                               placeholder="请输入最大金额">
                    </div>
                    <div class="layui-form-item flow-inline-show">
                        <div class="layui-col-lg6">
                            <label class="layui-form-label form-lable">是否匹配</label>
                            <div class="layui-input-inline input-inline" style="">
                                <select type="text" class="layui-input form-input input-select" id="enIsMatch" name="enIsMatch"
                                        placeholder="请输入内容" data-th-data-result='${YES_OR_NO}' data-th-initvalue="${NO}">
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item flow-inline-show">                        
                        <div class="flow-btn-wrap">
    <!--                    <a class="layui-btn layui-btn-sm btn-search btn-more-bot"><i class="iconfont icon-more"></i><span>更多</span></a>-->
                            <a class="layui-btn layui-btn-sm btn-search" id = "InflowFundsCheckManagement001_btn_cashInfSel"><i class="iconfont"></i><span>流水更新</span></a>
                            <a class="layui-btn layui-btn-sm btn-search" id="InflowFundsCheckManagement001_btn_enSearch">查询</a>
                                    <!--                    <a class="layui-btn layui-btn-sm btn-export btn-default" id="InflowFundsCheckManagement001_btn_enExport">导出</a>-->
                            <a class="layui-btn layui-btn-sm btn-reset btn-default" id="InflowFundsCheckManagement001_btn_remarkSet" style="background-color: #2693ff !important;color: #fff;">设置备注</a>
                        </div>
                    </div>
                </form>
            </div>
            <div class="flow-top-table">
                <table class="layui-table" id="flowBottomTable"></table>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
	<style>
        .flow-left-contain {
            float: left;
            padding-right: 1px;
            width: 14.5%;
            border-right: 1px solid #c2c2c2;
        }
        .flow-right-contain {
            overflow: hidden;
            position: relative;
            float: left;
            width: 84%;
            margin-left: 5px;
        }

        .flow-left-contain .layui-table-view .layui-table-box .layui-table-header tr {
            background-color: #eee !important;
        }

        .flow-left-contain .layui-table-view .layui-table-body table {
            width: 100%;
        }
        .flow-left-contain .layui-table-view .layui-table-header th[data-field='portfolio'] {
            width: 145px;
        }
        .flow-left-contain .layui-table-view .layui-table-body td[data-field='portfolio'] {
            width: 145px;
        }

        .flow-left-contain .layui-table-view .layui-table-box .layui-table-body table tbody tr td .layui-table-cell {
            height: 36px;
            line-height: 18px;
            /*white-space: normal;*/
        }

        .flow-left-contain .layui-table-view .layui-table-header table {
            width: 100%;
        }
        .flow-left-contain .layui-table-view .layui-table-header table th div.laytable-cell-1-unmatchedNum{
            width: 42px;
            padding-left: 9px;
            padding-right: 0px;
        }

        .flow-left-icon {
            width: 13px;
            cursor: pointer;
            background: #fff;
            float: left;
        }

        .flow-left-icon:hover {
            background-color: #dbdbdb;
        }

        .flow-left-icon i {
            margin-left: -3px;
            width: 6px;
            font-size: 17px;
            color: #5897fb;
        }

        .flow-form {
            /*float: left;
            width: 73%;*/
        }

        .flow-btn-wrap {
            float: right;
            /*width: 26%;*/
        }

        .flow-btn-wrap .layui-btn-sm {
            padding: 0 4px;
        }

        .layui-btn + .layui-btn {
            margin-left: 2px;
        }

        .layui-form-item .select2-container {
            width: 100% !important;
        }

        #flowLeftContainDiv .layui-table tr {
            background-color: #dbf7ff;
        }
        #flowLeftContainDiv .flow-left-contain .layui-table-view .layui-table-box .layui-table-body table tbody tr:nth-child(even) {
            background-color: #dbf7ff;
        }

        .layui-table-cell .btn {
            font-size: 8px;
            color: #007fff;
        }
        .flow-left-contain .layui-table .layui-table-view .layui-table-box .layui-table-body table tbody tr{
            background-color: #d9ecff;
        }
        .max-width {
            width: 100%;
        }
        .laytable-cell-1-unmatchedNum {
            width: 80px;
        }
    </style>
    <script data-th-inline="javascript" type="text/javascript">
        var YES = /*[[${YES}]]*/'';
        var NO = /*[[${NO}]]*/'';
        var resetWidth = function (windowWidth) {
            var flowLeftContainDivWidth = $("#flowLeftContainDiv").css("width")
            if (flowLeftContainDivWidth.indexOf('%') >= 0) {
                flowLeftContainDivWidth = flowLeftContainDivWidth.substring(0, flowLeftContainDivWidth.length - 1);
                flowLeftContainDivWidth = Number(flowLeftContainDivWidth)*windowWidth/100;
            }
            else if (flowLeftContainDivWidth.indexOf('px') >= 0) {
                flowLeftContainDivWidth = Number(flowLeftContainDivWidth.substring(0, flowLeftContainDivWidth.length - 2))*windowWidth/100;
            }
            var tableWidth = (windowWidth - flowLeftContainDivWidth - 20)/2;
            $(".flow-right-top").css({width: (tableWidth - 55) + 'px', float: 'left'})
        }

       /* $(function () {
            resetWidth(parent.window.innerWidth||window.innerWidth);
        })*/
    </script>
    <div class="commonVariable" th:replace="invest/settle/balance/settleCommon::commonVariable"></div>
    <script data-th-src="@{/js/invest/settle/balance/InflowFundsCheckManagement001.js}" type="text/javascript"></script>
</div>
</body>

</html>
