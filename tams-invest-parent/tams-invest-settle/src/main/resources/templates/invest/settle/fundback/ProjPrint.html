<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{invest/settle/fundback/print}">
<head>
    <title data-th-text="|${entity?.portfolioName}产品非标债权资产划款指令|"></title>
</head>
<body>
<div data-th-if="${entity} eq null">无数据</div>
<div layout:fragment="content" data-th-if="${entity} ne null">
    <style type="text/css">
        div {
            line-height: 25px;
        }

        table td {
            border: 1px solid #99cbe7;
            padding: 3px;
            line-height: 25px;
        }
    </style>
    <!-- 非标债权 -->
    <div data-th-if="${entity.type6 eq P01}" style="width: 80%; margin: 0 auto !important;">
        <div style="text-align:center;"><h2 data-th-text="|${entity?.portfolioName}产品非标债权资产划款指令|"></h2></div>
        <div style="text-align:center;" data-th-text="${entity?.tradeDateString}"></div>
        <div style="text-align:left;" data-th-text="|付款方名称：${entity?.payAcctName}|"></div>
        <div style="text-align:left;" data-th-text="|付款方账号：${entity?.payAcctNo}|"></div>
        <div style="text-align:left;" data-th-text="|付款方开户行：${entity?.payBankDept}|"></div>
        <table style="border: 1px solid #99cbe7;width: 100%;" class="D02">
            <tr>
                <td colspan="2" data-th-text="|请于${entity?.tradeDateString}支付下列款项：|"></td>
            </tr>
            <tr>
                <td colspan="2">
                    <div data-th-text="|金额大写：${entity?.settleAmtString}|"></div>
                    <div data-th-text="|金额小写：￥${entity?.settleAmtLowerString}|"></div>
                    <div data-th-text="|投资类型：非标债权|"></div>
                    <div data-th-text="|起息日：${entity?.vDateString}|"></div>
                    <div data-th-text="|户名：${entity?.receiveAcctName}|"></div>
                    <div data-th-text="|账号：${entity?.receiveAcctNo}|"></div>
                    <div data-th-text="|行号：${entity?.largePayno}|"></div>
                </td>
            </tr>
            <tr>
                <td colspan="2">资金用途（限15个字以内）：</td>
            </tr>
            <tr>
                <td colspan="2">
                    资产管理事业部备注：<br/>
                    <div data-th-text="|非标债权（买入）${entity?.bizCode}成立付款|"></div>
                    附加____张（如有）
                </td>
            </tr>
            <tr>
                <td colspan="2" data-th-text="|交易员：${entity?.tradeOperator}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;审批：${entity?.tradeChecker}|"></td>
            </tr>
            <tr>
                <td width="40%">
                    托管部核算经办：<br/>
                    托管部核算复核：<br/>
                    托管部清算经办：<br/>
                    托管部清算复核：<br/>
                    托管部业务主管：<br/><br/>
                    托管部总经理室：<br/>
                </td>
                <td valign="top">托管部备注：</td>
            </tr>
        </table>
        <br/>
        <br/>
        <br/>
    </div>
    <!-- 其他资产类别 -->
    <div data-th-if="${entity.type6 ne P01}" style="width: 80%; margin: 0 auto !important;">
        <div style="text-align:center;"><h2 data-th-text="|${entity?.portfolioName}理财划款指令|"></h2></div>
        <div style="text-align:center;" data-th-text="|${entity?.tradeDateString}|"></div>
        <div style="text-align:right;" data-th-text="|编号：${entity?.bizCode}|"></div>
        <div style="text-align:left;" data-th-text="|付款方名称：${entity?.payAcctName}|"></div>
        <div style="text-align:left;" data-th-text="|付款方账号：${entity?.payAcctNo}|"></div>
        <table style="border: 1px solid #99cbe7;width: 100%;" class="PA_BUSINESS_TYPE16">
            <tr>
                <td colspan="2" data-th-text="|请于${entity?.settleDateString}支付下列款项：|"></td>
            </tr>
            <tr>
                <td colspan="2">
                    <div data-th-text="|金额大写：${entity?.settleAmtString}|"></div>
                    <div data-th-text="|金额小写：￥${entity?.settleAmtLowerString}|"></div>
                    <div data-th-text="|投资类型：${entity?.type6String}|"></div>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <div data-th-text="交易信息"></div>
                    <div data-th-text="|本金：￥${entity?.prinAmtLowerString}元&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;利率：${entity?.yieldString}%|"></div>
                    <div data-th-text="|起息日：${entity?.vDateString}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;到期日：${entity?.mDateString}|"></div>
                    <div data-th-text="|计息基础：${entity?.basisString}|"></div>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <div data-th-text="|划款路径如下：|"></div>
                    <div data-th-text="|&nbsp;&nbsp;账户户名：${entity?.receiveAcctName}|"></div>
                    <div data-th-text="|&nbsp;&nbsp;账号：${entity?.receiveAcctNo}|"></div>
                    <div data-th-text="|&nbsp;&nbsp;开户行：${entity?.bankDep}|"></div>
                    <div data-th-text="|&nbsp;&nbsp;网点号或大额支付行号：${entity?.largePayno}|"></div>
                </td>
            </tr>
            <tr>
                <td colspan="2" data-th-text="|资金用途（限15个字以内）：买入 ${entity?.finprodName}${entity?.type6String}|"></td>
            </tr>
            <tr>
                <td colspan="2">
                    资产管理事业部备注：账户信息见附件缴款通知书<br/>
                </td>
            </tr>
            <tr>
                <td colspan="2" data-th-text="|交易员：${entity?.tradeOperator}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;审批：${entity?.tradeChecker}|"></td>
            </tr>
            <tr>
                <td width="40%">
                    托管部核算经办：<br/>
                    托管部核算复核：<br/>
                    托管部清算经办：<br/>
                    托管部清算复核：<br/>
                    托管部业务主管：<br/><br/>
                    托管部总经理室：<br/>
                </td>
                <td valign="top">托管部备注：</td>
            </tr>
        </table>
        <br/>
        <br/>
        <br/>
    </div>
</div>
<div layout:fragment="script">
</div>
</body>
</html>
