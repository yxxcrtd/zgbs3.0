<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{DvpOrdersManagement002}">DVP清算指令生成</title>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
        <input id="workflowId" name="workflowId" data-th-value="${workflowId}" hidden>
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">指令信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div>
                            <table class="layui-table" id="orderDataTable"></table>
                        </div>
                    </div>
                </div>
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">交易信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div>
                            <table class="layui-table" id="tradeDataTable"></table>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md11" style="margin: 50px;">
                    <div class="text-center">
                        <a id="DvpOrdersManagement002_btn_save" class="layui-btn layui-btn-sm btn-save" >保存</a>
                        <a id="DvpOrdersManagement002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
                        <a id="DvpOrdersManagement002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var bizCodes = /*[[${bizCodes}]]*/'';
        var YES_NO = /*[[${YES_OR_NO}]]*/'';
        var orderId = /*[[${orderId}]]*/'';
        var workflowId = /*[[${workflowId}]]*/'';
        var isTodoList = /*[[${isTodoList}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/settle/dvporder/DvpOrdersManagement002.js}"></script>
</div>
</body>
</html>
