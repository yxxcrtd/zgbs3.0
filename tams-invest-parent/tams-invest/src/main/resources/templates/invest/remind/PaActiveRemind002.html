<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title data-th-text="#{PaActiveRemind002}">主动提醒详情</title>
</head>
<body>
<div layout:fragment="content">
    <div class='joyin-form-wrap'>
        <form class="layui-form joyin-form-wrap" id="searchForm">
            <div class='' style='position: relative;'>
                <a id="PaActiveRemind002_btn_search" class="layui-btn layui-btn-sm btn-search" style='right: 0;top:5px;position: absolute;'>查询</a>
            </div>
            <div class="layui-form-item" style='padding-right:100px;'>
                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                <label class="layui-form-label form-lable" data-th-text="#{PaActiveRemind002.quaryDate}">查询日期</label>
                <div class="layui-input-inline input-inline">
                    <input id='quaryDate' name='quaryDate' class="layui-input form-input input-dateSelect"
                           placeholder="请选择时间区间" data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-value='${#dates.format(quaryDate,"yyyy-MM-dd")}'>
                </div>
            </div>
                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{PaActiveRemind002.mainCategory}">提醒类型(大分类)</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="mainCategory" name="mainCategory"
                               class="layui-input form-input input-select" allowClear="false"
                               placeholder="请选择提醒类型(大分类)" data-th-placeholder="#{SysCommon.placeholder}" formatoption="true"
                               data-th-childrenIds="smallCategory" data-th-data-result="${REMINDER_TYPE_BIG}" data-th-value="${mainCategory}">
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{PaActiveRemind002.smallCategory}">提醒类型(小分类)</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="smallCategory" name="smallCategory"
                               data-th-parentIds="mainCategory"
                               class="layui-input form-input input-select"
                               placeholder="请选择提醒类型(小分类)" data-th-placeholder="#{SysCommon.placeholder}" formatoption="true"
                               data-th-data-result="${REMINDER_TYPE_SMALL}" data-th-value="${smallCategory}">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div id="dataTableR1_div">
        <table class="layui-table" id="dataTableR1" name="dataTableR1">
        </table>
    </div>
    <div id="dataTableR2_div">
        <table class="layui-table" id="dataTableR2" name="dataTableR2">
        </table>
    </div>
     <div id="dataTableR3_div">
        <table class="layui-table" id="dataTableR3" name="dataTableR3">
        </table>
    </div>
    <div id="dataTableR9_div">
        <table class="layui-table" id="dataTableR9" name="dataTableR9">
        </table>
    </div>
    <div id="dataTableR5_div">
        <table class="layui-table" id="dataTableR5" name="dataTableR5">
        </table>
    </div>
</div> 
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
            var normal = /*[[${normal}]]*/'';
            var warning = /*[[${warning}]]*/'';
            var violation = /*[[${violation}]]*/'';
            var approve = /*[[${approve}]]*/'';
            var error = /*[[${error}]]*/'';   
            var NONE = /*[[${NONE}]]*/'';
            var SUP_UNIT=/*[[${SUP_UNIT}]]*/;  //单位数据字典下拉
    </script>
    <script data-th-src="@{/invest/js/remind/RskQuotaCommon.js}" type="text/javascript"></script>
    <script data-th-src="@{/invest/js/remind/PaActiveRemind002.js}" type="text/javascript"></script>
</div>
</body>
</html>
