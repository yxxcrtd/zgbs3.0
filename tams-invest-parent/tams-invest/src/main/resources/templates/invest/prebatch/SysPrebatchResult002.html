<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
    <title data-th-text="#{SysPrebatchResult002}">批前检查详情</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area" export="false" filter="false">
<!--        <a id="SysPrebatchResult001_btn_add" class="layui-btn layui-btn-sm btn-create">启动</a>-->
        <!--            <a id="SysPrebatchResult001_btn_delete" class="layui-btn layui-btn-sm btn-delete" style="display: none">删除</a>-->
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <input type="text" id="seqNo" name='seqNo'  th:value="${seqNo}" disabled style="display: none;"
                       data-th-placeholder="#{SysCommon.dateInterval}" class="layui-input form-input" />
                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{SysPrebatchResult002.portfolioId}">产品代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" name="portfolioId"
                                class="layui-input form-input input-select" allowClear="true"
                                placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                formatoption=true multiple="true" parentIds="seqNo"
                                data-th-data-url="@{/invest/prebatch/SysPrebatchResult002/queryPortfolioIdInfo}">
                        </select>
                    </div>

                </div>
                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{SysPrebatchResult002.finprodId}">资产代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" name="finprodId"
                                class="layui-input form-input input-select" allowClear="true"
                                placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                formatoption=true multiple="true" parentIds="seqNo"
                                data-th-data-url="@{/invest/prebatch/SysPrebatchResult002/queryFinprodIdInfo}">
                        </select>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">

    </script>
    <script data-th-src="@{/invest/js/prebatch/SysPrebatchResult002.js}" type="text/javascript"></script>
</div>
</body>
</html>
