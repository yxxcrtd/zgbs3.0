<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
<title data-th-text="#{SysPrebatchResult001}">批前检查</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area" export="false">
            <a id="SysPrebatchResult001_btn_add" class="layui-btn layui-btn-sm btn-create">启动</a>
<!--            <a id="SysPrebatchResult001_btn_delete" class="layui-btn layui-btn-sm btn-delete" style="display: none">删除</a>-->
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{SysPrebatchResult001.checkDate}">检查日</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="checkDate" name='checkDate' data-th-value="${checkDate}"
                                   data-th-placeholder="#{SysCommon.dateInterval}" class="layui-input form-input input-dateRangeSelect" />
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{SysPrebatchResult001.taskId}">检查项</label>
                        <div class="layui-input-inline input-inline">
                            <select name="checkPoint"
                                    class="layui-input form-input input-select" formatoption=true multiple="true"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result="${CHECK_POINT}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{SysPrebatchResult001.taskStatus}">执行状态</label>
                        <div class="layui-input-inline input-inline">
                            <select name="prebatchStatus"
                                    class="layui-input form-input input-select" formatoption=true multiple="true"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result="${PREBATCH_STATUS}">
                            </select>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script th:inline="javascript" type="text/javascript">

        </script>
        <script data-th-src="@{/invest/js/prebatch/SysPrebatchResult001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
