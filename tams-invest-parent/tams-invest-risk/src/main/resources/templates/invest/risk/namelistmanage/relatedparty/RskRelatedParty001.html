<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RskRelatedParty001}">关联方管理</title>
</head>
<body>
    <div layout:fragment="content">
        <div class='layui-fluid'>
            <div class="layui-col-md12 layui-col-sm12 layui-col-lg12 layui-col-xs12 form-button-area" style="margin: 10px;">
                <a id="RskRelatedParty001_btn_import" class="layui-btn layui-btn-sm btn-import btn-default">导入</a>
                <a id="RskRelatedParty001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
                    data-th-text="#{SysCommon.delete}" style="display: none;">删除</a>
            </div>
            <div class='joyin-form-wrap joyin-filter-form condition-area'>
                <form class="layui-form" id="searchForm">
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                            <label class="layui-form-label form-lable"
                                data-th-text="#{RskRelatedParty001.instituteName}">关联方名称</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="instituteName" name="instituteName"
                                    class="layui-input form-input input-lenovoselect" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-url="@{/invest/risk/namelistmanage/relatedparty/RskRelatedParty001/queryInstituteName}"
                                    data-idfield="code" data-keyfield="name" 
                                    data-th-data-effectivefieldsalias='|{"code":"#{RskRelatedParty001.instituteCode}","shortName":"#{RskRelatedParty001.instituteName}"}|'
                                />
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/risk/namelistmanage/relatedparty/RskRelatedParty001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
