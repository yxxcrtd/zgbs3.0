<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{FlowRiskStressTestView001}">流动性风险-压力测试概览</title>
    <link rel="stylesheet" data-th-href="@{/js/invest/risk/stresstestmanage/flowriskflowassets/iconfont.css}">
    <style type="text/css">
		.layui-table-cell {
			/* 表头文字居中  */
			text-align: center;
		}
</style>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area">
        	<a id="FlowRiskStressTestView001_btn_new" class="layui-btn layui-btn-sm ">新建压力测试</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
               <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="压力测试模板">压力测试模板</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="tmplName" name="tmplName" disabled
                               class="layui-input form-input" data-th-value='${entity01?.tmplName}'>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="压力测试模板编号">压力测试模板编号</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="tmplId" name="tmplId" disabled
                               class="layui-input form-input" data-th-value='${entity01?.tmplId}'>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="适用风险分类">适用风险分类</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="riskType" name="riskType" disabled
                               class="layui-input form-input" data-th-value='${entity01?.riskType}'>
                        </div>
                    </div>
                </div> 
                <hr style="height:2px;border:none;border-top:2px #185598;" />
                <div class="layui-form-item">
                	<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="压力测试编号或名称">压力测试编号或名称</label>
                        <div class="layui-input-inline input-inline">
                            <select   type="text" id="testId" name="testId"
									class="layui-input form-input input-select"  multiple="true"
									allowClear="true" placeholder="请输入压力测试编号或名称"
									data-th-data-url="@{/invest/risk/stresstestmanage/flowriskstresstestview/FlowRiskStressTestView001/selectTestListMap}">
							</select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="压力测试执行状态">压力测试执行状态</label>
                        <div class="layui-input-inline input-inline">
							<select type="text" id="STRESS_TEST_EXE_STATUS" name="exeStatus" class="layui-input form-input input-select"
								        placeholder="请选择压力测试执行状态"
								        allowClear="true" data-th-data-result='${STRESS_TEST_EXE_STATUS}'>
						    </select>
                        </div>
                    </div>
                    <!-- <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="适用产品">适用产品</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="tmplName" name="tmplName" placeholder="请选择适用产品"
                               class="layui-input form-input input-select" data-th-value='${entity1?.tmplName}'>
                        </div>
                    </div> -->
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable" data-th-text="适用产品">适用产品</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="openMode" name="openMode"
                                        class="layui-input form-input input-select" 
                                        allowClear="true" placeholder="请选择适用产品" 
                                        data-th-data-result='${OPENMODE}'>
                                </select>
                            </div>
                     </div>
                </div>
                <div class="layui-form-item">
                	<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="压力测试执行时间">压力测试执行时间</label>
                        <div class="layui-input-inline input-inline">
                            <input    type="text" id="testDate" name="testDate"
                               class="layui-input form-input input-dateRangeSelect" placeholder="请选择压力测试执行时间范围"
                               th:value='${#dates.format(entity?.testDate,"yyyy-MM-dd")}'>
                        </div>
                    </div>
                	<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="分析基准日期">分析基准日期</label>
                        <div class="layui-input-inline input-inline">
                            <input    type="text" id="baseDate" name="baseDate"
                               class="layui-input form-input input-dateRangeSelect" placeholder="请选择分析基准日期"
                               th:value='${#dates.format(entity?.baseDate,"yyyy-MM-dd")}'>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="分析结束日期">分析结束日期</label>
                        <div class="layui-input-inline input-inline">
                            <input    type="text" id="analysisMDate" name="analysisMDate"
                               class="layui-input form-input input-dateRangeSelect" placeholder="请选择分析结束日期"
                               th:value='${#dates.format(entity?.analysisDate,"yyyy-MM-dd")}'>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{FlowRiskSceneManage001.sceneFuzzy}">情景名称|编号</label>
                            <div class="layui-input-inline input-inline">
    							 <select type="text" id="sceneIds" name="sceneIds" class="layui-input form-input input-select" 
								  		data-th-data-url="@{/invest/risk/stresstestmanage/flowriskstresstestview/FlowRiskStressTestView001/fuzzySelectScene}"
								  		formatoption = false placeholder="请输入内容" multiple="true" data-th-placeholder="#{SysCommon.placeholder}" >
								</select>
                            </div>
                    </div>
                 </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>

	 	var entity=/*[[${entity01}]]*/'';

    <script data-th-src="@{/js/invest/risk/stresstestmanage/flowriskstresstestview/FlowRiskStressTestView001.js}" type="text/javascript"></script>
</div>
</body>
</html>
