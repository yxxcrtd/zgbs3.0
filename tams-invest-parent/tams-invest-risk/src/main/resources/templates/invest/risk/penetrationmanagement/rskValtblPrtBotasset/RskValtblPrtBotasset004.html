<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{RskValtblPrtBotasset004}">估值表底层资产批量映射</title>
    <style>
        .rsk-btn-wrap{
            padding: 10px 0 8px 0;
            text-align: right;
        }
        .rsk-table-wrap{
            overflow: hidden;
        }
        .rsk-table-left{
            width: 50%;
            float: left;
            margin: 4px 0;
        }
        .left-source,.left-target{
            width: 50%;
            float: left;
        }
        .left-title{
            background: #f5f5f5;
            padding: 5px 0 6px 10px;
            font-size: 12px;
        }
        .rsk-table-right{
            float: left;
            width: 50%;
        }
        .left-input{
            overflow:auto;
            height: 260px;
        }
        .asset-upload  .layui-upload-drag{
            width: 98%;
            padding: 10px 0;
        }
    </style>
    <script data-th-inline="javascript" type="text/javascript">
    var gettreeSourceUrl = /*[[@{invest/risk/penetrationmanagement/rskValtblPrtBotasset/RskValtblPrtBotasset004/getAllTreeSubjectNode}]]*/'';
	</script>
</head>
<body>
<div layout:fragment="content">
    <div class="joyin-form-wrap" id="RskValtblPrtBotasset004_DIV">
        <form class="layui-form"  id="searchForm" style="padding-bottom: 8px;">
            <input id="ptlId" name="ptlId" data-th-value="${ptlId}" hidden>
            <input id="ptlName" name="ptlName" data-th-value="${ptlName}" hidden>
            <input id="subClass" name="subClass" data-th-value="${subClass}" hidden>
        </form>
    </div>
    <div class="rsk-btn-wrap">
        <a id="RskValtblPrtBotasset004_btn_add" class="layui-btn layui-btn-sm"><i class="iconfont icon-plus"></i><span>映射&应用</span></a>
        <!--<a id="RskValtblPrtBotasset004_btn_delete" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-delete"></i><span>删除</span></a>-->
    </div>
    <div class="rsk-table-wrap">
        <div class="rsk-table-left">
            <div class="left-source">
                <h2 class="left-title" style="border-right: 1px solid #ddd;">资管计划：【<span class="port-text" data-th-text="${ptlName}">N/A</span>】资产科目</h2>
                <div class="layui-input left-input ztree" id='treeSource'>
                </div>
            </div>
            <div class="left-target">
                <h2 class="left-title" style="border-right: 1px solid #ddd;" >系统内资产</h2>
                <div style="padding:20px 1px; height:200px;">
                    <label class="layui-form-label form-label">选择资产</label>
                    <div class="layui-input-inline input-inline">
                        <select id="finprodId" name="finprodId" required="required"
                                class="layui-input form-input input-select"
                                data-th-placeholder="#{SysCommon.placeholder}" formatOption = true
                                data-th-data-url="@{/invest/risk/penetrationmanagement/rskValtblPrtBotasset/RskValtblPrtBotasset004/selectAllAsset}"
                                data-th-initValue='${finprodId}' data-th-parentIds="subClass">
                        </select>
                    </div>
                </div>
            </div>
        </div>
        <div class="rsk-table-right">
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/risk/common/AssetCodeTree.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/invest/risk/penetrationmanagement/rskValtblPrtBotasset/RskValtblPrtBotasset004.js}" type="text/javascript"></script>
</div>
</body>
</html>
