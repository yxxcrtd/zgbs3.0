<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
	<meta charset="UTF-8">
	<title>客户关系树-机构负面信息</title>
		<style type="text/css">
       		#title{
       			text-align: center;
       			font-size: 32px;
       			font-weight: bold;
       			margin-top: 10px;
       			margin-bottom: 20px;
       		}
       		#pubDate{
       			padding-top: 3px;
       			font-size: 15px;
       			color: #BFBFBF;
       		}
       		#source{
       			color: #BFBFBF;
       			font-size: 15px;
       			text-align: right;
       		}
       		#cominfo{
       			margin-top: 10px;
       			font-size: 18px;
       			text-indent: 36px;
       			text-align: justify;
       		}
       		#linkId1{
       			color: #BFBFBF;
       			font-size: 15px;
       			margin-top: 10px;
       		}
       		#linkId2{
       			margin-top: 5px;
       			font-size: 16px;
       			margin-bottom: 40px;
       		}
		</style>
	</head>
	
	<body>
		<div layout:fragment="content">
			<div class="layui-row">
				<div id="title" class="layui-col-md10 layui-col-md-offset1">
					<span data-th-text="${agencyNegativeInf001Dto.title}">标题</span>
				</div>
				<div class="layui-col-md10 layui-col-md-offset1">
					<div class="layui-row">
						<div id="pubDate" class="layui-col-md6"><span data-th-text="${agencyNegativeInf001Dto.pubDate}">2019-12-17</span></div>
						<div id="source" class="layui-col-md6"><span data-th-text="${agencyNegativeInf001Dto.source}">人民日报</span></div>
					</div>
				</div>
				<div id="cominfo" class="layui-col-md10 layui-col-md-offset1">
					<span data-th-text="${agencyNegativeInf001Dto.cominfo}">正文</span>
				</div>
				<div id="linkId1" class="layui-col-md10 layui-col-md-offset1">
					<span>原文链接：</span>
				</div>
				<div id="linkId2" class="layui-col-md10 layui-col-md-offset1">
					<a data-th-href="${agencyNegativeInf001Dto.linkId}" rel="noreferrer" target="blank" id="a_linkId" data-th-text="${agencyNegativeInf001Dto.linkId}">https://www.null.com</a>
				</div>
				
			</div>
		</div>
		<!--<div layout:fragment="script">
			<script data-th-src="@{/js/invest/risk/customerrelationtree/agencynegativeinf/AgencyNegativeInf002.js}" type="text/javascript"></script>
		</div>-->
	</body>
</html>
