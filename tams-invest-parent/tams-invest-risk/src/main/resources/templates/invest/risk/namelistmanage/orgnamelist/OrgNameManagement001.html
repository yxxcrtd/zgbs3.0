<!DOCTYPE html>
<html
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{OrgNameManagement001}">资产名单管理</title>
    <style>
        .table-wrap .layui-table-view .layui-table-header table thead tr{
            background-color: #d9ecff!important;
        }
        table tr th div.laytable-cell-group{
            text-align: center;
            font-weight: bold;
        }

        .layui-table-view .layui-table th{
            padding:1px 0;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <!--<div class="form-button-area">
        <a id="OrgNameManagement001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
        <a id="OrgNameManagement001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}" style="display: none">删除</a>
    </div>-->
    <div class="joyin-form-wrap  condition-area curr-form">
        <form class="layui-form" id="searchForm" >
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{OrgNameManagement001.listName}">机构名单名称</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="listId" name="listId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/risk/namelistmanage/assetnamelist/AssetNameManagement001/selectListId(listDetailType=${RSK_SUBJECT_TYPE_01})}"
                                data-th-value="${entity?.listName}"
                                multiple="true" >
                        </select>
                        <!--<input type="text" id="listName"  name="listName" class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}" >-->
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="layui-tab layui-tab-brief" >
        <ul class="layui-tab-title">
            <li class="layui-this">生效名单</li>
            <li>失效名单</li>
        </ul>
        <div class="layui-tab-content" style="height: 100px;">
            <div class="layui-tab-item layui-show">
                <div class='layui-fluid'>
                    <div class="table-wrap">
                        <table class="layui-table" id="effectTable"></table>
                    </div>
                </div>
            </div>
            <div class="layui-tab-item">
                <div class='layui-fluid'>
                    <div class="table-wrap">
                        <table class="layui-table" id="uneffectTable"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var RSK_INPUT_TYPE_MANUAL = /*[[${RSK_INPUT_TYPE_MANUAL}]]*/'MANUAL';
        var RSK_INPUT_TYPE_BATCH = /*[[${RSK_INPUT_TYPE_BATCH}]]*/'BATCH';
        var RSK_SUBJECT_TYPE_01 = /*[[${RSK_SUBJECT_TYPE_01}]]*/'01';
    </script>
    <script data-th-src="@{/js/invest/risk/namelistmanage/orgnamelist/OrgNameManagement001.js}"></script>
</div>
</body>
</html>
