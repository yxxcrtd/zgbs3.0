<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{CreditRightsManagement002}">风险权数管理</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="pro-module-container">
            <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
                <div class="pro-module-wrapper pro-module-base">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{CreditRightsManagement001.assetTypeOne}">资产一级分类</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="assetTypeOne" name="assetTypeOne"
                                                    class="layui-input form-input input-select" allowClear="true"
                                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue="${entity?.assetTypeOne}"
                                                    data-th-data-result='${PINAN_ASSET_TYPE}'
                                                    childrenIds="assetTypeTwo" required>
                                            </select>
                                        </div>
                                    </div>
                                    <!-- modify by  gaopeng 20191014 增加风险权数与生效日必填 start -->
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{CreditRightsManagement001.riskWeight}">风险权数</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" maxlength="66" id="riskWeight" name="riskWeight"
                                                class="layui-input form-input text-number" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.riskWeight}" required>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{CreditRightsManagement001.effDate}">生效日</label>
                                        <div class="layui-input-inline input-inline">
                                            <div class="layui-input-inline input-inline">
				                            <input id='effDate' name='effDate'
				                                class="layui-input form-input input-dateSelect" placeholder="请选择时间"
				                                data-th-placeholder="#{SysCommon.placeholder}"
				                                data-th-value="${#dates.format(entity?.effDate,'yyyy-MM-dd')}" required>
				                        	</div>
                                        </div>
                                    </div>
                                    <!-- modify by  gaopeng 20191014 增加风险权数与生效日必填 end -->
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{CreditRightsManagement001.assetTypeTwo}">资产二级分类</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="assetTypeTwo" name="assetTypeTwo"
                                                    class="layui-input form-input input-select" allowClear="true"
                                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue="${entity?.assetTypeTwo}"
                                                    data-th-data-result='${ASSET_SEC_TYPE}'
                                                    parentIds="assetTypeOne"
                                                    formatoption=true required>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style="display: none">
                                        <input id='seqno' name='seqno'
                                               class="layui-input form-input" placeholder="请选择时间"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.seqno}" />
                                    </div>
                                    <div class="form-inline-wrap" style="display: none">
                                        <input id='effDateOld' name='effDateOld'
                                               class="layui-input form-input input-dateSelect" placeholder="请选择时间"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${#dates.format(entity?.effDateOld,'yyyy-MM-dd')}" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                <!-- 备注 -->
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">备注</span>
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                        <textarea id="remark" name="remark" placeholder="请输入内容"
                                                  maxlength="300"
                                                  data-th-placeholder="#{SysCommon.placeholder}" class="layui-textarea"
                                                  data-th-text="${entity?.remark}"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                <!--  按钮 -->
                    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 30px;">
                        <div class="text-center">
                            <a id="CreditRightsManagement002_btn_save" class="layui-btn layui-btn-sm btn-save"
                               data-th-text="#{SysCommon.save}">保存</a>
                            <a id="CreditRightsManagement002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                               data-th-text="#{SysCommon.submit}">提交</a>
                            <a id="CreditRightsManagement002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                               data-th-text="#{SysCommon.cancel}">取消</a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/risk/creditmanagement/creditrightsmanagement/CreditRightsManagement002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
