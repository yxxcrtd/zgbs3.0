<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ObjectLimitOccupation002}">单笔资产额度校验规则新建</title>
    <style>
        .mst-lable{
            width: 20%;
        }
    </style>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap" id="submitForm">
			<div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{ObjectLimitOccupation001.customerId}">主体名称</label>
                    <div class="layui-input-inline input-inline">
                        <select id="customerId" name="customerId" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                allowClear="true" formatoption="true"
                                data-th-initValue="${entity?.customerId}"
                                data-th-data-url="@{/invest/risk/creditrisklimitmanagement/objectlimitoccupation/ObjectLimitOccupation001/getObject}"></select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
					<label  class="layui-form-label form-lable"
						data-th-text="#{ObjectLimitOccupation001.creditType}">额度名称</label>
					<div class="layui-input-inline input-inline">
						<select type="text" id="creditType"
							name="creditType"
							class="layui-input form-input input-select"  
                             data-th-data-result="${LIMIT_TYPE}"
							allowClear="true"  placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-initValue="${entity?.creditType}">
						</select>
					</div>
                </div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-lable"
							th:text="#{ObjectLimitOccupation001.termUnitName}">最长可投期限</label>
					<div class="layui-input-inline input-inline" style="width: 160px !important;">
						<input th:id="term"
							th:name="term"
							style="width: 70%; float: left; border-right: none;"
							class="layui-input form-input text-number" data-textrange="0"
							placeholder="请输入内容" th:value="${entity?.term}"
							data-th-placeholder="#{SysCommon.placeholder}">
						<div style="width: 30%; float: left;">
							<select th:id="termUnit"
								th:name="termUnit"
								class="layui-input form-input input-select" searchable="false"
								formatoption="false" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result="${TERM_UNIT}" allowClear="false"
								th:initValue="${entity?.termUnit}">
							</select>
						</div>
					</div>
				</div>
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
					<label  class="layui-form-label form-lable"
						data-th-text="#{ObjectLimitOccupation001.ajustType}">调整类型</label>
					<div class="layui-input-inline input-inline">
						<select type="text" id="ajustType"  
							name="ajustType" required="required"
							class="layui-input form-input input-select"  
                             data-th-data-result="${AJUST_TYPE}"
							allowClear="true"  placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-initValue="${entity?.ajustType}">
						</select>
					</div>
                </div>
			</div>
			<div class="layui-form-item">
				<div  class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                    <label  class="layui-form-label form-lable"
						data-th-text="#{ObjectLimitOccupation001.totleamount}">调整金额</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="amount" name="amount" class="layui-input form-input text-number"
                                th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.amount}">
                    </div>
				</div>
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{ObjectLimitOccupation001.cdate}">调整日期</label>
                    <div class="layui-input-inline input-inline">
                        <input  type="text" id="cdate" name="cdate" required="required"
                        		class="layui-input form-input input-dateSelect"
                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                th:value="${#dates.format(entity?.cdate,'yyyy-MM-dd')}">
                    </div>
                </div>
			</div>
			<div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{ObjectLimitOccupation001.rdate}">释放日期</label>
                    <div class="layui-input-inline input-inline">
                        <input  type="text" id="rdate" name="rdate" required="required"
                        		 class="layui-input form-input input-dateSelect"
                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                th:value="${#dates.format(entity?.rdate,'yyyy-MM-dd')}">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
					<label class="layui-form-label form-lable"
						data-th-text="#{ObjectLimitOccupation001.createUser}">操作人员</label>
					<div class="layui-input-inline input-inline">
						<select type="text" name="createUser"
							id="createUser"
							class="layui-input form-input input-select" maxlength=60
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-initValue='${entity?.createUser}'
							data-th-data-url="@{/invest/risk/creditrisklimitmanagement/objectlimitoccupation/ObjectLimitOccupation001/getUserName}">
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
                <div>
                    <label  class="layui-form-label form-lable"
                        data-th-text="#{ObjectLimitOccupation001.remark}" style='width: 11.9%;'>备注</label>
                    <div class="layui-input-inline input-inline"  style="width: 53.5%!important;">
                        <textarea id="remark" name="remark" th:value="${entity?.remark}"
                            data-th-text="${entity?.remark}" class="layui-textarea"
                            placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"></textarea>
                    </div>
                </div>
			</div>
			<div>
			<input type="hidden" id="seqno" name="seqno" th:value="${entity?.seqno}">
			<input type="hidden" id="creditMstId" name="creditMstId" th:value="${entity?.creditMstId}">
			<input type="hidden" id="ccy" name="ccy" th:value="${entity?.ccy}">
			</div>
		</form>
	
		<div  style="margin:30px 0;">
			<div class="text-center">
				<a id="ObjectLimitOccupation002_btn_save"
					class="layui-btn layui-btn-sm btn-save"
					data-th-text="#{SysCommon.save}">保存</a>
					<a id="ObjectLimitOccupation002_btn_submit"
					class="layui-btn layui-btn-sm btn-submit"
					data-th-text="#{SysCommon.submit}">提交</a> 
					<a id="ObjectLimitOccupation002_btn_cancel"
					class="layui-btn layui-btn-sm btn-cancel"
					data-th-text="#{SysCommon.cancel}">取消</a>
			</div>
		</div>
	 </div>
	<div layout:fragment="script">
	    <script data-th-inline="javascript" type="text/javascript">
			var YES = /*[[${YES}]]*/'01'; // 数据字典.是否_是
			var NO = /*[[${NO}]]*/'02'; // 数据字典.是否_否
		</script>
		<script data-th-src="@{/js/invest/risk/creditrisklimitmanagement/objectlimitoccupation/ObjectLimitOccupation002.js}"></script>
    </div>
</body>
</html>
