<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{SingleLimitOccupation002}">单笔资产额度校验规则新建</title>
    <style>
        .mst-lable{
            width: 20%;
        }
    </style>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap" id="submitForm">
			<div class="layui-form-item">
	            <div>
	                <label  class="layui-form-label form-lable mst-lable"
	                       th:text="#{SingleLimitOccupation001.finprodId}">资产代码</label>
	                <div class="layui-input-inline input-inline">
	                    <select type="text" id="finprodId" name="finprodId"   required="required"
	                            class="layui-input form-input input-select" placeholder="请输入内容"
	                            th:placeholder="#{SysCommon.placeholder}" th:data-url="@{/invest/risk/creditrisklimitmanagement/singlelimitoccupation/SingleLimitOccupation001/getFinprodMarketIds}"
	                            allowClear="true" th:initValue="${entity?.finprodId}"></select>
	                </div>
	            </div>
			</div>
			<div class="layui-form-item">
				<div>
					<label  class="layui-form-label form-lable mst-lable"
						data-th-text="#{SingleLimitOccupation001.assestType}">业务分类</label>
					<div class="layui-input-inline input-inline">
						<select name="assestType" id="assestType"
							class="layui-input form-input input-select" formatoption=true 
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-data-result="${PINAN_ASSET_TYPE}">
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div>
					<label  class="layui-form-label form-lable mst-lable"
						data-th-text="#{SingleLimitOccupation002.deductObjType}">扣减对象</label>
					<div class="layui-input-inline input-inline">
						<select type="text" id="deductObjType"
							name="deductObjType"
							class="layui-input form-input input-select"  
                             data-th-data-result="${DEDUCTION_OBJECT}"
							allowClear="true"  placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-initValue="${entity?.deductObjType}">
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
<!--                 <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{SingleLimitOccupation001.creditTag}">额度标签</label>
                    <div class="layui-input-inline input-inline">
                        <select id="creditTag" name="creditTag" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                allowClear="true" formatoption="true"
                                data-th-initValue="${entity?.creditTag}"
                                data-th-data-url="@{/invest/risk/creditrisklimitmanagement/singlelimitoccupation/SingleLimitOccupation001/getLimitLabel}"></select>
                    </div>
                </div> -->
				<div>
					<label  class="layui-form-label form-lable mst-lable"
						data-th-text="|#{SingleLimitOccupation001.creditTag}|">额度标签</label>
					<div class="layui-input-inline input-inline">
					 <select  id="creditTag" name="creditTag"  required="required"
                           class="layui-input form-input input-select"
                           th:placeholder="#{SysCommon.placeholder}"
                           th:data-url="@{/invest/risk/creditrisklimitmanagement/singlelimitoccupation/SingleLimitOccupation001/getLimitLabel}" allowClear="true"
                           formatoption="false" data-th-initValue="${entity?.creditTag}"></select>	
					</div>
				</div>
			</div>
	     	<div class="layui-form-item">
                <div>
                    <label  class="layui-form-label form-lable mst-lable"
                        data-th-text="#{SingleLimitOccupation001.remark}">备注</label>
                    <div class="layui-input-inline input-inline">
                        <textarea id="remark" name="remark" th:value="${entity?.remark}"
                            data-th-text="${entity?.remark}" class="layui-textarea"
                            placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"></textarea>
                    </div>
                </div>
	         </div>
            <div class="form-inline-wrap" style="display: none">
                          <input id='creditRuleId' name='creditRuleId'
                                 class="layui-input form-input" 
                                 data-th-placeholder="#{SysCommon.placeholder}"
                                 data-th-value="${entity?.creditRuleId}" />
           </div>
		</form>
	
		<div  style="margin:30px 0;">
			<div class="text-center">
				<a id="SingleLimitOccupation002_btn_save"
					class="layui-btn layui-btn-sm btn-save"
					data-th-text="#{SysCommon.save}">保存</a>
					<a id="SingleLimitOccupation002_btn_submit"
					class="layui-btn layui-btn-sm btn-submit"
					data-th-text="#{SysCommon.submit}">提交</a> 
					<a id="SingleLimitOccupation002_btn_cancel"
					class="layui-btn layui-btn-sm btn-cancel"
					data-th-text="#{SysCommon.cancel}">取消</a>
			</div>
		</div>
	 </div>
	<div layout:fragment="script">
	    <script data-th-inline="javascript" type="text/javascript">

		</script>
		<script data-th-src="@{/js/invest/risk/creditrisklimitmanagement/singlelimitoccupation/SingleLimitOccupation002.js}"></script>
    </div>
</body>
</html>
