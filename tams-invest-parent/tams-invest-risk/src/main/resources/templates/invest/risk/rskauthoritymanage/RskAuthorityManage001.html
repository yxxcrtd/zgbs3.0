<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{RskAuthorityManage001}">风险授权管理</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area">
            <a id="RskAuthorityManage001_btn_add"
               class="layui-btn layui-btn-sm btn-create"
               data-th-text="#{SysCommon.create}">新建</a>
               <a id="RskAuthorityManage001_btn_delete"
               class="layui-btn layui-btn-sm btn-delete"
               data-th-text="#{SysCommon.delete}">删除</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{RskAuthorityManage001.rolePos}">角色岗位</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="rolePos" name="rolePos"  class="layui-input form-input input-select" 
									 allowClear="true" placeholder="请输入内容"
									 data-th-data-result='${ROLE_POST}'
									data-th-placeholder="#{SysCommon.placeholder}">
							</select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{RskAuthorityManage001.userName}">用户</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="userName" name="userName"
									class="layui-input form-input input-select"  multiple="true"
									allowClear="true" placeholder="请输入内容" parentIds="rolePos"
									data-th-data-url="@{/invest/risk/rskauthoritymanage/RskAuthorityManage001/getUser}"
									data-th-placeholder="#{SysCommon.placeholder}" 
									>
							</select>
                        </div>
                    </div>
                    <!-- 资产类型改为授权类型 add by renping 2019-08-06  start -->
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{RskAuthorityManage001.assetType}">授权类型一级</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="assetType" name="assetType"
									class="layui-input form-input input-select" 
									data-th-data-result='${RSK_AUTHORIZE_TYPE1}' childrenIds="assetSecType"
									allowClear="true" placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}" >
							</select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                	<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{RskAuthorityManage001.assetSecType}">授权类型二级</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="assetSecType" name="assetSecType"  class="layui-input form-input input-select" 
									 allowClear="true" placeholder="请输入内容" parentIds="assetType"
									 data-th-data-result='${RSK_AUTHORIZE_TYPE2}' multiple="true"
									data-th-placeholder="#{SysCommon.placeholder}">
							</select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{RskAuthorityManage001.tradeMarket}">交易场所</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="tradeMarket" name="tradeMarket"
									class="layui-input form-input input-select" 
									allowClear="true" placeholder="请输入内容" multiple="true"
									data-th-data-result='${TRADE_PLACE}' data-th-placeholder="#{SysCommon.placeholder}" >
							</select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{RskAuthorityManage001.tradeDirection}">交易方向</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="tradeDirection" name="tradeDirection"
									class="layui-input form-input input-select" 
									allowClear="true" placeholder="请输入内容" multiple="true"
									data-th-data-result='${PS}'
									data-th-placeholder="#{SysCommon.placeholder}" >
							</select>
                        </div>
                    </div>
                    <!-- 资产类型改为授权类型 add by renping 2019-08-06 end -->
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/risk/rskauthoritymanage/RskAuthorityManage001.js}" type="text/javascript"></script>
</div>
</body>
</html>
