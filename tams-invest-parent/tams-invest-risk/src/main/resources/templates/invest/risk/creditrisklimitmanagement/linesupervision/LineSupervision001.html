<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{LineSupervision001}">额度监测</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area">

        </div>
        <div class='joyin-form-wrap joyin-filter-form condition-area'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{LineSupervision001.supStatus}">监控状态</label>
                        <div class="layui-input-inline input-inline">
                            <select  id="supStatus" name="supStatus" multiple
                                     class="layui-input form-input input-select" formatoption=true
                                     data-th-placeholder="#{SysCommon.placeholder}"
                                     data-th-data-result="${MONITOR_STATUS}">
                            </select>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-lable"
                               data-th-text="|#{LineSupervision001.subjectName}|">主体名称</label>
                        <div class="layui-input-inline input-inline">
                            <select  id="subjectName" name="subjectName" multiple
                                     class="layui-input form-input input-select"
                                     th:placeholder="#{SysCommon.placeholder}"
                                     th:data-url="@{/invest/risk/creditrisklimitmanagement/linesupervision/LineSupervision001/getCustomerName}"
                                     allowClear="true"
                                     formatoption="false" ></select>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{LineSupervision001.creditName}">额度名称</label>
                        <div class="layui-input-inline input-inline">
                            <select name="creditName" id="creditName" multiple
                                    class="layui-input form-input input-select" formatoption=true
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result="${LIMIT_TYPE}">
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap" id="selector3">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{LineSupervision001.orgType}">机构类型</label>
                        <div class="layui-input-inline input-inline">
                            <select id="orgType" name="orgType" multiple
                                    class="layui-input form-input input-select"
                                    allowClear="true" placeholder="请选择"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result="${ORG_CLASS}"
                                    formatoption=true></select>
                        </div>
                    </div>
                </div>

            </form>
        </div>

        <div id="singleTableDiv">
            <table class="layui-table" id="dataTable2"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">

    </script>
    <script data-th-src="@{/js/invest/risk/creditrisklimitmanagement/linesupervision/LineSupervision001.js}"></script>
</div>
</body>
</html>
