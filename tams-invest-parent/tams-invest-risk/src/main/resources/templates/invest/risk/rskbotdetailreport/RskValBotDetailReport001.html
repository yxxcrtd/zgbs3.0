<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <title>穿透后底层明细表</title>
</head>

<body>
<div layout:fragment="content">
    <div class="form-button-area" export="false">
        <a id="RskValBotDetailReport001_btn_export" class="layui-btn layui-btn-sm btn-export btn-default">导出</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form">
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">估值日期</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id='valDate' name='valDate'
                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                           data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-value='${platDate}' required="required">
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable" style="color: red;width:60%;" >*只可导出估值日期为月末的底层明细数据</label>
            </div>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var  platDate = /*[[${platDate}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/risk/rskbotdetailreport/RskValBotDetailReport001.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/report/report-common.js}" type="text/javascript"></script>
</div>
</body>
</html>
