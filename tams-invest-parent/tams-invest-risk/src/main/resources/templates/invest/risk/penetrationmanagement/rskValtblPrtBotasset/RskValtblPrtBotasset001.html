<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{RskValtblPrtBotasset001}">估值表底层资产映射</title>
    <style>
        .table-wrap .layui-table-view .layui-table-header table thead tr{
            background-color: #d9ecff!important;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <!-- <a class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-automatch"></i>手工匹配</a>
        <a class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-circle-correct_fill"></i>确认匹配</a>
        <a class="layui-btn layui-btn-sm btn-default edit">编辑</a> -->
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
        <form class="layui-form"  id="submitForm" >
            <input id="ptlName" hidden>
            <div class="layui-form-item">
<!--                 <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4"> -->
<!--                     <label class="layui-form-label form-lable">映射状态</label> -->
<!--                     <div class="layui-input-inline input-inline"> -->
<!--                         <input type="text" id="mappingStat" name="mappingStat"  required="required" -->
<!--                           data-th-initValue="${mappingStatInit}"     class="layui-input form-input input-checkbox" data-th-data-result="${MAPPER_TYPE}"/> -->
<!--                     </div> -->
<!--                 </div> -->
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable">映射状态</label>
                    <div class="layui-input-inline input-inline">
                         <select type="text" id="mappingStat" name="mappingStat"
                             class="layui-input form-input input-select" allowClear="true" data-th-placeholder="#{SysCommon.placeholder}" multiple=”true” data-th-data-result="${MAPPER_TYPE}" showAll='true'
                             required="required" data-th-initValue="${mappingStatInit}">
                         </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable">组合名称</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" name="ptlId" id="ptlId"
                                class="layui-input form-input input-select" allowClear="true"
                                placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                formatoption=true required="required"
                                data-th-data-url="@{/invest/risk/penetrationmanagement/rskvalrelateimport/RskValRelateImport001/queryGroupIdInfo}">
                            </select>
                    </div>
                </div>
                <a class="layui-btn layui-btn-sm btn-search" id="batchMatchAndAppication" style="float: right"><i class="iconfont icon-automatch"></i>映射&应用</a>
            </div>
        </form>
    </div>
    <div class="table-wrap">
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/risk/penetrationmanagement/rskValtblPrtBotasset/RskValtblPrtBotasset001.js}" type="text/javascript"></script>
</div>
</body>
</html>
