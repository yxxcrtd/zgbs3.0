<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{RskValAssetCode003}">估值表资产科目映射明细</title>
    <style>
        .rsk-btn-wrap{
            padding: 10px 0 8px 0;
            text-align: right;
        }
        .rsk-table-wrap{
            overflow: hidden;
        }
        .rsk-table-left{
            width: 40%;
            float: left;
            margin: 4px 0;
        }
        .left-source,.left-target{
            width: 50%;
            float: left;
        }
        .left-title{
            background: #f5f5f5;
            padding: 11px 0 12px 10px;
            font-size: 12px;
        }
        .rsk-table-right{
            float: left;
            width: 100%;
        }
        .left-input{
            overflow:auto;
            height: 188px;
        }
        .asset-upload  .layui-upload-drag{
            width: 98%;
            padding: 10px 0;
        }
    </style>
    <script data-th-inline="javascript" type="text/javascript">
    var gettreeSourceUrl = /*[[@{invest/risk/penetrationmanagement/rskvalassetcode/RskValAssetCode003/getAllTreeSourceNode}]]*/'';
    var gettreeTargetUrl = /*[[@{invest/risk/penetrationmanagement/rskvalassetcode/RskValAssetCode003/getAllTreeTargetNode}]]*/'';
	</script>
</head>
<body>
<div layout:fragment="content">
    <div class="joyin-form-wrap" id="RskValAssetCode003_DIV">
        <form class="layui-form"  id="searchForm" style="padding-bottom: 8px;">
            <input id="id" name="id" data-th-value="${id}" hidden>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{RskValAssetCode003.name}">映射名称</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" data-th-value="${name}" class="layui-input form-input" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" disabled="disabled" required>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{RskValAssetCode003.assetCodeType}">科目代码级别类型</label>
                    <div class="layui-input-inline input-inline">
                        <select id="assetCodeType" class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required data-th-data-result="${SUBJECT_RANK_TYPE}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{RskValAssetCode003.startRow}">起始行</label>
                    <div class="layui-input-inline input-inline">
                        <input id="startRow" type="text" class="layui-input form-input text-number" placeholder="请输入内容" data-textrange="0"  data-th-placeholder="#{SysCommon.placeholder}" required>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{RskValAssetCode003.assetCodeColIndex}">科目代码列</label>
                    <div class="layui-input-inline input-inline">
                        <input  id="assetCodeColIndexLetter" type="text" class="layui-input form-input" oninput="value=value.replace(/[^A-Z]/g,'')" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{RskValAssetCode003.filter}">过滤器</label>
                    <div class="layui-input-inline input-inline">
                        <select  id="filterId" data-th-data-result="${VALUATION_FILTER}" formatoption="false" class="layui-input form-input input-select"></select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs8 layui-col-sm8 layui-col-md8 layui-col-lg8">
                    <label class="layui-form-label form-lable" data-th-text="#{RskValAssetCode003.excelTemplate}" style="width: 18%;">Excel模板</label>
                    <div class="layui-input-inline input-inline asset-upload" style="width: 80%!important;">
                        <div class="upload" id="valtable" required
                        data-option="{allowFileType: 'xls|xlsx', callback: 'RskValAssetCode003.uploadCallback'}">
                        </div>
                    </div>
                    </div>
                </div>
                </div>
        </form>
    </div>
    <div class="rsk-btn-wrap">
        <a id="RskValAssetCode003_btn_preview" class="layui-btn layui-btn-sm"><i class="iconfont icon-browse_fill"></i><span>预览</span></a>
        <a id="RskValAssetCode003_btn_add" class="layui-btn layui-btn-sm"><i class="iconfont icon-plus"></i><span>添加</span></a>
        <a id="RskValAssetCode003_btn_delete" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-delete"></i><span>删除</span></a>
    </div>
    <div class="rsk-table-wrap">
        <div class="rsk-table-left" style="display: none;">
            <div class="left-source">
                <h2 class="left-title" style="border-right: 1px solid #ddd;">源科目</h2>
                <!-- <div class="layui-input left-input" id='treeSource'
                data-th-url='|@{/invest/risk/penetrationmanagement/rskvalassetcode/RskValAssetCode003/getAllTreeSourceNode}'>
                </div> -->
                <div class="layui-input left-input ztree" id='treeSource'>
                </div>
            </div>
            <div class="left-target">
                <h2 class="left-title">目标科目</h2>
                <div class="layui-input left-input ztree" id='treeTarget' style="border-left: none;border-right: none;">
                </div>
                <!-- <div class="layui-input left-input" id='treeTarget' style="border-left: none;border-right: none;"
                data-chkstyle = "radio"
                data-th-url='|@{/invest/risk/penetrationmanagement/rskvalassetcode/RskValAssetCode003/getAllTreeTargetNode}'>
                </div> -->
            </div>
        </div>
        <div class="rsk-table-right">
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
<script data-th-src="@{/js/invest/risk/common/AssetCodeTree.js}" type="text/javascript"></script>
<script data-th-src="@{/js/invest/risk/penetrationmanagement/rskvalassetcode/RskValAssetCode003.js}" type="text/javascript"></script>
</div>
</body>
</html>
