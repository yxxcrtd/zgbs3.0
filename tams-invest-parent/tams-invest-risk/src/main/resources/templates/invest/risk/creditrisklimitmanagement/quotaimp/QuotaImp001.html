<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{QuotaImp001}">额度导入</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area">
               <a id="QuotaImp001_btn_import"
               class="layui-btn layui-btn-sm btn-import"
               data-th-text="#{SysCommon.import}">导入</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                 <div class="layui-form-item">
                   <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{QuotaImp001.impType}">导入类型</label>
                        <div class="layui-input-inline input-inline">
                           <select type="text" id="impType" name="impType"  class="layui-input form-input input-select" 
									 allowClear="true" placeholder="请输入内容"
									 data-th-data-result='${RISK_IMP_TYPE}'
									data-th-placeholder="#{SysCommon.placeholder}">
							</select>
                        </div>
                    </div>
					<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{QuotaImp001.updateTime}">更新时间</label>
                        <div class="layui-input-inline input-inline">
								<input type="text" id="updateTime" name="updateTime"
									class="layui-input form-input input-dateRangeSelect"
									placeholder="请选择、支持区间"
									data-th-placeholder="#{SysCommon.dateInterval}" />
						</div>
                	</div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{QuotaImp001.customerName}">主体名称</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" name="customerName" data-th-placeholder="#{SysCommon.placeholder}" id="customerName"
							class="layui-input form-input input-text" />
                        </div>
                    </div>
                </div>
                 <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{QuotaImp001.pflsh}">批次号</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" name="pflsh" data-th-placeholder="#{SysCommon.placeholder}" id="pflsh"
							class="layui-input form-input input-text" />
                        </div>
                    </div>
                </div>                
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/risk/creditrisklimitmanagement/quotaimp/QuotaImp001.js}" type="text/javascript"></script>
</div>
</body>
</html>
