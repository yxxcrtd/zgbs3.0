<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ObjectLimitOccupation001}">主体额度调整查询</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">

				<a id="ObjectLimitOccupation001_btn_add"	
					class="layui-btn layui-btn-sm"><i class="iconfont icon-text1"></i><span data-th-text="#{ObjectLimitOccupation001.tiaozheng}">调整</span></a>
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
	                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
	                        <label class="layui-form-label form-lable" data-th-text="#{ObjectLimitOccupation001.object}">主体名称</label>
	                        <div class="layui-input-inline input-inline">
	                            <select id="object" name="object" class="layui-input form-input input-select"
	                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
	                                    allowClear="true" formatoption="true"
	                                    data-th-initValue="${entity?.object}"
	                                    data-th-data-url="@{/invest/risk/creditrisklimitmanagement/objectlimitoccupation/ObjectLimitOccupation001/getObject}"></select>
	                        </div>
	                    </div>
	                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label  class="layui-form-label form-lable"
								data-th-text="#{ObjectLimitOccupation001.creditName}">额度名称</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="creditName"
									name="creditName"
									class="layui-input form-input input-select"  
		                             data-th-data-result="${LIMIT_TYPE}"
									allowClear="true"  placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-initValue="${entity?.creditName}">
								</select>
							</div>
	                    </div>
					</div>
				</form>
			</div>

			<div id="singleTableDiv">
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
	    <script data-th-inline="javascript" type="text/javascript">
		  
		</script>
		<script data-th-src="@{/js/invest/risk/creditrisklimitmanagement/objectlimitoccupation/ObjectLimitOccupation001.js}"></script>
	</div>
</body>
</html>
