<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{LimitManage002}"></title>

</head>
<body>
	<div layout:fragment="content">

		<form class="layui-form joyin-form-wrap" id="submitForm">
			 <div class="form-inline-wrap">
                          <input type="hidden" id='index' name='index'
                                 class="layui-input form-input" 
                                 data-th-placeholder="#{SysCommon.placeholder}"
                                 data-th-value="${index}" />
              </div>
              
			<div class="layui-form-item">
				<div >
					<label class="layui-form-label form-lable mst-lable"
						data-th-text="#{LimitManage003.orgType}">机构大类</label>
					<div class="layui-input-inline input-inline">
						<select type="text" id="orgType"
							name="orgType" required="required"
							class="layui-input form-input  input-select" placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}" 
							data-th-initValue="${orgType}"
							data-th-data-result="${ORG_CLASS}"
							></select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div >
					<label class="layui-form-label form-lable mst-lable"
						data-th-text="#{LimitManage003.creditType}">额度名称</label>
					<div class="layui-input-inline input-inline">
						<select type="text" id="creditType"
							name="creditType" required="required"
							class="layui-input form-input  input-select" placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}" 
							data-th-initValue="${creditType}"
							data-th-data-result="${LIMIT_TYPE}"
							></select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div>
					<label class="layui-form-label form-lable mst-lable"
						data-th-text="#{LimitManage003.creditAmt}">额度</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="creditAmt" name="creditAmt"
								class="layui-input form-input   text-number" required="required"
								placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
								data-th-value="${creditAmt}">
					</div>
				</div>
			</div>
            <div class="form-inline-wrap" style="display: none">
                          <input id='creditTagId' name='creditTagId'
                                 class="layui-input form-input" 
                                 data-th-placeholder="#{SysCommon.placeholder}"
                                 data-th-value="${creditTagId}" />
                             <input id='seqno' name='seqno'
                                 class="layui-input form-input" 
                                 data-th-placeholder="#{SysCommon.placeholder}"
                                 data-th-value="${seqno}" />
           </div>
			
			<div class="layui-form-item">
				 <div>
					  <label class="layui-form-label form-lable mst-lable"
						  data-th-text="#{LimitManage003.term}">最长可投期限</label>
					  <div class="layui-input-inline input-inline">
					 
						<div class="layui-inline layui-col-md8 layui-col-sm8 layui-col-lg8">
											<input type="text" id="term" name="term"
											required class="layui-input form-input  text-number"
											placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
											 data-th-value="${term}" data-textrange="2">
							</div>
						   <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4" >
			
									<div class="layui-input-inline input-inline">
										<select type="text" id="termUnit" name="termUnit"
											required class="layui-input form-input input-select"
											placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
											data-th-data-result = '${TERM_UNIT}'  
											data-th-initValue="${termUnit}">
											</select>
									</div>
		
							</div>
						</div>	
					</div>

			</div>
			<div class="layui-form-item">
				<div>
					<label class="layui-form-label form-lable mst-lable"
						data-th-text="#{LimitManage003.riskRatio}">预警比例</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="riskRatio"
							name="riskRatio" 
							required class="layui-input form-input  text-number"  
							allowClear="true"  placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-value="${riskRatio}">
						</input>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div>
					<label class="layui-form-label form-lable mst-lable"
						data-th-text="#{LimitManage003.mdate}">失效日</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="mdate"
							name="mdate" 
							required class="layui-input form-input input-dateSelect"  
							allowClear="true"  placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-value="${mdate}"
							>
							
						</input>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div>
					<label class="layui-form-label form-lable mst-lable"
						data-th-text="#{LimitManage003.updateTime}">更新日期</label>
					<div class="layui-input-inline input-inline">
						<input type="text" name="upTime" id="upTime" required data-option="{type:'datetime'}"
						   class="layui-input form-input" 
						   placeholder="请输入内容"  data-th-value="${upTime}" data-th-placeholder="#{SysCommon.placeholder}">
					</div>
				</div>
			</div>			
		    <div class="layui-form-item">
                               <div>
                                   <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{LimitManage003.remark}" >备注</label>
                                   <div class="layui-input-inline input-inline">
                                       <textarea id="remark" name="remark" th:value="${remark}"
                                           data-th-text="${remark}" class="layui-textarea"
                                           placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"></textarea>
                                   </div>
                               </div>
            </div>
		</form>
	
		<div  style="margin:30px 0;">
			<div class="text-center">
 					 <a id="LimitManage003_btn_submit"
					class="layui-btn layui-btn-sm btn-submit"
					data-th-text="#{SysCommon.submit}">提交</a> 
					<a id="LimitManage003_btn_cancel"
					class="layui-btn layui-btn-sm btn-cancel"
					data-th-text="#{SysCommon.cancel}">取消</a>
			</div>
		</div>
	 </div>
	<div layout:fragment="script">
	    <script data-th-inline="javascript" type="text/javascript">
			var YES = /*[[${YES}]]*/'Y'; // 数据字典.是否_是
			var NO = /*[[${NO}]]*/'N'; // 数据字典.是否_否
			var isNbCredit=/*[[${isNbCredit}]]*/'';
		</script>
		<script data-th-src="@{/js/invest/risk/creditrisklimitmanagement/limitmanage/LimitManage003.js}"></script>
    </div>
</body>
</html>
