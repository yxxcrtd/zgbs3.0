<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RskAuthorityManage002}">授权管理（<span class="star-sign">*</span>必填）<i
								class="iconfont icon-arrow-down pro-down-icon"></i></title>
	<style>
        .mst-textarea{
            min-height: auto;
        }
        .cus-table-wrap .layui-border-box{
            height: 180px;
        }
        .cus-table-wrap .layui-border-box .layui-table-box{
            height: 140px;
        }
        .cus-table-wrap .layui-border-box .layui-table-box .layui-table-body{
            height: 101px;
        }
    </style>
</head>
<body>
	<div layout:fragment="content">
	<form class="layui-form joyin-form-wrap" id="submitForm">
		<div class="">
			<div class="pro-module-wrapper pro-module-base">
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title">
							<span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i
								class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div style="display: none">
									<input type="text" id="seqNo" name="seqNo" data-th-value="${entity?.seqNo}"/>
								</div>
								<div style="display: none">
									<input type="text" id="workflowId" name="workflowId" data-th-value="${entity?.workflowId}"/>
								</div>
								<div class="form-inline-wrap" style = "width:40%;">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{RskAuthorityManage001.rolePos}"></label>
									<div class="layui-input-inline input-inline">
                                           <select id="rolePos" name="rolePos" required="required"
											class="layui-input form-input input-select" placeholder="" maxlength="20"
											data-th-data-result='${ROLE_POST}' childrenIds="userName"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-initValue="${entity?.rolePos}">
											</select>
                                       </div>
								</div>
								<div class="form-inline-wrap" style = "width:40%;">
									<label class="layui-form-label form-label-wrap"
										data-th-text="#{RskAuthorityManage001.userName}"></label>
									<div class="layui-input-inline input-inline">
                                           <select type="text" id="userName"
											name="userName" required="required"
											class="layui-input form-input input-select" placeholder=""
											data-th-placeholder="#{SysCommon.placeholder}"
											parentIds="rolePos" multiple="true"
											data-th-data-url="@{/invest/risk/rskauthoritymanage/RskAuthorityManage001/getUser}"
											data-th-initValue="${entity?.userName}">
											</select>
                                       </div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="pro-module-wrap">
                        <div class="pro-module">
                            <div class="pro-module-item cus-table-wrap">
                                <table class="layui-table" id="dataTable"></table>
                            </div>
                        </div>
                </div>
			</div>
		</div>
		<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin-top: 40px;">
			<div class="text-center">
				<a id="RskAuthorityManage002_btn_save"
				   class="layui-btn layui-btn-sm btn-save"
				   data-th-text="#{SysCommon.save}">保存</a> <a
					id="RskAuthorityManage002_btn_submit"
					class="layui-btn layui-btn-sm btn-submit"
					data-th-text="#{SysCommon.submit}">提交</a> <a
					id="RskAuthorityManage002_btn_cancel"
					class="layui-btn layui-btn-sm btn-cancel"
					data-th-text="#{SysCommon.cancel}">取消</a>
			</div>
		</div>
		</form>
	</div>
	<div layout:fragment="script">
		<script th:inline="javascript" type="text/javascript">
		    var PINAN_ASSET_TYPE = /*[[${PINAN_ASSET_TYPE}]]*/'';
			var TRADE_PLACE = /*[[${TRADE_PLACE}]]*/'';
			var AUTHORIZE_TYPE = /*[[${AUTHORIZE_TYPE}]]*/'';
			var ASSET_SEC_TYPE = /*[[${ASSET_SEC_TYPE}]]*/'';
            // 资产类型改为授权类型 add by renping 2019-08-06  start
			var RSK_AUTHORIZE_TYPE1 = /*[[${RSK_AUTHORIZE_TYPE1}]]*/'';
			var RSK_AUTHORIZE_TYPE2 = /*[[${RSK_AUTHORIZE_TYPE2}]]*/'';
            // 资产类型改为授权类型 add by renping 2019-08-06  end
			var PS = /*[[${PS}]]*/'';
			var AUTHORIZE_TYPE_02 = /*[[${AUTHORIZE_TYPE_02}]]*/''; // 数据字典.授权类型_授权
        </script>  
		<script data-th-src="@{/js/invest/risk/rskauthoritymanage/RskAuthorityManage002.js}" type="text/javascript"></script>
		
	</div>
</body>
</html>
