<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RskSupervisionIndicator001}">监督指标</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				
				<a id="RskSupervisionIndicator001_btn_add" class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a>
					<a id="RskSupervisionIndicator001_btn_play" class="layui-btn layui-btn-sm btn-play"
					data-th-text="#{RskSupervisionIndicator001.play}">启用</a>
					<a id="RskSupervisionIndicator001_btn_stop" class="layui-btn layui-btn-sm btn-pause"
					data-th-text="#{RskSupervisionIndicator001.stop}">停用</a>
				<!-- <a id="RskSupervisionIndicator001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
				data-th-text="#{SysCommon.delete}">删除</a> -->
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								data-th-text="#{RskSupervisionIndicator001.indName}">指标名称</label>
							<div class="layui-input-inline input-inline">
								<input type="text" name="indName" data-th-placeholder="#{SysCommon.placeholder}" id="indName"
							class="layui-input form-input input-text" />		
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{RskSupervisionIndicator001.indType}">指标类型</label>
							<div class="layui-input-inline input-inline">
								<select  id="indType" name="indType" formatoption="false"
									class="layui-input form-input input-select"
									 data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result = '${IND_TYPE}'
									>
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{RskSupervisionIndicator001.supType}">监督类型</label>
							<div class="layui-input-inline input-inline">
								<select  id="supType" name="supType" formatoption="false"
									class="layui-input form-input input-select"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result = '${SUP_TYPE}'
									>
								</select>
							</div>
						</div>
					</div>
				</form>
			</div>

			<div id="singleTableDiv">
				<table class="layui-table" id="dataTable"></table>
			</div>
			<div id="bagTableDiv" style="display: none">
				<table class="layui-table" id="dataBagTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
	    <script data-th-inline="javascript" type="text/javascript">
		  	var IND_TYPE = /*[[${IND_TYPE}]]*/ ;
	        var SUP_FREQUENCY=/*[[${SUP_FREQUENCY}]]*/'';
	        var SUP_OPERATOR=/*[[${SUP_OPERATOR}]]*/ ;  //操作符数据字典下拉
	        var SUP_CONNECTOR=/*[[${SUP_CONNECTOR}]]*/''; //运算符数据字典下拉
	        var SUP_LINK_TYPE=/*[[${SUP_LINK_TYPE}]]*/''; //连接符数据字典下拉
	        var SUP_UNIT=/*[[${SUP_UNIT}]]*/'';  //单位数据字典下拉
	        var PORTFOLIO_LEVEL=/*[[${PORTFOLIO_LEVEL}]]*/'';  //组合层次数据字典下拉
		    var pageId = /*[[${pageId}]]*/''; // 画面Id
		    
		    var USE_STATUS_01 = /*[[${USE_STATUS_01}]]*/''; // 画面Id
		    var FORBID_ASSETTYPE=JSON.parse(/*[[${FINPROD_TYPE_TG}]]*/'[]'); // 资产类型
		    var FORBID_BONDTYPE=JSON.parse(/*[[${WINDTYPEONE}]]*/'[]'); // 债券资产类型
		    var FORBID_FUNDTYPE=JSON.parse(/*[[${FUND_ASSET_SECOND_TYPE}]]*/'[]'); // 基金资产类型
		    var FORBID_DEBTRATE=JSON.parse(/*[[${CHB_BODY_GRADE}]]*/'[]'); // 债项评级
		    var FORBID_BODYRATE=JSON.parse(/*[[${CHB_BODY_GRADE}]]*/'[]'); // 主体评级
		    var FORBID_INDUSTRY=JSON.parse(/*[[${SW_INDUSTRY_ONE_TYPE}]]*/'[]'); // 负面行业清单
		    var IND_TYPE_FORBID_ASSETTYPE=/*[[${IND_TYPE_FORBID_ASSETTYPE}]]*/''; // 资产类型
		    var IND_TYPE_FORBID_BONDTYPE=/*[[${IND_TYPE_FORBID_BONDTYPE}]]*/''; // 债券资产类型
		    var IND_TYPE_FORBID_FUNDTYPE=/*[[${IND_TYPE_FORBID_FUNDTYPE}]]*/''; // 基金资产类型
		    var IND_TYPE_FORBID_DEBTRATE=/*[[${IND_TYPE_FORBID_DEBTRATE}]]*/''; // 债项评级
		    var IND_TYPE_FORBID_BODYRATE=/*[[${IND_TYPE_FORBID_BODYRATE}]]*/''; // 主体评级
		    var IND_TYPE_FORBID_INDUSTRY=/*[[${IND_TYPE_FORBID_INDUSTRY}]]*/''; // 负面行业清单
		    
		    var IND_TYPE_TOTAL_ENUM=/*[[${IND_TYPE_TOTAL_ENUM}]]*/'';
		    var relateIndType=/*[[${IND_TYPE_LINK_ENCODE}]]*/'';
		</script>
		<script data-th-src="@{/js/invest/risk/limitmanagement/superviseindicator/RskSupervisionIndicator001.js}"></script>
	</div>
</body>
</html>
