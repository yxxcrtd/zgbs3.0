<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{RskOutValtblImportHis001}">估值表读取处理监控</title>
</head>
<body>
<div layout:fragment="content">
        <div class="form-button-area" >
<!--            <a id="RskOutsValTableImportHis001_btn_reset" class="layui-btn layui-btn-sm btn-reset btn-default float:right;">重置</a>-->
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{RskOutValtblImportHis001.importDate}">查询日期</label>
                        <div class="layui-input-inline input-inline">
                            <input class="layui-input form-input input-dateSelect" name="searchDate" id="searchDate"
                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{RskOutValtblImportHis001.importType}">处理状态</label>
                        <div class="layui-input-inline input-inline">
                            <select id="importType" name="importType" class="layui-input form-input input-select" placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${RSK_IMPORT_TYPE}">
                            </select>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    <div class="table-wrap">
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/risk/outsvaltableimporthis/RskOutValtblImportHis001.js}" type="text/javascript"></script>
</div>
</body>
</html>
