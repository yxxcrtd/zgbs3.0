<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{RskValtblPrtBotasset002}">底层资产映射编辑</title>
    <style>
        .table-wrap .layui-table-view .layui-table-header table thead tr{
            background-color: #d9ecff!important;
        }
        .port-wrap{
            border-left: 1px solid #ddd;
            border-right: 1px solid #dddddd;
            border-bottom: 1px solid #dddddd;
        }
        .port-title{
            padding: 20px 0 7px 20px;
            border-bottom: 1px dashed #dddddd;
            color: #444444;
            font-size: 14px;
        }
        .port-text{
            color: #f79415;
            padding-right: 5px;
        }
        .port-dl{
            padding-top: 5px;
            overflow: hidden;
        }
        .port-dt{
            color: #444444;
            float: left;
        }
        .port-dd{
            color: #444444;
            float: left;
            padding-left: 5px;
        }
        .port-dd-text{
            float: left;
            padding-left: 5px;
        }
        .port-dl-wrap{
            padding-left: 20px;
            height: 120px;
        }
        .form-input-wrap{
            border-bottom: 1px dashed #ddd;
            padding: 15px 0 7px 0;
        }
        .port-right-wrap{
            border-right: 1px solid #dddddd;
            border-bottom: 1px solid #dddddd;
        }
        .portofo-container{
            overflow: hidden;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="portofo-container">
        <input id="ptlId" data-th-value="${ptlId}" hidden>
        <div class="layui-col-xs6 layui-col-sm6 layui-col-md6 layui-col-lg6 port-wrap">
            <h3 class="port-title">资管计划<span class="port-text" data-th-text="${ptlName}">N/A</span>资产科目</h3>
            <div class="port-dl-wrap">
                <dl class="port-dl">
                    <dt class="port-dt">科目类型:</dt>
                    <dd class="port-dd" id="subClass" data-th-text="${subClass}">N/A</dd>
                </dl>
                <dl class="port-dl">
                    <dt class="port-dt">科目代码:</dt>
                    <dd class="port-text port-dd-text" id="subCode" data-th-text="${subCode}">N/A</dd>
                </dl>
                <dl class="port-dl">
                    <dt class="port-dt">科目名称:</dt>
                    <dd class="port-dd" id="subName" data-th-text="${subName}">N/A</dd>
                </dl>
            </div>
        </div>
        <div class="layui-col-xs6 layui-col-sm6 layui-col-md6 layui-col-lg6 port-right-wrap">
            <input id="assetSource" hidden>
            <form class="layui-form" style="overflow: hidden;">
                <div class="layui-col-xs12 layui-col-sm12 layui-col-md12 layui-col-lg12 form-input-wrap">
                    <label class="layui-form-label form-lable" style="width: 14.5%;">选择资产</label>
                    <div class="layui-input-inline input-inline">
                        <select id="finprodId" name="finprodId" required="required"
                                class="layui-input form-input input-select"
                                data-th-placeholder="#{SysCommon.placeholder}" formatOption = false
                                data-th-data-url="@{/invest/risk/penetrationmanagement/rskValtblPrtBotasset/RskValtblPrtBotasset002/selectAllAsset(finprodType2=${finprodType2})}"
                                data-th-initValue='${finprodId}'>
                         </select>
                    </div>
                </div>
            </form>
            <div class="port-dl-wrap">
                <dl class="port-dl">
                    <dt class="port-dt">资产类型:</dt>
                    <dd class="port-dd" id="finprodType2">N/A</dd>
                </dl>
                <dl class="port-dl">
                    <dt class="port-dt">资产简称:</dt>
                    <dd class="port-dd" id="finprodAbbr">N/A</dd>
                </dl>
                <dl class="port-dl">
                    <dt class="port-dt">市场代码:</dt>
                    <dd class="port-dd" id="finprodMarketId">N/A</dd>
                </dl>
                <dl class="port-dl">
                    <dt class="port-dt">交易场所:</dt>
                    <dd class="port-dd" id="tradeMarket">N/A</dd>
                </dl>
            </div>
        </div>
    </div>
    <div class="layui-row text-center" style="margin:30px 0;">
        <a id="RskValtblPrtBotasset002_btn_submit" class="layui-btn layui-btn-sm">提交</a>
        <a id="RskValtblPrtBotasset002_btn_cancelMap" class="layui-btn layui-btn-sm btn-default">取消映射</a>
        <a id="RskValtblPrtBotasset002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/risk/penetrationmanagement/rskValtblPrtBotasset/RskValtblPrtBotasset002.js}" type="text/javascript"></script>
</div>
</body>
</html>
