<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{FlowRiskSceneManage002}">情景新建-流动性压力测试</title>
</head>
<body>
<div layout:fragment="content">
	<form class="layui-form joyin-form-wrap pro-module-form" id="flowRiskSceneManage002Form">
		<input id="workflowId" name="workflowId" data-th-value="${workflowId}" type="hidden">
		<input id="tmplId" name="tmplId" data-th-value="${entity?.tmplId}" type="hidden">
		<input id="oldSceneName" name="oldSceneName" data-th-value="${entity?.oldSceneName}" type="hidden">
		<div class="pro-module-wrap">
			<div class="pro-module">
				<h3 class="pro-module-title">
					<span class="title-des">基本信息</span><i
						class="iconfont icon-arrow-down pro-down-icon"></i>
				</h3>
				<br/>
				<div class="pro-module-item">
					<div class="layui-form-item">
						<div class="form-inline-wrap ">
							<label class="layui-form-label form-label-wrap"
								>情景设置模板</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="tmplName" name="tmplName" disabled
									class="layui-input form-input" placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-value='${entity?.tmplName}'
									>
							</div>
						</div>
						<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap"
								>情景设置模板编号</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="tmplId" name="tmplId" disabled
									class="layui-input form-input" placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-value='${entity?.tmplId}'
									>
							</div>
						</div>
						<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap"
								data-th-text="#{FlowRiskSceneManage002.riskType}">适用风险分类</label>
							<div class="layui-input-inline input-inline">
								<select name="riskType" id="riskType"  disabled="true"
									class="layui-input form-input input-select" formatoption=false
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result='${RISK_TYPE}'
									data-th-initValue='${entity?.riskType}'>
								</select>
							</div>
						</div>
					</div>
				</div>
				<div class="pro-module-item">
					<div class="layui-form-item">
						<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap"
								data-th-text="#{FlowRiskSceneManage002.sceneType}">情景类型</label>
							<div class="layui-input-inline input-inline">
								<select name="sceneType" id="sceneType"  disabled
									class="layui-input form-input input-select" formatoption=false
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result='${SCENE_TYPE}'
									data-th-initValue='${entity?.sceneType}'>
								</select>
							</div>
						</div>
					</div>
				</div>
				<hr style="height:2px;border:none;border-top:2px #185598;" />
				<div class="pro-module-item">
					<div class="layui-form-item">
						<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap"
								data-th-text="#{FlowRiskSceneManage002.sceneName}">情景名称</label>
							<div class="layui-input-inline input-inline">
								<input type="text" name="sceneName" id="sceneName"
									class="layui-input form-input"
									data-th-value='${entity?.sceneName}'
									data-th-placeholder="#{SysCommon.placeholder}" required>
							</div>
						</div>
						<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap"
								data-th-text="#{FlowRiskSceneManage002.sceneId}">情景编号</label>
							<div class="layui-input-inline input-inline">
								<input type="text" name="sceneId" id="sceneId" disabled
									class="layui-input form-input"
									data-th-value='${entity?.sceneId}'
									data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
						<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap"
								data-th-text="#{FlowRiskSceneManage002.applyFin}">适用产品</label>
							<div class="layui-input-inline input-inline">
								<select name="openmode" id="openmode"  
									class="layui-input form-input input-select" formatoption=false
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result='${OPENMODE}'
									data-th-initValue='${entity?.openmode}'>
								</select>
							</div>
						</div>
						
					</div>
				</div>
				<div class="pro-module-item">
					<div class="layui-form-item">
						<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap"
								>情景二级类型</label>
							<div class="layui-input-inline input-inline">
								<select name="sceneType2" id="sceneType2" 
									class="layui-input form-input input-select"  formatoption=false
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result='${SCENE_TYPE2}'
									data-th-initValue='${entity?.sceneType2}'>
								</select>
							</div>
						</div>
					</div>
				</div>
				
				
			</div>
		</div>
		<div class="pro-module-wrap">
			<div class="pro-module">
				<h3 class="pro-module-title">
					<span class="title-des">风险因子</span><i
						class="iconfont icon-arrow-down pro-down-icon"></i>
				</h3>
				<br/>
				<div class="pro-module-item" style="padding-left:10px;padding-right:10px;">
					<span style="font-weight:bold;">产品规模变化</span>
					<div style="height:66px;">
						<table class="layui-table" id="dataTableA" name="dataTableA"></table>
					</div>
					<div class="element" style="height:60px;display:none;" id="netOutfDiv">
						<span class="layui-form-label form-label-wrap" style="font-size: 14px;line-height: 40px!important;width: auto;margin-left: 15px;"
							>申赎净流出基础选择:</span>
						<!-- <ul class="manage-info-item">
							<li data-th-each="key,list : ${mapNetOutf}">
								<div data-th-each="option : ${list.current.value}" style="float:left;">
									<input type="radio"
										th:checked="${#strings.contains(#strings.isEmpty(entity?.netOutf) ?'' : entity?.netOutf, option?.id)}"
										name="rskSupervisionIndicatorDto.supType"
										data-th-value="${option?.id}" th:title="${option.text}" />
								</div>
							</li>
						</ul> -->
						<div class="layui-input-block" style="font-size:12px!important;min-height: 36px;color: #444;">
					        <input type="radio" name="netOutf" value="01" title="最近五次申赎净流出平均" />
					        <input type="radio" name="netOutf" value="02" title="最近一次申赎净流出" />
					        <input type="radio" name="netOutf" value="03" title="产品历史最大申赎净流出" />
					    </div>
					</div>
					<br/>
					<div style="height:120px;" >
						<span style="font-weight:bold;">资产变现能力</span>
						<table class="layui-table" id="dataTableB" name="dataTableB"></table>
					</div>
				</div>
			</div>
		</div>
		<div class="pro-module-wrap">
			<div class="pro-module">
				<h3 class="pro-module-title">
					<span class="title-des">压力测试报告</span><i
						class="iconfont icon-arrow-down pro-down-icon"></i>
				</h3>
				<br/>
				<div class="pro-module-item layui-row layui-col-space20" style="padding-left:10px;padding-right:10px;">
					<div class="layui-col-xs6 layui-col-sm6 layui-col-md6" >
						<span style="font-weight:bold;">产品指标</span>
						<div>
							<table class="layui-table" id="dataTableC" name="dataTableC"></table>
						</div>
					</div>
					<!-- <div class="layui-col-xs2 layui-col-sm2 layui-col-md2">
						&nbsp;
					</div> -->
					<div class="layui-col-xs6 layui-col-sm6 layui-col-md6" >
						<span style="font-weight:bold;">承压指标</span>
						<div>
							<table class="layui-table" id="dataTableD" name="dataTableD"></table>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="pro-module-wrap">
			<div class="pro-module">
				<h3 class="pro-module-title">
					<span class="title-des">备注</span><i
						class="iconfont icon-arrow-down pro-down-icon"></i>
				</h3>
				<br/>
				<div class="pro-module-item">
					<textarea id="remark" name="remark"
                        data-th-text="${entity?.remark}"
                        class="layui-textarea" placeholder="请输入内容"
                        data-th-placeholder="#{SysCommon.placeholder}">
                    </textarea>
				</div>
			</div>
		</div>
			
	</form>
	<div class="layui-form-item">
        <div align="center" style="height:50px;padding-top: 10px;">
            <a id="FlowRiskSceneManage002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="FlowRiskSceneManage002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="FlowRiskSceneManage002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
	<style type="text/css">
		.pro-module .layui-table-view{
		    padding: 0px!important;
		    border: 0;
		}
		.layui-table-body{
			overflow:hidden!important
		}
		.layui-anim.layui-icon{
			color:#208fff;
		}
    </style>
   <script th:inline="javascript" type="text/javascript">
		var FLOW_RISK_FACTOR_ONE = /*[[${FLOW_RISK_FACTOR_ONE}]]*/'';
		var NET_OUTFLOW_BASE_CHOICE = /*[[${NET_OUTFLOW_BASE_CHOICE}]]*/'';
		var FLOW_RISK_FACTOR = /*[[${FLOW_RISK_FACTOR}]]*/'';
	 	var workflowId = /*[[${workflowId}]]*/'';
	 	var entity=/*[[${entity}]]*/'';
	 	var sceneId=/*[[${sceneId}]]*/'';
	 	var ftrRemarkList=/*[[${ftrRemarkList}]]*/'';
	 	var PrdScl01001=/*[[${PrdScl01001}]]*/'';
	 	var PrdScl01002=/*[[${PrdScl01002}]]*/'';
	 	var AssLqu01001=/*[[${AssLqu01001}]]*/'';
    </script>  
    <script data-th-src="@{/js/invest/risk/stresstestmanage/flowriskscenemanage/FlowRiskSceneManage002.js}" type="text/javascript"></script>
</div>
</body>
</html>
