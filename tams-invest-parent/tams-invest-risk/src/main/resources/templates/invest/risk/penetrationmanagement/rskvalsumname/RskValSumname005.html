<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RskValSumname005}">新汇总科目映射</title>
<style>
.col-label{
width:20%;
}
</style>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
			<div class="pro-module-wrapper pro-module-base">
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title">
						<span class="title-des">源</span>
						<i class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="pro-module-item">
						     <div class="layui-form-item">
								 <div style="display: none">
									 <input type="text" id="id" name="id" data-th-value="${entity?.id}"/>
								 </div>
								 <div>
									 <label class="layui-form-label form-label-wrap"
											data-th-text="#{RskValSumname005.oldName}" style="width: 25%"></label>
									 <div class="layui-input-inline input-inline" style="width: 70%!important;">
										 <input type="text" class="layui-input form-input" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" id="oldName" name="oldName"
												required="required" data-th-value="${entity?.oldName}" th:maxlength="60" disabled>
									 </div>
						     </div>
						</div>
					</div>
				</div>
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title">
						<span class="title-des">目标</span>
						<i class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="pro-module-item">
						     <div class="layui-form-item">
								 <label class="layui-form-label form-label-wrap"
										data-th-text="#{RskValSumname002.name}" style="width: 25%"></label>
								 <div class="layui-input-inline input-inline" style="width: 70%!important;">
									 <input type="text" class="layui-input form-input" placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}" id="name" name="name"
											required="required" data-th-value="${entity?.name}" th:maxlength="60">
								 </div>
						     </div>
						</div>
					</div>
				</div>
			</div>
			</div>
		</form>
		<div class="layui-col-md12" style="margin-top: 20px;">
			<div class="text-center">
				<a id="RskValSumname005_btn_save"
				   class="layui-btn layui-btn-sm btn-save"
				   data-th-text="#{SysCommon.save}">保存</a>
				<a id="RskValSumname005_btn_cancel"
				   class="layui-btn layui-btn-sm btn-cancel"
				   data-th-text="#{SysCommon.cancel}">取消</a>
			</div> 
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-src="@{/js/invest/risk/penetrationmanagement/rskvalsumname/RskValSumname005.js}"
			type="text/javascript">
		</script>
	</div>
</body>
</html>
