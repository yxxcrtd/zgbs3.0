<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{RskSupervisionIndicatorParam001}">指标参数管理</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area">
            <a id="RskSupervisionIndicatorParam001_btn_create"
               class="layui-btn layui-btn-sm btn-create"
               data-th-text="#{SysCommon.create}">新建</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{RskSupervisionIndicatorParam001.paraName}">参数名称</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" class="layui-input form-input" id="paraName" name="paraName"/>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{RskSupervisionIndicatorParam001.updateTime}">更新时间</label>
                        <div class="layui-input-inline input-inline">
                            <input id="updateTime" name="updateTime" class="layui-input form-input input-dateRangeSelect"
                                   placeholder="请选择时间区间" data-th-placeholder="#{SysCommon.dateInterval}"
                                   >
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/risk/limitmanagement/rsksupervisionindicatorparam/RskSupervisionIndicatorParam001.js}" type="text/javascript"></script>
</div>
</body>
</html>
