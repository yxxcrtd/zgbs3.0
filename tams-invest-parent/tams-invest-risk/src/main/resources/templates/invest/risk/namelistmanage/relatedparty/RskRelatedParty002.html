<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{RskRelatedParty002}">关联方修改</title>
</head>
<body>
<div layout:fragment="content">
    <div>
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{RskRelatedParty001.instituteName}">关联方名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="instituteName" name="instituteName"
                                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" required="required"
                                               data-th-value="${entity?.instituteName}"/>
                                    </div>
                                </div>

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{RskRelatedParty001.instituteCode}">统一机构信用代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="instituteCode" name="instituteCode" required="required"
                                                class="layui-input form-input" disabled="disabled"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.instituteCode}">
                                    </div>
                                </div>

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{RskRelatedParty001.limitAmt}">单笔交易额上限</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="limitAmt" name="limitAmt" placeholder="请输入内容"
                                               data-pattern="" required="required"
                                               class="layui-input form-input text-number"
                                               data-th-value="${entity?.limitAmt}" maxlength="16"/>
                                    </div>
                                </div>


                            </div>
                        </div>

                    </div>
                    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                        <div class="text-center">
                            <a id="RskRelatedParty002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                               data-th-text="#{SysCommon.submit}">提交</a>
                            <a id="RskRelatedParty002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                               data-th-text="#{SysCommon.cancel}">取消</a>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/risk/namelistmanage/relatedparty/RskRelatedParty002.js}"></script>
</div>
</body>
</html>
