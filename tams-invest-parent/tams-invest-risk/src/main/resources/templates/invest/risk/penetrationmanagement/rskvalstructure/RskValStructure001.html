<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{RskValStructure001}">估值表指标结构映射</title>
    <style>
        .input-btn-append a{
            line-height: 20px;
        }
        .icon-upload{
            color:limegreen;
        }
        .delt{
            color: red;
        }
        .del{
            color: red;
        }
        .iconinput{color:blue}
        .mixtree-node{
            overflow: hidden;
            padding: 8px 0 8px 10px;
            color:rgb(119, 119, 119);
            cursor: pointer;
            border-bottom: dashed 1px #dbdbdb;
        }
        .btn-trans:hover {
            boder-right: solid 1px #dbdbdb;
            boder-bottom: solid 1px #dbdbdb;
        }
        .mixtree-node:hover { background-color: #D9ECFF;}
        .node_div{float:left;width: 80%; display: inline-block;}
        .operate_div{
            width:20%;
            float:left;
            display: none;
            }
        .btn-trans{background-color: transparent!important;border: 0px;font-weight: bold;}
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="layui-row">
        <form class="layui-form layui-col-md3" id="submitForm">
            <div class="layui-form-item" style="border: 1px solid #ccc; padding: 5px; min-height: 460px; overflow:auto;position:relative">
                <div class="input-btn-append" style="    position: absolute; right: 8px;">
                    <a id="RskValStructure001_btn_creat" class="layui-btn layui-btn-sm btn-create btn-trans"
                       data-th-text="#{SysCommon.create}" style="float: right; padding-right: 5px;margin-top: 3px;color: yellowgreen;border: 0px!important;">新建</a>
                </div>
                <div id="mixTree" data-checkable='false'>
                </div>
            </div>
        </form>
        <div class="layui-col-md9" style="float:right;padding-left:10px;">
        	<div class= " layui-col-md-offset4 "style="float:right">
                        <a id="RskValStructure001_btn_add" class="layui-btn layui-btn-sm"><i class="iconfont icon-plus"></i><span data-th-text="#{SysCommon.add}">添加</span></a>
                    </div>
            <div>
                <table class="layui-table" id="dataTable" ></table>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script
            data-th-src="@{/js/invest/risk/penetrationmanagement/rskvalstructure/RskValStructure001.js}">
    </script>
</div>
</body>
</html>
