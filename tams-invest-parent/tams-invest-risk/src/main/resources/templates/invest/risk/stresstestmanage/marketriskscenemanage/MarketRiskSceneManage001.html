<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
	<meta charset="UTF-8">
	<title data-th-text="#{MarketRiskSceneManage001}">市场性风险-情景管理</title>
	<link rel="stylesheet" data-th-href="@{/js/invest/risk/stresstestmanage/flowriskflowassets/iconfont.css}">
</head>
<body>
<div layout:fragment="content">
	<div class='layui-fluid'>
		<div class="form-button-area">
            <a id="MarketRiskSceneManage001_btn_add"
               class="layui-btn layui-btn-sm btn-create"
               data-th-text="#{SysCommon.create}">新建</a>
           <a id="MarketRiskSceneManage001_btn_effective"
               class="layui-btn layui-btn-sm"
               >启用</a>
           <a id="MarketRiskSceneManage001_btn_neffective"
               class="layui-btn layui-btn-sm"
               >停用</a>
              
        </div>
		<div class="joyin-form-wrap joyin-filter-form condition-area">
			<form class="layui-form" id="searchForm">
				<div class="layui-form-item">
					<div class="layui-row layui-col-space10">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-label-wrap" data-th-text="情景模板名称">情景模板名称</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="tmplName" name="tmplName" disabled
									class="layui-input form-input" placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-value='${sceneTmpl?.tmplName}'>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-label-wrap" data-th-text="情景模板编号">情景模板编号</label>
                            <div class="layui-input-inline input-inline">
                            	<input type="text" id="tmplId" name="tmplId" disabled
									class="layui-input form-input" placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-value='${sceneTmpl?.tmplId}'>
                            </div>
                        </div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable" data-th-text="情景类型">情景类型</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text"  class="layui-input form-input input-text" value="历史情景" disabled />
                                <input type="hidden"  id="sceneType" name="sceneType" value="01" />
                            </div>
                        </div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-label-wrap" data-th-text="适用风险分类">适用风险分类</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text"  class="layui-input form-input input-text" value="市场性风险" disabled />
                                <input type="hidden"  id="riskType" name="riskType" value="02" />
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4" style="display:none;">
                            <label class="layui-form-label form-lable" data-th-text="适用二级分类">适用二级分类</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="riskType2" name="riskType2"  class="layui-input form-input input-select" 
    									 allowClear="true" placeholder="请输入内容"
    									 data-th-data-result='${RISK_TYPE2}'
    									 data-th-placeholder="#{SysCommon.placeholder}">
    							</select>
                            </div>
                        </div>
					</div>
					<hr style="height:2px;border:none;border-top:2px #185598;" />
					<div class="layui-row layui-col-space10">
						
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-label-wrap" >情景名称|编号</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="sceneIds" name="sceneIds"
    								class="layui-input form-input input-select" allowClear="true"
    								placeholder="请输入内容"
    								data-th-placeholder="#{SysCommon.placeholder}"
    								formatoption=true multiple="true"
    								data-th-data-url="@{/invest/risk/stresstestmanage/marketriskscenemanage/MarketRiskSceneManage001/fuzzySelectScene}">
    							</select>
    							
    							
                            </div>
                        </div>
                        
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable" data-th-text="适用产品">适用产品</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="suitProduct" name="suitProduct"
    									class="layui-input form-input input-select" 
    									allowClear="true" placeholder="请输入内容" 
    									data-th-data-result='${OPENMODE}'
    									data-th-placeholder="#{SysCommon.placeholder}" >
    							</select>
                            </div>
                        </div>
                        
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable" data-th-text="情景时间区间">情景时间区间</label>
                            <div class="layui-input-inline input-inline">
                                <input class="layui-input form-input input-dateRangeSelect" id="dateRange" placeholder="请选择时间区间">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable" data-th-text="关联因子">关联因子</label>
                            <div class="layui-input-inline input-inline">
		                        <select id="ftrId" name="ftrId" placeholder="请选择内容">
								  	<option value="">请选择关联因子</option>
								  	<optgroup th:each="groupName : ${ftrTypeGroups}" th:label="${groupName}">
								  		<option th:each="ftrType : ${ftrTypeList}" th:if="${ftrType.ftrTypeValue == groupName}"
								  			 th:value="${ftrType.ftrType2Code}" th:text="${ftrType.ftrType2Value}"></option>
								  		
								    	<!-- <option th:value="${ftrType.ftrType2Code}" th:text="${ftrType.ftrType2Value}"></option> -->
								  	</optgroup>
								</select>
								
								
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable" data-th-text="启用状态">启用状态</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="effStatus" name="effStatus"
    									class="layui-input form-input input-select" 
    									allowClear="true" placeholder="请输入内容" 
    									data-th-data-result='${SCENE_EFF_STATUS}'
    									data-th-placeholder="#{SysCommon.placeholder}" >
    							</select>
                            </div>
                        </div>
					</div>
				</div>
			</form>
		</div>
		<div>
            <table class="layui-table" id="dataTable"></table>
        </div>
	</div>
</div>

		    color:blue;

			display: block;
		    height: 24px;

		}
		#ftrId+.layui-form-select > .layui-select-title > input{

    		color: #fff;
		}
		/*启用停用样式*/

			padding: 0 11px;
			cursor:auto;
			border-radius:3px;
		}
		.layui-table-cell .effstatus:hover{
			margin: 0 4px 1px 4px;
			border:none;
		}

	<script th:inline="javascript" type="text/javascript">
	 	var sceneTmpl=/*[[${sceneTmpl}]]*/'';
    </script>  
    <script data-th-src="@{/js/invest/risk/stresstestmanage/marketriskscenemanage/MarketRiskSceneManage001.js}" type="text/javascript"></script>
</div>
</body>
</html>
