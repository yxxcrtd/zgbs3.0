<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{OrgNameManagement006}"></title>
    <style>
        .col-label{
            width: 23%;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
        <div class="pro-module-wrapper pro-module-base">
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <div class="pro-module-item">
                        <fieldset class="layui-elem-field layui-field-title"
                                  style="margin-top: 1px;">
                            <legend>名单删除</legend>
                        <div class="layui-form-item">
                            <label class="layui-form-label form-label-wrap col-label layui-col-md2" data-th-text="#{AssetNameManagement001.listName}">资产代码</label>
                            <div class="layui-input-inline input-inline layui-col-md10">
                                <input id="listName" name="listName" data-th-value='${entity?.listName}'
                                       type="text" class="layui-input form-input"
                                       placeholder="请输入内容">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label form-label-wrap col-label layui-col-md2" data-th-text="#{AssetNameManagement001.listId}">资产名称</label>
                            <div class="layui-input-inline input-inline layui-col-md10">
                                <input id="listId" name="listId" data-th-value='${entity?.listId}'
                                       type="text" class="layui-input form-input"
                                       placeholder="请输入内容" >
                            </div>
                        </div>
                        </fieldset>
                    </div>
                </div>
            </div>
        </div>
    </form>
    <div class="layui-col-md12" style="margin-top: 20px;">
        <div class="text-center">
            <a id="OrgNameManagement006_btn_save"
               class="layui-btn layui-btn-sm btn-save"
               data-th-text="#{SysCommon.save}">保存</a>
            <a id="OrgNameManagement006_btn_cancel"
               class="layui-btn layui-btn-sm btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
</body>
</html>
