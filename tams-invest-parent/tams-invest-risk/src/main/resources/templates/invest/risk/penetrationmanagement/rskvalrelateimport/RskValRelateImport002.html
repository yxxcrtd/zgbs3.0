<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{RskValRelateImport002}">新建组合与结构映射</title>
    <style>
        .mst-lable{
            width: 20%;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div>
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="layui-form-item">
                <label class="layui-form-label form-lable mst-lable" >资管计划名称</label>
                <div class="layui-input-inline input-inline mst-input">
                    <select  class="layui-input form-input input-select" allowClear="true" name="ptlId" id="RskValRelateImport002_ptlId"
                         placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" formatoption=true data-th-initValue='${entity?.ptlId}'
                         data-th-data-url="@{/invest/risk/penetrationmanagement/rskvalrelateimport/RskValRelateImport001/queryGroupIdInfo}" required>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label form-lable mst-lable"
                    data-th-text="#{RskValRelateImport002.startRow}">起始行</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" name="startRow" id="RskValRelateImport002_startRow" placeholder="请输入内容"
                    class="layui-input form-input " data-th-value='${entity?.startRow}' oninput="value=value.replace(/[^\d]/g,'')" th:maxlength="10" required>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label form-lable mst-lable"
                    data-th-text="#{RskValRelateImport002.subjectCodeCol}">科目代码列</label>
                <div class="layui-input-inline input-inline mst-input">
                    <input type="text" name="subjectCodeColLetter" id="RskValRelateImport002_subjectCodeCol" placeholder="请输入内容"
                    class="layui-input form-input " data-th-value='${entity?.subjectCodeColLetter}' oninput="value=value.replace(/[^A-Z]/g,'')" th:maxlength="10" required>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label form-lable mst-lable"
                    data-th-text="#{RskValRelateImport002.structMapId}">指标结构映射</label>
                <div class="layui-input-inline input-inline mst-input">
                    <select  class="layui-input form-input input-select" allowClear="true" name="structMapId" id="RskValRelateImport002_structMapId"
                         placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" formatoption=false data-th-initValue='${entity?.structMapId}'
                         data-th-data-url="@{/invest/risk/penetrationmanagement/rskvalrelateimport/RskValRelateImport002/queryStructMapId}" required>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label form-lable mst-lable"
                    data-th-text="#{RskValRelateImport002.sumsubMapId}">汇总科目映射</label>
                <div class="layui-input-inline input-inline mst-input">
                    <select  class="layui-input form-input input-select" allowClear="true" name="sumsubMapId" id="RskValRelateImport002_sumsubMapId"
                         placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" formatoption=false data-th-initValue='${entity?.sumsubMapId}'
                         data-th-data-url="@{/invest/risk/penetrationmanagement/rskvalrelateimport/RskValRelateImport002/querySumsubMapId}" required>
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label form-lable mst-lable"
                    data-th-text="#{RskValRelateImport002.assetSubMapId}">资产科目映射</label>
                <div class="layui-input-inline input-inline mst-input">
                    <select  class="layui-input form-input input-select" allowClear="true" name="assetSubMapId" id="RskValRelateImport002_assetSubMapId"
                         placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" formatoption=false data-th-initValue='${entity?.assetSubMapId}'
                         data-th-data-url="@{/invest/risk/penetrationmanagement/rskvalrelateimport/RskValRelateImport002/queryAssetSubMapId}" required>
                    </select>
                </div>
            </div>
            <div class="layui-form-item"  >
                <label class="layui-form-label form-lable mst-lable">导入过滤器</label>
                <div class="layui-input-inline input-inline mst-input">
                    <select id="filterId" name="filterId" formatoption="false" data-th-data-result="${VALUATION_FILTER}" data-th-initValue='${entity?.filterId}'  class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                    </select>
                </div>
            </div>
        </form>
        <div class="layui-col-md12 layui-col-xs12 layui-col-sm12 layui-col-lg12" style="position: fixed;bottom: 30px;">
            <div class="text-center">
                <!--<a id="RskValRelateImport002_btn_save" class="layui-btn layui-btn-sm btn-save"
                   data-th-text="#{SysCommon.save}">保存</a>-->
                <a id="RskValRelateImport002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                   data-th-text="#{SysCommon.submit}">提交</a>
                <a id="RskValRelateImport002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                   data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/risk/penetrationmanagement/rskvalrelateimport/RskValRelateImport002.js}"
            type="text/javascript"></script>
</div>
</body>
</html>
