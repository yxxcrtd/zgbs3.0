<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{CeAssetPositionManagement001}">组合查询</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				<a id="CeAssetPositionManagement001_btn_import" class="layui-btn layui-btn-sm btn-import" data-th-text="#{SysCommon.import}">导入</a>
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area curr-form' >
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{CeAssetPositionManagement001.portfolioId}">委外组合代码</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="CeAssetPositionManagement001_ptlId" name="ptlId" class="layui-input form-input input-select" 
								  data-th-data-url="@{/invest/risk/creditmanagement/ceassetpositionmanagement/CeAssetPositionManagement002/queryGroupIdInfo}"
								  formatoption = false placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{CeAssetPositionManagement001.assetType}">资产类型</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="CeAssetPositionManagement001_portfolioId" name="assetType" class="layui-input form-input input-select" data-th-data-result='${PINAN_ASSET_TYPE}'
								  formatoption = false placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{CeAssetPositionManagement001.assetCode}">资产代码</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="CeAssetPositionManagement001_finprodId" name="finprodId" class="layui-input form-input input-select" 
								  data-th-data-url="@{/invest/risk/creditmanagement/ceassetpositionmanagement/CeAssetPositionManagement001/queryAssetCodeInfo}"
								  formatoption = false placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" data-th-text="#{CeAssetPositionManagement001.positionDay}">持仓日</label>
							<div class="layui-input-inline input-inline">
								<input id="CeAssetPositionManagement001_valDate" name="valDate" class="layui-input form-input input-dateSelect" placeholder="请输入日期">
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" data-th-text="#{CeAssetPositionManagement001.openInterest}">持仓量</label>
							<div class="layui-input-inline input-inline">
								<input id="CeAssetPositionManagement001_openInterest" name="assetPosition" class="layui-input form-input text-money" placeholder="请输入内容" data-fixtype="2">
							</div>
						</div>
				    </div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-src="@{/js/invest/risk/creditmanagement/ceassetpositionmanagement/CeAssetPositionManagement001.js}"></script>
	</div>
</body>
</html>
