<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{LimitManage001}">额度管理</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				
				<a id="LimitManage001_btn_add" class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a>
<!-- 				 <a id="LimitManage001_btn_delete"
					class="layui-btn layui-btn-sm btn-delete"
					data-th-text="#{SysCommon.delete}">删除</a>	 -->
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								data-th-text="#{LimitManage001.customerName}">主体名称</label>
							<div class="layui-input-inline input-inline">
		                       <select  id="customerName" name="customerName"
									class="layui-input form-input input-select" formatoption=true 
									data-th-placeholder="#{SysCommon.placeholder}"  multiple
									th:data-url="@{/invest/risk/creditrisklimitmanagement/limitmanage/LimitManage001/getInstitutionName}" allowClear="true"								
									>
								</select>
		                    </div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="|#{LimitManage001.ccy}|">币种</label>
							<div class="layui-input-inline input-inline">
							 <select  id="ccy" name="ccy"
                             class="layui-input form-input input-select"   
                             th:placeholder="#{SysCommon.placeholder}"
                              allowClear="true" data-th-data-result="${CCY}"
                              formatoption="false" th:initValue="${entity?.ccy}"></select>	
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{LimitManage001.orgType}">机构大类</label>
							<div class="layui-input-inline input-inline">
								<select name="orgType" id="orgType"
									class="layui-input form-input input-select" formatoption=true 
									data-th-placeholder="#{SysCommon.placeholder}" multiple
									data-th-data-result="${ORG_CLASS}"> 
								</select>
							</div>
						</div>
					</div>
						<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								data-th-text="#{LimitManage001.orgLevel}">机构层级</label>
							<div class="layui-input-inline input-inline">
		                       <select  id="orgLevel" name="orgLevel"
									class="layui-input form-input input-select" formatoption=true 
									data-th-placeholder="#{SysCommon.placeholder}"  multiple
									data-th-data-result='${ORG_LEVEL}'>
								</select>
		                    </div>
						</div>
						 <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{LimitManage001.status}">有效状态</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="codeStatus" name="codeStatus"
                                class="layui-input form-input input-select" data-th-data-result='${LIMIT_STATUS_VALID}'
                                allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                formatoption="true">
                            </select>
                        </div>
                    </div>
					</div>
				</form>
			</div>

			<div id="singleTableDiv">
				<table class="layui-table" id="dataTable2"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
	    <script data-th-inline="javascript" type="text/javascript">
		  
		</script>
		<script data-th-src="@{/js/invest/risk/creditrisklimitmanagement/limitmanage/LimitManage001.js}"></script>
	</div>
</body>
</html>
