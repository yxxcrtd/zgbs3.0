<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{RskValTableImport001}">估值表导入</title>
    <style>
    .rsk-line{
     width: 79%;
     }
     .rsk-line .layui-upload-drag{
     width: 100%;
     padding:0;
     }
     .rsk-dl-wrap{
     overflow: hidden;
     padding:10px 0 5px 0;
     }
     .rsk-dl{
     float:left;
     }
     .rsk-dl dt{
     font-size: 14px;
     color: #444;
     float: left;
     }
     .rsk-dl dd{
     font-size: 14px;
     color: #444;
     float: left;
     line-height: 20px;
     padding-left: 10px;
     }
     .rsk-dl-item{
     padding-left: 30px;
     }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="joyin-form-wrap curr-form">
        <form class="layui-form"  id="submitForm" >
            <input id="structMapId" name="structMapId" hidden>
            <input id="sumsubMapId" name="sumsubMapId" hidden>
            <input id="assetSubMapId" name="assetSubMapId" hidden>
            <input id="subjectCodeCol" name="subjectCodeCol" hidden>
            <input id="startRow" name="startRow" hidden>
            <input id="trimChars" name="trimChars" hidden>
            <input id="filterId" name="filterId" hidden>
            <input id="ptlId" name="ptlId" hidden>
            <div class="layui-form-item" style="padding-bottom: 8px;">
                <div class="layui-inline layui-col-xs8 layui-col-sm8 layui-col-md8 layui-col-lg8">
                    <label class="layui-form-label form-lable" data-th-text="#{RskValTableImport001.valTableFileName}" style="width: 18%;">Excel模板</label>
                    <div class="layui-inline rsk-line">
                        <div class="upload" id="valtable" required
                             data-option="{allowFileType: 'xls|xlsx', callback: 'RskValTableImport001.uploadCallback'}">
                        </div>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{RskValTableImport001.tipMessage}" style="width: 90%;">提示信息</label>
                </div>
            </div>
            <div class="layui-form-item" style="padding-bottom: 8px;">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{RskValTableImport001.ptlId}">组合名称</label>
                    <div class="layui-input-inline input-inline">
                           <!-- <select type="text" name="ptlId" id="ptlId"
                                class="layui-input form-input input-select" allowClear="true"
                                placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                formatoption=true required="required"
                                data-th-data-url="@{/invest/risk/penetrationmanagement/rskvalrelateimport/RskValRelateImport001/queryGroupIdInfo}">
                            </select>-->
                        <input required disabled type="text" id="ptlName" name="ptlName"
                               class="layui-input form-input" placeholder="请输入内容"
                               th:placeholder="#{SysCommon.placeholder}"/>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{RskValTableImport001.valDate}">估值日期</label>
                    <div class="layui-input-inline input-inline">
                        <input required disabled type="text" id="valDate" name="valDate"
                               class="layui-input form-input" placeholder="请输入内容"
                               th:placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
               <!-- <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <div class="layui-input-inline input-inline">
                        <a id="RskValTableImport001_btn_see" class="layui-btn layui-btn-sm form-input-text" style="width: 60px;"><i class="iconfont icon-browse_fill"></i><span>预览</span></a>
                    </div>
                </div>-->
                <div class="form-button-area" export="false" filter="false">
                    <!-- 预览 -->
                    <button type="button" class="layui-btn layui-btn-sm btn-default"
                            id="RskValTableImport001_btn_see">
                        <i class="iconfont icon-browse_fill"></i>预览
                    </button>
                    <!-- 批量导入 -->
                    <button type="button" class="layui-btn layui-btn-sm btn-default"
                            id="RskValTableImport001_btn_batchUpload">
                        <i class="iconfont icon-upload" ></i>批量导入
                    </button>
                </div>
            </div>
        </form>
    </div>
    <div class="rsk-dl-wrap" style="display: none">
    <dl class="rsk-dl">
        <dt data-th-text="#{RskValAssetCode003.startRow}">起始行：</dt>
        <dd id="ddstartRow">N/A</dd>
    </dl>
    <dl class="rsk-dl rsk-dl-item">
        <dt data-th-text="#{RskValAssetCode003.assetCodeColIndex}">科目代码列：</dt>
        <dd id="ddassetCodeColIndex">N/A</dd>
    </dl>
    <dl class="rsk-dl rsk-dl-item">
        <dt data-th-text="#{RskValSumname001.trimChars}">清理字符：</dt>
        <dd id="ddtrimChars">N/A</dd>
    </dl>
    <!-- add by 裴家俊 20190514  添加过滤器 -->
    <dl class="rsk-dl rsk-dl-item">
        <dt data-th-text="#{RskValAssetCode003.filter}">过滤器：</dt>
        <dd id="ddfilterId">N/A</dd>
    </dl>
    </div>
    <div class="layui-tab" id="tabList">
        <ul class="layui-tab-title">
            <li class="layui-this" lay-id="00" data-th-text="#{RskValStructure001.title}">指标结构映射</li>
            <li data-th-text="#{RskValAssetCode002.title2}" lay-id="01">资产科目映射</li>
            <li data-th-text="#{RskValSumname001.title}" lay-id="02">汇总科目映射</li>
        </ul>
        <div class="layui-tab-content">
            <div class="layui-tab-item layui-show">
                <table class="layui-table" id="rskvalstructureTable"></table>
            </div>
            <div class="layui-tab-item">
                <table class="layui-table" id="rskValAssetCodeTable"></table>
            </div>
            <div class="layui-tab-item">
                <!-- <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-label-wrap"
                        data-th-text="#{RskValSumname001.trimChars}" style="width: 25%"></label>
                    <div class="sum-input-border" id="trimChars" name="trimChars"></div>
                </div> -->
                <table class="layui-table" id="rskvalsumnameTable"></table>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var chbValSplitStr = /*[[${chbValSplitStr}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/risk/valtblimport/RskValTableImport001.js}"> </script>
</div>
</body>
</html>
