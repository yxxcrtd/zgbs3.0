<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{LimitManage002}">额度新建</title>
<style type="text/css">
.pro-module .layui-table-view{
border:1px solid #e6e6e6;
padding:0px
}
</style>
<script data-th-inline="javascript" type="text/javascript">
var entity=/*[[${entity}]]*/'';
var creditQuoteItem=/*[[${creditQuoteItem}]]*/'';
var getCeLimitKindUrl = /*[[@{/invest/risk/creditmanagement/ceorg/LimitManage002/getAllCeOrgQuote}]]*/'';
</script>
</head>
<body>
	<div layout:fragment="content">
			<div style="margin: 10px;">				
				<a id="LimitManage002_btn_add" class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a>
			</div>
			<form class="layui-form joyin-form-wrap" id="limitManageForm">
			<div class="pro-module-wrapper pro-module-base" >
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des"></span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
									<input type="hidden" id="seqno" name="seqno" data-th-value="${entity?.seqno}" >
									<input id="workflowId" name="workflowId" data-th-value="${workflowId}" type="hidden">
									
									<input type="hidden" id="mdatebak" name="mdatebak" data-th-value="${mdate}" />
									<input type="hidden"  id="pflsh" name="pflsh" data-th-value="${pflsh}" >
									
									<div class="pro-module-item">
										<div class="layui-form-item">
							                <div class="form-inline-wrap">
							                    <label class="layui-form-label form-label-wrap" data-th-text="#{LimitManage002.customerName}">主体名称</label>
							                    <div class="layui-input-inline input-inline">
							                         <select required  id="customerId" name="customerId"
							                             class="layui-input form-input input-select" 
							                             th:placeholder="#{SysCommon.placeholder}"
							                             th:data-url="@{/invest/risk/creditrisklimitmanagement/limitmanage/LimitManage001/getInstitutionName}" allowClear="true"
							                             formatoption="true"
							                             th:initValue="${entity?.customerId}"></select>
							                    </div>
							                </div>
							                  <div class="form-inline-wrap">
							                    <label class="layui-form-label form-label-wrap" data-th-text="#{LimitManage002.creditAmt}">主体额度</label>
							                    <div class="layui-input-inline input-inline">
							                       <input required type="text" id="creditAmt" name="creditAmt"
														  data-textrange="4"
							                              class="layui-input form-input text-number" placeholder="请输入内容"
							                              th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.creditAmt}">
							                    </div>
							                </div>
							               <div class="form-inline-wrap">
							                    <label class="layui-form-label form-label-wrap" data-th-text="#{LimitManage002.ccy}">币种</label>
							                    <div class="layui-input-inline input-inline">
							                       <select  required id="ccy" name="ccy"
							                              class="layui-input form-input  input-select" placeholder="请输入内容"
							                              th:placeholder="#{SysCommon.placeholder}" th:initValue="${entity?.ccy}"
							                              data-th-data-result="${CCY}"></select>
							                    </div>
							                    
							                    
							                </div>
						            	</div>
							
					            	</div>
            				</div>
            			</div>
            	</div>
            
            	 <div class="pro-module-wrap">
                	<div class="pro-module">
                    	<h3 class="pro-module-title"><span class="title-des" ></span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                            <div style="width:92%;margin:8px 50px 8px 50px;height:250px;">
	                            <table class="layui-table" id="dataTable"></table>
							</div>
                     </div>
                 </div>
                 
                             
			</form>
			<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
            <div class="text-center">
                <a id="LimitManage002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                <a id="LimitManage002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="LimitManage002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
	</div>

	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
		    var workflowId = /*[[${workflowId}]]*/'';
		    var isTodoList = /*[[${isTodoList}]]*/'';
            var LIMIT_TYPE = /*[[${LIMIT_TYPE}]]*/'';
            var TERM_UNIT = /*[[${TERM_UNIT}]]*/'';

		</script>
		<script data-th-src="@{/js/invest/risk/creditrisklimitmanagement/limitmanage/LimitManage002.js}"></script>
	</div>
</body>
</html>
