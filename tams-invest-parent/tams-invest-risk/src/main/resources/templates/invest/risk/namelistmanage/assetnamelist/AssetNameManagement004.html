<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<body>
<div layout:fragment="content">
    <div class="pro-module-wrap">
    <form class="layui-form" th:id="AssetNameManagement004_submitForm">
                <input id="listId" name="listId" data-th-value="${listId}" hidden>
                <input id="listName" name="listName" data-th-value="${listName}" hidden>
                <input id="workflowId" name="workflowId" data-th-value="${workflowId}" hidden>
                <input id="revealFileId" name="revealFileId" data-th-value="${revealFileId}" hidden>
                <input id="listDetailType" name="listDetailType" data-th-value="${listDetailType}" hidden>
                <input id="operateStyle" name="operateStyle" data-th-value="${operateStyle}" hidden>
                <input id="listType" name="listType" data-th-value="${listType}" hidden>
                <input id="listLevel" name="listLevel" data-th-value="${listLevel}" hidden>                
      </form>
       <div class="layui-form-item" id="inputTypeId">
                   <div class="form-inline-wrap">
                         <label class="layui-form-label form-label-wrap" data-th-text="#{AssetNameManagement004.inputType}">导入方式</label>
                         <div class="layui-input-inline input-inline" required>
                         <div style="width: 30%; float: left;line-height: 29px;">
                         <input type="radio" name="inputType" value="01" title="无" th:checked="'01' eq ${inputType}">
                          <label data-th-text="#{AssetNameManagement004.fullInput}">全量导入</label>
                         </div>
                         <div style="width: 30%; float: left;line-height: 29px;">
                          <input type="radio" name="inputType" value="02" title="无" th:checked="'02' eq ${inputType}">
                          <label data-th-text="#{AssetNameManagement004.incInput}">增量导入</label>
                         </div>
                         </div>
                  </div>
               <!--  <div class="form-inline-wrap" required>
	                     <div class="layui-form-label form-label-wrap">
                                <input type="radio" name="inputType" value="01" title="无">
                         </div>
                         <label data-th-text="#{AssetNameManagement004.fullInput}">全量导入</label>
                  </div>
                  <div class="form-inline-wrap">
                         <div class="layui-form-label form-label-wrap">
                                <input type="radio" name="inputType" value="02" title="无" >
                         </div>
                         <label data-th-text="#{AssetNameManagement004.incInput}">增量导入</label>
                  </div> -->
       </div>
       
       <div class="layui-form-item" style="padding-bottom: 10px;" id="uploadFileId">
                    <label class="layui-form-label form-label-wrap sub-wrap"
                        data-th-text="#{AssetNameManagement004.uploadFile}" style="width: 12%;">选择文件</label>
                    <div class="layui-input-inline input-inline">
                        <div class="upload" id="appendix" required 
                            th:data-data='${attachmentFiles}'
                            data-option="{allowFileType: 'xls|xlsx',callback: '',type: 'drag', muiltiple: false, autoUpload: true}" style="float:left;">
                        </div>
                        <div style="float: right;  padding-left: 46px;">
                        <button type="button" class="layui-btn common-btn" id="AssetNameManagement004_btn_upLoadFile">开始上传</button>
                        <br>
                        <div>
                         <a style="text-decoration: underline; color: #337ab7;" id="tplDowload"
                                href="javascript:void(0);">模板下载</a>
                        </div>
                        </div>
                        <!-- <div style="padding-top: 10px">
                            <a style="text-decoration: underline; color: #337ab7;" id="tplDowload"
                                href="javascript:void(0);">模板下载</a>
                        </div> -->
                    </div>
          </div>
          <br>
         <td align="left">合计</td>
         <td align="left">&nbsp;</td>
         <td align="center">&nbsp;</td>
         <td align="right">&nbsp;</td>
         <td align="left">新增:</td>
         <td align="right">
           <span id="addNum" name="addNum"></span>
         </td>
         <td align="left">&nbsp;</td>
         <td align="left">&nbsp;</td>

           <span id="editNum" name="editNum"></span>
         </td>
         <td align="right">&nbsp;</td>
         <td align="right">&nbsp;</td>
         <td align="right">&nbsp;</td>
         <td align="right">
             <a id="AssetNameManagement004_btn_adj" class="layui-btn layui-btn-sm " data-ignore=true data-th-text="调整后结果预览">调整后结果预览</a>

         <div>
            <table class="layui-table" th:id="dataTable"
                       th:name="dataTable"></table>
        </div>
        <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
            <div class="text-center">
                <a class="layui-btn layui-btn-sm btn-save" th:id="AssetNameManagement004_btn_save" data-th-text="#{SysCommon.save}">保存</a>
                <a th:id="AssetNameManagement004_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>

</div>
