<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{MarketRiskStressTestView002}">市场风险-压力测试报告</title>
    <style type="text/css">
		.layui-table-cell {
			/* 表头文字居中  */
			text-align: center;
		}
</style>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid' style="padding:0px">
        <div class="form-button-area">
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                	<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="压力测试编号或名称">压力测试编号或名称</label>
                        <div class="layui-input-inline input-inline">
                            <select   type="text" id="testId" name="testId"
									class="layui-input form-input input-select" 
									allowClear="true" placeholder="请输入压力测试编号或名称" data-th-initValue='${testId}'
									data-th-data-url="@{/invest/risk/stresstestmanage/marketriskstresstestview/MarketRiskStressTestView001/selectTestListMap}">
							</select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="情景编号和名称">情景编号和名称</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="sceneIdAndsceneName" name="sceneIdAndsceneName"
									class="layui-input form-input" readonly="readonly"
									allowClear="true" data-th-value='${sceneIdAndsceneName}' style="color: #2693FF;cursor:pointer;"/>
							</div>
					</div>
                </div>
                <hr style="height:2px;border:none;border-top:2px #185598;" />
            	<span style="font-style: inherit;margin-top: 20px;font-weight:bold;">压力测试概要信息：</span>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable" data-th-text="适用产品">适用产品</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="openMode" name="openMode"
                                        class="layui-input form-input"  disabled="disabled"
                                        allowClear="true" 
                                        data-th-value='${openModeStr}'>
                                </input>
                            </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="压力测试执行时间">压力测试执行时间</label>
                        <div class="layui-input-inline input-inline">
                            <input    type="text" id="startTime" name="startTime"
                               class="layui-input form-input" disabled="disabled"
                               data-th-value='${startTime}'>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="分析基准日期">分析基准日期</label>
                        <div class="layui-input-inline input-inline">
                            <input    type="text" id="baseDate" name="baseDate"
                               class="layui-input form-input" disabled="disabled"
                               data-th-value='${baseDate}'>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
               <!--  </div>
                <div class="layui-form-item"> -->
                	 <!-- <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="分析开始日期">分析开始日期</label>
                        <div class="layui-input-inline input-inline">
                            <input    type="text" id="analysisVDate" name="analysisVDate"
                               class="layui-input form-input" disabled="disabled"
                               data-th-value='${analysisVDate}'>
                        </div>
                    </div> -->
                	 <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="分析日期">分析日期</label>
                        <div class="layui-input-inline input-inline">
                            <input    type="text" id="analysisMDate" name="analysisMDate"
                               class="layui-input form-input" disabled="disabled"
                               data-th-value='${analysisMDate}'>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="备注">备注</label>
                        <div class="layui-input-inline input-inline">
                    		<input    type="text" id="remark" name="remark"
                               class="layui-input form-input" disabled="disabled"
                               data-th-value='${remark}'>
                        </div>
                    </div>
                </div>
             </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
	<style type="text/css">
		th[data-field^='riskScene']{
			background:#ffd3a8;
		}
		th[data-field^='scenePrice']{
			background:#ffd3a8;
		}
		th[data-field^='priceChange']{
			background:#ffd3a8;
		}
		th[data-field^='sceneMarVal']{
			background:#ffd3a8;
		}
		th[data-field^='allAssetsRate2']{
			background:#ffd3a8;
		}
		th[data-field^='amountOfDam']{
			background:#ffd3a8;
		}
		th[data-field^='proAndLosRat']{
			background:#ffd3a8;
		}
	</style>
 <script data-th-inline="javascript" type="text/javascript">
        var entity1 = [[${entity1}]];
        
        var testId = [[${testId}]];
        var testName = [[${testName}]];
        var openMode = [[${openMode}]];
        var openModeStr = [[${openModeStr}]];
        var startTime = [[${startTime}]];
        var baseDate = [[${baseDate}]];
        var analysisVDate = [[${analysisVDate}]];
        var analysisMDate = [[${analysisMDate}]];
        var remark = [[${remark}]];
       
    </script>
    <script data-th-src="@{/js/invest/risk/stresstestmanage/marketriskstresstestview/MarketRiskStressTestView002.js}" type="text/javascript"></script>
</div>
</body>
</html>
