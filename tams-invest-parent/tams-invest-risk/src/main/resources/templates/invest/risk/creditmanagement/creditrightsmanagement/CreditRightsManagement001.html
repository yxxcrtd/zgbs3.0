<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
<title data-th-text="#{CreditRightsManagement001}">风险权数管理</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area">
            <a id="CreditRightsManagement001_btn_add" class="layui-btn layui-btn-sm btn-create"
                data-th-text="#{SysCommon.create}">新建</a>
            <a id="CreditRightsManagement001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
            data-th-text="#{SysCommon.delete}">删除</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area ">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{CreditRightsManagement001.assetTypeOne}">资产一级分类</label>
                        <div class="layui-input-inline input-inline">
                                <select id="assetTypeOne" name="assetTypeOne"
	                                class="layui-input form-input input-select" allowClear="true"
	                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
	                                data-th-initValue="${entity?.assetTypeOne}"
	                                data-th-data-result='${PINAN_ASSET_TYPE}'
	                                childrenIds="assetTypeTwo">
                                </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{CreditRightsManagement001.effDate}">生效日</label>
                        <div class="layui-input-inline input-inline">
                            <input id='effDate' name='effDate'
                                class="layui-input form-input input-dateRangeSelect" placeholder="请选择、支持区间"
                                data-th-placeholder="#{SysCommon.dateInterval}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{CreditRightsManagement001.assetTypeTwo}">资产二级分类</label>
                        <div class="layui-input-inline input-inline">
                            <select id="assetTypeTwo" name="assetTypeTwo"
	                            class="layui-input form-input input-select" allowClear="true"
	                            placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
	                            data-th-initValue="${entity?.assetTypeTwo}"
	                            data-th-data-result='${ASSET_SEC_TYPE}'
	                            parentIds="assetTypeOne"
	                            formatoption=true>
	                        </select>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/risk/creditmanagement/creditrightsmanagement/CreditRightsManagement001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
