<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{CeAsset001}">机构授信</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				
				<a id="CeAsset001_btn_add" class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a>
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
					
					     <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4" th:if="${cemodel} eq '02'">
		                    <label class="layui-form-label form-lable"
								data-th-text="#{CeAsset001.pflshName}">批复号名称</label>
		                    <div class="layui-input-inline input-inline">
		                      	<input type="text" name="pflshName" data-th-placeholder="#{SysCommon.placeholder}" id="pflshName"
								class="layui-input form-input input-text" />	
		                    </div>
		                </div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4" th:if="${cemodel} eq '01'">
							<label class="layui-form-label form-lable"
								data-th-text="#{CeAsset001.assetName}">资产名称</label>
							<div class="layui-input-inline input-inline">
                             <select  id="customerId" name="customerId" 
                                     class="layui-input form-input input-select" formatoption = "false" 
                                     th:placeholder="#{SysCommon.placeholder}" th:data-url="@{/invest/risk/creditmanagement/ceasset/CeAsset001/getFinprodMarketIds}"
                                     allowClear="true" ></select>
		                    </div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{CeAsset001.pflsh}">批复号</label>
							<div class="layui-input-inline input-inline">
								<input type="text" name="pflsh" data-th-placeholder="#{SysCommon.placeholder}" id="pflsh"
							class="layui-input form-input input-text" />		
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{CeAsset001.vdate}">生效日</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="vdate" name="vdate"
									class="layui-input form-input input-dateRangeSelect"
									placeholder="请选择、支持区间"
									data-th-placeholder="#{SysCommon.dateInterval}" />
							</div>
						</div>
					</div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
                            <label class="layui-form-label form-lable"
                                data-th-text="#{CeAsset001.creditObj}">授信对象</label>
                            <div class="layui-input-inline input-inline">
                                <select  type="text" name="creditObj"class="layui-input form-input input-select" 
                                data-th-data-result='${CREDIT_OBJ}' 
                                allowClear="true" data-th-placeholder="#{SysCommon.placeholder}" id="creditObj"
                                ></select>    
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
                            <label class="layui-form-label form-lable"
                                data-th-text="#{CeAsset001.creditShareAmt}">授信总份额（亿份）</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" name="creditShareAmt" data-th-placeholder="#{SysCommon.placeholder}" id="creditShareAmt"
                                class="layui-input form-input input-text text-number" />    
                            </div>
                        </div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-label-wrap" data-th-text="#{CeAsset002.holdMaturity}">是否持有至到期</label>
							<div class="layui-input-inline input-inline">
								<select id="holdMaturity" name="holdMaturity" class="layui-input form-input input-select"
									data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${YES_OR_NO}">
								</select>
							</div>
						</div>
                    </div>
				</form>
			</div>

			<div id="singleTableDiv">
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
	    <script data-th-inline="javascript" type="text/javascript">
	    var cemodel=/*[[${cemodel}]]*/'';
		</script>
		<script data-th-src="@{/js/invest/risk/creditmanagement/ceasset/CeAsset001.js}"></script>
	</div>
</body>
</html>
