<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ObjectLimitManage001}">项目额度管理</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				
				<a id="ObjectLimitManage001_btn_add" class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a>
				 <a id="ObjectLimitManage001_btn_delete"
					class="layui-btn layui-btn-sm btn-delete"
					data-th-text="#{SysCommon.delete}">删除</a>	
				<a id="ObjectLimitManage001_btn_import"
					class="layui-btn layui-btn-sm btn-import"
					data-th-text="#{SysCommon.import}">导入</a>		
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								data-th-text="#{ObjectLimitManage001.busiType}">业务分类</label>
							<div class="layui-input-inline input-inline">
		                       <select  id="busiType" name="busiType"
									class="layui-input form-input input-select" formatoption=true 
									data-th-placeholder="#{SysCommon.placeholder}"  
									data-th-data-result="${CUSTOM_ASSET_TYPE_FIVE}">
								</select>
		                    </div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="|#{ObjectLimitManage001.approId}|">审批编号</label>
							<div class="layui-input-inline input-inline">
						     	<input  type="text" id="approId" name="approId" class="layui-input form-input input-lenovoselect" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" 
		                           data-th-data-url="@{/invest/risk/creditrisklimitmanagement/objectlimitmanage/ObjectLimitManage001/getApporId}" 
		                          data-idfield="code" data-keyfield="name" data-th-data-effectivefieldsalias='|{"code":"#{ObjectLimitManage001.approId}"}|'>																													                            	
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								data-th-text="#{LimitManage001.customerName}">主体名称</label>
							<div class="layui-input-inline input-inline">
		                       <select  id="customerName" name="customerName"
									class="layui-input form-input input-select" formatoption=true 
									data-th-placeholder="#{SysCommon.placeholder}"  
									th:data-url="@{/invest/risk/creditrisklimitmanagement/objectlimitmanage/ObjectLimitManage001/getInstitutionName}" allowClear="true"								
									>
								</select>
		                    </div>
						</div>
			     	</div>
					<div class="layui-form-item">		
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								data-th-text="#{ObjectLimitManage001.vdate}">生效日</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="vdate"
									name="vdate"   class="layui-input form-input input-dateSelect"  
									allowClear="true"  placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									>							
								</input>
		                    </div>
						</div>
						<div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{LimitManage001.status}">有效状态</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="codeStatus" name="codeStatus"
                                class="layui-input form-input input-select" data-th-data-result='${LIMIT_STATUS_VALID}'
                                allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                formatoption="true">
                            </select>
                        </div>
                    </div>						
					</div>
				</form>
			</div>

			<div id="singleTableDiv">
				<table class="layui-table" id="dataTable2"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
	    <script data-th-inline="javascript" type="text/javascript">
		  
		</script>
		<script data-th-src="@{/js/invest/risk/creditrisklimitmanagement/objectlimitmanage/ObjectLimitManage001.js}"></script>
	</div>
</body>
</html>
