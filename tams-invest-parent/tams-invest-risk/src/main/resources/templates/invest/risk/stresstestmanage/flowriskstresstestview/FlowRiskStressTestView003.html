<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
	<head>
		<title data-th-text="#{FlowRiskStressTestView003}">流动性风险-现金流详情</title>
		<style type="text/css">
					#FlowRiskStressTestView003_btn_search{display:none}
		</style>
	
	</head>
	
	<body>
		<div layout:fragment="content">
			<div class="form-button-area" filter="false" search="false"></div>
			<div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
            	<div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="压力测试名称">压力测试名称</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="testName" name="testName" disabled
                               class="layui-input form-input" data-th-value='${testName}'>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="压力测试编号">压力测试编号</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="flowTestId" name="flowTestId" disabled
                               class="layui-input form-input" data-th-value='${flowTestId}'>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="压力测试执行时间">压力测试执行时间</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="startTime" name="startTime" disabled
                               class="layui-input form-input" data-th-value='${startTime}'>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="产品编号">产品编号</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="finprodId" name="finprodId" disabled
                               class="layui-input form-input" data-th-value='${finprodId}'>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="产品名称">产品名称</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="finprodName" name="finprodName" disabled
                               class="layui-input form-input" data-th-value='${finprodName}'>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="分析基准日期">分析基准日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="baseDate" name="baseDate" disabled
                               class="layui-input form-input" data-th-value='${baseDate}'>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="分析开始日期">分析开始日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="testStartDate" name="testStartDate" disabled
                               class="layui-input form-input" data-th-value='${testStartDate}'>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="分析结束日期">分析结束日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="testEndDate" name="testEndDate" disabled
                               class="layui-input form-input" data-th-value='${testEndDate}'>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        	<div>
           		 <table class="layui-table" id="dataTable"></table>
        	</div>
		</div>
		<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
        		var entity1 = [[${entity1}]];
        		var flowTestId = [[${flowTestId}]];
        		var testName = [[${testName}]];
        		var startTime = [[${startTime}]];
        		
        		var finprodId = [[${finprodId}]];
        		var finprodName = [[${finprodName}]];
        		var baseDate = [[${baseDate}]];
        		var testStartDate = [[${testStartDate}]];
        		var testEndDate = [[${testEndDate}]];
        		var cashFlowDetail = [[${cashFlowDetail}]];
        </script>
			<script data-th-src="@{/js/invest/risk/stresstestmanage/flowriskstresstestview/FlowRiskStressTestView003.js}" type="text/javascript"></script>
		</div>
	</body>
</html>
