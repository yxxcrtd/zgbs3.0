<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{CePreOccupancyManagement001}">预占用管理</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area">
            <a id="CePreOccupancyManagement001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
            <a id="CePreOccupancyManagement001_btn_delete" class="layui-btn layui-btn-sm btn-delete btn-default" data-th-text="#{SysCommon.delete}">删除</a>
        </div>
		<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								data-th-text="#{CePreOccupancyManagement001.institutionName}">机构名称</label>
							<div class="layui-input-inline input-inline">
		                       <select  id="customerId" name="customerId"
                             class="layui-input form-input input-select" 
                             th:placeholder="#{SysCommon.placeholder}"
                             th:data-url="@{/invest/risk/creditmanagement/ceorg/CeOrg001/getInstitutionName}" allowClear="true"
                             formatoption="true"
                             th:initValue="${entity?.institutionId}"></select>
		                    </div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{CePreOccupancyManagement001.vdate}">生效日</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="vdate" name="vdate"
									class="layui-input form-input input-dateRangeSelect"
									placeholder="请选择、支持区间"
									data-th-placeholder="#{SysCommon.dateInterval}" />
							</div>
						</div>
					</div>
				</form>
			</div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/risk/creditmanagement/preoccupancymanagement/CePreOccupancyManagement001.js}" type="text/javascript"></script>
</div>
</body>
</html>
