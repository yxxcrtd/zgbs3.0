<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RskValSumname003}">新建申报附件方案</title>
<style>
.col-label{
	width:20%;
}
.val-radio-wrap .layui-form-radio{
	margin:0;
	line-height:normal;
}
.val-radio-wrap .layui-form-radio i{
    font-size: 20px;
    color:#4893e6
}
</style>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
			<div class="pro-module-wrapper pro-module-base">
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title">
						<span class="title-des">源</span>
						<i class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="pro-module-item">
						     <div class="layui-form-item">
						     	<div style="display: none">
									<input type="text" id="id" name="id" data-th-value="${entity?.id}"/>
								</div>
							     <label class="layui-form-label form-label-wrap col-label" data-th-text="#{RskValSumname003.sumName}"></label>
	                                    <div class="layui-input-inline input-inline">
											<input id="sumName" name="sumName" data-th-value='${entity?.sumName}'
											type="text" class="layui-input form-input" data-textrange="0"
											placeholder="请输入内容" required="required" data-fixtype="4" th:maxlength="60">
										</div>	
						     </div>
						     <!-- <div class="layui-form-item">
						     <div style="display: none">
									<input type="text" id="id" name="id" data-th-value="${entity?.id}"/>
								</div>
							     <label class="layui-form-label form-label-wrap col-label" data-th-text="#{RskValSumname003.srcColDataType}">类型</label>
	                                    <div class="layui-input-inline input-inline">
											<select 
											id="srcColDataType" name="srcColDataType" class="layui-input form-input input-select"
                            				data-th-data-result='${VAL_INDEX_TYPE}' formatoption="true" required="required"
                            				allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                            				data-th-initValue='${entity?.srcColDataType}'>
											</select>
										</div>
						     </div> -->
						</div>
					</div>
				</div>
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title">
						<span class="title-des">目标</span>
						<i class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="pro-module-item">
						     <div class="layui-form-item">
							     <label class="layui-form-label form-label-wrap col-label" data-th-text="#{RskValSumname003.sumCode}">指标</label>
	                                    <div class="layui-input-inline input-inline">
											<select 
											id="sumCode" name="sumCode" class="layui-input form-input input-select"
                            				 formatoption="true" required="required" allowClear="true" placeholder="请输入内容" 
                            				 data-th-placeholder="#{SysCommon.placeholder}"
                            				data-th-initValue='${entity?.sumCode}'
                            				data-th-data-url="@{/invest/risk/penetrationmanagement/rskvalsumname/RskValSumname003/selecctRskValtblSubjectCodeList}">
											</select>
										</div>
						     </div>
						</div>
					</div>
				</div>
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title">
						<span class="title-des">其它</span>
						<i class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="pro-module-item">
						     <div class="layui-form-item">
							     <label class="layui-form-label form-label-wrap col-label" data-th-text="#{RskValSumname003.hasNextIndex}">指标</label>
	                                    <div class="layui-input-inline input-inline val-radio-wrap">
											<!-- <input type="text" id="hasNextIndex" name="hasNextIndex"
												class="layui-input form-input input-checkbox"
												data-th-data-result='${HASNEXTINDEX}' required="required"
												data-th-initValue="${entity?.hasNextIndex}"/> -->
												<input type="radio" id="hasNextIndex" name="hasNextIndex" value="N" title="无" 
												lay-filter="hasNextIndexFilterN" th:checked="${entity?.hasNextIndex ne 'Y'}">
										</div>
						     </div>
						     <div class="layui-form-item">
	                                    <div class="layui-input-inline input-inline val-radio-wrap" style="padding-left: 21.2%;">
											<!-- <input type="text" id="hasNextIndex" name="hasNextIndex"
												class="layui-input form-input input-checkbox"
												data-th-data-result='${HASNEXTINDEX}' required="required"
												data-th-initValue="${entity?.hasNextIndex}"/> -->
												 <input type="radio" id="hasNextIndex" name="hasNextIndex" value="Y" title="指定类型" 
												 lay-filter="hasNextIndexFilterY" th:checked="${entity?.hasNextIndex eq 'Y'}">
										</div>
						     </div>
						     <div class="layui-form-item">
	                                    <div class="layui-input-inline input-inline" style="padding-left: 21.2%;">
											<select 
											id="nextIndexType" name="nextIndexType" class="layui-input form-input input-select"
                            				data-th-data-result='${VAL_INDEX_TYPE}' formatoption="true" 
                            				allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                            				data-th-initValue='${entity?.nextIndexType}' disabled>
											</select>
										</div>
						     </div>
						</div>
					</div>
				</div>
			</div>
		</form>
		<div class="layui-col-md12" style="margin-top: 20px;">
			<div class="text-center">
				<a id="RskValSumname003_btn_submit"
				   class="layui-btn layui-btn-sm btn-submit"
				   data-th-text="#{SysCommon.submit}">提交</a>
				<a id="RskValSumname003_btn_cancel"
					class="layui-btn layui-btn-sm btn-cancel"
					data-th-text="#{SysCommon.cancel}">取消</a>
			</div> 
		</div>
	</div>
	<div layout:fragment="script">
		<script th:inline="javascript" type="text/javascript">
            var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'';
			var hasNextIndex = /*[[${entity?.hasNextIndex}]]*/'';
			var IS_MAP = /*[[${IS_MAP}]]*/'';
        </script>
		<script data-th-src="@{/js/invest/risk/penetrationmanagement/rskvalsumname/RskValSumname003.js}"
			type="text/javascript">
		</script>
	</div>
</body>
</html>
