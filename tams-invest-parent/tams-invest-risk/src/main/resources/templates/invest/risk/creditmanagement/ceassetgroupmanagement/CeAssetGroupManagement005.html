<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title data-th-text="#{CeAssetGroupManagement005}">移动至新批复</title>
    <style>
        .form-inline-wrap {
            display: inline-block;
            float: left;
            width: 50%;
            padding-top: 10px;
        }
    </style>
</head>

<body>


<div layout:fragment="content">
    <!-- 画面信息 -->
    <div class='layui-fluid' id="CeAssetGroupManagement005_DIV">
        <div class="pro-module-container">
            <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
                <div class="pro-module-wrapper pro-module-base step" title="基本信息">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <div class="pro-module-item pro-item-wrap">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">批复号</label>
                                        <div class="layui-input-inline input-inline">
                                            <input id="pflsh" name="pflsh" allowClear="true"
                                                   th:value="${entity?.pflsh}"
                                                   class="layui-input form-input" />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style="width: 30%;padding-left: 50px">
                                        <a id="CeAssetGroupManagement005_btn_search" class="layui-btn layui-btn-sm btn-search"
                                           data-th-text="#{SysCommon.search}">查询</a>
                                    </div>

                                </div>

                            </div>
                        </div>
                        <div class="pro-module-item pro-item-wrap">
                            <table class="layui-table" id="dataTable"></table>
                        </div>

                        <div class="row text-center stepbar">
                            <a id="CeAssetGroupManagement005_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                               data-th-text="#{SysCommon.submit}">提交</a>
                            <a id="CeAssetGroupManagement005_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                               data-th-text="#{SysCommon.cancel}">取消</a>
                        </div>
                    </div>
                </div>
            </form>
        </div>

    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var DATALIST = /*[[${DATALIST}]]*/''; //
        var PAGELIST = /*[[${PAGELIST}]]*/''; //
    </script>

    <script data-th-src="@{/js/invest/risk/creditmanagement/ceassetgroupmanagement/CeAssetGroupManagement005.js}">
    </script>
</div>
</body>
</html>
