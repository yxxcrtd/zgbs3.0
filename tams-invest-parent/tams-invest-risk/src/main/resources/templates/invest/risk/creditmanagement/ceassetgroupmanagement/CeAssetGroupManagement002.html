<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{CeAssetGroupManagement002}">资产系列新建</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <input id="workflowId" name="workflowId" data-th-value="${workflowId}" type="hidden">
        <input id="seqno" name="seqno" data-th-value="${entity?.seqno}" type="hidden">
        <div class="layui-form-item">
            <div>
                <label class="layui-form-label form-label-wrap"
                       data-th-text="#{CeAssetGroupManagement002.name}" style="width: 25%">系列名称</label>
                <div class="layui-input-inline input-inline" style="width: 70%!important;">
                    <input type="text" id="CeAssetGroupManagement002_assetpoolName" name="assetpoolName" data-th-value='${entity?.assetpoolName}'
                           class="layui-input form-input" placeholder="请输入，标签名称唯一不可重复" required="required"/>
                </div>
            </div>
        </div>
    </form>
    <div class="layui-col-md10" style="margin-top: 40px;">
        <div class="text-center">
        	<a id="CeAssetGroupManagement002_btn_save"
               class="layui-btn layui-btn-sm btn-save"
               data-th-text="#{SysCommon.save}">保存</a>
            <a id="CeAssetGroupManagement002_btn_submit"
               class="layui-btn layui-btn-sm btn-submit"
               data-th-text="#{SysCommon.submit}">提交</a>
            <a id="CeAssetGroupManagement002_btn_cancel"
               class="layui-btn layui-btn-sm btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
    	var workflowId = /*[[${workflowId}]]*/ ;
    </script>
    <script data-th-src="@{/js/invest/risk/creditmanagement/ceassetgroupmanagement/CeAssetGroupManagement002.js}"
            type="text/javascript">
    </script>
</div>
</body>
</html>
