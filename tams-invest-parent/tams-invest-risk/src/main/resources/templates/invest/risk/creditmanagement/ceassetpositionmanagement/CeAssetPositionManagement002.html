<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{CeAssetPositionManagement002}">估值表导入</title>
    <style>
    .rsk-line{
     width: 79%;
     }
     .rsk-line .layui-upload-drag{
     width: 100%;
     padding:0;
     }
     .rsk-dl-wrap{
     overflow: hidden;
     padding:10px 0 5px 0;
     }
     .rsk-dl{
     float:left;
     }
     .rsk-dl dt{
     font-size: 14px;
     color: #444;
     float: left;
     }
     .rsk-dl dd{
     font-size: 14px;
     color: #444;
     float: left;
     line-height: 20px;
     padding-left: 10px;
     }
     .rsk-dl-item{
     padding-left: 30px;
     }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="joyin-form-wrap curr-form">
        <form class="layui-form"  id="submitForm" >
            <div class="layui-form-item" style="padding-bottom: 8px;">
                    <!-- <div class="layui-inline layui-col-xs8 layui-col-sm8 layui-col-md8 layui-col-lg8">
                    <label class="layui-form-label form-lable" data-th-text="#{CeAssetPositionManagement002.enclosure}" style="width: 18%;">Excel模板</label>
                    <div class="layui-inline rsk-line">
                        <div class="upload" id="valtable" required
                        data-option="{allowFileType: 'xls|xlsx', autoUpload: true, callback: 'CeAssetPositionManagement002.uploadCallback'}">
                        </div>
                    </div>
                    </div> -->
                    <div class="layui-inline layui-col-xs8 layui-col-sm8 layui-col-md8 layui-col-lg8">
                    <label class="layui-form-label form-lable" data-th-text="#{CeAssetPositionManagement002.enclosure}" style="width: 18%;">Excel模板</label>
                    <div class="layui-inline rsk-line">
                        <div class="upload" id="valtable" required
                        data-option="{allowFileType: 'xls|xlsx', callback: 'CeAssetPositionManagement002.uploadCallback'}">
                        </div>
                    </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <div class="layui-input-inline input-inline">
                        <a id="CeAssetPositionManagement002_btn_download" class="layui-btn layui-btn-sm form-input-text" style="width: 90px;" href="javascript:void(0);"><span>下载模板</span></a>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
		<table class="layui-table" id="importResultTable" style = "display:none;"></table>
	</div>
    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:60px 0;">
        <div class="text-center">
            <a id="CeAssetPositionManagement002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="CeAssetPositionManagement002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/risk/creditmanagement/ceassetpositionmanagement/CeAssetPositionManagement002.js}"> </script>
</div>
</body>
</html>
