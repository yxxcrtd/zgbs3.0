<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{CePreOccupancyManagement002}">预占用管理新建</title>
<style type="text/css">
.pro-module .layui-table-view{
border:1px solid #e6e6e6;
padding:0px
}
</style>
<script data-th-inline="javascript" type="text/javascript">
var entity=/*[[${entity}]]*/'';
var creditQuoteItem=/*[[${creditQuoteItem}]]*/'';
var getCeLimitKindUrl = /*[[@{/invest/risk/creditmanagement/ceorg/CeOrg002/getAllCeOrgQuote}]]*/'';
</script>
</head>
<body>
	<div layout:fragment="content">
			<form class="layui-form joyin-form-wrap" id="cePreOccupancyManagementForm">
			<div class="pro-module-wrapper pro-module-base" th:title="#{CePreOccupancyManagement002.baseInfo}">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" th:text="#{CePreOccupancyManagement002.baseInfo}">基本信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
									<input type="hidden" id="seqno" name="seqno" data-th-value="${entity?.seqno}" >
									<input id="workflowId" name="workflowId" data-th-value="${workflowId}" type="hidden">
									<div class="pro-module-item">
										<div class="layui-form-item">
							                <div class="form-inline-wrap">
							                    <label class="layui-form-label form-label-wrap" data-th-text="#{CePreOccupancyManagement002.institutionName}">机构名称</label>
							                    <div class="layui-input-inline input-inline">
							                         <select required  id="customerId" name="customerId"
							                             class="layui-input form-input input-select" 
							                             th:placeholder="#{SysCommon.placeholder}"
							                             th:data-url="@{/invest/risk/creditmanagement/ceorg/CeOrg001/getInstitutionName}" allowClear="true"
							                             formatoption="true"
							                             th:initValue="${entity?.customerId}"></select>
							                    </div>
							                </div>
							                 <div class="form-inline-wrap">
							                    <label class="layui-form-label form-label-wrap" data-th-text="#{CePreOccupancyManagement002.creditTotalAmt}">授信总额度（亿元）</label>
							                    <div class="layui-input-inline input-inline">
							                       <input required type="text" id="creditAmt" name="creditAmt"
							                            class="layui-input form-input text-number" placeholder="请输入内容"
							                              th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.creditAmt}">
							                    </div>
							                </div>
							               <div class="form-inline-wrap">
							                    <label class="layui-form-label form-label-wrap" data-th-text="#{CePreOccupancyManagement002.vdate}">占用生效日</label>
							                    <div class="layui-input-inline input-inline">
							                        <input required  type="text" id="vdate" name="vdate"
						                                   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
						                                   th:placeholder="#{SysCommon.placeholder}"
						                                   th:value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'>
							                    </div>
							                </div>
							              
						            	</div>
						            	<div class="layui-form-item">
							                  <div class="form-inline-wrap">
							                    <label class="layui-form-label form-label-wrap" data-th-text="#{CePreOccupancyManagement002.mdate}">占用到期日</label>
							                    <div class="layui-input-inline input-inline">
							                       <input required  type="text" id="mdate" name="mdate"
						                                   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
						                                   th:placeholder="#{SysCommon.placeholder}"
						                                   th:value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'>
							                    </div>
							                </div>
						            	</div>
						            	 <div class="layui-form-item">
		                                    <div class="form-inline-wrap" style="width: 100%;">
		                                        <label class="layui-form-label form-label-wrap"
		                                            data-th-text="#{CePreOccupancyManagement002.remark}" style="width: 11.9%;">备注</label>
		                                        <div class="layui-input-inline input-inline" style="width: 85.6% !important;">
		                                            <textarea id="remark" name="remark" th:value="${entity?.remark}"
		                                                data-th-text="${entity?.remark}" class="layui-textarea"
		                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"></textarea>
		                                        </div>
		                                    </div>
                                		</div>
					            	</div>
            				</div>
            			</div>
            	</div>
            
            	 <div class="pro-module-wrap">
                	<div class="pro-module">
                    	<h3 class="pro-module-title"><span class="title-des" th:text="#{CePreOccupancyManagement002.creditQuoteType}">授权品种</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                            <div style="width:92%;margin:8px 50px 8px 50px;height:250px;overflow: hidden">
	                            <table class="layui-table" id="dataTable"></table>
							</div>
                     </div>
                 </div>
                 
                   <!-- 附件信息 -->
               <!--  <div class="page-component" th:data-path="@{/component/core/FileCommon/init}" th:data-params="|{businessId:'${entity?.seqno?:''}'}|"></div> -->
                            
			</form>
			<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
            <div class="text-center">
                <a id="CePreOccupancyManagement002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                <a id="CePreOccupancyManagement002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="CePreOccupancyManagement002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
		    var workflowId = /*[[${workflowId}]]*/'';
		    var isTodoList = /*[[${isTodoList}]]*/'';
		</script>
		<script data-th-src="@{/js/invest/risk/creditmanagement/preoccupancymanagement/CePreOccupancyManagement002.js}" type="text/javascript"></script>
	</div>
</body>
</html>
