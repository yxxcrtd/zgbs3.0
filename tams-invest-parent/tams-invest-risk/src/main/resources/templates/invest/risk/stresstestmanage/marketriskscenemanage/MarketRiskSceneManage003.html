<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{MarketRiskSceneManage003}">历史情景详细信息展示-市场性风险压力测试</title>
</head>
<body>
<div layout:fragment="content" style="">
<div style="height: calc(100% - 100px);">
	<div class="form-button-area" filter="false" search="false"></div>
	<div class="joyin-form-wrap joyin-filter-form condition-area">
		<form class="layui-form joyin-form-wrap pro-module-form" id="marketRiskSceneManage003Form">
			<div class="layui-row" style="padding-top:10px">
				<div class="layui-col-xs4 layui-col-sm4 layui-col-md4">
					<div class="layui-row">
						<div class="layui-col-xs4 layui-col-sm4 layui-col-md4">
							<label class="layui-form-label" style="padding: 3px 0px;width:92%;">情景编号</label>
						</div>
						<div class="layui-col-xs8 layui-col-sm8 layui-col-md8" style="padding: 3px 0px;">
							<input type="text" id="sceneId" name="sceneId" disabled 
								class="layui-input form-input" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-value='${entity?.sceneId}'>
						</div>
					</div>
				</div>
				<div class="layui-col-xs4 layui-col-sm4 layui-col-md4">
					<div class="layui-row">
						<div class="layui-col-xs4 layui-col-sm4 layui-col-md4">
							<label class="layui-form-label" style="padding: 3px 0px;width:92%;">情景名称</label>
						</div>
						<div class="layui-col-xs8 layui-col-sm8 layui-col-md8" style="padding: 3px 0px;">
							<input type="text" id="sceneName" name="sceneName" disabled
								class="layui-input form-input" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-value='${entity?.sceneName}'>
						</div>
					</div>
				</div>
				<div class="layui-col-xs4 layui-col-sm4 layui-col-md4">
					<div class="layui-row">
						<div class="layui-col-xs4 layui-col-sm4 layui-col-md4">
							<label class="layui-form-label " style="padding: 3px 0px;width:92%;">情景开始时间</label>
						</div>
						<div class="layui-col-xs8 layui-col-sm8 layui-col-md8" style="padding: 3px 0px;">
							<input type="text" id="stDate" name="stDate" disabled
								class="layui-input form-input" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-value='${stDate}'>
						</div>
					</div>
				</div>
			</div>
			<div class="layui-row">
				<div class="layui-col-xs4 layui-col-sm4 layui-col-md4">
					<div class="layui-row">
						<div class="layui-col-xs4 layui-col-sm4 layui-col-md4">
							<label class="layui-form-label" style="padding: 3px 0px;width:92%;">情景结束时间</label>
						</div>
						<div class="layui-col-xs8 layui-col-sm8 layui-col-md8" style="padding: 3px 0px;">
							<input type="text" id="edDate" name="edDate" disabled
								class="layui-input form-input" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-value='${edDate}'>
						</div>
					</div>
				</div>
				<div class="layui-col-xs8 layui-col-sm8 layui-col-md8">
					<div class="layui-row">
						<div class="layui-col-xs2 layui-col-sm2 layui-col-md2">
							<label class="layui-form-label" style="padding: 3px 0px;width:92%;">备注</label>
						</div>
						<div class="layui-col-xs10 layui-col-sm10 layui-col-md10" style="padding: 3px 0px;">
							<textarea id="remark" name="remark" disabled
		                        data-th-text="${entity?.remark}"
		                        class="layui-textarea" placeholder=""
		                        data-th-placeholder="#{SysCommon.placeholder}">
		                    </textarea>
						</div>
					</div>
				</div>
			</div>
			<div class="layui-row">
				
			</div>
			
		</form>
	</div>
	<div>
		<table class="layui-table" id="dataTable" name="dataTable"></table>
	</div>
</div>
<div class="layui-layer-btn layui-layer-btn-c" style="padding: 10px 15px 0px;"><a class="layui-layer-btn0" id="comfirmBtn">确定</a></div>
</div>
<div layout:fragment="script">
	<style type="text/css">
		.pro-module .layui-table-view{
		    padding: 0px!important;
		    border: 0;
		}
		input[disabled], textarea[disabled]{
			background:white;
		}
		/* .layui-table-body{
			overflow:hidden!important
		} */
    </style>
   <script th:inline="javascript" type="text/javascript">
	 	var entity=/*[[${entity}]]*/'';
	 	var sceneId=/*[[${sceneId}]]*/'';
	 	var origin=/*[[${origin}]]*/'';
    </script>  
    <script data-th-src="@{/js/invest/risk/stresstestmanage/marketriskscenemanage/MarketRiskSceneManage003.js}" type="text/javascript"></script>
</div>
</body>
</html>
