<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{OrgNameManagement006}"></title>
    <style>
        .col-label{
            width: 23%;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
        <input type="text" id="id" name="id" data-th-value="${entity?.id}" hidden/>
        <div class="pro-module-wrapper pro-module-base">
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <label class="layui-form-label form-label-wrap col-label" data-th-text="#{OrgNameManagement003.listDetailName}">资产代码</label>
                            <div class="layui-input-inline input-inline">
                                <input id="listDetailName" name="listDetailName" data-th-value='${entity?.listDetailName}'
                                       type="text" class="layui-input form-input"
                                       placeholder="请输入内容">
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <label class="layui-form-label form-label-wrap col-label" data-th-text="#{OrgNameManagement003.listDetailId}">资产名称</label>
                            <div class="layui-input-inline input-inline">
                                <input id="listDetailId" name="listDetailId" data-th-value='${entity?.listDetailId}'
                                       type="text" class="layui-input form-input"
                                       placeholder="请输入内容" >
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
    <div class="layui-col-md12" style="margin-top: 20px;">
        <div class="text-center">
            <a id="OrgNameManagement006_btn_save"
               class="layui-btn layui-btn-sm btn-save"
               data-th-text="#{SysCommon.save}">保存</a>
            <a id="OrgNameManagement006_btn_cancel"
               class="layui-btn layui-btn-sm btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/risk/namelistmanage/orgnamelist/OrgNameManagement006.js}">
    </script>
</div>
</body>
</html>
