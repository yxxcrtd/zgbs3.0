<!DOCTYPE html>
<html
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{AssetNameManagementDetail}">名单明细</title>
    <style>
        .table-wrap .layui-table-view .layui-table-header table thead tr{
            background-color: #d9ecff!important;
        }
        table tr th div.laytable-cell-group{
            text-align: center;
            font-weight: bold;
        }

        .layui-table-view .layui-table th{
            padding:1px 0;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="layui-tab layui-tab-brief" >
        <ul class="layui-tab-title">
            <li class="layui-this">当前有效名单明细</li>
            <li>名单更新履历</li>
        </ul>
        <div class="layui-tab-content" style="height: 100px;">
            <div class="layui-tab-item layui-show">
               <div>
                 <a id="AssetNameManagementDetail_btn_export" class="layui-btn layui-btn-sm btn-export" data-th-text="#{SysCommon.export}">导出</a>
               </div>
                <div class='layui-fluid'>
                    <div class="table-wrap">
                        <table class="layui-table" id="effectTable"></table>
                    </div>
                </div>
            </div>
            <div class="layui-tab-item">
               <div>
                 <a id="AssetNameManagementDetail2_btn_export" class="layui-btn layui-btn-sm btn-export" data-th-text="#{SysCommon.export}">导出</a>
               </div>
                <div class='layui-fluid'>
                    <div class="table-wrap">
                        <table class="layui-table" id="uneffectTable"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var workflowId = /*[[${workflowId}]]*/'';
        var workflowStatus = /*[[${workflowStatus}]]*/'';
        var listId = /*[[${listId}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/risk/namelistmanage/assetnamelist/AssetNameManagementDetail.js}"></script>
</div>
</body>
</html>
