<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{SingleLimitOccupation001}">单笔资产额度校验规则查询</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				
				<a id="SingleLimitOccupation001_btn_add" class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a>
				 <a id="SingleLimitOccupation001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
					data-th-text="#{SysCommon.delete}">删除</a>	
			</div>
			<div  class="joyin-form-wrap joyin-filter-form condition-area curr-form">
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="|#{SingleLimitOccupation001.creditTag}|">额度标签</label>
							<div class="layui-input-inline input-inline">
							 <select  id="creditTag" name="creditTag"
                             class="layui-input form-input input-select"   multiple
                             th:placeholder="#{SysCommon.placeholder}"
                             th:data-url="@{/invest/risk/creditrisklimitmanagement/singlelimitoccupation/SingleLimitOccupation001/getLimitLabel}" allowClear="true"
                             formatoption="false" ></select>	
							</div>
						</div>
                        <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                                   th:text="#{SingleLimitOccupation001.finprodId}">资产代码</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="finprodId" name="finprodId"
                                        class="layui-input form-input input-select" placeholder="请输入内容"
                                        th:placeholder="#{SysCommon.placeholder}" th:data-url="@{/invest/risk/creditrisklimitmanagement/singlelimitoccupation/SingleLimitOccupation001/getFinprodMarketIds}"
                                        allowClear="true" th:initValue="${entity?.finprodId}"></select>
                            </div>
                        </div>
						<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{SingleLimitOccupation001.finprodType1}">资产一级类型</label>
							<div class="layui-input-inline input-inline">
								<select name="finprodType1" id="finprodType1"
									class="layui-input form-input input-select" formatoption=true 
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result="${PINAN_ASSET_TYPE}">
								</select>
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{SingleLimitOccupation001.finprodType2}">资产二级分类
							</label>
							<div class="layui-input-inline input-inline">
								<select id="finprodType2" name="finprodType2"
										class="layui-input form-input input-select"
										allowClear="true" placeholder="请选择"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-data-result="${CUSTOM_ASSET_TYPE_TWO}"
										formatoption=true childrenIds="finprodType3"></select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{SingleLimitOccupation001.finprodType3}">资产三级分类
							</label>
							<div class="layui-input-inline input-inline">
								<select id="finprodType3" name="finprodType3" parentIds="finprodType2"
										class="layui-input form-input input-select"
										allowClear="true" placeholder="请选择"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-data-result="${CUSTOM_ASSET_TYPE_THREE}"
										formatoption=true></select>
							</div>
						</div>
					</div>
				</form>
			</div>

			<div id="singleTableDiv">
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
	    <script data-th-inline="javascript" type="text/javascript">
		  
		</script>
		<script data-th-src="@{/js/invest/risk/creditrisklimitmanagement/singlelimitoccupation/SingleLimitOccupation001.js}"></script>
	</div>
</body>
</html>
