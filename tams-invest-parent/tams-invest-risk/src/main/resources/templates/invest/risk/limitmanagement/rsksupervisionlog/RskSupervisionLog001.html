<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{RskSupervisionLog001}">监督日志查询</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area">
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{RskSupervisionLog001.portfolioName}">组合(包)名称</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" class="layui-input form-input" id="portfolioName" name="portfolioName"/>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                      <label class="layui-form-label form-label-wrap"
                               data-th-text="#{RskSupervisionLog001.logDate}">日期</label>
                      <div class="layui-input-inline input-inline">
                          <input id="supDate" name="supDate" class="layui-input form-input input-dateRangeSelect"
                             placeholder="请选择时间区间" data-th-placeholder="#{SysCommon.dateInterval}">
                      </div>
                  </div>
                  <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                      <label class="layui-form-label form-label-wrap"
                               data-th-text="#{RskSupervisionLog001.rank}">日志级别</label>
                      <div class="layui-input-inline input-inline">
                          <select type="text" id="logLvl" name="logLvl"
                              class="layui-input form-input input-select" data-th-data-result='${LOG_TYPE}'
                              formatoption="true"allowClear="true" placeholder="请输入内容"
                              data-th-placeholder="#{SysCommon.placeholder}">
                          </select>
                      </div>
                  </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/risk/limitmanagement/rsksupervisionlog/RskSupervisionLog001.js}" type="text/javascript"></script>
</div>
</body>
</html>
