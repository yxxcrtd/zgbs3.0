<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">

<body>
<div layout:fragment="content">
    <div class="pro-module-wrap" th:id="detail">
        <div class="form-button-area" filter="false" export="false">
            <a id="OrgNameManagement003_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
        </div>
        <div class="joyin-form-wrap condition-area curr-form">
            <form class="layui-form" th:id="OrgNameManagement003_submitForm">
                <input id="listId" name="listId" data-th-value="${listId}" hidden>
                <input id="listName" name="listName" data-th-value="${listName}" hidden>
                <input id="workflowId" name="workflowId" data-th-value="${workflowId}" hidden>
                <input id="listDetailType" name="listDetailType" data-th-value="${listDetailType}" hidden>
                <input id="operateStyle" name="operateStyle" data-th-value="${operateStyle}" hidden>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-utext="#{OrgNameManagement003.listDetailId}">资产代码</label>
                       <div class="layui-input-inline input-inline">
                                <input  type="text" th:id="listDetailId"
                                       th:name="listDetailId"
                                       class="layui-input form-input" maxlength="50"
                                       placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   th:value="${listDetailId}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               th:text="#{OrgNameManagement003.listDetailName}">资产名称</label>
                        <div class="layui-input-inline input-inline">
                            <input  type="text" th:id="listDetailName"
                                   th:name="listDetailName"
                                   class="layui-input form-input" maxlength="50"
                                   placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   th:value="${listDetailName}">
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="repo-trade-wrap">
            <div class="repo-trade-left" id="historyAssetList">
                <h3 class="repo-trade-title">
                        <!--<span class="title-des"
                              data-th-utext="#{OrgNameManagement003.historyList}">历史名单列表</span>-->
                    <a id="btn_joyin" style="display: none" class="layui-btn layui-btn-sm " data-ignore=true data-th-text="移出">移出</a>
                </h3>
                <table  class="layui-table" th:id="orgNameHistoryDetailList"
                       th:name="assetNameHistoryDetailList"></table>
            </div>
            <!--<div class="repo-trade-middle">
                <a class="trade-btn-wrap trade-add-btn" th:id="btn_joyin" href="javascript:;">
                    <i class="iconfont icon-batch-down"></i>
                    <span data-th-utext="#{OrgNameManagement003.remove}">移出</span>
                </a>
            </div>-->
            <div class="repo-trade-right">
                <fieldset class="layui-elem-field layui-field-title"
                          style="margin-top: 1px;">
                    <legend>操作记录</legend>
                <div class="repo-trade-title" style=" width: 50%; float: left;">
                       <!-- <span class="title-des"
                              data-th-utext="#{OrgNameManagement003.currentList}">履历列表</span>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;-->
                    <span data-th-utext="调整后名单资产数量合计"></span>&nbsp;&nbsp;&nbsp;<span id="sumCount"></span>&nbsp;&nbsp;&nbsp;
                    <span data-th-utext="新增"></span>&nbsp;&nbsp;&nbsp;<span id="addCount"></span>&nbsp;&nbsp;&nbsp;
                    <span data-th-utext="修改"></span>&nbsp;&nbsp;&nbsp;<span id="updateCount"></span>&nbsp;&nbsp;&nbsp;
                    <span data-th-utext="删除"></span>&nbsp;&nbsp;&nbsp;<span id="delCount"></span>&nbsp;&nbsp;&nbsp;
                    <!--<a id="OrgNameManagement003_btn_adj" style="float: right" class="layui-btn layui-btn-sm " data-ignore=true data-th-text="调整后预览">调整后预览</a>-->
                </div>
                <div style="width: 38%;height:25px;float: left;text-align: right;">
                    <a id="OrgNameManagement003_btn_adj" style="float: right;display: block;/* margin-left: 200px; */width: 100px;" class="layui-btn layui-btn-sm " data-ignore="true"><i class="iconfont"></i><span>&nbsp;&nbsp;调整后预览</span>
                    </a>
                </div>
                <table class="layui-table" th:id="orgNameNewDetailList"
                       th:name="orgNameNewDetailList"></table>
                </fieldset>
            </div>
        </div>
        <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
            <div class="text-center">
                <a class="layui-btn layui-btn-sm btn-save" th:id="OrgNameManagement003_btn_save" data-th-text="#{SysCommon.save}">保存</a>
                <a th:id="OrgNameManagement003_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
</div>

<div layout:fragment="script">
    <style>
        .repo-trade-wrap {
            overflow: hidden;
        }

        .repo-trade-left {
            width: 99%;
            float: left;
        }

         .repo-trade-right {
            width: 99%;
            float: left;
        }

        .repo-trade-middle {
            width: 10%;
            float: left;
            margin-top: 90px;
        }

        .trade-btn-wrap {
            display: block;
            text-align: center;
            margin: 0 12px;
            color: #0b72f1;
            padding: 5px 0;
            background: #f5f5f5;
            border: 1px solid #dddddd;
        }

        .trade-btn-wrap:hover {
            color: #0b72f1;
        }

        .trade-btn-wrap i {
            display: block;
        }

        .trade-romove-btn {
            margin-top: 15px;
        }

        .repo-trade-title {
            padding: 5px 0;
        }
    </style>

    <script data-th-inline="javascript" type="text/javascript">
        var entity = eval(/*[[${entity}]]*/'');

        var statusValid = /*[[${statusValid}]]*/'';
        var bizCode = /*[[${bizCode}]]*/'';
        var pageModel = /*[[${pageModel}]]*/'';
        var entityName = /*[[${entityName}]]*/'';
        var workflowId = /*[[${workflowId}]]*/'';
        var operationType = /*[[${operationType}]]*/'';
        var BACK_LEND_DIRECTION_04 = /*[[${BACK_LEND_DIRECTION_04}]]*/'';
        var BACK_LEND_DIRECTION_03 = /*[[${BACK_LEND_DIRECTION_03}]]*/'';
        var RSK_OPERATE_PS_01 = /*[[${RSK_OPERATE_PS_01}]]*/'';
        var RSK_OPERATE_PS_02 = /*[[${RSK_OPERATE_PS_02}]]*/'';
        var RSK_OPERATE_PS_03 = /*[[${RSK_OPERATE_PS_03}]]*/'';
        var RSK_OPERATE_PS_99 = /*[[${RSK_OPERATE_PS_99}]]*/'';
        var RSK_OPERATE_PS_NAME_01 = /*[[${RSK_OPERATE_PS_NAME_01}]]*/'';
        var RSK_OPERATE_PS_NAME_02 = /*[[${RSK_OPERATE_PS_NAME_02}]]*/'';
        var RSK_OPERATE_PS_NAME_03 = /*[[${RSK_OPERATE_PS_NAME_03}]]*/'';
        var RSK_OPERATE_PS_NAME_99 = /*[[${RSK_OPERATE_PS_NAME_99}]]*/'';
        var sumCount = /*[[${sumCount}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/risk/namelistmanage/orgnamelist/OrgNameManagement003.js}"></script>
</div>
</body>
</html>
