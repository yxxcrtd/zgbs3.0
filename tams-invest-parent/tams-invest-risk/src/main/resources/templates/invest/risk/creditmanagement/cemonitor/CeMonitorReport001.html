<!DOCTYPE html>
<html
		xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.w3.org/1999/xhtml"
		layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{CeMonitorReport001}">授信额度监测表</title>
    <style>
    .table-wrap .layui-table-view .layui-table-header table thead tr{
            background-color: #d9ecff!important;
        }
     table tr th div.laytable-cell-group{
     text-align: center;
     font-weight: bold;
     }
     
     .layui-table-view .layui-table th{
     padding:1px 0;
     }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="layui-tab layui-tab-brief" >
        <ul class="layui-tab-title">
            <li class="layui-this">机构额度监测表</li>
            <li>资产额度监测表</li>
            <li>系列额度监测表</li>
        </ul>
        <div class="layui-tab-content" style="height: 100px;">
            <div class="layui-tab-item layui-show">
                <div class='layui-fluid'>
                    <div class="layui-col-md12 form-button-area ce-org-form">
                    </div>
                    <div class='joyin-form-wrap joyin-filter-form condition-area ce-org-form'>
                        <form class="layui-form" id="dvpTransferForm">
                            <div class="layui-form-item">
                               <div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
									<label class="layui-form-label form-lable"
										data-th-text="#{CeMonitorReport001.pflsh}">批复号</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="pflsh" name="pflsh" data-th-placeholder="#{SysCommon.placeholder}" 
										class="layui-input form-input input-text" />		
									</div>
								</div>
                              <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
									<label class="layui-form-label form-lable"
										data-th-text="#{CeMonitorReport001.institutionName}">机构名称</label>
									<div class="layui-input-inline input-inline">
				                       <select  id="customerId" name="customerId" multiple
			                             class="layui-input form-input input-select" 
			                             th:placeholder="#{SysCommon.placeholder}"
			                             th:data-url="@{/invest/risk/creditmanagement/ceorg/CeOrg001/getInstitutionName}" allowClear="true"
			                             formatoption="true" ></select>
				                    </div>
								</div>
                               <div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
									<label class="layui-form-label form-lable"
										data-th-text="#{CeMonitorReport001.queryDate}">查询日期</label>
									<div class="layui-input-inline input-inline">
										<input   type="text" id="vdate" name="vdate"
			                                   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
			                                   th:placeholder="#{SysCommon.placeholder}" >
									</div>
								</div>
                            </div>
                        
                        </form>
                    </div>
                   <div class="table-wrap">
                        <table class="layui-table" id="ceOrgTable"></table>
                    </div>
                </div>
            </div>
            <div class="layui-tab-item">
                <div class='layui-fluid'>
                    <div class="layui-col-md12 form-button-area ce-asset-form">
                    </div>
                    <div class='joyin-form-wrap joyin-filter-form condition-area  ce-asset-form'>
                         <form class="layui-form" id="dvpTransferForm1">
                            <div class="layui-form-item">
                               <div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
									<label class="layui-form-label form-lable"
										data-th-text="#{CeMonitorReport001.pflsh}">批复号</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="pflsh" name="pflsh" data-th-placeholder="#{SysCommon.placeholder}" 
										class="layui-input form-input input-text" />		
									</div>
								</div>
                              <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
									<label class="layui-form-label form-lable"
										data-th-text="#{CeMonitorReport001.assetName}">资产名称</label>
									<div class="layui-input-inline input-inline">
				                       <select  id="customerId" name="customerId" multiple
			                             class="layui-input form-input input-select" 
			                             th:placeholder="#{SysCommon.placeholder}"
			                             th:data-url="@{/invest/risk/creditmanagement/ceasset/CeAsset001/getFinprodMarketIds}" allowClear="true"
			                             formatoption="true"></select>
				                    </div>
								</div>
                               <div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
									<label class="layui-form-label form-lable"
										data-th-text="#{CeMonitorReport001.queryDate}">查询日期</label>
									<div class="layui-input-inline input-inline">
										<input   type="text" id="vdate" name="vdate"
			                                   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
			                                   th:placeholder="#{SysCommon.placeholder}" >
									</div>
								</div>
                            </div>
                        
                        </form>
                    </div>
                    <div class="table-wrap">
                        <table class="layui-table" id="ceAssetTable"></table>
                    </div>
                </div>
            </div>
            <div class="layui-tab-item">
                <div class='layui-fluid'>
                    <div class="layui-col-md12 form-button-area ce-assetgroup-form">
                    </div>
                    <div class='joyin-form-wrap joyin-filter-form condition-area ce-assetgroup-form'>
                         <form class="layui-form" id="dvpTransferForm2">
                            <div class="layui-form-item">
                               <div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
									<label class="layui-form-label form-lable"
										data-th-text="#{CeMonitorReport001.pflsh}">批复号</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="pflsh" name="pflsh" data-th-placeholder="#{SysCommon.placeholder}" 
									    class="layui-input form-input input-text" />		
									</div>
								</div>
                              <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
									<label class="layui-form-label form-lable"
										data-th-text="#{CeMonitorReport001.assetGroupName}">系列名称</label>
									<div class="layui-input-inline input-inline">
				                       <select  id="customerId" name="customerId"
			                             class="layui-input form-input input-select" multiple
			                             th:placeholder="#{SysCommon.placeholder}"
			                             th:data-url="@{/invest/risk/creditmanagement/ceassetgroup/CeAssetGroup001/getAssetGroupAliasIds}" allowClear="true"
			                             formatoption="true"></select>
				                    </div>
								</div>
                               <div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
									<label class="layui-form-label form-lable"
										data-th-text="#{CeMonitorReport001.queryDate}">查询日期</label>
									<div class="layui-input-inline input-inline">
										<input   type="text" id="vdate" name="vdate"
			                                   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
			                                   th:placeholder="#{SysCommon.placeholder}">
									</div>
								</div>
                            </div>
                        
                        </form>
                    </div>
                   <div class="table-wrap">
                        <table class="layui-table" id="ceAssetGroupTable"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
     
    </script>
    <script data-th-src="@{/js/invest/risk/creditmanagement/cemonitor/CeMonitorReport001.js}"></script>
</div>
</body>
</html>
