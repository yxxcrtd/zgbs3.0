<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/default}">
<head>
	<title data-th-text="#{AssetInfoDetailRisk002}">资产要素信息维护新建</title>
</head>
<body>
<div layout:fragment="content" id="AssetInfoDetailRisk002_DIV">
	<div class="pro-module-container">
		<form class="layui-form joyin-form-wrap pro-module-form"
			  id="submitForm">

			<input id="assetUuid" name="assetUuid"
				   data-th-value="${entity?.assetUuid}" hidden>
			<input id="dataStatus" name="dataStatus"
				   data-th-value="${entity?.dataStatus}" hidden>


<!--			人行及其他公共数据.页面直接跳过修改直接保存数据-->
			<input id="chbIssuerId" name="chbIssuerId"
				   data-th-value="${entity?.chbIssuerId}" hidden>
			<input id="chbFinancierId" name="chbFinancierId"
				   data-th-value="${entity?.chbFinancierId}" hidden>
			<input id="chbManagerId" name="chbManagerId"
				   data-th-value="${entity?.chbManagerId}" hidden>
			<input id="isBjszq" name="isBjszq"
				   data-th-value="${entity?.isBjszq}" hidden>
			<input id="pbcAssetType1" name="pbcAssetType1"
				   data-th-value="${entity?.pbcAssetType1}" hidden>
			<input id="pbcAssetType2" name="pbcAssetType2"
				   data-th-value="${entity?.pbcAssetType2}" hidden>
			<input id="pbcAssetType3" name="pbcAssetType3"
				   data-th-value="${entity?.pbcAssetType3}" hidden>
<!--			人行及其他公共数据.页面直接跳过修改直接保存数据-->



			<div class="pro-module-wrap">
				<div class="pro-module">
					<h3 class="pro-module-title">
						<span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i
							class="iconfont icon-arrow-down pro-down-icon"></i>
					</h3>
					<div class="pro-module-item pro-item-wrap">
						<div class="layui-form-item">
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap" >行内资产/负债编码</label>
								<div class="layui-input-inline input-inline">

									<input type="text" name="assetCode" id="assetCode" required
										   style=" width: 100%!important; display: inline-block;"
										   data-th-value="${entity?.assetCode}" maxlength="18"
										   class="layui-input form-input" placeholder="请输入内容"
										   data-th-placeholder="#{SysCommon.placeholder}">
								</div>
							</div>
							<div class="form-inline-wrap">

								<label class="layui-form-label form-label-wrap ">资产名称</label>
								<div class="layui-input-inline input-inline">
									<input type="text" name="assetName" id="assetName"
										   data-th-value="${entity?.assetName}" required
										   class="layui-input form-input" placeholder="请输入内容"
										   data-th-placeholder="#{SysCommon.placeholder}" >
								</div>
							</div>
							<div class="form-inline-wrap" id="vdate_div">
								<label class="layui-form-label form-label-wrap">起息日</label>
								<div class="layui-input-inline input-inline">

									<input type="text" id="vdate" name="vdate" required
										   data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'

										   class="layui-input form-input input-dateSelect" />
								</div>
							</div>

						</div>
						<div class="layui-form-item">
							<div class="form-inline-wrap" id="mdate_div">

								<label class="layui-form-label form-label-wrap ">到期日</label>
								<div class="layui-input-inline input-inline">

									<input type="text" id="mdate" name="mdate" required
										   data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
										   class="layui-input form-input input-dateSelect" />
								</div>
							</div>
							<div  class="form-inline-wrap" >

								<label class="layui-form-label form-label-wrap ">资产一级分类</label>
								<div class="layui-input-inline input-inline">
									<select  id="orgAssetType1" name="orgAssetType1"
											 data-th-initValue="${entity?.orgAssetType1}"
											 class="layui-input form-input input-select" childrenIds="orgAssetType2"
											 data-th-data-result="${SVR_ORG_ASSET_TYPE1}" required
									></select>
								</div>
							</div>
							<div class="form-inline-wrap" >
								<label class="layui-form-label form-label-wrap">资产二级分类</label>
								<div class="layui-input-inline input-inline">
									<select  id="orgAssetType2" name="orgAssetType2"
											 data-th-initValue="${entity?.orgAssetType2}"
											 childrenIds="orgAssetType3" parentIds="orgAssetType1"
											 class="layui-input form-input input-select"
											 data-th-data-result="${SVR_ORG_ASSET_TYPE2}"
									></select>
								</div>
							</div>
						</div>
						<div class="layui-form-item">
							<div  class="form-inline-wrap" >
								<label class="layui-form-label form-label-wrap">资产三级分类</label>
								<div class="layui-input-inline input-inline">
									<select  id="orgAssetType3" name="orgAssetType3"
											 childrenIds="orgAssetType4" parentIds="orgAssetType2"
											 data-th-initValue="${entity?.orgAssetType3}"
											 class="layui-input form-input input-select"
											 data-th-data-result="${SVR_ORG_ASSET_TYPE3}"
									></select>
								</div>
							</div>
							<div  class="form-inline-wrap" >
								<label class="layui-form-label form-label-wrap">资产四级分类</label>
								<div class="layui-input-inline input-inline">
									<select  id="orgAssetType4" name="orgAssetType4"
											 childrenIds="orgAssetType5"
											 parentIds="orgAssetType3"
											 data-th-initValue="${entity?.orgAssetType4}"
											 class="layui-input form-input input-select"
											 data-th-data-result="${SVR_ORG_ASSET_TYPE4}"
									></select>
								</div>
							</div>
							<div  class="form-inline-wrap" >
								<label class="layui-form-label form-label-wrap">资产五级分类</label>
									<div class="layui-input-inline input-inline">
										<select  id="orgAssetType5" name="orgAssetType5"
												 parentIds="orgAssetType4"
												 data-th-initValue="${entity?.orgAssetType5}"
												 class="layui-input form-input input-select"
												 data-th-data-result="${SVR_ORG_ASSET_TYPE5}"
										></select>
								</div>
						</div>
						<div class="layui-form-item">


							<!--<div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap">资产负债类别</label>
                                <div class="layui-input-inline input-inline">
                                    <select  id="assetType" name="assetType"
                                             data-th-initValue="${entity?.assetType}"
                                             class="layui-input form-input input-select"
                                             data-th-data-result="${SVR_ASSETDEBT_TYPE}"
                                    ></select>
                                </div>

                            </div>-->
							<div class="form-inline-wrap" >
								<label class="layui-form-label form-label-wrap">币种</label>
								<div class="layui-input-inline input-inline">
									<select  id="ccy" name="ccy"
											 data-th-initValue="${entity?.ccy}"
											 class="layui-input form-input input-select"
											 data-th-data-result="${CURRENCY_CHB}" required
									></select>
								</div>
							</div>
							<div class="form-inline-wrap" >
								<label class="layui-form-label form-label-wrap">交易流通场所</label>
								<div class="layui-input-inline input-inline">
									<select  id="tradeMarket" name="tradeMarket"
											 data-th-initValue="${entity?.tradeMarket}"
											 class="layui-input form-input input-select"
											 data-th-data-result="${SVR_TRADE_MARKET}" required
									></select>
								</div>
							</div>
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap ">发行机构代码</label>
								<div class="layui-input-inline input-inline">
									<input type="text" name="issuePartyId" disabled="true"
										   data-th-value="${entity?.issuePartyId}" required
										   class="layui-input form-input" placeholder="请输入内容"
										   data-th-placeholder="#{SysCommon.placeholder}" >
								</div>
							</div>
						</div>
						<div class="layui-form-item">
							<div class="form-inline-wrap" >
								<label class="layui-form-label form-label-wrap">资产负债二级类别</label>
								<div class="layui-input-inline input-inline">

									<select required class="layui-input form-input input-select" placeholder="请输入内容"
											id="assetType2" name="assetType2"
											data-th-placeholder="#{SysCommon.placeholder}"
											parentIds="orgAssetType1,orgAssetType2,orgAssetType3,orgAssetType4,orgAssetType5"
											data-th-data-url="|@{/invest/risk/assetinfodetail/AssetInfoDetailRisk002/getAssetType2}"
											data-th-data-effectivefieldsalias='|{"orgAssetType1":"#{orgAssetType1}","orgAssetType2":"#{orgAssetType2}"
											,"orgAssetType3":"#{orgAssetType3}","orgAssetType4":"#{orgAssetType4}","orgAssetType5":"#{orgAssetType5}"}|'
											th:initValue='${entity?.assetType2}'
											childrenIds="repSectype,svrBussRepAssetAstBillInfoRiskDto_notstandSecType">
									</select>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>

			<div class="pro-module">

				<div class="businessDeptClass" id="svrBussFinBondRepInfoRisk_div">
					<div class="page-component"
						 th:data-path="@{/invest/risk/assetinfodetail/asset/SvrBussFinBondRepInfoRisk/init}"
						 th:data-params="|{entityName: 'svrBussFinBondRepInfoRiskDto',assetUuid:'${entity?.assetUuid}',dataStatus:'${entity?.dataStatus}',assetType:'${entity?.assetType2}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}',svr_asset_type_second_level: '${SVR_ASSET_TYPE_SECOND_LEVEL}'}|">
					</div>
				</div>

				<div class="businessDeptClass" id="svrBussRepDlRepoInfoRiskDto_div">
					<div class="page-component"
						 th:data-path="@{/invest/risk/assetinfodetail/asset/SvrBussRepDlRepoInfoRisk/init}"

						 th:data-params="|{entityName: 'svrBussRepDlRepoInfoRiskDto',assetUuid:'${entity?.assetUuid}',dataStatus:'${entity?.dataStatus}',assetType:'${entity?.assetType2}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}',svr_asset_type_second_level: '${SVR_ASSET_TYPE_SECOND_LEVEL}'}|">
					</div>
				</div>



				<div class="businessDeptClass" id="svrBussRepDepositInfoRiskDto_div">
					<div class="page-component"
						 th:data-path="@{/invest/risk/assetinfodetail/asset/SvrBussRepDepositInfoRisk/init}"

						 th:data-params="|{entityName: 'svrBussRepDepositInfoRiskDto',assetUuid:'${entity?.assetUuid}',dataStatus:'${entity?.dataStatus}',assetType:'${entity?.assetType2}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}',svr_asset_type_second_level: '${SVR_ASSET_TYPE_SECOND_LEVEL}'}|">
					</div>
				</div>

				<div class="businessDeptClass" id="svrBussRepPlacementInfoRisk_div">
					<div class="page-component"
						 th:data-path="@{/invest/risk/assetinfodetail/asset/plancement/SvrBussRepPlacementInfoRisk/init}"
						 th:data-params="|{entityName: 'svrBussRepPlacementInfoRiskDto',assetUuid:'${entity?.assetUuid}',dataStatus:'${entity?.dataStatus}',assetType:'${entity?.assetType2}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}',svr_asset_type_second_level: '${SVR_ASSET_TYPE_SECOND_LEVEL}'}|">					</div>
				</div>
			</div>
			<div class="pro-module">
				<div class="businessDeptClass" id="svrBussRepFinanciallInfoRisk_div">
					<div class="page-component"
						 th:data-path="@{/invest/risk/assetinfodetail/asset/financiall/SvrBussRepFinanciallInfoRisk/init}"
						 th:data-params="|{entityName: 'svrBussRepFinanciallInfoRiskDto',assetUuid:'${entity?.assetUuid}',dataStatus:'${entity?.dataStatus}',assetType:'${entity?.assetType2}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}',workflowId:'${entity?.workflowId}',svr_asset_type_second_level: '${SVR_ASSET_TYPE_SECOND_LEVEL}'}|">

					</div>
				</div>
			</div>


			<div class="pro-module">
				<div class="businessDeptClass" id="svrBussRepOtherInfoRisk_div">
					<div class="page-component"
						 th:data-path="@{/invest/risk/assetinfodetail/asset/other/SvrBussRepOtherInfoRisk/init}"
						 th:data-params="|{entityName: 'svrBussRepOtherInfoRiskDto',assetUuid:'${entity?.assetUuid}',dataStatus:'${entity?.dataStatus}',assetType:'${entity?.assetType2}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}',svr_asset_type_second_level: '${SVR_ASSET_TYPE_SECOND_LEVEL}'}|">

					</div>
				</div>
			</div>


			<div class="pro-module">
				<div class="businessDeptClass" id="svrBussRepOthKindInfoRisk_div">
					<div class="page-component"
						 th:data-path="@{/invest/risk/assetinfodetail/asset/othKind/SvrBussRepOthKindInfoRisk/init}"
						 th:data-params="|{entityName: 'svrBussRepOthKindInfoRiskDto',assetUuid:'${entity?.assetUuid}',dataStatus:'${entity?.dataStatus}',assetType:'${entity?.assetType2}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}',svr_asset_type_second_level: '${SVR_ASSET_TYPE_SECOND_LEVEL}'}|">

					</div>
				</div>
			</div>


			<div class="pro-module">
				<div class="businessDeptClass" id="svrBussRepQDIIdemolitionInfoRisk_div">
					<div class="page-component"
						 th:data-path="@{/invest/risk/assetinfodetail/asset/qdiidemolition/SvrBussRepQDIIdemolitionInfoRisk/init}"
						 th:data-params="|{entityName: 'svrBussRepQDIIdemolitionInfoRiskDto',assetUuid:'${entity?.assetUuid}',dataStatus:'${entity?.dataStatus}',assetType:'${entity?.assetType2}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}',svr_asset_type_second_level: '${SVR_ASSET_TYPE_SECOND_LEVEL}'}|">

					</div>
				</div>
			</div>
			<div class="pro-module">
				<div class="businessDeptClass" id="svrBussRepQDIIStructureInfoRisk_div">
					<div class="page-component"
						 th:data-path="@{/invest/risk/assetinfodetail/asset/qdiiStructure/SvrBussRepQDIIStructureInfoRisk/init}"
						 th:data-params="|{entityName: 'svrBussRepQDIIStructureInfoRiskDto',assetUuid:'${entity?.assetUuid}',dataStatus:'${entity?.dataStatus}',assetType:'${entity?.assetType2}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}',svr_asset_type_second_level: '${SVR_ASSET_TYPE_SECOND_LEVEL}'}|">

					</div>
				</div>
			</div>
			<!--贵金属/商品-->
			<div class="pro-module">
				<div class="businessDeptClass" id="svrBussRepNobleMetalInfoRisk_div">
					<div class="page-component"
						 th:data-path="@{/invest/risk/assetinfodetail/asset/noblemetal/SvrBussRepNobleMetalInfoRisk/init}"
						 th:data-params="|{entityName: 'svrBussRepNobleMetalInfoRiskDto',assetUuid:'${entity?.assetUuid}',dataStatus:'${entity?.dataStatus}',assetType:'${entity?.assetType2}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}',svr_asset_type_second_level: '${SVR_ASSET_TYPE_SECOND_LEVEL}'}|">

					</div>
				</div>
			</div>
			<!--非标准化债权类资产/新增可投资资产-->
			<div class="pro-module">
				<div class="businessDeptClass" id="svrBussRepAssetCreditNonstdInfoRisk_div">
					<div class="page-component"
						 th:data-path="@{/invest/risk/assetinfodetail/asset/project/SvrBussRepAssetCreditNonstdInfoRisk/init}"
						 th:data-params="|{entityName: 'svrBussRepAssetCreditNonstdInfoRiskDto',assetUuid:'${entity?.assetUuid}',dataStatus:'${entity?.dataStatus}',assetType:'${entity?.assetType2}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}',svr_asset_type_second_level: '${SVR_ASSET_TYPE_SECOND_LEVEL}'}|">

					</div>
				</div>
			</div>
			<!--票据类资产/信用证类资产-->
			<div class="pro-module">
				<div class="businessDeptClass" id="svrBussRepAssetAstBillInfoRisk_div">
					<div class="page-component"
						 th:data-path="@{/invest/risk/assetinfodetail/asset/project/SvrBussRepAssetAstBillInfoRisk/init}"
						 th:data-params="|{entityName: 'svrBussRepAssetAstBillInfoRiskDto',assetUuid:'${entity?.assetUuid}',dataStatus:'${entity?.dataStatus}',assetType:'${entity?.assetType2}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}',svr_asset_type_second_level: '${SVR_ASSET_TYPE_SECOND_LEVEL}'}|">

					</div>
				</div>
			</div>
			<!--权益类资产-->
			<div class="pro-module">
				<div class="businessDeptClass" id="svrBussRepEquityInfoRisk_div">
					<div class="page-component"
						 th:data-path="@{/invest/risk/assetinfodetail/asset/project/SvrBussRepEquityInfoRisk/init}"
						 th:data-params="|{entityName: 'svrBussRepEquityInfoRiskDto',assetUuid:'${entity?.assetUuid}',dataStatus:'${entity?.dataStatus}',assetType:'${entity?.assetType2}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}',workflowId:'${entity?.workflowId}',svr_asset_type_second_level: '${SVR_ASSET_TYPE_SECOND_LEVEL}'}|">

					</div>
				</div>
			</div>
			<!--公募基金/私募基金-->
			<div class="pro-module">
				<div class="businessDeptClass" id="svrBussRepFundInfoRisk_div">
					<div class="page-component"
						 th:data-path="@{/invest/risk/assetinfodetail/asset/fund/SvrBussRepFundInfoRisk/init}"
						 th:data-params="|{entityName: 'svrBussRepFundInfoRiskDto',assetUuid:'${entity?.assetUuid}',dataStatus:'${entity?.dataStatus}',assetType:'${entity?.assetType2}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}',svr_asset_type_second_level: '${SVR_ASSET_TYPE_SECOND_LEVEL}'}|">

					</div>
				</div>
			</div>
			<!--各类资产其他项-->
			<div class="pro-module">
				<div class="businessDeptClass" id="svrBussRepOtherInvestTargetInfoRisk_div">
					<div class="page-component"
						 th:data-path="@{/invest/risk/assetinfodetail/asset/project/SvrBussRepOtherInvestTargetInfoRisk/init}"
						 th:data-params="|{entityName: 'svrBussRepOtherInvestTargetInfoRiskDto',assetUuid:'${entity?.assetUuid}',dataStatus:'${entity?.dataStatus}',assetType:'${entity?.assetType2}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}',svr_asset_type_second_level: '${SVR_ASSET_TYPE_SECOND_LEVEL}'}|">

					</div>
				</div>
			</div>
			<!--委外投资——协议方式-->
			<div class="pro-module">
				<div class="businessDeptClass" id="svrBussRepOutInvestAgrInfoRisk_div">
					<div class="page-component"
						 th:data-path="@{/invest/risk/assetinfodetail/asset/trust/SvrBussRepOutInvestAgrInfoRisk/init}"
						 th:data-params="|{entityName: 'svrBussRepOutInvestAgrInfoRiskDto',assetUuid:'${entity?.assetUuid}',dataStatus:'${entity?.dataStatus}',assetType:'${entity?.assetType2}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}',svr_asset_type_second_level: '${SVR_ASSET_TYPE_SECOND_LEVEL}'}|">

					</div>
				</div>
			</div>
			<!--资产管理产品-->
			<div class="pro-module">
				<div class="businessDeptClass" id="svrBussRepAssetMngProdInfoRisk_div">
					<div class="page-component"
						 th:data-path="@{/invest/risk/assetinfodetail/asset/plan/SvrBussRepAssetMngProdInfoRisk/init}"
						 th:data-params="|{entityName: 'svrBussRepAssetMngProdInfoRiskDto',assetUuid:'${entity?.assetUuid}',dataStatus:'${entity?.dataStatus}',assetType:'${entity?.assetType2}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}',svr_asset_type_second_level: '${SVR_ASSET_TYPE_SECOND_LEVEL}'}|">
					</div>
				</div>
			</div>

			<!--QDII债券资产-->
			<div class="pro-module">
				<div class="businessDeptClass" id="svrBussQDIIBondRepInfoRisk_div">
					<div class="page-component"
						 th:data-path="@{/invest/risk/assetinfodetail/asset/qdiiBond/SvrBussQDIIBondRepInfoRisk/init}"
						 th:data-params="|{entityName: 'svrBussRepQDIIBondInfoRiskDto',assetUuid:'${entity?.assetUuid}',dataStatus:'${entity?.dataStatus}',assetType:'${entity?.assetType2}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}',workflowId:'${entity?.workflowId}',svr_asset_type_second_level: '${SVR_ASSET_TYPE_SECOND_LEVEL}'}|">
					</div>
				</div>
			</div>
			<!--QDII股票/基金类资产-->
			<div class="pro-module">
				<div class="businessDeptClass" id="svrBussQDIISharesInfoRisk_div">
					<div class="page-component"
						 th:data-path="@{/invest/risk/assetinfodetail/asset/qdiiShares/SvrBussQDIISharesInfoRisk/init}"
						 th:data-params="|{entityName: 'svrBussQDIISharesInfoRiskDto',assetUuid:'${entity?.assetUuid}',dataStatus:'${entity?.dataStatus}',assetType:'${entity?.assetType2}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}',workflowId:'${entity?.workflowId}',svr_asset_type_second_level: '${SVR_ASSET_TYPE_SECOND_LEVEL}'}|">

					</div>
				</div>
			</div>
				<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
					<div class="row text-center" style="margin: 20px 0;">
						<a id="AssetInfoDetailRisk002_btn_save" class="layui-btn layui-btn-sm btn-save"
						   data-th-text="#{SysCommon.save}">保存</a>
						<a id="AssetInfoDetailRisk002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
						   data-th-text="#{SysCommon.submit}">提交</a>
						<a id="AssetInfoDetailRisk002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
						   data-th-text="#{SysCommon.cancel}">取消</a>
					</div>
				</div>
