<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{FundGoal001}">基金投向维护</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="layui-col-md12 form-button-area" export ='false' style="margin: 10px;">
            <a id="FundGoal001_btn_reset" class="layui-btn layui-btn-sm btn-reset" data-th-text="#{SysCommon.reset}">重置</a>
            <a id="FundGoal001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}" >新建</a>
            <a id="FundGoal001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}" >删除</a>
        </div>
        <div id='conditionArea' class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{FundGoal001.finprodId}">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <select  type="text" id="finprodId" name="finprodId"
                                     class="layui-input form-input input-select"
                                     allowClear="true" placeholder="请输入内容"
                                     data-th-placeholder="#{SysCommon.placeholder}"
                                     data-th-data-url="@{/invest/risk/fundgoal/FundGoal001/getFinprodMarketIdList}"
                                     data-th-value="${entity?.finprodId}">
                            </select>

                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/risk/fundgoal/FundGoal001.js}"></script>
</div>
</body>
</html>
