<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{MarketRiskSceneManage002}">情景新建-市场性压力测试</title>
</head>
<body>
<div layout:fragment="content">
	<form class="layui-form joyin-form-wrap pro-module-form" id="marketRiskSceneManage002Form">
		<input id="workflowId" name="workflowId" data-th-value="${workflowId}" type="hidden">
		<input id="newType" name="newType" data-th-value="${entity?.newType}" type="hidden">
		<div class="pro-module-wrap">
			<div class="pro-module">
				<h3 class="pro-module-title">
					<span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i
						class="iconfont icon-arrow-down pro-down-icon"></i>
				</h3>
				<br/>
				<div class="pro-module-item">
					<div class="layui-form-item">
						<div class="form-inline-wrap ">
							<label class="layui-form-label form-label-wrap"
								>情景模板名称</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="tmplName" name="tmplName" disabled
									class="layui-input form-input" placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-value='${entity?.tmplName}'
									>
							</div>
						</div>
						<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap"
								>情景模板编号</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="tmplId" name="tmplId" disabled
									class="layui-input form-input" placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-value='${entity?.tmplId}'
									>
							</div>
						</div>
						<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap"
								data-th-text="#{MarketRiskSceneManage002.riskType}">适用风险分类</label>
							<div class="layui-input-inline input-inline">
								<select name="riskType" id="riskType"  disabled="true"
									class="layui-input form-input input-select" formatoption=false
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result='${RISK_TYPE}'
									data-th-initValue='${entity?.riskType}'>
								</select>
							</div>
						</div>
						<!-- 隐藏字段，暂不使用 -->
						<div class="form-inline-wrap" style="display:none;">
							<label class="layui-form-label form-label-wrap"
								data-th-text="#{MarketRiskSceneManage002.riskType2}">适用二级分类</label>
							<div class="layui-input-inline input-inline">
								<select name="riskType2" id="riskType2"
									class="layui-input form-input input-select"  formatoption=false
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-url="@{/invest/product/productelement/scheduling/FinProductScheduling002/queryProdTempleteInfo}"
									data-th-initValue='${entity?.riskType2}'>
								</select>
							</div>
						</div>
					</div>
				</div>
				<div class="pro-module-item">
					<div class="layui-form-item">
						
						<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap"
								data-th-text="#{MarketRiskSceneManage002.sceneType}">情景类型</label>
							<div class="layui-input-inline input-inline">
								<select name="sceneType" id="sceneType"  disabled
									class="layui-input form-input input-select" formatoption=false
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result='${SCENE_TYPE}'
									data-th-initValue='${entity?.sceneType}'>
								</select>
							</div>
						</div>
					</div>
				</div>
				<hr style="height:2px;border:none;border-top:2px #185598;" />
				<div class="pro-module-item" style="padding-bottom: 13px;">
					<div class="layui-form-item">
						<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap"
								data-th-text="#{MarketRiskSceneManage002.sceneName}">情景名称</label>
							<div class="layui-input-inline input-inline">
								<input type="text" name="sceneName" id="sceneName"
									class="layui-input form-input"
									data-th-value='${entity?.sceneName}'
									data-th-placeholder="#{SysCommon.placeholder}" required>
							</div>
						</div>
						<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap"
								data-th-text="#{MarketRiskSceneManage002.sceneId}">情景编号</label>
							<div class="layui-input-inline input-inline">
								<input type="text" name="sceneId" id="sceneId" disabled placeholder="情景编号"
									class="layui-input form-input"
									data-th-value='${entity?.sceneId}'
									data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
						<div class="form-inline-wrap" style="">
							<label class="layui-form-label form-label-wrap"
								data-th-text="#{MarketRiskSceneManage002.suitProduct}">适用产品</label>
							<div class="layui-input-inline input-inline">
								<input type="text" name="suitProduct" id="suitProduct"
									class="layui-input form-input input-select" formatoption=false
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result='${OPENMODE}'
									data-th-initValue='${entity?.suitProduct}'>
							</div>
						</div>
					</div>
				</div>
				
			</div>
		</div>
		<div class="pro-module-wrap">
			<div class="pro-module">
				<h3 class="pro-module-title">
					<span class="title-des">情景设置</span><i
						class="iconfont icon-arrow-down pro-down-icon"></i>
				</h3>
				<br/>
				<div class="pro-module-item" style="padding:0 15px 15px 15px">
					<div class="layui-row" style="">
						<div class="layui-col-xs12 layui-col-sm12 layui-col-md12" >
							<span style="font-weight:bold;">风险因子确定</span>
							<div style="margin-top:5px;">
								<table class="layui-table" id="dataTableA" name="dataTableA"></table>
							</div>
						</div>
						
					</div>
					<div class="layui-row">
						<div class="layui-col-md1" style="line-height:24px;font-weight:bold;">情景时间确定</div>
						<div class="layui-col-md5" style="padding-left:15px;">
							<span style="line-height:24px">开始时间-结束时间：</span>
							<div style="display:inline-block;position:relative;width:253px;margin-left:10px;">
								<input class="layui-input form-input input-dateRangeSelect" id="dateRange" placeholder="请选择时间区间">
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<div class="pro-module-wrap">
			<div class="pro-module">
				<h3 class="pro-module-title">
					<span class="title-des">压力测试报告</span><i
						class="iconfont icon-arrow-down pro-down-icon"></i>
				</h3>
				<br />
				<div class="pro-module-item" style="padding:5px 15px;">
					<div class="layui-row layui-col-space20" style="">
						<div class="layui-col-xs6 layui-col-sm6 layui-col-md6" >
							<span style="font-weight:bold;">产品指标</span>
							<div>
								<table class="layui-table" id="dataTableB" name="dataTableB"></table>
							</div>
						</div>
						<div class="layui-col-xs6 layui-col-sm6 layui-col-md6" >
							<span style="font-weight:bold;">承压指标</span>
							<div>
								<table class="layui-table" id="dataTableC" name="dataTableC"></table>
							</div>
						</div>
					</div>
				</div>
				
				
				
					
				
			</div>
		</div>
		<div class="pro-module-wrap">
			<div class="pro-module">
				<h3 class="pro-module-title">
					<span class="title-des">备注</span><i
						class="iconfont icon-arrow-down pro-down-icon"></i>
				</h3>
				<br/>
				<div class="pro-module-item">
					<textarea id="remark" name="remark"
                        data-th-text="${entity?.remark}"
                        class="layui-textarea" placeholder="请输入内容"
                        data-th-placeholder="#{SysCommon.placeholder}">
                    </textarea>
				</div>
			</div>
		</div>
			
	</form>
	<div class="layui-form-item">
        <div align="center" style="height:50px;padding-top: 10px;">
            <a id="MarketRiskSceneManage002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="MarketRiskSceneManage002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="MarketRiskSceneManage002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
	<style type="text/css">
		.pro-module .layui-table-view{
		    padding: 0px!important;
		    border: 0;
		}
		.layui-table-body{
			overflow:hidden!important
		}
		.shelter-div{
			cursor: not-allowed;
		    height: 20px;
		    width: 20px;
		    background: transparent;
		    position: absolute;
		    z-index: 999;
		    left: 28%;
		    top: 1px;
		}
    </style>
   <script th:inline="javascript" type="text/javascript">
		var FLOW_RISK_FACTOR_ONE = /*[[${FLOW_RISK_FACTOR_ONE}]]*/'';
		var NET_OUTFLOW_BASE_CHOICE = /*[[${NET_OUTFLOW_BASE_CHOICE}]]*/'';
		var FLOW_RISK_FACTOR = /*[[${FLOW_RISK_FACTOR}]]*/'';
	 	var workflowId = /*[[${workflowId}]]*/'';
	 	var entity=/*[[${entity}]]*/'';
	 	var sceneId=/*[[${sceneId}]]*/'';
	 	var marketRiskFactor = /*[[${marketRiskFactor}]]*/'';
    </script>  
    <script data-th-src="@{/js/invest/risk/stresstestmanage/marketriskscenemanage/MarketRiskSceneManage002.js}" type="text/javascript"></script>
</div>
</body>
</html>
