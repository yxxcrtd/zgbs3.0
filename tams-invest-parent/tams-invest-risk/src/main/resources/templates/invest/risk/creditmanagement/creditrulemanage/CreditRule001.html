			<div class='joyin-form-wrap joyin-filter-form condition-area'>

							<label class="layui-form-label form-lable"
								data-th-text="#{CeRule001.creditType}">额度分类</label>
							<div class="layui-input-inline input-inline">
		                       <select  id="creditType" name="creditType"

									data-th-placeholder="#{SysCommon.placeholder}"  multiple
									data-th-data-result="${LIMIT_TYPE}">
								</select>
		                    </div>
						</div>
						<div class="form-inline-wrap">

								data-th-text="|#{CeRule001.creditTagName}|">额度标签</label>
							<div class="layui-input-inline input-inline">
							 <select  id="creditTagName" name="creditTagName"
                             class="layui-input form-input input-select"   multiple
                             th:placeholder="#{SysCommon.placeholder}"
                             th:data-url="@{/invest/risk/creditmanagement/creditlinemanage/CeLine001/getLimitLabel}" allowClear="true"
                             formatoption="false" ></select>	
							</div>
						</div>
						<div class="form-inline-wrap">
							<label class="layui-form-label form-lable"
								data-th-text="#{CeRule002.astType1}">资产大类</label>
							<div class="layui-input-inline input-inline">
								<select name="astType1" id="astType1" multiple
									class="layui-input form-input input-select" formatoption=true 
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result="${RISK_ASSET_TYPE}" childrenIds="astType2">
								</select>
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="form-inline-wrap" id="selector3">
							<label class="layui-form-label form-label-wrap"
								   data-th-text="#{CeRule002.astType2}">资产二级分类
							</label>
							<div class="layui-input-inline input-inline">
								<select id="astType2" name="astType2" multiple
										class="layui-input form-input input-select"
										allowClear="true" placeholder="请选择"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-data-result="${RISK_ASSET_TYPE_TWO}"
										formatoption=true childrenIds="astType3"></select>
							</div>
						</div>
						<div class="form-inline-wrap" id="selector4">
							<label class="layui-form-label form-label-wrap"
								   data-th-text="#{CeRule002.astType3}">资产三级分类
							</label>
							<div class="layui-input-inline input-inline">
								<select id="astType3" name="astType3" multiple
										class="layui-input form-input input-select"
										allowClear="true" placeholder="请选择"
										data-th-placeholder="#{SysCommon.placeholder}"
