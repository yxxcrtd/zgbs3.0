<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
	<meta charset="UTF-8">
	<title>客户关系树-机构负面信息</title>
</head>
<body>
<div layout:fragment="content">
	<div class='layui-fluid'>
        <div class="form-button-area">
        </div>
		<div class="joyin-form-wrap joyin-filter-form condition-area">
			<form class="layui-form" id="searchForm">
				<div class="layui-form-item">
					<div class="layui-row">

						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable" >对象类型</label>
                            <select type="text" id="objTypes" name="objTypes"
                                    class="layui-input form-input input-select"
                                    allowClear="true" placeholder="请输入内容"
                                    data-th-data-result='${CUSTOMER_NATURE}'
                                    multiple="true"
                                    data-th-placeholder="#{SysCommon.placeholder}" >
                            </select>
                        </div>
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-label-wrap" >查询日期</label>
                            <div class="layui-input-inline input-inline">
                                <input class="layui-input form-input input-dateRangeSelect" id="dateRange" placeholder="请选择时间区间">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-label-wrap" >机构名称</label>
                            <select type="text" id="orgId" name="orgId" class="layui-input form-input input-select"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" allowClear="true" formatoption=true
                                    data-th-data-url="@{/invest/risk/customerrelationtree/agencynegativeinf/AgencyNegativeInf001/fuzzyQueryOrgByIdOrName}">
                            </select>
                        </div>

					</div>


				</div>
			</form>
		</div>
		<div>
            <table class="layui-table" id="dataTable"></table>
        </div>
	</div>
</div>
<div layout:fragment="script">
	<style type="text/css">
    .layui-form-item .select2-container{
        width: 60% !important;
    }
    .detail, .newsTitle{
        color: blue;
        font-style: inherit;
        cursor: pointer;
    }
    /* 去除表头加载行  */
	.layui-table-init {
		display:none!important;
	}	
    </style>
	<script th:inline="javascript" type="text/javascript">
        var queryDate=/*[[${queryDate}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/risk/customerrelationtree/agencynegativeinf/AgencyNegativeInf001.js}" type="text/javascript"></script>
</div>
</body>
</html>
