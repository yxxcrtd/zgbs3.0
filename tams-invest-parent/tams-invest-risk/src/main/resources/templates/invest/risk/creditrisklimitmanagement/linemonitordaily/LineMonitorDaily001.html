<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{LineMonitorDaily001}">额度监测日报</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area" >

        </div>
        <div class='joyin-form-wrap joyin-filter-form condition-area'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{LineMonitorDaily001.searchDate}">查询日期</label>
                        <div class="layui-input-inline input-inline">
                            <input id="searchDate" name="searchDate"
                                   class="layui-input form-input input-dateSelect"
                                   th:value="${sysDate}"/>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{LineMonitorDaily001.dailyType}">日报类型</label>
                        <div class="layui-input-inline input-inline">
                            <select  id="dailyType" name="dailyType"
                                     class="layui-input form-input input-select"
                                     allowClear="true" placeholder="请输入内容"
                                      data-th-data-result='${LINE_MONITOR_DAY_TYPE}'
                                     th:placeholder="#{SysCommon.placeholder}"
                                      ></select>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <div id="singleTableDiv">
            <table class="layui-table" id="dataTable2"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">

    </script>
    <script data-th-src="@{/js/invest/risk/creditrisklimitmanagement/linemonitordaily/LineMonitorDaily001.js}"></script>
</div>
</body>
</html>
