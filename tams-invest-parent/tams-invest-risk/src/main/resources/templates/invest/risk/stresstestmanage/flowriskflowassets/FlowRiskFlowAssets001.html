<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{FlowRiskFlowAssets001}">流动性风险-流动性资产设置</title>
    <link rel="stylesheet" data-th-href="@{/js/invest/risk/stresstestmanage/flowriskflowassets/iconfont.css}">
</head>
<body>
<div layout:fragment="content">
	<form id="form" class='layui-form' style="padding: 0px 15px;overflow: hidden auto;">
		<div class="layui-row" style="">
			<div class="layui-col-md6  layui-col-xs6 layui-col-sm6 layui-col-lg6" style="padding-right: 20px;border-right: 1px solid #dbdbdb;padding-bottom:20px;">
				<h3 class="pro-module-title" style="height: 24px;border-bottom: 0px;background:white;padding-left: 0px;"><span class="title-des">一级流动性资产设置</span>
				</h3>
				<div class="layui-row">
					<div class="" style="float: left;width: 45%;" id="assetssortOne">
						<h3 class="pro-module-title" style="height: 24px;border: 1px solid #dbdbdb;border-bottom: none;padding: 3px 5px 0px;">资产分类</h3>
						<!-- <span>资产分类</span> -->
						<div class="layui-input" 
							style="border: 1px solid #dbdbdb;width:100%;height:350px;overflow-y: scroll;" 
							id='assetssortOneTree' 
							data-th-url='|@{/invest/risk/stresstestmanage/flowriskflowassets/FlowRiskFlowAssets001/getAssetsSort}'>
					    </div>
					</div>
					<div class="" style="display:inline-block;margin-left: 10px;" id="buttons">
						<div class="repo-trade-middle">
				            <a class="trade-btn-wrap trade-add-btn addFlowAss1" ><span class="jyiconfont jyicon-nextpage_fill" style="font-size:28px"></span></a>
				            <a class="trade-btn-wrap trade-romove-btn removeFlowAss1" ><span class="jyiconfont jyicon-prevpage1" style="font-size:28px"></span></a>
				        </div> 
					</div>
					
					<div class="" style="width: 45%;float: right;">
						<!-- <div class="layui-input" 
							style="border: 1px solid #dbdbdb; scroll-y: auto; scroll-x: hidden; width:100%;height:300px; 
							overflow-y: scroll;" id='flowassets1Tree' 
							data-th-url='|@{/invest/risk/stresstestmanage/flowriskflowassets/FlowRiskFlowAssets001/getAssetsSort}'>
						    <ul id="treeFlowAssOne" class="manage-info-item" style="overflow:hidden;padding-left:5px;margin-top: 1px;border: 0px solid #ccc;">
						    </ul>
					    </div>  -->
					    <h3 class="pro-module-title" style="height: 24px;border: 1px solid #dbdbdb;border-bottom: none;padding: 3px 5px 0px;">
					    	<span class="">一级流动性资产</span>
					   		<span class="manage-info-item" style="float: right;padding-right: 0px"><input type="checkbox" data-th-lay-filter="haveSelPortOne" > 全选</span>
					   	</h3>
					   <!--  <span>一级流动性资产</span> -->
					    <div class="layui-input" 
							style="border: 1px solid #dbdbdb; scroll-y: auto; scroll-x: auto; width:100%;height:350px; 
							overflow-y: scroll;" id='flowassets1Tree'>
						    <ul id="treeFlowAssOne" class="manage-info-item" style="overflow:hidden;padding-left:5px;margin-top: 1px;border: 0px solid #ccc;">
						    </ul>
					    </div>
					</div>
				</div>
			</div>
			<div class="layui-col-md6  layui-col-xs6 layui-col-sm6 layui-col-lg6" style="padding-left: 20px;padding-bottom:20px;">
				<h3 class="pro-module-title" style="height: 24px;border-bottom: 0px;background:white;padding-left: 0px;"><span class="title-des">二级流动性资产设置</span>
				</h3>
				<div class="layui-row">
					<div style="float: left;width: 45%;" id="assetssortTwo">
						<h3 class="pro-module-title" style="height: 24px;border: 1px solid #dbdbdb;border-bottom: none;padding: 3px 5px 0px;">资产分类</h3>
						<div class="layui-input" 
							style="border: 1px solid #dbdbdb; width:100%;height:350px; 
							overflow-y: scroll;" id='assetssortTwoTree' 
							data-th-url='|@{/invest/risk/stresstestmanage/flowriskflowassets/FlowRiskFlowAssets001/getAssetsSort}'>
					    </div>
					</div>
					<div style="display:inline-block;margin-left: 10px;" id="buttons">
						<div class="repo-trade-middle">
				            <a class="trade-btn-wrap trade-add-btn addFlowAss2" ><span class="jyiconfont jyicon-nextpage_fill" style="font-size:28px"></span></a>
				            <a class="trade-btn-wrap trade-romove-btn removeFlowAss2" ><span class="jyiconfont jyicon-prevpage1" style="font-size:28px"></span></a>
				        </div>
					</div>
					<div style="width: 45%;float: right;">
						<!-- <div class="layui-input" 
							style="border: 1px solid #dbdbdb; scroll-y: auto; scroll-x: auto; width:100%;height:300px; 
							overflow-y: scroll;" id='flowassets2Tree' 
							data-th-url='|@{/invest/risk/stresstestmanage/flowriskflowassets/FlowRiskFlowAssets001/getFlowAssets2}'>
							<ul id="treeFlowAssTwo" class="manage-info-item" style="overflow:hidden;padding-left:5px;margin-top: 1px;border: 0px solid #ccc;">
						    </ul>
					    </div> -->
					    <h3 class="pro-module-title" style="height: 24px;border: 1px solid #dbdbdb;border-bottom: none;padding: 3px 5px 0px;"><span class="">二级流动性资产</span>
					    	<span class="manage-info-item" style="float: right;padding-right: 0px"><input type="checkbox" data-th-lay-filter="haveSelPortTwo" > 全选</span>
					   	</h3>
					    <div class="layui-input" 
							style="border: 1px solid #dbdbdb; scroll-y: auto; scroll-x: auto; width:100%;height:350px; 
							overflow-y: scroll;" id='flowassets2Tree'>
						    <ul id="treeFlowAssTwo" class="manage-info-item" style="overflow:hidden;padding-left:5px;margin-top: 1px;border: 0px solid #ccc;">
						    </ul>
					    </div>
					</div>
				</div>
			</div>
		</div>
		<div class="layui-row" style="margin:0px -25px;">
			<h3 class="pro-module-title" style="height: 24px;border-bottom: 0px;padding-left:25px;"><span class="title-des">备注</span>
			</h3>
		</div>
		<div class="layui-row">
			<div class="layui-col-md12  layui-col-xs12 layui-col-sm12 layui-col-lg12">
				<!-- <textarea th:id="|${entityName}_remark|" th:name="|${entityName}.remark|"
		            th:value="${entity?.remark}" 
		            data-th-text="${entity?.remark}"
		            class="layui-textarea" placeholder="请输入内容"
		            data-th-placeholder="#{SysCommon.placeholder}">
		        </textarea> -->
		        <textarea id="remark"
		            data-th-text="${entity?.remark}"
		            class="layui-textarea" placeholder="请输入内容"
		            data-th-placeholder="#{SysCommon.placeholder}">
		        </textarea>
			</div>
		</div>
		
		<div class="layui-form-item">
	        <div align="center" style="height:38px;padding-top: 10px;">
	            <a id="FlowRiskFlowAssets001_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
	            <a id="FlowRiskFlowAssets001_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
	        </div>
	    </div>
	</form>
	
	
</div>
<div layout:fragment="script">
	<style type="text/css">
		.repo-trade-middle{
	          width: 100%;
	          float: left;
	          margin-top: 90px;
		}
		.trade-btn-wrap{
		    display: block;
		    text-align: center;
		    color: #208fff;
		    padding: 5px 0;
		    
		    cursor: pointer;
		}
		.trade-btn-wrap:hover{
		    color: #0b72f1;
		}
		.trade-btn-wrap i{
		    display: block;
		}
		.trade-romove-btn{
		    margin-top: 15px;
		}
		
		.manage-info-item li {
			padding-right: 15px;
			line-height: 24px;
			margin-bottom:3px;
		}
		
		.manage-info-item {
			float: left;
			padding-right: 10px;
		}
		
		.manage-info-item .layui-form-checkbox {
			margin-right: 2px;
			margin-top: -2px;
			padding-right: 0;
			line-height: 15px;
			width: 15px;
			height: 15px;
		}
		
		.manage-info-item .layui-form-checkbox i {
			line-height: 15px;
			width: 15px;
			height: 15px;
			border-left: 1px solid #d2d2d2;
			font-size: 15px;
		}
		
		.trade-add-btn {
		    width: 30%;
		    margin: 0 34%;
		}
		.trade-romove-btn {
			width: 30%;
		    margin: 30px 34% 0 34%;
		}
		.ztree{
			overflow: initial !important;
		}
	</style>
    <script data-th-src="@{/js/invest/risk/stresstestmanage/flowriskflowassets/FlowRiskFlowAssets001.js}" type="text/javascript"></script>
    <script th:inline="javascript" type="text/javascript">
			var workflowId = /*[[${entity?.workflowId}]]*/'';
        </script>  
</div>
</body>
</html>
