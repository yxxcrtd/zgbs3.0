<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{CeAssetGroupManagement003}">新增资产</title>
    <style>
        .form-input-text{
            width: 17px;
            background: none;
            color: #2693ff;
            line-height: 30px;
            height: 30px;
            font-weight: bold;
        }
        .form-input-text:hover{
            color: #2693ff;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
    <div class='joyin-form-wrap  condition-area' >
        <form class="layui-form " id="submitForm">
            <input id="workflowId" name="workflowId" data-th-value="${workflowId}" type="hidden">
            <input id="seqno" name="seqno" data-th-value="${entity?.seqno}" type="hidden">
            <div class="">
                <label class="layui-form-label form-label-wrap"
                	data-th-text="#{CeAssetGroupManagement003.name}" style="width: 25%">系列名称</label>
                <div class="layui-input-inline input-inline" style="width: 50%!important;">
                    <input type="text" name="assetpoolName" id="CeAssetGroupManagement003_assetpoolName" data-th-Value = '${entity?.assetpoolName}' 
                        class="layui-input form-input" placeholder="请输入内容" required="required"/>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label form-label-wrap"
                	data-th-text="#{CeAssetGroupManagement003.idAndName}" style="width: 25%">资产代码/名称</label>
                <div class="input-btn-append">
                    <div class="layui-input-inline input-inline" style="width: 50%!important;">
                        <select type="text" class="layui-input form-input input-select" formatoption=false
                         name="finprodId" id="CeAssetGroupManagement003_finprodId" multiple="true"
                         data-th-data-url="@{/invest/risk/creditmanagement/ceassetgroupmanagement/CeAssetGroupManagement003/queryAssetInfo}"
                         placeholder="请输入内容 " required="required"/>
                        </select>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable" ></table>
    </div>
    </div>
    <div class="layui-col-md10" style="margin: 30px 0;">
        <div class="text-center">
            <a id="CeAssetGroupManagement003_btn_save"
               class="layui-btn layui-btn-sm btn-save"> 保存</a>
            <a id="CeAssetGroupManagement003_btn_submit"
               class="layui-btn layui-btn-sm btn-submit"
               data-th-text="#{SysCommon.submit}">提交</a>
            <a id="CeAssetGroupManagement003_btn_cancel"
               class="layui-btn layui-btn-sm btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var workflowId = /*[[${workflowId}]]*/ ;
    </script>
    <script
            data-th-src="@{/js/invest/risk/creditmanagement/ceassetgroupmanagement/CeAssetGroupManagement003.js}">
    </script>
</div>
</body>
</html>
