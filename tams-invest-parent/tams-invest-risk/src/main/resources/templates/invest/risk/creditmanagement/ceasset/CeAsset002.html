<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{CeAsset002}">资产授信新建</title>
<style type="text/css">

</style>
<script data-th-inline="javascript" type="text/javascript">
var entity=/*[[${entity}]]*/'';
</script>
</head>
<body>
	<div layout:fragment="content">
			<form class="layui-form joyin-form-wrap" id="ceAssetForm">
			<div class="pro-module-wrapper pro-module-base" th:title="#{CeAsset002.baseInfo}">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" th:text="#{CeAsset002.baseInfo}">基本信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
								<input type="hidden" id="seqno" name="seqno" data-th-value="${entity?.seqno}" >
									<input id="workflowId" name="workflowId" data-th-value="${workflowId}" type="hidden">
									<div class="pro-module-item">
										<div class="layui-form-item" >
										<!-- 展示修改 modify by gaopeng 20191019 start -->
										    <div class="form-inline-wrap" th:if="${cemodel} eq '01'">
							                    <label class="layui-form-label form-label-wrap" data-th-text="#{CeAsset002.assetName}">资产名称</label>
							                    <div class="layui-input-inline input-inline">
							                          <select  id="customerId" name="customerId"  required
					                                     class="layui-input form-input input-select" formatoption = "false"
					                                     th:placeholder="#{SysCommon.placeholder}" th:data-url="@{/invest/risk/creditmanagement/ceasset/CeAsset001/getFinprodMarketIds}"
					                                     allowClear="true" th:initValue="${entity?.customerId}"></select>
							                    </div>
							                </div>
							                <!-- 展示修改 modify by gaopeng 20191019 end -->
							                <div class="form-inline-wrap" th:if="${cemodel} eq '02'">
							                    <label class="layui-form-label form-label-wrap" data-th-text="#{CeAsset002.pflshName}">批复号名称</label>
							                    <div class="layui-input-inline input-inline">
							                          <input required type="text" name="pflshName" data-th-placeholder="#{SysCommon.placeholder}" id="pflshName"
													th:value="${entity?.pflshName}"	class="layui-input form-input input-text" />
							                    </div>
							                </div>
											<div class="form-inline-wrap" id="creditObj_div">
												<label class="layui-form-label form-label-wrap" data-th-text="#{CeAsset002.creditObj}">授信对象</label>
												<div class="layui-input-inline input-inline">
													<select required type="text" name="creditObj"class="layui-input form-input input-select"
															data-th-data-result='${CREDIT_OBJ}'
															data-th-initValue='${entity?.creditObj}'
															allowClear="true" data-th-placeholder="#{SysCommon.placeholder}" id="creditObj"
													></select>
												</div>
											</div>
                                            <!--资产授信新建增加字段 add by yufei 20200630 start-->
							                <div class="form-inline-wrap" id="creditAmtDiv">
							                    <label class="layui-form-label form-label-wrap" data-th-text="#{CeAsset002.creditTotalAmt}">授信总额度（亿元）</label>
							                    <div class="layui-input-inline input-inline">
							                       <input required type="text" id="creditAmt" name="creditAmt" data-textrange="4"
							                                           class="layui-input form-input text-number" placeholder="请输入内容"
							                                           th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.creditAmt}" >
							                    </div>
							                </div>
                                            <div class="form-inline-wrap" id="creditShareAmtDiv" style="display:none;">
                                                <label class="layui-form-label form-label-wrap" data-th-text="#{CeAsset002.creditShareAmt}">授信总份额（亿份）</label>
                                                <div class="layui-input-inline input-inline">
                                                    <input required type="text" name="creditShareAmt" 
                                                     th:value="${entity?.creditShareAmt}"
                                                    data-th-placeholder="#{SysCommon.placeholder}" id="creditShareAmt"
                                                    class="layui-input form-input input-text text-number" />    
                                                </div>
                                            </div>

						            	</div>
						            	<div class="layui-form-item">
											<!--资产授信新建增加字段 add by yufei 20200630 end-->
											<div class="form-inline-wrap" id="creditPriceDiv">
												<label class="layui-form-label form-label-wrap" data-th-text="#{CeAsset002.creditPrice}">价格</label>
												<div class="layui-input-inline input-inline">
													<input type="text" id="creditPrice" name="creditPrice" data-textrange="4" disabled
														   class="layui-input form-input text-number" placeholder="请输入内容"
														   th:placeholder="#{SysCommon.placeholder}"
														   th:value='${entity?.creditPrice}'>
												</div>
											</div>
											<div class="form-inline-wrap">
												<label class="layui-form-label form-label-wrap" data-th-text="#{CeAsset002.ifHavingOrgAmt}">是否占用机构授信</label>
												<div class="layui-input-inline input-inline">
													<select th:id="|${pageId}_creditFlag|" name="creditFlag" formatoption="false"
															class="layui-input form-input input-select"
															data-th-placeholder="#{SysCommon.placeholder}"
															data-th-initValue='${entity?.creditFlag}' required
															data-th-data-result="${YES_OR_NO}">
													</select>
												</div>
											</div>
						            	     <div class="form-inline-wrap">
							                    <label class="layui-form-label form-label-wrap" data-th-text="#{CeAsset002.pflsh}">批复号</label>
							                    <div class="layui-input-inline input-inline">
							                       <input required type="text" name="pflsh" data-th-placeholder="#{SysCommon.placeholder}" id="pflsh"
													th:value="${entity?.pflsh}"	class="layui-input form-input input-text" />	
							                    </div>
							                </div>
						            	</div>
                                        <!--资产授信新建增加字段 add by yufei 20200630 start-->
                                        <div class="layui-form-item">
											<div class="form-inline-wrap">
												<label class="layui-form-label form-label-wrap" data-th-text="#{CeAsset002.vdate}">生效日</label>
												<div class="layui-input-inline input-inline">
													<input required  type="text" id="vdate" name="vdate"
														   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
														   th:placeholder="#{SysCommon.placeholder}"
														   th:value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'>
												</div>
											</div>
											<div class="form-inline-wrap">
												<label class="layui-form-label form-label-wrap" data-th-text="#{CeAsset002.mdate}">到期日</label>
												<div class="layui-input-inline input-inline">
													<input required  type="text" id="mdate" name="mdate"
														   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
														   th:placeholder="#{SysCommon.placeholder}"
														   th:value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'>
												</div>
											</div>
                                            <div class="form-inline-wrap">
                                                <label class="layui-form-label form-label-wrap" data-th-text="#{CeAsset002.isLoopAmt}">是否循环额度</label>
                                                <div class="layui-input-inline input-inline">
                                                    <select required th:id="|${pageId}_isLoopAmt|" name="isLoopAmt" formatoption="false"
                                                        class="layui-input form-input input-select"
                                                        data-th-placeholder="#{SysCommon.placeholder}"
                                                        data-th-initValue='${entity?.isLoopAmt}'
                                                        data-th-data-result="${YES_OR_NO}">
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="layui-form-item">
											<!--<div class="form-inline-wrap" id="firstLendingIntervalDiv" style="display:none;">
												<label class="layui-form-label form-label-wrap" data-th-text="#{CeAsset002.firstLendingInterval}">首次开贷区间</label>
												<div class="layui-input-inline input-inline">
													<input required id="firstLendingInterval" name="firstLendingInterval"
														   class="layui-input form-input input-dateRangeSelect"
														   th:value='${entity?.firstLendingInterval}'
														   placeholder="请选择时间区间">
												</div>
											</div>-->
                                            <!--<div class="form-inline-wrap" id="approveVdateDiv" style="display:none;">
                                                <label class="layui-form-label form-label-wrap" data-th-text="#{CeAsset002.approveVdate}">审批开始日</label>
                                                <div class="layui-input-inline input-inline">
                                                   <input type="text" id="apprVdate" name="apprVdate"
                                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                                           th:placeholder="#{SysCommon.placeholder}"
                                                           th:value='${#dates.format(entity?.apprVdate,"yyyy-MM-dd")}'>
                                                </div>
                                            </div>
                                            <div class="form-inline-wrap" id="approveMdateDiv" style="display:none;">
                                                <label class="layui-form-label form-label-wrap" data-th-text="#{CeAsset002.approveMdate}">审批结束日</label>
                                                <div class="layui-input-inline input-inline">
                                                    <input type="text" id="apprMdate" name="apprMdate"
                                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                                           th:placeholder="#{SysCommon.placeholder}"
                                                           th:value='${#dates.format(entity?.apprMdate,"yyyy-MM-dd")}'>
                                                </div>
                                            </div>-->
											<!--<div class="form-inline-wrap">
												<label class="layui-form-label form-label-wrap" data-th-text="#{CeAsset002.holdMaturity}">是否持有至到期</label>
												<div class="layui-input-inline input-inline">
													<select th:id="|${pageId}_holdMaturity|" name="holdMaturity" formatoption="false"
															class="layui-input form-input input-select"
															data-th-placeholder="#{SysCommon.placeholder}"
															data-th-initValue='${entity?.holdMaturity}'
															data-th-data-result="${YES_OR_NO}">
													</select>
												</div>
											</div>-->
                                        </div>
                                        <!--资产授信新建增加字段 add by yufei 20200630 end-->
						            	 <div class="layui-form-item">
		                                    <div class="form-inline-wrap" style="width: 100%;">
		                                        <label class="layui-form-label form-label-wrap"
		                                            data-th-text="#{CeAsset002.remark}" style="width: 11.9%;">备注</label>
		                                        <div class="layui-input-inline input-inline" style="width: 85.6% !important;">
		                                            <textarea id="remark" name="remark" th:value="${entity?.remark}"
		                                                data-th-text="${entity?.remark}" class="layui-textarea"
		                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"></textarea>
		                                        </div>
		                                    </div>
                                		</div>
										<div class="layui-form-item">
											<div class="form-inline-wrap" style="width: 100%;">
												<label class="layui-form-label form-label-wrap"
													   data-th-text="#{CeAsset002.condition}" style="width: 11.9%;">授信使用条件</label>
												<div class="layui-input-inline input-inline" style="width: 85.6% !important;">
		                                            <textarea id="creditCondition" name="creditCondition" th:value="${entity?.creditCondition}"
															  data-th-text="${entity?.creditCondition}" class="layui-textarea"
															  placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"></textarea>
												</div>
											</div>
										</div>
					            	</div>
            				</div>
            			</div>
            	</div>
                <!-- 附件信息 -->
                <div class="page-component" th:data-path="@{/component/core/FileCommon/init}" th:data-params="|{businessId:'${entity?.seqno?:''}'}|"></div>             
			</form>
			<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
            <div class="text-center">
                <a id="CeAsset002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                <a id="CeAsset002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="CeAsset002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
		    
		    var workflowId = /*[[${workflowId}]]*/'';
		    // 资产授信新建增加字段 add by yufei 20200630 start
		    var finprodType2_F01 = /*[[${finprodType2_F01}]]*/'';// 数据字典.金融产品类型（投管）.债券
		    var finprodType2_F17 = /*[[${finprodType2_F17}]]*/'';// 数据字典.金融产品类型（投管）.计划类资产
			var finprodType2_F06 = /*[[${finprodType2_F06}]]*/'';// 数据字典.金融产品类型（投管）.基金
		    var finprodType2_F18 = /*[[${finprodType2_F18}]]*/'';// 数据字典.金融产品类型（投管）.项目类资产
			var finprodType2_F37 = /*[[${finprodType2_F37}]]*/'';// 数据字典.金融产品类型（投管）.项目类资产
			var type9_87 = /*[[${type9_87}]]*/'';// 数据字典. 项目类二级分类.私募股权基金
			var profitType_01 = /*[[${profitType_01}]]*/'';// 数据字典.收益类型.净值型
		    var profitType_03 = /*[[${profitType_03}]]*/'';// 数据字典.收益类型.货币型
		    var type9_P01 = /*[[${type9_P01}]]*/'';// 数据字典. 项目类一级分类.非标准化债权资产
		    var type9_P03 = /*[[${type9_P03}]]*/'';// 数据字典. 项目类一级分类.权益类投资
		    var type10_87 = /*[[${type10_87}]]*/'';// 数据字典. 项目类二级分类.私募股权基金
		    var creditObj_02 = /*[[${creditObj_02}]]*/'';// 数据字典. 授信对象.份额
		    // 资产授信新建增加字段  add by yufei 20200630 end
		</script>
		<script data-th-src="@{/js/invest/risk/creditmanagement/ceasset/CeAsset002.js}"></script>
	</div>
</body>
</html>
