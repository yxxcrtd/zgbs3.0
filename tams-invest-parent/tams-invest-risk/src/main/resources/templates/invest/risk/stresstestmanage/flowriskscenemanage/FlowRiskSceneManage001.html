<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{FlowRiskSceneManage001}">流动性风险-情景管理</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area">
            <a id="FlowRiskSceneManage001_btn_add"
               class="layui-btn layui-btn-sm btn-create"
               data-th-text="#{SysCommon.create}">新建</a>
           <a id="FlowRiskSceneManage001_btn_effective"
               class="layui-btn layui-btn-sm "
               >启用</a>
           <a id="FlowRiskSceneManage001_btn_neffective"
              class="layui-btn layui-btn-sm "
               >停用</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-row layui-col-space10"  >
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4" >
                            <label class="layui-form-label form-lable" data-th-text="#{FlowRiskSceneManage001.sceneTmplName}">情景模板名称</label>
							<div class="layui-input-inline input-inline">
								<input type="text" name="tmplName" id="tmplName" disabled
									class="layui-input form-input"
									data-th-value='#{FlowRiskSceneManage001.flowStressTestTmpl}'>
							</div>
                        </div>
                       	<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable" data-th-text="#{FlowRiskSceneManage001.sceneTmplNo}">情景模板编号</label>
							<div class="layui-input-inline input-inline">
								<input type="text" disabled class="layui-input form-input" data-th-value='FlowTestModel0001'>
                                <input type="hidden"  id="tpmlId" name="tpmlId" value="FlowTestModel0001" />
							</div>
                        </div>
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable" data-th-text="#{FlowRiskSceneManage001.sceneType}">情景类型</label>
							<div class="layui-input-inline input-inline">
								<input type="text" disabled class="layui-input form-input" data-th-value='#{FlowRiskSceneManage001.hypothesisScene}'>
                                <input type="hidden"  id="sceneType" name="sceneType" value="02" />
							</div>
                        </div>
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{FlowRiskSceneManage001.riskType}">适用风险分类</label>
							<div class="layui-input-inline input-inline">
								<input type="text" disabled class="layui-input form-input" data-th-value='#{FlowRiskSceneManage001.flowRisk}'>
                                <input type="hidden"  id="riskType" name="riskType" value="03" />
							</div>
                        </div>
                    </div>

                   <hr style="height:2px;border:none;border-top:2px #185598;" />

                    <div class="layui-row layui-col-space10">
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable" data-th-text="#{FlowRiskSceneManage001.sceneFuzzy}">情景名称|编号</label>
                            <div class="layui-input-inline input-inline">
    							 <select type="text" id="sceneIds" name="sceneIds" class="layui-input form-input input-select" 
								  		data-th-data-url="@{/invest/risk/stresstestmanage/flowriskscenemanage/FlowRiskSceneManage001/fuzzySelectScene}"
								  		formatoption = false placeholder="请输入内容" multiple="true" data-th-placeholder="#{SysCommon.placeholder}" >
								</select>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable" data-th-text="#{FlowRiskSceneManage001.suitProduct}">适用产品</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="openMode" name="openMode"
                                        class="layui-input form-input input-select" 
                                        allowClear="true" placeholder="请输入内容" 
                                        data-th-data-result='${OPENMODE}'
                                        data-th-placeholder="#{SysCommon.placeholder}" >
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable" data-th-text="#{FlowRiskSceneManage001.sceneType2}">情景二级类型</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="sceneType2" name="sceneType2"  class="layui-input form-input input-select" 
    									 allowClear="true" placeholder="请输入内容"
    									 data-th-data-result='${SCENE_TYPE2}'
    									 data-th-placeholder="#{SysCommon.placeholder}">
    							</select>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4" style="display:none">
                            <label class="layui-form-label form-lable" data-th-text="#{FlowRiskSceneManage001.riskType2}">适用二级分类</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="riskType2" name="riskType2"  class="layui-input form-input input-select" 
    									 allowClear="true" placeholder="请输入内容"
    									 data-th-data-result='${RISK_TYPE2}'
    									 data-th-placeholder="#{SysCommon.placeholder}">
    							</select>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4" >
                            <label class="layui-form-label form-lable" data-th-text="#{FlowRiskSceneManage001.relatedFactor}">关联因子</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="ftrIds" name="ftrIds" multiple="true" 
                                        class="layui-input form-input input-select" 
                                        allowClear="true" placeholder="请输入内容" 
                                        data-th-data-result='${FLOW_RISK_FACTOR}'
                                        data-th-placeholder="#{SysCommon.placeholder}" >
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable" data-th-text="#{FlowRiskSceneManage001.effStatus}">启用状态</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="effStatus" name="effStatus"
                                        class="layui-input form-input input-select" 
                                        allowClear="true" placeholder="请输入内容" 
                                        data-th-data-result='${SCENE_EFF_STATUS}'
                                        data-th-placeholder="#{SysCommon.placeholder}" >
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
		<style type="text/css">
			.layui-table-cell .effstatus{
				padding: 0 11px;
				cursor:auto;
				border-radius:3px;
			}
			.layui-table-cell .effstatus:hover{
				margin: 0 4px 1px 4px;
				border:none;
			}
		</style>
    <script data-th-src="@{/js/invest/risk/stresstestmanage/flowriskscenemanage/FlowRiskSceneManage001.js}" type="text/javascript"></script>
</div>
</body>
</html>
