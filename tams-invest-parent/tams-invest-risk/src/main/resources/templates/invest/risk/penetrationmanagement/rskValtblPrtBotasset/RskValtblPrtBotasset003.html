<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{RskValtblPrtBotasset002}">底层资产映射编辑</title>
    <style>
        .layui-fluid{
            padding:0;
        }
        .table-wrap .layui-table-view .layui-table-header table thead tr{
            background-color: #d9ecff!important;
        }
        .port-wrap{
            border-left: 1px solid #ddd;
            border-right: 1px solid #dddddd;
            border-bottom: 1px solid #dddddd;
        }
        .port-title{
            padding: 20px 0 7px 20px;
            border-bottom: 1px dashed #dddddd;
            color: #444444;
            font-size: 14px;
        }
        .port-text{
            color: #f79415;
            padding-right: 5px;
        }
        .port-dl{
            padding-top: 5px;
            overflow: hidden;
        }
        .port-dt{
            color: #444444;
            float: left;
        }
        .port-dd{
            color: #444444;
            float: left;
            padding-left: 5px;
        }
        .port-dd-text{
            float: left;
            padding-left: 5px;
        }
         .port-dl-wrap{
            padding-left:30px;
        }
        .form-input-wrap{
            border-bottom: 1px dashed #ddd;
            padding: 15px 0 7px 0;
        }
        .port-right-wrap{
            border-right: 1px solid #dddddd;
            border-bottom: 1px solid #dddddd;
        }
        .portofo-container{
            overflow: hidden;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="portofo-container">
        <input id="ptlId" data-th-value="${ptlId}" hidden>
        <input id="finprodId" data-th-value="${finprodId}" hidden>
        <input id="assetSource" data-th-value = "${assetSource}" hidden>
        <div class="layui-col-xs12 layui-col-sm12 layui-col-md12 layui-col-lg12" style=" padding-bottom: 10px; border-bottom: 1px solid #ddd;">
            <div class="port-dl-wrap">
                <dl class="port-dl">
                    <dt class="port-dt">资管计划:</dt>
                    <dd class="port-dd" id="ptlName" data-th-text="${ptlName}"></dd>
                </dl>
                <dl class="port-dl">
                    <dt class="port-dt">科目代码:</dt>
                    <dd class="port-text" id="subCode" data-th-text="${subCode}"></dd>
                </dl>
                <dl class="port-dl">
                    <dt class="port-dt">科目名称:</dt>
                    <dd class="port-dd" id="subName"  data-th-text="${subName}"></dd>
                </dl>
                <dl class="port-dl">
                    <dt class="port-dt">未映射:</dt>
                    <dd class="port-text port-dd-text"  id="countForValUnmapped"  data-th-text="${countForValUnmapped}">0</dd>
                </dl>
                <dl class="port-dl">
                    <dt class="port-dt">不同映射:</dt>
                    <dd class="port-text port-dd-text" id="countForValDiffmapped" data-th-text="${countForValDiffmapped}">0</dd>
                </dl>
            </div>
        </div>
    </div>
    <div class="layui-row text-center" style="margin:30px 0;">
        <a id="RskValtblPrtBotasset003_btn_applyMapForValUnmapped" class="layui-btn layui-btn-sm">应用未映射</a>
        <a id="RskValtblPrtBotasset003_btn_applyMapDiffmapped" class="layui-btn layui-btn-sm">应用不同映射</a>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/risk/penetrationmanagement/rskValtblPrtBotasset/RskValtblPrtBotasset003.js}" type="text/javascript"></script>
</div>
</body>
</html>
