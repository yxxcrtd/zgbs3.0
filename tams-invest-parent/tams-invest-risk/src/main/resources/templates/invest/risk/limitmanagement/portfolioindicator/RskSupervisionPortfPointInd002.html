<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RskSupervisionPortfPoint002}">新建指标关联组合</title>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap" id="submitForm">
			<input type="hidden" id="rskSupervisionIndId" name="rskPortfolioIndicatorDto.indId"
				data-th-value="${entity?.rskPortfolioIndicatorDto?.indId}">
			<input type="hidden" name="rskPortfolioIndicatorDto.indName"
				data-th-value="${entity?.rskPortfolioIndicatorDto?.indName}">
			<input id="workflowId" name="workflowId"
				data-th-value="${workflowId}" type="hidden">
			<div id="rskSupervisionIndicator004Div" style="height:400px"
				th:replace="invest/risk/limitmanagement/superviseindicator/RskSupervisionIndicator004 :: #RskSupervisionIndicator004Div">
			</div>
		</form>

		<div class="layui-form-item" align="center">
				<a id="RskSupervisionPortfPointInd002_btn_save"
					class="layui-btn layui-btn-sm btn-save"
					data-th-text="#{SysCommon.save}">保存</a> <a
					id="RskSupervisionPortfPointInd002_btn_submit"
					class="layui-btn layui-btn-sm btn-submit"
					data-th-text="#{SysCommon.submit}">提交</a> <a
					id="RskSupervisionPortfPointInd002_btn_cancel"
					class="layui-btn layui-btn-sm btn-cancel"
					data-th-text="#{SysCommon.cancel}">取消</a>
		</div>
	</div>
	<div layout:fragment="script">
		<style>
		.layui-form-radio {
			line-height: 14px !important
		}
		
		.layui-form-radio>i {
			font-size: 16px !important
		}
		
		.manage-info-item li {
			float: left;
			padding-right: 15px;
			line-height: 24px;
			margin-bottom: 3px;
		}
		
		.manage-info-item {
			float: left;
			padding-right: 10px;
		}
		
		.manage-info-item .layui-form-checkbox {
			margin-right: 2px;
			margin-top: -2px;
			padding-right: 0;
			line-height: 15px;
			width: 15px;
			height: 15px;
		}
		
		.manage-info-item .layui-form-checkbox i {
			line-height: 15px;
			width: 15px;
			height: 15px;
			border-left: 1px solid #d2d2d2;
			font-size: 15px;
		}
		
		.manage-info-item .layui-form-checked i, .manage-info-item .layui-form-checked:hover i
			{
			border-color: #2693ff;
			color: #2693ff;
		}
		
		.manage-info-item .layui-form-radio {
			margin-top: 0px
		}
		
		.line24 {
			line-height: 24px;
			padding: 0px 10px 0px 0px;
		}
		
		.width30 {
			width: 30%;
		}
		
		.rsk-tree .layui-input .ztree #treeDataSingle_tree_2_a{
				white-space: nowrap;
		     width: 350px; 
		    text-overflow: ellipsis;
		    overflow: hidden;
				}
				
		 .sgePortDiv{
			   width:100%;
			   overflow:hidden;
			   clear:both;
			   padding-top: 8px;
			   }
		 .sgePort23sub{
		 width:23%!important
		 }
		 .sgePort14sub{
		 width:14%!important
		 }
		</style>
		<script data-th-inline="javascript" type="text/javascript">
			var entity=/*[[${entity}]]*/'';
			var PORTFOLIO_LEVEL=/*[[${PORTFOLIO_LEVEL}]]*/'';  //组合层次数据字典下拉
			var PORTFOLIO_LEVEL_01=/*[[${PORTFOLIO_LEVEL_01}]]*/''; // 组合层次-单组合
			var CLASSIFY_DIMENSION_01=/*[[${CLASSIFY_DIMENSION_01}]]*/''; // 分类维度-收益类型
		</script>
		<script
			data-th-src="@{/js/invest/risk/limitmanagement/portfolioindicator/RskSupervisionPortfPointInd002.js}"></script>
	</div>
</body>

</html>
