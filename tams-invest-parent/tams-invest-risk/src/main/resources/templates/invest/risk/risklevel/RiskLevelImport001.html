<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/default}">
<head>
	<title>风险五级分类导入</title>
</head>
<body>
<div layout:fragment="content">
	<!-- 画面信息 -->
	<div class='layui-fluid' id="RiskLevelImport_DIV">
		<div
				class="layui-col-xs12 layui-col-md12 layui-col-sm12 layui-col-lg12 form-button-area"
				style="margin: 10px;">
			<a id="RiskLevelImport_btn_delete"
			   class="layui-btn layui-btn-sm btn-delete"
			   data-th-text="#{SysCommon.delete}">删除</a>
			<a id="RiskLevelImport_btn_import"
			   class="layui-btn layui-btn-sm btn-import"
			   data-th-text="#{SysCommon.import}">导入</a>
		</div>
		<div class="joyin-form-wrap joyin-filter-form condition-area">
			<form class="layui-form" id="searchForm">
				<div class="layui-form-item">
					<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable" >资产类型</label>
						<div class="layui-input-inline input-inline">
							<select id="assetsType" name="assetsType"
									class="layui-input form-input input-select" multiple
									data-th-data-result='${finprodTypeTG}' allowClear="true"
									placeholder="请输入内容" childrenIds="finprodId"
									data-th-placeholder="#{SysCommon.placeholder}">
							</select>
						</div>
					</div>
					<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable">资产名称</label>
						<div class="layui-input-inline input-inline">
							<select id="finprodName" name="finprodName" parentIds="assetsType"
									class="layui-input form-input input-select"
									data-th-data-url='@{/invest/basicdata/assetdeclarationcodemaintenance/AssetDeclarationCodeMaintenance001/getFinprodList}' allowClear="true"
									placeholder="请输入内容"  multiple
									data-th-placeholder="#{SysCommon.placeholder}">
							</select>
						</div>
					</div>
				</div>

				<div class="layui-form-item">
				    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable">风险五级分类</label>
						<div class="layui-input-inline input-inline">
							<select id="bondRiskType" name="bondRiskType"
									class="layui-input form-input input-select" multiple
									placeholder="请输入内容"   data-th-data-result='${BOND_RISK_TYPE}'
									data-th-placeholder="#{SysCommon.placeholder}">
							</select>
						</div>
					</div>
				</div>
			</form>
		</div>
		<div>
			<table class="layui-table" id="dataTable"></table>
		</div>
	</div>
</div>
<div layout:fragment="script">
	<script
			data-th-src="@{/js/invest/risk/risklevel/RiskLevelImport001.js}"
			type="text/javascript"></script>
</div>
</body>
</html>
