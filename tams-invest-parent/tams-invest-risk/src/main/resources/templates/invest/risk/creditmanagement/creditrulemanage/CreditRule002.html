<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{CreditRule002}">额度校验规则新建</title>
	<style type="text/css">
		.form-label-wrap{
			width: 26%;
		}
		.form-lable{
			width: 26%;
		}
	</style>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap" id="submitForm">
			<div class="layui-form-item">
				<div>
					<label class="layui-form-label form-lable mst-lable"
						   data-th-text="#{CeRule002.astType1}">资产大类</label>
					<div class="layui-input-inline input-inline">
						<select id="astType1" name="astType1" required="required"
								class="layui-input form-input input-select"
								placeholder="请选择" data-th-placeholder="#{SysCommon.placeholder}" allowClear="true"
								data-th-data-result='${RISK_ASSET_TYPE}' childrenids="astType2"
								th:initValue="${entity?.astType1}">
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div id="selector3">
					<label class="layui-form-label form-label-wrap mst-lable"
						   data-th-text="#{CeRule002.astType2}">资产二级分类
					</label>
					<div class="layui-input-inline input-inline">
						<select id="astType2" name="astType2"
								th:initValue="${entity?.astType2}"
								class="layui-input form-input input-select"
								allowClear="true" placeholder="请选择"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result="${RISK_ASSET_TYPE_TWO}"
								formatoption="true" childrenids="astType3" parentids="astType1" disabled="disabled"></select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div id="selector4">
					<label class="layui-form-label form-label-wrap mst-lable"
						   data-th-text="#{CeRule002.astType3}">资产三级分类
					</label>
					<div class="layui-input-inline input-inline">
						<select id="astType3" name="astType3"
								th:initValue="${entity?.astType3}"
								class="layui-input form-input input-select"
								allowClear="true" placeholder="请选择"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result="${RISK_ASSET_TYPE_THREE}"
								formatoption="true" childrenids="astType4"  parentIds="astType2"  disabled="disabled"></select>
					</div>
				</div>
			</div>
			<div class="layui-form-item" id="selector5">
				<div>
					<label class="layui-form-label form-label-wrap mst-lable"
						   data-th-text="#{CeRule002.astType4}">资产四级分类
					</label>
					<div class="layui-input-inline input-inline">
						<select id="astType4" name="astType4"
								th:initValue="*{entity?.astType4}"
								class="layui-input form-input input-select"
								allowClear="true" placeholder="请选择"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result="${RISK_ASSET_TYPE_FOUR}"
								formatoption=true childrenIds="astType5" parentIds="astType3"  disabled="disabled"></select>
					</div>
				</div>
			</div>
			<div class="layui-form-item" id="selector6">
				<div>
					<label class="layui-form-label form-label-wrap mst-lable"
						   data-th-text="#{CeRule002.astType5}">资产五级分类
					</label>
					<div class="layui-input-inline input-inline">
						<select id="astType5" name="astType5"
								th:initValue="*{entity?.astType5}"
								class="layui-input form-input input-select"
								allowClear="true" placeholder="请选择"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result="${RISK_ASSET_TYPE_FIVE}"
								formatoption=true parentIds="astType4"  disabled="disabled"
								></select>
					</div>
				</div>
			</div>
			<!--<div class="layui-form-item">
				<div>
					<label class="layui-form-label form-label-wrap mst-lable"
						   data-th-text="#{CeRule002.underAssetType}">底层资产类型
					</label>
					<div class="layui-input-inline input-inline">
						<select id="underAssetType" name="underAssetType"
								 required="required"
								class="layui-input form-input input-select"
								allowClear="true" placeholder="请选择"
								data-th-placeholder="#{SysCommon.placeholder}"
								formatoption=true></select>
					</div>
				</div>
			</div>-->
            <div class="form-inline-wrap" style="display: none">
                          <input id='creditRuleId' name='creditRuleId'
                                 class="layui-input form-input" 
                                 data-th-placeholder="#{SysCommon.placeholder}"
                                 data-th-value="${entity?.creditRuleId}" />
           </div>
			<div class="layui-form-item">
				<div>
					<label class="layui-form-label form-lable mst-lable"
						data-th-text="#{CeRule002.deductObjType}">扣减对象</label>
					<div class="layui-input-inline input-inline">
						<select type="text" id="deductObjType"
							name="deductObjType" required="required"
							class="layui-input form-input input-select"  
                             data-th-data-result="${DEDUCTION_OBJECT}"
							allowClear="true"  placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-initValue="${entity?.deductObjType}">
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div>
					<label class="layui-form-label form-lable mst-lable"
						data-th-text="#{CeRule002.creditTag}">额度标签</label>
					<div class="layui-input-inline input-inline">
						<select type="text" id="creditTagId"
								name="creditTagId" required="required"
								class="layui-input form-input input-select"
								allowClear="true"  placeholder="请输入内容"
								th:data-url="@{/invest/risk/creditmanagement/creditlinemanage/CeLine001/getLimitLabel}"
								data-th-placeholder="#{SysCommon.placeholder}" formatoption="false"
								data-th-initValue="${entity?.creditTagId}">
						</select>
					</div>
				</div>
			</div>

		</form>
	
		<div  style="margin:30px 0;">
			<div class="text-center">
				<a id="CeRule002_btn_save"
					class="layui-btn layui-btn-sm btn-save"
					data-th-text="#{SysCommon.save}">保存</a>
					<a id="CeRule002_btn_submit"
					class="layui-btn layui-btn-sm btn-submit"
					data-th-text="#{SysCommon.submit}">提交</a> 
					<a id="CeRule002_btn_cancel"
					class="layui-btn layui-btn-sm btn-cancel"
					data-th-text="#{SysCommon.cancel}">取消</a>
			</div>
		</div>
	 </div>
	<div layout:fragment="script">
	    <script data-th-inline="javascript" type="text/javascript">
			var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
		</script>
		<script data-th-src="@{/js/invest/risk/creditmanagement/creditrulemanage/CreditRule002.js}"></script>
    </div>
</body>
</html>
