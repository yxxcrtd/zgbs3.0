<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>风险因子管理</title>
<link rel="stylesheet" data-th-href="@{/js/invest/risk/stresstestmanage/flowriskflowassets/iconfont.css} ">
</head>
<body>
    <div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;" export="false" >
				<!--<a id="RiskFactor001_btn_add" class="layui-btn layui-btn-sm btn-create"
					>新建</a>-->
				<a id="RiskFactor001_btn_y" class="layui-btn layui-btn-sm "
				>启用</a>
				<a id="RiskFactor001_btn_n" class="layui-btn layui-btn-sm "
				>停用</a>
				<a id="RiskFactor001_btn_export" class="layui-btn layui-btn-sm "
				>导出</a>
			</div> 
			
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable">风险分类</label>
							<div class="layui-input-inline input-inline">
                                <select type="text" id="investtype1" name="type1" class="layui-input form-input input-select"
										data-th-data-result='${FTR_RSK_TYPE}'
								  		formatoption = false placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
								  		>
								 </select>	
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable">因子分类</label>
							<div class="layui-input-inline input-inline" id='div1'>
                               <!-- <select type="text" id="investtype2" name="type2" class="layui-input form-input input-select" 
								  		
								  		formatoption = false placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
								  		childrenIds="twoClass"
								  		 >
								</select> -->
								
									<select type="text" id="investtype2" name="type2" class="layui-input form-input input-select"
								        placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
								        data-th-initValue="${entity?.investtype2}" allowClear="true" data-th-data-result='${SEC_NAME}'
								        ></select>
								
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable">因子二级分类</label>
							<div class="layui-input-inline input-inline" >
								<select type="text" id="mrkFtrType2" name="mrkFtrType2" class="layui-input form-input input-select"
										placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
										data-th-initValue="${entity?.mrkFtrType2}" data-th-data-result='${SEC_NAME}' allowClear="true"
								></select>

							</div>
						</div>
						

					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable">因子名称</label>
							<div class="layui-input-inline input-inline"  id='div2'>

								<!-- 	    <select type="text" id="twoClass" name="twoClass" class="layui-input form-input input-select"
                                              data-th-data-url="@{/invest/risk/stresstestmanage/riskfactor/RiskFactor001/selectRiskFactorMap/}"
                                              formatoption = false placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" >
                                    </select> -->


								<select type="text" id="twoClass" name="twoClass" class="layui-input form-input input-select"
										placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
										data-th-initValue="${entity?.twoClass}" allowClear="true" data-th-data-result='${SEC_TYPE2}'
								></select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable">因子类型</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="FTRVALUESTRUCT" name="FTRVALUESTRUCT" class="layui-input form-input input-select"
								        placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
								        data-th-initValue="${entity?.FTRVALUESTRUCT}" allowClear="true" data-th-data-result='${VALUE_STRUCT}'
								        ></select>	
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable">运用状态</label>
							<div class="layui-input-inline input-inline">
                            	 <select type="text" id="FTRSTATUS" name="FTRSTATUS" class="layui-input form-input input-select"
								        placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
								        data-th-initValue="${entity?.FTRSTATUS}" allowClear="true" data-th-data-result='${FTR_STATUS}'
								       ></select>
							</div>
						</div>
					</div>
				</form>
			</div>
			
			<div>
				<table class="layui-table" id="oneTable"></table>
			</div>
			<div style="height:50px;"></div>
		</div>
	</div>
    <div layout:fragment="script">
    	<style type="text/css">
			.layui-table-cell .effstatus{
				padding: 0 11px;
				cursor:auto;
				border-radius:3px;
			}
			.layui-table-cell .effstatus:hover{
				margin: 0 4px 1px 4px;
				border:none;
			}
		</style>
		<script th:inline="javascript" type="text/javascript">
			var ftrType2List=/*[[${ftrType2List}]]*/'';
		</script>
		<script data-th-src="@{/js/invest/risk/stresstestmanage/riskfactor/RiskFactor001.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
