<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{FundGoal002}">基金投向维护新建</title>
    <style>
        .mst-lable{
            width: 20%;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div>
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <input id="finprodId" name="finprodId" data-th-value="${entity?.finprodId}" hidden>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{FundGoal002.finprodAbbr}">资产简称</label>
                                    <div class="layui-input-inline input-inline">
                                        <select  type="text" id="finprodAbbr" name="finprodAbbr"
                                                 class="layui-input form-input input-select"
                                                 allowClear="true" placeholder="请输入内容"
                                                 data-th-placeholder="#{SysCommon.placeholder}"
                                                 data-th-data-url="@{/invest/risk/fundgoal/FundGoal001/getFinprodMarketIdList}"
                                                 data-th-initValue="${entity?.finprodMarket}" required="required"></select>
                                    </div>
                                </div>

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{FundGoal001.finprodId}">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="finprodMarket" name="finprodMarket" required="required"
                                                class="layui-input form-input" disabled="disabled"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.finprodMarket}">
                                    </div>
                                </div>

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{FundGoal002.goalDate}">投向维护日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="goalDate" name="goalDate" required="required"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" disabled = "disabled"
                                               data-th-value="${#dates.format(entity?.goalDate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{FundGoal002.nextPubDate}">下一投向公布日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="nextPubDate" name="nextPubDate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" required="required"
                                               data-th-value="${#dates.format(entity?.nextPubDate,'yyyy-MM-dd')}">
                                    </div>
                                </div>

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{FundGoal002.equityPer}">权益类占比</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="bEquityPer" name="bEquityPer" placeholder="请输入内容"
                                               data-pattern="" required="required"
                                               class="layui-input form-input text-number"
                                               data-th-value="${entity?.bEquityPer}" maxlength="16"/>
                                        <span class="input-right-show">%</span>
                                    </div>
                                </div>

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{FundGoal002.creditorRightsPer}">债权类占比</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="bCreditorRightsPer" name="bCreditorRightsPer" placeholder="请输入内容"
                                               data-pattern="" required="required"
                                               class="layui-input form-input text-number"
                                               data-th-value="${entity?.bCreditorRightsPer}" maxlength="16"/>
                                        <span class="input-right-show">%</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{FundGoal002.commodityDervPer}">金融及其他衍生品占比</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="bCommodityDervPer" name="bCommodityDervPer" placeholder="请输入内容"
                                               data-pattern="" required="required"
                                               class="layui-input form-input text-number"
                                               data-th-value="${entity?.bCommodityDervPer}" maxlength="16"/>
                                        <span class="input-right-show">%</span>
                                    </div>
                                </div>

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{FundGoal002.debtPer}">负债占比</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="bDebtPer" name="bDebtPer" placeholder="请输入内容"
                                               data-pattern="" required="required"
                                               class="layui-input form-input text-number"
                                               data-th-value="${entity?.bDebtPer}" maxlength="16"/>
                                        <span class="input-right-show">%</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                        <div class="text-center">
                            <a id="FundGoal002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                               data-th-text="#{SysCommon.submit}">提交</a>
                            <a id="FundGoal002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                               data-th-text="#{SysCommon.cancel}">取消</a>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/risk/fundgoal/FundGoal002.js}"></script>
</div>
</body>
</html>
