<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
	<title data-th-text="#{RskSupervisionPortfPoint002}">新建组合关联指标</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm">
              <input id="workflowId" name="workflowId" data-th-value="${workflowId}" type="hidden">
               <input type="hidden" id="portfolioCode" name="portfolioId"  data-th-value="${entity?.portfolioId}" >
                <input type="hidden" id="portfolioLevel" name="portfolioLevel"  data-th-value="${entity?.portfolioLevel}" >
             <div class="layui-form-item" style="margin-left: 20px">
                <label class="layui-form-label line24" data-th-text="#{RskSupervisionPortfPoint002.portfolioName}">组合名称</label>
                <div class="layui-input-inline input-inline" style="width:85%!important">
                   <input class="layui-input form-input" id="portfolioName" name="portfolioName"  data-th-value="${entity?.portfolioName}" disabled>					          
                </div>
            </div>
           <div class="layui-form-item" id="portfMixDiv" style="margin-left: 20px;display: none">
                <label class="layui-form-label line24" data-th-text="#{RskSupervisionPortfPoint002.portfolioMix}">组合成分</label>
                <div class="layui-input-inline input-inline" style="width:85%!important">
                   <input class="layui-input form-input" id="portfolioMix"   data-th-value="${portfolioMixName}" disabled>					          
                </div>
            </div>
            <div class="layui-form-item"  style="margin-bottom:8px;margin-left: 20px">
					<label class="layui-form-label line24"
						data-th-text="#{RskSupervisionPortfPoint002.effDate}">有效区间</label>
					<div class="layui-input-inline input-inline" style="width:85%!important">
						<input style="float: left;width:48%;margin-right:5px" type="text" id="startDate" name="startDate" data-th-value='${#dates.format(entity?.startDate,"yyyy-MM-dd")}' 
						 required="required" class="layui-input form-input input-dateSelect"/>
						 <span style="float: left;;margin-right:11px;margin-left:8px">-</span>
						 <input style="float: right;width:48%" type="text" id="endDate" name="endDate" data-th-value='${#dates.format(entity?.endDate,"yyyy-MM-dd")}' 
						 class="layui-input form-input input-dateSelect"/>
					</div>
			</div>
		</form>
		   <div class="pro-module-wrap" style="border-top:1px solid #ccc ">
               <div class="pro-module">
				  	<h3 class="pro-module-title"><span class="title-des">筛选监督指标</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
			        <div class="pro-module-item">
						<div class="layui-form-item">
				            <div class="form-inline-wrap width30">
				                <label class="layui-form-label form-label-wrap"  data-th-text="#{RskSupervisionPortfPoint002.indName}">指标名称</label>             
				                <div class="layui-input-inline input-inline">
				                   <input type="text" id="indName" class="layui-input form-input" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
				                </div>
				            </div>
				            <div class="form-inline-wrap width30">
				                <label class="layui-form-label form-label-wrap" style="line-height: 24px" data-th-text="#{RskSupervisionPortfPoint002.indType}">指标类型</label>             
				                <div class="layui-input-inline input-inline">
								    <select  id="indType" formatoption="false"  class="layui-input form-input input-select" data-th-data-result='${IND_TYPE}'  data-th-placeholder="#{SysCommon.placeholder}" >	
								    </select>				    
				                </div>
				            </div>
				            <div class="form-inline-wrap width30">
				                <label class="layui-form-label form-label-wrap" data-th-text="#{RskSupervisionPortfPoint002.supType}">监督类型</label>             
				                <div class="layui-input-inline input-inline">
				                      <input type="text" id="supType" name="supType"  class="layui-input form-input input-checkbox" data-th-data-result="${SUP_TYPE}"/>
				                </div>
				            </div>
				           <div class="form-inline-wrap " style="width:9%">
					            <div class="layui-inline layui-col-md2">
					                   <a id="RskSupervisionPortfPoint002_BTN_search" class="layui-btn layui-btn-sm btn-search" data-th-text="#{SysCommon.search}">查询</a>
					            </div>
				           </div>
			       		 </div>
			       	
			       </div>
			        <div class="layui-row" id="singleTableDiv">
		            <table class="layui-table" id="portfRelateIndTable" ></table>
		        	</div>
	       		</div>
	       </div>
       
        <div class="layui-form-item" align="center">
            <a id="RskSupervisionPortfPoint002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="RskSupervisionPortfPoint002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">保存</a>
            <a id="RskSupervisionPortfPoint002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div> 
    </div>
    <div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
		     var entity=/*[[${entity}]]*/'';
		     var formTodoList = /*[[${formTodoList}]]*/false;
		     var FORBID_ASSETTYPE=JSON.parse(/*[[${FINPROD_TYPE_TG}]]*/'[]'); // 资产类型
		     var FORBID_BONDTYPE=JSON.parse(/*[[${WINDTYPEONE}]]*/'[]'); // 债券资产类型
		     var FORBID_FUNDTYPE=JSON.parse(/*[[${FUND_ASSET_SECOND_TYPE}]]*/'[]'); // 基金资产类型
		     var FORBID_DEBTRATE=JSON.parse(/*[[${SVR_MAIN_GRADE}]]*/'[]'); // 债项评级
		     var FORBID_BODYRATE=JSON.parse(/*[[${SVR_MAIN_GRADE}]]*/'[]'); // 主体评级
		     var FORBID_INDUSTRY=JSON.parse(/*[[${SW_INDUSTRY_ONE_TYPE}]]*/'[]'); // 负面行业清单
		     var IND_TYPE_FORBID_ASSETTYPE=/*[[${IND_TYPE_FORBID_ASSETTYPE}]]*/''; // 资产类型
		     var IND_TYPE_FORBID_BONDTYPE=/*[[${IND_TYPE_FORBID_BONDTYPE}]]*/''; // 债券资产类型
		     var IND_TYPE_FORBID_FUNDTYPE=/*[[${IND_TYPE_FORBID_FUNDTYPE}]]*/''; // 基金资产类型
		     var IND_TYPE_FORBID_DEBTRATE=/*[[${IND_TYPE_FORBID_DEBTRATE}]]*/''; // 债项评级
		     var IND_TYPE_FORBID_BODYRATE=/*[[${IND_TYPE_FORBID_BODYRATE}]]*/''; // 主体评级
		     var IND_TYPE_FORBID_INDUSTRY=/*[[${IND_TYPE_FORBID_INDUSTRY}]]*/''; // 负面行业清单
		     var SUP_UNIT=/*[[${SUP_UNIT}]]*/'';  //单位数据字典下拉
		     
		     var IND_TYPE_TOTAL_ENUM=/*[[${IND_TYPE_TOTAL_ENUM}]]*/'';
			 var relateIndType=/*[[${IND_TYPE_LINK_ENCODE}]]*/'';
		</script>
		<style>
			.line24{
			line-height: 24px;
			padding:0px 10px 0px 0px;
			}
			.width30{
			width:30%;
			}
		</style>
        <script data-th-src="@{/js/invest/risk/limitmanagement/portfolioindicator/RskSupervisionPortfPoint002.js}"></script>
    </div>
</body>

</html>
