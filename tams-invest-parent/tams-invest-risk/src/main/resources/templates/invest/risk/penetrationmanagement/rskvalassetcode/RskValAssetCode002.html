<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RskValAssetCode002}">新建映射名称</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm">
            <div class="layui-form-item">
                <div>
                    <input type="text" id="id" name="id" data-th-value="${entity?.id}" hidden/>
                </div>
                <div>
                    <label class="layui-form-label form-label-wrap"
                        data-th-text="#{RskValAssetCode002.name}" style="width: 25%">映射名称</label>
                    <div class="layui-input-inline input-inline" style="width: 70%!important;">
                        <input type="text" class="layui-input form-input" placeholder="请输入内容" 
                        data-th-placeholder="#{SysCommon.placeholder}" id="name" name="name"
                        required="required" data-th-value="${entity?.name}" th:maxlength="50">
                    </div>
                </div>
            </div>
        </form>
        <div class="layui-col-md10" style="margin-top: 40px;">
            <div class="text-center">
                <a id="RskValAssetCode002_btn_save"
                   class="layui-btn layui-btn-sm btn-save"
                   data-th-text="#{SysCommon.save}">保存</a>
                <a id="RskValAssetCode002_btn_cancel"
                    class="layui-btn layui-btn-sm btn-cancel"
                    data-th-text="#{SysCommon.cancel}">取消</a>
            </div> 
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/risk/penetrationmanagement/rskvalassetcode/RskValAssetCode002.js}"
            type="text/javascript">
        </script>
    </div>
</body>
</html>
