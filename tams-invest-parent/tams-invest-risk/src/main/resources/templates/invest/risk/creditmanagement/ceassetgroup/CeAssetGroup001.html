<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{CeAssetGroup001}">资产系列授信</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				
				<a id="CeAssetGroup001_btn_add" class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a>
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								data-th-text="#{CeAssetGroup001.assetGroupName}">系列名称</label>
							<div class="layui-input-inline input-inline">
		                       <select  id="customerId" name="customerId"
                             class="layui-input form-input input-select" 
                             th:placeholder="#{SysCommon.placeholder}"
                             th:data-url="@{/invest/risk/creditmanagement/ceassetgroup/CeAssetGroup001/getAssetGroupAliasIds}" allowClear="true"
                             formatoption="false"></select>
		                    </div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{CeAssetGroup001.pflsh}">批复号</label>
							<div class="layui-input-inline input-inline">
								<input type="text" name="pflsh" data-th-placeholder="#{SysCommon.placeholder}" id="pflsh"
							class="layui-input form-input input-text" />		
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{CeAssetGroup001.vdate}">生效日</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="vdate" name="vdate"
									class="layui-input form-input input-dateRangeSelect"
									placeholder="请选择、支持区间"
									data-th-placeholder="#{SysCommon.dateInterval}" />
							</div>
						</div>
					</div>
				</form>
			</div>

			<div id="singleTableDiv">
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
	    <script data-th-inline="javascript" type="text/javascript">
		  
		</script>
		<script data-th-src="@{/js/invest/risk/creditmanagement/ceassetgroup/CeAssetGroup001.js}"></script>
	</div>
</body>
</html>
