<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{AgencyDetailsInf001}">机构详细信息-查询</title>
<script type="text/javascript" data-th-src="@{/public/js/message}"></script>
<style type="text/css">
	.node circle {
	  /*  cursor: pointer;*/
	  fill: #fff;
	  stroke: steelblue;
	  stroke-width: 1.5px;
	}
	
	.node text {
	  font: 10px sans-serif;
	}
	
	path.link {
	  fill: none;
	  stroke: #ccc;
	  stroke-width: 1.5px;
	}
	
	.layui-table-cell {
		/* 表头文字居中  */
		text-align: center;
	}
	
	/* 按钮 */
	.svg-wrapper{
		cursor: pointer;
	}
	/* 去除表头加载行  */
	.layui-table-init {
		display:none!important;
	}	
</style>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="form-button-area">
			</div>
			<div class="joyin-form-wrap joyin-filter-form condition-area">
				<form class="layui-form" id="AgencyDetailsInf001_searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{AgencyDetailsInf001.agencyName}">机构名称</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="AgencyDetailsInf001_agencyName" name="agencyName"
									class="layui-input form-input input-select"
									allowClear="true" placeholder="请输入内容" 
									data-th-placeholder="#{SysCommon.placeholder}"
									th:initValue="${agencyId}"
									data-th-data-url="@{/invest/risk/customerrelationtree/agencydetailsinf/AgencyDetailsInf001/getAgency}">
								</select>	
							</div>
						</div>
					</div>
				</form>
			</div>
			<div class="layui-tab" lay-filter="demo">
				<ul class="layui-tab-title">
					<li class="layui-this" lay-filter="receive">持仓信息
					</li>
					<li id="await" lay-id="agencyTree" lay-filter="await" style="position: relative;">关联机构信息
					</li>
				</ul>
		  		<div class="layui-tab-content">
		    		<div class="layui-tab-item layui-show">
						<table class="layui-table" id="dataTable"></table>
					</div>
		    		<div class="layui-tab-item" style="overflow: scroll;">
		    			<div id="tabHeadUl" style="position: absolute;"></div>
		    			<i id="AgencyDetailsInf001_i_addTree" class="layui-icon layui-icon-add-1" style="font-size: 30px; color: #1E9FFF;cursor: pointer;margin-left:90%;"></i>  
		    			<div id="chart" style="width: 100%;height:500px;"></div>
		    			
					</div>
		  		</div>
		  	</div>
			<div style="padding-bottom:1%">
			</div>	
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
        	var AGENCYID = /*[[${agencyId}]]*/'';
        </script>
		<script data-th-src="@{/js/invest/risk/customerrelationtree/agencydetailsinf/AgencyDetailsInf001.js}"></script>
		<script data-th-src="@{/js/invest/risk/customerrelationtree/agencydetailsinf/d3.min.js}"></script>
	</div>
</body>
</html>
