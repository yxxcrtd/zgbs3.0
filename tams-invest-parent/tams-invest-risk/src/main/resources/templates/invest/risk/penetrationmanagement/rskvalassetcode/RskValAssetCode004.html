<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RskValAssetCode004}"></title>
    <style>
        .col-label{
            width: 23%;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <input type="text" id="id" name="id" data-th-value="${entity?.id}" hidden/>
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <div class="pro-module-item">
                             <div class="layui-form-item">
                                 <label class="layui-form-label form-label-wrap col-label" data-th-text="#{RskValAssetCode004.srcCode}">源科目代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <input id="srcCode" name="srcCode" data-th-value='${entity?.srcCode}'
                                            type="text" class="layui-input form-input" disabled="disabled"
                                            placeholder="请输入内容" required="required">
                                        </div>  
                             </div>
                             <div class="layui-form-item">
                                 <label class="layui-form-label form-label-wrap col-label" data-th-text="#{RskValAssetCode004.tgtCode}">目标科目代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <input id="tgtCode" name="tgtCode" data-th-value='${entity?.tgtCode}'
                                            type="text" class="layui-input form-input" disabled="disabled"
                                            placeholder="请输入内容" required="required">
                                        </div>
                             </div>
                             <div class="layui-form-item">
                                 <label class="layui-form-label form-label-wrap col-label" data-th-text="#{RskValAssetCode004.allowSum}">是否允许汇总</label>
                                        <div class="layui-input-inline input-inline">
                                        <input type="checkbox" id="allowSum" name="allowSum" lay-skin="switch"
                                        data-th-value="${YES}" lay-text="是|否"
                                        data-th-checked="${YES} ==${entity?.allowSum}">
                                </div>
                             </div>
                             <div class="layui-form-item">
                                 <label class="layui-form-label form-label-wrap" data-th-text="#{RskValAssetCode004.memo}" style="width:22.9%;">描述</label>
                                        <div class="layui-input-inline input-inline">
                                            <textarea class="layui-textarea" placeholder="请输入内容" id="memo" name="memo"
                                            data-th-text="${entity?.memo}"></textarea>
                                        </div>
                             </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        <div class="layui-col-md12" style="margin-top: 20px;">
            <div class="text-center">
                <a id="RskValAssetCode004_btn_save"
                   class="layui-btn layui-btn-sm btn-save"
                   data-th-text="#{SysCommon.save}">保存</a>
                <a id="RskValAssetCode004_btn_cancel"
                    class="layui-btn layui-btn-sm btn-cancel"
                    data-th-text="#{SysCommon.cancel}">取消</a>
            </div> 
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/risk/penetrationmanagement/rskvalassetcode/RskValAssetCode004.js}"
            type="text/javascript">
        </script>
    </div>
</body>
</html>
