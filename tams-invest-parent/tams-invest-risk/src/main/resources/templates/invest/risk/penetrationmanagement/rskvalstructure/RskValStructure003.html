<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RskValStructure003}">新建申报附件方案</title>
<style>
.col-label{
width:20%;
}
</style>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
			<div class="pro-module-wrapper pro-module-base">
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title">
						<span class="title-des">源</span>
						<i class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="pro-module-item">
						     <div class="layui-form-item">
							     <label class="layui-form-label form-label-wrap col-label" data-th-text="#{RskValStructure003.srcColIndex}">列</label>
								 <div class="layui-input-inline input-inline">
									<input id="srcColIndex" name="srcColIndexLetter" data-th-value='${entity?.srcColIndexLetter}'
									type="text" class="layui-input form-input" oninput="value=value.replace(/[^A-Z]/g,'')"
									placeholder="请输入内容" required="required" data-textrange="0">
								 </div>
						     </div>
						     <div class="layui-form-item">
						     <div style="display: none">
									<input type="text" id="id" name="id" data-th-value="${entity?.id}"/>
								</div>
							     <label class="layui-form-label form-label-wrap col-label" data-th-text="#{RskValStructure003.srcColDataType}">类型</label>
	                                    <div class="layui-input-inline input-inline">
											<select 
											id="srcColDataType" name="srcColDataType" class="layui-input form-input input-select"
                            				data-th-data-result='${VAL_INDEX_TYPE}' formatoption="true" required="required"
                            				allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                            				data-th-initValue='${entity?.srcColDataType}'>
											</select>
										</div>
						     </div>
						</div>
					</div>
				</div>
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title">
						<span class="title-des">目标</span>
						<i class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="pro-module-item">
						     <div class="layui-form-item">
							     <label class="layui-form-label form-label-wrap col-label" data-th-text="#{RskValStructure003.tgtIndex}">指标</label>
	                                    <div class="layui-input-inline input-inline">
											<select 
											id="tgtIndex" name="tgtIndex" class="layui-input form-input input-select"
                            				data-th-data-result='${VAL_INDEX}' formatoption="true" required="required"
                            				allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                            				data-th-initValue='${entity?.tgtIndex}'>
											</select>
										</div>
						     </div>
						</div>
					</div>
				</div>
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title">
						<span class="title-des">其它</span>
						<i class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="pro-module-item">
						     <div class="layui-form-item">
							     <label class="layui-form-label form-label-wrap" data-th-text="#{RskValStructure003.memo}" style="width:19.9%;">描述</label>
	                                    <div class="layui-input-inline input-inline">
											<textarea class="layui-textarea" placeholder="请输入内容" id="memo" name="memo"
                        					data-th-text="${entity?.memo}" maxlength="200"></textarea>
										</div>
						     </div>
						</div>
					</div>
				</div>
			</div>
		</form>
		<div class="layui-col-md12" style="margin-top: 20px;">
			<div class="text-center">
				<a id="RskValStructure003_btn_submit"
				   class="layui-btn layui-btn-sm btn-submit"
				   data-th-text="#{SysCommon.submit}">提交</a>
				<a id="RskValStructure003_btn_cancel"
					class="layui-btn layui-btn-sm btn-cancel"
					data-th-text="#{SysCommon.cancel}">取消</a>
			</div> 
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-src="@{/js/invest/risk/penetrationmanagement/rskvalstructure/RskValStructure003.js}"
			type="text/javascript">
		</script>
	</div>
</body>
</html>
