<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{AgencyDetailsInf002}">关联机构/高管信息（
	<span class="star-sign">*</span>必填）
	<i class="iconfont icon-arrow-down pro-down-icon"></i>
</title>
<style>
.mst-textarea {
	min-height: auto;
}

.cus-table-wrap .layui-border-box {
	height: 180px;
}

.cus-table-wrap .layui-border-box .layui-table-box {
	height: 140px;
}

.cus-table-wrap .layui-border-box .layui-table-box .layui-table-body {
	height: 101px;
}
</style>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap" id="submitForm">
			<div class="pro-module-wrapper pro-module-base">
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title">
							<span class="title-des">新建要素</span>
							<i class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div style="display: none">
									<input type="text" id="orgNo" name="orgNo" data-th-value="${ORG_NO}" />
								</div>
								<span class="layui-form-label form-label-wrap" style="font-size: 14px; line-height: 40px !important; width: auto; margin-left: 15px;">新建类型</span>
								<div class="form-inline-wrap">
									<div class="layui-input-block" style="font-size: 12px !important; min-height: 36px; color: #444;">
										<input type="radio" name="relateType" value="0" checked="true" title="关联企业" lay-filter="relateType" />
										<input type="radio" name="relateType" value="1" title="高管" lay-filter="relateType" />
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="pro-module-wrap">
					<div id="customerInfo" class="pro-module">
						<h3 class="pro-module-title">
							<span class="title-des">企业信息</span>
							<i class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="pro-module-item cus-table-wrap">
							<form class="layui-form" id="searchForm">
								<div class="layui-form-item">
									<div class="layui-inline layui-col-md5 layui-col-sm5 layui-col-lg5">
										<label class="layui-form-label form-lable" data-th-text="#{AgencyDetailsInf002.corClassName}">机构名称：</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="corOrgid" name="corOrgid" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
												required="required" data-th-data-url="@{/invest/risk/customerrelationtree/agencydetailsinf/AgencyDetailsInf002/getRelateOrgInf}"
												data-th-placeholder="#{SysCommon.placeholder}">
											</select>
										</div>
									</div>
									<div class="layui-inline layui-col-md5 layui-col-sm5 layui-col-lg5">
										<label class="layui-form-label form-label-wrap" data-th-text="#{AgencyDetailsInf002.corOrgtype}">关联类型：</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="corOrgtype" name="corOrgtype" class="layui-input form-input input-select" allowClear="true"
												placeholder="请输入内容" required="required" data-th-data-result='${CorOrgLst}' data-th-placeholder="#{SysCommon.placeholder}">
											</select>
										</div>
									</div>
								</div>
							</form>

						</div>
						<div class="pro-module-item cus-table-wrap">
							<div class="layui-form-item">
								<div class="layui-inline layui-col-md5 layui-col-sm5 layui-col-lg5">
									<label class="layui-form-label form-lable" data-th-text="#{AgencyDetailsInf002.partyType3}">机构类型（技术领域）：</label>
									<div class="layui-input-inline input-inline">
										<label class="layui-form-label form-lable" id="partyType3"></label>
									</div>
								</div>
								<div class="layui-inline layui-col-md5 layui-col-sm5 layui-col-lg5">
									<label class="layui-form-label form-label-wrap" data-th-text="#{AgencyDetailsInf002.industry}">所属行业：</label>
									<div class="layui-input-inline input-inline">
										<label class="layui-form-label form-label-wrap" id="industry"></label>
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="layui-inline layui-col-md5 layui-col-sm5 layui-col-lg5">
									<label class="layui-form-label form-lable" data-th-text="#{AgencyDetailsInf002.industry2}">行业二级分类：</label>
									<div class="layui-input-inline input-inline">
										<label class="layui-form-label form-lable" id="industry2"></label>
									</div>
								</div>
								<div class="layui-inline layui-col-md5 layui-col-sm5 layui-col-lg5">
									<label class="layui-form-label form-label-wrap" data-th-text="#{AgencyDetailsInf002.companyNature}">企业性质：</label>
									<div class="layui-input-inline input-inline">
										<label class="layui-form-label form-label-wrap" id="companyNature"></label>
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="layui-inline layui-col-md5 layui-col-sm5 layui-col-lg5">
									<label class="layui-form-label form-lable" data-th-text="#{AgencyDetailsInf002.partyType1}">机构类型（规模）：</label>
									<div class="layui-input-inline input-inline">
										<label class="layui-form-label form-lable" id='partyType1'></label>
									</div>
								</div>
								<div class="layui-inline layui-col-md5 layui-col-sm5 layui-col-lg5">
									<label class="layui-form-label form-label-wrap" data-th-text="#{AgencyDetailsInf002.insitituteCode}">机构代码/统一社会信用代码：</label>
									<div class="layui-input-inline input-inline">
										<label class="layui-form-label form-label-wrap" id="insitituteCode"></label>
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="layui-inline layui-col-md5 layui-col-sm5 layui-col-lg5">
									<label class="layui-form-label form-lable" data-th-text="#{AgencyDetailsInf002.registerCapital}">注册资本：</label>
									<div class="layui-input-inline input-inline">
										<label class="layui-form-label form-lable" id="registerCapital"></label>
									</div>
								</div>
								<div class="layui-inline layui-col-md5 layui-col-sm5 layui-col-lg5">
									<label class="layui-form-label form-label-wrap" data-th-text="#{AgencyDetailsInf002.province}">所属省：</label>
									<div class="layui-input-inline input-inline">
										<label class="layui-form-label form-label-wrap" id="province"></label>
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="layui-inline layui-col-md5 layui-col-sm5 layui-col-lg5">
									<label class="layui-form-label form-lable" data-th-text="#{AgencyDetailsInf002.city}">所属市：</label>
									<div class="layui-input-inline input-inline">
										<label class="layui-form-label form-lable" id="city"></label>
									</div>
								</div>
								<div class="layui-inline layui-col-md5 layui-col-sm5 layui-col-lg5">
									<label class="layui-form-label form-label-wrap" data-th-text="#{AgencyDetailsInf002.county}">所属县：</label>
									<div class="layui-input-inline input-inline">
										<label class="layui-form-label form-label-wrap" id="county"></label>
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="layui-inline layui-col-md5 layui-col-sm5 layui-col-lg5">
									<label class="layui-form-label form-lable" data-th-text="#{AgencyDetailsInf002.isListedCompany}">是否上市公司：</label>
									<div class="layui-input-inline input-inline">
										<label class="layui-form-label form-lable" id="isListedCompany"></label>
									</div>
								</div>
								<div class="layui-inline layui-col-md5 layui-col-sm5 layui-col-lg5">
									<label class="layui-form-label form-label-wrap" data-th-text="#{AgencyDetailsInf002.isGroupCustomer}">是否集团客户：</label>
									<div class="layui-input-inline input-inline">
										<label class="layui-form-label form-label-wrap" id="isGroupCustomer"></label>
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="layui-inline layui-col-md5 layui-col-sm5 layui-col-lg5">
									<label class="layui-form-label form-lable" data-th-text="#{AgencyDetailsInf002.parentCustomerName}">所属集团客户名称：</label>
									<div class="layui-input-inline input-inline">
										<label class="layui-form-label form-lable" id="parentCustomerName"></label>
									</div>
								</div>
							</div>
						</div>
					</div>
					<div id="executiveInfo" class="pro-module" style="display: none">
						<h3 class="pro-module-title">
							<span class="title-des">主要人员</span>
							<i class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>

						<div class="pro-module-item cus-table-wrap">
							<table class="layui-table" id="dataTable"></table>
						</div>
					</div>
				</div>
			</div>
			<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin-top: 20px; margin-bottom: 20px">
				<div class="text-center">
					<a id="AgencyDetailsInf002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">确定</a>
					<a id="AgencyDetailsInf002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
				</div>
			</div>
		</form>
	</div>
	<div layout:fragment="script">
		<script th:inline="javascript" type="text/javascript">
			var COR_ORGTYPE = /*[[${CorOrgLst}]]*/'';//机构关联类型去除高管
            var INPUT_TYPE = /*[[${INPUT_TYPE}]]*/''; // 数据字典.录入方式
		</script>
		<script data-th-src="@{/js/invest/risk/customerrelationtree/agencydetailsinf/AgencyDetailsInf002.js}" type="text/javascript"></script>

	</div>
</body>
</html>
