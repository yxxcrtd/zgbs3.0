<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RskValTableImport002}">估值表预览</title>
<style>
.pro-module-wrap{
border:none;
}
.pro-module .layui-table-view{
border:1px solid #ccc;
padding:0;
}
</style>
</head>
<body>
    <div layout:fragment="content" id="RskValTableImport002_DIV">
    <div>
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
                <input id="ptlId" name="ptlId" data-th-value="${ptlId}" hidden> 
                <input id="valTableFileName" name="valTableFileName" data-th-value="${valTableFileName}" hidden>
                <input id="valDate" name="valDate" data-th-value="${valDate}" hidden> 
                <input id="structMapId" name="structMapId" data-th-value="${structMapId}" hidden>
                <input id="sumsubMapId" name="sumsubMapId" data-th-value="${sumsubMapId}" hidden>
                <input id="assetSubMapId" name="assetSubMapId" data-th-value="${assetSubMapId}" hidden>
                <input id="subjectCodeCol" name="subjectCodeCol" data-th-value="${subjectCodeCol}" hidden>
                <input id="startRow" name="startRow" data-th-value="${startRow}" hidden>
                <input id="trimChars" name="trimChars" data-th-value="${trimChars}" hidden>
                <input id="filterId" name="filterId" data-th-value="${filterId}" hidden>
                <div class="pro-module-item pro-item-wrap">
            <!-- 付息信息业务 -->
            <div>
                <table class="layui-table" id="valTable"></table>
            </div>
            </div>
    <div class="row text-center stepbar" id="RskValTableImport002_btn" style="display: none">
        <a id="RskValTableImport002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
         <a id="RskValTableImport002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
    </div>
    </form>
    </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/risk/valtblimport/RskValTableImport002.js}"> </script>
    </div>
</body>

</html>
