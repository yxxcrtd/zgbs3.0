<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{CeLine001}">机构额度</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				
				<a id="CeLine001_btn_add" class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a>
				 <a id="CeLine001_btn_delete"
					class="layui-btn layui-btn-sm btn-delete"
					data-th-text="#{SysCommon.delete}">删除</a>
				<!-- add by yushilong 20200630 增加额度标签管理导入功能 start -->
				<a id="CeLine001_btn_import"
				   class="layui-btn layui-btn-sm btn-import"
				   data-th-text="#{SysCommon.import}">导入</a>
				<!-- add by yushilong 20200630 增加额度标签管理导入功能 end -->
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								data-th-text="#{CeLine001.creditType}">额度分类</label>
							<div class="layui-input-inline input-inline">
		                       <select  id="creditType" name="creditType"
									class="layui-input form-input input-select" formatoption=true 
									data-th-placeholder="#{SysCommon.placeholder}"  multiple
									data-th-data-result="${LIMIT_TYPE}">
								</select>
		                    </div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="|#{CeLine001.creditTagName}|">额度标签</label>
							<div class="layui-input-inline input-inline">
							 <select  id="creditTagName" name="creditTagName"
                             class="layui-input form-input input-select"   multiple
                             th:placeholder="#{SysCommon.placeholder}"
                             th:data-url="@{/invest/risk/creditmanagement/creditlinemanage/CeLine001/getLimitLabel}" allowClear="true"
                             formatoption="false" ></select>	
							</div>
						</div>
						<!--<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{CeLine001.deductRule}">扣减规则</label>
							<div class="layui-input-inline input-inline">
								<select name="deductRule" id="deductRule"
									class="layui-input form-input input-select" formatoption=true 
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result="${REDUCE_RULE}">
								</select>
							</div>
						</div>-->
					</div>
				</form>
			</div>

			<div id="singleTableDiv">
				<table class="layui-table" id="dataTable2"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
	    <script data-th-inline="javascript" type="text/javascript">
		  
		</script>
		<script data-th-src="@{/js/invest/risk/creditmanagement/creditlinemanage/CeLine001.js}"></script>
	</div>
</body>
</html>
