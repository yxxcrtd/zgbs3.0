<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{CeAssetGroup002}">资产系列授信新建</title>
<style type="text/css">

</style>
<script data-th-inline="javascript" type="text/javascript">
var entity=/*[[${entity}]]*/;
</script>
</head>
<body>
	<div layout:fragment="content">
			<form class="layui-form joyin-form-wrap" id="ceAssetGroupForm">
			<div class="pro-module-wrapper pro-module-base" th:title="#{CeAssetGroup002.baseInfo}">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" th:text="#{CeAssetGroup002.baseInfo}">基本信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
									<input type="hidden" id="seqno" name="seqno" data-th-value="${entity?.seqno}" >
									<input id="workflowId" name="workflowId" data-th-value="${workflowId}" type="hidden">
									<input id="customerId" name="customerId" data-th-value="${entity?.customerId}" type="hidden">
									<div class="pro-module-item">
										<div class="layui-form-item">
							                <div class="form-inline-wrap">
							                    <label class="layui-form-label form-label-wrap" data-th-text="#{CeAssetGroup002.assetGroupName}">系列名称</label>
<!-- 							                    <div class="layui-input-inline input-inline">
							                         <select required  id="customerId" name="customerId"
							                             class="layui-input form-input input-select" 
							                             th:placeholder="#{SysCommon.placeholder}"
							                             th:data-url="@{/invest/risk/creditmanagement/ceassetgroup/CeAssetGroup001/getAssetGroupAliasIds}" allowClear="true"
							                             formatoption="true"
							                             th:initValue="${entity?.customerId}"></select>
							                    </div> -->
							                    <div class="layui-input-inline input-inline">
							                       <input required type="text" name="customerName" data-th-placeholder="#{SysCommon.placeholder}" id="customerName"
													th:value="${entity?.customerName}"	class="layui-input form-input input-text" />	
							                    </div>
							                </div>
							                <div class="form-inline-wrap">
							                    <label class="layui-form-label form-label-wrap" data-th-text="#{CeAssetGroup002.creditTotalAmt}">授信总额度</label>
							                    <div class="layui-input-inline input-inline">
							                       <input required type="text" id="creditAmt" name="creditAmt" data-textrange="4"
							                                           class="layui-input form-input text-number" placeholder="请输入内容"
							                                           th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.creditAmt}">
													<span class="input-right-show">亿元</span>

							                    </div>
							                </div>
							                <div class="form-inline-wrap">
							                    <label class="layui-form-label form-label-wrap" data-th-text="#{CeAssetGroup002.ifHavingOrgAmt}">是否占用机构授信</label>
							                    <div class="layui-input-inline input-inline">
												   <select th:id="|${pageId}_creditFlag|" name="creditFlag" formatoption="false"
														class="layui-input form-input input-select"
														data-th-placeholder="#{SysCommon.placeholder}"
														data-th-initValue='${entity?.creditFlag}' required
														data-th-data-result="${YES_OR_NO}">
													</select>	
							                    </div>
							                </div>
						            	</div>
						            	<div class="layui-form-item">
						            	    <div class="form-inline-wrap">
							                    <label class="layui-form-label form-label-wrap" data-th-text="#{CeAssetGroup002.pflsh}">批复号</label>
							                    <div class="layui-input-inline input-inline">
							                       <input required type="text" name="pflsh" data-th-placeholder="#{SysCommon.placeholder}" id="pflsh"
													th:value="${entity?.pflsh}"	class="layui-input form-input input-text" />	
							                    </div>
							                </div>
							                <div class="form-inline-wrap">
							                    <label class="layui-form-label form-label-wrap" data-th-text="#{CeAssetGroup002.vdate}">生效日</label>
							                    <div class="layui-input-inline input-inline">
							                        <input required  type="text" id="vdate" name="vdate"
						                                   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
						                                   th:placeholder="#{SysCommon.placeholder}"
						                                   th:value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'>
							                    </div>
							                </div>
							                <div class="form-inline-wrap">
							                    <label class="layui-form-label form-label-wrap" data-th-text="#{CeAssetGroup002.mdate}">到期日</label>
							                    <div class="layui-input-inline input-inline">
							                       <input required  type="text" id="mdate" name="mdate"
						                                   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
						                                   th:placeholder="#{SysCommon.placeholder}"
						                                   th:value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'>
							                    </div>
							                </div>
						            	</div>
										<!--add by yushilon 系列授信新建画面新增字段 20200630 start-->
										<div class="layui-form-item">
											<div class="form-inline-wrap">
												<label class="layui-form-label form-lable"
													   data-th-text="#{CeOrg002.isLoopAmt}">是否循环额度</label>
												<div class="layui-input-inline input-inline">
													<select required id="isLoopAmt" name="isLoopAmt"
															class="layui-input form-input input-select"
															th:placeholder="#{SysCommon.placeholder}"
															th:data-result="${YES_OR_NO}" allowClear="true"
															th:initValue="${entity?.isLoopAmt}"
															formatoption="true">
													</select>
												</div>
											</div>
										</div>
										<!--add by yushilon 系列授信新建画面新增字段 20200630 end-->
						            	 <div class="layui-form-item">
		                                    <div class="form-inline-wrap" style="width: 100%;">
		                                        <label class="layui-form-label form-label-wrap"
		                                            data-th-text="#{CeAsset002.remark}" style="width: 11.9%;">备注</label>
		                                        <div class="layui-input-inline input-inline" style="width: 85.6% !important;">
		                                            <textarea id="remark" name="remark" th:value="${entity?.remark}"
		                                                data-th-text="${entity?.remark}" class="layui-textarea"
		                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"></textarea>
		                                        </div>
		                                    </div>
                                		</div>

										<div class="layui-form-item">
											<div class="form-inline-wrap" style="width: 100%;">
												<label class="layui-form-label form-label-wrap"
													   data-th-text="#{CeAsset002.condition}" style="width: 11.9%;">授信使用条件</label>
												<div class="layui-input-inline input-inline" style="width: 85.6% !important;">
		                                            <textarea id="creditCondition" name="creditCondition" th:value="${entity?.creditCondition}"
															  data-th-text="${entity?.creditCondition}" class="layui-textarea"
															  placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"></textarea>
												</div>
											</div>
										</div>
					            	</div>
            				</div>
            			</div>
            	</div>
                 <!-- 附件信息 -->
                <div class="page-component" th:data-path="@{/component/core/FileCommon/init}" th:data-params="|{businessId:'${entity?.seqno?:''}'}|"></div>                         
			</form>
			<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
            <div class="text-center">
                <a id="CeAssetGroup002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                <a id="CeAssetGroup002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="CeAssetGroup002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
		    var workflowId = /*[[${workflowId}]]*/'';
		</script>
		<script data-th-src="@{/js/invest/risk/creditmanagement/ceassetgroup/CeAssetGroup002.js}"></script>
	</div>
</body>
</html>
