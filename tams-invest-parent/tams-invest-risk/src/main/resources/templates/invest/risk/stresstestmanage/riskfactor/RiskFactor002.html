<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>风险因子</title>
</head>
<body>
	<div layout:fragment="content">
		<div class="">
			 <div class="pro-module-wrapper pro-module-base" style="border-top: none;">
				<form class="layui-form joyin-form-wrap pro-module-form" id="form">
            	<div class="pro-module-wrap">
            		<div class="pro-module">
						<h3 class="pro-module-title" style="border-top: 1px solid #cccccc;">
							<span class="title-des">基本信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
            			<div class="pro-module-item">
							   <div class="layui-form-item">
									<div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" >因子代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="ftrid" name="ftrid"
												class="layui-input form-input" data-th-value="${entity?.ftrid}"
												data-th-placeholder="#{SysCommon.placeholder}"  disabled="disabled" />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" >因子名称</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="ftrname" name="ftrname"
												class="layui-input form-input" data-th-value="${entity?.ftrname}"
												data-th-placeholder="#{SysCommon.placeholder}"  disabled="disabled" />  
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                    	<label class="layui-form-label form-lable" >风险分类</label>
                                    	<div class="layui-input-inline input-inline">
					                    	   <input type="text" id="type1" name="type1"
												data-th-value="${entity?.type1}"
												data-th-placeholder="#{SysCommon.placeholder}"   disabled="disabled"/>
					                    </div>
                                    </div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
                                    	<label class="layui-form-label form-lable" >因子分类</label>
					                    <div class="layui-input-inline input-inline">
					                           <input type="text" id="type2" name="type2"
												class="layui-input form-input" data-th-value="${entity?.type2}"
												data-th-placeholder="#{SysCommon.placeholder}"  disabled="disabled" />
					                    </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" >因子类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="ftrvaluestruct" name="ftrvaluestruct"
												class="layui-input form-input"
												data-th-value="${entity?.ftrvaluestruct}"
												data-th-placeholder="#{SysCommon.placeholder}"   disabled="disabled"/>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" >变动形式</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="valueexetype" name="valueexetype"
												class="layui-input form-input" data-th-value="${entity?.valueexetype}"
												
												data-th-placeholder="#{SysCommon.placeholder}"  disabled="disabled"/>
                                        </div>
                                    </div>
								
								 <div class="layui-form-item">
									 <label class="layui-form-label form-lable" style="width: 11.9%;">备注</label>
									 <div class="layui-input-inline input-inline" style="width: 85%!important;">
										 <textarea id="remark" name="remark" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" 
										 	class="layui-textarea" data-th-text="${entity?.remark}" maxlength="200"  disabled="disabled">
										 </textarea>
									 </div>
								 </div>
								</div>
								<div class="layui-form-item">
									
								</div>
								
							</div>
						</div>
					</div><br/>
					 <div class="pro-module-wrap">
						 <div class="pro-module">
						 <h3 class="pro-module-title">
								 <span class="title-des">因子变更属性</span><i class="iconfont icon-arrow-down pro-down-icon"></i>
							 </h3>
							 <div class="pro-module-item">
							 	 <div class="layui-form-item">
							 	 	<label class="layui-form-label form-lable" >审批前运用状态</label>
                                        <div class="layui-input-inline input-inline">
                                        	   <input type="text" id="effstatus" name="effstatus"
												class="layui-input form-input" data-th-value="${entity?.effstatus}"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"  disabled="disabled"/>
												
												
                                        </div>
                                        <label class="layui-form-label form-lable" >审批后运用状态</label>
                                        <div class="layui-input-inline input-inline">
                                        	   <input type="text" id="boost" name="boost"
												class="layui-input form-input" data-th-value="${entity?.boost}"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"  disabled="disabled"/>
												
												
                                        </div>
                                 </div>   
								
							 </div>
						 </div>
					 </div>
				 </form>
				</div>
		
			</div>
			
		</div>
	<div layout:fragment="script">
		
	</div>
</body>
</html>
