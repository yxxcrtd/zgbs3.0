<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ObjectLimitManage002}"></title>

</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap" id="submitForm">
			<div class="layui-form-item">
				<div >
					<label class="layui-form-label form-lable mst-lable"
						data-th-text="#{ObjectLimitManage002.busiType}">业务分类</label>
					<div class="layui-input-inline input-inline">
						<select type="text" id="busiType"
							name="busiType" required="required"
							class="layui-input form-input  input-select" placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}" 
							data-th-initValue="${entity?.busiType}"
							data-th-data-result="${CUSTOM_ASSET_TYPE_FIVE}"
							></select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div>
					<label class="layui-form-label form-lable mst-lable"
						data-th-text="#{ObjectLimitManage002.approId}">审批编号</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="approId" name="approId"
								class="layui-input form-input" required="required"
								placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
								data-th-value="${entity?.approId}">
					</div>
				</div>
			</div>
		    <div class="layui-form-item">
				<div >
					<label class="layui-form-label form-lable mst-lable"
						data-th-text="#{ObjectLimitManage002.creditAmt}">项目核定额度</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="creditAmt" name="creditAmt"
								class="layui-input form-input   text-number" required="required"
								placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
								data-th-value="${entity?.creditAmt}">
					</div>
				</div>
			</div>			

	
			<div class="layui-form-item">
				 <div>
					  <label class="layui-form-label form-lable mst-lable"
						  data-th-text="#{ObjectLimitManage002.term}">最长可投期限</label>
					  <div class="layui-input-inline input-inline">
					 
						<div class="layui-inline layui-col-md8 layui-col-sm8 layui-col-lg8">
											<input type="text" id="term" name="term"
											class="layui-input form-input  text-number"
											placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
											 data-th-value="${entity?.term}" data-textrange="0">
							</div>
						   <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4" >
			
									<div class="layui-input-inline input-inline">
										<input type="text" id="termUnit" name="termUnit"
											class="layui-input form-input input-select"
											placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
											data-th-data-result = '${TERM_UNIT}' data-th-value="${entity?.termUnit}">
									</div>
		
							</div>
						</div>	
					</div>

			</div>
			<div class="layui-form-item">
				<div>
					<label class="layui-form-label form-lable mst-lable"
						data-th-text="#{ObjectLimitManage002.customerName}">主体名称</label>
					<div class="layui-input-inline input-inline">
		                       <select  id="customerId" name="customerId" required="required"
									class="layui-input form-input input-select" formatoption=true 
									data-th-placeholder="#{SysCommon.placeholder}"  
									th:data-url="@{/invest/risk/creditrisklimitmanagement/objectlimitmanage/ObjectLimitManage001/getInstitutionName}" allowClear="true"								
									data-th-initValue="${entity?.customerId}">
								</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div>
					<label class="layui-form-label form-lable mst-lable"
						data-th-text="#{ObjectLimitManage002.vdate}">生效日</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="vdate"
							name="vdate" 
							required class="layui-input form-input input-dateSelect"  
							allowClear="true"  placeholder="请输入内容" 
							data-th-placeholder="#{SysCommon.placeholder}"
					        data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'						
							>
							
						</input>
					</div>
				</div>
			</div>			
			<div class="layui-form-item">
				 <div>
					  <label class="layui-form-label form-lable mst-lable"
						  data-th-text="#{ObjectLimitManage002.endTermValue}">终止期限</label>
					  <div class="layui-input-inline input-inline">
					 
						<div class="layui-inline layui-col-md8 layui-col-sm8 layui-col-lg8">
											<input type="text" id="endTermValue" name="endTermValue"
											class="layui-input form-input  text-number" required="required"
											placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
											 data-th-value="${entity?.endTermValue}"
											 th:initValue="${entity?.endTermValue}"
											 data-textrange="0">
							</div>
						   <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4" >
			
									<div class="layui-input-inline input-inline">
										<input type="text" id="endTermUnit" name="endTermUnit" required="required"
											class="layui-input form-input input-select"
											placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
											data-th-data-result = '${TERM_UNIT}' 
											th:initValue="${entity?.endTermUnit}"
											data-th-value="${entity?.endTermUnit}">
									</div>
		
							</div>
						</div>	
					</div>

			</div>
			<div class="layui-form-item">
				<div>
					<label class="layui-form-label form-lable mst-lable"
						data-th-text="#{ObjectLimitManage002.updateTime}">更新日期</label>
					<div class="layui-input-inline input-inline">
						<input type="text" name="upTime" id="upTime" required data-option="{type:'datetime'}"
						   class="layui-input form-input"  
						   placeholder="请输入内容"  data-th-value="${entity?.upTime}" data-th-placeholder="#{SysCommon.placeholder}">
					</div>
				</div>
			</div>	
		    <div class="layui-form-item">
                               <div>
                                   <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{ObjectLimitManage002.remark}" >备注</label>
                                   <div class="layui-input-inline input-inline">
                                       <textarea id="remark" name="remark" th:value="${remark}"
                                          required="required"  data-th-text="${entity?.remark}" class="layui-textarea"
                                           placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"></textarea>
                                   </div>
                               </div>
            </div>
		</form>
	
		<div  style="margin:30px 0;">
			<div class="text-center">
				<a id="ObjectLimitManage002_btn_save"
					class="layui-btn layui-btn-sm btn-save"
					data-th-text="#{SysCommon.save}">保存</a>
 					 <a id="ObjectLimitManage002_btn_submit"
					class="layui-btn layui-btn-sm btn-submit"
					data-th-text="#{SysCommon.submit}">提交</a> 
					<a id="ObjectLimitManage002_btn_cancel"
					class="layui-btn layui-btn-sm btn-cancel"
					data-th-text="#{SysCommon.cancel}">取消</a>
			</div>
		</div>
	 </div>
	<div layout:fragment="script">
	    <script data-th-inline="javascript" type="text/javascript">
			var YES = /*[[${YES}]]*/'Y'; // 数据字典.是否_是
			var NO = /*[[${NO}]]*/'N'; // 数据字典.是否_否
			var isNbCredit=/*[[${isNbCredit}]]*/'';
		</script>
		<script data-th-src="@{/js/invest/risk/creditrisklimitmanagement/objectlimitmanage/ObjectLimitManage002.js}"></script>
    </div>
</body>
</html>
