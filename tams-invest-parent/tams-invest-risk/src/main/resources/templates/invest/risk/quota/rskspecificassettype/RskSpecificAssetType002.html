<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title data-th-text="#{RskSpecificAssetType001}">特定资产类型设置</title>
</head>
<body>
<div layout:fragment="content" id="RskSpecificAssetType002_DIV">
    <style type="text/css">
        .form-inline-wrap{
            display: inline-block;
            float: left;
            width: 40%!important;
        }
        .form-inline-wrap1{
            display: inline-block;
            float: left;
            width: 40%!important;
        }
        .layui-form-item{
            padding-left:15%;
        }
        .pl{
            padding-left:20%;
        }
        .form-label-wrap{
            white-space: normal !important;
            overflow: visible !important;
        }
    </style>
        <form class="layui-form joyin-form-wrap"
              id="submitForm">
            <input id="finprodId" name="finprodId"
                   data-th-value="${entity?.finprodId}" hidden>
            <input type="text" id="specificId" name="specificId"
                   class="layui-input form-input" data-th-value="${entity?.specificId}"
                   style="display: none">
                <div class="layui-form-item pl">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" style="width:20%!important;text-align:left;"
                               data-th-text="#{RskSpecificAssetType001.finprodName}">资产简称</label>
                        <div class="layui-input-inline input-inline" style="width:56%!important;">
                            <select id="finprodMarketId" name="finprodMarketId"
                                    class="layui-input form-input input-select"
                                    data-th-placeholder="#{SysCommon.placeholder}" allowClear="true"
                                    data-th-data-url="@{/invest/risk/quota/rskspecificassettype/RskSpecificAssetType001/getAssetIdOption}"
                                    data-th-initValue="*{entity?.finprodMarketId}">
                            </select>
                        </div>
                    </div>
                    <div class="form-inline-wrap1">
                        <label class="layui-form-label form-label-wrap" style="width:20%!important;text-align:left;"
                               data-th-text="#{RskSpecificAssetType001.finprodId}">资产代码</label>
                        <div class="layui-input-inline input-inline" style="width:56%!important;">
                            <input type="text" id="assetCode" name="assetCode" disabled="disabled"
                                   class="layui-input form-input" placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-value="${entity?.finprodMarketId}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" style="width:76%!important;text-align:left;font-weight: bold;"
                               data-th-text="#{RskSpecificAssetType001.title1}">监管综合相关类型</label>
                    </div>
                </div>
                <div class="layui-form-item pl">
                    <div class="form-inline-wrap" id="isFlowLimited_div">
                        <label class="layui-form-label form-label-wrap" style="width:76%!important;text-align:left;">是否流动性受限</label>
                        <div class="layui-input-inline input-inline" style="width:20%!important;">
                            <input type="checkbox" id="isFlowLimited" name="isFlowLimited"
                                   lay-skin="switch" data-th-value="${YES}"
                                   lay-text="是|否" data-th-checked="${YES_OR_NO_Y} ==${entity?.isFlowLimited}">
                        </div>
                    </div>
                    <div class="form-inline-wrap1">
                        <label class="layui-form-label form-label-wrap" style="text-align:left;width: 96%;">涉及监管文件：规范现金管理类产品；流动性管理办法</label>
                    </div>
                </div>
                <div class="layui-form-item pl">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" style="width:76%!important;text-align:left;"
                               data-th-text="#{RskSpecificAssetType001.isRegulation}">是否国务院银行业监督管理机构另有规定</label>
                        <div class="layui-input-inline input-inline" style="width:20%!important;">
                            <input type="checkbox" id="isRegulation" name="isRegulation"
                                   lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                                   data-th-checked="${YES_OR_NO_Y} ==${entity?.isRegulation}">
                        </div>
                    </div>
                    <div class="form-inline-wrap1">
                        <label class="layui-form-label form-label-wrap" style="text-align:left;width: 96%;">涉及监管文件：资管新规；理财新规</label>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" style="width:76%!important;text-align:left;font-weight: bold;"
                               data-th-text="#{RskSpecificAssetType001.title2}">流动性管理办法相关类型</label>
                    </div>
                </div>
                <div class="layui-form-item pl">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" style="width:76%!important;text-align:left;height:50px;"
                               data-th-text="#{RskSpecificAssetType001.isLiquidity1}">是否无活跃交易市场且需要采用估值技术确定公允价值资产</label>
                        <div class="layui-input-inline input-inline" style="width:20%!important;">
                            <input type="checkbox" id="isLiquidity1" name="isLiquidity1"
                                   lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                                   data-th-checked="${YES_OR_NO_Y} ==${entity?.isLiquidity1}">
                        </div>
                    </div>
                    <div class="form-inline-wrap1">
                        <label class="layui-form-label form-label-wrap" style="width:76%!important;text-align:left; height:50px;"
                               data-th-text="#{RskSpecificAssetType001.isLiquidity2}">是否不具备活跃交易市场或者在活跃市场中无报价，且不能采用估值技术可靠计量公允价值的</label>
                        <div class="layui-input-inline input-inline" style="width:20%!important;">
                            <input type="checkbox" id="isLiquidity2" name="isLiquidity2"
                                   lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                                   data-th-checked="${YES_OR_NO_Y} ==${entity?.isLiquidity2}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item pl">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" style="width:76%!important;text-align:left;"
                               data-th-text="#{RskSpecificAssetType001.isLiquidity3}">是否7个工作日可变现资产</label>
                        <div class="layui-input-inline input-inline" style="width:20%!important;">
                            <input type="checkbox" id="isLiquidity3" name="isLiquidity3"
                                   lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                                   data-th-checked="${YES_OR_NO_Y} ==${entity?.isLiquidity3}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" style="width:76%!important;text-align:left;font-weight: bold;"
                               data-th-text="#{RskSpecificAssetType001.title3}">理财新规相关类型</label>
                    </div>
                </div>
                <div class="layui-form-item pl">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" style="width:76%!important;text-align:left;"
                               data-th-text="#{RskSpecificAssetType001.isBadasset}">是否不良资产及其受（收）益权</label>
                        <div class="layui-input-inline input-inline" style="width:20%!important;">
                            <input type="checkbox" id="isBadasset" name="isBadasset"
                                   lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                                   data-th-checked="${YES_OR_NO_Y} ==${entity?.isBadasset}">
                        </div>
                    </div>
                    <div class="form-inline-wrap1">
                        <label class="layui-form-label form-label-wrap" style="width:76%!important;text-align:left;"
                               data-th-text="#{RskSpecificAssetType001.isCreditAsset}">是否信贷资产及其受（收）益权</label>
                        <div class="layui-input-inline input-inline" style="width:20%!important;">
                            <input type="checkbox" id="isCreditAsset" name="isCreditAsset"
                                   lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                                   data-th-checked="${YES_OR_NO_Y} ==${entity?.isCreditAsset}">
                        </div>
                    </div>
                </div>
        </form>
    <div class="layui-col-md12" style="margin-top: 20px;">
        <div class="text-center">
            <a id="RskSpecificAssetType002_btn_save"
               class="layui-btn layui-btn-sm btn-save"
               data-th-text="#{SysCommon.save}">保存</a> <a
                id="RskSpecificAssetType002_btn_submit"
                class="layui-btn layui-btn-sm btn-submit"
                data-th-text="#{SysCommon.submit}">提交</a> <a
                id="RskSpecificAssetType002_btn_cancel"
                class="layui-btn layui-btn-sm btn-cancel"
                data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
    </script>
    <script data-th-src="@{/js/invest/risk/quota/rskspecificassettype/RskSpecificAssetType002.js}"
            type="text/javascript"></script>
</div>
</body>

</html>
