<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RskSupervisionIndicator001}">组合关联监督指标</title>
<link rel="stylesheet" data-th-href="@{/js/invest/risk/stresstestmanage/flowriskflowassets/iconfont.css}">
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid' style="padding-left:1px">
		   <div class="layui-form-item" style="width:31%;float: left;overflow:auto;border-right: 1px solid #ccc;min-height:460px;">
		       <span style="margin-left:10px;color:red">在此选择需要压测的组合/产品</span>
		       <form class="layui-form  pro-module-form" style="background: #fff">
		          
					<div class="layui-form-item" style="margin-left: 10px;padding-bottom:8px" id="singlePortfolioDiv">
						<div class="layui-input-inline input-inline"
						style="width: 77% !important">
							<select  id="sortType" name="sortType"
								class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-initValue="${entity}==null?'01':(${entity.type}==null?'01':${entity.type})"
								data-th-data-result='${CLASSIFY_DIMENSION}'>
							</select>
						</div>
						<!--add by jjpei 20190727---增加组合筛选条件--start-->
						<div style="width:18%;margin-left:5px;float:left;text-align: center">
							<a style="width:80px;height:30px;font-weight: bold;line-height: 30px;font-size: 14px;cursor: pointer" id="selectorAtag001">筛选</a>
							<div id="selectorConditionFilter001" style="width:30%;display:none;border: 1px solid #ccc;position: absolute;background: #fff;z-index: 1">
								<div class="sgePortDiv">
									<label class="layui-form-label form-label-wrap" style="width:17%;padding-right:2px!important"
										   data-th-text="组合名称">组合名称1</label>
									<div class="layui-input-inline input-inline"
										 style="width:32%!important">
										<!-- <input type="text" id="portfolioSingleName" name="portfolioSingleName"
											   class="layui-input form-input" placeholder="请输入内容"
											   data-th-placeholder="#{SysCommon.placeholder}" > -->
									   <select   type="text" id="portfolioSingleName" name="portfolioSingleName"
											class="layui-input form-input input-select"  multiple="true"
											allowClear="true" data-th-placeholder="#{SysCommon.placeholder}"
											data-th-data-url="@{/invest/risk/stresstestmanage/flowriskstresstest/FlowRiskStressTest001/selectProdSelectOpt}">
										</select>	
									</div>
									<label class="layui-form-label form-label-wrap" style="width:17%;padding-right:2px!important"
										   data-th-text="收益类型">收益类型</label>
									<div class="layui-input-inline input-inline sgePort14sub"
									>
										<select  id="profitType" name="profitType"
												 class="layui-input form-input input-select"
												 data-th-placeholder="#{SysCommon.placeholder}"
												 data-th-data-result='${PROFIT_TYPE}'></select>
									</div>

								</div>
								<div class="sgePortDiv">
									<label class="layui-form-label form-label-wrap" style="width:17%;padding-right:2px!important"
										   data-th-text="开放类型">开放类型</label>
									<div class="layui-input-inline input-inline sgePort14sub"
									>
										<select  id="issueMode" name="issueMode"
												 class="layui-input form-input input-select"
												 data-th-placeholder="#{SysCommon.placeholder}"
												 data-th-data-result='${ISSUE_MODE}'></select>
									</div>
									<label class="layui-form-label form-label-wrap" style="width:17%;padding-right:2px!important"
										   data-th-text="募集方式">募集方式</label>
									<div class="layui-input-inline input-inline sgePort14sub"
									>
										<select  id="raiseType" name="raiseType"
												 class="layui-input form-input input-select"
												 data-th-placeholder="#{SysCommon.placeholder}"
												 data-th-data-result='${RAISE_TYPE}'></select>
									</div>
								</div>
								<div class="sgePortDiv">
									<label class="layui-form-label form-label-wrap" style="width:17%;padding-right:2px!important"
										   data-th-text="投资性质">投资性质</label>
									<div class="layui-input-inline input-inline" style="width:32%!important"
									>
										<select  id="investType" name="investType"
												 class="layui-input form-input input-select"
												 data-th-placeholder="#{SysCommon.placeholder}"
												 data-th-data-result='${INVEST_TYPE}'></select>
									</div>
								</div>
								<div class="sgePortDiv" style="margin-bottom: 10px">
									<a id="RskSupervisionPortfPoint001_btn_portQuery" style="margin-left: 9px" class="layui-btn layui-btn-sm"
									   data-th-text="#{SysCommon.search}">查询</a>
									<a id="RskSupervisionPortfPoint001_btn_portClose" style="margin-left: 9px" class="layui-btn layui-btn-sm"
									   data-th-text="关闭">关闭</a>
								</div>
							</div>
						</div>
						<!--add by jjpei 20190727---增加组合筛选条件--end-->
					</div>
					<div class="layui-form-item" style="margin-left: 10px;padding-bottom:8px;display: none" id="portfolioBagNameDiv" >
					 <label class="layui-form-label form-label-wrap"
                               data-th-text="#{MarketRiskStressTest001.zbStartDate}">指标计算开始时间</label>
						<div class="layui-input-inline input-inline" style="width: 95% !important" >
						<input type="text" id="portfolioBagName" name="portfolioBagName"
							class="layui-input form-input input-fuzzy-text" placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}" >
						</div>
					</div>
                    <div th:if="${entity} == null" data-checkall="false" data-checkable="false" style="scroll-y: auto; scroll-x: hidden;height:470px" id='treePortfInd' data-canedit='0' data-roottitle='列表信息' >
                    </div>
                    </form>
		    </div>
		    <div class="" style="overflow:hidden;text-align:center;">
		    	<div style="display: inline-block;width:620px;">
		    		<div style="margin-top:20px;margin-bottom:15px">
			    		<label class="layui-form-label form-label-wrap form-lable2"
                               data-th-text="#{MarketRiskStressTest001.portfolioName}">组合/产品名称</label>
                        <div class="layui-input-inline input-inline input-inline2">
                             <textarea required id="selecttree" name="selecttree" disabled
			                        class="layui-textarea" placeholder="请在左侧进行进行选择" rows="5"
			                        data-th-placeholder="#{SysCommon.placeholder}">
                    		 </textarea>
                        </div>
                    </div>
                    <div style="margin-bottom:15px">
                    	<label class="layui-form-label form-lable form-lable2"
                               data-th-text="#{MarketRiskStressTest001.sceneName}">情景选择</label>
                        <div class="layui-input-inline input-inline input-inline2">
                            <select required type="text" id="sceneId" name="sceneName"
									class="layui-input form-input input-select"  
									allowClear="true" placeholder="请输入内容" parentIds="rolePos"
									data-th-data-url="@{/invest/risk/stresstestmanage/marketrisksstresstest/MarketRiskStressTest001/querySceneOption}"
									data-th-placeholder="#{SysCommon.placeholder}" 
									>
							</select>
                        </div>
                    </div>
                    <div style="margin-bottom:15px">
                    	<label class="layui-form-label form-lable form-lable2"
                               data-th-text="#{MarketRiskStressTest001.jzDate}">压力测试基准时间</label>
                        <div class="layui-input-inline input-inline input-inline2">
                            <input required  type="text" id="analysisDate" name="analysisDate"
                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                               th:placeholder="#{SysCommon.placeholder}"
                               th:value='${#dates.format(analysisDate,"yyyy-MM-dd")}'>
                        </div>
                    </div>
                    <!-- <div style="margin-bottom:15px">
                        <label class="layui-form-label form-label-wrap form-lable2"
                               >指标计算开始/结束时间</label>
                        <div class="layui-input-inline input-inline input-inline2">
                            <input required  type="text" id="anastartDate" name="analysisDate"
                               class="layui-input form-input input-dateRangeSelect" placeholder="请输入内容"
                               th:placeholder="#{SysCommon.placeholder}"
                               th:value='${#dates.format(entity?.analysisDate,"yyyy-MM-dd")}'>
                        </div>
                    </div> -->
                    <div style="margin-bottom:15px;display:none;">
                    	<label class="layui-form-label form-lable form-lable2"
                               data-th-text="#{MarketRiskStressTest001.zbEndDate}">分析日期</label>
                        <div class="layui-input-inline input-inline input-inline2">
                            <input required  type="text" id="anaendDate" name="testDate" disabled
                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                               th:placeholder="#{SysCommon.placeholder}"
                               th:value='${#dates.format(testDate,"yyyy-MM-dd")}'>
                        </div>
                    </div>
                    <div style="margin-bottom:15px">
                    	<label class="layui-form-label form-label-wrap form-lable2"
                               data-th-text="#{MarketRiskStressTest001.testName}">压力测试名称</label>
                        <div class="layui-input-inline input-inline input-inline2">
                            <input required  type="text" id="analysisname" name="analysisDate"
                               class="layui-input form-input" placeholder="请输入内容"
                               th:placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div style="margin-bottom:15px">
                    	<label class="layui-form-label form-label-wrap form-lable2"
                               data-th-text="#{MarketRiskStressTest001.testCode}">压力测试编号</label>
                        <div class="layui-input-inline input-inline input-inline2">
                            <input  type="text" id="analysisDate" name="analysisDate" disabled
                               class="layui-input form-input" placeholder="请输入内容"
                               th:placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <!-- <div style="margin-bottom:15px">
                    	<label class="layui-form-label form-lable form-lable2"
                               data-th-text="#{MarketRiskStressTest001.testDate}">压力测试执行时间</label>
                        <div class="layui-input-inline input-inline input-inline2">
                            <input required  type="text" id="exeDate" name="testDate" 
                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                               th:placeholder="#{SysCommon.placeholder}"
                               th:value='${#dates.format(entity?.testDate,"yyyy-MM-dd")}'>
                        </div>
                    </div> -->
                    <div style="margin-bottom:15px">
                    	<label class="layui-form-label form-lable form-lable2"
                               data-th-text="风险因子的异常处理">风险因子的异常处理</label>
                        <div class="layui-input-inline input-inline input-inline2">
                            <select type="text" id="RISK_FAC_HANDLING" name="riskFacHandling" class="layui-input form-input input-select"
								        placeholder="请选择风险因子的异常处理"
								        allowClear="true" data-th-data-result='${RISK_FAC_HANDLING}'
								        th:initValue='${RISK_FAC_HANDLING_DEFAULT}'>
						    </select>
                        </div>
                    </div>
                    <div  style="margin-bottom:15px">
                    	<label class="layui-form-label form-lable form-lable2"
                               data-th-text="#{MarketRiskStressTest001.remark}">备注</label>
                        <div class="layui-input-inline input-inline input-inline2">
                            <textarea id="remark" name="remark" rows="3"
			                        th:value="${entity?.remark}" 
			                        data-th-text="${entity?.remark}"
			                        class="layui-textarea" placeholder="请输入内容"
			                        data-th-placeholder="#{SysCommon.placeholder}">
                    		</textarea>
                        </div>
                    </div>
		    	</div>
				<div style="text-align:center;">
	            	<a class="layui-btn layui-btn-sm" id="MarketRiskStressTest001_btn_access"  style="height:26px;">
	            		<span class="jyiconfont jyicon-execute" style="font-size:16px"><span>&nbsp;
	            		<span style="font-size:12px">执行压力测试</span>&nbsp;&nbsp;
	            	</a>
        		</div>
			</div>
		    
		</div>
	</div>
	<div layout:fragment="script">
		<style type="text/css">
		.select2-container--default .select2-results__option--highlighted[aria-selected]{
			width:auto;
		}
		.mixtree-div i.icon-showorder{
			display: none;
		}
		.mixtree-div a.portBagAddAicon,a.refreshAicon{
			float: right; 
			padding-right: 10px;
			color:#90C321;
			height:30px;
			line-height:28px;
			cursor: pointer;
		}
		.layui-form-radio {
			line-height: 14px !important
		}
		.layui-form-radio>i {
			font-size: 16px !important
		}
		.manage-info-item li {
			float: left;
			padding-right: 15px;
			line-height: 24px;
		}
		.manage-info-item {
			float: left;
			padding-right: 10px;
		}
		.layui-fluid{
			padding-left:0px;
			padding-right:0px;
		}
		div.input-btn-append a {
			line-height: 20px !important
		}
		a.portBagAicon{
			display:inline-block!important;
			height:20px!important;
			line-height: 20px!important;
			width:92%;
			margin-left:10px!important;
		}
		li.portBagLi:hover,li.active,li.active:hover{
			background: #D9ECFF
		}
		li.portBagLi:hover{
			background: #FFFFCA
		}
		li.portBagLi i{
		 	font-size:15px;
		}
		li.portBagLi i:hover{
			background: #B7DBFA
		}
		.tree-left-width{
		    overflow: hidden;
		    text-overflow: ellipsis;
		    white-space: nowrap;
		    width: 145px;
		}
		.sgePortDiv{
			width:100%;
			overflow:hidden;
			clear:both;
			padding-top: 8px;
		}
		.sgePort23sub{
			width:23%!important
		}
		.sgePort14sub{
			width:32%!important
		}
		.form-lable2{
			width: 22%;
		}
		.input-inline2{
			width: 75% !important;
		}
		.select2-container--default .select2-selection--single .select2-selection__rendered{
			text-align:left;
		}
		</style>
		<script data-th-inline="javascript" type="text/javascript">
			var getAllRelationUrl = /*[[@{/invest/risk/stresstestmanage/flowriskstresstest/FlowRiskStressTest001/getAllPortfolioBySort}]]*/'';
			var RISK_FAC_HANDLING_DEFAULT = [[${RISK_FAC_HANDLING_DEFAULT}]];
		</script>
		<script data-th-src="@{/js/invest/risk/stresstestmanage/marketrisksstresstest/MarketRiskStressTest001.js}"></script>
	</div>
</body>
</html>
