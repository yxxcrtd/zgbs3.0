<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{DocumentManagement003}">附件详情</title>
    <style>
    .download{
      color:#0078F0;
      font-style: normal;
    }
    .delete{
        color:#0078F0;
        font-style: normal;
    }
</style>
</head>
<body>
    <div layout:fragment="content">
		<div class='layui-fluid'>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="pro-module-container">
						<div class="pro-module-wrapper pro-module-base">
							<div class="pro-module-wrap">
								<div class="pro-module">
									<div class="pro-module-item" style="padding-bottom: 8px;">
										<div class="layui-form-item">
											<div style="display: none">
												<input type="text" id="businessId" name="businessId"
													data-th-value="${entity?.businessId}"/>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</form>
			</div>


			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/document/documentmanagement/DocumentManagement003.js}" type="text/javascript"></script>
    </div>
</body>
</html>
