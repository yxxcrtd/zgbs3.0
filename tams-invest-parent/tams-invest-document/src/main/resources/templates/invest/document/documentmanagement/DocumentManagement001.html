<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{DocumentManagement001}">文档管理</title>
<style>
    .icon-upload{
      color:#0078F0;
      font-style: normal;
    }
    .details{
        color:#0078F0;
        font-style: normal;
    }
</style>
</head>
<body>
    <div layout:fragment="content">
        <div class='layui-fluid'>
            <div class="layui-col-md12 layui-col-sm12 layui-col-lg12 layui-col-xs12 form-button-area" style="margin: 10px;">
                <!-- <a id="DocumentManagement001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
                    data-th-text="#{SysCommon.delete}" style="display: none;">删除</a> -->
            </div>
            <div class='joyin-form-wrap joyin-filter-form condition-area'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{DocumentManagement001.portfolioId}">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="portfolioId" name="portfolioId"
                                class="layui-input form-input input-select"
                                allowClear="true" placeholder="" multiple=”true”
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/document/documentmanagement/DocumentManagement001/getPortfolioId}"
                                >
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{DocumentManagement001.businessType}">业务类型</label>
                        <div class="layui-input-inline input-inline">
                            <select id="businessType" name="businessType"
                                class="layui-input form-input input-select" allowClear="true"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result = "${COMMON_BUSINESS_TYPE}">
                                <!-- YUCHUBS-764问题：现有的业务类型只包含了前期有文档上传的功能，后续新增的功能可以上传附件的业务类型就缺少。如：基金类资产存续期刚新加了附件上传的功能，在文档管理中查不到该业务类型。
								建议：把业务类型都放开。同待办事项中业务类型的枚举值。 -->
                                <!-- data-th-data-url="@{/invest/document/documentmanagement/DocumentManagement001/getBusinessType}" -->
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{DocumentManagement001.businessId}">业务编号</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="businessId" name="businessId"
                                class="layui-input form-input"
                                placeholder=""/>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{DocumentManagement001.deptInstitutionCode}">所属部门</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="deptInstitutionCode" name="deptInstitutionCode"
                                class="layui-input form-input input-select" allowClear="true" placeholder=""
                                data-th-data-url="@{/invest/document/documentmanagement/DocumentManagement001/getDeptInstitutionCode}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{DocumentManagement001.userName}">上传人</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="userName" name="userName" 
                                   class="layui-input form-input"
                                   placeholder=""/>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{DocumentManagement001.createTime}">上传时间</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="createTime" name="createTime"
                                class="layui-input form-input input-dateRangeSelect" 
                                allowClear="true" placeholder=""/>
                        </div>
                    </div>
                </div>
            </form>
            </div>
           
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/document/documentmanagement/DocumentManagement001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
