<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title>浮动管理费新建</title>
</head>
<body>
	<div layout:fragment="content">
		<div class="pro-module-container">
			<form class="layui-form joyin-form-wrap pro-module-form"
				id="submitForm">
				<div class="pro-module-wrapper pro-module-base">
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title">
								<span> >计提信息</span> （ <span class="star-sign">*</span>
								必填） <i class="iconfont icon-arrow-down pro-down-icon"></i>
							</h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											th:text="#{BussFinProductFloatFee.feeName}">费用名称</label>
										<div class="layui-input-inline input-inline">
											<select th:id="feeId" th:name="feeId"
												class="layui-input form-input input-select"
												th:initValue="${entity?.feeId}" searchable="false"
												data-th-data-url="@{/component/prod/BussFinProductFloatFee/queryFeeNameInfoList}"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap">适用款型</label>
										<div class="layui-input-inline input-inline">
											<select th:id="prodStyle" th:name="prodStyle"
												class="layui-input form-input input-select"
												th:initValue="${entity?.prodStyle}" searchable="false"
												placeholder="请输入内容" required
												data-th-data-result="${PROD_STYLE}"
												data-th-placeholder="#{SysCommon.placeholder}">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap">投资周期</label>
										<div class="layui-input-inline input-inline">
											<select th:id="investmentCycle" th:name="investmentCycle"
												class="layui-input form-input input-select"
												th:initValue="${entity?.investmentCycle}" searchable="false"
												placeholder="请输入内容" required
												data-th-data-result="${INVESTMENT_CLCYE}"
												data-th-placeholder="#{SysCommon.placeholder}">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											th:text="#{BussFinProductFloatFee.basicBill}">计费基数</label>
										<div class="layui-input-inline input-inline">
											<select th:id="basicBill" th:name="basicBill"
												class="layui-input form-input input-select"
												th:initValue="${entity?.basicBill}" searchable="false"
												data-th-data-result="${BILL_BASE_FEE_KIND}"
												placeholder="请输入内容" disabled required
												data-th-placeholder="#{SysCommon.placeholder}">
											</select>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											th:text="#{BussFinProductFloatFee.basis}">计息基础</label>
										<div class="layui-input-inline input-inline">
											<select th:id="basis" th:name="basis"
												class="layui-input form-input input-select"
												th:initValue="${entity?.basis}" searchable="false" required
												data-th-data-result="${BASIS}" placeholder="请输入内容" disabled
												data-th-placeholder="#{SysCommon.placeholder}">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap" id = "netAssetValueDaydiv">
										<label class="layui-form-label form-label-wrap"
											th:text="#{BussFinProductFloatFee.netAssetValueDay}">资产净值日</label>
										<div class="layui-input-inline input-inline">
											<select th:id="netAssetValueDay" th:name="netAssetValueDay"
												class="layui-input form-input input-select"
												th:initValue="${entity?.netAssetValueDay}"
												searchable="false" data-th-data-result="${BASE_DATE_TYPE}"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required>
											</select>
										</div>
									</div>
									<div class="form-inline-wrap" id = "interValRulediv">
										<label class="layui-form-label form-label-wrap"
											th:text="#{BussFinProductFloatFee.interValRule}">区间规则</label>
										<div class="layui-input-inline input-inline">
											<select th:id="interValRule" th:name="interValRule"
												class="layui-input form-input input-select"
												th:initValue="${entity?.interValRule}" searchable="false"
												data-th-data-result="${FREQUENCY_UNIT}" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required>
											</select>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap" id="provisionFirstDay_div">
										<label class="layui-form-label form-label-wrap"
											th:text="#{BussFinProductFloatFee.provisionFirstDay1}">首次计提日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="provisionFirstDay"
												th:name="provisionFirstDay"
												data-th-value='${#dates.format(entity?.provisionFirstDay,"yyyy-MM-dd")}'
												class="layui-input form-input input-dateSelect"
												required />
										</div>
									</div>
									<div class="form-inline-wrap" id="eAccrDate_div">
										<label class="layui-form-label form-label-wrap"
											th:text="#{BussFinProductFloatFee.eAccrDate}">计提结束日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="eAccrDate" th:name="eAccrDate"
												data-th-value='${#dates.format(entity?.eAccrDate,"yyyy-MM-dd")}'
												class="layui-input form-input input-dateSelect"
												required />
										</div>
									</div>
									<div class="form-inline-wrap" id = "accrTypediv" >
										<label class="layui-form-label form-label-wrap"
											th:text="#{BussFinProductFloatFee.accrType}">计提方式</label>
										<div class="layui-input-inline input-inline">
											<select th:id="accrType" th:name="accrType"
												class="layui-input form-input input-select"
												th:initValue="${entity?.accrType}" searchable="false"
												data-th-data-result="${DRAW_TYPE}" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required>
											</select>
										</div>
									</div>
								</div>
								<div class="layui-form-item" id = "hidediv5">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											th:text="#{BussFinProductFloatFee.fAccrEndDate}">首个计提区间结束日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="fAccrEndDate"
												th:name="fAccrEndDate" required
												data-th-value='${#dates.format(entity?.fAccrEndDate,"yyyy-MM-dd")}'
												class="layui-input form-input input-dateSelect" />
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											th:text="#{BussFinProductFloatFee.accrTdayRule}">计提营业日准则</label>
										<div class="layui-input-inline input-inline">
											<select th:id="accrTdayRule" th:name="accrTdayRule"
												class="layui-input form-input input-select"
												th:initValue="${entity?.accrTdayRule}" searchable="false"
												data-th-data-result="${TDAY_RULE}" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required>
											</select>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="pro-module-wrap">
						<div class="pro-module">
					        <div class="pro-module-item">
					        	<input th:id="workflowId" type="hidden" th:value="${workflowId}"><!-- 工作流代码 -->
					        	<input type="text" th:name="pageId" data-th-value='${pageId}' style="display: none;">
					        	<h4 class="pro-module-title">
									<span> >业绩基准信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i>
								</h4>        	
					            <div class="layui-form-item">
					                <div class="form-inline-wrap">
					                    <label class="layui-form-label form-label-wrap" th:text="#{BussBenchMarkInfo.rateType}"></label>
					                    <div class="layui-input-inline input-inline">
					                        <select th:id="rateType"
												th:name="rateType"
												class="layui-input form-input input-select"
												th:initValue="${entity?.rateType}"
												data-th-data-result="${INT_TYPE}" searchable="false"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}">
											</select>
					                    </div>
					                </div>
					                <div class="form-inline-wrap">
					                    <label class="layui-form-label form-label-wrap" th:text="#{BussBenchMarkInfo.rate}"></label>
					                    <div class="layui-input-inline input-inline">
					                        <input type="text" th:id="rate"
														th:name="rate" length="5"
														th:value="${entity?.rate}"
														class="layui-input form-input text-number" data-textrange="4" />
					                    </div>
					                </div>
					            </div>
					            <div class="layui-form-item">
					                <div class="form-inline-wrap">
					                    <label class="layui-form-label form-label-wrap" th:text="|#{BussBenchMarkInfo.indexId}=|">浮动利率(%)=</label>
					                    <div class="layui-input-inline input-inline">
					                        <select th:id="indexId"
												th:name="indexId"
												class="layui-input form-input input-select"
												th:initValue="${entity?.indexId}"
												data-th-data-result="${INDEX_ID_SOURCE}" searchable="true"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}">
											</select>
					                    </div>
									</div>
					                <div class="form-inline-wrap">
					                    <label class="layui-form-label form-label-wrap" th:text="#{BussBenchMarkInfo.coefficient}">*系数</label>
					                    <div class="layui-input-inline input-inline">
					                        <input type="text" th:id="coefficient"
														th:name="coefficient" length="5"
														th:value="${entity?.coefficient}"
														class="layui-input form-input text-number" data-textrange="2" />
					                    </div>
									</div>
					                <div class="form-inline-wrap">
					                    <label class="layui-form-label form-label-wrap" th:text="#{BussBenchMarkInfo.spreadRate}">+利差(%)</label>
					                    <div class="layui-input-inline input-inline">
					                        <input type="text" th:id="spreadRate"
														th:name="spreadRate" length="5"
														th:value="${entity?.spreadRate}"
														class="layui-input form-input text-number" data-textrange="4" />
					                    </div>
									</div>
					            </div>
					            <div class="layui-form-item">
					                <div class="form-inline-wrap">
					                    <label class="layui-form-label form-label-wrap" th:text="#{BussBenchMarkInfo.resetType}"></label>
					                    <div class="layui-input-inline input-inline">
					                        <select th:id="resetType"
												th:name="resetType"
												class="layui-input form-input input-select"
												th:initValue="${entity?.resetType}"
												data-th-data-result="${EFFECTIVE_RULE}" searchable="false"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												required="required">
											</select>
					                    </div>
					                </div>
					            </div>
					        </div>
					    </div>
					</div>
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title">
								<span> >支付信息</span> <i
									class="iconfont icon-arrow-down pro-down-icon"></i>
							</h3>
							<div class="pro-module-item">

								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											th:text="#{BussFinProductFloatFee.payCycle}">付费规则</label>
										<div class="layui-input-inline input-inline">
											<select th:id="payCycle" th:name="payCycle"
												class="layui-input form-input input-select"
												th:initValue="${entity?.payCycle}" searchable="false"
												data-th-data-result="${FREQUENCY_UNIT}" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required>
											</select>
										</div>
									</div>
									<div class="form-inline-wrap" id ="firstPayDate_div">
										<label class="layui-form-label form-label-wrap"
											th:text="#{BussFinProductFloatFee.firstPayDate}">首次付费结束日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="firstPayDate"
												th:name="firstPayDate"
												data-th-value='${#dates.format(entity?.firstPayDate,"yyyy-MM-dd")}'
												class="layui-input form-input input-dateSelect"
												required />
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											th:text="#{BussFinProductFloatFee.endTdayRule}">计费营业日准则</label>
										<div class="layui-input-inline input-inline">
											<select th:id="endTdayRule" th:name="endTdayRule"
												class="layui-input form-input input-select"
												th:initValue="${entity?.endTdayRule}" searchable="false"
												data-th-data-result="${TDAY_RULE}" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required>
											</select>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											th:text="#{BussFinProductFloatFee.payTdayRule}">付费营业日准则</label>
										<div class="layui-input-inline input-inline">
											<select th:id="payTdayRule" th:name="payTdayRule"
												class="layui-input form-input input-select"
												th:initValue="${entity?.payTdayRule}" searchable="false"
												data-th-data-result="${TDAY_RULE}" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required>
											</select>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title">
								<span> >超额收益分层</span> <i
									class="iconfont icon-arrow-down pro-down-icon"></i>
							</h3>
							<div th:id="div_floatManageFee">
								<table class="layui-table pro-table-wrap" th:id="floatManageFee"
									th:title="#{BussFinProductFloatFee}"
									th:name="finFloatCalcRuleDetailDtoList"></table>
							</div>
						</div>
					</div>
					
					<div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                            	<span> >备注</span> <i
									class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="layui-input-inline input-inline" style="width: 98%!important;margin:0 10px;">
                                        <textarea id="remark" name="remark" placeholder="请输入内容"
                                                  data-th-placeholder="#{SysCommon.placeholder}" maxlength="300"
                                                  class="layui-textarea" data-th-text="${entity?.remark}"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

					<div
						class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11"
						style="margin: 50px;">
						<div class="row text-center" style="margin: 20px 0;">
							<a id="MstFeeVarieties002_btn_save"
								class="layui-btn layui-btn-sm btn-save">确认</a> <a
								id="MstFeeVarieties002_btn_cancel"
								class="layui-btn layui-btn-sm btn-cancel"
								data-th-text="#{SysCommon.cancel}">取消</a>
						</div>
					</div>
				</div>
			</form>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var floatFeeEntityName = /*[[${entityName}]]*/''; // 实体类字段名
			var profitType = /*[[${profitType}]]*/''; // 父画面收益类型
			var PROFIT_TYPE_02 = /*[[${PROFIT_TYPE_02}]]*/'02'; // 预期收益性
			var floatFeeFinprodId = /*[[${finprodId}]]*/''; // 金融产品代码
			var workflowId = /*[[${workflowId}]]*/''; // 工作流代码
			var effDate = /*[[${effDate}]]*/''; // 生效日期
			var PROFIT_TYPE_01 = /*[[${PROFIT_TYPE_01}]]*/'01'; //净值性
			var mdate = /*[[${mdate}]]*/'';
			var vdate = /*[[${vdate}]]*/'';
			var prdinfo = /*[[${prdinfo}]]*/''; 
			var INDEX_ID_SOURCE = /*[[${INDEX_ID_SOURCE}]]*/''; 
			var finFloatCalcRuleDetailDtoList = /*[[${entity?.finFloatCalcRuleDetailDtoList}]]*/'';
			var feeList = /*[[${feeList}]]*/'';
			var pageId = /*[[${pageId}]]*/'';
			var INT_TYPE_01 = /*[[${INT_TYPE_01}]]*/'01'; // 数据字典.利率类型_固定利率
			var DISPOSE_PATTERN_11 = /*[[${DISPOSE_PATTERN_11}]]*/'11'; //产品处理模式 分档
		    var DISPOSE_PATTERN_10 = /*[[${DISPOSE_PATTERN_10}]]*/'10'; //产品处理模式 周期
		    var dealMode = /*[[${dealMode}]]*/; //产品处理模式 
		</script>
		<script
			data-th-src="@{/js/invest/basicdata/mstfloatfeevarieties/MstFloatFeeVarieties002.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
