<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<title data-th-text="#{MstCustomerNature002}">客户性质配置</title>
 <style type="text/css">
.customer-table-two .layui-border-box {
     height:200px!important;
 }
.customer-table-one .layui-border-box {
     height:200px!important;
 }
.customer-table-two .layui-border-box .layui-table-box .layui-table-body{
	height: 159px!important;
}
.customer-table-one .layui-border-box .layui-table-box .layui-table-body{
     height: 115px!important;
}
 .layui-border-box{
 	overflow-y:auto;
 	overflow-x:hidden;
 }
 
 .customer-table-one,.customer-table-two, .customer-table-three{
 	margin-top:-10px;
 }
 </style>
</head>
<body>
     <div layout:fragment="content">
     <div class="form-button-area" style="margin:10px;" export="false">
      </div>
       <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form"  id="submitForm">
				<div class="layui-form-item">
					<!-- mody by meifaxin 2021-9-26 客户类型字段改为选填 start -->
					<!-- mody by  meifaxin 2021-9-26 客户类型字段改为选填 end -->
					<div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							data-th-text="#{MstCustomerNature002.customerType}">客户类型</label>
						<div class="layui-input-inline input-inline">
							<select formatoption = "true" type="text" id="customerType" maxlength="50"
							name="customerType"class="layui-input form-input input-select"
							data-th-data-result='${CUSTOMER_TYPE}'
							allowClear="true"placeholder="请输入内容"data-th-placeholder="#{SysCommon.placeholder}">
							</select>
						</div>
					</div>
					<div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							data-th-text="#{MstCustomerNature002.customerId}">代码</label>
						<div class="layui-input-inline input-inline">
						<input type="text" id="customerId" name="customerId" maxlength="50"
									class="layui-input form-input input-lenovoselect"
									data-th-data-url="@{/invest/basicdata/mstcustomernature/MstCustomerNature002/getCustomerId}"
									placeholder="请输入内容"		
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-parentIds="customerType"
									data-idfield="code" data-keyfield="code" 
									data-th-data-effectivefieldsalias='|{"code":"#{MstCustomerNature001.customerId}",
									"shortName":"#{MstCustomerNature001.customerName}"}|'>
						</div>
					</div>
					<div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							data-th-text="#{MstCustomerNature002.customerName}">名称</label>
						<div class="layui-input-inline input-inline">
						<input type="text" id="customerName" name="customerName" maxlength="100"
									class="layui-input form-input input-lenovoselect"
									data-th-data-url="@{/invest/basicdata/mstcustomernature/MstCustomerNature002/getName}"
									placeholder="请输入内容"		
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-parentIds="customerType"
									data-idfield="shortName" data-keyfield="shortName" 
									data-th-data-effectivefieldsalias='|{"code":"#{MstCustomerNature001.customerId}",
									"shortName":"#{MstCustomerNature001.customerName}"}|'>
						</div>
					</div>
				</div>
			</form>   
            </div> 
             
		<div class="layui-row" >
			<div class="layui-col-xs8 layui-col-sm8 layui-col-md8 layui-col-lg8 customer-table-one" style="padding:0px;">
				<table class="layui-table" id="dataTable" ></table>
			</div>
			<div class="layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4 customer-table-two" >
				<table class="layui-table" id="customerCharaterTable" ></table>
			</div>
		</div>
		<div style="margin-left:10px; margin-bottom:10px;">
			<a id="MstCustomerNature002_btn_match" class="layui-btn layui-btn-sm" data-th-text="#{MstCustomerNature002.match}">匹配</a>
             <a id="MstCustomerNature002_btn_unMatch" class="layui-btn layui-btn-sm" data-th-text="#{MstCustomerNature002.unMatch}">匹配取消</a>
       </div>
		<div class='layui-row customer-table-three'>
			<table class="layui-table" id="matchTable"></table>
		</div>
		<div class="layui-col-xs12 layui-col-sm12 layui-col-md12 layui-col-lg12" style='text-align:center; margin: 30px 0;'>
            <a id="MstCustomerNature002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="MstCustomerNature002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="MstCustomerNature002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
	</div>
	<div layout:fragment="script">
		<script th:inline="javascript" type="text/javascript">
        	var typeValue_01 = /*[[${typeValue_01}]]*/'';
			var typeValue_02 = /*[[${typeValue_02}]]*/'';
			var typeValue_03 = /*[[${typeValue_03}]]*/'';
			var typeValue_04 = /*[[${typeValue_04}]]*/'';
			var typeValue_05 = /*[[${typeValue_05}]]*/'';
			var typeValue_06 = /*[[${typeValue_06}]]*/'';
			var typeValue_07 = /*[[${typeValue_07}]]*/'';
			var typeValue_08 = /*[[${typeValue_08}]]*/'';
			var typeValue_09 = /*[[${typeValue_09}]]*/'';
			var typeValue_10 = /*[[${typeValue_10}]]*/'';
			var typeValue_12 = /*[[${typeValue_12}]]*/'';
			var typeValue_13 = /*[[${typeValue_13}]]*/'';
			var typeName_01 = /*[[${typeName_01}]]*/'';
			var typeName_02 = /*[[${typeName_02}]]*/'';
			var typeName_03 = /*[[${typeName_03}]]*/'';
			var typeName_04 = /*[[${typeName_04}]]*/'';
			var typeName_05 = /*[[${typeName_05}]]*/'';
			var typeName_06 = /*[[${typeName_06}]]*/'';
			var typeName_07 = /*[[${typeName_07}]]*/'';
			var typeName_08 = /*[[${typeName_08}]]*/'';
			var typeName_09 = /*[[${typeName_09}]]*/'';
			var typeName_10 = /*[[${typeName_10}]]*/'';
			var typeName_12 = /*[[${typeName_12}]]*/'';
			var typeName_13 = /*[[${typeName_13}]]*/'';

			var CUSTOMER_TYPE_01 = /*[[${CUSTOMER_TYPE_01}]]*/'';
			var CUSTOMER_TYPE_02 = /*[[${CUSTOMER_TYPE_02}]]*/'';
			var formTodoList = /*[[${formTodoList}]]*/false;
			var entityData = JSON.parse(/*[[${entity}]]*/'{}');
        </script>
        <script data-th-src="@{/js/invest/basicdata/mstcustomernature/MstCustomerNature002.js}" type="text/javascript"></script>
    </div>
</body>

</html>
