<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<title data-th-text="#{MstMarketInstitutions002}">市场机构信息新建</title>
    <style>
        .mst-textarea{
            min-height: auto;
        }
        .cus-table-wrap .layui-border-box{
            height: 180px;
        }
        .cus-table-wrap .layui-border-box .layui-table-box{
            height: 140px;
        }
        .cus-table-wrap .layui-border-box .layui-table-box .layui-table-body{
            height: 101px;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
                <input type="hidden" name="isIssuer" data-th-value="${entity?.isIssuer}">
                <div class="pro-module-wrapper pro-module-base">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">基本信息</span>（<span class="star-sign">*</span> 必填）
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <!-- <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstMarketInstitutions002.linkId1}">wind编码</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="linkId1" name="linkId1"
                                                class="layui-input form-input" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.linkId1}" />
                                        </div>
                                    </div>
                                </div> -->
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstMarketInstitutions002.customerId}">市场机构代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="customerId" name="customerId"
                                                class="layui-input form-input" data-th-value="${entity?.customerId}"
                                                disabled=true />
                                            <!-- placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" -->
                                        </div>
                                        <div style="display: none;" class="layui-input-inline input-inline">
                                            <input type="text" id="workflowId" name="workflowId"
                                                class="layui-input form-input" data-th-value="${workflowId}"
                                                disabled=true />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstMarketInstitutions002.customerName}">市场机构名称</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="customerName" name="customerName" required="required"
                                                class="layui-input form-input" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.customerName}" maxlength="60" />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstMarketInstitutions002.hstype}">核算分类</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="hsType" name="hsType"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.hsType}"
                                                data-th-data-result='${HS_TYPE}' formatoption=true>
                                        </div>
                                    </div>
                                    <!-- <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstMarketInstitutions002.BECIF}">BECIF</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="linkId2" name="linkId2"
                                                class="layui-input form-input" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.linkId2}" maxlength="32" />
                                        </div>
                                    </div> -->
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstMarketInstitutions002.partyType3}">机构类型(技术领域)</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="partyType3" name="partyType3"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.partyType3}"
                                                data-th-data-result='${SVR_PARTY_TYPE3}' formatoption=true required>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstMarketInstitutions002.industry}">所属行业</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="industry" name="industry"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.industry}"
                                                data-th-data-result='${INSTITUTION_INDUSTRY_FIRST_LEVEL}'
                                                childrenIds="industry2" required></select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstMarketInstitutions002.industrySecondClass}">行业二级分类</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="industry2" name="industry2"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.industry2}"
                                                data-th-data-result='${INSTITUTION_INDUSTRY_SECOND_LEVEL}'
                                                childrenIds="industry3"
                                                formatoption=true required></select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstMarketInstitutions002.partyType2}">企业性质</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="partyType2" name="partyType2"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.partyType2}"
                                                data-th-data-result='${ENTERPRISE_PROPERTY}' formatoption=true required>
                                        </div>
                                    </div>

                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstMarketInstitutions002.industryThirdClass}">行业三级类别</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="industry3" name="industry3"
                                                    class="layui-input form-input input-select" allowClear="true"
                                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue="${entity?.industry3}"
                                                    data-th-data-result='${INSTITUTION_INDUSTRY_THIRD_LEVEL}'
                                                    parentIds="industry2" childrenIds="industry4"
                                                    formatoption=true ></select>
                                        </div>
                                    </div>

                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstMarketInstitutions002.industryFourthClass}">行业四级类别</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="industry4" name="industry4"
                                                    class="layui-input form-input input-select" allowClear="true"
                                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue="${entity?.industry4}"
                                                    data-th-data-result='${INSTITUTION_INDUSTRY_FOURTH_LEVEL}' parentIds="industry3"
                                                    formatoption=true ></select>
                                        </div>
                                    </div>



                                </div>
                                <div class="layui-form-item">
                                    <!-- <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable" data-th-text="#{MstMarketInstitutions002.companyProperty}">公司性质</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="partyType2" name="partyType2"
                                    class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-initValue="${entity?.partyType2}"
                            		data-th-data-result='${COMPANY_NATURE}'>
                            
                    </div>
                </div> -->
                                    <!-- <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable" data-th-text="#{MstMarketInstitutions002.ownCompany}">所属公司</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="partyType2" name="partyType2"
                                    class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-initValue="${entity?.partyType2}"
                            		data-th-data-result='${SVR_PARTY_TYPE2}'>
                    </div>
                </div> -->
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstMarketInstitutions002.partyType1}">机构类型(规模)</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="partyType1" name="partyType1"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.partyType1}"
                                                data-th-data-result='${MARKET_INSTI_TYPE_SCA}' formatoption=true required>
                                                <!-- 20200819 上述的机构类型（规模）参数取值变更为市场机构机构类型（规模） wangwei -->
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstMarketInstitutions002.insitituteCode}"
                                            style='line-height: normal;width: 43%'>组织机构代码/统一社会信用代码</label>
                                        <div class="layui-input-inline input-inline" style="width: 55% !important">
                                            <input type="text" id="insitituteCode" name="insitituteCode"
                                                class="layui-input form-input" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                   maxlength="50"
                                                   onkeyup="value=value.replace(/[\W]/g,'')"
                                                   data-th-value="${entity?.insitituteCode}" required/>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstMarketInstitutions002.isGov}">是否政府融资平台</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="isGov" name="isGov"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.isGov}" data-th-data-result='${YES_OR_NO}'
                                                formatoption=true>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstMarketInstitutions002.mainCapital}">核心资本(万元)</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="mainCapital" name="mainCapital"
                                                class="layui-input form-input text-number" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.mainCapital}" maxlength="30" data-textrange="4" />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstMarketInstitutions002.registerCapital}">注册资本(万元)</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="registerCapital" name="registerCapital"
                                                class="layui-input form-input text-number" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.registerCapital}" data-moneymemory=""
                                                maxlength="30" data-textrange="4" />
                                        </div>
                                    </div>
                                    <!--添加字段'是否持有金融牌照' add by lishuping  20190823 start-->
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstMarketInstitutions001.isFinLicence}">是否持有金融牌照</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="isFinLicence" name="isFinLicence"
                                                    class="layui-input form-input input-select" allowClear="true"
                                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue="${entity?.isFinLicence}"
                                                    data-th-data-result='${YES_OR_NO}'
                                                    formatoption=true>
                                        </div>
                                    </div>
                                    <!--添加字段'是否持有金融牌照' add by lishuping 20190823 end-->
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstMarketInstitutions002.province}">所属省</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="province" name="province"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.province}"
                                                data-th-data-result='${ADMINISTRATIVE_TYPE1}' childrenIds="city"
                                                formatoption=true required>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstMarketInstitutions002.city}">所属市</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="city" name="city"
                                                class="layui-input form-input input-select input-lenovoselect"
                                                allowClear="true" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.city}" formatoption=true
                                                parentIds="province" childrenIds="county"
                                                data-th-data-url="@{/invest/basicdata/mstmarketinstitutions/MstMarketInstitutions002/getCity}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstMarketInstitutions002.county}">所属县</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="county" name="county"
                                                class="layui-input form-input input-select input-lenovoselect"
                                                allowClear="true" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.county}" parentIds="city" formatoption=true
                                                data-th-data-url="@{/invest/basicdata/mstmarketinstitutions/MstMarketInstitutions002/getCounties}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstMarketInstitutions002.holdingType}">控股类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="holdingType" name="holdingType"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.holdingType}"
                                                data-th-data-result='${HOLDING_TYPE}' formatoption=true>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstMarketInstitutions002.customerObjType}">客户主体类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="customerObjType" name="customerObjType"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.customerObjType}"
                                                data-th-data-result='${CUSTOMER_PRIN_TYPE}' formatoption=true>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstMarketInstitutions002.isListedCompany}">是否上市公司</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="isListedCompany" name="isListedCompany"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.isListedCompany}"
                                                data-th-data-result='${YES_OR_NO}' formatoption=true>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstMarketInstitutions002.isGroupCustomer}">是否集团客户</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="isGroupCustomer" name="isGroupCustomer"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.isGroupCustomer}"
                                                data-th-data-result='${YES_OR_NO}' formatoption=true>
                                        </div>
                                    </div>
                                    <!-- <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable" data-th-text="#{MstMarketInstitutions002.parentCustomerId}">所属集团客户编号</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="parentCustomerId" name="parentCustomerId" 
                            class="layui-input form-input"
                            placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" 
                            data-th-value="${entity?.parentCustomerId}"
                            maxlength="32"/>
                    </div>
                </div> -->
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstMarketInstitutions002.parentCustomerName}">所属集团客户名称</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="parentCustomerName" name="parentCustomerName"
                                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-url="@{/invest/basicdata/mstmarketinstitutions/MstMarketInstitutions001/getCustomerId}"
                                                data-idfield="code" data-keyfield="shortName"
                                                data-th-data-effectivefieldsalias='|{"code":"#{MstMarketInstitutions002.customerId}","shortName":"#{MstMarketInstitutions002.customerName}"}|'
                                                data-th-value="${entity?.parentCustomerName}" />
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstMarketInstitutions002.isPrivate}">是否民营企业</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="isPrivate" name="isPrivate"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.isPrivate}"
                                                data-th-data-result='${YES_OR_NO}' formatoption=true>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstMarketInstitutions002.isEscapeDept}">是否为逃废债企业</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="isEscapeDept" name="isEscapeDept"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.isEscapeDept}"
                                                data-th-data-result='${YES_OR_NO}' formatoption=true>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstMarketInstitutions002.creditType}">授信策略</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="creditType" name="creditType"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.creditType}"
                                                data-th-data-result='${CREDIT_POLICY}' formatoption=true>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstMarketInstitutions002.isCreditRelatedTrd}"
                                            style='line-height: normal;'>是否授信类关联交易</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="isCreditRelatedTrd" name="isCreditRelatedTrd"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.isCreditRelatedTrd}"
                                                data-th-data-result='${YES_OR_NO}' formatoption=true>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstMarketInstitutions002.structAdjustType}"
                                            style='line-height: normal;'>产业结构调整类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="structAdjustType" name="structAdjustType"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.structAdjustType}"
                                                data-th-data-result='${INDUSTY_STRUCT_ADJ_TYPE}' formatoption=true>
                                        </div>
                                    </div>
