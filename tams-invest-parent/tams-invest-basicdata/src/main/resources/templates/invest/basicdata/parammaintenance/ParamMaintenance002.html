<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ParamMaintenance002}">OPICS参数维护新建</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6 layui-col-sm6 layui-col-lg6">
                    <label class="layui-form-label form-lable" data-th-text="#{ParamMaintenance001.parameterType}">参数类型</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="parameterType" name="parameterType" 
                            required="required"
                            class="layui-input form-input input-select" 
                            data-th-data-result='${COMMON_BUSINESS_TYPE}' 
                            allowClear="true" placeholder="请输入内容" 
                            data-th-placeholder="#{SysCommon.placeholder}">
                                <option></option>
                                <option>计息规则</option>
                                <option>BRANCK</option>
                                <option>BROK</option>
                                <option>OOST</option>
                                <option>DEALTYPE</option>
                                <option>PORT</option>
                                <option>业务类型</option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md6 layui-col-sm6 layui-col-lg6 ">
                    <label class="layui-form-label form-lable" data-th-text="#{ParamMaintenance002.projectCode}">项目代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="projectCode" name="projectCode" 
                            required="required"
                            class="layui-input form-input"
                            placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">           
                <div class="layui-inline layui-col-md6 layui-col-sm6 layui-col-lg6 ">
                    <label class="layui-form-label form-lable" data-th-text="#{ParamMaintenance002.projectcodeName}">项目代码名称</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="projectcodeName" name="projectcodeName" 
                            required="required"
                            class="layui-input form-input"
                            placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
                    </div>
                </div>                           
                <div class="layui-inline layui-col-md6 layui-col-sm6 layui-col-lg6">
                    <label class="layui-form-label form-lable" data-th-text="#{ParamMaintenance002.projectValuec}">项目值（中文）</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="projectValuec" name="projectValuec" class="layui-input form-input"  required="required"
                            placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6 layui-col-sm6 layui-col-lg6">
                    <label class="layui-form-label form-lable" data-th-text="#{ParamMaintenance002.projectValuee}">项目值（英文）</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="projectValuee" name="projectValuee" class="layui-input form-input"  required="required"
                            placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
                
                <div class="layui-inline layui-col-md6 layui-col-sm6 layui-col-lg6">
                    <label class="layui-form-label form-lable" data-th-text="#{ParamMaintenance002.sort}">排序</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="sort" name="sort" class="layui-input form-input"  required="required"
                            placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
            </div>           
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6 layui-col-sm6 layui-col-lg6">
                    <label class="layui-form-label form-lable" data-th-text="#{ParamMaintenance002.remark}">备注</label>
                    <div class="layui-input-inline input-inline">
                         <textarea rows="3" cols="30"  name="remark" class="layui-input form-input">
                         </textarea>
                    </div>
                </div>
            
        </form>
        <div class="layui-col-md11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
            <div class="text-center">
                <a id="ParamMaintenance002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                <a id="ParamMaintenance002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="ParamMaintenance002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/basicdata/parammaintenance/ParamMaintenance002.js}" type="text/javascript"></script>
    </div>
</body>

</html>
