<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title data-th-text="#{StandardCouponReConversionRate002}">标准券再折算率新建|修改</title>
</head>
<body>
<div layout:fragment="content">
    <!-- 画面信息 -->
    <div class='layui-fluid' id="StandardCouponReConversionRate002_DIV">
        <div class="pro-module-container">
            <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
                <div class="pro-module-wrapper pro-module-base step" title="基本信息">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">资金账户信息</span>（<span class="star-sign">*</span>必填）<i
                                    class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <input id="workflowId" name="workflowId" data-th-value="${workflowId}" type="hidden">
                            <div class="pro-module-item pro-item-wrap">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{StandardCouponReConversionRate001.broker}">券商</label>
                                        <div class="layui-input-inline input-inline">
                                            <!--<select  id="broker" name="broker"-->
                                            <!--data-th-initValue="${entity?.broker}" -->
                                            <!--class="layui-input form-input input-select">-->
                                            <!--</select>-->
                                            <select  id="brokerId" name="brokerId" required
                                                     allowClear="true"
                                                     formatoption="false" autosort="false"
                                                     data-th-data-result="${brokerIds}"
                                                     th:initValue="*{entity?.brokerId}"
                                                     class="layui-input form-input input-select">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{StandardCouponReConversionRate001.finprodId}">资产代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <select  id="finprodId" name="finprodId" allowClear="true"
                                                     data-th-data-result="${finprodIdList}"
                                                     formatoption="false" autosort="false"
                                                     th:initValue="*{entity?.finprodId}"
                                                     class="layui-input form-input input-select">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{StandardCouponReConversionRate001.accountType}">资金账户</label>
                                        <div class="layui-input-inline input-inline">
                                            <select  id="accountType" name="accountType" allowClear="true"
                                                     data-th-data-result="${accountTypeList}"
                                                     formatoption="false" autosort="false"
                                                     th:initValue="*{entity?.accountType}"
                                                     class="layui-input form-input input-select">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">再折算率信息</span>（<span class="star-sign">*</span>必填）<i
                                    class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item pro-item-wrap">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{StandardCouponReConversionRate002.tandardRate}">标准券折算率</label>
                                        <div class="layui-input-inline input-inline">
                                            <input id="tandardRate" name="tandardRate" required allowClear="true"
                                                   th:value="${entity?.tandardRate}"
                                                   class="layui-input form-input" />
                                            <span class="input-right-show">%</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{StandardCouponReConversionRate001.startDate}">开始日期</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="startDate" name="startDate" required
                                                   th:value="${entity?.startDate}"
                                                   class="layui-input form-input input-dateSelect" />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{StandardCouponReConversionRate001.endDate}">结束日期</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="endDate" name="endDate"
                                                   th:value="${entity?.endDate}"
                                                   class="layui-input form-input input-dateSelect" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row text-center stepbar">
                            <a id="StandardCouponReConversionRate002_btn_save" class="layui-btn layui-btn-sm btn-save"
                               data-th-text="#{SysCommon.save}">保存</a>
                            <a id="StandardCouponReConversionRate002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                               data-th-text="#{SysCommon.submit}">提交</a>
                            <a id="StandardCouponReConversionRate002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                               data-th-text="#{SysCommon.cancel}">取消</a>
                        </div>
                    </div>
                </div>
            </form>
        </div>

    </div>
</div>

<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var seqNo = /*[[${seqNo}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/basicdata/standardcouponreconversionrate/StandardCouponReConversionRate002.js}" type="text/javascript"></script>
</div>

</body>
</html>
