<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{MstFeeVarieties001}">费用品种信息管理</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				<a id="MstFeeVarieties001_btn_add"
					class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a>
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">

						<div
							class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								data-th-text="#{MstFeeVarieties001.feeName}">费用名称</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="feeName" name="feeName"
									class="layui-input form-input input-lenovoselect"
									data-th-data-url="@{/invest/basicdata/mstfeevarieties/MstFeeVarieties001/getFeeName}"
									allowClear="true" placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-idfield="code" data-keyfield="shortName"
									data-th-data-effectivefieldsalias='|{"code":"#{MstFeeVarieties001.feeId}","shortName":"#{MstFeeVarieties001.feeName}"}|' />
							</div>
						</div>
						<div
							class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{MstFeeVarieties001.feeType}">费用类型</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="feeType" name="feeType"
									formatoption="true" class="layui-input form-input input-select"
									placeholder="请输入内容" data-th-data-result='${FEE_SPECIES_TYPE}'
									data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
					</div>
				</form>
			</div>

			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script
			data-th-src="@{/js/invest/basicdata/mstfeevarieties/MstFeeVarieties001.js}"></script>
	</div>
</body>
</html>
