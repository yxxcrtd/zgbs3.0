<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{FuturesDepositPercent002}">期货保证金比例设置新建</title>
</head>
<body>
<div layout:fragment="content">
    <div>
        <div class="pro-module-wrapper pro-module-base" style="border-top: none;">
            <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title" style="border-top: 1px solid #cccccc;">
                            <span class="title-des">基本信息</span>（<span class="star-sign">*</span> 必填）
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{FuturesDepositPercent001.futuresType}">期货类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="futuresType" name="futuresType"
                                                data-th-initValue='${entity?.futuresType}'
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${FUTURES_TYPE}' allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption=true required="required" childrenIds="futuresContractId">
                                        </select>
                                    </div>
                                </div>

                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{FuturesDepositPercent001.futuresContractId}">合约标的</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="futuresContractId" name="futuresContractId"
                                                data-th-initValue='${entity?.futuresContractId}'
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${FUTURES_CONTRACT}' allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption=false required="required">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{FuturesDepositPercent001.futuresCompany}">期货公司</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="futuresCompany" name="futuresCompany"
                                                data-th-initValue='${entity?.futuresCompany}'
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                data-th-data-url="@{/invest/basicdata/mstsecuritiesaccount/MstSecuritiesAccount002/getFuturesCompany}"
                                                data-th-placeholder="#{SysCommon.placeholder}" required="required">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{FuturesDepositPercent001.effDate}">生效日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id='effDate' name='effDate'
                                               class="layui-input form-input input-dateSelect" placeholder="请选择时间"
                                               data-th-value='${#dates.format(entity?.effDate,"yyyy-MM-dd")}'
                                               required>
                                    </div>
                                </div>

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{FuturesDepositPercent002.depositPercent}">期货保证金比例</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="depositPercent" name="depositPercent"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-value='${entity?.depositPercent}'
                                               data-th-placeholder="#{SysCommon.placeholder}" data-textrange="2"
                                               maxlength="30" required="required">
                                        <span class="input-right-show">%</span>
                                    </div>
                            </div>

                        </div>
                    </div>
                </div>
                <div class="layui-col-xs11 layui-col-md11 layui-col-sm11 layui-col-lg11" style="margin: 30px;">
                    <div class="text-center">
                        <a id="FuturesDepositPercent002_btn_save" class="layui-btn layui-btn-sm btn-save"
                           data-th-text="#{SysCommon.save}">保存</a>
                        <a id="FuturesDepositPercent002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                           data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="FuturesDepositPercent002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                           data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript">

    </script>
    <script data-th-src="@{/js/invest/basicdata/futuresdepositpercent/FuturesDepositPercent002.js}" type="text/javascript"></script>
</div>
</body>
</html>
