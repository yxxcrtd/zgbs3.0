<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{MstCommissionSet001}">交易所费用设置</title>
</head>
<body>
    <div layout:fragment="content">
        <!-- 画面信息 -->
        <div class='layui-fluid'>
			<div class="layui-col-xs12 layui-col-md12 layui-col-sm12 layui-col-lg12 form-button-area" style="margin:10px;">
				<a id="MstCommissionSet001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}" >新建</a>
		        <a id="MstCommissionSet001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}" style="display:none;">删除</a>
	   	    </div>
            <div class="joyin-form-wrap joyin-filter-form condition-area">
                <form class="layui-form" id="searchForm">
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                                   data-th-text="#{MstCommissionSet001.feeType}">费用类型</label>
                            <div class="layui-input-inline input-inline">
                                <select id="MstCommissionSet001_feeType" name="feeType"
                                        class="layui-input form-input input-select"
                                        data-th-data-result='${FEE_TYPE}'
                                        allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}">
                                </select>
                            </div>
                        </div>
    					<div
    						class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
    						<label class="layui-form-label form-lable"
    							data-th-text="#{MstCommissionSet001.tradeMarket}">交易场所</label>
    						<div class="layui-input-inline input-inline">
    							<select id="MstCommissionSet001_tradeMarket" name="tradeMarket"
    									class="layui-input form-input input-select" 
    									data-th-data-result='${TRADE_PLACE}'
    									allowClear="true" placeholder="请输入内容"
    									data-th-placeholder="#{SysCommon.placeholder}">
    								</select>	
    						</div>
    					</div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable"
                                   data-th-text="#{MstCommissionSet002.tradeType}">交易品种</label>
                            <div class="layui-input-inline input-inline">
                                <select th:id="tradeType" name="tradeType" formatoption="false"
                                        class="layui-input form-input input-select"
                                        multiple="true"
                                        data-th-placeholder="#{SysCommon.placeholder}"
                                        data-th-initValue='${entity?.tradeType}'
                                        data-th-data-result="${RISK_ASSET_TYPE}">
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                                   data-th-text="#{MstCommissionSet002.effDate}">生效日</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="effDate" name="effDate"
                                       class="layui-input form-input input-dateSelect"
                                       data-th-value='${#dates.format(entity?.effDate,"yyyy-MM-dd")}'
                                       placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" >
                            </div>
                        </div>
                        <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                                   data-th-text="#{MstCommissionSet002.portfolioId}">组合代码</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="portfolioId" name="portfolioId"
                                        class="layui-input form-input input-select" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}"
                                        data-th-initvalue="${entity?.portfolioId}"
                                        data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?ww=false}" >
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                                   data-th-text="#{MstCommissionSet002.customerId}">券商代码</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="customerId" name="customerId"
                                        class="layui-input  input-select" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}"
                                        data-th-initvalue="${entity?.customerId}"
                                        data-th-data-url="@{/invest/basicdata/mstcommissionset/MstCommissionSet002/getMstCustomerInfo}"
                                        allowClear="true">
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                                   data-th-text="#{MstCommissionSet002.capitalAccountNo}">资金账号</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="capitalAccountNo" name="capitalAccountNo"
                                        class="layui-input  input-select" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}"
                                        data-th-initvalue="${entity?.capitalAccountNo}"
                                        parentIds="customerId"
                                        data-th-data-url="@{/invest/basicdata/mstcommissionset/MstCommissionSet002/getMstAcctInfo}"
                                        allowClear="true">
                                </select>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/basicdata/mstcommissionset/MstCommissionSet001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
