<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<html>
<html>
<head>
    <title data-th-text="#{FuturesDepositPercent001}"></title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="layui-col-xs12 layui-col-md12 layui-col-sm12 layui-col-lg12 form-button-area" style="margin:10px;">
            <a id="FuturesDepositPercent001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}" >新建</a>
            <a id="FuturesDepositPercent001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}" >删除</a>
        </div>
        <div class='joyin-form-wrap joyin-filter-form condition-area'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{FuturesDepositPercent001.futuresType}">期货类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="futuresType" name="futuresType"
                                    data-th-initValue='${entity?.futuresType}'
                                    class="layui-input form-input input-select"
                                    data-th-data-result='${FUTURES_TYPE}' allowClear="true"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    formatoption=true childrenIds="futuresContractId">
                            </select>
                        </div>
                    </div>

                    <div class="form-inline-wrap" >
                        <label class="layui-form-label form-lable"
                               data-th-text="#{FuturesDepositPercent001.futuresContractId}">合约标的</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="futuresContractId" name="futuresContractId"
                                    data-th-value="${entity?.futuresContractId}"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result='${FUTURES_CONTRACT}'
                                    class="layui-input form-input input-select"
                                    formatoption=false
                                    >
                            </select>
                        </div>
                    </div>
                    <div class="form-inline-wrap" >
                        <label class="layui-form-label form-lable"
                               data-th-text="#{FuturesDepositPercent001.futuresCompany}">期货公司</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="futuresCompany" name="futuresCompany"
                                    data-th-initValue='${entity?.futuresCompany}'
                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                    data-th-data-url="@{/invest/basicdata/mstsecuritiesaccount/MstSecuritiesAccount002/getFuturesCompany}"
                                    data-th-placeholder="#{SysCommon.placeholder}" >
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap" >
                        <label class="layui-form-label form-lable"
                               data-th-text="#{FuturesDepositPercent001.effDate}">生效日</label>
                        <div class="layui-input-inline input-inline">
                            <input id="effDate" name="effDate"
                                   class="layui-input form-input input-dateRangeSelect"
                                   placeholder="请选择时间区间"
                                   data-th-placeholder="#{SysCommon.placeholder}"/>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/basicdata/futuresdepositpercent/FuturesDepositPercent001.js}" type="text/javascript"></script>
</div>
</body>
</html>
