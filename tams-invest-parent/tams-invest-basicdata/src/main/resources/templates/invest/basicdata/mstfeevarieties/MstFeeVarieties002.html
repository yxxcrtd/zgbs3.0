<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{MstFeeVarieties002}">费用品种新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="pro-module-container">
            <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
                <div class="pro-module-wrapper pro-module-base">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">基本信息</span>
                                （
                                <span class="star-sign">*</span>
                                必填）
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div>
                                        <input type="text" id="feeId" name="feeId" required="required"
                                               class="layui-input form-input" placeholder="" maxlength="75"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.feeId}" style="display: none" />
                                        <input id="defalutApplyType" name="defalutApplyType" type="hidden"
                                               th:value="${defalutApplyType}">
                                        <!-- 关联范围 -->
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstFeeVarieties002.feeName}">费用名称</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="feeName" name="feeName" required="required"
                                                   class="layui-input form-input" placeholder="" maxlength="75"
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value="${entity?.feeName}" />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstFeeVarieties002.applyType}">关联范围</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="applyType" name="applyType" required="required"
                                                   class="layui-input form-input input-select" childrenIds="feeType"
                                                   data-th-data-result='${CORRELATION_RANGE}'
                                                   th:disabled="${not #strings.isEmpty(defalutApplyType)}"
                                                   data-th-initValue='${entity?.applyType} ?: ${defalutApplyType}' >
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstFeeVarieties002.feeType}">费用类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="feeType" name="feeType" formatoption="true"
                                                    required="required" class="layui-input form-input input-select"
                                                    placeholder="请输入内容" parentIds="applyType,defalutApplyType"
                                                    data-th-data-result='${FEE_SPECIES_TYPE}'
                                                    data-th-data-url="@{/invest/basicdata/mstfeevarieties/MstFeeVarieties002/getFeeType}"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue="${entity?.feeType}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstFeeVarieties002.orgType}">机构类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="orgType" name="orgType"
                                                   data-th-data-result='${SVR_FEE_TYPE}' required="required"
                                                   class="layui-input form-input input-select" placeholder="请输入内容"
                                                   formatoption="true" data-th-initValue="${entity?.orgType}"
                                                   maxlength="15" data-th-placeholder="#{SysCommon.placeholder}" />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstFeeVarieties002.orgType2}">机构二级类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="orgType2" name="orgType2" required="required"
                                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                                    formatoption="true" parentIds="orgType"
                                                    data-th-initValue="${entity?.orgType2}" maxlength="15"
                                                    data-th-data-url="@{/invest/basicdata/mstfeevarieties/MstFeeVarieties002/getOrgType2}"
                                                    data-th-placeholder="#{SysCommon.placeholder}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstFeeVarieties002.chargeType}">收费类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="chargeType" name="chargeType" required="required"
                                                   class="layui-input form-input input-checkbox"
                                                   data-th-data-result='${CHARGE_TYPE}'
                                                   th:disabled="${not #strings.isEmpty(defalutChargeType)}"
                                                   data-th-initValue='${entity?.chargeType} ?: ${defalutChargeType}'>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstFeeVarieties002.basicBill}">计费基数</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="basicBill" name="basicBill"
                                                   class="layui-input form-input input-checkbox"
                                                   data-th-data-result='${BILL_BASE_FEE_KIND}'
                                                   th:disabled="${not #strings.isEmpty(defalutBillBase)}"
                                                   data-th-initValue='${entity?.basicBill} ?: ${defalutBillBase}'>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstFeeVarieties002.basis}">计息基础</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="basis" name="basis"
                                                   class="layui-input form-input input-checkbox"
                                                   data-th-data-result='${BASIS}' data-th-initValue='${entity?.basis}'>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                            <div class="pro-module-wrap">
                                <div class="pro-module">
                                    <h3 class="pro-module-title">
                                        <span class="title-des">备注</span>
                                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                                    </h3>
                                    <div class="pro-module-item">
                                        <div class="layui-form-item">
                                            <div class="layui-input-inline input-inline" style="width: 98%!important;margin:0 10px;">
                                                <textarea id="remark" name="remark" placeholder="请输入内容"
                                                          data-th-placeholder="#{SysCommon.placeholder}" maxlength="300"
                                                          class="layui-textarea" data-th-text="${entity?.remark}"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                    <div class="row text-center" style="margin: 20px 0;">
                        <a id="MstFeeVarieties002_btn_save" class="layui-btn layui-btn-sm btn-save"
                           data-th-text="#{SysCommon.save}">保存</a>
                        <a id="MstFeeVarieties002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                           data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="MstFeeVarieties002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                           data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
                    </div>
            </form>
        </div>
    </div>
    <div layout:fragment="script">
        <script th:inline="javascript" type="text/javascript">
            var CHARGE_TYPE_01 = /*[[${CHARGE_TYPE_01}]]*/'';
            var finprodMarketId = /*[[${finprodMarketId}]]*/'';
            var feeList = /*[[${feeList}]]*/'';
            var profitType = /*[[${profitType}]]*/'';
            var defalutBillBase = /*[[${defalutBillBase}]]*/'';
            var IS_USE = /*[[${IS_USE}]]*/'N';
            var IS_USE_Y = /*[[${IS_USE_Y}]]*/'Y';
            var FEETYPE_04 = /*[[${FEETYPE_04}]]*/'';
            var ORGTYPE_01 = /*[[${ORGTYPE_01}]]*/'';
            var ORGTYPE_02 = /*[[${ORGTYPE_02}]]*/'';
            var FEENAME_04 = /*[[${FEENAME_04}]]*/'';
            var pageModelBak = /*[[${pageModelBak}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/basicdata/mstfeevarieties/MstFeeVarieties002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
