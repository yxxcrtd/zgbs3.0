<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{AssetDeclarationCodeMaintenance001}">资产代码申报维护</title>
</head>
<body>
	<div layout:fragment="content">
		<!-- 画面信息 -->
		<div class='layui-fluid' id="AssetDeclarationCodeMaintenance001_DIV">
			<div
				class="layui-col-xs12 layui-col-md12 layui-col-sm12 layui-col-lg12 form-button-area"
				style="margin: 10px;">
				    <a id="AssetDeclarationCodeMaintenance001_btn_add"
					class="layui-btn layui-btn-sm btn-create" style="display: none;"
					data-th-text="#{SysCommon.create}">新建</a> 
					<a id="AssetDeclarationCodeMaintenance001_btn_edit"
					class="layui-btn layui-btn-sm" style="display: none;"><i class="layui-icon">&#xe642;</i>修改</a> 
					<a id="AssetDeclarationCodeMaintenance001_btn_delete"
					class="layui-btn layui-btn-sm btn-delete"
					data-th-text="#{SysCommon.delete}">删除</a>
					<a id="AssetDeclarationCodeMaintenance001_btn_import"
					class="layui-btn layui-btn-sm btn-import"
					data-th-text="#{SysCommon.import}">导入</a>
			</div>
			<div class="joyin-form-wrap joyin-filter-form condition-area">
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" data-th-text="#{AssetDeclarationCodeMaintenance001.assetsType}">资产类型</label>
							<div class="layui-input-inline input-inline">
								<select id="assetsType" name="assetsType"
									class="layui-input form-input input-select" multiple
									data-th-data-result='${finprodTypeTG}' allowClear="true"
									placeholder="请输入内容" childrenIds="othCodeType,finprodId"
									data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" data-th-text="#{AssetDeclarationCodeMaintenance001.finprodId}">资产代码</label>
							<div class="layui-input-inline input-inline">
								<select id="finprodId" name="finprodId" parentIds="assetsType"
									class="layui-input form-input input-select"
									data-th-data-url='@{/invest/basicdata/assetdeclarationcodemaintenance/AssetDeclarationCodeMaintenance001/getFinprodIdList}' allowClear="true"
									placeholder="请输入内容"  multiple
									data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
					
					</div>
						<div class="layui-form-item">
							<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable">业务类型</label>
							<div class="layui-input-inline input-inline">
								<select id="othCodeType" name="othCodeType"
									class="layui-input form-input input-select" multiple
									data-th-data-url='@{/invest/basicdata/assetdeclarationcodemaintenance/AssetDeclarationCodeMaintenance001/getOthOtherType}' allowClear="true"
									placeholder="请输入内容" parentIds="assetsType"
									data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>

							<div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
								<label class="layui-form-label form-lable">申报日期</label>
								<div class="layui-input-inline input-inline">
									<input name="vdate" class="layui-input form-input input-dateRangeSelect" placeholder="请选择、支持区间" data-th-placeholder="#{SysCommon.dateInterval}">
								</div>
							</div>
						</div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script
			data-th-src="@{/js/invest/basicdata/assetdeclarationcodemaintenance/AssetDeclarationCodeMaintenance001.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
