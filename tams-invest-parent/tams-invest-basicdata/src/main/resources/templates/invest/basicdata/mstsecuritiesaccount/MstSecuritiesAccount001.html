<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<html>
<html>
<head>
<title data-th-text="#{MstSecuritiesAccount001}">证券账户管理</title>
</head>
<body>
	<div layout:fragment="content">
		<div class="layui-col-xs12 layui-col-md12 layui-col-sm12 layui-col-lg12 form-button-area" style="margin:10px;">
			<a id="MstSecuritiesAccount001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}" >新建</a>
			<a id="MstSecuritiesAccount001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}" style="display:none;">删除</a>
		</div>
		<div class='joyin-form-wrap joyin-filter-form condition-area'>
	   		<form class="layui-form" id="searchForm">
	        	<div class="layui-form-item">
	                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
		                <label class="layui-form-label form-lable" data-th-text="#{MstSecuritiesAccount001.secAcctId}">证券账户账号</label>
	                    <div class="layui-input-inline input-inline">										
		                	<input  type="text" id="secAcctId" name="secAcctId" class="layui-input form-input input-lenovoselect" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" 
		                       data-th-data-url="@{/invest/basicdata/mstsecuritiesaccount/MstSecuritiesAccount001/getSecAcctId}" 
		                      data-idfield="code" data-keyfield="name" data-th-data-effectivefieldsalias='|{"code":"#{MstSecuritiesAccount001.secAcctId}","shortName":"#{MstSecuritiesAccount001.secAcctName}"}|'>
		                </div>
		            </div>
	                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
	                    <label class="layui-form-label form-lable" data-th-text="#{MstSecuritiesAccount001.registOrg}">托管机构</label>
	                    <div class="layui-input-inline input-inline">
	                    	<input type="text" id="registOrg" name="registOrg" class="layui-input form-input input-select"  th:data-result='${REGIST_ORG}' allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" formatoption=true >
	                    </div>
	                </div>
	                <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{MstSecuritiesAccount001.portfolioId}">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" class="layui-input form-input input-lenovoselect" id="portfolioId"
                                name="portfolioId" data-th-placeholder="#{SysCommon.placeholder}" data-idfield="code"
                                data-keyfield="code"  
                                data-th-data-effectivefieldsalias='|{"code":"#{MstSecuritiesAccount001.portfolioId}",
                                    "shortName":"#{MstSecuritiesAccount001.secAcctId}"}|'
                                data-th-data-url="@{/invest/basicdata/mstsecuritiesaccount/MstSecuritiesAccount001/getPortfolioId}"
                                maxlength="60">
                            <!-- <select type="text" name="portfolioId" id="portfolioId"
	                            class="finprodIdList layui-input form-input input-select" allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
	                    		formatoption = true
	                    		required
	                    		data-th-data-url="@{/invest/entrust/etrbrowdepoinfo/EtrBrowDepoInfo002/getSelectPortfolioId}" 
	                    		data-th-initValue="${entity?.portfolioId}">
                    		</select> -->
                        </div>
                    </div>
	            </div>
	        </form>
		</div>
		<div>
			<table class="layui-table" id="dataTable"></table>
		</div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/basicdata/mstsecuritiesaccount/MstSecuritiesAccount001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
