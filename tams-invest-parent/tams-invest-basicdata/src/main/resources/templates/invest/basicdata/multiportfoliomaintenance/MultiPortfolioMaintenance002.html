<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{MultiPortfolioMaintenance002}">多组合维护明细</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid' style="padding-left:1px">
        <div class="layui-form-item" style="width:18%;float: left;border-right: 1px solid #ccc;min-height:460px;">
            <form class="layui-form  pro-module-form" style="background: #fff">
                <input type="hidden" name="treeId" id="treeId" data-th-value="${treeId}"/>
                <div class="layui-form-item" style="margin-left: 10px;padding-bottom:8px" >
                    <div class="layui-input-inline input-inline"
                         style="width: 95% !important">
                        <input type="text" id="treeName" name="treeName"
                               class="layui-input form-input input-fuzzy-text"
                               placeholder="输入名称关键字"
                               data-eventfunc="serachKey">
                    </div>
                </div>
<!--                <div th:if="${entity} == null" data-checkall="false" data-checkable="true" style="scroll-y: auto; scroll-x: hidden;height:50px" id='treeIndPortf'  data-canedit='0' data-roottitle='列表信息' >-->
<!--                </div>-->
                <div class="layui-form-item">
                    <div class="" id="treeIndPortfDiv"
                         style="margin-left: 10px; height: 300px">
                        <div class="layui-input"
                             style="border: 1px solid #dbdbdb; scroll-y: auto; scroll-x: hidden; height: 240px; overflow-y: scroll; margin-right: 50px;"
                             id="treeIndPortf"
                             data-checkall="false" data-checkable="true" data-roottitle=''>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item" style="margin-left: 10px;padding-bottom:8px" >
                    <div class="layui-input-inline input-inline"
                         style="width: 95% !important">
                        <input type="text" id="effDate" name="effDate"
                               class="layui-input form-input input-dateSelect"
                               data-th-value='${#dates.format(iPlatformDate,"yyyy-MM-dd")}'
                               placeholder="选择生效日">
                    </div>
                </div>
                <div class="layui-form-item" style="margin-left: 180px;padding-bottom:8px" >
                    <div class="layui-input-inline input-inline"
                         style="width: 95% !important">
                        <a th:id="MultiPortfolioMaintenance002_btn_confirm" class="layui-btn layui-btn-sm">确认</a>
                    </div>
                </div>
            </form>
        </div>
        <div class="layui-col-lg9" style="width:81%">
            <div class="layui-col-md12" style="margin: 10px;" filter="false">
                <a id="MultiPortfolioMaintenance002_btn_delete"  class="layui-btn layui-btn-sm btn-delete"
                   data-th-text="#{SysCommon.delete}">删除</a>
                <a id="MultiPortfolioMaintenance002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                   data-th-text="#{SysCommon.cancel}">取消</a>
                <a id="MultiPortfolioMaintenance002_btn_commit"  class="layui-btn layui-btn-sm btn-create"
                   data-th-text="#{SysCommon.submit}">提交</a>

            </div>
            <div style="height: 500px">
                <table class="layui-table" id="dataIndTable"></table>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <style type="text/css">
        .mixtree-div i.icon-showorder{
            display: none;
        }
        .mixtree-div a.portBagAddAicon,a.refreshAicon{
            float: right;
            padding-right: 10px;
            color:#90C321;
            height:30px;
            line-height:28px;
            cursor: pointer;
        }
        .layui-form-radio {
            line-height: 14px !important
        }
        .layui-form-radio>i {
            font-size: 16px !important
        }
        .manage-info-item li {
            float: left;
            padding-right: 15px;
            line-height: 24px;
        }
        .manage-info-item {
            float: left;
            padding-right: 10px;
        }
        .layui-fluid{
            padding-left:0px;
            padding-right:0px;
        }
        div.input-btn-append a {
            line-height: 20px !important
        }
        a.portBagAicon{
            display:inline-block!important;
            height:20px!important;
            line-height: 20px!important;
            width:92%;
            margin-left:10px!important;
        }
        li.portBagLi:hover,li.active,li.active:hover{
            background: #D9ECFF
        }
        li.portBagLi:hover{
            background: #FFFFCA
        }
        li.portBagLi i{
            font-size:15px;
        }
        li.portBagLi i:hover{
            background: #B7DBFA
        }
        .width30{
            width:30%;
        }
    </style>
    <script data-th-inline="javascript" type="text/javascript">
        var getAllRelationUrl = /*[[@{/invest/basicdata/multiportfoliomaintenance/MultiPortfolioMaintenance002/getMutiptlPortfolioAcctnoTree}]]*/'';
        var iPlatformDate = /*[[${iPlatformDate}]]*/'';//平台日期
    </script>
    <script data-th-src="@{/js/invest/basicdata/multiportfoliomaintenance/MultiPortfolioMaintenance002.js}"></script>
</div>
</body>
</html>
