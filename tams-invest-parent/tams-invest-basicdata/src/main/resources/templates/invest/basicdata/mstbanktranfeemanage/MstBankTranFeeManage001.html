<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{MstBankTranFeeManage001}">银行间交易费用设置</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				<a id="MstBankTranFeeManage001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}" >新建</a>
				<a id="MstBankTranFeeManage001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}" style="display:none;">删除</a>
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{MstBankTranFeeManage001.feeType}">费用类型</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="feeType" name="feeType"
									formatoption="true" class="layui-input form-input input-select"
									placeholder="请输入内容" data-th-data-result='${FEE_TYPE}'
									data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
						<div
							class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								data-th-text="#{MstBankTranFeeManage001.registOrg}">登记托管机构</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="registOrg" name="registOrg"
									formatoption="true" class="layui-input form-input input-select"
									placeholder="请输入内容" data-th-data-result='${REGIST_ORG_INV}'
									data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
					</div>
				</form>
			</div>

			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script
			data-th-src="@{/js/invest/basicdata/mstbanktranfeemanage/MstBankTranFeeManage001.js}"></script>
	</div>
</body>
</html>
