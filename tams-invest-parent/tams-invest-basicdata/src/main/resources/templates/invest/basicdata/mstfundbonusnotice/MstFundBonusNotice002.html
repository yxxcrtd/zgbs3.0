<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{MstFundBonusNotice002}">基金分红公告新建</title>
    <style>
        .mst-lable{
            width: 20%;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div>
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstFundBonusNotice001.fundId}">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="fundId" name="fundId"
                                                data-th-allowClear="true"required="required"
                                                class="layui-input form-input input-lenovoselect"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-url="@{/invest/asset/fund/FinFundTarget001/getFinprodMarketIdList}"
                                                data-idfield="code" data-keyfield="code"
                                                data-th-data-effectivefieldsalias='|{"code":"#{FinFundTarget001.finprodMarketId}",
									"shortName":"#{FinFundTarget001.finprodName}"}|'
                                        data-th-value="${entity?.fundId}">
                                    </div>
                                </div>

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstFundBonusNotice001.delDate}">除权除息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="delDate" name="delDate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${#dates.format(entity?.delDate,'yyyy-MM-dd')}">
                                    </div>
                                </div>


                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstFundBonusNotice001.regDate}">权益登记日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="regDate" name="regDate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" required="required"
                                               data-th-value="${#dates.format(entity?.regDate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstFundBonusNotice001.devidentDate}">派息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="devidentDate" name="devidentDate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${#dates.format(entity?.devidentDate,'yyyy-MM-dd')}">
                                    </div>
                                </div>

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstFundBonusNotice001.unitBonusUnitValue}">单位分红净值</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="unitBonusUnitValue" name="unitBonusUnitValue" placeholder="请输入内容"
                                               data-pattern=""
                                               class="layui-input form-input text-number"
                                               data-th-value="${entity?.unitBonusUnitValue}" maxlength="16"/>
                                    </div>
                                </div>

                            </div>
                        </div>
                </div>
                <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                    <div class="text-center">
                        <a id="MstFundBonusNotice002_btn_save" class="layui-btn layui-btn-sm btn-save"
                           data-th-text="#{SysCommon.save}">保存</a>
                        <a id="MstFundBonusNotice002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                           data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="MstFundBonusNotice002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                           data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </div>
    </div>
    </form>
</div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/basicdata/mstfundbonusnotice/MstFundBonusNotice002.js}"></script>
</div>
</body>
</html>
