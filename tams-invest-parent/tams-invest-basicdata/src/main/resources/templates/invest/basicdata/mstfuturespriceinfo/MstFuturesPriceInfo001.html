<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{MstFuturesPriceInfo001}">期货行情信息</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a id="MstFuturesPriceInfo001_btn_add" class="layui-btn layui-btn-sm btn-create">新建</a>
        <a id="MstFuturesPriceInfo001_btn_reset" class="layui-btn layui-btn-sm btn-reset" data-th-text="#{SysCommon.reset}">重置</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form"  id="submitForm">
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{MstFuturesPriceInfo001.futuresId}">合约代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="futuresId" name="futuresId"
                                class="layui-input form-input input-select" th:allowClear="true"
                                th:placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                th:formatoption="false"
                                data-th-data-url="@{/invest/basicdata/mstfuturespriceinfo/MstFuturesPriceInfo001/getContractId}"
                        >
                        </select>
                    </div>
                </div>

                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{MstFuturesPriceInfo001.windCode}">Wind代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="windCode" name="windCode"
                                class="layui-input form-input input-select" th:allowClear="true"
                                th:placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                th:formatoption="false"
                                data-th-data-url="@{/invest/basicdata/mstfuturespriceinfo/MstFuturesPriceInfo001/getWindCode}"
                        >
                        </select>
                    </div>
                </div>

                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{MstFuturesPriceInfo001.tradeDate}">行情日期</label>
                    <div class="layui-input-inline input-inline">
                        <input id="tradeDate" name="tradeDate"
                               class="layui-input form-input input-dateRangeSelect"
                               placeholder="请选择时间区间"/>
                    </div>
                </div>



            </div>

        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/basicdata/mstfuturespriceinfo/MstFuturesPriceInfo001.js}" type="text/javascript"></script>
</div>
</body>

</html>
