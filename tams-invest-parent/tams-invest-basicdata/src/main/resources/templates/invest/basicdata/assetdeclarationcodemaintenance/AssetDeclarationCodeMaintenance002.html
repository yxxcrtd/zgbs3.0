<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{AssetDeclarationCodeMaintenance002}">资产申报代码维护新建</title>
<style type="text/css">
.form-inline-wrap{
width:45%
}
</style>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form" id="assetDeclarationCodeForm">
                <div class="pro-module-wrapper pro-module-base">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title"> <span class="title-des">基本信息</span> （<span class="star-sign">*</span>必填）
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <input id="branch" name="branch" data-th-value="${entity?.branch}" type="hidden">
							<input id="workflowId" name="workflowId" data-th-value="${workflowId}" type="hidden">
                            <input id="finprodId" name="finprodId" data-th-value="${entity?.finprodId}" type="hidden">
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable">资产名称</label>
                                        <div class="layui-input-inline input-inline">
                                            <input id="finprodName" name="finprodName" formatoption="false"
                                                   class="layui-input form-input" maxlength="32"
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value='${entity?.finprodName}' required>
                                        </div>
                                    </div>

                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable">资产代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <input id="finprodMarketId" name="finprodMarketId" formatoption="false"
                                                   class="layui-input form-input" maxlength="32"
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value='${entity?.finprodMarketId}' required>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" >业务类型</label>
                                        <div class="layui-input-inline input-inline">
                                                 <select th:id="othCodeType" name="othCodeType" formatoption="true"
														class="layui-input form-input input-select" parentIds="finprodId"
														data-th-placeholder="#{SysCommon.placeholder}"
														data-th-initValue='${entity?.othCodeType}' required
														data-th-data-url="@{/invest/basicdata/assetdeclarationcodemaintenance/AssetDeclarationCodeMaintenance002/selectOthCodeType}">
													</select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{AssetDeclarationCodeMaintenance001.othCode}">申报代码</label>
                                        <div class="layui-input-inline input-inline">
                                             <input id="othCode" name="othCode" formatoption="false"
													multiple="true"	class="layui-input form-input" maxlength="32"
														data-th-placeholder="#{SysCommon.placeholder}"
														data-th-value='${entity?.othCode}' required>
											 </input>
                                        </div>
                                    </div>
                                </div>

                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable">申报开始日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input id="vdateStart" name="vdateStart" formatoption="false"
                                                   class="layui-input form-input" maxlength="32"
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value='${entity?.vdateStart}' required>
                                        </div>
                                    </div>

                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable">申报终止日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input id="vdateEnd" name="vdateEnd" formatoption="false"
                                                   class="layui-input form-input" maxlength="32"
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value='${entity?.vdateEnd}' required>
                                        </div>
                                    </div>
                                </div>

                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable">申报价格</label>
                                        <div class="layui-input-inline input-inline">
                                            <input id="assetsPrice" name="assetsPrice" formatoption="false"
                                                   class="layui-input form-input" maxlength="32"
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value='${entity?.assetsPrice}' required>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </form>
	        <div class="layui-form-item">
                <div align="center" style="height:50px;padding-top: 10px;">
                    <a id="AssetDeclarationCodeMaintenance002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                    <a id="AssetDeclarationCodeMaintenance002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script th:inline="javascript" type="text/javascript">
            var FEE_TYPE_B02 = /*[[${FEE_TYPE_B02}]]*/'';
            var FEE_TYPE_B05 = /*[[${FEE_TYPE_B05}]]*/'';
            var PINAN_ASSET_TYPE_F01 = /*[[${PINAN_ASSET_TYPE_F01}]]*/'';
            var PINAN_ASSET_TYPE_F11 = /*[[${PINAN_ASSET_TYPE_F11}]]*/'';
            // 场内基金改造 add by renping 20191117 start
            var PINAN_ASSET_TYPE_F02 = /*[[${PINAN_ASSET_TYPE_F02}]]*/'';
            // 场内基金改造 add by renping 20191117 end
            var CHARGE_KIND_1= /*[[${CHARGE_KIND_1}]]*/'';
            var CHARGE_BASIS_02= /*[[${CHARGE_BASIS_02}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/basicdata/assetdeclarationcodemaintenance/AssetDeclarationCodeMaintenance002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
