<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<html>
<html>
<head>
<title data-th-text="#{MstSaleDepartment001}">柜台信息管理</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-xs12 layui-col-md12 layui-col-sm12 layui-col-lg12 form-button-area" style="margin:10px;">
				<a id="MstSaleDepartment001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}" >新建</a>
		        <a id="MstSaleDepartment001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}">删除</a>
	   		</div>
	   		<div class='joyin-form-wrap joyin-filter-form condition-area'>
		   		<form class="layui-form" id="searchForm">
		        	<div class="layui-form-item">
			            <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
		                    <label class="layui-form-label form-lable" data-th-text="#{MstSaleDepartment001.brokerId}">所属经纪商</label>
		                    <div class="layui-input-inline input-inline">
		                    	<select id="brokerId" name="brokerId" class="layui-input form-input input-select" allowClear="true" multiple="true"
									data-th-data-result="${brokerIds}" searchable="false" data-th-placeholder="#{SysCommon.placeholder}">
								</select>
		                    </div>
		                </div>
		                  <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
		                    <label class="layui-form-label form-lable" data-th-text="#{MstSaleDepartment001.interType}">柜台接口类型</label>
		                    <div class="layui-input-inline input-inline">
		                    	<select id="interType" name="interType" class="layui-input form-input input-select" allowClear="true" multiple="true"
									data-th-data-result="${COUNTER_INTER_TYPE}" searchable="false" data-th-placeholder="#{SysCommon.placeholder}">
								</select>
		                    </div>
		                </div>
		                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
			                <label class="layui-form-label form-lable" data-th-text="#{MstSaleDepartment001.saledepname}">柜台名称</label>
		                    <div class="layui-input-inline input-inline">
			                	<input type="text" id="saledepname" name="saledepname" class="layui-input form-input input-lenovoselect" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" 
			                       data-th-data-url="@{/invest/basicdata/mstsaledepartment/MstSaleDepartment001/getMstSaleDepartmentName}" multiple="true"
			                      data-idfield="code" data-keyfield="name" data-th-data-effectivefieldsalias='|{"code":"#{MstSaleDepartment001.saledepname}","shortName":"#{MstSaleDepartment001.saledepid}"}|'>
			                </div>
			            </div>
		            </div>
		        </form>
	   		</div>
	        <div>
	            <table class="layui-table" id="dataTable"></table>
	        </div>
		</div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/basicdata/mstsaledepartment/MstSaleDepartment001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
