<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
<title data-th-text="#{MstNaturalPerson001}">自然人信息管理</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area">
            <a id="MstNaturalPerson001_btn_add" class="layui-btn layui-btn-sm btn-create">新建</a>
            <a id="MstNaturalPerson001_btn_delete" class="layui-btn layui-btn-sm btn-delete" style="display: none">删除</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{MstNaturalPerson001.customerName}">姓名</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" class="layui-input form-input input-lenovoselect" id="customerName"
                                name="customerName" data-th-placeholder="#{SysCommon.placeholder}" data-idfield="code"
                                data-keyfield="name"
                                data-th-data-effectivefieldsalias='|{"code":"#{MstNaturalPerson001.customerName}",
                                    "shortName":"#{MstNaturalPerson001.customerId}"}|'
                                data-th-data-url="@{/invest/basicdata/mstnaturalperson/MstNaturalPerson001/getcName}"
                                maxlength="60">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{MstNaturalPerson001.personId}">身份证号码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" class="layui-input form-input input-lenovoselect" id="personId"
                                name="personId" data-th-placeholder="#{SysCommon.placeholder}" data-idfield="code"
                                data-keyfield="name"
                                data-th-data-effectivefieldsalias='|{"code":"#{MstNaturalPerson001.personId}",
                                    "shortName":"#{MstNaturalPerson001.customerId}"}|'
                                data-th-data-url="@{/invest/basicdata/mstnaturalperson/MstNaturalPerson001/getcID}"
                                maxlength="32">
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script th:inline="javascript" type="text/javascript">
            var man = /*[[${man}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/basicdata/mstnaturalperson/MstNaturalPerson001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
