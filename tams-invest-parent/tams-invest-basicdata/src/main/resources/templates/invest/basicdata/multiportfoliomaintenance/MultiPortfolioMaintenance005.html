<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{MultiPortfolioMaintenance005}">编辑</title>
</head>
<body>
<div layout:fragment="content">
  <form class="layui-form joyin-form-wrap" id="submitForm">
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md10">
        <label class="layui-form-label form-lable">父级ID</label>
        <div class="layui-input-inline input-inline">
          <input  type="hidden" id="treeId" name="treeId"/>
          <input type="text" id="PId" name="PId" disabled="true" data-th-value="${pId}" class="layui-input form-input" multiple="multiple">
        </div>
      </div> 
      </div>
      <div class="layui-form-item">
      <div class="layui-inline layui-col-md10">
        <label class="layui-form-label form-lable">名称</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="treeName" name="treeName" class="layui-input form-input" required>
        </div>
      </div>
    </div>
    <div class="layui-col-md11" style="margin:50px;">
      <div class="text-center"> <a id="MultiPortfolioMaintenance005_btn_save" class="layui-btn layui-btn-sm btn-save">保存</a>
      <a id="MultiPortfolioMaintenance005_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a> </div>
    </div>
  </form>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        	var treeName = /*[[${treeName}]]*/'';
            $("#treeName").val(treeName);
            var treeId = /*[[${treeId}]]*/'';
            $("#treeId").val(treeId);
    </script>
  <script data-th-src="@{/js/invest/basicdata/multiportfoliomaintenance/MultiPortfolioMaintenance005.js}"></script>
</div>
</body>
</html>
