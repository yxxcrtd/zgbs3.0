<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ParamMaintenance001}">OPICS参数维护</title>
<style>
	.param-form-wrap{
		height:80px;
	}
</style>
</head>
<body>
    <div layout:fragment="content">
        <div class='layui-fluid'>
            <div class="layui-col-md12 layui-col-sm12 layui-col-lg12 form-button-area" style="margin: 10px;">
                <a id="ParamMaintenance001_btn_add" class="layui-btn layui-btn-sm btn-create"
                    data-th-text="#{SysCommon.create}">新建</a>
                <a id="ParamMaintenance001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
                    data-th-text="#{SysCommon.delete}" style="display: none;">删除</a>
            </div>
            <div class='joyin-form-wrap joyin-filter-form condition-area'>
            <form class="layui-form param-form-wrap" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4	layui-col-sm4	layui-col-md4	layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{ParamMaintenance001.parameterType}">参数类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="parameterType" name="parameterType"
                                class="layui-input form-input input-select"
                                data-th-data-result='${COMMON_BUSINESS_TYPE}' allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                                <option></option>
                                <option>计息规则</option>
                                <option>BRANCK</option>
                                <option>BROK</option>
                                <option>OOST</option>
                                <option>DEALTYPE</option>
                                <option>PORT</option>
                                <option>业务类型</option>
                            </select>
                        </div>   
                    </div>                                                
                </div>
                <div class='layui-form-item'></div>
            </form>
            </div>
           
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/basicdata/parammaintenance/ParamMaintenance001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
