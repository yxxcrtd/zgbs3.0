<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{MstBondFirstMarketCalendar001}">一级市场新债日历</title>
</head>
<body>
    <div layout:fragment="content">
        <!-- 画面信息 -->
        <div class="form-button-area">
            <a id="MstBondQuotationInfo001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}"style="display: none">新建</a>
            <a id="MstBondQuotationInfo001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}" style="display: none">删除</a>
            <a id="MstBondFirstMarketCalendar001_btn_reset" class="layui-btn layui-btn-sm btn-reset" data-th-text="#{SysCommon.reset}">重置</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
          <div class="layui-form-item">
          <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4" style = "display:none" >
							<label class="layui-form-label form-lable"
								data-th-text="#{MstBondFirstMarketCalendar001.type6}">一级分类</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="type6" name="type6"
									class="layui-input form-input input-select"
									allowClear="true" multiple="true" placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									formatoption="true">
								</select>
							</div>
						</div>
          <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{MstBondFirstMarketCalendar001.bidDate}">投标日</label>
							<div class="layui-input-inline input-inline">
								<input id="bidDate" name="bidDate"
									   class="layui-input form-input input-dateRangeSelect"
									   placeholder="请选择时间区间" required="required"
									   data-th-placeholder="#{SysCommon.placeholder}"
									   	data-th-value="|${sysDate} - ${sysDate}|" />   
							</div>
						</div>
        </div>
        
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>    
    </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/basicdata/mstbondfirstmarketcalendar/MstBondFirstMarketCalendar001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
