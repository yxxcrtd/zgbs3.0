<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title data-th-text="#{DayEndAccount001.title}">日终清算数据核对</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form" id="searchForm">
        <input type="hidden" id="seqNo" name="seqNo" th:value="${entity?.seqNo}" />
        <input type="hidden" id="workflowId" name="workflowId" th:value="${entity?.workflowId}" />
        <div class="pro-module-wrapper pro-module-base">
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="title-des" data-th-text="#{DayEndAccount001.dzylb}">对账一览表</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item">
                        <table class="layui-table" id="dataTable" name="dataTable"></table>
                    </div>
                </div>
            </div>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="title-des" data-th-text="#{DayEndAccount001.cnqssj}">场内清算数据</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item">
                        <table class="layui-table" id="dataDetailTable" name="dataDetailTable"></table>
                    </div>
                </div>
            </div>
        </div>
    </form>
    <!--  按钮 -->
    <div class="row text-center" style="margin: 20px 0;">
        <div class="text-center">
            <a id="DayEndAccount002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
               data-th-text="#{SysCommon.submit}">提交</a>
            <a id="DayEndAccount002_cancel" class="layui-btn layui-btn-sm btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var entity = /*[[${entity}]]*/'';
        var stlModifyCommission = /*[[${stlModifyCommission}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/basicdata/dayendaccount/DayEndAccount002.js}" type="text/javascript"></script>
</div>
</body>
</html>
