<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{MstCustomerNature001}">客户性质信息</title>
</head>
<body>
    <div layout:fragment="content">
        <div class='layui-fluid'>
            <div class="layui-col-md12 layui-col-sm12 layui-col-lg12 layui-col-xs12 form-button-area" style="margin: 10px;">            
            <a id="MstCustomerNature001_btn_configuration"
					class="layui-btn layui-btn-sm"><i class="iconfont icon-ruleconfig"></i><span data-th-text="#{MstCustomerNature001.customerNatureConfiguration}">客户性质配置</span></a>
			<a id="MstCustomerNature001_btn_modification"
					class="layui-btn layui-btn-sm"><i class="iconfont icon-customer-info"></i><span data-th-text="#{MstCustomerNature001.customerInformationModification}">客户信息修改</span></a>
            </div>
            <div class='joyin-form-wrap joyin-filter-form condition-area'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{MstCustomerNature001.customerName}">客户名称</label>
                        <div class="layui-input-inline input-inline">          
                             <input type="text" id="customerName" name="customerName" maxlength="100"
									class="layui-input form-input input-lenovoselect"
									data-th-data-url="@{/invest/basicdata/mstcustomernature/MstCustomerNature001/getCustomerName}"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-idfield="shortName" data-keyfield="shortName" 
									data-th-data-effectivefieldsalias='|{"code":"#{MstCustomerNature001.customerId}",
									"shortName":"#{MstCustomerNature001.customerName}"}|'>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{MstCustomerNature001.customerType}">客户类型</label>
                        <div class="layui-input-inline input-inline">
                            <select formatoption = "true" type="text" id="customerType" name="customerType" maxlength="50"
                                class="layui-input form-input input-select"
                                data-th-data-result='${CUSTOMER_TYPE}' allowClear="true" multiple="true"  placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>
                     <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{MstCustomerNature001.customerCharater}">客户性质</label>
                        <div class="layui-input-inline input-inline">
                            <select formatoption = "true" type="text" id="customerCharater" name="customerCharater" maxlength="50"
                                class="layui-input form-input input-select"
                                data-th-data-result='${CUSTOMER_NATURE}' allowClear="true" multiple="true"  placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>
                </div>
            </form>
            </div>
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/basicdata/mstcustomernature/MstCustomerNature001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
