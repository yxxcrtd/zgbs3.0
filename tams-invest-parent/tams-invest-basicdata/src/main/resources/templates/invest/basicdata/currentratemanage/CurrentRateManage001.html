<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{CurrentRateManage001}">账户活期利率管理</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area">
            <a id="CurrentRateManage001_btn_add" class="layui-btn layui-btn-sm btn-create">新建</a>
            <a id="CurrentRateManage001_btn_delete" class="layui-btn layui-btn-sm btn-delete" style="display: none">删除</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline  layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{CurrentRateManage001.accountName}">账户名称</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="accountName" name="accountName"
                                class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容">
                        </div>
                    </div>
                    <div class="layui-inline  layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{CurrentRateManage001.effectDate}">生效日</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="effectDate" name="effectDate"
                                class="layui-input form-input input-dateRangeSelect" placeholder="请输入内容">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{CurrentRateManage001.status}">有效状态</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="status" name="status" class="layui-input form-input input-select"
                                allowClear="true" placeholder="请输入内容">
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/basicdata/currentratemanage/CurrentRateManage001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
