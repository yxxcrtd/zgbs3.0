<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<html>
<html>
<head>
<title data-th-text="#{MstSeatInfo001}">席位信息管理</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-xs12 layui-col-md12 layui-col-sm12 layui-col-lg12 form-button-area" style="margin:10px;">
				<a id="MstSeatInfo001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}" >新建</a>
		        <a id="MstSeatInfo001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}">删除</a>
	   		</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" data-th-text="#{MstSeatInfo001.seatId}">席位号</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="seatId" name="seatId" class="layui-input form-input input-lenovoselect"
									placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-url="@{/invest/basicdata/mstseatinfo/MstSeatInfo001/fuzzySearchSeatId}" multiple="true"
			                        data-idfield="code" data-keyfield="name" data-th-data-effectivefieldsalias='|{"code":"#{MstSeatInfo002.customerName}","shortName":"#{MstSeatInfo001.seatId}"}|'>
							</div>
						</div>
					 	<div class="layui-inline layui-col-md-offset8" style="float:right">
                         <button class="layui-btn layui-btn-sm btn-reset btn-default" id="MstSeatInfo001_btn_reset"><i class="iconfont icon-reset"></i>&nbsp;&nbsp;重置</button>
				  </div>
					</div>
				</form>
			</div>
			<div>
	            <table class="layui-table" id="dataTable"></table>
	        </div>
		</div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/basicdata/mstseatinfo/MstSeatInfo001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
