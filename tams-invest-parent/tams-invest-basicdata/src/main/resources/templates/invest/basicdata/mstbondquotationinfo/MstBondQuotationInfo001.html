<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{MstBondQuotationInfo001}">债券行情信息</title>
</head>
<body>
    <div layout:fragment="content">
        <!-- 画面信息 -->
        <div class="form-button-area">
            <a id="MstBondQuotationInfo001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
            <a id="MstBondQuotationInfo001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}" style="display: none">删除</a>
            <a id="MstBondQuotationInfo001_btn_import" class="layui-btn layui-btn-sm btn-import btn-default">导入</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
					<div
						class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							data-th-text="#{MstBondQuotationInfo001.secId}">资产代码</label>
						<div class="layui-input-inline input-inline">
							<input id="secId" name="secId" data-th-data-result='${SECID}'
								class="layui-input form-input input-lenovoselect" allowClear="true"
								placeholder="请输入内容"
								data-th-data-url="@{/invest/basicdata/mstbondquotationinfo/MstBondQuotationInfo001/getSecId}"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-idfield="code" data-keyfield="code" maxlength="32"
								data-th-data-effectivefieldsalias='|{"code":"#{MstBondQuotationInfo001.secId}","shortName":"#{MstBondQuotationInfo001.finprodAbbr}"}|' />
						</div>
					</div>
					<div
						class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							data-th-text="#{MstBondQuotationInfo001.finprodAbbr}">债券简称</label>
						<div class="layui-input-inline input-inline">
							<input id="finprodAbbr" name="finprodAbbr"
								class="layui-input form-input input-lenovoselect"
								allowClear="true" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}" maxlength="66"
								data-th-data-url="@{/invest/basicdata/mstbondquotationinfo/MstBondQuotationInfo001/getFinProdAbbr}"
								data-idfield="shortName" data-keyfield="shortName"
								data-th-data-effectivefieldsalias='|{"code":"#{MstBondQuotationInfo001.secId}","shortName":"#{MstBondQuotationInfo001.finprodAbbr}"}|' />

						</div>
					</div>
					<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							data-th-text="#{MstBondQuotationInfo002.valueSource}">估值来源</label>
						<div class="layui-input-inline input-inline">
						<select type="text" id="valueSource" name="valueSource" data-th-data-result='${VALUATION_SOURCE}'
							class="layui-input form-input input-select" allowClear="true"
							placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}"></select>
						</div>
					</div>
                </div>
                <div class="layui-form-item">
					<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{MstBondQuotationInfo001.valueDate}">估值日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="valueDate" name="valueDate"
                                class="layui-input form-input input-dateSelect" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/basicdata/mstbondquotationinfo/MstBondQuotationInfo001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
