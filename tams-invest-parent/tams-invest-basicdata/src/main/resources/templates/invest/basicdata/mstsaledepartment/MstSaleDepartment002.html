<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<html>
<head>
<title data-th-text="#{MstSaleDepartment002}">柜台信息新建</title>
</head>
<body>
	<div layout:fragment="content">
		<div>
			<form class="layui-form joyin-form-wrap pro-module-form"
				id="mstSaleDepartmentForm">
				<div class="pro-module-wrapper pro-module-base">
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title">
								<span class="title-des">柜台信息</span>（<span class="star-sign">*</span>必填）
								<i class="iconfont icon-arrow-down pro-down-icon"></i>
							</h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{MstSaleDepartment001.saledepid}">柜台代码</label>
										<div class="layui-input-inline input-inline">
											<input type="text" maxlength="32" id="saledepid"
												name="saledepid" class="layui-input form-input"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required
												data-th-value="${entity?.saledepid}">
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{MstSaleDepartment001.saledepname}">柜台名称</label>
										<div class="layui-input-inline input-inline">
											<input type="text" maxlength="50" id="saledepname"
												name="saledepname" class="layui-input form-input"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required
												data-th-value="${entity?.saledepname}">
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{MstSaleDepartment001.brokerId}">所属经纪商</label>
										<div class="layui-input-inline input-inline">
											<select type='text' id="brokerid" name="brokerid"
												class="layui-input form-input input-select"
												allowClear="true" placeholder="请输入内容"
												th:placeholder="#{SysCommon.placeholder}" required
												data-th-data-url="@{/invest/basicdata/mstsaledepartment/MstSaleDepartment002/getMstCustomerInfo}"
												th:initValue="${entity?.brokerid}" formatoption=true>
											</select>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap" id="shseatno_warp">
										<label class="layui-form-label form-label-wrap" data-th-text="#{MstSaleDepartment002.shseatno}">上交所席位号</label>
										<div class="layui-input-inline input-inline">
										     <select type="text" id="shseatno" name="shseatno" required="required"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" parentIds="brokerid"
                                                allowClear="true" formatoption="true" th:initValue="${entity?.shseatno}"
                                                data-th-data-url="@{/invest/basicdata/mstsaledepartment/MstSaleDepartment002/getSeatInfoByCustomer?tradeMarket=03}">
                                            </select>
										</div>
									</div>
									<div class="form-inline-wrap" id="szseatno_warp">
										<label class="layui-form-label form-label-wrap"
											style="line-height: normal;" data-th-text="#{MstSaleDepartment002.szseatno}">深交所席位号</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="szseatno" name="szseatno" required="required"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" parentIds="brokerid"
                                                allowClear="true" formatoption="true" th:initValue="${entity?.szseatno}"
                                                data-th-data-url="@{/invest/basicdata/mstsaledepartment/MstSaleDepartment002/getSeatInfoByCustomer?tradeMarket=04}">
                                            </select>
										</div>
									</div>
									<div class="form-inline-wrap" style="display:none " id="zjseatno_warp">
										<label class="layui-form-label form-label-wrap" data-th-text="#{MstSaleDepartment002.zjseatno}">中金所席位号</label>
										<div class="layui-input-inline input-inline">
										     <select type="text" id="zjseatno" name="zjseatno" required="required"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" parentIds="brokerid"
                                                allowClear="true" formatoption="true" th:initValue="${entity?.zjseatno}"
                                                data-th-data-url="@{/invest/basicdata/mstsaledepartment/MstSaleDepartment002/getSeatInfoByCustomer?tradeMarket=12}">
                                            </select>
										</div>
									</div>
									<!-- <div class="form-inline-wrap" style="display:none "id="sqseatno_warp">
										<label class="layui-form-label form-label-wrap"
											style="line-height: normal;" data-th-text="#{MstSaleDepartment002.sqseatno}">上期所席位号</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="sqseatno" name="sqseatno" required="required"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" parentIds="brokerid"
                                                allowClear="true" formatoption="true" th:initValue="${entity?.sqseatno}"
                                                data-th-data-url="@{/invest/basicdata/mstsaledepartment/MstSaleDepartment002/getSeatInfoByCustomer?tradeMarket=13}">
                                            </select>
										</div>
									</div> -->
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{MstSaleDepartment001.ipaddr}">IP地址</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="ipaddr" name="ipaddr" maxlength="50" required
												class="layui-input form-input" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-value="${entity?.ipaddr}">
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{MstSaleDepartment001.portnum}">端口</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="portnum" name="portnum" maxlength="50"
												class="layui-input form-input" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required
												data-th-value="${entity?.portnum}">
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											style="line-height: normal;" data-th-text="#{MstSaleDepartment001.contactaddr}">联系地址</label>
										<div class="layui-input-inline input-inline">
											<input type="text" maxlength="500" id="contactaddr"
												name="contactaddr" class="layui-input form-input"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required
												data-th-value="${entity?.contactaddr}">
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{MstSaleDepartment001.contacttel}">联系电话</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="contacttel" name="contacttel" required
												maxlength="11" class="layui-input form-input" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-value="${entity?.contacttel}">
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{MstSaleDepartment001.faxno}">传真号码</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="faxno" name="faxno" maxlength="50"
												class="layui-input form-input" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-value="${entity?.faxno}">
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{MstSaleDepartment001.ipaddr2}">备用IP地址</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="ipaddr2" name="ipaddr2" maxlength="50"
												class="layui-input form-input" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-value="${entity?.ipaddr2}">
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{MstSaleDepartment001.portnum2}">备用端口</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="portnum2" name="portnum2" maxlength="50"
												class="layui-input form-input" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-value="${entity?.portnum2}">
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{MstSaleDepartment001.declareunitName}">申报单位</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="declareunit" name="declareunit"
												class="layui-input form-input input-select"
												allowClear="true" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required
												data-th-initValue="*{entity?.declareunit}"
												data-th-data-result='${DECLARE_UNIT}' formatoption=true>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{MstSaleDepartment001.isnetreturnName}">净价回报</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="isnetreturn" name="isnetreturn" required
												class="layui-input form-input input-select"
												allowClear="true" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue="*{entity?.isnetreturn}"
												data-th-data-result='${YES_NO}' formatoption=true>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{MstSaleDepartment001.handletypeName}">特殊处理业务</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="handletype" name="handletype"
												class="layui-input form-input input-select" required
												allowClear="true" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue="*{entity?.handletype}"
												data-th-data-result='${SPECIAL_HANDLE_TYPE}'
												formatoption=true>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{MstSaleDepartment001.intertypeName}">柜台接口类型</label>
										<div class="layui-input-inline input-inline">
										<input type="text" id="intertype" name="intertype"
											class="layui-input form-input input-select" allowClear="true"
											placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}" required
											data-th-initValue="*{entity?.intertype}"
											data-th-data-result='${COUNTER_INTER_TYPE}' formatoption=true>
											</div>
									</div>
								</div>
							</div>
						</div>
					</div>
					<!-- 柜台参数 -->
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title">
								<span class="title-des">柜台参数</span>（<span class="star-sign">*</span>
								必填） <i class="iconfont icon-arrow-down pro-down-icon"></i>
							</h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<label class="layui-form-label form-lable"
										style="width: 11.9%;" data-th-text="#{MstSaleDepartment002.serverinfo}">柜台参数</label>
									<div class="layui-input-inline input-inline"
										style="width: 86% !important;">
										<textarea type="text" class="layui-textarea" id="serverinfo"
											name="serverinfo" required placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-text="${entity?.serverinfo}" maxlength="1024"></textarea>
									</div>
								</div>
							</div>
						</div>
					</div>
					<!--  按钮 -->
					<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11"
						style="margin: 30px;">
						<div class="text-center">
							<a id="MstSaleDepartment002_btn_save"
								class="layui-btn layui-btn-sm btn-save"
								data-th-text="#{SysCommon.save}">保存</a> <a
								id="MstSaleDepartment002_btn_cancel"
								class="layui-btn layui-btn-sm  btn-cancel"
								data-th-text="#{SysCommon.cancel}">取消</a>
						</div>
					</div>
				</div>
			</form>
		</div>
	</div>

	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var SHSeatNo = /*[[${SHSeatNo}]]*/''; //上交所席位号
			var SZSeatNo = /*[[${SZSeatNo}]]*/''; //深交所席位号
			var ZJSeatNo = /*[[${ZJSeatNo}]]*/''; //中金所席位号
			//var SQSeatNo = /*[[${SQSeatNo}]]*/''; //上期所席位号
		</script>
		 <script data-th-src="@{/js/component/common/util.js}" type="text/javascript"></script>
		 <script data-th-src="@{/js/invest/basicdata/mstsaledepartment/MstSaleDepartment002.js}" type="text/javascript"></script>
	</div>
</body>
</html>
