<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PortfolioManageInfo002.title}">产品组合新建</title>
<style type="text/css">
	.select-btn a{
		border-radius:45px;
		height:30px!important;
		width:30px!important;
		/* background-color:#fff!import; */
	}
	.select-btn{
		text-align:center;
	}
	
	.customer-table-two,.customer-table-one{
		height:200px!important;
	}
	 .layui-border-box{
	 height:168px!important;
 	overflow-y:auto;
 	overflow-x:hidden;
 }
 
 	.select-btn-one{
 		margin-top:50px;
 		border:2px #41c0c7 solid;
 		color:#41c0c7;
 	}
 	.select-btn-two{
 		margin-top:40px;
 		border:2px #e09219 solid;
 		color:#e09219;
 	}
 	.prending-btn,.selected-btn{
 		color:blue;
 		text-align:left;
 	}
</style>
</head>
<body>
     <div layout:fragment="content">
     	<form class="layui-form" id="submitForm" style="margin-top:20px;">
     		<div class="layui-form-item">       
                <div class="layui-inline layui-col-xs6 layui-col-sm6 layui-col-md6 layui-col-lg6">
                    <label class="layui-form-label form-lable" style='width:15%;' data-th-text="#{PortfolioManageInfo002.portfolioCode}">产品组合代码</label>
                    <div class="layui-input-inline input-inline" style='width:35%;'>
                        <input id="portfolioCode" name="portfolioCode" class="layui-input form-input" placeholder="请输入内容"data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
                <div class="layui-inline layui-col-xs6 layui-col-sm6 layui-col-md6 layui-col-lg6">
                    <label class="layui-form-label form-lable" data-th-text="#{PortfolioManageInfo001.portfolioName}">产品组合名称</label>
                    <div class="layui-input-inline input-inline">
                        <input id="portfolioName" name="portfolioName" class="layui-input form-input " placeholder="请输入内容"data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
           </div>
           <div class="layui-form-item">
           	<div class="layui-col-xs5 layui-col-sm5 layui-col-md5 layui-col-lg5">
           		<div style="margin-left:10px;">
           			<label class="layui-form-label form-lable prending-btn" data-th-text="#{PortfolioManageInfo002.pendingProduct}">待选产品</label>
           		</div>
     	   		<div class=' customer-table-one '>
					<table class="layui-table" id="prendingTable"></table>
		   		</div>
		   </div>
		   <div class="layui-col-xs2 layui-col-sm2 layui-col-md2 layui-col-lg2 select-btn" >
		   	<br>
		   	<div>
				<a class="layui-btn layui-btn-sm select-btn-one" id="selectBtn" style="background-color:#fff;">
					<i class='iconfont icon-point-left'></i>
				</a>
			</div>
			<div>
				<a class="layui-btn layui-btn-sm select-btn-two" id="cancelBtn" style="background-color:#fff;">
					<i class='iconfont icon-point-right'></i>
				</a>
			</div>
			</div>
				<div class="layui-col-xs5 layui-col-sm5 layui-col-md5 layui-col-lg5">
           			<div>
           				<label class="layui-form-label form-lable selected-btn" data-th-text="#{PortfolioManageInfo002.selectedProduct}">已选产品</label>
           			</div>
     	   			<div class=' customer-table-two '>
						<table class="layui-table" id="selectedTable"></table>
		   			</div>
		   		</div>
		  </div>
          <div class="layui-form-item " >
             <div class="layui-inline layui-col-xs12 layui-col-sm12 layui-col-md12 layui-col-lg12" >
             	<label class="layui-form-label form-lable " style="width:10%;" data-th-text="#{PortfolioManageInfo001.remark}" >备注</label>
             	<div class="layui-input-inline " style="width:80%;">
                    <textarea id="remarks" name="remarks" placeholder="请输入内容" class="layui-textarea"></textarea>
                </div>
             </div> 
           </div>   
     	</form>
     	
        <div class="layui-inline layui-col-xs12 layui-col-sm12 layui-col-md12 layui-col-lg12"  style="text-align:center;">
             <label class="layui-form-label form-lable" ></label>
             	<a id="PortfolioManageInfo002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                <a id="PortfolioManageInfo002_btn_submit" class="layui-btn layui-btn-sm btn-submit}" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="PortfolioManageInfo002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
           </div>
     </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/basicdata/portfoliomanageInfo/PortfolioManageInfo002.js}" type="text/javascript"></script>
    </div>                                
</body>

</html>
