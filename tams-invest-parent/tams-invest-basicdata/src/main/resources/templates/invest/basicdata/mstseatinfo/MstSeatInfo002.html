<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<html>
<head>
<title data-th-text="#{MstSeatInfo002}">席位信息新建</title>
<style type="text/css">
.form-inline-wrap{
width:50%
}
</style>
</head>
<body>
	<div layout:fragment="content">
		<div>
		  <form class="layui-form joyin-form-wrap pro-module-form" id="mstSeatInfoForm">
                <div class="pro-module-wrapper pro-module-base">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title"> <span class="title-des">基本信息</span> （<span class="star-sign">*</span>必填）
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
							<input id="workflowId" name="workflowId" data-th-value="${workflowId}" type="hidden">
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{MstSeatInfo002.customerName}">证券/期货公司代码</label>
                                        <div class="layui-input-inline input-inline">
                                              <input type="text" id="customerId" name="customerId"
												class="layui-input form-input input-select"
												allowClear="true" placeholder="请输入内容"
												childrenIds="tradeMarket"
												data-th-placeholder="#{SysCommon.placeholder}" required
												data-th-data-result='${brokerIds}'
												data-th-initValue="*{entity?.customerId}" formatoption=true>
                                        </div>
                                    </div>
                                 <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{MstSeatInfo002.customerId}">证券/期货公司代码</label>
                                        <div class="layui-input-inline input-inline">
                                                 <input type="text" id="customerName" name="customerName" formatoption="false" required
														class="layui-input form-input"
														data-th-placeholder="#{SysCommon.placeholder}"
														data-th-value='${entity?.customerId}'>
													</input>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{MstSeatInfo002.tradeMarket}">交易市场</label>
                                        <div class="layui-input-inline input-inline">
<!--                                              <input id="tradeMarket" name="tradeMarket" formatoption="false" class="layui-input form-input input-select" maxlength="32"
														data-th-placeholder="#{SysCommon.placeholder}" 
														parentIds="customerId"
														th:data-url="@{invest/basicdata/mstseatinfo/MstSeatInfo002/getTradeMarketBybrokerId}" required>
											 </input> -->
											      <select th:id="tradeMarket" name="tradeMarket" formatoption="true"
														class="layui-input form-input input-select" parentIds="customerId"
														data-th-placeholder="#{SysCommon.placeholder}"
														data-th-initValue='${entity?.tradeMarket}' required
														data-th-data-url="@{/invest/basicdata/mstseatinfo/MstSeatInfo002/getTradeMarketBybrokerId}">
													</select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{MstSeatInfo001.seatId}">席位号</label>
                                        <div class="layui-input-inline input-inline">
                                             <input id="seatId" name="seatId" formatoption="false"
													multiple="true"	class="layui-input form-input" maxlength="32"
														data-th-placeholder="#{SysCommon.placeholder}"
														data-th-value='${entity?.seatId}' required>
											 </input>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                        </div>
                    </div>
                	<!-- 柜台参数 -->
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title">
								<span class="title-des">备注</span>（<span class="star-sign">*</span>
								必填） <i class="iconfont icon-arrow-down pro-down-icon"></i>
							</h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<label class="layui-form-label form-lable"
										style="width: 11.9%;" data-th-text="#{MstSeatInfo002.remark}">备注</label>
									<div class="layui-input-inline input-inline"
										style="width: 86% !important;">
										<textarea type="text" class="layui-textarea" id="remark" name="remark" placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-text="${entity?.remark}" maxlength="1024"></textarea>
									</div>
								</div>
							</div>
						</div>
					</div>
					
                </div>
            </form>
	        <div class="layui-form-item">
                <div align="center" style="height:50px;padding-top: 10px;">
                    <a id="MstSeatInfo002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                    <a id="MstSeatInfo002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                    <a id="MstSeatInfo002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </div>
		</div>
	</div>

	<div layout:fragment="script">
		<script data-th-src="@{/js/invest/basicdata/mstseatinfo/MstSeatInfo002.js}" type="text/javascript"></script>
	</div>
</body>
</html>
