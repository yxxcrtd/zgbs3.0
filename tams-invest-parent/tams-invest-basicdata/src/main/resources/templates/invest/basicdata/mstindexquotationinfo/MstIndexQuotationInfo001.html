<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{MstIndexQuotationInfo001}">指数行情信息管理</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				<a id="MstIndexQuotationInfo001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
				<a id="MstIndexQuotationInfo001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}" style="display: none;">删除</a>
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area curr-form' >
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{MstIndexQuotationInfo001.indexName}">指数名称</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="indexName" name="indexName" class="layui-input form-input input-select" data-th-data-result='${INDEX_DATA}' formatoption = true placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" data-th-text="#{MstIndexQuotationInfo001.effDate}">生效日</label>
							<div class="layui-input-inline input-inline">
								<input id="effDate" name="effDate" class="layui-input form-input input-dateSelect" placeholder="请输入日期">
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" data-th-text="#{MstIndexQuotationInfo001.relaeseDate}">发布日</label>
							<div class="layui-input-inline input-inline">
								<input id="relaeseDate" name="relaeseDate" class="layui-input form-input input-dateSelect" placeholder="请输入日期">
							</div>
						</div>
				    </div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-src="@{/js/invest/basicdata/mstindexquotationinfo/MstIndexQuotationInfo001.js}"></script>
	</div>
</body>
</html>
