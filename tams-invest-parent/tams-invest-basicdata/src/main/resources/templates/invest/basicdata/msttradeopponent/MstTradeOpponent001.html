<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{MstTradeOpponent001}">交易对手管理</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
				<div class="layui-col-xs12 layui-col-md12 layui-col-sm12 layui-col-lg12 form-button-area" style="margin:10px;">
					<a id="MstTradeOpponent001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}" >新建</a>
		        	<a id="MstTradeOpponent001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}" style="display:none;">删除</a>
	         	</div>
	   		<div class='joyin-form-wrap joyin-filter-form condition-area'>
	   		<form class="layui-form" id="searchForm">
	        	<div class="layui-form-item">
	        		<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
	                    <label class="layui-form-label form-lable" data-th-text="#{MstTradeOpponent001.counterType}">交易对手类别</label>
	                    <div class="layui-input-inline input-inline">
	                    	<select type="text" id="counterType" name="counterType" class="layui-input form-input input-select" 
	                    			data-th-data-result="${COUNTER_TYPE}" placeholder="请输入内容"  
	                    			data-th-placeholder="#{SysCommon.placeholder}" formatoption = true>
	                    			<option></option>
	                    	</select>
	                    </div>
	                </div>
	                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
		                <label class="layui-form-label form-lable" data-th-text="#{MstTradeOpponent001.counterName}">交易对手名称</label>
	                    <div class="layui-input-inline input-inline">
	                     <input type="text" id="counterName" name="counterName" class="layui-input form-input input-lenovoselect" placeholder="请输入内容" 
                      			data-th-placeholder="#{SysCommon.placeholder}" data-th-data-url="@{/invest/basicdata/msttradeopponent/MstTradeOpponent002/getCounterName}" 
                      			data-idfield="shortName" data-keyfield="shortName" data-th-data-effectivefieldsalias='|{"code":"#{MstTradeOpponent001.counterId}","shortName":"#{MstTradeOpponent001.counterName}"}|'>
                    	</div>
                	</div>
	            </div>
	        </form>
	   		</div>
	        <div>
	            <table class="layui-table" id="dataTable"></table>
	        </div>
		</div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/basicdata/msttradeopponent/MstTradeOpponent001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
