<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{MstMarketInstitutions001}">市场机构信息管理</title>
</head>
<body>
    <div layout:fragment="content">
        <div class='layui-fluid'>
            <div class="layui-col-md12 layui-col-sm12 layui-col-lg12 layui-col-xs12 form-button-area" style="margin: 10px;">
                <a id="MstMarketInstitutions001_btn_add" class="layui-btn layui-btn-sm btn-create"
                    data-th-text="#{SysCommon.create}">新建</a>
                <a id="MstMarketInstitutions001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
                    data-th-text="#{SysCommon.delete}" style="display: none;">删除</a>
            </div>
            <div class='joyin-form-wrap joyin-filter-form condition-area'>
                <form class="layui-form" id="searchForm">
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4" style="display:none">
                            <label class="layui-form-label form-lable"
                                data-th-text="#{MstMarketInstitutions002.customerId}">市场机构代码</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="customerId" name="customerId"
                                    class="layui-input form-input input-lenovoselect" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-url="@{/invest/basicdata/mstmarketinstitutions/MstMarketInstitutions001/getCustomerId}"
                                	data-idfield="code" data-keyfield="name" 
                                	data-th-data-effectivefieldsalias='|{"code":"#{MstMarketInstitutions002.customerId}","shortName":"#{MstMarketInstitutions002.customerName}"}|'
                                     />
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                            <label class="layui-form-label form-lable"
                                data-th-text="#{MstMarketInstitutions002.customerName}">市场机构名称</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="customerName" name="customerName" 
                                    class="layui-input form-input input-lenovoselect" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" 
                                    data-parentIds="customerId"
                                    data-th-data-url="@{/invest/basicdata/mstmarketinstitutions/MstMarketInstitutions001/getCustomerName}"
                                	data-idfield="code" data-keyfield="name" 
                                	data-th-data-effectivefieldsalias='|{"code":"#{MstMarketInstitutions002.customerId}","shortName":"#{MstMarketInstitutions002.customerName}"}|'
                                    />
                            </div>
                        </div>
                        <!--添加字段'是否持有金融牌照' add by lishuping  20190823 start-->
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable"
                                   data-th-text="#{MstMarketInstitutions001.isFinLicence}">是否持有金融牌照</label>
                            <div class="layui-input-inline input-inline">
                                <select id="isFinLicence" name="isFinLicence"
                                        class="layui-input form-input input-select" allowClear="true"
                                        placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                        data-th-initValue="${entity?.isFinLicence}"
                                        data-th-data-url="@{/invest/basicdata/mstmarketinstitutions/MstMarketInstitutions001/getOrgType2}"
                                        formatoption=true></select>
                            </div>
                        </div>
                        <!--添加字段'是否持有金融牌照' add by lishuping 20190823 end-->
                    </div>
                </form>
            </div>
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/basicdata/mstmarketinstitutions/MstMarketInstitutions001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
