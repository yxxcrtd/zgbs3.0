<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{MstProjectCatInfo001}">权益类资产估值行情信息</title>
</head>
<body>
<div layout:fragment="content">
    <div class="layui-fluid">
        <div class="layui-col-md12 form-button-area">
            <a id="MstProjectCatInfo001_btn_add" class="layui-btn layui-btn-sm btn-create"
               data-th-text="#{MstProjectCatInfo001.MstProjectCatInfo001_btn_add}">新建</a>
            <a id="MstProjectCatInfo001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
               data-th-text="#{MstProjectCatInfo001.MstProjectCatInfo001_btn_delete}">删除</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{MstProjectCatInfo001.finprodId}">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="finprodId" name="finprodId"
                                   class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-url="@{/invest/basicdata/projectcatinfo/MstProjectCatInfo001/getAssetCode}"
                                   data-idfield="code" data-keyfield="code"
                                   data-th-data-effectivefieldsalias="|{'shortName':'资产名称}','code':'#{MstProjectCatInfo001.finprodId}'}|">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{MstProjectCatInfo001.valDate}">估值日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="valDate" name="valDate"
                                   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-value="${#dates.format(entity?.valDate,'yyyy-MM-dd')}">
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/basicdata/projectcatinfo/MstProjectCatInfo001.js}"
            type="text/javascript"></script>
</div>
</body>
</html>
