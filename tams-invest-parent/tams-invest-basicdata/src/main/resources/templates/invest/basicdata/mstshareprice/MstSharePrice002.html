<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{MstSharePrice002}">股票行情新建</title>
    <style>
        .mst-lable{
            width: 20%;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div>
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <input type="hidden" id="lastClosePrice"/>
                        <input type="hidden" id="lastFactorAdj"/> 
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstSharePrice001.sharesId}">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="sharesId" name="sharesId"
                                                class="layui-input form-input input-select" th:allowClear="true"
                                                th:placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                required="required" th:formatoption="false"
                                                data-th-data-url="@{/invest/basicdata/mstshareprice/MstSharePrice001/getFinprodIdForAdd}"
                                                data-th-initvalue="${entity?.sharesId}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstSharePrice001.finprodAbbr}">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodAbbr" name="finprodAbbr"
                                               class="layui-input form-input" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" required="required"
                                               data-th-value="${entity?.finprodAbbr}" disabled="disabled">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                 <label class="layui-form-label form-lable"
                                           data-th-text="#{MstSharePrice001.dealDate}">交易日期</label>
                                   <div class="layui-input-inline input-inline">
			                            <input id="dealDate" name="dealDate"
			                                   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
			                                   data-th-placeholder="#{SysCommon.placeholder}" required="required"
			                                   data-th-value="${#dates.format(entity?.dealDate,'yyyy-MM-dd')}">
			                        </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                 <label class="layui-form-label form-lable"
                                           data-th-text="#{MstSharePrice001.sShares}">总股本</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="sShares" name="sShares" required="required"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" 
                                               data-th-value="${entity?.sShares}" maxlength="16" >
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                   <label class="layui-form-label form-lable"
                                           data-th-text="#{MstSharePrice001.cShares}">流通股本</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="cShares" name="cShares" required="required"
                                               class="layui-input form-input text-number" placeholder="请输入内容" 
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.cShares}" maxlength="16" >
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstSharePrice001.preClosePrice}">昨收盘价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="preClosePrice" name="preClosePrice" placeholder="请输入内容"
                                               data-pattern=""  required="required"
                                               class="layui-input form-input text-number"
                                               data-th-value="${entity?.preClosePrice}" maxlength="16"/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div id="code_div" class="form-inline-wrap">
                                   <label class="layui-form-label form-lable"
                                           data-th-text="#{MstSharePrice001.openPrice}">开盘价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="openPrice" name="openPrice" placeholder="请输入内容"
                                               data-pattern=""  required="required"
                                               class="layui-input form-input text-number"
                                               data-th-value="${entity?.openPrice}" maxlength="16"/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div id="entrustNum_div" class="form-inline-wrap">
                                   <label class="layui-form-label form-lable"
                                           data-th-text="#{MstSharePrice001.highPrice}">最高价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="highPrice" name="highPrice" placeholder="请输入内容"
                                               data-pattern=""  required="required"
                                               class="layui-input form-input text-number"
                                               data-th-value="${entity?.highPrice}" maxlength="16"/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>

                                <div id="price_div" class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstSharePrice001.lowPrice}">最低价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="lowPrice" name="lowPrice" placeholder="请输入内容"
                                               data-pattern=""  required="required"
                                               class="layui-input form-input text-number"
                                               data-th-value="${entity?.lowPrice}" maxlength="16"/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstSharePrice001.closePrice}">收盘价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="closePrice" name="closePrice" placeholder="请输入内容"
                                               data-pattern=""  required="required"
                                               class="layui-input form-input text-number"
                                               data-th-value="${entity?.closePrice}" maxlength="16"/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstSharePrice001.change}">涨跌</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="change" name="change" placeholder="请输入内容"
                                               data-pattern=""  required="required"
                                               class="layui-input form-input text-number"
                                               data-th-value="${entity?.change}" disabled="disabled"/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" id="TongDaoNum2">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstSharePrice001.changePercent}">涨跌幅%</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="changePercent" name="changePercent" placeholder="请输入内容"
                                               data-pattern=""  required="required"
                                               class="layui-input form-input text-number"
                                               data-th-value="${entity?.changePercent}" disabled="disabled"/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" id="assetAvailablePosition_div">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstSharePrice001.dealValume}">成交量</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="dealValume" name="dealValume" placeholder="请输入内容"
                                               data-pattern=""  required="required" maxlength="16"
                                               class="layui-input form-input text-number"
                                               data-th-value="${entity?.dealValume}"/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" id="proAvailableCash_div">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstSharePrice001.dealAmount}">成交金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="dealAmount" name="dealAmount" placeholder="请输入内容"
                                               data-pattern=""  required="required"
                                               class="layui-input form-input text-number" maxlength="16"
                                               data-th-value="${entity?.dealAmount}"/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" id="proAvailableCash1_div">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstSharePrice001.avgPrice}">均价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="avgPrice" name="avgPrice" placeholder="请输入内容"
                                               data-pattern=""  required="required"
                                               class="layui-input form-input text-number" disabled="disabled"
                                               data-th-value="${entity?.avgPrice}"/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" id="accAvailableCash_div">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstSharePrice001.preClosePriceAdj}">复权昨收盘价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="preClosePriceAdj" name="preClosePriceAdj" placeholder="请输入内容"
                                               data-pattern=""  required="required"
                                               class="layui-input form-input text-number" disabled="disabled"
                                               data-th-value="${entity?.preClosePriceAdj}"/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstSharePrice001.openPriceAdj}">复权开盘价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="openPriceAdj" name="openPriceAdj" placeholder="请输入内容"
                                               data-pattern=""  required="required"
                                               class="layui-input form-input text-number" disabled="disabled"
                                               data-th-value="${entity?.openPriceAdj}"/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                               <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstSharePrice001.highPriceAdj}">复权最高价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="highPriceAdj" name="highPriceAdj" placeholder="请输入内容"
                                               data-pattern=""  required="required"
                                               class="layui-input form-input text-number" disabled="disabled"
                                               data-th-value="${entity?.highPriceAdj}"/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" id="accAvailableCash_div">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstSharePrice001.lowPriceAdj}">复权最低价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="lowPriceAdj" name="lowPriceAdj" placeholder="请输入内容"
                                               data-pattern=""  required="required"
                                               class="layui-input form-input text-number" disabled="disabled"
                                               data-th-value="${entity?.lowPriceAdj}"/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstSharePrice001.closePriceAdj}">复权收盘价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="closePriceAdj" name="closePriceAdj" placeholder="请输入内容"
                                               data-pattern=""  required="required"
                                               class="layui-input form-input text-number" disabled="disabled"
                                               data-th-value="${entity?.closePriceAdj}"/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                               <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstSharePrice001.factorAdj}">复权因子</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="factorAdj" name="factorAdj" placeholder="请输入内容"
                                               data-pattern=""  required="required" disabled="disabled"
                                               class="layui-input form-input text-number"
                                               data-th-value="${entity?.factorAdj}" data-th-initValue='1'/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
				                    <label class="layui-form-label form-lable" data-th-text="#{MstSharePrice001.tradeStatus}">交易状态</label>
				                     <div class="layui-input-inline input-inline">
					                 <select type="text" id="tradeStatus" name="tradeStatus" class="layui-input form-input input-select"  
						                     data-th-data-result='${SHARES_TRADE_STATUS}'allowClear="true"  required="required"
						                     placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
						                     data-th-initValue="${entity?.tradeStatus}" formatoption = "true">
				                        <option></option>
				                     </select>
				                                   
				                    </div>   
				                </div>
                            </div>
                        </div>
                    </div>
                </div>
                    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                        <div class="text-center">
                            <a id="MstSharePrice002_btn_save" class="layui-btn layui-btn-sm btn-save"
                               data-th-text="#{SysCommon.save}">保存</a>
                            <a id="MstSharePrice002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                               data-th-text="#{SysCommon.submit}">提交</a>
                            <a id="MstSharePrice002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                               data-th-text="#{SysCommon.cancel}">取消</a>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/basicdata/mstshareprice/MstSharePrice002.js}" type="text/javascript"></script>
    
    <!-- <script data-th-src="@{/js/invest/entrust/etrstock/EtrStock002.js}" type="text/javascript"></script>
     -->
</div>
</body>
</html>
