<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title data-th-text="#{StlSecReconPara001}">对账参数设置</title>
</head>
<body>
    <div layout:fragment="content">
        <!-- 画面信息 -->
        <div class='layui-fluid' id="StlSecReconPara001_DIV">
            <div class="layui-col-xs12 layui-col-md12 layui-col-sm12 layui-col-lg12 form-button-area" style="margin: 10px;">
                <a id="StlSecReconPara001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
                <a id="StlSecReconPara001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}">删除</a>
            </div>
            <div class="joyin-form-wrap joyin-filter-form condition-area">
                <form class="layui-form"  id="submitForm">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable"
                               data-th-text="#{StlSecReconPara001.customerId}">券商代码</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="customerId" name="customerId"
                                       class="layui-input form-input input-lenovoselect"
                                       data-th-data-url="@{/invest/basicdata/stlsecreconpara/StlSecReconPara001/findAllBrokerIds}"
                                       placeholder="请输入内容"
                                       data-th-placeholder="#{SysCommon.placeholder}"
                                       data-idfield="code" data-keyfield="code"
                                       data-th-data-effectivefieldsalias='|{"code":"#{StlSecReconPara002.customerId}","shortName":"#{StlSecReconPara002.customerName}"}|'>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable"
                               data-th-text="#{StlSecReconPara001.paraCode}">参数名称</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="paraCode" name="paraCode"
                                    class="layui-input form-input input-select" th:allowClear="true"
                                    th:placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    th:formatoption="false" data-th-data-result='${RECON_PARA_CODE}'
                                    >
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable"
                               data-th-text="#{StlSecReconPara001.paraValue}">参数值</label>
                            <div id="DIV_paraValue01" class="layui-input-inline input-inline">
                                <input type="text" th:id="paraValue1" th:name="paraValue1"
                                       data-textrange="2"
                                       data-fixtype="2"
                                       class="layui-input form-input text-number" placeholder="请输入内容"
                                       data-th-placeholder="#{SysCommon.placeholder}"/>
                            </div>
                            <div id="DIV_paraValue02" class="layui-input-inline input-inline" style="display: none">
                                <select type="text" id="paraValue2" name="paraValue2"
                                    class="layui-input form-input input-select" th:allowClear="true"
                                    th:placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    th:formatoption="false" data-th-data-result='${RECON_DEME}'
                                    >
                                </select>
                            </div>
                        </div>
                    </div>
<!--                    <div class="layui-form-item">-->
<!--                        <div class="form-inline-wrap">-->
<!--                            <label class="layui-form-label form-lable"-->
<!--                                   data-th-text="#{StlSecReconPara001.configDate}">配置日期</label>-->
<!--                            <div class="layui-input-inline input-inline">-->
<!--                                <input type="text" id="configDate" name="configDate" class="layui-input form-input input-dateSelect"-->
<!--                                       placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" formatoption = true/>-->
<!--                            </div>-->
<!--                        </div>-->
<!--                    </div>-->
                </form>
            </div>
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>

    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
            // 参数代码_误差值
            var RECON_PARA_CODE_01  = /*[[${RECON_PARA_CODE_01}]]*/'';
            // 参数代码_对账维度
            var RECON_PARA_CODE_02  = /*[[${RECON_PARA_CODE_02}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/basicdata/stlsecreconpara/StlSecReconPara001.js}" type="text/javascript"></script>
    </div>
</body>
