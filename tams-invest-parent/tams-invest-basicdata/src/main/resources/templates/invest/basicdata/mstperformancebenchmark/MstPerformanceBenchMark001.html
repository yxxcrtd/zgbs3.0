<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<html>
<html>
<head>
<title data-th-text="#{MstPerformanceBenchMark001}">复合基准管理</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-xs12 layui-col-md12 layui-col-sm12 layui-col-lg12 form-button-area" style="margin:10px;">
				<a id="MstPerformanceBenchMark001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}" >新建</a>
		        <a id="MstPerformanceBenchMark001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}" style="display:none;">删除</a>
	   		</div>
	   		<div class='joyin-form-wrap joyin-filter-form condition-area'>
		   		<form class="layui-form" id="searchForm">
		        	<div class="layui-form-item">
		                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
			                <label class="layui-form-label form-lable" data-th-text="#{MstPerformanceBenchMark001.indexName}">基准名称</label>
		                    <div class="layui-input-inline input-inline">
			                	<input  type="text" id="indexName" name="indexName" class="layui-input form-input input-lenovoselect" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" 
			                       data-th-data-url="@{/invest/basicdata/mstperformancebenchmark/MstPerformanceBenchMark001/getIndexName}" multiple="true"
			                      data-idfield="code" data-keyfield="name" data-th-data-effectivefieldsalias='|{"code":"#{MstPerformanceBenchMark001.indexName}","shortName":"#{MstPerformanceBenchMark001.indexId}"}|'>
			                </div>
			            </div>
			            <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
		                    <label class="layui-form-label form-lable" data-th-text="#{MstPerformanceBenchMark001.indexType}">基准类型</label>
		                    <div class="layui-input-inline input-inline">
		                    	<select id="indexType" name="indexType" class="layui-input form-input input-select" allowClear="true" multiple="true"
									data-th-data-result="${BENCHMARK_TYPE}" searchable="false" data-th-placeholder="#{SysCommon.placeholder}">
								</select>
		                    </div>
		                </div>
		            </div>
		        </form>
	   		</div>
	        <div>
	            <table class="layui-table" id="dataTable"></table>
	        </div>
		</div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/basicdata/mstperformancebenchmark/MstPerformanceBenchMark001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
