<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title data-th-text="#{SettleDataImport001}">数据导入</title>
</head>

<body>
<div layout:fragment="content">

    <div class="layui-row layui-col-space15">
        <div class="layui-col-md3" style="width: 22%">
            <div class="joyin-form-wrap">
                <form class="layui-form" id="proidSearchForm">
                    <div class="layui-form-item" >
                        <input type="text" id="fileName" name="fileName"
                               class="layui-input form-input input-fuzzy-text"
                               placeholder="请输入日期"
                               data-eventfunc="serachKey">
                    </div>
                </form>
            </div>
            <div class="layui-input" style="border: 1px solid #dbdbdb; scroll-y: auto; scroll-x: hidden; overflow-y: scroll;" 
            	data-checkall="false" id='typeDatatree'  data-canedit='1' data-roottitle='数据类型'
                data-th-url='|@{/invest/basicdata/dataimport/SettleDataImport001/getInterGroup}'></div>
        </div>
        <div class="layui-col-md9" style="width: 78%">
            <div class="joyin-form-wrap condition-area" style="text-align:right">
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{SettleDataImport001.portfolioId}">组合代码</label>
                    <div class="layui-input-inline input-inline">

                        <select type="text" id="portfolioId" name="portfolioId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId}"
                                data-th-value="${entity?.portfolioId}"
                                multiple="true" >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md3">
                    <label class="layui-form-label form-lable">日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="execDate" name="execDate"
                               data-th-value='${#dates.format(entity?.execDate?:iPlatformDate,"yyyy-MM-dd")}'
                               required="required"
                               class="layui-input form-input input-dateSelect" />
                    </div>
                </div>
                <div class="layui-inline layui-col-md-offset2">
                    <button class="layui-btn layui-btn-sm " id="SettleDataImport001_btn_doExecBtn"><i class="iconfont icon-execute"></i>执行</button>
                    <button class="layui-btn layui-btn-sm  btn-default" id="SettleDataImport001_btn_searchBtn"><i class="iconfont icon-search"></i>查询</button>
                </div>
            </div>
            <div class="layui-tab layui-tab-card" >
                <ul class="layui-tab-title">
                    <li  id = "log-title" class="layui-this"><i class="iconfont icon-document"style="color:#13a7edd1"></i>日志</li>
                    <li  id = "success-title"><i class="iconfont icon-circle-correct_fill" style="color:#17c347;"></i>成功</li>
                    <li  id = "error-title" ><i class="iconfont icon-circle-wrong_fill" style="color:#ff2236;"></i>失败</li>
                    <li  id = "warning-title" ><i class="iconfont icon-sigh_fill" style="color:#ebef00d1;"></i>警告</li>
                </ul>
                <div class="layui-tab-content" >
                    <div class="layui-tab-item layui-show">
                        <table class="layui-table" id="log-table"></table>
                    </div>
                    <div class="layui-tab-item">
                        <table class="layui-table" id="success-table"></table>
                    </div>
                    <div class="layui-tab-item">
                        <table class="layui-table" id="error-table"></table>
                    </div>
                    <div class="layui-tab-item">
                        <table class="layui-table" id="warning-table"></table>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>
</body>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/basicdata/dataimport/SettleDataImport001.js}" type="text/javascript"></script>
</div>

</html>
