<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<meta charset="UTF-8">
<title>评级信息查询</title>
</head>
<body>
	<div layout:fragment="content">
		<!-- 画面内容 -->
		<div class="layui-col-md12 layui-col-sm12 layui-col-lg12 layui-col-xs12 form-button-area" style="margin: 10px;">
			<a id="MstMarketManagement001_btn_add" class="layui-btn layui-btn-sm btn-create"
			   data-th-text="#{SysCommon.create}">新建</a>
		</div>
		<div class="joyin-form-wrap joyin-filter-form condition-area">
			<form class="layui-form" id="searchForm">
				<div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable">对象类型</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="oType" name="oType"
								class="layui-input form-input input-select" placeholder="请选择"								 
								data-th-data-result="${MAIN_GRADE_TYPE}" allowClear="true">
						</div>
					</div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable">对象名称</label>
						 <div class="layui-input-inline input-inline">
                            <input type="text" id="finprodName" name="finprodName" class="layui-input form-input input-lenovoselect" data-th-value='${finprodId}'  
                            	placeholder="请输入内容" data-th-data-url="@{/invest/basicdata/mstmarketmanagement/MstMarketManagement001/getFinprodName}"
                            	data-th-data-effectivefieldsalias='|{"code":"#{MstMarketManagement001.secId}","shortName":"#{MstMarketManagement001.finprodName}"}|'
                             		data-th-placeholder="#{SysCommon.placeholder}">                            
                        </div>
					</div>
			</div>				 
				<div class="layui-form-item" id ='selectArea' >
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable">评级历史</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="ratingHistory" name="ratingHistory"
								class="layui-input form-input input-select" placeholder="请选择"
								 data-result="[{&quot;id&quot;:&quot;99&quot;,&quot;text&quot;:&quot;查看全部&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;只看最新&quot;,&quot;col&quot;:&quot;&quot;}]"
								 initValue ='01' 
								  allowClear="true">
						</div>
					</div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable">内评/外评</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="gradeSourceType" name="gradeSourceType"
								class="layui-input form-input input-select" placeholder="请选择"			 
								 data-result="[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;外部评级&quot;,&quot;col&quot;:&quot;&quot;}
								 ,{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;内部评级&quot;,&quot;col&quot;:&quot;&quot;}]"
								   initValue =''
								  allowClear="true">
						</div>
					</div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable">评级类型</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="shortLongTerm" name="shortLongTerm"
								class="layui-input form-input input-select" placeholder="请选择"
								 data-th-data-result="${LONG_SHORT_TERM}" allowClear="true">																  
						</div>
					</div>
				</div>
					<div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                	<label class="layui-form-label form-lable">评级日期</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="gradeDate" name="gradeDate"
								class="layui-input form-input input-dateRangeSelect"  data-th-value = '${quaryDate}'
								placeholder="请选择、支持区间"  >
						</div>
                	</div>  
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable">评级结果</label>					 
						  <div class="layui-input-inline input-inline">
                        <select id="gradeResult" name="gradeResult" formatoption="false"
                                class="layui-input form-input input-select"                              
                                data-th-data-result="${MAIN_GRADE_RESULT}" 
                                 allowClear="true" placeholder="请输入内容" 
                                parentId ='internaLevaluation'
                                >
                        </select>	
					</div>
					</div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
						 <label class="layui-form-label form-lable">评级机构</label>                    
                         <div class="layui-input-inline input-inline">
                        <select id="gradeOrgId" name="gradeOrgId" formatoption="false"
                                class="layui-input form-input input-select"                                
                                data-th-data-result="${GRADE_PARTY}" 
                                allowClear="true" placeholder="请输入内容" 
                                >
                        </select>	
                    </div>
						</div>
					</div>
				 
				 </form>
				 </div>
				 
            <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
              
          
       </div>
  <div layout:fragment="script">
  		<script data-th-inline="javascript" type="text/javascript">
        	var REM_TYPE = [[${remType}]];
    	</script>
         <script data-th-src="@{/js/invest/basicdata/mstmarketmanagement/MstMarketManagement001.js}" type="text/javascript"></script>
    </div>
    </body>
</html>
