<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{MstBankTranFeeManage002}">银行间交易费用新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
                <div class="pro-module-wrapper pro-module-base">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">基本信息</span>
                                （
                                <span class="star-sign">*</span>
                                必填）
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div>
                                        <input type="text" id="batchSeq" name="batchSeq" required="required"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.batchSeq}" style="display: none" />
                                        <input type="text" id="workflowId" name="workflowId" required="required"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.workflowId}" style="display: none" />
                                        <input type="text" id="newBatchSeq" name="newBatchSeq" required="required"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.batchSeq}" style="display: none" />
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstBankTranFeeManage001.feeType}">费用类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="feeType" name="feeType" required="required"
                                                   class="layui-input form-input input-select" placeholder=""
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-initValue="${entity?.feeType}" data-th-data-result='${FEE_TYPE}'>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstBankTranFeeManage001.registOrg}">登记托管机构</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="registOrg" name="registOrg" required="required"
                                                   class="layui-input form-input input-select" placeholder=""
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-data-result='${REGIST_ORG_INV}'
                                                   data-th-initValue='${entity?.registOrg}'>
                                             </select>
                                        </div>
                                    </div>

                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstBankTranFeeManage001.tradeType}">交易品种</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="tradeType" name="tradeType" formatoption="true"
                                                    required="required" class="layui-input form-input input-select"
                                                    placeholder="请输入内容" childrenIds="ps,chargeBasis"
                                                    data-th-data-result='${PINAN_ASSET_TYPE}'
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue="${entity?.tradeType}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">

                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstBankTranFeeManage001.tradeMarketMode}">交易市场</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="tradeMarketMode" name="tradeMarketMode"
                                                    class="layui-input form-input input-select"
                                                    data-th-data-result='${SHARES_TRADE_MARKET}'
                                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                    formatoption="true" required="required"
                                                    data-th-initvalue="${entity?.tradeMarketMode}">
                                            </select>
                                        </div>
                                    </div>

                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstBankTranFeeManage001.ps}">交易方向</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="ps" name="ps"
                                                   data-th-data-result='${PS}' required="required"
                                                   class="layui-input form-input input-select" placeholder="请输入内容"
                                                   formatoption="true" data-th-initValue="${entity?.ps}" multiple
                                                   data-th-placeholder="#{SysCommon.placeholder}" parentIds="tradeType">
                                            </select>
                                        </div>
                                    </div>

                                </div>

                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstBankTranFeeManage002.termType}">期限品种</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="termType" name="termType"
                                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                                    data-th-initValue="${entity?.termType}" showAll="true"
                                                    data-th-data-result="${TERM_TYPE_REBACK}" multiple
                                                    data-th-placeholder="#{SysCommon.placeholder}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstBankTranFeeManage001.chargeType}">计费类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="chargeType" name="chargeType" required="required"
                                                    class="layui-input form-input input-select"
                                                    data-th-data-result='${CHARGE_KIND}'
                                                    data-th-initValue='${entity?.chargeType}'>
                                            </select>
                                        </div>
                                    </div>
                                </div>

                                <!-- modified by wangguoxian 20190718 start -->
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstBankTranFeeManage002.isMlti}">是否多券种</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="checkbox" id="isMlti" name="isMlti"
                                                   lay-skin="switch" disabled lay-text="是|否" 
                                                   th:value='${N}' lay-filter="switchTest"
                                                   th:checked="${entity?.isMlti=='Y' ?true:false}" />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstBankTranFeeManage001.chargeBasis}">计费基础</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="chargeBasis" name="chargeBasis" required="required"
                                                   class="layui-input form-input input-select" parentIds="tradeType"
                                                   data-th-data-result='${CHARGE_BASIS}'
                                                   data-th-initValue='${entity?.chargeBasis}'>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" id="chargeValueDiv">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstBankTranFeeManage002.chargeValue}">费用值</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="chargeValue" name="chargeValue" data-textrange="2" required="required"
                                                  class="layui-input form-input text-number" data-th-value='${entity?.chargeValue}' maxlength="15"/>
                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" id="chargeRateDiv">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstBankTranFeeManage002.chargeRate}">费率值</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="chargeRate" name="chargeRate" data-textrange="8" required="required"
                                                  class="layui-input form-input text-number" data-th-value='${entity?.chargeRate}' maxlength="15"/>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item" >
                                	
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstBankTranFeeManage001.feeMaxi}">最大金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="feeMaxi" name="feeMaxi" data-textrange="2"
                                                  class="layui-input form-input text-number" data-th-value='${entity?.feeMaxi}' maxlength="15"/>
                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstBankTranFeeManage001.feeMini}">最小金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="feeMini" name="feeMini" data-textrange="2"
                                                  class="layui-input form-input text-number" data-th-value='${entity?.feeMini}' maxlength="15"/>
                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstBankTranFeeManage001.effDate}">生效日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="effDate" name="effDate"
                                                class="layui-input form-input input-dateSelect"
                                                data-th-value='${#dates.format(entity?.effDate,"yyyy-MM-dd")}'
                                                placeholder="请输入内容" required>
                                        </div>
                                    </div>
                                </div>
                                <!-- modified by wangguoxian 20190718 end -->
                            </div>
                        </div>
                    </div>
                    </div>
                <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 40px 0 30px 0;">
                    <div class="text-center">
                        <a id="MstBankTranFeeManage002_btn_save" class="layui-btn layui-btn-sm btn-save"
                           data-th-text="#{SysCommon.save}">保存</a>
                        <a id="MstBankTranFeeManage002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                           data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="MstBankTranFeeManage002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                           data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div layout:fragment="script">
        <script th:inline="javascript" type="text/javascript">
            var PINAN_ASSET_TYPE_F01 = /*[[${PINAN_ASSET_TYPE_F01}]]*/'';//债券
            var PINAN_ASSET_TYPE_F10 = /*[[${PINAN_ASSET_TYPE_F10}]]*/'';//买断式回购
            var PINAN_ASSET_TYPE_F07 = /*[[${PINAN_ASSET_TYPE_F07}]]*/'';//质押式回购
            var CHARGE_KIND_01 = /*[[${CHARGE_KIND_01}]]*/'';//固定费率
            var CHARGE_KIND_02 = /*[[${CHARGE_KIND_02}]]*/'';//固定金额
            var feeList = /*[[${feeList}]]*/'';
            var profitType = /*[[${profitType}]]*/'';
            var FEE_TYPE_B06 = /*[[${FEE_TYPE_B06}]]*/'B06';
        </script>
        <script data-th-src="@{/js/invest/basicdata/mstbanktranfeemanage/MstBankTranFeeManage002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
