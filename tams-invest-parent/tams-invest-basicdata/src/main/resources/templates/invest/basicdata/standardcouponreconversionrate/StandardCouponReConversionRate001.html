<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title data-th-text="#{StandardCouponReConversionRate001}">标准券再折算率维护</title>
</head>
<body>
<div layout:fragment="content">
    <!-- 画面信息 -->
    <div class='layui-fluid' id="StandardCouponReConversionRate001_DIV">
        <div class="layui-col-xs12 layui-col-md12 layui-col-sm12 layui-col-lg12 form-button-area" style="margin: 10px;">
            <a id="StandardCouponReConversionRate001_btn_add"
               class="layui-btn layui-btn-sm btn-create"
               data-th-text="#{SysCommon.create}">新建</a>
            <a id="StandardCouponReConversionRate001_btn_import"
               class="layui-btn layui-btn-sm btn-import">
                <i class="iconfont icon-import"></i>
                <span data-th-text="#{SysCommon.import}">导入</span></a>
            <a id="StandardCouponReConversionRate001_btn_delete"
               class="layui-btn layui-btn-sm btn-delete"
               data-th-text="#{SysCommon.delete}">删除</a>
        </div>

        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{StandardCouponReConversionRate001.broker}">券商</label>
                        <div class="layui-input-inline input-inline">
                            <select id="brokerId" name="brokerId" class="layui-input form-input input-select" allowClear="true"
                                    placeholder="请输入内容" formatoption="false"
                                    data-th-data-result="${brokerIds}" autosort="false"
                                    data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{StandardCouponReConversionRate001.finprodId}">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <select id="finprodId" name="finprodId"
                                    class="layui-input form-input input-select" allowClear="true"
                                    placeholder="请输入内容" formatoption="false"
                                    data-th-data-result="${finprodIdList}" autosort="false"
                                    data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>

                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{StandardCouponReConversionRate001.accountType}">资金账户</label>
                        <div class="layui-input-inline input-inline">
                            <select id="accountType" name="accountType"
                                    class="layui-input form-input input-select" allowClear="true"
                                    placeholder="请输入内容" formatoption="false"
                                    data-th-data-result="${accountTypeList}" autosort="false"
                                    data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>

<div layout:fragment="script">
    <script data-th-src="@{/js/invest/basicdata/standardcouponreconversionrate/StandardCouponReConversionRate001.js}" type="text/javascript"></script>
</div>

</body>
</html>
