<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FundSecuritiesAccount002}">基金账户新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <div class="pro-module-wrapper pro-module-base" style="border-top: none;">
            <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title" style="border-top: 1px solid #cccccc;">
                                <span class="title-des">基本信息</span>（<span class="star-sign">*</span> 必填）
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{FundSecuritiesAccount001.secAcctId}">基金账户账号</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="secAcctId" name="secAcctId"
                                                data-th-value='${entity?.secAcctId}'
                                                class="layui-input form-input form-input" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" required="required">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{FundSecuritiesAccount001.secAcctName}">基金账户名称</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="secAcctName" name="secAcctName"
                                                data-th-value='${entity?.secAcctName}'
                                                class="layui-input form-input form-input" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" required="required">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{FundSecuritiesAccount001.manager}">基金管理人</label>
                                        <div class="layui-input-inline input-inline">
                                        	<select type="text" id="manager" name="manager"
                                                class="layui-input form-input input-select" 
                                                placeholder="请输入内容"
                                                data-th-initValue="${entity?.manager}"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-url="@{/invest/basicdata/fundsecuritiesaccount/FundSecuritiesAccount002/getSecManagerSelect}"
                                                required="required" formatoption="true"></select>
                                                
                                        </div>
                                    </div>
                                    
                                    <div class="form-inline-wrap">
                                       <label class="layui-form-label form-lable"
                                               data-th-text="#{FundSecuritiesAccount002.recAcctId}">资金账户</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="recAcctId" name="recAcctId"
                                                class="layui-input form-input input-select" 
                                                placeholder="请输入内容"
                                                data-th-initValue="${entity?.recAcctId}"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-url="@{/invest/basicdata/mstsecuritiesaccount/MstSecuritiesAccount002/getBusiAcctNo}"
                                                formatoption=true></select>
                                        </div>
                                    </div>
                                    
                                </div>
                                
                            </div>
                        </div>
                    </div>
                    <!-- 引业务组件附件信息组件 -->
                    <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                        th:data-params="|{entityName: 'fileCommonDto', businessId: '${entity?.secAcctId ?: ''}'}|"></div>
                    <div id="ramark_DIV" class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">备注</span>
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                        <textarea id="remark" name="remark" placeholder="请输入内容"
                                                  data-th-placeholder="#{SysCommon.placeholder}" class="layui-textarea"
                                                  data-th-text="${entity?.remark}"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="layui-col-xs11 layui-col-md11 layui-col-sm11 layui-col-lg11" style="margin: 30px;">
                        <div class="text-center">
                            <a id="FundSecuritiesAccount002_btn_save" class="layui-btn layui-btn-sm btn-save"
                               data-th-text="#{SysCommon.save}">保存</a>
                            <a id="FundSecuritiesAccount002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                               data-th-text="#{SysCommon.submit}">提交</a>
                            <a id="FundSecuritiesAccount002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                               data-th-text="#{SysCommon.cancel}">取消</a>
                        </div>
                    </div>
            </form>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/basicdata/fundsecuritiesaccount/FundSecuritiesAccount002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
