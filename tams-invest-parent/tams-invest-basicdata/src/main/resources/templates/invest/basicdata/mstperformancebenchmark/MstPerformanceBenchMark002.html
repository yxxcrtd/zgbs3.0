<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<html>
<html>
<head>
<title data-th-text="#{MstPerformanceBenchMark002}">复合基准管理</title>
</head>
<body>
	<div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm">
             <div class="layui-form-item">
                <div class="layui-inline layui-col-xs6 layui-col-md6 layui-col-sm6 layui-col-lg6">
                    <label class="layui-form-label form-lable" data-th-text="#{MstPerformanceBenchMark002.indexType}">基准类型
                    </label>
                    <div class="layui-input-inline input-inline">
	                    <input type="text" id="indexType" name="indexType" class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
	                    	data-th-value="${entity?.indexType}" data-th-data-result='${BENCHMARK_TYPE}' formatoption=true	required="required"	/>
	                  
	                </div>
                </div>
                <div class="layui-inline layui-col-xs6 layui-col-md6 layui-col-sm6 layui-col-lg6">
                    <label class="layui-form-label form-lable" data-th-text="#{MstPerformanceBenchMark002.indexName}">基准名称</label>
                    <div class="layui-input-inline input-inline">
                    	<input id="indexName" name="indexName" class="layui-input form-input" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.indexName}" maxlength="30" required="required"/>
                    </div>
                </div> 
                <div style="display:none;" class="layui-input-inline input-inline">
                        <input type="text" id="workflowId" name="workflowId" 
                            class="layui-input form-input"
                            data-th-value="${workflowId}"
                            disabled=true/>
                    </div>
                    <div style="display:none;" class="layui-input-inline input-inline">
                        <input type="text" id="indexId" name="indexId" 
                            class="layui-input form-input"
                            data-th-value="${entity?.indexId}"
                            disabled=true/>
                    </div>
             </div>
	         </form> 
           <div>
             <table class="layui-table" id="dataTable">
                </table> 
            </div>
        
        <div class="layui-col-xs11 layui-col-md11 layui-col-sm11 layui-col-lg11" style="position: fixed;bottom: 30px;">
            <div class="text-center">
                <a id="MstPerformanceBenchMark002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                <a id="MstPerformanceBenchMark002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="MstPerformanceBenchMark002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
    	 <script data-th-inline="javascript" type="text/javascript">
		    	var MARKET_TYPE = /*[[${MARKET_TYPE}]]*/'';
		    	var INDEX_ID_SOURCE = /*[[${INDEX_ID_SOURCE}]]*/'';
                var entityInfo= /*[[${entity}]]*/'';
			</script> 
        <script data-th-src="@{/js/invest/basicdata/mstperformancebenchmark/MstPerformanceBenchMark002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
