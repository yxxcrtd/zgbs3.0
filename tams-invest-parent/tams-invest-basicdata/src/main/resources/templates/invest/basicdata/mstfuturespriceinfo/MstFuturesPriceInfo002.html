<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{MstFuturesPriceInfo002}">期货行情信息</title>
    <style>
        .mst-lable{
            width: 20%;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div>
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstFuturesPriceInfo002.futuresId}">合约代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="futuresId" name="futuresId"
                                                class="layui-input form-input input-select" th:allowClear="true" required="required"
                                                th:placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                th:formatoption="false" data-th-initValue="${entity?.futuresId}"
                                                data-th-data-url="@{/invest/basicdata/mstfuturespriceinfo/MstFuturesPriceInfo001/getContractId}"
                                        >
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstFuturesPriceInfo002.tradeDate}">行情日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="tradeDate" name="tradeDate"
                                               class="layui-input form-input input-dateSelect"
                                               data-th-value="${#dates.format(entity?.tradeDate,'yyyy-MM-dd')}"
                                               required="required"  placeholder="请选择时间"/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstFuturesPriceInfo002.windCode}">Wind代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="windCode" name="windCode"
                                                class="layui-input form-input input-select" th:allowClear="true"
                                                th:placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                th:formatoption="false"  data-th-initValue="${entity?.windCode}"
                                                data-th-data-url="@{/invest/basicdata/mstfuturespriceinfo/MstFuturesPriceInfo001/getWindCode}"
                                        >
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstFuturesPriceInfo002.preSettlePrice}">前结算价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="preSettlePrice" name="preSettlePrice"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" required="required"
                                               data-th-value="${entity?.preSettlePrice}">
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstFuturesPriceInfo002.openPrice}">开盘价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="openPrice" name="openPrice" placeholder="请输入内容"
                                               data-pattern="" required="required"
                                               class="layui-input form-input text-number"
                                               data-th-value="${entity?.openPrice}" maxlength="16"/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstFuturesPriceInfo002.closePrice}">收盘价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="closePrice" name="closePrice" placeholder="请输入内容"
                                               data-pattern="" required="required"
                                               class="layui-input form-input text-number"
                                               data-th-value="${entity?.closePrice}" maxlength="16"/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstFuturesPriceInfo002.highPrice}">最高价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="highPrice" name="highPrice" placeholder="请输入内容"
                                               data-pattern="" required="required"
                                               class="layui-input form-input text-number"
                                               data-th-value="${entity?.highPrice}" maxlength="16"/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstFuturesPriceInfo002.lowPrice}">最低价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="lowPrice" name="lowPrice" placeholder="请输入内容"
                                               data-pattern="" required="required"
                                               class="layui-input form-input text-number"
                                               data-th-value="${entity?.lowPrice}" maxlength="16"/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{MstFuturesPriceInfo002.settlePrice}">结算价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="settlePrice" name="settlePrice" placeholder="请输入内容"
                                               data-pattern="" required="required"
                                               class="layui-input form-input text-number"
                                               data-th-value="${entity?.settlePrice}" maxlength="16"/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                        <div class="text-center">
                            <a id="MstFuturesPriceInfo002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                               data-th-text="#{SysCommon.submit}">提交</a>
                            <a id="MstFuturesPriceInfo002_btn_save" class="layui-btn layui-btn-sm  btn-save"
                               data-th-text="#{SysCommon.save}">保存</a>
                            <a id="MstFuturesPriceInfo002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                               data-th-text="#{SysCommon.cancel}">取消</a>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/basicdata/mstfuturespriceinfo/MstFuturesPriceInfo002.js}" type="text/javascript"></script>
</div>
</body>
</html>
