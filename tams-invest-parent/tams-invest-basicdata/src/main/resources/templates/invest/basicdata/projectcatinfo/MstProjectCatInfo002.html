<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
    <title data-th-text="#{MstProjectCatInfo002}"></title>
    <style>
        .mst-lable {
            width: 20%;
        }
    </style>
</head>

<body>

<div layout:fragment="content" id="MstProjectCatInfo002_DIV">
    <div>
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <input type="hidden" id="finprodId" name="finprodId" data-th-value="${entity?.finprodId}">
            <!-- <div class="layui-form-item">
                <label class="layui-form-label form-lable mst-lable" data-th-text="#{MstProjectCatInfo002.profitType}">收益类型</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="profitType" name="profitType"
                           class="layui-input form-input input-checkbox" placeholder="请输入内容"
                           data-th-data-result="${PROFIT_TYPE}"
                           data-th-initValue="${entity?.profitType == null ? '01' : entity?.profitType}">
                    </input>
                </div>
            </div>-->
            <div class="layui-form-item">
                <label class="layui-form-label form-lable mst-lable" data-th-text="#{MstProjectCatInfo002.finProdMarketId}">资产代码</label>
                <div class="layui-input-inline input-inline">
                    <select id="finProdMarketId" name="finProdMarketId" th:disabled="${pageModel  != '0'}"
                            class="layui-input form-input input-select" required
                            placeholder="请输入内容" data-th-parentids="profitType"
                            data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-initvalue="${entity?.finProdMarketId}"
                            data-th-data-url="@{/invest/basicdata/projectcatinfo/MstProjectCatInfo002/getAssetCodeList}"> </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label form-lable mst-lable" data-th-text="#{MstProjectCatInfo002.finProdName}">资产名称</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="finProdName" name="finProdName" class="layui-input form-input"
                           placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required
                           data-th-value="${entity?.finProdName}">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label form-lable mst-lable"
                       data-th-text="#{MstProjectCatInfo002.valDate}">估值日期</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="valDate" name="valDate" class="layui-input form-input input-dateSelect" th:disabled="${pageModel  != '0'}"
                           placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required="true"
                           data-th-value="${#dates.format(entity?.valDate,'yyyy-MM-dd')}">
                </div>
            </div>

            <div class="layui-form-item">
                <label class="layui-form-label form-lable mst-lable" data-th-text="#{MstProjectCatInfo002.valuation}">单位净值</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="valuation" name="valuation" class="layui-input form-input text-money"
                           placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required="true"
                           data-th-value="${entity?.valuation}">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label form-lable mst-lable" data-th-text="#{MstProjectCatInfo002.fundManager}">管理人</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="fundManager" name="fundManager" class="layui-input form-input"
                           placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-value="${entity?.fundManager}">
                </div>
            </div>
        </form>
        <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="position: fixed;bottom: 30px;">
            <div class="text-center">
                <a id="MstProjectCatInfo002_btn_save" class="layui-btn layui-btn-sm btn-save"
                   data-th-text="#{MstProjectCatInfo002.MstProjectCatInfo002_btn_save}">保存</a>

                <a id="MstProjectCatInfo002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                   data-th-text="#{MstProjectCatInfo002.MstProjectCatInfo002_btn_submit}">提交</a>

                <a id="MstProjectCatInfo002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                   data-th-text="#{MstProjectCatInfo002.MstProjectCatInfo002_btn_cancel}">取消</a>
            </div>
        </div>
    </div>
</div>

<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var getManagerAndName = /*[[@{/invest/basicdata/mstnetassetquotationinfo/MstNetAssetQuotationInfo002/getManagerAndName}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/basicdata/projectcatinfo/MstProjectCatInfo002.js}"
            type="text/javascript"></script>
</div>
</body>
</html>
