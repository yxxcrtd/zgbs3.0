<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<html>
<html>
<head>
<title data-th-text="#{FundSecuritiesAccount001}">基金账户管理</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
				<div class="layui-col-xs12 layui-col-md12 layui-col-sm12 layui-col-lg12 form-button-area" style="margin:10px;">
				<a id="FundSecuritiesAccount001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}" >新建</a>
		        <a id="FundSecuritiesAccount001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}" style="display:none;">删除</a>
	   		</div>
	   		<div class='joyin-form-wrap joyin-filter-form condition-area'>
	   		<form class="layui-form" id="searchForm">
	        	<div class="layui-form-item">
	                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
		                <label class="layui-form-label form-lable" data-th-text="#{FundSecuritiesAccount001.secAcctId}">基金账户账号</label>
	                    <div class="layui-input-inline input-inline">										
		                	<input  type="text" id="secAcctId" name="secAcctId" 
			                	class="layui-input form-input input-lenovoselect" placeholder="请输入内容" 
			                	data-th-placeholder="#{SysCommon.placeholder}" 
			                  	data-th-data-url="@{/invest/basicdata/fundsecuritiesaccount/FundSecuritiesAccount001/getSecAcctId}" 
			                  	data-idfield="code" data-keyfield="name" 
			                  	data-th-data-effectivefieldsalias='|{"code":"#{FundSecuritiesAccount001.secAcctId}"
			                  	,"shortName":"#{FundSecuritiesAccount001.secAcctName}"}|'>
		                </div>
		            </div>
	                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
	                    <label class="layui-form-label form-lable" data-th-text="#{FundSecuritiesAccount001.manager}">基金管理人</label>
	                    <div class="layui-input-inline input-inline">
	                    	<input type="text" id="manager" name="manager" 
		                    	class="layui-input form-input input-lenovoselect" placeholder="请输入内容" 
			                	data-th-placeholder="#{SysCommon.placeholder}" 
			                  	data-th-data-url="@{/invest/basicdata/fundsecuritiesaccount/FundSecuritiesAccount001/getSecManager}" 
			                  	data-idfield="code" data-keyfield="name" 
			                  	data-th-data-effectivefieldsalias='|{"code":"#{FundSecuritiesAccount001.managerCode}"
			                  	,"shortName":"#{FundSecuritiesAccount001.managerName}"}|'>
	                    </div>
	                </div>
	            </div>
	        </form>
	   		</div>
	        <div>
	            <table class="layui-table" id="dataTable"></table>
	        </div>
		</div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/basicdata/fundsecuritiesaccount/FundSecuritiesAccount001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
