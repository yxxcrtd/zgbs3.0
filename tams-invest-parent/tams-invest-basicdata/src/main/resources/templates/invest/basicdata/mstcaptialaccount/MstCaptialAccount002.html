<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title data-th-text="#{MstCaptialAccount002}">资金账户管理新建</title>
</head>
<body>
<div layout:fragment="content">
    <div>
        <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">账户信息</span>（<span class="star-sign">*</span>必填）
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <input type="text" id="isFirstApprovalNode" name="isFirstApprovalNode"
                                   class="layui-input form-input" data-th-value="${entity?.isFirstApprovalNode}"
                                   style="display: none">
                            <input type="text" id="ccyContrast" name="ccyContrast" class="layui-input form-input"
                                   data-th-value="${entity?.ccy}" style="display: none">
                            <input type="text" id="bankDepContrast" name="bankDepContrast"
                                   class="layui-input form-input" data-th-value="${entity?.bankDep}"
                                   style="display: none">
                            <input type="text" id="largePaynoContrast" name="largePaynoContrast"
                                   class="layui-input form-input" data-th-value="${entity?.largePayno}"
                                   style="display: none">
                            <input type="text" id="currentRate" name="currentRate" class="layui-input form-input"
                                   data-th-value="${entity?.currentRate}" style="display: none">
                            <input type="text" id="indexSource" name="indexSource" class="layui-input form-input"
                                   data-th-value="${entity?.indexSource}" style="display: none">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{MstCaptialAccount002.accountId}">帐号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" maxlength="30" id="busiAcctNo" name="busiAcctNo"
                                               class="layui-input form-input" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" required
                                               data-th-value="${entity?.busiAcctNo}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{MstCaptialAccount002.accountName}">账户名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" maxlength="66" id="acctName" name="acctName"
                                               class="layui-input form-input" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" required
                                               data-th-value="${entity?.acctName}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{MstCaptialAccount002.currency}">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="ccy" name="ccy"
                                               class="layui-input form-input input-select" allowClear="true"
                                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-initValue="*{entity?.ccy?:CCY_default}"
                                               data-th-data-result='${CCY}'
                                               formatoption=true>
                                    </div>
                                </div>

                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{MstCaptialAccount002.accountNature}">账户性质</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="accountNature" name="accountNature"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="*{entity?.accountNature}"
                                                data-th-data-result='${ACCOUNT_NATURE}'
                                                formatoption=true required>
                                        </select>
                                    </div>
                                </div>

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{MstCaptialAccount002.accountType}">账户类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="accountType" name="accountType"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.accountType}"
                                                data-th-data-result='${ACCT_TYPE}'
                                                formatoption="true" multiple="true">
                                        </select>
                                    </div>
                                </div>

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{MstCaptialAccount002.bankAccount}">开户机构</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" maxlength="60" id="bankDep" name="bankDep"
                                               class="layui-input form-input" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" required
                                               data-th-value="${entity?.bankDep}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item" id="qszh_div">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{MstCaptialAccount002.ownDept}">所属柜台</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="ownDept" name="ownDept"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="*{entity?.ownDept}"
                                                data-th-data-url="@{/invest/basicdata/mstcaptialaccount/MstCaptialAccount002/getOwnDept}"
                                                formatoption=true required>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{MstCaptialAccount002.accPass}">账户密码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="accPass" name="accPass"
                                               class="layui-input form-input" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" required
                                               data-th-value="${entity?.accPass}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{MstCaptialAccount002.tradePass}">交易密码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradePass" name="tradePass"
                                               class="layui-input form-input" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" required
                                               data-th-value="${entity?.tradePass}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{MstCaptialAccount002.accountOutlet}"
                                           style="line-height: normal;">开户网点/大额支付行号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" maxlength="12" id="largePayno" name="largePayno"
                                               class="layui-input form-input" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" required
                                               data-th-value="${entity?.largePayno}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{MstCaptialAccount002.inOutBank}">行内行外</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="inOutBank" name="inOutBank"
                                               class="layui-input form-input input-checkbox"
                                               data-th-data-result='${ASSET_SOURCE}'
                                               th:initValue="${entity?.inOutBank}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{MstCaptialAccount002.swiftCode}">Swift Code</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" maxlength="50" id="swiftCode" name="swiftCode"
                                               class="layui-input form-input" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.swiftCode}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{MstCaptialAccount002.isCalint}">是否计提活期利息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="isCalint" name="isCalint"
                                               class="layui-input form-input input-checkbox"
                                               data-th-data-result='${YES_OR_NO}'
                                               th:initValue="${entity?.isCalint?:YES_OR_NO_N}" required>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" id="effectDate_div">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{MstCaptialAccount002.effectDate}">生效日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="effectDate" id="effectDate"
                                               class="layui-input form-input input-dateSelect"
                                               data-th-value='${#dates.format(entity?.effectDate,"yyyy-MM-dd")}'
                                               required>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" id="basis_div">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{MstCaptialAccount002.basis}">计息基础</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="basis" name="basis"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.basis}" data-th-data-result='${BASIS}'
                                                formatoption=true required>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" id="rateType_div">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{MstCaptialAccount002.rateType}">利率类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="rateType" name="rateType"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.rateType}"
                                                data-th-data-result='${INT_TYPE}'
                                                formatoption=true required>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" id="rate_div">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{MstCaptialAccount002.rate}">利率%</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="rate" name="rate"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" required
                                               data-th-value="${entity?.rate}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap" id="indexId_div">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{MstCaptialAccount002.currentRate}">活期利率%</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="indexId" name="indexId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.indexId}"
                                                data-th-data-result='${RATE_SOURCE}'
                                                formatoption=true required>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" id="coefficient_div">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{MstCaptialAccount002.coefficient}">系数</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="coefficient" name="coefficient"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" required
                                               data-th-value="${entity?.coefficient}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item" id="spreadRate_div">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{MstCaptialAccount002.spreadRate}">利差</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="spreadRate" name="spreadRate"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" required
                                               data-th-value="${entity?.spreadRate}">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 文件上传 -->
                <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                     th:data-params="|{entityName: 'fileCommonDto', businessId: '${entity?.acctNo ?: ''}'}|"></div>
                <!-- 备注 -->
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">备注</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="layui-input-inline input-inline"
                                     style="margin:0 10px;width: 98%!important;">
                                        <textarea id="remark" name="remark" placeholder="请输入内容"
                                                  maxlength="300"
                                                  data-th-placeholder="#{SysCommon.placeholder}" class="layui-textarea"
                                                  data-th-text="${entity?.remark}"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!--  按钮 -->
                <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 30px;">
                    <div class="text-center">
                        <a id="MstCaptialAccount002_btn_save" class="layui-btn layui-btn-sm btn-save"
                           data-th-text="#{SysCommon.save}">保存</a>
                        <a id="MstCaptialAccount002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                           data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="MstCaptialAccount002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                           data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var CHARGE_TYPE_01 = /*[[${CHARGE_TYPE_01}]]*/'';
        var finprodMarketId = /*[[${finprodMarketId}]]*/'';
        var feeList = /*[[${feeList}]]*/'';
        var CNY = /*[[${CNY}]]*/'';
        var dooubleRecord = /*[[${dooubleRecord}]]*/'';
        var ACCOUNT_NATURE_02 = /*[[${ACCOUNT_NATURE_02}]]*/'';
        var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'';
        var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
        var INT_TYPE_01 = /*[[${INT_TYPE_01}]]*/'';
        var INT_TYPE_02 = /*[[${INT_TYPE_02}]]*/'';
        var ACCT_TYPE_A07 = /*[[${ACCT_TYPE_A07}]]*/'';
        var ACCT_TYPE_A01 = /*[[${ACCT_TYPE_A01}]]*/'';
        var RATE_DEF_DEFAULT = /*[[${RATE_DEF_DEFAULT}]]*/'';
        var BASIS_A_360 = /*[[${BASIS_A_360}]]*/'';
        var ACCT_TYPE_B24 = /*[[${ACCT_TYPE_B24}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/basicdata/mstcaptialaccount/MstCaptialAccount002.js}"
            type="text/javascript"></script>
</div>
</body>
</html>
