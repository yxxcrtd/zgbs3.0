<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{MstNaturalPerson002}">自然人信息管理新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
                <div class="pro-module-wrapper pro-module-base">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">基本信息</span>（<span class="star-sign">*</span> 必填）
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstNaturalPerson001.customerName}">姓名</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" class="layui-input form-input" id="customerName"
                                                name="customerName" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" required="required"
                                                data-th-value="${entity?.customerName}" maxlength="60">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstNaturalPerson001.sex}">性别</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" class="layui-input form-input input-select" id="sex"
                                                name="sex" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" required="required"
                                                data-th-data-result="${SEX}" formatoption="true"
                                                data-th-value="${entity?.sex}">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstNaturalPerson001.personId}">身份证号码</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" class="layui-input form-input" id="personId"
                                                name="personId" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" required="required"
                                                data-th-value="${entity?.personId}" maxlength="32">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstNaturalPerson001.phone}">办公电话</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" class="layui-input form-input" id="phone" name="phone"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                required="required" data-th-value="${entity?.phone}" maxlength="50">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstNaturalPerson001.mPhone}">移动电话</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" class="layui-input form-input" id="mPhone" name="mPhone"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.mPhone}" maxlength="50">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstNaturalPerson001.mail}">电子邮箱</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" class="layui-input form-input" id="mail" name="mail"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                required="required" data-th-value="${entity?.mail}" maxlength="50">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstNaturalPerson001.position}">职位</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" class="layui-input form-input" id="position"
                                                name="position" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.position}" maxlength="60">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstNaturalPerson001.address}">地址</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" class="layui-input form-input" id="address"
                                                name="address" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" required="required"
                                                data-th-value="${entity?.address}" style="width: 268%;" maxlength="60">
                                        </div>
                                    </div>
                                </div>
                                <input type="text" id="customerId" name="customerId" class="layui-input form-input"
                                    data-th-value="${entity?.customerId}" disabled=true style="display: none" />
                            </div>
                        </div>
                    </div>
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">工作单位</span>（<span class="star-sign">*</span> 必填）
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <label class="layui-form-label form-lable" style="width: 11.9%;">工作单位</label>
                                    <div class="layui-input-inline input-inline" style="width: 85%!important;">
                                        <textarea type="text" class="layui-textarea" id="companyName" name="companyName"
                                                  placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                  data-th-text="${entity?.companyName}" maxlength="60"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">财务状况</span>
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <label class="layui-form-label form-lable" style="width: 11.9%;">财务状况</label>
                                    <div class="layui-input-inline input-inline" style="width: 85%!important;">
                                    <textarea placeholder="请输入内容" id="property" name="property" class="layui-textarea"
                                              data-th-text="${entity?.property}"  maxlength="330"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="ramark_DIV" class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">备注</span>
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                        <textarea id="remark" name="remark" placeholder="请输入内容"
                                                  data-th-placeholder="#{SysCommon.placeholder}" class="layui-textarea"
                                                  data-th-text="${entity?.remark}" maxlength="330"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 30px 0;">
                    <div class="text-center">
                        <a id="MstNaturalPerson002_btn_save" class="layui-btn layui-btn-sm btn-save"
                           data-th-text="#{SysCommon.save}">保存</a>
                        <a id="MstNaturalPerson002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                           data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="MstNaturalPerson002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                           data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/basicdata/mstnaturalperson/MstNaturalPerson002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
