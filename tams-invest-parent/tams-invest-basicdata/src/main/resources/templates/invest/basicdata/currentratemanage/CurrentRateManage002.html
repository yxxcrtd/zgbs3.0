<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{CurrentRateManage002}">账户活期利率管理新建</title>
</head>
<body>
    <div layout:fragment="content">
        <fieldset class="layui-elem-field">
            <legend>账户信息</legend>
            <div class="layui-field-box">
                <form class="layui-form joyin-form-wrap " id="informationForm1">
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-xs6 layui-col-md6 layui-col-sm6 layui-col-lg6">
                            <label class="layui-form-label form-lable"
                                data-th-text="#{CurrentRateManage002.accountName}">账户名称</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="accountName" name="accountName" class="layui-input form-input"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-xs6 layui-col-md6 layui-col-sm6 layui-col-lg6">
                            <label class="layui-form-label form-lable" data-th-text="#{CurrentRateManage002.currency}">币种</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="currency" name="currency"
                                    class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
                                    readonly="readonly" required>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-xs6 layui-col-md6 layui-col-sm6 layui-col-lg6">
                            <label class="layui-form-label form-lable" data-th-text="#{CurrentRateManage002.effectDate}">生效日</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="effectDate" name="effectDate"
                                    class="layui-input form-input input-dateSelect" placeholder="请输入内容" required>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </fieldset>
        <fieldset class="layui-elem-field">
            <legend>利率信息</legend>
            <div class="layui-field-box">
                <form class="layui-form joyin-form-wrap " id="informationForm2">
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-xs6 layui-col-md6 layui-col-sm6 layui-col-lg6">
                            <label class="layui-form-label form-lable" data-th-text="#{CurrentRateManage002.rateType}">利率类型</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="rateType" name="rateType" class="layui-input form-input"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-xs6 layui-col-md6 layui-col-sm6 layui-col-lg6" id="rateDiv" style="display: none">
                            <label class="layui-form-label form-lable" data-th-text="#{CurrentRateManage002.rate}">利率</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="rate" name="rate" placeholder="请输入内容" data-pattern=""
                                    data-fixtype="2" class="layui-input form-input text-number">
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item" id="currentRateDiv" style="display: none">
                        <div class="layui-inline layui-col-xs6 layui-col-md6 layui-col-sm6 layui-col-lg6">
                            <label class="layui-form-label form-lable"
                                data-th-text="#{CurrentRateManage002.currentRate}">活期利率</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="currentRate" name="currentRate" class="layui-input form-input"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                            </div>
                        </div>
                        
                        <div class="layui-inline layui-col-xs3 layui-col-md3 layui-col-sm3 layui-col-lg3">
                            <label class="layui-form-label form-lable"
                                data-th-text="#{CurrentRateManage002.coefficient}">*系数</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="coefficient" name="coefficient" placeholder="请输入内容"
                                    data-pattern="" data-fixtype="2" class="layui-input form-input text-number">
                            </div>
                        </div>
                    
                        <div class="layui-inline layui-col-xs3 layui-col-md3 layui-col-sm3 layui-col-lg3">
                            <label class="layui-form-label form-lable" data-th-text="#{CurrentRateManage002.spread}">+利差(%)</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="spread" name="spread" placeholder="请输入内容" data-pattern=""
                                    data-fixtype="2" class="layui-input form-input text-number">
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </fieldset>
        <div class="layui-form-item" align="center">
            <a id="CurrentRateManage002_btn_save" class="layui-btn layui-btn-sm btn-save">保存</a>
            <a id="CurrentRateManage002_btn_submit" class="layui-btn layui-btn-sm  btn-submit">提交</a>
            <a id="CurrentRateManage002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel">取消</a>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/basicdata/currentratemanage/CurrentRateManage002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
