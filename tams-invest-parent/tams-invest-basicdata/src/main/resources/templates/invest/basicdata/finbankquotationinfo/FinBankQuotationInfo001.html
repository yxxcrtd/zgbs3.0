<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{FinBankQuotationInfo001}">银行间行情信息</title>
</head>

<body>
<div layout:fragment="content">
    <style type="text/css">
        /* 按钮长度 */
        .layui-btn-sm{
            width: 80px;
        }
        .layui-btn-sm-table {
            width: 50px;
        }

        /* 单个控件长度 */
        .form-inline-wrap {
            display: inline-block;
            float: left;
            width: 21%;
            padding-top: 10px;
        }
        /* 单个控件label长度 */
        .form-label-wrap {
            color: #444;
            line-height: 28px;
            padding: 0 10px 0 0;
            width: 26%;
        }
        /* 单个控件按钮长度 */
        .form-inline-wrap-btn {
            display: inline-block;
            float: left;
            width: 10%;
        }
        /* 下拉框长度 */
        .select2-container--default{
            width: 161px !important;
        }

        /* 放大镜特殊处理 */
        .iconfont {
            font-size: 21px;
        }


        /* 焦点选中颜色 */
        tr.layui-table-hover {
            background: #f2f2f2 !important;
        }
        /* 鼠标点击颜色 */
        .layui-table tbody .table-row-select, .layui-table[lay-even] .table-row-select:nth-child(even) {
            background-color: #33dee4 !important;
        }
        /* 表格字体大小 */
        .layui-table-header .layui-table-cell{
            font-weight: bolder;
        }
    </style>


    <div class="layui-tab layui-tab-brief" lay-filter="docDemoTabBrief">
        <ul class="layui-tab-title">
            <li class="layui-this">质押式回购行情</li>
            <li>买断式回购行情</li>
        </ul>
        <div class="layui-tab-content">
            <!-- 质押式回购行情 -->
            <div class="layui-tab-item layui-show">
                <div class='layui-fluid'>
                    <div class="layui-col-md12 form-button-area"></div>
                    <div >
                        <form class="layui-form" id="dvpTransferForm">
                            <input type="hidden" class="layui-input form-input" name="loginTraderId" th:value="${loginTraderId}"/>
                            <div class="layui-col-md12">

                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="交易品种">交易品种</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="tradeVarietyZ" name="tradeVarietyZ" class="layui-input form-input input-select"
                                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" maxlength="60"
                                                    data-th-initValue="${entity?.tradeVariety}" data-th-data-result='${TRADE_VARIETY_Z}'
                                                    formatoption = true></select>
                                        </div>
                                    </div>
                                    <div class=form-inline-wrap>
                                        <div class="layui-input-block">
                                            <input type="radio" name="hqType"  value="0"  title="R" checked>
                                            <input type="radio" name="hqType"  value="37" title="DR" >
                                        </div>
                                    </div>

                                    <div class="layui-inline" style="float: left;">
                                        <a id="FinBankQuotationInfo001_btn_zySearch" class="layui-btn layui-btn-sm btn-search">查询</a>
                                    </div>
                                </div>


                            </div>
                        </form>
                    </div>
                    <div>
                        <table class="layui-table" id="dvpTransferTable"></table>
                    </div>
                </div>
            </div>

            <!-- 买断式回购行情 -->
            <div class="layui-tab-item">
                <div class='layui-fluid'>
                    <div class="layui-col-md12 form-button-area substitutionSearchDiv">
                    </div>
                    <div>
                        <form class="layui-form" id="transferForm">
                            <input type="hidden" class="layui-input form-input" name="loginTraderId" th:value="${loginTraderId}"/>
                            <div class="layui-col-md12">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="交易品种">交易品种</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="tradeVarietyM" name="tradeVarietyM" class="layui-input form-input input-select"
                                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" maxlength="60"
                                                    data-th-initValue="${entity?.tradeVariety}" data-th-data-result='${TRADE_VARIETY_M}' formatoption = true></select>
                                        </div>
                                    </div>
                                    <div class=form-inline-wrap>
                                        <div class="layui-input-block">
                                            <input type="radio" name="hqType"  value="0"  title="R" checked>
                                        </div>
                                    </div>
                                    <div class="layui-inline" style="float: left;">
                                        <a id="FinBankQuotationInfo001_btn_mdSearch" class="layui-btn layui-btn-sm btn-search">查询</a>
                                    </div>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div>
                        <table class="layui-table" id="transferTable"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
<div layout:fragment="script">
    <script type="text/javascript" data-th-src="@{/public/js/message}"></script>
    <script data-th-inline="javascript" type="text/javascript">
        var ps_pay_name = /*[[${ps_pay_name}]]*/'';
        var ps_sell_name = /*[[${ps_sell_name}]]*/'';
        var quoteRoleTypeFZS = /*[[${quoteRoleTypeFZS}]]*/'';
    </script>

    <script data-th-src="@{/js/invest/basicdata/finbankquotationinfo/FinBankQuotationInfo001.js}" type="text/javascript"></script>
</div>
</body>

</html>
