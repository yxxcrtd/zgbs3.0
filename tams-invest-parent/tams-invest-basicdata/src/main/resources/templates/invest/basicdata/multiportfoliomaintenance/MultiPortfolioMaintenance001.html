<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{MultiPortfolioMaintenance001}">多组合维护</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid' style="padding-left:1px">
        <div class="layui-form-item" style="width:18%;float: left;border-right: 1px solid #ccc;min-height:460px;">
            <form class="layui-form  pro-module-form" style="background: #fff">
                <div class="layui-form-item" style="margin-left: 10px;padding-bottom:8px" >
                    <div class="layui-input-inline input-inline"
                         style="width: 95% !important">
                        <input type="text" id="treeName" name="treeName"
                               class="layui-input form-input input-fuzzy-text"
                               placeholder="输入名称关键字"
                               data-eventfunc="serachKey">
                    </div>
                </div>
                <div th:if="${entity} == null" data-checkall="false" data-checkable="false" style="scroll-y: auto; scroll-x: hidden;height:670px" id='treeIndPortf'  data-canedit='1' data-roottitle='列表信息' >
                </div>
            </form>
        </div>
        <div class="layui-col-lg9" style="width:81%">
            <div class="layui-col-md12" style="margin: 10px;" filter="false">
                <a id="MultiPortfolioMaintenance001_btn_add" class="layui-btn layui-btn-sm btn-create"
                   data-th-text="#{SysCommon.create}">新建</a>
                <a id="MultiPortfolioMaintenance001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
                   data-th-text="#{SysCommon.delete}">删除</a>
            </div>
            <div>
                <form class="layui-form" id="searchForm">
                    <input type="hidden" id="indId">
                    <input type="hidden" id="indName">
                </form>
            </div>

            <div>
                <table class="layui-table" id="dataIndTable"></table>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <style type="text/css">
        .mixtree-div i.icon-showorder{
            display: none;
        }
        .mixtree-div a.portBagAddAicon,a.refreshAicon{
            float: right;
            padding-right: 10px;
            color:#90C321;
            height:30px;
            line-height:28px;
            cursor: pointer;
        }
        .layui-form-radio {
            line-height: 14px !important
        }
        .layui-form-radio>i {
            font-size: 16px !important
        }
        .manage-info-item li {
            float: left;
            padding-right: 15px;
            line-height: 24px;
        }
        .manage-info-item {
            float: left;
            padding-right: 10px;
        }
        .layui-fluid{
            padding-left:0px;
            padding-right:0px;
        }
        div.input-btn-append a {
            line-height: 20px !important
        }
        a.portBagAicon{
            display:inline-block!important;
            height:20px!important;
            line-height: 20px!important;
            width:92%;
            margin-left:10px!important;
        }
        li.portBagLi:hover,li.active,li.active:hover{
            background: #D9ECFF
        }
        li.portBagLi:hover{
            background: #FFFFCA
        }
        li.portBagLi i{
            font-size:15px;
        }
        li.portBagLi i:hover{
            background: #B7DBFA
        }
        .width30{
            width:30%;
        }
    </style>
    <script data-th-inline="javascript" type="text/javascript">
        var getAllRelationUrl = /*[[@{/invest/basicdata/multiportfoliomaintenance/MultiPortfolioMaintenance001/getMutiptlPortfolioTree}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/basicdata/multiportfoliomaintenance/MultiPortfolioMaintenance001.js}"></script>
</div>
</body>
</html>
