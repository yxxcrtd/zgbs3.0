<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<title data-th-text="#{MstMarketManagement002}">评级信息新建</title>
    <style>
        .mst-textarea{
            min-height: auto;
        }
        .cus-table-wrap .layui-border-box{
            height: 180px;
        }
        .cus-table-wrap .layui-border-box .layui-table-box{
            height: 140px;
        }
        .cus-table-wrap .layui-border-box .layui-table-box .layui-table-body{
            height: 101px;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
                <div class="pro-module-wrapper pro-module-base">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">基本信息</span>（<span class="star-sign">*</span> 必填）
                                <em class="iconfont icon-arrow-down pro-down-icon"></em>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstMarketManagement001.oGreadeType}">对象类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="oType" name="oType" required allowClear="true"
                                                class="layui-input form-input input-select" data-th-data-result='${MAIN_GRADE_TYPE}'
                                                data-th-value="${entity?.oType}" />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable">对象名称</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="hidden" id="oCodeName" name="oCodeName" data-th-value='${entity?.oCodeName}'/>
                                            <select name="oCodeNameStr" id="oCodeNameStr" required="required" parentIds="oType"
                                                class="layui-input form-input input-select" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-url="@{/invest/basicdata/mstmarketmanagement/MstMarketManagement002/getCodeName}"
                                                data-th-initValue='${entity?.oCode}' >
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable">对象代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="oCode" name="oCode" required="required"
                                                   class="layui-input form-input" placeholder="请输入内容"
                                                   data-th-placeholder="#{SysCommon.placeholder}" disabled
                                                   data-th-value="${entity?.oCode}" />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" >评级日期</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="hidden" name="oldGradeDate" data-th-value="${entity?.oldGradeDate}">
                                            <input type="text" id="gradeDate" name="gradeDate" required
                                                   class="layui-input form-input input-dateSelect"
                                                   data-th-value="${entity?.gradeDate == null ? platDate : entity?.gradeDate}"/>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" >公告日期</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="noticeDate" name="noticeDate"
                                                   class="layui-input form-input input-dateSelect"  data-th-value = '${entity?.noticeDate}'/>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable">评级类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="shortLongTerm" name="shortLongTerm" required allowClear="true"
                                                   class="layui-input form-input input-select" data-th-data-result='${LONG_SHORT_TERM}'
                                                   data-th-value="${entity?.shortLongTerm}" />
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable">评级结果</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="hidden" name="oldGradeResult" data-th-value="${entity?.oldGradeResult}">
                                            <input type="text" id="gradeResult" name="gradeResult" required allowClear="true"
                                                   class="layui-input form-input input-select" data-th-data-result='${MAIN_GRADE_RESULT}'
                                                   data-th-value="${entity?.gradeResult}" />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable">评级机构</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="hidden" name="oldGradeOrgId" data-th-value="${entity?.oldGradeOrgId}">
                                            <input type="text" id="gradeOrgId" name="gradeOrgId" allowClear="true"
                                                   class="layui-input form-input input-select" data-th-data-result='${GRADE_PARTY}'
                                                   data-th-value="${entity?.gradeOrgId}" />
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item" id="oCodeType01">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable">评级展望</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="gradeExpectation" name="gradeExpectation" allowClear="true"
                                                   class="layui-input form-input input-select" data-th-data-result='${RATING_OUTLOOK}'
                                                   data-th-value="${entity?.gradeExpectation}" />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable">变动方向</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="directionChange" name="directionChange" allowClear="true"
                                                   class="layui-input form-input input-select" data-th-data-result='${CHANGE_DIRECTION}'
                                                   data-th-value="${entity?.directionChange}" />
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap oCodeType01">
                                        <label class="layui-form-label form-lable">内评/外评</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="gradeSourceType" name="gradeSourceType" allowClear="true"
                                                   class="layui-input form-input input-select"
                                                   data-result='[{"id":"01","text":"外部评级","col":""},{"id":"02","text":"内部评级","col":""}]'
                                                   data-th-value="${entity?.gradeSourceType}" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 30px 0;">
                        <div class="text-center">
                            <a id="MstMarketManagement002_btn_save" class="layui-btn layui-btn-sm btn-save"
                               data-th-text="#{SysCommon.save}">保存</a>
                            <a id="MstMarketManagement002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                               data-th-text="#{SysCommon.submit}">提交</a>
                            <a id="MstMarketManagement002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                               data-th-text="#{SysCommon.cancel}">取消</a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
            var LONG_SHORT_TERM = /*[[${LONG_SHORT_TERM}]]*/'';
            var MAIN_GRADE_RESULT = /*[[${MAIN_GRADE_RESULT}]]*/'';
            var RATING_OUTLOOK = /*[[${RATING_OUTLOOK}]]*/'';
            var CHANGE_DIRECTION = /*[[${CHANGE_DIRECTION}]]*/'';
            var GRADE_PARTY = /*[[${GRADE_PARTY}]]*/'';
            var MAIN_GRADE_TYPE_01 = /*[[${MAIN_GRADE_TYPE_01}]]*/'';
            var MAIN_GRADE_TYPE_02 = /*[[${MAIN_GRADE_TYPE_02}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/basicdata/mstmarketmanagement/MstMarketManagement002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
