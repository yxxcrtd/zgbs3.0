<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{MstFundBonusNotice001}">基金分红公告</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="layui-col-md12 form-button-area" style="margin: 10px;">
            <!-- <a id="MstFundBonusNotice001_btn_reset" class="layui-btn layui-btn-sm btn-reset" data-th-text="#{SysCommon.reset}">重置</a> -->
            <a id="MstFundBonusNotice001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}" >新建</a>
            <a id="MstFundBonusNotice001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}" >删除</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{MstFundBonusNotice001.fundId}">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <input  type="text" id="fundId" name="fundId"
                                    data-th-allowClear="true"
                                    class="layui-input form-input input-lenovoselect"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-url="@{/invest/asset/fund/FinFundTarget001/getFinprodMarketIdList}"
                                    data-idfield="code" data-keyfield="code"
                                    data-th-data-effectivefieldsalias='|{"code":"#{FinFundTarget001.finprodMarketId}",
									"shortName":"#{FinFundTarget001.finprodName}"}|'>

                        </div>
                    </div>

                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{MstFundBonusNotice001.delDate}">除权除息日</label>
                        <div class="layui-input-inline input-inline">
                            <input id="delDate" name="delDate"
                                   class="layui-input form-input input-dateRangeSelect"
                                   placeholder="请选择时间区间"/>
                        </div>
                    </div>

                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{MstFundBonusNotice001.devidentDate}">派息日</label>
                        <div class="layui-input-inline input-inline">
                            <input id="devidentDate" name="devidentDate"
                                   class="layui-input form-input input-dateRangeSelect"
                                   placeholder="请选择时间区间"/>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var sysDate = /*[[${sysDate}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/basicdata/mstfundbonusnotice/MstFundBonusNotice001.js}"></script>
</div>
</body>
</html>
