<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
<title data-th-text="#{MstOpicsParaMante002}">OPICS参数维护新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
                <div class="pro-module-wrapper pro-module-base">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstOpicsParaMante002.paraType}">参数类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="paraType" name="paraType" maxlength="32"
                                                required="required" class="layui-input form-input input-select"
                                                allowClear="true" placeholder="请输入内容"
                                                data-th-data-result='${OPICS_PARA_YPE}'
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.paraType}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstOpicsParaMante002.itemId}">项目代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="itemId" name="itemId" maxlength="50"
                                                required="required" class="layui-input form-input" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.itemId}" />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstOpicsParaMante002.itemName}">项目代码名称</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="itemName" name="itemName" maxlength="50"
                                                required="required" class="layui-input form-input" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.itemName}" />
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstOpicsParaMante002.itemValueCn}">项目值（中文）</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="itemValueCn" name="itemValueCn"
                                                class="layui-input form-input" required="required" maxlength="50"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.itemValueCn}" />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstOpicsParaMante002.itemValueEn}">项目值（英文）</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="itemValueEn" name="itemValueEn"
                                                class="layui-input form-input" required="required" maxlength="50"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.itemValueEn}" />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstOpicsParaMante002.orders}">排序</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="orders" name="orders" data-textrange=0
                                                class="layui-input form-input text-number" required="required"
                                                maxlength="3" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.orders}" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">备注</span>
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                        <textarea id="remark" name="remark" maxlength="200" placeholder="请输入内容"
                                                  data-th-placeholder="#{SysCommon.placeholder}" class="layui-textarea"
                                                  data-th-text="${entity?.remark}">
                                                    </textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                        <div class="text-center">
                            <a id="MstOpicsParaMante002_btn_save" class="layui-btn layui-btn-sm btn-save"
                               data-th-text="#{SysCommon.save}">保存</a>
                            <a id="MstOpicsParaMante002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                               data-th-text="#{SysCommon.submit}">提交</a>
                            <a id="MstOpicsParaMante002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                               data-th-text="#{SysCommon.cancel}">取消</a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/basicdata/mstopicsparamante/MstOpicsParaMante002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
