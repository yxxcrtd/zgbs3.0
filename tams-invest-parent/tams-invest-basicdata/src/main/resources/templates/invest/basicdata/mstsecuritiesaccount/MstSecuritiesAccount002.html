<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{MstSecuritiesAccount002}">证券账户新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <div class="pro-module-wrapper pro-module-base" style="border-top: none;">
            <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            	<input type="hidden" id="pageModel" name="pageModel" th:value="${entity?.pageModel}" />
                <input type="hidden" id="registOrgContrast" name="registOrgContrast" th:value="${entity?.registOrg}" />
                <input type="hidden" id="recAcctIdContrast" name="recAcctIdContrast" th:value="${entity?.recAcctId}" />
                <input type="hidden" id="trdAcctIdContrast" name="trdAcctIdContrast" th:value="${entity?.trdAcctId}" />
                <input type="hidden" id="tradePlaceContrast" name="tradePlaceContrast" th:value="${entity?.tradePlace}" />
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title" style="border-top: 1px solid #cccccc;">
                                <span class="title-des">基本信息</span>（<span class="star-sign">*</span> 必填）
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstSecuritiesAccount001.secAcctId}">证券账户账号</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="secAcctId" name="secAcctId"
                                                data-th-value='${entity?.secAcctId}'
                                                class="layui-input form-input form-input" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" required="required">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstSecuritiesAccount001.secAcctName}">证券账户名称</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="secAcctName" name="secAcctName"
                                                data-th-value='${entity?.secAcctName}'
                                                class="layui-input form-input form-input" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" required="required">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                             data-th-text="#{MstSecuritiesAccount001.registOrg}">托管机构</label>
                                   		 <div class="layui-input-inline input-inline">
                                             <select type="text" id="registOrg" name="registOrg"
                                                 data-th-initValue='${entity?.registOrg}'
                                                 class="layui-input form-input input-select"
                                                 data-th-data-result='${REGIST_ORG}' allowClear="true"
                                                 placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                 formatoption=true required="required">
                                             </select>
                                         </div>
                                    </div>
                                    
                                         
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstSecuritiesAccount001.recAcctId}">回款账户</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="recAcctId" name="recAcctId"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-url="@{/invest/basicdata/mstsecuritiesaccount/MstSecuritiesAccount002/getBusiAcctNo}"
                                                data-th-initValue="${entity?.recAcctId}" formatoption=true></select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstSecuritiesAccount002.trdAcctId}">资金结算账户</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="trdAcctId" name="trdAcctId"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                data-th-initValue='${entity?.trdAcctId}'
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-url="@{/invest/basicdata/mstsecuritiesaccount/MstSecuritiesAccount002/getBusiAcctNo}"
                                                required="required" allowClear="true" formatoption="true"></select>
                                        </div>
                                    </div>
                                 <div class="form-inline-wrap">
                                 	<label class="layui-form-label form-label-wrap"
                                             data-th-text="#{MstSecuritiesAccount001.tradePlace}">交易场所</label>
                                   		<div class="layui-input-inline input-inline"  style="display:none"  id="tradePlaceChange">
                                             <select type="text" id="tradePlace" name="tradePlace"
                                                 data-th-initValue='${entity?.tradePlace}'
                                                 class="layui-input form-input input-select"
                                                 data-th-data-result='${TRADE_PLACE}' allowClear="true" 
                                                 placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                 formatoption=true required="required" multiple="multiple">
                                             </select>
                                         </div>
                                          <div class="layui-input-inline input-inline" id="tradePlaceOld" >
                                             <select type="text" id="tradePlace2" name="tradePlace2"
                                                 data-th-initValue='${entity?.tradePlace}'
                                                 class="layui-input form-input input-select"
                                                 data-th-data-result='${TRADE_PLACE}' allowClear="true"
                                                 placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                 formatoption=true required="required">
                                             </select>
                                         </div>
                                         
                                         
                                     </div>
                                </div>
                                
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstSecuritiesAccount001.secAcctSource}">账户来源</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="secAcctSource" name="secAcctSource"
                                                data-th-initValue='${entity?.secAcctSource}'
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                data-th-data-result="${ACCOUNT_SOURCE}"
                                                data-th-placeholder="#{SysCommon.placeholder}" required="required">
                                            </select>
                                        </div>
                                    </div>
									<div id = "yNHkstockc_div" class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{MstSecuritiesAccount002.yNHkstockc}">是否开通港股通</label>
                                        <div class="layui-input-inline input-inline">
                                            <select name="yNHkstockc" id="yNHkstockc"
                                                    class="layui-input form-input input-select"
                                                    required="required"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue='${entity?.yNHkstockc}'
                                                    data-th-data-result="${Y_N_HKSTOCKC}" >
                                            </select>
                                        </div>
                                    </div>
                                    <!-- <div class="form-inline-wrap" id="futuresCompany_div" style="display: none">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstSecuritiesAccount001.futuresCompany}">期货公司</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="futuresCompany" name="futuresCompany"
                                                    data-th-initValue='${entity?.futuresCompany}'
                                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                                    data-th-data-url="@{/invest/basicdata/mstsecuritiesaccount/MstSecuritiesAccount002/getFuturesCompany}"
                                                    data-th-placeholder="#{SysCommon.placeholder}" required="required">
                                            </select>
                                        </div> -->
                                    <div class="form-inline-wrap" id="tradeNo_div" name="tradeNo_div">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{MstSecuritiesAccount001.tradeNo}">交易编码</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="tradeNo" name="tradeNo"
                                                data-th-value='${entity?.tradeNo}'
                                                class="layui-input form-input form-input" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" required="required" maxlength="12">
                                        </div>
                                    </div>
                                    <!-- 添加股东代码 start -->
                                	<div class="form-inline-wrap" id="bondId_div" name="bondId_div">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstSecuritiesAccount002.bondId}">股东代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="bondId" name="bondId"
                                                data-th-value='${entity?.bondId}'
                                                class="layui-input form-input form-input" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" required="required">
                                        </div>
                                	</div>
                                	<!-- 添加股东代码 end -->
                                	<!-- 添加券商名称 start -->
                                    <!--
                                	<div class="form-inline-wrap" id="brokerName_div" name="brokerName_div">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstSecuritiesAccount002.brokerName}">券商名称</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="brokerName" name="brokerName"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                data-th-initValue='${entity?.brokerName}'
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-url="@{/invest/basicdata/mstsecuritiesaccount/MstSecuritiesAccount002/getBrokerName}"
                                                required="required" allowClear="true" formatoption="true"></select>
                                        </div>
                                    </div>
                                    -->
                                    <!-- 添加券商名称end -->
                                </div>
                                
                            </div>
                        </div>
                    </div>
                    <!-- 引业务组件附件信息组件 -->
                    <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                        th:data-params="|{entityName: 'fileCommonDto', businessId: '${entity?.secAcctId ?: ''}'}|"></div>
                    <div id="ramark_DIV" class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">备注</span>
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                        <textarea id="remark" name="remark" placeholder="请输入内容"
                                                  data-th-placeholder="#{SysCommon.placeholder}" class="layui-textarea"
                                                  data-th-text="${entity?.remark}"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="layui-col-xs11 layui-col-md11 layui-col-sm11 layui-col-lg11" style="margin: 30px;">
                        <div class="text-center">
                            <a id="MstSecuritiesAccount002_btn_save" class="layui-btn layui-btn-sm btn-save"
                               data-th-text="#{SysCommon.save}">保存</a>
                            <a id="MstSecuritiesAccount002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                               data-th-text="#{SysCommon.submit}">提交</a>
                            <a id="MstSecuritiesAccount002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                               data-th-text="#{SysCommon.cancel}">取消</a>
                        </div>
                    </div>
            </form>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script th:inline="javascript">
            var isDoubleRecord = /*[[${isDoubleRecord}]]*/'';
            var isFirstApprovalNode = /*[[${isFirstApprovalNode}]]*/'';
            var isDoubleInput = 'N';
        </script>
        <script data-th-src="@{/js/invest/basicdata/mstsecuritiesaccount/MstSecuritiesAccount002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
