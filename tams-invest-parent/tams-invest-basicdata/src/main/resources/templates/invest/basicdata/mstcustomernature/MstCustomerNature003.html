<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<title data-th-text="#{MstCustomerNature003}">客户性质修改</title>
<style>
.layui-table{
   width:100%!important;
}
</style>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
                <div class="pro-module-wrapper pro-module-base">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">基本信息</span>
                                （
                                <span class="star-sign">*</span>
                                必填）
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstCustomerNature003.customerId}">代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="customerId" name="customerId"
                                                class="layui-input form-input" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.customerId}" maxlength="60" />
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{MstCustomerNature003.customerName}">名称</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="customerName" name="customerName"
                                                class="layui-input form-input" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.customerName}" maxlength="60" />
                                        </div>
                                    </div>
                                    <input type="hidden" id="customerType" name="customerType"
                                        class="layui-input form-input" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}"
                                        data-th-value="${entity?.customerType}" maxlength="60" />
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des" data-th-text="#{MstCustomerNature003.customerCharater}">客户性质</span>
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <table class="layui-table" id="dataTable"></table>
                            </div>
                        </div>
                    </div>
                    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="position: fixed;bottom: 30px;">
                        <div class="text-center">
                            <a id="MstCustomerNature003_btn_save" class="layui-btn layui-btn-sm btn-save"
                               data-th-text="#{SysCommon.save}">保存</a>
                            <a id="MstCustomerNature003_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                               data-th-text="#{SysCommon.submit}">提交</a>
                            <a id="MstCustomerNature003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                               data-th-text="#{SysCommon.cancel}">取消</a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
                                    var CUSTOMER_NATURE = /*[[${CUSTOMER_NATURE}]]*/'';
                                    var entityData = JSON.parse(/*[[${entityDate}]]*/'{}');
                                    var CUSTOMER_NATURE_01 = /*[[${CUSTOMER_NATURE_01}]]*/'01';
                                    var CUSTOMER_NATURE_02 = /*[[${CUSTOMER_NATURE_02}]]*/'02';
                                    var CUSTOMER_NATURE_03 = /*[[${CUSTOMER_NATURE_03}]]*/'03';
                                    var CUSTOMER_NATURE_04 = /*[[${CUSTOMER_NATURE_04}]]*/'04';
                                    var CUSTOMER_NATURE_05 = /*[[${CUSTOMER_NATURE_05}]]*/'05';
                                    var CUSTOMER_NATURE_06 = /*[[${CUSTOMER_NATURE_06}]]*/'06';
                                    var CUSTOMER_NATURE_07 = /*[[${CUSTOMER_NATURE_07}]]*/'07';
                                    var CUSTOMER_NATURE_08 = /*[[${CUSTOMER_NATURE_08}]]*/'08';
                                    var CUSTOMER_NATURE_09= /*[[${CUSTOMER_NATURE_09}]]*/'09';
                                    var CUSTOMER_NATURE_10= /*[[${CUSTOMER_NATURE_10}]]*/'10';
                                    var CUSTOMER_NATURE_12= /*[[${CUSTOMER_NATURE_12}]]*/'12';
                                    var CUSTOMER_NATURE_13= /*[[${CUSTOMER_NATURE_13}]]*/'13';
                                    var CUSTOMER_TYPE_01 = /*[[${CUSTOMER_TYPE_01}]]*/'';
                        			var CUSTOMER_TYPE_02 = /*[[${CUSTOMER_TYPE_02}]]*/'';
                                </script>
        <script data-th-src="@{/js/invest/basicdata/mstcustomernature/MstCustomerNature003.js}" type="text/javascript"></script>
    </div>
</body>
</html>
