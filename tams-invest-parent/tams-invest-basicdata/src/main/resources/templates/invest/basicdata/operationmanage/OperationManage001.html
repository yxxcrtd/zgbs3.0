<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{OperationManage001}">运营管理</title>
</head>
<body>
    <div layout:fragment="content">
    	<div class="layui-tab layui-tab-brief" lay-filter="docDemoTabBrief">
		  <ul class="layui-tab-title">
		    <li class="layui-this">组合持仓查询</li>
		    <li>组合现金流水查询</li>
		    <li>交易资金指令查询</li>
		  </ul>
			  <div class="layui-tab-content">
			  <!-- 组合持仓查询 -->
			  	<div class="layui-tab-item layui-show">
			  		<div class="form-button-area"></div>
			        <div class="joyin-form-wrap joyin-filter-form condition-area">
			            <form class="layui-form" id="searchForm">
			                <div class="layui-form-item">
			                    <div class="layui-inline  layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
			                        <label class="layui-form-label form-lable"
			                            data-th-text="#{OperationManage001.portfolioId}">组合代码</label>
			                        <div class="layui-input-inline input-inline">
	                            		<input type="text" id="portfolioId" name="portfolioId" 
		                      				class="layui-input form-input input-lenovoselect" placeholder="请输入内容" 
		                      				data-th-placeholder="#{SysCommon.placeholder}" 
		                      				data-th-data-url="@{/invest/basicdata/operationmanage/OperationManage001/getPortfolioId}" 
		                      				data-idfield="code" data-keyfield="code"
		                      				data-th-data-effectivefieldsalias='|{"code":"#{OperationManage001.portfolioId}","shortName":"#{OperationManage001.portfolioName}"}|'>
			                    	
			                        </div>
			                    </div>
			                    <div class="layui-inline  layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
			                        <label class="layui-form-label form-lable" data-th-text="|#{OperationManage001.secAcctId}#{invest.channelId}#{ChannelAsset002.finprodIdBak}|">证券管理账户/通道代码</label>
			                        <div class="layui-input-inline input-inline">
			                            <input type="text" id="secAcctId" name="secAcctId"
			                                class="layui-input form-input" placeholder="请输入内容"
			                                data-th-placeholder="#{SysCommon.placeholder}" />
			                        </div>
			                    </div>
			                    <div class="layui-inline  layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
			                        <label class="layui-form-label form-lable" data-th-text="#{OperationManage001.finprodId}">金融资产代码</label>
			                        <div class="layui-input-inline input-inline">
		                                <input type="text" id="finprodId" name="finprodId"
			                                class="layui-input form-input" allowClear="true" placeholder="请输入内容"/>
			                        </div>
			                    </div>
			                </div>
			                <div class="layui-form-item">
			                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
			                        <label class="layui-form-label form-lable"
			                            data-th-text="#{OperationManage001.yesOrNo}">是否在途</label>
			                        <div class="layui-input-inline input-inline">
		                            	<input type="text" id="yesOrNo" name="yesOrNo"
			                                class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容" 
			                                data-th-data-result='${YES_OR_NO}'
			                            	formatoption = true/>
			                        </div>
			                    </div>
			                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
			                        <label class="layui-form-label form-lable"
			                            data-th-text="#{OperationManage001.cdate}">日期</label>
			                        <div class="layui-input-inline input-inline">
			                        	<input type="text" id="cdate" name="cdate"
			                                class="layui-input form-input input-dateRangeSelect" placeholder="请选择、支持区间"
			                                data-th-placeholder="#{SysCommon.dateInterval}">    
			                        </div>
			                    </div>
			                </div>
			            </form>
			        </div>
			        <div>
			            <table class="layui-table" id="dataTable" data-target="#getdataTable"></table>
			        </div>
			  	</div>
			  	<!-- 组合现金流水查询 -->
	    		<div class="layui-tab-item">
	    			<div class="form-button-area"></div>
			        <div class="joyin-form-wrap joyin-filter-form condition-area">
			            <form class="layui-form" id="searchForm1">
			                <div class="layui-form-item">
			                    <div class="layui-inline  layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
			                        <label class="layui-form-label form-lable"
			                            data-th-text="#{OperationManage001.portfolioId}">组合代码</label>
			                        <div class="layui-input-inline input-inline">
			                            <input type="text" id="portfolioId1" name="portfolioId1" 
		                      				class="layui-input form-input input-lenovoselect" placeholder="请输入内容" 
		                      				data-th-placeholder="#{SysCommon.placeholder}" 
		                      				data-th-data-url="@{/invest/basicdata/operationmanage/OperationManage001/getPortfolioId1}" 
		                      				data-idfield="code" data-keyfield="code"
		                      				data-th-data-effectivefieldsalias='|{"code":"#{OperationManage001.portfolioId}","shortName":"#{OperationManage001.portfolioName}"}|'>
			                    	
			                        </div>
			                    </div>
			                    <div class="layui-inline  layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
			                        <label class="layui-form-label form-lable" data-th-text="#{OperationManage001.seqno}">流水号</label>
			                        <div class="layui-input-inline input-inline">
			                            <input type="text" id="seqno" name="seqno"
			                                class="layui-input form-input" placeholder="请输入内容"
			                                data-th-placeholder="#{SysCommon.placeholder}" />
			                        </div>
			                    </div>
			                    <div class="layui-inline  layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
			                        <label class="layui-form-label form-lable" data-th-text="#{OperationManage001.acctId}">账号</label>
			                        <div class="layui-input-inline input-inline">
			                            <input type="text" id="acctId" name="acctId"
			                                class="layui-input form-input" placeholder="请输入内容"
			                                data-th-placeholder="#{SysCommon.placeholder}" />
			                        </div>
			                    </div>
			                </div>
			                <div class="layui-form-item">
			                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
			                        <label class="layui-form-label form-lable"
			                            data-th-text="#{OperationManage001.cashType}">现金类型</label>
			                        <div class="layui-input-inline input-inline">
			                            <input type="text" id="cashType" name="cashType"
			                                class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容" 
			                                data-th-data-result='${POSITION_TYPE}'
			                            	formatoption = true/>
			                        </div>
			                    </div>
			                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
			                        <label class="layui-form-label form-lable"
			                            data-th-text="#{OperationManage001.ccy}">币种</label>
			                        <div class="layui-input-inline input-inline">
			                            <input type="text" id="ccy" name="ccy"
			                                class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容" 
			                                data-th-data-result='${CCY}'
			                                th:initValue="${CCY_default}"
			                                formatoption = true/>
			                        </div>
			                    </div>
			                    <div class="layui-inline  layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
			                        <label class="layui-form-label form-lable" data-th-text="#{OperationManage001.cdate1}">发生日期</label>
			                        <div class="layui-input-inline input-inline">
			                            <input type="text" id="cdate1" name="cdate1"
			                                class="layui-input form-input input-dateRangeSelect" placeholder="请选择、支持区间"
			                                data-th-placeholder="#{SysCommon.dateInterval}">
			                        </div>
			                    </div>
			                </div>
			            </form>
			        </div>
			        <div>
			            <table class="layui-table" id="dataTable1" data-target="#getdataTable1"></table>
			        </div>
			    </div>
			    <!-- 交易资金指令查询 -->
	    		<div class="layui-tab-item">
	    			<div class="form-button-area"></div>
			        <div class="joyin-form-wrap joyin-filter-form condition-area">
			            <form class="layui-form" id="searchForm2">
			                <div class="layui-form-item">
								<div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
			                         <label class="layui-form-label form-lable"
											data-th-text="#{OperationManage001.portfolioId}">组合代码</label>
			                        <div class="layui-input-inline input-inline">
			                            <input type="text" id="portfolioId2" name="portfolioId2"
											   class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
											   data-th-placeholder="#{SysCommon.placeholder}"
											   data-th-data-url="@{/invest/basicdata/operationmanage/OperationManage001/getPortfolioId1}"
											   data-idfield="code" data-keyfield="code"
											   data-th-data-effectivefieldsalias='|{"code":"#{OperationManage001.portfolioId}","shortName":"#{OperationManage001.portfolioName}"}|'>

			                        </div>
			                    </div>
			                    <div class="layui-inline  layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
			                        <label class="layui-form-label form-lable"
			                            data-th-text="#{OperationManage001.orderId}">指令编号</label>
			                        <div class="layui-input-inline input-inline">
			                            <!-- <select type="text" name="finprodIdList"
			                                    class="finprodIdList1 layui-input form-input input-select" allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
			                            		formatoption = true
			                            		multiple=true
			                            		data-th-data-url="@{/invest/report/informationdisclosureform/repfinproductexpiration/RepFinProductExpiration001/getPortfolioId}" >
			                            		</select> -->
	                            		<input type="text" id="orderId" name="orderId"
			                                class="layui-input form-input" placeholder="请输入内容"
			                                data-th-placeholder="#{SysCommon.placeholder}" />
			                    	
			                        </div>
			                    </div>
								<div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
			                        <label class="layui-form-label form-lable"
										   data-th-text="#{OperationManage001.ps}">收付方向</label>
			                        <div class="layui-input-inline input-inline">
			                            <input type="text" id="ps" name="ps"
											   class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
											   data-th-data-result='${IE_FLAG}'
											   formatoption = true/>
			                        </div>
			                    </div>
			                    <!--<div class="layui-inline  layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">-->
			                        <!--<label class="layui-form-label form-lable" data-th-text="#{OperationManage001.orderType}">指令类型</label>-->
			                        <!--<div class="layui-input-inline input-inline">-->
			                            <!--<input type="text" id="orderType" name="orderType"-->
			                                <!--class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"-->
			                                <!--data-th-data-result='${ORDER_TYPE}'-->
			                                <!--formatoption = true/>-->
			                        <!--</div>-->
			                    <!--</div>-->
			                </div>
			                <div class="layui-form-item">
								<div class="layui-inline  layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
			                        <label class="layui-form-label form-lable" data-th-text="#{OperationManage001.settleDate}">结算日期</label>
			                        <div class="layui-input-inline input-inline">
			                            <input type="text" id="settleDate" name="settleDate"
											   class="layui-input form-input input-dateRangeSelect" placeholder="请选择、支持区间"
											   data-th-placeholder="#{SysCommon.dateInterval}">
			                        </div>
			                    </div>
			                	<div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
			                        <label class="layui-form-label form-lable"
			                            data-th-text="#{OperationManage001.bussType}">业务类型</label>
			                        <div class="layui-input-inline input-inline">
			                            <input type="text" id="bussType" name="bussType"
			                                class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容"
			                                data-th-data-result='${PINAN_BUSINESS_TYPE}'
			                                formatoption = true/>
			                        </div>
			                    </div>
			                </div>
			            </form>
			        </div>
			        <div>
			            <table class="layui-table" id="dataTable2" data-target="#getdataTable2"></table>
			        </div>
			    </div>
			</div>
    	</div> 
	</div>
	<div layout:fragment="script">
	        <script data-th-src="@{/js/invest/basicdata/operationmanage/OperationManage001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
