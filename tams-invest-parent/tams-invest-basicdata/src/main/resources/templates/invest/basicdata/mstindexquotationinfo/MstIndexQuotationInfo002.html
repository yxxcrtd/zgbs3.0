<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{MstIndexQuotationInfo002}">指数行情信息新建</title>
    <style>
        .mst-lable{
            width: 20%;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable"
                               data-th-text="#{MstIndexQuotationInfo001.indexName}">指数</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="marketId" name="marketId"
                                   class="layui-input form-input input-select"
                                   data-th-initValue='${entity?.marketId}' formatoption=true
                                   data-th-data-result='${INDEX_DATA}' required placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable"
                               data-th-text="#{MstIndexQuotationInfo001.relaeseDate}">发布日</label>
                        <div class="layui-input-inline input-inline">
                            <input id="relaeseDate" name="relaeseDate"
                                   class="layui-input form-input input-dateSelect"
                                   data-th-value='${#dates.format(entity?.relaeseDate,"yyyy-MM-dd")}'
                                   placeholder="请输入日期" required="required">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable"
                               data-th-text="#{MstIndexQuotationInfo001.closePrice}">收盘价</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="closePrice" name="closePrice" maxLength="30"
                                   data-th-value='${entity?.closePrice}' required="required"
                                   placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                   class="layui-input form-input text-number" />
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable"
                               data-th-text="#{MstIndexQuotationInfo001.openPrice}">开盘价</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="openPrice" maxLength="30" name="openPrice"
                                   data-th-value='${entity?.openPrice}' required="required"
                                   placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                   class="layui-input form-input text-number" />
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable"
                               data-th-text="#{MstIndexQuotationInfo001.effDate}">生效日</label>
                        <div class="layui-input-inline input-inline">
                            <input id="effDate" name="effDate"
                                   class="layui-input form-input input-dateSelect" required
                                   data-th-value='${#dates.format(entity?.effDate,"yyyy-MM-dd")}'
                                   placeholder="请输入日期">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable"
                               data-th-text="#{MstIndexQuotationInfo001.maxPrice}">最高价</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="maxPrice" name="maxPrice" maxLength="30"
                                   required="required" data-th-value='${entity?.maxPrice}'
                                   placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                   class="layui-input form-input text-number" />
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable"
                               data-th-text="#{MstIndexQuotationInfo001.minPrice}">最低价</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="minPrice" name="minPrice" maxLength="30"
                                   required="required" data-th-value='${entity?.minPrice}'
                                   placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                   class="layui-input form-input text-number" />
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable"
                               data-th-text="#{MstIndexQuotationInfo001.pClosePrice}">前收盘价</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="pClosePrice" name="pClosePrice" maxLength="30"
                                   data-th-value='${entity?.pClosePrice}' required="required"
                                   placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                   class="layui-input form-input text-number" />
                        </div>
                    </div>
                </div>
            </form>
            <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="position: fixed;bottom: 30px;">
                <div class="text-center">
                    <a id="MstIndexQuotationInfo002_btn_save" class="layui-btn layui-btn-sm btn-save"
                       data-th-text="#{SysCommon.save}">保存</a>
                    <a id="MstIndexQuotationInfo002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                       data-th-text="#{SysCommon.submit}">提交</a>
                    <a id="MstIndexQuotationInfo002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                       data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/basicdata/mstindexquotationinfo/MstIndexQuotationInfo002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
