<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title data-th-text="#{StlSecReconPara002}">对账参数设置-新建</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm" style="padding:0 0 5px 0;">
        <input id="workflowId" name="workflowId" data-th-value="${workflowId}" type="hidden">
        <input id="seqNo" name="seqNo" data-th-value="${entity?.seqNo}" type="hidden">
        <!--        一行控件开始 -->
        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-label-wrap"
                       data-th-text="#{StlSecReconPara002.customerId}">券商代码</label>
                <div class="layui-input-inline input-inline">
                    <select required type="text" id="customerId" name="customerId"
                            class="layui-input form-input input-select" placeholder="请输入内容"
                            th:placeholder="#{SysCommon.placeholder}"
                            th:data-url="@{/invest/basicdata/stlsecreconpara/StlSecReconPara001/findAllBrokerIdsSelect}" allowClear="true"
                            formatoption="true"
                            th:initValue="${entity?.customerId}"></select>
                    </select>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable"
                       data-th-text="#{StlSecReconPara002.paraCode}">参数名称</label>
                <div class="layui-input-inline input-inline">
                    <select type="text" id="paraCode" name="paraCode"
                            class="layui-input form-input input-select"
                            th:placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                            th:formatoption="false" data-th-data-result='${RECON_PARA_CODE}'
                            data-th-initValue="${entity?.paraCode}"
                    >
                    </select>
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-lable"
                       data-th-text="#{StlSecReconPara002.paraValue}">参数值</label>
                <!--默认情况下显示文本框-->
                <div id="DIV_paraValue01" class="layui-input-inline input-inline">
                    <input type="text" th:id="paraValue1" th:name="paraValue1"
                           data-textrange="2"
                           data-fixtype="2"
                           data-th-value="${entity?.deviation}"
                           class="layui-input form-input text-number" placeholder="请输入内容"
                           data-th-placeholder="#{SysCommon.placeholder}"/>
                </div>
                <!--当参数使用对账维度时-->
                <div id="DIV_paraValue02" class="layui-input-inline input-inline" style="display: none">
                    <select type="text" id="paraValue2" name="paraValue2"
                            class="layui-input form-input input-select"
                            th:placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                            th:formatoption="false" data-th-data-result='${RECON_DEME}'
                            data-th-initValue="${entity?.paraValue}"
                    >
                    </select>
                </div>
                <!--当参数使用佣金对账方式时-->
                <div id="DIV_paraValue03" class="layui-input-inline input-inline" style="display: none">
                    <select type="text" id="paraValue3" name="paraValue3"
                            class="layui-input form-input input-select"
                            th:placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                            th:formatoption="false" data-th-data-result='${COMMISSION_TYPE}'
                            data-th-initValue="${entity?.paraValue}"
                    >
                    </select>
                </div>
            </div>
        </div>
<!--        <div class="layui-form-item">-->
<!--            <div class="form-inline-wrap">-->
<!--                <label class="layui-form-label form-lable"-->
<!--                       data-th-text="#{StlSecReconPara002.configDate}">配置日期</label>-->
<!--                <div class="layui-input-inline input-inline">-->
<!--                    <input type="text" id="configDate" name="configDate" class="layui-input form-input input-dateSelect"-->
<!--                           placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"-->
<!--                           data-th-value='${#dates.format(entity?.configDate?:iPlatformDate,"yyyy-MM-dd")}'-->
<!--                           formatoption=true/>-->
<!--                </div>-->
<!--            </div>-->
<!--        </div>-->
    </form>
    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
        <div class="text-center">
<!--            <a id="StlSecReconPara002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>-->
            <a id="StlSecReconPara002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="StlSecReconPara002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        // 参数代码_误差值
        var RECON_PARA_CODE_01  = /*[[${RECON_PARA_CODE_01}]]*/'';
        // 参数代码_对账维度
        var RECON_PARA_CODE_02  = /*[[${RECON_PARA_CODE_02}]]*/'';
        // 参数代码_佣金对账方式
        var RECON_PARA_CODE_03  = /*[[${RECON_PARA_CODE_03}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/basicdata/stlsecreconpara/StlSecReconPara002.js}" type="text/javascript"></script>
</div>
</body>
