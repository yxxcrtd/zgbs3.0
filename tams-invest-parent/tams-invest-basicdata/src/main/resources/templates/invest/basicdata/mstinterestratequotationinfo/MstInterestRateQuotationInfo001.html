<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{MstInterestRateQuotationInfo001}">基准利率信息</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-xs12 layui-col-md12 layui-col-sm12 layui-col-lg12 form-button-area" style="margin:10px;">
				<a id="MstInterestRateQuotationInfo001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}" >新建</a>
		        <a id="MstInterestRateQuotationInfo001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}" style="display:none;">删除</a>
				<a id="MstInterestRateQuotationInfo001_btn_import" class="layui-btn layui-btn-sm btn-import btn-default">导入</a>
	   		</div>
	   		<div class='joyin-form-wrap joyin-filter-form condition-area'>
	   		<form class="layui-form" id="searchForm" >
	        	<div class="layui-form-item">
	                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
	                    <label class="layui-form-label form-lable" data-th-text="#{MstInterestRateQuotationInfo001.intRateName}">利率名称</label>
	                    <div class="layui-input-inline input-inline">
<!-- 	                    	<input id="intRateId" name="intRateId" type="text" class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${SECRATE_DATA}" formatoption = true>
 -->	                        <select type="text" id="intRateId" name="intRateId" 
                                        class="layui-input form-input input-select" 
                                        data-th-data-result='${SECRATE_DATA}' allowClear="true" 
                                        placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                        formatoption = "true" >
                                   <option></option>                             
                                </select>
                        </div>
	                </div>
	                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
	                    <label class="layui-form-label form-lable" data-th-text="#{MstInterestRateQuotationInfo001.relaeseDate}">发布日</label>
	                    <div class="layui-input-inline input-inline">
	                    	<input id="releaseDate" name="releaseDate" class="layui-input form-input input-dateSelect" data-th-data-result='${COMMON_BUSINESS_TYPE}' placeholder="请选择时间" >
	                    </div>
	                </div>
	                </div>
	        </form>
	   		</div>
	        <div>
	            <table class="layui-table" id="dataTable"></table>
	        </div>
		</div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/basicdata/mstinterestratequotationinfo/MstInterestRateQuotationInfo001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
