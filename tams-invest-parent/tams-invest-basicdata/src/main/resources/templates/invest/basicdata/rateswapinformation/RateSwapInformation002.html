<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>利率互换行情信息</title>
    <style>
        .ptl-table .layui-table-view{
            height: 490px!important;
        }
        .ptl-table .layui-table-body{
            height: 405px!important;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div>
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <input type="hidden" id="workflowId" name="workflowId"th:value="${entity?.workflowId}" /> 
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">品种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="curveCode" name="curveCode" class="layui-input form-input input-select"
                                                data-th-data-url="@{/invest/basicdata/rateswapinformation/RateSwapInformation002/getCurveType}"
                                                th:allowClear="true" th:placeholder="请输入内容" searchable="false"
                                                data-th-placeholder="#{SysCommon.placeholder}" data-th-initvalue='${curveCode}' formatoption="false" required="required">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input class="layui-input form-input input-dateSelect" id="curveDate" name="curveDate" placeholder="请选择日期"
                                               data-th-value='${#dates.format(curveDate,"yyyy-MM-dd")}' required="required">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="pro-module-wrap" id = "datatable_div">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">数据信息</span>（<span class="star-sign">*</span>必填）
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="ptl-table1">
                            <table class="layui-table" id="dataTable"></table>
                            <div id="main" style="width: 100%;height:400px;"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pro-module-block">
                <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                    <div class="text-center">
                        <a id="RateSwapInformation002_btn_save" class="layui-btn layui-btn-sm  btn-save" data-th-text="#{SysCommon.save}">保存</a>
                        <a id="RateSwapInformation002_btn_submit" class="layui-btn layui-btn-sm  btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="RateSwapInformation002_btn_preview" class="layui-btn layui-btn-sm" >预览</a>
                        <a id="RateSwapInformation002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var data = /*[[${TERM_TYPE_IRS}]]*/[];
        var dataObj = /*[[${dataObj}]]*/'';
        var dataType = /*[[${dataType}]]*/'';
        var disabled = /*[[${disabled}]]*/'';
        var validExist = /*[[${validExist}]]*/'';
        var businessId = /*[[${businessId}]]*/'';
        var PRICE_TYPE_01 = /*[[${PRICE_TYPE_01}]]*/'01';
        var PRICE_TYPE_02 = /*[[${PRICE_TYPE_02}]]*/'02';
        var PRICE_TYPE_03 = /*[[${PRICE_TYPE_03}]]*/'03';
    </script>
    <script data-th-src="@{/js/invest/basicdata/rateswapinformation/RateSwapInformation002.js}" type="text/javascript"></script>
</div>
</body>

</html>
