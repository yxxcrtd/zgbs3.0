<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
<title data-th-text="#{MstCaptialAccount001}">资金账户管理</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area">
            <a id="MstCaptialAccount001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
            <a id="MstCaptialAccount001_btn_delete" class="layui-btn layui-btn-sm btn-delete" style="display: none" data-th-text="#{SysCommon.delete}">删除</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                            data-th-text="#{MstCaptialAccount001.accountName}">账户名称</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="acctName" name="acctName"
                                class="layui-input form-input input-lenovoselect" allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/basicdata/mstcaptialaccount/MstCaptialAccount001/getAcctName}"
                                data-idfield="shortName" data-keyfield="shortName" data-th-data-effectivefieldsalias='|{"code":"#{MstCaptialAccount001.accountId}","shortName":"#{MstCaptialAccount001.accountName}"}|'>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/basicdata/mstcaptialaccount/MstCaptialAccount001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
