<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title>版本切换</title>
</head>
<body>
    <div layout:fragment="content">


            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4" style="height:1px;">
                </div>
                <div class="layui-inline layui-col-md4 layui-col-xs6 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable">类型</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="versionType"
                            name="versionType"
                            class="layui-input form-input input-checkbox"
                            data-th-data-result='${VERSION_TYPE}'
                            data-th-initvalue='${vesionType}'>
                    </div>
                </div>
            </div>
	        <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
	        	<div class="text-center">
		            <button id="VersionSwitch001_btn_save" class="layui-btn layui-btn-sm btn-save">保存</button>
		        </div>
	        </div>

    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/basicdata/versionswitch/VersionSwitch001.js}" type="text/javascript"></script>
    </div>
</body>

</html>
