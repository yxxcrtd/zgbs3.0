<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PortfolioManageInfo001.title}">产品组合管理</title>
</head>
<body>
     <div layout:fragment="content">
     <div class="form-button-area" style="margin:10px;">
            <a id="PortfolioManageInfo001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
            <a id="PortfolioManageInfo001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}"  style="display:none;">删除</a>
       </div>
       <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form joyin-form-wrap"  id="submitForm" style="margin-top:20px">
            <div class="layui-form-item">       
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{PortfolioManageInfo001.portfolioName}">产品组合名称</label>
                     <div class="layui-input-inline input-inline">
                        <select type="text" id="portfolioName" name="portfolioName" class="layui-input form-input input-select"  allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                                <option></option>
                      </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{PortfolioManageInfo001.createUser}">创建人</label>
                    <div class="layui-input-inline input-inline">
                        <input id="createUser" name="createUser" type="text" class="layui-input form-input" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div> 
             <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{PortfolioManageInfo001.createDate}">创建日期</label>
                    <div class="layui-input-inline input-inline">
                        <input id="createDate" name="createDate" class="layui-input form-input input-dateSelect" placeholder="请选择时间">
                    </div>
                </div> 
                </div>
               
              <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{PortfolioManageInfo001.status}">有效状态</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="status" name="status" class="layui-input form-input input-select"  allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                                <option></option>
                    	</select>
                    </div>
                </div>
               </div>
            </form>   
          </div> 
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
       
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/basicdata/portfoliomanageInfo/PortfolioManageInfo001.js}" type="text/javascript"></script>
    </div>                                
</body>

</html>
