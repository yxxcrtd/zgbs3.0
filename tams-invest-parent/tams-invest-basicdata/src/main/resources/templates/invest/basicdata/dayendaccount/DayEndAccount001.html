<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{DayEndAccount001.title}">日终清算数据核对</title>
</head>
<body>
     <div layout:fragment="content">
     <div class='layui-fluid'>
     <div class="layui-tab" lay-filter="demo">
         <ul class="layui-tab-title">
             <li class="layui-this" lay-filter="receive">汇总头寸
             </li>
             <li id="await" lay-filter="await" style="position: relative;">明细数据
             </li>
         </ul>
         <div class="layui-tab-content">
             <div class="layui-tab-item layui-show">
                 <div class="joyin-form-wrap joyin-filter-form curr-form">
                     <form class="layui-form "  id="submitFormTotal" style="margin-right: 120px;">
                         <div class="layui-form-item">
                             <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                                 <label class="layui-form-label form-lable" data-th-text="资金账户">资金账户</label>
                                 <div class="layui-input-inline input-inline">
                                     <select type="text" id="busiAcctNoTotal" name="busiAcctNo"
                                             class="layui-input form-input input-select" placeholder="请输入内容"
                                             data-th-placeholder="#{SysCommon.placeholder}"
                                             data-th-data-url="@{/invest/basicdata/dayendaccount/DayEndAccount001/queryBusiAcctNo}"
                                             multiple="true" >
                                     </select>
                                 </div>
                             </div>
                             <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                                 <label class="layui-form-label form-lable" data-th-text="对账日期">对账日期</label>
                                 <div class="layui-input-inline input-inline">
                                     <input type="text" id="settleDateTotal" name="settleDateTotal"
                                            class="layui-input form-input input-dateRangeSelect" placeholder="请输入内容"
                                            data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-value="|${#dates.format(settleDateTotal,'yyyy-MM-dd')} - ${#dates.format(settleDateTotal,'yyyy-MM-dd')}|">
                                 </div>
                             </div>
                             <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                                 <label class="layui-form-label form-lable" data-th-text="券商">券商</label>
                                 <div class="layui-input-inline input-inline">
                                     <select type="text" id="customerId" name="customerId"
                                             class="layui-input form-input input-select" placeholder="请输入内容"
                                             data-th-placeholder="#{SysCommon.placeholder}"
                                             allowClear="true"
                                             data-th-data-url="@{/invest/basicdata/dayendaccount/DayEndAccount001/selectCustomerId}"></select>
                                 </div>
                             </div>
                             <div style="float: right;margin-right: -66px;">
                                 <a id="DayEndAccount001_total_btn_search" class="layui-btn layui-btn-sm btn-search">查询</a>
                             </div>
                         </div>
                         <div class="layui-form-item">
                             <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                                 <label class="layui-form-label form-lable" data-th-text="对账状态">对账状态</label>
                                 <div class="layui-input-inline input-inline">
                                     <select type="text" id="accountStatusTotal" name="accountStatusTotal"
                                             class="layui-input form-input input-select" placeholder="请输入内容"
                                             data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${ACCOUNT_STATUS1}'
                                             allowClear="true" formatoption="true" data-th-initValue="${entity?.accountStatus}"></select>
                                 </div>
                             </div>
                             <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                                 <label class="layui-form-label form-label-wrap">证券账户账号</label>
                                 <div class="layui-input-inline input-inline">
                                     <select type="text" id="secAcctId" name="secAcctId" allowClear="true" formatOption="false"
                                             class="layui-input form-input input-select" th:placeholder="#{SysCommon.placeholder}"
                                             data-th-data-url="@{/invest/basicdata/dayendaccount/DayEndAccount001/selectSecAcctId}"></select>
                                 </div>
                             </div>
                             <div style="float: right;margin-right: -68px;margin-bottom: 5px;">
                                 <a id="DayEndAccount001_total_btn_reset" class="layui-btn layui-btn-sm btn-reset btn-default">重置</a>
                             </div>
                         </div>
                     </form>
                 </div>
                 <div>
                     <table class="layui-table" id="dataTotalTable"></table>
                 </div>
             </div>
             <div class="layui-tab-item">
                 <div class="form-button-area" >
                     <a id="DayEndAccount001_btn_account"
                        class="layui-btn layui-btn-sm"
                        data-th-text="#{DayEndAccount001.account}">对账</a>
                 </div>
                 <div class="joyin-form-wrap joyin-filter-form curr-form">
                     <form class="layui-form "  id="submitForm" style="margin-right: 120px;">
                         <div class="layui-form-item">
                             <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                                 <label class="layui-form-label form-lable" data-th-text="资金账户">资金账户</label>
                                 <div class="layui-input-inline input-inline">
                                     <select type="text" id="busiAcctNo" name="busiAcctNo"
                                             class="layui-input form-input input-select" placeholder="请输入内容"
                                             data-th-placeholder="#{SysCommon.placeholder}"
                                             data-th-data-url="@{/invest/basicdata/dayendaccount/DayEndAccount001/queryBusiAcctNo}"
                                             multiple="true" >
                                     </select>
                                 </div>
                             </div>
                             <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                                 <label class="layui-form-label form-lable"
                                        data-th-text="#{DayEndAccount001.finprodId}">资产代码</label>
                                 <div class="layui-input-inline input-inline">
                                     <select type="text" id="finprodId" name="finprodId"
                                             class="layui-input form-input input-select"
                                             placeholder="请输入内容"
                                             data-th-placeholder="#{SysCommon.placeholder}"
                                             data-th-data-url="@{/invest/basicdata/dayendaccount/DayEndAccount001/queryAssetCode}"
                                             data-th-value="${entity?.finprodId}" multiple="false">
                                     </select>
                                 </div>
                             </div>
                             <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                                 <label class="layui-form-label form-lable" data-th-text="#{DayEndAccount001.tradeMarket}">交易场所</label>
                                 <div class="layui-input-inline input-inline">
                                     <select type="text" id="tradeMarket" name="tradeMarket"
                                             class="layui-input form-input input-select" placeholder="请输入内容"
                                             data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${TRADE_PLACE}'
                                             allowClear="true" formatoption="true" data-th-initValue="${entity?.tradeMarket}"></select>
                                 </div>
                             </div>
                             <div style="float: right;margin-right: -66px;">
                                 <a id="DayEndAccount001_detail_btn_search" class="layui-btn layui-btn-sm btn-search">查询</a>
                             </div>
                         </div>
                         <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                                 <label class="layui-form-label form-lable" data-th-text="#{DayEndAccount001.settleDate}">清算日期</label>
                                 <div class="layui-input-inline input-inline">
                                     <input type="text" id="settleDate" name="settleDate"
                                            class="layui-input form-input input-dateRangeSelect" placeholder="请输入内容"
                                            data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-value="${#dates.format(entity?.settleDate,'yyyy-MM-dd')}">
                                 </div>
                             </div>
                             <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                                 <label class="layui-form-label form-lable" data-th-text="#{DayEndAccount001.accountStatus}">对账状态</label>
                                 <div class="layui-input-inline input-inline">
                                     <select type="text" id="accountStatus" name="accountStatus"
                                             class="layui-input form-input input-select" placeholder="请输入内容"
                                             data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${ACCOUNT_STATUS}'
                                             allowClear="true" formatoption="true" data-th-initValue="${entity?.accountStatus}"></select>
                                 </div>
                             </div>
                             <div style="float: right;margin-right: -68px;margin-bottom: 5px;">
                                 <a id="DayEndAccount001_detail_btn_reset" class="layui-btn layui-btn-sm btn-reset btn-default">重置</a>
                             </div>
                         </div>
                     </form>
                 </div>
                 <div>
                     <table class="layui-table" id="dataTable"></table>
                 </div>
             </div>
         </div>
     </div>
       </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/basicdata/dayendaccount/DayEndAccount001.js}" type="text/javascript"></script>
    </div>                                
</body>

</html>
