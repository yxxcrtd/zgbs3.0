<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{FinFutures001}">期货类标的信息</title>
</head>
<body>
<div layout:fragment="content" id="FinFutures001_DIV">
    <div class='layui-fluid'>
        <div class="layui-col-md12 form-button-area" style="margin: 10px;">
            <a id="FinFutures001_btn_add"
               class="layui-btn layui-btn-sm btn-create"
               data-th-text="#{SysCommon.create}">新建</a>
            <a id="FinFutures001_btn_delete"
               class="layui-btn layui-btn-sm btn-delete"
               data-th-text="#{SysCommon.delete}">删除</a>
        </div>
        <div class='joyin-form-wrap joyin-filter-form condition-area'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                	<div style="display: none">
                    	<input type="text" id="status" name=""/>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{FinFutures001.finprodMarketId}">合约代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="finprodMarketId" name="finprodMarketId"
                                   class="layui-input form-input input-lenovoselect"
                                   placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-url="@{/invest/asset/futures/FinFutures001/getFinprodMarketIdList}"
                                   data-idfield="code" data-keyfield="code"
                                   data-th-data-effectivefieldsalias='|{"code":"#{FinFutures001.finprodMarketId}",
									"shortName":"#{FinFutures001.finprodName}"}|'>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4"
                         style="display:block">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{FinFutures001.futuresType}">期货类型</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="futuresType" name="futuresType"
                                   class="layui-input form-input input-select"
                                   placeholder="请输入内容"
                                   childrenIds="futuresContractId"
                                   multiple = "true"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-result='${FUTURES_TYPE}'
                            >
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{FinFutures001.futuresContractId}">合约标的</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="futuresContractId" name="futuresContractId"
                                   class="layui-input form-input input-select"
                                   placeholder="请输入内容"
                                   multiple = "true"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-result='${FUTURES_CONTRACT}'
                            >
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4"
                         style="display:block">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{FinFutures001.lastTradeDate}">最后交易日</label>
                        <div class="layui-input-inline input-inline">
                            <input id='lastTradeDate' name='lastTradeDate'
                                   class="layui-input form-input input-dateRangeSelect"
                                   placeholder="请选择时间区间"
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
    </script>
    <script data-th-src="@{/js/invest/asset/futures/FinFutures001.js}"></script>
</div>
</body>
</html>
