<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{SppiTest001.title}">SPPI测试</title>
</head>
<body>
    <div layout:fragment="content">
        <div class='layui-fluid'>
            <div class="form-button-area" style="margin: 10px;">
<!--                <button type="button" class="layui-btn layui-btn-sm btn-default" id="SppiTest001_btn_export"><i class="iconfont icon-export"></i>导出</button>-->
                <button type="button" id="SppiTest001_btn_sppiTest" class="layui-btn layui-btn-normal layui-btn-sm" data-th-text="#{SppiTest001.sppiTest}">SPPI测试</button>
                <button type="button" id="SppiTest001_btn_import" class="layui-btn layui-btn-sm btn-import btn-default" >导入</button>
            </div>
            <form class="layui-form joyin-form-wrap" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{SppiTest001.assetCodes}" style="width: 15%;">资产代码</label>
                        <div class="layui-input-inline input-inline" style="width: 80%!important;">
                            <select type="text" id="assetCodes" name="assetCodes" class="layui-input form-input input-select"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-initValue="${entity?.ftrId}" allowClear="true" autoSort="false" formatoption="false"
                                    data-th-data-url="@{/invest/asset/sppi/SppiTest001/querySppiAssetList}" multiple="true">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md3 layui-col-sm3 layui-col-lg3">
                        <label class="layui-form-label form-lable" data-th-text="#{SppiTest001.assetType}">资产类型</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="assetType" name="assetType"
                                   class="layui-input form-input input-select"
                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-result='${ASSET_TYPES}' />
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md3 layui-col-sm3 layui-col-lg3">
                        <label class="layui-form-label form-lable" data-th-text="#{SppiTest001.testStatus}">测试状态</label>
                        <div class="layui-input-inline input-inline">
                            <select id="testStatus" name="testStatus" class="layui-input form-input input-select"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result='${SPPI_TEST_STATUS}'>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md2 layui-col-sm2 layui-col-lg2">
                        &nbsp;&nbsp;&nbsp;&nbsp;
                        <a id="SppiTest001_btn_search" class="layui-btn layui-btn-sm btn-search" data-th-text="#{SysCommon.search}">查询</a>
                        <a id="SppiTest001_btn_reset" class="layui-btn layui-btn-sm btn-reset" data-th-text="#{SysCommon.reset}">重置</a>
                    </div>
                </div>
            </form>
            <div>
                <table class="layui-table" id="assetListTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
            var SPPI_TESTING = /*[[${SPPI_TESTING}]]*/'';
            var SPPI_PASSED = /*[[${SPPI_PASSED}]]*/'';
            var SPPI_FAILD = /*[[${SPPI_FAILD}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/asset/sppi/SppiTest001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
