<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{SppiTemplateNotBondDtt.create}">非标准化债权资产SPPI测试新建（德勤模板）</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" data-th-text="#{SppiTest002.p1}">资产基本信息</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" style="width: 33%!important;">
                                    <label class="layui-form-label form-lable basicTitleLbl" data-th-text="#{SppiTest002.finprodId}">
                                        资产代码
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodId" name="finprodId" required="required"
                                               class="layui-input form-input" maxlength="75"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.finprodId}" disabled="true" style="display:none" />
                                        <input type="text" id="finprodMarketId" name="finprodMarketId" required="required"
                                               class="layui-input form-input" maxlength="75"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.finprodMarketId}" disabled="true" />
                                    </div>
                                </div>
                                <div class="form-inline-wrap" style="width: 33%!important;">
                                    <label class="layui-form-label form-lable basicTitleLbl" data-th-text="#{SppiTest002.finprodName}">
                                        资产名称
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodName" name="finprodName" required="required"
                                               class="layui-input form-input" maxlength="75"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.finprodName}" disabled="true" />
                                    </div>
                                </div>
                                <div class="form-inline-wrap" style="width: 33%!important;">
                                    <label class="layui-form-label form-lable basicTitleLbl" data-th-text="#{SppiTest002.bdAssetType}">
                                        标的资产类型
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="assetTypeName" name="assetTypeName" required="required"
                                               class="layui-input form-input" maxlength="75"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.assetTypeName}" disabled="true" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" style="width: 33%!important;">
                                    <div class="layui-inline layui-col-md12 layui-col-xs12 layui-col-sm12 layui-col-lg12">
                                        <label class="layui-form-label form-label-wrap basicTitleLbl" data-th-text="#{SppiTest002.investType}">
                                            投资类型
                                        </label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="investTypeDesc" name="investTypeDesc"
                                                   class="layui-input form-input" maxlength="100"
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value="${entity?.investTypeDesc}" />
                                        </div>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" style="width: 66%!important;">
                                    <div class="layui-inline layui-col-md12 layui-col-xs12 layui-col-sm12 layui-col-lg12">
                                        <label class="layui-form-label form-label-wrap basicTitleLbl2" data-th-text="#{SppiTest002.tradeManageType}">
                                            交易对手名称及其对该资产的管理方式
                                        </label>
                                        <div class="layui-input-inline input-inline" style="width:60.8%!important;">
                                            <input type="text" id="manageTypeDesc" name="manageTypeDesc"
                                                   class="layui-input form-input" maxlength="100"
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value="${entity?.manageTypeDesc}" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" data-th-text="#{SppiTest002.p10}">合同现金流是否仅为本金及利息的支付测试(SPPI测试)</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="detailTitle1" data-th-text="#{SppiTest002.t19}">业务类型判断</div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q78}">是否为通道业务？</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q78" id="sppiTest002Q78"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q78']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>

                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblc" data-th-text="#{SppiTest002.c13}">结论</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002C13" id="sppiTest002C13"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002C13']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" disabled="true" />
                                    </div>
                                </div>
                            </div>

                            <div class="detailTitle1" data-th-text="#{SppiTest002.t20}">合同条款</div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q79}">合同是否承诺保证本金及收益？</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q79" id="sppiTest002Q79"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q79']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q80}">
                                        若A1为否，产品实质是否保证本金及收益？
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q80" id="sppiTest002Q80"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q80']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblc" data-th-text="#{SppiTest002.c14}">A结论</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002C14" id="sppiTest002C14"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002C14']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" disabled="true" />
                                    </div>
                                </div>
                            </div>

                            <div class="detailTitle1" data-th-text="#{SppiTest002.t21}">利率条件</div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblSmaller" data-th-text="#{SppiTest002.q81}">
                                        利率类型
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadioBigger">
                                        <input type="text" name="sppiTest002Q81" id="sppiTest002Q81"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q81']?.answerValue}"
                                               data-th-data-result="${INT_TYPE}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q82}">
                                        若为浮动利率，其浮动基础是否为受管制利率？
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q82" id="sppiTest002Q82"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q82']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q83}">
                                        若为浮动利率，利率的重设频率是否与利率期间一致？
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q83" id="sppiTest002Q83"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q83']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q84}">
                                        若A3为否，金融资产的未折现合同现金流量是否可能与未折现基准现金流量显著不同
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q84" id="sppiTest002Q84"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q84']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblSmaller" data-th-text="#{SppiTest002.q85}">
                                        递延付息选择权，如有递延未付利息仍加计利息
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadioBigger">
                                        <input type="text" name="sppiTest002Q85" id="sppiTest002Q85"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q85']?.answerValue}"
                                               data-th-data-result="${YES_NO_NA}" required="required" />
                                    </div>
                                </div>
                            </div>

                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblc" data-th-text="#{SppiTest002.c15}">A结论</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002C15" id="sppiTest002C15"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002C15']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" disabled="true" />
                                    </div>
                                </div>
                            </div>

                            <div class="detailTitle1" data-th-text="#{SppiTest002.t22}">合同连接工具</div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q86}">是否为分级产品？</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q86" id="sppiTest002Q86"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q86']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q87}">
                                        （在未看穿标的金融工具组合的情况下）分级的合同条款是否符合“仅为本金及利息的支付”标准 ？
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q87" id="sppiTest002Q87"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q87']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q88}">
                                        标的金融工具组合是否符合“仅为本金及利息的支付”标准？
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q88" id="sppiTest002Q88"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q88']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q89}">
                                        分级的固有的信用风险敞口是否小于或等于标的金融工具组合本身的信用风险敞口？
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q89" id="sppiTest002Q89"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q89']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>

                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblc" data-th-text="#{SppiTest002.c16}">B结论</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002C16" id="sppiTest002C16"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002C16']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" disabled="true" />
                                    </div>
                                </div>
                            </div>

                            <div class="detailTitle1" data-th-text="#{SppiTest002.t23}">混合合同</div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q90}">是否隐含嵌入性合同</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q90" id="sppiTest002Q90"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q90']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionTextLbl" data-th-text="#{SppiTest002.q91}">嵌入要素性质</label>
                                    <div class="layui-input-inline input-inline questionText">
                                        <input type="text" id="sppiTest002Q91" name="sppiTest002Q91" class="layui-input form-input" maxlength="200"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.qaMap['sppiTest002Q91']?.answerValue}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q92}">嵌入要素性质是否具有杠杆性</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q92" id="sppiTest002Q92"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q92']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>

                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblc" data-th-text="#{SppiTest002.c17}">C结论</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002C17" id="sppiTest002C17"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002C17']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" disabled="true" />
                                    </div>
                                </div>
                            </div>

                            <div class="detailTitle1" data-th-text="#{SppiTest002.t24}">提前还款</div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q93}">是否可选择提前还款</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q93" id="sppiTest002Q93"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q93']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q94}">是否有提前还款的额外补偿</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q94" id="sppiTest002Q94"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q94']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q95}">
                                        提前还款的金额(含额外补偿)是否几乎代表尚未支付之本金及未偿付本金金额之利息
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q95" id="sppiTest002Q95"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q95']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>

                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblc" data-th-text="#{SppiTest002.c18}">D结论</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002C18" id="sppiTest002C18"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002C18']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" disabled="true" />
                                    </div>
                                </div>
                            </div>

                            <div class="detailTitle1" data-th-text="#{SppiTest002.t25}">展期</div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q96}">是否可选择展期</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q96" id="sppiTest002Q96"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q96']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q97}">是否有展期的额外补偿</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q97" id="sppiTest002Q97"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q97']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
