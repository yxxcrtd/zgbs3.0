<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns="http://www.w3.org/1999/html"
	  layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinDepositTarget002}">存款类资产新建</title>
</head>
<body>
	<div layout:fragment="content" id="FinDepositTarget002_DIV">
		<div class="pro-module-container page-step">
			<form class="layui-form joyin-form-wrap pro-module-form"
				id="submitForm">
				<input id="oldVdate" name="oldVdate" data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}' hidden>
				<input id="pageId" name="pageId" data-th-value="${pageId}" hidden>
				<input id="finprodId" name="finprodId"
					data-th-value="${entity?.finprodId}" hidden> <input
					id="finprodType2" name="finprodType2"
					data-th-value="${entity?.finprodType2}" hidden> <input
					id="workflowId" name="workflowId" data-th-value="${workflowId}"
					hidden> <input id="oldMdate" name="oldMdate"
					data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}' hidden>
				<input type="text" id="seqno" name="seqno"
					class="layui-input form-input" data-th-value="${entity?.seqno}"
					style="display: none"> <input type="text" id="creditMstId"
					name="creditMstId" class="layui-input form-input"
					data-th-value="${entity?.creditMstId}" style="display: none">
				<input type="text" id="pfhId" name="pfhId"
					class="layui-input form-input" data-th-value="${entity?.pflsh}"
					style="display: none"> <input type="text" id="hapCreditAmt"
					name="hapCreditAmt" class="layui-input form-input"
					data-th-value="${entity?.hapCreditAmt}" style="display: none">
				<input type="text" id="creditFlag" name="creditFlag" style="display: none"
											data-th-value="${entity?.creditFlag}">
				<div class="pro-module-wrapper pro-module-base step" title="基本信息">
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title">
								<span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i
									class="iconfont icon-arrow-down pro-down-icon"></i>
							</h3>
							<div class="pro-module-item pro-item-wrap">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinDepositTarget002.finprodId}">资产代码</label>
										<div class="layui-input-inline input-inline">
											<!--新建画面中，资产代码改为可手输 guyunfei 2019/09/04 start-->
											<!--<input type="text" name="finprodMarketId"
												data-th-value="${entity?.finprodMarketId}"
												class="layui-input form-input" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												disabled="disabled">-->
											<input type="text" name="finprodMarketId" id="finprodMarketId"
												   style=" width: 100%!important; display: inline-block;"
												   data-th-value="${entity?.finprodMarketId}" maxlength="18"
												   class="layui-input form-input" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}">
											<!--新建画面中，资产代码改为可手输 guyunfei 2019/09/04 end-->
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinDepositTarget002.finprodName}">资产名称</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="finprodName"
												data-th-value="${entity?.finprodName}"
												class="layui-input form-input" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required>
										</div>
									</div>
									<div class="form-inline-wrap" style="display: none"><!-- 隐藏资产类型 赵东东 2019.7.26 -->
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinDepositTarget002.type6}">资产类型</label>
										<div class="layui-input-inline input-inline">
											<select  id="type6" name="type6"
												data-th-initValue="${entity?.type6?:DEPO_ASSET_TYPE_02}"
												class="layui-input form-input input-select"
												data-th-data-result="${DEPO_ASSET_TYPE}"
												></select>
										</div>
									</div>
									<!-- 增加资产二级分类 赵东东 2019.7.26 start -->
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinDepositTarget002.type9}">资产二级分类</label>
										<div class="layui-input-inline input-inline">
											<select id="type9" name="type9"
											    childrenIds="type10"
											    class="layui-input form-input input-select"
												data-th-initValue="${entity?.type9}"
												data-th-placeholder="#{SysCommon.placeholder}"
												required="required"
												data-th-data-result="${CUSTOM_ASSET_TYPE_TWO}" >
												</select>
										</div>
									</div>
									<!-- 增加资产二级分类 赵东东 2019.7.26 end -->
									<a id='magnifier' class="input-right-show" href='javascript:;' style='color:#4893e6;left: 32.5%; top: 40px;'><i class='iconfont icon-search'></i></a>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap" style="display: none"><!-- 隐藏存款类型 赵东东 2019.7.26 -->
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinDepositTarget002.type7}">存款类型</label>
										<div class="layui-input-inline input-inline">
										<select  id="type7" name="type7"
												data-th-initValue="${entity?.type7}"
												class="layui-input form-input input-select"
												data-th-data-result="${DEPO_TYPE}"></select>
										</div>
									</div>
									<!-- 增加资产三级分类、资产四级分类、资产五级分类、赵东东 2019.7.26 start -->
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinDepositTarget002.type10}">资产三级分类</label>
										<div class="layui-input-inline input-inline">
											<select id="type10" name="type10" parentIds="type9"
											    childrenIds="type11"
											    class="layui-input form-input input-select"
												data-th-initValue="${entity?.type10}"
												data-th-placeholder="#{SysCommon.placeholder}"
												required="required"
												data-th-data-result="${CUSTOM_ASSET_TYPE_THREE}" >
												</select>
										</div>
									</div>
									<div class="form-inline-wrap" style="display: none" id = "type11Div">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinDepositTarget002.type11}">资产四级分类</label>
										<div class="layui-input-inline input-inline">
											<select id="type11" name="type11" parentIds="type10"
											childrenIds="type12"
											class="layui-input form-input input-select"
												data-th-initValue="${entity?.type11}"
												data-th-placeholder="#{SysCommon.placeholder}"
												required="required"
												data-th-data-result="${CUSTOM_ASSET_TYPE_FOUR}">
												</select>
										</div>
									</div>
									<div class="form-inline-wrap" style="display: none" id = "type12Div">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinDepositTarget002.type12}">资产五级分类</label>
										<div class="layui-input-inline input-inline">
											<select id="type12" name="type12" parentIds="type11"
											class="layui-input form-input input-select"
												data-th-initValue="${entity?.type12}"
												data-th-placeholder="#{SysCommon.placeholder}"
												required="required"
												data-th-data-result="${CUSTOM_ASSET_TYPE_FIVE}"
													childrenIds="bussRepDepositInfoDto_repAssetType,bussRepDlRepoInfoDto_repAssetType,finPayInterestStdInfoDto_payCycle,test">
										</select>
										</div>
									</div>
									<!-- 增加资产三级分类、资产四级分类、资产五级分类、赵东东 2019.7.26 start -->
									</div>
									<div class="layui-form-item">
									<!-- 增加推荐方与推荐费率 delete by renping 20191014 start -->
<!-- 									<div class="form-inline-wrap"> -->
<!-- 										<label class="layui-form-label form-label-wrap" -->

<!-- 												data-th-placeholder="#{SysCommon.placeholder}" -->
<!-- 												data-th-data-url="@{/invest/asset/common/getTradeOpponent}" -->
<!-- 												data-th-initValue='${entity?.assetProvider}'> -->
<!-- 											</select> -->
<!-- 										</div> -->
										<!-- <div class="layui-input-inline input-inline">
                                            <input type="text" id="assetProvider" name="assetProvider" class="layui-input form-input input-lenovoselect"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value = "${entity?.assetProviderName}"
                                                data-th-data-url="@{/invest/asset/depo/FinDepositTarget002/getTradeOpponent(counterType=${counterType})}"
                                                data-idfield="code" data-keyfield="name"
                                                data-th-data-effectivefieldsalias='|{"code":"#{FinDepositTarget002.tradeOpponentCode}","shortName":"#{FinDepositTarget002.tradeOpponentName}"}|'>
                                            <input type="hidden" name="assetProvider_hidden" id="assetProvider_hidden" data-th-value="${entity?.assetProvider}">
                                        </div> -->
<!-- 									</div> -->
									<!-- 增加推荐方与推荐费率 delete by renping 20191014 end -->
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinDepositTarget002.issuer}">存款机构</label>
										<div class="layui-input-inline input-inline">
											<!--匹配融资人属性 modified by lishuping 20190925 start-->
											<select name="issuer"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												required="required"
                                                data-th-data-url="@{/invest/asset/depo/FinDepositTarget002/getCustomerName}"
												data-th-initValue='${entity?.issuer}'>
											</select>
											<!--匹配融资人属性 modified by lishuping 20190925 end-->
										</div>

										<!-- <div class="layui-input-inline input-inline">
                                            <input type="text" id="issuer" name="issuer" class="layui-input form-input input-lenovoselect"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value = "${entity?.issuerName}"
                                                data-th-data-url="@{/invest/asset/depo/FinDepositTarget002/getCustomerName}"
                                                data-idfield="code" data-keyfield="name"
                                                data-th-data-effectivefieldsalias='|{"code":"#{FinDepositTarget002.customerNameCode}","shortName":"#{FinDepositTarget002.customerNameName}"}|'>
                                            <input type="hidden" name="issuer_hidden" id="issuer_hidden" data-th-value="${entity?.issuer}">
                                        </div> -->
									</div>
									<div class="form-inline-wrap" id="issueAmt_div">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinDepositTarget002.issueAmt}">存款本金</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="issueAmt" name="issueAmt"
												data-th-value="${entity?.issueAmt}"
												class="layui-input form-input text-number"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required>
											<span class="input-right-show">元</span>
										</div>
									</div>
										<div class="form-inline-wrap" id="isInnerAdv_div">
											<label class="layui-form-label form-label-wrap"
												   data-th-text="#{FinDepositTarget002.isInnerAdv}">是否支持转仓</label>
											<div class="layui-input-inline input-inline">
												<input type="checkbox" th:id="isInnerAdv" th:name="isInnerAdv"
													   lay-skin="switch" data-th-value="${YES}" lay-text="是|否" lay-filter="isInnerAdv"
													   data-th-checked="${YES} ==${entity?.isInnerAdv}">
											</div>
										</div>
									</div>
									<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinDepositTarget002.vdate}">起息日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="vdate" name="vdate"
												data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'
												required="required"
												class="layui-input form-input input-dateSelect" />
										</div>
									</div>
									<div class="form-inline-wrap" id="mdate_div">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinDepositTarget002.mdate}">到期日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="mdate" name="mdate"
												data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
											    class="layui-input form-input input-dateSelect" />
										</div>
									</div>
									<div class="form-inline-wrap" id="termDays_div">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinDepositTarget002.termDays}">期限（天）</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="termDays"
												data-th-value="${entity?.termDays}" required="required"
												class="layui-input form-input" />
										</div>
									</div>
									<div class="form-inline-wrap" style="display: none" id="isReceipt_div">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinDepositTarget002.isReceipt}">是否有存单</label>
										<div class="layui-input-inline input-inline">
											<input type="checkbox" id="isReceipt" name="isReceipt"
												   lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
												   data-th-checked="${YES_OR_NO_Y} ==${entity?.isReceipt}">
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinDepositTarget002.blnArea}">境内外</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="blnArea" name="blnArea"
												th:initValue="${entity?.blnArea}" required
												class="layui-input form-input input-checkbox"
												data-th-data-result="${BLN_AREA}" />
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinDepositTarget002.ccy}">币种</label>
										<div class="layui-input-inline input-inline">
											<select id="ccy" name="ccy"
												th:initValue="*{entity?.ccy?:CCY_default}"
												class="layui-input form-input input-select"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required
												data-th-data-result="${CCY}">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinDepositTarget002.calendarId}">交易日历</label>
										<div class="layui-input-inline input-inline">
											<select name="calendarId" id="calendarId"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												required="required"
												data-th-data-url="@{/business/common/CommonSelect/selectCalendarId}"
												data-th-initValue='${entity?.calendarId}'>
											</select>
										</div>
										<!--  <div class="layui-input-inline input-inline">
                                            <input type="text" id="calendarId" name="calendarId" class="layui-input form-input input-lenovoselect"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value = "${entity?.calendarName}"
                                                data-th-data-url="@{/invest/asset/depo/FinDepositTarget002/getTradeCalendarName(isTradeCalendar=${isTradeCalendar})}"
                                                data-idfield="code" data-keyfield="name"
                                                data-th-data-effectivefieldsalias='|{"code":"#{FinDepositTarget002.tradeCalendarCode}","shortName":"#{FinDepositTarget002.tradeCalendarName}"}|'>
                                            <input type="hidden" name="calendarId_hidden" id="calendarId_hidden" data-th-value="${entity?.calendarId}">
                                        </div> -->
								</div>
								</div>
								<div class="layui-form-item">
									<div id="depositBuyOutRate" class="form-inline-wrap">
<!--										th:id="|${entityName}_buyOutRate_div|">-->
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinInterestFactor.buyOutRate}">买断利率</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="buyOutRate" name="buyOutRate" th:value="${entity?.buyOutRate}"
												class="layui-input form-input text-number"
												data-textrange="4" disabled="disabled"> <span
												class="input-right-show">%</span>
										</div>
									</div>
									<div class=" form-inline-wrap" id="pflshDiv">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinDepositTarget002.pflsh}">批复号</label>
										<div class="layui-input-inline input-inline">
											<select type="text"
												class="layui-input form-input input-select"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" id="pflsh"
												maxlength="30" name="pflsh" parentIds="pfhId"
												data-th-initvalue="${entity?.pflsh}" formatoption="false"
												data-th-data-url="@{/invest/asset/common/getPflshList}">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinDepositTarget002.contractNo}">合同号</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="contractNo"
												   data-th-value="${entity?.contractNo}"
												   class="layui-input form-input" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}" >
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div id="depositAssetSource" class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinDepositTarget002.assetSource}">资产来源</label>
										<div class="layui-input-inline input-inline">
											<select id="assetSource" name="assetSource"
													data-th-initValue='${entity?.assetSource}'
													class="layui-input form-input input-select"
													placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-data-result="${ASSET_SOURCE}">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinDepositTarget002.trialNo}">法审编号</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="trialNo"
												   data-th-value="${entity?.trialNo}"
												   class="layui-input form-input" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}">
										</div>
									</div>
									<div class="form-inline-wrap" id="depositPostOrg" >
										<label class="layui-form-label form-label-wrap" data-th-utext="#{FinDepositTarget002.postOrg}" >投后责任机构</label>
										<div class="layui-input-inline input-inline">
											<select  id="postOrg" name="postOrg"
													 th:data-url="|@{/business/common/CommonSelect/selectCounterId}?counterType=${counterType}|"

													 th:initValue="${entity?.postOrg}" class="layui-input form-input input-select"
													 th:placeholder="#{SysCommon.placeholder}">
											</select>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinDepositTarget002.sponsor}">担保人</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="sponsor" name="sponsor"
													class="layui-input form-input input-select"
													data-th-data-url="@{/invest/asset/project/FinProjectTargetAsset002/getFinancier(IS_GUARANTEE=${YES})}"
													formatoption="true" allowClear="true"
													data-th-initValue='${entity?.sponsor}'>
											</select>
										</div>
									</div>
									<div class=" form-inline-wrap" id="actualCreditProvidDiv">
										<label class="layui-form-label form-label-wrap"

										<div class="layui-input-inline input-inline">
											<select type="text"
												class="layui-input form-input input-select"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												id="actualCreditProvid" maxlength="30"
												name="actualCreditProvid"
												data-th-initvalue="${entity?.actualCreditProvid}"
												data-th-data-url="@{/invest/asset/common/getActualCreditProvid}">
											</select>
										</div>
									</div>
									<div id="depositRegulatoryRating" class="form-inline-wrap">

										<div class="layui-input-inline input-inline">
											<input type="text" name="regulatoryRating" maxlength="300"
												   data-th-value="${entity?.regulatoryRating}"
												   class="layui-input form-input" placeholder="请输入内容"
