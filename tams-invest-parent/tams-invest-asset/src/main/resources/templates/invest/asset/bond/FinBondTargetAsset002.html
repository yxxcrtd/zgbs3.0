<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorator="~{layout/default}">
<head>
<title data-th-text="#{FinBondTargetAsset002}">债券标的资产新建</title>
</head>
<body>
	<div layout:fragment="content" id="FinBondTargetAsset002_DIV">
		<div class="pro-module-container page-step">
			<form class="layui-form joyin-form-wrap pro-module-form"
				id="submitForm">
				<input id="finprodId" name="finprodId"
					data-th-value="${entity?.finprodId}" hidden> <input
					id="finprodType2" name="finprodType2"
					data-th-value="${entity?.finprodType2}" hidden> <input
					id="workflowId" name="workflowId" data-th-value="${workflowId}"
					hidden> <input type="text" id="seqno" name="seqno"
					class="layui-input form-input" data-th-value="${entity?.seqno}"
					style="display: none"> <input type="text" id="creditMstId"
					name="creditMstId" class="layui-input form-input"
					data-th-value="${entity?.creditMstId}" style="display: none">
				<input type="text" id="pfhId" name="pfhId"
					class="layui-input form-input" data-th-value="${entity?.pflsh}"
					style="display: none"> <input type="text" id="hapCreditAmt"
					name="hapCreditAmt" class="layui-input form-input"
					data-th-value="${entity?.hapCreditAmt}" style="display: none">
				<input type="text" id="creditFlag" name="creditFlag" style="display: none"
					data-th-value="${entity?.creditFlag}">
            <input type="text" id="isAllowModify" name="isAllowModify" style="display: none"
                   data-th-value="${isAllowModify}">
            <input type="text" id="appearMarketId" name="appearMarketId" style="display: none"
                   data-th-value="${entity?.appearMarketId}">
				<div class="pro-module-wrapper pro-module-base step" title="基本信息">
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title">
								<span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i
									class="iconfont icon-arrow-down pro-down-icon"></i>
							</h3>
							<div class="pro-module-item pro-item-wrap">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinBondTargetAsset002.finprodId}">资产代码</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="finprodMarketId"
												name="finprodMarketId" maxlength="15"
												data-th-value="${entity?.finprodMarketId}"
												class="layui-input form-input" placeholder="请输入内容"
												style="width: 85%!important; display: inline-block;"
												data-th-placeholder="#{SysCommon.placeholder}" required>
											<input type="text" id="tradeMarketId" name="tradeMarketId" 
                                                data-th-value="${tradeMarketId}"
                                            	class="layui-input form-input" 
                                            	style="width: 15%!important; display: inline-block;" readonly>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinBondTargetAsset002.finprodName}">资产名称</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="finprodName"
												data-th-value="${entity?.finprodName}"
												class="layui-input form-input" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinBondTargetAsset002.finprodAbbr}">资产简称</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="finprodAbbr"
												data-th-value="${entity?.finprodAbbr}"
												class="layui-input form-input" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required>
										</div>
									</div>
									<a id='magnifier' class="input-right-show" href='javascript:;' style='color:#4893e6;left: 32.5%; top: 40px;'><i class='iconfont icon-search'></i></a>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinBondTargetAsset002.tradeMarket}">交易场所</label>
										<div class="layui-input-inline input-inline">
											<select id="tradeMarket" name="tradeMarket"
												th:initValue="*{entity?.tradeMarket}"
												class="layui-input form-input input-select"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required
												data-th-data-result="${TRADE_PLACE}">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinBondTargetAsset002.repRegistOrg}">登记托管机构</label>
										<div class="layui-input-inline input-inline">
											<select id="registOrg"
												name="registOrg"
												th:initValue="${entity?.registOrg}"
												class="layui-input form-input input-select"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required
												data-th-data-result="${SVR_REGIST_ORG}">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinBondTargetAsset002.issuePrice}">发行价格</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="issuePrice" name="issuePrice"
												data-th-value="${entity?.issuePrice}"
												class="layui-input form-input text-number"
												data-textrange="5" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinBondTargetAsset002.idate}">发行日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="idate"
												data-th-value='${#dates.format(entity?.idate,"yyyy-MM-dd")}'
												required="required"
												class="layui-input form-input input-dateSelect" />
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"

											<input type="text" id="vdate" name="vdate"

												required="required"
												class="layui-input form-input input-dateSelect" />
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"

												class="layui-input form-input input-dateSelect" />
										</div>
									</div>
								</div>
								<div class="layui-form-item">

										<label class="layui-form-label form-label-wrap"

									</div>

										</div>

										</div>

													data-th-data-result="${CUSTOM_ASSET_TYPE_TWO}" 
													formatoption=true childrenIds="type10"></select>
											</div>
										</div>

											</label>
											<div class="layui-input-inline input-inline">
												<select id="type10" name="type10" parentIds="type9"
													th:initValue="*{entity?.type10}" required="required"
													class="layui-input form-input input-select"
													allowClear="true" placeholder="请选择"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-data-result="${CUSTOM_ASSET_TYPE_THREE}" 
													formatoption=true data-th-childrenIds="${isShowType} eq '01' ? 'type11' : 'repAssetType'"></select>
											</div>
										</div>
								</div>
								<div class="layui-form-item">
										<div class="form-inline-wrap" id="selector5" data-th-if="${isShowType} eq '01'">
											<label class="layui-form-label form-label-wrap"

											</label>
											<div class="layui-input-inline input-inline">
												<select id="type11" name="type11" parentIds="type10"

													allowClear="true" placeholder="请选择"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-data-result="${CUSTOM_ASSET_TYPE_FOUR}" 
													formatoption=true childrenIds="type12"></select>
											</div>
										</div>
										<div class="form-inline-wrap" id="selector6" data-th-if="${isShowType} eq '01'">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{FinBondTargetAsset002.type12}">资产五级分类
											</label>
											<div class="layui-input-inline input-inline">
												<select id="type12" name="type12" parentIds="type11"
													th:initValue="*{entity?.type12}" required="required"
													class="layui-input form-input input-select"
													allowClear="true" placeholder="请选择"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-data-result="${CUSTOM_ASSET_TYPE_FIVE}" 
													formatoption=true
													data-th-childrenIds="${isShowType} eq '01' ? 'repAssetType' : ''"></select>
											</div>
										</div>
										<!-- 5级分类-wangguiqi on 2019/7/17 end -->
								<!--/div!-->

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinBondTargetAsset002.issueAmt}">发行金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="issueAmt"
												data-th-value="${entity?.issueAmt}"
												class="layui-input form-input text-number"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required>
											<span class="input-right-show">万元</span>
										</div>
									</div>
								</div>

												data-th-data-url="@{/invest/asset/plan/plancur/FinPlanAssetC002/getIssuerId}"
												data-th-initValue='${entity?.issuer}' required="required">
											</select>
										</div>

									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinBondTargetAsset002.isSecBond}">是否次级债</label>
										<div class="layui-input-inline input-inline">
											<input type="checkbox" id="isSecBond" name="isSecBond"
												lay-skin="switch" data-th-value="${YES}" lay-text="是|否" required
												data-th-checked="${YES_OR_NO_Y} ==${entity?.isSecBond}">
										</div>
									</div>
								<!--/div>
								<div class="layui-form-item"!-->
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinBondTargetAsset002.isRight}">是否含权债</label>
										<div class="layui-input-inline input-inline">
											<input type="checkbox" id="isRight" name="isRight"
												lay-skin="switch" lay-filter="isRight"
												data-th-value="${YES}" lay-text="是|否" required
												data-th-checked="${YES_OR_NO_Y} ==${entity?.isRight}">
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinBondTargetAsset002.issueType}">发行方式</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="issueType"
												data-th-initValue="${entity?.issueType}" required="required"
												class="layui-input form-input input-checkbox"
												data-th-data-result="${ISSUE_TYPE}" />
										</div>
									</div>
									<div class="form-inline-wrap" style="display: none">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinBondTargetAsset002.underWriterId}">承销商</label>
										<div class="layui-input-inline input-inline">
											<select name="underWriterId"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-url="@{/invest/asset/common/getCustomerName}"
												data-th-initValue='${entity?.underWriterId}'>
											</select>
										</div>

                                            <input type="text" id="underWriterId" name="underWriterId" class="layui-input form-input input-lenovoselect"

                                            <input type="hidden" name="underWriterId_hidden" id="underWriterId_hidden" data-th-value="${entity?.underWriterId}" required>
                                        </div> -->
									</div>
								<!--/div>
								<div class="layui-form-item"!-->
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinBondTargetAsset002.blnArea}">境内外</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="blnArea" name="blnArea"
												th:initValue="${entity?.blnArea}" required
												class="layui-input form-input input-checkbox"
												data-th-data-result="${BLN_AREA}" />

										<div class="layui-input-inline input-inline">

										<div class="layui-input-inline input-inline">
											<input type="text" name="capiIncomeFeature" id="capiIncomeFeature"

												class="layui-input form-input input-checkbox"
												data-th-data-result="${AMT_INCOME_TYPE}" /> </select>
										</div>
									</div>

                                        <div class="layui-input-inline input-inline">

										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinBondTargetAsset002.tradeCalendarCode}">交易日历</label>
										<div class="layui-input-inline input-inline">
											<select name="calendarId" id="calendarId"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-url="@{/business/common/CommonSelect/selectCalendarId}"
												data-th-initValue='${entity?.calendarId}'
												required="required">
											</select>
										</div>

										<div class="layui-input-inline input-inline">
											<select name="oFinprodId" id="oFinprodId" formatOption="false"
