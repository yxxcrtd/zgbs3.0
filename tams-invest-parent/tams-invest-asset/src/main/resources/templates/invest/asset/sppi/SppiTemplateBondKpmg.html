<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{SppiTemplateBondKpmg.create}">债券类资产SPPI测试新建（毕马威模板）</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" data-th-text="#{SppiTest002.p1}">资产基本信息</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" style="width: 29%!important;">
                                    <label class="layui-form-label form-lable" data-th-text="#{SppiTest002.finprodId}">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodId" name="finprodId" required="required"
                                               class="layui-input form-input" maxlength="75"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.finprodId}" disabled="true" style="display:none" />
                                        <input type="text" id="finprodMarketId" name="finprodMarketId" required="required"
                                               class="layui-input form-input" maxlength="75"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.finprodMarketId}" disabled="true" />
                                    </div>
                                </div>
                                <div class="form-inline-wrap" style="width: 70%!important;">
                                    <div class="layui-inline layui-col-md12 layui-col-xs12 layui-col-sm12 layui-col-lg12">
                                        <label class="layui-form-label form-label-wrap" style="width:15%" data-th-text="#{SppiTest002.debtToolDesc}">债务工具介绍</label>
                                        <div class="layui-input-inline input-inline" style="width: 80%!important;">
                                            <input type="text" id="debtToolDesc" name="debtToolDesc"
                                                   class="layui-input form-input" maxlength="400"
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value="${entity?.debtToolDesc}" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" style="width: 29%!important;">
                                    <label class="layui-form-label form-lable" data-th-text="#{SppiTest002.finprodName}">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodName" name="finprodName" required="required"
                                               class="layui-input form-input" maxlength="75"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.finprodName}" disabled="true" />
                                    </div>
                                </div>
                                <div class="form-inline-wrap" style="width: 70%!important;">
                                    <div class="layui-inline layui-col-md12 layui-col-xs12 layui-col-sm12 layui-col-lg12">
                                        <label class="layui-form-label form-label-wrap" style="width:15%" data-th-text="#{SppiTest002.debtLayerDesc}">债务分层情况</label>
                                        <div class="layui-input-inline input-inline" style="width: 80%!important;">
                                            <input type="text" id="debtLayerDesc" name="debtLayerDesc"
                                                   class="layui-input form-input" maxlength="400"
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value="${entity?.debtLayerDesc}" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" data-th-text="#{SppiTest002.p6}">合同现金流是否仅为本金及利息的支付测试(SPPI测试)</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q45}">该资产是否为权益投资、含权资产、衍生工具</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q45" id="sppiTest002Q45"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q45']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q46}">资产无杠杆利率，或利率与利率与商品价格、外币汇率等挂钩</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q46" id="sppiTest002Q46"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q46']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q47}">
                                        不含有除基本借贷风险以外的其他风险（例如转股条款、参与经营、参与利润分享等）
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q47" id="sppiTest002Q47"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q47']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblSmaller" data-th-text="#{SppiTest002.q48}">
                                        如有提前还款权的，提前还款的金额(含额外补偿)是否几乎代表尚未支付之本金及未偿付本金金额之利息
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadioBigger">
                                        <input type="text" name="sppiTest002Q48" id="sppiTest002Q48"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q48']?.answerValue}"
                                               data-th-data-result="${YES_NO_NA}" required="required" />
                                    </div>
                                </div>
                            </div>


                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblSmaller" data-th-text="#{SppiTest002.q49}">
                                        如有展期权的，展期后的现金流量（含额外补偿）是否几乎代表尚未支付的本金及未偿付本金金额之利息
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadioBigger">
                                        <input type="text" name="sppiTest002Q49" id="sppiTest002Q49"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q49']?.answerValue}"
                                               data-th-data-result="${YES_NO_NA}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblSmaller" data-th-text="#{SppiTest002.q50}">
                                        如果为浮动利率的，浮动利率的重设频率是否与利率期间一致
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadioBigger">
                                        <input type="text" name="sppiTest002Q50" id="sppiTest002Q50"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q50']?.answerValue}"
                                               data-th-data-result="${YES_NO_NA}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblSubSmaller" data-th-text="#{SppiTest002.q51}">
                                        如果浮动利率的重设频率与利率期间不一致，该金融资产的未折现合同现金流量是否可能与未折现基准现金流量显著不同
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadioBigger">
                                        <input type="text" name="sppiTest002Q51" id="sppiTest002Q51"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q51']?.answerValue}"
                                               data-th-data-result="${YES_NO_NA}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblSmaller" data-th-text="#{SppiTest002.q52}">
                                        无其他影响基本借贷关系和仅本息的特征
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadioBigger">
                                        <input type="text" name="sppiTest002Q52" id="sppiTest002Q52"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q52']?.answerValue}"
                                               data-th-data-result="${YES_NO_NA}" required="required" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" data-th-text="#{SppiTest002.p7}">结论</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbld" data-th-text="#{SppiTest002.result}">SPPI测试结果</label>
                                    <div class="layui-input-inline input-inline questionRadioBigger1">
                                        <input type="text" name="sppiTest002Result" id="sppiTest002Result"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.testStatus}"
                                               data-th-data-result="${SPPI_TEST_STATUS}" disabled="true" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 备注 -->
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" th:text="#{SysCommon.remark}">备注</span><i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item" style="padding-bottom: 8px;">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" style="width: 100%;">
                                    <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
										<textarea id="remark" name="remark" placeholder="请输入内容"
                                                  data-th-placeholder="#{SysCommon.placeholder}" maxlength="300"
                                                  class="layui-textarea" data-th-text="${entity?.remark}">
										</textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pro-module-wrapper pro-module-block">
                <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                    <div class="text-center">
                        <a id="SppiTest002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="SppiTest002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                        <a id="SppiTest002_btn_reset" class="layui-btn layui-btn-sm btn-reset" data-th-text="#{SysCommon.reset}">重置</a>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <link rel="stylesheet" type="text/css" data-th-href="@{/css/invest/asset/sppi/sppi.css}">
    <script th:inline="javascript" type="text/javascript">
        var workflowId = /*[[${entity?.workflowId}]]*/'';
        var assetType = /*[[${entity?.assetType}]]*/'';
        var sppiTmpType = /*[[${entity?.sppiTmpType}]]*/'';
        var sppiTmpNo = /*[[${entity?.sppiTmpNo}]]*/'';
        var SPPI_PASS = /*[[${SPPI_PASS}]]*/'';
        var SPPI_NOT_PASS = /*[[${SPPI_NOT_PASS}]]*/'';
        var HIDE_IDS = /*[[${entity?.hideIds}]]*/'';
        var YES = /*[[${YES}]]*/'';
        var NO = /*[[${NO}]]*/'';
        var NA = /*[[${NA}]]*/'';
        var DISABLE_IDS = /*[[${entity?.disabledFieldList}]]*/[];
        var realPageId = /*[[${realPageId}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/asset/sppi/SppiTest002.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/invest/asset/sppi/SppiTemplateBondKpmg.js}" type="text/javascript"></script>
</div>
</body>
</html>
