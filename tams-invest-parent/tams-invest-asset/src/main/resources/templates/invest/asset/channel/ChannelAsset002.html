<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="|#{invest.channelId}#{ChannelAsset002.title}|">债券标的资产新建</title>
</head>
<body>
    <div layout:fragment="content" id="ChannelAsset002_DIV">
            <form class="layui-form joyin-form-wrap pro-module-form"
                id="submitForm">
                <input id="finprodId" name="finprodId" data-th-value="${entity?.finprodId}" hidden> 
                <input id="finprodType2" name="finprodType2" data-th-value="${entity?.finprodType2}" hidden> 
                <input id="oldBusiAcctNo" name="oldBusiAcctNo" data-th-value="${entity?.oldBusiAcctNo}" hidden> 
                <!--/*@thymesVar id="workflowId" type=""*/-->
                <input id="workflowId" name="workflowId" data-th-value="${workflowId}" hidden> 
                <!-- 临时附件ID add by yanya 20190903 start-->
                <input id="fjId" name="fjId" data-th-value="${entity?.fjId}" hidden>
                <!-- 临时附件ID add by yanya 20190903 end-->
                <div class="pro-module-wrapper pro-module-base step" title="基本信息">
                <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i
                            class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                <div class="pro-module-item pro-item-wrap">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap"
                                data-th-text="|#{invest.channelId}#{ChannelAsset002.finprodIdBak}|">合作资产代码</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="finprodMarketId"
                                    name="finprodMarketId" maxlength="20"
                                    data-th-value="${entity?.finprodMarketId}"
                                    class="layui-input form-input" placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}" required>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap"
                                data-th-text="|#{invest.channelId}#{ChannelAsset002.finprodNameBak}|">合作资产名称</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" name="finprodName" id="finprodName"
                                    data-th-value="${entity?.finprodName}" maxlength="50"
                                    class="layui-input form-input" placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}" required>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap"
                                data-th-text="#{ChannelAsset002.prodRegistCode}">登记编码</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" name="prodRegistCode" id="prodRegistCode"
                                    data-th-value="${entity?.prodRegistCode}" maxlength="14"
                                    class="layui-input form-input" placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}" required>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap"
                                data-th-text="#{ChannelAsset002.manager}">管理人</label>
                            <div class="layui-input-inline input-inline">
                                <select name="manager" id="manager"
                                    class="layui-input form-input input-select"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-url="@{/invest/asset/plan/plancur/FinPlanAssetC002/getManagerId}"
                                    data-th-initValue='${entity?.manager}' required="required">
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap"
                                data-th-text="#{ChannelAsset002.trusteeId}">托管人</label>
                            <div class="layui-input-inline input-inline">
                                <select name="trusteeId" id="trusteeId"
                                    class="layui-input form-input input-select"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-url="@{/invest/asset/plan/plancur/FinPlanAssetC002/getTrusteeId}"
                                    data-th-initValue='${entity?.trusteeId}' required="required">
                                </select>
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap"
                                data-th-text="#{ChannelAsset002.busiAcctNo}">资金账户</label>
                            <div class="layui-input-inline input-inline">
                                <select name="busiAcctNo" id="busiAcctNo"
                                    class="layui-input form-input input-select"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-url="@{/invest/asset/channel/ChannelAsset002/getAcctNo}"
                                    data-th-initValue='${entity?.busiAcctNo}' required="required">
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap"
                                data-th-text="#{ChannelAsset002.vdate}">成立日期</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="vdate" name="vdate"
                                    data-th-value='${#dates.format(entity?.vdate?:iPlatformDate,"yyyy-MM-dd")}'
                                    required="required"
                                    class="layui-input form-input input-dateSelect" />
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap"
                                data-th-text="#{ChannelAsset002.mdate}">终止日期</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="mdate" name="mdate"
                                    data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
                                    required="required"
                                    class="layui-input form-input input-dateSelect" />
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-label-wrap"
                                data-th-text="#{ChannelAsset002.payType}">划款方式
                            </label>
                            <div class="layui-input-inline input-inline">
                                <select id="payType" name="payType"
                                    th:initValue="*{entity?.payType}"
                                    class="layui-input form-input input-select"
                                    placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}" required
                                    data-th-data-result="${PAY_MODE}"
                                    ></select>
                            </div>
                        </div>
                        </div>
                       <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                    data-th-text="#{ChannelAsset002.calendarId}">交易日历</label>
                                <div class="layui-input-inline input-inline">
                                    <select name="calendarId" id="calendarId"
                                        class="layui-input form-input input-select"
                                        data-th-placeholder="#{SysCommon.placeholder}"
                                        data-th-data-url="@{/business/common/CommonSelect/selectCalendarId}"
                                        data-th-initValue='${entity?.calendarId}'
                                        required="required">
                                    </select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                    data-th-text="|#{invest.channelId}#{ChannelAsset002.collectTypeBak}|">合作资产费用收取方式</label>
                                <div class="layui-input-inline input-inline">
                                     <select id="collectType" name="collectType"
                                    th:initValue="*{entity?.collectType}"
                                    class="layui-input form-input input-select"
                                    placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}" required
                                    data-th-data-result="${COLLECT_TYPE}"
                                    ></select>
                                </div>
                            </div>
                        <!-- 通道增加“增值税税率，附加税率字段” add by renping 20191019 start -->
		                    <div class="form-inline-wrap">
		                        <label class="layui-form-label form-label-wrap" data-th-text="#{ChannelAsset002.vatTaxRate}">增值税税率</label>
		                        <div class="layui-input-inline input-inline">
		                            <input type="text" th:id="vatTaxRate" th:name="vatTaxRate" th:value="${entity?.vatTaxRate}"
		                                   class="layui-input form-input text-number" data-textrange="4"/>
		                        </div>
		                    </div>
                        </div>
                        <div class="layui-form-item">
		                    <div class="form-inline-wrap">
		                        <label class="layui-form-label form-label-wrap" data-th-text="#{ChannelAsset002.adtTaxRate}">附加税税率</label>
		                        <div class="layui-input-inline input-inline">
		                            <input type="text" th:id="adtTaxRate" th:name="adtTaxRate" th:value="${entity?.adtTaxRate}"
		                                   class="layui-input form-input text-number" data-textrange="4"/>
		                        </div>
		                    </div>
                        </div>
                        <!-- 通道增加“增值税税率，附加税率字段” add by renping 20191019 end -->
                    </div>
            <!-- 通道费用 -->
            <div class="page-component" 
                th:data-path="@{/component/prod/BussFinProductFeeInfo/init}"   
                th:data-params="|{entityName: 'bussFinProductFeeInfoDto',   pageId: '${pageId}', workflowId: '${workflowId ?: ''}', finprodId: '${finprodId ?: ''}',FINPROD_TYPE_F28:'${FINPROD_TYPE_F28?:''}', profitTypeElement: 'FinProductBuild002_profitType', dealCalIdElement: 'FinProductBuild002_calendarId', vdateElement: 'FinProductBuild002_vdate', mdateElement: 'FinProductBuild002_mdate', finprodMarketIdElement: 'FinProductBuild002_feeNewAddId', ptlIdElement: 'FinProductBuild002_ptlId'}|">
            </div>
             <!-- 申报参数基本信息 -->
            <div class="page-component"
                th:data-path="@{/component/report/asset/plan/BussRepAssetMngProdInfo/init}"
                th:data-params="|{pageModel:pageModel,entityName: 'bussRepAssetMngProdInfo',finprodId: '${finprodId ?: ''}',workflowId:'${workflowId}', pageId:'${pageId}'}|">
             </div>
             <!-- 附件信息 add by yanya 20190903 start-->
             <div class="page-component" th:data-path="@{/component/core/FileCommon/init}" th:data-params="|{entityName: 'fileCommonDto', businessId: '${entity?.fjId ?: ''}'}|"></div>
             <!-- 附件信息 add by yanya 20190903 end-->
            </div>
            <div class="row text-center stepbar">
                <a id="ChannelAsset002_btn_save"
                    class="layui-btn layui-btn-sm btn-save"
                    data-th-text="#{SysCommon.save}">保存</a> <a
                    id="ChannelAsset002_btn_submit"
                    class="layui-btn layui-btn-sm btn-submit"
                    data-th-text="#{SysCommon.submit}">提交</a> <a
                    id="ChannelAsset002_btn_cancel"
                    class="layui-btn layui-btn-sm btn-cancel"
                    data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
            </form>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
            var isTransInAsset = /*[[${isTransInAsset}]]*/'';//该资产是否有交易
            var FINPROD_TYPE_F28 = /*[[${FINPROD_TYPE_F28}]]*/'';//该资产是否有交易
        </script>
        <script data-th-src="@{/js/invest/asset/channel/ChannelAsset002.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/invest/asset/common/AssetCommon.js}" type="text/javascript"></script>
    </div>
</body>

</html>
