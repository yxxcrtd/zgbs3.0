<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinAssetRateAdj001}">利率调整</title>
</head>
<body>
    <div layout:fragment="content" id="FinAssetRateAdj001_DIV">
        <input id="finprodId" th:value="${finprodId}" hidden>
        <input id="finprodMarketId" th:value="${finprodMarketId}" hidden>
        <input id="finprodName" th:value="${finprodName}" hidden>
        <input id="finprodType2" th:value="${finprodType2}" hidden>
        <input id="workflowId" th:value="${workflowId}" hidden>
        <input id="rateType" th:value="${rateType}" hidden>
        <div style="margin: 5px;display: none" id="FinAssetRateAdj001_btn_submit_div" >
            <a id="FinAssetRateAdj001_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
            var INT_ASSET_TYPE = /*[[${finprodType2}]]*/'01';//初始化 --金融产品类型(投管)
            var FINPROD_TYPE_TG_F01 = /*[[${FINPROD_TYPE_TG_F01}]]*/'F01'; //债券资产类型code
            var FINPROD_TYPE_TG_F07 = /*[[${FINPROD_TYPE_TG_F07}]]*/'F07'; //存款资产类型code
            var FINPROD_TYPE_TG_F17 = /*[[${FINPROD_TYPE_TG_F17}]]*/'F17'; //计划类资产类型code
            var FINPROD_TYPE_TG_F18 = /*[[${FINPROD_TYPE_TG_F17}]]*/'F18'; //项目类资产类型code
            var FINPROD_TYPE_TG_F28 = /*[[${FINPROD_TYPE_TG_F28}]]*/'F28'; //通道code
            var RATE_TYPE_01 = /*[[${RATE_TYPE_01}]]*/'01'; //固定利率
            var finprodId = /*[[${finprodId}]]*/'';    //资产id 
            var finprodName = /*[[${finprodName}]]*/'';//资产名称
            var finprodAbbr = /*[[${finprodAbbr}]]*/'';//资产简称
            var finprodMarketId = /*[[${finprodMarketId}]]*/'';//市场id 
            var iPlatformDate = /*[[${iPlatformDate}]]*/'';//平台日期 
            var isInitial = /*[[${isInitial}]]*/'';//是否.否
        </script>
        <script data-th-src="@{/js/invest/asset/common/FinAssetRateAdj001.js}" type="text/javascript"></script>
    </div>
</body>

</html>
