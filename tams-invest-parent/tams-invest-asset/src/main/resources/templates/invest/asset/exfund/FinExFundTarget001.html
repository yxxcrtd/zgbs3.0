<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinExFundTarget001}">场内基金类标的信息</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				<a id="FinExFundTarget001_btn_add"
					class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a> 
			    <a id="FinExFundTarget001_btn_delete"
					class="layui-btn layui-btn-sm btn-delete"
					data-th-text="#{SysCommon.delete}">删除</a>
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinExFundTarget001.finprodMarketId}">资产代码</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="finprodMarketId" name="finprodMarketId"
									class="layui-input form-input input-lenovoselect"
									placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-url="@{/invest/asset/exfund/FinExFundTarget001/getFinprodMarketIdList}"
									data-idfield="code" data-keyfield="code" 
									data-th-data-effectivefieldsalias='|{"code":"#{FinExFundTarget001.finprodMarketId}",
									"shortName":"#{FinExFundTarget001.finprodName}"}|'>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4" >
							<label class="layui-form-label form-lable"
								data-th-text="#{FinExFundTarget001.trmFundType}">基金类型</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="trmFundType" name="trmFundType"
									class="layui-input form-input input-select"
									placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result = '${TRM_FUND_TYPE}'
									>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinExFundTarget001.etfType}">二级类型
							</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="etfType" name="etfType"
									   class="layui-input form-input input-select"
									   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
									   data-th-data-result = '${ETF_TYPE}'
								>
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinExFundTarget001.tradeMarket}">交易场所</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="tradeMarket" name="tradeMarket"
									class="layui-input form-input input-select" 
									allowClear="true" placeholder="请输入内容"
									data-th-data-result = '${TRADE_PLACE}'
									data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{FinExFundTarget001.manager}">管理人</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="manager" name="manager"
										class="layui-input form-input input-select"
										allowClear="true" placeholder="请输入内容"
										data-th-data-url="@{/invest/asset/exfund/FinExFundTarget002/getManager}"
										data-th-placeholder="#{SysCommon.placeholder}" >
								</select>
							</div>
						</div>
						<div
								class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{FinExFundTarget001.vdate}">成立日期</label>
							<div class="layui-input-inline input-inline">
								<input id='vdate' name='vdate'
									   class="layui-input form-input input-dateRangeSelect"
									   placeholder="请选择时间区间"
									   data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
					</div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
    		var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
    	</script>
		<script data-th-src="@{/js/invest/asset/exfund/FinExFundTarget001.js}"></script>
	</div>
</body>
</html>
