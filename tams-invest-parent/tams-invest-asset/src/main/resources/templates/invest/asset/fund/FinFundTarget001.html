<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinFundTarget001}">基金类标的信息</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				<a id="FinFundTarget001_btn_add"
					class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a> 
			    <a id="FinFundTarget001_btn_delete"
					class="layui-btn layui-btn-sm btn-delete"
					data-th-text="#{SysCommon.delete}">删除</a>
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinFundTarget001.finprodMarketId}">资产代码</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="finprodMarketId" name="finprodMarketId"
									class="layui-input form-input input-lenovoselect"
									placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-url="@{/invest/asset/fund/FinFundTarget001/getFinprodMarketIdList}"
									data-idfield="code" data-keyfield="code" 
									data-th-data-effectivefieldsalias='|{"code":"#{FinFundTarget001.finprodMarketId}",
									"shortName":"#{FinFundTarget001.finprodName}"}|'>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4" style="display:none">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinFundTarget001.fundType}">基金类型</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="fundType" name="fundType"
									class="layui-input form-input input-select"
									placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result = '${FUND_ASSET_TYPE}'
									>
							</div>
						</div>
						<!-- added by wangguiqi on 2019/7/22 -->
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinFundTarget001.type9}">资产二级分类</label>
							<div class="layui-input-inline input-inline">
								<select id="type9" name="type9" class="layui-input form-input input-select" 
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result = '${CUSTOM_ASSET_TYPE_TWO}' multiple></select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinFundTarget001.type10}">资产三级分类</label>
							<div class="layui-input-inline input-inline">
								<select id="type10" name="type10" class="layui-input form-input input-select"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result = '${CUSTOM_ASSET_TYPE_THREE}' multiple></select>
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4" style="display: none" id = "type11Div">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinFundTarget001.type11}">资产四级分类</label>
							<div class="layui-input-inline input-inline">
								<select id="type11" name="type11" class="layui-input form-input input-select" 
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result = '${CUSTOM_ASSET_TYPE_FOUR}' multiple></select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinFundTarget001.ccy}">币种</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="ccy" name="ccy"  class="layui-input form-input input-select" 
									 allowClear="true" placeholder="请输入内容"
									 data-th-data-result='${CCY}'
									 th:initValue="${CCY_default}"
									data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinFundTarget001.tradeMarket}">交易场所</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="tradeMarket" name="tradeMarket"
									class="layui-input form-input input-select" 
									allowClear="true" placeholder="请输入内容"
									data-th-data-result = '${TRADE_PLACE}'
									data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinFundTarget001.manager}">管理人</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="manager" name="manager"
									class="layui-input form-input input-select" 
									allowClear="true" placeholder="请输入内容"
									data-th-data-url="@{/invest/asset/fund/FinFundTarget002/getManager}"
									data-th-placeholder="#{SysCommon.placeholder}" >
								</select>
							</div>
						</div>
						<!--<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinFundTarget001.purSpeed}">交易方式</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="purSpeed" name="purSpeed"
									class="layui-input form-input input-select" 
									allowClear="true" placeholder="请输入内容"
									data-th-data-result = '${ACCOUNT_SPEED}'
									data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>-->
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{FinFundTarget002.purSpeed}">申购确认速度</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="purSpeed" name="purSpeed"
									   class="layui-input form-input"
									   allowClear="true" placeholder="请输入内容" required>
								</input>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{FinFundTarget002.redSpeed}">赎回确认速度</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="redSpeed" name="redSpeed"
									   class="layui-input form-input"
									   allowClear="true" placeholder="请输入内容" required>
								</input>
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinFundTarget001.carryoverFreq}">分红频率</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="carryoverFreq" name="carryoverFreq"
									class="layui-input form-input input-checkbox"
									data-th-data-result='${RETURN_FREQUENCY}' />
							</div>
						</div>
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinFundTarget001.vdate}">成立日期</label>
							<div class="layui-input-inline input-inline">
								<input id='vdate' name='vdate'
									class="layui-input form-input input-dateRangeSelect"
									placeholder="请选择时间区间"
									data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
						<div
								class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{FinFundTarget001.divideMethod}">分红方式 </label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="divideMethod" name="divideMethod"
									   class="layui-input form-input input-checkbox"
									   data-th-data-result="${BONUS_MODE}" />
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg">
							<label class="layui-form-label form-lable"
								   data-th-text="#{FinFundTarget002.trmFundType}">交易所基金类型</label>
							<div class="layui-input-inline input-inline">
								<select id="trmFundType" name="trmFundType" class="layui-input form-input input-select"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-data-result = '${TRM_FUND_TYPE}' multiple></select>
							</div>
						</div>
					</div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
    		var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
    	</script>
		<script data-th-src="@{/js/invest/asset/fund/FinFundTarget001.js}"></script>
	</div>
</body>
</html>
