<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinPlanProfitAsset001}">计划类资产（利率型）</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				<a id="FinPlanProfitAsset001_btn_create"
					class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a> 
			    <a id="FinPlanProfitAsset001_btn_delete"
					class="layui-btn layui-btn-sm btn-delete"
					data-th-text="#{SysCommon.delete}">删除</a>
				<a id="FinPlanProfitAsset001_btn_rateAdjust"
					class="layui-btn layui-btn-sm btn-rateAdjust"
					data-th-text="#{FinPlanProfitAsset001.rateAdjust}">利率调整</a>
                    <a id="FinPlanProfitAsset001_btn_stageManagement"
                    class="layui-btn layui-btn-sm btn-stageManagement"
                    data-th-text="#{FinPlanProfitAsset001.stageManagement}">期次管理</a>
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinPlanProfitAsset001.finProdMarketId}">资产代码</label>
							<!-- <div class="layui-input-inline input-inline">
								<input type="text" id="finprodMarketId" name="finprodMarketId"
									class="layui-input form-input input-lenovoselect"
									placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-url="@{/invest/asset/plan/planProfit/FinPlanProfitAsset001/getFinProdMarketId}"
									data-idfield="id" data-keyfield="id" 
									data-th-data-effectivefieldsalias='|{"code":"#{FinPlanProfitAsset001.finProdMarketId}",
									"shortName":"#{FinPlanProfitAsset001.finProdName}"}|'>
							</div> -->
                            <div class="layui-input-inline input-inline">
                              <input type="text" id="finprodMarketId"  name="finprodMarketId" class="layui-input form-input input-lenovoselect" placeholder="请输入内容" 
                              data-th-placeholder="#{SysCommon.placeholder}"
									 data-th-data-url="@{/invest/asset/common/getAssetId(finprodType2=${FINPROD_TYPE_TG_F17},profitType=${PROFIT_TYPE_01},child=false)}"
                              data-idfield="code" data-keyfield="code"
                              data-th-data-effectivefieldsalias='|{"shortName":"#{FinDepositTarget002.finprodName}","code":"#{FinDepositTarget002.finprodId}"}|'>
                    </div>
                         
						</div>
			<!-- 			 /*   start、zhuyongkang、2019.7.18、添加了查询的条件资产234级分类，隐藏了12级   */  -->
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{FinPlanProfitAsset001.type9}">二级分类</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="type9" name="type9"
										class="layui-input form-input input-select"
										data-th-data-result = '${CUSTOM_ASSET_TYPE_TWO}'
										allowClear="true" multiple="true" placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}"
										formatoption="true"
										>
								</select>
							</div>
						</div>
	                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4" >
							<label class="layui-form-label form-lable"
								data-th-text="#{FinPlanProfitAsset001.type10}">债券三级分类
							</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="type10" name="type10"
									class="layui-input form-input input-select"
										allowClear="true" multiple="true" placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}" 
									data-th-data-result="${CUSTOM_ASSET_TYPE_THREE}"
										formatoption="true"></select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4" style="display:none">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinPlanProfitAsset001.category}">一级分类</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="category" name="category"
									class="layui-input form-input input-select"
									data-th-data-result = '${PLAN_ASSET_TYPE}'
									allowClear="true" multiple="true" placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									formatoption="true">
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4" style="display:none">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinPlanProfitAsset001.type}">二级分类</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="type" name="type"  class="layui-input form-input input-select" 
									allowClear="true" multiple="true" placeholder="请输入内容"
									data-th-data-result = '${PLAN_ASSET_SEC_TYPE}' formatoption="true"
									data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<!-- <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4" style="display: none">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinPlanProfitAsset001.transMode}">交易方式</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="transMode" name="transMode" formatoption="true"
									class="layui-input form-input input-select" 
									allowClear="true" placeholder="请输入内容"
									data-th-data-result = '${ACCOUNT_SPEED}'
									data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div> -->
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4" style="display: none" id = "type11Div">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{FinPlanProfitAsset001.type11}">债券四级分类
						</label>
						<div class="layui-input-inline input-inline">
							<select id="type11" name="type11"
								th:initValue="*{entity?.type11}"
								class="layui-input form-input input-select"
								allowClear="true" multiple="true"placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}" 
								data-th-data-result="${CUSTOM_ASSET_TYPE_FOUR}"
								></select>
						</div>
				      </div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4" style="display: none" id = "type12Div">
							<label class="layui-form-label form-label-wrap"
								   data-th-text="#{FinPlanProfitAsset001.type12}">债券五级分类
							</label>
							<div class="layui-input-inline input-inline">
								<select id="type12" name="type12"
										th:initValue="*{entity?.type12}"
										class="layui-input form-input input-select"
										allowClear="true" multiple="true"placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-data-result="${CUSTOM_ASSET_TYPE_FIVE}"
										></select>
							</div>
						</div>
						<!-- /*  end、zhuyongkang、2019.7.18、添加了查询的条件资产234级分类，隐藏了12级   */ -->
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinPlanProfitAsset001.currency}">币种</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="ccy" name="ccy"
									class="layui-input form-input input-select" 
									allowClear="true" placeholder="请输入内容"
									data-th-data-result = '${CCY}' formatoption="true"
									th:initValue="${CCY_default}"
									data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{FinPlanProfitAsset001.vDate}">成立日期</label>
							<div class="layui-input-inline input-inline">
								<input id="vdate" name="vdate"
									   class="layui-input form-input input-dateRangeSelect"
									   placeholder="请选择时间区间"
									   data-th-placeholder="#{SysCommon.dateInterval}">
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinPlanProfitAsset001.mDate}">终止日期</label>
							<div class="layui-input-inline input-inline">
								<input id="mdate" name="mdate"
								class="layui-input form-input input-dateRangeSelect"
								placeholder="请选择时间区间"
								data-th-placeholder="#{SysCommon.dateInterval}">
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
								   data-th-text="#{FinPlanProfitAsset002.issuer}">发行人</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="issuer" name="issuer" class="layui-input form-input input-select"
										data-th-data-url="@{/invest/asset/project/FinProjectTargetAsset002/getFinancier(IS_ISSUER=${YES})}"
										placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
<!--						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                               <label class="layui-form-label form-label-wrap"
                                   data-th-text="#{FinPlanProfitAsset001.manager}">管理人</label>
                               <div class="layui-input-inline input-inline">
                                   <select type="text" id="manager" name="manager" class="layui-input form-input input-select"
                                           data-th-data-url="@{/invest/asset/plan/planNet/FinPlanNetAsset002/getManager}"
                                           placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                                   </select>
                               </div>
                        </div>-->
<!--						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
								   data-th-text="#{FinPlanProfitAsset002.trusteeId}">托管人</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="trusteeId" name="trusteeId" class="layui-input form-input input-select"
										data-th-data-url="@{/invest/asset/project/FinProjectTargetAsset002/getFinancier(IS_TRUSTER=${YES})}"
										placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>-->
					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{FinPlanProfitAsset002.parentPlan}">是否母计划</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="parentPlan" name="parentPlan"
										class="layui-input form-input input-select"
										allowClear="true" placeholder="请输入内容"
										data-th-data-result = '${YES_OR_NO}' formatoption="true"
										data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
					</div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
    		var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
    	</script>
		<script data-th-src="@{/js/invest/asset/plan/planProfit/FinPlanProfitAsset001.js}"></script>
        <script data-th-src="@{/js/invest/asset/common/AssetCommon.js}" type="text/javascript"></script>
	</div>
</body>
</html>
