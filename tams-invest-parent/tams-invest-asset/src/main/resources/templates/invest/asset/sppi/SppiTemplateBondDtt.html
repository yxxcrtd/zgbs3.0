<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{SppiTemplateBondDtt.create}">债券类资产SPPI测试新建（德勤模板）</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" data-th-text="#{SppiTest002.p1}">资产基本信息</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" style="width: 29%!important;">
                                    <label class="layui-form-label form-lable" data-th-text="#{SppiTest002.finprodId}">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodId" name="finprodId" required="required"
                                               class="layui-input form-input" maxlength="75"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.finprodId}" disabled="true" style="display:none" />
                                        <input type="text" id="finprodMarketId" name="finprodMarketId" required="required"
                                               class="layui-input form-input" maxlength="75"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.finprodMarketId}" disabled="true" />
                                    </div>
                                </div>
                                <div class="form-inline-wrap" style="width: 70%!important;">
                                    <div class="layui-inline layui-col-md12 layui-col-xs12 layui-col-sm12 layui-col-lg12">
                                        <label class="layui-form-label form-label-wrap" style="width:15%" data-th-text="#{SppiTest002.debtToolDesc}">债务工具介绍</label>
                                        <div class="layui-input-inline input-inline" style="width: 80%!important;">
                                            <input type="text" id="debtToolDesc" name="debtToolDesc"
                                                   class="layui-input form-input" maxlength="400"
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value="${entity?.debtToolDesc}" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" style="width: 29%!important;">
                                    <label class="layui-form-label form-lable" data-th-text="#{SppiTest002.finprodName}">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodName" name="finprodName" required="required"
                                               class="layui-input form-input" maxlength="75"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.finprodName}" disabled="true" />
                                    </div>
                                </div>
                                <div class="form-inline-wrap" style="width: 70%!important;">
                                    <div class="layui-inline layui-col-md12 layui-col-xs12 layui-col-sm12 layui-col-lg12">
                                        <label class="layui-form-label form-label-wrap" style="width:15%" data-th-text="#{SppiTest002.debtLayerDesc}">债务分层情况</label>
                                        <div class="layui-input-inline input-inline" style="width: 80%!important;">
                                            <input type="text" id="debtLayerDesc" name="debtLayerDesc"
                                                   class="layui-input form-input" maxlength="400"
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value="${entity?.debtLayerDesc}" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" data-th-text="#{SppiTest002.p4}">合同现金流是否仅为本金及利息的支付测试(SPPI测试)</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="detailTitle1" data-th-text="#{SppiTest002.t9}">利率条件</div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblSmaller" data-th-text="#{SppiTest002.q28}">利率类型</label>
                                    <div class="layui-input-inline input-inline questionRadioBigger">
<!--                                        <input type="radio" name="sppiTest002Q28" id="sppiTest002Q28_fixed" value="fixed" lay-filter="SppiTest002Q28" th:title="#{SppiTest002.fixedRate}"
                                               data-th-checked="'fixed' == ${entity?.qaMap['sppiTest002Q28']?.answerValue}" />
                                        <input type="radio" name="sppiTest002Q28" id="sppiTest002Q28_float" value="float" lay-filter="SppiTest002Q28" th:title="#{SppiTest002.floatRate}"
                                               data-th-checked="'float' == ${entity?.qaMap['sppiTest002Q28']?.answerValue}" required="required" />-->
                                        <input type="text" name="sppiTest002Q28" id="sppiTest002Q28"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q28']?.answerValue}"
                                               data-th-data-result="${INT_TYPE}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q29}">若为浮动利率，重设期间指标利率是否与重设期间一致</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q29" id="sppiTest002Q29"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q29']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q30}">
                                        若不一致，修正后合同现金流量与其他条件相同但利率期间匹配的债务工具合同现金流量相比较，是否存在显著差异?
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q30" id="sppiTest002Q30"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q30']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblSmaller" data-th-text="#{SppiTest002.q31}">递延付息选择权，递延未付利息仍加计利息</label>
                                    <div class="layui-input-inline input-inline questionRadioBigger">
<!--                                        <input type="radio" name="sppiTest002Q31" id="sppiTest002Q31_Y" value="Y" lay-filter="SppiTest002Q31" th:title="#{SppiTest002.yes}"
                                               data-th-checked="'Y' == ${entity?.qaMap['sppiTest002Q31']?.answerValue}" />
                                        <input type="radio" name="sppiTest002Q31" id="sppiTest002Q31_N" value="N" lay-filter="SppiTest002Q31" th:title="#{SppiTest002.no}"
                                               data-th-checked="'N' == ${entity?.qaMap['sppiTest002Q31']?.answerValue}" />
                                        <input type="radio" name="sppiTest002Q31" id="sppiTest002Q31_NA" value="NA" lay-filter="SppiTest002Q31" th:title="#{SppiTest002.na}"
                                               data-th-checked="'NA' == ${entity?.qaMap['sppiTest002Q31']?.answerValue}" required="required" />-->
                                        <input type="text" name="sppiTest002Q31" id="sppiTest002Q31"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q31']?.answerValue}"
                                               data-th-data-result="${YES_NO_NA}" required="required" />
                                    </div>
                                </div>
                            </div>

                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblc" data-th-text="#{SppiTest002.c7}">A结论：利率条件是否影响通过SPPI测试</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002C7" id="sppiTest002C7"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002C7']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" disabled="true" />
                                    </div>
                                </div>
                            </div>

                            <div class="detailTitle1" data-th-text="#{SppiTest002.t10}">合同连接工具</div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q32}">是否为分级证券</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q32" id="sppiTest002Q32"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q32']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblSub" data-th-text="#{SppiTest002.q33}">
                                        分级证券合同条款中发行人是否仅支付本金与未偿付本金金额之利息
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q33" id="sppiTest002Q33"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q33']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblSub" data-th-text="#{SppiTest002.q34}">
                                        资产池的所有金融工具是否均满足仅支付本金与利息
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q34" id="sppiTest002Q34"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q34']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q35}">
                                        该分级信用风险是否低于整体群组下的信用风险
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q35" id="sppiTest002Q35"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q35']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>

                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblc" data-th-text="#{SppiTest002.c8}">B结论</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002C8" id="sppiTest002C8"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002C8']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" disabled="true" />
                                    </div>
                                </div>
                            </div>

                            <div class="detailTitle1" data-th-text="#{SppiTest002.t11}">混合合同</div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q36}">是否隐含嵌入性合同</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q36" id="sppiTest002Q36"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q36']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionTextLblSub" data-th-text="#{SppiTest002.q37}">嵌入要素性质</label>
                                    <div class="layui-input-inline input-inline questionText">
                                        <!--/*@thymesVar id="sppiTest002Q37Init" type="java.lang.String"*/-->
                                        <input type="text" id="sppiTest002Q37" name="sppiTest002Q37"
                                               class="layui-input form-input" maxlength="200"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.qaMap['sppiTest002Q37']?.answerValue}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblSub" data-th-text="#{SppiTest002.q38}">嵌入要素性质是否具有杠杆性</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q38" id="sppiTest002Q38"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q38']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>

                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblc" data-th-text="#{SppiTest002.c9}">C结论</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002C9" id="sppiTest002C9"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002C9']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" disabled="true" />
                                    </div>
                                </div>
                            </div>

                            <div class="detailTitle1" data-th-text="#{SppiTest002.t12}">提前还款</div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q39}">是否可选择提前还款</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q39" id="sppiTest002Q39"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q39']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblSub" data-th-text="#{SppiTest002.q40}">是否有提前还款的额外补偿</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q40" id="sppiTest002Q40"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q40']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblSub" data-th-text="#{SppiTest002.q41}">提前偿还现金流与原始现金流相比是否有显著差异</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q41" id="sppiTest002Q41"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q41']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>

                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblc" data-th-text="#{SppiTest002.c10}">D结论</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002C10" id="sppiTest002C10"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002C10']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" disabled="true" />
                                    </div>
                                </div>
                            </div>

                            <div class="detailTitle1" data-th-text="#{SppiTest002.t13}">展期</div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q42}">是否可选择展期</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q42" id="sppiTest002Q42"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q42']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblSub" data-th-text="#{SppiTest002.q43}">是否有展期的额外补偿</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q43" id="sppiTest002Q43"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q43']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblSub" data-th-text="#{SppiTest002.q44}">
                                        展期后的现金流量（含额外补偿）是否几乎代表尚未支付的本金及未偿付本金金额之利息
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q44" id="sppiTest002Q44"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q44']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>

                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblc" data-th-text="#{SppiTest002.c11}">E结论</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002C11" id="sppiTest002C11"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002C11']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" disabled="true" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" data-th-text="#{SppiTest002.p5}">结论</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbld" data-th-text="#{SppiTest002.result}">SPPI测试结果</label>
                                    <div class="layui-input-inline input-inline questionRadioBigger1">
                                        <input type="text" name="sppiTest002Result" id="sppiTest002Result"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.testStatus}"
                                               data-th-data-result="${SPPI_TEST_STATUS}" disabled="true" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 备注 -->
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" th:text="#{SysCommon.remark}">备注</span><i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item" style="padding-bottom: 8px;">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" style="width: 100%;">
                                    <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
										<textarea id="remark" name="remark" placeholder="请输入内容"
                                                  data-th-placeholder="#{SysCommon.placeholder}" maxlength="300"
                                                  class="layui-textarea" data-th-text="${entity?.remark}">
										</textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pro-module-wrapper pro-module-block">
                <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                    <div class="text-center">
