<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/default}">
<head>
	<title data-th-text="#{FinExFundTarget002}">场内基金标的信息新建</title>
</head>
<body>
<div layout:fragment="content">
	<form class="layui-form joyin-form-wrap" id="submitForm">
		<div class="pro-module-container">
			<div class="pro-module-wrapper pro-module-base">
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title">
							<span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i
								class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div style="display: none">
									<input type="text" id="finprodId" name="finprodId" data-th-value="${entity?.finprodId}"/>
									<input type="text" id="tempTrmFundType" name="tempTrmFundType" data-th-value="${entity?.trmFundType}"/>
									<input type="text" id="oldFinprodMarketId" name="oldFinprodMarketId" data-th-value="${entity?.finprodMarketId}" hidden>
									<input
											type="text" id="seqno" name="seqno"
											class="layui-input form-input"
											data-th-value="${entity?.seqno}" style="display: none">
									<input
											type="text" id="creditMstId" name="creditMstId"
											class="layui-input form-input"
											data-th-value="${entity?.creditMstId}" style="display: none">
									<input type="text" id="pfhId" name="pfhId"
										   class="layui-input form-input"
										   data-th-value="${entity?.pflsh}" style="display: none">
									<input type="text" id="hapCreditAmt" name="hapCreditAmt"
										   class="layui-input form-input"
										   data-th-value="${entity?.hapCreditAmt}" style="display: none">
									<input type="text" id="creditFlag" name="creditFlag" style="display: none"
										   data-th-value="${creditFlag}">
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinExFundTarget001.finprodMarketId}">资产代码</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="finprodMarketId"
											   name="finprodMarketId" required="required"
											   style=" width: 85%!important; display: inline-block;"
											   class="layui-input form-input" placeholder="" maxlength="18"
											   data-th-placeholder="#{SysCommon.placeholder}"
											   data-th-value="${entity?.finprodMarketId}">
										<input type="text" id="tradeMarketId" name="tradeMarketId"
											   data-th-value="${tradeMarketId}"
											   class="layui-input form-input" style="width: 15%!important; display: inline-block;" readonly>
									</div>

								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinExFundTarget001.finprodAbbr}">资产简称</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="finprodAbbr" name="finprodAbbr"
											   required="required" class="layui-input form-input"
											   placeholder="" maxlength="100"
											   data-th-placeholder="#{SysCommon.placeholder}"
											   data-th-value="${entity?.finprodAbbr}" />
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinExFundTarget001.finprodName}">资产名称</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="finprodName" name="finprodName"
											   required="required" class="layui-input form-input"
											   placeholder="" maxlength="100"
											   data-th-placeholder="#{SysCommon.placeholder}"
											   data-th-value="${entity?.finprodName}" />
									</div>
								</div>
								<a id='magnifier' class="input-right-show" href='javascript:;' style='color:#4893e6;left: 32.5%; top: 40px;'><i class='iconfont icon-search'></i></a>
							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinExFundTarget001.manager}"> 管理人</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="manager" name="manager"
												required="required"
												class="layui-input form-input input-select" placeholder=""
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-url="@{/invest/asset/exfund/FinExFundTarget002/getManager}"
												data-th-initValue="${entity?.manager}">
										</select>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinExFundTarget001.fundType}">基金类型</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="fundType" name="fundType"
											   class="layui-input form-input input-select"
											   placeholder="请输入内容"
											   data-th-placeholder="#{SysCommon.placeholder}"
											   data-th-data-result='${TRM_FUND_TYPE}'
											   data-th-value="${entity?.trmFundType}"
										/>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinExFundTarget001.etfType}">二级类型</label>
									<div class="layui-input-inline input-inline">
										<select id="etfType" name="etfType"
												class="layui-input form-input input-select" placeholder=""
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue="${entity?.etfType}"
												data-th-data-result="${ETF_FUND_TYPE}"
										>
										</select>
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<!--修改标的投资性质为资产投资性质 lishuping 20190911 start-->
									<label class="layui-form-label form-label-wrap">资产投资性质</label>
									<!--修改标的投资性质为资产投资性质 lishuping 20190911 end-->
									<div class="layui-input-inline input-inline">
										<select id="investNature" name="investNature"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												required data-th-data-result="${INVEST_TYPE}" data-th-initvalue="${entity?.investNature}">
										</select>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinExFundTarget001.tradeMarket}">交易场所</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="tradeMarket" name="tradeMarket"
												required="required"
												class="layui-input form-input input-select" placeholder=""
												maxlength="75"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue="${entity?.tradeMarket}"
												data-th-data-result='${TRADE_PLACE}'>
										</select>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinExFundTarget002.vdate}">成立日期</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="vdate" name="vdate"
											   class="layui-input form-input input-dateSelect"
											   required="required" placeholder="请输入内容"
											   data-th-placeholder="#{SysCommon.placeholder}"
											   data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'/>

									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{FinExFundTarget002.listingDate}">上市日期</label>
									<div class="layui-input-inline input-inline">
										<input id="listingDate" name="listingDate"
											   class="layui-input form-input input-dateSelect"
											   placeholder="请选择时间"
											   data-th-value="${#dates.format(entity?.listingDate,'yyyy-MM-dd')}"
											   required="required"
											   data-th-placeholder="#{SysCommon.placeholder}"/>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinExFundTarget002.toffStrdate}">认购起始日 </label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="toffStrdate" name="toffStrdate"
											   class="layui-input form-input input-dateSelect"
											   required="required" placeholder="请输入内容"
											   data-th-placeholder="#{SysCommon.placeholder}"
											   data-th-value='${#dates.format(entity?.toffStrdate,"yyyy-MM-dd")}'/>

									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinExFundTarget002.toffEnddate}">认购终止日 </label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="toffEnddate" name="toffEnddate"
											   class="layui-input form-input input-dateSelect"
											   required="required" placeholder="请输入内容"
											   data-th-placeholder="#{SysCommon.placeholder}"
											   data-th-value='${#dates.format(entity?.toffEnddate,"yyyy-MM-dd")}'/>

									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class=" form-inline-wrap">
									<label class="layui-form-label form-label-wrap purSpeed"
										   data-th-text="#{FinExFundTarget002.purSpeed}">申购确认速度</label>
									<div class="layui-input-inline input-inline delaytime-inline-wrap">
										<label class="layui-form-label form-label-wrap rate-text" style="float: left;display: inline-block;width: 6%;padding:0px;">T+</label>
										<input type="text" id="purSpeed" name="purSpeed"  th:value="${entity?.purSpeed}" class="layui-input form-input"
											   onkeyup="if(this.value.length<=1){this.value=this.value.replace(/[^0-9]/g,'')}else{this.value=parseInt(this.value.replace(/\D/g,''))}" onafterpaste="if(this.value.length<=1){this.value=this.value.replace(/[^0-9]/g,'0')}else{this.value=parseInt(this.value.replace(/\D/g,''))}"
											   style="float: left;display: inline-block; width: 89%;"/>
									</div>
								</div>
								<div class=" form-inline-wrap">
									<label class="layui-form-label form-label-wrap redSpeed"
										   data-th-text="#{FinExFundTarget002.redSpeed}">赎回确认速度</label>
									<div class="layui-input-inline input-inline delaytime-inline-wrap">
										<label class="layui-form-label form-label-wrap rate-text" style="float: left;display: inline-block;width: 6%;padding:0px;">T+</label>
										<input type="text" id="redSpeed" name="redSpeed"  th:value="${entity?.redSpeed}" class="layui-input form-input"
											   onkeyup="if(this.value.length<=1){this.value=this.value.replace(/[^0-9]/g,'')}else{this.value=parseInt(this.value.replace(/\D/g,''))}" onafterpaste="if(this.value.length<=1){this.value=this.value.replace(/[^0-9]/g,'0')}else{this.value=parseInt(this.value.replace(/\D/g,''))}"
											   style="float: left;display: inline-block; width: 89%;"/>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinExFundTarget002.tdyRevTrans}"> 当日回转交易</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="tdyRevTrans" name="tdyRevTrans"
												required="required"
												class="layui-input form-input input-select"
												data-th-initValue="${entity?.tdyRevTrans}"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-result='${TDY_REV_TRANS}' >
										</select>
									</div>
								</div>
								<!--/div>
                                <div class="layui-form-item"-->
							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinExFundTarget001.bonusType}">允许的分红方式</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="bonusType" name="bonusType"
												class="layui-input form-input input-select"
												required="required" placeholder="请输入内容"
												data-th-initValue="${entity?.bonusType}"
												data-th-placeholder="#{SysCommon.placeholder}"
												 data-th-data-result='${BONUS_TYPE}' multiple>
										</select>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinExFundTarget001.ccy}">币种</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="ccy" name="ccy"
												class="layui-input form-input input-select"
												required="required" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue="*{entity?.ccy?:CCY_default}"
												data-th-data-result='${CCY}' >
										</select>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{FinExFundTarget002.tradeCalendarCode}">交易日历</label>
									<div class="layui-input-inline input-inline">
										<select name="calendarId" id="calendarId"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-url="@{/business/common/CommonSelect/selectCalendarId}"
												data-th-initValue='${entity?.calendarId}'
												required="required">
										</select>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
				<!-- 基金中债报送信息组件 -->
				<div id="bussRepExFundInfo" class="page-component" th:data-path="@{/component/report/asset/fund/BussRepFundInfo/init}" th:data-params="|{pageModel:pageModel,fundTypeElement: 'fundType', secondTypeElement:'secondType',entityName: 'bussRepFundInfoDto',finprodId:'${entity?.finprodId ?:''}',workflowId: '${entity?.workflowId ?:''}'}|"></div>
				<!-- 备注 -->
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title">
							<span class="title-des">备注</span><i
								class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="pro-module-item" style="padding-bottom: 8px;">
							<div class="layui-form-item">
								<div class="form-inline-wrap" style="width: 100%;">
									<div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
										<textarea id="remark" name="remark" placeholder="请输入内容"
												  data-th-placeholder="#{SysCommon.placeholder}" maxlength="300"
												  class="layui-textarea" data-th-text="${entity?.remark}">
										</textarea>
									</div>
									<!-- <div class="pro-module">
                               <div class="pro-module-item">
                                   <div class="layui-field-box">
                                       <div class="layui-input-block">
                                       <textarea id="remark" name="remark" placeholder="请输入内容"
                                           data-th-placeholder="#{SysCommon.placeholder}" maxlength="200"
                                           class="layui-textarea" data-th-text="${entity?.remark}">
                                       </textarea>
                                   </div>
                               </div>
                           </div>
                           </div> -->
								</div>
							</div>
						</div>
					</div>
				</div>
				<!-- 文件上传 -->
				<div class="page-component" th:data-path="@{/component/core/FileCommon/init}" th:data-params="|{entityName: 'FileCommon', businessId: '${businessId ?: ''}'}|"></div>

			</div>



			<div class="pro-module-wrapper pro-module-block">
				<div
						class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11"
						style="margin: 50px;">
					<div class="text-center">
						<a id="FinExFundTarget002_btn_save"
						   class="layui-btn layui-btn-sm btn-save"
						   data-th-text="#{SysCommon.save}">保存</a> <a
							id="FinExFundTarget002_btn_submit"
							class="layui-btn layui-btn-sm btn-submit"
							data-th-text="#{SysCommon.submit}">提交</a> <a
							id="FinExFundTarget002_btn_cancel"
							class="layui-btn layui-btn-sm btn-cancel"
							data-th-text="#{SysCommon.cancel}">取消</a>
					</div>
				</div>
			</div>
	</form>
</div>
</div>
<div layout:fragment="script">
	<script th:inline="javascript" type="text/javascript">
			var workflowId = /*[[${entity?.workflowId}]]*/'';
			var PAGE_finprodId = /*[[${entity?.finprodId}]]*/'';
			var F01 = /*[[${F01}]]*/'';
			var F06 = /*[[${F06}]]*/'';
			var h_01 = /*[[${h_01}]]*/'';
			var finprodType2 = /*[[${entity?.finprodType2}]]*/'';
			var isTransInAsset = /*[[${entity?.isTransInAsset}]]*/'N';
			var CE_MODEL = /*[[${CE_MODEL}]]*/'02';
			var INTI_BONUS_MODE = /*[[${INTI_BONUS_MODE}]]*/'02';
			var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
			var TRM_FUND_TYPE_01 = /*[[${TRM_FUND_TYPE_01}]]*/'01';
			var TRM_FUND_TYPE_02 = /*[[${TRM_FUND_TYPE_02}]]*/'02';
			var TRM_FUND_TYPE_03 = /*[[${TRM_FUND_TYPE_03}]]*/'03';
			var TRM_FUND_TYPE_04 = /*[[${TRM_FUND_TYPE_04}]]*/'04';
			var TRM_FUND_TYPE_05 = /*[[${TRM_FUND_TYPE_05}]]*/'05';
			var GRA_FUND_TYPE_M = /*[[${GRA_FUND_TYPE_M}]]*/'M';
			var GRA_FUND_TYPE_A = /*[[${GRA_FUND_TYPE_A}]]*/'A';
			var GRA_FUND_TYPE_B = /*[[${GRA_FUND_TYPE_B}]]*/'B';
			var ETF_TYPE_01 = /*[[${ETF_TYPE_01}]]*/'01';
			var ETF_TYPE_02 = /*[[${ETF_TYPE_02}]]*/'02';
			var ETF_TYPE_03 = /*[[${ETF_TYPE_03}]]*/'03';
			var ETF_TYPE_04 = /*[[${ETF_TYPE_04}]]*/'04';
			var ETF_TYPE_05 = /*[[${ETF_TYPE_05}]]*/'05';
			var ETF_TYPE_06 = /*[[${ETF_TYPE_06}]]*/'06';
			var FUND_ASSET_SECOND_TYPE_01 = /*[[${FUND_ASSET_SECOND_TYPE_01}]]*/'01';
			var FUND_ASSET_SECOND_TYPE_02 = /*[[${FUND_ASSET_SECOND_TYPE_02}]]*/'02';
			var FUND_ASSET_SECOND_TYPE_03 = /*[[${FUND_ASSET_SECOND_TYPE_03}]]*/'03';
			var FUND_ASSET_SECOND_TYPE_06 = /*[[${FUND_ASSET_SECOND_TYPE_06}]]*/'06';
			//暂存临时值
			var TRM_FUND_TYPE = /*[[${entity?.trmFundType}]]*/'';
			var ETF_TYPE = /*[[${entity?.etfType}]]*/'';
			var TRANSACTION_CALENDAR_SH = /*[[${TRANSACTION_CALENDAR_SH}]]*/'SH';
			var TRANSACTION_CALENDAR_SZ = /*[[${TRANSACTION_CALENDAR_SZ}]]*/'SZ';
			var TRADE_PLACE_03 = /*[[${TRADE_PLACE_03}]]*/'03';
			var TRADE_PLACE_04 = /*[[${TRADE_PLACE_04}]]*/'04';
			//暂存临时值
        </script>
	<script data-th-src="@{/js/component/asset/BussAssetFiveType.js}" type="text/javascript"></script>
	<script data-th-src="@{/js/invest/asset/common/AssetCommon.js}" type="text/javascript"></script>
	<script data-th-src="@{/js/invest/asset/exfund/FinExFundTarget002.js}" type="text/javascript"></script>
</div>e
</body>

</html>
