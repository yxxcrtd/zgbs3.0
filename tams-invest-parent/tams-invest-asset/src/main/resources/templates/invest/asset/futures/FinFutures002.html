<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{FinFutures002}">期货类标的信息新建</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i
                                class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div style="display: none">
                                    <input type="text" id="finprodId" name="finprodId"
                                           data-th-value="${entity?.finprodId}"/>
                                    <input type="text" id="finprodMarketId" name="finprodMarketId"
                                           data-th-value="${entity?.finprodMarketId}"/>
                                    <input type="text" id="calendarId" name="calendarId"
                                           data-th-value="${entity?.calendarId}"/>
                                    <input type="text" id="chlFinprodId" name="chlFinprodId"
                                           data-th-value="${entity?.chlFinprodId}"/>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{FinFutures001.finprodMarketId}">合约代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <div class="layui-row">
                                            <div class="layui-col-md3">
                                                <input type="text" id="futuresContractPre"
                                                        class="layui-input form-input input-select"
                                                        style="width:100px;" name="futuresContractPre"
                                                        data-th-placeholder="#{SysCommon.placeholder}"
                                                        data-th-value="${entity?.futuresContractPre}"
                                                        data-th-data-result='${FUTURES_CONTRACT_PRE}'
                                                        formatoption="false"
                                                />
                                            </div>
                                            <div class="layui-col-md9">
                                                <input type="text" id="contractCode"
                                                       name="contractCode" required="required"
                                                       style=" width: 85%!important; display: inline-block;"
                                                       class="layui-input form-input"
                                                       placeholder=""
                                                       maxlength="75"
                                                       data-th-placeholder="#{SysCommon.placeholder}"
                                                       data-th-value="${entity?.contractCode}">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{FinFutures001.futuresType}">期货类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="futuresType"
                                               name="futuresType"
                                               class="layui-input form-input input-select"
                                               placeholder="请输入内容"
                                               parentIds="futuresContractPre"
                                               childrenIds="futuresContractId,deliveryMethod"
                                               data-th-value="${entity?.futuresType}"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-data-result='${FUTURES_TYPE}'
                                        >
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{FinFutures001.futuresContractId}">合约标的</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="futuresContractId" name="futuresContractId"
                                               class="layui-input form-input input-select" required disabled="disabled"
                                               placeholder="请输入内容"
                                               parentIds="futuresType"
                                               data-th-value="${entity?.futuresContractId}"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-data-result='${FUTURES_CONTRACT}'
                                               formatoption="false"
                                        >
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                            	<div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{FinFutures001.tradeMarket}">交易场所</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeMarket" name="tradeMarket"
                                               class="layui-input form-input input-select"
                                               placeholder="" maxlength="75" required disabled="disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-data-result='${TRADE_PLACE}'
                                               data-th-value="${entity?.tradeMarket}"/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{FinFutures001.lastTradeDate}">最后交易日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="lastTradeDate" name="lastTradeDate" required
                                               class="layui-input form-input input-dateSelect"
                                               placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${#dates.format(entity?.lastTradeDate,"yyyy-MM-dd")}'/>

                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{FinFutures001.lastSettleDate}">最后交割日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="lastSettleDate" name="lastSettleDate" required
                                               class="layui-input form-input input-dateSelect"
                                               placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${#dates.format(entity?.lastSettleDate,"yyyy-MM-dd")}'/>

                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                            	<div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{FinFutures001.deliveryMethod}">交割方式</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="deliveryMethod"
                                               name="deliveryMethod" required
                                               parentIds="futuresType"
                                               class="layui-input form-input input-select"
                                               placeholder="" maxlength="75"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-data-result='${DELIVERY_METHOD}'
                                               data-th-value="${entity?.deliveryMethod}"/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{FinFutures001.ccy}">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="ccy" name="ccy" disabled
                                                class="layui-input form-input input-select"
                                                required="required" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="*{entity?.ccy?:CCY_default}"
                                                data-th-data-result='${CCY}'>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{FinFutures001.contractMultiplier}">合约乘数</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="contractMultiplier" name="contractMultiplier" disabled
                                                class="layui-input form-input"
                                                required="required" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.contractMultiplier}"
                                        />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                     th:data-params="|{entityName: 'FileCommon', businessId: '${businessId ?: ''}'}|"></div>
                <!-- 备注 -->
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">备注</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item" style="padding-bottom: 8px;">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" style="width: 100%;">
                                    <div class="layui-input-inline input-inline"
                                         style="margin:0 10px;width: 98%!important;">
										<textarea id="remark" name="remark" placeholder="请输入内容"
                                                  data-th-placeholder="#{SysCommon.placeholder}"
                                                  maxlength="300"
                                                  class="layui-textarea"
                                                  data-th-text="${entity?.remark}">
										</textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>


            <div class="pro-module-wrapper pro-module-block">
                <div
                        class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11"
                        style="margin: 50px;">
                    <div class="text-center">
                        <a id="FinFutures002_btn_save"
                           class="layui-btn layui-btn-sm btn-save"
                           data-th-text="#{SysCommon.save}">保存</a> <a
                            id="FinFutures002_btn_submit"
                            class="layui-btn layui-btn-sm btn-submit"
                            data-th-text="#{SysCommon.submit}">提交</a> <a
                            id="FinFutures002_btn_cancel"
                            class="layui-btn layui-btn-sm btn-cancel"
                            data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var workflowId = /*[[${entity?.workflowId}]]*/'';
        var finprodType2 = /*[[${entity?.finprodType2}]]*/'';
        var isTransInAsset = /*[[${isTransInAsset}]]*/'';
        var TRADE_MARKET_12 = /*[[${TRADE_MARKET_12}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/asset/common/AssetCommon.js}"
            type="text/javascript"></script>
    <script data-th-src="@{/js/invest/asset/futures/FinFutures002.js}"
            type="text/javascript"></script>
</div>
</body>

</html>
