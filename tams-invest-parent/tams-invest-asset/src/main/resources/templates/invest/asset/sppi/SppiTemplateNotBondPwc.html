<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{SppiTemplateNotBondPwc.create}">非标准化债权资产SPPI测试新建（普华永道模板）</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">

                    <div class="pro-module">

                            <span class="title-des" data-th-text="#{SppiTest002.p1}">资产基本信息</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">

                                </div>

                            <div class="layui-form-item">

                                        <label class="layui-form-label form-label-wrap basicTitleLbl" data-th-text="#{SppiTest002.investType}">
                                            投资类型
                                        </label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="investTypeDesc" name="investTypeDesc"

                                    </div>

                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="detailTitle1" data-th-text="#{SppiTest002.t14}">顶层资产现金流特征</div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblSmaller1" data-th-text="#{SppiTest002.q53}">顶层资产现金流特征</label>

                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q53']?.answerValue}"
                                               data-th-data-result="${BENEFIT}" required="required" />
                                    </div>
                                </div>
                            </div>

                            <div class="detailTitle1" data-th-text="#{SppiTest002.t15}">顶层资产信息</div>

                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionTextLbl" data-th-text="#{SppiTest002.q54}">
                                        顶层资产基本信息描述
                                    </label>
                                    <div class="layui-input-inline input-inline questionText">
                                        <input type="text" id="sppiTest002Q54" name="sppiTest002Q54" class="layui-input form-input" maxlength="200"

                                               data-th-value="${entity?.qaMap['sppiTest002Q54']?.answerValue}" />
                                    </div>
                                </div>
                            </div>
                            <div class="detailTitle2" data-th-text="#{SppiTest002.t16}">顶层资产属性</div>

                                               data-th-data-result="${YES_OR_NO}" required="required" />

                                </div>
                            </div>

                                    </div>
                                </div>
                            </div>

                                    <label class="layui-form-label form-label-wrap questionTextLbl" data-th-text="#{SppiTest002.q63}">底层资产金额</label>
                                    <div class="layui-input-inline input-inline questionText">

                                               data-th-placeholder="#{SysCommon.placeholder}"
