<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorator="~{layout/default}">
<head>
	<title data-th-text="#{FinFundTarget002}">基金类标的信息新建</title>
</head>
<body>
<div layout:fragment="content">
	<form class="layui-form joyin-form-wrap" id="submitForm">
		<div class="pro-module-container">
			<div class="pro-module-wrapper pro-module-base">
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title">
							<span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i
								class="iconfont icon-arrow-down pro-down-icon"></i>
						</h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div style="display: none">
									<input type="text" id="finprodId" name="finprodId" data-th-value="${entity?.finprodId}"/>
									<input type="text" id="tempTrmFundType" name="tempTrmFundType" data-th-value="${entity?.trmFundType}"/>
									<input type="text" id="oldFinprodMarketId" name="oldFinprodMarketId" data-th-value="${entity?.finprodMarketId}" hidden>
									<input
											type="text" id="seqno" name="seqno"
											class="layui-input form-input"
											data-th-value="${entity?.seqno}" style="display: none">
									<input
											type="text" id="creditMstId" name="creditMstId"
											class="layui-input form-input"
											data-th-value="${entity?.creditMstId}" style="display: none">
									<input type="text" id="pfhId" name="pfhId"
										   class="layui-input form-input"
										   data-th-value="${entity?.pflsh}" style="display: none">
									<input type="text" id="hapCreditAmt" name="hapCreditAmt"
										   class="layui-input form-input"
										   data-th-value="${entity?.hapCreditAmt}" style="display: none">
									<input type="text" id="creditFlag" name="creditFlag" style="display: none"
										   data-th-value="${creditFlag}">
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinFundTarget001.finprodMarketId}">资产代码</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="finprodMarketId"
											   name="finprodMarketId" required="required"
											   style=" width: 85%!important; display: inline-block;"
											   class="layui-input form-input" placeholder="" maxlength="18"
											   data-th-placeholder="#{SysCommon.placeholder}"
											   data-th-value="${entity?.finprodMarketId}">
										<input type="text" id="tradeMarketId" name="tradeMarketId"
											   data-th-value="${tradeMarketId}"
											   class="layui-input form-input" style="width: 15%!important; display: inline-block;" readonly>
									</div>

								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinFundTarget001.finprodAbbr}">资产简称</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="finprodAbbr" name="finprodAbbr"
											   required="required" class="layui-input form-input"
											   placeholder="" maxlength="100"
											   data-th-placeholder="#{SysCommon.placeholder}"
											   data-th-value="${entity?.finprodAbbr}" />
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinFundTarget001.finprodName}">资产名称</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="finprodName" name="finprodName"
											   required="required" class="layui-input form-input"
											   placeholder="" maxlength="100"
											   data-th-placeholder="#{SysCommon.placeholder}"
											   data-th-value="${entity?.finprodName}" />
									</div>
								</div>
								<a id='magnifier' class="input-right-show" href='javascript:;' style='color:#4893e6;left: 32.5%; top: 50px;'><i class='iconfont icon-search'></i></a>
							</div>
							<div class="layui-form-item">
								<!-- 资产五级分类  王贵奇 开始 -->
								<div class="form-inline-wrap" id="selector3">
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{FinBondTargetAsset002.type9}">资产二级分类
									</label>
									<div class="layui-input-inline input-inline">
										<select id="type9" name="type9"
												th:initValue="*{entity?.type9}" required="required"
												class="layui-input form-input input-select"
												allowClear="true" placeholder="请选择"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-result="${CUSTOM_ASSET_TYPE_TWO}"
												formatoption=true childrenIds="type10"></select>
									</div>
								</div>
								<div class="form-inline-wrap" id="selector4">
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{FinBondTargetAsset002.type10}">资产三级分类
									</label>
									<div class="layui-input-inline input-inline">
										<select id="type10" name="type10" parentIds="type9"
												th:initValue="*{entity?.type10}" required="required"
												class="layui-input form-input input-select"
												allowClear="true" placeholder="请选择"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-result="${CUSTOM_ASSET_TYPE_THREE}"
												formatoption=true childrenIds="type11"></select>
									</div>
								</div>
								<!--ZGZGST-1265、ZGZGST-942 fuyongsheng edit 20210819 start-->
								<div class="form-inline-wrap" id="selector5" data-th-if="${isShowType} eq '01'">
								<!--ZGZGST-1265、ZGZGST-942 fuyongsheng edit 20210819 end-->
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{FinBondTargetAsset002.type11}">资产四级分类
									</label>
									<div class="layui-input-inline input-inline">
										<select id="type11" name="type11" parentIds="type10"
												th:initValue="*{entity?.type11}" required="required"
												class="layui-input form-input input-select"
												allowClear="true" placeholder="请选择"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-result="${CUSTOM_ASSET_TYPE_FOUR}"
												formatoption=true childrenIds="type12"></select>
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<!--ZGZGST-1265、ZGZGST-942 fuyongsheng edit 20210819 start-->
								<div class="form-inline-wrap" id="selector6" data-th-if="${isShowType} eq '01'">
								<!--ZGZGST-1265、ZGZGST-942 fuyongsheng edit 20210819 end-->
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{FinBondTargetAsset002.type12}">资产五级分类
									</label>
									<div class="layui-input-inline input-inline">
										<select id="type12" name="type12" parentIds="type11"
												th:initValue="*{entity?.type12}" required="required"
												class="layui-input form-input input-select"
												allowClear="true" placeholder="请选择"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-result="${CUSTOM_ASSET_TYPE_FIVE}"
												formatoption=true ></select>
									</div>
								</div>
								<!-- 资产五级分类 王贵奇 结束 -->
								<div class="form-inline-wrap" style="display: none">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinFundTarget001.fundType}">基金类型</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="fundType" name="fundType"
											   class="layui-input form-input input-select"
											   placeholder="请输入内容" childrenIds="etfType_id"
											   data-th-placeholder="#{SysCommon.placeholder}"
											   data-th-data-result='${FUND_ASSET_TYPE}'
											   data-th-value="${entity?.fundType}"
										/>
									</div>
								</div>
								<div class="form-inline-wrap" style="display: none">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinFundTarget001.secondType}">二级类型</label>
									<div class="layui-input-inline input-inline">
										<select id="secondType" name="secondType"
												class="layui-input form-input input-select" placeholder=""
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue="${entity?.secondType}"
												data-th-data-result="${FUND_ASSET_SECOND_TYPE}"
												childrenIds="trmFundType,etfType_id"
										>
										</select>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinFundTarget002.idate}"> 发行日</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="idate" name="idate"
											   required="required"
											   class="layui-input form-input input-dateSelect"
											   placeholder=""
											   data-th-placeholder="#{SysCommon.placeholder}"
											   data-th-value='${#dates.format(entity?.idate,"yyyy-MM-dd")}' />
									</div>
								</div>
								<!--/div>
                                <div class="layui-form-item"-->
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinFundTarget002.vdate}">成立日期</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="vdate" name="vdate"
											   class="layui-input form-input input-dateSelect"
											   required="required" placeholder="请输入内容"
											   data-th-placeholder="#{SysCommon.placeholder}"
											   data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'/>

									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinBondTargetAsset002.mdate}">到期日期</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="mdate" name="mdate"
											   class="layui-input form-input input-dateSelect"
											   placeholder="请输入内容"
											   data-th-placeholder="#{SysCommon.placeholder}"
											   data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'/>

									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinFundTarget001.tradeMarket}">交易场所</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="tradeMarket" name="tradeMarket"
												required="required"
												class="layui-input form-input input-select" placeholder=""
												maxlength="75"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue="${entity?.tradeMarket}"
												data-th-data-result='${TRADE_PLACE}'>
										</select>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinFundTarget001.manager}"> 管理人</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="manager" name="manager"
												required="required"
												class="layui-input form-input input-select" placeholder=""
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-url="@{/invest/asset/fund/FinFundTarget002/getManager}"
												data-th-initValue="${entity?.manager}">
										</select>
									</div>
								</div>
								<!--/div>
                                <div class="layui-form-item"-->
							</div>
							<div class="layui-form-item">
								<!--<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										data-th-text="#{FinFundTarget001.purSpeed}">交易方式</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="purSpeed" name="purSpeed"
											class="layui-input form-input input-checkbox"
											data-th-data-result='${ACCOUNT_SPEED}' required="required"
											data-th-initValue="${entity?.purSpeed}" />
									</div>
								</div>-->
								<div class=" form-inline-wrap">
									<label class="layui-form-label form-label-wrap purSpeed"
										   data-th-text="#{FinFundTarget002.purSpeed}">申购确认速度</label>
									<div class="layui-input-inline input-inline delaytime-inline-wrap">
										<label class="layui-form-label form-label-wrap rate-text" style="float: left;display: inline-block;width: 6%;padding:0px;">T+</label>
										<input type="text" id="purSpeed" name="purSpeed"  th:value="${entity?.purSpeed}"
											   class="layui-input form-input" onkeyup="(this.v=function(){this.value=this.value.replace(/[^\d]/g,'');}).call(this)"
											   style="float: right;display: inline-block; width: 89%;"/>
									</div>
								</div>
								<div class=" form-inline-wrap">
									<label class="layui-form-label form-label-wrap redSpeed"
										   data-th-text="#{FinFundTarget002.redSpeed}">赎回确认速度</label>
									<div class="layui-input-inline input-inline delaytime-inline-wrap">
										<label class="layui-form-label form-label-wrap rate-text" style="float: left;display: inline-block;width: 6%;padding:0px;">T+</label>
										<input type="text" id="redSpeed" name="redSpeed"  th:value="${entity?.redSpeed}"
											   class="layui-input form-input" onkeyup="(this.v=function(){this.value=this.value.replace(/[^\d]/g,'');}).call(this)"
											   style="float: right;display: inline-block; width: 89%;"/>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinFundTarget002.calendarId}"> 交易日历</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="calendarId" name="calendarId"
												required="required"
												class="layui-input form-input input-select"
												placeholder=""
												data-th-data-url="@{/business/common/CommonSelect/selectCalendarId}"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue="${entity?.calendarId}" >
										</select>
									</div>
								</div>
								<!--/div>
                                <div class="layui-form-item"-->
							</div>
							<div class="layui-form-item">
								<div class=" form-inline-wrap" id="pflshDiv" data-th-if="${CE_MODEL eq '02'}">
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{FinFundTarget002.pflsh}">批复号</label>
									<div class="layui-input-inline input-inline">
										<select type="text" class="layui-input form-input input-select"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												id="pflsh" maxlength="30" name="pflsh" parentIds="pfhId"
												data-th-initvalue="${entity?.pflsh}" formatoption="false"
												data-th-data-url="@{/invest/asset/common/getPflshList}">
										</select>
									</div>
								</div>
								<div class=" form-inline-wrap" id="actualCreditProvidDiv" data-th-if="${CE_MODEL eq '02'}">
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{FinFundTarget002.actualCreditProvid}">实际授信主体</label>
									<div class="layui-input-inline input-inline">
										<select type="text" class="layui-input form-input input-select"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												id="actualCreditProvid" maxlength="30" name="actualCreditProvid"
												data-th-initvalue="${entity?.actualCreditProvid}"
												data-th-data-url="@{/invest/asset/common/getActualCreditProvid}">
										</select>
									</div>
								</div>
								<!--/div>
                                <div class="layui-form-item"-->
								<!-- 保本标识和投资性质移至分红计划 王贵奇 2019/7/29	 开始 -->
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap" >保本标识</label>
									<div class="layui-input-inline input-inline">
										<input type="checkbox" id="capiIncomeFeature" name="capiIncomeFeature"
											   lay-skin="switch" th:value="${NO}"
											   lay-text="是|否"
											   th:checked="${entity?.capiIncomeFeature!=null && entity?.capiIncomeFeature!=NO && entity?.capiIncomeFeature!='02' ?true:false}">
									</div>
								</div>
								<div class="form-inline-wrap">
									<!--修改标的投资性质为资产投资性质 lishuping 20190911 start-->
									<label class="layui-form-label form-label-wrap">资产投资性质</label>
									<!--修改标的投资性质为资产投资性质 lishuping 20190911 end-->
									<div class="layui-input-inline input-inline">
										<select id="investNature" name="investNature"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue="${entity?.investNature}"
												required data-th-data-result="${INVEST_TYPE}" >
										</select>
									</div>
								</div>
								<!-- 保本标识和投资性质移至分红计划 王贵奇 2019/7/29	 开始 -->
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinFundTarget001.isCompoundInt}">是否按日复利</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="isCompoundInt" name="isCompoundInt"
												class="layui-input form-input input-select"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue="${entity?.isCompoundInt}" data-th-data-result='${YES_OR_NO}' >
										</select>
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<!--			<div class="form-inline-wrap">
                                                <label class="layui-form-label form-label-wrap"
                                                       data-th-text="#{FinFundTarget002.contractNo}">合同号</label>
                                                <div class="layui-input-inline input-inline">
                                                    <input type="text" name="contractNo"
                                                           data-th-value="${entity?.contractNo}"
                                                           class="layui-input form-input" placeholder="请输入内容"
                                                           data-th-placeholder="#{SysCommon.placeholder}" required>
                                                </div>
                                            </div>
                                            <div class="form-inline-wrap">
                                                <label class="layui-form-label form-label-wrap"
                                                       data-th-text="#{FinFundTarget002.trialNo}">法审编号</label>
                                                <div class="layui-input-inline input-inline">
                                                    <input type="text" name="trialNo"
                                                           data-th-value="${entity?.trialNo}"
                                                           class="layui-input form-input" placeholder="请输入内容"
                                                           data-th-placeholder="#{SysCommon.placeholder}">
                                                </div>
                                            </div>-->
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinFundTarget001.ccy}">币种</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="ccy" name="ccy"
												class="layui-input form-input input-select"
												required="required" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue="*{entity?.ccy?:CCY_default}" data-th-data-result='${CCY}' >
										</select>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinFundTarget002.toffStrdate}">认购起始日 </label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="toffStrdate" name="toffStrdate"
											   class="layui-input form-input input-dateSelect"
											   required="required" placeholder="请输入内容"
											   data-th-placeholder="#{SysCommon.placeholder}"
											   data-th-value='${#dates.format(entity?.toffStrdate,"yyyy-MM-dd")}'/>

									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinFundTarget002.toffEnddate}">认购终止日 </label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="toffEnddate" name="toffEnddate"
											   class="layui-input form-input input-dateSelect"
											   required="required" placeholder="请输入内容"
											   data-th-placeholder="#{SysCommon.placeholder}"
											   data-th-value='${#dates.format(entity?.toffEnddate,"yyyy-MM-dd")}'/>

									</div>
								</div>
							</div>
							<div class="layui-form-item">

								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinFundTarget002.trmFundAbbr}">交易所基金简称</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="trmFundAbbr" name="trmFundAbbr"
											   class="layui-input form-input"
											   placeholder="" maxlength="75"
											   data-th-placeholder="#{SysCommon.placeholder}"
											   data-th-value="${entity?.trmFundAbbr}" />
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{FinFundTarget002.trmFundType}">交易所基金类型 </label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="trmFundType_id" name="trmFundType"
												class="layui-input form-input input-select" placeholder=""
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue="${entity?.trmFundType}"
												data-th-data-result='${TRM_FUND_TYPE}' disabled="disabled">
										</select>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{FinFundTarget002.purRedId}">申购赎回代码</label>
									<div class="layui-input-inline input-inline">
										<input type="text" name="purRedId"
											   data-th-value="${entity?.purRedId}"
											   class="layui-input form-input" placeholder="请输入内容"
