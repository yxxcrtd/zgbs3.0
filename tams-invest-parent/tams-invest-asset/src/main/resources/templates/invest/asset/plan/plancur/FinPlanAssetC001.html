<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinPlanAssetC001}">计划类资产（净值型）</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				<a id="FinPlanAssetC001_btn_create"
					class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a> 
			    <a id="FinPlanAssetC001_btn_delete"
					class="layui-btn layui-btn-sm btn-delete"
					data-th-text="#{SysCommon.delete}">删除</a>
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinPlanAssetC001.finProdMarketId}">资产代码</label>
							<!-- <div class="layui-input-inline input-inline">
								<input type="text" id="finprodMarketId" name="finprodMarketId"
									class="layui-input form-input input-lenovoselect"
									placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-url="@{/invest/asset/plan/planNet/FinPlanAssetC001/getFinProdMarketId}"
									data-idfield="id" data-keyfield="id" 
									data-th-data-effectivefieldsalias='|{"code":"#{FinPlanAssetC001.finProdMarketId}",
									"shortName":"#{FinPlanAssetC001.finProdName}"}|'>
							</div> -->
                            <div class="layui-input-inline input-inline">
                              <input type="text" id="finprodMarketId"  name="finprodMarketId" class="layui-input form-input input-lenovoselect" placeholder="请输入内容" 
                              data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-url="@{/invest/asset/common/getAssetId(finprodType2=${FINPROD_TYPE_TG_F17},profitType=${PROFIT_TYPE_03})}" 
                              data-idfield="code" data-keyfield="code"
                              data-th-data-effectivefieldsalias='|{"shortName":"#{FinDepositTarget002.finprodName}","code":"#{FinDepositTarget002.finprodId}"}|'>
                    </div>
						</div>
                        <!--lishuping 2019/7/18 添加分类二、三div start-->
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{FinPlanAssetC002.type9}">资产二级分类</label>
                            <div class="layui-input-inline input-inline">
                                <select id="type9" name="type9"
                                        class="layui-input form-input input-select"
                                        allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}"
                                        multiple="true"
                                        data-th-data-result="${CUSTOM_ASSET_TYPE_TWO}" formatoption=true
                                ></select>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{FinPlanAssetC002.type10}">资产三级分类</label>
                            <div class="layui-input-inline input-inline">
                                <select id="type10" name="type10"
                                        class="layui-input form-input input-select"
                                        allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}"
										multiple="true"
                                        data-th-data-result="${CUSTOM_ASSET_TYPE_THREE}"
										childrenIds="type11"
										formatoption=true

                                ></select>
                            </div>
                        </div>
                        <!--lishuping 2019/7/18 添加分类二、三div end-->
                        <!--lishuping 2019/7/18 隐藏分类div start-->
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4" style="display: none">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinPlanAssetC001.category}">一级分类</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="category" name="category"
									class="layui-input form-input input-select"
									data-th-data-result = '${PLAN_ASSET_TYPE}'
									allowClear="true" multiple="true" placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									formatoption="true">
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4" style="display: none">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinPlanAssetC001.type}">二级分类</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="type" name="type" 
									class="layui-input form-input input-select" 
									allowClear="true" multiple="true" placeholder="请输入内容"
									data-th-data-result = '${PLAN_ASSET_SEC_TYPE}' formatoption="true"
									data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
                        <!--lishuping 2019/7/18 隐藏分类div end-->
					</div>
					<div class="layui-form-item">
						<!-- <div
							class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinPlanAssetC001.transMode}">交易方式</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="transMode" name="transMode"
									formatoption="true" class="layui-input form-input input-select"
									allowClear="true" placeholder="请输入内容"
									data-th-data-result='${ACCOUNT_SPEED}'
									data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div> -->
                        <!--lishuping 2019/7/18 添加分类四、五div start-->
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4" style="display: none" id = "type11Div">
                            <label class="layui-form-label form-label-wrap" data-th-text="#{FinPlanAssetC002.type11}">资产四级分类</label>
                            <div class="layui-input-inline input-inline">
                                <select id="type11" name="type11"
                                        class="layui-input form-input input-select"
                                        allowClear="true" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}"
										multiple="true"
                                        data-th-data-result="${CUSTOM_ASSET_TYPE_FOUR}" formatoption=true
										 parentIds="type10"
                                ></select>
                            </div>
                        </div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4" style="display: none" id = "type12Div">
							<label class="layui-form-label form-label-wrap" data-th-text="#{FinPlanAssetC002.type12}">资产五级分类</label>
							<div class="layui-input-inline input-inline">
								<select id="type12" name="type12"
										class="layui-input form-input input-select"
										allowClear="true" placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}"
										multiple="true"
										data-th-data-result="${CUSTOM_ASSET_TYPE_FIVE}" formatoption=true

								></select>
							</div>
						</div>
                        <!--lishuping 2019/7/18 添加分类四、五div end-->
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                                            <label class="layui-form-label form-label-wrap"
                                                data-th-text="#{FinPlanAssetC002.manager}">管理人</label>
                                            <div class="layui-input-inline input-inline">
                                                <select type="text" id="manager" name="manager" class="layui-input form-input input-select"
                                                        data-th-data-url="@{/invest/asset/plan/plancur/FinPlanAssetC002/getManagerId}"
                                                        placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                                                </select>
                                            </div>
                                        </div>
					</div>
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{FinPlanAssetC001.vDate}">成立日期</label>
							<div class="layui-input-inline input-inline">
								<input id="vdate" name="vdate"
									class="layui-input form-input input-dateRangeSelect"
									placeholder="请选择时间区间"
									data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>

                    <!--<div class="layui-form-item">-->
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                                   data-th-text="#{FinPlanAssetC001.mDate}">终止日期</label>
                            <div class="layui-input-inline input-inline">
                                <input id="mdate" name="mdate"
                                       class="layui-input form-input input-dateRangeSelect"
                                       placeholder="请选择时间区间"
                                       data-th-placeholder="#{SysCommon.placeholder}">
                            </div>
                        </div>
						<div class=" form-inline-wrap">
							<label class="layui-form-label form-label-wrap"
								   data-th-text="#{FinPlanAssetC002.issuer}">发行人</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="issuer" name="issuer"
										class="layui-input form-input input-select"
										data-th-data-url="@{/invest/asset/plan/plancur/FinPlanAssetC002/getIssuerId}"
										formatoption="true" allowClear="true" placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
                    </div>
<!--                    <div class="layui-form-item">-->
<!--                    <div class=" form-inline-wrap">-->
<!--						<label class="layui-form-label form-label-wrap"-->
<!--							data-th-text="#{FinPlanAssetC002.issuer}">发行人</label>-->
<!--						 <div class="layui-input-inline input-inline">-->
<!--						<select type="text" id="issuer" name="issuer"-->
<!--								class="layui-input form-input input-select"-->
<!--								data-th-data-url="@{/invest/asset/plan/plancur/FinPlanAssetC002/getIssuerId}"-->
<!--								formatoption="true" allowClear="true" placeholder="请输入内容"-->
<!--								data-th-placeholder="#{SysCommon.placeholder}">-->
<!--						</select>-->
<!--						</div>-->
<!--					</div>-->
<!--                    </div>-->
                    <!-- add by  2019/9/29 张普裕 查询条件新增发行人 ，托断人   end-->
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
    		var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
    	</script>
		<script data-th-src="@{/js/invest/asset/plan/plancur/FinPlanAssetC001.js}"></script>
	</div>
</body>
</html>
