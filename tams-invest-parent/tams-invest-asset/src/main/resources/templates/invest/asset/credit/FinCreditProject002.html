<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinCreditProject001.revokeTitle}">信贷项目信息撤销</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm">
            <div class="layui-form-item">
                <div>
                    <input type="text" id="cashOutNo" name="cashOutNo" data-th-value="${cashOutNo}" hidden/>
                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap" style="width: 100%;">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinCreditProject001.reason}"
                            style="width: 11.9%;">撤销原因</label>
                        <div class="layui-input-inline input-inline" style="width: 81% !important;">
                            <textarea id="reason" name="reason" th:value="${entity?.reason}"
                                data-th-text="${entity?.reason}" class="layui-textarea" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"></textarea>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        <div class="layui-col-md10" style="margin-top: 40px;">
            <div class="text-center">
                <a id="FinCreditProject002_btn_save"
                   class="layui-btn layui-btn-sm btn-save"
                   data-th-text="#{SysCommon.save}">保存</a>
                <a id="FinCreditProject002_btn_cancel"
                    class="layui-btn layui-btn-sm btn-cancel"
                    data-th-text="#{SysCommon.cancel}">取消</a>
            </div> 
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/asset/credit/FinCreditProject002.js}"
            type="text/javascript">
        </script>
    </div>
</body>
</html>
