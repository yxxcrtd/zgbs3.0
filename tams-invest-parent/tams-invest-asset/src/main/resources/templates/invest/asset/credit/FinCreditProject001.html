<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinCreditProject001}">信贷项目信息管理</title>
<style type="text/css">
.revoke-icon{
    color: #e6e6e6;
    cursor: not-allowed;
}
</style>
</head>
<body>
    <div layout:fragment="content" id="FinCreditProject001_DIV">
        <div class="form-button-area">
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
        <form class="layui-form "  id="searchForm" >
            <div class="layui-form-item">       
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{FinCreditProject001.finprodId}">资产代码</label>
                      <div class="layui-input-inline input-inline">
                      <input type="text" id="finprodId"  name="finprodId" class="layui-input form-input input-lenovoselect" placeholder="请输入内容" 
                      data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-url="@{/invest/asset/common/getAssetId}" 
                      data-idfield="code" data-keyfield="code"
                      data-th-data-effectivefieldsalias='|{"shortName":"#{FinCreditProject001.finprodName}","code":"#{FinCreditProject001.finprodId}"}|'>
                    </div> 
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{FinCreditProject001.cashOutNo}">出账编号</label>
                    <div class="layui-input-inline input-inline">
                      <input type="text" id="cashOutNo"  name="cashOutNo" class="layui-input form-input input-lenovoselect" placeholder="请输入内容" 
                      data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-url="@{/invest/asset/credit/FinCreditProject001/getCashOutNo}" 
                      data-idfield="code" data-keyfield="code" formatoption = true
                      data-th-data-effectivefieldsalias='|{"shortName":"#{FinCreditProject001.cashOutNo}","code":"#{FinCreditProject001.cashOutNo}"}|'>
                    </div>
                </div> 
                <div class="layui-form-item">    
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{FinDepositTarget002.vdate}">起息日</label>
                        <div class="layui-input-inline input-inline">
                            <input  name="vdate" class="layui-input form-input input-dateRangeSelect" placeholder="请选择、支持区间" data-th-placeholder="#{SysCommon.dateInterval}">
                        </div>
                    </div> 
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{FinDepositTarget002.mdate}">到期日</label>
                        <div class="layui-input-inline input-inline">
                            <input name="mdate" class="layui-input form-input input-dateRangeSelect" placeholder="请选择、支持区间" data-th-placeholder="#{SysCommon.dateInterval}">
                        </div>
                    </div> 
                </div>
            </div>
            </form>   
        </div> 
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/asset/credit/FinCreditProject001.js}" type="text/javascript"></script>
    </div>
</body>

</html>
