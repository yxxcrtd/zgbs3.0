<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinBondTargetAsset001}">债券标的信息查询</title>
</head>
<body>
    <div layout:fragment="content" id="FinBondTargetAsset001_DIV">
        <div class="form-button-area">
            <a id="FinBondTargetAsset001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
            <a id="FinBondTargetAsset001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}" style="display: none">删除</a>
            <a id="FinBondTargetAsset001_btn_rateAdj" class="layui-btn layui-btn-sm btn-rateAdj">
                <i class="iconfont icon-tiaozheng"></i><span data-th-text="#{FinAssetRateAdj001.rateAdj}">利率调整</span></a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
        <form class="layui-form" id="searchForm" >
            <div class="layui-form-item">       
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{FinBondTargetAsset002.finprodId}">资产代码</label>
                     <div class="layui-input-inline input-inline">
                      <input type="text" id="finprodId"  name="finprodId" class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                      data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-url="@{/invest/asset/common/getAssetId(finprodType2=${FINPROD_TYPE_TG_F01})}"
                      data-idfield="code" data-keyfield="code"
                      data-th-data-effectivefieldsalias='|{"shortName":"#{FinBondTargetAsset002.finprodAbbr}","code":"#{FinBondTargetAsset002.finprodId}"}|'>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{FinBondTargetAsset002.couponSpecies}">息票品种</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" name="couponSpecies"  class="layui-input form-input input-select"  data-th-data-result="${COUPON_SPECIES}"></select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{FinBondTargetAsset002.rateType}">利率类型</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" name="rateType"  class="layui-input form-input input-checkbox"  data-th-data-result="${INT_TYPE}" >
                    </div>
                </div> 
            </div>
            
            <!-- 3 new selections added by wangguiqi on 2019/7/17 -start -->
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
					<label class="layui-form-label form-lable" data-th-text="#{FinBondTargetAsset002.type9}">资产二级分类 </label>
					<div class="layui-input-inline input-inline">
						<select id="type9" name="type9" multiple="true"
							class="layui-input form-input input-select" allowClear="true"
							data-th-data-result="${CUSTOM_ASSET_TYPE_TWO}"></select>
					</div>
				</div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
					<label class="layui-form-label form-lable" data-th-text="#{FinBondTargetAsset002.type10}">资产三级分类 </label>
					<div class="layui-input-inline input-inline">
						<select id="type10" name="type10" multiple="true"
							class="layui-input form-input input-select" allowClear="true"
							data-th-data-result="${CUSTOM_ASSET_TYPE_THREE}"></select>
					</div>
				</div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4" style="display: none" id = "type11Div">
					<label class="layui-form-label form-lable" data-th-text="#{FinBondTargetAsset002.type11}">资产四级分类 </label>
					<div class="layui-input-inline input-inline">
						<select id="type11" name="type11" multiple="true"
							class="layui-input form-input input-select" allowClear="true"
							data-th-data-result="${CUSTOM_ASSET_TYPE_FOUR}" formatoption=true></select>
					</div>
				</div>
				
			</div>
			<!-- 3 new selections added by wangguiqi on 2019/7/17 -end -->
            <div class="layui-form-item">
				
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4" style="display:none">
                    <label class="layui-form-label form-lable" data-th-text="#{FinBondTargetAsset002.type4}">债券一级分类</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" name="type4" class="layui-input form-input input-select"
                                allowClear="true" formatoption=true multiple="true"
                                data-th-data-result="${WINDTYPEONE}">
                            </select>
                        </div>
                    </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4" style="display:none">
                    <label class="layui-form-label form-lable" data-th-text="#{FinBondTargetAsset002.type5}">债券二级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" name="type5"  class="layui-input form-input input-select"  data-th-data-result="${WINDTYPETWO}"></select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{FinBondTargetAsset002.ccy}">币种</label>
                    <div class="layui-input-inline input-inline">
                        <select type="ccy" name="ccy"  class="layui-input form-input input-select"  data-th-data-result="${CCY}" th:initValue="${CCY_default}"></select>
                    </div>
                </div>
					<div
						class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							data-th-text="#{FinBondTargetAsset002.vdate}">起息日</label>
						<div class="layui-input-inline input-inline">
							<input name="vdate"
								class="layui-input form-input input-dateRangeSelect"
								placeholder="请选择、支持区间"
								data-th-placeholder="#{SysCommon.dateInterval}">
						</div>
					</div>
					<div
						class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							data-th-text="#{FinBondTargetAsset002.mdate}">到期日</label>
						<div class="layui-input-inline input-inline">
							<input name="mdate"
								class="layui-input form-input input-dateRangeSelect"
								placeholder="请选择、支持区间"
								data-th-placeholder="#{SysCommon.dateInterval}">
						</div>
					</div>
            </div>
            
            <div class="layui-form-item">
					
					<div
						class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{FinBondTargetAsset002.issuer}">发行人</label>
						<div class="layui-input-inline input-inline">
							<select name="issuer" class="layui-input form-input input-select"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-url="@{/invest/asset/plan/plancur/FinPlanAssetC002/getIssuerId}">
							</select>
						</div>
					</div>
					
					 <!--  添加是否新增债券条件 add by liupeilin 2020-01-15 begin -->
                    <div class="form-inline-wrap" style="display:none" id="isShowFileter">
                                        <label class="layui-form-label form-label-wrap">是否新增债券</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="checkbox" id="isFileter" name="isFileter"
                                                lay-skin="switch" data-th-value="${YES}" lay-text="是|否"                                             
                                                data-th-checked="${YES_OR_NO_Y} ==${entity?.isFileter}"
                                                >
                                        </div>
                                    </div>
                    <!--  添加是否新增债券条件 add by liupeilin 2020-01-15 end -->
                
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{FinBondTargetAsset002.isIssueAsset}">是否发行标的 </label>
                        <div class="layui-input-inline input-inline">
                            <select id="isIssueAsset" name="isIssueAsset" 
                                    class="layui-input form-input input-select" allowClear="true"
                                    data-th-data-result="${YES_OR_NO}"></select>
                        </div>
                    </div>
				</div>
            </form>   
        </div> 
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
    	<script data-th-inline="javascript" type="text/javascript">
    	var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
    	<!-- 是否新增债券查询条件添加004控制  modify by liupeilin 2020-01-15  begin -->
    	var BANK_CODE = /*[[${BANK_CODE}]]*/'';
    	<!-- 是否新增债券查询条件添加004控制  modify by liupeilin 2020-01-15  end -->
    	</script>
        <script data-th-src="@{/js/invest/asset/bond/FinBondTargetAsset001.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/invest/asset/common/AssetCommon.js}" type="text/javascript"></script>
    </div>
</body>

</html>
