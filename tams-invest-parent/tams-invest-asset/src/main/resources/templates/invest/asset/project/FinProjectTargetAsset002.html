<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinProjectTargetAsset002}">项目类资产新建</title>

<body>
	<div layout:fragment="content" id="FinProjectTargetAsset002_DIV">

                <input id="oldVdate" name="oldVdate" data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}' hidden>

                <input type="text" id="hapCreditAmt" name="hapCreditAmt" class="layui-input form-input" data-th-value="${entity?.hapCreditAmt}" style="display: none">

				<input type="text" id="seqno" name="seqno" class="layui-input form-input" data-th-value="${entity?.seqno}" style="display: none">
				<div class="pro-module-wrapper pro-module-base step" title="基本信息">

						<div class="pro-module">
							<h3 class="pro-module-title">
								<span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i
									class="iconfont icon-arrow-down pro-down-icon"></i>
							</h3>
							<div class="pro-module-item pro-item-wrap">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProjectTargetAsset002.finprodId}">资产代码</label>
										<div class="layui-input-inline input-inline">
											<!--新建画面中，资产代码改为可手输 guyunfei 2019/09/04 start-->
											<!--<input type="text" name="finprodMarketId"
												data-th-value="${entity?.finprodMarketId}"
												class="layui-input form-input" placeholder="请输入内容"
												disabled="disabled"
												data-th-placeholder="#{SysCommon.placeholder}">-->
											<input type="text" name="finprodMarketId" id="finprodMarketId"
												   data-th-value="${entity?.finprodMarketId}"
												   class="layui-input form-input" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}" maxlength="20">
											<!--新建画面中，资产代码改为可手输 guyunfei 2019/09/04 end-->
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProjectTargetAsset002.finprodName}">资产名称</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="finprodName"
												data-th-value="${entity?.finprodName}"
												class="layui-input form-input" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required>
										</div>
									</div>
                <!-- 项目类资产五级分类改造 modify by renping 2019-07-25 start -->
									<div style="display:none" class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProjectTargetAsset002.type6}">资产类别</label>
										<div class="layui-input-inline input-inline">
											<select id="type6" name="type6"
												data-th-initValue="${entity?.type6}" required="required"
												class="layui-input form-input input-select"
												data-th-data-result="${ASSET_TYPE_PROJECT}"
												childrenIds="type7"></select>
										</div>
									</div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{FinProjectTargetAsset002.type9}">资产二级分类</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="type9" name="type9"
                                                data-th-initValue="${entity?.type9}" required="required"
                                                class="layui-input form-input input-select"
                                                data-th-data-result="${CUSTOM_ASSET_TYPE_TWO}"
                                                childrenIds="type10"></select>
                                        </div>
                                    </div>
									<a id='magnifier' class="input-right-show" href='javascript:;' style='color:#4893e6;left: 32.5%; top: 40px;'><i class='iconfont icon-search'></i></a>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{FinProjectTargetAsset002.type10}">资产三级分类</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="type10" name="type10"
                                                data-th-initValue="${entity?.type10}" required="required"
                                                class="layui-input form-input input-select"
                                                data-th-data-result="${CUSTOM_ASSET_TYPE_THREE}"
                                                parentIds="type9" data-th-childrenIds="${isShowType} eq '01' ? 'type11' : 'repAssetType'"></select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap"  id = "type11Div" data-th-if="${isShowType} eq '01'">
                                        <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{FinProjectTargetAsset002.type11}">资产四级分类</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="type11" name="type11"
                                                data-th-initValue="${entity?.type11}" required="required"
                                                class="layui-input form-input input-select"
                                                data-th-data-result="${CUSTOM_ASSET_TYPE_FOUR}"
                                                parentIds="type10" childrenIds="type12"></select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap"  id = "type12Div" data-th-if="${isShowType} eq '01'">
                                        <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{FinProjectTargetAsset002.type12}">资产五级分类</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="type12" name="type12"

                                                class="layui-input form-input input-select"
                                                data-th-data-result="${CUSTOM_ASSET_TYPE_FIVE}"
                                                parentIds="type11"
												data-th-childrenIds="${isShowType} eq '01' ? 'repAssetType' : ''"
											></select>
                                        </div>
                                    </div>
								</div>
                <!-- 项目类资产五级分类改造 modify by renping 2019-07-25 end -->
								<div class="layui-form-item">
									<div style="display:none" class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProjectTargetAsset002.type7}">资产二级分类</label>
										<div class="layui-input-inline input-inline">
											<select id="type7" name="type7"
												data-th-initValue="${entity?.type7}" required="required"
												class="layui-input form-input input-select"
												allowClear="true"
												data-th-data-result="${ASSET_TYPE_PROJECT_TWO}"
												formatoption=true
													></select>
											<!-- class="layui-input form-input input-select" allowClear="true" data-th-data-result="${ASSET_TYPE_SECOND_LEVEL}" childrenIds="bussRepEquityInfoDto_repAssetType,bussRepAssetCreditNonstdInfoDto_repAssetType,bussRepAssetAstBillInfoDto_repAssetType,bussRepOtherInvestTargetInfoDto_repAssetType,bussFinBondRepInfoDto_repAssetType,bussRepFundInfoDto_repAssetType" formatoption=true></select> -->
										</div>
									</div>
									<div id="projectAssetSource" class="form-inline-wrap">

										<div class="layui-input-inline input-inline">
											<input type="text" id="assetSource" name="assetSource"
												data-th-initValue="${entity?.assetSource}"
												class="layui-input form-input input-checkbox"
												data-th-data-result="${ASSET_SOURCE}" />
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinProjectTargetAsset002.issueAmt}">融资金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="issueAmt" name="issueAmt"
												   data-th-value="${entity?.issueAmt}"
												   class="layui-input form-input text-number"
												   placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}" required>
											<span class="input-right-show">元</span>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinProjectTargetAsset002.ccy}">币种</label>
										<div class="layui-input-inline input-inline">
											<select
													th:disabled="${isTransInAsset}"	name="ccy" th:initValue="*{entity?.ccy?:CCY_default}"
													class="layui-input form-input input-select"
													placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}" required
													data-th-data-result="${CCY}">
											</select>
										</div>
									</div>

									<!-- 增加推荐方与推荐费率 delete by renping 20191014 start -->
									<div class="form-inline-wrap" style="display:none">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProjectTargetAsset002.assetProvider}">资产提供行</label>
										<div class="layui-input-inline input-inline">
											<select name="assetProvider" id="assetProvider"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-url="@{/invest/asset/common/getTradeOpponent}"
												data-th-initValue='${entity?.assetProvider}'>
											</select>
											<!-- <input type="text" id="assetProvider" name="assetProvider" class="layui-input form-input input-lenovoselect"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value = "${entity?.assetProviderName}"
                                                data-th-data-url="@{/invest/asset/depo/FinProjectTargetAsset002/getTradeOpponent(counterType=${counterType})}"
                                                data-idfield="code" data-keyfield="name"
                                                data-th-data-effectivefieldsalias='|{"code":"#{FinProjectTargetAsset002.tradeOpponentCode}","shortName":"#{FinProjectTargetAsset002.tradeOpponentName}"}|'>
                                            <input type="hidden" name="assetProvider_hidden" id="assetProvider_hidden" data-th-value="${entity?.assetProvider}"> -->
										</div>
									</div>
		<!-- 增加推荐方与推荐费率 delete by renping 20191014 end -->
									<div class="form-inline-wrap" style="display: none">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProjectTargetAsset002.assetSourceUnit}">资产来源条线</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="assetSourceUnit"
												name="assetSourceUnit"
												data-th-initValue="${entity?.assetSourceUnit}"
												class="layui-input form-input input-select"
												data-th-data-result="${ASSET_SOURCE_LINE}" />
										</div>
									</div>
                                </div>
                                <div class="layui-form-item">
									<div class="form-inline-wrap" style="display: none">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProjectTargetAsset002.loadBank}">放款分行</label>
										<div class="layui-input-inline input-inline">
											<select name="loadBank"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-url="@{/invest/asset/common/getTradeOpponent}"
												data-th-initValue='${entity?.loadBank}'>
											</select>
										</div>
										<!-- <div class="layui-input-inline input-inline">
                                            <input type="text" id="loadBank" name="loadBank" class="layui-input form-input input-lenovoselect"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value = "${entity?.loadBankName}"
                                                data-th-data-url="@{/invest/asset/depo/FinProjectTargetAsset002/getTradeOpponent(counterType=${counterType})}"
                                                data-idfield="code" data-keyfield="name"
                                                data-th-data-effectivefieldsalias='|{"code":"#{FinProjectTargetAsset002.tradeOpponentCode}","shortName":"#{FinProjectTargetAsset002.tradeOpponentName}"}|'>
                                            <input type="hidden" name="assetProvider_hidden" id="assetProvider_hidden" data-th-value="${entity?.assetProvider}">
                                            </div> -->
									</div>

                                </div>
                                <div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProjectTargetAsset002.vdate}">起息日</label>
										<div class="layui-input-inline input-inline">
											<input
												th:disabled="${isTransInAsset}"
													type="text" id="vdate" name="vdate"
												data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'
												required="required"
												class="layui-input form-input input-dateSelect" />
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProjectTargetAsset002.mdate}">到期日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="mdate" name="mdate"
												data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
												required="required"
												class="layui-input form-input input-dateSelect" />
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProjectTargetAsset002.termDays}">期限（天）</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="termDays"
												data-th-value="${entity?.termDays}"
												class="layui-input form-input text-number"
												data-textrange="0" disabled />
										</div>
									</div>
                                </div>
                                <div class="layui-form-item">
									<div id="projectSettleDays" class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProjectTargetAsset002.settleDays}">清算时效（工作日）</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="settleDays"
												data-th-value="${entity?.settleDays}"
												class="layui-input form-input text-number"
												data-textrange="0" /> <span class="input-right-show"
												style="width: 50px">工作日</span>
										</div>
									</div>
									<div id="projectBuyOutRate" class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProjectTargetAsset002.buyOutRate}">买断利率</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="buyOutRate" name="buyOutRate"
												th:value="${entity?.buyOutRate}" required data-textrange="4"
												class="layui-input form-input text-number" /> <span
												class="input-right-show">%</span>
										</div>
									</div>
		<!-- 增加推荐方与推荐费率 delete by renping 20191014 start -->
									<div class="form-inline-wrap" style="display:none">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProjectTargetAsset002.referRate}">资产推荐费率</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="referRate" name="referRate"
												data-textrange="4"
												class="layui-input form-input text-number" disabled /> <span
												class="input-right-show">%</span>
										</div>
									</div>
		<!-- 增加推荐方与推荐费率 delete by renping 20191014 end -->
                                </div>
                                <div class="layui-form-item">
									<div id="projectCapiIncomeFeature" class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProjectTargetAsset002.capiIncomeFeature}">保本标识</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="capiIncomeFeature"
												th:initValue="${entity?.capiIncomeFeature}" required
												class="layui-input form-input input-checkbox"
												data-th-data-result="${AMT_INCOME_TYPE}" /> </select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinProjectTargetAsset002.calendarId}">交易日历</label>
										<div class="layui-input-inline input-inline">
											<select id="calendarId" name="calendarId" required="required"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-url="@{/business/common/CommonSelect/selectCalendarId}"
												data-th-initValue='${entity?.calendarId}'>
											</select>
										</div>
                                    </div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinProjectTargetAsset002.contractNo}">合同号</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="contractNo"
												   data-th-value="${entity?.contractNo}"
												   class="layui-input form-input" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}">
										</div>
									</div>
										<!-- <div class="layui-input-inline input-inline">
                                            <input type="text" id="calendarId" name="calendarId" class="layui-input form-input input-lenovoselect"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value = "${entity?.calendarName}"
                                                data-th-data-url="@{/invest/asset/depo/FinProjectTargetAsset002/getTradeCalendarName(isTradeCalendar=${isTradeCalendar})}"
                                                data-idfield="code" data-keyfield="name"
                                                data-th-data-effectivefieldsalias='|{"code":"#{FinProjectTargetAsset002.tradeCalendarCode}","shortName":"#{FinProjectTargetAsset002.tradeCalendarName}"}|'>
                                            <input type="hidden" name="calendarId_hidden" id="calendarId_hidden" data-th-value="${entity?.calendarId}">
                                        </div> -->
                                </div>
								<div class="layui-form-item">
									<div class="form-inline-wrap" id="projInvestIndustryDiv">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinProjectTargetAsset002.projInvestIndustry}">项目投向行业（1）</label>
										<div class="layui-input-inline input-inline">
											<select type="text" name="projInvestIndustry"
													data-th-initValue="${entity?.projInvestIndustry}"
													required="required"
													class="layui-input form-input input-select"
													data-th-data-result="${INSTITUTION_INDUSTRY_FIRST_LEVEL}"
													childrenIds="projInvestIndustry2" allowClear="true">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap" id="projInvestIndustry2Div">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinProjectTargetAsset002.projInvestIndustry2}">项目投向行业（2）</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="projInvestIndustry2" name="projInvestIndustry2"
													data-th-initValue="${entity?.projInvestIndustry2}"
													required="required"
													class="layui-input form-input input-select"
													data-th-data-result="${INSTITUTION_INDUSTRY_SECOND_LEVEL}"
													formatoption=true allowClear="true">
											</select>
										</div>
									</div>
								</div>
									<div class="layui-form-item">
										<div class=" form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												   data-th-text="#{FinProjectTargetAsset002.financier}">融资人</label>
											<div class="layui-input-inline input-inline">
												<select type="text" id="financier" name="financier"
														class="layui-input form-input input-select"
														required="required"
														data-th-data-url="@{/invest/asset/project/FinProjectTargetAsset002/getFinancier(IS_FINANCIER=${YES})}"
														formatoption="true" allowClear="true"
														data-th-initValue='${entity?.financier}'>
												</select>
											</div>
										</div>
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												   data-th-text="#{FinProjectTargetAsset002.sponsor}">担保人</label>
											<div class="layui-input-inline input-inline">
												<select type="text" id="sponsor" name="sponsor"
													class="layui-input form-input input-select"
													data-th-data-url="@{/invest/asset/project/FinProjectTargetAsset002/getFinancier(IS_GUARANTEE=${YES})}"
													formatoption="true" allowClear="true"
													data-th-initValue='${entity?.sponsor}'>
												</select>
											</div>
                                    	</div>
									<div id="projectInvestAdviser" class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinProjectTargetAsset002.investAdviser}">投资顾问</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="investAdviser" name="investAdviser"
													class="layui-input form-input input-select"
													data-th-data-url="@{/invest/asset/project/FinProjectTargetAsset002/getFinancier(IS_INVEST_ADVISER=${YES})}"
													formatoption="true" allowClear="true"
													data-th-initValue='${entity?.investAdviser}'>
											</select>
										</div>
									</div>
