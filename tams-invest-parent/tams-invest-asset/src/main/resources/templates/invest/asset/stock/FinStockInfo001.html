<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{FinStockInfo001}">股票标的</title>
</head>
<body>
<div layout:fragment="content" id="FinStockInfo001_DIV">
    <div class='layui-fluid'>
        <div class="layui-col-md12 form-button-area" style="margin: 10px;">
            <a id="FinStockInfo001_btn_create"
               class="layui-btn layui-btn-sm btn-create"
               data-th-text="#{SysCommon.create}">新建</a>
            <!--<a id="FinStockInfo001_btn_delete"-->
               <!--class="layui-btn layui-btn-sm btn-delete"-->
               <!--data-th-text="#{SysCommon.delete}">删除</a>-->
        </div>
        <div class='joyin-form-wrap joyin-filter-form condition-area'>
            <form class="layui-form" id="searchForm">

                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{FinStockInfo001.finprodMarketId}">资产代码</label>
                        <div class="layui-input-inline input-inline">
                        <input type="text" id="finprodMarketId" name="finprodMarketId"
                               class="layui-input form-input input-lenovoselect"
                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-data-url="@{/invest/asset/stock/FinStockInfo001/getFinprodMarketIdList}"
                               data-idfield="code" data-keyfield="code"
                               data-th-data-effectivefieldsalias='|{"code":"#{FinStockInfo001.finprodMarketId}",
									"shortName":"#{FinStockInfo001.finprodAbbr}"}|'>
                    </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{FinStockInfo001.fintradeMarket}">交易场所</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="tradeMarket" name="tradeMarket"
                                   class="layui-input form-input input-select" th:allowclear="true"
                                   placeholder="请选择交易场所" data-th-placeholder="#{SysCommon.placeholder}"
                                   aria-hidden="true"
                                   data-th-data-result="${TRADE_PLACE}" th:formatoption="true">
                        </div>

                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{FinStockInfo001.board}">上市板</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="board" name="board"
                                    class="layui-input form-input input-select"
                                    data-th-data-result='${BOARD}' th:allowClear="true"
                                    th:placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    th:formatoption="true">
                            </select>
                        </div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{FinStockInfo001.IpoDate}">上市时间</label>
                        <div class="layui-input-inline input-inline">
                            <input id="vdate" name="vdate"
                                   class="layui-input form-input input-dateRangeSelect"
                                   placeholder="请选择时间区间"
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               data-th-text="#{FinStockInfo001.shOrZh}">港股通市场</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="shOrZh" name="shOrZh"
                                    class="layui-input form-input input-select"
                                    data-th-data-result='${SH_OR_ZH}' th:allowClear="true"
                                    th:placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    th:formatoption="true">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap"
                               da       ta-th-text="#{FinStockInfo001.isMarginFinprod}">是否融资融券标的</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="isMarginFinprod" name="isMarginFinprod"
                                    class="layui-input form-input input-select"
                                    data-th-data-result='${YES_OR_NO}' th:allowClear="true"
                                    th:placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    th:formatoption="true">
                            </select>
                        </div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <div
                        class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{FinStockInfo001.ccy}">币种</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="ccy" name="ccy"
                                    class="layui-input form-input input-select"
                                    data-th-data-result='${CCY}' th:allowClear="true"
                                    allowClear="true"
                                    th:placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    th:formatoption="true">
                            </select>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/asset/stock/FinStockInfo001.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/invest/asset/common/AssetCommon.js}" type="text/javascript"></script>
</div>
</body>
</html>
