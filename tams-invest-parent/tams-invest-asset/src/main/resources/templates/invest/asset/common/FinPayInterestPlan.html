<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinPayInterestPlan}">付息计划维护</title>
<style>
.pro-module-wrap{
border:none;
}
.pro-module .layui-table-view{
border:1px solid #ccc;
padding:0;
}
</style>
</head>
<body>
    <div layout:fragment="content" id="FinPayInterestPlan_DIV">
    <div>
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
                <input id="finprodId" name="finprodId" data-th-value="${entity?.finprodId}" hidden> <input
                    id="finprodType2" name="finprodType2" data-th-value="${entity?.finprodType2}" hidden> <input
                    id="workflowId" name="workflowId" data-th-value="${workflowId}" hidden>
                <input id="basis" name="basis" data-th-value="${entity?.basis}" hidden>
                <input id="issueAmt" name="issueAmt" data-th-value="${entity?.issueAmt}" hidden>
                <input id="payTdayRule" name="payTdayRule" data-th-value="${entity?.payTdayRule}" hidden>
                <div class="pro-module-item pro-item-wrap">
            <div class="pro-module-wrap" style="margin-bottom: 10px;">
              <div class="pro-module">
                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinPayInterestPlan.type6}">资产类型</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="type6" name="type6" data-th-initValue="${entity?.type6}"
                                class="layui-input form-input input-select" disabled="disabled"
                                data-th-data-result="${ASSET_TYPE_PROJECT}" />
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinPayInterestPlan.finprodId}">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" name="finprodMarketId" data-th-value="${entity?.finprodMarketId}" 
                                class="layui-input form-input" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" disabled="disabled">
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap"
                            data-th-text="#{FinPayInterestPlan.finprodName}">资产名称</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" name="finprodName" data-th-value="${entity?.finprodName}"
                                class="layui-input form-input" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" disabled="disabled">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinPayInterestPlan.vdate}">起息日</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="vdate" name="vdate" disabled="disabled"
                                data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}' 
                                class="layui-input form-input input-dateSelect" />
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinPayInterestPlan.mdate}">到期日</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="mdate" name="mdate" disabled="disabled"
                                data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}' 
                                class="layui-input form-input input-dateSelect" />
                        </div>
                    </div>
                     <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinPayInterestPlan.payCycle}">付息周期</label>
                        <div class="layui-input-inline input-inline">
                        <!-- 一体化对应etliu -->
                            <!-- <input type="text" id="payCycle" name="payCycle" disabled="disabled"
                                data-th-initValue="${entity?.payCycle}" 
                                class="layui-input form-input input-select" data-th-data-result="${INTPAY_CYCLE}" /> -->
                                <input type="text" id="payCycle" name="payCycle" disabled="disabled"
                                data-th-initValue="${entity?.payCycle}" 
                                class="layui-input form-input input-select" data-th-data-result="${FREQUENCY_UNIT}" />
                        </div>
                    </div>
                </div>
                </div>
            </div>
            <!-- 付息信息业务 -->
            <div class="page-component" th:data-path="@{/component/asset/FinPayInterestStdInfo/init}"
                th:data-params="|{entityName:'finPayInterestStdInfoDto',finprodId:'${entity?.finprodId?:''}',vdate:'${#dates.format(entity?.vdate,'yyyy-MM-dd')}',workflowId:'${workflowId}',int_asset_type:'${INT_ASSET_TYPE}',int_asset_type_payinterest:'${PAY_INTEREST}', pageId:'${pageId}'}|"></div>
    </div>
    <div class="row text-center stepbar">
        <a id="FinPayInterestPlan_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
        <a id="FinPayInterestPlan_btn_submit" class="layui-btn layui-btn-sm btn-submit"
            data-th-text="#{SysCommon.submit}">提交</a> <a id="FinPayInterestPlan_btn_cancel"
            class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
    </div>
    </form>
    </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
        </script>
         <script data-th-src="@{/js/invest/asset/common/FinPayInterestPlan.js}" type="text/javascript"></script>
    </div>
</body>

</html>
