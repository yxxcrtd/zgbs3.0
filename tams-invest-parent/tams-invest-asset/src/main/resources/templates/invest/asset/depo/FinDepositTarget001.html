<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{FinDepositTarget001}">存款类资产管理</title>
</head>
<body>
<div layout:fragment="content" id="FinDepositTarget001_DIV">
    <div class="form-button-area">
        <a id="FinDepositTarget001_btn_add" class="layui-btn layui-btn-sm btn-create"
           data-th-text="#{SysCommon.create}">新建</a>
        <a id="FinDepositTarget001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
           data-th-text="#{SysCommon.delete}" style="display: none">删除</a>
        <a id="FinDepositTarget001_btn_rateAdj" class="layui-btn layui-btn-sm btn-rateAdj">
            <i class="iconfont icon-tiaozheng"></i><span data-th-text="#{FinAssetRateAdj001.rateAdj}">利率调整</span></a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
        <form class="layui-form " id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FinDepositTarget002.finprodId}">资产代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="finprodId" name="finprodId"
                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-data-url="@{/invest/asset/common/getAssetId(finprodType2=${FINPROD_TYPE_TG_F07})}"
                               data-idfield="code" data-keyfield="code"
                               data-th-data-effectivefieldsalias='|{"shortName":"#{FinDepositTarget002.finprodName}","code":"#{FinDepositTarget002.finprodId}"}|'>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4" style="display:none"><!-- 隐藏资产类型 赵东东 2019.7.26 -->
                    <label class="layui-form-label form-lable" data-th-text="#{FinDepositTarget002.type6}">资产类型</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" name="type6" class="layui-input form-input input-checkbox"
                               data-th-data-result="${DEPO_ASSET_TYPE}">
                    </div>
                </div>
                <!-- 增加资产二级分类、资产三级分类 、资产四级分类  赵东东  2019.7.26  start-->
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{FinDepositTarget002.type9}">资产二级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select id="type9" name="type9"
									class="layui-input form-input input-select"
									data-th-data-result = '${CUSTOM_ASSET_TYPE_TWO}'
									multiple></select>
                    </div>
                </div>
                 <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{FinDepositTarget002.type10}">资产三级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select id="type10" name="type10"
									class="layui-input form-input input-select"
									data-th-data-result = '${CUSTOM_ASSET_TYPE_THREE}'
									multiple></select>
                    </div>
                </div>
                <div class="layui-form-item" >
                     <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4" style="display: none" id = "type11Div">
                    <label class="layui-form-label form-lable" data-th-text="#{FinDepositTarget002.type11}">资产四级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select id="type11" name="type11"
									class="layui-input form-input input-select"
									data-th-data-result = '${CUSTOM_ASSET_TYPE_FOUR}'
									multiple></select>
                    </div>
                </div>
                <!-- 增加资产二级分类、资产三级分类 、资产四级分类  赵东东  2019.7.26  end-->
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4" >
                    <label class="layui-form-label form-lable" data-th-text="#{FinDepositTarget002.ccy}">币种</label>
                    <div class="layui-input-inline input-inline">
                        <input type="ccy" name="ccy" class="layui-input form-input input-select"
                               data-th-data-result="${CCY}" th:initValue="${CCY_default}">
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4" >
                        <label class="layui-form-label form-lable"
                               data-th-text="#{FinDepositTarget002.vdate}">起息日</label>
                        <div class="layui-input-inline input-inline">
                            <input name="vdate" class="layui-input form-input input-dateRangeSelect"
                                   placeholder="请选择、支持区间" data-th-placeholder="#{SysCommon.dateInterval}">
                        </div>
                    </div>
                    <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{FinDepositTarget002.mdate}">到期日</label>
                        <div class="layui-input-inline input-inline">
                            <input name="mdate" class="layui-input form-input input-dateRangeSelect"
                                   placeholder="请选择、支持区间" data-th-placeholder="#{SysCommon.dateInterval}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinDepositTarget002.issuer}">存款机构</label>
                        <div class="layui-input-inline input-inline">
                            <!--存款机构拉框匹配融资人和存放行 modified by lishuping 20191019 start-->
                            <select id="issuer" name="issuer"
                                    class="layui-input form-input input-select"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-url="@{/invest/asset/depo/FinDepositTarget002/getCustomerName}">
                            </select>
                            <!--存款机构拉框匹配融资人和存放行 modified by lishuping 20191019 end-->
                        </div>
                    </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
    		var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
    	</script>
    <script data-th-src="@{/js/invest/asset/depo/FinDepositTarget001.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/invest/asset/common/AssetCommon.js}" type="text/javascript"></script>
</div>
</body>

</html>
