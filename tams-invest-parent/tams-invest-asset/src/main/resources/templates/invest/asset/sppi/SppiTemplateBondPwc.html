<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{SppiTemplateBondPwc.create}">债券类资产SPPI测试新建（普华永道模板）</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" data-th-text="#{SppiTest002.p1}">资产基本信息</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" style="width: 29%!important;">
                                    <label class="layui-form-label form-lable" data-th-text="#{SppiTest002.finprodId}">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodId" name="finprodId" required="required"
                                               class="layui-input form-input" maxlength="75"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.finprodId}" disabled="true" style="display:none"  />
                                        <input type="text" id="finprodMarketId" name="finprodMarketId" required="required"
                                               class="layui-input form-input" maxlength="75"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.finprodMarketId}" disabled="true" />
                                    </div>
                                </div>
                                <div class="form-inline-wrap" style="width: 70%!important;">
                                    <div class="layui-inline layui-col-md12 layui-col-xs12 layui-col-sm12 layui-col-lg12">
                                        <label class="layui-form-label form-label-wrap" style="width:15%" data-th-text="#{SppiTest002.debtToolDesc}">债务工具介绍</label>
                                        <div class="layui-input-inline input-inline" style="width: 80%!important;">
                                            <input type="text" id="debtToolDesc" name="debtToolDesc"
                                                   class="layui-input form-input" maxlength="400"
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value="${entity?.debtToolDesc}" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" style="width: 29%!important;">
                                    <label class="layui-form-label form-lable" data-th-text="#{SppiTest002.finprodName}">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodName" name="finprodName" required="required"
                                               class="layui-input form-input" maxlength="75"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.finprodName}" disabled="true" />
                                    </div>
                                </div>
                                <div class="form-inline-wrap" style="width: 70%!important;">
                                    <div class="layui-inline layui-col-md12 layui-col-xs12 layui-col-sm12 layui-col-lg12">
                                        <label class="layui-form-label form-label-wrap" style="width:15%" data-th-text="#{SppiTest002.debtLayerDesc}">债务分层情况</label>
                                        <div class="layui-input-inline input-inline" style="width: 80%!important;">
                                            <input type="text" id="debtLayerDesc" name="debtLayerDesc"
                                                   class="layui-input form-input" maxlength="400"
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value="${entity?.debtLayerDesc}" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" data-th-text="#{SppiTest002.p2}">合同现金流是否仅为本金及利息的支付测试(SPPI测试)</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="detailTitle1" data-th-text="#{SppiTest002.t1}">合同直接条款判断</div>

                            <div class="detailTitle2" data-th-text="#{SppiTest002.t2}">直接通过条款判断</div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q1}">固定利率且无其他条款</label>
                                    <div class="layui-input-inline input-inline questionRadio">
<!--                                        <input type="radio" name="sppiTest002Q1" id="sppiTest002Q1_Y" value="Y" lay-filter="SppiTest002Q1" th:title="#{SppiTest002.yes}"
                                               data-th-checked="'Y' == ${entity?.qaMap['sppiTest002Q1']?.answerValue}" />
                                        <input type="radio" name="sppiTest002Q1" id="sppiTest002Q1_N" value="N" lay-filter="SppiTest002Q1" th:title="#{SppiTest002.no}"
                                               data-th-checked="'N' == ${entity?.qaMap['sppiTest002Q1']?.answerValue}" required="required" />-->
                                        <input type="text" name="sppiTest002Q1" id="sppiTest002Q1"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q1']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div id="sppiTest002Q2_itemDiv" class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q2}">无票面利率且无其他条款</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q2" id="sppiTest002Q2"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q2']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>

                            <div id="p12">
                            <div class="detailTitle2" data-th-text="#{SppiTest002.t3}">直接不通过条款</div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q3}">是否存在减记条款</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q3" id="sppiTest002Q3"

                                               data-th-initValue="${entity?.qaMap['sppiTest002Q3']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q4}">是否附有转股权</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q4" id="sppiTest002Q4"

                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>

                            </div>
                            <div class="layui-form-item">

                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q6" id="sppiTest002Q6"

                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q7}">是否存在逆向利率</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q7" id="sppiTest002Q7"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q7']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q8}">是否属于资产支持证券-次级档</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q8" id="sppiTest002Q8"

                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q9" id="sppiTest002Q9"

                                               data-th-initValue="${entity?.qaMap['sppiTest002Q9']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>

                            <div class="layui-form-item">

                                    <div class="layui-input-inline input-inline questionRadio">

                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">

                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q11" id="sppiTest002Q11"

                                               data-th-initValue="${entity?.qaMap['sppiTest002Q11']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q12}">存在其他导致不通过SPPI测试的直接条款</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q12" id="sppiTest002Q12"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q12']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q13}">永续债于发行人是否处以权益计量</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q13" id="sppiTest002Q13"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q13']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q14}">是否含暂停索偿条款/可递延/延期支付本金或利息</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q14" id="sppiTest002Q14"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q14']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            </div>

                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblc" data-th-text="#{SppiTest002.c1}">结论1本条款是否导致SPPI测试不通过</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002C1" id="sppiTest002C1"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002C1']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" disabled="true" />
                                    </div>
                                </div>
                            </div>

                            <div id="p2">
                            <div class="detailTitle1" data-th-text="#{SppiTest002.t4}">其他条款判断（条款1全部不适用情况下）</div>

                            <div class="detailTitle2" data-th-text="#{SppiTest002.t5}">合同利率条款判断</div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q15}">是否为浮动利率且挂钩SHIBOR或LIBOR等基准利率</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q15" id="sppiTest002Q15"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q15']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div id="p3">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblSub" data-th-text="#{SppiTest002.q16}">基准利率期间与定价期间是否匹配</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q16" id="sppiTest002Q16"
                                               class="layui-input form-input input-checkbox"

                                               data-th-data-result="${YES_OR_NO}" required="required" />

                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblSub" data-th-text="#{SppiTest002.q17}">定息日与基准利率/参考利率确定日是否接近</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q17" id="sppiTest002Q17"

                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q18}">本金与利率是否均为人民币</label>

                            <div class="layui-form-item">

                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q19}">利率是否不随通胀调整</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q19" id="sppiTest002Q19"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q19']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>

                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblc" data-th-text="#{SppiTest002.c2}">结论2.1本条款是否导致SPPI测试不通过</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002C2" id="sppiTest002C2"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002C2']?.answerValue}"

                                               data-th-data-result="${YES_OR_NO}" required="required" />

                            <div id="p4">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblSub" data-th-text="#{SppiTest002.q21}">挂钩合同是否具有杠杆性</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q21" id="sppiTest002Q21"
