<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{SppiTest003.title}">SPPI测试查看-中债</title>
</head>

	<div layout:fragment="content" id="FinProjectTargetAsset002_DIV">

			<form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">

								<div class="layui-form-item">

										<label class="layui-form-label form-label-wrap"

									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{SppiTest003.bondAbbr}">资产名称</label>

											<input type="text" name="bondAbbr"
												data-th-value="${entity?.bondAbbr}"
												class="layui-input form-input" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required>
										</div>
									</div>

                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">

									</div>

											   data-th-text="#{SppiTest003.costValue}">权的价值</label>

											<input type="text" id="costValue" name="costValue"

												   data-th-value="${entity?.otherCondition}"
												   class="layui-input form-input"

										</div>
									</div>
                                </div>
                                <div class="layui-form-item">
									<div class="form-inline-wrap" >
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{SppiTest003.dataSource}">数据来源</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="dataSource"
												name="dataSource"
												data-th-value="${entity?.dataSource}"
												class="layui-input form-input"
												/>
										</div>
									</div>
                                </div>
							</div>
						</div>
					</div>
				</div>
				<div class="pro-module-wrapper step" title="中债报送信息">
					<div class="row text-center stepbar">
						<a id="FinProjectTargetAsset002_btn_save"

							data-th-text="#{SysCommon.submit}">提交</a> <a
							id="FinProjectTargetAsset002_btn_cancel"
							class="layui-btn layui-btn-sm btn-cancel"
							data-th-text="#{SysCommon.cancel}">取消</a>
					</div>
				</div>
