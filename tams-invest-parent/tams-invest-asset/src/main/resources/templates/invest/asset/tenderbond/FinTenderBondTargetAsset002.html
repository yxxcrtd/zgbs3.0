<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinTenderBondTargetAsset002}">一级投标债券标的信息新建</title>
</head>
<body>
	<div layout:fragment="content" id="FinTenderBondTargetAsset002_DIV">
		<div class="pro-module-container ">
			<form class="layui-form joyin-form-wrap pro-module-form"
				id="submitForm">
				<input id="finprodId" name="finprodId"
					data-th-value="${entity?.finprodId}" hidden> <input
					id="finprodType2" name="finprodType2"
					data-th-value="${entity?.finprodType2}" hidden> <input
					id="workflowId" name="workflowId" data-th-value="${workflowId}"
					hidden> <input type="text" id="seqno" name="seqno"
					class="layui-input form-input" data-th-value="${entity?.seqno}"
					style="display: none"> <input type="text" id="creditMstId"
					name="creditMstId" class="layui-input form-input"
					data-th-value="${entity?.creditMstId}" style="display: none">
				<input type="text" id="pfhId" name="pfhId"
					class="layui-input form-input" data-th-value="${entity?.pflsh}"
					style="display: none"> <input type="text" id="hapCreditAmt"
					name="hapCreditAmt" class="layui-input form-input"
					data-th-value="${entity?.hapCreditAmt}" style="display: none">
				<input type="text" id="creditFlag" name="creditFlag" style="display: none"
					data-th-value="${entity?.creditFlag}">
				<div class="pro-module-wrapper pro-module-base step" title="基本信息">
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title">
								<span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i
									class="iconfont icon-arrow-down pro-down-icon"></i>
							</h3>
							<div class="pro-module-item pro-item-wrap" style="position: relative;">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinTenderBondTargetAsset002.finprodId}">资产代码</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="finprodMarketId"
												name="finprodMarketId" maxlength="18"
												data-th-value="${entity?.finprodMarketId}"
												class="layui-input form-input" placeholder="请输入内容"
												style="width: 85%!important; display: inline-block;"
												data-th-placeholder="#{SysCommon.placeholder}" required>
											<input type="text" id="tradeMarketId" name="tradeMarketId" 
                                                data-th-value="${tradeMarketId}"
                                            	class="layui-input form-input" 
                                            	style="width: 15%!important; display: inline-block;" readonly>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinTenderBondTargetAsset002.finprodName}">资产名称</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="finprodName"
												data-th-value="${entity?.finprodName}"
												class="layui-input form-input" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinTenderBondTargetAsset002.finprodAbbr}">资产简称</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="finprodAbbr"
												data-th-value="${entity?.finprodAbbr}"
												class="layui-input form-input" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required>
										</div>
									</div>
									 <!-- <a id='magnifier' class="input-right-show" href='javascript:;' style='color:#4893e6;left: 32.5%; top: 8px;'><i class='iconfont icon-search'></i></a>  -->
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinTenderBondTargetAsset002.tradeMarket}">交易场所</label>
										<div class="layui-input-inline input-inline">
											<select id="tradeMarket" name="tradeMarket"
												th:initValue="*{entity?.tradeMarket}"
												class="layui-input form-input input-select"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required
												data-th-data-result="${TRADE_PLACE}">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinTenderBondTargetAsset002.repRegistOrg}">登记托管机构</label>
										<div class="layui-input-inline input-inline">
											<select id="registOrg"
												name="registOrg"
												th:initValue="${entity?.registOrg}"
												class="layui-input form-input input-select"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required
												data-th-data-result="${SVR_REGIST_ORG}">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinTenderBondTargetAsset002.issuePrice}">发行价格</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="issuePrice" name="issuePrice"
												data-th-value="${entity?.issuePrice}"
												class="layui-input form-input text-number"
												data-textrange="5" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" >
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinTenderBondTargetAsset002.idate}">发行日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="idate"
												data-th-value='${#dates.format(entity?.idate,"yyyy-MM-dd")}'
												class="layui-input form-input input-dateSelect" />
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinTenderBondTargetAsset002.vdate}">起息日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="vdate" name="vdate"
												data-th-value='${#dates.format(entity?.vdate?:iPlatformDate,"yyyy-MM-dd")}'
												required="required"
												class="layui-input form-input input-dateSelect" />
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinTenderBondTargetAsset002.mdate}">到期日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="mdate" name="mdate"
												data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
												required="required"
												class="layui-input form-input input-dateSelect" />
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinTenderBondTargetAsset002.isSus}">是否永续</label>
										<div class="layui-input-inline input-inline">
											<input type="checkbox" id="isSus" name="isSus"
												lay-skin="switch"  lay-filter="isSus"
												   data-th-value="${YES}" lay-text="是|否"
												data-th-checked="${YES_OR_NO_Y} ==${entity?.isSus}">

										</div>
									</div>
									<div class="form-inline-wrap" style="display: none">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinTenderBondTargetAsset002.type4}">债券一级分类
										</label>
										<div class="layui-input-inline input-inline">
											<select id="type4" name="type4"
												th:initValue="*{entity?.type4}"
												class="layui-input form-input input-select"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-result="${WINDTYPEONE}"
												childrenIds="type5,bussFinBondRepInfoDto_repAssetType"></select>
										</div>
									</div>
									<div class="form-inline-wrap" style="display: none">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinTenderBondTargetAsset002.type5}">债券二级分类
										</label>
										<div class="layui-input-inline input-inline">
											<select id="type5" name="type5"
												th:initValue="*{entity?.type5}"
												class="layui-input form-input input-select"
												allowClear="true" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-result="${WINDTYPETWO}" formatoption=true
												childrenIds="bussFinBondRepInfoDto_repAssetType"></select>
										</div>
									</div>
									<!-- 新增资产二、三、四级分类 王贵奇 2019/7/31 开始 -->
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinBondTargetAsset002.type9}">资产二级分类
										</label>
										<div class="layui-input-inline input-inline">
											<select id="type9" name="type9" required
												th:initValue="*{entity?.type9}"
												class="layui-input form-input input-select"
												allowClear="true" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-result="${CUSTOM_ASSET_TYPE_TWO}" formatoption=true
												childrenIds="type10"></select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinBondTargetAsset002.type10}">资产三级分类
										</label>
										<div class="layui-input-inline input-inline">
											<select id="type10" name="type10" required
												th:initValue="*{entity?.type10}"
												class="layui-input form-input input-select"
												allowClear="true" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-result="${CUSTOM_ASSET_TYPE_THREE}" formatoption=true
												childrenIds="type11" parentIds="type9"></select>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap" id = "type11Div">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinBondTargetAsset002.type11}">资产四级分类
										</label>
										<div class="layui-input-inline input-inline">
											<select id="type11" name="type11" required
												th:initValue="*{entity?.type11}"
												class="layui-input form-input input-select"
												allowClear="true" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-result="${CUSTOM_ASSET_TYPE_FOUR}" formatoption=true
												childrenIds="type12" parentIds="type10"></select>
										</div>
									</div>
									<div class="form-inline-wrap"  id = "type12Div">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinBondTargetAsset002.type12}">资产五级分类
										</label>
										<div class="layui-input-inline input-inline">
											<select id="type12" name="type12" required
												th:initValue="*{entity?.type12}"
												class="layui-input form-input input-select"
												allowClear="true" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-result="${CUSTOM_ASSET_TYPE_FIVE}" formatoption=true
												parentIds="type11"></select>
										</div>
									</div>
									<!-- 新增资产二、三、四级分类 王贵奇 2019/7/31 结束 -->
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinTenderBondTargetAsset002.issueAmt}">发行金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="issueAmt"
												data-th-value="${entity?.issueAmt}"
												class="layui-input form-input text-number"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" >
											<span class="input-right-show">万元</span>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinTenderBondTargetAsset002.issuer}">发行人</label>
										<div class="layui-input-inline input-inline">
											<select name="issuer" id="issuer"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-url="@{/invest/asset/plan/plancur/FinPlanAssetC002/getIssuerId}"
												data-th-initValue='${entity?.issuer}' required="required">
											</select>
										</div>
										<!-- <div class="layui-input-inline input-inline">
                                            <input type="text" id="issuer" name="issuer" class="layui-input form-input input-lenovoselect"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value = "${entity?.issuerName}"
                                                data-th-data-url="@{/invest/asset/depo/FinDepositTarget002/getCustomerName}"
                                                data-idfield="code" data-keyfield="name"
                                                data-th-data-effectivefieldsalias='|{"code":"#{FinTenderBondTargetAsset002.issuer}","shortName":"#{FinTenderBondTargetAsset002.issuerName}"}|' required>
                                            <input type="hidden" name="issuer_hidden" id="issuer_hidden" data-th-value="${entity?.issuer}">
                                        </div> -->
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinTenderBondTargetAsset002.isSecBond}">是否次级债</label>
										<div class="layui-input-inline input-inline">
											<input type="checkbox" id="isSecBond" name="isSecBond"
												lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
												data-th-checked="${YES_OR_NO_Y} ==${entity?.isSecBond}">
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinTenderBondTargetAsset002.isRight}">是否含权债</label>
										<div class="layui-input-inline input-inline">
											<input type="checkbox" id="isRight" name="isRight"
												lay-skin="switch" lay-filter="isRight"
												data-th-value="${YES}" lay-text="是|否"
												data-th-checked="${YES_OR_NO_Y} ==${entity?.isRight}">
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinTenderBondTargetAsset002.issueType}">发行方式</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="issueType"
												data-th-initValue="${entity?.issueType}" required="required"
												class="layui-input form-input input-checkbox"
												data-th-data-result="${ISSUE_TYPE}" />
										</div>
									</div>
									<div class="form-inline-wrap" style="display: none">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinTenderBondTargetAsset002.underWriterId}">承销商</label>
										<div class="layui-input-inline input-inline">
											<select name="underWriterId"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-url="@{/invest/asset/common/getCustomerName}"
												data-th-initValue='${entity?.underWriterId}'>
											</select>
										</div>
										<!-- <div class="layui-input-inline input-inline">
                                            <input type="text" id="underWriterId" name="underWriterId" class="layui-input form-input input-lenovoselect"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value = "${entity?.underWriterIdName}"
                                                data-th-data-url="@{/invest/asset/depo/FinDepositTarget002/getCustomerName}"
                                                data-idfield="code" data-keyfield="name"
                                                data-th-data-effectivefieldsalias='|{"code":"#{FinTenderBondTargetAsset002.underWriterId}","shortName":"#{FinTenderBondTargetAsset002.underWriterName}"}|'>
                                            <input type="hidden" name="underWriterId_hidden" id="underWriterId_hidden" data-th-value="${entity?.underWriterId}" required>
                                        </div> -->
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinTenderBondTargetAsset002.blnArea}">境内外</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="blnArea" name="blnArea"
												th:initValue="${entity?.blnArea}" required
												class="layui-input form-input input-checkbox"
												data-th-data-result="${BLN_AREA}" />
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-utext="#{FinTenderBondTargetAsset002.isAutoUpdate}">是否允许wind数据覆盖</label>
										<div class="layui-input-inline input-inline">
											<input type="checkbox" id="isAutoUpdate" name="isAutoUpdate"
												lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
												data-th-checked="${YES_OR_NO_Y} ==${entity?.isAutoUpdate}">
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinTenderBondTargetAsset002.capiIncomeFeature}">保本标识</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="capiIncomeFeature" id="capiIncomeFeature"
												th:initValue="${entity?.capiIncomeFeature}" 
												class="layui-input form-input input-checkbox"
												data-th-data-result="${AMT_INCOME_TYPE}" /> </select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinTenderBondTargetAsset002.ccy}">币种</label>
										<div class="layui-input-inline input-inline">
											<select name="ccy" id="ccy"
												th:initValue="*{entity?.ccy?:CCY_INIT}"
												class="layui-input form-input input-select"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required
												data-th-data-result="${CCY}">
											</select>
										</div>
									</div>
									<!-- <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{FinTenderBondTargetAsset002.sustainableRemark}">特殊条款</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="sustainableRemark" data-th-value="${entity?.sustainableRemark}" class="layui-input form-input" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                       </div>-->
								
                            <!-- 一体化对应etliu -->
								
								<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinTenderBondTargetAsset002.tradeCalendarCode}">交易日历</label>
										<div class="layui-input-inline input-inline">
											<select name="calendarId" id="calendarId"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-url="@{/business/common/CommonSelect/selectCalendarId}"
												data-th-initValue='${entity?.calendarId}'
												required="required">
											</select>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
                            	<div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{FinTenderBondTargetAsset002.faceValue}">面值</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" required name="faceValue" data-th-value="${entity?.faceValue?:100}" class="layui-input form-input text-number" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" >
                                    </div>
                                </div>
									<div class=" form-inline-wrap" id="pflshDiv">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinTenderBondTargetAsset002.pflsh}">批复号</label>
										<div class="layui-input-inline input-inline">
											<select type="text"
												class="layui-input form-input input-select"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" id="pflsh"
												maxlength="30" name="pflsh" parentIds="pfhId"
												data-th-initvalue="${entity?.pflsh}" formatoption="false"
												data-th-data-url="@{/invest/asset/common/getPflshList}">
											</select>
										</div>
									</div>
									<div class=" form-inline-wrap" id="actualCreditProvidDiv">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinTenderBondTargetAsset002.actualCreditProvid}">实际授信主体</label>
										<div class="layui-input-inline input-inline">
											<select type="text"
												class="layui-input form-input input-select"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												id="actualCreditProvid" maxlength="30"
												name="actualCreditProvid"
												data-th-initvalue="${entity?.actualCreditProvid}"
												data-th-data-url="@{/invest/asset/common/getActualCreditProvid}">
											</select>
										</div>
									</div>
