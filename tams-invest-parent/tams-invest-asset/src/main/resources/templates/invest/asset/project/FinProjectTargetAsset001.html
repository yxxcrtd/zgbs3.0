<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinProjectTargetAsset001}">项目类资产标的信息查询</title>
</head>
<body>
    <div layout:fragment="content" id="FinProjectTargetAsset001_DIV">
        <div class="form-button-area">
            <a id="FinProjectTargetAsset001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
            <a id="FinProjectTargetAsset001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}" style="display: none">删除</a>
            <a id="FinProjectTargetAsset001_btn_rateAdj" class="layui-btn layui-btn-sm btn-rateAdj" data-th-text="#{FinAssetRateAdj001.rateAdj}">利率调整</a>
            <a id="FinProjectTargetAsset001_btn_payInterest" class="layui-btn layui-btn-sm btn-payInterest" data-th-text="#{FinAssetRateAdj001.payInterest}">付息计划</a>
            <a id="FinProjectTargetAsset001_btn_repayment" class="layui-btn layui-btn-sm btn-repayment" data-th-text="#{FinAssetRateAdj001.repayment}">还本计划</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
        <form class="layui-form "  id="submitForm" >
            <div class="layui-form-item">  
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{FinProjectTargetAsset001.finprodId}">资产代码</label>
                     <div class="layui-input-inline input-inline">
                      <input type="text"   name="finprodId" class="layui-input form-input input-lenovoselect" placeholder="请输入内容" 
                      data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-url="@{/invest/asset/common/getAssetId(finprodType2=${FINPROD_TYPE_TG_F18})}" 
                      data-idfield="code" data-keyfield="code" data-th-value='${finprodId}'
                      data-th-data-effectivefieldsalias='|{"code":"#{FinProjectTargetAsset001.finprodId}","shortName":"#{FinProjectTargetAsset001.finprodName}"}|'>
                    </div>
                </div>
                <!-- 项目类资产五级分类改造 modify by renping 2019-07-25 start -->
                <div style="display: none" class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{FinProjectTargetAsset001.type6}">资产类别</label>
                    <div class="layui-input-inline input-inline">
                            <select type="text" name="type6" class="layui-input form-input input-select"
                                allowClear="true" formatoption=true multiple="true"
                                data-th-data-result="${ASSET_TYPE_PROJECT}">
                            </select>
                        </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{FinProjectTargetAsset001.type9}">资产二级分类</label>
                    <div class="layui-input-inline input-inline">
                            <select type="text" id="type9" name="type9" class="layui-input form-input input-select"
                                allowClear="true" formatoption=true multiple="true"
                                data-th-data-result="${CUSTOM_ASSET_TYPE_TWO}">
                            </select>
                        </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{FinProjectTargetAsset001.type10}">资产三级分类</label>
                    <div class="layui-input-inline input-inline">
                            <select type="text" id="type10" name="type10" class="layui-input form-input input-select"
                                allowClear="true" formatoption=true multiple="true"
                                data-th-data-result="${CUSTOM_ASSET_TYPE_THREE}">
                            </select>
                        </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4" style="display: none" id = "type11Div">
                    <label class="layui-form-label form-lable" data-th-text="#{FinProjectTargetAsset001.type11}">资产四级分类</label>
                    <div class="layui-input-inline input-inline">
                            <select type="text" id="type11" name="type11" class="layui-input form-input input-select"
                                allowClear="true" formatoption=true multiple="true"
                                data-th-data-result="${CUSTOM_ASSET_TYPE_FOUR}">
                            </select>
                        </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4" style="display: none" id = "type12Div">
                    <label class="layui-form-label form-lable" data-th-text="#{FinProjectTargetAsset001.type12}">资产五级分类</label>
                    <div class="layui-input-inline input-inline">
                            <select type="text" id="type12" name="type12" class="layui-input form-input input-select"
                                allowClear="true" formatoption=true multiple="true"
                                data-th-data-result="${CUSTOM_ASSET_TYPE_FIVE}">
                            </select>
                        </div>
                <!-- 项目类资产五级分类改造 modify by renping 2019-07-25 end -->
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{FinProjectTargetAsset001.ccy}">币种</label>
                    <div class="layui-input-inline input-inline">
                        <input type="ccy" name="ccy"  class="layui-input form-input input-select"  data-th-data-result="${CCY}" th:initValue="${CCY_default}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{FinProjectTargetAsset001.vdate}">起息日</label>
                        <div class="layui-input-inline input-inline">
                            <input  name="vdate" class="layui-input form-input input-dateRangeSelect" placeholder="请选择、支持区间" data-th-placeholder="#{SysCommon.dateInterval}">
                        </div>
                    </div> 
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{FinProjectTargetAsset001.mdate}">到期日</label>
                        <div class="layui-input-inline input-inline">
                            <input name="mdate" class="layui-input form-input input-dateRangeSelect" placeholder="请选择、支持区间" data-th-placeholder="#{SysCommon.dateInterval}">
                        </div>
                    </div> 
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                               <label class="layui-form-label form-label-wrap"
                                   data-th-text="#{FinProjectTargetAsset002.financier}">融资人</label>
                               <div class="layui-input-inline input-inline">
                                   <select type="text" id="financier" name="financier" class="layui-input form-input input-select"
                                           data-th-data-url="@{/invest/asset/project/FinProjectTargetAsset002/getFinancier(IS_FINANCIER=${YES})}"
                                           placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                                   </select>
                               </div>
                        </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{FinProjectTargetAsset002.sponsor}">担保人</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="sponsor" name="sponsor" class="layui-input form-input input-select"
                                data-th-data-url="@{/invest/asset/project/FinProjectTargetAsset002/getFinancier(IS_GUARANTEE=${YES})}"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
            </div>
            </form>   
        </div> 
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
    	<script data-th-inline="javascript" type="text/javascript">
        	var REM_TYPE = [[${remType}]];
    		var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
    	</script>
        <script data-th-src="@{/js/invest/asset/project/FinProjectTargetAsset001.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/invest/asset/common/AssetCommon.js}" type="text/javascript"></script>
    </div>
</body>

</html>
