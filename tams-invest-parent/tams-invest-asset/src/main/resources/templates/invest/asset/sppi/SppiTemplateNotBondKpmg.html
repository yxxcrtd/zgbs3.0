<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{SppiTemplateNotBondKpmg.create}">非标准化债权资产SPPI测试新建（毕马威模板）</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" data-th-text="#{SppiTest002.p1}">资产基本信息</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" style="width: 33%!important;">
                                    <label class="layui-form-label form-lable basicTitleLbl" data-th-text="#{SppiTest002.finprodId}">
                                        资产代码
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodId" name="finprodId" required="required"
                                               class="layui-input form-input" maxlength="75"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.finprodId}" disabled="true" style="display:none" />
                                        <input type="text" id="finprodMarketId" name="finprodMarketId" required="required"
                                               class="layui-input form-input" maxlength="75"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.finprodMarketId}" disabled="true" />
                                    </div>
                                </div>
                                <div class="form-inline-wrap" style="width: 33%!important;">
                                    <label class="layui-form-label form-lable basicTitleLbl" data-th-text="#{SppiTest002.finprodName}">
                                        资产名称
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodName" name="finprodName" required="required"
                                               class="layui-input form-input" maxlength="75"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.finprodName}" disabled="true" />
                                    </div>
                                </div>
                                <div class="form-inline-wrap" style="width: 33%!important;">
                                    <label class="layui-form-label form-lable basicTitleLbl" data-th-text="#{SppiTest002.bdAssetType}">
                                        标的资产类型
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="assetTypeName" name="assetTypeName" required="required"
                                               class="layui-input form-input" maxlength="75"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.assetTypeName}" disabled="true" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" style="width: 33%!important;">
                                    <div class="layui-inline layui-col-md12 layui-col-xs12 layui-col-sm12 layui-col-lg12">
                                        <label class="layui-form-label form-label-wrap basicTitleLbl" data-th-text="#{SppiTest002.investType}">
                                            投资类型
                                        </label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="investTypeDesc" name="investTypeDesc"
                                                   class="layui-input form-input" maxlength="100"
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value="${entity?.investTypeDesc}" />
                                        </div>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" style="width: 66%!important;">
                                    <div class="layui-inline layui-col-md12 layui-col-xs12 layui-col-sm12 layui-col-lg12">
                                        <label class="layui-form-label form-label-wrap basicTitleLbl2" data-th-text="#{SppiTest002.tradeManageType}">
                                            交易对手名称及其对该资产的管理方式
                                        </label>
                                        <div class="layui-input-inline input-inline" style="width:60.8%!important;">
                                            <input type="text" id="manageTypeDesc" name="manageTypeDesc"
                                                   class="layui-input form-input" maxlength="100"
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value="${entity?.manageTypeDesc}" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" data-th-text="#{SppiTest002.p12}">合同现金流是否仅为本金及利息的支付测试(SPPI测试)</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="detailTitle1" data-th-text="#{SppiTest002.t26}">业务类型判断</div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q99}">是否为公募产品？</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q99" id="sppiTest002Q99"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q99']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q100}">是否为通道业务？</label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q100" id="sppiTest002Q100"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q100']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q101}">
                                        标的资产是否合同链接工具
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q101" id="sppiTest002Q101"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q101']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q102}">
                                        合同是否承诺保证本金及收益？
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q102" id="sppiTest002Q102"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q102']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q103}">
                                        标的资产是否可看穿至产生现金流量的基础资产，并且该基础资产为债务工具投资
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q103" id="sppiTest002Q103"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q103']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>

                            <div class="detailTitle1" data-th-text="#{SppiTest002.t27}">类型1-保本保收益或可看穿透至基础资产的投资</div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q104}">
                                        无论初始投资标的资产时基础资产确定与否，基础资产均可满足“基本借贷关系和合同现金流仅含本息”
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q104" id="sppiTest002Q104"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q104']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q105}">
                                        基础资产入池或退出时无折溢价或存续时杠杆交易策略
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q105" id="sppiTest002Q105"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q105']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q106}">
                                        各层标的资产无杠杆利率，或利率与利率与商品价格、外币汇率等挂钩
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q106" id="sppiTest002Q106"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q106']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q107}">
                                        不含有除基本借贷风险以外的其他风险（例如转股条款、参与经营、参与利润分享等）
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q107" id="sppiTest002Q107"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q107']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q108}">
                                        无其他影响基本借贷关系和仅本息的特征
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q108" id="sppiTest002Q108"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q108']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>

                            <div class="detailTitle1" data-th-text="#{SppiTest002.t28}">类型2-标的资产为合同连接工具</div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q109}">
                                        （在未看穿标的金融工具组合的情况下）分级的合同条款是否符合“仅为本金及利息的支付”标准 ？
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q109" id="sppiTest002Q109"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q109']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q110}">
                                        标的金融工具组合是否符合“仅为本金及利息的支付”标准？
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q110" id="sppiTest002Q110"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q110']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q111}">
                                        分级的固有的信用风险敞口是否小于或等于标的金融工具组合本身的信用风险敞口？
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q111" id="sppiTest002Q111"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q111']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>

                            <div class="detailTitle1" data-th-text="#{SppiTest002.t29}">类型3-基础资产类型判断</div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q112}">
                                        该资产是否为权益投资、含权资产、衍生工具
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q112" id="sppiTest002Q112"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q112']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q113}">
                                        资产无杠杆利率，或利率与利率与商品价格、外币汇率等挂钩
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q113" id="sppiTest002Q113"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q113']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q114}">
                                        不含有除基本借贷风险以外的其他风险（例如转股条款、参与经营、参与利润分享等）
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q114" id="sppiTest002Q114"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q114']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblSmaller" data-th-text="#{SppiTest002.q115}">
                                        如有提前还款权的，提前还款的金额(含额外补偿)是否几乎代表尚未支付之本金及未偿付本金金额之利息
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadioBigger">
                                        <input type="text" name="sppiTest002Q115" id="sppiTest002Q115"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q115']?.answerValue}"
                                               data-th-data-result="${YES_NO_NA}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblSmaller" data-th-text="#{SppiTest002.q116}">
                                        如有展期权的，展期后的现金流量（含额外补偿）是否几乎代表尚未支付的本金及未偿付本金金额之利息
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadioBigger">
                                        <input type="text" name="sppiTest002Q116" id="sppiTest002Q116"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q116']?.answerValue}"
                                               data-th-data-result="${YES_NO_NA}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblSmaller" data-th-text="#{SppiTest002.q117}">
                                        如果为浮动利率的，浮动利率的重设频率是否与利率期间一致
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadioBigger">
                                        <input type="text" name="sppiTest002Q117" id="sppiTest002Q117"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q117']?.answerValue}"
                                               data-th-data-result="${YES_NO_NA}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLblSubSmaller" data-th-text="#{SppiTest002.q118}">
                                        如果浮动利率的重设频率与利率期间不一致，该金融资产的未折现合同现金流量是否可能与未折现基准现金流量显著不同
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadioBigger">
                                        <input type="text" name="sppiTest002Q118" id="sppiTest002Q118"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q118']?.answerValue}"
                                               data-th-data-result="${YES_NO_NA}" required="required" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbl" data-th-text="#{SppiTest002.q119}">
                                        无其他影响基本借贷关系和仅本息的特征
                                    </label>
                                    <div class="layui-input-inline input-inline questionRadio">
                                        <input type="text" name="sppiTest002Q119" id="sppiTest002Q119"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.qaMap['sppiTest002Q119']?.answerValue}"
                                               data-th-data-result="${YES_OR_NO}" required="required" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" data-th-text="#{SppiTest002.p13}">结论</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap questionItem">
                                    <label class="layui-form-label form-label-wrap questionLbld" data-th-text="#{SppiTest002.result}">SPPI测试结果</label>
                                    <div class="layui-input-inline input-inline questionRadioBigger1">
                                        <input type="text" name="sppiTest002Result" id="sppiTest002Result"
                                               class="layui-input form-input input-checkbox"
                                               data-th-initValue="${entity?.testStatus}"
                                               data-th-data-result="${SPPI_TEST_STATUS}" disabled="true" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 备注 -->
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" th:text="#{SysCommon.remark}">备注</span><i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item" style="padding-bottom: 8px;">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" style="width: 100%;">
                                    <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
										<textarea id="remark" name="remark" placeholder="请输入内容"
                                                  data-th-placeholder="#{SysCommon.placeholder}" maxlength="300"
                                                  class="layui-textarea" data-th-text="${entity?.remark}">
										</textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pro-module-wrapper pro-module-block">
                <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                    <div class="text-center">
