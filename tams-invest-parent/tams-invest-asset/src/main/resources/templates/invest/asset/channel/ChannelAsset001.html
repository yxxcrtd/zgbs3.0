	<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="|#{invest.channelId}#{ChannelAsset001Bak}|">通道资产查询</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
            <a id="ChannelAsset001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
            <a id="ChannelAsset001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}" style="display: none">删除</a>
			 <a id="ChannelAsset001_btn_rateAdj" class="layui-btn layui-btn-sm btn-rateAdj">
                <i class="iconfont icon-tiaozheng"></i><span data-th-text="#{ChannelAsset001.rateAdj}">费率调整</span></a>
            </div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
                    <input id="finprodType2" name="finprodType2" data-th-value="${finprodType2}" hidden> 
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="|#{invest.channelId}#{ChannelAsset001.secAcctId}|">合作资产代码</label>
							<div class="layui-input-inline input-inline">
								<select id="secAcctId" name="secAcctId" multiple
									class="layui-input form-input input-select" placeholder="请输入内容"
									data-th-data-url="@{/invest/asset/channel/ChannelAsset001/getSecAcctId}">
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="|#{invest.channelId}#{ChannelAsset001.secAcctName}|">合作资产代码</label>
							<div class="layui-input-inline input-inline">
								<select id="secAcctName" name="secAcctName" multiple
									class="layui-input form-input input-select" placeholder="请输入内容"
									data-th-data-url="@{/invest/asset/channel/ChannelAsset001/getSecAcctName}">
								</select>
							</div>
						</div>
						<div
						class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							data-th-text="#{ChannelAsset002.vdate}">起息日</label>
						<div class="layui-input-inline input-inline">
							<input name="vdate"
								class="layui-input form-input input-dateRangeSelect"
								placeholder="请选择、支持区间"
								data-th-placeholder="#{SysCommon.dateInterval}">
						</div>
					   </div>
					</div>
                    <div class="layui-form-item">
                    <div
                        class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                            data-th-text="#{ChannelAsset002.mdate}">到期日</label>
                        <div class="layui-input-inline input-inline">
                            <input name="mdate"
                                class="layui-input form-input input-dateRangeSelect"
                                placeholder="请选择、支持区间"
                                data-th-placeholder="#{SysCommon.dateInterval}">
                        </div>
                    </div>
                    </div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script
			data-th-src="@{/js/invest/asset/channel/ChannelAsset001.js}"></script>
        <script data-th-src="@{/js/invest/asset/common/AssetCommon.js}" type="text/javascript"></script>
	</div>
</body>
</html>
