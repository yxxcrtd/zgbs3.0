												<a id="FinPlanNetAsset002_btn_quickInput" class="layui-btn layui-btn-sm form-input-text">快录</a>

												</select>
											</div>

										<!--行内五级分类 zhangpuyu 2019-7-25 end -->

									<div class="layui-form-item">

												<span class="input-right-show">元</span>
											</div>

										<div class=" form-inline-wrap">

													   onkeyup="(this.v=function(){this.value=this.value.replace(/[^\d]/g,'');}).call(this)"
													   style="float: left;display: inline-block; width: 90%;"/>

													data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue='*{entity?.ccy?:CCY_default}'>
												</select>
											</div>

									<div class="layui-form-item">

													data-th-initValue='${entity?.capiIncomeFeature}' />
											</div>

									<div class="layui-form-item">

											<div class="layui-input-inline input-inline">

													allowClear="true" placeholder="请输入内容"

													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-data-result='${INVEST_TYPE}' >
												</select>
											</div>
										</div>
