<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="|#{invest.channelId}#{ChannelAsset001Bak}|">合作资产资产查询</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="|#{invest.channelId}#{ChannelAsset001.secAcctId}|">合作资产代码</label>
							<div class="layui-input-inline input-inline">
								<select id="secAcctId" name="secAcctId" multiple
									class="layui-input form-input input-select" placeholder="请输入内容"
									data-th-data-url="@{/invest/asset/channel/ChannelAsset001/getSecAcctId}">
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="|#{invest.channelId}#{ChannelAsset001.secAcctName}|">合作资产代码</label>
							<div class="layui-input-inline input-inline">
								<select id="secAcctName" name="secAcctName" multiple
									class="layui-input form-input input-select" placeholder="请输入内容"
									data-th-data-url="@{/invest/asset/channel/ChannelAsset001/getSecAcctName}">
								</select>
							</div>
						</div>
						<div id="SelectDate"
						class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							data-th-text="#{ChannelAsset001.selectDate}">查询日期</label>
						<div class="layui-input-inline input-inline">
							<input name="selectDate"
								class="layui-input form-input input-dateRangeSelect"
								placeholder="请选择、支持区间"
								data-th-placeholder="#{SysCommon.dateInterval}">
						</div>
					</div>
					</div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script
			data-th-src="@{/js/invest/asset/channel/channelassetquery.js}"></script>
	</div>
</body>
</html>
