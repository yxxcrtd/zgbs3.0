<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title>质押券置换</title>

</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base">
                <!--基本信息-->
                <div class="pro-module-wrap">
                    <input type="hidden" id="noBranchNoValue" name="noBranchNoValue" th:value="${noBranchNoValue}" />
                    <input type="hidden" id="tradeId" name="tradeId" th:value="${tradeId}" />
                    <input type="hidden" id="workflowId" name="workflowId" th:value="${workflowId}" />
                    <input type="hidden" id="ccy" name="ccy" th:value="${entity?.ccy}" />
                    <input type="hidden" id="branch" name="branch" th:value="${entity?.branch}" />
                    <input type="hidden" id="registOrg" name="registOrg" th:value="${entity?.registOrg}" />
                    <input type="hidden" id="bussinessCode" name="bussinessCode" th:value="${bussinessCode}" />
                    <input type="hidden" id="entrustId" name="entrustId" th:value="${entity?.entrustId}" />
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des"
                            >基本信息
                            </span>

                        </h3>
                        <div class="pro-module-item pro-item-wrap">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">原始业务编号</label>

                                    <div class="layui-input-inline input-inline">
                                        <input disabled type="text" id="sourceBusinessCode" name="sourceBusinessCode"
                                               class="layui-input form-input" maxlength="50"  th:Value="${tradeId}"
                                             >
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                    >组合代码</label>

                                    <div class="layui-input-inline input-inline">
                                        <select disabled type="text" id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}" allowClear="true"
                                                formatoption="true"
                                                th:initValue="${entity?.portfolioId}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                    >期限品种</label>
                                    <div class="layui-input-inline input-inline" id="termTypeRebackDiv">

                                        <select disabled type="text" id="termTypeReback" name="termTypeReback"
                                                class="layui-input form-input input-select"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-result='${TERM_TYPE_REBACK}'
                                                data-th-initvalue="${entity?.termTypeReback}"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                    >交易方向</label>
                                    <div class="layui-input-inline input-inline">
                                        <select disabled type="text" id="ps" name="ps"
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${BACK_LEND_DIRECTION}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.ps}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                    >交易场所</label>
                                    <div class="layui-input-inline input-inline">
                                        <select disabled type="text" id="tradeMarket" name="tradeMarket"
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${TRADE_PLACE}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.tradeMarket}"></select>
                                    </div>
                                </div>

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                    >交易日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input disabled  type="text" id="tradeDate" name="tradeDate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.tradeDate==null ? platDate : #dates.format(entity?.tradeDate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                    >期限(天)</label>
                                    <div class="layui-input-inline input-inline">
                                        <input disabled type="text" id="term" name="term" maxlength="10"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" data-fixtype="2" data-textrange="0"
                                               th:value="${entity?.term}">
                                        <span class="input-right-show">天</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" id="actCapDaysDiv">
                                    <label class="layui-form-label form-label-wrap"
                                    >实际占款天数</label>
                                    <div class="layui-input-inline input-inline">
                                        <input disabled type="text" id="actCapDays" name="actCapDays" maxlength="10"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" data-fixtype="2" data-textrange="0"
                                               th:value="${entity?.actCapDays}">
                                        <span class="input-right-show">天</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" id="fTradeIdDiv">
                                    <label class="layui-form-label form-label-wrap"
                                    >成交编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="fTradeId" name="fTradeId" disabled
                                                class="layui-input form-input " placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                allowClear="true" th:value="${fTradeId}">
                                    </div>
                                </div>

                            </div>
                            <div class="layui-form-item" id="repoDateDiv">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                    >起息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="vdate" name="vdate" disabled
                                                class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${#dates.format(entity?.vdate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                          >到期日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input disabled type="text" id="mdate" name="mdate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${#dates.format(entity?.mdate,'yyyy-MM-dd')}">
                                    </div>
                                </div>

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                    >回购类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select disabled type="text" id="repoType" name="repoType"
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${TARGET_BACK_TYPE}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.repoType}"></select>
                                    </div>
                                </div>

                                
                            </div>
                            <div class="layui-form-item" id="repoBasisDiv">
                                <div class="form-inline-wrap payDate" id="vpayDateDiv">
                                    <label class="layui-form-label form-label-wrap"
                                    >首期交付日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input disabled type="text" id="vpayDate" name="vpayDate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.vpayDate==null ? '':#dates.format(entity?.vpayDate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap payDate" id="mpayDateDiv">
                                    <label class="layui-form-label form-label-wrap"
                                    >到期交付日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input disabled type="text" id="mpayDate" name="mpayDate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.mpayDate==null ? '':#dates.format(entity?.mpayDate,'yyyy-MM-dd')}">
                                    </div>
                                </div>

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                    >计息基础</label>
                                    <div class="layui-input-inline input-inline">
                                        <select disabled  type="text" id="basis" name="basis" class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${BASIS}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.basis?:BASIS_default}"></select>
                                    </div>
                                </div>

                            </div>
                            <div class="layui-form-item" id="repoMoneyDiv">

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           >本金金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input disabled type="text" id="prinAmt" name="prinAmt" maxlength="16"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.prinAmt}">
                                        <span class="input-right-show"
                                              th:text="#{TrdRepoTrade002.yuan}">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdRepoTrade002.rebackPrice}">回购利率%</label>
                                    <div class="layui-input-inline input-inline">
                                        <input disabled type="text" id="rebackPrice" name="rebackPrice"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-fixtype="2" data-textrange="6" maxlength="10"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.rebackPrice}">
                                        <span class="input-right-show">%</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                         >到期结算金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <div class="layui-input-inline input-inline">
                                            <input disabled type="text" id="mdateSettleAmt" name="mdateSettleAmt"
                                                   class="layui-input form-input text-number" placeholder="请输入内容" maxlength="16"
                                                   th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.mdateSettleAmt}">
                                            <span class="input-right-show"
                                                  th:text="#{TrdRepoTrade002.yuan}">元</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- 债券借贷部分开始 -->
                            <div class="layui-form-item" id="bondLendBasisDiv">

                                <div class="form-inline-wrap payDate" >
                                    <label class="layui-form-label form-label-wrap"
                                    >首次结算日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input disabled type="text" id="settlementStartDate" name="settlementStartDate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.settlementStartDate==null ? '':#dates.format(entity?.settlementStartDate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap payDate" >
                                    <label class="layui-form-label form-label-wrap"
                                    >到期结算日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input disabled type="text" id="settlementEndDate" name="settlementEndDate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.settlementEndDate==null ? '':#dates.format(entity?.settlementEndDate,'yyyy-MM-dd')}">
                                    </div>
                                </div>

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                    >标的债券</label>
                                    <div class="layui-input-inline input-inline">

                                        <select disabled type="text" id="finprodId" name="finprodId"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:data-url="@{/invest/trade/bondlend/TrdBondLendInvestTrade002/getFinprodId}"
                                                allowClear="true" th:initValue="${entity?.finprodId}"></select>
                                    </div>
                                </div>

                            </div>
                            <div class="layui-form-item" id="bondLendMoneyDiv">

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                    >券面总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input disabled type="text" id="totalPrinMoney" name="totalPrinMoney" maxlength="16"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.totalPrinMoney}">
                                        <span class="input-right-show"
                                              >万元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                         >借贷费率%</label>
                                    <div class="layui-input-inline input-inline">
                                        <input disabled type="text" id="mYield" name="mYield"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-fixtype="2" data-textrange="6" maxlength="10"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.mYield}">
                                        <span class="input-right-show">%</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" >借贷费用</label>
                                    <div class="layui-input-inline input-inline">

                                        <div class="layui-input-inline input-inline">
                                            <input disabled type="text" id="mTradeAmt" name="mTradeAmt"
                                                   class="layui-input form-input text-number"  data-fixtype="2" data-textrange="2"
                                                   th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.mTradeAmt}">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- 债券借贷部分结束 -->
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                    >本方交易员</label>

                                    <div class="layui-input-inline input-inline">
                                        <input disabled type="text" id="trader" name="trader"
                                               class="layui-input form-input" maxlength="50"
                                               th:value="${trader}">
                                    </div>
                                </div>

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                    >交易对手</label>

                                    <div class="layui-input-inline input-inline">
                                        <input disabled type="text" id="counterParty" name="counterParty"
                                               class="layui-input form-input" maxlength="50"
                                               th:value="${counterParty}">

                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                    >对手方交易员</label>

                                    <div class="layui-input-inline input-inline">
                                        <input disabled type="text" id="counterTrader" name="counterTrader"
                                               class="layui-input form-input" maxlength="50"
                                               th:value="${counterTrader}">
                                    </div>
                                </div>
                            </div>
                            
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                          >证券托管户</label>
                                    <div class="layui-input-inline input-inline">
                                        <select disabled type="text" id="secAcctId" name="secAcctId" parentIds="portfolioId,tradeMarket"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:data-url="@{/invest/trade/trdrepotrade/TrdRepoTrade002/getSecManageAcctId}"
                                                allowClear="true" th:initValue="${entity?.secAcctId}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap payDate" >
                                    <label class="layui-form-label form-label-wrap"
                                    >置换日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="substitutionDate" name="substitutionDate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${entity?.substitutionDate==null ? platDate : #dates.format(entity?.substitutionDate,'yyyy-MM-dd')}"
                                               >
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                    >置换费用</label>

                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="substitutionAmt" name="substitutionAmt"
                                               class="layui-input form-input text-number" maxlength="50"
                                                th:value="${entity?.substitutionAmt}" >
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
                <!--选择换出债券-->
                    <div class="repo-trade-wrap">
                        <div class="repo-trade-left">
                            <h3 class="repo-trade-title">
                    <span class="title-des"
                    >选择换出债券</span>
                            </h3>
                            <table class="layui-table" id="outDataTable" th:name="outDataTable" ></table>
                        </div>
                        <div class="repo-trade-right">
                            <label class="layui-form-label form-label-wrap"
                            >换出债券汇总券面总额（万元）</label>
                            <div class="layui-input-inline input-inline">
                            <input  disabled type="text" id="outSumAmt" name="outSumAmt" style="width: 200px;"
                                    class="layui-input form-input" maxlength="50"
                                    >
                            </div>
                            <a id="TrdRepoTrade004_btn_ok" class="layui-btn layui-btn-sm trade-btn-wrap" style="visibility: hidden">确认</a>
                        </div>

                    </div>
                <!--选择换入债券-->
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                            <span class="title-des"
                                  >选择换入债券
                            </span>
                            </h3>
                    <div class="page-component" th:data-path="@{/component/trade/BussRepoSec/init}"
                         th:data-params="|{entityName: 'bussRepoSec', pageFrom: 'TrdRepoTrade004', entity:'${entity_bussRepoSecDto}',
                     portfolioId:'${entity?.portfolioId==null?'':entity?.portfolioId}', ps:'${entity?.ps==null?'':entity?.ps}',
                     bussType:'zyqJy',bussType:'zyqJy',
                     bizCode:'', entrustId:'',
                     securitiesCust: '${entity?.secAcctId == null? '': entity?.secAcctId}',chlId:'${entity?.chlId == null? '': entity?.chlId}', tradeMarketId: 'tradeMarket'}|"></div>
                        </div>
                    </div>
                    <!--最终质押券信息-->
                    <div class="repo-trade-wrap">
                        <div class="repo-trade-left">
                                <h3 class="repo-trade-title">
                    <span class="title-des"
                                  >最终质押券信息
                            </span>
                            </h3>

                            <table class="layui-table" id="bussResultRepoSec" th:name="bussResultRepoSec"></table>
                        </div>

                        <div class="repo-trade-right">
                            <label class="layui-form-label form-label-wrap"
                            >汇总券面总额</label>

                            <div class="layui-input-inline input-inline">
                                <input disabled type="text" id="sumAmt" name="sumAmt"
                                       class="layui-input form-input" maxlength="50"
                                       >

                            </div>
                        </div>

                    </div>
                <!-- 人员信息 -->
                <!--<div class="page-component" th:data-path="@{/component/trade/TrdInvestPersonInfo002/init}"
                     th:data-params="|{entityName: 'trdInvestPersonInfo', pageFrom: 'submitForm', entity:'${entity_trdInvestPersonInfo}', innerTrade: false}|"></div>-->
                    <!--备注-->
                    <div class="pro-module-wrap">
                        <div class="pro-module">

                            <h3 class="pro-module-title">
                            <span class="title-des"
                                  th:text="#{TrdRepoTrade002.remark}">备注</span>
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item pro-item-wrap">
                                <div class="layui-form-item">
                                    <div class="layui-form-item">
                                        <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                        <textarea id="remark" name="remark" maxlength="1000" th:text="${entity?.remark}"
                                                  class="layui-textarea" placeholder="请输入内容"
                                                  th:placeholder="#{SysCommon.placeholder}"></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- 附件信息 -->
                    <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                         th:data-params="|{entityName: 'uploadFileList', businessId: '${bussinessCode}'}|"></div>
                <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
                    <div class="row text-center" style="margin: 20px 0;">

                        <a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save"
                           th:text="#{SysCommon.save}">保存</a>
                        <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit"
                           th:text="#{SysCommon.submit}">提交</a>
                        <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel"
                           th:text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </div>

        </form>
    </div>
</div>
<div layout:fragment="script">
    <style>
        .repo-trade-wrap {
            overflow: hidden;
        }

        .repo-trade-left {
            width: 60%;
            float: left;
        }

        .repo-trade-right {
            width: 35%;/* modify by jiangpeng on 20210514 ZGBSS-1114*/
            float: left;
            margin-top: 90px;
        }
        .trade-btn-wrap {
            float:left;
            margin-left: 200px;
            margin-top: 50px;
        }

    </style>
    <script data-th-inline="javascript" type="text/javascript">
