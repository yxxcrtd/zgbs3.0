<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
    <title>手工交收</title>
    <style type="text/css">

    </style>
</head>

<body>
<div layout:fragment="content">
    <div style="overflow:hidden;">
        <div class="form-button-area"  style="float:left; margin-top:3px!important;" export="false">
            <a id="ManualSettle001_btn_settle" class="layui-btn layui-btn-sm">交收</a>
            <a id="ManualSettle001_btn_back" class="layui-btn layui-btn-sm">回溯</a>
            <a id="ManualSettle001_btn_settledelay" class="layui-btn layui-btn-sm">交收延期</a>
            <a id="ManualSettle001_btn_settlefail" class="layui-btn layui-btn-sm">交收失败</a>
            <a id="ManualSettle001_btn_export" class="layui-btn layui-btn-sm btn-export btn-default">导出</a>
        </div>
        <div id="settleStatus_div" style="float:left;margin-left:30px;display:block;line-height:30px;">
            <label><input name="settleStatus" type="radio" checked lay-filter="settleStatus" value=""  />全部</label>
            <label><input name="settleStatus" type="radio" value="01" lay-filter="settleStatus"/>未交收</label>
            <label><input name="settleStatus" type="radio" value="02" lay-filter="settleStatus"/>已交收</label>
            <label><input name="settleStatus" type="radio" value="03" lay-filter="settleStatus"/>交收延期</label>
            <label><input name="settleStatus" type="radio" value="04" lay-filter="settleStatus"/>交收失败</label>
        </div>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{EtrTransactionDetail001.portfolioId}">组合代码</label>
                    <div class="layui-input-inline input-inline">
                        <select id="portfolioId" name="portfolioId"
                                class="layui-input form-input input-select" multiple="true"
                                data-th-data-url="@{/invest/trade/trddepositinvesttrade/TrdDepositInvestTrade001/getPortfolioId}"
                                allowClear="true" data-th-placeholder="#{SysCommon.placeholder}" >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{EtrTransactionDetail001.tradeMarket}">交易场所</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="tradeMarket" name="tradeMarket"
                               class="layui-input form-input input-select" allowclear="true"
                               placeholder="请选择交易场所" data-th-placeholder="#{SysCommon.placeholder}" aria-hidden="true"
                               data-th-data-result="${TRADE_PLACE}" formatoption="true">
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{EtrTransactionDetail001.finprodId}">资产代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="finprodMarketId" name="finprodMarketId" maxlength="32"
                               class="layui-input form-input input-lenovoselect"
                               data-th-data-url="@{/invest/trade/investtrade/commanddispatcher/TrdCommandDispatcher001/getFinprodIds}"
                               data-idfield="hidCode"
                               data-th-data-effectivefieldsalias='|{"code":"#{TrdCommandDispatcher001.finprodId}",
											"shortName":"#{TrdCommandDispatcher001.finprodAbbr}"}|'
                               placeholder="请输入内容"/>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable">交收状态</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="settleStatus" name="settleStatus"
                                class="layui-input form-input input-select" allowclear="true"
                                placeholder="请选择交收状态" data-th-placeholder="#{SysCommon.placeholder}" aria-hidden="true"
                                data-th-data-result="${DELIVERY_STATUS}" formatoption="true">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable">业务类别</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="busiType" name="busiType"
                                class="layui-input form-input input-select" allowclear="true"
                                placeholder="请选择业务类别" data-th-placeholder="#{SysCommon.placeholder}" aria-hidden="true"
                                data-th-data-result="${DELIVERY_BUS_TYPE}" formatoption="true">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable">交易日期</label>
                    <div class="layui-input-inline input-inline">
                        <input id='tradeDate' name='tradeDate'
                               class="layui-input form-input input-dateRangeSelect" placeholder="请选择时间区间"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable">交收日期</label>
                    <div class="layui-input-inline input-inline">
                        <input id='settleDate' name='entrustDate'
                               class="layui-input form-input input-dateRangeSelect" placeholder="请选择时间区间"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <div class="layui-row dataTable_One">
            <table id="dataTable"></table>
        </div>
        <div class="layui-row" >
            <table class="layui-table" id="dataTableDetail"></table>
        </div>
    </div>
</div>

<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var DELIVERY_STATUS_01 = /*[[${DELIVERY_STATUS_01}]]*/'';
        var DELIVERY_STATUS_02 = /*[[${DELIVERY_STATUS_02}]]*/'';
        var DELIVERY_STATUS_03 = /*[[${DELIVERY_STATUS_03}]]*/'';
        var DELIVERY_STATUS_04 = /*[[${DELIVERY_STATUS_04}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/trade/manualsettle/ManualSettle001.js}"></script>
</div>
</body>
</html>
