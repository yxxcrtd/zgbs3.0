<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title>交易所竞价正回购质押券管理</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a class="layui-btn layui-btn-sm" id="TrdStandardBond001_btn_in"
           th:utext="#{TrdStandardBond001.in}">
            <i class="iconfont icon-putin-storage"></i>入库</a>
        <a class="layui-btn layui-btn-sm btn-default" id="TrdStandardBond001_btn_out"
           th:utext="#{TrdStandardBond001.out}">
            <i class="iconfont icon-outof-storage"></i>出库</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
        <form class="layui-form" id="submitForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           th:utext="#{TrdStandardBond001.portfolioId}">组合代码</label>
                    <div class="layui-input-inline input-inline">
                        <select required type="text" id="portfolioId" name="portfolioId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                th:placeholder="#{SysCommon.placeholder}" th:childrenIds="secAcctId"
                                th:data-url="@{/business/common/CommonSelect/selectPortfolioId}"
                                th:value="${entity?.portfolioId}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-label-wrap"
                           th:utext="#{TrdStandardBond001.bondCode}">债券名称</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="bondCode" name="bondCode"
                                class="layui-input form-input input-select"
                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                th:data-url="@{/invest/trade/trdstandardbond/TrdStandardBond001/getBondCode}"
                                allowClear="true" multiple="true">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           th:utext="#{TrdStandardBond001.tradePlace}">交易场所</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="tradePlace" name="tradePlace"
                                class="layui-input form-input input-select" th:childrenIds="secAcctId"
                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                allowClear="true" formatoption="true" th:data-result='${TRADE_PLACE}'>
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-label-wrap"
                           th:utext="#{TrdStandardBond001.secAcctId}">证券账户</label>
                    <div class="layui-input-inline input-inline">
                        <select required type="text" id="secAcctId" name="secAcctId" parentIds="portfolioId,tradePlace"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                th:placeholder="#{SysCommon.placeholder}"
                                th:data-url="@{/invest/trade/trdstandardbond/TrdStandardBond001/getSecManageAcctId}"
                                allowClear="true" formatoption="true"></select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           th:utext="#{TrdStandardBond001.searchDate}">查询日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="searchDate" name="searchDate"
                               class="layui-input form-input input-dateSelect"
                               placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                               th:value="${platDate}">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="pledge-table-wrap">
        <h3 class="remind-title"
            th:utext="#{TrdStandardBond001.standardBondMain}">标准券概览</h3>
        <div class="layui-row pledge-row">
            <div class="layui-col-xs3 layui-col-sm3 layui-col-md3 layui-col-lg3 pledge-col-wrap pledge-col">
                <div class="pledge-state" id="inTotalPrinAmtSum">&nbsp;</div>
                <div class="pledge-text" th:utext="#{TrdStandardBond001.inTotalPrinAmtSum}">质押券总额度</div>
            </div>
            <div class="layui-col-xs3 layui-col-sm3 layui-col-md3 layui-col-lg3 pledge-col-wrap pledge-col">
                <div class="pledge-state" id="stdrdPrinAmtSum">&nbsp;</div>
                <div class="pledge-text" th:utext="#{TrdStandardBond001.stdrdPrinAmtSum}">标准券总额度</div>
            </div>
            <div class="layui-col-xs3 layui-col-sm3 layui-col-md3 layui-col-lg3 pledge-col-wrap pledge-col">
                <div class="pledge-state" id="pledgeStdrdPrinAmtSum">&nbsp;</div>
                <div class="pledge-text" th:utext="#{TrdStandardBond001.pledgeStdrdPrinAmtSum}">已使用标准券总额度</div>
            </div>
            <div class="layui-col-xs3 layui-col-sm3 layui-col-md3 layui-col-lg3 pledge-col-wrap">
                <div class="pledge-state" id="avaStrdPrinAmtSum">&nbsp;</div>
                <div class="pledge-text" th:utext="#{TrdStandardBond001.avaStrdPrinAmtSum}">可使用标准券总额度</div>
            </div>
        </div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <style>
        .remind-title {
            padding-left: 5px;
            border-left: 3px solid #4893e6;
            margin: 10px 0;
        }

        .pledge-state {
            font-size: 22px;
            color: #007fff;
            text-align: center;
        }

        .pledge-text {
            color: #444444;
            font-size: 14px;
            text-align: center;
        }

        .pledge-row {
            border: 1px solid #dddddd;
        }

        .pledge-col {
            border-right: 1px solid #dddddd;
        }

        .pledge-col-wrap {
            padding: 10px 0;
        }
    </style>
    <script th:src="@{/js/invest/trade/trdstandardbond/TrdStandardBond001.js}" type="text/javascript"></script>
</div>
</body>
</html>
