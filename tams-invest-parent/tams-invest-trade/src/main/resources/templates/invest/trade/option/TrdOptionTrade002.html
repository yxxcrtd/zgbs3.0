<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="#{TrdOptionTrade002}">期权交易新增</title>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <!-- 基本信息 -->
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="title-des" th:text="#{TrdOptionTrade002.baseInfo}">基本信息</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        <input name="tradeId" th:value="${entity?.tradeId}" type="hidden">
                    </h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdOptionTrade001.entrustId}">委托代码</label>
                                <div class="layui-input-inline input-inline">
                                    <input disabled type="text" id="entrustId" name="entrustId"
                                           class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:data-url="@{/business/common/CommonSelect/getEntrustId}"
                                           data-idfield="code" data-keyfield="name"
                                           th:data-effectivefieldsalias='|{"code":"#{TrdOptionTrade002.entrustId}","shortName":"#{TrdOptionTrade002.entrustId}"}|'
                                           th:value="${entity?.entrustId}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdOptionTrade002.contractNo}">合同编号</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="contractNo" name="finTradeProduct.contractNo" maxlength="200"
                                           class="layui-input form-input" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.finTradeProduct?.contractNo}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdOptionTrade002.contractName}">合同名称</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="contractName" name="finTradeProduct.contractName" maxlength="200"
                                           class="layui-input form-input" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.finTradeProduct?.contractName}">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdOptionTrade001.portfolioId}">组合代码</label>
                                <div class="layui-input-inline input-inline">
                                    <select required type="text" id="portfolioId" name="portfolioId"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}" allowClear="true"
                                            formatoption="true"
                                            th:initValue="${entity?.portfolioId}"></select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdOptionTrade001.targetId}">合约标的</label>
                                <div class="layui-input-inline input-inline">
                                    <select required type="text" id="targetId" name="targetId"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:data-url="@{/invest/trade/option/TrdOptionTrade001/selectFinprodIdAbbr?act=true}" allowClear="true"
                                            formatoption="true"
                                            th:initValue="${entity?.targetId}"></select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdOptionTrade001.contractType}">合约类型</label>
                                <div class="layui-input-inline input-inline">
                                    <select required type="text" id="contractType" name="contractType"
                                            class="layui-input form-input input-select"
                                            placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                            th:data-result='${STRUCTURE_TYPE}' allowClear="true" formatoption="true"
                                            th:initValue="${entity?.contractType}"></select>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdOptionTrade001.ps}">交易方向</label>
                                <div class="layui-input-inline input-inline">
                                    <select required type="text" id="ps" name="ps"
                                            class="layui-input form-input input-select"
                                            placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                            th:data-result='${PS}' allowClear="true" formatoption="true"
                                            th:initValue="${entity?.ps}"></select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdOptionTrade002.calendarId}">交易日历</label>
                                <div class="layui-input-inline input-inline">
                                    <select required type="text" id="calendarId" name="calendarId"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:data-url="@{/business/common/CommonSelect/selectCalendarId}" allowClear="true"
                                            formatoption="true"
                                            th:initValue="${entity?.calendarId}"></select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdOptionTrade001.tradeDate}">交易日期</label>
                                <div class="layui-input-inline input-inline">
                                    <input required disabled type="text" id="tradeDate" name="tradeDate"
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.tradeDate==null ? platDate : #dates.format(entity?.tradeDate,'yyyy-MM-dd')}">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdOptionTrade002.payDate}">支付日期</label>
                                <div class="layui-input-inline input-inline">
                                    <input required type="text" id="payDate" name="payDate"
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.payDate==null ? platDate : #dates.format(entity?.payDate,'yyyy-MM-dd')}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdOptionTrade001.vdate}">起息日</label>
                                <div class="layui-input-inline input-inline">
                                    <input required type="text" id="vdate" name="vdate"
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.vdate==null ? platDate : #dates.format(entity?.vdate,'yyyy-MM-dd')}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdOptionTrade001.term}">期限(天)</label>
                                <div class="layui-input-inline input-inline">
                                    <input required type="text" id="term" name="term"
                                           class="layui-input form-input text-number" placeholder="请输入内容" maxlength="10"
                                           th:placeholder="#{SysCommon.placeholder}" data-fixtype="2" data-textrange="0"
                                           th:value="${entity?.term}">
                                    <span class="input-right-show">天</span>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdOptionTrade001.mdate}">到期日</label>
                                <div class="layui-input-inline input-inline">
                                    <input required disabled type="text" id="mdate" name="mdate"
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${#dates.format(entity?.mdate,'yyyy-MM-dd')}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdOptionTrade002.ccy}">币种</label>
                                <div class="layui-input-inline input-inline">
                                    <select required type="text" id="ccy" name="ccy" class="layui-input form-input input-select"
                                            placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                            th:data-result='${CCY}' allowClear="true" formatoption="true"
                                            th:initValue="*{entity?.ccy?:CCY_default}"></select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdBondLendInvestTrade002.holdPurpose}">持有目的</label>
                                <div class="layui-input-inline input-inline">
                                    <select required  type="text" id="holdPurpose" name="holdPurpose"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}" th:data-result="${SVR_HOLD_PURPOSE}"
                                            th:initValue="${entity?.holdPurpose==null ? entity?.finTradeProduct?.holdPurpose : entity?.holdPurpose}"></select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 组合现金、持仓查询 -->
                <div id="bussTrdAvailableCashQuery_div" class="page-component" th:data-path="@{/component/trade/BussTrdAvailableCashQuery/init}"
                     th:data-params="|{entityName: 'bussTrdAvailableCashQuery'}|"></div>
            </div>
            <!-- 交易信息 -->
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="title-des" th:text="#{TrdOptionTrade002.tradeInfo}">交易信息</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdOptionTrade001.amount}">数量</label>
                                <div class="layui-input-inline input-inline">
                                    <input required type="text" id="amount" name="amount"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.amount}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdOptionTrade002.exerciseDate}">行权价基准日</label>
                                <div class="layui-input-inline input-inline">
                                    <input required type="text" id="exerciseDate" name="exerciseDate"
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.exerciseDate==null ? platDate : #dates.format(entity?.exerciseDate,'yyyy-MM-dd')}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdOptionTrade002.exePrice}">执行价格</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="exePrice" name="finRateInfoStructure.exePrice" maxlength="30"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.finRateInfoStructure?.exePrice}">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdOptionTrade002.knockPrice}">敲出价格</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="knockPrice" name="finRateInfoStructure.knockPrice" maxlength="30"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.finRateInfoStructure?.knockPrice}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdOptionTrade002.lowHindPrice}">低障碍价</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="lowHindPrice" name="finRateInfoStructure.lowHindPrice" maxlength="30"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.finRateInfoStructure?.lowHindPrice}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdOptionTrade002.lowExercPrice}">低行权价</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="lowExercPrice" name="finRateInfoStructure.lowExercPrice" maxlength="30"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.finRateInfoStructure?.lowExercPrice}">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdOptionTrade002.highHindPrice}">高障碍价</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="highHindPrice" name="finRateInfoStructure.highHindPrice" maxlength="30"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.finRateInfoStructure?.highHindPrice}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdOptionTrade002.highExercPrice}">高行权价</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="highExercPrice" name="finRateInfoStructure.highExercPrice" maxlength="30"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.finRateInfoStructure?.highExercPrice}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdOptionTrade001.exerciseType}">行权方式</label>
                                <div class="layui-input-inline input-inline">
                                    <select required type="text" id="exerciseType" name="exerciseType"
                                            class="layui-input form-input input-select"
                                            placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                            th:data-result='${EXEC_MODE}' allowClear="true" formatoption="true"
                                            th:initValue="${entity?.exerciseType}"></select>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdOptionTrade002.optFeePayType}">期权费类型</label>
                                <div class="layui-input-inline input-inline">
                                    <select required type="text" id="optFeePayType" name="optFeePayType"
                                            class="layui-input form-input input-select"
                                            placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                            th:data-result='${OPT_FEE_PAY_TYPE}' allowClear="true" formatoption="true"
                                            th:initValue="${entity?.optFeePayType}"></select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdOptionTrade002.optFeeRate}">期权费率%</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="optFeeRate" name="finTradeProductAdd.optFeeRate" maxlength="30"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.finTradeProductAdd?.optFeeRate}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdOptionTrade002.optFee}">期权费</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="optFee" name="optFee"
                                           class="layui-input form-input text-number" placeholder="请输入内容" maxlength="30"
                                           th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.optFee}">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>


            <!-- 人员信息 -->
            <div class="page-component" th:data-path="@{/component/trade/TrdInvestPersonInfo002/init}"
                 th:data-params="|{entityName: 'trdInvestPersonInfo', pageFrom: 'submitForm', entity:'${entity_trdInvestPersonInfo}', innerTrade: false}|"></div>
            <!-- 划款信息 -->
            <div class="page-component" th:data-path="@{/component/trade/BussTrdTransferOrder/init}" id="bussTrdTransferOrder_div"
                 th:data-params="|{entityName: 'bussTrdTransferOrder', pageFrom: 'submitForm', entity:'${entity_bussRepFinProductInfoDto}', bizCode:'${totleTradeId}'}|">
            </div>

            <!--备注-->
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="title-des" th:text="#{TrdOptionTrade001.remark}">备注</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div>
                                <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                        <textarea name="remark" maxlength="200" th:text="${entity?.remark}"
                                                  class="layui-textarea" placeholder="请输入内容"
                                                  th:placeholder="#{SysCommon.placeholder}"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            

            <!-- 附件信息 -->
            <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                 th:data-params="|{entityName: 'fileArray', businessId: '${businessId}'}|"></div>
            <!-- 风险试算 -->
            <div th:if="${isEleShow['TrdOptionTrade002_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}" th:data-params="|{entity: '${riskTrialRetDto}',entityName:'riskTrialRetDto',workflowId:'${workflowId?: ''}',tradeId:'${totleTradeId}'}|"></div>
            <div class="row text-center" style="margin-top:10px; margin-bottom:20px;">
                <a th:if="${isEleShow['TrdOptionTrade002_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'"
                        th:id="|${pageId}_btn_risk|" class="layui-btn layui-btn-sm"
                   data-th-text="#{TrdOptionTrade002.risk}">风险试算</a>
                <a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save"
                   data-th-text="#{SysCommon.save}">保存</a>
                <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit"
                   data-th-text="#{SysCommon.submit}">提交</a>
                <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel"
                   data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var entrustId = /*[[${entrustId}]]*/'';
        var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'';
        var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
        var PS_T01 = /*[[${PS_T01}]]*/'';
        var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
        var STRUCTURE_TYPE_01 = /*[[${STRUCTURE_TYPE_01}]]*/'';
        var STRUCTURE_TYPE_02 = /*[[${STRUCTURE_TYPE_02}]]*/'';
        var STRUCTURE_TYPE_03 = /*[[${STRUCTURE_TYPE_03}]]*/'';
        var STRUCTURE_TYPE_04 = /*[[${STRUCTURE_TYPE_04}]]*/'';
        var STRUCTURE_TYPE_05 = /*[[${STRUCTURE_TYPE_05}]]*/'';
        var OPT_FEE_PAY_TYPE_01 = /*[[${OPT_FEE_PAY_TYPE_01}]]*/'';
        var OPT_FEE_PAY_TYPE_02 = /*[[${OPT_FEE_PAY_TYPE_02}]]*/'';
        var FINPROD_TYPE_TG_F35 = /*[[${FINPROD_TYPE_TG_F35}]]*/'';
        var GEN_PAY_ORDERS_AUTO= /*[[${GEN_PAY_ORDERS_AUTO}]]*/; // 系统参数_是否显示划款指令
        var TYPE_06= /*[[${TYPE_06}]]*/; 
    </script>
    <script th:src="@{/js/invest/trade/option/TrdOptionTrade002.js}" type="text/javascript"></script>
</div>
</body>
</html>
