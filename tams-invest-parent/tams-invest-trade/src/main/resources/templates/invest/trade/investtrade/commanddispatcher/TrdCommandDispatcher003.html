<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{TrdCommandDispatcher003}">指令分发-自动分发</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap " id="informationForm">
            <div class="layui-inline layui-col-xs12 layui-col-sm12 layui-col-md12 layui-col-lg12" style="margin-top: 20px;margin-left: -210px;">
                <label class="layui-form-label form-lable">分发规则</label>
                <div class="layui-input-inline input-inline input-radio-inline">
                    <input type="radio" id="distributeRule_one" name="distributeRule" value="01" title="分发给所有有权限的交易员" checked="">
                    <input type="radio" id="distributeRule_two" name="distributeRule" value="02" title="每笔指令按序列顺序逐笔发送给相应的交易员">
                </div>
            </div>
            <div class="layui-inline layui-col-xs12 layui-col-sm12 layui-col-md12 layui-col-lg12" style="margin-top:20px;margin-left: -210px;">
                <label class="layui-form-label form-lable">分发参数</label>
                <div class="layui-input-inline input-inline">
                    <input type="checkbox" id="distributeParameter_one" name="distributeParameter" value="01" title="同一证券上次发给谁，这次还发给谁" ></br>
                    <input type="checkbox" id="distributeParameter_two"  name="distributeParameter" value="02" title="指令退回修改后发给原先交易员"></br>
                    <input type="checkbox" id="distributeParameter_three"  name="distributeParameter" value="03" title="回购拆借指令发给所有有权限交易员">
                </div>
            </div>



        	<div class="layui-inline layui-col-xs12 layui-col-sm12 layui-col-md12 layui-col-lg12" style="margin-top:20px;" >
                <label class="layui-col-xs3 layui-col-md3  layui-col-sm3 layui-col-lg3" 
                	data-th-text="#{TrdCommandDispatcher003.autodispensetime}">自动分发日期</label>
                <div class="layui-input-inline layui-col-xs7 layui-col-md7  layui-col-sm7 layui-col-lg7" style="margin-left:-115px;">
					<input type="text" id="TrdCommandDispatcher003_autodispensetime" name="autodispensetime"
						class="layui-input form-input input-dateRangeSelect"
						placeholder="请选择、支持区间" allowClear="true"
						data-th-placeholder="#{SysCommon.dateInterval}" 
						data-th-value="${autodispensetime}"/>
                </div>
			</div>
        <div class="layui-form-item" align="center" style="margin-top:70px;">
            <a id="TrdCommandDispatcher003_btn_submit" class="layui-btn layui-btn-sm  btn-submit" data-th-text="#{SysCommon.submit}"  style="margin-top:70px;">提交</a>
            <a id="TrdCommandDispatcher003_btn_reset"  class="layui-btn layui-btn-sm  btn-reset" data-th-text="#{SysCommon.reset}"  style="margin-top:70px;">重置</a>
            <a id="TrdCommandDispatcher003_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel" data-th-text="#{SysCommon.cancel}"  style="margin-top:70px;">取消</a>
        </div>
   	 </form>    
    </div>
    <div layout:fragment="script">
        <script th:inline="javascript" type="text/javascript">
        	var entrustIds = /*[[${entrustIds}]]*/'';
            var finprodType2s = /*[[${finprodType2s}]]*/'';
            var distributeRule = /*[[${distributeRule}]]*/'';
            var distributeParameter = /*[[${distributeParameter}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/trade/investtrade/commanddispatcher/TrdCommandDispatcher003.js}"></script>
    </div>
</body>
</html>
