                                        <div class="layui-input-inline input-inline">

                                        </div>

                                               class="layui-input form-input text-number"
                                               data-th-value="${entity?.tradeAmt1}" />
                                        -
                                        <input type="text" id="tradeAmt2" name="tradeAmt2"

                                               class="layui-input form-input text-number"
                                               data-th-value="${entity?.tradeAmt2}" >

                                </div>
                                <div class="layui-form-item">

                                        <a class="layui-btn layui-btn-sm btn-search" id="ExchangeTransMatch001_deal_btn_search">查询</a>
                                        <a class="layui-btn layui-btn-sm btn-reset" id="ExchangeTransMatch001_deal_btn_clean">重置</a>
                                        <a class="layui-btn layui-btn-sm" id="ExchangeTransMatch001_deal_btn_more">

                                        <a class="layui-btn layui-btn-sm btn-default" id="ExchangeTransMatch001_deal_btn_match_search" style="background-color: #2693ff !important;color: #fff;" title="匹配查询">
                                            <i class="icon jyiconfont"></i><span class="icon jyiconfont" style="font-size: 12px">匹配查询</span></a>

                                        <div class="layui-input-inline input-inline">

                                        <a class="layui-btn layui-btn-sm btn-reset" id="ExchangeTransMatch001_entrust_btn_clean">重置</a>

<!--                                            <i class="icon jyiconfont"></i><span class="icon jyiconfont" style="font-size: 12px">成交匹配</span></a>-->

                float: left;
                padding-right: 1px;
                width: 14.5%;
                border-right: 1px solid #c2c2c2;
            }
            .flow-right-contain {
                overflow: hidden;
                position: relative;
                float: left;
                width: 100%;
            }

            .flow-left-contain .layui-table-view .layui-table-box .layui-table-header tr {
                background-color: #eee !important;
            }

            .flow-left-contain .layui-table-view .layui-table-body table {
