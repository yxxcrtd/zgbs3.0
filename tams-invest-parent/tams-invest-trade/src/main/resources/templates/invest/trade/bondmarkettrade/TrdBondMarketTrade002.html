<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="utf-8">
    <title th:text="#{TrdBondMarketTrade002}">债券上市流通交易新建</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form " id="submitForm">
        <input type="hidden" id="totleTradeId" name="totleTradeId" th:value="${entity?.totleTradeId}" />
        <input type="hidden" id="workflowId" name="workflowId" th:value="${workflowId}" />
        <input type="hidden" id="finprodType2" name="finprodType2" th:value="${entity?.finprodType2}" />
        <input type="hidden" id="isAdded" name="isAdded" th:value="${entity?.isAdded}" />
        <input type="hidden" id="pageModel" name="pageModel" th:value="${entity?.pageModel}" />
        <input type="hidden" id="formatDate" name="formatDate" th:value="${formatDate}" />
        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-label-wrap"
                       th:text="#{TrdBondMarketTrade001.finprodId}">发行代码</label>
                <div class="layui-input-inline input-inline">
                    <input required disabled type="text" id="finprodIdStr" name="finprodIdStr"
                           class="layui-input form-input" placeholder="请输入内容"
                           th:placeholder="#{SysCommon.placeholder}"
                           th:value="${entity?.finprodId}" />
                </div>
            </div>
            <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                <label class="layui-form-label form-lable" data-th-text="#{TrdBondMarketTrade001.finprodAbbr}">发行简称</label>
                <div class="layui-input-inline input-inline">
                    <select type="text" id="finprodId" name="finprodId"
                            class="layui-input form-input input-select"
                            placeholder="请输入内容"
                            th:placeholder="#{SysCommon.placeholder}"
                            th:data-url="@{/invest/trade/bondmarkettrade/TrdBondMarketTrade001/getFinprodId(pageId=${fpageId})}"
                            allowClear="true"
                            parentIds="pageModel"
                            required
                            th:initValue="${entity?.finprodId}">
                    </select>
                </div>
            </div>
            <div class="form-inline-wrap" style="display:none">
                <label class="layui-form-label form-label-wrap"
                       th:text="#{TrdBondMarketTrade001.finprodAbbr}">发行简称</label>
                <div class="layui-input-inline input-inline">
                    <input required disabled type="text" id="finprodAbbr" name="finprodAbbr"
                           class="layui-input form-input" placeholder="请输入内容"
                           th:placeholder="#{SysCommon.placeholder}"
                           th:value="${entity?.finprodAbbr}" />
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-label-wrap"
                       th:text="#{TrdBondMarketTrade001.tradeMarket}">交易场所</label>
                <div class="layui-input-inline input-inline">
                    <select required disabled type="text" id="tradeMarket" name="tradeMarket"
                            class="layui-input form-input input-select" placeholder="请输入内容"
                            th:placeholder="#{SysCommon.placeholder}"
                            th:data-result='${TRADE_PLACE}'
                            allowClear="true" formatoption="true"
                            th:initValue="${entity?.tradeMarket}"></select>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="form-inline-wrap">
                <label class="layui-form-label form-label-wrap"
                       th:text="#{TrdBondMarketTrade001.appearMarketId}">上市代码</label>
                <div class="layui-input-inline input-inline">
                    <input required disabled type="text" id="appearMarketIdStr" name="appearMarketIdStr"
                           class="layui-input form-input" placeholder="请输入内容"
                           th:placeholder="#{SysCommon.placeholder}"
                           th:value="${entity?.appearMarketId}" />
                </div>
            </div>
            <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                <label class="layui-form-label form-lable" data-th-text="#{TrdBondMarketTrade001.appearMarketAbbr}">上市简称</label>
                <div class="layui-input-inline input-inline">
                    <select type="text" id="appearMarketId" name="appearMarketId"
                            class="layui-input form-input input-select" placeholder="请输入内容"
                            data-th-placeholder="#{SysCommon.placeholder}"
                            parentIds="tradeMarket,pageModel"
                            required
                            th:data-url="@{/invest/trade/bondmarkettrade/TrdBondMarketTrade001/getAppearMarketId}"
                            allowClear="true"
                            th:initValue="${entity?.appearMarketId}">
                    </select>
                </div>
            </div>
            <div class="form-inline-wrap" style="display:none">
                <label class="layui-form-label form-label-wrap"
                       th:text="#{TrdBondMarketTrade001.appearMarketAbbr}">上市简称</label>
                <div class="layui-input-inline input-inline">
                    <input required disabled type="text" id="appearMarketAbbr" name="appearMarketAbbr"
                           class="layui-input form-input" placeholder="请输入内容"
                           th:placeholder="#{SysCommon.placeholder}"
                           th:value="${entity?.appearMarketAbbr}" />
                </div>
            </div>
            <div class="form-inline-wrap">
                <label class="layui-form-label form-label-wrap"
                       th:text="#{TrdBondMarketTrade001.tradeDate}">交易日期</label>
                <div class="layui-input-inline input-inline">
                    <input required disabled type="text" id="tradeDate" name="tradeDate"
                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                           th:placeholder="#{SysCommon.placeholder}"
                           th:value="${entity?.tradeDate==null ? platDate : #dates.format(entity?.tradeDate,'yyyy-MM-dd')}" />
                </div>
            </div>
        </div>
        <div class="row text-center" style="margin: 50px 0;">
            <a th:id="TrdBondMarketTrade002_btn_save" class="layui-btn layui-btn-sm btn-save"
               data-th-text="#{SysCommon.save}">保存</a>
            <a th:id="TrdBondMarketTrade002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
               data-th-text="#{SysCommon.submit}">提交</a>
            <a th:id="TrdBondMarketTrade002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var TRADE_PLACE_01 = /*[[${TRADE_PLACE_01}]]*/'';
        var TRADE_PLACE_02 = /*[[${TRADE_PLACE_02}]]*/'';
        var TRADE_PLACE_03 = /*[[${TRADE_PLACE_03}]]*/'';
        var platDate = /*[[${platDate}]]*/'';
    </script>
    <script th:src="@{/js/invest/trade/bondmarkettrade/TrdBondMarketTrade002.js}" type="text/javascript"></script>
</div>
</body>
</html>
