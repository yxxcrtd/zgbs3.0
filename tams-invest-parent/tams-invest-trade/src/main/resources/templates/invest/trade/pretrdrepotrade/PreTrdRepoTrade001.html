<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>交易预录入-质押式回购-查询</title>
    <style type="text/css">
        .layui-form-radio {
            line-height: 24px;
            padding-right: 0px;
            margin: 0px;
        }
        .layui-form-radio div {
            font-size: 12px;
        }
        .layui-form-radio i{
            font-size: 20px;
        }


    </style>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area">
            <a id="PreTrdRepoTrade001_btn_add" class="layui-btn layui-btn-sm btn-print">新建</a>
            <a id="PreTrdRepoTrade001_btn_revoke" class="layui-btn layui-btn-sm btn-print">撤销</a>
        </div>
        <div
                class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">交易日期</label>
                        <div class="layui-input-inline input-inline">
                            <input  type="text" id="tradeDate" name="tradeDate"
                                   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                    th:value="${platDate}" th:placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">对手方</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="counterId" name="counterId" class="layui-input form-input input-select"
                                    data-th-data-url="@{/component/trade/TrdInvestPersonInfo002/selectCounterId}"
                                    formatoption = false placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" >
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4" >
                        <label class="layui-form-label form-lable">对手方交易员</label>
                        <div class="layui-input-inline input-inline">
                            <input id="counterTrader" name='counterTrader' class="layui-input form-input text-select " >
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">交易方向</label>
                        <div class="layui-input-inline input-inline">
                            <select  type="text" id="ps" name="ps"class="layui-input form-input input-select"
                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                th:data-result='${BACK_LEND_DIRECTION}'  formatoption="true"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">清算速度</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="settleSpreed" name="settleSpreed" class="layui-input form-input input-select"
                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                th:data-result='${ACCOUNT_SPEED}'  formatoption="true"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">回购期限（天）</label>
                        <div class="layui-input-inline input-inline">
                            <input id="term" name='term' class="layui-input form-input text-number" data-fixtype="2" data-textrange="0">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">有效状态</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="status" name="status"class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${TRADE_FLOW_STATUS}' th:initValue="${TRADE_STATUS}" allowClear="true" formatoption="true"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">托管机构</label>
                        <div class="layui-input-inline input-inline">
                            <select id="depCode" name="depCode" class="layui-input form-input input-select"
                                data-th-data-result='${REGIST_ORG_INV}' formatoption=true
                                data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">资金账户</label>
                        <div class="layui-input-inline input-inline">
                            <select name="capitalAccount" id="capitalAccount"
                                class="layui-input form-input input-select" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/trade/pretrdrepotrade/PreTrdRepoTrade001/getAcct}">
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">托管账号</label>
                        <div class="layui-input-inline input-inline">
                            <select name="secAcct" id="secAcct"
                                class="layui-input form-input input-select" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/trade/pretrdrepotrade/PreTrdRepoTrade001/getSecAcct}">
                            </select>
                        </div>
                    </div>

                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var TRADE_STATUS = /*[[${TRADE_STATUS}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/trade/pretrdrepotrade/PreTrdRepoTrade001.js}" type="text/javascript"></script>
</div>
</body>
</html>
