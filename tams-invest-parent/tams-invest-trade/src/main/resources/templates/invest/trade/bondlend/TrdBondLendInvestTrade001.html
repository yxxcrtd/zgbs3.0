<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{TrdBondLendInvestTrade001}">债券借贷交易管理</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="form-button-area">
            <a id="TrdBondLendInvestTrade001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
            <a id="TrdBondLendInvestTrade001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="#{SysCommon.revoke}"/></a>
            <a id="TrdRepoTrade001_btn_substitution" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-quanka" ></i>质押券置换</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdBondLendInvestTrade001.entrustId}">委托代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="entrustId" name="entrustId"
                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/trade/bondlend/TrdBondLendInvestTrade001/getEntrustIdByType}" data-idfield="code"
                                data-keyfield="name"
                                data-th-data-effectivefieldsalias='|{"code":"#{TrdBondLendInvestTrade001.entrustId}","shortName":"#{TrdBondLendInvestTrade001.entrustId}"}|'
                                data-th-value="${entity?.entrustId}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdBondLendInvestTrade001.portfolioId}">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="portfolioId" name="portfolioId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId}"
                                data-th-value="${entity?.portfolioId}"
                                multiple="true" >
                             </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                            data-th-text="#{TrdBondLendInvestTrade001.finprodId}">标的债券</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="finprodId" name="finprodId"
                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/business/common/CommonSelect/getAssetIdBond}"
                                data-idfield="code" data-keyfield="hidCode"
                                data-th-data-effectivefieldsalias='|{"code":"#{TrdBondLendInvestTrade001.finprodId}","shortName":"#{TrdBondLendInvestTrade001.finprodName}"}|'
                                data-th-value="${entity?.finprodMarketId}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdBondLendInvestTrade001.ps}">交易方向</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="ps" name="ps" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${BACK_LEND_DIRECTION}' allowClear="true" formatoption="true"
                                data-th-initValue="${entity?.ps}"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdBondLendInvestTrade001.validStatus}">有效状态</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="validStatus" name="validStatus"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${TRADE_FLOW_STATUS}'
                                allowClear="true" formatoption="true" data-th-initValue="${entity?.validStatus}"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdBondLendInvestTrade001.tradeDate}">交易日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="tradeDate" name="tradeDate"
                                class="layui-input form-input input-dateRangeSelect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-value="${#dates.format(entity?.tradeDate,'yyyy-MM-dd')}">
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/trade/bondlend/TrdBondLendInvestTrade001.js}" type="text/javascript"></script>
    </div>
</body>

</html>
