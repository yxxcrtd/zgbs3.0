<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>中标结果维护</title>
    <style>
        .upload .layui-table thead{
            display: none;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div>
        <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
            <input type="hidden" id="bidId" name="bidId" data-th-value="${entity?.bidId}" >
			<input id="workflowId" name="workflowId" data-th-value="${workflowId}" type="hidden">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">基本信息</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">投标编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required disabled type="text" class="layui-input form-input" data-th-value="${entity?.bidId}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">债券简称</label>
                                    <div class="layui-input-inline input-inline">
                                       <input required disabled type="text" class="layui-input form-input" data-th-value="${entity?.finprodAbbr}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">债券代码</label>
                                    <div class="layui-input-inline input-inline">
                                       <input id="finprodId" name="finprodId" data-th-value="${entity?.finprodId}" type="hidden">
                                       <input required disabled type="text" class="layui-input form-input" data-th-value="${entity?.finprodMarketId}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">投标日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required disabled type="text" class="layui-input form-input input-dateSelect" data-th-value='${#dates.format(entity?.bidDate,"yyyy-MM-dd")}' placeholder="请输入日期">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交易场所</label>
                                    <div class="layui-input-inline input-inline">
                                       <select  id="tradeMarket"  class="layui-input form-input input-select"
				                            data-th-data-result='${TRADE_PLACE}' formatoption="true"
				                            required="required" disabled allowClear="true" 
				                            data-th-placeholder="#{SysCommon.placeholder}"
				                            data-th-initValue='${entity?.tradeMarket}'>
				                    	</select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">缴款方式</label>
                                    <div class="layui-input-inline input-inline">
                                         <select  id="payType" name="payType" class="layui-input form-input input-select"
				                            data-th-data-result='${ETR_PAY_TYPE}' formatoption="true"
				                            required="required" allowClear="true" 
				                            data-th-placeholder="#{SysCommon.placeholder}"
				                            data-th-initValue='${entity?.payType}'>
				                    	</select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">缴款日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="payDate" name="payDate" class="layui-input form-input input-dateSelect" data-th-value='${#dates.format(entity?.payDate,"yyyy-MM-dd")}' placeholder="请输入日期" required>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">中标信息</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">汇总投标券面总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="allBidPrinAmt" name="allBidPrinAmt"  placeholder="请输入内容" class="layui-input form-input text-number" disabled
                                                   data-th-value="${entity?.allBidPrinAmt}" data-textrange="4" data-pattern=""/>
                                        <span class="input-right-show">万元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">中标券面总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="winPrinAmt" name="winPrinAmt" placeholder="请输入内容" class="layui-input form-input text-number"
                                                   data-th-value="${entity?.winPrinAmt}" data-textrange="4" data-pattern=""/>
                                        <span class="input-right-show">万元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">中标标位%</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="winPrice" name="winPrice" placeholder="请输入内容" class="layui-input form-input text-number"
                                                   data-th-value="${entity?.winPrice}" data-textrange="2" data-pattern=""/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">是否中标</label>
                                    <div class="layui-input-inline input-inline">
                                       <input type="text" id="isWin" name="isWin"
                                       required="required" class="layui-input form-input input-checkbox"
                                       data-th-data-result='${YES_OR_NO}'
                                       data-th-initValue='${entity?.isWin?:"Y"}'/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">中标方式</label>
                                    <div class="layui-input-inline input-inline">
                                         <select  id="winType" name="winType" class="layui-input form-input input-select"
				                            data-th-data-result='${WIN_TYPE}' formatoption="true"
				                            required="required" allowClear="true" 
				                            data-th-placeholder="#{SysCommon.placeholder}"
				                            data-th-initValue='${entity?.winType?:"01"}'>
				                    	</select>
                                    </div>
                                </div>
                               <a class="layui-btn layui-btn-sm" id="autoAllocation">自动分配</a>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="pro-module-wrap" id="allocationDetail">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">分配明细</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <table class="layui-table" id="dataTable"></table>
                        </div>
                    </div>
                </div>
                  <!-- 人员信息 -->
                <div class="page-component" th:data-path="@{/component/trade/TrdInvestPersonInfo002/init}" th:data-params="|{entity: '${trdInvestPersonInfo002Dto}',entityName:'trdInvestPersonInfo'}|"></div>
                <!-- 附件信息 -->
                <div class="page-component" th:data-path="@{/component/core/FileCommon/init}" th:data-params="|{entityName: 'fileCommonDto',businessId:'${entity?.finprodId?:''}'}|"></div>
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">备注信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                    <textarea id="remark" name="remark" data-th-text="${entity?.remark}" placeholder="请输入内容" class="layui-textarea"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 风险试算 -->
            <div th:if="${isEleShow['PrimaryBiddingManage003_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}" th:data-params="|{entity: '${riskTrialRetDto}',workflowId:'${workflowId?: ''}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>
        </form>
            <!--  按钮 -->
            <div class="row text-center" style="margin: 20px 0;">
                <div class="text-center">
                    <a th:if="${isEleShow['PrimaryBiddingManage003_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'" th:id="|${pageId}_btn_risk|" class="layui-btn layui-btn-sm" data-th-text="#{PrimaryBiddingManage003.risk}">风险试算</a>
                    <a id="PrimaryBiddingManage003_btn_save" class="layui-btn layui-btn-sm  btn-save"
                       data-th-text="#{SysCommon.save}">保存</a>
                    <a id="PrimaryBiddingManage003_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                       data-th-text="#{SysCommon.submit}">提交</a>
                    <a id="PrimaryBiddingManage003_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                       data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </div>

    </div>
</div>
<div layout:fragment="script">
      <script th:inline="javascript" type="text/javascript">
        var entity = /*[[${entity}]]*/'';
        var PrimaryBiddingManage003_entity = /*[[${entity}]]*/'';
        var YES_OR_NO = /*[[${YES_OR_NO}]]*/'';
        var entrustAmtUnit = /*[[${entrustAmtUnit}]]*/'';
        var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
        var sysDate = /*[[${sysDate}]]*/'';
        var TRD61 = /*[[${TRD61}]]*/'';
      </script>
    <script data-th-src="@{/js/invest/trade/primarybiddingmanage/PrimaryBiddingManage003.js}" type="text/javascript">
    </script>
</div>
</body>
</html>
