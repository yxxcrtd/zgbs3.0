<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="#{TrdLendInvestTrade002}">拆借投资交易</title>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <input type="hidden" id="tradeId" name="tradeId" th:value="${tradeId}" />
            <input type="hidden" id="workflowId" name="workflowId" th:value="${workflowId}" />
            <!-- 基本信息 -->
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="title-des" th:text="#{TrdLendInvestTrade002.baseInfo}">基本信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <input type="hidden" name="finprodType2" th:value="${entity?.finprodType2}">
                    <!-- <input type="hidden" id="vdate" name="vdate"
                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                           th:placeholder="#{SysCommon.placeholder}"
                           th:value="${#dates.format(entity?.vdate,'yyyy-MM-dd')}"> -->
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdLendInvestTrade002.entrustId}">指令代码</label>
                                <div class="layui-input-inline input-inline">
                                    <input disabled type="text" id="entrustId" name="entrustId"
                                           class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:data-url="@{/business/common/CommonSelect/getEntrustId}"
                                           data-idfield="code" data-keyfield="name"
                                           th:data-effectivefieldsalias='|{"code":"#{TrdLendInvestTrade002.entrustId}","shortName":"#{TrdLendInvestTrade002.entrustId}"}|'
                                           th:value="${entity?.entrustId}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdLendInvestTrade002.portfolioId}">组合代码</label>
                                <div class="layui-input-inline input-inline">
                                    <select required type="text" id="portfolioId" name="portfolioId"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}" allowClear="true"
                                            formatoption="true"
                                            th:initValue="${entity?.portfolioId}"></select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdLendInvestTrade002.paBussType}">拆借类型</label>
                                <div class="layui-input-inline input-inline">
                                   <!--  <select required type="text" id="paBussType" name="paBussType"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:data-result='${BANK_LENDING_TYPE}' allowClear="true" formatoption="true"
                                            th:initValue="${entity?.paBussType}"></select> -->
                                     <input required type="text" id="paBussType" name="paBussType"
                                                class="layui-input form-input input-checkbox"
                                                data-th-data-result='${BANK_LENDING_TYPE}'
                                                data-th-initvalue="${entity?.paBussType}" />
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdLendInvestTrade002.tradeDate}">交易日期</label>
                                <div class="layui-input-inline input-inline">
                                    <input required disabled type="text" id="tradeDate" name="tradeDate"
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.tradeDate==null ? platDate : #dates.format(entity?.tradeDate,'yyyy-MM-dd')}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdLendInvestTrade002.ps}">交易方向</label>
                                <div class="layui-input-inline input-inline">
                                    <select required type="text" id="busiPs" name="busiPs"
                                            class="layui-input form-input input-select"
                                            placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                            th:data-result='${BACK_LEND_DIRECTION}' allowClear="true" formatoption="true"
                                            th:initValue="${entity?.busiPs}"></select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdLendInvestTrade002.vdate}">起息日</label>
                                <div class="layui-input-inline input-inline">
                                    <input required disabled type="text" id="vdate" name="finTradeProduct.vdate"
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.finTradeProduct?.vdate==null ? platDate : #dates.format(entity?.finTradeProduct?.vdate,'yyyy-MM-dd')}"
                                    >
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdLendInvestTrade002.mdate}">到期日</label>
                                <div class="layui-input-inline input-inline">
                                    <input required type="text" id="mdate" name="finTradeProduct.mdate"
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${#dates.format(entity?.finTradeProduct?.mdate,'yyyy-MM-dd')}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdLendInvestTrade002.term}">期限</label>
                                <div class="layui-input-inline input-inline">
                                    <input required type="text" id="term" name="finTradeProduct.term"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}" data-fixtype="2" data-textrange="0"
                                           th:value="${entity?.finTradeProduct?.term}">
                                    <span class="input-right-show">天</span>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdLendInvestTrade002.basis}">计息基础</label>
                                <div class="layui-input-inline input-inline">
                                    <select required type="text" id="basis" name="finTradeProduct.basis"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}" th:data-result='${BASIS}'
                                            allowClear="true" formatoption="true"
                                            th:initValue="${entity?.finTradeProduct?.basis}"></select>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdLendInvestTrade002.calendarId}">交易日历</label>
                                <div class="layui-input-inline input-inline">
                                    <select required type="text" id="calendarId" name="finTradeProduct.calendarId"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:data-url="@{/business/common/CommonSelect/selectCalendarId}" allowClear="true"
                                            formatoption="true"
                                            th:initValue="${entity?.finTradeProduct?.calendarId}"></select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{EtrLendSpecInfo002.tradeMarket}">交易场所</label>
                                <div class="layui-input-inline input-inline">
                                    <select required type="text" id="tradeMarket" name="finTradeProduct.tradeMarket"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${TRADE_PLACE}'
                                            allowClear="true" formatoption="true" data-th-initvalue="${entity?.finTradeProduct?.tradeMarket}"></select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{EtrLendSpecInfo002.termVarieties}">期限品种</label>
                                <div class="layui-input-inline input-inline">
                                    <select type="text" id="termType" name="finTradeProduct.termType"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${TERM_TYPE_RESOLUTE}'
                                            allowClear="true" formatoption="true" data-th-initvalue="${entity?.finTradeProduct?.termType}"></select>
                                </div>
                            </div>

                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{EtrLendSpecInfo002.settleSpreed}">清算速度</label>
                                <div class="layui-input-inline input-inline">
                                    <select required type="text" id="settleSpreed" name="settleSpreed" class="layui-input form-input input-select"
                                            placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-data-result='${ACCOUNT_SPEED}'
                                            allowClear="true" formatoption="true" data-th-initvalue="${entity?.settleSpreedStr}"></select>
                                </div>
                            </div>
                        </div>

                        <!-- 组合现金、持仓查询 -->
                        <div class="page-component" th:data-path="@{/component/trade/BussTrdAvailableCashQuery/init}"
                             th:data-params="|{entityName: 'bussTrdAvailableCashQuery'}|"></div>
                    </div>
                </div>
            </div>
            <!-- 金额信息 -->
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="title-des" th:text="#{TrdLendInvestTrade002.amtInfo}">金额信息</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdLendInvestTrade002.ccy}">币种</label>
                                <div class="layui-input-inline input-inline">
                                    <select required type="text" id="ccy" name="finTradeProduct.ccy" class="layui-input form-input input-select"
                                            placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                            th:data-result='${CCY}' allowClear="true" formatoption="true"
                                            th:initValue="*{entity?.finTradeProduct?.ccy?:CCY_default}"></select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdLendInvestTrade002.prin}">本金金额</label>
                                <div class="layui-input-inline input-inline">
                                    <input required type="text" id="prin" name="finTradeProduct.prin"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.finTradeProduct?.prin}">
                                    <span class="input-right-show">元</span>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap">利率</label>
                                <div class="layui-input-inline input-inline">
                                    <input required type="text" id="intRate" name="finTradeProduct.intRate"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           data-fixtype="2" maxlength="25" data-textrange="4"
                                           th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.finTradeProduct?.intRate}">
                                    <span class="input-right-show">%</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 人员信息 -->
            <div class="page-component" th:data-path="@{/component/trade/TrdInvestPersonInfo002/init}"
                 th:data-params="|{entityName: 'trdInvestPersonInfo', pageFrom: 'submitForm', entity:'${entity_trdInvestPersonInfo}', innerTrade: false,entrustId:'${entity?.entrustId}'}|"></div>
            <!-- 划款信息 -->
            <div class="page-component" th:data-path="@{/component/trade/BussTrdTransferOrder/init}" id="bussTrdTransferOrder_div"
                 th:data-params="|{entityName: 'bussTrdTransferOrder', pageFrom: 'submitForm', entity:'${entity_bussRepFinProductInfoDto}', bizCode:'${tradeId}'}|">
            </div>
            <!-- Opics信息 -->
            <!-- <div class="page-component" th:data-path="@{/component/trade/BussTrdOpics/init}" id="BussTrdOpicsCommon_div"
                 th:data-params="|{pageFrom: 'submitForm', bizCode:'${tradeId}'}|">
            </div> -->
           <!-- <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="title-des" th:text="#{TrdLendInvestTrade002.remark}">备注</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="layui-input-inline input-inline" style="margin:0 10px;width:98%!important;">
                                <textarea name="remark" maxlength="200" th:text="${entity?.remark}"
                                      class="layui-textarea" placeholder="请输入内容"
                                      th:placeholder="#{SysCommon.placeholder}"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>-->
            <!-- 附件信息 -->
            <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                th:data-params="|{entityName: 'fileArray', businessId: '${tradeId !=null ? tradeId : entity?.entrustId}'}|"></div><!--
                 zhujun BSBS-435@2019-05-20 兼容指令接收交易录单附件不显示问题 -->
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="title-des" th:text="#{TrdLendInvestTrade002.remark}">备注</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="layui-input-inline input-inline" style="margin:0 10px;width:98%!important;">
                                <textarea name="remark" maxlength="200" th:text="${entity?.remark}"
                                          class="layui-textarea" placeholder="请输入内容"
                                          th:placeholder="#{SysCommon.placeholder}"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 风险试算 -->
			<div id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}" th:data-params="|{entity: '${riskTrialRetDto}',entityName:'riskTrialRetDto',workflowId:'${workflowId?: ''}',tradeId:'${tradeId}'}|"></div>
            <div class="row text-center" style="margin-top:10px; margin-bottom:20px;">
                <a th:id="|${pageId}_btn_risk|" class="layui-btn layui-btn-sm"
                   data-th-text="#{TrdLendInvestTrade002.risk}">风险试算</a>
                <a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save"
                   data-th-text="#{SysCommon.save}">保存</a>
                <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit"
                   data-th-text="#{SysCommon.submit}">提交</a>
                <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel"
                   data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var entrustId = /*[[${entrustId}]]*/'';
        var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'';
        var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
        var PS_T01 = /*[[${PS_T01}]]*/'';
        var BANK_LENDING_TYPE_01 = /*[[${BANK_LENDING_TYPE_01}]]*/'';
        var BANK_LENDING_TYPE_02 = /*[[${BANK_LENDING_TYPE_02}]]*/'';
        var BACK_LEND_DIRECTION_01 = /*[[${BACK_LEND_DIRECTION_01}]]*/'';
        var BACK_LEND_DIRECTION_02 = /*[[${BACK_LEND_DIRECTION_02}]]*/'';
        var FINPROD_TYPE_TG_F08 = /*[[${FINPROD_TYPE_TG_F08}]]*/'';
        var FINPROD_TYPE_TG_F09 = /*[[${FINPROD_TYPE_TG_F09}]]*/'';
        var FINPROD_TYPE_TG_F09 = /*[[${FINPROD_TYPE_TG_F09}]]*/'';
        var FINPROD_TYPE_TG_F25 = /*[[${FINPROD_TYPE_TG_F25}]]*/'';
        var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
        var FINPROD_TYPE_F08 = /*[[${FINPROD_TYPE_F08}]]*/'';
        var FINPROD_TYPE_F09 = /*[[${FINPROD_TYPE_F09}]]*/'';
        var GEN_PAY_ORDERS_AUTO= /*[[${GEN_PAY_ORDERS_AUTO}]]*/''; // 系统参数_是否显示划款指令
        var PINAN_ASSET_TYPE_F08 = /*[[${PINAN_ASSET_TYPE_F08}]]*/'';
        var parentPageId = /*[[${parentPageId}]]*/'';
    </script>
    <script th:src="@{/js/invest/trade/lend/TrdLendInvestTrade002.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/component/common/util.js}" type="text/javascript"></script>
</div>
</body>
</html>
