<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{TrdBondMarketTrade001}">债券上市流通</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="form-button-area"  export="false">
            <a id="TrdBondMarketTrade001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
            <a id="TrdBondMarketTrade001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="#{SysCommon.revoke}"></a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdBondMarketTrade001.finprodId}">发行代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="finprodId" name="finprodId" 
                                    class="layui-input form-input input-select" 
                                    placeholder="请输入内容"
                                    th:placeholder="#{SysCommon.placeholder}" 
                                    th:data-url="@{/invest/trade/bondmarkettrade/TrdBondMarketTrade001/getFinprodId(pageId=${pageId})}"
                                    allowClear="true"
                                    multiple="true">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdBondMarketTrade001.appearMarketId}">上市代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="appearMarketId" name="appearMarketId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                    th:data-url="@{/invest/trade/bondmarkettrade/TrdBondMarketTrade001/getAppearMarketId(pageId=${pageId})}"
                                allowClear="true"
                                multiple="true" >
                             </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdBondMarketTrade001.tradeDate}">交易日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="tradeDate" name="tradeDate"
                                   class="layui-input form-input input-dateRangeSelect" placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-value="${#dates.format(entity?.tradeDate,'yyyy-MM-dd')}">
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
        </script>
        <script data-th-src="@{/js/invest/trade/bondmarkettrade/TrdBondMarketTrade001.js}" type="text/javascript"></script>
    </div>
</body>

</html>
