<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
<title>合作资产费用支付查询</title>
</head>
<body>
    <div layout:fragment="content">
        <div class='layui-fluid'>
            <div class="layui-col-md12 form-button-area" style="margin: 10px;">
                <a id="ChannelFeePay001_btn_create" class="layui-btn layui-btn-sm btn-create">新建</a>
                <a id="ChannelFeePay001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="#{SysCommon.revoke}"></a>

            </div>
            <div class='joyin-form-wrap joyin-filter-form condition-area'>
                <form class="layui-form" id="searchForm">
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable">业务编号</label>
                            <div class="layui-input-inline input-inline">
                                <input class="layui-input form-input" id="bizCode" name="bizCode" type="text" maxlength="20"/>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable" data-th-text="|#{invest.channelId}#{ChannelAsset002.finprodNameBak}|">合作资产名称</label>
                            <div class="layui-input-inline input-inline">
                                <select id="channelId" name="channelId" multiple
                                        class="layui-input form-input input-select" placeholder="请输入内容"
                                        data-th-data-url="@{/invest/trade/channel/feepay/ChannelFeePay001/findChannelId}">
                                </select>
                            </div>
                        </div>
                        <div id="SelectDate" class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                            <label class="layui-form-label form-lable">支付日</label>
                            <div class="layui-input-inline input-inline">
                                <input name="payDate" id="payDate"
                                       class="layui-input form-input input-dateRangeSelect"
                                       placeholder="请选择、支持区间"
                                       data-th-placeholder="#{SysCommon.dateInterval}">
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/trade/channel/feepay/ChannelFeePay001.js}"></script>
    </div>
</body>
</html>
