<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{TrdCommandDispatcher001}">平安投资指令分发-查询</title>
<script type="text/javascript" data-th-src="@{/public/js/message}"></script>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class=" form-button-area" style="margin: 10px;">
				<a id="TrdCommandDispatcher001_btn_distribute"
					class="layui-btn layui-btn-sm"
					data-th-text="#{TrdCommandDispatcher001.distribute}">分发</a> 
			    <a id="TrdCommandDispatcher001_btn_autoDistribute"	
					class="layui-btn layui-btn-sm"
					data-th-text="#{TrdCommandDispatcher001.autoDistribute}">自动分发</a>
				<a id="TrdCommandDispatcher001_btn_autoDistributePower"
				   class="layui-btn layui-btn-sm"
				   data-th-text="分发权限配置">分发权限配置</a>
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="TrdCommandDispatcher001_searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{TrdCommandDispatcher001.invManagerId}">投资经理</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="TrdCommandDispatcher001_invManagerId" name="invManagerId"
									class="layui-input form-input input-select"
									allowClear="true" placeholder="请输入内容" 
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-url="@{/invest/trade/investtrade/commanddispatcher/TrdCommandDispatcher001/getManagers}">
								</select>	
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{TrdCommandDispatcher001.entrustId}">委托代码</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="TrdCommandDispatcher001_entrustId" name="entrustId" maxlength="50"
									class="layui-input form-input input-lenovoselect" 
									data-th-data-url="@{/invest/trade/investtrade/commanddispatcher/TrdCommandDispatcher001/getEntIds}"
									data-idfield="code" data-th-data-effectivefields="code"
									data-th-data-effectivefieldsalias='|{"code":"#{TrdCommandDispatcher001.entrustId}"}|'
									placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
									/>
							</div>
						</div>
						<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{TrdCommandDispatcher001.entrustStatus}">有效状态 </label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="TrdCommandDispatcher001_entrustStatus" name="entrustStatus"
									class="layui-input form-input input-select"
									data-th-data-result='${ENTRUST_STATUS}' allowClear="true"
									placeholder="请输入内容" multiple="true"
									data-th-initValue="${entrustStatus}">
								</select>	
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{TrdCommandDispatcher001.portfolioId}">组合代码</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="TrdCommandDispatcher001_portfolioId" name="portfolioId" maxlength="32"
									class="layui-input form-input input-lenovoselect" 
									data-th-data-url="@{/invest/trade/investtrade/commanddispatcher/TrdCommandDispatcher001/getPortfolioIds}"
									data-idfield="code"
									data-th-data-effectivefieldsalias='|{"code":"#{TrdCommandDispatcher001.portfolioId}",
									"shortName":"#{TrdCommandDispatcher001.portfolioName}"}|'
									allowClear="true" placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"/>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{TrdCommandDispatcher001.finprodType2}">资产类型</label>
							<div class="layui-input-inline input-inline">
								<select id="TrdCommandDispatcher001_finprodType2" name="finprodType2"
									class="layui-input form-input input-select"
									placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" allowClear="true" 
									data-th-data-result='${PINAN_ASSET_TYPE}' multiple="true">
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{TrdCommandDispatcher001.assetType1}">资产二级类型</label>
							<div class="layui-input-inline input-inline">
								<input id="TrdCommandDispatcher001_assetType1" name="assetType1" 
									class="layui-input form-input input-select"  allowClear="true" multiple="true"
									placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  
									data-th-data-result ='${ALL_RESULT}'>
							</div>
						</div>
							</div>
							<div class="layui-form-item">
								<div
									class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
									<label class="layui-form-label form-lable"
										data-th-text="#{TrdCommandDispatcher001.finprodId}">资产代码 </label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="TrdCommandDispatcher001_finprodId" name="finprodId" maxlength="32"
											class="layui-input form-input input-lenovoselect"
											data-th-data-url="@{/invest/trade/investtrade/commanddispatcher/TrdCommandDispatcher001/getFinprodIds}"
											data-idfield="hidCode"
											data-th-data-effectivefieldsalias='|{"code":"#{TrdCommandDispatcher001.finprodId}",
											"shortName":"#{TrdCommandDispatcher001.finprodAbbr}"}|' 
											placeholder="请输入内容"/>
									</div>
								</div>
								<div
									class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
									<label class="layui-form-label form-lable"
										data-th-text="#{TrdCommandDispatcher001.tradeMarket}">交易场所</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="TrdCommandDispatcher001_tradeMarket" name="tradeMarket"
											class="layui-input form-input input-select"
											data-th-data-result='${TRADE_PLACE}' allowClear="true"
											placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}">
										</select>	
									</div>
								</div>
								<div
									class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
									<label class="layui-form-label form-lable"
										data-th-text="#{TrdCommandDispatcher001.ps}">交易方向</label>
									<div class="layui-input-inline input-inline">
										<select id='TrdCommandDispatcher001_ps' name='ps'
											class="layui-input form-input input-select"
											data-th-data-result='${psList}' allowClear="true"
											placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}">
										</select>
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
									<label class="layui-form-label form-lable"
										data-th-text="#{TrdCommandDispatcher001.ccy}">币种</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="TrdCommandDispatcher001_ccy" name="ccy"  
											class="layui-input form-input input-select" 
											data-th-data-result='${CCY}'
											allowClear="true" placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}">
										</select>
									</div>
								</div>
								<div
									class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
									<label class="layui-form-label form-lable"
										data-th-text="#{TrdCommandDispatcher001.vdate}">委托开始日期</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="TrdCommandDispatcher001_vdate" name="vdate"
											class="layui-input form-input input-dateRangeSelect"
											placeholder="请选择、支持区间"
											data-th-placeholder="#{SysCommon.dateInterval}"/>
									</div>
								</div>
								<div
									class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
									<label class="layui-form-label form-lable"
										data-th-text="#{TrdCommandDispatcher001.mdate}">委托终止日 </label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="TrdCommandDispatcher001_mdate" name="mdate"
											class="layui-input form-input input-dateRangeSelect"
											placeholder="请选择、支持区间"
											data-th-placeholder="#{SysCommon.dateInterval}"/>
									</div>
								</div>
							</div>
						</form>
			</div>
			<div>
				 <table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
            var PINAN_ASSET_TYPE_F01 = /*[[${PINAN_ASSET_TYPE_F01}]]*/'';
            var PINAN_ASSET_TYPE_F02 = /*[[${PINAN_ASSET_TYPE_F02}]]*/'';
            var PINAN_ASSET_TYPE_F03 = /*[[${PINAN_ASSET_TYPE_F03}]]*/'';
            var PINAN_ASSET_TYPE_F04 = /*[[${PINAN_ASSET_TYPE_F04}]]*/'';
            var PINAN_ASSET_TYPE_F05 = /*[[${PINAN_ASSET_TYPE_F05}]]*/'';
            var PINAN_ASSET_TYPE_F06 = /*[[${PINAN_ASSET_TYPE_F06}]]*/'';
            var PINAN_ASSET_TYPE_F07 = /*[[${PINAN_ASSET_TYPE_F07}]]*/'';
            var PINAN_ASSET_TYPE_F08 = /*[[${PINAN_ASSET_TYPE_F08}]]*/'';

            var PINAN_ASSET_TYPE_F10 = /*[[${PINAN_ASSET_TYPE_F10}]]*/'';
            var PINAN_ASSET_TYPE_F11 = /*[[${PINAN_ASSET_TYPE_F11}]]*/'';
            var PINAN_ASSET_TYPE_F13 = /*[[${PINAN_ASSET_TYPE_F13}]]*/'';
            var PINAN_ASSET_TYPE_F14 = /*[[${PINAN_ASSET_TYPE_F14}]]*/'';
            var PINAN_ASSET_TYPE_F15 = /*[[${PINAN_ASSET_TYPE_F15}]]*/'';
            var PINAN_ASSET_TYPE_F12 = /*[[${PINAN_ASSET_TYPE_F12}]]*/'';
            var PINAN_ASSET_TYPE_F16 = /*[[${PINAN_ASSET_TYPE_F16}]]*/'';

			var PINAN_ASSET_TYPE_F17 = /*[[${PINAN_ASSET_TYPE_F17}]]*/'';
			var PINAN_ASSET_TYPE_F36 = /*[[${PINAN_ASSET_TYPE_F36}]]*/'';
			var PINAN_ASSET_TYPE_F19 = /*[[${PINAN_ASSET_TYPE_F19}]]*/'';
			var PINAN_ASSET_TYPE_F20 = /*[[${PINAN_ASSET_TYPE_F20}]]*/'';
			var PS_T04 = /*[[${PS_T04}]]*/'';
	        //add by gaopeng 20191125 start
	        var PS_T49 = /*[[${PS_T49}]]*/'';
	        //add by gaopeng 20191125 end
			//add by gejiaao  end
			var IRS_TYPE  = /*[[${IRS_TYPE}]]*/'IRS_TYPE';
            var VDATE = /*[[${VDATE}]]*/'';
            var MDATE = /*[[${MDATE}]]*/'';
            var SYS_DATE = /*[[${SYS_DATE}]]*/'';
            var ENTRUST_BUSS_TYPE_01 = /*[[${ENTRUST_BUSS_TYPE_01}]]*/'';
            var ENTRUST_BUSS_TYPE_02 = /*[[${ENTRUST_BUSS_TYPE_02}]]*/'';
            var ENTRUST_BUSS_TYPE_03 = /*[[${ENTRUST_BUSS_TYPE_03}]]*/'';
            var ENTRUST_BUSS_TYPE_04 = /*[[${ENTRUST_BUSS_TYPE_04}]]*/'';
            var ENTRUST_BUSS_TYPE_05 = /*[[${ENTRUST_BUSS_TYPE_05}]]*/'';
            var ENTRUST_BUSS_TYPE_06 = /*[[${ENTRUST_BUSS_TYPE_06}]]*/'';
            
            var TRADE_PLACE_03 = /*[[${TRADE_PLACE_03}]]*/'';
            var TRADE_PLACE_04 = /*[[${TRADE_PLACE_04}]]*/'';


			var ENTRUST_BUSS_TYPE_17 = /*[[${ENTRUST_BUSS_TYPE_17}]]*/'';
			var ENTRUST_BUSS_TYPE_18 = /*[[${ENTRUST_BUSS_TYPE_18}]]*/'';
			var ENTRUST_BUSS_TYPE_19 = /*[[${ENTRUST_BUSS_TYPE_19}]]*/'';
			var ENTRUST_BUSS_TYPE_20 = /*[[${ENTRUST_BUSS_TYPE_20}]]*/'';
			var ENTRUST_BUSS_TYPE_21 = /*[[${ENTRUST_BUSS_TYPE_21}]]*/'';
			var ENTRUST_BUSS_TYPE_22 = /*[[${ENTRUST_BUSS_TYPE_22}]]*/'';
			var ENTRUST_CLASS_01 = /*[[${ENTRUST_CLASS_01}]]*/'';
			var ENTRUST_CLASS_02 = /*[[${ENTRUST_CLASS_02}]]*/'';
        </script>
		<script data-th-src="@{/js/invest/trade/investtrade/commanddispatcher/TrdCommandDispatcher001.js}"></script>
	</div>
</body>
</html>
