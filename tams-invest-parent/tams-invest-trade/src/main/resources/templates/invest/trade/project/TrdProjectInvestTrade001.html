<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorator="~{layout/default}">
<head>
    <title data-th-text="#{[#pageId]}">[#title]</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a id="TrdProjectInvestTrade001_btn_add" class="layui-btn layui-btn-sm btn-create">新建</a>
        <a id="TrdProjectInvestTrade003_btn_add" class="layui-btn layui-btn-sm btn-create">多组合交易</a>
        <a id="TrdProjectInvestTrade001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="#{SysCommon.revoke}"></a>
    </div>

    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">委托代码</label>
                    <div class="layui-input-inline input-inline">
                        <!-- <select id="entrustId" name="entrustId" formatoption='false'
                                class="layui-input form-input input-select"
                                data-th-data-url="@{/invest/trade/project/TrdProjectInvestTrade001/findEntrustId}"
                                allowClear="true" data-th-placeholder="#{SysCommon.placeholder}">
                        </select> -->
                        <input type="text" id="entrustId" name="entrustId"
                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/trade/project/TrdProjectInvestTrade001/getEntrustIdByType}" data-idfield="code"
                                data-keyfield="name"
                                data-th-data-effectivefieldsalias='|{"code":"#{TrdLendInvestTrade001.entrustId}","shortName":"#{TrdLendInvestTrade001.entrustId}"}|'
                                data-th-value="${entity?.entrustId}" maxlength="50" >
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">组合代码</label>
                    <div class="layui-input-inline input-inline">
                        <select id="portfolioId" name="portfolioId"
                                class="layui-input form-input input-select" multiple="true"
                                data-th-data-url="@{/invest/trade/trddepositinvesttrade/TrdDepositInvestTrade001/getPortfolioId}"
                                allowClear="true" data-th-placeholder="#{SysCommon.placeholder}" >
                        </select>
                    </div>
                </div>
                <div style="display: none" class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">资产类型</label>
                    <div class="layui-input-inline input-inline">
                        <select id="projectType" name="projectType" multiple
                                class="layui-input form-input input-select"
                                data-th-data-result='${ASSET_TYPE_PROJECT}'
                                allowClear="true" data-th-placeholder="#{SysCommon.placeholder}" >
                        </select>
                    </div>
                </div>
                <!-- 项目类资产五级分类改造 modify by renping 2019-08-01 start -->
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable" data-th-text="#{TrdProjectInvestTrade001.type9}">资产二级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select id="type9" name="type9" multiple
                                class="layui-input form-input input-select"
                                data-th-data-result='${CUSTOM_ASSET_TYPE_TWO}'
                                allowClear="true" data-th-placeholder="#{SysCommon.placeholder}" >
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable" data-th-text="#{TrdProjectInvestTrade001.type10}">资产三级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select id="type10" name="type10" multiple
                                class="layui-input form-input input-select"
                                data-th-data-result='${CUSTOM_ASSET_TYPE_THREE}'
                                allowClear="true" data-th-placeholder="#{SysCommon.placeholder}" >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4" style="display: none" id = "type11Div">
                    <label class="layui-form-label form-lable" data-th-text="#{TrdProjectInvestTrade001.type11}">资产四级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select id="type11" name="type11" multiple
                                class="layui-input form-input input-select"
                                data-th-data-result='${CUSTOM_ASSET_TYPE_FOUR}'
                                allowClear="true" data-th-placeholder="#{SysCommon.placeholder}" >
                        </select>
                    </div>
                </div>
                <!-- 项目类资产五级分类改造 modify by renping 2019-08-01 end -->
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">资产代码</label>
                    <div class="layui-input-inline input-inline">
                        <select id="finprodMarketId" name="finprodMarketId"
                                class="layui-input form-input input-select"
                                data-th-data-url="@{/invest/trade/project/TrdProjectInvestTrade001/getFinprodMarketId}"
                                allowClear="true" data-th-placeholder="#{SysCommon.placeholder}" >
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">交易方向</label>
                    <div class="layui-input-inline input-inline">
                        <select id="ps" name="ps" formatoption='false' multiple class="layui-input form-input input-select"
                                data-th-data-result='${PS}' allowClear="true" data-th-placeholder="#{SysCommon.placeholder}" >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">有效状态</label>
                    <div class="layui-input-inline input-inline">
                        <select id="statusValid" name="statusValid" class="layui-input form-input input-select"
                                data-th-data-result='${TRADE_FLOW_STATUS}' data-th-initValue="01"
                                allowClear="true" data-th-placeholder="#{SysCommon.placeholder}" >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                    <label class="layui-form-label form-lable">交易日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="tradeDate" name="tradeDate"
                               class="layui-input form-input input-dateRangeSelect"
                               data-th-placeholder="#{SysCommon.placeholder}"/>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" id="chlFinprodId_div">
                    <label class="layui-form-label form-label-wrap"
                           th:text="#{TrdProjectInvestTrade001.chlFinprodId}">合作资产</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="chlFinprodId" name="chlFinprodId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                th:placeholder="#{SysCommon.placeholder}"  th:data-url="@{/invest/asset/channel/ChannelAsset001/getSecAcctId}"
                                allowClear="true"
                                multiple="true"></select>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
    </script>
    <script data-th-inline="javascript" type="text/javascript">
    	var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
    	var IS_QUERY_ASSETS_LOSS = /*[[${IS_QUERY_ASSETS_LOSS}]]*/'';
    	</script>
    <script data-th-src="@{/js/invest/trade/project/TrdProjectInvestTrade001.js}" type="text/javascript"></script>
</div>
</body>

</html>
