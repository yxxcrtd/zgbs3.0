<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
    layout:decorate="~{layout/default}">
<head>
<title th:text="#{TrdSpotexInvestTrade002}">外汇即期交易新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="pro-module-container ">
            <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
                <div class="pro-module-wrapper pro-module-base " th:title="#{TrdSpotexInvestTrade.baseInfo}">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des" th:text="#{TrdSpotexInvestTrade.baseInfo}">基本信息</span>
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <input type="hidden" id="finprodType2" name="finprodType2" th:value="${entity?.finprodType2}">
                            <input type="hidden" id="tradeId" name="tradeId" th:value="${entity?.tradeId}">
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdSpotexInvestTrade.entrustId}">委托代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <input disabled type="text" id="entrustId" name="entrustId"
                                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:data-url="@{/business/common/CommonSelect/getEntrustId}"
                                                data-idfield="code" data-keyfield="name"
                                                th:data-effectivefieldsalias='|{"code":"#{TrdSpotexInvestTrade.entrustId}","shortName":"#{TrdSpotexInvestTrade.entrustId}"}|'
                                                th:value="${entity?.entrustId}">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdSpotexInvestTrade.portfolioId}">组合代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <select required type="text" id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}"
                                                th:initvalue="${entity?.portfolioId}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdSpotexInvestTrade.excDealType}">交易类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="excDealType" name="excDealType" childrenIds="curPair,dealMode"
                                                class="layui-input form-input input-select" placeholder="请输入内容" required
                                                th:placeholder="#{SysCommon.placeholder}" th:data-result='${EXC_DEAL_TYPE}'
                                                allowClear="true" formatoption="true" th:initValue="${entity?.excDealType?:EXC_DEAL_TYPE_default}"></select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{TrdSpotexInvestTrade.curPair}">货币对</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="curPair" name="curPair" parentIds="excDealType" childrenIds="dealCur,ccy"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${CYY_PAIR}' allowClear="true" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" required="required"
                                                formatoption="true" data-th-initvalue="*{entity?.curPair}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdSpotexInvestTrade.ps}">交易方向</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="ps" name="ps" required="required"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:data-result='${PS}'
                                                allowClear="true" formatoption="true" th:initValue="${entity?.ps}"></select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               th:text="#{TrdSpotexInvestTrade.calendarId}">交易日历</label>
                                        <div class="layui-input-inline input-inline">
                                             <select  type="text" id="calendarId" name="calendarId" required
                                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                                    th:placeholder="#{SysCommon.placeholder}"
                                                    th:data-url="@{/business/common/CommonSelect/selectCalendarId}" allowClear="true"
                                                    formatoption="true"
                                                    th:initValue="${entity?.calendarId}"></select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div id="tradeDate_div" class="form-inline-wrap">
                                        <label id="trdDate" class="layui-form-label form-label-wrap"
                                            th:text="#{TrdSpotexInvestTrade.tradeDate}">交易日期</label>
                                        <div class="layui-input-inline input-inline">
                                            <input required type="text" id="tradeDate" name="tradeDate"
                                                class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${entity?.tradeDate==null ? platDate : #dates.format(entity?.tradeDate,'yyyy-MM-dd')}">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{TrdSpotexInvestTrade.settleSpeed}">清算速度</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="accountSpeed" name="accountSpeed" required="required"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-data-result='${ACCOUNT_SPEED}'
                                                data-th-initvalue="${entity?.accountSpeed?:ACCOUNT_SPEED_default}"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdSpotexInvestTrade.settleDate}">交割日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input required  type="text" id="settleDate" name="settleDate"
                                                class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${entity?.settleDate==null ? platDate : #dates.format(entity?.settleDate,'yyyy-MM-dd')}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{TrdSpotexInvestTrade.ourRole}">我方角色</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="ourRole" name="ourRole" required="required"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-data-result='${OUR_ROLE}'
                                                data-th-initvalue="${entity?.ourRole?:OUR_ROLE_default}"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{TrdSpotexInvestTrade.dealMode}">交易模式</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="dealMode" name="dealMode" parentIds="excDealType" required
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-data-result='${DEAL_MODE}'
                                                data-th-initvalue="${entity?.dealMode?:DEAL_MODE_default}"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{TrdSpotexInvestTrade.deliveryType}">清算模式</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="deliveryType" name="deliveryType" required="required"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-data-result='${SETT_MODE}'
                                                data-th-initvalue="${entity?.deliveryType?:SETT_MODE_default}"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdBondLendInvestTrade002.holdPurpose}">持有目的</label>
	                                    <div class="layui-input-inline input-inline">
	                                        <select required  type="text" id="holdPurpose" name="holdPurpose"
	                                                class="layui-input form-input input-select" placeholder="请输入内容"
	                                                th:placeholder="#{SysCommon.placeholder}" th:data-result="${SVR_HOLD_PURPOSE}"
	                                                th:initValue="${entity?.holdPurpose}"></select>
                                    	</div>
                                	</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" th:text="#{TrdSpotexInvestTrade.amtInfo}">金额信息</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{TrdSpotexInvestTrade.unitCprice}">即期汇率</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="unitCprice" name="unitCprice" placeholder="请输入内容"
                                            data-pattern="" data-fixtype="2" data-textrange="8" required="required"
                                            class="layui-input form-input text-number"
                                            data-th-value="${entity?.unitCprice}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                        th:text="#{TrdSpotexInvestTrade.dealCur}">交易货币</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="dealCur" name="dealCur" parentIds="curPair" required
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}" th:data-result='${CCY}'
                                            allowClear="true" formatoption="true" th:initValue="${entity?.dealCur}"></select>
                                    </div>
                                </div>
                                <div id="tradeAmt_div" class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                        th:text="#{TrdSpotexInvestTrade.prinAmt}">交易货币金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="prinAmt" name="prinAmt" maxlength="16"
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.prinAmt}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                        data-th-text="#{TrdSpotexInvestTrade.proAvailableCash}">交易货币可用持仓</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="proAvailableCash" name="proAvailableCash"
                                            placeholder="请输入内容" data-pattern="" data-fixtype="2" disabled="disabled"
                                            class="layui-input form-input text-number" >
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                        th:text="#{TrdSpotexInvestTrade.ccy}">对应货币</label>
                                    <div class="layui-input-inline input-inline">
                                        <select disabled type="text" id="ccy" name="ccy" parentIds="curPair" required="required"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}" th:data-result='${CCY}'
                                            allowClear="true" formatoption="true" th:initValue="${entity?.ccy}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                        th:text="#{TrdSpotexInvestTrade.tradeAmt}">对应货币金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required disabled type="text" id="tradeAmt" name="tradeAmt" maxlength="16"
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.tradeAmt}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                        data-th-text="#{TrdSpotexInvestTrade.corProAvailableCash}">对应货币可用持仓</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="corProAvailableCash" name="corProAvailableCash"
                                            placeholder="请输入内容" data-pattern="" data-fixtype="2" disabled="disabled"
                                            class="layui-input form-input text-number">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                        th:text="#{TrdSpotexInvestTrade.usdAmt}">折美元金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="usdAmt" name="usdAmt" maxlength="16"
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.usdAmt}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                        th:text="#{TrdSpotexInvestTrade.feeAmt}">交易费用</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="feeAmt" name="feeAmt" maxlength="16"
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.feeAmt}">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 人员信息 -->
                <div class="page-component" th:data-path="@{/component/trade/TrdInvestPersonInfo002/init}"
                    th:data-params="|{entityName: 'trdInvestPersonInfo', counterType:'${COUNTER_TYPE_01}', pageFrom: 'submitForm', entity:'${entity_trdInvestPersonInfo}'}|"></div>
                <!-- 划款指令 -->
				<div id="BussTrdTransferOrder" class="page-component" th:data-path="@{/component/trade/BussTrdTransferOrder/init}" th:data-params="|{entityList:'${entityList}',entityName:'bussTrdTransferOrder',bizCode:'${entity?.tradeId}',isMulti:'1'}|"></div>
                <!-- 附件信息 -->
                <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                    th:data-params="|{entityName: 'FileCommon', businessId: '${entity?.tradeId}'}|"></div>
                <!--备注-->
				<div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" th:text="#{TrdSpotexInvestTrade.remark}">备注</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div>
                                    <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                        <textarea name="remark" maxlength="200" th:text="${entity?.remark}"
                                                  class="layui-textarea" placeholder="请输入内容"
                                                  th:placeholder="#{SysCommon.placeholder}"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 风险试算 -->
				<div th:if="${isEleShow['TrdSpotexInvestTrade002_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}" th:data-params="|{entity: '${riskTrialRetDto}',workflowId:'${workflowId?: ''}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>
                <div class="row text-center" style="margin: 30px 0;">
                    <a th:if="${isEleShow['TrdSpotexInvestTrade002_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'" th:id="|${pageId}_btn_risk|" class="layui-btn layui-btn-sm"
                        data-th-text="#{TrdSpotexInvestTrade.risk}">风险试算</a>
                    <a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save"
                        data-th-text="#{SysCommon.save}">保存</a>
                    <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit"
                        data-th-text="#{SysCommon.submit}">提交</a>
                    <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel"
                        data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </form>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
     		var ps_mr = /*[[${ps_mr}]]*/'';
			var ps_mc = /*[[${ps_mc}]]*/'';
			var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
			var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
			var FINPROD_TYPE_F11 = /*[[${FINPROD_TYPE_F11}]]*/'';
			var USE_STATUS_01 = /*[[${USE_STATUS_01}]]*/'';
			
			var EXC_DEAL_TYPE_FGN_CY = /*[[${EXC_DEAL_TYPE_FGN_CY}]]*/'';
			var EXC_DEAL_TYPE_RMB_FX = /*[[${EXC_DEAL_TYPE_RMB_FX}]]*/'';
			var DEAL_MODE_01 = /*[[${DEAL_MODE_01}]]*/'';
			var DEAL_MODE_OTC = /*[[${DEAL_MODE_OTC}]]*/'';
			var DEAL_MODE_MATCH = /*[[${DEAL_MODE_MATCH}]]*/'';
			var SETT_MODE_BIL_SETT = /*[[${SETT_MODE_BIL_SETT}]]*/'';
			var SETT_MODE_CENT_SETT = /*[[${SETT_MODE_CENT_SETT}]]*/'';
			var JPY_CNY = /*[[${JPY_CNY}]]*/'';
			var CCY_CNY = /*[[${CCY_CNY}]]*/'';
			var CCY_USD = /*[[${CCY_USD}]]*/'';
			var OUR_ROLE_TAKER = /*[[${OUR_ROLE_TAKER}]]*/'';
			var OUR_ROLE_MAKER = /*[[${OUR_ROLE_MAKER}]]*/'';
			var ACCOUNT_SPEED_T0 = /*[[${ACCOUNT_SPEED_T0}]]*/'';
			var ACCOUNT_SPEED_T1 = /*[[${ACCOUNT_SPEED_T1}]]*/'';
			var ACCOUNT_SPEED_T2 = /*[[${ACCOUNT_SPEED_T2}]]*/'';
			var bussTrdTransferOrderDtos = /*[[${entity?.bussTrdTransferOrder}]]*/'';
			var GEN_PAY_ORDERS_AUTO= /*[[${GEN_PAY_ORDERS_AUTO}]]*/; // 系统参数_是否显示划款指令
			var PINAN_ASSET_TYPE_F13 = /*[[${PINAN_ASSET_TYPE_F13}]]*/'';
 		</script>
        <script data-th-src="@{/js/component/trade/EtrForeignExchange.js}" type="text/javascript"></script>
        <script th:src="@{/js/invest/trade/spotex/TrdSpotexInvestTrade002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
