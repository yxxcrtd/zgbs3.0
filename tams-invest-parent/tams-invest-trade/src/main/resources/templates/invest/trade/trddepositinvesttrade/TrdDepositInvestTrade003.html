<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
	  layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{TrdDepositInvestTrade003}">存款类资产多组合交易新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
				<form id="basicInfoForm" class="layui-form joyin-form-wrap pro-module-form" >
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<input type="hidden" id="entrustId" name="entrustId" th:value="${entity?.entrustId}" />
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" >资产类型</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="finprodType" name="finprodType" class="layui-input form-input input-select hidden"
													placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" th:initValue="${entity?.finprodType}"
													data-th-data-result='${DEPO_ASSET_TYPE}' allowClear="true" formatoption="true" 
													></select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdDepositInvestTrade001.finprodId}">资产代码</label>
										<div class="layui-input-inline input-inline">
											<!-- <input type="text" id="finprodId" name="finprodId"
                                                class="layui-input form-input input-lenovoselect available" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-url="@{/invest/trade/trddepositinvesttrade/TrdDepositInvestTrade001/getFinprodMarketId}"
                                                data-idfield="code" data-keyfield="name" th:value="${entity?.finprodId}"
                                                data-th-data-effectivefieldsalias='|{"code":"#{TrdDepositInvestTrade001.finprodId}","shortName":"#{TrdDepositInvestTrade001.finprodName}"}|'> -->
											<select type="text" id="finprodMarketId" name="finprodMarketId" class="layui-input form-input input-select" required
													placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" th:initValue="${entity?.finprodMarketId}"  childrenIds='chlId'
													data-th-data-url="@{/invest/trade/trddepositinvesttrade/TrdDepositInvestTrade002/getFinprodMarketId}" allowClear="true" formatoption="true"></select>
											<!-- <input type="hidden" id="finprodId" name="finprodId" th:value="${entity?.finprodId}"> -->
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdDepositInvestTrade001.finprodName}">资产名称</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="finprodName" name="finprodName" th:value="${entity?.finprodName}" class="layui-input form-input hidden" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
											<a id="TrdDepositInvestTrade002_btn_001" class="layui-btn layui-btn-sm form-input-text" data-ignore=true>查看</a>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdDepositInvestTrade002.tradeDate}">交易日期</label>
										<div class="layui-input-inline input-inline">
											<input id="tradeDate" name="tradeDate"
												   class="layui-input form-input input-dateSelect hidden"
												   data-th-value='${#dates.format(entity?.tradeDate,"yyyy-MM-dd")}'>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdDepositInvestTrade002.vDate}">起息日</label>
										<div class="layui-input-inline input-inline">
											<input id="vdate" name="vdate"
												   class="layui-input form-input input-dateSelect hidden"
												   data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdDepositInvestTrade002.mDate}">到期日</label>
										<div class="layui-input-inline input-inline">
											<input id="mdate" name="mdate"
												   class="layui-input form-input input-dateSelect hidden"
												   data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'>
										</div>
									</div>
                    				
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdDepositInvestTrade002.termDays}">期限(天)</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="termDays" name="termDays" class="layui-input form-input hidden" th:value="${entity?.termDays}" placeholder="请输入内容">
											<span class="input-right-show">天</span>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdDepositInvestTrade001.ps}">交易方向</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="ps"  name="ps" required="required"
												   class="layui-input form-input input-checkbox available"
												   data-th-data-result="${PS}" data-th-initvalue="${entity?.ps}"/>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdDepositInvestTrade001.basis}">计息基础</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="basis" name="basis" th:initvalue="${entity?.basis}"
													class="layui-input form-input input-select hidden" placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${BASIS}'
													allowClear="true" formatoption="true">
											</select>
										</div>
									</div>									
								</div>
								<div class="layui-form-item">									
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdDepositInvestTrade001.assetProvider}">资产推荐方</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="assetProvider" name="assetProvider" parentIds="finprodMarketId"
													class="layui-input form-input input-select" placeholder="请输入内容" th:initValue="${entity?.assetProvider}"
													data-th-data-url ="@{/invest/trade/trddepositinvesttrade/TrdDepositInvestTrade003/getAssetProvider}"
													data-th-placeholder="#{SysCommon.placeholder}"
													allowClear="true" ></select>
											<!-- <input type="text" id="assetProvider" name="assetProvider" class="layui-input form-input hidden" th:value="${entity?.assetProvider}" placeholder="请输入内容"> -->
										</div>
									</div>
								<!-- 通道交易 新增 强成西 2019/03/26 start -->
									<div class="form-inline-wrap">
									<label class="layui-form-label form-lable" data-th-text="#{invest.channelId}">合作资产</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="chlId" name="chlId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true" parentIds='finprodMarketId'
                                                data-th-initvalue="${entity?.chlId}">
                                        </select>
										</div>
									</div>
								</div>																
							</div>
						</div>
					</div>
					<div class="pro-module-wrap" th:id="value_div">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">金融信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdDepositInvestTrade002.ccy}">币种</label>
										<div class="layui-input-inline input-inline">
											<select id="ccy" name="ccy" searchable="false"
													data-th-data-result="${CCY}"
													th:initvalue="*{entity?.ccy?:CCY_default}" class="layui-input form-input input-select hidden" placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}" required>
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdDepositInvestTrade002.prinAmt}">本金金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="prinAmt" name="prinAmt" maxLength="30"
												   required th:value="${entity?.prinAmt}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-utext="#{TrdDepositInvestTrade002.loadRate}">计提利率%</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="loadRate" name="loadRate" th:value="${entity?.loadRate}"
												   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
												   required data-textrange="0" data-fixtype="2" class="layui-input form-input text-number rateCal hidden"/>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-utext="#{TrdDepositInvestTrade002.intAmt}">应计利息总额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="intAmt" th:name="intAmt" th:value="${entity?.intAmt}" maxlength="16"
												   data-textrange="2" data-fixtype="2" class="layui-input form-input text-number"
												   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
									<!--通道 隐藏 by gaoshuqi 20210721 start -->
							<!--		<div class="form-inline-wrap" id="channelFee_div" style="display: none">
										<label class="layui-form-label form-label-wrap" data-th-text="|#{invest.channelId}#{TrdPlanInterestDuration002.channelFee}|" >通道费</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="channelFee" name="channelFee"
												   class="layui-input form-input text-number"
												   th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.channelFee}">
										</div>
									</div>-->
									<!--通道 隐藏 by gaoshuqi 20210721 end -->
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap">交易金额</label>
										<div class="layui-input-inline input-inline">
											<input disabled type="text" id="tradeAmtAndFee" name="tradeAmtAndFee" th:value="${entity?.tradeAmtAndFee}"
												   class="layui-input form-input text-number">
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
					<!-- 组合分配 -->										
					<div class="pro-module-wrap" th:id="value_div">											
						<div class="pro-module">
					        <h3 class="pro-module-title"><span class="title-des">组合分配</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
					        <div class="pro-module-item">
					            <div class="layui-form-item">
		                            <div class="form-inline-wrap">
		                                <label class="layui-form-label form-label-wrap"
		                                       data-th-utext="#{BussRepoSecPtl.distribution}">分配方式</label>
		                                <div class="layui-input-inline input-inline">
		                                    <select disabled type="text" th:id="TrdDepositInvestTrade003_distribution"
		                                            th:name="TrdBondInvestTrade003_distribution"
		                                            class="layui-input form-input input-select"
		                                            placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
		                                             formatoption="true"
		                                            th:data-result='${DISTRIBUTION}'
		                                            >
		                                    </select>
		                                </div>
		                            </div>
		                            <div class="form-inline-wrap">
		                                <a class="layui-btn layui-btn-sm btn-create layui-btn-disabled" th:id="TrdDepositInvestTrade003_btn_autoAllocation">
		                                    <i class="iconfont icon-found"></i><span
		                                        data-th-utext="#{BussRepoSecPtl.autoAllocation}">自动分配</span></a>
		                            </div>
		                        </div>
					            <table class="layui-table" id="dataTable" name="bussTrdTransfenpeiDto"></table>
					        </div>
					    </div>
					</div>
					<!-- 人员信息 -->
					<div class="page-component" th:data-path="@{/component/trade/TrdInvestPersonInfo002/init}" th:data-params="|{entity: '${trdInvestPersonInfo002Dto}',entityName:'trdInvestPersonInfo002Dto', psId : 'ps'}|"></div>
					<!-- 划款指令 -->
					<div class="page-component" th:data-path="@{/component/trade/BussTrdTransferOrder/init}" id="bussTrdTransferOrder_div"
                         th:data-params="|{entityName: 'bussTrdTransferOrder', pageFrom: 'submitForm', entity:'${entity_bussRepFinProductInfoDto}', bizCode:'${tradeId}'}|">
                    </div>
					<!--<div class="pro-module-wrap"> -->
						<!--<div class="pro-module" id="OpicsTable"> -->
							<!--<h3 class="pro-module-title"><span class="title-des">OPICS</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3> -->
							<!--<div class="pro-module-item" style="padding-top:10px;"> -->
								<!--<a id="TrdDepositInvestTrade002_generate" class="layui-btn layui-btn-sm">生成指令</a> -->
								<!--<table class="layui-table" id="opicsTable" name="interfSendOpicsList"></table> -->
							<!--</div> -->
						<!--</div> -->
					<!--</div> -->
					<!-- 附件信息 -->
					<div name="fileArray" class="page-component" th:data-path="@{/component/core/FileCommon/init}"
						 th:data-params="|{entityName: 'fileArray', businessId: '${tradeId ?: ''}'}|"></div>
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">备注</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="layui-input-inline input-inline" style="margin:0 10px;width:98%!important;">
										        <textarea id="remark" name="remark" th:placeholder="#{SysCommon.placeholder}" placeholder="请输入内容" th:text="${entity?.remark}"
														  class="layui-textarea"></textarea>
									</div>
								</div>
							</div>
						</div>
					</div>
                    <!-- 风险试算 -->
                    <div th:if="${isEleShow['TrdDepositInvestTrade003_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}" th:data-params="|{entity: '${riskTrialRetDto}',entityName:'riskTrialRetDto',workflowId:'${workflowId?: ''}',tradeId:'${tradeId}'}|"></div>
				</form>
                <div class="layui-form-item">
                    <div align="center" style="height:50px;padding-top: 10px;">
                    	<a th:if="${isEleShow['TrdDepositInvestTrade003_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'" id="TrdDepositInvestTrade002_btn_riskMath" class="layui-btn layui-btn-sm" >风险试算</a>
                        <a id="TrdDepositInvestTrade003_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                        <a id="TrdDepositInvestTrade003_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="TrdDepositInvestTrade003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
         </div>
    </div>
    </div>
    <div layout:fragment="script">
    	<script data-th-inline="javascript" type="text/javascript">
    			var buy = /*[[${buy}]]*/'';
    			var YES = /*[[${YES}]]*/'';
    			var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
    			var finprodId = /*[[${finprodId}]]*/'';
    			var interfSendOpicsList = /*[[${interfSendOpicsList}]]*/'';
    			var YES_OR_NO = /*[[${YES_OR_NO}]]*/'';
                <!-- 通道交易 新增 强成西 2019/03/26 start -->
                var PS_T01 = /*[[${PS_T01}]]*/'';
                <!-- 通道交易 新增 强成西 2019/03/26 end -->
                var CCY = /*[[${CCY}]]*/'';
    			var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
    			var FINPROD_TYPE_F07 = /*[[${FINPROD_TYPE_F07}]]*/'';
    			var PS_T02 = /*[[${PS_T02}]]*/'';
    			var collectType_01 = /*[[${collectType_01}]]*/'';
    			var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
    			var BussTrdTransfenpeiDto = /*[[${BussTrdTransfenpeiDto}]]*/'';
    			var GEN_PAY_ORDERS_AUTO= /*[[${GEN_PAY_ORDERS_AUTO}]]*/; // 系统参数_是否显示划款指令
    			var IS_CAL_LOADRATE = /*[[${IS_CAL_LOADRATE}]]*/'';
		</script>
		<script data-th-src="@{/js/component/common/TradeCommon.js}" type="text/javascript"></script>
		<script data-th-src="@{/js/invest/asset/channel/ChannelAssetCommon.js}" type="text/javascript"></script> 	                          
    	<script data-th-src="@{/js/invest/trade/trddepositinvesttrade/TrdDepositInvestTrade003.js}">
    	</script>
    </div>
</body>
</html>
