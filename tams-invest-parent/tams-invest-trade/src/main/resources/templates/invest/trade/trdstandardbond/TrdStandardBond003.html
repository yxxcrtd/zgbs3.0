<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>交易所竞价正回购质押券管理</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form" id="submitForm">
        <div class="standard-container">
            <div class="layui-row pledge-row" style="margin-top: 10px;">
                <div class="layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4 pledge-col-wrap pledge-col">
                    <div class="pledge-state" id="inOutStdrdPrinAmtSum">&nbsp;</div>
                    <div class="pledge-text" th:utext="#{TrdStandardBond003.inOutStdrdPrinAmtSum}">标准券总额度</div>
                </div>
                <div class="layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4 pledge-col-wrap pledge-col">
                    <div class="pledge-state" id="pledgeStdrdPrinAmtSum">&nbsp;</div>
                    <div class="pledge-text" th:utext="#{TrdStandardBond003.pledgeStdrdPrinAmtSum}">已质押标准券总额度</div>
                </div>
                <div class="layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4 pledge-col-wrap">
                    <div class="pledge-state" id="avaStrdPrinAmtSum">&nbsp;</div>
                    <div class="pledge-text" th:utext="#{TrdStandardBond003.avaStrdPrinAmtSum}">可使用标准券总额度</div>
                </div>
            </div>
            <div class="pledge-table-wrap">
                <h3 class="remind-title"
                    th:utext="#{TrdStandardBond003.product.remind.title}">产品端</h3>
                <input type="hidden" id="portfolioId" name="portfolioId" th:value="${portfolioId}"/>
                <input type="hidden" id="bondCode" name="bondCode"  th:value="${bondCode}"/>
                <input type="hidden" id="initBondCode" name="initBondCode"  th:value="${initBondCode}"/>
                <input type="hidden" id="initPortfolioId" name="initBondCode"  th:value="${initPortfolioId}"/>
                <input type="hidden" id="tradePlace" name="tradePlace"  th:value="${tradePlace}"/>
                <input type="hidden" id="secAcctId" name="secAcctId"  th:value="${secAcctId}"/>
                <input type="hidden" id="workflowId" name="workflowId" th:value="${workflowId}" />
                <table class="layui-table" id="dataTable" name="outBondList"></table>
            </div>
        </div>
    </form>
    <div class="layui-col-md12 layui-col-xs12 layui-col-sm12 layui-col-lg12" style="margin:30px 0;">
        <div class="text-center">
            <a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save"
               th:text="#{SysCommon.save}">保存</a>
            <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit"
               th:text="#{SysCommon.submit}">提交</a>
            <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel"
               th:text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <style>
        @media screen and (min-width: 1680px) and (max-width: 1920px) {
        }

        .remind-title {
            padding-left: 5px;
            border-left: 3px solid #4893e6;
            margin: 10px 0;
        }

        .pledge-state {
            font-size: 22px;
            color: #007fff;
            text-align: center;
        }

        .pledge-text {
            color: #444444;
            font-size: 14px;
            text-align: center;
        }

        .pledge-row {
            border: 1px solid #dddddd;
        }

        .pledge-col {
            border-right: 1px solid #dddddd;
        }

        .pledge-col-wrap {
            padding: 10px 0;
        }

        .standard-container {
            /*height: 360px;*/
            overflow: auto;
        }
    </style>
    <script data-th-inline="javascript" type="text/javascript">
        var outBondList = /*[[${outBondList}]]*/'';
        var selArr = /*[[${selArr}]]*/'';
        var finProdId = /*[[${finProdId}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/trade/trdstandardbond/TrdStandardBond003.js}" type="text/javascript"></script>
</div>
</body>
</html>
