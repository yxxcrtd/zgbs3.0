<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>汇总指令管理</title>
    <style>
         .ptl-table .layui-table-view{
             height: 490px!important;
         }
         .ptl-table .layui-table-body{
             height: 405px!important;
         }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area" >
            <a class="layui-btn layui-btn-sm" th:id="|${pageId}_btn_sure|">汇总确认</a>
            <a class="layui-btn layui-btn-sm" th:id="|${pageId}_btn_result|">中标结果维护</a>
            <a class="layui-btn layui-btn-sm" th:id="|${pageId}_btn_close|">截标</a>
            <a class="layui-btn layui-btn-sm" th:id="|${pageId}_btn_cancel_close|">取消截标</a>
            <a th:id="|${pageId}_btn_revoke|" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="#{SysCommon.revoke}"></a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
            <form class="layui-form"  id="submitForm" >
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                            data-th-text="#{PrimaryBiddingManage001.finprodId}">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="finprodId" name="finprodId"
                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/business/common/CommonSelect/getAssetIdPrimaryBond(pageId=${pageId})}"
                                data-idfield="code" data-keyfield="code"
                                data-th-data-effectivefieldsalias='|{"code":"#{TrdBondInvestTrade001.finprodId}","shortName":"#{TrdBondInvestTrade001.finprodName}"}|'
                                data-th-value="${entity?.finprodMarketId}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                            data-th-text="#{PrimaryBiddingManage001.counterParty}">交易对手</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="counterId" name="counterId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-data-url="@{/component/trade/TrdInvestPersonInfo002/selectCounterId?counterType=01}"
                                allowClear="true" formatoption="true"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-initValue="${entity?.counterId}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                            data-th-text="#{PrimaryBiddingManage001.tenderconfirmstatus}">确认状态</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="tenderconfirmstatus" name="tenderconfirmstatus"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${TENDER_CONFIRM_STATUS}'
                                allowClear="true" formatoption="true" data-th-initValue="${entity?.tenderconfirmstatus}"></select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable" 
                        	   data-th-text="#{PrimaryBiddingManage001.validStatus}">有效状态</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="validStatus" name="validStatus"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${TRADE_FLOW_STATUS}'
                                allowClear="true" formatoption="true" data-th-initValue="${entity?.validStatus}"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable" 
                        	   data-th-text="#{PrimaryBiddingManage001.biddate}">投标日</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="biddate" name="biddate"
                                class="layui-input form-input input-dateRangeSelect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-value="${#dates.format(entity?.biddate,'yyyy-MM-dd')}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4" id="bidCloseStatus_div">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{PrimaryBiddingManage001.bidCloseStatus}">截标状态</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="bidCloseStatus" name="bidCloseStatus"
                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${BID_CLOSURE_STATUS}'
                                    allowClear="true" formatoption="true" data-th-initValue="${entity?.bidCloseStatus}"></select>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="ptl-table">
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">
		    var confirmstatus01 = /*[[${confirmstatus01}]]*/'';
		    var confirmstatus02 = /*[[${confirmstatus02}]]*/'';
		    var confirmstatus03 = /*[[${confirmstatus03}]]*/'';
		    var confirmstatus04 = /*[[${confirmstatus04}]]*/'';
		    var isCloseBid = /*[[${isCloseBid}]]*/'';
	</script>
    <script data-th-src="@{/js/invest/trade/primarybiddingmanage/PrimaryBiddingManage001.js}" type="text/javascript"></script>
</div>
</body>

</html>
