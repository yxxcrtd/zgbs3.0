<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{TrdPlanRateInvestTrade001}">计划类（利率型）投资交易查询</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="form-button-area">
            <a id="TrdPlanRateInvestTrade001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
            <a id="TrdPlanRateInvestTrade003_btn_add" class="layui-btn layui-btn-sm btn-create" >多组合交易</a>
            <a id="TrdPlanRateInvestTrade001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="#{SysCommon.revoke}"></a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdPlanRateInvestTrade001.entrustId}">委托代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="entrustId" name="entrustId"
                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/trade/trdplanrateinvesttrade/TrdPlanRateInvestTrade001/getEntrustIdByType}" data-idfield="code"
                                data-keyfield="code" data-th-data-effectivefields="code"
                                data-th-data-effectivefieldsalias='|{"code":"#{TrdPlanRateInvestTrade001.entrustId}"}|'>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdPlanRateInvestTrade001.portfolioId}">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="portfolioId" name="portfolioId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" multiple="true"
                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId}">
                            </select>
                        </div>
                    </div>
                    <!--原因、zhuyongkang 2019/7/30  start-->
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4" style="display:none">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdPlanRateInvestTrade001.finprodType}">资产类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="finprodType" name="finprodType" class="layui-input form-input input-select"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result='${PLAN_ASSET_TYPE}' allowClear="true" formatoption="true"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdPlanRateInvestTrade001.type9}">二级分类</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="type9" name="type9" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${CUSTOM_ASSET_TYPE_TWO}' allowClear="true" formatoption="true"></select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdPlanRateInvestTrade001.type10}">三级分类</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="type10" name="type10" class="layui-input form-input input-select"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result='${CUSTOM_ASSET_TYPE_THREE}' allowClear="true" formatoption="true"
                                    childrenIds="type11" ></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4" style="display: none" id = "type11Div">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdPlanRateInvestTrade001.type11}">四级分类</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="type11" name="type11" class="layui-input form-input input-select"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result='${CUSTOM_ASSET_TYPE_FOUR}' allowClear="true" formatoption="true"
                                     parentIds="type10"></select>
                        </div>
                    </div>
                   <!-- 原因、zhuyongkang 2019/7/30  end-->
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                            data-th-text="#{TrdPlanRateInvestTrade001.finprodId}">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="finprodId" name="finprodId"
                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/asset/common/getAssetId(finprodType2='F17',profitType='02',child=false)}"
                                data-idfield="name" data-keyfield="code"
                                data-th-data-effectivefieldsalias='|{"code":"#{TrdPlanRateInvestTrade001.finprodId}","shortName":"#{TrdPlanRateInvestTrade001.finprodName}"}|'>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdPlanRateInvestTrade001.ps}">交易方向</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="ps" name="ps" class="layui-input form-input input-select"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result='${PS}' allowClear="true" formatoption="true"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdPlanRateInvestTrade001.status}">有效状态</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="status" name="status"
                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${TRADE_FLOW_STATUS}'
                                    allowClear="true" formatoption="true" ></select>
                        </div>
                    </div>
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdPlanRateInvestTrade001.tradeDate}">交易日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="tradeDate" name="tradeDate"
                                class="layui-input form-input input-dateRangeSelect" placeholder="请输入时间区间"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap" id="chlFinprodId_div">
                        <label class="layui-form-label form-label-wrap"
                               th:text="#{TrdPlanRateInvestTrade001.chlFinprodId}">合作资产</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="chlFinprodId" name="chlFinprodId"
                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                    th:placeholder="#{SysCommon.placeholder}"  th:data-url="@{/invest/asset/channel/ChannelAsset001/getSecAcctId}"
                                    allowClear="true"
                                    multiple="true"></select>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
        	var TRADE_STATUS = /*[[${TRADE_STATUS}]]*/'';
        	var IS_QUERY_ASSETS_LOSS = /*[[${IS_QUERY_ASSETS_LOSS}]]*/'';
        </script>
        <script data-th-inline="javascript" type="text/javascript">
    	var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
    	</script>
        <script data-th-src="@{/js/invest/trade/trdplanrateinvesttrade/TrdPlanRateInvestTrade001.js}" type="text/javascript"></script>
    </div>
</body>

</html>
