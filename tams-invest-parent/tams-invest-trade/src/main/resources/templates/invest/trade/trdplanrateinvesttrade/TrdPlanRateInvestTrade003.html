<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorator="~{layout/default}">
<head>
	<title data-th-text="#{TrdPlanRateInvestTrade003}">计划类利率型资产多组合交易新建</title>
</head>
<body>
<div layout:fragment="content">
	<div class="pro-module-container">
		<div class="pro-module-wrapper pro-module-base">
			<form id="basicInfoForm" class="layui-form joyin-form-wrap pro-module-form">
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title"><span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<input type="hidden" id="entrustId" name="entrustId" th:value="${entity?.entrustId}" />
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanRateInvestTrade002.settleSpeed}">清算速度</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="settleSpeed" name="settleSpeed" class="layui-input form-input input-select" required
												placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" th:initValue="${entity?.mySettleSpeed}"
												data-th-data-result='${ACCOUNT_SPEED}' allowClear="true" formatoption="true" disabled></select>
									</div>
								</div>

								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanRateInvestTrade002.tradeDate}">交易日期</label>
									<div class="layui-input-inline input-inline">
										<input id="tradeDate" name="tradeDate" required
											   class="layui-input form-input input-dateSelect hidden"
											   data-th-value='${#dates.format(entity?.tradeDate,"yyyy-MM-dd")}'>
									</div>
								</div>

								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanRateInvestTrade002.settleDate}">交割日期</label>
									<div class="layui-input-inline input-inline">
										<input id="settleDate" name="settleDate" required
											   class="layui-input form-input input-dateSelect hidden"
											   data-th-value='${#dates.format(entity?.settleDate,"yyyy-MM-dd")}'>
									</div>
								</div>
							</div>

							<div class="layui-form-item">
								<div class="form-inline-wrap" >
									<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanRateInvestTrade001.finprodType}">资产类型</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="finprodType" name="finprodType" class="layui-input form-input input-select hidden" required
												placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" th:initValue="${entity?.finprodType}"
												data-th-data-result='${PLAN_ASSET_TYPE}' allowClear="true" formatoption="true" data-th-childrenIds="type9"></select>
									</div>
								</div>

								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdPlanRateInvestTrade001.finprodName}">资产代码</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="finprodMarketId" name="finprodMarketId" class="layui-input form-input input-select" required
												placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" th:initValue="${entity?.finprodMarketId}"
												data-th-data-url="@{/invest/trade/trdplanrateinvesttrade/TrdPlanRateInvestTrade002/getFinprodMarketId(isparent=${YES_OR_NO_N})}" allowClear="true" showField="id" formatoption="true"></select>
									</div>
								</div>

								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanRateInvestTrade001.finprodId}">资产名称</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="finprodName" name="finprodName" th:value="${entity?.finprodName}"
											   class="layui-input form-input hidden" required
											   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
										<a id="TrdPlanRateInvestTrade003_btn_001" class="layui-btn layui-btn-sm form-input-text" data-ignore=true>查看</a>
									</div>
								</div>
							</div>

							<!--</div>-->
							<!--<div class="layui-form-item">-->

							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanRateInvestTrade001.ps}">交易方向</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="ps"  name="ps" required="required" th:disabled="${pageModel} eq ${pageModelReference}"
											   class="layui-input form-input input-checkbox available"
											   data-th-data-result="${PS}" data-th-initvalue="${entity?.ps}"/>
									</div>
								</div>

								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable" data-th-text="#{invest.channelId}">合作资产</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="chlId" name="chlId" disabled
												class="layui-input form-input input-select" allowClear="false"
												data-th-placeholder="#{SysCommon.placeholder}" formatoption="true"
												data-th-initValue="${entity?.chlId}">
										</select>
									</div>
								</div>
								<!-- 投资目的 add by yzg 20201019 start-->
                                	<!--<div class="form-inline-wrap" id = "invAimDiv">
	                                    <label class="layui-form-label form-lable"
	                                           data-th-text="#{EtrInvestBondInfo002.invAim}">投资目的</label>
	                                    <div class="layui-input-inline input-inline">
	                                        <select type="text" id="invAim" name="invAim"
	                                                class="layui-input form-input input-select"
	                                                data-th-data-result='${INV_AIM}' allowClear="true"
	                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
	                                                required="required" formatoption="true"
	                                                data-th-initValue="${entity?.invAim}">
	                                        </select>
	                                    </div>
                                	</div>-->
                                    <!-- 投资目的 add by yzg 20201019 end-->

								<!-- 投资目的替换为业务模式 add by gwl 20220111 start-->
									<div class="form-inline-wrap" id="businessModelDiv">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{EtrBondFirstLBidding002.businessModel}">业务模式</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="businessModel" name="invAim"
													class="layui-input form-input input-select"
													data-th-data-result='${BUSINESS_MODEL}' allowClear="true"
													placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
													formatoption="true"
													data-th-initValue="${entity?.invAim}">
											</select>
										</div>
									</div>
								<!-- 投资目的替换为业务模式 add by gwl 20220111 end-->
							</div>
						</div>
					</div>
				</div>
				<div class="pro-module-wrap" th:id="value_div">
					<div class="pro-module">
						<h3 class="pro-module-title"><span class="title-des">金额信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanRateInvestTrade002.ccy}">币种</label>
									<div class="layui-input-inline input-inline">
										<select id="ccy" name="ccy" searchable="false"
												data-th-data-result="${CCY}"    disabled
												th:initValue="${entity?.ccy?:CCY_default}"
												class="layui-input form-input input-select" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required>
										</select>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanRateInvestTrade002.prinAmt}">本金金额</label>
									<div class="layui-input-inline input-inline">
										<input type="text" th:id="prinAmt" name="prinAmt" maxLength="30"
											   required th:value="${entity?.prinAmt}" class="layui-input form-input text-money rateCal"
											   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
											     />
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap" data-th-utext="#{TrdPlanRateInvestTrade002.intAmt}">应计利息总额</label>
									<div class="layui-input-inline input-inline">
										<input type="text" th:id="intAmt" th:name="intAmt" th:value="${entity?.intAmt}" maxlength="16"
											   data-textrange="2" data-fixtype="2" class="layui-input form-input text-number" required
											   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" />
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanRateInvestTrade002.tradeAmt}">交易金额</label>
									<div class="layui-input-inline input-inline">
										<input type="text" th:id="tradeAmt" name="tradeAmt" maxLength="16"   disabled
											   required th:value="${entity?.tradeAmt}" class="layui-input form-input text-number rateCal"
											   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap" data-th-utext="#{TrdPlanRateInvestTrade002.investRate}">净投资收益率%</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="investRate" name="investRate" th:value="${entity?.investRate}"
											   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
											   required data-textrange="4" data-fixtype="2"
											   class="layui-input form-input text-number rateCal hidden"/>
									</div>
								</div>
								<div class="form-inline-wrap" id="channelFee_div"  >
									<label class="layui-form-label form-label-wrap" data-th-text="|#{invest.channelId}#{TrdDepoDuration002.channelFee}|">合作资产费</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="channelFee" name="channelFee"
											   class="layui-input form-input text-number"
											   th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.channelFee}">
									</div>
								</div>
							</div>
							
							<div class="layui-form-item" id="repayIntAmt_div" style="display: none;">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap">累计还本未付利息</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="payUnpaidintAmt" name="payUnpaidintAmt" maxLength="16" disabled="true"
												    th:value="${entity?.payUnpaidintAmt}" class="layui-input form-input text-number"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" >未支付利息是否转让</label>
										<div class="layui-input-inline input-inline">
											<select id="ispayUnpaidint" name="ispayUnpaidint" searchable="false"
                                                    data-th-data-result='${YES_OR_NO}'
													th:initvalue="*{entity?.ispayUnpaidint?:YES_OR_NO_Y}" class="layui-input form-input input-select" placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}" required>
											</select>
										</div>
									</div>
							
						</div>
					</div>
				</div>


				<!-- 组合分配 -->
				<!-- <div class="page-component" th:data-path="@{/component/trade/TrdInvestFenPeiInfo002/init}"></div> -->
				<div class="pro-module-wrap" id="bussTrdTransfenpei_div"  name="bussTrdTransfenpeiDto">
					<div class="pro-module">
						<h3 class="pro-module-title"><span class="title-des">组合分配</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										   data-th-utext="#{BussRepoSecPtl.distribution}">分配方式</label>
									<div class="layui-input-inline input-inline">
										<select disabled type="text" th:id="TrdPlanRateInvestTrade003_distribution"
												th:name="TrdBondInvestTrade003_distribution"
												class="layui-input form-input input-select"
												placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
												allowClear="true" formatoption="true"
												th:data-result='${DISTRIBUTION}'
										>
										</select>
									</div>
								</div>
								<div class="form-inline-wrap">
									<a class="layui-btn layui-btn-sm btn-create layui-btn-disabled" th:id="TrdPlanRateInvestTrade003_btn_autoAllocation">
										<i class="iconfont icon-found"></i><span
											data-th-utext="#{BussRepoSecPtl.autoAllocation}">自动分配</span></a>
								</div>
							</div>
							<div class ="bussTrdTransfenpeiTable_div">
								<table th:title ="#{BussTrdTransfenpei}" class="layui-table" id="dataTable" name="bussTrdTransfenpeiDto"></table>
							</div>
						</div>
					</div>
				</div>

				<!-- 人员信息 -->
				<div class="page-component" th:data-path="@{/component/trade/TrdInvestPersonInfo002/init}" th:data-params="|{entity: '${trdInvestPersonInfo002Dto}',entityName:'trdInvestPersonInfo002Dto', psId : 'ps'}|"></div>
				<!-- 划款指令 -->
				<div id="BussTrdTransferOrder" class="page-component" th:data-path="@{/component/trade/BussTrdTransferOrder/init}" th:data-params="|{entity: '${stlPayOrdersList}',entityName:'bussTrdTransferOrder',bizCode:'${totleTradeId}'}|"></div>
				<!-- 附件信息 -->
				<div name="component" class="page-component" th:data-path="@{/component/core/FileCommon/init}"
					 th:data-params="|{entityName: 'fileArray', businessId: '${totleTradeId ?: ''}'}|"></div>
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title"><span class="title-des">备注</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div class="layui-input-inline input-inline" style="margin:0 10px;width:98%!important;">
										        <textarea id="remark" name="remark" th:placeholder="#{SysCommon.placeholder}" placeholder="请输入内容" th:text="${entity?.remark}"
														  class="layui-textarea"></textarea>
								</div>
							</div>
						</div>
					</div>
				</div>
				<!-- 风险试算 -->
				<div th:if="${isEleShow['TrdPlanRateInvestTrade003_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}" th:data-params="|{entity: '${riskTrialRetDto}',workflowId:'${workflowId?: ''}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>
			</form>
			<div class="layui-form-item">
				<div align="center" style="height:50px;padding-top: 10px;">
					<a th:if="${isEleShow['TrdPlanRateInvestTrade003_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'" id="TrdPlanRateInvestTrade003_btn_riskMath" class="layui-btn layui-btn-sm" >风险试算</a>
					<a id="TrdPlanRateInvestTrade002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
					<a id="TrdPlanRateInvestTrade002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
					<a id="TrdPlanRateInvestTrade002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
				</div>
			</div>
		</div>
	</div>
</div>
<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">
		var PS_T01 = /*[[${PS_T01}]]*/'';
		var YES = /*[[${YES}]]*/'';
		var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
		var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'';
		var finprodId = /*[[${finprodId}]]*/'';
		var CCY = /*[[${CCY}]]*/'';
		var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
		var FINPROD_TYPE_F17 = /*[[${FINPROD_TYPE_F17}]]*/'';
		var bussTrdAvailableCashQuery = /*[[${bussTrdAvailableCashQuery}]]*/'';
		var tradeId = /*[[${tradeId}]]*/'';
		var totleTradeId = /*[[${totleTradeId}]]*/'';
		var PS_T02 = /*[[${PS_T02}]]*/'';
		var collectType_01 = /*[[${collectType_01}]]*/'';
		var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
		var BussTrdTransfenpeiDto = /*[[${BussTrdTransfenpeiDto}]]*/'';
		//var entrustId = /*[[${entrustId}]]*/'';
		var GEN_PAY_ORDERS_AUTO= /*[[${GEN_PAY_ORDERS_AUTO}]]*/; // 系统参数_是否显示划款指令
		//展示投资目的或业务模式参数
		// var SHOW_INVAIM_OR_BUSSINSSMODEL =  /*[[${SHOW_INVAIM_OR_BUSSINSSMODEL}]]*/'';
	</script>
	<script data-th-src="@{/js/component/common/TradeCommon.js}" type="text/javascript"></script>
	<script data-th-src="@{/js/invest/asset/channel/ChannelAssetCommon.js}" type="text/javascript"></script>
	<script data-th-src="@{/js/invest/trade/trdplanrateinvesttrade/TrdPlanRateInvestTrade003.js}">
	</script>
</div>
</body>
</html>
