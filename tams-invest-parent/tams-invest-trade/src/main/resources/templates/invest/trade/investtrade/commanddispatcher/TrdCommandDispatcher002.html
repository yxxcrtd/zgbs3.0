<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{TrdCommandDispatcher002}">指令分发-手工分发</title>
<style>
.trd-select-wrap .select2-container .select2-selection{
     min-height:28px;
}
.connand-form{
    height: 238px;
    overflow: auto;
}
</style>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form connand-form" id="informationForm">
        	<div class="layui-form-item layui-bg-gray" style="padding:5px 0;">
        	<div>
        	<label class="layui-form-label form-lable" data-th-text="#{TrdCommandDispatcher001.User}"  style="width:20%; line-height: 30px; margin-left:-30px">交易员</label>
                <div class="layui-input-inline input-inline trd-select-wrap" style="width:70%!important;position: relative;">
                    <select id="TrdCommandDispatcher002_search" name="dealers"
                    	class="layui-input form-input input-select"
                   		data-th-placeholder="请输入用户名关键字"
                   		data-th-data-url="@{/invest/trade/investtrade/commanddispatcher/TrdCommandDispatcher002/getUsers}" multiple="true">
                   	</select>
                   	<i class="iconfont icon-search" style="font-weight: bold;top: 1px;right: 4px;position: absolute;font-size: 22px;color: #4893e6;"></i>
                </div>
            </div>
         	</div>
         	<div style="padding-bottom:4%">
             <div class="layui-row" th:if="${radioStat.count%2!=0}" style="margin-left:0px;margin-top:10px;"  th:each="radio,radioStat : ${Radios}">
				<span class='layui-col-xs6 layui-col-md6  layui-col-sm6 layui-col-lg6'>
					<input class="radio_users" type="checkbox" name="user" 
              			lay-skin="primary" th:title="${radio.realName}" th:value="${radio.userName}" />
              	</span>
              	<span class='layui-col-xs6 layui-col-md6  layui-col-sm6 layui-col-lg6'>	
					<input th:if="!${radioStat.last}" class="radio_users" type="checkbox" name="user" 
              			lay-skin="primary" th:title="${Radios[radioStat.count].realName}" th:value="${Radios[radioStat.count].userName}" />
              	</span>	
             </div>
			</div>          
     </form>
     	<hr>
        <div class="layui-form-item" align="center">
            <a id="TrdCommandDispatcher002_btn_submit" class="layui-btn layui-btn-sm" data-th-text="#{TrdCommandDispatcher001.submit}">确认分发</a>
            <a id="TrdCommandDispatcher002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
    <div layout:fragment="script">
		<script th:inline="javascript" type="text/javascript">
        	var radios = /*[[${Radios}]]*/'';
			var finprodType2s = /*[[${finprodType2s}]]*/'';
			var entrustId = /*[[${entrustIds}]]*/'';
			var userNames = /*[[${userNames}]]*/'';
			var bussBidDate = /*[[${bussBidDate}]]*/'';
			var PINAN_ASSET_TYPE_F17=/*[[${PINAN_ASSET_TYPE_F17}]]*/'';
			var finprodMarketIds=/*[[${finprodMarketIds}]]*/'';
			var entrustStatus = /*[[${entrustStatus}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/trade/investtrade/commanddispatcher/TrdCommandDispatcher002.js}"></script>
    </div>
</body>
</html>
