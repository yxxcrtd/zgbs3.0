<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{TrdInvestDealQuery001}">平安投资交易查询</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="form-button-area">
                <!-- 【吉林银行个性化代码】  add by wangyang1 2019年9月23日 --> 
<!--                <a id="TrdInvestDealQuery001_btn_singleExport" class="layui-btn layui-btn-sm btn-export btn-default">单笔导出转移定价审批表</a>-->
<!--                <a id="TrdInvestDealQuery001_btn_batchExport" class="layui-btn layui-btn-sm btn-export btn-default">批量导出转移定价审批表</a>-->
                <!-- 【吉林银行个性化代码】  add by wangyang1 end --> 
				<!-- add by zengchengfa 20210803 导出pdf单据 -->
<!--				<a id="TrdInvestDealQuery001_btn_pdfExport" class="layui-btn layui-btn-sm btn-export btn-default">导出PDF单据</a>-->
				<!-- add by zengchengfa end -->
			</div>
			<div class="joyin-form-wrap joyin-filter-form condition-area">
				<form class="layui-form" id="TrdInvestDealQuery001_searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{TrdInvestDealQuery001.entrustId}">委托代码</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="TrdInvestDealQuery001_entrustId" name="entrustId" 
									class="layui-input form-input input-lenovoselect" maxlength="50"
									data-th-data-url="@{/invest/trade/investtrade/investdealquery/TrdInvestDealQuery001/getEntrustIds}"
									data-idfield="code" data-th-data-effectivefields="code"
									data-th-data-effectivefieldsalias='|{"code":"#{TrdInvestDealQuery001.entrustId}"}|'
									allowClear="true" placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"/>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{TrdInvestDealQuery001.portfolioId}">组合代码</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="portfolioId" name="portfolioId"
										class="layui-input form-input input-select" placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}" multiple="true"
										data-th-data-url="@{/invest/trade/trddepositinvesttrade/TrdDepositInvestTrade001/getPortfolioId}">
                            	</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{TrdInvestDealQuery001.finprodType2}">资产类型</label>
							<div class="layui-input-inline input-inline">
								<select id="TrdInvestDealQuery001_finprodType2" name="finprodType2"
									class="layui-input form-input input-select"  multiple="true"
									data-th-data-result='${PINAN_ASSET_TYPE}' allowClear="true"
									placeholder="请输入内容" 
									data-th-placeholder="#{SysCommon.placeholder}" >
								</select>	
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{TrdInvestDealQuery001.finprodMarketId}">资产代码</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="TrdInvestDealQuery001_finprodMarketId" name="finprodMarketId"
									class="layui-input form-input input-lenovoselect" maxlength="32"
									data-th-data-url="@{/invest/asset/common/getAssetId}"
									data-idfield="code"
									data-th-data-effectivefieldsalias='|{"code":"#{TrdInvestDealQuery001.finprodMarketId}",
										"shortName":"#{TrdInvestDealQuery001.finprodAbbr}"}|'
									placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
							</div>
						</div>
						<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{TrdInvestDealQuery001.tradeMarket}">交易场所</label>
							<div class="layui-input-inline input-inline">
								<select id="TrdInvestDealQuery001_tradeMarket" name="tradeMarket"
									class="layui-input form-input input-select" 
									data-th-data-result='${TRADE_PLACE}'
									allowClear="true" placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}">
								</select>	
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{TrdInvestDealQuery001.tradeMarketMode}">交易方式</label>
							<div class="layui-input-inline input-inline">
								<select id="TrdInvestDealQuery001_tradeMarketMode" name="tradeMarketMode"
									class="layui-input form-input input-select" 
									data-th-data-result='${SHARES_TRADE_MARKET}'
									allowClear="true" placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}">
								</select>	
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{TrdInvestDealQuery001.ps}">交易方向 </label>
							<div class="layui-input-inline input-inline">
								<select id="TrdInvestDealQuery001_ps" name="ps" 
									class="layui-input form-input input-select"
									data-th-data-result ='${psList}'
									placeholder="请输入内容">
								</select>	
							</div>
						</div>
						<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{TrdInvestDealQuery001.statusValid}">有效状态</label>
							<div class="layui-input-inline input-inline">
								<select id="TrdInvestDealQuery001_statusValid" name="statusValid" 
									class="layui-input form-input input-select"
									data-th-data-result ='${PAGE_DATA_STATUS}'
									placeholder="请输入内容">
								</select>	
							</div>
						</div>
						<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{TrdInvestDealQuery001.tradeDate}">交易日期</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="TrdInvestDealQuery001_settleDate" name="settleDate"
									class="layui-input form-input input-dateRangeSelect"
									allowClear="true" placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}">
								</input>	
							</div>
						</div>
					 </div>
					 <div class="layui-form-item">
						<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								>是否转仓 </label>
							<div class="layui-input-inline input-inline">
								<select id="TrdInvestDealQuery001_isOutTrade" name="isOutTrade" 
									class="layui-input form-input input-select"
									data-th-data-result ='${YES_OR_NO}'
									placeholder="请输入内容">
								</select>	
							</div>
						</div>
						 <div class="form-inline-wrap" id="chlFinprodId_div">
							 <label class="layui-form-label form-label-wrap"
									th:text="#{TrdInvestDealQuery001.chlFinprodId}">合作资产</label>
							 <div class="layui-input-inline input-inline">
								 <select type="text" id="chlFinprodId" name="chlFinprodId"
										 class="layui-input form-input input-select" placeholder="请输入内容"
										 th:placeholder="#{SysCommon.placeholder}"  th:data-url="@{/invest/asset/channel/ChannelAsset001/getSecAcctId}"
										 allowClear="true"
										 multiple="true"></select>
							 </div>
						 </div>
					 </div>
				</form>
			</div>
			<div>
				 <table class="layui-table" id="dataTable"></table>
			</div>
	</div>
</div>
	<div layout:fragment="script">

		var PINAN_ASSET_TYPE_F01 = /*[[${PINAN_ASSET_TYPE_F01}]]*/'';

        var PINAN_ASSET_TYPE_F07 = /*[[${PINAN_ASSET_TYPE_F07}]]*/'';
        var PINAN_ASSET_TYPE_F08 = /*[[${PINAN_ASSET_TYPE_F08}]]*/'';
		var PINAN_ASSET_TYPE_F09 = /*[[${PINAN_ASSET_TYPE_F09}]]*/'';
        var PINAN_ASSET_TYPE_F10 = /*[[${PINAN_ASSET_TYPE_F10}]]*/'';
        var PINAN_ASSET_TYPE_F11 = /*[[${PINAN_ASSET_TYPE_F11}]]*/'';
        var PINAN_ASSET_TYPE_F12 = /*[[${PINAN_ASSET_TYPE_F12}]]*/'';
        var PINAN_ASSET_TYPE_F13 = /*[[${PINAN_ASSET_TYPE_F13}]]*/'';
        var PINAN_ASSET_TYPE_F14 = /*[[${PINAN_ASSET_TYPE_F14}]]*/'';
        var PINAN_ASSET_TYPE_F15 = /*[[${PINAN_ASSET_TYPE_F15}]]*/'';
        var PINAN_ASSET_TYPE_F16 = /*[[${PINAN_ASSET_TYPE_F16}]]*/'';
        var PINAN_ASSET_TYPE_F17 = /*[[${PINAN_ASSET_TYPE_F17}]]*/'';
        var PINAN_ASSET_TYPE_F18 = /*[[${PINAN_ASSET_TYPE_F18}]]*/'';
		// add by etliu 20210421 权益类资产相关代码合并 start
		var PINAN_ASSET_TYPE_F19 = /*[[${PINAN_ASSET_TYPE_F19}]]*/'';
		// add by etliu 20210421 权益类资产相关代码合并 end
		var PINAN_ASSET_TYPE_F37 = /*[[${PINAN_ASSET_TYPE_F37}]]*/'';
        var PS_T01 = /*[[${PS_T01}]]*/'';
        var PS_T02 = /*[[${PS_T02}]]*/'';
        var PS_T04 = /*[[${PS_T04}]]*/'';
        var PS_T05 = /*[[${PS_T05}]]*/'';

        var IRS_TYPE = /*[[${IRS_TYPE}]]*/'IRS_TYPE';
        var IS_QUERY_ASSETS_LOSS = /*[[${IS_QUERY_ASSETS_LOSS}]]*/'';
        </script>
		<script data-th-src="@{/js/invest/trade/investtrade/investdealquery/TrdInvestDealQuery001.js}"></script>
	</div>
</body>
</html>
