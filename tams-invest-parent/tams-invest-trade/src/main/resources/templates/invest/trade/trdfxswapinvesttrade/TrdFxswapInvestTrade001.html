<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{TrdFxswapInvestTrade001}">外汇即期交易</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="form-button-area">
            <a id="TrdFxswapInvestTrade001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
            <a id="TrdFxswapInvestTrade001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="#{SysCommon.revoke}"></a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdFxswapInvestTrade001.entrustId}">委托代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="entrustId" name="entrustId"
                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/trade/trdfxswapinvesttrade/TrdFxswapInvestTrade001/getEntrustIdByType}" data-idfield="code"
                                data-keyfield="name" data-effectivefields="shortName"
                                data-th-data-effectivefieldsalias='|{"code":"#{TrdFxswapInvestTrade001.entrustId}","shortName":"#{TrdFxswapInvestTrade001.entrustId}"}|'>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdFxswapInvestTrade001.portfolioId}">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="portfolioId" name="portfolioId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" multiple="true"
                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdFxswapInvestTrade001.excDealType}">交易类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="excDealType" name="excDealType" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" childrenIds="curPair"
                                th:initValue="${entity?.excDealType?:EXC_DEAL_TYPE_default}"
                                data-th-data-result='${EXC_DEAL_TYPE}' allowClear="true" formatoption="true"></select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdFxswapInvestTrade001.curPair}">货币对</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="curPair" name="curPair" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  parentIds="excDealType"
                                data-th-data-result='${CYY_PAIR}' allowClear="true" formatoption="true" multiple="true"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdFxswapInvestTrade001.ps}">交易方向</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="ps" name="ps" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${PS}' allowClear="true" formatoption="true"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdFxswapInvestTrade001.excFxsTermType}">期限类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="excFxsTermType" name="excFxsTermType" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${EXC_FXS_TERM_TYPE}' allowClear="true" formatoption="true" multiple="true"></select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdFxswapInvestTrade001.status}">有效状态</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="status" name="status"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${TRADE_FLOW_STATUS}'
                                allowClear="true" formatoption="true" ></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdFxswapInvestTrade001.tradeDate}">交易日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="tradeDate" name="tradeDate"
                                class="layui-input form-input input-dateRangeSelect" placeholder="请输入时间区间"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdFxswapInvestTrade001.vdate}">近端交割日</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="vdate" name="vdate"
                                class="layui-input form-input input-dateRangeSelect" placeholder="请输入时间区间"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdFxswapInvestTrade001.mdate}">远端交割日</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="mdate" name="mdate"
                                class="layui-input form-input input-dateRangeSelect" placeholder="请输入时间区间"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
            var TRADE_STATUS = /*[[${TRADE_STATUS}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/trade/trdfxswapinvesttrade/TrdFxswapInvestTrade001.js}" type="text/javascript"></script>
    </div>
</body>

</html>
