<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>汇总投标确认</title>
</head>
<body>
<div layout:fragment="content">
    <div>
        <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
        	<input type="hidden" id="tenderconfirmstatus" name="tenderconfirmstatus" th:value="${entity?.tenderconfirmstatus}" />
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">基本信息</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                            th:text="#{PrimaryBiddingManage002.bidid}">投标编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input disabled type="text" id="bidId" name="bidId"
                                            class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.bidId}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                            th:text="#{PrimaryBiddingManage002.finprodabbr}">债券简称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input disabled type="text" id="finprodAbbr" name="finprodAbbr"
                                            class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.finprodAbbr}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                            th:text="#{PrimaryBiddingManage002.finprodid}">债券代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input disabled type="text" id="finprodId" name="finprodId"
                                            class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.finprodId}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                            th:text="#{PrimaryBiddingManage002.biddate}">投标日</label>
                                    <div class="layui-input-inline input-inline">
                                         <input required disabled type="text" id="biddate" name="biddate"
                                             class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                             th:placeholder="#{SysCommon.placeholder}"
                                             th:value="${entity?.biddate==null ? platDate : #dates.format(entity?.biddate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                            th:text="#{PrimaryBiddingManage002.tradeMarket}">交易场所</label>
                                    <div class="layui-input-inline input-inline">
                                        <select disabled id="tradeMarket" name="tradeMarket" th:initValue="${entity?.tradeMarket}" 
                                            class="layui-input form-input input-select"
                                            data-th-placeholder="#{SysCommon.placeholder}" 
                                            required data-th-data-result="${TRADE_PLACE}">
                                   		</select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                            th:text="#{PrimaryBiddingManage002.allBidPrinAmt}">汇总投标券面总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input disabled type="text" id="allBidPrinAmt" name="allBidPrinAmt"
                                            class="layui-input form-input" data-textrange="4"
                                            th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.allBidPrinAmt}">
                                        <span class="input-right-show">万元</span>
                                    </div>
                                </div>
                            </div>

                            <!--<div class="layui-form-item">-->
                                <!--<div class="form-inline-wrap">-->
                                    <!--<label class="layui-form-label form-label-wrap"-->
                                           <!--data-th-text="#{PrimaryBiddingManage002.bidAdjustAmt}">投标量调整额</label>-->
                                    <!--<div class="layui-input-inline input-inline">-->
                                        <!--<input type="text" id="bidAdjustAmt" name="bidAdjustAmt"-->
                                               <!--class="layui-input form-input" placeholder="请输入内容"-->
                                               <!--th:placeholder="#{SysCommon.placeholder}"-->
                                               <!--th:value="${entity?.bidAdjustAmt}">-->
                                    <!--</div>-->
                                <!--</div>-->
                                <!--<div class="form-inline-wrap">-->
                                    <!--<label class="layui-form-label form-label-wrap"-->
                                           <!--data-th-text="#{PrimaryBiddingManage002.adjustStrategy}">调整策略</label>-->
                                    <!--<div class="layui-input-inline input-inline">-->
                                        <!--<select id="adjustStrategy" name="adjustStrategy" data-th-initValue="${entity?.adjustStrategy}"-->
                                                <!--class="layui-input form-input input-select" placeholder="请输入内容"-->
                                                <!--data-th-placeholder="#{SysCommon.placeholder}"-->
                                                <!--data-th-data-result="${ADJUST_STRATEGY}">-->
                                        <!--</select>-->
                                    <!--</div>-->
                                <!--</div>-->
                                <!--<a class="layui-btn layui-btn-sm" id="allocation">分配</a>-->
                            <!--</div>-->
                        </div>
                    </div>
                </div>
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">投标产品列表</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <table class="layui-table" id="dataTable1" name="primaryBiddingPortfolioDtolist"></table>
                        </div>
                    </div>
                </div>
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">汇总投标列表</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <table class="layui-table" id="dataTable2" name="primaryBiddingAllDtolist"></table>
                        </div>
                    </div>
                </div>
                <!-- 人员信息 -->
				<div class="page-component" th:data-path="@{/component/trade/TrdInvestPersonInfo002/init}" th:data-params="|{entity: '${trdInvestPersonInfo002Dto}',entityName:'trdInvestPersonInfo002Dto'}|"></div>
           		<!-- 备注信息 -->
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">备注信息</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="layui-input-inline input-inline" style="padding: 0 10px;width: 100%!important;">
                                        <textarea id="remark" name="remark" placeholder="请输入内容"
                                                  maxlength="300"
                                                  data-th-placeholder="#{SysCommon.placeholder}" class="layui-textarea"
                                                  data-th-text="${entity?.remark}"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!--  按钮 -->
            <div class="row text-center" style="margin: 20px 0;">
                <div class="text-center">
                    <a id="PrimaryBiddingManage002_btn_submit" class="layui-btn layui-btn-sm  btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                    <a id="PrimaryBiddingManage002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </div>
    </form>
    </div>
</div>
</div>
<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">
	  var entity = /*[[${entity}]]*/'';
	</script>
    <script data-th-src="@{/js/invest/trade/primarybiddingmanage/PrimaryBiddingManage002.js}" type="text/javascript"></script>
</div>
</body>
</html>
