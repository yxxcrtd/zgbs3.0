<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title>可转债申购确认</title>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container" style="margin-bottom: 20px;">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base" th:title="#{TrdConBond002.baseInfo}">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" th:text="#{TrdConBond002.baseInfo}">基本信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <input type="hidden" id="totleTradeId" name="totleTradeId" th:value="${entity?.totleTradeId}" />
                        <input type="hidden" id="busiCode" name="busiCode" th:value="${entity?.busiCode}" />
                        <input type="hidden" id="workflowId" name="workflowId" th:value="${workflowId}" />
                        <input type="hidden" id="finprodType2" name="finprodType2" th:value="${entity?.finprodType2}">
                        <input type="hidden" id="bTradeId" name="bTradeId" th:value="${entity?.bTradeId}">
                        <input type="hidden" id="dealSqeId" name="dealSqeId" th:value="${entity?.dealSqeId}"/>
                        <!-- 起息日 -->
                        <input type="hidden" id="vdate" name="vdate"
                               class="layui-input form-input" placeholder="请输入内容"
                               th:placeholder="#{SysCommon.placeholder}"
                               th:value="${#dates.format(entity?.vdate,'yyyy-MM-dd')}">
                        <!-- 到期日 -->
                        <input type="hidden" id="mdate" name="mdate"
                               class="layui-input form-input" placeholder="请输入内容"
                               th:placeholder="#{SysCommon.placeholder}"
                               th:value="${#dates.format(entity?.mdate,'yyyy-MM-dd')}">
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdConBond002.entrustId}">委托代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required disabled type="text" id="entrustId" name="entrustId"
                                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:data-url="@{/business/common/CommonSelect/getEntrustId}"
                                               data-idfield="code" data-keyfield="name"
                                               th:data-effectivefieldsalias='|{"code":"#{TrdConBond002.entrustId}","shortName":"#{TrdConBond002.entrustId}"}|'
                                               th:value="${entity?.entrustId}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdConBond002.portfolioId}">组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}" allowClear="true"
                                                formatoption="true" disabled
                                                th:initValue="${entity?.portfolioId}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdConBond002.ps}">交易方向</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="ps" name="ps" disabled
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${PS}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.ps?:PS_default}"></select>
                                    </div>
                                </div>
                                
                            </div>
                            
                            <div class="layui-form-item">
                                
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdConBond002.finprodId}">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="finprodId" name="finprodId"
                                                class="layui-input form-input input-select" placeholder="请输入内容" disabled
                                                th:placeholder="#{SysCommon.placeholder}" th:data-url="@{/invest/trade/conbond/TrdConBond002/getFinprodId}"
                                                allowClear="true" th:initValue="${entity?.finprodId}"></select>
                                    </div>
                                </div>
                                
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdConBond002.finprodName}">债券简称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  disabled type="text" id="finprodName" name="finprodName"
                                               class="layui-input form-input" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" 
                                               th:value="${entity?.finprodName}"> 
                                        <a id="TrdConBond003_btn_viewAsset" class="layui-btn layui-btn-sm form-input-text" data-ignore=true>查看</a>
                                    </div>
                                </div>
                                
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdConBond002.windtypeone}">债券一级分类</label>
                                    <div class="layui-input-inline input-inline">
                                        <select disabled type="text" id="windtypeone" name="windtypeone"
                                                class="layui-input form-input input-select" placeholder="请输入内容" 
                                                th:placeholder="#{SysCommon.placeholder}" th:data-result="${WINDTYPEONE}"
                                                allowClear="true" formatoption="false" th:initValue="${entity?.windtypeone}"></select>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdConBond002.tradeMarket}">交易场所</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required disabled type="text" id="tradeMarket" name="tradeMarket"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" 
                                                th:data-result='${TRADE_PLACE}' childrenIds='secManageAcctId'
                                                allowClear="true" formatoption="true"
                                                th:initValue="${entity?.tradeMarket}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
			                        <label class="layui-form-label form-lable" >申购方式</label>
			                        <div class="layui-input-inline input-inline">
			                            <select type="text" id="purchModle" name="purchModle" required
			                                class="layui-input form-input input-select" placeholder="请输入内容" disabled
			                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${PURCH_MODLE}'
			                                allowClear="true" formatoption="true" data-th-initValue="${entity?.purchModle}"></select>
			                        </div>
			                    </div>
			                    <div class="form-inline-wrap">
			                        <label class="layui-form-label form-lable" >申购类型</label>
			                        <div class="layui-input-inline input-inline">
			                            <select type="text" id="purchType" name="purchType" class="layui-input form-input input-select" required
			                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" disabled
			                                data-th-data-result='${PURCH_TYPE}' allowClear="true" formatoption="true"
			                                data-th-initValue="${entity?.purchType}"></select>
			                        </div>
			                    </div>
                            </div>
                            <div class="layui-form-item">
                            	
                            	<div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           >申购日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required disabled type="text" id="purchDate" name="purchDate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" 
                                               th:value="${#dates.format(entity?.purchDate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           >确认日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required  type="text" id="tradeDate" name="tradeDate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" disabled
                                               th:value="${#dates.format(entity?.tradeDate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           >缴款日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required  type="text" id="settleDate" name="settleDate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${#dates.format(entity?.settleDate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                            
                            </div>
                            
                            <div class="layui-form-item">
                            	
                            	<div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdConBond002.ccy}">币种</label>
	                                <div class="layui-input-inline input-inline">
	                                    <select disabled type="text" id="ccy" name="ccy" class="layui-input form-input input-select"
	                                            placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
	                                            th:data-result='${CCY}' allowClear="true" formatoption="true" 
	                                            th:initValue="*{entity?.ccy?:CCY_default}"></select>
	                                </div>
	                            </div>
								
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdConBond002.invAim}">投资目的</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="invAim" name="invAim"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${INV_AIM}' disabled
                                                allowClear="true" formatoption="true"
                                                th:initValue="${entity?.invAim}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdConBond002.secManageAcctId}">证券托管户</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="secManageAcctId" name="secManageAcctId" parentIds="portfolioId,tradeMarket"
                                                class="layui-input form-input input-select" placeholder="请输入内容" disabled
                                                th:placeholder="#{SysCommon.placeholder}"  th:data-url="@{/invest/trade/conbond/TrdConBond002/getSecManageAcctId}"
                                                allowClear="true" th:initValue="${entity?.secManageAcctId}"></select>
                                    </div>
                                </div>
                           </div>
                           <div class="layui-form-item">
                                 <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{invest.channelId}">通道</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="chlId" name="chlId" disabled
                                                class="layui-input form-input input-select" allowClear="true"
                                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true"
                                                data-th-data-url="@{/component/trade/BussChannelCommon/getChannelIdAndCollectType}"
                                                data-th-initvalue="${entity?.chlId}">
                                        </select>
                                    </div>
                                </div> 
                                <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       >申购券面总额</label>
	                                <div class="layui-input-inline input-inline"> 
	                                    <input required type="text" id="tradeAmt" name="tradeAmt" disabled  maxlength="30"
	                                           class="layui-input form-input text-number" placeholder="请输入内容"
	                                           th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.tradeAmt}">
	                                    <span class="input-right-show">万元</span>
	                                </div>
	                            </div>
	                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       >中签券面总额</label>
	                                <div class="layui-input-inline input-inline">
	                                    <input required type="text" id="winlotteryAmt" name="winlotteryAmt"  maxlength="30"
	                                           class="layui-input form-input text-number" placeholder="请输入内容"
	                                           th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.winlotteryAmt}">
	                                    <span class="input-right-show">万元</span>
	                                </div>
	                            </div>
	                            
                            </div>
                            
                             <div class="layui-form-item">
                             	
	                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       >保证金金额</label>
	                                <div class="layui-input-inline input-inline">
	                                    <input required type="text" id="depositAmt" name="depositAmt" disabled  maxlength="30"
	                                           class="layui-input form-input text-number" placeholder="请输入内容"
	                                           th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.depositAmt}">
	                                    <span class="input-right-show">元</span>
	                                </div>
	                            </div>
	                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       >补缴款金额</label>
	                                <div class="layui-input-inline input-inline">
	                                    <input required type="text" id="supplementaryAmt" name="supplementaryAmt"  maxlength="30"
	                                           class="layui-input form-input text-number" placeholder="请输入内容"
	                                           th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.supplementaryAmt}">
	                                    <span class="input-right-show">元</span>
	                                </div>
	                            </div>
	                            
	                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       >退款金额</label>
	                                <div class="layui-input-inline input-inline">
	                                    <input required type="text" id="refundAmt" name="refundAmt"  maxlength="30"
	                                           class="layui-input form-input text-number" placeholder="请输入内容"
	                                           th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.refundAmt}">
	                                    <span class="input-right-show">元</span>
	                                </div>
	                            </div>
                             
                             
                             </div>
                             
                             <div class="layui-form-item">
                            	
                            	<div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           >退款日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required disabled type="text" id="refundDate" name="refundDate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${#dates.format(entity?.refundDate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                            	
                            	<div class="form-inline-wrap" id='actTradeDate_div'>
                                    <label class="layui-form-label form-label-wrap"
                                           >实际到账日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required  type="text" id="actTradeDate" name="actTradeDate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.actTradeDate==null ? platDate : #dates.format(entity?.actTradeDate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                            </div>
                           
                            
							<div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                    >组合T日可用现金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="proAvailableCash" name="proAvailableCash"
                                                placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                                class="layui-input form-input text-number" disabled="disabled"
                                                 />
                                                <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                    >交易所资金账户可用现金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeMarketCash" name="tradeMarketCash"
                                                placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                                class="layui-input form-input text-number" disabled="disabled"
                                               />
                                                <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                         data-th-text="|#{invest.channelId}#{EtrInvestBondInfo002.channelAvailableCash}|">通道可用现金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="channelAvailableCash" name="channelAvailableCash"
                                               placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                               class="layui-input form-input text-number" disabled="disabled"
                                                />
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div> 
                            </div>

                        </div>
                    </div>
                </div>
            </div>

            <!-- 人员信息 -->
                <div class="page-component" th:data-path="@{/component/trade/TrdInvestPersonInfo002/init}"
                    th:data-params="|{entityName: 'trdInvestPersonInfo', counterType:'${COUNTER_TYPE_01}', pageFrom: 'submitForm', entity:'${entity_trdInvestPersonInfo}'}|"></div>
            <!-- 划款信息 -->
            <div class="page-component" th:data-path="@{/component/trade/BussTrdTransferOrder/init}" id="bussTrdTransferOrder_div"
                 th:data-params="|{entityName: 'bussTrdTransferOrder', pageFrom: 'submitForm', entity:'${entity_bussRepFinProductInfoDto}', bizCode:'${tradeId}'}|">
            </div>
            <!-- 附件信息 -->
             <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                 th:data-params="|{entityName: 'uploadFileList', businessId: '${entity?.busiCode?: ''}'}|"></div>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des" th:text="#{TrdConBond002.remark}">备注</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="layui-form-item">
                                <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                    <textarea name="remark" maxlength="200" th:text="${entity?.remark}"
                                              class="layui-textarea" placeholder="请输入内容"
                                              th:placeholder="#{SysCommon.placeholder}"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 风险试算 -->
			<div th:if="${isEleShow['TrdConBond003_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}" th:data-params="|{entity: '${riskTrialRetDto}',workflowId:'${workflowId?: ''}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>
        </form>
        <div class="row text-center" style="margin: 20px 0;">
            <a th:if="${isEleShow['TrdConBond003_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'"
                    th:id="|${pageId}_btn_risk|" class="layui-btn layui-btn-sm"
               data-th-text="#{TrdConBond002.risk}">风险试算</a>
            <a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save"
               data-th-text="#{SysCommon.save}">保存</a>
            <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit"
               data-th-text="#{SysCommon.submit}">提交</a>
            <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var entrustId = /*[[${entrustId}]]*/'';
         var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
        var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'';
        var FINPROD_TYPE_F01 = /*[[${FINPROD_TYPE_F01}]]*/'';
        var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
        var PURCH_MODLE_01 = /*[[${PURCH_MODLE_01}]]*/'';
        var PURCH_MODLE_02 = /*[[${PURCH_MODLE_02}]]*/'';
        var PURCH_TYPE_01 = /*[[${PURCH_TYPE_01}]]*/'';
        var PURCH_TYPE_02 = /*[[${PURCH_TYPE_02}]]*/'';
        var IE_FLAG_01 = /*[[${IE_FLAG_01}]]*/'01';
        var IE_FLAG_02 = /*[[${IE_FLAG_02}]]*/'02';
        var PS_T58 = /*[[${PS_T58}]]*/'';
        var single = /*[[${single}]]*/'';
    </script>
    <script data-th-src="@{/js/component/common/TradeCommon.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/component/autocoupon/AutoCoupon.js}" type="text/javascript"></script>
    <script th:src="@{/js/invest/trade/conbond/TrdConBond003.js}" type="text/javascript"></script>
</div>
</body>
</html>
