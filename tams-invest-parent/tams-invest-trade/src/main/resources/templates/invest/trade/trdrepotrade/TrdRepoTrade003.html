<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title>新建多组合回购交易</title>
    <style>
        .label-text{
            color: #0b72f1;
            line-height: 24px;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base">
                <!--基本信息-->
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des"
                                  th:text="#{TrdRepoTrade002.baseInfo}">基本信息
                            </span>
                            （<span class="star-sign">*</span>必填）
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            <input type="hidden" id="noBranchNoValue" name="noBranchNoValue" th:value="${noBranchNoValue}" />
                            <input type="hidden" id="tradeId" name="tradeId" th:value="${tradeId}" />
                            <input type="hidden" id="workflowId" name="workflowId" th:value="${workflowId}" />
							<!-- add by wangguoxian 费用设置 20190807 start-->
                            <input type="hidden" id="isPayWithTrade" name="isPayWithTrade" th:value="${entity?.isPayWithTrade}" />
                            <!-- add by wangguoxian 费用设置 20190807 end-->
                            <input type="hidden" id="entrustId" name="entrustId" th:value="${entity?.entrustId}">

                        </h3>
                        <div class="pro-module-item pro-item-wrap">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdRepoTrade002.fTradeId}">银行间成交编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="fTradeId" name="fTradeId"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:data-url="@{/invest/trade/trdrepotrade/TrdRepoTrade002/queryRepoCstpInfoList}"
                                                allowClear="true" th:initValue="${entity?.fTradeId}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdRepoTrade002.tradeDate}">交易日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required disabled type="text" id="tradeDate" name="tradeDate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.tradeDate==null ? platDate : #dates.format(entity?.tradeDate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap" id="repoTypeDiv">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdRepoTrade002.repoType}">回购类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="repoType" name="repoType"
                                                class="layui-input form-input input-select" 
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${TARGET_BACK_TYPE}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.repoType}"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdRepoTrade002.tradeMarket}">交易场所</label>
                                        <div class="layui-input-inline input-inline">
                                            <select required type="text" id="tradeMarket" name="tradeMarket"
                                                    class="layui-input form-input input-select" childrenIds="repoType,secAcctId"
                                                    placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                    th:data-result='${TRADE_PLACE}' allowClear="true" formatoption="true"
                                                    th:initValue="${entity?.tradeMarket}"></select>
                                        </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdRepoTrade002.ps}">交易方向</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="ps" name="ps"
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${BACK_LEND_DIRECTION}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.ps}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdRepoTrade002.settleSpeed}">清算速度</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="settleSpeedStr" name="settleSpeedStr"
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${ACCOUNT_SPEED}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.settleSpeedStr}"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdRepoTrade002.calendarId}">交易日历</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="calendarId" name="calendarId"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:data-url="@{/business/common/CommonSelect/selectCalendarId}" allowClear="true"
                                                formatoption="true"
                                                th:initValue="${entity?.calendarId}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdRepoTrade002.termTypeReback}">期限品种</label>
                                    <div class="layui-input-inline input-inline" id="termTypeRebackDiv">
                                        <select required type="text" id="termTypeReback" name="termTypeReback"
                                               class="layui-input form-input input-select"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-data-result='${TERM_TYPE_REBACK}'
                                                data-th-initvalue="${entity?.termTypeReback}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdRepoTrade002.vdate}">起息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="vdate" name="vdate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${#dates.format(entity?.vdate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdRepoTrade002.mdate}">到期日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="mdate" name="mdate" disabled
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${#dates.format(entity?.mdate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdRepoTrade002.term}">期限(天)</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="term" name="term" maxlength="10"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" data-fixtype="2" data-textrange="0"
                                               th:value="${entity?.term}">
                                        <span class="input-right-show">天</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdRepoTrade002.basis}">计息基础</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="basis" name="basis" class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${BASIS}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.basis?:BASIS_default}"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" id="avaFundsDateDiv">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdRepoTrade002.moneyAvaDate}">资金可用日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="avaFundsDate" name="avaFundsDate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.avaFundsDate==null ? '':#dates.format(entity?.avaFundsDate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{invest.channelId}">合作资产</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="chlId" name="chlId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true"
                                                data-th-data-url="@{/component/trade/BussChannelCommon/getChannelId}"
                                                data-th-initvalue="${entity?.chlId}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdRepoTrade002.actCapDays}">实际占款天数</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="actCapDays" name="actCapDays" maxlength="10"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" data-fixtype="2" data-textrange="0"
                                               th:value="${entity?.actCapDays}">
                                        <span class="input-right-show">天</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap payDate" id="vpayDateDiv">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdRepoTrade002.vpayDate}" >首期交付日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="vpayDate" name="vpayDate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.vpayDate==null ? '':#dates.format(entity?.vpayDate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap payDate" id="mpayDateDiv">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdRepoTrade002.mpayDate}">到期交付日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="mpayDate" name="mpayDate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.mpayDate==null ? '':#dates.format(entity?.mpayDate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                            </div>
                            
                            <div class="layui-form-item">
                                <!-- 组合现金、持仓查询 -->
                                <div class="page-component" th:data-path="@{/component/trade/BussTrdAvailableCashQuery/init}"
                                     th:data-params="|{entityName: 'bussTrdAvailableCashQuery'}|">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!--金额信息-->
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des"
                                  th:text="#{TrdRepoTrade002.amtInfo}">金额信息</span>
                                                                （<span class="star-sign">*</span>必填）
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item pro-item-wrap">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdRepoTrade002.ccy}">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="ccy" name="ccy" class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${CCY}' allowClear="true" formatoption="true"
                                                th:initValue="*{entity?.ccy?:CCY_default}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdRepoTrade002.prinAmt}">本金金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="prinAmt" name="prinAmt" maxlength="16"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.prinAmt}">
                                        <span class="input-right-show"
                                              th:text="#{TrdRepoTrade002.yuan}">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdRepoTrade002.rebackPrice}">回购利率%</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="rebackPrice" name="rebackPrice"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-fixtype="2" data-textrange="6" maxlength="10"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.rebackPrice}">
                                        <span class="input-right-show">%</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdRepoTrade002.rebackIntAmt}">回购利息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input disabled type="text" id="rebackIntAmt" name="rebackIntAmt" maxlength="10"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.rebackIntAmt}">
                                        <span class="input-right-show"
                                              th:text="#{TrdRepoTrade002.yuan}">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdRepoTrade002.mdateSettleAmt}">到期结算金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <div class="layui-input-inline input-inline">
                                            <input disabled type="text" id="mdateSettleAmt" name="mdateSettleAmt"
                                                   class="layui-input form-input text-number" placeholder="请输入内容" maxlength="16"
                                                   th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.mdateSettleAmt}">
                                            <span class="input-right-show"
                                                  th:text="#{TrdRepoTrade002.yuan}">元</span>
                                        </div>
                                    </div>
                                </div>
                                <!-- 通道交易 新增 强成西 2019/03/26 start -->
<!--                                <div class="form-inline-wrap">-->
<!--                                    <label class="layui-form-label form-label-wrap" data-th-text="|#{invest.channelId}#{TrdDepoDuration002.channelFee}|">通道费</label>-->
<!--                                    <div class="layui-input-inline input-inline">-->
<!--                                        <input type="text" id="channelFee" name="channelFee"-->
<!--                                               class="layui-input form-input text-number" th:value="${entity?.channelFee}">-->
<!--                                    </div>-->
<!--                                </div>-->
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" id="tradeAmtAndFeeDiv">
                                    <label class="layui-form-label form-label-wrap">交易金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input disabled type="text" id="tradeAmtAndFee" name="tradeAmtAndFee"  th:value="${entity?.tradeAmtAndFee}"
                                               class="layui-input form-input text-number">
                                    </div>
                                </div>
                                <div class="form-inline-wrap" id="procedureAmtDiv">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdRepoTrade002.procedureAmt}">交易手续费</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="procedureAmt" name="procedureAmt"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.procedureAmt}">
                                     </div>
                                </div>
                                <div class="form-inline-wrap" id="settleAmtDiv">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdRepoTrade002.settleAmt}">结算费</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="settleAmt" name="settleAmt"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.settleAmt}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap" id="commissionAmtDiv">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdBondInvestTrade002.commissionAmt}">佣金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="commissionAmt" name="commissionAmt"
                                                class="layui-input form-input text-number" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.commissionAmt}">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 质押券信息（逆回购） -->
                <div class="page-component" id="Ps04Repo" th:data-path="@{/component/trade/BussRepoSec/init}"
                     th:data-params="|{entityName: 'bussRepoSec', pageFrom: 'TrdRepoTrade002', entity:'${entity_bussRepoSecDto}',
                     portfolioId:'${entity?.portfolioId==null?'':entity?.portfolioId}', ps:'${entity?.ps==null?'':entity?.ps}',
                     bussType:'zyqJy',bussType:'zyqJy',
                     bizCode:'${tradeId==null?'':tradeId}', entrustId:'${entity?.entrustId==null?'':entity?.entrustId}',
                     securitiesCust: '${entity?.secAcctId == null? '': entity?.secAcctId}',chlId:'${entity?.chlId == null? '': entity?.chlId}', tradeMarketId: 'tradeMarket'}|"></div>
                     
                 <!-- 质押券信息 -->
                <div id="bussRepoSecPtl_pledgeBondTotalTblDetailed" class="page-component" th:data-path="@{/component/trade/BussRepoSecPtl/init}"
                      th:data-params="|{entityName: 'bussRepoSec', pageFrom: 'TrdRepoTrade003', entity:'${entity_bussRepoSecDto}',portfolioId:'${entity?.portfolioId==null?'':entity?.portfolioId}',
                      ps:'${entity?.ps==null?'':entity?.ps}', bizCode:'${tradeId==null?'':tradeId}', entrustId:'${entity?.entrustId==null?'':entity?.entrustId}',
                      securitiesCust:'${entity?.secAcctId == null? '': entity?.secAcctId}',chlId:'${entity?.chlId == null? '': entity?.chlId}'}|"></div>
                <!-- 人员信息 -->
                <div class="page-component" th:data-path="@{/component/trade/TrdInvestPersonInfo002/init}"
                     th:data-params="|{entityName: 'trdInvestPersonInfo', pageFrom: 'submitForm', entity:'${entity_trdInvestPersonInfo}'}|"></div>
                <!-- 划款信息 -->
                <div class="page-component" th:data-path="@{/component/trade/BussTrdTransferOrder/init}" id="bussTrdTransferOrder_div" th:style="${GEN_PAY_ORDERS_AUTO == '01'?'display:none':''}"
                     th:data-params="|{entityName: 'bussTrdTransferOrder', pageFrom: 'submitForm', entity:'${entity_bussRepFinProductInfoDto}', bizCode:'${tradeId==null?'':tradeId}'}|">
                </div>
                <!-- 附件信息 -->
                <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                       th:data-params="|{entityName: 'uploadFileList', businessId: '${tradeId ?: entity?.entrustId}'}'}|"></div>
                    <!--备注-->
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                            <span class="title-des"
                                  th:text="#{TrdRepoTrade002.remark}">备注</span>
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item pro-item-wrap">
                                <div class="layui-form-item">
                                    <div class="layui-form-item">
                                        <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                        <textarea id="remark" name="remark" maxlength="1000" th:text="${entity?.remark}"
                                                  class="layui-textarea" placeholder="请输入内容"
                                                  th:placeholder="#{SysCommon.placeholder}"></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                <!-- 风险试算 -->
                <div th:if="${isEleShow['TrdRepoTrade003_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}" th:data-params="|{entity: '${riskTrialRetDto}',workflowId:'${workflowId?: ''}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>
                <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
                    <div class="row text-center" style="margin: 20px 0;">
                        <a th:if="${isEleShow['TrdRepoTrade003_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'" th:id="|${pageId}_btn_risk|" class="layui-btn layui-btn-sm"
                           th:text="#{TrdRepoTrade002.risk}">风险试算</a>
                        <a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save"
                           th:text="#{SysCommon.save}">保存</a>
                        <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit"
                           th:text="#{SysCommon.submit}">提交</a>
                        <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel"
                           th:text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </div>
