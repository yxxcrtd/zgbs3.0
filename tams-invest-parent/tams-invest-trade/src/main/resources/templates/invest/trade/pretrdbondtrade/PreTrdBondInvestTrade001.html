<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{PreTrdBondInvestTrade001}">债券交易预录入管理</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="form-button-area">
            <a id="PreTrdBondInvestTrade001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
            <a id="PreTrdBondInvestTrade001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="#{SysCommon.revoke}"></a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{PreTrdBondInvestTrade001.tradeDate}">交易日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="tradeDate" name="tradeDate"
                                   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-value="${entity?.tradeDate==null ? platDate : #dates.format(entity?.tradeDate,'yyyy-MM-dd')}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{PreTrdBondInvestTrade001.counterId}">对手方</label>
                        <div class="layui-input-inline input-inline">
                            <select id="counterId" name="counterId" class="layui-input form-input input-select"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    allowClear="true" formatoption="true"
                                    data-th-initValue="${entity?.counterId}"
                                    data-th-data-url="@{/component/trade/TrdInvestPersonInfo002/selectCounterId}"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{PreTrdBondInvestTrade001.counterTrader}">对手方交易员</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="counterTrader" name="counterTrader"
                                class="layui-input form-input" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{PreTrdBondInvestTrade001.finprodId}">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="finprodId" name="finprodId"
                                   class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-url="@{/business/common/CommonSelect/getFinprodAbbr}"
                                   data-idfield="hidCode" data-keyfield="code"
                                   data-th-data-effectivefieldsalias='|{"code":"#{TrdBondInvestTrade001.finprodId}","shortName":"#{TrdBondInvestTrade001.finprodName}"}|'
                                   data-th-value="${entity?.finprodMarketId}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{PreTrdBondInvestTrade001.ps}">交易方向</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="ps" name="ps" class="layui-input form-input input-select"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result='${PS}' allowClear="true" formatoption="true"
                                    data-th-initValue="${entity?.ps}"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{PreTrdBondInvestTrade001.settleSpreed}">清算速度</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="settleSpreed" name="settleSpreed" class="layui-input form-input input-select"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result='${ACCOUNT_SPEED}'
                                    allowClear="true" formatoption="true" data-th-initValue="${entity?.settleSpreed}"></select>
                        </div>
                    </div>
                </div>


                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{PreTrdBondInvestTrade001.validStatus}">交易流程状态</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="validStatus" name="validStatus" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" formatoption="true"
                                data-th-data-result='${TRADE_FLOW_STATUS}' allowClear="true" th:initValue="${TRADE_STATUS}"></select>
                            <input hidden name="validStatusRevoke" id="validStatusRevoke" th:value="${TRADE_STATUS}"/>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{PreTrdBondInvestTrade001.registOrg}">登记托管机构</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="registOrg" name="registOrg" class="layui-input form-input input-select"
                                    data-th-data-result='${REGIST_ORG_INV}' allowClear="true" placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    formatoption=true data-th-initValue="${entity?.registOrg}"></select>
                        </div>
                    </div>
                </div>


                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{PreTrdBondInvestTrade001.accountId}">资金账户</label>
                        <div class="layui-input-inline input-inline">
                            <select id="accountId" name="accountId" class="layui-input form-input input-select"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    allowClear="true" formatoption="true"
                                    data-th-initValue="${entity?.accountId}"
                                    data-th-data-url="@{/invest/trade/pretrdrepotrade/PreTrdRepoTrade001/getAcct}"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{PreTrdBondInvestTrade001.secAcctId}">证券账户</label>
                        <div class="layui-input-inline input-inline">
                            <select id="secAcctId" name="secAcctId" class="layui-input form-input input-select"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    allowClear="true" formatoption="true"
                                    data-th-initValue="${entity?.secAcctId}"
                                    data-th-data-url="@{/invest/trade/pretrdrepotrade/PreTrdRepoTrade001/getSecAcct}"></select>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
            var TRADE_STATUS = /*[[${TRADE_STATUS}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/trade/pretrdbondtrade/PreTrdBondInvestTrade001.js}" type="text/javascript"></script>
    </div>
</body>

</html>
