<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{TrdFundInvestTrade001}">基金交易管理</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area">
            <a th:id="|${pageId}_btn_add|" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
			<a th:id="|${pageId}_btn_dzhadd|" class="layui-btn layui-btn-sm btn-create" >多组合新建</a>
            <a th:id="|${pageId}_btn_revoke|" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="#{SysCommon.revoke}"></a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdFundInvestTrade001.entrustId}">委托代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="entrustId" name="entrustId"
                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/trade/fund/TrdFundInvestTrade001/getEntrustIdByType}" data-idfield="code"
                                data-keyfield="name"
                                data-th-data-effectivefieldsalias='|{"code":"#{TrdFundInvestTrade001.entrustId}","shortName":"#{TrdFundInvestTrade001.entrustId}"}|'
                                data-th-value="${entity?.entrustId}" maxlength="60"/>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdFundInvestTrade001.portfolioId}">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="portfolioId" name="portfolioId"
                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}" multiple="true"
                                    data-th-data-url="@{/invest/trade/trddepositinvesttrade/TrdDepositInvestTrade001/getPortfolioId}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdFundInvestTrade001.finprodId}">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="finprodId" name="finprodId"
                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/business/common/CommonSelect/getAssetIdFund(pageId=${pageId})}" data-idfield="name"
                                data-keyfield="code"
                                data-th-data-effectivefieldsalias='|{"code":"#{TrdFundInvestTrade001.finprodId}","shortName":"#{TrdFundInvestTrade001.finprodName}"}|'
                                data-th-value="${entity?.finprodMarketId}" maxlength="60"/>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                       <!-- 新增资产二、三、四级分类 王贵奇 2019/7/30 开始 -->
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                                                        th:text="#{TrdFundInvestTrade001.type9}">资产二级分类</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="type9" name="type9"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" multiple="true"
                                data-th-data-result='${CUSTOM_ASSET_TYPE_TWO}' allowClear="true" formatoption="true"
                                data-th-initValue="${entity?.type9}"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                                                        th:text="#{TrdFundInvestTrade001.type10}">资产三级分类</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="type10" name="type10"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" multiple="true"
                                data-th-data-result='${CUSTOM_ASSET_TYPE_THREE}' allowClear="true" formatoption="true"
                                data-th-initValue="${entity?.type10}"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4" style="display: none" id = "type11Div">
                        <label class="layui-form-label form-lable"
                                                        th:text="#{TrdFundInvestTrade001.type11}">资产四级分类</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="type11" name="type11"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" multiple="true"
                                data-th-data-result='${CUSTOM_ASSET_TYPE_FOUR}' allowClear="true" formatoption="true"
                                data-th-initValue="${entity?.type11}"></select>
                        </div>
                    </div>
                    <!-- 新增资产二、三、四级分类 王贵奇 2019/7/30 结束 -->
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4" style="display:none">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdFundInvestTrade001.type6}">基金类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="type6" name="type6"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${FUND_ASSET_TYPE}' allowClear="true" formatoption="true"
                                data-th-initValue="${entity?.type6}"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdFundInvestTrade001.tradeMarket}">交易场所</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="tradeMarket" name="tradeMarket"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${TRADE_PLACE}'
                                allowClear="true" formatoption="true" data-th-initValue="${entity?.tradeMarket}"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdFundInvestTrade001.ps}">交易方向</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="ps" name="ps" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${PS}' allowClear="true" formatoption="true"
                                data-th-initValue="${entity?.ps}"></select>
                        </div>
                    </div>
                    <div class="form-inline-wrap" id="chlFinprodId_div">
                        <label class="layui-form-label form-label-wrap"
                               th:text="#{TrdFundInvestTrade001.chlFinprodId}">合作资产</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="chlFinprodId" name="chlFinprodId"
                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                    th:placeholder="#{SysCommon.placeholder}"  th:data-url="@{/invest/asset/channel/ChannelAsset001/getSecAcctId}"
                                    allowClear="true"
                                    multiple="true"></select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdFundInvestTrade001.validStatus}">有效状态</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="validStatus" name="validStatus"
                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${TRADE_FLOW_STATUS}'
                                    allowClear="true" formatoption="true" data-th-initValue="${entity?.validStatus}"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdFundInvestTrade001.tradeDate}">交易日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="tradeDate" name="tradeDate"
                                class="layui-input form-input input-dateRangeSelect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-value="${#dates.format(entity?.tradeDate,'yyyy-MM-dd')}" />
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4" style="display: none">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdFundInvestTrade001.secondType}">二级类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="secondType" name="secondType"
                                    class="layui-input form-input input-select" placeholder="请输入内容" maxlength="75"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result="${FUND_ASSET_SECOND_TYPE}" >
                            </select>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
            var ps_T04 = /*[[${ps_T04}]]*/'';
            var ps_T05 = /*[[${ps_T05}]]*/'';
            var ps_T06 = /*[[${ps_T06}]]*/'';
            var ps_T19 = /*[[${ps_T19}]]*/'';
            var ps_T24 = /*[[${ps_T24}]]*/'';
            var ps_mr = /*[[${ps_mr}]]*/'';
            var ps_mc = /*[[${ps_mc}]]*/'';
            var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
            // 场内基金改造 add by renping 20191117 start
            var ps_T52 = /*[[${ps_T52}]]*/'';
            var ps_T65 = /*[[${ps_T65}]]*/'';
            var ps_T66 = /*[[${ps_T66}]]*/'';
            var ps_T18 = /*[[${ps_T18}]]*/'';
            // 场内基金改造 add by renping 20191117 end
        </script>
        <script data-th-src="@{/js/invest/trade/fund/TrdFundInvestTrade001.js}" type="text/javascript"></script>
        
    </div>
</body>
</html>
