<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
    layout:decorate="~{layout/default}">
<head>
<title th:text="#{TrdIRSTrade002}">利率互换投资交易</title>
</head>
<body>
    <div layout:fragment="content">
        <div id = "TrdIRSTrade002" class="pro-module-container">
            <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
                <div class="pro-module-wrapper pro-module-base" th:title="#{TrdIRSTrade.baseInfo}">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des" th:text="#{TrdIRSTrade.baseInfo}">基本信息</span>
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <input type="hidden" id="finprodType" name="finprodType" th:value="${entity?.finprodType}">
                            <input type="hidden" id="finprodType2" name="finprodType2" th:value="${entity?.finprodType2}">
                            <input type="hidden" id="tradeId" name="tradeId" th:value="${entity?.tradeId}"> 
                            <input type="hidden" id="acctTypeA01" name="acctType" th:value="${acctTypeA01}"> 
                            <input type="hidden" id="acctTypeA05" name="acctType" th:value="${acctTypeA05}">
                            <!-- <input type="hidden" id="portfolioId_cor" name="portfolioId" > -->
                                 
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdIRSTrade.entrustId}">委托代码</label>
	                                   <div class="layui-input-inline input-inline">
	                                       <input type="text" id="entrustId" name="entrustId" th:value="${entity?.entrustId}"
	                                              class="layui-input form-input hidden" disabled/>
	                                   </div>
	                               </div>
                                
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdIRSTrade.portfolioId}">组合代码</label>
				                        <div class="layui-input-inline input-inline">
					                        <select id="portfolioId" name="portfolioId" required="required"
					                                class="layui-input form-input input-select" placeholder="请输入内容"
					                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}"
					                                allowClear="true" data-th-placeholder="#{SysCommon.placeholder}" th:initValue="${entity?.portfolioId}" >
					                        </select>
				                        </div>
                                    </div>
                                    
                                     <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdIRSTrade.tradeDate}">交易日期</label>
	                                    <div class="layui-input-inline input-inline">
	                                        <input type="text" id="tradeDate" name="tradeDate" disabled="true" class="layui-input form-input input-dateSelect" placeholder="请输入日期"
	                                               th:value="${entity?.tradeDate==null ? platDate : #dates.format(entity?.tradeDate,'yyyy-MM-dd')}"/>
	                                    </div>
                                    </div>
                                    
                                </div>
                                
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdIRSTrade.irsType}">互换方式</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="irsType" name="irsType" required="required"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:data-result='${IRS_TYPE}'
                                                allowClear="true" formatoption="true" th:initValue="${entity?.irsType}"></select>
                                        </div>
                                    </div>
                                    
                                    
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdIRSTrade.termType}">期限品种</label>
                                            <!-- 删除required="required"使期限品种选填by赵东东 2019.8.30 -->
                                        <div class="layui-input-inline input-inline">
                                        <!-- 删除required="required"使期限品种选填by赵东东 2019.8.30-->
                                            <select type="text" id="termType" name="termType"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:data-result='${TERM_TYPE_IRS}'
                                                allowClear="true" formatoption="true" th:initValue="${entity?.termType}"></select>
                                        </div>
                                    </div>
                                    
                                    
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdIRSTrade.vdate}">起息日</label>
	                                    <div class="layui-input-inline input-inline">
	                                        <input type="text" id="vdate" name="vdate" required class="layui-input form-input input-dateSelect" placeholder="请输入日期"
	                                               data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'/>
	                                    </div>
                                    </div>
                                </div>
                                
                                <div class="layui-form-item">
                                
                                	<div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdIRSTrade.mdate}">到息日</label>
	                                    <div class="layui-input-inline input-inline">
	                                        <input type="text" id="mdate" name="mdate" required class="layui-input form-input input-dateSelect" placeholder="请输入日期"
	                                               data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'/>
	                                    </div>
                                    </div>
                                    
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdIRSTrade.term}">期限(天)</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="term" name="term" disabled="true"
                                                placeholder="请输入内容"  data-pattern="" data-textrange="0" maxLength="10" 
                                                class="layui-input form-input text-number" 
                                                th:value="${entity?.term}" />
                                        </div>
                                    </div>
                                    
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdIRSTrade.ccy}">名义本金币种</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="ccy" name="ccy" disabled="true"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:data-result='${CCY}'
                                                allowClear="true" formatoption="true" th:initValue="${entity?.ccy?:CCY_default}"></select>
                                        </div>
                                    </div>
                                    
                                </div>
                                
                                <div class="layui-form-item">
                                	<div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdIRSTrade.prin}">名义本金(万元)</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="prin" name="prin" required
                                                placeholder="请输入内容"  data-pattern="" data-textrange="4" maxLength="16" 
                                                class="layui-input form-input text-number" 
                                                th:value="${entity?.prin}" />
                                        </div>
                                    </div>
                                	
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdIRSTrade.calendarId}">交易日历</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="calendarId" name="calendarId" required="required"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                allowClear="true" formatoption="true" th:initValue="${entity?.calendarId}"
												data-th-data-url="@{/business/common/CommonSelect/selectCalendarId}" 
                                                ></select>
                                        </div>
                                    </div>
                                    
                                    
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdIRSTrade.endTdayRule}">计息营业日准则</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="endTdayRule" name="endTdayRule" required="required"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:data-result='${TDAY_RULE_END}'
                                                allowClear="true" formatoption="true" th:initValue="${entity?.endTdayRule?:TDAY_RULE_default_END}"></select>
                                        </div>
                                    </div>
                                    
                                </div>
                                
                                
                                <div class="layui-form-item">
                                    
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdIRSTrade.payTdayRule}">付息营业日准则</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="payTdayRule" name="payTdayRule" required="required"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:data-result='${TDAY_RULE_PAY}'
                                                allowClear="true" formatoption="true" th:initValue="${entity?.payTdayRule?:TDAY_RULE_default_PAY}"></select>
                                        </div>
                                    </div>
                                    
                                	<div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdIRSTrade.feeB06}">交易手续费</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="feeB06" name="feeB06" required
                                                placeholder="请输入内容"  data-pattern="" data-textrange="2" maxLength="16" 
                                                class="layui-input form-input text-number" 
                                                th:value="${entity?.feeB06}" />
                                        </div>
                                    </div>
                                	
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdIRSTrade.feeB07}">结算费</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="feeB07" name="feeB07" required
                                                placeholder="请输入内容"  data-pattern="" data-textrange="2" maxLength="16" 
                                                class="layui-input form-input text-number" 
                                                th:value="${entity?.feeB07}" />
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
	                                    <label class="layui-form-label form-label-wrap"
	                                           th:text="#{TrdBondLendInvestTrade002.holdPurpose}">持有目的</label>
	                                    <div class="layui-input-inline input-inline">
	                                        <select required  type="text" id="holdPurpose" name="holdPurpose"
	                                                class="layui-input form-input input-select" placeholder="请输入内容"
	                                                th:placeholder="#{SysCommon.placeholder}" th:data-result="${SVR_HOLD_PURPOSE}"
	                                                th:initValue="${entity?.holdPurpose}"></select>
	                                    </div>
	                                </div>
                                </div>
                                
                             </div>
                        </div>
                    </div>
                    
                    
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des" th:text="#{TrdIRSTrade.fix}">固定利率</span>
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            
                            <div class="pro-module-item">
                            	<div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdIRSTrade.yield}">固定利率%</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="yield" name="yield" required
                                                placeholder="请输入内容"  data-pattern="" data-textrange="4" maxLength="16" 
                                                class="layui-input form-input text-number" 
                                                th:value="${entity?.yield}" />
                                        </div>
                                    </div>
                                    
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdIRSTrade.Basis}">计息基础</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="fixBasis" name="fixBasis" required="required"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:data-result='${BASIS}'
                                                allowClear="true" formatoption="true" th:initValue="${entity?.fixBasis}"></select>
                                        </div>
                                    </div>
                                    
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdIRSTrade.payCycle}">付息频率</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="fixPayCycle" name="fixPayCycle" required="required"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:data-result='${FREQUENCY_UNIT}'
                                                allowClear="true" formatoption="true" th:initValue="${entity?.fixPayCycle}"></select>
                                        </div>
                                    </div>
                                 </div>
                             </div>
                             
                             <div class="pro-module-item">
                            	<div class="layui-form-item">
                             		<div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdIRSTrade.firstPayDate}">首期起息日</label>
	                                    <div class="layui-input-inline input-inline">
	                                        <input type="text" id="firstPayDateR" name="firstPayDateR" required class="layui-input form-input input-dateSelect" placeholder="请输入日期"
	                                               data-th-value='${#dates.format(entity?.firstPayDateR,"yyyy-MM-dd")}'/>
	                                    </div>
                                    </div>
                                 </div>
                             </div>
                                    
                                    
                        </div>
                    </div>
                    
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des" th:text="#{TrdIRSTrade.float}">浮动利率</span>
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            
                            <div class="pro-module-item">
                            	<div class="layui-form-item">
                            	
                                     <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdIRSTrade.intType}">挂钩利率</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="intType" name="intType" required="required"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:data-result='${SECRATE_DATA}'
                                                allowClear="true" formatoption="true" th:initValue="${entity?.intType}"></select>
                                        </div>
                                    </div>
                                    
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdIRSTrade.spreadRate}">利差(BP)</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="spreadRate" name="spreadRate" required
                                                placeholder="请输入内容"  data-pattern="" data-textrange="2" maxLength="16" 
                                                class="layui-input form-input text-number" 
                                                th:value="${entity?.spreadRate}" />
                                        </div>
                                    </div>
                                    
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdIRSTrade.Basis}">计息基础</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="floatBasis" name="floatBasis" required="required"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:data-result='${BASIS}'
                                                allowClear="true" formatoption="true" th:initValue="${entity?.floatBasis}"></select>
                                        </div>
                                    </div>
                                    
                                </div>
                            
                            
                            	<div class="layui-form-item">
                            	
                                     <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdIRSTrade.payCycle}">付息频率</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="floatPayCycle" name="floatPayCycle" required="required"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:data-result='${FREQUENCY_UNIT}'
                                                allowClear="true" formatoption="true" th:initValue="${entity?.floatPayCycle}"></select>
                                        </div>
                                    </div>
                                    
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdIRSTrade.firstPayDate}">首期起息日</label>
	                                    <div class="layui-input-inline input-inline">
	                                        <input type="text" id="firstPayDateF" name="firstPayDateF" required class="layui-input form-input input-dateSelect" placeholder="请输入日期"
	                                               data-th-value='${#dates.format(entity?.firstPayDateF,"yyyy-MM-dd")}'/>
	                                    </div>
                                    </div>
                                    
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdIRSTrade.firstResetDate}">首期利率确定日</label>
	                                    <div class="layui-input-inline input-inline">
	                                        <input type="text" id="firstResetDate" name="firstResetDate" required class="layui-input form-input input-dateSelect" placeholder="请输入日期"
	                                               data-th-value='${#dates.format(entity?.firstResetDate,"yyyy-MM-dd")}'/>
	                                    </div>
                                    </div>
                                </div>
                                
                                <div class="layui-form-item">
                            	
                                     <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdIRSTrade.resetFreq}">利率重置频率</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="resetFreq" name="resetFreq" required="required"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:data-result='${FREQUENCY_UNIT_RESET}'
                                                allowClear="true" formatoption="true" th:initValue="${entity?.resetFreq}"></select>
                                        </div>
                                    </div>
                                    
                                    
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdIRSTrade.dealAcct}">本方账户</label>
										<div class="layui-input-inline input-inline">
				                            <select type="text" name="dealAcct" id="dealAcct" required="required"
			                                    class="finprodIdList layui-input form-input input-select" allowClear="true" data-th-placeholder="#{SysCommon.placeholder}"
			                            		formatoption = true parentIds="portfolioId,ccy,acctTypeA01" 
		                            			data-th-data-url="@{/business/common/CommonSelect/qryPtlCapAcctNoByRequestParam}"
			                            		th:initValue="${entity?.dealAcct}">
			                            		</select>
				                        </div>
                                    </div>
                                    
                                    
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdIRSTrade.corAcct}">对手方账户</label>
										<div class="layui-input-inline input-inline">
				                            <select type="text" name="corAcct" id="corAcct" required="required"
			                                    class="finprodIdList layui-input form-input input-select" allowClear="true" data-th-placeholder="#{SysCommon.placeholder}"
			                            		formatoption = true  parentIds="ccy" 
		                            			data-th-data-url="@{/business/common/CommonSelect/qryMstCapAcctNoByRequestParam}"
			                            		th:initValue="${entity?.corAcct}">
			                            		</select>
				                        </div>
                                    </div>
                                </div>
                             </div>
                        </div>
                    </div>
                    
                </div>
                <!-- 人员信息 -->
                <div class="page-component" th:data-path="@{/component/trade/TrdInvestPersonInfo002/init}"
                    th:data-params="|{entityName: 'trdInvestPersonInfo', pageFrom: 'submitForm', entity:'${entity_trdInvestPersonInfo}'}|"></div>
                <!-- 划款信息 --><!-- 隐藏划款指令by赵东东 2019.8.30 -->
                <div id="transferInformation" class="page-component" style="display:none"
                    th:data-path="@{/component/trade/BussTrdTransferOrder/init}"
                    th:data-params="|{entityName: 'bussTrdTransferOrder', pageFrom: 'submitForm', entity:'${entity_bussForwexFinProductInfoDto}',bizCode:'${tradeId}'}|"></div>
                <!-- 附件信息 -->
                <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                    th:data-params="|{entityName: 'FileCommon', businessId: '${businessId ?: ''}'}|"></div>
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" th:text="#{TrdForwexInvestTrade.remark}">备注</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div>
                                    <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                        <textarea name="remark" maxlength="200" th:text="${entity?.remark}"
                                                  class="layui-textarea" placeholder="请输入内容"
                                                  th:placeholder="#{SysCommon.placeholder}"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 风险试算 -->
				<div th:if="${isEleShow['TrdIRSTrade002_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}" th:data-params="|{entity: '${riskTrialRetDto}',entityName:'riskTrialRetDto',workflowId:'${workflowId?: ''}',tradeId:'${tradeId}'}|"></div>
                <div class="row text-center" style="margin: 30px 0;">
                    <a th:if="${isEleShow['TrdIRSTrade002_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'"
                            th:id="|${pageId}_btn_risk|" class="layui-btn layui-btn-sm"
                        data-th-text="#{TrdForwexInvestTrade.risk}">风险试算</a>
                    <a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save"
                        data-th-text="#{SysCommon.save}">保存</a>
                    <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit"
                        data-th-text="#{SysCommon.submit}">提交</a>
                    <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel"
                        data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </form>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
            var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
            var FINPROD_TYPE_F14= /*[[${FINPROD_TYPE_F14}]]*/'';
            var USE_STATUS_01 = /*[[${USE_STATUS_01}]]*/'';
            var PINAN_ASSET_TYPE_F16 = /*[[${PINAN_ASSET_TYPE_F16}]]*/'';
        </script>
        <script th:src="@{/js/invest/trade/irs/TrdIRSTrade002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
