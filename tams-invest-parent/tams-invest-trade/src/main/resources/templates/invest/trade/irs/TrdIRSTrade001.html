<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{TrdIRSTrade001}">利率互换交易管理</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area">
            <a id="TrdIRSTrade001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
            <a id="TrdIRSTrade001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="#{SysCommon.revoke}"></a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdIRSTrade.entrustId}">委托代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="entrustId" name="entrustId"
                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/trade/irs/TrdIRSTrade001/getEntrustIdByType}" data-idfield="code"
                                data-keyfield="name"
                                data-th-data-effectivefieldsalias='|{"code":"#{TrdIRSTrade.entrustId}","shortName":"#{TrdIRSTrade.entrustId}"}|'
                                data-th-value="${entity?.entrustId}" maxlength="50">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdIRSTrade.portfolioId}">组合代码</label>
                        <div class="layui-input-inline input-inline">
	                        <select id="portfolioId" name="portfolioId"
	                                class="layui-input form-input input-select" multiple="true"
	                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId}"
	                                allowClear="true" data-th-placeholder="#{SysCommon.placeholder}" >
	                        </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdIRSTrade.irsType}">互换方式</label>
	                    <div class="layui-input-inline input-inline">
	                        <select id="irsType" name="irsType" 
	                                class="layui-input form-input input-select"
	                                data-th-data-result='${IRS_TYPE}'
	                                allowClear="true" data-th-placeholder="#{SysCommon.placeholder}" >
	                        </select>
	                    </div>
                    </div>
                </div>
                
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdIRSTrade.intType}">挂钩利率</label>
                        <div class="layui-input-inline input-inline">
	                        <select id="intType" name="intType" 
	                                class="layui-input form-input input-select"
	                                data-th-data-result='${SECRATE_DATA}'
	                                allowClear="true" data-th-placeholder="#{SysCommon.placeholder}" >
	                        </select>
	                    </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdIRSTrade.statusValid}">有效状态</label>
                        <div class="layui-input-inline input-inline">
	                        <select id="validStatus" name="validStatus" 
	                                class="layui-input form-input input-select"
	                                data-th-data-result='${TRADE_FLOW_STATUS}'
	                                allowClear="true" data-th-placeholder="#{SysCommon.placeholder}" >
	                        </select>
	                    </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
			             <label class="layui-form-label form-lable" data-th-text="#{TrdIRSTrade.tradeDate}">交易日期</label>
			             <div class="layui-input-inline input-inline">
			                  <input id='tradeDate' name='tradeDate'
	                                class="layui-input form-input input-dateRangeSelect" placeholder="请选择时间区间"
	                                data-th-placeholder="#{SysCommon.placeholder}">
			             </div>
			        </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/trade/irs/TrdIRSTrade001.js}" type="text/javascript"></script>
        <script data-th-inline="javascript" type="text/javascript">
                                </script>
    </div>
</body>
</html>
