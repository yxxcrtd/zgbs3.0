<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{TrdLendInvestTrade001}">拆借交易管理</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="form-button-area">
            <a th:id="|${pageId}_btn_add|" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
            <a th:id="|${pageId}_btn_revoke|" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="#{SysCommon.revoke}"></a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdLendInvestTrade001.entrustId}">指令代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="entrustId" name="entrustId"
                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/business/common/CommonSelect/getEntrustId?finprodType=F08}" data-idfield="code"
                                data-keyfield="name"
                                data-th-data-effectivefieldsalias='|{"code":"#{TrdLendInvestTrade001.entrustId}","shortName":"#{TrdLendInvestTrade001.entrustId}"}|'
                                data-th-value="${entity?.entrustId}" maxlength="50" >
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdLendInvestTrade001.portfolioId}">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="portfolioId" name="portfolioId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?ww=false}"
                                data-th-value="${entity?.portfolioId}"
                                multiple="true" >
                             </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                            data-th-text="#{TrdLendInvestTrade001.paBussType}">拆借类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="paBussType" name="paBussType"
                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result='${BANK_LENDING_TYPE}' allowClear="true" formatoption="true"
                                    data-th-initValue="${entity?.paBussType}"></select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdLendInvestTrade001.ps}">交易方向</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="ps" name="ps" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${BACK_LEND_DIRECTION}' allowClear="true" formatoption="true"
                                data-th-initValue="${entity?.ps}"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdLendInvestTrade001.validStatus}">有效状态</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="validStatus" name="validStatus"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${TRADE_FLOW_STATUS}'
                                allowClear="true" formatoption="true" data-th-initValue="${entity?.validStatus}"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdLendInvestTrade001.tradeDate}">交易日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="tradeDate" name="tradeDate"
                                class="layui-input form-input input-dateRangeSelect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-value="${#dates.format(entity?.tradeDate,'yyyy-MM-dd')}">
                        </div>
                    </div>
                </div>
                <!-- <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdLendInvestTrade001.tradeMarket}">交易场所</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="tradeMarket" name="tradeMarket"
                                   class="layui-input form-input input-select" allowclear="true"
                                   placeholder="请选择交易场所" data-th-placeholder="#{SysCommon.placeholder}" aria-hidden="true"
                                   data-th-data-result="${TRADE_PLACE}" formatoption="true">
                        </div>
                    </div>
                </div> -->
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/trade/lend/TrdLendInvestTrade001.js}" type="text/javascript"></script>
    </div>
</body>

</html>
