<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PtlManagementInfo001}">组合查询</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				<a id="PtlManagementInfo001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
				<a id="PtlManagementInfo001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}" style="display: none;">删除</a>
				<!-- <a id="PtlManagementInfo001_btn_allocation" class="layui-btn layui-btn-sm " >
				<i class="iconfont icon-team_fill"></i>
					<span data-th-text="#{PtlManagementInfo001.allocation}">用户分配</span>
				</a> -->
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area curr-form' >
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{PtlManagementInfo001.portfolioId}">组合代码</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="portfolioId" name="portfolioId" class="layui-input form-input " maxLength="32"  formatoption = true placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{PtlManagementInfo001.portfolioType}">组合类型</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="portfolioType" name="portfolioType" class="layui-input form-input input-select" data-th-data-result='${PORTFOLIO_TYPE}' formatoption = true placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{PtlManagementInfo001.revenueType}">收益类型</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="profitType" name="profitType" class="layui-input form-input input-select" data-th-data-result='${PROFIT_TYPE}' formatoption = true placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" data-th-text="#{PtlManagementInfo001.vDate}">成立日</label>
							<div class="layui-input-inline input-inline">
								<input id="vdate" name="vdate" class="layui-input form-input input-dateRangeSelect" placeholder="请输入日期">
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" data-th-text="#{PtlManagementInfo001.mDate}">到期日</label>
							<div class="layui-input-inline input-inline">
								<input id="mdate" name="mdate" class="layui-input form-input input-dateRangeSelect" placeholder="请输入日期">
							</div>
						</div>
				    </div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-src="@{/js/invest/trade/portfolio/ptlmanagementinfo/PtlManagementInfo001.js}"></script>
	</div>
</body>
</html>
