<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{TrdOutRightRepoTrade001}">买断式回购投资交易查询</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="form-button-area">
				<a id="TrdOutRightRepoTrade001_btn_add"    class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
                <a id="TrdOutRightRepoTrade003_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create.ptl}">多组合新建</a>
				<a id="TrdOutRightRepoTrade001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="#{SysCommon.revoke}"></a>
			</div>
			<div
				class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{TrdOutRightRepoTrade001.entrustId}">委托代码</label>
							<div class="layui-input-inline input-inline">
								 <input type="text" name="entrustId"
		                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
		                               data-th-placeholder="#{SysCommon.placeholder}"
		                               data-th-data-url="@{/invest/trade/buyoutrepo/TrdOutRightRepoTrade001/getEntrustIdByType}" data-idfield="code"
		                               data-keyfield="name" maxlength=50
		                               data-th-data-effectivefieldsalias='|{"code":"#{TrdOutRightRepoTrade001.entrustId}","shortName":"#{TrdOutRightRepoTrade001.entrustId}"}|'>
							</div>
						</div>
		                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
		                    <label class="layui-form-label form-lable" data-th-text="#{TrdOutRightRepoTrade001.ptlId}">组合代码</label>
		                    <div class="layui-input-inline input-inline">
		                        <select type="text" name="portfolioId"
		                                class="layui-input form-input input-select" placeholder="请输入内容"
		                                data-th-placeholder="#{SysCommon.placeholder}" maxlength=32
		                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId}" multiple="true">
		                        </select>
		                    </div>
		                </div>
		                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
		                    <label class="layui-form-label form-lable" data-th-text="#{TrdOutRightRepoTrade001.ps}">交易方向</label>
		                    <div class="layui-input-inline input-inline">
		                        <select type="text" name="ps" class="layui-input form-input input-select"
		                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
		                                data-th-data-result='${BACK_LEND_DIRECTION}' allowClear="true" formatoption="true"></select>
		                    </div>
		                </div>
					</div>
					<div class="layui-form-item">
	                	<div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
		                    <label class="layui-form-label form-lable"
		                           data-th-text="#{TrdOutRightRepoTrade001.effectStatus}">有效状态</label>
		                    <div class="layui-input-inline input-inline">
		                        <select type="text" name="validStatus"
		                                class="layui-input form-input input-select" placeholder="请输入内容"
		                                data-th-placeholder="#{SysCommon.placeholder}"
		                                data-th-data-result='${TRADE_FLOW_STATUS}'
		                                allowClear="true" formatoption="true"></select>
		                    </div>
						</div>
		                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
		                    <label class="layui-form-label form-lable"
		                           data-th-text="#{TrdOutRightRepoTrade001.dealDate}">交易日期</label>
		                    <div class="layui-input-inline input-inline">
		                        <input type="text" id="TrdOutRightRepoTrade001_dealDate" name="dealDate"
		                               class="layui-input form-input input-dateRangeSelect" placeholder="请输入内容"
		                               data-th-placeholder="#{SysCommon.placeholder}">
		                    </div>
		                </div>
						<div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4" id="chlFinprodId_div">
							<label class="layui-form-label form-label-wrap"
								   th:text="#{TrdOutRightRepoTrade001.chlFinprodId}">合作资产</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="chlFinprodId" name="chlFinprodId"
										class="layui-input form-input input-select" placeholder="请输入内容"
										th:placeholder="#{SysCommon.placeholder}"  th:data-url="@{/invest/asset/channel/ChannelAsset001/getSecAcctId}"
										allowClear="true"
										multiple="true"></select>
							</div>
						</div>
		             </div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
							<label class="layui-form-label form-label-wrap"
								   th:text="#{TrdOutRightRepoTrade001.finprodName}">标的代码</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="finprodId" name="finprodId"
										class="layui-input form-input input-select" placeholder="请输入内容"
										th:placeholder="#{SysCommon.placeholder}" th:data-url="@{/component/trade/BussRepoSecDialog/getBondCode}"
										allowClear="true"
										multiple="true"></select>
							</div>
						</div>
					</div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-src="@{/js/invest/trade/buyoutrepo/TrdOutRightRepoTrade001.js}" type="text/javascript"></script>
	</div>
</body>
</html>
