<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title>新建多组合质押式回购交易预录入</title>
    <style>
        .label-text{
            color: #0b72f1;
            line-height: 24px;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base">
                <!--基本信息-->
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" th:text="#{TrdRepoTrade002.baseInfo}">基本信息</span>
                            （<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i>
                            <input type="hidden" id="noBranchNoValue" name="noBranchNoValue" th:value="${noBranchNoValue}" />
                            <input type="hidden" id="tradeId" name="tradeId" th:value="${tradeId}" />
                            <input type="hidden" id="workflowId" name="workflowId" th:value="${workflowId}" />
                            <input type="hidden" id="totleTradeId" name="totleTradeId" th:value="${entity?.totleTradeId}">
                            <input type="hidden" id="entrustId" name="entrustId" th:value="${entrustId}">
                            <input type="hidden" id="validPortfolioId" name="validPortfolioId" th:value="${validPortfolioId}">
                            <input th:id="isEntrust" type="hidden" name="isEntrust" th:value="${isEntrust}"></input>
                        </h3>
                        <div class="pro-module-item pro-item-wrap">
                            <div class="layui-form-item" >
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" th:text="#{TrdRepoTrade002.tradeDate}">交易日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required disabled type="text" id="tradeDate" name="tradeDate" placeholder="请输入内容"
                                               class="layui-input form-input input-dateSelect" th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.tradeDate==null ? platDate : #dates.format(entity?.tradeDate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" th:text="#{TrdRepoTrade002.ps}">交易方向</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="ps" name="ps" class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}" formatoption="true"
                                                th:data-result='${BACK_LEND_DIRECTION}' allowClear="true" th:initValue="${entity?.ps}">
                                        </select>
                                    </div>

                                </div>
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-label-wrap">回购期限(天)</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="repoTerm" name="repoTerm" maxlength="10" placeholder="请输入内容"
                                                 class="layui-input form-input text-number" th:placeholder="#{SysCommon.placeholder}"
                                                 data-fixtype="1" data-textrange="0" th:value="${entity?.repoTerm}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" th:text="#{TrdRepoTrade002.vdate}">起息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  disabled  type="text" id="vdate" name="vdate" placeholder="请输入内容"
                                                class="layui-input form-input input-dateSelect" th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${entity?.vdate==null ? platDate : #dates.format(entity?.vdate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" th:text="#{TrdRepoTrade002.mdate}">到期日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="mdate" name="mdate" class="layui-input form-input input-dateSelect"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${#dates.format(entity?.mdate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" th:text="#{TrdRepoTrade002.actCapDays}">实际占款天数</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  disabled type="text" id="actCapDays" name="actCapDays" maxlength="10" placeholder="请输入内容"
                                                class="layui-input form-input text-number" th:placeholder="#{SysCommon.placeholder}"
                                                data-fixtype="2" data-textrange="0" th:value="${entity?.actCapDays}">
                                        <span class="input-right-show">天</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" th:text="#{TrdRepoTrade002.settleSpeed}">清算速度</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required  type="text" id="settleSpeedText" name="settleSpeedText" class="layui-input form-input input-select"
                                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${ACCOUNT_SPEED}'
                                                data-th-initvalue="*{entity?.settleSpeedText?:ACCOUNT_SPEED_01}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" th:text="#{TrdRepoTrade002.termTypeReback}">期限品种</label>
                                    <div class="layui-input-inline input-inline" id="termTypeRebackDiv">
                                        <select disabled  type="text" id="termType" name="termType" class="layui-input form-input input-select"
                                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${TERM_TYPE_REBACK}'
                                                data-th-initvalue="${entity?.termType}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">首次结算方式</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="deliveryType" name="deliveryType" class="layui-input form-input input-select"
                                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${SETT_MODE}'
                                                data-th-initvalue="*{entity?.deliveryType?:deliveryType_default}"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">到期结算方式</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="mDeliveryType" name="mDeliveryType" class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}" th:data-result='${SETT_MODE}' allowClear="true"
                                                formatoption="true" th:initValue="*{entity?.mDeliveryType?:deliveryType2_default}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">清算类型</label>
                                    <div class="layui-input-inline input-inline" >
                                        <select required type="text" id="clearType" name="clearType" class="layui-input form-input input-select"
                                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${CLEAR_TYPE}'
                                                data-th-initvalue=" ${entity?.clearType}?:${settleType_default}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">有效时间</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" class="layui-input form-input"  id="effTimeStr" name="effTimeStr">
                                    </div>
                                </div>
                            </div>
                            <div style="display: none" class="layui-form-item">
                                <div  class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">计息基础</label>
                                    <div class="layui-input-inline input-inline">
                                        <select  type="text" id="basis" name="basis" class="layui-input form-input input-select"
                                                 placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                 th:data-result='${BASIS}' allowClear="true" formatoption="true" th:initValue="${BASIS_A_365}">
                                        </select>
                                    </div>
                                </div>
                                <div  class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交易场所</label>
                                    <div class="layui-input-inline input-inline">
                                        <select  type="text" id="tradeMarket" name="tradeMarket" class="layui-input form-input input-select"
                                                 childrenIds="repoType,secAcctId" placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                 th:data-result='${TRADE_PLACE}' allowClear="true" formatoption="true" th:initValue="${TRADE_PLACE_01}">
                                        </select>
                                    </div>
                                </div>
                                <div   class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交易日历</label>
                                    <div class="layui-input-inline input-inline">
                                        <select  type="text" id="calendarId" name="calendarId" class="layui-input form-input input-select"
                                                 placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}" allowClear="true"
                                                 th:data-url="@{/business/common/CommonSelect/selectCalendarId}" formatoption="true">
                                        </select>
                                    </div>
                                </div>
                            </div>
                             <div class="layui-form-item">
                                <div class="form-inline-wrap" style="width:100%;">
                                    <label class="layui-form-label form-label-wrap" style=" width: 11.9%;">补充条款</label>
                                    <div class="layui-input-inline input-inline" style="width:81%!important;">
                                        <input type="text" id="remark" name="remark" class="layui-input form-input" th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.remark}">
                                    </div>
                                </div>
                            </div>
                        </div>
                        </div>
                    </div>
                </div>
                <!--金额信息-->
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" th:text="#{TrdRepoTrade002.amtInfo}">金额信息</span>
                            （<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item pro-item-wrap">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" th:text="#{TrdRepoTrade002.ccy}">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select disabled  type="text" id="ccy" name="ccy" class="layui-input form-input input-select" formatoption="true"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${CCY}' allowClear="true" th:initValue="*{entity?.ccy?:CCY_default}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" id="tradeAmtAndFeeDiv">
                                    <label class="layui-form-label form-label-wrap">交易金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  required  type="text" id="prinAmt" name="prinAmt" class="layui-input form-input text-number"
                                                th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.prinAmt}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap" style="display:none;" >
                                    <label class="layui-form-label form-label-wrap" th:text="#{TrdRepoTrade002.prinAmt}">本金金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="tradeAmt" name="tradeAmt" maxlength="16" placeholder="请输入内容"
                                                class="layui-input form-input text-number">
                                        <span class="input-right-show"th:text="#{TrdRepoTrade002.yuan}">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" th:text="#{TrdRepoTrade002.rebackPrice}">回购利率%</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="entrustPrice" name="entrustPrice" placeholder="请输入内容"
                                               class="layui-input form-input text-number" data-fixtype="2" data-textrange="4" maxlength="10"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.entrustPrice}">
                                        <span class="input-right-show">%</span>
                                        <input hidden type="text" id="entrustPriceBack" name="entrustPriceBack" th:value="${entity?.entrustPrice}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">应计利息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input disabled type="text" id="rebackIntAmt" name="rebackIntAmt" maxlength="10"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.rebackIntAmt}">
                                        <span class="input-right-show" th:text="#{TrdRepoTrade002.yuan}">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" th:text="#{TrdRepoTrade002.mdateSettleAmt}">到期结算金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <div class="layui-input-inline input-inline">
                                            <input disabled type="text" id="mdateSettleAmt" name="mdateSettleAmt" class="layui-input form-input text-number"
                                                   placeholder="请输入内容" maxlength="16" th:placeholder="#{SysCommon.placeholder}"
                                                   th:value="${entity?.mdateSettleAmt}">
                                            <span class="input-right-show" th:text="#{TrdRepoTrade002.yuan}">元</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                <!-- 质押券信息 -->
                <div id="bussRepoSecPtl_pledgeBondTotalTblDetailed" class="page-component" th:data-path="@{/component/trade/PreTrdBondBussRepoSecPtl/init}"
                     th:data-params="|{entityName: 'bussRepoSec', pageFrom: 'TrdRepoTrade002', entity:'${entity_bussRepoSecDto}',portfolioId:'${entity?.portfolioId==null?'':entity?.portfolioId}', ps:'${entity?.ps==null?'':entity?.ps}', bizCode:'${tradeId==null?'':tradeId}', entrustId:'${entity?.entrustId==null?'':entity?.entrustId}',securitiesCust:'01',chlId:'${entity?.chlId == null? '': entity?.chlId}'}|"></div>
                <!-- 人员信息 -->
                <div class="page-component" th:data-path="@{/component/trade/PreTrdBondTrdInvestPersonInfo/init}"
                     th:data-params="|{entityName: 'trdInvestPersonInfo', pageFrom: 'submitForm', entity:'${entity_trdInvestPersonInfo}'}|"></div>



                <!-- 风险试算 -->
                <div th:if="${isEleShow['PreTrdRepoTrade002_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}" th:data-params="|{entity: '${riskTrialRetDto}',workflowId:'${workflowId?: ''}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>
                <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
                    <div class="row text-center" style="margin: 20px 0;">
                        <a th:if="${isEleShow['PreTrdRepoTrade002_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'" th:id="|${pageId}_btn_risk|" class="layui-btn layui-btn-sm"
                           th:text="#{TrdRepoTrade002.risk}">风险试算</a>
                        <a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save"
                           th:text="#{SysCommon.save}">保存</a>
                        <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit"
                           th:text="#{SysCommon.submit}">提交</a>
                        <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel"
                           th:text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </div>
    </div>
    </form>
</div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        // 账户类型：托管户
        var ACCT_TYPE_A01 = /*[[${ACCT_TYPE_A01}]]*/'';
        // 监督时分_交易监控
        var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
        // 交易场所_银行间
        var TRADE_PLACE_01 = /*[[${TRADE_PLACE_01}]]*/'';
        // 交易场所_上海证券交易所
        var TRADE_PLACE_02 = /*[[${TRADE_PLACE_02}]]*/'';
        // 交易场所_深圳证券交易所
        var TRADE_PLACE_03 = /*[[${TRADE_PLACE_03}]]*/'';
        // 回购拆借方向_正回购
        var BACK_LEND_DIRECTION_03 = /*[[${BACK_LEND_DIRECTION_03}]]*/'';
        // 回购拆借方向_逆回购
        var BACK_LEND_DIRECTION_04 = /*[[${BACK_LEND_DIRECTION_04}]]*/'';
        // 金融产品类型_投管用_债券质押式正回购
        var FINPROD_TYPE_TG_F02 = /*[[${FINPROD_TYPE_TG_F02}]]*/'';
        // 金融产品类型_投管用_债券质押式逆回购
        var FINPROD_TYPE_TG_F03 = /*[[${FINPROD_TYPE_TG_F03}]]*/'';
        // 回购类型_质押式协议回购
        var TARGET_BACK_TYPE_H01 = /*[[${TARGET_BACK_TYPE_H01}]]*/'';
        // 回购类型_质押式竞价回购
        var TARGET_BACK_TYPE_H02 = /*[[${TARGET_BACK_TYPE_H02}]]*/'';
        // 清算速度_T加0
        var ACCOUNT_SPEED_01 = /*[[${ACCOUNT_SPEED_01}]]*/'';
        // 清算速度_T加1
        var ACCOUNT_SPEED_02 = /*[[${ACCOUNT_SPEED_02}]]*/'';
        // 清算速度_T加1
        var ACCOUNT_SPEED_02 = /*[[${ACCOUNT_SPEED_02}]]*/'';
        // 计息基础_A_360
        var BASIS_A_360 = /*[[${BASIS_A_360}]]*/'';
        // 计息基础_A_365
        var BASIS_A_365 = /*[[${BASIS_A_365}]]*/'';
        // 是否_否
        var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
        // 是否_是
        var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'';
        // 是否_是
        var PS_T01 = /*[[${PS_T01}]]*/'';
        // 是否工作流中
        var formTodoList = /*[[${formTodoList}]]*/'';
        //债券质押式正回购
        var FINPROD_TYPE_F02 = /*[[${FINPROD_TYPE_F02}]]*/'';
        //债券质押式逆回购
        var FINPROD_TYPE_F03 = /*[[${FINPROD_TYPE_F03}]]*/'';
        // T + 1
        var SETTLESPEED_1 = /*[[${SETTLESPEED_1}]]*/'';
        // T + 2
        var SETTLESPEED_2 = /*[[${SETTLESPEED_2}]]*/'';
        //---add by wangguoxian 2019/07/20----start----
        // 佣金
        var FEE_TYPE_05=/*[[${FEE_TYPE_05}]]*/'';
        // 交易手续费
        var FEE_TYPE_06=/*[[${FEE_TYPE_06}]]*/'';
        // 结算手续费
        var FEE_TYPE_08=/*[[${FEE_TYPE_08}]]*/'';
        //---add by wangguoxian 2019/07/20-----end----
        // 回购期限品种
        var GC001 = /*[[${GC001}]]*/'';
        var GC002 = /*[[${GC002}]]*/'';
        var GC003 = /*[[${GC003}]]*/'';
        var GC004 = /*[[${GC004}]]*/'';
        var GC007 = /*[[${GC007}]]*/'';
        var GC014 = /*[[${GC014}]]*/'';
        var GC028 = /*[[${GC028}]]*/'';
        var GC091 = /*[[${GC091}]]*/'';
        var GC182 = /*[[${GC182}]]*/'';
        var R001 = /*[[${R001}]]*/'';
        var R002 = /*[[${R002}]]*/'';
        var R003 = /*[[${R003}]]*/'';
        var R004 = /*[[${R004}]]*/'';
        var R007 = /*[[${R007}]]*/'';
        var R014 = /*[[${R014}]]*/'';
        var R021 = /*[[${R021}]]*/'';
        var RC001 = /*[[${RC001}]]*/'';
        var RC003 = /*[[${RC003}]]*/'';
        var RC007 = /*[[${RC007}]]*/'';
        var R_001 = /*[[${R_001}]]*/'';
        var R_002 = /*[[${R_002}]]*/'';
        var R_003 = /*[[${R_003}]]*/'';
        var R_004 = /*[[${R_004}]]*/'';
        var R_007 = /*[[${R_007}]]*/'';
        var R_014 = /*[[${R_014}]]*/'';
        var R_028 = /*[[${R_028}]]*/'';
        var R_091 = /*[[${R_091}]]*/'';
        var R_182 = /*[[${R_182}]]*/'';
        var R1M = /*[[${R1M}]]*/'';
        var R2M = /*[[${R2M}]]*/'';
        var R3M = /*[[${R3M}]]*/'';
        var R4M = /*[[${R4M}]]*/'';
        var R6M = /*[[${R6M}]]*/'';
        var R9M = /*[[${R9M}]]*/'';
        var R1Y = /*[[${R1Y}]]*/'';
        var effTime_default = /*[[${effTime_default}]]*/'';
        var effTime = /*[[${entity?.effTimeText}]]*/'';

        var laydate = layui.laydate;
        //时间选择器
        laydate.render({
            elem: '#effTimeStr'
            ,value: effTime ?  effTime : effTime_default
            ,type: 'time'
            ,format: 'HH:mm'
        });



    </script>
    <script data-th-src="@{/js/component/common/util.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/component/common/termTypeUtil.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/component/asset/BussAssetFiveType.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/invest/asset/common/AssetCommon.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/invest/trade/pretrdrepotrade/PreTrdRepoTrade002.js}" type="text/javascript"></script>
</div>
</body>

</html>
