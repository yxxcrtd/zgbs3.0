<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{fundAssetTransfer001}">基金类资产转仓</title>
</head>
<body>
<div layout:fragment="content">
    <div class="layui-layer-content">
        <form class="layui-form" id="fundAssetTransfer_form">
            <!-- 隐藏字段 转出组合 -->
<!--
            <input type="text" id="invTransPortf" name="invTransPortf" data-th-value='${entity?.invTransPortf}' hidden>
-->
            <!-- 隐藏字段 转出组合代码 -->
            <input type="text" id="portfolioName" name="portfolioName" data-th-value='${entity?.portfolioName}' hidden>

            <input type="text" id="tradeMarket" name="tradeMarket" data-th-value='${entity?.tradeMarket}' hidden>
            <!-- 隐藏字段 金融产品代码 -->
            <input type="text" id="finprodIdOrg" name="finprodIdOrg" data-th-value='${entity?.finprodIdOrg}' hidden>
            <!-- 隐藏字段 工作流代码 -->
            <input id="workflowId" name="workflowId" data-th-value="${workflowId}" hidden>
            <!-- 隐藏字段 画面模式 -->
            <input id="pageModel" name="pageModel" data-th-value="${pageModel}" hidden>
            <!-- 隐藏字段 资产类型 -->
            <input id="assetType" name="assetType" data-th-value="${entity?.assetType}" hidden>
            <!--隐藏字段 交易日历-->
            <input id="calendarId" name="calendarId" data-th-value="${entity?.calendarId}" hidden>

            <div class="pro-module-wrapper pro-module-base" title="基本信息">
                <!-- 交易信息 -->
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">基本信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">转出组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="invTransPortf" name="invTransPortf"
                                                disabled class="layui-input form-input input-select"
                                                data-th-data-url="@{/invest/trade/transfer/assetstransfer/AssetsTransfer001/getPortfolioId}"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:initValue="${entity?.invTransPortf}"
                                                placeholder="请输入内容">
                                        </select>
                                    </div>
                                </div>
                                <!-- 交易日期 -->
                                <div id="tradeDateDiv" class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交易日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="tradeDate"
                                               id="fundAssetTransfer001_tradeDate" disabled="disabled"
                                               class="layui-input form-input input-dateSelect"
                                               data-th-value='${#dates.format(entity?.tradeDate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <!-- 币种 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select name="ccy" id="fundAssetTransfer001_ccy"
                                                class="layui-input form-input input-select"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue='${entity?.ccy}' disabled="disabled"
                                                data-th-data-result="${CCY}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <!-- 资产代码 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="finprodMarketId"
                                               id="fundAssetTransfer001_finprodMarketId"
                                               class="layui-input form-input" maxlength=60 disabled="disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${entity?.finprodMarketId}'>

                                    </div>
                                </div>
                                <!-- 资产名称 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="finprodAbbr" id="fundAssetTransfer001_finprodAbbr"
                                               class="layui-input form-input" maxlength=60 disabled="disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${entity?.finprodAbbr}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">证券托管户</label>
                                    <div class="layui-input-inline input-inline">
                                        <input disabled type="text" id="secManageAcctId" name="secManageAcctId"
                                               class="layui-input form-input" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.secManageAcctId}"
                                        >
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <!-- 通道 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">通道</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="fundAssetTransfer001_chlId" name="chlId" disabled
                                                class="layui-input form-input input-select" allowClear="true"
                                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true"
                                                data-th-data-url="@{/component/trade/BussChannelCommon/getChannelId}"
                                                data-th-initvalue="${entity?.chlId}">
                                        </select>
                                    </div>
                                </div>
                                <!-- 持仓份额 -->
                                <div id="prinQtyDiv" class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">持仓份额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="tradePrinOrg" id="fundAssetTransfer001_tradePrinOrg"
                                               class="layui-input form-input text-number" disabled="disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-textrange="2" data-th-value='${entity?.tradePrinOrg}'>
                                    </div>
                                </div>
                                <!-- 剩余可转仓份额 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">剩余可转仓份额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="rollablePrin"
                                               id="fundAssetTransfer001_rollablePrin"
                                               class="layui-input form-input text-number" disabled="disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-textrange="2" data-th-value='${entity?.rollablePrin}'>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 拆分信息 -->
                <div class="pro-module-wrap" title="基金类资产转仓">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">基金类资产转仓</span><i
                                    class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <!-- 组合代码 -->
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">组合代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="fundAssetTransfer001_portfolioId" name="portfolioId"
                                                    allowClear="true" required
                                                    parentids="invTransPortf,fundAssetTransfer001_tradeDate,fundAssetTransfer001_chlId,fundAssetTransfer001_ccy,finprodIdOrg,secManageAcctId"
                                                    class="layui-input form-input input-select" maxLength="32"
                                                    data-th-data-url="@{/invest/trade/transfer/fund/FundAssetTransfer001/selectPortfolioId}"
                                                    formatoption=true placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}">
                                            </select>
                                        </div>
                                    </div>
                                    <!-- 交易份额 -->
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">交易份额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="tradePrin" id="fundAssetTransfer001_tradePrin"
                                                   class="layui-input form-input text-number" required
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-textrange="2" data-th-value='${entity?.tradePrin}'>
                                        </div>
                                    </div>
                                    <!--单位净值-->
                                    <div id="unitCprice_div" class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">单位净值</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="fundAssetTransfer001_unitCprice" name="unitCprice"
                                                   disabled="disabled"
                                                   class="layui-input form-input text-number" placeholder="请输入内容"
                                                   data-textrange='4'
                                                   th:placeholder="#{SysCommon.placeholder}" maxlength="10"
                                                   data-th-value='${entity?.unitCprice}'>
                                        </div>
                                    </div>
                                </div>
                                <div id="backNetDiv" class="layui-form-item">
                                    <!-- 待结转份额 -->
                                    <div id="carryOverQtyDiv" class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">待结转份额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="carryOverQty"
                                                   id="fundAssetTransfer001_carryOverQty"
                                                   class="layui-input form-input text-number" disabled="disabled"
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-textrange="2" data-th-value='${entity?.carryOverQty}'>
                                        </div>
                                    </div>
                                    <!-- 交易金额 -->
                                    <div id="tradeAmtDiv" class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">交易金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="tradeAmt" id="fundAssetTransfer001_tradeAmt"
                                                   class="layui-input form-input text-number"
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-textrange="2" data-th-value='${entity?.tradePrin}'>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <div class="layui-col-md6 layui-col-lg6 layui-col-sm6"
                                             style="text-align: center">
                                            <a id="fundAssetTransfer001_btn_add"
                                               class="layui-btn layui-btn-sm btn-create">添加</a>
                                        </div>
                                        <div class="layui-col-md6 layui-col-lg6 layui-col-sm6"
                                             style="text-align: center">
                                            <a id="fundAssetTransfer001_btn_searchInfo"
                                               class="layui-btn layui-btn-sm btn-search">待转仓产品组合查询</a>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <!-- 组合现金、持仓查询 -->
                                    <div id="avaStandardBondPositionDiv" class="page-component"
                                         th:data-path="@{/component/trade/BussTrdAvailableCashQuery/init}"
                                         th:data-params="|{entityName: 'bussTrdAvailableCashQuery'}|"></div>
                                </div>
                                <div class="pro-module-wrap">
                                    <div lass="pro-module" id="listInfo_div">
                                        <h3 class="pro-module-title"><span class="title-des">列表信息</span>
                                            <i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                                        <div class="pro-module-item">
                                            <table class="layui-table" id="fundAssetTransfer001_funAssetTransferDtoList"
                                                   name="funAssetTransferDtoList"></table>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- 风险试算 -->
            			<div th:if="${isEleShow['FundAssetTransfer001_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}" 
            				th:data-params="|{entity: '${riskTrialRetDto}',workflowId:'${workflowId?: ''}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|">
            			</div>
                    </div>
                    <div class="row text-center stepbar">
                        <a th:if="${isEleShow['FundAssetTransfer001_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'"
               				th:id="|${pageId}_btn_risk|" class="layui-btn layui-btn-sm"
               				data-th-text="#{FundAssetTransfer001.risk}">风险试算</a>
                        <a id="FundAssetTransfer001_btn_save" class="layui-btn layui-btn-sm btn-save"
                           data-th-text="#{SysCommon.save}">保存</a>
                        <a id="FundAssetTransfer001_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                           data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="FundAssetTransfer001_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                           data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var sysDate = /*[[${sysDate}]]*/'';
        var PS_T04 = /*[[${PS_T04}]]*/'T04'; // 数据字典.交易方向_买入
        var PS_T19 = /*[[${PS_T19}]]*/'T19'; // 数据字典.交易方向_卖出
        var formTodoList = /*[[${formTodoList}]]*/false;
        var entityData = JSON.parse(/*[[${entityData}]]*/'{}');
        var FUND_ASSET_TYPE_F01 = /*[[${FUND_ASSET_TYPE_F01}]]*/'';//基金资产类型（货币基金）
        var FINPROD_TYPE_F06 = /*[[${FINPROD_TYPE_F06}]]*/'';
        var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
        var fundType = /*[[${entity.fundType}]]*/'';
        var risk_math_switch =/*[[${risk_math_switch}]]*/'';
        var PS_T01 = /*[[${PS_T01}]]*/'T01'; // 数据字典.交易方向_买入
        var PS_T02 = /*[[${PS_T02}]]*/'T02'; // 数据字典.交易方向_卖出
    </script>
    <script data-th-src="@{/js/invest/trade/transfer/fund/FundAssetTransfer001.js}"></script>
</div>
</body>
</html>
