<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{TrdOptionTrade001}">期权交易管理</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a id="TrdOptionTrade001_btn_add" class="layui-btn layui-btn-sm btn-create"><span data-th-text="#{SysCommon.create}"/></a>
        <a id="TrdOptionTrade001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="#{SysCommon.revoke}"/></a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{TrdOptionTrade001.entrustId}">委托代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="entrustId" name="entrustId"
                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-data-url="@{/invest/trade/option/TrdOptionTrade001/getEntrustIdByType}" data-idfield="code"
                               data-keyfield="name"
                               data-th-data-effectivefieldsalias='|{"code":"#{TrdOptionTrade001.entrustId}","shortName":"#{TrdOptionTrade001.entrustId}"}|'
                               >
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{TrdOptionTrade001.portfolioId}">组合代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="portfolioId" name="portfolioId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId}"
                                 >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{TrdOptionTrade001.ps}">交易方向</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="ps" name="ps" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${PS}' allowClear="true" formatoption="true"></select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{TrdOptionTrade001.contractType}">合约类型</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="contractType" name="contractType" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${STRUCTURE_TYPE}' allowClear="true" formatoption="true"></select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TrdOptionTrade001.targetId}">合约标的</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="targetId" name="targetId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/trade/option/TrdOptionTrade001/selectFinprodIdAbbr}"
                                searchable="true" >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{TrdOptionTrade001.exerciseType}">行权方式</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="exerciseType" name="exerciseType" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${EXEC_MODE}' allowClear="true" formatoption="true"></select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{TrdOptionTrade001.tradeDate}">交易日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="tradeDate" name="tradeDate"
                               class="layui-input form-input input-dateRangeSelect" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{TrdOptionTrade001.validStatus}">有效状态</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="validStatus" name="validStatus"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${TRADE_FLOW_STATUS}'
                                allowClear="true" formatoption="true"></select>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/trade/option/TrdOptionTrade001.js}" type="text/javascript"></script>
</div>
</body>
</html>
