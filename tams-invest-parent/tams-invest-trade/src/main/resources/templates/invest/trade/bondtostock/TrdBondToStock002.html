<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title data-th-text="#{TrdBondToStock002}">债转股委托新建</title>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">基本信息</span>
                            （
                            <span class="star-sign">*</span>
                            必填）
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
<!--                        <input type="hidden" id="finprodIdhid" name="finprodId" th:value="${entity?.finprodId}">-->
                        <input type="hidden" id="shareFinprodId" name="shareFinprodId" th:value="${entity?.shareFinprodId}">
                        <input type="hidden" id="finvdate" name="finvdate" >
                        <input type="hidden" id="finmdate" name="finmdate" >
                        <input type="hidden" id="busiCode" name="busiCode" th:value="${entity?.busiCode}"/>
                        <input type="hidden" id="dealSqeId" name="dealSqeId" th:value="${entity?.dealSqeId}"/>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondToStock001.entrustId}">委托代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="entrustId" name="entrustId"
                                               class="layui-input form-input" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.entrustId}" disabled="disabled"/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondToStock001.portfolioId}">组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption=true required="required"
                                                th:disabled="${entity?.entrustId ne '' && entity?.entrustId ne null}"
                                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}"
                                                data-th-initvalue="${entity?.portfolioId}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{TrdBondToStock001.tradeDate}">交易日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input class="layui-input form-input input-dateSelect" id="tradeDate"
                                               name="tradeDate" placeholder="请选择时间"
                                               data-th-value='${#dates.format(entity?.tradeDate,"yyyy-MM-dd")}'
                                               required="required">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondToStock001.finprodId}">转债代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="finprodId" name="finprodId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                required="required" formatoption="true"
                                                th:disabled="${entity?.entrustId ne '' && entity?.entrustId ne null}"
                                                data-th-data-url="@{/invest/entrust/etrbondtostock/EtrBondToStock002/getFinprodIdForAdd}"
                                                data-th-initvalue="${entity?.finprodId}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondToStock001.finprodName}">转债名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodName" name="finprodName"
                                               class="layui-input form-input" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.finprodName}" disabled="disabled">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondToStock001.tradeMarket}">交易场所</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="tradeMarket" name="tradeMarket"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-result="${TRADE_PLACE}" disabled="disabled"
                                                data-th-initvalue="${entity?.tradeMarket}" >
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondToStock001.finprodMarketId}">正股代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodMarketId" name="finprodMarketId"
                                               class="layui-input form-input" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.finprodMarketId}" disabled="disabled">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondToStock001.finprodMarketName}">正股名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodMarketName" name="finprodMarketName"
                                               class="layui-input form-input" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.finprodMarketName}" disabled="disabled">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondToStock001.conShareId}">转股代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="conShareId" name="conShareId"
                                               class="layui-input form-input" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.conShareId}" disabled="disabled">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondToStock001.holdetrPriceTotal}">持有券面总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="holdetrPriceTotal" name="holdetrPriceTotal"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" data-textrange="4"
                                               data-th-value="${entity?.holdetrPriceTotal}" disabled="disabled">
                                        <span class="input-right-show unitNum">万元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondToStock001.conetrPriceTotal}">可转换券面总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="conetrPriceTotal" name="conetrPriceTotal"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" data-textrange="4"
                                               data-th-value="${entity?.conetrPriceTotal}" disabled="disabled">
                                        <span class="input-right-show unitNum">万元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondToStock001.stocketrPriceTotal}">转股券面总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="shareAmt" name="shareAmt"
                                               class="layui-input form-input text-number" placeholder="请输入内容" data-textrange="4"
                                               data-th-placeholder="#{SysCommon.placeholder}" required="required"
                                               th:disabled="${entity?.entrustId ne '' && entity?.entrustId ne null}"
                                               data-th-value="${entity?.shareAmt}">
                                        <span class="input-right-show unitNum">万元</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{TrdBondToStock001.conVdate}">转股起始日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input class="layui-input form-input input-dateSelect" id="convdate"
                                               name="convdate" placeholder="请选择时间"
                                               data-th-value='${#dates.format(entity?.convdate,"yyyy-MM-dd")}'
                                               disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondToStock001.conPrice}">转股价格</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="conPrice" name="conPrice"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.conPrice}" disabled="disabled">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondToStock001.conNum}">转换股数</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="conNum" name="conNum"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.conNum}" disabled="disabled">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondToStock001.spoShareNum}">零股数量</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="spoShareNum" name="spoShareNum"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.spoShareNum}" disabled="disabled">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondToStock001.tradeAmt}">零股折算现金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeAmt" name="tradeAmt"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.tradeAmt}"/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondToStock001.settleDate}">现金到账日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input class="layui-input form-input input-dateSelect" id="settleDate"
                                               name="settleDate" placeholder="请选择时间"
                                               data-th-value='${#dates.format(entity?.settleDate,"yyyy-MM-dd")}'/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondToStock001.firstUnitCprice3}">正股价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="firstUnitCprice3" name="firstUnitCprice3" required
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.firstUnitCprice3}" disabled="disabled">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondToStock001.expConValue}">转股价值</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="expConValue" name="expConValue"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.expConValue}" disabled="disabled">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondToStock001.preb}">转股溢价率</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="preb" name="preb"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.preb}" disabled="disabled">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondToStock001.prec}">纯债溢价率</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="prec" name="prec"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.prec}" disabled="disabled">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrInvestBondInfo002.invAim}">投资目的</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="invAim" name="invAim"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${INV_AIM}' allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                required="required" formatoption="true"
                                                th:disabled="${entity?.entrustId ne '' && entity?.entrustId ne null}"
                                                data-th-initValue="${entity?.invAim}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{TrdBondToStock001.ccy}">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="ccy" name="ccy"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                required="required" data-th-data-result='${CCY}'
                                                th:disabled="${entity?.entrustId ne '' && entity?.entrustId ne null}"
                                                data-th-initvalue="${entity?.ccy}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdConBond002.secManageAcctId}">证券托管户</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="secManageAcctId" name="secManageAcctId" parentIds="portfolioId,tradeMarket,finprodId"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:disabled="${entity?.entrustId ne '' && entity?.entrustId ne null}"
                                                th:placeholder="#{SysCommon.placeholder}"  th:data-url="@{/invest/trade/conbond/TrdConBond002/getSecManageAcctId}"
                                                allowClear="true" th:initValue="${entity?.secManageAcctId}"></select>
                                    </div>
                                </div>
<!--                                <div class="form-inline-wrap">-->
<!--                                    <label class="layui-form-label form-lable" data-th-text="#{invest.channelId}">通道</label>-->
<!--                                    <div class="layui-input-inline input-inline">-->
<!--                                        <select type="text" id="chlId" name="chlId"-->
<!--                                                class="layui-input form-input input-select" allowClear="true"-->
<!--                                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true"-->
<!--                                                th:disabled="${entity?.entrustId ne '' && entity?.entrustId ne null}"-->
<!--                                                data-th-data-url="@{/component/trade/BussChannelCommon/getChannelIdAndCollectType}"-->
<!--                                                data-th-initvalue="${entity?.chlId}">-->
<!--                                        </select>-->
<!--                                    </div>-->
<!--                                </div>-->
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 人员信息 -->
                <div class="page-component" th:data-path="@{/component/trade/TrdInvestPersonInfo002/init}"
                     th:data-params="|{entityName: 'trdInvestPersonInfo', pageFrom: 'submitForm', entity:'${entity_trdInvestPersonInfo}', psId : 'ps', callPageId:'TrdBondToStock002'}|"></div>
                <div id="ramark_DIV" class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">备注</span>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <label class="layui-form-label form-lable" style="width: 11.9%;">备注</label>
                                <div class="layui-input-inline input-inline" style="width: 85% !important;">
                                        <textarea id="remark" name="remark" placeholder="请输入内容"
                                                  data-th-placeholder="#{SysCommon.placeholder}" class="layui-textarea"
                                                  data-th-text="${entity?.remark}"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 划款信息 -->
                <div class="page-component" th:data-path="@{/component/trade/BussTrdTransferOrder/init}" id="bussTrdTransferOrder_div"
                     th:data-params="|{entityName: 'bussTrdTransferOrder', pageFrom: 'submitForm', entity:'${entity_bussRepFinProductInfoDto}', bizCode:'${businessId}'}|">
                </div>
                <!-- 引业务组件附件信息组件 -->
                <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                     th:data-params="|{entityName: 'FileCommon',businessId: '${businessId ?: ''}'}|"></div>
                <!-- 风险试算 -->
                <!-- 风险试算 -->
                 <div th:if="${isEleShow['TrdBondToStock002_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component"
                     th:data-path="@{/component/common/BaseRiskMathComm/init}"
                     th:data-params="|{entity: '${riskTrialRetDto}',workflowId:'${workflowId?: ''}',entityName:'riskTrialRetDto',tradeId:'${businessId}'}|"></div>
                <!-- add by zhangpuyu 2019/10/30 end -->
                <div class="layui-form-item" data-th-if="${entity?.revokeReason}">
                    <div class="layui-inline layui-col-md12 layui-col-sm12 layui-col-lg12 layui-col-xs12">
                        <fieldset class='adver-fieldset'>
                            <legend>撤销理由</legend>
                            <div class="layui-input-block" style="margin-left:0px;">
                        <textarea id="revokeReason" name="revokeReason" data-th-text="${entity?.revokeReason}" placeholder="请输入内容"
                                  class="layui-textarea"></textarea>
                            </div>
                        </fieldset>
                    </div>
                </div>
            </div>
            <div class="pro-module-wrapper pro-module-block">
                <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                    <div class="text-center">
                        <a th:if="${isEleShow['TrdBondToStock002_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'"
                           id="TrdBondToStock002_btn_riskcal" class="layui-btn layui-btn-sm"
                           data-th-text="#{TrdBondToStock001.riskcal}">风险试算</a>
                        <a id="TrdBondToStock002_btn_save" class="layui-btn layui-btn-sm btn-save"
                           data-th-text="#{SysCommon.save}">保存</a>
                        <a id="TrdBondToStock002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                           data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="TrdBondToStock002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                           data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var PS_ZZG = /*[[${PS_ZZG}]]*/'';
        var FINPROD_TYPE_TG_ZQ = /*[[${FINPROD_TYPE_TG_ZQ}]]*/'';
        var PA_TYPE_ZZG = /*[[${PA_TYPE_ZZG}]]*/'';
        var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
        var YES_OR_NO_N =  /*[[${YES_OR_NO_N}]]*/'';
        var ACCT_TYPE_A01 = /*[[${ACCT_TYPE_A01}]]*/'';
        var ACCT_TYPE_A07 = /*[[${ACCT_TYPE_A07}]]*/'';
        var PA_TYPE_ZQMC = /*[[${PA_TYPE_ZQMC}]]*/'';
        var PS_MC = /*[[${PS_MC}]]*/'';
        var GEN_PAY_ORDERS_AUTO= /*[[${GEN_PAY_ORDERS_AUTO}]]*/; // 系统参数_是否显示划款指令
        //是否是来自场内成交匹配交易录单
        var isTranRecord = /*[[${isTranRecord}]]*/'';
        //配置单位 add by yeming 20210723 end
        var entrustAmtUnit = /*[[${entrustAmtUnit}]]*/'';
        //配置单位 add by yeming 20210723 end
    </script>
    <script data-th-src="@{/js/invest/trade/bondtostock/TrdBondToStock002.js}" type="text/javascript"></script>
</div>
</body>
</html>
