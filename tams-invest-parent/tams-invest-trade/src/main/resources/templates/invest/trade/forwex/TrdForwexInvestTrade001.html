<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{TrdForwexInvestTrade001}">外汇远期投资交易管理</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area">
            <a id="TrdForwexInvestTrade001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
            <a id="TrdForwexInvestTrade001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="#{SysCommon.revoke}"></a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdForwexInvestTrade.entrustId}">委托代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="entrustId" name="entrustId"
                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/trade/forwex/TrdForwexInvestTrade001/getEntrustIdByType}" data-idfield="code"
                                data-keyfield="name" data-th-data-effectivefields="code"
                                data-th-data-effectivefieldsalias='|{"code":"#{TrdForwexInvestTrade.entrustId}","shortName":"#{TrdForwexInvestTrade.entrustId}"}|'
                                data-th-value="${entity?.entrustId}" maxlength="50">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdForwexInvestTrade.portfolioId}">组合代码</label>
                        <div class="layui-input-inline input-inline">
	                        <select id="portfolioId" name="portfolioId"
	                                class="layui-input form-input input-select" multiple="true"
	                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId}"
	                                allowClear="true" data-th-placeholder="#{SysCommon.placeholder}" >
	                        </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdForwexInvestTrade.excDealType}">交易类型</label>
	                    <div class="layui-input-inline input-inline">
	                        <select id="excDealType" name="excDealType"  childrenIds="curPair" 
	                                class="layui-input form-input input-select"
	                                data-th-data-result='${EXC_DEAL_TYPE}'
	                                th:initValue="${entity?.excDealType?:EXC_DEAL_TYPE_default}"
	                                allowClear="true" data-th-placeholder="#{SysCommon.placeholder}" >
	                        </select>
	                    </div>
                    </div>
                </div>
                
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdForwexInvestTrade.curPair}">货币对</label>
                        <div class="layui-input-inline input-inline">
	                        <select id="curPair" name="curPair"  parentIds="excDealType"
	                                class="layui-input form-input input-select"
	                                data-th-data-result='${CYY_PAIR}'
	                                allowClear="true" data-th-placeholder="#{SysCommon.placeholder}" >
	                        </select>
	                    </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdForwexInvestTrade.excPs}">交易方向</label>
                        <div class="layui-input-inline input-inline">
	                        <select id="ps" name="ps" multiple
	                                class="layui-input form-input input-select"
	                                data-th-data-result='${PS}'
	                                allowClear="true" data-th-placeholder="#{SysCommon.placeholder}" >
	                        </select>
	                    </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdForwexInvestTrade.deliveryType}">清算模式</label>
                        <div class="layui-input-inline input-inline">
	                        <select id="deliveryType" name="deliveryType" 
	                                class="layui-input form-input input-select"
	                                data-th-data-result='${SETT_MODE}'
	                                allowClear="true" data-th-placeholder="#{SysCommon.placeholder}" >
	                        </select>
	                    </div>
                    </div>
                </div>
                
                
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdForwexInvestTrade.statusValid}">有效状态</label>
                        <div class="layui-input-inline input-inline">
	                        <select id="validStatus" name="validStatus" 
	                                class="layui-input form-input input-select"
	                                data-th-data-result='${TRADE_FLOW_STATUS}'
	                                allowClear="true" data-th-placeholder="#{SysCommon.placeholder}" >
	                        </select>
	                    </div>
                    </div>
                    
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
			             <label class="layui-form-label form-lable" data-th-text="#{TrdForwexInvestTrade.tradeDate}">交易日期</label>
			             <div class="layui-input-inline input-inline">
			                  <input id='tradeDate' name='tradeDate'
	                                class="layui-input form-input input-dateRangeSelect" placeholder="请选择时间区间"
	                                data-th-placeholder="#{SysCommon.placeholder}">
			             </div>
			        </div>
                    
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
			             <label class="layui-form-label form-lable" data-th-text="#{TrdForwexInvestTrade.settleDate}">交割日</label>
			             <div class="layui-input-inline input-inline">
			                  <input id='settleDate' name='settleDate'
	                                class="layui-input form-input input-dateRangeSelect" placeholder="请选择时间区间"
	                                data-th-placeholder="#{SysCommon.placeholder}">
			             </div>
			        </div>
                </div>
                
                
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/trade/forwex/TrdForwexInvestTrade001.js}" type="text/javascript"></script>
        <script data-th-inline="javascript" type="text/javascript">
                                </script>
    </div>
</body>
</html>
