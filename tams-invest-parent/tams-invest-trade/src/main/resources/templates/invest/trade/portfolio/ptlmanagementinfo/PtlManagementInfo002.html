<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinProductModule002}">组合新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <form id="basicInfoForm" class="layui-form joyin-form-wrap pro-module-form">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{PtlManagementInfo001.portfolioId}">组合代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="portfolioId" name="portfolioId" class="layui-input form-input" placeholder="请输入内容" 
                                            		data-th-placeholder="#{SysCommon.placeholder}" maxLength="32"
                                            		required data-th-value="${entity?.portfolioId}">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{PtlManagementInfo001.portfolioName}">组合名称</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="portfolioName" name="portfolioName" 
                                            		class="layui-input form-input" placeholder="请输入内容" 
                                            		data-th-placeholder="#{SysCommon.placeholder}" maxLength="200"
                                            		required data-th-value="${entity?.portfolioName}">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{PtlManagementInfo001.portfolioType}">组合类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="portfolioType" name="portfolioType" 
                                            		class="layui-input form-input input-select" 
                                            		data-th-data-result='${PORTFOLIO_TYPE}' 
                                            		placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" 
                                            		required data-th-initvalue="${entity?.portfolioType}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{PtlManagementInfo001.revenueType}">收益类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="profitType" name="profitType" 
                                            		class="layui-input form-input input-select" 
                                            		data-th-data-result='${PROFIT_TYPE}' 
                                            		placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" 
                                            		required data-th-initvalue="${entity?.profitType}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{PtlManagementInfo002.issueMode}">开放类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="issueMode"  name="issueMode" required="required"
                                                   class="layui-input form-input input-checkbox" 
                                                   data-th-data-result="${ISSUE_MODE}"/>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{PtlManagementInfo002.raisetype}">募集方式</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="raisetype" name="raisetype" required
                                                   class="layui-input form-input input-checkbox" />
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                   <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{PtlManagementInfo002.investType}">投资性质</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="investType" name="investType" 
                                            		class="layui-input form-input input-select" placeholder="请输入内容" 
                                            		data-th-placeholder="#{SysCommon.placeholder}" 
                                            		required data-th-data-result="${INVEST_TYPE}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{PtlManagementInfo001.vDate}">成立日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input id="vdate" name="vdate" 
                                            		class="layui-input form-input input-dateSelect"
                                            		data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{PtlManagementInfo001.mDate}">到期日</label>
                                        <div class="layui-input-inline input-inline">
                                           <input id="mdate" name="mdate" 
                                           		class="layui-input form-input input-dateSelect"
                                           		data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{PtlManagementInfo002.isGuarantee}">是否保本</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="checkbox" id="isGuarantee" name="isGuarantee" 
                                            		lay-skin="switch" data-th-value="${YES}"
                                            		lay-text="是|否" >
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                <!-- 估值信息共通  -->
                <div class="tra-module-wrap" th:replace="/component/prod/ValuationInfo :: body"></div>
                <!-- 证券账户信息共通   -->
				<div class="tra-module-wrap" th:replace="/component/trade/portfolio/SecuritiesAccountInfo :: body"></div>
				<!-- 资金账户信息共通   -->
				<div class="tra-module-wrap" th:replace="/component/trade/portfolio/FundAccountInfo :: body"></div>
				<!-- <form>
					<div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" >
                        		<i class="iconfont icon-folder"></i>
                        			<span data-th-text="#{PtlManagementInfo002.raisetype}">募集方式</span>
                        		</label>
                            <div class="layui-input-inline input-inline">
                                  <input type="text" id="raisetype" name="raisetype" required
                                          class="layui-input form-input input-checkbox" data-th-data-result="${RAISETYPE}"/>
                             </div>
                    </div>
				</form> -->
            </div>
                <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
                    <div class="text-center">
                        <a id="PtlManagementInfo002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                        <a id="PtlManagementInfo002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="PtlManagementInfo002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </div>
    </div>
    <div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
		    var secDto = /*[[${secDto}]]*/'';
		    var funDto = /*[[${funDto}]]*/'';
		</script>
        <script data-th-src="@{/js/invest/trade/portfolio/ptlmanagementinfo/PtlManagementInfo002.js}"></script>
    </div>
</body>
</html>
