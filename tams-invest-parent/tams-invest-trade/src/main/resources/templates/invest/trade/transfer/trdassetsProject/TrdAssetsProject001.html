<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>项目类资产交易转仓</title>
</head>
<body>
<div layout:fragment="content">
    <div class="layui-layer-content ">
        <form class="layui-form" id="TrdAssetsProject001_form">
<!--
            <input hidden type="text" id="invTransPortf" name="invTransPortf" data-th-value="${entity?.invTransPortf}">
-->
            <input hidden type="text" id="calendarId" name="calendarId" data-th-value="${entity?.calendarId}">
            <input hidden type="text" id="tradeId" name="tradeId" data-th-value="${entity?.tradeId}">
            <input hidden type="text" id="secAcctId" name="secAcctId" data-th-value="${entity?.secAcctId}">
            <input hidden type="text" id="projectType" name="projectType" data-th-value="${entity?.projectType}"><!--资产一级分类-->
            <input hidden type="number" id="channelFee" name="channelFee" data-th-value="${entity?.channelFee}">
            <input hidden type="number" id="intAmt" name="intAmt" data-th-value="${entity?.intAmt}">
            <input hidden type="number" id="cpriceAmt" name="cpriceAmt" data-th-value="${entity?.cpriceAmt}">
            <input hidden type="number" id="procedureAmt" name="procedureAmt" data-th-value="${entity?.procedureAmt}">
            <input hidden type="number" id="tradeAmt" name="tradeAmt" data-th-value="${entity?.tradeAmt}">
            <input hidden type="number" id="portfolioName" name="portfolioName" data-th-value="${entity?.portfolioName}">
            <input hidden type="number" id="alSplitPrinAmt" name="alSplitPrinAmt" data-th-value="${entity?.alSplitPrinAmt}"><!--一拆份额-->
            <input hidden type="number" id="alSplitTradeAmt" name="alSplitTradeAmt" data-th-value="${entity?.alSplitTradeAmt}"><!--一拆金额-->
            <input hidden type="number" id="alSplitProcedureAmt" name="alSplitProcedureAmt" data-th-value="${entity?.alSplitProcedureAmt}"><!--一拆手续费-->
            <input hidden type="number" id="alSplitChannelFee" name="alSplitChannelFee" data-th-value="${entity?.alSplitChannelFee}"><!--一拆通道费-->
            <input hidden type="number" id="alSplitIntAmt" name="alSplitIntAmt" data-th-value="${entity?.alSplitIntAmt}"><!--一拆利息总额-->
            <input hidden type="number" id="unitFprice" name="unitFprice" data-th-value="${entity?.unitFprice}"><!--全价-->
            <input hidden type="number" id="unitIntAmt" name="unitIntAmt" data-th-value="${entity?.unitIntAmt}"><!--单位应计利息-->
            <input hidden type="text" id="basis" name="basis" data-th-value="${entity?.basis}"><!-- 计息基础 -->
            <input hidden type="number" id="unitCprice" name="unitCprice" data-th-value="${entity?.unitCprice}"><!--全价-->
            <input hidden type="date" id="vdate" name="vdate" data-th-value="${entity?.vdate}"><!--起息日-->
            <input hidden type="date" id="mdate" name="mdate" data-th-value="${entity?.mdate}"><!--到期日-->
            <input name="liBranch" data-th-value='${entity?.liBranch}' hidden>
            <input name="isNeedAssign" data-th-value='${entity?.isNeedAssign}' hidden>
            <input type="number" data-textrange="2" id = "assignIntamt" name="assignIntamt" data-th-value='${entity?.assignIntamt}' hidden>
            
            <input id="finprodType2" name="finprodType2" data-th-value="${FINPROD_TYPE_F18}" hidden>
            <input id="ps" name="ps" data-th-value="${T02}" hidden>

            <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">交易信息</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">转出组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="invTransPortf" name="invTransPortf"
                                                disabled class="layui-input form-input input-select"
                                                data-th-data-url="@{/invest/trade/transfer/assetstransfer/AssetsTransfer001/getPortfolioId}"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:initValue="${entity?.invTransPortf}"
                                                placeholder="请输入内容">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交易日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="tradeDate" name="tradeDate"
                                               class="layui-input form-input input-dateSelect"
                                               data-th-value="${entity?.tradeDate eq null ? platDate : #dates.format(entity?.tradeDate,'yyyy-MM-dd')}" disabled >
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交割日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="settleDate" name="settleDate" class="layui-input form-input input-dateSelect hidden" disabled
                                               data-th-value="${entity?.settleDate eq null ? platDate : #dates.format(entity?.settleDate,'yyyy-MM-dd')}"/>
                                               
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input disabled id="finprodMarketId" name="finprodMarketId" class="layui-input form-input"
                                               th:placeholder="#{SysCommon.placeholder}" allowClear="true" th:value="${entity?.finprodMarketId}"></input>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input disabled id="finprodName" name="finprodName" class="layui-input form-input" th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.finprodName}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="ccy" name="ccy" class="layui-input form-input input-select" formatoption="false" disabled
                                                data-th-placeholder="#{SysCommon.placeholder}" allowClear="false"
                                                data-th-data-result='${CCY}' data-th-initValue='*{entity?.ccy?:CCY_default}'>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">计提利率</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" id="finprodId" name="finprodId" data-th-value="${entity?.finprodId}"/>
                                        <input type="text" id="investRate" name="investRate" class="layui-input form-input text-number"
                                               data-textrange="8"
                                               data-th-value="${entity?.investRate}" disabled/>
                                        <span class="input-right-show">%</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">业务模式</label>
                                    <div class="layui-input-inline input-inline">
                                        <select disabled type="text" id="invAim" name="invAim"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${BUSINESS_MODEL}'
                                                allowClear="true" formatoption="true"
                                                th:initValue="${entity?.invAim}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">本金金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input disabled type="text" id="prinAmt" name="prinAmt" placeholder="请输入内容" class="layui-input form-input text-number"
                                               data-th-value="${entity?.prinAmt}" data-textrange="2" data-pattern=""/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">剩余可转仓本金金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="unSplitPrinAmt" name="unSplitPrinAmt"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" data-textrange="2"
                                               data-th-value="${entity?.unSplitPrinAmt}" disabled >
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <!-- <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">待转让本金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input disabled id="assignPrinamt" name="assignPrinamt" class="layui-input form-input text-number"
                                               data-th-value="${entity?.assignPrinamt}" data-textrange="2"/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div> -->
<!--                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">待转让利息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input disabled id="assignIntamt" name="assignIntamt" class="layui-input form-input text-number"
                                               data-th-value="${entity?.assignIntamt}" data-textrange="2"/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>-->
                            </div>
                        </div>
                    </div>
            </div>
            <div class="pro-module-wrap">
                    <div lass="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">项目类资产转仓</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="portfolioId" name="portfolioId"
                                                parentids="invTransPortf,secAcctId,tradeDate,ccy"
                                                allowClear="true"
                                                class="layui-input form-input input-select" maxLength="32"
                                                data-th-data-url="@{/invest/trade/transfer/trdassetsProject/TrdAssetsProject001/selectPortfolioId}"
                                                formatoption = true placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" required >
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">本金金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="splitPrinAmt" name="splitPrinAmt"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" data-textrange="2"
                                               data-th-value="${entity?.splitPrinAmt}" required >
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">应计利息总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="splitIntAmt" data-textrange="2"  name="splitIntAmt" data-th-value="${entity?.splitIntAmt}" class="layui-input form-input text-number" disabled/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" id="commissionAmt_div">
                                    <label class="layui-form-label form-label-wrap">交易金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="splitTradeAmt" name="splitTradeAmt" class="layui-input form-input text-number" data-th-value="${entity?.splitTradeAmt}"/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" id="turnInvAim_div">
	                                <label class="layui-form-label form-label-wrap">转仓业务模式</label>
	                                <div class="layui-input-inline input-inline">
	                                    <select type="text" id="turnInvAim" name="turnInvAim"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${TURN_INV_AIM}'
                                                allowClear="true" formatoption="true"  th:initValue="${entity?.turnInvAim}">
                                        </select>
	                                </div>
		                        </div>
                            </div>
                                 
<!--                            &lt;!&ndash; 组合现金、持仓查询 &ndash;&gt;-->
<!--                            <div id="avaStandardBondPositionDiv" class="page-component" th:data-path="@{/component/trade/BussTrdAvailableCashQuery/init}"-->
<!--                                 th:data-params="|{entityName: 'bussTrdAvailableCashQuery'}|"></div>     -->

                            <div class="layui-form-item">
                                <div class="form-inline-wrap" id="portoAvailable">
                                    <label class="layui-form-label form-label-wrap">组合可用现金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="portoAvailableAmt" name="portoAvailableAmt"
                                               class="layui-input form-input text-number" disabled="disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}" data-textrange="2">
                                    </div>
                                </div>
                            </div>

                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <a id="TrdAssetsProject001_btn_add" class="layui-btn layui-btn-sm">添加</a>
                                    <a id="TrdAssetsProject001_btn_searchInfo" class="layui-btn layui-btn-sm btn-search">待转仓产品组合查询</a>

                                </div>
                            </div>
                        </div>
                    </div>
            </div>
            <div class="pro-module-wrap">
                <div lass="pro-module" id="listInfo_div">
                    <h3 class="pro-module-title"><span class="title-des">列表信息</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <table class="layui-table" id="projectListInfoList" name="projectListInfoList"></table>
                    </div>
                </div>
            </div>
            
            <!-- 划款指令 -->
            <div id="BussTrdTransferOrder" class="page-component" th:data-path="@{/component/trade/BussTrdTransferOrder/init}" th:data-params="|{entityList: '${bussTrdTransferOrder}',entityName:'bussTrdTransferOrder', isMulti : 'Y',bizCode:'2222'}|"></div>
            
            <!-- 风险试算 -->
            <div th:if="${isEleShow['TrdAssetsProject001_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}" 
            	th:data-params="|{entity: '${riskTrialRetDto}',workflowId:'${workflowId?: ''}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|">
            </div>
        </form>
        <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
            <div class="row text-center" style="margin: 20px 0;">
                <a th:if="${isEleShow['TrdAssetsProject001_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'"
               		th:id="|${pageId}_btn_risk|" class="layui-btn layui-btn-sm"
               		data-th-text="#{TrdAssetsProject001.risk}">风险试算</a>
                <a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save"
                                       th:text="#{SysCommon.save}">保存</a>
                <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit"
                                       th:text="#{SysCommon.submit}">提交</a>
                <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel"
                                       th:text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var entity = /*[[${entity}]]*/'';
        var T01 = /*[[${T01}]]*/'';
        var T02 = /*[[${T02}]]*/'';
        var risk_math_switch = /*[[${risk_math_switch}]]*/'';
        var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
        var FINPROD_TYPE_F18 = /*[[${FINPROD_TYPE_F18}]]*/'';
        var entityData = JSON.parse(/*[[${entityData}]]*/'{}');
        var formTodoList = /*[[${formTodoList}]]*/false;
    </script>
    <script data-th-src="@{/js/invest/trade/transfer/trdassetsProject/TrdAssetsProject001.js}"></script>
</div>
</body>
</html>
