<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorator="~{layout/default}">
<head>
    <title data-th-text="#{[#pageId]}">[#title]</title>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
    <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">基本信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <input type="hidden" id="finmdate" name="finmdate" >
                        <input type="hidden" id="calendarId" name="calendarId" th:value="${entity?.calendarId}">
                        <input type="hidden" id="bizCode" name="bizCode" data-th-value="${entity?.bizCode}"/>
                        <input type="hidden" id="entrustId" name="entrustId" th:value="${entity?.entrustId}" />
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">清算速度</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required id="settleSpeed" name="settleSpeed" class="layui-input form-input input-select" placeholder="请输入内容" allowClear="false" formatoption="true"
                                                th:data-result='${ACCOUNT_SPEED}'
                                                th:initValue="${entity?.settleSpeed}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交易日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeDate" name="tradeDate" required disabled class="layui-input form-input input-dateSelect" placeholder="请输入日期"
                                               data-th-value="${entity?.tradeDate}"/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanRateInvestTrade002.settleDate}">交割日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="settleDate" name="settleDate" required class="layui-input form-input input-dateSelect hidden" disabled
                                               data-th-value='${entity?.settleDate}'/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="finprodMarketId" name="finprodMarketId" class="layui-input form-input input-select"
                                                th:placeholder="#{SysCommon.placeholder}" allowClear="true"  
                                                th:data-url="@{/invest/trade/project/TrdProjectInvestTrade001/getFinprodMarketId}" th:initValue="${entity?.finprodMarketId}"></select>
                                    </div>
                                </div>
                                <div style="display: none" class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">资产类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="projectType" name="projectType" class="layui-input form-input input-select" allowClear="false" disabled
                                                data-th-data-result='${ASSET_TYPE_PROJECT}' data-th-initValue="${entity?.projectType}">
                                        </select>
                                    </div>
                                </div>
                                <!-- 项目类资产五级分类改造 modify by renping 2019-08-01 start -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{TrdProjectInvestTrade002.type9}">资产二级分类</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="type9" name="type9" class="layui-input form-input input-select" allowClear="true" disabled
                                                data-th-data-result='${CUSTOM_ASSET_TYPE_TWO}' data-th-initValue="${entity?.type9}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{TrdProjectInvestTrade002.type10}">资产三级分类</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="type10" name="type10" class="layui-input form-input input-select" allowClear="true" disabled
                                                data-th-data-result='${CUSTOM_ASSET_TYPE_THREE}' data-th-initValue="${entity?.type10}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" id="selector5">
                                    <label class="layui-form-label form-lable" data-th-text="#{TrdProjectInvestTrade002.type11}">资产四级分类</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="type11" name="type11" class="layui-input form-input input-select" allowClear="true" disabled
                                                data-th-data-result='${CUSTOM_ASSET_TYPE_FOUR}' data-th-initValue="${entity?.type11}">
                                        </select>
                                    </div>
                                </div>
                                <!-- 项目类资产五级分类改造 modify by renping 2019-08-01 end -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required disabled id="finprodName" name="finprodName" class="layui-input form-input" th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.finprodName}">
                                        <span class="input-right-show" style="top: -1px; right: 21px;">
                                            <a id="TrdProjectInvestTrade001_btn_view" class="layui-btn layui-btn-sm" data-ignore="true">查看</a>
                                        </span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交易方向</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="ps" name="ps" class="layui-input form-input input-checkbox" required
                                               data-th-data-result='${PS}' data-th-initValue="${entity?.ps ?:'T01'}"/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable" data-th-text="#{invest.channelId}">合作资产</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="chlId" name="chlId" disabled
                                                class="layui-input form-input input-select" allowClear="false"
                                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true" parentIds='finprodMarketId'
                                                data-th-initvalue="${entity?.chlId}">
                                        </select>
                                    </div>
                                </div>
                                <!-- 投资目的 add by yzg 20201019 start-->
                                	<!--<div class="form-inline-wrap" id = "invAimDiv">
	                                    <label class="layui-form-label form-lable"
	                                           data-th-text="#{EtrInvestBondInfo002.invAim}">投资目的</label>
	                                    <div class="layui-input-inline input-inline">
	                                        <select type="text" id="invAim" name="invAim"
	                                                class="layui-input form-input input-select"
	                                                data-th-data-result='${INV_AIM}' allowClear="true"
	                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
	                                                required="required" formatoption="true"
	                                                data-th-initValue="${entity?.invAim}">
	                                        </select>
	                                    </div>
                                	</div>-->
                                    <!-- 投资目的 add by yzg 20201019 end-->
                                <!-- 投资目的替换为业务模式 add by gwl at 20220113 start -->
                                <div class="form-inline-wrap" id="businessModelDiv">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{EtrBondFirstLBidding002.businessModel}">业务模式</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="businessModel" name="invAim"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${BUSINESS_MODEL}' allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                required="required" formatoption="true"
                                                data-th-initValue="${entity?.invAim}">
                                        </select>
                                    </div>
                                </div>
                                <!-- 投资目的替换为业务模式 add by gwl at 20220113 end -->
                            </div>
                        </div>
                    </div>

                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title"><span class="title-des">金额信息</span><i
                                    class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">币种</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="ccy" name="ccy" class="layui-input form-input input-select" formatoption="false" disabled
                                                    data-th-placeholder="#{SysCommon.placeholder}" required allowClear="false"
                                                    data-th-data-result='${CCY}' data-th-initValue='*{entity?.ccy?:CCY_default}'>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable">本金金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input required type="text" id="prinAmt" name="prinAmt" placeholder="请输入内容" class="layui-input form-input text-number"
                                                   data-th-value="${entity?.prinAmt}" data-textrange="2" data-pattern=""/>
                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{EtrInvestBondInfo002.price}">净价</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="unitCprice" name="unitCprice" placeholder="请输入内容" class="layui-input form-input text-number" disabled
                                                   data-th-value="${entity?.unitCprice}" data-textrange="6" data-pattern=""/>
                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">单位应计利息</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="unitIntAmt" data-textrange="4"  name="unitIntAmt" data-th-value="${entity?.unitIntAmt}" class="layui-input form-input text-number" disabled/>
                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" >全价</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="unitFprice" name="unitFprice" data-textrange="4" data-th-value="${entity?.unitFprice}" class="layui-input form-input text-number" disabled/>
                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" >净价总额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="cpriceAmt" name="cpriceAmt" class="layui-input form-input text-number" th:value="${entity?.cpriceAmt}" disabled/>
                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">应计利息总额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="intAmt" name="intAmt" class="layui-input form-input text-number" th:value="${entity?.intAmt}"/>
                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">实付金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="hidden" id="fpriceAmt" name="fpriceAmt" />
                                            <input type="text" id="tradeAmt" name="tradeAmt" class="layui-input form-input text-number" data-th-value="${entity?.tradeAmt}" />
                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">计提利率%</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="hidden" id="basis" name="basis" data-th-value="${entity?.basis}"/>
                                            <input type="hidden" id="finprodId" name="finprodId" data-th-value="${entity?.finprodId}"/>
                                            <input type="text" id="investRate" name="investRate" class="layui-input form-input text-number"
                                                   data-textrange="8"
                                                   data-th-value="${entity?.investRate}" disabled/>
                                            <span class="input-right-show">%</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">手续费率</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="commissionRate" name="commissionRate" class="layui-input form-input text-number" data-th-value="${entity?.commissionRate}" disabled/>
                                            <span class="input-right-show">%</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">手续费</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="commissionAmt" name="commissionAmt" data-th-value="${entity?.commissionAmt}" class="layui-input form-input text-number" disabled/>
                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" id="channelFee_div" style="display: none">
                                        <label class="layui-form-label form-label-wrap" data-th-text="|#{invest.channelId}#{TrdDepoDuration002.channelFee}|">合作资产费</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="channelFee" name="channelFee" data-th-value="${entity?.channelFee}" class="layui-input form-input text-number"/>
                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    </div>
                    <!-- 组合分配 -->
	                <div class="pro-module-wrap" id="bussTrdTransfenpei_div"  name="bussTrdTransfenpeiDto">
					<div class="pro-module">
					<h3 class="pro-module-title"><span class="title-des">组合分配</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
						<div class="pro-module-item">
	                        <div class="layui-form-item">
	                            <div class="form-inline-wrap">
	                                <label class="layui-form-label form-label-wrap"
	                                       data-th-utext="#{BussRepoSecPtl.distribution}">分配方式</label>
	                                <div class="layui-input-inline input-inline">
	                                    <select disabled type="text" th:id="TrdProjectInvestTrade003_distribution"
	                                            th:name="TrdProjectInvestTrade003_distribution"
	                                            class="layui-input form-input input-select"
	                                            placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
	                                            allowClear="true" formatoption="true"
	                                            th:data-result='${DISTRIBUTION}'
	                                            >
	                                    </select>
	                                </div>
	                            </div>
	                            <div class="form-inline-wrap">
	                                <a class="layui-btn layui-btn-sm btn-create layui-btn-disabled" th:id="TrdProjectInvestTrade003_btn_autoAllocation">
	                                    <i class="iconfont icon-found"></i><span
	                                        data-th-utext="#{BussRepoSecPtl.autoAllocation}">自动分配</span></a>
	                            </div>
	                        </div>
							<div class ="bussTrdTransfenpeiTable_div">
								<table th:title ="#{BussTrdTransfenpei}" class="layui-table" id="bussTrdTransfenpeiTable" name="bussTrdTransfenpeiDto"></table>
							</div>
						</div>
					</div>
				</div>
                <!-- 人员信息 -->
                <div class="page-component" th:data-path="@{/component/trade/TrdInvestPersonInfo002/init}" th:data-params="|{entity: '${TrdInvestPersonInfo003Dto}',entityName:'trdInvestPersonInfo', psId : 'ps'}|"></div>
                <!-- 划款信息 -->
                <div class="page-component" th:data-path="@{/component/trade/BussTrdTransferOrder/init}" id="bussTrdTransferOrder_div"
                     th:data-params="|{entityName: 'bussTrdTransferOrder', pageFrom: 'informationForm', entity:'${entity_bussTrdTransferOrderDto}', bizCode:'${entity?.bizCode}'}|"></div>
                <!-- 附件信息 -->
                <div class="page-component" th:data-path="@{/component/core/FileCommon/init}" th:data-params="|{entityName: 'fileCommonDto', businessId: '${tradeId ?: ''}'}|"></div>
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">交易备注</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                    <textarea id="remark" name="remark" data-th-text="${entity?.remark}" placeholder="请输入内容" class="layui-textarea"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 风险试算 -->
				<div th:if="${isEleShow['TrdProjectInvestTrade003_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}" th:data-params="|{entity: '${riskTrialRetDto}',entityName:'riskTrialRetDto',workflowId:'${workflowId?: ''}',tradeId:'${tradeId}',tradeSource:'1'}|"></div>
            </div>
        <div class="row text-center" style="margin: 30px 0;">
            <a th:if="${isEleShow['TrdProjectInvestTrade003_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'" th:id="|${pageId}_btn_risk|" class="layui-btn layui-btn-sm" data-th-text="#{TrdFundInvestTrade002.risk}">风险试算</a>
            <a id="TrdProjectInvestTrade002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="TrdProjectInvestTrade002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="TrdProjectInvestTrade002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </form>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var F18 = /*[[${F18}]]*/'';
        var T01 = /*[[${T01}]]*/'';
        var T02 = /*[[${T02}]]*/'';
        var T40 = /*[[${T40}]]*/'';
        var finprodId = /*[[${entity?.finprodId}]]*/'';
        var ps = /*[[${entity?.ps}]]*/'';
        var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
        var bussTrdTransferOrderDtos = /*[[${entity?.bussTrdTransferOrder}]]*/'';
        var SETTLE_SPEED01 = /*[[${SETTLE_SPEED01}]]*/'';
        var SETTLE_SPEED02 = /*[[${SETTLE_SPEED02}]]*/'';
        var SETTLE_SPEED03 = /*[[${SETTLE_SPEED03}]]*/'';
        var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
        var FINPROD_TYPE_F18 = /*[[${FINPROD_TYPE_F18}]]*/'';
        //退回的流程重新提交的时候不用再进行金额校验 yjm  20190725
        var workflowId = /*[[${workflowId}]]*/'';
        var collectType_01 = /*[[${collectType_01}]]*/'';
        var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
        var ACCT_TYPE_A01 = /*[[${ACCT_TYPE_A01}]]*/'';
        var ACCT_TYPE_A07 = /*[[${ACCT_TYPE_A07}]]*/'';
        var INV_AIM= /*[[${INV_AIM}]]*/'';
        var GEN_PAY_ORDERS_AUTO= /*[[${GEN_PAY_ORDERS_AUTO}]]*/''; // 系统参数_是否显示划款指令
        //展示投资目的或业务模式参数
        // var SHOW_INVAIM_OR_BUSSINSSMODEL =  /*[[${SHOW_INVAIM_OR_BUSSINSSMODEL}]]*/'';
    </script>
    <script data-th-src="@{/js/component/common/TradeCommon.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/invest/asset/channel/ChannelAssetCommon.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/invest/trade/project/TrdProjectInvestTrade003.js}" type="text/javascript"></script>
</div>
</body>

</html>
