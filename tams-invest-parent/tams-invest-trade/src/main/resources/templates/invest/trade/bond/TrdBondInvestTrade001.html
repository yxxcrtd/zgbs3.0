<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorator="~{layout/default}">

<head>
    <title data-th-text="#{TrdBondInvestTrade001}">债券交易管理</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="form-button-area">
            <a th:id="|${pageId}_btn_add|" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
            <a id="TrdBondInvestTrade003_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create.ptl}">新建</a>
            <a th:id="|${pageId}_btn_revoke|" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="#{SysCommon.revoke}"></a>
            <!-- add by zengchengfa 20210803 start 导出pdf -->
			<a th:id="|${pageId}_btn_export_pdf|" class="layui-btn layui-btn-sm btn-default" >导出PDF单据</a>
			<!-- add by zengchengfa end -->
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdBondInvestTrade001.entrustId}">委托代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="entrustId" name="entrustId"
                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/trade/bond/TrdBondInvestTrade001/getEntrustIdByType}" data-idfield="code"
                                data-keyfield="name"
                                data-th-data-effectivefieldsalias='|{"code":"#{TrdBondInvestTrade001.entrustId}","shortName":"#{TrdBondInvestTrade001.entrustId}"}|'
                                data-th-value="${entity?.entrustId}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdBondInvestTrade001.portfolioId}">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <!-- <input type="text" id="portfolioId" name="portfolioId"
                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/business/common/CommonSelect/getPortfolioId}"
                                data-idfield="code" data-keyfield="name"
                                data-th-data-effectivefieldsalias='|{"code":"#{TrdBondInvestTrade001.portfolioId}","shortName":"#{TrdBondInvestTrade001.portfolioName}"}|'
                                data-th-value="${entity?.portfolioId}"
                                multiple="true" > -->
                            <select type="text" id="portfolioId" name="portfolioId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId}"
                                data-th-value="${entity?.portfolioId}"
                                multiple="true" >
                             </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                            data-th-text="#{TrdBondInvestTrade001.finprodId}">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="finprodId" name="finprodId"
                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/business/common/CommonSelect/getFinprodAbbr(pageId=${pageId})}"
                                data-idfield="hidCode" data-keyfield="code"
                                data-th-data-effectivefieldsalias='|{"code":"#{TrdBondInvestTrade001.finprodId}","shortName":"#{TrdBondInvestTrade001.finprodName}"}|'
                                data-th-value="${entity?.finprodMarketId}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdBondInvestTrade001.tradeMarket}">交易场所</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="tradeMarket" name="tradeMarket"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${TRADE_PLACE}'
                                allowClear="true" formatoption="true" data-th-initValue="${entity?.tradeMarket}"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                            data-th-text="#{TrdBondInvestTrade001.tradeMarketMode}">交易市场</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="tradeMarketMode" name="tradeMarketMode"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${SHARES_TRADE_MARKET}' allowClear="true" formatoption="true"
                                data-th-initValue="${entity?.tradeMarketMode}"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdBondInvestTrade001.tradePlat}">交易平台</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="tradePlat" name="tradePlat"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${SHARES_TRADE_PLATFORM}'
                                allowClear="true" formatoption="true" data-th-initValue="${entity?.tradePlat}"></select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdBondInvestTrade001.ps}">交易方向</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="ps" name="ps" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${PS}' allowClear="true" formatoption="true"
                                data-th-initValue="${entity?.ps}"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdBondInvestTrade001.validStatus}">有效状态</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="validStatus" name="validStatus"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${TRADE_FLOW_STATUS}'
                                allowClear="true" formatoption="true" data-th-initValue="${entity?.validStatus}"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdBondInvestTrade001.tradeDate}">交易日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="tradeDate" name="tradeDate"
                                class="layui-input form-input input-dateRangeSelect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-value="${#dates.format(entity?.tradeDate,'yyyy-MM-dd')}">
                        </div>
                    </div>
                </div>
                <!--添加登记托管机构、剩余期限 add by lishuping 20191010 start-->
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdBondInvestTrade001.registOrg}">登记托管机构</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="registOrg" name="registOrg"
                                   class="layui-input form-input input-select"
                                   data-th-data-result='${REGIST_ORG}' allowClear="true" placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                    formatoption=true data-th-initValue="${entity?.registOrg}"></select>
                        </div>
                    </div>
                    <!--隐藏剩余期限查询条件 update by zoujiamin 20210302 start-->
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4" style="display: none;">
                        <!--隐藏剩余期限查询条件 update by zoujiamin 20210302 end-->
                        <label class="layui-form-label form-lable" data-th-text="#{TrdBondInvestTrade001.endDays1}">剩余期限</label>
                        <div class="layui-input-inline input-inline">
                            <nobr>
                                <input type="text" id="endDays1Start" name="endDays1Start"
                                       class="form-input text-number rateCal" placeholder="请输入内容"
                                       data-th-placeholder="#{SysCommon.placeholder}"
                                       data-th-value="${entity?.endDays1}" data-textrange="2" data-fixtype="2"
                                       style="width:42%; padding-left: 10px;">
                                <label style ="width:4%;display:inline-block;text-align:center" >-</label>
                                <input type="text" id="endDays1End" name="endDays1End"
                                       class="form-input text-number rateCalN" placeholder="请输入内容"
                                       data-th-placeholder="#{SysCommon.placeholder}"
                                       data-th-value="${entity?.endDays1}" data-textrange="2" data-fixtype="2"
                                       style="width:42%; padding-left: 10px;">
                            </nobr>
                        </div>
                    </div>
                    <div class="form-inline-wrap" id="chlFinprodId_div">
                        <label class="layui-form-label form-label-wrap"
                               th:text="#{TrdBondInvestTrade001.chlFinprodId}">合作资产</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="chlFinprodId" name="chlFinprodId"
                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                    th:placeholder="#{SysCommon.placeholder}"  th:data-url="@{/invest/asset/channel/ChannelAsset001/getSecAcctId}"
                                    allowClear="true"
                                    multiple="true"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdInvestDealQuery001.fTradeId}">成交编号 </label>
							<div class="layui-input-inline input-inline">
								<input id="fTradeId" name="fTradeId" 
									class="layui-input form-input" allowClear="true" placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"/>
							</div>
					</div>
                </div>
                <!--添加登记托管机构、剩余期限 add by lishuping 20191010 end-->
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
            var fTradeId = /*[[${fTradeId}]]*/'';
            var cstpEntrustId = /*[[${entrustId}]]*/'';
            var IS_QUERY_ASSETS_LOSS = /*[[${IS_QUERY_ASSETS_LOSS}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/trade/bond/TrdBondInvestTrade001.js}" type="text/javascript"></script>
    </div>
</body>

</html>
