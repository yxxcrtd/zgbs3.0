<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{BuyOutRepoTransfer001}">买断式回购交易转仓</title>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
        <form class="layui-form" id="buyOutRepoTransferForm">
            <!-- 隐藏字段 待转出组合 -->
<!--
            <input type="text" id = "portfolioIdOut" name="portfolioIdOut" data-th-value='${entity?.portfolioIdOut}' hidden>
-->
            <!-- 隐藏字段 首次净价 -->
            <input type="text" id = "unitCprice" name="unitCprice" data-th-value='${entity?.unitCprice}' hidden>
            <!-- 隐藏字段 到期净价 -->
            <input type="text" id = "mUnitCprice" name="mUnitCprice" data-th-value='${entity?.mUnitCprice}' hidden>
            <!-- 隐藏字段 到期应计利息 -->
            <input type="text" id = "mUnitInt" name="mUnitInt" data-th-value='${entity?.mUnitInt}' hidden>
            <!-- 隐藏字段 到期全价 -->
            <input type="text" id = "mUnitFprice" name="mUnitFprice" data-th-value='${entity?.mUnitFprice}' hidden>
            <!-- 隐藏字段 通道 -->
            <input type="text" id = "chlId" name="chlId" data-th-value='${entity?.chlId}' hidden>
            <!-- 隐藏字段 证券托管账户 -->
            <input type="text" id = "secManageAcctId" name="secManageAcctId" data-th-value='${entity?.secManageAcctId}' hidden>
            <!-- 隐藏字段 交易日历编号 -->
            <input type="text" id = "calendarId" name="calendarId" data-th-value='${entity?.calendarId}' hidden>
            <!-- 隐藏字段 资产金融产品代码 -->
            <input type="text" id = "finprodId" name="finprodId" data-th-value='${entity?.finprodId}' hidden>
            <!-- 隐藏字段 到期结算金额 -->
            <input type="text" id = "dueSettleAmtS" name="dueSettleAmtS" data-th-value='${entity?.dueSettleAmtS}' hidden>
            <!-- 隐藏字段 清算速度 -->
            <input type="text" id = "settleSpeed" name="settleSpeed" data-th-value='${entity?.settleSpeed}' hidden>
            <!-- 隐藏字段 已转仓的到期结算金额 -->
            <input type="text" id = "mAmt" name="mAmt" data-th-value='${entity?.mAmt}' hidden>
            <!-- 隐藏字段 回购期限 -->
            <input type="text" id = "repoterm" name="repoterm" data-th-value='${entity?.repoterm}' hidden>
            <!-- 隐藏字段 交易市场 -->
            <input type="text" id = "tradeMarket" name="tradeMarket" data-th-value='${entity?.tradeMarket}' hidden>
            <!-- 隐藏字段 原交易编号 -->
            <input type="text" id = "tradeId" name="tradeId" data-th-value='${entity?.tradeId}' hidden>
            <!-- 隐藏字段 质押率 -->
            <input type="text" id = "pledgeRatio" name="pledgeRatio" data-th-value='${entity?.pledgeRatio}' hidden>

            <div class="pro-module-wrapper pro-module-base" title="基本信息">
                <!-- 交易信息 -->
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">基本信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">转出组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="portfolioIdOut" name="portfolioIdOut"
                                                disabled class="layui-input form-input input-select"
                                                data-th-data-url="@{/invest/trade/transfer/assetstransfer/AssetsTransfer001/getPortfolioId}"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:initValue="${entity?.portfolioIdOut}"
                                                placeholder="请输入内容">
                                        </select>
                                    </div>
                                </div>
                                <!-- 交易日期 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交易日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="tradeDate"
                                               id="BuyOutRepoTransfer001_tradeDate" disabled = "disabled"
                                               class="layui-input form-input input-dateSelect"
                                               data-th-value='${#dates.format(entity?.tradeDate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <!-- 交易方向 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交易方向</label>
                                    <div class="layui-input-inline input-inline">
                                        <select name="ps" id="BuyOutRepoTransfer001_ps"
                                                class="layui-input form-input input-select"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue='${entity?.ps}' disabled = "disabled"
                                                data-th-data-result="${BACK_LEND_DIRECTION}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <!-- 标的资产代码 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">标的资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="finprodMarketId" id="BuyOutRepoTransfer001_finprodMarketId"
                                               class="layui-input form-input" maxlength=60 disabled = "disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${entity?.finprodMarketId}'>
                                    </div>
                                </div>
                                <!-- 标的资产简称 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">标的资产简称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="finprodAbbr" id="BuyOutRepoTransfer001_finprodAbbr"
                                               class="layui-input form-input" maxlength=60 disabled = "disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${entity?.finprodAbbr}'>
                                    </div>
                                </div>
                                <!-- 期限品种 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">期限品种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select name="termType" id="BuyOutRepoTransfer001_termType"
                                                class="layui-input form-input input-select"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue='${entity?.termType}' disabled = "disabled"
                                                data-th-data-result="${TERM_TYPE_REBACK}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <!-- 起息日 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">起息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="vdate"
                                               id="BuyOutRepoTransfer001_vdate" disabled = "disabled"
                                               class="layui-input form-input input-dateSelect"
                                               data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <!-- 到期日 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">到期日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="mdate"
                                               id="BuyOutRepoTransfer001_mdate" disabled = "disabled"
                                               class="layui-input form-input input-dateSelect"
                                               data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <!-- 计息基础 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">计息基础</label>
                                    <div class="layui-input-inline input-inline">
                                        <select name="basis" id="BuyOutRepoTransfer001_basis"
                                                class="layui-input form-input input-select"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue='${entity?.basis}' disabled = "disabled"
                                                data-th-data-result="${BASIS}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <!-- 实际占款天数 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">实际占款天数</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="actCapDays" id="BuyOutRepoTransfer001_actCapDays"
                                               class="layui-input form-input text-number" disabled = "disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-textrange="0" data-th-value='${entity?.actCapDays}'> <span class="input-right-show">天</span>
                                    </div>
                                </div>
                                <!-- 币种 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select name="ccy" id="BuyOutRepoTransfer001_ccy"
                                                class="layui-input form-input input-select"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue='${entity?.ccy}' disabled = "disabled"
                                                data-th-data-result="${CCY}">
                                        </select>
                                    </div>
                                </div>
                                <!-- 回购利率% -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">回购利率%</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="intRate" id="BuyOutRepoTransfer001_intRate"
                                               class="layui-input form-input text-number" disabled = "disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-textrange="4" data-th-value='${entity?.intRate}'>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <!-- 证券托管户 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">证券托管户</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="secAcctName" id="BuyOutRepoTransfer001_secAcctName"
                                               class="layui-input form-input" maxlength=60 disabled = "disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${entity?.secAcctName}'>
                                    </div>
                                </div>
                                <!-- 通道 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">通道</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="chlName" id="BuyOutRepoTransfer001_chlName"
                                               class="layui-input form-input" maxlength=60 disabled = "disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${entity?.chlName}'>
                                    </div>
                                </div>
                                <!-- 券面总额 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">券面总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="prinAmt" id="BuyOutRepoTransfer001_prinAmt"
                                               class="layui-input form-input text-number" disabled = "disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-textrange="6" data-th-value='${entity?.prinAmt}'><span class="input-right-show">万元</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <!-- 剩余未转仓券面总额 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">剩余未转仓券面总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="undistributedAmount" id="BuyOutRepoTransfer001_undistributedAmount"
                                               class="layui-input form-input text-number" disabled = "disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-textrange="6" data-th-value='${entity?.undistributedAmount}'> <span class="input-right-show">万元</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 买断式回购转仓 -->
                <div class="pro-module-wrap" title="买断式回购转仓">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">买断式回购转仓</span><i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <!-- 组合代码 -->
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">组合代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="BuyOutRepoTransfer001_portfolioId" name="portfolioId"
                                                    parentids="portfolioIdOut,secManageAcctId,BuyOutRepoTransfer001_tradeDate,BuyOutRepoTransfer001_ccy"
                                                    allowClear="true"
                                                    class="layui-input form-input input-select" maxLength="32"
                                                    data-th-data-url="@{/invest/trade/transfer/buyoutrepo/BuyOutRepoTransfer001/getPortfolioId}"
                                                    formatoption = false placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}" required >
                                            </select>
                                        </div>
                                    </div>
                                    <!-- 券面总额 -->
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">券面总额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="proPrinAmt" id="BuyOutRepoTransfer001_proPrinAmt"
                                                   class="layui-input form-input text-number"
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-textrange="2" required>
                                            <span class="input-right-show">万元</span>
                                        </div>
                                    </div>
                                    <!-- 首次结算金额 -->
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">首次结算金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="firSettleAmt" id="BuyOutRepoTransfer001_firSettleAmt"
                                                   class="layui-input form-input text-number" disabled = "disabled"
                                                   data-textrange="2">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <!-- 到期结算金额 -->
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">到期结算金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="dueSettleAmt" id="BuyOutRepoTransfer001_dueSettleAmt"
                                                   class="layui-input form-input text-number" disabled = "disabled"
                                                   data-textrange="2">
                                        </div>
                                    </div>
                                    <!-- 按钮 -->
                                    <div class="form-inline-wrap">
                                        <!-- 添加按钮-->
                                        <a id="BuyOutRepoTransfer001_btn_add" class="layui-btn layui-btn-sm"><i class="iconfont icon-plus"></i>
                                            <span data-th-text="#{SysCommon.add}">添加</span></a>
                                        <!-- 待转仓产品组合查询链接-->
                                        <a id="BuyOutRepoTransfer001_btn_searchInfo" class="layui-btn layui-btn-sm">待转仓产品组合查询</a>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <!-- 组合现金、持仓查询 -->
                                    <div id="avaStandardBondPositionDiv" class="page-component" th:data-path="@{/component/trade/BussTrdAvailableCashQuery/init}"
                                         th:data-params="|{entityName: 'bussTrdAvailableCashQuery'}|"></div>
                                </div>
                                <div>
                                    <table class="layui-table pro-table-wrap" id="dataTable"></table>
                                </div>
                                <!-- 风险试算 -->
                                <div th:if="${isEleShow['BuyOutRepoTransfer001_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}" 
            						th:data-params="|{entity: '${riskTrialRetDto}',workflowId:'${workflowId?: ''}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|">
            					</div>
                            </div>
                        </div>
                    </div>
                    <div class="row text-center stepbar">
                        <a th:if="${isEleShow['BuyOutRepoTransfer001_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'"
               				th:id="|${pageId}_btn_risk|" class="layui-btn layui-btn-sm"
               				data-th-text="#{BuyOutRepoTransfer001.risk}">风险试算</a>
                        <a id="BuyOutRepoTransfer001_btn_save" class="layui-btn layui-btn-sm btn-save"
                           data-th-text="#{SysCommon.save}">保存</a>
                        <a id="BuyOutRepoTransfer001_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                           data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="BuyOutRepoTransfer001_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                           data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var BACK_LEND_DIRECTION_03 = /*[[${BACK_LEND_DIRECTION_03}]]*/'03'; // 数据字典.回购拆借方向_正回购
        var BACK_LEND_DIRECTION_04 = /*[[${BACK_LEND_DIRECTION_04}]]*/'04'; // 数据字典.回购拆借方向_逆回购
        var formTodoList = /*[[${formTodoList}]]*/false;
        var entityData = JSON.parse(/*[[${entityData}]]*/'{}');
        var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
        var FINPROD_TYPE_F17 = /*[[${FINPROD_TYPE_F17}]]*/'';
        var PS_T01 = /*[[${PS_T01}]]*/'T01';
        // 投资目的_摊余成本
        var INV_AIM_TC = /*[[${INV_AIM_TC}]]*/'';
        // 交易场所_二级市场
        var TRADE_PLACE_SEC = /*[[${TRADE_PLACE_SEC}]]*/'';
        var MY_SUP_TIME_TYPE_DEAL = /*[[${MY_SUP_TIME_TYPE_DEAL}]]*/'';
        var FINPROD_TYPE_TG_F04 = /*[[${FINPROD_TYPE_TG_F04}]]*/'';
        var FINPROD_TYPE_TG_F05 = /*[[${FINPROD_TYPE_TG_F05}]]*/'';
        //add by liuwei for huaxing 20200310 start
        var CALC_MODEL_03 = /*[[${CALC_MODEL_03}]]*/'03';
        //add by liuwei for huaxing 20200310 end
    </script>
    <script data-th-src="@{/js/component/common/TradeCommon.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/invest/trade/transfer/buyoutrepo/BuyOutRepoTransfer001.js}"></script>
</div>
</body>
</html>
