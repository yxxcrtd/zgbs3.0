<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="#{TrdBondLendInvestTrade002}">债券借贷投资交易</title>
</head>

            line-height: 24px;
            padding-right: 0px;
            margin: 0px;
        }
        .layui-form-radio div {
            font-size: 12px;
        }
        .layui-form-radio i{
            font-size: 14px;
        }
        .label-deviation-degree{
            width: 50px;
            height: 24px;
            color: red;
            top: 0;
            right: 0;
            position: absolute;
            text-align: center;
            line-height: 24px;
        }
        #bussTrdAvailableCashQuery_div_position{
        	display: none;
        }
        .form-inline-wrap1{
            display: inline-block;

            width: 66%;

                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" th:text="#{TrdBondLendInvestTrade002.baseInfo}">基本信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <input type="hidden" id="finprodName" name="finprodName" th:value="${entity?.finprodName}" />
                        <input type="hidden" id="tradeId" name="tradeId" th:value="${tradeId}" />
                        <input type="hidden" id="workflowId" name="workflowId" th:value="${workflowId}" />

                        <!-- 计息基础 -->
                        <input type="hidden" id="basis" name="basis" >
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdBondLendInvestTrade002.entrustId}">委托代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required disabled type="text" id="entrustId" name="entrustId"
                                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:data-url="@{/business/common/CommonSelect/getEntrustId}"
                                               data-idfield="code" data-keyfield="name"
                                               th:data-effectivefieldsalias='|{"code":"#{TrdBondLendInvestTrade002.entrustId}","shortName":"#{TrdBondLendInvestTrade002.entrustId}"}|'
                                               th:value="${entity?.entrustId}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdBondLendInvestTrade002.portfolioId}">组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                         <select required type="text" id="portfolioId" name="portfolioId"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}" allowClear="true"
                                            formatoption="true"
                                            th:initValue="${entity?.portfolioId}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdBondLendInvestTrade002.settleSpreed}">清算速度</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="settleSpeed" name="settleSpeedStr"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${ACCOUNT_SPEED}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.settleSpeedStr}"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdBondLendInvestTrade002.tradeDate}">交易日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  disabled type="text" id="tradeDate" name="tradeDate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.tradeDate==null ? platDate : #dates.format(entity?.tradeDate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdBondLendInvestTrade002.vdate}">首次结算日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  disabled type="text" id="vdate" name="vdate"

                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${#dates.format(entity?.vdate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                                 <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdBondLendInvestTrade002.mdate}">到期结算日</label>

                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${#dates.format(entity?.mdate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdBondLendInvestTrade002.term}">期限(天)</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="term" name="term" maxlength="10"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" data-fixtype="2" data-textrange="0"
                                               th:value="${entity?.term}">
                                        <span class="input-right-show">天</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdBondLendInvestTrade002.termType}">期限品种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required  type="text" id="termType" name="termType"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:data-result="${TERM_TYPE_BONDLEND}"
                                                allowClear="true" formatoption="false" th:initValue="${entity?.termType}"></select>
                                    </div>
                                </div>
                                 
                                 <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdBondLendInvestTrade002.actAmtDays}">实际占券天数</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required  disabled type="text" id="actAmtDays" name="actAmtDays" maxlength="10"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" data-fixtype="2" data-textrange="0"
                                               th:value="${entity?.actAmtDays}">
                                        <span class="input-right-show">天</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">

                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdBondLendInvestTrade002.firstSettleType}">首次结算方式</label>

                                        <select  required type="text" id="deliveryType" name="deliveryType"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:data-result="${SETTLEMENT_WAY_LENDING_02}"
                                                allowClear="true" formatoption="false" th:initValue="${entity?.deliveryType}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdBondLendInvestTrade002.matSettleType}">到期结算方式</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="mDeliveryType" name="mDeliveryType"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:data-result="${SETTLEMENT_WAY_LENDING}"
                                                allowClear="true" formatoption="false" th:initValue="${entity?.mDeliveryType}"></select>
                                    </div>
                                </div>
                                 <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdBondLendInvestTrade002.conflictSolveWay}">争议解决方式</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="conflictSolveWay" name="conflictSolveWay"

                                    </div>
                                </div>
                             </div>
                            
                            <div class="layui-form-item">

                                        <select required disabled type="text" id="tradeMarket" name="tradeMarket"

                                                th:data-result='${TRADE_PLACE}'
                                                allowClear="true" formatoption="true"
                                                th:initValue="${TRADE_PLACE_01}"></select>
                                    </div>
                                </div>

                                        <select required type="text" id="ps" name="ps"
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${BACK_LEND_DIRECTION}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.ps}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdBondLendInvestTrade002.calendarId}">交易日历</label>
                                    <div class="layui-input-inline input-inline">
                                         <select required  type="text" id="calendarId" name="calendarId"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:data-url="@{/business/common/CommonSelect/selectCalendarId}" allowClear="true"
                                                formatoption="true"
                                                th:initValue="${entity?.calendarId}"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                 <div class="form-inline-wrap">

                                                th:placeholder="#{SysCommon.placeholder}" th:data-url="@{/invest/trade/bondlend/TrdBondLendInvestTrade002/getFinprodId}"
                                                allowClear="true" th:initValue="${entity?.finprodId}"></select>
                                    </div>
                                     <div class="layui-input-inline input-inline" style="width: 10% !important;">
                                         <a id="TrdBondLendInvestTrade002_btn_viewAsset" class="layui-btn layui-btn-sm " data-ignore=true>查看</a>
                                     </div>
                                </div>
                                <div class="form-inline-wrap">
	                                <label class="layui-form-label form-label-wrap"
	                                       th:text="#{TrdBondLendInvestTrade002.tradeAmt1}">券面总额</label>
	                                <div class="layui-input-inline input-inline">
	                                    <input required type="text" id="shareAmt" name="shareAmt" data-textrange="4"
	                                           class="layui-input form-input text-number" placeholder="请输入内容"
	                                           th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.shareAmt}">
                                        <span class="input-right-show unitNum">万元</span>
	                                </div>
                            	</div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdBondLendInvestTrade002.fTradeId}">银行间成交编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="fTradeId" name="fTradeId"
                                               class="layui-input form-input"
                                               placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.fTradeId}">
                                    </div>
                                </div>
                             </div>
                             <div class="layui-form-item">
	                             <div class="form-inline-wrap">
	                                <label class="layui-form-label form-label-wrap" th:text="#{TrdBondLendInvestTrade002.mYield}" >借贷费率</label>
	                                <div class="layui-input-inline input-inline">
	                                    <input required type="text" id="mYield" name="mYield"
	                                           class="layui-input form-input text-number" data-fixtype="2" data-textrange="6"
	                                           th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.mYield}">
	                                </div>
	                            </div>
	                             <div class="form-inline-wrap">
	                                <label class="layui-form-label form-label-wrap" th:text="#{TrdBondLendInvestTrade002.mTradeAmt}">借贷费用</label>
	                                <div class="layui-input-inline input-inline">
	                                    <input required type="text" id="mTradeAmt" name="mTradeAmt"
	                                           class="layui-input form-input text-number"  data-fixtype="2" data-textrange="2"
	                                           th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.mTradeAmt}">
	                                </div>
	                            </div>
	                            <div class="form-inline-wrap">
                                	<label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdBondLendInvestTrade002.ccy}">币种</label>
	                                <div class="layui-input-inline input-inline">
	                                    <select required disabled type="text" id="ccy" name="ccy" class="layui-input form-input input-select"
	                                            placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
	                                            th:data-result='${CCY}' allowClear="true" formatoption="true"
	                                            th:initValue="*{entity?.ccy?:CCY_default}"></select>
	                                </div>
                            	</div>
                             </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdBondLendInvestTrade002.bctk}">补充条款</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="supplyClause" name="supplyClause"
                                               class="layui-input form-input" maxlength="100"
                                               placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.supplyClause}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdBondLendInvestTrade002.holdPurpose}">持有目的</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required  type="text" id="holdPurpose" name="holdPurpose"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:data-result="${SVR_HOLD_PURPOSE}"
                                                th:initValue="${entity?.holdPurpose}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdBondInvestTrade002.secManageAcctId}">证券托管户</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="secManageAcctId" name="secManageAcctId" parentIds="portfolioId,tradeMarket,finprodId"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:data-url="@{/invest/trade/bond/TrdBondInvestTrade002/getSecManageAcctId}"
                                                allowClear="true" th:initValue="${entity?.secManageAcctId}"></select>
                                    </div>
                                </div>
                            </div>
                                  <!-- 组合现金、持仓查询 -->
                                  <div id="avaStandardBondPositionDiv" class="page-component" th:data-path="@{/component/trade/BussTrdAvailableCashQuery/init}"
                                       th:data-params="|{entityName: 'bussTrdAvailableCashQuery'}|"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pro-module-wrap">
                   <div class="pro-module">
                       <h3 class="pro-module-title">
                           <span class="title-des">标的债券付息信息</span>
                           <i class="iconfont icon-arrow-down pro-down-icon"></i>
                       </h3>
                       <div class="pro-module-item">
                           <table class="layui-table" id="bondLendTable"></table>
                       </div>
                   </div>
			</div>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des"
                                                       th:text="#{TrdBondLendInvestTrade002.accountInfo}">账户信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdBondLendInvestTrade002.recAcctName}">出/回款账号名称</label>
                                <div class="layui-input-inline input-inline">
                                    <input  disabled type="text" id="acctOwnName" name="acctOwnName"
                                            class="layui-input form-input" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}"
                                    >
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdBondLendInvestTrade002.recAcctNo}">出/回款账号</label>
                                <div class="layui-input-inline input-inline">
                                    <select required type="text" id="acctOwenAcctId" name="acctOwenAcctId"

                                            th:placeholder="#{SysCommon.placeholder}" th:data-url="@{/invest/trade/bondlend/TrdBondLendInvestTrade002/getAllAccountInfo}"
                                            allowClear="true" th:initValue="${entity?.acctOwenAcctId}"></select>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdBondLendInvestTrade002.payAcctName}">对手方账号名称</label>
                                <div class="layui-input-inline input-inline">
                                    <input  disabled type="text" id="acctRivalName" name="acctRivalName"
                                            class="layui-input form-input" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}"
                                    >
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdBondLendInvestTrade002.payAcctNo}">对手方账号</label>
                                <div class="layui-input-inline input-inline">
                                    <select required type="text" id="acctRivalId" name="acctRivalId"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}" th:data-url="@{/invest/trade/bondlend/TrdBondLendInvestTrade002/getAllAccountInfo}"
                                            allowClear="true" th:initValue="${entity?.acctRivalId}"></select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdBondLendInvestTrade002.payAcctPoint}">对手方账号开户网点</label>
                                <div class="layui-input-inline input-inline">
                                    <input  disabled type="text" id="acctRivalNetWorkId" name="acctRivalNetWorkId"
                                            class="layui-input form-input" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}"
                                    >
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
			<!-- 质押券信息 -->
            <div class="page-component" th:data-path="@{/component/trade/BussRepoSec/init}"
                th:data-params="|{entityName: 'bussRepoSec', pageFrom: 'TrdRepoTrade002', entity:'${entity_bussRepoSecDto}',isBondLendTrade:'yes',bussBondType:'F29', portfolioId:'${entity?.portfolioId==null?'':entity?.portfolioId}', ps:'${entity?.ps==null?'':entity?.ps}', bizCode:'${tradeId==null?'':tradeId}', entrustId:'${entity?.entrustId==null?'':entity?.entrustId}', tradeMarketId:'01'}|"></div>
             <!-- 人员信息 -->
            <div class="page-component" th:data-path="@{/component/trade/TrdInvestPersonInfo002/init}"
                 th:data-params="|{entityName: 'trdInvestPersonInfo', pageFrom: 'submitForm', entity:'${entity_trdInvestPersonInfo}',pageId:'${pageId}'}|"></div>
                   
            <!-- 附件信息 -->
            <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"

                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">

                                <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                    <textarea name="remark" maxlength="200" th:text="${entity?.remark}"

                                </div>
                            </div>
                        </div>
                    </div>
                </div>
