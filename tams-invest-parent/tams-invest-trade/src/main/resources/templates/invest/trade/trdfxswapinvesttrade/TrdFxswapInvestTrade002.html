<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
	  layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{TrdFxswapInvestTrade002}">外汇掉期交易新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
				<form id="basicInfoForm" class="layui-form joyin-form-wrap pro-module-form">
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxswapInvestTrade001.entrustId}">委托代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <input disabled type="text" id="entrustId" name="entrustId"
                                                   class="layui-input form-input input-lenovoselect" 
                                                   th:data-url="@{/business/common/CommonSelect/getEntrustId}"
                                                   data-idfield="code" data-keyfield="name"
                                                   th:data-effectivefieldsalias='|{"code":"#{TrdFxswapInvestTrade001.entrustId}","shortName":"#{TrdFxswapInvestTrade001.entrustId}"}|'
                                                   th:value="${entity?.entrustId}">
                                            <input type="hidden" id="tradeId" name="tradeId" th:value="${entity?.tradeId}">
                                        </div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxswapInvestTrade001.portfolioId}">组合代码</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="portfolioId" name="portfolioId" th:initValue="${entity?.portfolioId}"
													class="layui-input form-input input-select available" placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}" required
													data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxswapInvestTrade001.excDealType}">交易类型</label>
										<div class="layui-input-inline input-inline">
											<select required type="text" id="excDealType" name="excDealType" class="layui-input form-input input-select" childrenIds="curPair"
													placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" th:initValue="${entity?.excDealType?:EXC_DEAL_TYPE_default}"
													data-th-data-result='${EXC_DEAL_TYPE}' allowClear="true" formatoption="true"></select>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxswapInvestTrade001.curPair}">货币对</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="curPair" name="curPair" class="layui-input form-input input-select"
                                                    childrenIds="dealCur" parentIds="excDealType" required
                                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" th:initValue="${entity?.curPair}"
                                                    data-th-data-result='${CYY_PAIR}' allowClear="true" formatoption="true"></select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxswapInvestTrade001.ps}">交易方向</label>
                                        <div class="layui-input-inline input-inline">
                                            <select required type="text" id="ps" name="ps" class="layui-input form-input input-select"
                                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" th:initValue="${entity?.ps}"
                                                    data-th-data-result='${PS}' allowClear="true" formatoption="true"></select>
                                        </div>
                                    </div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdFxswapInvestTrade002.calendarId}">交易日历</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="calendarId" name="calendarId" class="layui-input form-input input-select" required
													placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" th:initValue="${entity?.calendarId}"
													data-th-data-url="@{/business/common/CommonSelect/selectCalendarId}" allowClear="true" formatoption="true"></select>
										</div>
									</div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxswapInvestTrade002.tradeDate}">交易日期</label>
                                        <div class="layui-input-inline input-inline">
                                            <input required id="tradeDate" name="tradeDate"
                                                   class="layui-input form-input input-dateSelect"
                                                   data-th-value='${#dates.format(entity?.tradeDate,"yyyy-MM-dd")}'>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxswapInvestTrade002.dealCur}">交易币种</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="dealCur" name="dealCur"
                                                    data-th-data-result="${CCY}" parentIds="curPair"
                                                    th:initvalue="*{entity?.dealCur}" class="layui-input form-input input-select" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}" required>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxswapInvestTrade002.corCcy}">对应币种</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="corCcy" name="corCcy" searchable="false"
                                                    data-th-data-result="${CCY}"
                                                    th:initvalue="*{entity?.corCcy}" class="layui-input form-input input-select"
                                                    disabled>
                                            </select>
                                        </div>
                                    </div>
								</div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-utext="#{TrdFxswapInvestTrade002.spotRate}">即期汇率</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="spotRate" name="spotRate" th:value="${entity?.spotRate}" maxlength="12"
                                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                   required data-textrange="7" data-fixtype="2" class="layui-input form-input text-number rateCal"/>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxswapInvestTrade002.excFxsTermType}">期限类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="excFxsTermType" name="excFxsTermType"
                                                    data-th-data-result="${EXC_FXS_TERM_TYPE}"
                                                    th:initvalue="*{entity?.excFxsTermType?:EXC_FXS_TERM_TYPE_default}" class="layui-input form-input input-select" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}" required>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxswapInvestTrade002.ourRole}">我方角色</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="ourRole" name="ourRole"
                                                    data-th-data-result="${OUR_ROLE}"
                                                    th:initvalue="*{entity?.ourRole?:OUR_ROLE_default}" class="layui-input form-input input-select" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}" required>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxswapInvestTrade002.dealMode}">交易模式</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="dealMode" name="dealMode" searchable="false"
                                                    data-th-data-result="${DEAL_MODE}"
                                                    th:initvalue="*{entity?.dealMode?:DEAL_MODE_default}" class="layui-input form-input input-select" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}" required>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxswapInvestTrade002.settMode}">清算模式</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="settMode" name="settMode" searchable="false"
                                                    data-th-data-result="${SETT_MODE}"
                                                    th:initvalue="*{entity?.settMode?:SETT_MODE_default}" class="layui-input form-input input-select" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}" required>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdBondLendInvestTrade002.holdPurpose}">持有目的</label>
	                                    <div class="layui-input-inline input-inline">
	                                        <select required  type="text" id="holdPurpose" name="holdPurpose"
	                                                class="layui-input form-input input-select" placeholder="请输入内容"
	                                                th:placeholder="#{SysCommon.placeholder}" th:data-result="${SVR_HOLD_PURPOSE}"
	                                                th:initValue="${entity?.holdPurpose}"></select>
	                                    </div>
	                                </div>
                                </div>
							</div>
						</div>
					</div>
                    <div class="pro-module-wrap" th:id="value_div">
                        <div class="pro-module">
                            <h3 class="pro-module-title"><span class="title-des">近端交易</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxswapInvestTrade002.nTermTypeExc}">近端期限</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="nTermTypeExc" name="nTermTypeExc" searchable="false"
                                                    data-th-data-result="${TERM_TYPE_EXC}"
                                                    th:initvalue="*{entity?.nTermTypeExc?:TERM_TYPE_EXC_default}" class="layui-input form-input input-select" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}" required>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxswapInvestTrade002.vdate}">近端交割日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input required id="vdate" name="vdate"
                                                   class="layui-input form-input input-dateSelect"
                                                   data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-utext="#{TrdFxswapInvestTrade002.nPoint}">近端掉期点</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="nPoint" name="nPoint" th:value="${entity?.nPoint}" maxlength="16"
                                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                   required data-textrange="2" data-fixtype="2" class="layui-input form-input text-number rateCal"/>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-utext="#{TrdFxswapInvestTrade002.nFprice}">近端掉期全价</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="nFprice" name="nFprice" th:value="${entity?.nFprice}" maxlength="12" disabled="disabled"
                                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                   required data-textrange="7" data-fixtype="2" class="layui-input form-input text-number rateCal"/>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxswapInvestTrade002.nDealCurAmt}">交易货币金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" th:id="nDealCurAmt" name="nDealCurAmt" maxlength="16"
                                                   required th:value="${entity?.nDealCurAmt}" class="layui-input form-input text-number rateCal"
                                                   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxswapInvestTrade002.dealCurPos}">交易货币可用持仓</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" th:id="dealCurPos" name="dealCurPos" maxlength="16"
                                                   disabled th:value="${entity?.dealCurPos}" class="layui-input form-input text-number rateCal"
                                                   data-textrange="2" data-fixtype="2" />
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-utext="#{TrdFxswapInvestTrade002.nCorCurAmt}">对应货币金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" th:id="nCorCurAmt" th:name="nCorCurAmt" disabled th:value="${entity?.nCorCurAmt}" maxlength="16"
                                                   data-textrange="2" data-fixtype="2" class="layui-input form-input text-number"
                                                   />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-utext="#{TrdFxswapInvestTrade002.corCurPos}">对应货币可用持仓</label>
                                        <div class="layui-input-inline input-inline">
                                            <input disabled type="text" id="corCurPos" name="corCurPos" th:value="${entity?.corCurPos}" maxlength="16"
                                                   class="layui-input form-input text-number">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-utext="#{TrdFxswapInvestTrade002.nUsdAmt}">折美元金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" th:id="nUsdAmt" th:name="nUsdAmt" required th:value="${entity?.nUsdAmt}" maxlength="16"
                                                   data-textrange="2" data-fixtype="2" class="layui-input form-input text-number"
                                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxswapInvestTrade002.feeAmt}">交易费用</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" th:id="feeAmt" th:name="feeAmt" required th:value="${entity?.feeAmt}" maxlength="16"
                                                   data-textrange="2" data-fixtype="2" class="layui-input form-input text-number"
                                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="pro-module-wrap" th:id="value_div">
                        <div class="pro-module">
                            <h3 class="pro-module-title"><span class="title-des">远端交易</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxswapInvestTrade002.fTermTypeExc}">远端期限</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="fTermTypeExc" name="fTermTypeExc"
                                                    data-th-data-result="${TERM_TYPE_EXC}"
                                                    th:initvalue="*{entity?.fTermTypeExc?:TERM_TYPE_EXC_default}" class="layui-input form-input input-select" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}" required>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxswapInvestTrade002.mdate}">远端交割日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input required id="mdate" name="mdate"
                                                   class="layui-input form-input input-dateSelect"
                                                   data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-utext="#{TrdFxswapInvestTrade002.fPoint}">远端掉期点</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="fPoint" name="fPoint" th:value="${entity?.fPoint}" maxlength="16"
                                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                   required data-textrange="2" data-fixtype="2" class="layui-input form-input text-number rateCal"/>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-utext="#{TrdFxswapInvestTrade002.fFprice}">远端掉期全价</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="fFprice" name="fFprice" th:value="${entity?.fFprice}" maxlength="12"
                                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" disabled="disabled"
                                                   required data-textrange="7" data-fixtype="2" class="layui-input form-input text-number rateCal"/>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxswapInvestTrade002.fDealCurAmt}">交易货币金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" th:id="fDealCurAmt" name="fDealCurAmt" maxlength="16"
                                                   required th:value="${entity?.fDealCurAmt}" class="layui-input form-input text-number rateCal"
                                                   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-utext="#{TrdFxswapInvestTrade002.fCorCurAmt}">对应货币金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input disabled type="text" th:id="fCorCurAmt" th:name="fCorCurAmt" th:value="${entity?.fCorCurAmt}" maxlength="16"
                                                   data-textrange="2" data-fixtype="2" class="layui-input form-input text-number"
                                                   />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-utext="#{TrdFxswapInvestTrade002.fUsdAmt}">折美元金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" th:id="fUsdAmt" th:name="fUsdAmt" required th:value="${entity?.fUsdAmt}" maxlength="16"
                                                   data-textrange="2" data-fixtype="2" class="layui-input form-input text-number"
                                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
					<!-- 人员信息 -->
					<div class="page-component" th:data-path="@{/component/trade/TrdInvestPersonInfo002/init}" th:data-params="|{entity: '${trdInvestPersonInfo002Dto}', counterType:'${COUNTER_TYPE_01}', entityName:'trdInvestPersonInfo002Dto'}|"></div>
                    <!-- 划款指令 -->
					<div id="BussTrdTransferOrder" class="page-component" th:data-path="@{/component/trade/BussTrdTransferOrder/init}" th:data-params="|{entityList:'${entityList}',entityName:'bussTrdTransferOrder',bizCode:'${entity?.tradeId1}',isMulti:'1'}|"></div>
					<!-- 附件信息 -->
					<div name="fileArray" class="page-component" th:data-path="@{/component/core/FileCommon/init}"
						 th:data-params="|{entityName: 'fileArray', businessId: '${entity?.tradeId ?: ''}'}|"></div>
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">备注</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="layui-input-inline input-inline" style="margin:0 10px;width:98%!important;">
										        <textarea id="remark" name="remark" th:placeholder="#{SysCommon.placeholder}" placeholder="请输入内容" th:text="${entity?.remark}"
														  class="layui-textarea"></textarea>
									</div>
								</div>
							</div>
						</div>
					</div>
                    <!-- 风险试算 -->
                    <div th:if="${isEleShow['TrdFxswapInvestTrade002_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}" th:data-params="|{entity: '${riskTrialRetDto}',workflowId:'${workflowId?: ''}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>
				</form>
                <div class="layui-form-item">
                    <div align="center" style="height:50px;padding-top: 10px;">
                    	<a th:if="${isEleShow['TrdFxswapInvestTrade002_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'" id="TrdFxswapInvestTrade002_btn_riskMath" class="layui-btn layui-btn-sm" >风险试算</a>
