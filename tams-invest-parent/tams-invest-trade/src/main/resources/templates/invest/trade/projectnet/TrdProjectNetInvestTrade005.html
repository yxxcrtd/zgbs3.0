<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="#{TrdProjectNetInvestTrade005.title}"></title>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base" th:title="#{TrdProjectNetInvestTrade003.baseInfo}">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" th:text="#{TrdProjectNetInvestTrade003.baseInfo}">基本信息</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <input type="hidden" id="finprodType2" name="finprodType2" th:value="${entity?.finprodType2}">
                        <input type="hidden" id="calendarId" name="calendarId" th:value="${entity?.calendarId}">
                        <input type="hidden" id="tradeId" name="tradeId" th:value="${entity?.tradeId}">
                        <input type="hidden" id="profitType" name="profitType" th:value="${entity?.profitType}">
                        <input type="hidden" id="bTradeId" name="bTradeId" th:value="${entity?.bTradeId}">
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div id="ps_div" class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdProjectNetInvestTrade003.ps}">交易方向</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="ps" name="ps" required="required" disabled="disabled"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:data-result='${PS}'
                                                allowClear="true" formatoption="true" th:initValue="${entity?.ps}"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdProjectNetInvestTrade003.tradeDate2}">确认日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required disabled type="text" id="tradeDate" name="tradeDate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.tradeDate==null ? platDate : #dates.format(entity?.tradeDate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdProjectNetInvestTrade003.finprodName}">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="finprodId" name="finprodId"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" disabled="disabled"
                                                th:data-url="@{/invest/trade/plannet/TrdProjectNetInvestTrade002/getFinprodId}"
                                                allowClear="true" formatoption="false" required="required"
                                                th:initValue="${entity?.finprodId}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdProjectNetInvestTrade003.finprodId}">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required disabled type="text" id="finprodName" name="finprodName"
                                               class="layui-input form-input" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.finprodName}">
                                        <a id="TrdProjectNetInvestTrade005_btn_view" class="layui-btn layui-btn-sm form-input-text" data-ignore=true>查看</a>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div id="expectedArrivalDate_div" class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdProjectNetInvestTrade003.expectedArrivalDate}">预计到账日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required disabled type="text" id="expectedArrivalDate" name="redCfmDate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.redCfmDate==null ? platDate : #dates.format(entity?.redCfmDate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap" style="display:none">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdProjectNetInvestTrade003.type6}">资产类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="type6" name="type6" required="required"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" disabled="disabled"
                                                th:data-result='${PLAN_ASSET_TYPE}' allowClear="true"
                                                formatoption="true" th:initValue="${entity?.type6}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" style="display:none">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdProjectNetInvestTrade003.type7}">资产二级类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="type7" name="type7" required="required"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" disabled="disabled"
                                                th:data-result='${PLAN_ASSET_SEC_TYPE}' allowClear="true"
                                                formatoption="true" th:initValue="${entity?.type7}"></select>
                                    </div>
                                </div>
                                <!--添加二三四级分类 zhangpuyu 2019/8/7 start-->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdProjectNetInvestTrade003.type9}">资产二级分类</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="type9" name="type9" required="required"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" disabled="disabled"
                                                th:data-result='${CUSTOM_ASSET_TYPE_TWO}' allowClear="true"
                                                formatoption="true" th:initValue="${entity?.type9}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdProjectNetInvestTrade003.type10}">资产三级分类</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="type10" name="type10" required="required"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${CUSTOM_ASSET_TYPE_THREE}' allowClear="true"
                                                data-parentIds="type9" data-th-childrenIds="type11"
                                                formatoption="true" th:initValue="${entity?.type10}" disabled="disabled"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" style="display: none" id = "type11Div">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{TrdProjectNetInvestTrade003.type11}">资产四级分类</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="type11" name="type11"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${CUSTOM_ASSET_TYPE_FOUR}' allowClear="true"
                                                data-parentIds="type10"
                                                formatoption="true" th:initValue="${entity?.type11}" disabled="disabled"></select>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" style="display:none">
                                        <label class="layui-form-label form-lable" data-th-text="#{invest.channelId}">通道</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="chlId" name="chlId"
                                                    class="layui-input form-input input-select" allowClear="false"
                                                    data-th-placeholder="#{SysCommon.placeholder}" formatoption="true"
                                                    data-th-initvalue="${entity?.chlId}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" th:id="div_channelCash" style="display: none;">
                                    <label class="layui-form-label form-label-wrap" data-th-text="|#{invest.channelId}#{EtrInvestBondInfo002.channelAvailableCash}|">通道可用现金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input disabled type="text" th:id="|channelAvailableCash|" th:name="|channelAvailableCash|"
                                               class="layui-input form-input text-number" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <!--添加二三四级分类 zhangpuyu 2019/8/7 end-->
                                <div class="form-inline-wrap" style="display: none" id="proAvailableCash_div">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdProjectNetInvestTrade003.proAvailableCash}">组合T日可用现金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="proAvailableCash" name="proAvailableCash"
                                               placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                               class="layui-input form-input text-number" disabled="disabled"/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" style="display: none" id="proAvailableCash1_div">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdProjectNetInvestTrade003.proAvailableCash1}">组合T+1日可用现金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="proAvailableCash1" name="proAvailableCash1"
                                               placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                               class="layui-input form-input text-number" disabled="disabled" />
                                    </div>
                                </div>
                                <div class="form-inline-wrap" style="display: none" id="accAvailableCash_div">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdProjectNetInvestTrade003.accAvailableCash}">托管户剩余现金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="accAvailableCash" name="accAvailableCash"
                                               placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                               class="layui-input form-input text-number" disabled="disabled"/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" id="assetAvailablePosition_div" Style="display: none">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdProjectNetInvestTrade003.assetAvailablePosition}">资产可用持仓</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="assetAvailablePosition" name="assetAvailablePosition"
                                               placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                               class="layui-input form-input text-number" disabled="disabled" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="title-des" th:text="#{TrdProjectNetInvestTrade003.amtInfo}">金额信息</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdProjectNetInvestTrade003.ccy}">币种</label>
                                <div class="layui-input-inline input-inline">
                                    <select disabled type="text" id="ccy" name="ccy" required="required"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}" th:data-result='${CCY}'
                                            allowClear="true" formatoption="true" th:initValue="*{entity?.ccy?:CCY_default}"></select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdProjectNetInvestTrade003.tradeAmt}">交易金额</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="hidden" id="tradeAmtHid" th:value="${entity?.prinAmt}">
                                    <input required type="text" id="tradeAmt" name="tradeAmt" disabled="disabled"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.tradeAmt}">
                                </div>
                            </div>
                            <!-- modify by gaopeng 20191014  start -->
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdProjectNetInvestTrade003.netDate}">净值日期</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="netDate" name="cpriceDate"
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.cpriceDate==null ? platDate : #dates.format(entity?.cpriceDate,'yyyy-MM-dd')}">
                                </div>
                            </div>
                            <!-- modify by gaopeng 20191014  end -->
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdProjectNetInvestTrade003.unitCprice}">单位净值</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="unitCprice" name="unitCprice" disabled="disabled"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}" maxlength="10" data-textrange="4" />
                                </div>
                            </div>
                            <!-- modify by gaopeng 20191014  start -->
                            <div id="tradeSha_div" class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdProjectNetInvestTrade003.tradeSha}">交易份额</label>
                                <div class="layui-input-inline input-inline">
                                    <input required type="text" id="shareAmt" name="shareAmt"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.shareAmt}">
                                </div>
                            </div>
                            <!-- modify by gaopeng 20191014  end -->
                            <div id="purchaseFee_div"  class="form-inline-wrap">
                                <label id="purchase" class="layui-form-label form-label-wrap"
                                       th:text="#{TrdProjectNetInvestTrade003.purchaseFee}">申购费</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="feeAmtPay" name="feeAmtPay" maxlength="16"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.feeAmtPay}">
                                </div>
                            </div>
                            <div id="redemptionFee_div" class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       th:text="#{TrdProjectNetInvestTrade003.redemptionFee}">赎回费</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="feeAmtRedem" name="redemptionFee"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.redemptionFee}">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!--组合分配  -->
            <div class="pro-module-wrap" id="bussTrdTransfenpei_div"  name="bussTrdTransfenpeiDto">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">组合分配</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-utext="#{BussRepoSecPtl.distribution}">分配方式</label>
                                <div class="layui-input-inline input-inline">
                                    <select disabled type="text" th:id="TrdProjectNetInvestTrade004_distribution"
                                            th:name="TrdProjectNetInvestTrade004_distribution"
                                            class="layui-input form-input input-select"
                                            placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                            allowClear="true" formatoption="true"
                                            th:data-result='${DISTRIBUTION}'
                                    >
                                    </select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <a class="layui-btn layui-btn-sm btn-create" th:id="TrdProjectNetInvestTrade004_btn_autoAllocation">
                                    <i class="iconfont icon-found"></i><span
                                        data-th-utext="#{BussRepoSecPtl.autoAllocation}">自动分配</span></a>
                            </div>
                        </div>
                        <div class ="bussTrdTransfenpeiTable_div">
                            <table th:title ="#{BussTrdTransfenpei}" class="layui-table" id="bussTrdTransfenpeiTable" name="bussTrdTransfenpeiDto"></table>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 人员信息 -->
            <div class="page-component" th:data-path="@{/component/trade/TrdInvestPersonInfo002/init}"
                 th:data-params="|{entityName: 'trdInvestPersonInfo', pageFrom: 'submitForm', entity:'${entity_trdInvestPersonInfo}', psId : 'ps'}|"></div>
            <!-- 划款信息 -->
            <div id="transferInformation" class="page-component"
                 th:data-path="@{/component/trade/BussTrdTransferOrder/init}"
                 th:data-params="|{entityName: 'bussTrdTransferOrder', pageFrom: 'submitForm', entity:'${entity_bussRepFinProductInfoDto}',bizCode:'${tradeId}'}|"></div>
            <!-- 附件信息 -->
            <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                 th:data-params="|{entityName: 'FileCommon', businessId: '${businessId ?: ''}'}|"></div>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="title-des" th:text="#{TrdProjectNetInvestTrade004.remark}">备注</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div>
                                <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                        <textarea name="remark" maxlength="200" th:text="${entity?.remark}"
                                                  class="layui-textarea" placeholder="请输入内容" ></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 风险试算 -->
            <div id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}" th:data-params="|{entity: '${riskTrialRetDto}',entityName:'riskTrialRetDto',workflowId:'${workflowId?: ''}',tradeId:'${tradeId}'}|"></div>
            <div class="row text-center" style="margin: 30px 0;">
                <a th:id="|${pageId}_btn_risk|" class="layui-btn layui-btn-sm" data-th-text="#{TrdProjectNetInvestTrade004.risk}">风险试算</a>
                <a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var xps = /*[[${xps}]]*/'';
        var ps_T05 = /*[[${ps_T05}]]*/'';
        var ps_T19 = /*[[${ps_T19}]]*/'';
        var ps_T24 = /*[[${ps_T24}]]*/'';
        var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
        var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
        var single = /*[[${single}]]*/'';
        var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
        var bussTrdTransfenpeiDto = /*[[${bussTrdTransfenpeiDto}]]*/'';
        var totleTradeId = /*[[${totleTradeId}]]*/'';
        var ACCT_TYPE_A01 = /*[[${ACCT_TYPE_A01}]]*/'';
        var ACCT_TYPE_A07 = /*[[${ACCT_TYPE_A07}]]*/'';
        var GEN_PAY_ORDERS_AUTO= /*[[${GEN_PAY_ORDERS_AUTO}]]*/''; // 系统参数_是否显示划款指令
    </script>
    <script data-th-src="@{/js/component/common/TradeCommon.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/invest/asset/channel/ChannelAssetCommon.js}" type="text/javascript"></script>
    <script th:src="@{/js/invest/trade/projectnet/TrdProjectNetInvestTrade005.js}" type="text/javascript"></script>
</div>
</body>
</html>
