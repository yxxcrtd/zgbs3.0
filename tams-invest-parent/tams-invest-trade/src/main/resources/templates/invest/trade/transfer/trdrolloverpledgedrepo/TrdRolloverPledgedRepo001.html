<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>质押式回购交易转仓</title>
</head>
<body>
<div layout:fragment="content">
    <div class="layui-layer-content ">
        <form class="layui-form" id="TrdRolloverPledgedRepo001_form">
<!--            <input hidden type="text" id="invTransPortf" name="invTransPortf" data-th-value="${entity?.invTransPortf}">-->
            <!--待转出组合代码-->
            <input hidden type="text" id="tradeId" name="tradeId" data-th-value="${entity?.tradeId}">
            <input hidden type="text" id="splitTradeId" name="splitTradeId" data-th-value="${entity?.splitTradeId}">
            <input hidden type="text" id="finprodId" name="finprodId" data-th-value="${entity?.finprodId}">
            <input hidden type="text" id="calendarId" name="calendarId" data-th-value="${entity?.calendarId}"> <!--交易日历-->
            <input hidden type="text" id="tradeMarket" name="tradeMarket" data-th-value="${entity?.tradeMarket}">
            <input hidden type="text" id="workflowId" name="workflowId" data-th-value="${entity?.workflowId}">
            <input hidden type="text" id="portfolioName" name="portfolioName" data-th-value="${entity?.portfolioName}">
            <input hidden type="number" id="splitShareAmt" name="splitShareAmt" data-th-value="${entity?.splitShareAmt}">
            <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">交易信息</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">转出组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="invTransPortf" name="invTransPortf"
                                                disabled class="layui-input form-input input-select"
                                                data-th-data-url="@{/invest/trade/transfer/assetstransfer/AssetsTransfer001/getPortfolioId}"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:initValue="${entity?.invTransPortf}"
                                                placeholder="请输入内容">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">回购类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select disabled type="text" id="repoType" name="repoType"
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${TARGET_BACK_TYPE}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.repoType}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交易日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="tradeDate" name="tradeDate"
                                               class="layui-input form-input input-dateSelect"
                                               data-th-value='${#dates.format(entity?.tradeDate,"yyyy-MM-dd")}' disabled >
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交易方向</label>
                                    <div class="layui-input-inline input-inline">
                                        <select disabled type="text" id="ps" name="ps"
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${BACK_LEND_DIRECTION}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.ps}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">起息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="vdate" name="vdate"
                                               class="layui-input form-input input-dateSelect"
                                               data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}' disabled >
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">到期日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="mdate" name="mdate"
                                               class="layui-input form-input input-dateSelect"
                                               data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}' disabled>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">期限品种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select disabled type="text" id="termTypeReback" name="termTypeReback"
                                                class="layui-input form-input input-select"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-result='${TERM_TYPE_REBACK}'
                                                data-th-initvalue="${entity?.termTypeReback}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">回购期限</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="term" name="term"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" data-textrange="0"
                                               data-th-value="${entity?.term}" disabled >
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">实际占款天数</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="actCapDays" name="actCapDays"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" data-textrange="0"
                                               data-th-value="${entity?.actCapDays}" disabled >
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">计息基础</label>
                                    <div class="layui-input-inline input-inline">
                                        <select disabled type="text" id="basis" name="basis" class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${BASIS}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.basis}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select disabled type="text" id="ccy" name="ccy" class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${CCY}' allowClear="true" formatoption="true"
                                                th:initValue="*{entity?.ccy?:CCY_default}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">回购利率%</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="rebackPrice" name="rebackPrice"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" data-textrange="4"
                                               data-th-value="${entity?.rebackPrice}" disabled >
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">证券托管户</label>
                                    <div class="layui-input-inline input-inline">
                                        <select disabled type="text" id="secAcctId" name="secAcctId" parentIds="invTransPortf,tradeMarket"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:data-url="@{/invest/trade/trdrepotrade/TrdRepoTrade002/getSecManageAcctId}"
                                                allowClear="true" th:initValue="${entity?.secAcctId}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">通道</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="chlId" name="chlId" disabled
                                                class="layui-input form-input input-select" allowClear="true"
                                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true"
                                                data-th-data-url="@{/component/trade/BussChannelCommon/getChannelId}"
                                                data-th-initvalue="${entity?.chlId}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">本金金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="prinAmt" name="prinAmt"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" data-textrange="2"
                                               data-th-value="${entity?.prinAmt}" disabled >
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">剩余可转仓本金金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="avaRolloverAmt" name="avaRolloverAmt"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" data-textrange="2"
                                               data-th-value="${entity?.avaRolloverAmt}" disabled >
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
            </div>
            <div class="pro-module-wrap">
                    <div lass="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">质押式回购转仓</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="portfolioId" name="portfolioId"
                                                parentids="invTransPortf,secAcctId,tradeDate,ccy"
                                                allowClear="true"
                                                class="layui-input form-input input-select" maxLength="32"
                                                data-th-data-url="@{/invest/trade/transfer/trdrolloverpledgedrepo/TrdRolloverPledgedRepo001/selectPortfolioId}"
                                                formatoption = true placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" required >
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">本金金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="rolloverPrinAmt" name="rolloverPrinAmt"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" data-textrange="2"
                                               data-th-value="${entity?.rolloverPrinAmt}" required >
                                    </div>
                                </div>
                                <div class="form-inline-wrap" id="procedureAmt_div">
                                    <label class="layui-form-label form-label-wrap">回购利息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="rolloverRepoIntAmt" name="rolloverRepoIntAmt"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" data-textrange="2"
                                               data-th-value="${entity?.rolloverRepoIntAmt}" disabled >
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" id="tradeAmt_div">
                                    <label class="layui-form-label form-label-wrap">交易金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="rolloverTradeAmt" name="rolloverTradeAmt"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" data-textrange="2"
                                               data-th-value="${entity?.rolloverTradeAmt}" disabled >
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"></label>
                                    <div class="layui-input-inline input-inline">
                                        <a id="TrdRolloverPledgedRepo001_btn_add" class="layui-btn layui-btn-sm">添加</a>
                                    </div>
                                </div>
                                <!-- 待转仓产品组合查询链接-->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"></label>
                                    <div class="layui-input-inline input-inline">
                                        <a id="TrdRolloverPledgedRepo001_btn_searchInfo" class="layui-btn layui-btn-sm">待转仓产品组合查询</a>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <!-- 组合现金、持仓查询 -->
                                <div id="avaStandardBondPositionDiv" class="page-component" th:data-path="@{/component/trade/BussTrdAvailableCashQuery/init}"
                                     th:data-params="|{entityName: 'bussTrdAvailableCashQuery'}|">
                                </div>
                            </div>
                        </div>
                    </div>
            </div>
            <div class="pro-module-wrap">
                     <div lass="pro-module" id="pledgedBondSplit_div">
                          <h3 class="pro-module-title"><span class="title-des">质押券转仓列表</span>
                              <i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                         <div class="pro-module-item">
                             <div class="layui-form-item">
                                 <div class="form-inline-wrap">
                                     <label class="layui-form-label form-label-wrap">转仓交易汇总券面总额</label>
                                     <div class="layui-input-inline input-inline">
                                         <input type="text" id="sumRolloverPrinAmt" name="sumRolloverPrinAmt"
                                                class="layui-input form-input text-number" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" data-textrange="2"
                                                data-th-value="${entity?.sumRolloverPrinAmt}" disabled >
                                     </div>
                                 </div>
                             </div>
                          <table class="layui-table" id="pledgedRepoRolloverList" name="pledgedRepoRolloverList"></table>
                         </div>
                     </div>
                </div>
            <div class="pro-module-wrap">
                <div lass="pro-module" id="listInfo_div">
                    <h3 class="pro-module-title"><span class="title-des">列表信息</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <table class="layui-table" id="pledgedRepoInfoList" name="pledgedRepoInfoList"></table>
                    </div>
                </div>
            </div>
            <!-- 风险试算 -->
            <div th:if="${isEleShow['TrdRolloverPledgedRepo001_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}" 
            	th:data-params="|{entity: '${riskTrialRetDto}',workflowId:'${workflowId?: ''}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|">
            </div>
        </form>
        <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
            <div class="row text-center" style="margin: 20px 0;">
               <a th:if="${isEleShow['TrdRolloverPledgedRepo001_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'"
               		th:id="|${pageId}_btn_risk|" class="layui-btn layui-btn-sm"
               		data-th-text="#{TrdRolloverPledgedRepo001.risk}">风险试算</a>
                <a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save"
                                       th:text="#{SysCommon.save}">保存</a>
                <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit"
                                       th:text="#{SysCommon.submit}">提交</a>
                <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel"
                                       th:text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var entity = /*[[${entity}]]*/'';
        var formTodoList = /*[[${formTodoList}]]*/false;
        var PledgedRepoInfoListData = JSON.parse(/*[[${PledgedRepoInfoListData}]]*/'{}');
        var BACK_LEND_DIRECTION_03 = /*[[${BACK_LEND_DIRECTION_03}]]*/'';
        var BACK_LEND_DIRECTION_04 = /*[[${BACK_LEND_DIRECTION_04}]]*/'';
        var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
        var FINPROD_TYPE_TG_F02 = /*[[${FINPROD_TYPE_TG_F02}]]*/'';
        var FINPROD_TYPE_TG_F03 = /*[[${FINPROD_TYPE_TG_F03}]]*/'';
        var H01 = /*[[${H01}]]*/'';
        var risk_math_switch=/*[[${risk_math_switch}]]*/'';
        var tradeMarket01 = /*[[${tradeMarket01}]]*/'01';
    </script>
    <script data-th-src="@{/js/invest/trade/transfer/trdrolloverpledgedrepo/TrdRolloverPledgedRepo001.js}"
            type="text/javascript"></script>
</div>
</body>
</html>
