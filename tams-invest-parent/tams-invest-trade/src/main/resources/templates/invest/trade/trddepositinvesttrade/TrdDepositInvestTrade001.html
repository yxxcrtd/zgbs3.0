<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{TrdDepositInvestTrade001}">存款类资产</title>
</head>

<body>
    <div layout:fragment="content">
        <div class="form-button-area">
            <a id="TrdDepositInvestTrade001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
            <a id="TrdDepositInvestTrade001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="#{SysCommon.revoke}"></a>
            <a id="TrdDepositInvestTrade001_btn_protfolio" class="layui-btn layui-btn-sm btn-create">多组合交易</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdDepositInvestTrade001.entrustId}">委托代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="entrustId" name="entrustId"
                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/trade/trddepositinvesttrade/TrdDepositInvestTrade001/getEntrustIdByType}" data-idfield="code"
                                data-keyfield="code" data-th-data-effectivefields="code"
                                data-th-data-effectivefieldsalias='|{"code":"#{TrdDepositInvestTrade001.entrustId}"}|'>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdDepositInvestTrade001.portfolioId}">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="portfolioId" name="portfolioId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" multiple="true"
                                data-th-data-url="@{/invest/trade/trddepositinvesttrade/TrdDepositInvestTrade001/getPortfolioId}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4" style="display: none">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdDepositInvestTrade001.finprodType}">资产类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="finprodType" name="finprodType" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${DEPO_ASSET_TYPE}' allowClear="true" formatoption="true"></select>
                        </div>
                    </div>
                    <!-- 新增资产二、三四、级分类 王贵奇 2019/8/1 开始-->
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdFundInvestTrade001.type9}">资产二级分类</label>
                        <div class="layui-input-inline input-inline">
                            <select id="type9" name="type9" class="layui-input form-input input-select"
                                data-th-placeholder="#{SysCommon.placeholder}" multiple
                                data-th-data-result='${CUSTOM_ASSET_TYPE_TWO}'></select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdFundInvestTrade001.type10}">资产三级分类</label>
                        <div class="layui-input-inline input-inline">
                            <select id="type10" name="type10" class="layui-input form-input input-select"
                                data-th-placeholder="#{SysCommon.placeholder}" multiple
                                data-th-data-result='${CUSTOM_ASSET_TYPE_THREE}'></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4" style="display: none" id = "type11Div">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdFundInvestTrade001.type11}">资产四级分类</label>
                        <div class="layui-input-inline input-inline">
                            <select id="type11" name="type11" class="layui-input form-input input-select"
                                data-th-placeholder="#{SysCommon.placeholder}" multiple
                                data-th-data-result='${CUSTOM_ASSET_TYPE_FOUR}'></select>
                        </div>
                    </div>
                    <!-- 新增资产二、三四、级分类 王贵奇 2019/8/1 结束-->
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                            data-th-text="#{TrdDepositInvestTrade001.finprodId}">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="finprodId" name="finprodId"
                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/asset/common/getAssetId?finprodType2=F07}"
                                data-idfield="code" data-keyfield="code"
                                data-th-data-effectivefieldsalias='|{"code":"#{TrdDepositInvestTrade001.finprodId}","shortName":"#{TrdDepositInvestTrade001.finprodName}"}|'>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdDepositInvestTrade001.ps}">交易方向</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="ps" name="ps" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${PS}' allowClear="true" formatoption="true" multiple="true"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdDepositInvestTrade001.status}">有效状态</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="status" name="status"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${TRADE_FLOW_STATUS}'
                                allowClear="true" formatoption="true" ></select>
                        </div>
                    </div>
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdDepositInvestTrade001.tradeDate}">交易日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="tradeDate" name="tradeDate"
                                class="layui-input form-input input-dateRangeSelect" placeholder="请输入时间区间"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap" id="chlFinprodId_div">
                        <label class="layui-form-label form-label-wrap"
                               th:text="#{TrdDepositInvestTrade001.chlFinprodId}">合作资产</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="chlFinprodId" name="chlFinprodId"
                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                    th:placeholder="#{SysCommon.placeholder}"  th:data-url="@{/invest/asset/channel/ChannelAsset001/getSecAcctId}"
                                    allowClear="true"
                                    multiple="true"></select>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
            var TRADE_STATUS = /*[[${TRADE_STATUS}]]*/'';
            var IS_QUERY_ASSETS_LOSS = /*[[${IS_QUERY_ASSETS_LOSS}]]*/'';
        </script>
        <script data-th-inline="javascript" type="text/javascript">
    	var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
    	</script>
        <script data-th-src="@{/js/invest/trade/trddepositinvesttrade/TrdDepositInvestTrade001.js}" type="text/javascript"></script>
    </div>
</body>

</html>
