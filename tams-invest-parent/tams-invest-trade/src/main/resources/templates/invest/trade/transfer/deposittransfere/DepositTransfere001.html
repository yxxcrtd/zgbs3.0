<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{DepositTransfere001}">存款类投资交易转仓</title>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
        <div class="pro-module-wrapper pro-module-base">
            <form id="depositTransfereForm" class="layui-form">
                <!-- 隐藏字段 投资过渡组合 -->
<!--                <input type="text" id="transferPortfolioId" name="transferPortfolioId"
                       data-th-value='${entity?.transferPortfolioId}' hidden>-->
                <!-- 隐藏字段 利息总额 -->
                <input type="text" id="intAmt" name="intAmt" data-th-value='${entity?.intAmt}' hidden>
                <!-- 隐藏字段 金融产品类型 -->
                <input type="text" id="finprodType" name="finprodType" data-th-value='${entity?.finprodType}' hidden>
                <!-- 隐藏字段 通道费 -->
                <input type="text" id="feeAmt" name="feeAmt" data-th-value='${entity?.feeAmt}' hidden>
                <!-- 隐藏字段 交易金额 -->
                <input type="text" id="tradeAmt" name="tradeAmt" data-th-value='${entity?.tradeAmt}' hidden>
                <!-- 隐藏字段 交易编号 -->
                <input type="text" id="tradeId" name="tradeId" data-th-value='${entity?.tradeId}' hidden>
                <!-- 隐藏字段 交易方向 -->
                <input type="text" id="ps" name="ps" data-th-value='${entity?.ps}' hidden>
                <!-- 隐藏字段 生效日 -->
                <input type="text" id="effDate" name="effDate" data-th-value='${#dates.format(entity?.effDate,"yyyy-MM-dd")}' hidden>
                <!-- 隐藏字段 起息日 -->
                <input type="text" id="vDate" name="vDate" data-th-value='${#dates.format(entity?.vDate,"yyyy-MM-dd")}' hidden>
                <!-- 隐藏字段 生效利率 -->
                <input type="text" id="yield" name="yield" data-th-value='${entity?.yield}' hidden>
                <!-- 隐藏字段 计息基础 -->
                <input type="text" id="basis" name="basis" data-th-value='${entity?.basis}' hidden>
                <!-- 隐藏字段 工作流代码 -->
                <input id="workflowId" name="workflowId" data-th-value="${workflowId}" hidden>
                <!-- 隐藏字段 画面模式 -->
                <input id="pageModel" name="pageModel" data-th-value="${pageModel}" hidden>
                <!-- 隐藏字段 交易日历 -->
                <input id="calendarId" name="calendarId" data-th-value="${entity?.calendarId}" hidden>
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">交易信息</span>（<span
                                class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">转出组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="transferPortfolioId" name="transferPortfolioId"
                                                disabled class="layui-input form-input input-select"
                                                data-th-data-url="@{/invest/trade/transfer/assetstransfer/AssetsTransfer001/getPortfolioId}"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:initValue="${entity?.transferPortfolioId}"
                                                placeholder="请输入内容">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交易日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="tradeDate"
                                               id="tradeDate" disabled="disabled"
                                               class="layui-input form-input input-dateSelect"
                                               data-th-value='${#dates.format(entity?.tradeDate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交割日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="settleDate"
                                               id="settleDate" disabled="disabled"
                                               class="layui-input form-input input-dateSelect"
                                               data-th-value='${#dates.format(entity?.settleDate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="finprodId" id="finprodId"
                                               class="layui-input form-input" maxlength=60 disabled="disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${entity?.finprodId}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="finprodAbbr" id="finprodAbbr"
                                               class="layui-input form-input" maxlength=60 disabled="disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${entity?.finprodAbbr}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select name="ccy" id="ccy"
                                                class="layui-input form-input input-select"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue='${entity?.ccy}' disabled="disabled"
                                                data-th-data-result="${CCY}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">借款利率%</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="loadRate" id="loadRate"
                                               class="layui-input form-input text-number" disabled="disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-textrange="4" data-th-value='${entity?.loadRate}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">通道</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="chlId" id="chlId"
                                               class="layui-input form-input" maxlength=60 disabled="disabled"
                                               data-th-value='${entity?.chlId}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">本金金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="prinAmt" id="prinAmt"
                                               class="layui-input form-input text-number" disabled="disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-textrange="2" data-th-value='${entity?.prinAmt}'>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">剩余未转仓本金金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="restAmt" id="restAmt"
                                               class="layui-input form-input text-number" disabled="disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-textrange="2" data-th-value='${entity?.restAmt}'>
                                    </div>
                                </div>
                               <!--  <div class="layui-col-md6 layui-col-lg6 layui-col-sm6" style="text-align: center">
                                    <a id="TrdPlanRateInvestTradeRes001_btn_searchInfo" class="layui-btn layui-btn-sm btn-search">待转仓产品组合查询</a>
                                </div> -->
                            </div>
                            <!-- <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">转让逾期利息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input disabled type="text" id="transOverdueIntAmt" name="transOverdueIntAmt" placeholder="请输入内容" class="layui-input form-input text-number"
                                               data-th-value="${entity?.transOverdueIntAmt}" data-textrange="2" data-pattern=""/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">转让逾期本金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input disabled type="text" id="transOverduePrinAmt" name="transOverduePrinAmt" placeholder="请输入内容" class="layui-input form-input text-number"
                                               data-th-value="${entity?.transOverduePrinAmt}" data-textrange="2" data-pattern=""/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交割金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="deliveryAmount" name="deliveryAmount"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" data-textrange="2"
                                               data-th-value="${entity?.deliveryAmount}" disabled >
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                            </div> -->
                        </div>
                    </div>
                </div>
                <div class="pro-module-wrap" th:id="value_div">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">存款类转仓</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="portfolioId" name="portfolioId"
                                                parentids="transferPortfolioId,tradeDate,ccy"
                                                allowClear="true"
                                                class="layui-input form-input input-select" maxLength="32"
                                                data-th-data-url="@{/invest/trade/transfer/deposittransfere/DepositTransfere001/queryProdIdInfo}"
                                                formatoption=true placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" required>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">本金金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="transferPrinAmt" id="transferPrinAmt"
                                               class="layui-input form-input text-number"
                                               data-textrange="2" required>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">应计利息总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="payInt" id="payInt"
                                               class="layui-input form-input text-number" disabled="disabled"
                                               data-textrange="2">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交易金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="transferTradeAmt" id="transferTradeAmt"
                                               class="layui-input form-input text-number"
                                               data-textrange="2">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <a id="DepositTransfere001_btn_add"
                                       class="layui-btn layui-btn-sm btn-create">添加</a>
                                    <a id="DepositTransfere001_btn_searchInfo"
                                       class="layui-btn layui-btn-sm">待转仓产品组合查询</a>

                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" id="portoAvailable">
                                    <label class="layui-form-label form-label-wrap">组合可用现金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="portoAvailableAmt" name="portoAvailableAmt"
                                               class="layui-input form-input text-number" disabled="disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}" data-textrange="2">
                                    </div>
                                </div>
                                <div class="form-inline-wrap" id="chlAvailable">
                                    <label class="layui-form-label form-label-wrap">通道可用现金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="chlAvailableAmt" name="chlAvailableAmt"
                                               class="layui-input form-input text-number" disabled="disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}" data-textrange="2">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div>
                    <table class="layui-table" id="dataTable"></table>
                </div>
                <!-- 风险试算 -->
            	<div th:if="${isEleShow['DepositTransfere001_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}" 
            		th:data-params="|{entity: '${riskTrialRetDto}',workflowId:'${workflowId?: ''}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|">
            	</div>
            </form>
            <div class="layui-form-item">
                <div align="center" style="height:50px;padding-top: 10px;">
                    <a th:if="${isEleShow['DepositTransfere001_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'"
               			th:id="|${pageId}_btn_risk|" class="layui-btn layui-btn-sm"
               			data-th-text="#{DepositTransfere001.risk}">风险试算</a>
                    <a id="DepositTransfere001_save" class="layui-btn layui-btn-sm btn-save"
                       data-th-text="#{SysCommon.save}">保存</a>
                    <a id="DepositTransfere001_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                       data-th-text="#{SysCommon.submit}">提交</a>
                    <a id="DepositTransfere001_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                       data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var PS_T01 = /*[[${PS_T01}]]*/'T01'; // 数据字典.交易方向_买入
        var PS_T02 = /*[[${PS_T02}]]*/'T02'; // 数据字典.交易方向_卖出
        var finprodId = /*[[${finprodId}]]*/'';
        var CCY = /*[[${CCY}]]*/'';
        var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
        var formTodoList = /*[[${formTodoList}]]*/false;
        var entityData = JSON.parse(/*[[${entityData}]]*/'{}');
        var FINPROD_TYPE_F17 = /*[[${FINPROD_TYPE_F17}]]*/'';
        var ACCT_TYPE_A01 = /*[[${ACCT_TYPE_A01}]]*/'';
        var ACCT_TYPE_A07 = /*[[${ACCT_TYPE_A07}]]*/'';
        var FINPROD_TYPE_F07 = /*[[${FINPROD_TYPE_F07}]]*/'';
    </script>
    <script data-th-src="@{/js/component/common/TradeCommon.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/invest/asset/channel/ChannelAssetCommon.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/invest/trade/transfer/deposittransfere/DepositTransfere001.js}">
    </script>
</div>
</body>
</html>
