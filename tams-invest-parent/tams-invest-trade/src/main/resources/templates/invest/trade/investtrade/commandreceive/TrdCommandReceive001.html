<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{TrdCommandReceive001}">平安投资指令接收-查询</title>
<script type="text/javascript" data-th-src="@{/public/js/message}"></script>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="form-button-area">
				<a id="TrdCommandReceive001_btn_receive"
					class="layui-btn layui-btn-sm"><i class="iconfont icon-circle-correct_fill"></i><span data-th-text="#{TrdCommandReceive001.receive}">接收</span></a>
			    <a id="TrdCommandReceive001_btn_refuce"	
					class="layui-btn layui-btn-sm"><i class="iconfont icon-refuse"></i><span data-th-text="#{TrdCommandReceive001.refuce}">退回</span></a>
				<a id="TrdCommandReceive001_btn_transaction"	
					class="layui-btn layui-btn-sm"><i class="iconfont icon-text1"></i><span data-th-text="#{TrdCommandReceive001.transaction}">交易录单</span></a>
				<a id="TrdCommandReceive001_btn_preTrade"
				   class="layui-btn layui-btn-sm"><i class="iconfont icon-text1"></i><span data-th-text="#{TrdCommandReceive001.preTrade}">交易预录入</span></a>
				<a id="TrdCommandReceive001_btn_contract"
				   class="layui-btn layui-btn-sm"><i class="iconfont icon-text1"></i><span data-th-text="#{TrdCommandReceive001.contract}">合同签署结果</span></a>
			</div>
			
			<div class="joyin-form-wrap joyin-filter-form condition-area">
				<form class="layui-form" id="TrdCommandReceive001_searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{TrdCommandReceive001.finprodType2}">资产类型</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="TrdCommandReceive001_finprodType2" name="finprodType2"
									class="layui-input form-input input-select"
									data-th-data-result='${PINAN_ASSET_TYPE}'
									allowClear="true" placeholder="请输入内容"  multiple="true"
									data-th-placeholder="#{SysCommon.placeholder}">
								</select>	
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{TrdCommandReceive001.finprodMarketId}">资产代码</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="TrdCommandReceive001_finprodMarketId" name="finprodMarketId"  maxlength="32"
									class="layui-input form-input input-lenovoselect" 
									data-th-data-url="@{/invest/trade/investtrade/commandreceive/TrdCommandReceive001/getFinprodMarketIds}"
									data-idfield="code"
									data-th-data-effectivefieldsalias='|{"code":"#{TrdCommandReceive001.finprodMarketId}",
										"shortName":"#{TrdCommandReceive001.finprodAbbr}"}|'
									placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
									/>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{TrdCommandReceive001.tradeMarket}">交易场所</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="TrdCommandReceive001_tradeMarket" name="tradeMarket"
									class="layui-input form-input input-select" 
									data-th-data-result='${TRADE_PLACE}' allowClear="true"
									placeholder="请输入内容" 
									data-th-placeholder="#{SysCommon.placeholder}" >
								</select>	
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{TrdCommandReceive001.ps}">交易方向</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="TrdCommandReceive001_ps" name="ps"
									class="layui-input form-input input-select"
									data-th-data-result ='${psList}' allowClear="true"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}" >
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{TrdCommandReceive001.createTime}">指令下达日期</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="TrdCommandReceive001_createTime" name="createTime"
									class="layui-input form-input input-dateRangeSelect"
									allowClear="true" placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}">
								</input>	
							</div>
						</div>
						<div id="entrustStatus" class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{TrdCommandReceive001.entrustStatus}">完成状态 </label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="TrdCommandReceive001_entrustStatus" name="entrustStatus" 
									class="layui-input form-input input-select"
									data-th-data-result ='${OTHER_STATUS}'
									placeholder="请输入内容"
									data-th-initValue="${entrustStatus}">
								</select>	
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{TrdCommandReceive001.ccy}">币种</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="TrdCommandReceive001_ccy" name="ccy"
									class="layui-input form-input input-select" 
									data-th-data-result='${CCY}' 
									allowClear="true" placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}">
								</select>	
							</div>
						</div>
						<div id="secondaryMarketTradeDiv" class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable">是否显示二级指令 </label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="secondaryMarketTrade" name="secondaryMarketTrade"
										class="layui-input form-input input-select" data-th-data-result='${YES_OR_NO}'
										allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
										formatoption="true"
										data-th-initValue="${YES_OR_NO_N}">
								</select>
							</div>
						</div>
					</div>
				</form>
			</div>
			
	<div class="layui-tab" lay-filter="demo">
		<ul class="layui-tab-title">
			<li class="layui-this" lay-filter="receive">已接收
			<span id="numberreceive" style="text-align: center;
				right: 9px;border-radius: 45px;top: 1px;
				position:absolute;color: white;font-size: 12px;
				width: 20px;height: 16px;background: 	#ffc31b;line-height: 16px;">0</span>
			</li>
			<li id="await" lay-filter="await" style="position: relative;">未接收
				<span id="number" style="text-align: center;
				right: 9px;border-radius: 45px;top: 1px;
				position:absolute;color: white;font-size: 12px;
				width: 20px;height: 16px;background: 	#ffc31b;line-height: 16px;"></span>
			</li>
		</ul>
  		<div class="layui-tab-content">
    		<div class="layui-tab-item layui-show">
				<table class="layui-table" id="dataTable"></table>
			</div>
    		<div class="layui-tab-item">
    			<table class="layui-table" id="otherDataTable"></table>
			</div>
  		</div>
  	</div>
  	<div hidden="true" id="detailTable_Div">
		<table class="layui-table" id="detailTable"></table>
	</div>
	<div style="padding-top:1%">
	</div>	
	</div>
</div>
	<div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
        var PINAN_ASSET_TYPE_F01 = /*[[${PINAN_ASSET_TYPE_F01}]]*/'';
        var PINAN_ASSET_TYPE_F02 = /*[[${PINAN_ASSET_TYPE_F02}]]*/'';
        var PINAN_ASSET_TYPE_F03 = /*[[${PINAN_ASSET_TYPE_F03}]]*/'';
        var PINAN_ASSET_TYPE_F04 = /*[[${PINAN_ASSET_TYPE_F04}]]*/'';
        var PINAN_ASSET_TYPE_F05 = /*[[${PINAN_ASSET_TYPE_F05}]]*/'';
        var PINAN_ASSET_TYPE_F06 = /*[[${PINAN_ASSET_TYPE_F06}]]*/'';
        var PINAN_ASSET_TYPE_F07 = /*[[${PINAN_ASSET_TYPE_F07}]]*/'';
        var PINAN_ASSET_TYPE_F08 = /*[[${PINAN_ASSET_TYPE_F08}]]*/'';
        var PINAN_ASSET_TYPE_F09 = /*[[${PINAN_ASSET_TYPE_F09}]]*/'';
        var PINAN_ASSET_TYPE_F10 = /*[[${PINAN_ASSET_TYPE_F10}]]*/'';
        var PINAN_ASSET_TYPE_F11 = /*[[${PINAN_ASSET_TYPE_F11}]]*/'';
        var PINAN_ASSET_TYPE_F13 = /*[[${PINAN_ASSET_TYPE_F13}]]*/'';
        var PINAN_ASSET_TYPE_F14 = /*[[${PINAN_ASSET_TYPE_F14}]]*/'';
        var PINAN_ASSET_TYPE_F15 = /*[[${PINAN_ASSET_TYPE_F15}]]*/'';
        var PINAN_ASSET_TYPE_F12 = /*[[${PINAN_ASSET_TYPE_F12}]]*/'';
        var PINAN_ASSET_TYPE_F16 = /*[[${PINAN_ASSET_TYPE_F16}]]*/'';
        var PINAN_ASSET_TYPE_F17 = /*[[${PINAN_ASSET_TYPE_F17}]]*/'';
		var PINAN_ASSET_TYPE_F36 = /*[[${PINAN_ASSET_TYPE_F36}]]*/'';
		var PINAN_ASSET_TYPE_F18 = /*[[${PINAN_ASSET_TYPE_F18}]]*/'';

		// add by etliu 20210421 权益类资产相关代码合并 start
		var PINAN_ASSET_TYPE_F19 = /*[[${PINAN_ASSET_TYPE_F19}]]*/'';
		// add by etliu 20210421 权益类资产相关代码合并 end

        var IRS_TYPE = /*[[${IRS_TYPE}]]*/'IRS_TYPE';
        var NUMBER = /*[[${NUMBER}]]*/'';
        var NUMBERRECEIVE = /*[[${NUMBERRECEIVE}]]*/'';
        var ISTRADERECOMMANDrECEIVE = /*[[${ISTRADERECOMMANDrECEIVE}]]*/'';
        var PS_T04 = /*[[${PS_T04}]]*/'';
        //add by gaopeng 20191125 start
        var PS_T49 = /*[[${PS_T49}]]*/'';
        //add by gaopeng 20191125 end
        //add by daizhiwei 2020-02-04,交易场所：银行间 start
        var TRADE_PLACE_01 = /*[[${TRADE_PLACE_01}]]*/'';
        //add by daizhiwei 2020-02-04,交易场所：银行间 end
        </script>
		<script data-th-src="@{/js/invest/trade/investtrade/commandreceive/TrdCommandReceive001.js}"></script>
	</div>
</body>
</html>
