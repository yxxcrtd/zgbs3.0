<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{TrdRepoTrade001}">回购投资交易查询</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a th:id="|${pageId}_btn_add|" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
        <a id="TrdRepoTrade003_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create.ptl}">多组合新建</a>
        <a th:id="|${pageId}_btn_revoke|" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="#{SysCommon.revoke}"></a>
        <!-- update by zhangpuyu 2019/11/15 start -->
        <a th:id="|${pageId}_btn_manage|" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-quanka" ></i>标准券管理</a>
        <!-- update by zhangpuyu 2019/11/15 end -->
        <a th:id="|${pageId}_btn_substitution|" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-quanka" ></i>质押券置换</a>
        <a th:id="|${pageId}_btn_export_mail_model|" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-quanka"></i>导出邮件模板</a>
        <!-- add by zengchengfa start 20210809 -->
        <a th:id="|${pageId}_btn_export_pdf|" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-quanka"></i>导出PDF单据</a>
        <!-- add by zengchengfa end -->
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
        <form class="layui-form" id="submitForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TrdRepoTrade001.entrustId}">委托代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="entrustId" name="entrustId"
                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-data-url="@{/invest/trade/trdrepotrade/TrdRepoTrade001/getEntrustIdByType}" data-idfield="code"
                               data-keyfield="name"
                               data-th-data-effectivefieldsalias='|{"code":"#{TrdRepoTrade001.entrustId}","shortName":"#{TrdRepoTrade001.entrustId}"}|'
                               data-th-value="${entity?.entrustId}">
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TrdRepoTrade001.portfolioId}">组合代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="portfolioId" name="portfolioId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?ww=false}"
                                data-th-value="${entity?.portfolioId}"
                                multiple="true">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TrdRepoTrade001.tradeDate}">交易日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="tradeDate" name="tradeDate"
                               class="layui-input form-input input-dateRangeSelect" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-value="${#dates.format(entity?.tradeDate,'yyyy-MM-dd')}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TrdRepoTrade001.repoType}">回购类型</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="repoType" name="repoType" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${TARGET_BACK_TYPE}' allowClear="true" formatoption="true"
                                data-th-initValue="${entity?.repoType}"></select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TrdRepoTrade001.ps}">交易方向</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="ps" name="ps" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${BACK_LEND_DIRECTION}' allowClear="true" formatoption="true"
                                data-th-initValue="${entity?.ps}"></select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TrdRepoTrade001.validStatus}">有效状态</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="validStatus" name="validStatus"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${TRADE_FLOW_STATUS}'
                                allowClear="true" formatoption="true"
                                data-th-initValue="${entity?.validStatus}"></select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4" id="chlFinprodId_div">
                    <label class="layui-form-label form-label-wrap"
                           th:text="#{TrdRepoTrade001.chlFinprodId}">合作资产</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="chlFinprodId" name="chlFinprodId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                th:placeholder="#{SysCommon.placeholder}"  th:data-url="@{/invest/asset/channel/ChannelAsset001/getSecAcctId}"
                                allowClear="true"
                                multiple="true"></select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-label-wrap"
                           th:text="#{TrdRepoTrade001.finprodName}">抵押品代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="finprodId" name="finprodId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                th:placeholder="#{SysCommon.placeholder}" th:data-url="@{/component/trade/BussRepoSecDialog/getBondCode}"
                                allowClear="true"
                                multiple="true"></select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4" id ="fTradeIdDiv">
							<label class="layui-form-label form-lable">银行间成交编号 </label>
							<div class="layui-input-inline input-inline">
								<input id="fTradeId" name="fTradeId" 
									class="layui-input form-input" allowClear="true" placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"/>
							</div>
				</div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        // 回购类型_质押式协议回购
        var TARGET_BACK_TYPE_H01 = /*[[${TARGET_BACK_TYPE_H01}]]*/'';
        // 回购拆借方向_正回购
        var BACK_LEND_DIRECTION_03 = /*[[${BACK_LEND_DIRECTION_03}]]*/'';
        var fTradeId = /*[[${fTradeId}]]*/'';
        var cstpEntrustId = /*[[${entrustId}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/trade/trdrepotrade/TrdRepoTrade001.js}" type="text/javascript"></script>
</div>
</body>
</html>
