<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{LendTransfer001}">净值型计划转仓</title>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
        <form class="layui-form" id="lendTransferForm">
            <!-- 隐藏字段 组合代码 -->
<!--
            <input type="text" id = "portfolioIdOut" name="portfolioIdOut" data-th-value='${entity?.portfolioIdOut}' hidden>
-->
            <!-- 隐藏字段 交易日历编号 -->
            <input type="text" id = "calendarId" name="calendarId" data-th-value='${entity?.calendarId}' hidden>
            <!-- 隐藏字段 原交易编号 -->
            <input type="text" id = "tradeId" name="tradeId" data-th-value='${entity?.tradeId}' hidden>
            <div class="pro-module-wrapper pro-module-base" title="基本信息">
                <!-- 交易信息 -->
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">交易信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">转出组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="portfolioIdOut" name="portfolioIdOut"
                                                disabled class="layui-input form-input input-select"
                                                data-th-data-url="@{/invest/trade/transfer/assetstransfer/AssetsTransfer001/getPortfolioId}"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:initValue="${entity?.portfolioIdOut}"
                                                placeholder="请输入内容">
                                        </select>
                                    </div>
                                </div>
                                <!-- 拆借类型 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">拆借类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select name="paBussType" id="LendTransfer001_paBussType"
                                                class="layui-input form-input input-select"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue='${entity?.paBussType}' disabled = "disabled"
                                                data-th-data-result="${BANK_LENDING_TYPE}">
                                        </select>
                                    </div>
                                </div>
                                <!-- 交易方向 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交易方向</label>
                                    <div class="layui-input-inline input-inline">
                                        <select name="ps" id="LendTransfer001_ps"
                                                class="layui-input form-input input-select"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue='${entity?.ps}' disabled = "disabled"
                                                data-th-data-result="${BACK_LEND_DIRECTION}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <!-- 交易日期 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交易日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="tradeDate"
                                               id="LendTransfer001_tradeDate" disabled = "disabled"
                                               class="layui-input form-input input-dateSelect"
                                               data-th-value='${#dates.format(entity?.tradeDate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <!-- 起息日 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">起息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="vdate"
                                               id="LendTransfer001_vdate" disabled = "disabled"
                                               class="layui-input form-input input-dateSelect"
                                               data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <!-- 到期日 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">到期日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="mdate"
                                               id="LendTransfer001_mdate" disabled = "disabled"
                                               class="layui-input form-input input-dateSelect"
                                               data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <!-- 计息基础 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">计息基础</label>
                                    <div class="layui-input-inline input-inline">
                                        <select name="basis" id="LendTransfer001_basis"
                                                class="layui-input form-input input-select"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue='${entity?.basis}' disabled = "disabled"
                                                data-th-data-result="${BASIS}">
                                        </select>
                                    </div>
                                </div>
                                <!-- 币种 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select name="ccy" id="LendTransfer001_ccy"
                                                class="layui-input form-input input-select"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue='${entity?.ccy}' disabled = "disabled"
                                                data-th-data-result="${CCY}">
                                        </select>
                                    </div>
                                </div>
                                <!-- 利率% -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">利率%</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="intRate" id="LendTransfer001_intRate"
                                               class="layui-input form-input text-number" disabled = "disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-textrange="2" data-th-value='${entity?.intRate}'>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <!-- 本金金额 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">本金金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="prin" id="LendTransfer001_prin"
                                               class="layui-input form-input text-number" disabled = "disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-textrange="2" data-th-value='${entity?.prin}'>
                                    </div>
                                </div>
                                <!-- 剩余可转仓份额 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">剩余可转仓份额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="undistributedAmount" id="LendTransfer001_undistributedAmount"
                                               class="layui-input form-input text-number" disabled = "disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-textrange="2" data-th-value='${entity?.undistributedAmount}'>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 拆借资产转仓 -->
                <div class="pro-module-wrap" title="拆借资产转仓">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">拆借资产转仓</span><i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <!-- 组合代码 -->
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">组合代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="LendTransfer001_portfolioId" name="portfolioId"
                                                    parentids="portfolioIdOut,LendTransfer001_ccy,LendTransfer001_tradeDate"
                                                    allowClear="true"
                                                    class="layui-input form-input input-select" maxLength="32"
                                                    data-th-data-url="@{/invest/trade/transfer/lendtransfer/LendTransfer001/getPortfolioId}"
                                                    formatoption = false placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}" required >
                                            </select>
                                        </div>
                                    </div>
                                    <!-- 本金金额 -->
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">本金金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="prinAmt" id="LendTransfer001_prinAmt"
                                                   class="layui-input form-input text-number"
                                                   data-textrange="2" required>
                                        </div>
                                    </div>
                                    <!-- 应计利息总额 -->
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">应计利息总额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="intAmt" id="LendTransfer001_intAmt"
                                                   class="layui-input form-input text-number" data-th-value='${entity?.intAmt}'
                                                   data-textrange="2" disabled = "disabled">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <!-- 交易金额 -->
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">交易金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="tradeAmt" id="LendTransfer001_tradeAmt"
                                                   class="layui-input form-input text-number"
                                                   data-textrange="2">
                                        </div>
                                    </div>
                                    <!-- 按钮 -->
                                    <div class="form-inline-wrap">
                                        <!-- 添加按钮-->
                                        <a id="LendTransfer001_btn_add" class="layui-btn layui-btn-sm"><i class="iconfont icon-plus"></i>
                                            <span data-th-text="#{SysCommon.add}">添加</span></a>
                                        <!-- 待转仓产品组合查询链接-->
                                        <a id="LendTransfer001_btn_searchInfo" class="layui-btn layui-btn-sm">待转仓产品组合查询</a>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <!-- 组合现金、持仓查询 -->
                                    <div id="avaStandardBondPositionDiv" class="page-component" th:data-path="@{/component/trade/BussTrdAvailableCashQuery/init}"
                                         th:data-params="|{entityName: 'bussTrdAvailableCashQuery'}|"></div>
                                </div>
                                <div>
                                    <table class="layui-table pro-table-wrap" id="dataTable"></table>
                                </div>
                                <!-- 风险试算 -->
            					<div th:if="${isEleShow['LendTransfer001_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}" 
            						th:data-params="|{entity: '${riskTrialRetDto}',workflowId:'${workflowId?: ''}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|">
            					</div>
                            </div>
                        </div>
                    </div>
                    <div class="row text-center stepbar">
                        <a th:if="${isEleShow['LendTransfer001_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'"
               				th:id="|${pageId}_btn_risk|" class="layui-btn layui-btn-sm"
               				data-th-text="#{LendTransfer001.risk}">风险试算</a>
                        <a id="LendTransfer001_btn_save" class="layui-btn layui-btn-sm btn-save"
                           data-th-text="#{SysCommon.save}">保存</a>
                        <a id="LendTransfer001_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                           data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="LendTransfer001_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                           data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var BACK_LEND_DIRECTION_01 = /*[[${BACK_LEND_DIRECTION_01}]]*/'';
        var BACK_LEND_DIRECTION_02 = /*[[${BACK_LEND_DIRECTION_02}]]*/'';
        var formTodoList = /*[[${formTodoList}]]*/false;
        var entityData = JSON.parse(/*[[${entityData}]]*/'{}');
        var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
        var FINPROD_TYPE_F08 = /*[[${FINPROD_TYPE_F08}]]*/'';
        var FINPROD_TYPE_F09 = /*[[${FINPROD_TYPE_F09}]]*/'';
        var A_360 = /*[[${A_360}]]*/'';
        var A_365 = /*[[${A_365}]]*/'';
        var BANK_LENDING_TYPE_02 = /*[[${BANK_LENDING_TYPE_02}]]*/'';
    </script>
    <script data-th-src="@{/js/component/common/TradeCommon.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/invest/trade/transfer/lendtransfer/LendTransfer001.js}"></script>
</div>
</body>
</html>
