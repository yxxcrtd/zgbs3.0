<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{NetPlanTransfer001}">净值型计划转仓</title>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
        <form class="layui-form" id="netPlanTransferForm">
            <!-- 隐藏字段 通道代码 -->
            <input type="text" id = "chlId" name="chlId" data-th-value='${entity?.chlId}' hidden>
            <!-- 隐藏字段 单位净值 -->
            <input type="text" id = "unitPrice" name="unitPrice" data-th-value='${entity?.unitValue}' hidden>
            <!-- 隐藏字段 组合代码 -->
            <input type="text" id = "portfolioId" name="portfolioId" data-th-value='${entity?.portfolioIdOut}' hidden>
<!--
            <input type="text" id = "portfolioIdOut" name="portfolioIdOut" data-th-value='${entity?.portfolioIdOut}' hidden>
-->
            <!-- 隐藏字段 证券托管账户 -->
            <input type="text" id = "secAcctId" name="secAcctId" data-th-value='${entity?.secAcctId}' hidden>
            <!-- 隐藏字段 交易日历编号 -->
            <input type="text" id = "calendarId" name="calendarId" data-th-value='${entity?.calendarId}' hidden>
            <!-- 隐藏字段 金融产品代码 -->
            <input type="text" id = "finprodId" name="finprodId" data-th-value='${entity?.finprodId}' hidden>
            <!-- 隐藏字段 type7 -->
            <input type="text" id = "type7" name="type7" data-th-value='${entity?.type7}' hidden>
            <div class="pro-module-wrapper pro-module-base" title="基本信息">
                <!-- 交易信息 -->
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">交易信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">转出组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="portfolioIdOut" name="portfolioIdOut"
                                                disabled class="layui-input form-input input-select"
                                                data-th-data-url="@{/invest/trade/transfer/assetstransfer/AssetsTransfer001/getPortfolioId}"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:initValue="${entity?.portfolioIdOut}"
                                                placeholder="请输入内容">
                                        </select>
                                    </div>
                                </div>
                                <!-- 资产代码 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="finprodMarketId" id="NetPlanTransfer001_finprodMarketId"
                                               class="layui-input form-input" maxlength=60 disabled = "disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${entity?.finprodMarketId}'>
                                    </div>
                                </div>
                                <!-- 资产名称 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="finprodAbbr" id="NetPlanTransfer001_finprodAbbr"
                                               class="layui-input form-input" maxlength=60 disabled = "disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${entity?.finprodAbbr}'>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <!-- 交易日期 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交易日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="tradeDate"
                                               id="NetPlanTransfer001_tradeDate" disabled = "disabled"
                                               class="layui-input form-input input-dateSelect"
                                               data-th-value='${#dates.format(entity?.tradeDate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <!-- 币种 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select name="ccy" id="NetPlanTransfer001_ccy"
                                                class="layui-input form-input input-select"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue='${entity?.ccy}' disabled = "disabled"
                                                data-th-data-result="${CCY}">
                                        </select>
                                    </div>
                                </div>
                                <!-- 对账状态 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">对账状态</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="reconciliationStatus"
                                               id="NetPlanTransfer001_reconciliationStatus"
                                               class="layui-input form-input" disabled="disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${entity?.checkStatus}'>
                                    </div>
                                </div>
                                <!-- 通道 -->
                                <div class="form-inline-wrap" style="display:none">
                                    <label class="layui-form-label form-label-wrap">通道</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="chlName" id="NetPlanTransfer001_chlName"
                                               class="layui-input form-input" maxlength=60 disabled = "disabled"
                                               data-th-value='${entity?.chlName}'>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <!-- 持仓份额 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">持仓份额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="posAmt" id="NetPlanTransfer001_posAmt"
                                               class="layui-input form-input text-number" disabled = "disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-textrange="2" data-th-value='${entity?.posAmt}'>
                                    </div>
                                </div>
                                <!-- 剩余可转仓份额 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">剩余可转仓份额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="undistributedAmount" id="NetPlanTransfer001_undistributedAmount"
                                               class="layui-input form-input text-number" disabled = "disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-textrange="2" data-th-value='${entity?.undistributedAmount}'>
                                    </div>
                                </div>
                                <!-- 估值状态 -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">估值表状态</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" name="valueStatus"
                                               id="NetPlanTransfer001_valueStatus"
                                               class="layui-input form-input" disabled="disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${entity?.valueStatus}'>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 净值型计划转仓 -->
                <div class="pro-module-wrap" title="净值型计划转仓">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">净值型计划转仓</span><i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <!-- 组合代码 -->
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">组合代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="NetPlanTransfer001_portfolioId" name="portfolioId"
                                                    parentids="portfolioIdOut,NetPlanTransfer001_tradeDate,NetPlanTransfer001_ccy"
                                                    allowClear="true"
                                                    class="layui-input form-input input-select" maxLength="32"
                                                    data-th-data-url="@{/invest/trade/transfer/netplantransfer/NetPlanTransfer001/getPortfolioId}"
                                                    formatoption = false placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}" required >
                                            </select>
                                        </div>
                                    </div>
                                    <!-- 交易份额 -->
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">交易份额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="tradeAmt" id="NetPlanTransfer001_tradeAmt"
                                                   class="layui-input form-input text-number"
                                                   data-textrange="2" required>
                                        </div>
                                    </div>
                                    <!-- 单位净值 -->
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">单位净值</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="unitValue" id="NetPlanTransfer001_unitValue"
                                                   class="layui-input form-input text-number" data-th-value='${entity?.unitValue}'
                                                   data-textrange="4" required>
                                            <span id="deviationDegree" class="input-right-show" style="color: red;margin-right: 15px;"></span>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <!-- 交易金额 -->
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">交易金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="tradeMoney" id="NetPlanTransfer001_tradeMoney"
                                                   class="layui-input form-input text-number" disabled = "disabled"
                                                   data-textrange="2">
                                        </div>
                                    </div>
                                    <!-- 组合现金、持仓查询 -->
<!--                                    <div id="avaStandardBondPositionDiv" class="page-component" th:data-path="@{/component/trade/BussTrdAvailableCashQuery/init}"-->
<!--                                         th:data-params="|{entityName: 'bussTrdAvailableCashQuery'}|"></div>-->
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" id="portoAvailable">
                                        <label class="layui-form-label form-label-wrap">组合可用现金</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="portoAvailableAmt" name="portoAvailableAmt"
                                                   class="layui-input form-input text-number" disabled="disabled"
                                                   data-th-placeholder="#{SysCommon.placeholder}" data-textrange="2">
                                        </div>
                                    </div>
                                </div>

                                <div class="layui-form-item">
                                    <!-- 按钮 -->
                                    <div class="form-inline-wrap">
                                        <!-- 添加按钮-->
                                        <a id="NetPlanTransfer001_btn_add" class="layui-btn layui-btn-sm"><i class="iconfont icon-plus"></i>
                                            <span data-th-text="#{SysCommon.add}">添加</span></a>
                                        <!-- 待转仓产品组合查询链接-->
                                        <a id="NetPlanTransfer001_btn_searchInfo" class="layui-btn layui-btn-sm">待转仓产品组合查询</a>
                                    </div>
                                </div>
                                <div>
                                    <table class="layui-table pro-table-wrap" id="dataTable"></table>
                                </div>
                                <!-- 划款指令 -->
                                <div id="BussTrdTransferOrder" class="page-component" th:data-path="@{/component/trade/BussTrdTransferOrder/init}" th:data-params="|{entityList: '${bussTrdTransferOrder}',entityName:'bussTrdTransferOrder', isMulti : 'Y',bizCode:'${stlPayId}'}|"></div>
                                <!-- 风险试算 -->
            					<div th:if="${isEleShow['NetPlanTransfer001_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}" 
            						th:data-params="|{entity: '${riskTrialRetDto}',workflowId:'${workflowId?: ''}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|">
            					</div>
                            </div>
                        </div>
                    </div>
                    <div class="row text-center stepbar">
                    	<a th:if="${isEleShow['NetPlanTransfer001_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'"
               				th:id="|${pageId}_btn_risk|" class="layui-btn layui-btn-sm"
               				data-th-text="#{NetPlanTransfer001.risk}">风险试算</a>
                        <a id="NetPlanTransfer001_btn_save" class="layui-btn layui-btn-sm btn-save"
                           data-th-text="#{SysCommon.save}">保存</a>
                        <a id="NetPlanTransfer001_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                           data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="NetPlanTransfer001_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                           data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var PS_T01 = /*[[${PS_T01}]]*/'T01'; // 数据字典.交易方向_买入
        var PS_T02 = /*[[${PS_T02}]]*/'T02'; // 数据字典.交易方向_卖出
        var formTodoList = /*[[${formTodoList}]]*/false;
        var entityData = JSON.parse(/*[[${entityData}]]*/'{}');
        var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
        var FINPROD_TYPE_F17 = /*[[${FINPROD_TYPE_F17}]]*/'';
        var PS_T01 = /*[[${PS_T01}]]*/'T01';
    </script>
    <script data-th-src="@{/js/component/common/TradeCommon.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/invest/trade/transfer/netplantransfer/NetPlanTransfer001.js}"></script>
</div>
</body>
</html>
