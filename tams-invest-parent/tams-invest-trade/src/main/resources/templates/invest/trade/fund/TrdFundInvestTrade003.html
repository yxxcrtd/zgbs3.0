<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
    layout:decorate="~{layout/default}">
<head>
<title th:text="#{TrdFundInvestTrade003}">基金投资交易确认</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="pro-module-container">
            <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
                <div class="pro-module-wrapper pro-module-base" th:title="#{TrdFundInvestTrade002.baseInfo}">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des" th:text="#{TrdFundInvestTrade002.baseInfo}">基本信息</span>
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <input type="hidden" id="finprodType2" name="finprodType2" th:value="${entity?.finprodType2}">
                            <input type="hidden" id="calendarId" name="calendarId" th:value="${entity?.calendarId}">
                            <input type="hidden" id="tradeId" name="tradeId" th:value="${entity?.tradeId}">
                            <input type="hidden" id="bTradeId" name="bTradeId" th:value="${entity?.bTradeId}">
                            <input type="hidden" id="isPayWithTrade" name="isPayWithTrade" th:value="${entity?.isPayWithTrade}">
                            <input type="hidden" id="collectType" name="collectType" th:value="${entity?.collectType}">
                            <input type="hidden" id="shareAmtSg" name="shareAmtSg" th:value="${entity?.shareAmt}">
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdFundInvestTrade002.entrustId}">委托代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <input disabled type="text" id="entrustId" name="entrustId"
                                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:data-url="@{/business/common/CommonSelect/getEntrustId}"
                                                data-idfield="code" data-keyfield="name"
                                                th:data-effectivefieldsalias='|{"code":"#{TrdFundInvestTrade002.entrustId}","shortName":"#{TrdFundInvestTrade002.entrustId}"}|'
                                                th:value="${entity?.entrustId}">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdFundInvestTrade002.portfolioId}">组合代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <select required type="text" id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" disabled="disabled"
                                                th:data-url="@{/business/common/CommonSelect/selectPortfolioId}"
                                                th:initvalue="${entity?.portfolioId}"></select>
                                        </div>
                                    </div>
                                    <div id="ps_div" class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdFundInvestTrade002.ps}">交易方向</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="ps" name="ps" required="required"
                                                disabled="disabled" class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${PS}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.ps}"></select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdFundInvestTrade002.tradeDate2}">确认日期</label>
                                        <div class="layui-input-inline input-inline">
                                            <input required disabled type="text" id="tradeDate" name="tradeDate"
                                                class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${entity?.tradeDate==null ? platDate : #dates.format(entity?.tradeDate,'yyyy-MM-dd')}">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdFundInvestTrade002.finprodName}">资产代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="finprodId" name="finprodId"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" disabled="disabled"
                                                th:data-url="@{/invest/trade/fund/TrdFundInvestTrade002/getFinprodId}"
                                                allowClear="true" formatoption="false" required="required"
                                                th:initValue="${entity?.finprodMarketId}"></select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdFundInvestTrade002.finprodId}">资产名称</label>
                                        <div class="layui-input-inline input-inline">
                                            <input required disabled type="text" id="finprodName" name="finprodName"
                                                class="layui-input form-input" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${entity?.finprodName}">
                                            <a id="TrdFundInvestTrade003_btn_view"
                                                class="layui-btn layui-btn-sm form-input-text" data-ignore=true>查看</a>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" id="trmFundAbbr_div">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdFundInvestTrade002.trmFundAbbr}">交易所基金简称</label>
                                        <div class="layui-input-inline input-inline">
                                            <input disabled type="text" id="trmFundAbbr" name="trmFundAbbr"
                                                class="layui-input form-input" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${entity?.trmFundAbbr}">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdFundInvestTrade002.tradeMarket}">交易场所</label>
                                        <div class="layui-input-inline input-inline">
                                            <select required type="text" id="tradeMarket" name="tradeMarket"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" disabled="disabled"
                                                th:data-result='${TRADE_PLACE}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.tradeMarket}"></select>
                                        </div>
                                    </div>
                                    <div id="expectedArrivalDate_div" class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" id="expectedArrivalDate_label"
                                            th:text="#{TrdFundInvestTrade002.expectedArrivalDate}">预计到账日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input required disabled type="text" id="expectedArrivalDate"
                                                name="redCfmDate" class="layui-input form-input input-dateSelect"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${entity?.redCfmDate==null ? platDate : #dates.format(entity?.redCfmDate,'yyyy-MM-dd')}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" style="display: none">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdFundInvestTrade002.type6}">基金类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="type6" name="type6" required="required"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" disabled="disabled"
                                                th:data-result='${FUND_ASSET_TYPE}' allowClear="true"
                                                formatoption="true" th:initValue="${entity?.type6}"></select>
                                        </div>
                                    </div>
                                    <!-- 新增资产二、三、四级分类 王贵奇 2019/8/5 开始 -->
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdFundInvestTrade001.type9}">资产二级分类</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="type9" name="type9" required="required"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" disabled="disabled"
                                                th:data-result='${CUSTOM_ASSET_TYPE_TWO}' allowClear="true"
                                                formatoption="true"></select>
                                        </div>
                                    </div>
                                   <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdFundInvestTrade001.type10}">资产三级分类</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="type10" name="type10" required="required"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" disabled="disabled"
                                                th:data-result='${CUSTOM_ASSET_TYPE_THREE}' allowClear="true"
                                                formatoption="true"></select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style="display: none" id = "type11Div">
                                        <label class="layui-form-label form-label-wrap"
                                            th:text="#{TrdFundInvestTrade001.type11}">资产四级分类</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="type11" name="type11" required="required"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" disabled="disabled"
                                                th:data-result='${CUSTOM_ASSET_TYPE_FOUR}' allowClear="true"
                                                formatoption="true"></select>
                                        </div>
                                    </div>
                                    <!-- 新增资产二、三、四级分类 王贵奇 2019/8/5 结束 -->
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               th:text="#{TrdFundInvestTrade002.trmFundType}">交易所基金类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="trmFundType" name="trmFundType"
                                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                                    th:placeholder="#{SysCommon.placeholder}" disabled="disabled"
                                                    th:data-result='${TRM_FUND_TYPE}' allowClear="true"
                                                    formatoption="true" th:value="${entity?.trmFundType}"></select>
                                        </div>
                                    </div>
                           <div class="form-inline-wrap">
                              <label class="layui-form-label form-label-wrap"
                                 th:text="#{TrdFundInvestTrade002.secManageAcctId}">证券托管户</label>
                              <div class="layui-input-inline input-inline">
                                 <select type="text" id="secManageAcctId" disabled
                                    name="secManageAcctId" parentIds="portfolioId"
                                    class="layui-input form-input input-select"
                                    placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                    th:data-url="@{/invest/trade/stockdeal/TrdStock002/getSecManageAcctId}"
                                    allowClear="true" th:initValue="${entity?.secManageAcctId}"></select>
                              </div>
                           </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{invest.channelId}">通道</label>
                                        <div class="layui-input-inline input-inline">
                                        <select type="text" id="chlId" name="chlId" disabled
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:data-url="@{/component/trade/BussChannelCommon/getChannelIdAndCollectType}"
                                                allowClear="true" th:initValue="${entity?.chlId}"></select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item changein">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable">转入资产简称</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="changeToFinprodMarketId" name="changeToFinprodMarketId" class="layui-input form-input input-select"
                                                    allowClear="true" placeholder="请输入内容" parentIds="finprodId" disabled
                                                    data-th-data-url="@{/invest/trade/fund/TrdFundInvestTrade002/getFinprodId?changeTo=true}"
                                                    data-th-initValue="${entity?.changeToFinprodMarketId}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" >转入资产代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="changeToFinprodName" name="changeToFinprodName"
                                                   class="layui-input form-input" disabled
                                                   data-th-value="${entity?.changeToFinprodName}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <!-- modify by gaopeng 20191018 页面优化 start -->
                                     <div class="form-inline-wrap" style="display: none" id="proAvailableCash_div">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{TrdFundInvestTrade002.proAvailableCash}">组合T日可用现金</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="proAvailableCash" name="proAvailableCash"
                                                placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                                class="layui-input form-input text-number" disabled="disabled" />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style="display: none" id="proAvailableCash1_div">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{TrdFundInvestTrade002.proAvailableCash1}">组合T+1日可用现金</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="proAvailableCash1" name="proAvailableCash1"
                                                placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                                class="layui-input form-input text-number" disabled="disabled" />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" id="accAvailableCash_c_div" >
                                        <label class="layui-form-label form-lable" data-th-text="|#{invest.channelId}#{EtrInvestBondInfo002.channelAvailableCash}|">通道可用现金</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="channelAvailableCash" name="channelAvailableCash" data-fixtype="2"
                                                   class="layui-input form-input text-number" disabled="disabled"/>
                                                <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" style="display: none" id="accAvailableCash_div">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{TrdFundInvestTrade002.accAvailableCash}">托管户剩余现金</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="accAvailableCash" name="accAvailableCash"
                                                placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                                class="layui-input form-input text-number" disabled="disabled" />
                                        </div>
                                    </div>
                                   <div class="form-inline-wrap" style="display: none" id="tradeMarketAccAvailableCash_div">
                                       <label class="layui-form-label form-lable" data-th-text="#{TrdFundInvestTrade002.tradeMarketAccAvailableCash}">交易所资金账户可用现金</label>
                                       <div class="layui-input-inline input-inline">
                                           <input type="text" id="tradeMarketAccAvailableCash" name="tradeMarketAccAvailableCash" placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                                  class="layui-input form-input text-number" disabled="disabled"/>
                                       </div>
                                   </div>
                                    <div class="form-inline-wrap" id="assetAvailablePosition_div" Style="display: none">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{TrdFundInvestTrade002.assetAvailablePosition}">资产可用持仓</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="assetAvailablePosition" name="assetAvailablePosition"
                                                placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                                class="layui-input form-input text-number" disabled="disabled" />
                                        </div>
                                    </div>
                                </div>
                                  <!-- modify by gaopeng 20191018 页面优化 end -->
                                <!-- 组合现金、持仓查询 -->
                                <!-- <div class="page-component"
                                    th:data-path="@{/component/trade/BussTrdAvailableCashQuery/init}"
                                    th:data-params="|{entityName: 'bussTrdAvailableCashQuery'}|"></div> -->
                            </div>
                        </div>
                    </div>
                </div>
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" th:text="#{TrdFundInvestTrade002.amtInfo}">金额信息</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                        th:text="#{TrdFundInvestTrade002.ccy}">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select disabled type="text" id="ccy" name="ccy" required="required"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}" th:data-result='${CCY}'
                                            allowClear="true" formatoption="true" th:initValue="*{entity?.ccy?:CCY_default}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap tradeAmt_div">
                                    <label class="layui-form-label form-label-wrap"
                                        th:text="#{TrdFundInvestTrade002.tradeAmt}">交易金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <!-- tradeAmtHid赎回确认时存：初始本金金额，认申购确认时存：本金-随交易支付的费用 -->
                                        <input type="hidden" id="tradeAmtHid" th:value="${entity?.prinAmt}">
                                        <!-- tradeAmtHid2存初始本金金额，不会修改，认申购确认用 -->
                                        <input type="hidden" id="tradeAmtHid2" th:value="${entity?.prinAmt}">
                                        <input required type="text" id="tradeAmt" name="tradeAmt" disabled="disabled"
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.tradeAmt}">
                                    </div>
                                </div>
                                <div id="tradeSha_div" class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" id="shareAmt_label" >交易份额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="shareAmt" name="shareAmt"
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.shareAmt}">
                                    </div>
                                </div>
                                <div id="changeInShareAmt_div" class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" id="changeInShareAmt_label" >转入基金确认份额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="changeInShareAmt" name="changeInShareAmt"
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.changeInShareAmt}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div id="carryAmt_div" class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                        th:text="#{TrdFundInvestTrade002.carryAmt}">待结转份额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="carryAmt" name="intAmt" 
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.intAmt}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap unitCprice_out_div">
                                    <label class="layui-form-label form-label-wrap" id="unitCprice_out_label"
                                        th:text="#{TrdFundInvestTrade002.unitCprice}">单位净值</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="unitCprice" name="unitCprice" disabled="disabled"
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}" data-textrange="4">
                                    </div>
                                </div>
                                <div class="form-inline-wrap unitCprice_in_div">
                                    <label class="layui-form-label form-label-wrap" id="unitCprice_in_label"
                                        th:text="#{TrdFundInvestTrade002.unitCpriceIn}">转入基金单位净值</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="unitCpriceIn" name="unitCpriceIn" disabled="disabled"
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}" data-textrange="4">
                                    </div>
                                </div>
                                <div id="netDate_div" class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                        th:text="#{TrdFundInvestTrade002.netDate}">净值日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="netDate" name="cpriceDate"
                                            class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.cpriceDate==null ? platDate : #dates.format(entity?.cpriceDate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                                <div id="purchaseFee_div" class="form-inline-wrap" style="margin-top: 6px;">
                                    <label id="subscribe" style="display:none" class="layui-form-label form-label-wrap"
                                        th:text="#{TrdFundInvestTrade002.subscribeFee}">认购费</label>
                                    <label id="purchase" class="layui-form-label form-label-wrap"
                                        th:text="#{TrdFundInvestTrade002.purchaseFee}">申购费</label>
                                    <label id="redemp" class="layui-form-label form-label-wrap"
                                        th:text="#{TrdFundInvestTrade002.redemptionFee}">赎回费</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="feeAmtPay" name="feeAmtPay"
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.feeAmtPay}">
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div id="purchaseFee_div1" class="form-inline-wrap" style="display: none">
                                    <label id="purchase1" class="layui-form-label form-label-wrap"
                                        th:text="#{TrdFundInvestTrade002.purchaseFee}">申购费</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="feeAmtPayPurchase" name="feeAmtPayPurchase"
