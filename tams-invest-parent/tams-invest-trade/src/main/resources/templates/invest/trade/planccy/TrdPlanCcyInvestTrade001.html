<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{TrdPlanCcyInvestTrade001}">计划类（货币型）投资交易</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area">
            <a id="TrdPlanCcyInvestTrade001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
            <a id="TrdPlanCcyInvestTrade002_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create.ptl}">新建</a>
            <a id="TrdPlanCcyInvestTrade001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="#{SysCommon.revoke}"></a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdPlanCcyInvestTrade001.entrustId}">委托代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="entrustId" name="entrustId"
                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/trade/planccy/TrdPlanCcyInvestTrade001/getEntrustIdByType}" data-idfield="code"
                                data-keyfield="name"
                                data-th-data-effectivefieldsalias='|{"code":"#{TrdPlanCcyInvestTrade001.entrustId}","shortName":"#{TrdPlanCcyInvestTrade001.entrustId}"}|'
                                data-th-value="${entity?.entrustId}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                            data-th-text="#{TrdPlanCcyInvestTrade001.portfolioId}">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="portfolioId" name="portfolioId"
                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}" multiple="true"
                                    data-th-data-url="@{/invest/trade/trddepositinvesttrade/TrdDepositInvestTrade001/getPortfolioId}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdPlanCcyInvestTrade001.finprodId}">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="finprodId" name="finprodId"
                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/asset/common/getAssetId(finprodType2='F17',profitType='03')}" data-idfield="name"
                                data-keyfield="code"
                                data-th-data-effectivefieldsalias='|{"code":"#{TrdPlanCcyInvestTrade001.finprodId}","shortName":"#{TrdPlanCcyInvestTrade001.finprodName}"}|'
                                data-th-value="${entity?.finprodMarketId}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <!--隐藏资产类型，添加资产二级-四级分类 lishuping 2019/7/29 start-->
                   <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4" style="display: none">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdPlanCcyInvestTrade001.type6}">资产类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="type6" name="type6" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${PLAN_ASSET_TYPE}' allowClear="true" formatoption="true"
                                data-th-initValue="${entity?.type6}"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdPlanCcyInvestTrade001.type9}">资产二级分类</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="type9" name="type9" class="layui-input form-input input-select"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result='${CUSTOM_ASSET_TYPE_TWO}' allowClear="true" formatoption="true"
                                    multiple="true"
                                    data-th-initValue="${entity?.type9}"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdPlanCcyInvestTrade001.type10}">资产三级分类</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="type10" name="type10" class="layui-input form-input input-select"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result='${CUSTOM_ASSET_TYPE_THREE}' allowClear="true" formatoption="true"
                                    multiple="true"
                                    data-th-initValue="${entity?.type10}"
                                    childrenIds="type11" ></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4" style="display: none" id = "type11Div">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdPlanCcyInvestTrade001.type11}">资产四级分类</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="type11" name="type11" class="layui-input form-input input-select"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result='${CUSTOM_ASSET_TYPE_FOUR}' allowClear="true" formatoption="true"
                                    multiple="true"
                                    data-th-initValue="${entity?.type11}"
                                     parentIds="type10"></select>
                        </div>
                    </div>
                    <!--隐藏资产类型，添加资产二级-四级分类 lishuping 2019/7/29 end-->
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdPlanCcyInvestTrade001.ps}">交易方向</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="ps" name="ps" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${PS}' allowClear="true" formatoption="true"
                                data-th-initValue="${entity?.ps}"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                            data-th-text="#{TrdPlanCcyInvestTrade001.validStatus}">有效状态</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="validStatus" name="validStatus"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${TRADE_FLOW_STATUS}'
                                allowClear="true" formatoption="true" data-th-initValue="${entity?.validStatus}"></select>
                        </div>
                    </div>

                <!--<div class="layui-form-item">-->
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{TrdPlanCcyInvestTrade001.tradeDate}">交易日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="tradeDate" name="tradeDate"
                                class="layui-input form-input input-dateRangeSelect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-value="${#dates.format(entity?.tradeDate,'yyyy-MM-dd')}">
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
    	<script data-th-inline="javascript" type="text/javascript">
    	var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
    	</script>
        <script data-th-src="@{/js/invest/trade/planccy/TrdPlanCcyInvestTrade001.js}" type="text/javascript"></script>
        <script data-th-inline="javascript" type="text/javascript">
                                    var ps_T04 = /*[[${ps_T04}]]*/'';
                                    var ps_T05 = /*[[${ps_T05}]]*/'';
                                    var ps_T06 = /*[[${ps_T06}]]*/'';
                                    var ps_T19 = /*[[${ps_T19}]]*/'';
                                    var ps_T24 = /*[[${ps_T24}]]*/'';
                                    var ps_mr = /*[[${ps_mr}]]*/'';
                                    var ps_mc = /*[[${ps_mc}]]*/'';
                                </script>
    </div>
</body>
</html>
