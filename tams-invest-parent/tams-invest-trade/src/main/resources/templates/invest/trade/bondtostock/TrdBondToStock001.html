<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{TrdBondToStock001}">可转债转股</title>
</head>

<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a id="TrdBondToStock001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
        <a id="TrdBondToStock001_btn_revoke" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{pingan.common.revoke}" style="display:none;">撤销</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{TrdBondToStock001.entrustId}">委托代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="entrustId" name="entrustId"
                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-data-url="@{/business/common/CommonSelect/getEntrustId}" data-idfield="code"
                               data-keyfield="name"
                               data-th-data-effectivefieldsalias='|{"code":"#{TrdBondToStock001.entrustId}","shortName":"#{TrdBondToStock001.entrustId}"}|'
                        >
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{TrdBondToStock001.portfolioId}">组合代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="portfolioId" name="portfolioId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId}"
                                multiple="true" >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{TrdBondToStock001.finprodId}">转债代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="finprodId" name="finprodId"
                                class="layui-input form-input input-select" allowClear="true"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/entrust/etrbondtostock/EtrBondToStock001/getFinprodId}"
                                formatoption="true" multiple="true">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{TrdBondToStock001.finprodMarketId}">正股代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="finprodMarketId" name="finprodMarketId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/entrust/etrbondtostock/EtrBondToStock001/getShareId}"
                                multiple="true" >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{TrdBondToStock001.tradeMarket}">交易场所</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="tradeMarket" name="tradeMarket"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${TRADE_PLACE}'
                                allowClear="true" formatoption="true" data-th-initValue="${entity?.tradeMarket}"></select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{TrdBondToStock001.validStatus}">有效状态</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="validStatus" name="validStatus"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${STATUS_VALID}'
                                allowClear="true" formatoption="true" data-th-initValue="${entity?.validStatus}"></select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{TrdBondToStock001.tradeDate}">交易日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="tradeDate" name="tradeDate"
                               class="layui-input form-input input-dateRangeSelect" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}"/>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var PS_T04 = /*[[${PS_T04}]]*/'';
        var PS_T05 = /*[[${PS_T05}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/trade/bondtostock/TrdBondToStock001.js}" type="text/javascript"></script>
</div>
</body>

</html>
