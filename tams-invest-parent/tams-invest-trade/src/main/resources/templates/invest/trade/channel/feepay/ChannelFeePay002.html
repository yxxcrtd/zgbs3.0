<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{[#pageId]}">[#title]</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">业务信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">业务编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeId" name="tradeId" data-th-value="${entity?.tradeId}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{invest.channelId}">合作资产</label>
                                    <div class="layui-input-inline input-inline">
                                         <select id="finprodMarketId" name="finprodMarketId" class="layui-input form-input input-select" placeholder="请输入内容" required
                                                 data-th-data-url="@{/invest/trade/channel/feepay/ChannelFeePay001/findChannelId}"
                                                 data-th-initvalue="${entity?.finprodMarketId}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">费用名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="feeName" name="feeName" data-th-value="${feeName}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">计提结束日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" id="vdate" name="vdate" data-th-value="${entity?.vdate}"/>
                                        <input type="text" id="mdate" name="mdate" data-th-value="${#dates.format(entity?.mdate,'yyyy-MM-dd')}" class="layui-input form-input input-dateSelect" />
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">支付日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="settleDate" name="settleDate" data-th-value="${#dates.format(entity?.settleDate,'yyyy-MM-dd')}" class="layui-input form-input input-dateSelect" required/>
                                    </div>
                                </div>
<!--                                <div class="form-inline-wrap">-->
<!--                                    <label class="layui-form-label form-lable">组合代码</label>-->
<!--                                    <div class="layui-input-inline input-inline">-->
<!--                                        &lt;!&ndash; 只能选产品组合 &ndash;&gt;-->
<!--                                        <select type="text" id="portfolioId"  name="portfolioId" class="layui-input form-input input-select" placeholder="请输入内容"-->
<!--                                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?prod=true}" required-->
<!--                                                data-th-initvalue="${entity?.portfolioId}">-->
<!--                                        </select>-->
<!--                                    </div>-->
<!--                                </div>-->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdLendDuration001.ccy}">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select disabled id="ccy" name="ccy" allowClear="true" class="layui-input form-input input-select"
                                                data-th-data-result="${CCY}" placeholder="请输入内容"
                                                data-th-initValue='*{entity?.ccy?:CCY_default}'>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">理论费用</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="theoryInt" name="theoryInt" data-th-value="${entity?.theoryInt}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                                 <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">实付费用</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeAmt" name="tradeAmt" data-th-value="${entity?.tradeAmt}" required class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">是否结清</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="isClean" name="isClean" data-th-value="${entity?.isClean}" th:data-result="${YES_OR_NO}" class="layui-input form-input input-select" required/>
                                    </div>
                                </div>
                            </div>
                            <div id="fee_div">
                                <table class="layui-table" id="fee_dataTable" name="feeInfoList" th:title="#{InvestFeePay002.field.feeInfo}">
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 划款信息 -->
                <div class="page-component hkxx" th:data-path="@{/component/trade/BussTrdTransferOrder/init}"
                     th:data-params="|{entityName: 'bussTrdTransferOrder', pageFrom: 'informationForm', entityList:'${entity_bussTrdTransferOrderDto}', bizCode:'${entity?.tradeId}',isMulti:true}|"></div>
<!--                <div class="pro-module-wrap" th:id="|bussTrdTransferOrder_div|">-->
<!--                    <div class="pro-module">-->
<!--                        <h3 class="pro-module-title"><span class="title-des">指令信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>-->
<!--                        <div class="pro-module-item">-->
<!--                            <div class="layui-form-item">-->
<!--                                <input type="hidden" th:id="|bussTrdTransferOrder_payAcctNo|" th:name="selectValue" value="pay">-->
<!--                                <input type="hidden" th:id="|bussTrdTransferOrder_recAcctNo|" th:name="selectValue" value="rec">-->
<!--                                <a th:id="|bussTrdTransferOrder_btn_generate|" class="layui-btn layui-btn-sm" th:text="#{BussTrdTransferOrder.generate}">生成指令</a>-->
<!--                            </div>-->
<!--                            <table class="layui-table" th:id="|bussTrdTransferOrder_table|" th:name="bussTrdTransferOrder"></table>-->
<!--                        </div>-->
<!--                    </div>-->
<!--                </div>-->
            </div>
            <!-- 附件信息 -->
            <div class="page-component" th:data-path="@{/component/core/FileCommon/init}" th:data-params="|{entityName: 'fileCommonDto', businessId: '${entity?.tradeId ?: ''}'}|"></div>
            <!-- add by zhangpuyu 2019/10/29 start  -->
            <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" th:text="#{TrdForwexInvestTrade.remark}">备注</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div>
                                    <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                        <textarea name="remark" maxlength="200" th:text="${entity?.remark}"
                                                  class="layui-textarea" placeholder="请输入内容"
                                                  th:placeholder="#{SysCommon.placeholder}"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
              </div>
              <!-- add by zhangpuyu 2019/10/29 end  -->
            <div class="layui-form-item" data-th-if="${entity?.revokeReason}">
                <div class="layui-inline layui-col-md12 layui-col-sm12 layui-col-lg12 layui-col-xs12">
                    <fieldset class='adver-fieldset'>
                        <legend>撤销理由</legend>
                        <div class="layui-input-block" style="margin-left:0px;">
                        <textarea id="revokeReason" name="revokeReason" data-th-text="${entity?.revokeReason}" placeholder="请输入内容"
                                  class="layui-textarea"></textarea>
                        </div>
                    </fieldset>
                </div>
            </div>
        </div>
        <div class="layui-form-item" align="center">
            <a id="ChannelFeePay002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="ChannelFeePay002_btn_submit" class="layui-btn layui-btn-sm  btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="ChannelFeePay002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var YN_N = /*[[${YN_N}]]*/'N';
        var F28 = /*[[${F28}]]*/'F28';
        var T10 = /*[[${T10}]]*/'T10';
        var formTodoList = /*[[${formTodoList}]]*/'';
        var workflowId = /*[[${workflowId}]]*/'';
        var bussTrdTransferOrderDtos = /*[[${entity?.bussTrdTransferOrder}]]*/'';//划款指令
        var YES_NO = /*[[${YES_OR_NO}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/trade/channel/feepay/ChannelFeePay002.js}" type="text/javascript"></script>
</div>
</body>

</html>
