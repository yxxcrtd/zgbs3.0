<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">

<head>
<title data-th-text="#{TrdStock001}">股票交易</title>
</head>

<body>
	<div layout:fragment="content">
		<div class="form-button-area">
			<a id="TrdStock001_btn_add"
				class="layui-btn layui-btn-sm btn-create"
				data-th-text="#{SysCommon.create}">新建</a>
			<a id="TrdStock001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="#{SysCommon.revoke}"></a>
		</div>
		<div class="joyin-form-wrap joyin-filter-form condition-area">
			<form class="layui-form" id="searchForm">
				<div class="layui-form-item">

					<!--委托代码  -->
					<div
						class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							data-th-text="#{TrdStock001.entrustId}">指令代码</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="entrustId" name="entrustId"
								class="layui-input form-input input-lenovoselect"
								placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-url="@{/invest/trade/stockdeal/TrdStock001/getEntrustIdByType}"
								data-idfield="code" data-keyfield="name"
								data-th-data-effectivefieldsalias='|{"code":"#{TrdStock001.entrustId}","shortName":"#{TrdStock001.entrustId}"}|'
								data-th-value="${entity?.entrustId}">
						</div>
					</div>

					<!--组合代码  -->
					<div
						class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							data-th-text="#{TrdStock001.portfolioId}">组合代码</label>
						<div class="layui-input-inline input-inline">
							<select type="text" id="portfolioId" name="portfolioId"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-url="@{/invest/trade/trddepositinvesttrade/TrdDepositInvestTrade001/getPortfolioId}"
								data-th-value="${entity?.portfolioId}" multiple="true">
							</select>
						</div>
					</div>

					<!--资产代码  -->
					<div
						class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							data-th-text="#{TrdStock001.finprodId}">资产代码</label>
						<div class="layui-input-inline input-inline">
							<select type="text" id="finprodId" name="finprodId"
								class="layui-input form-input input-select" th:allowClear="true"
                                th:placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                 th:formatoption="false"
								th:data-url="@{/invest/trade/stockdeal/TrdStock002/getFinprodId}">
								<!-- data-th-data-effectivefieldsalias='|{"code":"#{TrdStock001.finprodId}","shortName":"#{TrdStock001.finprodName}"}|' -->
								<!-- data-th-value="${entity?.finprodId}" -->
								</select>
						</div>
					</div>
				</div>

				<!--交易场所 -->
				<div class="layui-form-item">
					<div
						class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							data-th-text="#{TrdStock001.tradeMarket}">交易场所</label>
						<div class="layui-input-inline input-inline">
							<select type="text" id="tradeMarket" name="tradeMarket"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result='${TRADE_PLACE}' allowClear="true"
								formatoption="true" data-th-initValue="${entity?.tradeMarket}" multiple="true"></select>
						</div>
					</div>

					<!--交易方式 -->
					<div
						class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							data-th-text="#{TrdStock001.dealMode}">交易方式</label>
						<div class="layui-input-inline input-inline">
							<select type="text" id="dealMode" name="dealMode"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result='${DEAL_MODE}' allowClear="true"
								formatoption="true" data-th-initValue="${entity?.dealMode}" multiple="true"></select>
						</div>
					</div>

					<!--交易方向 -->
					<div
						class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							data-th-text="#{TrdStock001.ps}">交易方向</label>
						<div class="layui-input-inline input-inline">
							<select type="text" id="ps" name="ps"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result='${PS}' allowClear="true"
								formatoption="true" data-th-initValue="${entity?.ps}" multiple="true"></select>
						</div>
					</div>

				</div>
				<div class="layui-form-item">

					<!--有效状态-->
					<div
						class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							data-th-text="#{TrdStock001.validStatus}">有效状态</label>
						<div class="layui-input-inline input-inline">
							<select type="text" id="validStatus" name="validStatus"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result='${TRADE_FLOW_STATUS}' allowClear="true"
								formatoption="true" data-th-initValue="${entity?.validStatus}"></select>
						</div>

					</div>
					<!--上市板 -->
					<div
						class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							data-th-text="#{TrdStock001.board}">上市板</label>
						<div class="layui-input-inline input-inline">
							<select type="text" id="board" name="board"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-data-result='${BOARD}' allowClear="true"
								formatoption="true" data-th-initValue="${entity?.board}" multiple="true"></select>
						</div>
					</div>

					<div
						class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							data-th-text="#{TrdStock001.tradeDate}">交易日期</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="tradeDate" name="tradeDate"
								class="layui-input form-input input-dateRangeSelect"
								placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-value="${#dates.format(entity?.tradeDate,'yyyy-MM-dd')}">
						</div>
					</div>
				</div>
			</form>
		</div>
		<div>
			<table class="layui-table" id="dataTable"></table>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var BOARD_BD03 = /*[[${BOARD_BD03}]]*/'';
			var DEAL_MODE_03 = /*[[${DEAL_MODE_03}]]*/'';
		</script>
		<script
			data-th-src="@{/js/invest/trade/stockdeal/TrdStock001.js}"
			type="text/javascript"></script>
	</div>
</body>

</html>
