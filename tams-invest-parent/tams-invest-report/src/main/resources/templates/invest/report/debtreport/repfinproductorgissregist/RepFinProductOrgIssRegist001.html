<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RepFinProductOrgIssRegist001.title}">机构和私人银行产品发行登记</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div
				class="layui-col-md12 layui-col-sm12 layui-col-lg12 layui-col-xs12 form-button-area"
				style="margin: 10px;"></div>
			<div class="joyin-form-wrap joyin-filter-form condition-area">
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{RepFinProductOrgIssRegist001.repFinprodName}">产品名称</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="repFinprodName" name="repFinprodName"
									class="layui-input form-input input-select" placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}" multiple="true"
									data-th-data-url="@{/invest/report/debtreport/repfinproductorgissregist/RepFinProductOrgIssRegist001/getRepFinprodName}">
								</select>
							</div>
						</div>
						<div
							class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{RepFinProductOrgIssRegist001.repInvestorType}">目标客户类型</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="repInvestorType" name="repInvestorType"
									class="layui-input form-input input-select" allowClear="true"
									placeholder="请输入内容" data-th-data-result='${SALETARGET_DECLARE}'
									data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
						<div
							class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{RepFinProductOrgIssRegist001.productStartingDate}">产品起始日期</label>
							<div class="layui-input-inline input-inline">
								<input id="productStartingDate" name="productStartingDate"
									class="layui-input form-input input-dateRangeSelect"
									placeholder="请选择时间区间">
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{RepFinProductOrgIssRegist001.repStatusDate}">数据日期</label>
							<div class="layui-input-inline input-inline">
								<input id="repStatusDate" name="repStatusDate"
									class="layui-input form-input input-dateRangeSelect"
									placeholder="请选择时间区间">
							</div>
						</div>
					</div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script
			data-th-src="@{/js/invest/report/debtreport/repfinproductorgissregist/RepFinProductOrgIssRegist001.js}"
			type="text/javascript"></script>
	</div>
</body>

</html>
