<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<html>
<html>
<head>
<title data-th-text="#{RepFinProductPerDeclare001}">个人产品申报登记</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
				<div class="layui-col-xs12 layui-col-md12 layui-col-sm12 layui-col-lg12 form-button-area" style="margin:10px;">
				<!-- <a id="RepFinProductPerDeclare001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}" >新建</a> -->
		        <a id="RepFinProductPerDeclare001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}" style="display:none;">删除</a>
	         	<a id="RepFinProductPerDeclare001_btn_createDeclaration" class="layui-btn layui-btn-sm">生成申报附件</a>
	   		</div>
	   		<div class='joyin-form-wrap joyin-filter-form condition-area'>
	   		<form class="layui-form" id="searchForm">
	        	<div class="layui-form-item">
	        		<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
	                    <label class="layui-form-label form-lable" data-th-text="#{RepFinProductPerDeclare001.productName}">产品名称</label>
	                    <div class="layui-input-inline input-inline">
	                    	<select type="text" id="finprodMarketId" name="finprodMarketId" class="layui-input form-input input-select"
                                allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" formatoption = "true" 
                                data-th-data-url="@{/invest/report/debtreport/repfinproductperdeclare/RepFinProductPerDeclare001/getFinprodMarketId}" 
                                multiple="true">
                            </select>
	                    </div>
	                </div>
	                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
		                <label class="layui-form-label form-lable" data-th-text="#{RepFinProductPerDeclare001.dataDate}">数据日期</label>
	                    <div class="layui-input-inline input-inline">
		                    <input id="repStatusDate" name="repStatusDate" type="text" class="layui-input form-input input-dateRangeSelect" placeholder="请选择、支持区间"
			                                data-th-placeholder="#{SysCommon.dateInterval}">
		                </div>
		            </div>
		            <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
		                <label class="layui-form-label form-lable" data-th-text="#{RepFinProductPerDeclare001.startDate}">募集起始日期</label>
	                    <div class="layui-input-inline input-inline">
		                    <input id="startEnd" name="startEnd" type="text" class="layui-input form-input input-dateRangeSelect" placeholder="请选择、支持区间"
			                                data-th-placeholder="#{SysCommon.dateInterval}">
		                </div>
		            </div>
	            </div>
	        </form>
	   		</div>
	       
	        <div>
	            <table class="layui-table" id="dataTable"></table>
	        </div>
		</div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/report/debtreport/repfinproductperdeclare/RepFinProductPerDeclare001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
