<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RepFinProductPerIssRegist001}">个人产品发行登记</title>

</head>
<body>
    <div layout:fragment="content">
        <div class='layui-fluid'>
             <div class="layui-col-md12 layui-col-sm12 layui-col-lg12 layui-col-xs12 form-button-area" style="margin: 10px;">
                
            </div>
            <div class='joyin-form-wrap joyin-filter-form condition-area'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{RepFinProductPerIssRegist001.repFinprodName}">产品名称</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="repFinprodName" name="repFinprodName"
                                class="layui-input form-input input-select"
                                placeholder="" multiple="true"
                                data-th-placeholder="#{SysCommon.placeholder}" 
                                data-th-data-url="@{/invest/report/debtreport/repfinproductperissregist/RepFinProductPerIssRegist001/getRepFinprodName}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{RepFinProductPerIssRegist001.repFinprodRegId}">产品登记编码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="repFinprodRegId" name="repFinprodRegId"
                                class="layui-input form-input"
                                placeholder=""/>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{RepFinProductPerIssRegist001.recruitmentDate}">募集日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="recruitmentDate" name="recruitmentDate"
                                class="layui-input form-input input-dateRangeSelect"
                                placeholder=""/>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{RepFinProductPerIssRegist001.dataDate}">数据日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="dataDate" name="dataDate"
                                class="layui-input form-input input-dateRangeSelect"
                                placeholder=""/>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{RepFinProductPerIssRegist001.repPrdVdate}">产品起始日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="repPrdVdate" name="repPrdVdate"
                                   class="layui-input form-input input-dateRangeSelect"
                                   placeholder=""/>
                        </div>
                    </div>
                </div>
            </form>
            </div>
           
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/report/debtreport/repfinproductperissregist/RepFinProductPerIssRegist001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
