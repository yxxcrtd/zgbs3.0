<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RepFinProductBalance}">产品余额表查询</title>
</head>
<body>
    <div layout:fragment="content" id="RepFinProductBalance_DIV">
        <div class="form-button-area">
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
        <form class="layui-form "  id="searchForm" >
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{RepFinProductBalance.querydate}">日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="queryDate" name="queryDate" data-th-value='${#dates.format(entity?.querydate?:iPlatformDate,"yyyy-MM-dd")}' required="required" class="layui-input form-input input-dateSelect"/>
                    </div> 
                </div>     
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{RepFinProductBalance.portfolioId}">组合代码</label>
                     <div class="layui-input-inline input-inline">
                        <select type="text" id="portfolioId" name="portfolioId" class="layui-input form-input input-select" data-th-data-url="@{/invest/portfolio/ptlactivityperiod/PtlActivityPeriod001/getPortfolioId}" formatoption = true placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"   multiple="true">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{RepFinProductBalance.finprodId}">产品代码</label>
                     <div class="layui-input-inline input-inline">
                        <select type="text" id="finprodId" name="finprodId" class="layui-input form-input input-select" data-th-data-url="@{/invest/report/balance/RepFinProductBalance/getFinprodIdByPortfolioId}"  parentIds="portfolioId" formatoption = true placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  multiple="true">
                        </select>
                    </div>
                </div>
           </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{RepFinProductBalance.dealMode}">处理模式</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" name="dealMode"  class="layui-input form-input input-select"  data-th-data-result="${DISPOSE_PATTERN}">
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{RepFinProductBalance.isLayer}">是否分层</label>
                    <div class="layui-input-inline input-inline">
                          <input type="checkbox" id="isLayer"  name="isLayer"  lay-skin="switch" data-th-value="${YES}" lay-text="是|否">
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{RepFinProductBalance.saleDepartment}">销售部门</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" name="saleDepartment"  class="layui-input form-input input-select"  data-th-data-result="${SALE_DEPT}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
            <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{RepFinProductBalance.vdate}">起息日</label>
                        <div class="layui-input-inline input-inline">
                            <input  name="vdate" class="layui-input form-input input-dateRangeSelect" placeholder="请选择、支持区间" data-th-placeholder="#{SysCommon.dateInterval}">
                        </div>
                </div>
             <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{RepFinProductBalance.mdate}">到期日</label>
                    <div class="layui-input-inline input-inline">
                        <input name="mdate" class="layui-input form-input input-dateRangeSelect" placeholder="请选择、支持区间" data-th-placeholder="#{SysCommon.dateInterval}">
                    </div>
                </div> 
            </div>
            </form>   
        </div> 
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/report/balance/RepFinProductBalance.js}" type="text/javascript"></script>
    </div>
</body>

</html>
