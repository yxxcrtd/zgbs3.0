<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<html>
<html>
<head>
<title data-th-text="#{PortfolioReport001}">投资组合报告</title>
</head>
<body>
		<div layout:fragment="content">
		<div class='layui-fluid'>
				<div class="layui-col-xs12 layui-col-md12 layui-col-sm12 layui-col-lg12 form-button-area" style="margin:10px;">
				<!-- <a id="PortfolioReport001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}" >新建</a> -->
		        <a id="PortfolioReport001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}" style="display:none;">删除</a>
	         
	   		</div>
	   		<div class='joyin-form-wrap joyin-filter-form condition-area'>
	   		<form class="layui-form param-form-wrap" id="searchForm">
	        	<div class="layui-form-item">
	                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
		                <label class="layui-form-label form-lable" data-th-text="#{PortfolioReport001.date}">日期</label>
	                    <div class="layui-input-inline input-inline">
		                    <input id="portfolioReportDate" name="portfolioReportDate" type="text" class="layui-input form-input input-dateSelect" required placeholder="请选择时间" data-th-placeholder="#{SysCommon.placeholder}">
		                </div>
		            </div>
	                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
	                    <label class="layui-form-label form-lable" data-th-text="#{PortfolioReport001.product}">产品</label>
	                    <div class="layui-input-inline input-inline">
	                    	<select type="text" id="portfolioReportProduct" name="portfolioReportProduct" class="layui-input form-input input-select tabJump" required data-th-data-result='${COMMON_BUSINESS_TYPE}' allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
							<option value="0">保本</option>
							<option value="1">和盈</option>
							<option value="2">智慧</option>
							</select>
	                    </div>
	                </div>
	            </div>
	        </form>
	   		</div>
	       
	        <div id="keep">
	            <table class="table table-striped table-double layui-table" id="dataTable"></table>
	        </div>
	        <div id="surplus" style="display:none;">
	            <table class="table table-striped table-double layui-table" id="dataTable2"></table>
	        </div>
	        <div id="wisdom" style="display:none;">
	            <table class="table table-striped table-double layui-table" id="dataTable3"></table>
	        </div>
		</div>
    </div>
	<div layout:fragment="script">
        <script data-th-src="@{/js/invest/report/informationdisclosureform/portfolioreport/PortfolioReport001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
