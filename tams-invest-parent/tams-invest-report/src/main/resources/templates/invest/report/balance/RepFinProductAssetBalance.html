<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RepFinProductAssetBalance}">资产余额表查询</title>
</head>
<body>
    <div layout:fragment="content" id="RepFinProductAssetBalance_DIV">
        <div class="form-button-area">
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
        <form class="layui-form "  id="searchForm" >
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{RepFinProductAssetBalance.querydate}">日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="queryDate" name="queryDate" data-th-value='${#dates.format(entity?.querydate?:iPlatformDate,"yyyy-MM-dd")}' required="required" class="layui-input form-input input-dateSelect"/>
                    </div> 
                </div>     
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{RepFinProductAssetBalance.portfolioId}">组合代码</label>
                     <div class="layui-input-inline input-inline">
                        <select type="text" id="portfolioId" name="portfolioId" class="layui-input form-input input-select" data-th-data-url="@{/invest/portfolio/ptlactivityperiod/PtlActivityPeriod001/getPortfolioId}" formatoption = true placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"   multiple="true">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{RepFinProductAssetBalance.finprodType2}">资产类型</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="finprodType2" name="finprodType2"  class="layui-input form-input input-select"  data-th-data-result="${FINPROD_TYPE_TG}" multiple="true">
                    </div>
                </div>
           </div>
            <div class="layui-form-item">
                 <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{RepFinProductAssetBalance.type4}">资产 一级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="type4" name="type4" class="layui-input form-input input-select" data-th-data-url="@{/invest/report/balance/RepFinProductAssetBalance/getFirstLevelSelectOption}"  parentIds="finprodType2" formatoption = true placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  multiple="true">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{RepFinProductAssetBalance.type5}">资产二级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="type5" name="type5" class="layui-input form-input input-select" data-th-data-url="@{/invest/report/balance/RepFinProductAssetBalance/getSecondLevelSelectOption}"  parentIds="finprodType2" formatoption = true placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  multiple="true">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{RepFinProductAssetBalance.finprodId}">产品代码</label>
                     <div class="layui-input-inline input-inline">
                        <select type="text" id="finprodId" name="finprodId" class="layui-input form-input input-select" data-th-data-url="@{/invest/report/balance/RepFinProductBalance/getFinprodIdByPortfolioId}"  parentIds="portfolioId" formatoption = true placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  multiple="true">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
            <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{RepFinProductAssetBalance.showLevel}">展示层级</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="showLevel" name="showLevel"  class="layui-input form-input input-select" th:initValue="${SHOW_LEVEL_02}"  required="required" data-th-data-result="${HIERARCHY_INFO}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{RepFinProductAssetBalance.deptCode}">所属团队</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" name="deptCode"  class="layui-input form-input input-select"  data-th-data-result="${DEPT}">
                    </div>
                </div>
            </div>
            </form>   
        </div> 
        <div>
            <table id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/report/balance/RepFinProductAssetBalance.js}" type="text/javascript"></script>
    </div>
</body>

</html>
