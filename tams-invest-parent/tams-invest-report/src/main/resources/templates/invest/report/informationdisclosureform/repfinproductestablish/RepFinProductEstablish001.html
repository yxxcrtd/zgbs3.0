<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{RepFinProductEstablish001}">产品成立及到期公告</title>
</head>
<body>
    <div layout:fragment="content">
    	<div class="layui-tab layui-tab-brief" lay-filter="docDemoTabBrief">
		  <ul class="layui-tab-title">
		    <li class="layui-this">产品成立公告</li>
		    <li>产品到期公告</li>
		  </ul>
			  <div class="layui-tab-content">
			  <!-- 产品成立公告 -->
			  	<div class="layui-tab-item layui-show">
			  		<div class="form-button-area">
			            <a id="RepFinProductEstablish001_btn_createanno" class="layui-btn layui-btn-sm">生成公告</a>
			        </div>
			        <div class="joyin-form-wrap joyin-filter-form condition-area">
			            <form class="layui-form" id="searchForm">
			                <div class="layui-form-item">
			                    <div class="layui-inline  layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
			                        <label class="layui-form-label form-lable"
			                            data-th-text="#{RepFinProductEstablish001.productSeries}">组合代码</label>
			                        <div class="layui-input-inline input-inline">
			                            <select type="text" name="finprodIdList"
			                                    class="finprodIdList layui-input form-input input-select" allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
			                            		formatoption = true
			                            		multiple=true
			                            		data-th-data-url="@{/invest/report/informationdisclosureform/repfinproductestablish/RepFinProductEstablish001/getPortfolioId}" required>
			                            		</select>
			                    	
			                        </div>
			                    </div>
			                    <div class="layui-inline  layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
			                        <label class="layui-form-label form-lable" data-th-text="#{RepFinProductEstablish001.valueDate}">起息日</label>
			                        <div class="layui-input-inline input-inline">
			                            <input type="text" name="vDate"
			                                class="vDate layui-input form-input input-dateRangeSelect" placeholder="请选择、支持区间"
			                                data-th-placeholder="#{SysCommon.dateInterval}">
			                        </div>
			                    </div>
			                    <div class="layui-inline  layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
			                        <label class="layui-form-label form-lable" data-th-text="#{RepFinProductEstablish001.expiryDate}">到期日</label>
			                        <div class="layui-input-inline input-inline">
			                            <input type="text" name="mDate"
			                                class="mDate layui-input form-input input-dateRangeSelect" placeholder="请选择、支持区间"
			                                data-th-placeholder="#{SysCommon.dateInterval}">
			                        </div>
			                    </div>
			                </div>
			                <div class="layui-form-item">
			                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
			                        <label class="layui-form-label form-lable"
			                            data-th-text="#{RepFinProductEstablish001.salesDepartment}">销售部门</label>
			                        <div class="layui-input-inline input-inline">
			                            <input type="text" name="department"
			                                class="department layui-input form-input input-select" allowClear="true" placeholder="请输入内容" 
			                                data-th-data-result='${SALE_DEPT}'
			                            	formatoption = true/>
			                        </div>
			                    </div>
			                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
			                        <label class="layui-form-label form-lable"
			                            data-th-text="#{RepFinProductEstablish001.documentType}">文档类型</label>
			                        <div class="layui-input-inline input-inline">
			                            <input type="text" name="fileType"
			                                class="fileType layui-input form-input input-select" allowClear="true" placeholder="请输入内容" required="required"
			                                data-th-data-result='${FILE_TYPE_FG}'
			                                formatoption = true/>
			                        </div>
			                    </div>
			                </div>
			            </form>
			        </div>
			        <div>
			            <table class="layui-table" id="dataTable" data-target="#getdataTable"></table>
			        </div>
			  	</div>
			  	<!-- 产品到期公告 -->
	    		<div class="layui-tab-item">
	    			<div class="form-button-area">
			            <a id="RepFinProductExpiration001_btn_createanno" class="layui-btn layui-btn-sm">生成公告</a>
			        </div>
			        <div class="joyin-form-wrap joyin-filter-form condition-area">
			            <form class="layui-form" id="searchForm">
			                <div class="layui-form-item">
			                    <div class="layui-inline  layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
			                        <label class="layui-form-label form-lable"
			                            data-th-text="#{RepFinProductExpiration001.productSeries}">组合代码</label>
			                        <div class="layui-input-inline input-inline">
			                            <select type="text" name="finprodIdList"
			                                    class="finprodIdList1 layui-input form-input input-select" allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
			                            		formatoption = true
			                            		multiple=true
			                            		data-th-data-url="@{/invest/report/informationdisclosureform/repfinproductexpiration/RepFinProductExpiration001/getPortfolioId}" required>
			                            		</select>
			                    	
			                        </div>
			                    </div>
			                    <div class="layui-inline  layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
			                        <label class="layui-form-label form-lable" data-th-text="#{RepFinProductExpiration001.valueDate}">起息日</label>
			                        <div class="layui-input-inline input-inline">
			                            <input type="text" name="vDate"
			                                class="vDate1 layui-input form-input input-dateRangeSelect" placeholder="请选择、支持区间"
			                                data-th-placeholder="#{SysCommon.dateInterval}">
			                        </div>
			                    </div>
			                    <div class="layui-inline  layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
			                        <label class="layui-form-label form-lable" data-th-text="#{RepFinProductExpiration001.expiryDate}">到期日</label>
			                        <div class="layui-input-inline input-inline">
			                            <input type="text" name="mDate"
			                                class="mDate1 layui-input form-input input-dateRangeSelect" placeholder="请选择、支持区间"
			                                data-th-placeholder="#{SysCommon.dateInterval}">
			                        </div>
			                    </div>
			                </div>
			                <div class="layui-form-item">
			                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
			                        <label class="layui-form-label form-lable"
			                            data-th-text="#{RepFinProductExpiration001.salesDepartment}">销售部门</label>
			                        <div class="layui-input-inline input-inline">
			                            <input type="text" name="department"
			                                class="department1 layui-input form-input input-select" allowClear="true" placeholder="请输入内容" 
			                                data-th-data-result='${SALE_DEPT}'
			                            	formatoption = true/>
			                        </div>
			                    </div>
			                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
			                        <label class="layui-form-label form-lable"
			                            data-th-text="#{RepFinProductExpiration001.documentType}">文档类型</label>
			                        <div class="layui-input-inline input-inline">
			                            <input type="text" name="fileType"
			                                class="fileType1 layui-input form-input input-select" allowClear="true" placeholder="请输入内容" required="required"
			                                data-th-data-result='${FILE_TYPE_FG1}'
			                                formatoption = true/>
			                        </div>
			                    </div>
			                </div>
			            </form>
			        </div>
			        <div>
			            <table class="layui-table" id="dataTable1" data-target="#getdataTable1"></table>
			        </div>
			    </div>
			</div>
    	</div> 
	</div>
	<div layout:fragment="script">
	        <script data-th-src="@{/js/invest/report/informationdisclosureform/repfinproductestablish/RepFinProductEstablish001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
