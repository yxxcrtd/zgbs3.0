<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RepTradeRegist001}">募集期总量登记</title>
<style>
  .util-label{
  width:10px;
  }
/*   .width-input{
  width:80px; */ 
  }
</style>
</head>
<body>
    <div layout:fragment="content">
        <div class='layui-fluid'>   
        <div class="layui-col-md12 layui-col-sm12 layui-col-lg12 form-button-area" style="margin: 10px;">
        </div>     
            <div class='joyin-form-wrap joyin-filter-form condition-area'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{RepTradeRegist001.repFinprodId}">产品代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="repFinprodId" class="layui-input form-input input-select" multiple="true" name="repFinprodId"
                            	data-th-data-url="@{/invest/report/debtreport/reptraderegist/RepTradeRegist001/getRepFinprodId}"
                            	placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{RepTradeRegist001.repFinprodRegId}">产品登记编码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="repFinprodRegId" name="repFinprodRegId" class="layui-input form-input input-select" 
                            	data-th-data-url="@{/invest/report/debtreport/reptraderegist/RepTradeRegist001/getRepFinprodRegId}" multiple="true"
                            	placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" formatoption=false>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{RepTradeRegist001.repSendStatus}">产品已登记</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="repSendStatus" name="repSendStatus" data-th-data-result="${YES_OR_NO}"
                            	class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>
               </div>
               <div class="layui-form-item">
               		<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{RepTradeRegist001.AssetCode}">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="repBankAssetCode" name="repBankAssetCode" class="layui-input form-input input-select" 
                            		data-th-data-url="@{/invest/report/debtreport/reptraderegist/RepTradeRegist001/getRepBankAssetCode}"
                            	placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" formatoption=false>
                            </select>
                        </div>
                    </div>
               		<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{RepTradeRegist001.repBankTradeCode}">行内交易编号</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="repBankTradeCode" name="repBankTradeCode" class="layui-input form-input input-select" 
                            		data-th-data-url="@{/invest/report/debtreport/reptraderegist/RepTradeRegist001/getRepBankTradeCode}"
                            	placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" formatoption=false>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{RepTradeRegist001.repStatusDate}">数据日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="repStatusDate" name="repStatusDate" class="layui-input form-input input-dateRangeSelect" >
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{RepTradeRegist001.repTradeDate}">交易日</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="repTradeDate" name="repTradeDate" class="layui-input form-input input-dateRangeSelect" >
                        </div>
                    </div>
                </div>
            </form>
            </div>           
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/report/debtreport/reptraderegist/RepTradeRegist001.js}" ></script>
    </div>
</body>
</html>
