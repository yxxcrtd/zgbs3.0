<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RepFinProductRegistCodeMng}">产品登记编码管理</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				
				<!-- <a id="RepFinProductRegistCodeMng_btn_add" class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a> -->
				<!-- <a id="RepFinProductRegistCodeMng_btn_delete" class="layui-btn layui-btn-sm btn-delete"
				data-th-text="#{SysCommon.delete}">删除</a> -->
				<a id="RepFinProductRegistCodeMng_btn_import" class="layui-btn layui-btn-sm btn-import">导入</a>
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								data-th-text="#{RepFinProductRegistCodeMng.finprodMarket}">产品名称</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="finprodMarketId" name="finprodMarketId" class="layui-input form-input input-select"
	                                allowClear="true" placeholder="请输入内容"
	                                data-th-placeholder="#{SysCommon.placeholder}" formatoption = "true" 
	                                data-th-data-url="@{/invest/report/debtreport/repfinproductregistcodemng/RepFinProductRegistCodeMng/getFinprodMarketId}" 
	                                multiple="true">
	                            </select>		
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{RepFinProductRegistCodeMng.pordRegistCode}">产品登记编码</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="pordRegistCode" name="pordRegistCode" class="layui-input form-input input-select"
	                                allowClear="true" placeholder="请输入内容"
	                                data-th-placeholder="#{SysCommon.placeholder}" formatoption = "true" 
	                                data-th-data-url="@{/invest/report/debtreport/repfinproductregistcodemng/RepFinProductRegistCodeMng/getPordRegistCode}" 
	                                multiple="true">
	                            </select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{RepFinProductRegistCodeMng.vdate}">起息日</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="vdate" name="vdate"
									class="layui-input form-input input-dateRangeSelect"
									placeholder="请选择、支持区间"
									data-th-placeholder="#{SysCommon.dateInterval}" />
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{RepFinProductRegistCodeMng.mdate}">到期日</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="mdate" name="mdate"
									class="layui-input form-input input-dateRangeSelect"
									placeholder="请选择、支持区间"
									data-th-placeholder="#{SysCommon.dateInterval}" />
							</div>
						</div>
					</div>
				</form>
			</div>

			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script
			data-th-src="@{/js/invest/report/debtreport/repfinproductregistcodemng/RepFinProductRegistCodeMng.js}"></script>
	</div>
</body>
</html>
