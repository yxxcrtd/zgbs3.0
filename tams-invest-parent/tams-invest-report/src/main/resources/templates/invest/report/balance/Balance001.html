<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{Balance001}">资产余额表</title>
</head>
<body>
    <div layout:fragment="content">
        <div class='layui-fluid'>   
        <div class="layui-col-md12 layui-col-sm12 layui-col-lg12 form-button-area" style="margin: 10px;">
            </div>     
            <div class='joyin-form-wrap joyin-filter-form condition-area'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{Balance001.group}">组合</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="group" name="group" class="layui-input form-input input-select" 
                            data-th-data-result='${COMMON_BUSINESS_TYPE}' allowClear="true" placeholder="" data-th-placeholder="#{SysCommon.placeholder}">
                                 <option></option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4	layui-col-sm4	layui-col-md4	layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{Balance001.product}">产品</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="product" name="product"  class="layui-input form-input input-select" 
                            data-th-data-result='${PROCESS_STATE}' allowClear="true" multiple="true"placeholder="" data-th-placeholder="#{SysCommon.placeholder}">
                            </select>                                
                        </div>
                  </div>
                  <div class="layui-inline layui-col-xs4	layui-col-sm4	layui-col-md4	layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{Balance001.assetType}">资产类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="assetType" name="assetType"  class="layui-input form-input input-select" 
                            data-th-data-result='${PROCESS_STATE}' allowClear="true" multiple="true"placeholder="" data-th-placeholder="#{SysCommon.placeholder}">
                                  <option></option>
                                  <option>债券</option>
                                  <option>存放同业</option>
                                  <option>同业借款</option>
                                  <option>拆借</option>
                                  <option>特拆</option>
                                  <option>回购</option>
                                  <option>公募基金</option>
                                  <option>计划类</option>
                                  <option>项目类资产</option>
                                  <option>剩余现金</option>
                            </select>                                
                        </div>
                  </div>
                  </div>
                  <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{Balance001.assetCode}">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="assetCode" class="layui-input form-input" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4	layui-col-sm4	layui-col-md4	layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{Balance001.showLevel}">展示层级</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="showLevel" name="showLevel" class="layui-input form-input input-select" data-th-data-result='${COMMON_BUSINESS_TYPE}' 
                            allowClear="true" placeholder="" data-th-placeholder="#{SysCommon.placeholder}">
                                  <option>二级</option>
                                  <option>一级</option>
                                  <option>三级</option>
                                  <option>四级</option>
                            </select>                                
                        </div>
                  </div>
                  <div class="layui-inline layui-col-xs4	layui-col-sm4	layui-col-md4	layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{Balance001.owner}">所属团队</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="owner" name="owner" class="layui-input form-input input-select" 
                            data-th-data-result='${PROCESS_STATE}' allowClear="true" multiple="true" placeholder="" data-th-placeholder="#{SysCommon.placeholder}">
                            </select>                                
                        </div>
                  </div>
                  </div>
                  <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{Balance001.date}">查询日</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="date" name="date" class="layui-input form-input input-dateSelect" >
                        </div>
                    </div>
                  </div>
            </form>
            </div>           
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/report/balance/Balance001.js}" ></script>
    </div>
</body>
</html>
