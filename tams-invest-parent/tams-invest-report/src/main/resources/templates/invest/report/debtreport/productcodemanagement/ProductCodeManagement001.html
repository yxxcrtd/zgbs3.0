<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{ProductCodeManagement001}">产品登记编码管理</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area">
            <a id="ProductCodeManagement001_btn_import" class="layui-btn layui-btn-sm">导入</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                            data-th-text="#{ProductCodeManagement001.productName}">产品名称</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="productName" name="productName"
                                class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                            data-th-text="#{ProductCodeManagement001.productCode}">产品登记编码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="productCode" name="productCode"
                                class="layui-input form-input input-select" allowClear="true" placeholder="请输入内容">
                        </div>
                    </div>
                    <div class="layui-inline  layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                            data-th-text="#{ProductCodeManagement001.valueDate}">起息日</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="valueDate" name="valueDate"
                                class="layui-input form-input input-dateRangeSelect" placeholder="请输入内容">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline  layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                            data-th-text="#{ProductCodeManagement001.expiryDate}">到期日</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="expiryDate" name="expiryDate"
                                class="layui-input form-input input-dateRangeSelect" placeholder="请输入内容">
                        </div>
                    </div>
                    <div class="layui-inline  layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                            data-th-text="#{ProductCodeManagement001.dataDate}">数据日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="dataDate" name="dataDate"
                                class="layui-input form-input input-dateRangeSelect" placeholder="请输入内容">
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/report/debtreport/productcodemanagement/ProductCodeManagement001.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
