<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RepFinProductRenewalRegist001}">产品存续期登记</title>

</head>
<body>
    <div layout:fragment="content">
        <div class='layui-fluid'>
             <div class="layui-col-md12 layui-col-sm12 layui-col-lg12 layui-col-xs12 form-button-area" style="margin: 10px;">
                
            </div>
            <div class='joyin-form-wrap joyin-filter-form condition-area'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{RepFinProductRenewalRegist001.repFinprodName}">产品名称</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="repFinprodName" name="repFinprodName"
                                class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" multiple="true" 
                                data-th-data-url="@{/invest/report/debtreport/repfinproductrenewalregist/RepFinProductRenewalRegist001/getRepFinprodName}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{RepFinProductRenewalRegist001.repFinprodRegId}">产品登记代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="repFinprodRegId" name="repFinprodRegId"
                                class="layui-input form-input input-select" formatoption=false
                                data-th-data-url="@{/invest/report/debtreport/repfinproductrenewalregist/RepFinProductRenewalRegist001/getRepFinprodRegId}"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{RepFinProductRenewalRegist001.issueType}">发行方式</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="issueType" name="issueType" data-th-data-result="${ISSUE_MODE}"
                                class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{RepFinProductRenewalRegist001.profitType}">收益类型</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="profitType" name="profitType"
                                class="layui-input form-input input-select" data-th-data-result="${PROFIT_TYPE}"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
                        </div>
                    </div>
                    <!-- <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{RepFinProductRenewalRegist001.tradeType}">交易类型</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="tradeType" name="tradeType"
                                class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
                        </div>
                    </div> -->
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{RepFinProductRenewalRegist001.dataDate}">数据日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="dataDate" name="dataDate"
                                class="layui-input form-input input-dateRangeSelect"
                                placeholder="请输入时间区间"/>
                        </div>
                    </div>
                </div>
            </form>
            </div>
           
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/report/debtreport/repfinproductrenewalregist/RepFinProductRenewalRegist001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
