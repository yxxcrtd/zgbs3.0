<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ProductRenewalRegistration001}">产品存续期登记</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				  
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item" layui-inline>
										
					<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{ProductRenewalRegistration001.productCode}">产品代码</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="productCode" name="productCode"
									class="layui-input form-input input-select"
									data-th-data-result='${COMMON_BUSINESS_TYPE}' allowClear="true"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}">
									<option>-请选择-</option>
									<option>无</option>
								</select>
							</div>
						</div>
						
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{ProductRenewalRegistration001.productRegistrationCode}">产品登记编码</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="productRegistrationCode" name="productRegistrationCode"
									class="layui-input form-input input-select"
									data-th-data-result='${COMMON_BUSINESS_TYPE}' allowClear="true"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}">
									<option>-请选择-</option>
									<option>无</option>
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{ProductRenewalRegistration001.issuingWay}">发行方式</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="issuingWay" name="issuingWay"
									class="layui-input form-input input-select"
									data-th-data-result='${COMMON_BUSINESS_TYPE}' allowClear="true"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}">
									<option>-请选择-</option>
									<option>01开放式</option>
									<option>02封闭式</option>
								</select>
							</div>
						</div>
						
					</div>
					
					<div class='layui-form-item' layui-inline>
							<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{ProductRenewalRegistration001.productType}">产品类型</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="productType" name="productType"
									class="layui-input form-input input-select"
									data-th-data-result='${COMMON_BUSINESS_TYPE}' allowClear="true"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}">
									<option>-请选择-</option>
									<option>01收益型</option>
									<option>02净值型</option>
								</select>
							</div>
						</div>
								
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{ProductRenewalRegistration001.tradeType}">交易类型</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="tradeType" name="tradeType"
									class="layui-input form-input input-select"
									data-th-data-result='${COMMON_BUSINESS_TYPE}' allowClear="true"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}">
									<option>-请选择-</option>
									<option>01产品申购</option>
									<option>02产品赎回</option>
									<option>03产品分红</option>
									<option>04收益率变更</option>
									<option>05净价变更</option>
									<option>06 结转收益</option>
								</select>
							</div>
						</div>
						
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
								<label class="layui-form-label form-lable"
									data-th-text="#{ProductRenewalRegistration001.dataDate}">数据日期</label>
								<div class="layui-input-inline input-inline">
									<input type="text" id="dataDate" name="dataDate"
                                class="layui-input form-input input-dateRangeSelect" placeholder="请选择日期区间">
								</div>
							</div>
					
					</div>
					
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script
			data-th-src="@{/js/invest/report/debtreport/productrenewalregistrationinfo/ProductRenewalRegistration001.js}"></script>
	</div>
</body>
</html>
