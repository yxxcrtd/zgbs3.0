<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RepRaiseSumRegist001}">募集期总量登记</title>
<style>
  .util-label{
  width:10px;
  }
/*   .width-input{
  width:80px; */ 
  }
</style>
</head>
<body>
    <div layout:fragment="content">
        <div class='layui-fluid'>   
        <div class="layui-col-md12 layui-col-sm12 layui-col-lg12 form-button-area" style="margin: 10px;">
        </div>     
            <div class='joyin-form-wrap joyin-filter-form condition-area'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{RepRaiseSumRegist001.productCode}">产品代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="productCode" class="layui-input form-input input-select" multiple="true" name="productCode"
                            	data-th-data-url="@{/invest/report/debtreport/repraisesumregist/RepRaiseSumRegist001/getProductCode}"
                            	placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{RepRaiseSumRegist001.registrationCode}">产品登记编码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="registrationCode" name="registrationCode" class="layui-input form-input" 
                            	placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{RepRaiseSumRegist001.customerType}">目标客户类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="customerType" name="customerType" class="layui-input form-input input-select" placeholder="请输入内容" 
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${SALETARGET_DECLARE}">
                             </select>
                        </div>
                    </div>
               </div>
               <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{RepRaiseSumRegist001.startDate}">产品起始日</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="startDate" name="startDate" class="layui-input form-input input-dateRangeSelect" >
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{RepRaiseSumRegist001.dataDate}">数据日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="dataDate" name="dataDate" class="layui-input form-input input-dateRangeSelect" >
                        </div>
                    </div>
                </div>
            </form>
            </div>           
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/report/debtreport/repraisesumregist/RepRaiseSumRegist001.js}" ></script>
    </div>
</body>
</html>
