<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{NonStandardCreditAssetDetails001}">非标准化债权资产明细</title>
</head>
<body>
    <div layout:fragment="content">
        <div class='layui-fluid'>
            <div class="layui-col-md12 layui-col-sm12 layui-col-lg12 layui-col-xs12 form-button-area" style="margin: 10px;">
                <a id="DocumentManagement001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
                    data-th-text="#{SysCommon.delete}" style="display: none;">删除</a>
            </div>
            <div class='joyin-form-wrap joyin-filter-form condition-area'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{NonStandardCreditAssetDetails001.date}">日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="date" name="date"
                                required="required"
                                class="layui-input form-input input-dateSelect" 
                                data-th-data-result='${COMMON_BUSINESS_TYPE}' allowClear="true" placeholder=""/>
                        </div>
                    </div>
                </div>
            </form>
            </div>
           
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/report/informationdisclosureform/nonstandardcreditassetdetails/NonStandardCreditAssetDetails001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
