<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{TopTenAssetOrientationInfo001.title}">产品前十大资产投向</title>
</head>
<body>
     <div layout:fragment="content">
       <div class="form-button-area" >
       </div>
       <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form joyin-form-wrap"  id="submitForm">
            <div class="layui-form-item"> 
            	<div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{TopTenAssetOrientationInfo001.Date}" >日期</label>
                    <div class="layui-input-inline input-inline">
                        <input id="date" name="date" class="layui-input form-input input-dateSelect" placeholder="请选择时间" required="required">
                    </div>
                </div>      
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{TopTenAssetOrientationInfo001.product}">产品</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="product" name="product" class="layui-input form-input input-select"  allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required="required">
                           <option></option>
                      	</select>
                    </div>
                </div>
            </div>
        </form>   
       </div> 
       <div>
         <table class="layui-table" id="dataTable"></table>
       </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/report/informationdisclosureform/toptenassetorientationinfo/TopTenAssetOrientationInfo001.js}" type="text/javascript"></script>
    </div>                                
</body>
</html>
