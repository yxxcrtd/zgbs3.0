<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{RepFinProductOrgIssRegist.title}">机构和私人银行产品发行登记</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 layui-col-sm12 layui-col-lg12 layui-col-xs12 form-button-area"
				style="margin: 10px;"></div>
			<div class="joyin-form-wrap joyin-filter-form condition-area">
				<form class="layui-form"  id="submitForm">
            		<div class="layui-form-item"> 
                		<div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    		<label class="layui-form-label form-lable" data-th-text="#{RepBottomAsset.asseManagementCode}">资管计划代码</label>
                    		<div class="layui-input-inline input-inline">
                        		<select type="text" id="repAssetCode" name="repAssetCode" class="layui-input form-input input-select"  
                        			allowClear="true" data-th-data-url="@{/invest/report/debtreport/repbottomasset/RepBottomAsset001/getRepAssetCode}"
                        			multiple="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" >
                      			</select>
                    		</div>
                		</div>
                		<div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    		<label class="layui-form-label form-lable" data-th-text="#{RepBottomAsset.underlyingAssetCode}">底层资产代码</label>
                    		<div class="layui-input-inline input-inline">
                        		<select type="text" id="repBottomCode2" name="repBottomCode2" 
                        			class="layui-input form-input input-select"  allowClear="true"  multiple="true" 
                        			data-th-data-url="@{/invest/report/debtreport/repbottomasset/RepBottomAsset001/getRepBottomCode2}"
                        			placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" >
                      			</select>
                    		</div>
                		</div>
                		<div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    		<label class="layui-form-label form-lable" data-th-text="#{RepBottomAsset.holdingDate}" >持仓日期</label>
                    		<div class="layui-input-inline input-inline">
                        		<input id="holdingDate" name="holdingDate" class="layui-input form-input input-dateRangeSelect" placeholder="请选择时间" >
                    		</div>
                		</div> 
           			</div>
           			<div class="layui-form-item">
                		<div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4"> 
                			<label class="layui-form-label form-lable" data-th-text="#{RepBottomAsset.dataDate}" >数据日期</label>
                    		<div class="layui-input-inline input-inline">
                        		<input id="dataDate" name="dataDate" class="layui-input form-input input-dateRangeSelect" placeholder="请选择时间">
                    		</div>
                		</div>
            		</div> 
        		</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-src="@{/js/invest/report/debtreport/repbottomasset/RepBottomAsset001.js}" type="text/javascript"></script>
	</div>
</body>

</html>
