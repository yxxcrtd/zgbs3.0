<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ProductBalanceStatement001}">产品余额报表</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				  
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item" layui-inline>
					
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
								<label class="layui-form-label form-lable"
									data-th-text="#{ProductBalanceStatement001.queryDate}">查询日期</label>
								<div class="layui-input-inline input-inline">
									<input id="queryDate" name="queryDate"
										class="layui-input form-input input-dateSelect"
										placeholder="请输入日期" required="required">
								</div>
							</div>
					
					<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{ProductBalanceStatement001.productLine}">产品系列</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="productLine" name="productLine"
									class="layui-input form-input input-select"
									data-th-data-result='${COMMON_BUSINESS_TYPE}' allowClear="true"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}">
									<option>-请选择-</option>
									<option>无</option>
								</select>
							</div>
						</div>
						
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{ProductBalanceStatement001.productCode}">产品代码</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="productCode" name="productCode"
									class="layui-input form-input input-lenovoselect"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
						
						
					</div>
					
					<div class='layui-form-item' layui-inline>
							<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{ProductBalanceStatement001.productAbbreviation}">产品简称</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="productAbbreviation" name="productAbbreviation"
									class="layui-input form-input input-lenovoselect"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
								
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{ProductBalanceStatement001.combination}">组合</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="combination" name="combination"
									class="layui-input form-input input-select"
									data-th-data-result='${COMMON_BUSINESS_TYPE}' allowClear="true"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}">
									<option>-请选择-</option>
									<option>无</option>
								</select>
							</div>
						</div>
						
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{ProductBalanceStatement001.processingMode}">处理模式</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="processingMode" name="processingMode"
									class="layui-input form-input input-select"
									data-th-data-result='${COMMON_BUSINESS_TYPE}' allowClear="true"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}">
									<option>-请选择-</option>
									<option>无</option>
								</select>
							</div>
						</div>
						
					
					</div>
					
					<div class='layui-form-item' layui-inline>
						
							<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{ProductBalanceStatement001.isItLayered}">是否分层展示</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="isItLayered" name="isItLayered"
									class="layui-input form-input input-select"
									data-th-data-result='${COMMON_BUSINESS_TYPE}' allowClear="true"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}" required="required">
									<option>-请选择-</option>
									<option>是</option>
									<option>否</option>
								</select>
							</div>
						</div>
						
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{ProductBalanceStatement001.salesDepartments}">销售部门</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="salesDepartments" name="salesDepartments"
									class="layui-input form-input input-select"
									data-th-data-result='${COMMON_BUSINESS_TYPE}' allowClear="true"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}">
									<option>-请选择-</option>
									<option>无</option>
								</select>
							</div>
						</div>
						
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
								<label class="layui-form-label form-lable"
									data-th-text="#{ProductBalanceStatement001.rangeOfCommencementDate}">起息日范围</label>
								<div class="layui-input-inline input-inline">
									<input type="text" id="rangeOfCommencementDate" name="rangeOfCommencementDate"
                                class="layui-input form-input input-dateRangeSelect" placeholder="请选择日期区间">
								</div>
							</div>
					</div>
					<div class='layui-form-item' layui-inline>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
								<label class="layui-form-label form-lable"
									data-th-text="#{ProductBalanceStatement001.maturityRange}">到期日范围</label>
								<div class="layui-input-inline input-inline">
									<input type="text" id="maturityRange" name="maturityRange"
                                class="layui-input form-input input-dateRangeSelect" placeholder="请选择日期区间">
								</div>
							</div>
					</div>
					
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script
			data-th-src="@{/js/invest/report/productbalancestatementinfo/ProductBalanceStatement001.js}"></script>
	</div>
</body>
</html>
