<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
<title data-th-text="#{EtrWtSpotex002}">外汇即期指令新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form" id="searchForm">
                <div class="pro-module-wrapper pro-module-base">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">基本信息</span>
                                （
                                <span class="star-sign">*</span>
                                必填）
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrWtSpotex.portfolioId}">组合代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption=true
                                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}"
                                                required="required" data-th-initvalue="${entity?.portfolioId}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrWtSpotex.vdate}">指令开始日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input class="layui-input form-input input-dateSelect" id="vdate"
                                                name="vdate" placeholder="请选择时间" disabled="disabled"
                                                data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'
                                                required="required">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrWtSpotex.mdate}">指令终止日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input class="layui-input form-input input-dateSelect" id="mdate"
                                                name="mdate" placeholder="请选择时间" disabled="disabled"
                                                data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
                                                required="required">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrWtSpotex.excDealType}">交易类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="excDealType" name="excDealType"
                                                childrenIds="curPair" class="layui-input form-input input-select"
                                                data-th-data-result='${EXC_DEAL_TYPE}'
                                                data-th-initvalue="${entity?.excDealType?:EXC_DEAL_TYPE_default}"
                                                allowClear="true" placeholder="请输入内容" required="required"
                                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrWtSpotex.curPair}">货币对</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="curPair" name="curPair" parentIds="excDealType" childrenIds="ccy,corCcy"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${CYY_PAIR}' allowClear="true" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" required="required"
                                                formatoption="true" data-th-initvalue="*{entity?.curPair}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrWtSpotex.ps}">交易方向</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="ps" name="ps"
                                                class="layui-input form-input input-select" data-th-data-result='${PS}'
                                                allowClear="true" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true"
                                                required="required" data-th-initvalue="*{entity?.ps}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrWtSpotex.ccy}">交易货币</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="ccy" name="ccy" parentIds="curPair"
                                                class="layui-input form-input input-select" data-th-data-result='${CCY}'
                                                allowClear="true" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" required="required"
                                                formatoption="true" data-th-initvalue="*{entity?.ccy}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrWtSpotex.entrustAmt}">交易货币金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="entrustAmt" name="entrustAmt" placeholder="请输入内容"
                                                data-pattern="" data-fixtype="2" required="required"
                                                class="layui-input form-input text-number"
                                                data-th-value="${entity?.entrustAmt}">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrWtSpotex.proAvailableCash}">交易货币可用持仓</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="proAvailableCash" name="proAvailableCash"
                                                placeholder="请输入内容" data-pattern="" data-fixtype="2" disabled="disabled"
                                                class="layui-input form-input text-number"
                                                data-th-value="${entity?.proAvailableCash}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrWtSpotex.price}">即期汇率</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="price" name="price" placeholder="请输入内容"
                                                data-pattern="" data-fixtype="2" data-textrange="8" required="required"
                                                class="layui-input form-input text-number"
                                                data-th-value="${entity?.price}">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrWtSpotex.corCcy}">对应货币</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="corCcy" name="corCcy" parentIds="curPair" disabled="disabled"
                                                class="layui-input form-input input-select" data-th-data-result='${CCY}'
                                                allowClear="true" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" 
                                                formatoption="true" data-th-initvalue="*{entity?.corCcy}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrWtSpotex.expCorAmt}">预计对应货币金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="expCorAmt" name="expCorAmt" placeholder="请输入内容"
                                                data-pattern="" data-fixtype="2" disabled="disabled"
                                                class="layui-input form-input text-number"
                                                data-th-value="${entity?.expCorAmt}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrWtSpotex.corCurPos}">对应货币可用持仓</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="corCurPos" name="corCurPos" placeholder="请输入内容"
                                                data-pattern="" data-fixtype="2"
                                                class="layui-input form-input text-number" disabled="disabled"
                                                data-th-value="${entity?.corCurPos}">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrWtSpotex.settleSpreed}">清算速度</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="accountSpeed" name="accountSpeed" required="required"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-data-result='${ACCOUNT_SPEED}'
                                                data-th-initvalue="${entity?.accountSpeed?:ACCOUNT_SPEED_default}"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrWtSpotex.dealCurAcct}">交易货币账户</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="dealCurAcct" name="dealCurAcct" 
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption=true
                                                required="required" data-th-initvalue="${entity?.dealCurAcct}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrWtSpotex.corCurAcct}">对应货币账户</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="corCurAcct" name="corCurAcct" 
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption=true
                                                required="required" data-th-initvalue="${entity?.corCurAcct}">
                                            </select>
                                        </div>
                                    </div>
                                    <input type="text" id="entrustId" name="entrustId" disabled="disabled"
                                        style="display: none;" data-th-value="${entity?.entrustId}">
                                    <input type="text" id="entrustStatus" name="entrustId" disabled="disabled"
                                        style="display: none;" data-th-value="${entity?.entrustStatus}">
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- 引业务组件投资委托人员信息组件 -->
                    <div class="page-component" th:data-path="@{/component/trade/BussEtrInvestPersonInfo/init}"
                        th:data-params="|{entityName: 'etrInvestPersonInfo',entity:'${person_entity}', innerTrade: false,single:'1'}|"></div>
                    <!-- 引业务组件附件信息组件 -->
                    <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                        th:data-params="|{entityName: 'FileCommon', businessId: '${businessId ?: ''}'}|"></div>
                    <div id="ramark_DIV" class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">备注</span>
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item" style="padding-bottom: 8px;">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" style="width: 100%;">
                                        <div class="layui-input-inline input-inline"
                                            style="margin: 0 10px; width: 98% !important;">
                                            <textarea id="remark" name="remark" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" maxlength="200"
                                                class="layui-textarea" data-th-text="${entity?.remark}">
										        </textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- 风险试算 -->
                <div th:if="${isEleShow['EtrWtSpotex002_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component"
                        th:data-path="@{/component/common/BaseRiskMathComm/init}"
                        th:data-params="|{workflowId: '${workflowId}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>
                    <div class="pro-module-wrapper pro-module-block">
                        <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 20px 0;">
                            <div class="text-center">
                            <a th:if="${isEleShow['EtrWtSpotex002_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'"
                               id="EtrWtSpotex002_btn_riskcal" class="layui-btn layui-btn-sm"
                                    data-th-text="#{EtrWtSpotex.riskcal}">风险试算</a>
                                <a id="EtrWtSpotex002_btn_save" class="layui-btn layui-btn-sm btn-save"
                                    data-th-text="#{SysCommon.save}">保存</a>
                                <a id="EtrWtSpotex002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                                    data-th-text="#{SysCommon.submit}">提交</a>
                                <a id="EtrWtSpotex002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                                    data-th-text="#{SysCommon.cancel}">取消</a>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div layout:fragment="script">
        <script th:inline="javascript" type="text/javascript">
        							// 风险试算用，待定 start
                                    var acctType = /*[[${acctType}]]*/'';
                                    var MY_SUP_TIME_TYPE_01 = /*[[${MY_SUP_TIME_TYPE_01}]]*/'';
                                    var USE_STATUS_01 = /*[[${USE_STATUS_01}]]*/'';
                                    var sysDate = /*[[${sysDate}]]*/'';
                                    var fintype_spotex = /*[[${fintype_spotex}]]*/'';
                                    // 风险试算用，待定 end
                                    var JPY_CNY = /*[[${JPY_CNY}]]*/'';
                                    var PINAN_ASSET_TYPE_F13 = /*[[${PINAN_ASSET_TYPE_F13}]]*/'';
                                </script>
        <script data-th-src="@{/js/component/trade/EtrForeignExchange.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/invest/entrust/etrwtspotex/EtrWtSpotex002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
