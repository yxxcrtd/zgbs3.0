<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>债券一级投标多对多指令新建</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form" id="searchForm">
        <div class="pro-module-wrapper pro-module-base">
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="title-des" data-th-text="#{EtrBondFirstLBidding003.entrustList}">委托列表</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item">
                        <table class="layui-table" id="dataTable" name="etrBondFirstLBiddingDtoList"></table>
                    </div>
                </div>
            </div>
        </div>
        <!-- 风险试算 -->
        <div th:if="${isEleShow['EtrBondFirstLBidding003_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component"
             th:data-path="@{/component/common/BaseRiskMathComm/init}"
             th:data-params="|{workflowId: '${workflowId}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>
    </form>
    <!--  按钮 -->
    <div class="row text-center" style="margin: 20px 0;">
        <div class="text-center">
            <a th:if="${isEleShow['EtrBondFirstLBidding003_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'"
               id="EtrBondFirstLBidding003_btn_riskcal" class="layui-btn layui-btn-sm"
               data-th-text="#{EtrInvestBondInfo002.riskcal}">风险试算</a>
            <a id="EtrBondFirstLBidding003_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
               data-th-text="#{SysCommon.submit}">提交</a>
            <a id="EtrBondFirstLBidding003_cancel" class="layui-btn layui-btn-sm  btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var etrBondFirstLBiddingDtoList = /*[[${etrBondFirstLBiddingDtoList}]]*/'';
        var todoList = /*[[${TodoList}]]*/'';

        var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
        var fintype = /*[[${fintype}]]*/'';
        var etrPs = /*[[${etrPs}]]*/'';
        var sysDate = /*[[${sysDate}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/entrust/etrbondfirstlbidding/EtrBondFirstLBidding003.js}"
            type="text/javascript"></script>
</div>
</body>
</html>
