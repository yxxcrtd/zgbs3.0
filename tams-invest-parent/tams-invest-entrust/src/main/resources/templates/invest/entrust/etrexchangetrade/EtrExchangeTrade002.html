<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<style type="text/css">

.form-lable {
	width: 25%;
	padding: 0px 10px 0px 0px;
}

.layui-tab-content {
	padding: 0px !important;
}

.select2-container--default .select2-results>.select2-results__options {
	max-height: 150px;
	overflow-y: auto;
}

.layui-form-item .select2-container {
	max-width: 126px !important
}

.position-col-width {
	width: 30%;
}

.position-col-width-zqzy {
	width: 22%;
}

.position-col-width-zqzy1 {
	width: 45%;
}

#positionsTable_zqzy_div {
	margin-top: -38px;
	margin-left: 40px;
	margin-bottom: 12px;
}
.grid-demo {
	background-color: #f5f5f5;
	border: 1px solid red;
	border-radius: 3px;
	padding: 5px;
}
.layui-chcekbox{
	padding: 0px 1px;
	margin: 0 2px 0 0;
}
.layui-form-radio>i {
	margin-right: 3px;
	font-size: 15px;
}
</style>
</head>
<body>
	<div layout:fragment="content">
		<div class="layui-tab" lay-filter="tradePlatform">
			<ul class="layui-tab-title">
				<li class="layui-this">指令管理</li>
				<li >持仓</li>
				<li>债券质押</li>
			</ul>
			<div class="layui-tab-content">
				<!-- 指令管理 -->
				<div class="layui-tab-item layui-show">
					<div class="layui-col-md12 form-button-area zhiling-transfer-form">
						<a id="EtrExchangeTrade003_btn_revoke" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="撤回"></span></a>
						<a id="EtrExchangeTrade003_btn_close" class="layui-btn layui-btn-sm ">
							<i class="iconfont icon-close"></i><span data-th-text="#{SysCommon.close}"></span></a>
						<a id="EtrExchangeTrade003_btn_import" class="layui-btn layui-btn-sm btn-import">
							<i class="iconfont icon-import"></i><span data-th-text="#{EtrInvestBondInfo001.import}">导入</span></a>
					</div>
					<div class="joyin-form-wrap joyin-filter-form condition-area curr-form zhiling-transfer-form">
						<form class="layui-form" id="searchForm">
							<div class="layui-form-item">
								<div class="layui-inline layui-col-md3 layui-col-xs3 layui-col-sm3 layui-col-lg3" style=" width: 25%; padding:0px;">
									<label class="layui-form-label form-lable"
										   data-th-text="#{EtrExchangeTrade002.portfolioName}">组合名称</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="portfolioId_zhiling" name="portfolioId"
												class="layui-input form-input input-select"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId}"
												data-th-value="${entity?.portfolioId}" multiple="true">
										</select>
									</div>
								</div>
								<div class="layui-inline layui-col-md3 layui-col-xs3 layui-col-sm3 layui-col-lg3" style=" width: 25%; padding:0px;">
									<label class="layui-form-label form-lable"
										   data-th-text="#{EtrExchangeTrade002.finprodType}">资产类型</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="finprodType2_zhiling" name="finprodType2"
												class="layui-input form-input input-select"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-result="${FINPROD_TYPE_TG}">
										</select>
									</div>
								</div>
								<div class="layui-inline layui-col-md3 layui-col-xs3 layui-col-sm3 layui-col-lg3" style=" width: 25%; padding:0px;">
									<label class="layui-form-label form-lable">委托方向</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="ps_zhiling" name="ps"
												class="layui-input form-input input-select"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-result='${PS_ETR}'>
										</select>
									</div>
								</div>
								<div class="layui-inline layui-col-md3 layui-col-xs3 layui-col-sm3 layui-col-lg3" style=" width: 25%; padding:0px;">
									<label class="layui-form-label form-lable"
										   data-th-text="#{EtrExchangeTrade002.finpordName}">资产名称</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="secId_zhiling"
												name="secId" class="layui-input form-input input-select"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-url="@{'/invest/entrust/etrexchangetrade/EtrExchangeTrade001/getFinprodMarketInfoPosition'}"
												formatoption=false></select>
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div style="padding-top: 3px;margin-left:20px; padding:0px;">
									<input type="radio" name="entrustStatus" style="float: right;" lay-filter="entrustStatus" value="" title="全部" checked>
									<!--ZGZGST-1346:增加待分发状态 fuyongsheng 20210828 add start-->
									<input type="radio" name="entrustStatus" style="float: right;" lay-filter="entrustStatus" value="09" title="待分发" >
									<!--ZGZGST-1346:增加待分发状态 fuyongsheng 20210828 add end-->
									<input type="radio" name="entrustStatus" style="float: right;" lay-filter="entrustStatus" value="02" title="待接收" >
									<input type="radio" name="entrustStatus" style="float: right;" lay-filter="entrustStatus" value="03" title="已接收" >
									<input type="radio" name="entrustStatus" style="float: right;" lay-filter="entrustStatus" value="04" title="已完成" >
									<input type="radio" name="entrustStatus" style="float: right;" lay-filter="entrustStatus" value="05" title="已退回" >
									<input type="radio" name="entrustStatus" style="float: right;" lay-filter="entrustStatus" value="06" title="已关闭" >
									<input type="radio" name="entrustStatus" style="float: right;" lay-filter="entrustStatus" value="07" title="已撤回" >
									<input type="radio" name="entrustStatus" style="float: right;" lay-filter="entrustStatus" value="08" title="流程中" >
								</div>
							</div>
						</form>
					</div>
					<div>
						<table class="layui-table" id="dateTable"></table>
					</div>
				</div>
				<!-- 持仓 -->
				<div class="layui-tab-item">
					<!--add by chenjiaxing 添加重置按钮 20210821 start-->
					<!--<div class="layui-col-md12 form-button-area zlgl-transfer-form">

					</div>-->
					<!--add by chenjiaxing 添加重置按钮 20210821 end-->
					<div class="joyin-form-wrap joyin-filter-form condition-area curr-form layui-fluid zlgl-transfer-form">
						<form class="layui-form" id="searchForm_cc">
							<div class="layui-form-item">
								<div
									class="layui-inline layui-col-md3 layui-col-xs3 layui-col-sm3 layui-col-lg3">
									<label class="layui-form-label form-lable"
										data-th-text="#{EtrExchangeTrade002.portfolioName}">组合名称</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="portfolioId" name="portfolioId"
											class="layui-input form-input input-select"
											placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId}"
											data-th-value="${entity?.portfolioId}" multiple="true">
										</select>
									</div>
								</div>
								<div
									class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
									<label class="layui-form-label form-lable"
										data-th-text="#{EtrExchangeTrade002.tradeMarket}">市场</label>
									<div class="layui-input-inline input-inline" style="width: 70% !important;">
										<input type="text" id="tradeMarket_cc" name="acctTradeMarket" childrenIds="secId"
											class="layui-input form-input input-checkbox"
											placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-data-result='${TRADE_PLACE}'
											data-th-value="${entity?.tradeMarket}" />
									</div>
								</div>
								<div
									class="layui-inline layui-col-md3 layui-col-xs3 layui-col-sm3 layui-col-lg3">
									<label class="layui-form-label form-lable"
										data-th-text="#{EtrExchangeTrade002.finpordName}">资产名称</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="secId" name="secId" class="layui-input form-input input-select" placeholder="请输入内容" data-th-value="${entity?.secId}"
                                         parentIds="tradeMarket_cc" data-th-placeholder="#{SysCommon.placeholder}" data-th-data-url="@{'/invest/entrust/etrexchangetrade/EtrExchangeTrade001/getFinprodMarketInfoPosition'}" formatoption=false></select>
									</div>
								</div>
								<div class="layui-inline layui-col-md2 layui-col-xs2 layui-col-sm2 layui-col-lg2">
									<a class="layui-btn layui-btn-sm btn-search"
										style="margin-left: 25px;" id="EtrExchangeTrade002_btn_ccsearch">
										<i class="iconfont icon-search"></i><span>查询</span>
									</a>
									<a class="layui-btn layui-btn-sm btn-reset btn-default"
									   style="margin-left: 10px;" id="EtrExchangeTrade002_btn_ccreset">
										<i class="iconfont icon-reset"></i><span>重置</span>
									</a>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="layui-inline layui-col-md3 layui-col-xs3 layui-col-sm3 layui-col-lg3">
									<label class="layui-form-label form-lable"
										   data-th-text="#{EtrExchangeTrade002.finprodType}">资产类型</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="finprodType2" name="finprodType2"
												class="layui-input form-input input-select"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-result="${FINPROD_TYPE_TG}">
										</select>
									</div>
								</div>
							</div>
						</form>
					</div>
					<!-- 持仓列表 -->
					<div>
						<table class="layui-table" id="positionsTable"></table>
					</div>
				</div>
				<!-- 债券质押 -->
				<div class="layui-tab-item">
					<div class="joyin-form-wrap layui-fluid">
						<form class="layui-form" id="searchForm_zqzy">
							<div class="layui-form-item">
								<div class="layui-inline layui-col-md3 layui-col-xs3 layui-col-sm3 layui-col-lg3 position-col-width-zqzy">
									<label class="layui-form-label form-lable"
										data-th-text="#{EtrExchangeTrade002.portfolioName}">组合名称</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="portfolioId_zqzy" name="portfolioId"
											class="layui-input form-input input-select"
											placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId}"
											data-th-value="${entity?.portfolioId}">
										</select>
									</div>
								</div>

								<div class="layui-inline layui-col-md3 layui-col-xs3 layui-col-sm3 layui-col-lg3 position-col-width-zqzy1">
									<label class="layui-form-label form-lable"
										data-th-text="#{EtrExchangeTrade002.tradeMarket}">市场</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="tradeMarket_zqzy" name="tradeMarket"
											class="layui-input form-input input-checkbox"
											data-th-data-result='${TRADE_PLACE}'
											data-th-initValue="${entity?.tradeMarket}" />
									</div>
								</div>

								<div class="layui-inline layui-col-md3 layui-col-xs3 layui-col-sm3 layui-col-lg3 position-col-width-zqzy">
									<label class="layui-form-label form-lable"
										data-th-text="#{EtrExchangeTrade002.date}">日期</label>
									<div class="layui-input-inline input-inline">
										<input class="layui-input form-input input-dateSelect"
											id="date_zqzy" name="date" placeholder="请选择时间"
											data-th-value="${iPlatformDate}">
									</div>
								</div>

								<div class="layui-inline layui-col-md1 layui-col-xs1 layui-col-sm1 layui-col-lg1" style="float: right">
									<a class="layui-btn layui-btn-sm btn-search"
										style="margin-left: 25px;"
										id="EtrExchangeTrade002_zqzy_search_btn"> <i
										class="iconfont icon-search"></i><span>查询</span></a>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="layui-inline layui-col-md3 layui-col-xs3 layui-col-sm3 layui-col-lg3 position-col-width-zqzy">
									<label class="layui-form-label form-lable"
										   data-th-text="#{EtrExchangeTrade002.zyqId }">质押券代码</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="finprodMarketId_zqzy" name="finprodMarketId"
												class="layui-input form-input input-select"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-url="@{/invest/entrust/etrexchangetrade/EtrExchangeTrade002/selectZyq}"
												data-th-value="${entity?.finprodMarketId}">
										</select>
									</div>
								</div>

								<div class="layui-inline layui-col-md1 layui-col-xs1 layui-col-sm1 layui-col-lg1" style="float: right">
									<a class="layui-btn layui-btn-sm btn-reset btn-default"
									   style="margin-left: 25px;" id="EtrExchangeTrade002_zqzy_reset_btn">
										<i class="iconfont icon-reset"></i><span>重置</span>
									</a>
								</div>
							</div>
						</form>
					</div>
					<!-- 债券质押持仓列表 -->
					<div>
						<table class="layui-table" id="positionsTable_zqzy"></table>
						<div id="positionsTable_zqzy_div">
							<label style="font-size: 13px; color: #666">标准券汇总：</label><span style ="font-size: 13px; color: #666" id="secNumTotal">--</span>
						</div>
						<div class="layui-row layui-col-space5"
							style="position: fixed; width: 100%; margin-top:8px">
							<div class="layui-col-md6 layui-inline">
								<div class="layui-row grid-demo">
									<div class="layui-col-md4 layui-col-space5">
										<label style="font-size: 12px;">沪标准券可用：</label> <span
											style="font-size: 12px;" id="secNum_sh">--</span>
									</div>
									<div class="layui-col-md5 layui-col-space5">
										<label style="font-size: 12px;">沪标准券已用：</label> <span
											style="font-size: 12px;" id="usableNum_sh">--</span>
									</div>
									<div class="layui-col-md3 layui-col-space5">
										<label style="font-size: 12px; font-weight: bolder">使用率：</label>
										<span style="font-size: 12px; font-weight: bolder"
											id="usingRate_sh">--</span>
									</div>
								</div>
							</div>
							<div class="layui-col-md6 layui-inline">
								<div class="layui-row grid-demo" style="margin-right: 15px;">
									<div class="layui-col-md4 layui-col-space5">
										<label style="font-size: 12px;">深标准券可用：</label> <span
											style="font-size: 12px;" id="secNum_sz">--</span>
									</div>
									<div class="layui-col-md5 layui-col-space5">
										<label style="font-size: 12px;">深标准券已用：</label> <span
											style="font-size: 12px;" id="usableNum_sz">--</span>
									</div>
									<div class="layui-col-md3 layui-col-space5">
										<label style="font-size: 12px; font-weight: bolder">使用率：</label>
										<span style="font-size: 12px; font-weight: bolder"
											id="usingRate_sz">--</span>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-src="@{/js/invest/entrust/etrexchangetrade/EtrExchangeTrade002.js}" type="text/javascript"></script>
		<script th:inline="javascript" type="text/javascript">
			var PS_ETR = /*[[${PS_ETR}]]*/'[]';
			var FINPROD_TYPE_TG_F01 = /*[[${FINPROD_TYPE_TG_F01}]]*/'';
			var PS_T02 = /*[[${PS_T02}]]*/'';
			var PS_T69 = /*[[${PS_T69}]]*/'';
			var DECLA_TYPE_PRM05 = /*[[${DECLA_TYPE_PRM05}]]*/'';
			var TARGET_CLASS_01 = /*[[${TARGET_CLASS_01}]]*/'';
			var DECLA_TYPE_PRM14 = /*[[${DECLA_TYPE_PRM14}]]*/'';
			var PRICE_MODEL_PRM01 = /*[[${PRICE_MODEL_PRM01}]]*/'';
			var ENTRUST_BUSS_TYPE_15 = /*[[${ENTRUST_BUSS_TYPE_15}]]*/'';
			var PRICE_MODEL_PRM03 = /*[[${PRICE_MODEL_PRM03}]]*/'';
			var etrExchange_posTable_refresh_period = /*[[${etrExchange_posTable_refresh_period}]]*/;
			var ENTRUST_CLASS_02 = /*[[${ENTRUST_CLASS_02}]]*/'';
		</script>
	</div>
</body>
</html>
