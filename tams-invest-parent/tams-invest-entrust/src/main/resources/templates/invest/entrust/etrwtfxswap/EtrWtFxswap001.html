<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{EtrWtFxswap001}">外汇掉期委托查询</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area">
            <a id="EtrWtFxswap001_btn_add" class="layui-btn layui-btn-sm btn-create"
                data-th-text="#{SysCommon.create}">新建</a>
            <a id="EtrWtFxswap001_btn_close" class="layui-btn layui-btn-sm" ><i class="iconfont icon-close"></i><span data-th-text="#{EtrWtFxswap001.close}"></a>
            <a id="EtrWtFxswap001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="#{ETR_REVERT}"></a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrWtFxswap001.portfolioId}">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption=true multiple="multiple"
                                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?ww=false}"
                                                data-th-initvalue="${entity?.portfolioId}">
                                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrWtFxswap001.tradeType}">交易类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="tradeType" name="tradeType"
                               class="layui-input form-input input-select" childrenIds="ccyPair"
                               placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                               th:data-result='${EXC_DEAL_TYPE}' allowClear="true" formatoption="true"
                               th:initValue="${EXC_DEAL_TYPE_default}"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrWtFxswap001.ccyPair}">货币对</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="ccyPair" name="ccyPair" parentIds="tradeType"
                                class="layui-input form-input input-select"
                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                th:data-result='${CYY_PAIR}' allowClear="true" formatoption="true"
                                ></select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                   <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrWtFxswap001.tradePs}">交易方向</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="tradePs" name="tradePs" class="layui-input form-input input-select"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${PS}'>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrWtFxswap001.termType}">期限类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="termType" name="termType" class="layui-input form-input input-select"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${EXC_FXS_TERM_TYPE}'>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrWtFxswap001.entrustStatus}">有效状态</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="entrustStatus" name="entrustStatus"
                                class="layui-input form-input input-select" data-th-data-result='${ENTRUST_STATUS}'
                                allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                formatoption="true">
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrWtFxswap001.entrustDate}">委托日期</label>
                        <div class="layui-input-inline input-inline">
                            <input id='entrustDate' name='entrustDate'
                                class="layui-input form-input input-dateRangeSelect" placeholder="请选择时间区间"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                 </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        </script>
        <script data-th-src="@{/js/invest/entrust/etrwtfxswap/EtrWtFxswap001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
