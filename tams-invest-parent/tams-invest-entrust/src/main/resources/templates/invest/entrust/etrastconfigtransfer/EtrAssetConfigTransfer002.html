<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title data-th-text="#{EtrAssetConfigTransfer001}">资产配置快速转仓指令</title>
    <style>
        div.input-custom > input{
            display:inline-block;
            width:46%;
        }
        div.input-custom > label{
            width:8%;
            display:inline-block;
            text-align:center
        }
        .form-button-wrap{
            float: right;
            margin-right: 20px;
        }
        .layui-form-item.width90{
            float:left;
            width:84%;
        }

        .layui-form-item .width90{
            float:left;
            width:84%;
        }
        .layui-form-item .width10{
            float:left;
            width:15%;
        }
        div#filterAssetDiv {
            height: 200px!important;
        }
        .pro-module.margin5{
            margin-bottom: 5px;
        }
        .btn-trialAdj{
            margin-left: 5px!important;
        }
        div.margin20{
            margin: 20px;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div>
        <form class="layui-form joyin-form-wrap pro-module-form" id="searchForm">
            <div class="pro-module-wrapper pro-module-base">
                <!-- 筛选资产-->
                <div class="pro-module-wrap">
                    <div class="pro-module margin5">
                        <h3 class="pro-module-title">
                            <span class="title-des">筛选资产</span>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrAssetConfigTransfer002.finprodType}">资产分类</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="filter_finprodType" name="filter_finprodType"
                                               class="layui-input form-input input-select" disabled
                                               data-th-data-result="${FINPROD_TYPE_TG}" allowClear="true"
                                               data-th-initValue="${FINPROD_TYPE_TG_F01}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrAssetConfigTransfer002.issueType}">发行方式</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="filter_operationType" name="filter_operationType"
                                               class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-data-result="${ISSUE_TYPE}" allowClear="true">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrAssetConfigTransfer002.duration}">久期</label>
                                    <div class="layui-input-inline input-inline input-custom">
                                            <input type="text" id="filter_durationStart" class="layui-input form-input text-number"  name="filter_durationStart"
                                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-textrange="2" data-fixtype="2"/>
                                            <label>-</label>
                                            <input type="text" id="filter_durationEnd" class="layui-input form-input text-number" name="filter_durationEnd"
                                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-textrange="2" data-fixtype="2" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrAssetConfigTransfer002.yield}">收益率</label>
                                    <div class="layui-input-inline input-inline input-custom">
                                        <input type="text" id="filter_yieldStart" class="layui-input form-input text-number "  name="filter_yieldStart"
                                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                               data-textrange="2" data-fixtype="2"/>
                                        <label>-</label>
                                        <input type="text" id="filter_yieldEnd" class="layui-input form-input text-number" name="filter_yieldEnd"
                                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                               data-textrange="2" data-fixtype="2" />
                                    </div>
                                </div>
                                <div class="form-button-wrap">
                                    <a class="layui-btn layui-btn-sm btn-search" id="EtrAssetConfigTransfer002_btn_search">查询</a>
                                </div>
                            </div>
                        </div>
                        <div id="filterAssetDiv">
                            <table class="layui-table" id="filterAssetTable"  name="filterAssetTable"></table>
                        </div>
                    </div>
                </div>
                <!-- 试算-->
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">试算</span>
                        </h3>
                        <div class="pro-module-item" id="trial_info_add">
                            <div class="layui-form-item" id="trial-info-1">
                                <div class="width90" id="baseTrialDiv">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrAssetConfigTransfer002.portfolioId}">转入组合1</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="trial_portfolioId" name="trial_portfolioId" class="layui-input form-input input-select select_portfolio" th:allowClear="true"
                                                    th:placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" th:formatoption=true required="required"
                                                    data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}"
                                                    data-th-initvalue="${entity?.portfolioId}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrAssetConfigTransfer002.publishDate}">产品成立日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="trial_vdate" name="trial_vdate" class="layui-input form-input" disabled>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrAssetConfigTransfer002.valuation}">产品规模</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="trial_valuation" name="trial_valuation" class="layui-input form-input" disabled>
                                        </div>
                                    </div>
                                </div>
                                <div class="width10">
                                    <!--试算按钮-->
                                    <a id="EtrAssetConfigTransfer002_btn_math" class="layui-btn layui-btn-sm ">
                                        <i class="iconfont icon-calculator"></i>
                                        <span>试算</span></a>
                                    <!--添加按钮-->
                                    <a id="EtrAssetConfigTransfer002_btn_add" class="layui-btn layui-btn-sm btn-create btn-trialAdj">添加</a>
                                    <!--删除按钮-->
                                    <a id="EtrAssetConfigTransfer002_btn_del" class="layui-btn layui-btn-sm btn-delete btn-trialAdj">删除</a>
                                </div>
                            </div>
                        </div>
                        <div id="trialAssetDiv">
                            <table class="layui-table" id="trialAssetTable" name="trialAssetTable"></table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pro-module-block">
                <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11 margin20">
                    <div class="text-center">
                        <a id="EtrAssetConfigTransfer002_btn_generate" class="layui-btn layui-btn-sm btn-create"
                           data-th-text="#{EtrAssetConfigTransfer002.etrFastCreate}">快速生成指令</a>
                        <a id="EtrAssetConfigTransfer002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                           data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var PORTFOLIO_ID = /*[[${PORTFOLIO_ID}]]*/'';
        var INV_AIM = /*[[${INV_AIM}]]*/'';
        var INV_AIM_FVTPL = /*[[${INV_AIM_FVTPL}]]*/'';
        var TRADE_PLACE_01 = /*[[${TRADE_PLACE_01}]]*/'';
        var TRADE_PLACE_03 = /*[[${TRADE_PLACE_03}]]*/'';
        var TRADE_PLACE_04 = /*[[${TRADE_PLACE_04}]]*/'';
        var SHARES_TRADE_PLATFORM_02 = /*[[${SHARES_TRADE_PLATFORM_02}]]*/'';
        var SHARES_TRADE_PLATFORM_03 = /*[[${SHARES_TRADE_PLATFORM_03}]]*/'';
        var SHARES_TRADE_PLATFORM_04 = /*[[${SHARES_TRADE_PLATFORM_04}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/entrust/etrastconfigtransfer/EtrAssetConfigTransfer002.js}" type="text/javascript"></script>

</div>
</body>
</html>
