<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>可转债委托新建</title>
</head>
<body>
<div layout:fragment="content">
        <form class="layui-form joyin-form-wrap pro-module-form" id="searchForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">基本信息</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <input type="text" id="entrustId" name="entrustId" 
                        disabled="disabled" style="display:none;" data-th-value="${entity?.entrustId}">
                        <input type="text" id="entrustStatus" name="entrustStatus"
                        disabled="disabled" style="display:none;" data-th-value="${entity?.entrustStatus}">
                         <input type="hidden" id="finprodIdhid" name="finprodId" th:value="${entity?.finprodId}">
                        <input type="hidden" id="calendarId" name="calendarId" th:value="${entity?.calendarId}">
                        <input type="hidden" id="ps" name="ps" th:value="${etrPs}">
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" 
                                    data-th-text="#{EtrConBond002.portfolioId}">组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption=true required="required"
                                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}"
                                                data-th-initvalue="${entity?.portfolioId}">
                                            </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                    data-th-text="#{EtrConBond001.purchDate}">申购日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id='entrustDate' name='entrustDate'
			                                class="layui-input form-input input-dateSelect" placeholder="请选择时间"
			                                data-th-value='${#dates.format(entity?.entrustDate,"yyyy-MM-dd")}'
			                                required>
                                    </div>
                                </div>

                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{EtrBondFirstLBidding002.finprodId}">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="finprodId" name="finprodMarketId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                required="required"
                                                data-th-data-url="@{/invest/entrust/etrconbond/EtrConBond002/getFinprodIdForAdd}"
                                                data-th-initvalue="${entity?.finprodMarketId}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{EtrBondFirstLBidding002.finprodName}">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodName" name="finprodName"
                                               class="layui-input form-input" disabled
                                               data-th-value="${entity?.finprodName}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{EtrConBond002.assetType1}">债券一级分类</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="assetType1" name="assetType1"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${WINDTYPEONE}' allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                required="required" formatoption="true"
                                                data-th-initvalue="${entity?.assetType1}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                             <div class="layui-form-item">
                                 <div class="form-inline-wrap">
                                     <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{EtrBondFirstLBidding002.tradeMarket}">交易场所</label>
                                     <div class="layui-input-inline input-inline">
                                         <select type="text" id="tradeMarket" name="tradeMarket"
                                                 class="layui-input form-input input-select"
                                                 data-th-data-result='${TRADE_PLACE}' allowClear="true"
                                                 placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                 formatoption="true"  required="required"
                                                 data-th-initvalue="${entity?.tradeMarket}">
                                         </select>
                                     </div>
                                 </div>
                                 <div id="EtrNewPurchModle" class="form-inline-wrap">
                                     <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{EtrConBond001.purchModle}">申购方式</label>
                                     <div class="layui-input-inline input-inline">
                                         <select type="text" id="purchModle" name="purchModle"
                                                 class="layui-input form-input input-select"
                                                 data-th-data-result='${PURCH_MODLE}' allowClear="true"
                                                 placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                 formatoption="true" required="required"
                                                 data-th-initvalue="${PURCH_MODLE_default}">
                                         </select>
                                     </div>
                                 </div>
                                 <div class="form-inline-wrap">
                                     <label class="layui-form-label form-label-wrap"
                                            data-th-text="#{EtrConBond001.purchType}">申购类型</label>
                                     <div class="layui-input-inline input-inline">
                                         <select type="text" id="purchType" name="purchType"
                                                 class="layui-input form-input input-select"
                                                 data-th-data-result='${PURCH_TYPE}' allowClear="true"
                                                 placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                 formatoption="true" required="required"
                                                 data-th-initvalue="${entity?.purchType}">
                                         </select>
                                     </div>
                                 </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrInvestBondInfo001.ccy}">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="ccy" name="ccy"
                                                class="layui-input form-input input-select" data-th-data-result='${CCY}'
                                                th:initValue="${CCY_default}"
                                                allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" formatoption = "true">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{EtrBondFirstLBidding002.invAim}">投资目的</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="invAim" name="invAim"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${INV_AIM}' allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                required="required" formatoption="true"
                                                data-th-initValue="${INV_AIM_default}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{EtrConBond001.purchBondTotal}">申购券面总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="purchBondTotal" name="purchBondTotal" placeholder="请输入内容"
                                               maxlength="30" data-pattern="" data-fixtype="2" data-textrange="4"
                                               class="layui-input form-input text-number" required="required"
                                               data-th-value="${entity?.purchBondTotal}" >
                                        <span class="input-right-show unitNum">万元</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{EtrStock002.secAcctId}">证券托管户</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="secAcctId" name="secAcctId" parentids = "portfolioId,tradeMarket,finprodId"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"  th:data-url="@{/invest/trade/bond/TrdBondInvestTrade002/getSecManageAcctId}"
                                                allowClear="true" th:initValue="${entity?.secAcctId}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{invest.channelId}">通道</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="chlId" name="chlId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true"
                                                data-th-data-url="@{/component/trade/BussChannelCommon/getChannelIdAndCollectType}"
                                                data-th-initvalue="${entity?.chlId}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                    data-th-text="#{EtrBondFirstLBidding002.proAvailableCash}">组合T日可用现金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="proAvailableCash" name="proAvailableCash"
                                                placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                                class="layui-input form-input text-number" disabled="disabled"
                                                data-th-value="${entity?.proAvailableCash}" />
                                                <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                    data-th-text="#{EtrConBond002.tradeMarketCash}">交易所资金账户可用现金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeMarketCash" name="tradeMarketCash"
                                                placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                                class="layui-input form-input text-number" disabled="disabled"
                                               data-th-value="${entity?.tradeMarketCash}"/>
                                                <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="|#{invest.channelId}#{EtrConBond002.channelAvailableCash}|">通道可用现金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="channelAvailableCash" name="channelAvailableCash"
                                               placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                               class="layui-input form-input text-number" disabled="disabled"
                                               data-th-value="${entity?.channelAvailableCash}" />
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                 <!-- 引业务组件投资委托人员信息组件 -->
                <div class="page-component" th:data-path="@{/component/trade/BussEtrInvestPersonInfo/init}"
                        th:data-params="|{entityName: 'etrInvestPersonInfo',entity:'${person_entity}',innerTrade: false}|"></div>
                <!-- 引业务组件附件信息组件 -->
                <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                        th:data-params="|{entityName: 'FileCommon',businessId: '${businessId ?: ''}'}|"></div>
                <div id="ramark_DIV" class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">备注</span>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="layui-input-inline input-inline" style="width: 98%!important;margin:0 10px;">
                                    <textarea id="remark" name="remark" placeholder="请输入内容"
                                              data-th-placeholder="#{SysCommon.placeholder}" class="layui-textarea"
                                              data-th-text="${entity?.remark}" maxlength="300"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                 </div>
            </div>
            <!-- 风险试算 -->
            <div th:if="${isEleShow['EtrConBond002_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}" th:data-params="|{entity: '${riskTrialRetDto}',workflowId:'${workflowId?: ''}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>
    </form>
    <!--  按钮 -->
    <div class="row text-center" style="margin: 20px 0;">
        <div class="text-center">
            <a th:if="${isEleShow['EtrConBond002_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'"
               id="EtrConBond002_btn_riskcal" class="layui-btn layui-btn-sm"
               data-th-text="#{EtrInvestBondInfo002.riskcal}">风险试算</a>
            <a id="EtrConBond002_save" class="layui-btn layui-btn-sm btn-save"
               data-th-text="#{SysCommon.save}">保存</a>
            <a id="EtrConBond002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
               data-th-text="#{SysCommon.submit}">提交</a>
            <a id="EtrConBond002_cancel" class="layui-btn layui-btn-sm  btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
    	var sysDate = /*[[${sysDate}]]*/'';
    	var entity = /*[[${entity}]]*/'';
    	 var bidPriceList = /*[[${bidPriceList}]]*/'';
    	 //取交易编号和流程id
        var workflowId = /*[[${workflowId}]]*/'';
        var tradeId = /*[[${tradeId}]]*/'';
        var todoList = /*[[${TodoList}]]*/'';
        //取交易编号和流程id

        var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
        var fintype = /*[[${fintype}]]*/'';
        var etrPs = /*[[${etrPs}]]*/'';
         var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
        //配置单位 add by yeming 20210721 end
        var entrustAmtUnit = /*[[${entrustAmtUnit}]]*/'';
        //配置单位 add by yeming 20210721 end
     </script>
    <script data-th-src="@{/js/invest/entrust/etrconbond/EtrConBond002.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/component/common/util.js}" type="text/javascript"></script>

</div>
</body>
</html>
