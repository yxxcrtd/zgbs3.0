<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorator="~{layout/default}">
<head>
	<title data-th-text="#{EtrIbBondinfoMain}">银行间债券指令</title>
	<style type="text/css">
		html,body,div.layui-fluid,#main_body{
			height: 100%;
		}
		.top_panel {
			width:100%;
			float: right;
			height:49.5%;
			margin:1px;
			border: 1px solid #aaaaaa;
			display: inline-block;
		}
		.bottom_panel {
			width:100%;
			float: right;
			height:49.5%;
			margin:1px;
			border: 1px solid #aaaaaa;
			display: inline-block;
		}
		.left_bottom_panel {
			width:42%;
			float:left;
			height:100%;
			border: 1px solid #aaaaaa;
			isplay: inline-block;
		}
		.right_bottom_panel {
			float:right;
			width:57.5%;
			height:100%;
			display: inline-block;
		}
		.gutter-vertical{
			width:100%;
			height:3px !important;
			background:#dbdbdd;
			-webkit-box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
			box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
			cursor:n-resize;
			float: right;
		}

		.gutter-horizontal{
			height:570px;
			width:3px !important;
			background:#dbdbdd;
			-webkit-box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
			box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
			cursor:ew-resize;
			float: left;
			margin-left: 2px;
		}
	</style>
</head>
<body>
<div id="main_body" layout:fragment="content">
	<div class="top_panel" id = "top_panel_dev">
		<div style="height: 100%">
			<iframe th:src="@{/invest/entrust/etribbondinfo/EtrIbBondinfo001/init}" width="100%"
					height="100%" frameborder="0" style="border:none;"></iframe>
		</div>
	</div>
	<div class="bottom_panel" id = "bottom_panel_dev">
		<div class="left_bottom_panel" id = "left_bottom_panel_dev" >
			<iframe id = "EtrEtfInfoHq" th:src="@{'/invest/entrust/etribbondinfo/EtrIbBondinfo001/initHq'}" width="100%"
					height="100%"  frameborder="0"  style="border:none;"></iframe>
		</div>
		<div class="right_bottom_panel" id = "right_bottom_panel_dev" >
			<div class="layui-tab" style="height: calc(100% - 50px);" lay-filter="zlPlatform">
				<ul class="layui-tab-title">
					<li class="layui-this" id="danEtr_li">单组合指令</li>
					<li>组合系列指令</li>
<!--					<a id="enlarge" class="layui-btn layui-btn-sm " data-th-text="大小切换" style="margin-bottom: 5px;"></a>-->
					<img id="enlarge" th:src="@{'/img/enlarge.png'}" style="width: 20px;height: 20px; cursor: pointer;"></img>
					<img id="narrow" th:src="@{'/img/narrow.png'}" style="width: 20px;height: 20px; cursor: pointer; display: none;"></img>
				</ul>
				<div class="layui-tab-content" style="height:98%;padding-top:5px;">
					<!-- 单组合指令 -->
					<div class="layui-tab-item layui-show" style="height:95%;" id="danEtr_div">
						<iframe th:src="@{/invest/entrust/etribbondinfo/EtrIbBondinfo002/init}" width="100%"
								height="100%" frameborder="0" style="border:none;"></iframe>
					</div>
					<!-- 多组合指令 -->
					<div class="layui-tab-item" style="height:95%;">
						<iframe th:src="@{/invest/entrust/etribbondinfo/EtribBondInfo003/init}" width="100%"
								height="100%" frameborder="0" style="border:none;"></iframe>
					</div>
				</div>
			</div>
			<div id="baseRiskMathComm" class="page-component" style="display: none;"  th:data-path="@{/component/common/BaseRiskMathComm/init}"
			th:data-params="|{workflowId: '${workflowId}',entityName:'riskTrialRetDto',tradeId:'${entrustId}'}|">
      </div>
			<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11">
				<div class="text-center">
					<a id="EtrIbBondinfoMain_btn_fileupload" class="layui-btn layui-btn-sm" data-th-text="#{EtrIbBondinfoMain.fileupload}">风险试算</a>
					<a id="EtrIbBondinfoMain_btn_riskcal" class="layui-btn layui-btn-sm" data-th-text="#{EtrIbBondinfoMain.riskcal}">风险试算</a>
					<a id="EtrIbBondinfoMain_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
					<a id="EtrIbBondinfoMain_btn_submit" class="layui-btn layui-btn-sm  btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
					<a id="EtrIbBondinfoMain_btn_reset" class="layui-btn layui-btn-sm  btn-reset" data-th-text="#{SysCommon.reset}">重置</a>
				</div>
			</div>
		</div>
	</div>
</div>
<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">
		var ENTRUST_STATUS_05 = /*[[${ENTRUST_STATUS_05}]]*/'05';
		var ENTRUST_STATUS_07 = /*[[${ENTRUST_STATUS_07}]]*/'07';
		var FINPROD_TYPE_TG_F01 = /*[[${FINPROD_TYPE_TG_F01}]]*/'';
		var dan_etr_isshow = /*[[${dan_etr_isshow}]]*/'';
		//展示投资目的或业务模式参数
		// var SHOW_INVAIM_OR_BUSSINSSMODEL =  /*[[${SHOW_INVAIM_OR_BUSSINSSMODEL}]]*/'';
	</script>
	<script data-th-src="@{/js/invest/entrust/etrexchangetrade/split.min.js}" type="text/javascript"></script>
	<script data-th-src="@{/js/invest/entrust/etribbondinfo/EtrIbBondinfoMain.js}" type="text/javascript"></script>

</div>
</body>
</html>
