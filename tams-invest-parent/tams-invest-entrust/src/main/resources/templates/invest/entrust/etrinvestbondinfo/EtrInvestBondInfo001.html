<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
<title data-th-text="#{EtrInvestBondInfo001}">债券投资委托查询</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area">
            <a th:id="|${pageId}_btn_add|" class="layui-btn layui-btn-sm btn-create"
               data-th-text="#{SysCommon.create}">新建</a>
            <a th:id="|${pageId}_btn_cmd|" class="layui-btn layui-btn-sm btn-create" >多组合指令</a>
            <a th:id="|${pageId}_btn_import|" class="layui-btn layui-btn-sm btn-import">
                <i class="iconfont icon-import"></i><span data-th-text="#{EtrInvestBondInfo001.import}"></span></a>
            <a th:id="|${pageId}_btn_close|" class="layui-btn layui-btn-sm"><i class="iconfont icon-close"></i><span data-th-text="#{SysCommon.close}"></a>
            <a th:id="|${pageId}_btn_revoke|" class="layui-btn layui-btn-sm btn-revoke"><i class="iconfont icon-revoke"></i><span data-th-text="#{ETR_REVERT}"></a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrInvestBondInfo001.portfolioId}">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption=true multiple="true"
                                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?ww=false}"
                                                data-th-initvalue="${entity?.portfolioId}">
                                            </select>
                        </div>
                    </div>
                    <!-- <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrInvestBondInfo001.bondType}">债券一级分类</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="bondType" name="bondType"
                                class="layui-input form-input input-select" data-th-data-result='${WINDTYPEONE}'
                                allowClear="true" multiple="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" formatoption = "true">
                            </select>
                        </div>
                    </div> -->
                    <!-- 新增资产二、三、四级分类 王贵奇 2019/7/26 开始 -->
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrInvestBondInfo001.type9}">资产二级分类</label>
                        <div class="layui-input-inline input-inline">
                            <select id="type9" name="type9"
                                    th:initValue="*{entity?.type9}"
                                    class="layui-input form-input input-select"
                                    allowClear="true" placeholder="请选择"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result="${CUSTOM_ASSET_TYPE_TWO}"
                                    formatoption=true childrenIds="type10"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrInvestBondInfo001.type10}">资产三级分类</label>
                        <div class="layui-input-inline input-inline">
                            <select id="type10" name="type10" parentIds="type9"
                                    th:initValue="*{entity?.type10}"
                                    class="layui-input form-input input-select"
                                    allowClear="true" placeholder="请选择"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result="${CUSTOM_ASSET_TYPE_THREE}"
                                    formatoption=true data-th-childrenIds="${isShowType} eq '01' ? 'type11' : 'repAssetType'"></select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4" style="display: none" id = "type11Div">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrInvestBondInfo001.type11}">资产四级分类</label>
                        <div class="layui-input-inline input-inline">
                            <select id="type11" name="type11" parentIds="type10"
                                    th:initValue="*{entity?.type11}"
                                    class="layui-input form-input input-select"
                                    allowClear="true" placeholder="请选择"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result="${CUSTOM_ASSET_TYPE_FOUR}"
                                    formatoption=true childrenIds="type12"></select>
                        </div>
                    </div>
                    <!-- 新增资产二、三、四级分类 王贵奇 2019/7/26 结束 -->
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrInvestBondInfo001.ccy}">币种</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="ccy" name="ccy"
                                class="layui-input form-input input-select" data-th-data-result='${CCY}'
                                th:initValue="${CCY_default}"
                                allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" formatoption = "true">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrInvestBondInfo001.finprodId}">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" class="layui-input form-input input-lenovoselect" id="finprodId"
                                name="finprodId" data-th-placeholder="#{SysCommon.placeholder}" data-idfield="code"
                                data-keyfield="name"
                                data-th-data-effectivefieldsalias='|{"code":"#{EtrInvestAllInfo001.finprodId}",
                                    "shortName":"#{EtrInvestAllInfo001.finprodName}"}|'
                                data-th-data-url="@{/invest/entrust/etrinvestbondinfo/EtrInvestBondInfo001/getfinprodId(pageId=${pageId})}"
                                maxlength="60">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrInvestBondInfo001.tradeMarket}">交易场所</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="tradeMarket" name="tradeMarket"
                                class="layui-input form-input input-select" data-th-data-result='${TRADE_PLACE}'
                                allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" formatoption = "true">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrInvestBondInfo001.tradeMarketMode}">交易市场</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="tradeMarketMode" name="tradeMarketMode"
                                class="layui-input form-input input-select" data-th-data-result='${SHARES_TRADE_MARKET}'
                                allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" formatoption = "true">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrInvestBondInfo001.tradePlat}">交易平台</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="tradePlat" name="tradePlat"
                                class="layui-input form-input input-select" data-th-data-result='${SHARES_TRADE_PLATFORM}'
                                allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" formatoption = "true">
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrInvestBondInfo001.ps}">交易方向</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="ps" name="ps" class="layui-input form-input input-select"
                                data-th-data-result='${PS}' allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrInvestBondInfo001.entrustStatus}">委托状态</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="entrustStatus" name="entrustStatus"
                                class="layui-input form-input input-select" data-th-data-result='${ENTRUST_STATUS}'
                                allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" formatoption = "true">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrInvestBondInfo001.vdate}">委托开始日</label>
                        <div class="layui-input-inline input-inline">
                            <input id='startDate' name='startDate'
                                class="layui-input form-input input-dateSelect" placeholder="请选择时间"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrInvestBondInfo001.mdate}">委托终止日</label>
                        <div class="layui-input-inline input-inline">
                            <input id='endDate' name='endDate'
                                class="layui-input form-input input-dateSelect" placeholder="请选择时间"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrInvestBondInfo001.priceModel}">价格模式</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="priceModel" name="priceModel"
                                class="layui-input form-input input-select" data-th-data-result='${PRICE_MODEL}'
                                allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" formatoption = "true">
                            </select>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script th:inline="javascript" type="text/javascript">
            var bankRoom = /*[[${bankRoom}]]*/'';
            var bankPlat = /*[[${bankPlat}]]*/'';
            var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
        </script>
        <script data-th-src="@{/js/invest/entrust/etrinvestbondinfo/EtrInvestBondInfo001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
