<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
<title data-th-text="#{EtrOption002}">期权指令新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form" id="searchForm">
                <div class="pro-module-wrapper pro-module-base">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <input type="hidden" id="finprodId" name="finprodId" th:value="${entity?.finprodId}">
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrOption002.portfolioId}">组合代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption=true
                                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}"
                                                required="required" data-th-initvalue="${entity?.portfolioId}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrOption002.vdate}">指令开始日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input class="layui-input form-input input-dateSelect" id="vdate"
                                                name="vdate" placeholder="请选择时间" disabled="disabled"
                                                data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'
                                                required="required">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrOption002.mdate}">指令终止日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input class="layui-input form-input input-dateSelect" id="mdate"
                                                name="mdate" placeholder="请选择时间" disabled="disabled"
                                                data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
                                                required="required">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{EtrOption002.contractSubMatter}">合约标的</label>
                                        <div class="layui-input-inline input-inline">
                                            <div style="width: 80%">
                                                <select type="text" id="assetType10" name="assetType10"
                                                        class="layui-input form-input input-select" allowClear="true"
                                                        placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                        formatoption=true required="required"
                                                        data-th-data-url="@{/invest/entrust/etroption/EtrOption002/getOptionTargetIdadd}"
                                                        data-th-initvalue="${entity?.assetType10}">
                                                </select>
                                            </div>
                                            <div style="width: 20%">
                                                <a id="EtrOption002_btn_search" class="layui-btn layui-btn-sm form-input-text">查看</a>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{EtrOption002.contractType}">合约类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="assetType11" name="assetType11"
                                                   class="layui-input form-input input-select"
                                                   data-th-data-result='${STRUCTURE_TYPE}'
                                                   data-th-initvalue="${entity?.assetType11}"
                                                   required="required"
                                                    />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{EtrOption002.ps}">交易方向</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="ps" name="ps"
                                                   class="layui-input form-input input-select"
                                                   data-th-data-result='${PS}'
                                                   required="required"
                                                   data-th-initvalue="${entity?.ps}">
                                        </div>
                                    </div>
                                </div>
                                    <div class="layui-form-item">
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-lable"
                                                   data-th-text="#{EtrOption002.term}">期限</label>
                                            <div class="layui-input-inline input-inline">
                                                <input type="text" id="termDays" name="termDays" placeholder="请输入内容"
                                                       data-textrange="0" data-fixtype="1"
                                                       class="layui-input form-input text-number"required="required"
                                                       data-th-value="${entity?.termDays}" maxlength="10">
                                                <span class="input-right-show">天</span>
                                            </div>
                                        </div>
                                     
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrOption002.ccy}">币种</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="ccy" name="ccy"
                                                class="layui-input form-input input-select" data-th-data-result='${CCY}'
                                                allowClear="true" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" required="required"
                                                formatoption="true" data-th-initvalue="*{entity?.ccy?:CCY_default}">
                                            </select>
                                        </div>
                                    </div>
                                
                                  <div class="form-inline-wrap">
                                            <label class="layui-form-label form-lable"
                                                   data-th-text="#{EtrOption002.entrustNum}">数量</label>
                                            <div class="layui-input-inline input-inline">
                                                <input type="text" id="entrustNum" name="entrustNum" placeholder="请输入内容"
                                                       data-textrange="0" data-fixtype="1"
                                                       class="layui-input form-input text-number" required="required"
                                                       data-th-value="${entity?.entrustNum}" maxlength="10">
                                            </div>
                                        </div>
                                </div>
                                    <div class="layui-form-item">
                                        
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-lable"
                                                   data-th-text="#{EtrOption002.exerciseType}">行权方式</label>
                                            <div class="layui-input-inline input-inline">
                                                <input type="text" id="exerciseType" name="exerciseType"
                                                       class="layui-input form-input input-select"
                                                       data-th-data-result='${EXEC_MODE}' required="required"
                                                       data-th-value="${entity?.exerciseType}"
                                                        >
                                            </div>
                                        </div>
                                         <div class="form-inline-wrap">
                                            <label class="layui-form-label form-lable"
                                                   data-th-text="#{EtrOption002.execBaseDate}" >行权日基准日</label>
                                            <div class="layui-input-inline input-inline">
                                                <input class="layui-input form-input input-dateSelect" id="execBaseDate"
                                                       name="execBaseDate" placeholder="请选择时间"
                                                       data-th-value='${#dates.format(entity?.execBaseDate,"yyyy-MM-dd")}'
                                                       required="required">
                                            </div>
                                        </div>
                                        <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{EtrOption002.optFeePayType}">期权费类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="optFeePayType" name="optFeePayType"
                                                   class="layui-input form-input input-select"
                                                   data-th-data-result='${OPT_FEE_PAY_TYPE}'
                                                   data-th-value="${entity?.optFeePayType}"
                                                    >
                                        </div>
                                    </div>
                                    </div>
                                <div class="layui-form-item">
                                    
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{EtrOption002.optFeePayType1}" >期权费率（%）</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="optFeePayType2" name="optFeePayType2" placeholder="请输入内容"
                                                   data-pattern="" data-fixtype="2" data-textrange="4"
                                                   class="layui-input form-input text-number"
                                                   data-th-value="${entity?.optFeePayType2}">
                                            <span class="input-right-show">%</span>
                                        </div>
                                    </div>
                                     <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{EtrOption002.exePrice}">执行价格</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="exePrice" name="exePrice" placeholder="请输入内容"
                                                   data-pattern="" data-fixtype="2" disabled="disabled"
                                                   data-textrange="2" class="layui-input form-input text-number"
                                                   data-th-value="${entity?.exePrice}"
                                                   >
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{EtrOption002.knockPrice}" >敲出价格</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="knockPrice" name="knockPrice" placeholder="请输入内容"
                                                   data-pattern="" data-fixtype="2" disabled="disabled"
                                                   data-textrange="2" class="layui-input form-input text-number"
                                                   data-th-value="${entity?.knockPrice}"
                                                  >
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{EtrOption002.lowHindPrice}">低障碍价</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="lowHindPrice" name="lowHindPrice" placeholder="请输入内容"
                                                   data-pattern="" data-fixtype="2" disabled="disabled"
                                                   data-textrange="2" class="layui-input form-input text-number"
                                                   data-th-value="${entity?.lowHindPrice}"
                                                   >
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{EtrOption002.lowExercPrice}">低行权价</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="lowExercPrice" name="lowExercPrice" placeholder="请输入内容"
                                                   data-pattern="" data-fixtype="2" disabled="disabled"
                                                   data-textrange="2" class="layui-input form-input text-number"
                                                   data-th-value="${entity?.lowExercPrice}"
                                                   >
                                        </div>
                                    </div>
                                     <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{EtrOption002.highHindPrice}">高障碍价</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="highHindPrice" name="highHindPrice" placeholder="请输入内容"
                                                   data-pattern="" data-fixtype="2" disabled="disabled"
                                                   data-textrange="2" class="layui-input form-input text-number"
                                                   data-th-value="${entity?.highHindPrice}"
                                                   >
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                   
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{EtrOption002.highExercPrice}">高行权价</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="highExercPrice" name="highExercPrice" placeholder="请输入内容"
                                                   data-pattern="" data-fixtype="2"  disabled="true"
                                                   data-textrange="2" class="layui-input form-input text-number"
                                                   data-th-value="${entity?.highExercPrice}"
                                                   >
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <input type="text" id="entrustId" name="entrustId" disabled="disabled"
                                        style="display: none;" data-th-value="${entity?.entrustId}">
                                    <input type="text" id="entrustStatus" name="entrustId" disabled="disabled"
                                        style="display: none;" data-th-value="${entity?.entrustStatus}">
                                </div>
                            </div>
                        </div>
                    </div>
                        <!-- 引业务组件投资委托人员信息组件 -->
                        <div class="page-component" th:data-path="@{/component/trade/BussEtrInvestPersonInfo/init}"
                            th:data-params="|{entityName: 'etrInvestPersonInfo',entity:'${person_entity}', innerTrade: false}|"></div>

                        <!-- 引业务组件附件信息组件 -->
                        <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                            th:data-params="|{entityName: 'FileCommon', businessId: '${businessId ?: ''}'}|"></div>
                        <div id="ramark_DIV" class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">备注</span>
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item" style="padding-bottom: 8px;">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" style="width: 100%;">
                                        <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98% !important;">
                                                <textarea id="remark" name="remark" placeholder="请输入内容"
                                                          data-th-placeholder="#{SysCommon.placeholder}" maxlength="200"
                                                          class="layui-textarea" data-th-text="${entity?.remark}">
										        </textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                        <!-- 风险试算 -->
                        <div th:if="${isEleShow['EtrOption002_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}" th:data-params="|{workflowId: '${workflowId}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>
                    <div class="pro-module-wrapper pro-module-block">
                        <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 20px 0;">
                            <div class="text-center">
                                <a th:if="${isEleShow['EtrOption002_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'"
                                   id="EtrOption002_btn_riskcal" class="layui-btn layui-btn-sm"
                                    data-th-text="#{EtrOption002.riskcal}">风险试算</a>
                                <a id="EtrOption002_btn_save" class="layui-btn layui-btn-sm btn-save"
                                    data-th-text="#{SysCommon.save}">保存</a>
                                <a id="EtrOption002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                                    data-th-text="#{SysCommon.submit}">提交</a>
                                <a id="EtrOption002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                                    data-th-text="#{SysCommon.cancel}">取消</a>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div layout:fragment="script">
        <script th:inline="javascript" type="text/javascript">
            var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
            var fintype=/*[[${fintype}]]*/'';
            var sysDate = /*[[${sysDate}]]*/'';
        </script>
        <script data-th-src="@{/js/component/entrust/EtrShowFinPlanAssetDetailInfo.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/invest/entrust/etroption/EtrOption002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
