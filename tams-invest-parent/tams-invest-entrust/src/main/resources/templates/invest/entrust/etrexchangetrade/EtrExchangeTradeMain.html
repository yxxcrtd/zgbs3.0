<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/default}">
<head>
	<title data-th-text="#{EtrExchangeTradeMain}">场内交易指令</title>
</head>
<body>
<div id="main_body" layout:fragment="content">
	<style type="text/css">
		html,body,div.layui-fluid,#main_body{
			height: 100%;
		}
		.top_panel {
			width:100%;
			float: right;
			height: 49%;
			margin:1px;
			border: 1px solid #aaaaaa;
			display: inline-block;
		}
		.bottom_panel {
			width:100%;
			float: right;
			height: 49%;
			margin:1px;
			border: 1px solid #aaaaaa;
			display: inline-block;
		}
		.left_bottom_panel {
			width:22.5%;
			float:left;
			height:100%;
			border-right: 1px solid #aaaaaa;
			display: inline-block;
		}
		.right_bottom_panel {
			float:right;
			width:77.5%;
			height:100%;
			display: inline-block;
		}
		.gutter-vertical{
			width:100%;
			height:3px !important;
			background:#dbdbdd;
			-webkit-box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
			box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
			cursor:n-resize;
			float: right;
		}

		.gutter-horizontal{
			height:570px;
			width:3px !important;
			background:#dbdbdd;
			-webkit-box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
			box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
			cursor:ew-resize;
			float: left;
			margin-left: 2px;
		}
	</style>
	<div class="top_panel" id = "top_panel_dev">
		<div style="height: 100%">
			<iframe th:src="@{/invest/entrust/etrexchangetrade/EtrExchangeTrade002/init}" width="100%"
					height="100%" frameborder="0" style="border:none;"></iframe>
		</div>
	</div>
	<div class="bottom_panel" id = "bottom_panel_dev">
		<div class="left_bottom_panel" id = "left_bottom_panel_dev" >
			<iframe id = "EtrExchangeTradeHq" th:src="@{'/invest/entrust/etrexchangetrade/EtrExchangeTrade001/initHq'}" width="100%"
					height="100%"  frameborder="0"  style="border:none;"></iframe>
		</div>
		<div class="right_bottom_panel" id = "right_bottom_panel_dev" >
			<div class="layui-tab"  style="height: calc(100% - 50px);" lay-filter="zlPlatform">
				<ul class="layui-tab-title">
					<li class="layui-this" lay-id="0">单组合指令</li>
					<li lay-id="1">多组合指令</li>
					<img id="enlarge" th:src="@{'/img/enlarge.png'}" style="width: 20px;height: 20px; cursor: pointer;"></img>
					<img id="narrow" th:src="@{'/img/narrow.png'}" style="width: 20px;height: 20px; cursor: pointer; display: none;"></img>
				</ul>
				<div class="layui-tab-content" style="height: calc(100% - 20px); padding-bottom:0">
					<div class="layui-tab-item layui-show" id="singlePtlDiv" style="height: 100%";>
						<iframe  name ='EtrExchangeTrade001' id = "EtrExchangeTrade001" th:src="@{'/invest/entrust/etrexchangetrade/EtrExchangeTrade001/init?workflowId='+${workflowId}
				     			+'&isFromToDoList='+${isFromToDoList}+'&pageModel='+${pageModel}+'&entrustId='+${entrustId}}" width="100%"
								 height="100%"  frameborder="0"  style="border:none;"></iframe>
					</div>

					<div class="layui-tab-item" id="multiPtlDiv" style="height: 100%;";>
						<iframe  name ='EtrExchangeTradeMulti001' id = "EtrExchangeTradeMulti001" th:src="@{'/invest/entrust/etrexchangetrade/EtrExchangeTradeMulti001/init?workflowId='+${workflowId}
				     			+'&isFromToDoList='+${isFromToDoList}+'&pageModel='+${pageModel}+'&entrustId='+${entrustId}}" width="100%"
								 height="100%"  frameborder="0"  style="border:none;"></iframe>
					</div>
				</div>
			</div>
			<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11 text-center">
				<a id="EtrExchangeTrade001_btn_riskcal" class="layui-btn layui-btn-sm"
				   data-th-text="#{EtrIbBondinfoMain.riskcal}">风险试算</a>
				<a id="EtrExchangeTrade001_btn_save" class="layui-btn layui-btn-sm btn-save"
				   data-th-text="#{SysCommon.save}">保存</a>
				<a id="EtrExchangeTrade001_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
				   data-th-text="#{SysCommon.submit}">提交</a>
				<a id="EtrExchangeTrade001_btn_reset" class="layui-btn layui-btn-sm  btn-reset"
				   data-th-text="#{SysCommon.reset}">重置</a>
			</div>
		</div>
		<div id="baseRiskMathComm" class="page-component" style="display: none;"  th:data-path="@{/component/common/BaseRiskMathComm/init}"
			 th:data-params="|{workflowId: '${workflowId}',entityName:'riskTrialRetDto',tradeId:'${entrustId}'}|">
		</div>
	</div>
</div>
<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">
		var ENTRUST_STATUS_05 = /*[[${ENTRUST_STATUS_05}]]*/'05';
		var ENTRUST_STATUS_07 = /*[[${ENTRUST_STATUS_07}]]*/'07';
		var isFromToDoList = /*[[${isFromToDoList}]]*/'';
		var FINPROD_TYPE_TG_F01 = /*[[${FINPROD_TYPE_TG_F01}]]*/'';
		var FINPROD_TYPE_TG_F02 = /*[[${FINPROD_TYPE_TG_F02}]]*/'';
		var FINPROD_TYPE_TG_F03 = /*[[${FINPROD_TYPE_TG_F03}]]*/'';
		var FINPROD_TYPE_TG_F06 = /*[[${FINPROD_TYPE_TG_F06}]]*/'';
		var FINPROD_TYPE_TG_F10 = /*[[${FINPROD_TYPE_TG_F10}]]*/'';
		var FINPROD_TYPE_TG_ZYSHG = /*[[${FINPROD_TYPE_TG_ZYSHG}]]*/'';

		var SHARES_TRADE_PLATFORM_02 = /*[[${SHARES_TRADE_PLATFORM_02}]]*/'';
		var SHARES_TRADE_PLATFORM_03 = /*[[${SHARES_TRADE_PLATFORM_03}]]*/'';
		var SHARES_TRADE_PLATFORM_04 = /*[[${SHARES_TRADE_PLATFORM_04}]]*/'';

		var isNeedMutiPtl = /*[[${isNeedMutiPtl}]]*/'';
		var isMulti = /*[[${isMulti}]]*/'';
	</script>
	<script data-th-src="@{/js/invest/entrust/etrexchangetrade/split.min.js}" type="text/javascript"></script>
	<script data-th-src="@{/js/component/entrust/EtrShowFinPlanAssetDetailInfo.js}" type="text/javascript"></script>
	<script data-th-src="@{/js/invest/entrust/etrexchangetrade/EtrExchangeTradeMain.js}" type="text/javascript"></script>
</div>
</body>
</html>
