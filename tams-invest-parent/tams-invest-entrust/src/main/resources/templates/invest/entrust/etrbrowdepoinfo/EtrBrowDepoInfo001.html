<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<meta charset="UTF-8">
<head>
<title data-th-text="#{EtrBrowDepoInfo001}">存款委托</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area">
            <a id="EtrBrowDepoInfo001_btn_add" class="layui-btn layui-btn-sm btn-create"
                data-th-text="#{SysCommon.create}">新建</a>
            <!-- add by gaopeng 20191231 导入按钮添加 start -->
            <a id="EtrBrowDepoInfo001_btn_import" class="layui-btn layui-btn-sm btn-import"
            data-th-text="#{EtrBrowDepoInfo001.import}">导入</a> 
            <!-- add by gaopeng 20191231 导入按钮添加 end -->   
            <a id="EtrBrowDepoInfo001_btn_close" class="layui-btn layui-btn-sm btn-close"><i class="iconfont icon-close"></i><span data-th-text="#{SysCommon.close}"></span></a>
            <a id="EtrBrowDepoInfo001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke"><i class="iconfont icon-revoke"></i><span data-th-text="#{ETR_REVERT}"></span></a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area ">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrBrowDepoInfo001.portfolioId}">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <!-- <input type="text" class="layui-input form-input input-lenovoselect" id="portfolioId"
                                name="portfolioId" data-th-placeholder="#{SysCommon.placeholder}" data-idfield="code"
                                data-keyfield="code"  
                                data-th-data-effectivefieldsalias='|{"code":"#{EtrBrowDepoInfo001.portfolioId}",
                                    "shortName":"#{EtrBrowDepoInfo001.portfolioName}"}|'
                                data-th-data-url="@{/invest/entrust/etrbrowdepoinfo/EtrBrowDepoInfo001/getPortfolioId}"
                                maxlength="60"> -->
                                <select type="text" name="portfolioId" id="portfolioId"
                                            class="finprodIdList layui-input form-input input-select" allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                            formatoption = true
                                            data-th-data-url="@{/invest/entrust/etrbrowdepoinfo/EtrBrowDepoInfo002/getSelectPortfolioId}" 
                                            data-th-initValue="${entity?.portfolioId}" multiple="multiple">
                                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4" style="display: none">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrBrowDepoInfo001.finprodType2}">资产类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="finprodType2" name="finprodType2"
                                class="layui-input form-input input-select" data-th-data-result='${DEPO_ASSET_TYPE}'
                                allowClear="true"  placeholder="请输入内容"
                                multiple="multiple"
                                data-th-placeholder="#{SysCommon.placeholder}" formatoption = "true">
                            </select>
                        </div>
                    </div>
                    <!-- 新增资产二、三四、级分类 王贵奇 2019/8/1 开始-->
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrInvestBondInfo001.type9}">资产二级分类</label>
                        <div class="layui-input-inline input-inline">
                            <select id="type9" name="type9" class="layui-input form-input input-select"
                                data-th-placeholder="#{SysCommon.placeholder}" multiple
                                    data-th-data-result='${CUSTOM_ASSET_TYPE_TWO}'
                                    childrenIds="type10"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrInvestBondInfo001.type10}">资产三级分类</label>
                        <div class="layui-input-inline input-inline">
                            <select id="type10" name="type10" class="layui-input form-input input-select"
                                data-th-placeholder="#{SysCommon.placeholder}" multiple
                                    data-th-data-result='${CUSTOM_ASSET_TYPE_THREE}'
                                    formatoption=true
                                    parentIds="type9" data-th-childrenIds="${isShowType} eq '01' ? 'type11' : 'repAssetType'"></select>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4" style="display: none" id = "type11Div">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrInvestBondInfo001.type11}">资产四级分类</label>
                        <div class="layui-input-inline input-inline">
                            <select id="type11" name="type11" class="layui-input form-input input-select"
                                data-th-placeholder="#{SysCommon.placeholder}" multiple
                                data-th-data-result='${CUSTOM_ASSET_TYPE_FOUR}'
                                parentIds="type10"></select>
                        </div>
                    </div>
                    <!-- 新增资产二、三四、级分类 王贵奇 2019/8/1 结束-->
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrBrowDepoInfo001.entrustStatus}">有效状态</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="entrustStatus" name="entrustStatus"
                                class="layui-input form-input input-select" data-th-data-result='${ENTRUST_STATUS}'
                                allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" formatoption = "true" >
                            </select>
                        </div>
                    </div>
                	<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrBrowDepoInfo001.entrustDate}">委托日期</label>
                        <div class="layui-input-inline input-inline">
                            <input id='entrustDate' name='entrustDate'
                                class="layui-input form-input input-dateRangeSelect" placeholder="请选择、支持区间"
                                data-th-placeholder="#{SysCommon.dateInterval}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                	<div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrBrowDepoInfo001.finprodId}">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" class="layui-input form-input input-lenovoselect" id="finprodId"
                                name="finprodId" data-th-placeholder="#{SysCommon.placeholder}" data-idfield="code"
                                data-keyfield="code"
                                data-th-data-effectivefieldsalias='|{"code":"#{EtrBrowDepoInfo001.finprodId}",
                                    "shortName":"#{EtrBrowDepoInfo001.finprodName}"}|'
                                data-th-data-url="@{/invest/entrust/etrbrowdepoinfo/EtrBrowDepoInfo001/getFinprodMarketId}"
                                maxlength="60">
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrBrowDepoInfo001.ps}">交易方向</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="ps" name="ps" class="layui-input form-input input-select"
                                data-th-data-result='${PS}' allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true">
                            </select>
                        </div>
                    </div>
                    
                	<div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrBrowDepoInfo001.ccy}">币种</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="ccy" name="ccy" class="layui-input form-input input-select"
                                data-th-data-result='${CCY}' allowClear="true" placeholder="请输入内容"
                                th:initValue="${CCY_default}"
                                data-th-placeholder="#{SysCommon.placeholder}" formatoption = "true" >
                            </select>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
     <script th:inline="javascript" type="text/javascript">
              var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
        </script>
        <script data-th-src="@{/js/invest/entrust/etrbrowdepoinfo/EtrBrowDepoInfo001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
