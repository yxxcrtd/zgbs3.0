<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">

<head>
    <title>银行间质押券入库</title>
</head>
<body>
<div layout:fragment="content">
    <div class="standard-container">
        <div class="pro-module-wrap">
            <div class="joyin-form-wrap condition-area curr-form">
             	<form class="layui-form" id="submitForm">
           			<div class="layui-form-item">
                        <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                                   th:utext="#{EtrStandardBond002.portfolioId}">组合代码</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="portfolioId" name="portfolioId"
                                        class="layui-input form-input input-select"
                                        placeholder="请输入内容"
                                        th:placeholder="#{SysCommon.placeholder}"
                                        th:data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}"
                                        th:initValue="${entity?.portfolioId}">
                                </select>
                            </div>
                        </div>
                       <!--  <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                                   th:utext="#{EtrStandardBond002.portfolioIdChild}">子组合代码</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="portfolioId" name="portfolioId"
                                        parentIds="parentPortfolioId"
                                        class="layui-input form-input input-select"
                                        placeholder="请输入内容"
                                        th:placeholder="#{SysCommon.placeholder}"
                                        th:data-url="@{/business/common/CommonSelect/qryPortfolioIdChildByRequestParam}"
                                        th:initValue="${entity?.portfolioId}">
                                </select>
                            </div>
                        </div>
                         -->
                        <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4" style="display: none">
                            <label class="layui-form-label form-lable"
                                   th:utext="#{EtrStandardBond002.tradePlace}">交易场所</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="tradePlace" name="tradePlace"
                                        class="layui-input form-input input-select"
                                        placeholder="请输入内容"
                                        th:placeholder="#{SysCommon.placeholder}"
                                        allowClear="true" formatoption="true"
                                        th:data-result='${TRADE_PLACE}'
                                        th:initValue="${entity?.tradePlace}">
                                </select>
                            </div>
                        </div>
                        
                        <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                                   th:utext="#{EtrStandardBond002.pledgeColModel.secAcctIdName}">证券账户</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="secAcctId" name="secAcctId"
                                        class="layui-input form-input input-select"
                                        placeholder="请输入内容"
                                        th:placeholder="#{SysCommon.placeholder}"
                                        th:data-url="@{/invest/entrust/etrstandardbond/EtrStandardBond001/getSecManageAcctId}"
                                        allowClear="true" formatoption="true"
                                        th:initValue="${entity?.secAcctId}">
                                </select>
                            </div>
                        </div>
                        
                        <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                            <label class="layui-form-label form-lable" >质押券库</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="zyqk" name="zyqk" required
                                        class="layui-input form-input input-select"
                                        placeholder="请输入内容" parentIds="portfolioId"
                                        th:placeholder="#{SysCommon.placeholder}"
                                        th:data-url="@{/invest/entrust/etribrepo/EtrIbRepoinfo002/getPledgeStockIdByPortfolioId}"
                                        allowClear="true" formatoption="true"
                                        >
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="layui-form-item">

                        <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                                   th:utext="#{EtrStandardBond002.pledgeColModel.secType}">债券品种</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="secType" name="secType"
                                        class="layui-input form-input input-select"
                                        placeholder="请输入内容"
                                        th:placeholder="#{SysCommon.placeholder}"
                                        th:data-result='${CUSTOM_ASSET_TYPE_TWO}'
                                        allowClear="true" formatoption="true"
                                >
                                </select>
                            </div>
                        </div>

                        <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                                   th:utext="#{EtrStandardBond002.pledgeColModel.mainGrade}">主体评级</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="mainGrade" name="mainGrade"
                                        class="layui-input form-input input-select"
                                        placeholder="请输入内容"
                                        th:placeholder="#{SysCommon.placeholder}"
                                        th:data-result='${MAIN_GRADE_RESULT}'
                                        allowClear="true" formatoption="true"
                                >
                                </select>
                            </div>
                        </div>

                    </div>
                </form>
            </div>
            <div class="repo-trade-wrap">
                <div class="repo-trade-left">
                    <h3 class="repo-trade-title">
                    <span class="title-des"
                          th:utext="#{EtrStandardBond002.avaPledgeBondList}">可质押债券列表</span>
                    </h3>
                    <table class="layui-table" id="avaPledgeBondList"></table>
                </div>
                <div class="repo-trade-middle">
                    <a class="trade-btn-wrap trade-add-btn" id="EtrStandardBond002_btn_joyin"
                       href="javascript:;">
                        <i class="iconfont icon-batch-down"></i>
                        <span th:utext="#{EtrStandardBond002.joyin}">加入</span>
                    </a>
                    <a class="trade-btn-wrap trade-romove-btn" id="EtrStandardBond002_btn_remove"
                       href="javascript:;">
                        <i class="iconfont icon-batch-upturn"></i>
                        <span th:utext="#{EtrStandardBond002.remove}">移除</span>
                    </a>
                </div>
                <div class="repo-trade-right">
                    <h3 class="repo-trade-title">
                        <span class="title-des" th:utext="#{EtrStandardBond002.pledgeBondList}">入库质押券</span>
                    </h3>
                    <table class="layui-table" id="pledgeBondList" name="pledgeBondList"></table>
                </div>
            </div>
        </div>
        <div class="layui-col-md12 layui-col-xs12 layui-col-sm12 layui-col-lg12"
             style="margin:30px 0;">
            <div class="text-center">
                <!-- <a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save"
                   th:text="#{SysCommon.save}">保存</a> -->
                <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit"
                   th:text="#{SysCommon.save}">保存</a>
                <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel"
                   th:text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <style>
        .repo-trade-wrap {
            overflow: hidden;
        }

        .repo-trade-left, .repo-trade-right {
            width: 45%;
            float: left;
        }

        .repo-trade-middle {
            width: 10%;
            float: left;
            margin-top: 90px;
        }

        .trade-btn-wrap {
            display: block;
            text-align: center;
            margin: 0 12px;
            color: #0b72f1;
            padding: 5px 0;
            background: #f5f5f5;
            border: 1px solid #dddddd;
        }

        .trade-btn-wrap:hover {
            color: #0b72f1;
        }

        .trade-btn-wrap i {
            display: block;
        }

        .trade-romove-btn {
            margin-top: 15px;
        }

        .repo-trade-title {
            padding: 5px 0;
        }

        .standard-container {
            height: 550px;
            overflow: auto;
        }
    </style>
    <script data-th-inline="javascript" type="text/javascript">
        var pledgeBondList = /*[[${pledgeBondList}]]*/'';
        var entity = /*[[${entity}]]*/'';
        var secAcctId = /*[[${entity?.secAcctId}]]*/'';
        var avaPledgeBondList = /*[[${avaPledgeBondList}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/entrust/etribrepo/EtrIbRepoLib.js}" type="text/javascript"></script>
</div>
</body>
</html>
