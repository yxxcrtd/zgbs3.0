<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<style type="text/css">
.form-lable {
	width: 35%;
	padding: 0px 10px 0px 0px;
}

.layui-tab-content {
	padding: 0px !important;
}

.select2-container--default .select2-results>.select2-results__options {
	max-height: 150px;
	overflow-y: auto;
}

.position-col-width {
	width: 27%;
}
.position-col-width2 {
    width: 20%;
}

.grid-demo {
	background-color: #f5f5f5;
	border: 1px solid red;
	border-radius: 3px;
	padding: 5px;
}
</style>
</head>
<body>
    <div layout:fragment="content">
        <div class="layui-tab">
            <ul class="layui-tab-title">
                <li class="layui-this">持仓</li>
                <li>非公开行情</li>
                <li>在途回购</li>
            </ul>
            <div class="layui-tab-content">
                <!-- 持仓 -->
                <div class="layui-tab-item layui-show">
                    <div class="joyin-form-wrap layui-fluid">
                        <form class="layui-form" id="searchForm_cc">
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md3 layui-col-xs3 layui-col-sm3 layui-col-lg3 position-col-width2">
                                    <label class="layui-form-label form-lable">组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="portfolioId" name="portfolioId"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId}"
                                            data-th-value="${entity?.portfolioId}" multiple="true">
                                        </select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md3 layui-col-xs3 layui-col-sm3 layui-col-lg3 position-col-width2">
                                    <label class="layui-form-label form-lable">交易市场</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="tradeMarket" name="tradeMarket"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-data-result='${TRADE_PLACE}'
                                            data-th-value="${entity?.tradeMarket}">
                                        </select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-l4 position-col-width2">
                                    <label class="layui-form-label form-lable">证券账户</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="secAcctId" name="secAcctId"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            data-th-placeholder="#{SysCommon.placeholder}"
                                            th:data-url="@{/invest/entrust/etrexchangetrade/EtrExchangeTrade002/getSecAcctId}"
                                            data-th-value="${entity?.secAcctId}">
                                        </select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md3 layui-col-xs3 layui-col-sm3 layui-col-lg3 position-col-width2">
                                    <label class="layui-form-label form-lable">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="finprodId" name="finprodId"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            data-th-placeholder="#{SysCommon.placeholder}"
                                            th:data-url="@{/invest/entrust/etrexchangetrade/EtrExchangeTrade001/getFinprodMarketInfo}"
                                            data-th-value="${entity?.finprodId}">
                                        </select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md1 layui-col-xs1 layui-col-sm1 layui-col-lg1">
                                    <a class="layui-btn layui-btn-sm btn-search" style="margin-left: 25px;"
                                        id="EtrAgreRepTrade002_search_btn"> <i class="iconfont icon-search"></i><span>查询</span></a>
                                </div>
                            </div>
                        </form>
                    </div>
                    <!-- 持仓列表 -->
                    <div>
                        <table class="layui-table" id="positionsTable"></table>
                    </div>
                </div>
                <!-- 非公开行情 -->
                <div class="layui-tab-item">
                    <!-- 非公开行情列表 -->
                    <div>
                        <table class="layui-table" id="unOpenQuotaTable"></table>
                    </div>

                </div>
                 <!-- 在途回购 -->
                <div class="layui-tab-item">
                    <!-- 在途回购列表 -->
                    <div>
                        <table class="layui-table" id="onWayRepTable"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/entrust/etragrereptrade/EtrAgreRepTrade002.js}" type="text/javascript"></script>
        <script th:inline="javascript" type="text/javascript">
            var FINPROD_TYPE_TG_F01 = /*[[${FINPROD_TYPE_TG_F01}]]*/'';
            var PS_T02 = /*[[${PS_T02}]]*/'';
            var PS_T69 = /*[[${PS_T69}]]*/'';
            var DECLA_TYPE_PRM05 = /*[[${DECLA_TYPE_PRM05}]]*/'';
            var TARGET_CLASS_01 = /*[[${TARGET_CLASS_01}]]*/'';
            var DECLA_TYPE_PRM14 = /*[[${DECLA_TYPE_PRM14}]]*/'';
            var PRICE_MODEL_PRM01 = /*[[${PRICE_MODEL_PRM01}]]*/'';
            var ENTRUST_BUSS_TYPE_15 = /*[[${ENTRUST_BUSS_TYPE_15}]]*/'';
            var UNOPENQUOTA_REFRESH_PERIOD = /*[[${UNOPENQUOTA_REFRESH_PERIOD}]]*/'';
            var POSTABLE_REFRESH_PERIOD = /*[[${POSTABLE_REFRESH_PERIOD}]]*/'';
            var ONWAYREP_REFRESH_PERIOD = /*[[${ONWAYREP_REFRESH_PERIOD}]]*/'';

            var BACK_LEND_DIRECTION_04 = /*[[${BACK_LEND_DIRECTION_04}]]*/'';
            var TRADE_MARKET_03 = /*[[${TRADE_MARKET_03}]]*/'';
        </script>
    </div>
</body>
</html>
