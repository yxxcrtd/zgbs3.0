<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title data-th-text="#{EtrSecLend}">债券借贷投资委托</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a id="EtrSecLend001_btn_add" class="layui-btn layui-btn-sm btn-create"
        data-th-text="#{SysCommon.create}">新建</a>
        <a id="EtrSecLend001_btn_close" class="layui-btn layui-btn-sm">
            <i class="iconfont icon-close"></i>
            <span data-th-text="#{SysCommon.close}">关闭</span>
        </a>
        <a id="EtrSecLend001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke"><i class="iconfont icon-revoke"></i><span data-th-text="#{ETR_REVERT}"></a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form id="searchForm" class="layui-form">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{EtrSecLend.portfolioId}">组合代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="portfolioId" name="portfolioId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?ww=false}"
                                data-th-value="${entity?.portfolioId}"
                                multiple="true" >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{EtrSecLend.finprodId}">标的债券</label>
                    <div class="layui-input-inline input-inline">
                            <input type="text" id="finprodId" name="finprodId"
                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/business/common/CommonSelect/getAssetIdBond}"
                                data-idfield="code" data-keyfield="hidCode"
                                data-th-data-effectivefieldsalias='|{"code":"#{EtrSecLend.finprodId}","shortName":"#{EtrSecLend.finprodName}"}|'
                                data-th-value="${entity?.finprodId}">
                        </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{EtrSecLend.ccy}">币种</label>
                    <div class="layui-input-inline input-inline">
                        <input id="ccy" name="ccy" type="text"
                        class="layui-input form-input input-select"
                        data-th-data-result="${CCY}" th:initValue="${CCY_default}"
                        placeholder="请输入内容">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{EtrSecLend.tradeMarket}">交易场所</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="tradeMarket" name="tradeMarket"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${TRADE_PLACE}'
                                allowClear="true" formatoption="true" data-th-initValue="${entity?.tradeMarket}"></select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{EtrSecLend.busiPs}">借贷方向</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="busiPs" name="busiPs"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${BACK_LEND_DIRECTION}'
                                allowClear="true" formatoption="true" data-th-initValue="${entity?.busiPs}"></select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{EtrSecLend.entrustStatus}">有效状态</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="entrustStatus" name="entrustStatus"
                                class="layui-input form-input input-select" data-th-data-result='${ENTRUST_STATUS}'
                                allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                formatoption="true">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{EtrBoutRepo001.entrustDate}">指令日期</label>
                    <div class="layui-input-inline input-inline">
                        <input id='entrustDate' name='entrustDate'
                               class="layui-input form-input input-dateRangeSelect" placeholder="请选择时间区间"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/entrust/etrseclend/EtrSecLend001.js}" type="text/javascript"></script>
</div>
</body>

</html>
