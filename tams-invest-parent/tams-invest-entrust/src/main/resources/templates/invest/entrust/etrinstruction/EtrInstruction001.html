<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{EtrInstruction001}">立项指令</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="layui-col-md12 form-button-area" style="margin: 10px;">
            <a id="EtrInstruction001_btn_add" class="layui-btn layui-btn-sm btn-create"
               data-th-text="#{SysCommon.create}">新建</a>
            <a id="EtrInstruction001_btn_close" class="layui-btn layui-btn-sm btn-close"
            ><i class="iconfont icon-close"></i><span data-th-text="#{SysCommon.close}"></span></a>
            <a id="EtrInstruction001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke"
            ><i class="iconfont icon-revoke"></i><span data-th-text="#{ETR_REVERT}"></span></a>
        </div>
        <div class='joyin-form-wrap joyin-filter-form condition-area'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{EtrInstruction001.assetTypeOne}">资产一级类型</label>
                        <div class="layui-input-inline input-inline">
                            <select id="assetType1" name="assetType1"
                                    class="layui-input form-input input-select" allowClear="true"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result='${PLAN_ASSET_TYPE}'
                                     multiple>
                            </select>
                        </div>
                    </div>

                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4" >
                        <label class="layui-form-label form-lable"
                               data-th-text="#{EtrInstruction001.assetTypeTwo}">资产二级类型</label>
                        <div class="layui-input-inline input-inline">
                            <select id="assetType10" name="assetType10"
                                    class="layui-input form-input input-select" allowClear="true"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result='${PLAN_ASSET_SEC_TYPE}'
                                    parentIds="assetType1"
                                    formatoption=true  multiple>
                            </select>
                        </div>
                    </div>

                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4" >
                        <label class="layui-form-label form-lable"
                               data-th-text="#{EtrInstruction001.finprodMarketId}">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="finprodMarketId" name="finprodMarketId"
                                   class="layui-input form-input input-lenovoselect"
                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-effectivefieldsalias='|{"code":"#{EtrInstruction001.finprodMarketId}",
                                    "shortName":"#{EtrInstruction001.finprodAbbr}"}|'
                                   data-th-data-url="@{/invest/entrust/etrinstruction/EtrInstruction001/getFinprodMarketIdList}"
                                   data-idfield="code" data-keyfield="code"
                                >
                        </div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4" >
                        <label class="layui-form-label form-lable"
                               data-th-text="#{EtrInstruction001.repFinancier}">融资人/管理人</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="repFinancier" name="repFinancier"
                                   class="layui-input form-input input-lenovoselect"
                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-effectivefieldsalias='|{"code":"#{EtrInstruction001.repFinancier}"}|'
                                   data-th-data-url="@{/invest/entrust/etrinstruction/EtrInstruction001/getRepFinancierList}"
                                   data-idfield="code" data-keyfield="code" >
                        </div>
                    </div>

                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4" >
                        <label class="layui-form-label form-lable"
                               data-th-text="#{EtrInstruction001.statusValid}">有效状态</label>
                        <div class="layui-input-inline input-inline">
                            <select id="entrustStatus"
                                    name="entrustStatus"
                                    allowClear="true"
                                    class="layui-input form-input input-select"
                                    data-th-data-result='${ENTRUST_STATUS}'
                                    placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>

                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4" >
                        <label class="layui-form-label form-lable"
                               data-th-text="#{EtrInstruction001.ccy}">币种</label>
                        <div class="layui-input-inline input-inline">
                            <select id="ccy"
                                    name="ccy"
                                    allowClear="true"
                                    class="layui-input form-input input-select"
                                    data-th-data-result='${CCY}'
                                    placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">

    </script>
    <script data-th-src="@{/js/invest/entrust/etrinstruction/EtrInstruction001.js}"></script>
</div>
</body>
</html>
