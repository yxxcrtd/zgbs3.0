<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
    <style type="text/css">

        .s-color-red{color:red !important}.s-color-green{color:green !important}
        .level2-panel
        {

            width: auto
        }

        .level2-panel h3
        {
            font-weight: bold;
            line-height: 26px;
            text-align: left;
            position: relative
        }

        .level2-panel .price-bulletin
        {
            width: 72%;
            height: 40px;
        }

        .level2-panel .price-bulletin>*
        {
            display: block;
            line-height: 40px
        }

        .level2-panel .price-bulletin .latest-price,  .level2-panel .price-bulletin .change-direction
        {
            float: left;
            padding-left: 5px;
            font-size: 18px
        }

        .level2-panel .price-bulletin .latest-price .icon-up,  .level2-panel .price-bulletin .latest-price .icon-down,  .level2-panel .price-bulletin .change-direction .icon-up,  .level2-panel .price-bulletin .change-direction .icon-down
        {
            display: none
        }

        .level2-panel .price-bulletin .change-direction .icon-down
        {
            display: none
        }

        .level2-panel .price-bulletin .change-info
        {
            float: right;
            padding-right: 10px
        }

        .level2-panel .price-bulletin .change-info .change
        {
            position: relative;
            top: 3px;
            line-height: 14px
        }

        .level2-panel .price-bulletin .change-info .percentage
        {
            position: relative;
            top: 7px;
            line-height: 14px
        }

        .level2-panel .price-boundary
        {
            height: 65px;
            padding: 0px 0;
            border-bottom: 1px solid #E6E6E6
        }

        .level2-panel .price-boundary .typical-price
        {
            float: left;
            width: 50%;
            height: 22px;
            line-height: 22px
        }

        .level2-panel .price-boundary .typical-price a
        {
            padding-left: 5px
        }

        .level2-panel .level .level-item
        {
            line-height: 20px
        }

        .level2-panel .level .level-item>*
        {
            display: inline-block
        }

        .level2-panel .level .level-item .level-name
        {
            width: 20%
        }

        .level2-panel .level .level-item .level-price
        {
            width: 30%;
            text-align: center
        }

        .level2-panel .level .level-item .level-volume
        {
            width: 30%;
            padding-right: 10px;
            text-align: center
        }

        .level2-panel .level.level-sell
        {
            border-bottom: 1px solid #E6E6E6
        }

        .level2-panel .price-anchor
        {
            cursor: pointer
        }

        .level2-panel .price-anchor:hover
        {
            text-decoration: underline
        }
        .level2-panel .price-bulletin .change-direction .icon-down:before {
            content: "";
        }

        #item_dz .layui-table-view{
            height:300px !important;
        }

        #item_dz .layui-table-main{
            height:270px !important;
        }

        #item_gd .layui-table-view{
            height:330px !important;
        }

        #item_gd .layui-table-main{
            height:300px !important;
        }
        
        .layui-tab-content {
            padding: 0px 10px;
        }
        

    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="layui-tab"  lay-filter="tradePlatform">
        <ul class="layui-tab-title" id="tradePlatform_ul_tab">
            <li class="layui-this" th:value='jj' lay-id="02">竞价交易</li>
            <li th:value='dz' lay-id="04">大宗交易</li>
            <li th:value='gd' lay-id="03">固定收益</li>
        </ul>
        <div class="layui-tab-content">
            <!-- 竞价交易 -->
            <div class="layui-tab-item layui-show">
                <div  class="leftTopHide" style="height: 300px;">
                    <div class="level2-panel">
                        <div>
                            <h3 style="line-height: 41px;float: left;">-----</h3>

                            <div class="price-bulletin" style="float: right;width: 60%;">
                                <div class="latest-price">
                                    <a id="latestPrice_jj" class="level-price price-anchor">0.00</a>
                                </div>

                                <div class="change-direction">
                                    <span class="icon-up s-color-red">↑</span>
                                    <span class="icon-down s-color-green">↓</span>
                                </div>

                                <div class="change-info">
                                    <div class="change">0.00</div>
                                    <div class="percentage">0.00%</div>
                                </div>
                            </div>
                        </div>

                        <div class="price-boundary" style="clear: both;">
                            <div class="typical-price item-open">今开<a class="level-price price-anchor">0.00</a></div>
                            <div class="typical-price item-preclose">昨收<a class="level-price price-anchor">0.00</a></div>
                            <div class="typical-price item-ceiling">涨停<a id="limitUp_jj" class="level-price price-anchor s-color-red">0.00</a></div>
                            <div class="typical-price item-floor">跌停<a id="limitDown_jj" class="level-price price-anchor s-color-green">0.00</a></div>
                            <div class="typical-price item-kyje" id="accAvailableCash_div_jj">可用金额<a id="accAvailableCash_jj" class="price-anchor">0.00</a></div>
                            <div class="typical-price item-kmsl" id="availableNum_div_jj"><label id="availableNum_label_jj">可卖数量</label><a id="availableNum_jj" class="price-anchor">0.00</a></div>
                        </div>
                        <div class="price-buy-sell">
                            <!-- 卖出档位 -->

                            <div class="level level-sell">

                                <div class="level-item">
                                    <label class="level-name">卖五</label> <a
                                        class="level-price price-anchor">--</a> <label
                                        class="level-volume">--</label>
                                </div>

                                <div class="level-item">
                                    <label class="level-name">卖四</label> <a
                                        class="level-price price-anchor">--</a> <label
                                        class="level-volume">--</label>
                                </div>

                                <div class="level-item">
                                    <label class="level-name">卖三</label> <a
                                        class="level-price price-anchor">--</a> <label
                                        class="level-volume">--</label>
                                </div>

                                <div class="level-item">
                                    <label class="level-name">卖二</label> <a
                                        class="level-price price-anchor">--</a> <label
                                        class="level-volume">--</label>
                                </div>

                                <div class="level-item">
                                    <label class="level-name">卖一</label> <a
                                        class="level-price price-anchor">--</a> <label
                                        class="level-volume">--</label>
                                </div>

                            </div>

                            <!-- 买入档位 -->

                            <div class="level level-buy">

                                <div class="level-item">
                                    <label class="level-name">买一</label> <a
                                        class="level-price price-anchor">--</a> <label
                                        class="level-volume">--</label>
                                </div>

                                <div class="level-item">
                                    <label class="level-name">买二</label> <a
                                        class="level-price price-anchor">--</a> <label
                                        class="level-volume">--</label>
                                </div>

                                <div class="level-item">
                                    <label class="level-name">买三</label> <a
                                        class="level-price price-anchor">--</a> <label
                                        class="level-volume">--</label>
                                </div>

                                <div class="level-item">
                                    <label class="level-name">买四</label> <a
                                        class="level-price price-anchor">--</a> <label
                                        class="level-volume">--</label>
                                </div>

                                <div class="level-item">
                                    <label class="level-name">买五</label> <a
                                        class="level-price price-anchor">--</a> <label
                                        class="level-volume">--</label>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 大宗交易 -->
            <div class="layui-tab-item" id="item_dz">
                <div class="leftTopHide layui-tab" style="margin: 0;">
                    <div class="layui-tab-content" style="padding: 0;">
                        <div class="layui-tab-item layui-show">
                            <div style="height: 310px;">
                                <table class="layui-table" id="tradeQuotationsTable"></table>
                            </div>
                        </div>
                        <div class="layui-tab-item">
                            <div style="height: 310px;">
                                <table class="layui-table" id="afterHoursTable"></table>
                            </div>
                        </div>
                    </div>
                    <ul class="layui-tab-title">
                        <li class="layui-this">交易行情</li>
                        <li>盘后行情</li>
                    </ul>
                </div>

            </div>
            <!-- 固定收益 -->
            <div class="layui-tab-item" id="item_gd">
                <div class="leftTopHide" style="height: 340px;">
                    <table class="layui-table" id="fixedIncomeTable"></table>
                </div>

            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        // 接口平台获取行情 add by swwan 20211104 start
        var useInterfQuoteFlag = /*[[${useInterfQuoteFlag}]]*/'';
        var wsUri = /*[[${wsUri}]]*/'';
        // 接口平台获取行情 add by swwan 20211104 end

    </script>
    <script data-th-src="@{/js/invest/entrust/etrexchangetrade/EtrExchangeTradeHq.js}" type="text/javascript"></script>
</div>
</body>
</html>
