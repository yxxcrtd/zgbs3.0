<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{EtrInstruction002}">立项指令新建</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">

                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <input type="hidden" id="vdateStr" name="vdateStr" th:value="${entity?.vdateStr}">
                        <input type="hidden" id="mdateStr" name="mdateStr" th:value="${entity?.mdateStr}">
                        <input type="hidden" id="entrustId" name="entrustId"  data-th-value="${entity?.entrustId}">
                        <input type="hidden" id="riskMathFlag" name="riskMathFlag" data-th-default="01">
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrInstruction001.assetTypeOne}">资产一级分类</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="assetType1" name="assetType1"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.assetType1}"
                                                data-th-data-result='${PLAN_ASSET_TYPE}'
                                                childrenIds="assetTypeTwo" required>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrInstruction001.assetTypeTwo}">资产二级分类</label>
                                    <div class="layui-input-inline input-inline">
                                            <select id="assetType10" name="assetType10"
                                                    class="layui-input form-input input-select" allowClear="true"
                                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue="${entity?.assetType10}"
                                                    data-th-data-result='${PLAN_ASSET_SEC_TYPE}'
                                                    parentIds="assetType10"
                                                    formatoption=true required>
                                            </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrInstruction001.finprodMarketId}">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodMarketId" name="finprodMarketId"
                                                class="layui-input form-input"
                                               placeholder="" maxlength="75"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.finprodMarketId}" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrInstruction001.finprodAbbr}">资产简称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodAbbr" name="finprodAbbr"
                                                class="layui-input form-input"
                                               placeholder="" maxlength="75"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.finprodAbbr}" />
                                    </div>
                                </div>

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrInstruction001.repFinancier}">融资人/管理人</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="repFinancier" name="repFinancier"
                                               required="required" class="layui-input form-input"
                                               placeholder="" maxlength="75"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.repFinancier}"  />
                                    </div>
                                </div>

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrInstruction001.prdRate}">收益率</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="matureYield" name="matureYield"
                                               data-textrange="8" data-th-value='${entity?.matureYield}'
                                               class="layui-input form-input text-number ps01" />
                                    </div>
                                </div>
                            </div>

                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrInstruction001.entrustAmt}">委托金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="entrustAmt" name="entrustAmt"
                                               data-textrange="8" data-th-value='${entity?.entrustAmt}'
                                               class="layui-input form-input text-number ps01" required />
                                    </div>
                                </div>

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrInstruction001.ccy}">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="ccy" name="ccy"
                                                allowClear="true"
                                                data-th-initValue="${entity?.ccy}"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${CCY}'
                                                placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" required>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrInstruction001.vDate}">起息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="vDate" name="vDate"
                                               data-th-value="${#dates.format(entity?.vDate,'yyyy-MM-dd')}"
                                               class="layui-input form-input input-dateSelect ps02" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrInstruction001.mDate}">到期日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="mDate" name="mDate"
                                               data-th-value="${#dates.format(entity?.mDate,'yyyy-MM-dd')}"
                                               class="layui-input form-input input-dateSelect ps02" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!--引入委托投资组件-->
                <div class="page-component" style="display: none" th:data-path="@{/component/trade/BussEtrInvestPersonInfo/init}"
                     th:data-params="|{entityName: 'bussEtrInvestPersonInfoDto',entity:'${person_entity}',single:'1', psId : 'ps'}|"></div>


                <!-- 引业务组件附件信息组件 -->
                <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                     th:data-params="|{entityName: 'FileCommon', businessId: '${businessId ?: ''}'}|"></div>


                    <div class="pro-module">
                        <h3 class="pro-module-title"
                            style="border-top: 1px solid #ccc;">
                            <span class="title-des" th:text="#{EtrInstruction001.remark}">备注</span><i
                                class="iconfont icon-arrow-down pro-down-icon"
                        ></i>
                        </h3>
                        <div class="pro-module-item" style="padding-bottom: 8px;">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" style="width: 100%;">
                                    <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98% !important;">
                                                <textarea id="remark" name="remark" placeholder="请输入内容"
                                                          data-th-placeholder="#{SysCommon.placeholder}" maxlength="200"
                                                          class="layui-textarea" data-th-text="${entity?.remark}">
										        </textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
               <!-- <div id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}"
                     th:data-params="|{workflowId: '${workflowId}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>-->
            </div>
            <div class="pro-module-wrapper pro-module-block">
                <div
                        class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11"
                        style="margin: 50px;">
                    <div class="text-center">

                       <!-- <a id="EtrInstruction002_btn_riskcal" class="layui-btn layui-btn-sm"
                           data-th-text="#{EtrInstruction002.riskcal}">风险试算</a>-->
                        <a id="EtrInstruction002_btn_save"
                           class="layui-btn layui-btn-sm btn-save"
                           data-th-text="#{SysCommon.save}">保存</a>
                        <a
                            id="EtrInstruction002_btn_submit"
                            class="layui-btn layui-btn-sm btn-submit"
                            data-th-text="#{SysCommon.submit}">提交</a>

                        <a
                            id="EtrInstruction002_btn_cancel"
                            class="layui-btn layui-btn-sm btn-cancel"
                            data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </div>
        </div>

    </form>
</div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var workflowId = /*[[${entity?.workflowId}]]*/'';
        var sysDate = /*[[${sysDate}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/entrust/etrinstruction/EtrInstruction002.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/component/common/TradeCommon.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/component/autocoupon/AutoCoupon.js}" type="text/javascript"></script>
</div>
</body>

</html>
