<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
    <title data-th-text="#{EtrAutoManagementAccount002}">自主管理专户投资指令新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="pro-module-container">
            <form class="layui-form joyin-form-wrap pro-module-form" id="searchForm">
                <div class="pro-module-wrapper pro-module-base">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{EtrAutoManagementAccount002.entrustDate}">指令日期</label>
                                        <div class="layui-input-inline input-inline">
                                            <input class="layui-input form-input input-dateSelect" id="entrustDate"
                                                   name="entrustDate" placeholder="请选择时间"
                                                   data-th-value='${#dates.format(entity?.entrustDate,"yyyy-MM-dd")}'
                                                   disabled="disabled"
                                                   required="required">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <!--<input type="text" id="entrustId" name="entrustId" disabled="disabled" style="display:none;" data-th-value="${entity?.entrustId}">-->
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrAutoManagementAccount002.portfolioId}">自主专户代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="hidden" id="portfolioIdChange" name="portfolioIdChange" th:value="${entity?.portfolioIdChange}" />
                                            <select type="text" name="portfolioId" id="portfolioId"
                                                    class="finprodIdList layui-input form-input input-select" allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                    formatoption=true
                                                    required
                                                    data-th-data-url="@{/invest/entrust/etrautomanagementaccount/EtrAutoManagementAccount001/getSelectPortfolioId}"
                                                    data-th-initvalue="${entity?.portfolioId}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrAutoManagementAccount002.finprodId}">底层资产代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="hidden" id="finprodId" name="finprodId" th:value="${entity?.finprodId}">
                                            <input type="hidden" id="finprodType2" name="finprodType2" th:value="${entity?.finprodType2}">
                                            <input type="hidden" id="assetType" name="assetType" th:value="${entity?.assetType}">
                                            <select type="text" id="finprodMarketId" name="finprodMarketId" class="layui-input form-input input-select"
                                                    allowClear="true" placeholder="请输入内容" required
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-data-url="@{/invest/entrust/etrautomanagementaccount/EtrAutoManagementAccount002/getSelectFinprodMarketId}"
                                                    data-th-initValue="${entity?.finprodMarketId}">
                                            </select>
                                        </div>
                                        <!--<input type="text" id="entrustId" name="entrustId" disabled="disabled" style="display:none;" data-th-value="${entity?.entrustId}">-->


                                        <!--<label class="layui-form-label form-lable" data-th-text="#{EtrAutoManagementAccount002.finprodId}">底层资产代码</label>-->
                                        <!--<div class="layui-input-inline input-inline">-->
                                            <!--<input type="hidden" id="finprodId" name="finprodId" data-th-value="${entity?.finprodId}" >-->
                                            <!--<select type="text" name="finprodMarketId" id="finprodMarketId"-->
                                                    <!--class="finprodIdList layui-input form-input input-select" allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"-->
                                                    <!--formatoption=true-->
                                                    <!--required-->
                                                    <!--data-th-data-url="@{/invest/entrust/etrautomanagementaccount/EtrAutoManagementAccount002/getSelectFinprodMarketId}"-->
                                                    <!--data-th-initvalue="${entity?.finprodMarketId}">-->
                                            <!--</select>-->
                                        <!--</div>-->
                                    </div>

                                </div>

                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{EtrAutoManagementAccount002.type6}">资产一级分类</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="hidden" id="type6" name="type6" th:value="${entity?.type6}">
                                            <input  type="text" id="type6Str" name="type6Str" data-th-placeholder="#{SysCommon.placeholder}"
                                                   	class="layui-input form-input input-text" disabled="disabled"/>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{EtrAutoManagementAccount002.type7}">资产二级分类</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="hidden" id="type7" name="type7" th:value="${entity?.type7}">
                                            <input  type="text" id="type7Str" name="type7Str" data-th-placeholder="#{SysCommon.placeholder}"
                                                   	class="layui-input form-input input-text" disabled="disabled"/>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"  data-th-text="#{EtrAutoManagementAccount002.ps}">交易方向</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="ps" name="ps" class="layui-input form-input input-select"
                                                    data-th-data-result='${PS}' allowClear="true" placeholder="请输入内容"
                                                    data-th-initvalue="${entity?.ps}" required
                                                    data-th-placeholder="#{SysCommon.placeholder}" formatoption="true">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <!--<input type="text" id="entrustId" name="entrustId" disabled="disabled" style="display:none;" data-th-value="${entity?.entrustId}">-->
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrAutoManagementAccount002.entrustAmt}">指令金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input id="entrustAmt" name="entrustAmt"class="layui-input form-input text-number" required
                                                   data-th-value="${entity?.entrustAmt}">
                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title"><span class="title-des">组合分配情况</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                            <div>
                                <table class="layui-table" id="dataTable"></table>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 风险试算 -->
                <!--ZGZGST-1985:展示风险试算结果 fuyongsheng 20210903 edit start-->
                <div id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}"
                     th:data-params="|{workflowId: '${workflowId}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>
                <!--ZGZGST-1985:展示风险试算结果 fuyongsheng 20210903 edit end-->
                <!--上农商个性化_指令环节风险试算改造,添加IS_ETR:'Y'  modify by zhangpei 20201212 end  -->
            </form>
            <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
                <div class="text-center">
                    <a id="EtrAutoManagementAccount002_btn_riskcal" class="layui-btn layui-btn-sm" data-th-text="#{EtrInvestBondInfo002.riskcal}">风险试算</a>
                    <a id="EtrAutoManagementAccount002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                    <a id="EtrAutoManagementAccount002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                    <a id="EtrAutoManagementAccount002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
            var PAGELIST = /*[[${PAGELIST}]]*/''; //
            var type6Str = /*[[${type6Str}]]*/''; //
            var type7Str = /*[[${type7Str}]]*/''; //
            var portfolioIdChange = /*[[${portfolioIdChange}]]*/''; //
            var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
            var sysDate = /*[[${sysDate}]]*/'';
            var entrustId=/*[[${entity?.entrustId}]]*/'';
            var workflowId=/*[[${entity?.workflowId}]]*/'';
            var operateType=/*[[${entity?.operateType}]]*/'';
        </script>
        <script data-th-src="@{/js/component/common/util.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/component/common/TradeCommon.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/invest/entrust/etrautomanagementaccount/EtrAutoManagementAccount002.js}"></script>
        <script data-th-src="@{/js/component/autocoupon/AutoCoupon.js}" type="text/javascript"></script>
    </div>
</body>
</html>
