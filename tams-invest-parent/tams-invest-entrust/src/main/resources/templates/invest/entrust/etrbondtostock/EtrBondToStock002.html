<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{EtrBondToStock002}">债转股委托新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="pro-module-container">
            <form class="layui-form joyin-form-wrap pro-module-form" id="searchForm">
                <div class="pro-module-wrapper pro-module-base">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">基本信息</span>
                                （
                                <span class="star-sign">*</span>
                                必填）
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                         <input type="text" id="entrustId" name="entrustId" 
                        disabled="disabled" style="display:none;" data-th-value="${entity?.entrustId}">
                        <input type="text" id="entrustStatus" name="entrustStatus"
                        disabled="disabled" style="display:none;" data-th-value="${entity?.entrustStatus}">
                        <input type="hidden" id="calendarId" name="calendarId" th:value="${entity?.calendarId}">
                        <input type="hidden" id="ps" name="ps" th:value="${etrPs}">
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrBondToStock002.portfolioId}">组合代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption=true required="required"
                                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}"
                                                data-th-initvalue="${entity?.portfolioId}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrBondToStock002.vdate}">委托开始日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input class="layui-input form-input input-dateSelect" id="vdate"
                                                name="vdate" placeholder="请选择时间"
                                                data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'
                                                required="required">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrBondToStock002.mdate}">委托终止日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input class="layui-input form-input input-dateSelect" id="mdate"
                                                name="mdate" placeholder="请选择时间"
                                                data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
                                                required="required">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
	                                <div class="form-inline-wrap">
	                                        <label class="layui-form-label form-lable"
	                                            data-th-text="#{EtrBondToStock001.finprodId}">转债代码</label>
	                                        <div class="layui-input-inline input-inline">
	                                            <select type="text" id="finprodId" name="finprodId"
	                                                class="layui-input form-input input-select" allowClear="true"
	                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
	                                                required="required" formatoption="true"
	                                                data-th-data-url="@{/invest/entrust/etrbondtostock/EtrBondToStock002/getFinprodIdForAdd}"
	                                                data-th-initvalue="${entity?.finprodId}">
	                                            </select>
	                                        </div>
	                                    </div>
	                                    <div class="form-inline-wrap">
	                                        <label class="layui-form-label form-lable"
	                                            data-th-text="#{EtrBondToStock001.finprodName}">转债名称</label>
	                                        <div class="layui-input-inline input-inline">
	                                             <input type="text" id="finprodName" name="finprodName"
                                                class="layui-input form-input" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.finprodName}" disabled="disabled">	 
	                                        </div>
	                                    </div>
	                                    <div class="form-inline-wrap">
	                                        <label class="layui-form-label form-lable"
	                                            data-th-text="#{EtrBondToStock002.tradeMarket}">交易场所</label>
	                                        <div class="layui-input-inline input-inline">
	                                            <select type="text" id="tradeMarket" name="tradeMarket"
	                                                class="layui-input form-input input-select" placeholder="请输入内容"
	                                                data-th-placeholder="#{SysCommon.placeholder}"
	                                                data-th-data-result="${TRADE_PLACE}" disabled="disabled"
	                                                data-th-initvalue="${entity?.tradeMarket}" >
	                                            </select>
	                                        </div>
	                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
	                                        <label class="layui-form-label form-lable"
	                                            data-th-text="#{EtrBondToStock001.shareId}">正股代码</label>
	                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="shareId" name="shareId"
                                                class="layui-input form-input" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.shareId}" disabled="disabled">
                                                <input type="hidden" id="shareFinprodId" name="shareFinprodId"
                                                class="layui-input form-input" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.shareFinprodId}" disabled="disabled">	 	                                            	
	                                        </div>
	                                    </div>
	                                    <div class="form-inline-wrap">
	                                        <label class="layui-form-label form-lable"
	                                            data-th-text="#{EtrBondToStock001.shareName}">正股名称</label>
	                                        <div class="layui-input-inline input-inline">
	                                           	<input type="text" id="shareName" name="shareName"
                                                	class="layui-input form-input" placeholder="请输入内容"
                                                	data-th-placeholder="#{SysCommon.placeholder}"
                                                	data-th-value="${entity?.shareName}" disabled="disabled">
	                                        </div>
	                                    </div>
	                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrBondToStock002.conShareId}">转股代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="conShareId" name="conShareId"
                                                class="layui-input form-input" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.conShareId}" disabled="disabled">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrBondToStock001.holdetrPriceTotal}">持有券面总额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="holdetrPriceTotal" name="holdetrPriceTotal"
                                                class="layui-input form-input" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.holdetrPriceTotal}" disabled="disabled">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrBondToStock001.conetrPriceTotal}">可转换券面总额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="conetrPriceTotal" name="conetrPriceTotal"
                                                class="layui-input form-input" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.conetrPriceTotal}" disabled="disabled">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrBondToStock002.stocketrPriceTotal}">转股券面总额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="stocketrPriceTotal" name="stocketrPriceTotal"
                                                class="layui-input form-input text-number" placeholder="请输入内容"  value="10000000000" data-textrange="0"
                                                data-th-placeholder="#{SysCommon.placeholder}" required="required"
                                                data-th-value="${entity?.stocketrPriceTotal}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrBondToStock001.conVdate}">转股起始日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input class="layui-input form-input input-dateSelect" id="conVdate"
                                                name="conVdate" placeholder="请选择时间" disabled="disabled"
                                                data-th-value='${#dates.format(entity?.conVdate,"yyyy-MM-dd")}'
                                                >
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrBondToStock002.conPrice}">转股价格</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="conPrice" name="conPrice"
                                                class="layui-input form-input" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.conPrice}" disabled="disabled">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrBondToStock002.expConNum}">预计转换股数</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="expConNum" name="expConNum"
                                                class="layui-input form-input" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.expConNum}" disabled="disabled">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrBondToStock001.sharePrice}">正股价</label>
                                        <div class="layui-input-inline input-inline">
                                              <input type="text" id="sharePrice" name="sharePrice"  
                                                class="layui-input form-input" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.sharePrice}" disabled="disabled">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrBondToStock002.expConValue}">预计转股价值</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="expConValue" name="expConValue"
                                                class="layui-input form-input" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.expConValue}" disabled="disabled">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                       <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrBondToStock001.preb}">转股溢价率</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="preb" name="preb"  
                                                class="layui-input form-input" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.preb}" disabled="disabled">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrBondToStock001.prec}">纯债溢价率</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="prec" name="prec"
                                                class="layui-input form-input" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.prec}" disabled="disabled">
                                        </div>
                                    </div>
	                            	<div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrInvestBondInfo002.invAim}">投资目的</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="invAim" name="invAim"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${INV_AIM}' allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                required="required" formatoption="true"
                                                data-th-initValue="${entity?.invAim}">
                                        </select>
                                    </div>
                                </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrBondToStock002.ccy}">币种</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="ccy" name="ccy"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                required="required" data-th-data-result='${CCY}' disabled="disabled"
                                                data-th-initvalue="${entity?.ccy}"> 
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{EtrStock002.secAcctId}">证券托管户</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="secAcctId" name="secAcctId" parentIds="tradeMarket,finprodId"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"  th:data-url="@{/invest/trade/bond/TrdBondInvestTrade002/getSecManageAcctId}"
                                                allowClear="true" th:initValue="${entity?.secAcctId}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{invest.channelId}">通道</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="chlId" name="chlId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true"
                                                data-th-data-url="@{/component/trade/BussChannelCommon/getChannelIdAndCollectType}"
                                                data-th-initvalue="${entity?.chlId}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            </div>
                        </div>
                    </div>
                    <!-- 引业务组件投资委托人员信息组件 -->
                    <div class="page-component" th:data-path="@{/component/trade/BussEtrInvestPersonInfo/init}"
                        th:data-params="|{entityName: 'etrInvestPersonInfo',entity:'${person_entity}', innerTrade: false}|"></div>
                    <div id="ramark_DIV" class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">备注</span>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <label class="layui-form-label form-lable" style="width: 11.9%;">备注</label>
                                    <div class="layui-input-inline input-inline" style="width: 85% !important;">
                                        <textarea id="remark" name="remark" placeholder="请输入内容"
                                            data-th-placeholder="#{SysCommon.placeholder}" class="layui-textarea"
                                            data-th-text="${entity?.remark}"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- 引业务组件附件信息组件 -->
                    <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                        th:data-params="|{entityName: 'FileCommon',businessId: '${businessId ?: ''}'}|"></div>
                   <!-- 风险试算 -->
                    <div th:if="${isEleShow['EtrBondToStock002_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component"
                        th:data-path="@{/component/common/BaseRiskMathComm/init}"
                        th:data-params="|{entity: '${riskTrialRetDto}',workflowId: '${workflowId}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>
                </div>
                <div class="pro-module-wrapper pro-module-block">
                    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                        <div class="text-center">
                            <a th:if="${isEleShow['EtrBondToStock002_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'"
                               id="EtrBondToStock002_btn_riskcal" class="layui-btn layui-btn-sm"
                                data-th-text="#{EtrBondToStock002.riskcal}">风险试算</a>
                            <a id="EtrBondToStock002_btn_save" class="layui-btn layui-btn-sm btn-save"
                                data-th-text="#{SysCommon.save}">保存</a>
                            <a id="EtrBondToStock002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                                data-th-text="#{SysCommon.submit}">提交</a>
                            <a id="EtrBondToStock002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                                data-th-text="#{SysCommon.cancel}">取消</a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div layout:fragment="script">
        <script th:inline="javascript" type="text/javascript">
            var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
            var etrPs = /*[[${etrPs}]]*/'';
            var fintype = /*[[${fintype}]]*/'';
            var PA_TYPE_ZZG = /*[[${PA_TYPE_ZZG}]]*/'';
            var PS_ZQMC = /*[[${PS_ZQMC}]]*/'';
            var PA_TYPE_ZQMC = /*[[${PA_TYPE_ZQMC}]]*/'';
            var sysDate = /*[[${sysDate}]]*/'';
            var payType = /*[[${payType}]]*/'';
            var cash = /*[[${cash}]]*/'';
            var PRICEMODEL_03 = /*[[${PRICEMODEL_03}]]*/'PRM03';
            var MODEL_SHOW =  /*[[${MODEL_SHOW}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/entrust/etrbondtostock/EtrBondToStock002.js?}" type="text/javascript"></script>
    </div>
</body>
</html>
