<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title data-th-text="#{EtrProjectNet003}">权益类资产多对多指令新建</title>
</head>
<body>
<div layout:fragment="content">
    <div>
        <form class="layui-form joyin-form-wrap pro-module-form" id="searchForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <div class="pro-module-item">
                            <!-- 指令列表 -->
                            <div id="combDistribt_div" class="pro-module-wrap">
                                <div class="pro-module">
                                    <h3 class="pro-module-title">
                                        <span class="title-des">指令列表</span>
                                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                                    </h3>
                                    <div class="pro-module-item">
                                        <div id="combDistribt">
                                            <table class="layui-table" id="dataTable" name="selectedItem"></table>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
                <!-- 风险试算 -->
                <div id="baseRiskMathComm" class="page-component" th:data-path=
                        "@{/component/common/BaseRiskMathComm/init}" th:data-params="|{workflowId: '${workflowId}',
                        entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>
                <!-- 按钮 -->
                <div class="pro-module-block">
                    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                        <div class="text-center">
                            <a id="EtrProjectNet003_btn_riskcal" class="layui-btn layui-btn-sm"
                               data-th-text="#{EtrProjectNet002.riskcal}">风险试算</a>
                            <a id="EtrProjectNet003_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                               data-th-text="#{SysCommon.submit}">提交</a>
                            <a id="EtrProjectNet003_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                               data-th-text="#{SysCommon.cancel}">取消</a>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var T04 = /*[[${T04}]]*/'';
        var T06 = /*[[${T06}]]*/'';
        var T01 = /*[[${T01}]]*/'';
        var T02 = /*[[${T02}]]*/'';
        var C01 = /*[[${C01}]]*/'';
        var C02 = /*[[${C02}]]*/'';
        var C03 = /*[[${C03}]]*/'';
        var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
        var sysDate = /*[[${sysDate}]]*/'';
        var fintype = /*[[${fintype}]]*/'';
        var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
        var C04 = /*[[${C04}]]*/'';
        var PS = /*[[${PS}]]*/'';
        var CCY = /*[[${CCY}]]*/'CNY';
        var CCY_default = /*[[${CCY_default}]]*/'';
        var PLAN_ASSET_TYPE = /*[[${PLAN_ASSET_TYPE}]]*/'';
        var etrPlanAssetNDtoList =/*[[${etrPlanAssetNDtoList}]]*/'';
        var CUSTOM_ASSET_TYPE_TWO =/*[[${CUSTOM_ASSET_TYPE_TWO}]]*/'';
        var CUSTOM_ASSET_TYPE_THREE =/*[[${CUSTOM_ASSET_TYPE_THREE}]]*/'';
        var CUSTOM_ASSET_TYPE_FOUR =/*[[${CUSTOM_ASSET_TYPE_FOUR}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/asset/channel/ChannelAssetCommon.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/invest/entrust/etrprojectnet/EtrProjectNet003.js}" type="text/javascript"></script>
</div>
</body>
</html>
