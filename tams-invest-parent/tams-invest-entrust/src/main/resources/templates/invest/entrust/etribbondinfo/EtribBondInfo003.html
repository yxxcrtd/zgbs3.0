<!DOCTYPE html>
<html style="height:80%;" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.w3.org/1999/xhtml"
      layout:decorator="~{layout/default}">
<meta charset="UTF-8">
<head>
    <title data-th-text="#{EtribBondInfo003}">银行间债券指令多组合指令新建</title>
</head>
<body>
<div layout:fragment="content" id="EtribBondInfo003_bodydiv">
	<style type="text/css">
		        .layui-form-radio {
		            line-height: 24px;
		            padding-right: 0px;
		            margin: 0px;
		        }
		        .layui-form-radio div {
		            font-size: 12px;
		        }
		        .layui-form-radio i{
		            font-size: 14px;
		        }
                .label-deviation-degree{
                    width: 50px;
                    height: 24px;
                    color: red;
                    top: 0;
                    right: 0;
                    position: absolute;
                    text-align: center;
                    line-height: 24px;
                }
	</style>
    <div class="joyin-form-wrap">
        <form class="layui-form pro-module-form" id="searchForm">
            <input type="hidden" id="finprodIdhid" name="finprodId" th:value="${entity?.finprodId}">
            <input type="hidden" id="ccy" name="ccy" th:value="${entity?.ccy}">
            <input type="hidden" id="businessId" name="businessId" th:value="${businessId?: ''}">
            <input type="hidden" id="invManagerId" name="invManagerId" th:value="${entity?.invManagerId}">
            <input type="hidden" id="tradeMarketMode" name="tradeMarketMode" th:value="${entity?.tradeMarketMode}">
            <!--交易市场-银行间-->
            <input type="hidden" id="tradeMarket" name="tradeMarket" th:value="${entity?.tradeMarket}" />
            <!--                    交易日历-->
            <input type="hidden" id="calendarId" name="calendarId" th:value="${entity?.calendarId}">
            <input type="hidden" id="finvdate" name="finvdate">
            <input type="hidden" id="finmdate" name="finmdate">
            <input type="hidden" id="secAcctId" name="secAcctId" th:value="${entity?.secAcctId}">
            <input type="hidden" id="isRight" name="isRight">
            <input type="hidden" id="profitType" name="profitType">
            <input type="text" id="entrustId" name="entrustId" disabled="disabled" style="display:none;"
                   data-th-value="${entity?.entrustId}"/>
            <input type="text" id="entrustStatus" name="entrustId" disabled="disabled" style="display:none;"
                   data-th-value="${entity?.entrustStatus}"/>

            <div class="layui-form-item" >
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-lable" style="width: 105px;"
                           data-th-text="#{EtribBondInfo003.portfolioName}">组合系列</label>
                    <div class="layui-input-inline input-inline">
                        <select id="portfolioSeries" name="portfolioSeries"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                required data-th-data-result="${PORTFOLIO_SERIES}"
                                data-th-initvalue="${entity?.portfolioSeries}">
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-lable" style="width: 105px;"
                           data-th-text="#{EtribBondInfo003.finprodName}">资产简称</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="finprodId" name="finprodMarketId"
                                class="layui-input form-input input-select" allowClear="true"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                required="required"
                                data-th-data-url="@{/invest/entrust/etribbondinfo/EtrIbBondinfo002/getfinprodIdForAdd}"
                                data-th-initvalue="${entity?.finprodMarketId}">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item" >
               <!-- <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-lable" style="width: 105px;"
                           data-th-text="#{EtribBondInfo003.portfolioName}">组合系列</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="portfolioId_jj" name="portfolioId"
                                class="layui-input form-input input-select"
                                th:placeholder="#{SysCommon.placeholder}"
                                placeholder="请输入内容"
                                disabled="disabled"
                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}"
                                allowClear="true" formatoption="true" th:initValue="${entity?.portfolioId}"
                                required>
                        </select>
                    </div>
                </div> -->

                
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-lable" style="width: 105px;"
                           data-th-text="#{EtribBondInfo003.ps}">交易方向</label>
                    <div class="layui-input-inline input-inline">
                        <select required type="text" id="ps" name="ps" allowClear="true"
                                class="layui-input form-input input-select" data-th-data-result='${PS}'
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                formatoption="true" data-th-initvalue="${entity?.ps}">
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-lable" style="width: 105px;"
                           data-th-text="#{EtribBondInfo003.tradeAmt}">劵面总额</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="tradeAmt" name="tradeAmt" placeholder="请输入内容"
                               data-pattern="" data-fixtype="2" data-textrange='2'
                               class="layui-input form-input text-number"
                               data-th-value="${entity?.tradeAmt}">
                        <span class="input-right-show">万元</span>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">    
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-lable" style="width: 105px;"
                           data-th-text="#{EtribBondInfo003.settleSpeed}">清算速度</label>
                    <div class="layui-input-inline input-inline">
                        <select required type="text" id="settleSpeed" name="settleSpeed" allowClear="true"
                                class="layui-input form-input input-select"
                                data-th-data-result='${ACCOUNT_SPEED}'
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                formatoption="true" data-th-initvalue="${entity?.settleSpeed}">
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" style="width: 105px;"
                           th:text="#{EtribBondInfo003.priceModel}">价格模式</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="priceModel" name="priceModel" required
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                th:placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${PRICE_MODEL}'
                                allowClear="true" th:initValue="${entity?.priceModel}"></select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <!-- <label class="layui-form-label form-lable" style="width: 105px;"
                           data-th-text="#{EtribBondInfo003.price}">净价</label> -->
                    <label class="layui-form-label form-lable" style="width: 105px;">
                                <input type="radio" id="calculateField_price" name="calculateField" value="price" th:title="#{EtribBondInfo003.price}" />
                    </label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="price" name="price" placeholder="请输入内容"
                               data-pattern="" data-fixtype="2" data-textrange='4' required
                               class="layui-input form-input text-number"
                               data-th-value="${entity?.price}">
                        <label class="label-deviation-degree" id="deviationDegree"></label>
                    </div>
                </div>
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-lable" style="width: 105px;"
                           data-th-text="#{EtribBondInfo003.fpriceAmt}">全价</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="fpriceAmt" name="fpriceAmt" placeholder="请输入内容"
                               data-pattern="" data-fixtype="2" data-textrange='4'
                               class="layui-input form-input text-number" disabled="disabled"
                               data-th-value="${entity?.fpriceAmt}">
                        <span class="input-right-show">元</span>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <!-- <label class="layui-form-label form-lable" style="width: 105px;"
                           data-th-text="#{EtribBondInfo003.matureYield}">到期收益率(%)</label> -->
                    <label class="layui-form-label form-lable" style="width: 105px;">
                        <input type="radio" id="calculateField_matureYield" name="calculateField" value="matureYield" th:title="#{EtrIbBondinfo002.matureYield}" />
                    </label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="matureYield" name="matureYield" placeholder="请输入内容"
                               data-pattern="" data-fixtype="2" data-textrange="4"
                               class="layui-input form-input text-number"
                               data-th-value="${entity?.matureYield}">
                        <span class="input-right-show">%</span>
                    </div>
                </div>
                <div id="div_counterId1" class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-lable" style="width: 105px;"
                           data-th-utext="#{EtribBondInfo003.counterId}">交易对手</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <select type="text" id="counterId1" name="counterId1"
                                class="layui-input form-input input-select"
                                th:placeholder="#{SysCommon.placeholder}" placeholder="请输入内容"
                                th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/queryCounterSideList}" allowClear="true"
                                formatoption="true"
                                th:initValue="${entity?.counterId}">
                        </select>
                    </div>
                </div>
                <div id="div_counterId2" class="form-inline-wrap" style=" width: 50%; padding:0px;display: none">
                    <label class="layui-form-label form-lable" style="width: 105px;"
                           data-th-utext="#{EtribBondInfo003.counterId}">交易对手</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <select id="counterId2" name="counterId2"
                                class="layui-input form-input input-select"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                formatoption="false"
                                parentIds="ps,finprodType2,profitType,tradeMarket,finprodId,pinanAssetType"
                                data-th-data-url="|@{/component/trade/BussEtrInvestPersonInfo/getCounterId}|">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;" id="exerYieldDiv">
                    <label class="layui-form-label form-lable" style="width: 105px;">
                                <input type="radio" id="calculateField_exerYield" name="calculateField" value="exerYield" th:title="#{EtrIbBondinfo002.exerYield}" />
                    </label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="exerYield" name="exerYield" placeholder="请输入内容"
                               data-pattern="" data-fixtype="2" data-textrange="4"
                               class="layui-input form-input text-number" disabled
                               data-th-value="${entity?.exerYield}">
                        <span class="input-right-show">%</span>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-lable" style="width: 105px;"
                           data-th-text="#{EtribBondInfo003.vdate}">指令开始日</label>
                    <div class="layui-input-inline input-inline">
                        <input class="layui-input form-input input-dateSelect" id="vdate"
                               name="vdate" placeholder="请选择时间"
                               data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'
                               required="required" disabled="disabled">
                    </div>
                </div>
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-lable" style="width: 105px;"
                           data-th-text="#{EtribBondInfo003.mdate}">指令终止日</label>
                    <div class="layui-input-inline input-inline">
                        <input class="layui-input form-input input-dateSelect" id="mdate"
                               name="mdate" placeholder="请选择时间"
                               data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
                               required="required" disabled="disabled">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 100%; padding:0px;">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{EtribBondInfo003.remark}" style="width: 105px;">备注</label>
                    <div class="layui-input-inline" style="width: 80%; margin: 0px; margin-left: auto;">
                        <textarea id="remark" name="remark" th:value="${entity?.remark}"
                                  data-th-text="${entity?.remark}" class="layui-textarea"
                                  placeholder="请输入内容"
                                  data-th-placeholder="#{SysCommon.placeholder}"></textarea>
                    </div>
                </div>
            </div>

            <div id="combDistribt_div" class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="title-des">组合分配</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        <a onclick="$('.btn-table-add').click()" style="cursor: pointer;color: #0078F0;"><i class="iconfont icon-found"></i></a>
                    </h3>

                    <div class="layui-form-item">
                        <div class="form-inline-wrap" style="padding:0px;">
                            <label class="layui-form-label form-lable" style="width: 170px;">剩余可分配券面总额(万元)</label>
                            <div class="layui-input-inline input-inline">
                                <input disabled type="text" id="restTradeAmt" name="restTradeAmt" placeholder="请输入内容"
                                       data-pattern="" data-fixtype="2" data-textrange='2'
                                       class="layui-input form-input text-number"
                                       data-th-value="${entity?.restTradeAmt}">
                            </div>
                        </div>
                    </div>

                    <div class="pro-module-item">
                        <div id="combDistribt">
                            <table class="layui-table" id="bussCombDistribtTable"
                                   name="bussCombDistribtList"></table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                <div class="text-center">
                    <a id="EtribBondInfo003_btn_fileupload" class="layui-btn layui-btn-sm"
                       data-th-text="#{EtribBondInfo003.fileUpload}">附件上传</a>
                    <a id="EtribBondInfo003_btn_riskcal" class="layui-btn layui-btn-sm"
                       data-th-text="#{EtribBondInfo003.riskcal}">风险试算</a>
                    <a id="EtribBondInfo003_btn_save" class="layui-btn layui-btn-sm btn-save" style="display: none;"
                       data-th-text="#{SysCommon.save}">保存</a>
                    <a id="EtribBondInfo003_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                       style="display: none;"
                       data-th-text="#{SysCommon.submit}">提交</a>
                    <!--                     <a id="EtribBondInfo003_btn_reset" class="layui-btn layui-btn-sm  btn-reset" -->
                    <!--                        data-th-text="#{SysCommon.reset}">重置</a> -->
                </div>
                <div id="baseRiskMathComm" class="page-component" style="display: none;"
                     th:data-path="@{/component/common/BaseRiskMathComm/init}"
                     th:data-params="|{workflowId: '${workflowId}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>
                <div id="fileUpload" class="page-component" style="display: none;"
                     th:data-path="@{/component/core/FileCommon/init}"
                     th:data-params="|{entityName: 'FileCommon',businessId?: ''}|"></div>
            </div>

        </form>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var PRICEMODEL_03 = /*[[${PRICEMODEL_03}]]*/'PRM03';
        var PS_T01 = /*[[${PS_T01}]]*/'T01';
        var PS_T02 = /*[[${PS_T02}]]*/'T02';
        var PS_T03 = /*[[${PS_T03}]]*/'T03';
        var N = /*[[${N}]]*/ ''
        var Y = /*[[${Y}]]*/ ''
        var CCY = /*[[${CCY}]]*/ ''
        var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
        var fintype = /*[[${fintype}]]*/'';
        var sysDate = /*[[${sysDate}]]*/'';
        var entity_BussCombDistribtList = eval(/*[[${entity_BussCombDistribtList}]]*/'');
        var SHARES_TRADE_MARKET_02 = /*[[${SHARES_TRADE_MARKET_02}]]*/'';
        var INV_AIM = /*[[${INV_AIM}]]*/'';
        var todoList = /*[[${TodoList}]]*/'';
        var BUSINESS_MODEL = /*[[${BUSINESS_MODEL}]]*/'';
        var calculateField = /*[[${calculateField}]]*/ '';//计算方式
        //展示投资目的或业务模式参数
        // var SHOW_INVAIM_OR_BUSSINSSMODEL =  /*[[${SHOW_INVAIM_OR_BUSSINSSMODEL}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/entrust/etribbondinfo/EtribBondInfo003.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/component/autocoupon/AutoCoupon.js}" type="text/javascript"></script>
</div>
</body>
