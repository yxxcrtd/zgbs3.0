<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorator="~{layout/default}">
<head>
    <style type="text/css">
        .layui-form-item .layui-input-inline {
            float: left;
            left: 4px;
            margin: 0 0 0 0;
        }

        .layui-form-label {
            padding: 5px 2px !important;
        }

        .layui-inline layui-input-inline {
            padding: 0px 5px ;
        }

        .layui-form-item {
            padding-top: 2px;
            margin-bottom: 0;
            clear: both;
        }

        .select2-container .select2-selection--single {
            height: 26px;
        }

        .layui-tab-title {
            height: 28px;
        }

        .form-input {
            height: 26px;
        }

        .layui-fluid {
            padding: 0px 3px;
        }

        .layui-btn+.layui-btn {
            margin-left: 2px;
        }

        .layui-btn-sm {
            height: 24px;
            line-height: 24px;
        }

        .layui-btn-lock {
            float: right;
            margin-right: -20px;
        }

        .layui-form-radio {
            line-height: 24px;
            padding-right: 0px;
            margin: 0px;
        }
        .layui-form-radio div {
            font-size: 12px;
        }
        .layui-form-radio i{
            font-size: 14px;
        }

        .leftTopHide {
            display: none;
        }

        #seatId_div_dz ul.dropdown-menu {
            left: 0!important;
            width: 160px!important;
        }

        #counterOrg_div_gd ul.dropdown-menu {
            left: 0!important;
            width: 160px!important;
        }

        #counterTrader_div_gd ul.dropdown-menu {
            left: 0!important;
            width: 160px!important;
        }

        #trader_div_gd  ul.dropdown-menu {
            left: 0!important;
            width: 160px!important;
        }
        .label-deviation-degree{
            width: 50px;
            height: 24px;
            color: red;
            top: 0;
            right: -50px;
            position: absolute;
            text-align: center;
            line-height: 24px;
        }
        .price {
            width: -webkit-fill-available;
            /* position: absolute; */
            /* float: right; */
            height: 26px;
            margin-left: 0;
            margin-top: 0px;
            padding-left: 26px;
        }
        .priceTitle {
            margin-right: 20px;
        }
        .decrease-button {
            position: absolute;
            margin-top: 0;
            margin-left: 2px;
            height: 22px;
            width: 22px;
            font-size: 16px;
            font-weight: bolder;
            color: #999999;
            background-color: #efefef;
            border-radius: 2px 0 0 2px;
            border: 1px solid #E6E6E6;
        }
        .increase-button:hover {
            color: #7d7d7d;
        }
        .decrease-button:hover {
            color: #7d7d7d;
        }
        .increase-button {
            /* position: absolute; */
            /* margin-left: 0px; */
            float: right;
            margin-top: -24px;
            margin-right: 2px;
            height: 22px;
            width: 22px;
            font-size: 16px;
            font-weight: bolder;
            color: #999999;
            background-color: #efefef;
            border-radius: 0 2px 2px 0;
            border: 1px solid #E6E6E6;
        }
        .tab-list-wrap .layui-form-item .layui-inline .input-inline{
            width: 190px!important;
        }
        @media screen and (min-width: 450px) and (max-width: 768px){
            .tab-list-wrap .layui-form-item .layui-inline {
                width: 49%;
            }
        }
        @media screen and (max-width: 450px){
            .tab-list-wrap .layui-form-item .layui-inline {
                width: 100% !important;
            }
            .tab-list-wrap .layui-form-item .layui-form-label{
                width: 60px;
            }
        }
        @media screen and (min-width: 768px){
            .tab-list-wrap .layui-form-item .layui-inline {
                width: 33% !important;
            }.layui-form-label{
                 width: 120px;
             }
        }
    </style>
</head>
