<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
<title data-th-text="#{EtrPlanAssetR001}">计划类利率委托</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area">
            <a id="EtrPlanAssetR001_btn_add" class="layui-btn layui-btn-sm btn-create"
                data-th-text="#{SysCommon.create}">新建</a>
            <!-- add by zhangpuyu 2020/1/2 start  -->
            <a id="EtrPlanAssetR001_btn_import" class="layui-btn layui-btn-sm btn-import">
                <i class="iconfont icon-import"></i><span data-th-text="#{EtrPlanAssetR001.import}"></span></a>
            <!-- add by zhangpuyu 2020/1/2 end  -->
            <a id="EtrPlanAssetR001_btn_close" class="layui-btn layui-btn-sm" ><i class="iconfont icon-close"></i><span data-th-text="#{SysCommon.close}"></a>
            <a id="EtrPlanAssetR001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke"><i class="iconfont icon-revoke"></i><span data-th-text="#{ETR_REVERT}"></a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area ">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrPlanAssetR001.portfolioId}">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption=true multiple="true"
                                                data-th-data-url="@{/invest/entrust/etrplanassetr/EtrPlanAssetR002/getentrustIdAdd}"
                                                data-th-initvalue="${entity?.portfolioId}">
                                            </select>
                        </div>
                    </div>
                    <!--增加2，3,4分类、zhuyongkang 2019/7/29  start -->
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrPlanAssetR001.assetType1}">二级分类</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="assetType1" name="assetType1"
                                class="layui-input form-input input-select" data-th-data-result='${CUSTOM_ASSET_TYPE_TWO}'
                                allowClear="true" multiple="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" formatoption = "true">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrPlanAssetR001.assetType10}">三級分類</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="assetType10" name="assetType10"
                                    class="layui-input form-input input-select" data-th-data-result='${CUSTOM_ASSET_TYPE_THREE}'
                                    allowClear="true" multiple="true" placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}" formatoption = "true">
                            </select>
                        </div>
                    </div>
               </div>
                  <div class="layui-form-item">
                      <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4" style="display: none" id = "assetType11Div">
                          <label class="layui-form-label form-lable" data-th-text="#{EtrPlanAssetR001.assetType11}">四級分類</label>
                          <div class="layui-input-inline input-inline">
                              <select type="text" id="assetType11" name="assetType11"
                                      class="layui-input form-input input-select" data-th-data-result='${CUSTOM_ASSET_TYPE_FOUR}'
                                      allowClear="true" multiple="true" placeholder="请输入内容"
                                      data-th-placeholder="#{SysCommon.placeholder}" formatoption = "true">
                              </select>
                          </div>
                      </div>
                      <!--原因、zhuyongkang 2019/7/29   end-->
                      <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                          <label class="layui-form-label form-lable" data-th-text="#{EtrPlanAssetR001.entrustStatus}">委托状态</label>
                          <div class="layui-input-inline input-inline">
                              <select type="text" id="entrustStatus" name="entrustStatus"
                                      class="layui-input form-input input-select" data-th-data-result='${ENTRUST_STATUS}'
                                      allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" formatoption = "true">
                              </select>
                          </div>
                      </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrPlanAssetR001.ccy}">币种</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="ccy" name="ccy" class="layui-input form-input input-select"
                                data-th-data-result='${CCY}' th:initValue="${CCY_default}" allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" formatoption = "true">
                            </select>
                        </div>
                    </div>
                    </div>
                 <div class="layui-form-item">
                     <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                         <label class="layui-form-label form-lable" data-th-text="#{EtrPlanAssetR001.finprodId}">资产代码</label>
                         <div class="layui-input-inline input-inline">
                             <input type="text" id="finprodMarketId" name="finprodId" class="layui-input form-input input-lenovoselect"
                                    data-th-data-result='${finProdId}' allowClear="true" placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}" formatoption = "true" data-idfield="code"
                                    data-keyfield="name"
                                    data-th-data-effectivefieldsalias='|{"code":"#{EtrPlanAssetR001.finprodId}",
                                    "shortName":"#{EtrPlanAssetR001.finprodName}"}|'
                                    data-th-data-url="@{/invest/entrust/etrplanassetr/EtrPlanAssetR001/getfinprodId}"/>
                         </div>
                     </div>
                     <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                         <label class="layui-form-label form-lable" data-th-text="#{EtrPlanAssetR001.ps}">交易方向</label>
                         <div class="layui-input-inline input-inline">
                             <select type="text" id="ps" name="ps" class="layui-input form-input input-select"
                                     data-th-data-result='${PS}' allowClear="true" placeholder="请输入内容"
                                     data-th-placeholder="#{SysCommon.placeholder}" formatoption="true">
                             </select>
                         </div>
                     </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrPlanAssetR001.entrustDate}">委托日期</label>
                        <div class="layui-input-inline input-inline">
                            <input id='entrustDate' name='entrustDate'
                                class="layui-input form-input input-dateRangeSelect" placeholder="请选择支持区间"
                                data-th-placeholder="#{SysCommon.dateInterval}">
                        </div>
                    </div>
                    </div>
             
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
    	<script data-th-inline="javascript" type="text/javascript">
    		var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
    	</script>
        <script data-th-src="@{/js/invest/entrust/etrplanassetr/EtrPlanAssetR001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
