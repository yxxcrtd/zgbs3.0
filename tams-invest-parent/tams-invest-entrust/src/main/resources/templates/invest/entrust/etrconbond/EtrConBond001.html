<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{EtrConBond001.search}">可转债委托</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area" >
            <a class="layui-btn layui-btn-sm btn-create" id="EtrConBond001_btn_add"
            data-th-text="#{SysCommon.create}">新建</a>
            <a id="EtrConBond001_btn_import" class="layui-btn layui-btn-sm btn-import"
            data-th-text="#{EtrConBond001.import}">导入</a>
            <a class="layui-btn layui-btn-sm btn-revoke" id="EtrConBond001_btn_revoke">
                <i class="iconfont icon-revoke"></i>
                <span data-th-text="#{EtrConBond001.revoke}"></span>
           </a>
            <a class="layui-btn layui-btn-sm btn-close" id="EtrConBond001_btn_close">
                <i class="iconfont icon-close"></i>
                <span data-th-text="#{SysCommon.close}"></span></a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
            <form class="layui-form"  id="searchForm" >
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrInvestAllInfo001.portfolioId}">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId}"
                                                formatoption=true multiple="true">
                                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrInvestAllInfo001.finprodId}">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="finprodId" name="finprodId"
                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-url="@{/invest/entrust/etrconbond/EtrConBond001/getFinprodId}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{EtrBondFirstLBidding001.TradeMarket}">交易场所</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="tradeMarket" name="tradeMarket"
                                    class="layui-input form-input input-select" data-th-data-result='${TRADE_PLACE}'
                                    allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    formatoption="true" ></select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div id="EtrPurchModle" class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{EtrConBond001.purchModle}">申购方式</label>
                        <div class="layui-input-inline input-inline">
                            <select class="layui-input form-input input-select" data-th-data-result='${PURCH_MODLE}'
                                    id="purchModle" name="purchModle" allowClear="true"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    formatoption="true">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{EtrConBond001.purchType}">申购类型</label>
                        <div class="layui-input-inline input-inline">
                            <select class="layui-input form-input input-select" data-th-data-result='${PURCH_TYPE}'
                                    id="purchType" name="purchType" allowClear="true"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    formatoption="true">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable" 
                        data-th-text="#{EtrInvestAllInfo001.entrustStatus}">有效状态</label>
                        <div class="layui-input-inline input-inline">
                            <select class="layui-input form-input input-select" data-th-data-result='${ENTRUST_STATUS}'
                            id="entrustStatus" name="entrustStatus" allowClear="true"
                            placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                            formatoption="true">
                            </select>
                        </div>
                    </div>

                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">指令日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="entrustDate" name="entrustDate"
                            class="layui-input form-input input-dateRangeSelect" 
                            placeholder="请选择、支持区间">
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="ptl-table">
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/entrust/etrconbond/EtrConBond001.js}" type="text/javascript"></script>
</div>
</body>

</html>
