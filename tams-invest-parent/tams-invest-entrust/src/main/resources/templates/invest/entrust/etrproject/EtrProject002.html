<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{EtrProject002}">项目类委托新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="pro-module-container">
            <form class="layui-form joyin-form-wrap pro-module-form" id="searchForm">
                <div class="pro-module-wrapper pro-module-base">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <input type="hidden" id="finprodIdhid" name="finprodId" th:value="${entity?.finprodId}">
                            <input type="hidden" id="calendarId" name="calendarId" th:value="${entity?.calendarId}">
                            <input type="hidden" id="finvdate" name="finvdate" >
                            <input type="hidden" id="finmdate" name="finmdate" >
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrProject002.portfolioId}">组合代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption=true required="required"
                                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}"
                                                data-th-initvalue="${entity?.portfolioId}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrProject002.vdate}">指令开始日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input class="layui-input form-input input-dateSelect" id="vdate"
                                                name="vdate" placeholder="请选择时间" disabled="disabled"
                                                data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'
                                                required="required">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrProject002.mdate}">指令终止日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input class="layui-input form-input input-dateSelect" id="mdate"
                                                name="mdate" placeholder="请选择时间" disabled="disabled"
                                                data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
                                                required="required">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrProject002.finprodName}">资产代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <div style="width: 80%">
                                                <!-- 项目类资产五级分类改造 modify by renping 2019-08-01 start -->
                                                <select type="text" id="finprodId" name="finprodMarketId"
                                                        class="layui-input form-input input-select" allowClear="true"
                                                        placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                        required="required"
                                                        data-th-data-url="@{/invest/entrust/etrproject/EtrProject002/getfinprodIdForAdd}"
                                                        data-th-initvalue="${entity?.finprodMarketId}">
                                                </select>
                                                <!-- 项目类资产五级分类改造 modify by renping 2019-08-01 end -->
                                            </div>
                                            <div style="width: 20%">
                                                <a id="EtrProject002_btn_search" class="layui-btn layui-btn-sm form-input-text">查看</a>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrProject002.finprodId}">资产名称</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="finprodName" name="finprodName"
                                                class="layui-input form-input" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.finprodName}" disabled="disabled">
                                        </div>
                                    </div>
                                    <div style="display: none" class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrProject002.assetType1}">资产类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="assetType1" name="assetType1"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${ASSET_TYPE_PROJECT}' allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                required="required" disabled="disabled"
                                                data-th-initvalue="${entity?.assetType1}">
                                            </select>
                                        </div>
                                    </div>
                                     <!-- 项目类资产五级分类改造 add by renping 2019-08-01 start -->
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrProject002.type9}">资产二级分类</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="type9" name="type9"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${CUSTOM_ASSET_TYPE_TWO}' allowClear="true"
                                                disabled="disabled"
                                                data-th-initvalue="${entity?.type9}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrProject002.type10}">资产三级分类</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="type10" name="type10"
                                                class="layui-input form-input input-select"
                                                data-th-data-result="${CUSTOM_ASSET_TYPE_THREE}" allowClear="true"
                                                 disabled="disabled"
                                                data-th-initvalue="${entity?.type10}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4" style="display: none" id = "assetType11Div">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrProject002.type11}">资产四级分类</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="type11" name="type11"
                                                class="layui-input form-input input-select"
                                                data-th-data-result="${CUSTOM_ASSET_TYPE_FOUR}" allowClear="true"
                                                 disabled="disabled"
                                                data-th-initvalue="${entity?.type11}">
                                            </select>
                                        </div>
                                    </div>
                                    <!-- 项目类资产五级分类改造 add by renping 2019-08-01 start -->
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrProject002.ccy}">币种</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="ccy" name="ccy"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                required="required"
                                                data-th-data-result='${CCY}'
                                                data-th-initvalue="${entity?.ccy?:CCY_default}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrProject002.ps}">交易方向</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="ps" name="ps"
                                                class="layui-input form-input input-checkbox"
                                                data-th-data-result='${PS}' required="required"
                                                data-th-initvalue="${entity?.ps}">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrProject002.entrustAmt}">指令金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="entrustAmt" name="entrustAmt" placeholder="请输入内容"
                                                data-pattern="" data-fixtype="2" required="required"
                                                class="layui-input form-input text-number"
                                                data-th-value="${entity?.entrustAmt}">
                                                <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style="display: none">
                                    <label class="layui-form-label form-lable" data-th-text="#{invest.channelId}">通道</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="chlId" name="chlId"
                                                    class="layui-input form-input input-select" allowClear="false"
                                                    data-th-placeholder="#{SysCommon.placeholder}" formatoption="true"
                                                    data-th-initvalue="${entity?.chlId}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item" th:id="div_channelCash" style="display: none;">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="|#{invest.channelId}#{EtrInvestBondInfo002.channelAvailableCash}|">通道可用现金</label>
                                        <div class="layui-input-inline input-inline">
                                            <input disabled type="text" th:id="|channelAvailableCash|" th:name="|channelAvailableCash|"
                                                   class="layui-input form-input text-number" />
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                	<!-- 投资目的 add by yzg 20201019 start-->
                                	<!--<div class="form-inline-wrap" id = "invAimDiv">
	                                    <label class="layui-form-label form-lable"
	                                           data-th-text="#{EtrInvestBondInfo002.invAim}">投资目的</label>
	                                    <div class="layui-input-inline input-inline">
	                                        <select type="text" id="invAim" name="invAim"
	                                                class="layui-input form-input input-select"
	                                                data-th-data-result='${INV_AIM}' allowClear="true"
	                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
	                                                required="required" formatoption="true"
	                                                data-th-initValue="${entity?.invAim}">
	                                        </select>
	                                    </div>
                                	</div>-->
                                    <!-- 投资目的 add by yzg 20201019 end-->
                                    <!-- 业务模式 add by gwl 2022/01/11 start-->
                                    <div class="form-inline-wrap" id = "businessModelDiv">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{EtrBondFirstLBidding002.businessModel}">业务模式</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="businessModel" name="invAim"
                                                    class="layui-input form-input input-select"
                                                    data-th-data-result='${BUSINESS_MODEL}' allowClear="true"
                                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                    required="required" formatoption="true"
                                                    data-th-initValue="${entity?.invAim}">
                                            </select>
                                        </div>
                                    </div>
                                    <!-- 业务模式 add by gwl 2022/01/11 end-->


                                    <div class="form-inline-wrap" style="display: none" id="proAvailableCash_div">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrProject002.proAvailableCash}">组合T日可用现金</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="proAvailableCash" name="proAvailableCash"
                                                placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                                class="layui-input form-input text-number" disabled="disabled"
                                                data-th-value="${entity?.proAvailableCash}" />
                                                <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style="display: none" id="proAvailableCash1_div">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrProject002.proAvailableCash1}">组合T+1日可用现金</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="proAvailableCash1" name="proAvailableCash1"
                                                placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                                class="layui-input form-input text-number" disabled="disabled" />
                                                <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style="display: none" id="accAvailableCash_div">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrProject002.accAvailableCash}">托管户剩余现金</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="accAvailableCash" name="accAvailableCash"
                                                placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                                class="layui-input form-input text-number" disabled="disabled"
                                                data-th-value="${entity?.accAvailableCash}" />
                                                <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" id="assetAvailablePosition_div" Style="display: none">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrProject002.assetAvailablePosition}">资产可用持仓</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="assetAvailablePosition" name="assetAvailablePosition"
                                                placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                                class="layui-input form-input text-number" disabled="disabled" />
                                                <span class="input-right-show"></span>
                                        </div>
                                    </div>
                                    <input type="text" id="entrustId" name="entrustId" disabled="disabled"
                                        style="display: none;" data-th-value="${entity?.entrustId}">
                                    <input type="text" id="entrustStatus" name="entrustId" disabled="disabled" style="display:none;" data-th-value="${entity?.entrustStatus}">
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- 引业务组件投资委托人员信息组件 -->
                    <div class="page-component" th:data-path="@{/component/trade/BussEtrInvestPersonInfo/init}"
                        th:data-params="|{entityName: 'etrInvestPersonInfo',entity:'${person_entity}', psId : 'ps'}|"></div>
                    <!--<div id="ramark_DIV" class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">备注</span>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                        <textarea id="remark" name="remark" placeholder="请输入内容"
                                                  data-th-placeholder="#{SysCommon.placeholder}" class="layui-textarea"
                                                  data-th-text="${entity?.remark}" maxlength="200"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>-->
                    <!-- 引业务组件附件信息组件 -->
                <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                        th:data-params="|{entityName: 'FileCommon',businessId: '${businessId ?: ''}'}|"></div>
                    <div id="ramark_DIV" class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">备注</span>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                        <textarea id="remark" name="remark" placeholder="请输入内容"
                                                  data-th-placeholder="#{SysCommon.placeholder}" class="layui-textarea"
                                                  data-th-text="${entity?.remark}" maxlength="200"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                <!-- 风险试算 -->
                <div th:if="${isEleShow['EtrProject002_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}" th:data-params="|{workflowId: '${workflowId}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>
                </div>
                <div class="pro-module-wrapper pro-module-block">
                    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                        <div class="text-center">
                            <a th:if="${isEleShow['EtrProject002_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'"
                               id="EtrProject002_btn_riskcal" class="layui-btn layui-btn-sm"
                                data-th-text="#{EtrProject002.riskcal}">风险试算</a>
                            <a id="EtrProject002_btn_save" class="layui-btn layui-btn-sm btn-save"
                                data-th-text="#{SysCommon.save}">保存</a>
                            <a id="EtrProject002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                                data-th-text="#{SysCommon.submit}">提交</a>
                            <a id="EtrProject002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                                data-th-text="#{SysCommon.cancel}">取消</a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div layout:fragment="script">
        <script th:inline="javascript" type="text/javascript">
            var T01 = /*[[${T01}]]*/'';
            var T02 = /*[[${T02}]]*/'';
            var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
            var sysDate = /*[[${sysDate}]]*/'';
            var fintype = /*[[${fintype}]]*/'';
             var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
             //展示投资目的或业务模式参数
             // var SHOW_INVAIM_OR_BUSSINSSMODEL =  /*[[${SHOW_INVAIM_OR_BUSSINSSMODEL}]]*/'';
         </script>
        <script data-th-src="@{/js/component/common/TradeCommon.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/component/entrust/EtrShowFinPlanAssetDetailInfo.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/invest/asset/channel/ChannelAssetCommon.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/invest/entrust/etrproject/EtrProject002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
