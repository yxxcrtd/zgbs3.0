<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title data-th-text="#{EtrNewStock002}">新股申购新建</title>
</head>
<body>
<div layout:fragment="content">
    <div>
        <form class="layui-form joyin-form-wrap pro-module-form" id="searchForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <input type="hidden" id="finprodIdhid" name="finprodId" th:value="${entity?.finprodId}">
                        <input type="hidden" id="calendarId" name="calendarId" th:value="${entity?.calendarId}">
                        <input type="hidden" id="finvdate" name="finvdate">
                        <input type="hidden" id="finmdate" name="finmdate">
                        <input type="hidden" id="profitType" name="profitType" th:value="${entity?.profitType}">
                        <input type="hidden" id="dealModeMsg" name="dealModeMsg" th:value="${entity?.dealMode}">
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrNewStock002.portfolioId}">组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="portfolioId" name="portfolioId" class="layui-input form-input input-select" th:allowClear="true"
                                                th:placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" th:formatoption=true required="required"
                                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}"
                                                data-th-initvalue="${entity?.portfolioId}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrNewStock002.purchDate}">申购日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input class="layui-input form-input input-dateSelect" id="purchDate" name="purchDate" placeholder="请选择时间"
                                               data-th-value='${#dates.format(entity?.purchDate,"yyyy-MM-dd")}' required="required">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrNewStock002.purchModle}">申购方式</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="purchModle" name="purchModle" class="layui-input form-input input-select"
                                                data-th-data-result='${PURCH_MODLE}' th:allowClear="true" th:placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                th:formatoption="true" data-th-initvalue="${entity?.purchModle}" required="required">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrNewStock002.finprodName}">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="finprodMarketId" name="finprodMarketId" class="layui-input form-input input-select"
                                                th:allowClear="true" th:placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" required="required"
                                                data-th-data-url="@{/invest/entrust/etrnewstock/EtrNewStock002/getfinprodIdForAdd}"
                                                data-th-initvalue="${entity?.finprodMarketId}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrNewStock002.finprodId}">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodName" name="finprodName" class="layui-input form-input" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.finprodMarketId}" disabled="disabled">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrStock001.tradeMarket}">交易场所</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="tradeMarket" name="tradeMarket" class="layui-input form-input input-select"
                                                allowclear="true"
                                                placeholder="请选择交易场所" data-th-placeholder="#{SysCommon.placeholder}" disabled="disabled"
                                                data-th-data-result="${TRADE_PLACE}"
                                                formatoption="true"
                                                data-th-initvalue="${entity?.tradeMarket}"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item" style="display: none">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrNewStock002.ps}">交易方向</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="ps" name="ps" class="layui-input form-input input-select" data-th-data-result='${PS}'
                                                th:allowClear="true" th:placeholder="请输入内容" required="required" childrenIds="dealMode,priceModel"
                                                data-th-placeholder="#{SysCommon.placeholder}" th:formatoption="true" data-th-initvalue="${entity?.ps}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">证券账户</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="secAcctId" name="secAcctId" parentIds="portfolioId,tradeMarket"
                                                class="layui-input form-input input-select" placeholder="请输入内容" required="required"
                                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-url="@{/invest/entrust/etrnewstock/EtrNewStock002/getSecAcctId}"
                                                allowClear="true" data-th-initvalue="${entity?.secAcctId}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrNewStock002.proAvailableCash}">组合T日可用现金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="proAvailableCash" name="proAvailableCash" placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                               class="layui-input form-input text-number" disabled="disabled" data-th-value="${entity?.proAvailableCash}"/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrNewStock002.ccy}">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="ccy" name="ccy" class="layui-input form-input input-select" disabled="disabled"
                                                data-th-data-result='${CCY}' th:allowClear="true" th:placeholder="请输入内容" required="required"
                                                data-th-placeholder="#{SysCommon.placeholder}" th:formatoption="true" data-th-initvalue="${entity?.ccy}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div id="entrustNum_div" class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrNewStock002.entrustNum}">申购数量</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="entrustNum" name="entrustNum" placeholder="请输入内容" data-pattern="true" data-fixtype=""
                                               class="layui-input form-input text-number" maxlength="10" data-th-value="${entity?.entrustNum}"/>
                                        <span class="input-right-show">股</span>
                                    </div>
                                </div>
                                <div id="price_div" class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrNewStock002.price}">申购价格</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="price" name="price" placeholder="请输入内容" data-pattern="##.##" data-fixtype="2"   required="required"
                                               class="layui-input form-input text-number" maxlength="16" data-th-value="${entity?.price}">
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div id="entrustAmt_div" class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrNewStock002.entrustAmt}">申购金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="entrustAmt" name="entrustAmt" placeholder="请输入内容" data-pattern="##.##" data-fixtype="2"
                                               class="layui-input form-input text-number" maxlength="10" data-th-value="${entity?.entrustAmt}"
                                               disabled="disabled"/>
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">委托投资人员信息</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrInvestPersonInfo002.invManagerId}">投资经理</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="invManagerId" name="etrInvestPersonInfo.invManagerId" class="layui-input form-input" th:allowClear="true"
                                                    th:placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value="${entity?.etrInvestPersonInfo.invManagerId}" disabled/>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrInvestPersonInfo002.room}">所属部门</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="room" name="etrInvestPersonInfo.room" class="layui-input form-input" th:allowClear="true"
                                                   th:placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value="${entity?.etrInvestPersonInfo.room}" disabled/>
                                        </div>
                                    </div>

                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrInvestPersonInfo002.contactInfo}">联系方式</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="contactInfo" name="contactInfo" class="layui-input form-input" th:allowClear="true"
                                                   th:placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value="${entity?.etrInvestPersonInfo.contactInfo}" />
                                        </div>
                                    </div>

                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 引业务组件投资委托人员信息组件 -->
                <!--<div class="page-component" th:data-path="@{/component/trade/BussEtrInvestPersonInfo/init}"
                     th:data-params="|{entityName: 'etrInvestPersonInfo',entity:'${person_entity}',single:'1'}|">
                </div>-->

                <!-- 引业务组件附件信息组件 -->
                <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                     th:data-params="|{entityName: 'FileCommon',businessId: '${businessId ?: ''}'}|"></div>
                <div id="ramark_DIV" class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">备注</span>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98% !important;">
                                        <textarea id="remark" name="remark" placeholder="请输入内容"
                                                  data-th-placeholder="#{SysCommon.placeholder}" class="layui-textarea"
                                                  data-th-text="${entity?.remark}"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 风险试算 -->
                <div th:if="${isEleShow['EtrNewStock002_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}" th:data-params="|{workflowId: '${workflowId}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>
            </div>
            <div class="pro-module-block">
                <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                    <div class="text-center">
                        <a th:if="${isEleShow['EtrNewStock002_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'"
                           id="EtrNewStock002_btn_riskcal" class="layui-btn layui-btn-sm"
                           data-th-text="#{EtrNewStock002.riskcal}">风险试算</a>
                        <a id="EtrNewStock002_btn_save" class="layui-btn layui-btn-sm btn-save"
                           data-th-text="#{SysCommon.save}">保存</a>
                        <a id="EtrNewStock002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                           data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="EtrNewStock002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                           data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var T46 = /*[[${T46}]]*/'';
        var T47 = /*[[${T47}]]*/'';
        var T48 = /*[[${T48}]]*/'';
        var T01 = /*[[${T01}]]*/'';
        var T02 = /*[[${T02}]]*/'';
        var dealMode_03 = /*[[${dealMode_03}]]*/'';
        var MY_SUP_TIME_TYPE_01 = /*[[${MY_SUP_TIME_TYPE_01}]]*/'';
        var USE_STATUS_01 = /*[[${USE_STATUS_01}]]*/'';
        var sysDate = /*[[${sysDate}]]*/'';
        var fintype = /*[[${fintype}]]*/'';
        var PRICEMODEL_01 = /*[[${PRICEMODEL_01}]]*/'PRM01';
        var PRICEMODEL_02 = /*[[${PRICEMODEL_02}]]*/'PRM02';
        var PRICEMODEL_03 = /*[[${PRICEMODEL_03}]]*/'PRM03';
    </script>
    <script data-th-src="@{/js/invest/entrust/etrnewstock/EtrNewStock002.js}" type="text/javascript"></script>

</div>
</body>
</html>
