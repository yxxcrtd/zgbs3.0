<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/default}">
<head>
	<style type="text/css">
		html {
			overflow: hidden;
		}
		.layui-form-radio>i{
			margin-right: 1px;
			font-size: 18px;
		}
		.layui-form-radio *{
			font-size:8px;
		}
		.form-lable {
			width: 35%;
			padding: 0px 10px 0px 0px;
		}

		.layui-tab-content {
			padding: 0px !important;
		}

		.select2-container--default .select2-results>.select2-results__options {
			max-height: 150px;
			overflow-y: auto;
		}

		.layui-form-item .select2-container {
			max-width: 100% !important
		}

		.position-col-width {
			width: 30%;
		}

		.position-col-width-zqzy {
			width: 22%;
		}

		.position-col-width-zqzy1 {
			width: 45%;
		}

		#positionsTable_zqzy_div {
			margin-top: -38px;
			margin-left: 40px;
			margin-bottom: 12px;
		}

		.form-lable {
			width: 25% !important;;
		}

		.grid-demo {
			background-color: #f5f5f5;
			border: 1px solid red;
			border-radius: 3px;
			padding: 5px;
		}
	</style>
</head>
<body>
<div layout:fragment="content">
	<div class="layui-tab" lay-filter="tradePlatform" style="display: none">
		<ul class="layui-tab-title">
			<li id="ZLGL" class="layui-this">指令管理</li>
			<li id="CC">持仓</li>
		</ul>
		<div class="layui-tab-content">
			<div id="zlgl_tab" class="layui-tab-item layui-show">	<!-- 指令管理tab页 -->
				<div class="layui-col-md12 form-button-area transfer-form">
					<a id="EtrIbBondinfo001_btn_import" class="layui-btn layui-btn-sm btn-import">
                        <i class="iconfont icon-import"></i><span data-th-text="#{EtrInvestBondInfo001.import}"></span></a>
					<a id="EtrIbBondinfo001_btn_close" class="layui-btn layui-btn-sm"><i class="iconfont icon-close"></i><span data-th-text="#{SysCommon.close}"></span></a>
					<a id="EtrIbBondinfo001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke"><i class="iconfont icon-revoke"></i><span data-th-text="#{ETR_REVERT}"></span></a>
				</div>

				<div class='joyin-form-wrap joyin-filter-form condition-area curr-form transfer-form'>
					<form class="layui-form" id="searchForm_zqzy">
						<div class="layui-form-item">
							<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
								<div class="layui-input-inline input-inline">
									<input type="text" id="vagueQuery" name="vagueQuery" class="layui-input form-input input-fuzzy-text" 
										   placeholder="关键字搜索" data-eventfunc="serachKey">
								</div>
							</div>
							<!-- 单选框 -->
							<div class="form-inline-wrap-radio">
								<label class="form-label-wrap-radio">
									<input type="radio" name="entrustStatus" value="" title="全部" checked>
								</label>
								<label class="form-label-wrap-radio">
									<input type="radio" name="entrustStatus" value="09" title="待分发">
								</label>
								<label class="form-label-wrap-radio">
									<input type="radio" name="entrustStatus" value="02" title="待接收">
								</label>
								<label class="form-label-wrap-radio">
									<input type="radio" name="entrustStatus" value="03" title="已接收">
								</label>
								<label class="form-label-wrap-radio">
									<input type="radio" name="entrustStatus" value="04" title="已完成">
								</label>
								<label class="form-label-wrap-radio">
									<input type="radio" name="entrustStatus" value="05" title="已退回">
								</label>
								<label class="form-label-wrap-radio">
									<input type="radio" name="entrustStatus" value="06" title="已关闭">
								</label>
								<label class="form-label-wrap-radio">
									<input type="radio" name="entrustStatus" value="07" title="已撤回">
								</label>
								<label class="form-label-wrap-radio">
									<input type="radio" name="entrustStatus" value="08" title="流程中">
								</label>
<!--								<label class="form-label-wrap-checkbox">-->
<!--									<span style="display:none"><input type="checkbox" name="isFlowIng" value="00" title="否"></span>-->
<!--									<input type="checkbox" name="isFlowIng" value="01" title="流程中">-->
<!--								</label>-->
							</div>
							<div class="form-inline-wrap-btn" style="float: right; width: 10%;">
<!--								<a class="layui-btn layui-btn-sm "  id="EtrIbBondinfo001_entrustOrder_btn_seach">查询</a>-->
								<div id="EtrIbBondinfo001_selectorConditionFilter" style="margin-top: 2px;display:none;border: 1px solid #ccc;position: absolute; top: -60px; right:10%;background: #fff;z-index: 100 ;width:400px;">
									<div class="sgePortDiv">
										<label class="layui-form-label form-lable" data-th-text="#{EtrTransactionDetail001.entrustDate}">指令日期</label>
										<div class="layui-input-inline input-inline">
											<input id='entrustDate' name='entrustDate'
												   class="layui-input form-input input-dateRangeSelect" placeholder="请选择时间区间"
												   data-th-placeholder="#{SysCommon.placeholder}">
										</div>
									</div>
									<div class="sgePortDiv">
										<label class="layui-form-label form-lable"
											   data-th-text="#{EtrIbBondinfo001.portfolioName}">组合名称</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="entrustOrder_portfolioId" name="portfolioId"
													class="layui-input form-input input-select"
													placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?ww=false}"
													multiple="true">
											</select>
										</div>
									</div>
									<div class="sgePortDiv">
<!--										<label class="layui-form-label form-lable"-->
<!--											   data-th-text="#{EtrIbBondinfo001.finpordAbbr}">资产简称</label>-->
<!--										<div class="layui-input-inline input-inline">-->
<!--											<input type="text" id="finprodAbbr" name="finprodAbbr" class="layui-input form-input input-lenovoselect" placeholder="请输入内容"-->
<!--												   data-th-data-url="@{/common/basicdata/marketdata/mstrateassetquotationinfo/ComRateAssetQuotationInfo001/getAssetName}"-->
<!--												   data-idfield="shortName" data-keyfield="shortName"-->
<!--												   data-th-data-effectivefieldsalias='|{"code":"资产编号", "shortName":"资产名称"}|' data-th-placeholder="#{SysCommon.placeholder}">-->
<!--										</div>-->
										<label class="layui-form-label form-lable" >资产简称</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="finprodAbbr" name="finprodAbbr"
													class="layui-input form-input input-select" placeholder="请输入内容"
													th:data-url="@{/business/common/CommonSelect/selectFinprodMarketId?finprodType=F01}"
													allowClear="true" ></select>
										</div>
									</div>
									<div class="sgePortDiv">
										<label class="layui-form-label form-lable"
											   data-th-text="#{EtrIbBondinfo001.ps}">交易方向</label>
										<div class="layui-input-inline input-inline">
<!--											<select type="text" id="EtrIbBondinfo001_query_ps" name="ps" class="layui-input form-input input-select" placeholder="请输入内容"-->
<!--													data-th-placeholder="#{SysCommon.placeholder}"-->
<!--													data-th-data-result="${PS}" >-->
<!--											</select>-->
											<select
													type="text"
													id="ps"
													name="ps"
													allowClear="true"
													class="layui-input form-input input-select"
													data-th-data-result="${PS}"
													placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}"
													formatoption="true"
											></select>
										</div>
									</div>
									<div class="sgePortDiv">
										<label class="layui-form-label form-lable" th:text="#{EtribBondInfo003.settleSpeed}">清算速度</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="settleSpeed" name="settleSpeed" class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${ACCOUNT_SPEED}' >
											</select>
										</div>
									</div>
									<div class="sgePortDiv">
										<label class="layui-form-label form-lable" data-th-utext="#{EtrInvestAllInfo001.invManagerId}">投资经理</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="repManager" name="repManager"
													class="layui-input form-input input-select"
													allowClear="true" placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-data-url="@{/invest/trade/investtrade/commanddispatcher/TrdCommandDispatcher001/getManagers}" >
											</select>
										</div>
									</div>
									<div class="sgePortDiv">
										<label class="layui-form-label form-lable"
											   data-th-text="#{EtrTransactionDetail001.entrustId}">指令代码</label>
										<div class="layui-input-inline input-inline">
<!--											<select  type="text" id="entrustId" name="entrustId" class="layui-input form-input input-select" maxlength="60"-->
<!--													 placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"-->
<!--													 data-th-data-url="@{/invest/trade/investtrade/investdealquery/TrdInvestDealQuery001/getEntrustIds}" -->
<!--													 formatoption = "false"></select>-->
											<input type="text" id="entrustId" name="entrustId"
												   class="layui-input form-input input-lenovoselect" maxlength="50"
												   data-th-data-url="@{/invest/trade/investtrade/investdealquery/TrdInvestDealQuery001/getEntrustIds}"
												   data-idfield="code" data-th-data-effectivefields="code"
												   data-th-data-effectivefieldsalias='|{"code":""}|'
												   allowClear="true" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
									<div class="sgePortDiv">
										<label class="layui-form-label form-lable" th:text="#{EtribBondInfo003.priceModel}">价格模式</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="priceModel" name="priceModel" class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${PRICE_MODEL}' >
											</select>
										</div>
									</div>

									<div class="sgePortDiv" style="text-align: center">
										<a id="EtrIbBondinfo001_queryDialog_btn_realseach" style="margin-left:40px" class="layui-btn layui-btn-sm"
										   data-th-text="确定">确定</a>
										<a id="EtrIbBondinfo001_queryDialog_btn_seachClose" style="margin-left:40px" class="layui-btn layui-btn-sm"
										   data-th-text="取消">取消</a>
										<a id="EtrIbBondinfo001_queryDialog_btn_seachReset" style="margin-left:40px" class="layui-btn layui-btn-sm"
										   data-th-text="重置">重置</a>
									</div>
								</div>
							</div>
						</div>
					</form>
				</div>

				<!-- 指令管理 -->
				<div>
					<table class="layui-table" id="positionsTable_zqzy"></table>
				</div>
			</div>
			<!-- 持仓 -->
			<div id="cc_tab" class="layui-tab-item">
				<div class="layui-col-md12 form-button-area CC-transfer-form">
				</div>
				<div class='joyin-form-wrap joyin-filter-form condition-area curr-form CC-transfer-form'>
					<form class="layui-form" id="searchForm_cc">
						<div class="layui-form-item">
							<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
								<label class="layui-form-label form-lable"
									   data-th-text="#{EtrIbBondinfo001.portfolioName}">组合名称</label>
								<div class="layui-input-inline input-inline">
									<select type="text" id="portfolioId" name="portfolioId"
											class="layui-input form-input input-select"
											placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId}"
											data-th-value="${entity?.portfolioId}" multiple="true">
									</select>
								</div>
							</div>
							<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
								<label class="layui-form-label form-lable"
									   data-th-text="#{EtrIbBondinfo001.secType1}">债券一级分类</label>
								<div class="layui-input-inline input-inline">
									<select type="text" id="secType1" name="secType1"
											class="layui-input form-input input-select"
											placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-data-result="${WINDTYPEONE}">
									</select>
								</div>
							</div>
							<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
								<label class="layui-form-label form-lable"
									   data-th-text="#{EtrIbBondinfo001.finpordAbbr}">资产简称</label>
<!--								<div class="layui-input-inline input-inline">-->
<!--									<select type="text" id="finprodId" name="finprodId"-->
<!--											class="layui-input form-input input-select"-->
<!--											placeholder="请输入内容"-->
<!--											data-th-placeholder="#{SysCommon.placeholder}"-->
<!--											data-th-data-url="@{/invest/entrust/etribbondinfo/EtrIbBondinfo001/queryAssetCode}"-->
<!--											data-th-value="${entity?.finprodId}" multiple="true">-->
<!--									</select>-->
<!--								</div>-->
								<div class="layui-input-inline input-inline">
									<select type="text" id="finprodId" name="finprodId"
											class="layui-input form-input input-select" placeholder="请输入内容"
											th:data-url="@{/business/common/CommonSelect/selectFinprodMarketId?finprodType=F01}"
											allowClear="true" multiple="true"></select>
								</div>
							</div>
						</div>
					</form>
				</div>
				<!-- 持仓列表 -->
				<div>
					<table class="layui-table" id="positionsTable"></table>
				</div>
			</div>
			<!-- 指令管理 -->
		</div>
	</div>
</div>
<div layout:fragment="script">
	<script
			data-th-src="@{/js/invest/entrust/etribbondinfo/EtrIbBondinfo001.js?new}"
			type="text/javascript"></script>
	<script th:inline="javascript" type="text/javascript">
		var FINPROD_TYPE_TG_F01 = /*[[${FINPROD_TYPE_TG_F01}]]*/'';
	</script>
</div>
</body>
</html>
