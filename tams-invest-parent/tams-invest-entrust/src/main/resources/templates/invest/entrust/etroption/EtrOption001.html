<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
    <title data-th-text="#{EtrOption001}">所有投资查询</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a id="EtrOption001_btn_add" class="layui-btn layui-btn-sm btn-create"
           data-th-text="#{SysCommon.create}"></a>
        <a id="EtrOption001_btn_close" class="layui-btn layui-btn-sm btn-close"
        ><i class="iconfont icon-close"></i><span data-th-text="#{SysCommon.close}"></span></a>
        <a id="EtrOption001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke"
        ><i class="iconfont icon-revoke"></i><span data-th-text="#{ETR_REVERT}"></span></a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area ">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{EtrOption001.portfolioId}">组合代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="portfolioId" name="portfolioId"
                                class="layui-input form-input input-select" allowClear="true"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                formatoption=true multiple="false"
                                 data-th-data-url="@{/invest/entrust/etroption/EtrOption002/getentrustIdAdd}"
                                data-th-initvalue="${entity?.portfolioId}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{EtrOption001.contractSubMatter}">合约标的</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="assetType10" name="assetType10" class="layui-input form-input input-select"
                                allowClear="true" placeholder="请输入内容"
                                formatoption=true multiple="true"
                                data-th-data-url="@{/invest/entrust/etroption/EtrOption002/getOptionTargetIdadd}"
                                data-th-placeholder="#{SysCommon.placeholder}" >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{EtrOption001.ps}">交易方向</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="ps" name="ps" class="layui-input form-input input-select"
                                data-th-data-result='${PS}' allowClear="true" placeholder="请输入内容"
                                data-th-initvalue="${entity?.ps}"
                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{EtrOption001.contractType}">合约类型</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="assetType11" name="assetType11" class="layui-input form-input input-select"
                                data-th-data-result='${STRUCTURE_TYPE}' allowClear="true" placeholder="请输入内容" multiple="true"
                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{EtrOption001.exerciseType}">行权方式</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="exerciseType" name="exerciseType"
                                class="layui-input form-input input-select" data-th-data-result='${EXEC_MODE}'
                                allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                formatoption="true" >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{EtrOption001.entrustDate}">委托日期</label>
                    <div class="layui-input-inline input-inline">
                        <input id='entrustDate' name='entrustDate'
                               class="layui-input form-input input-dateRangeSelect" placeholder="请选择支持区间"
                               data-th-placeholder="#{SysCommon.dateInterval}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{EtrOption001.entrustStatus}">有效状态</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="entrustStatus" name="entrustStatus"
                                class="layui-input form-input input-select" data-th-data-result='${ENTRUST_STATUS}'
                                allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                formatoption="true" multiple="true">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/entrust/etroption/EtrOption001.js}" type="text/javascript"></script>
</div>
</body>
</html>
