<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
    <title data-th-text="#{EtrAutoManagementAccount001}">自主管理专户投资指令</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area">
            <a id="EtrAutoManagementAccount001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
            <a id="EtrAutoManagementAccount001_btn_close" class="layui-btn layui-btn-sm btn-close"><i class="iconfont icon-close"></i><span data-th-text="#{SysCommon.close}"></span></a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area ">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">自主专户代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" name="portfolioId" id="portfolioId"
                                    class="finprodIdList layui-input form-input input-select" allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    formatoption = true
                                    data-th-data-url="@{/invest/entrust/etrautomanagementaccount/EtrAutoManagementAccount001/getSelectPortfolioId}"
                                    data-th-initvalue="${entity?.portfolioId}" >
                            </select>
                        </div>
                    </div>

                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">底层资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" class="layui-input form-input input-lenovoselect" id="finprodId"
                                   name="finprodId" data-th-placeholder="#{SysCommon.placeholder}" data-idfield="code"
                                   data-keyfield="code"
                                   data-th-data-effectivefieldsalias='|{"code":"#{EtrFund001.finprodId}",
                                    "shortName":"#{EtrFund001.finprodName}"}|'
                                   data-th-data-url="@{/invest/entrust/etrautomanagementaccount/EtrAutoManagementAccount001/getFinprodMarketId}"
                                   maxlength="60">
                        </div>
                    </div>

                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">指令日期</label>
                        <div class="layui-input-inline input-inline">
                            <input id='entrustDate' name='entrustDate'
                                   class="layui-input form-input input-dateRangeSelect" placeholder="请选择支持区间"
                                   data-th-placeholder="#{SysCommon.dateInterval}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">交易方向</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="ps" name="ps" class="layui-input form-input input-select"
                                    data-th-data-result='${PS}' allowClear="true" placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}" formatoption="true">
                            </select>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>


    <div layout:fragment="script">
        <script th:inline="javascript" type="text/javascript">
            var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
            var sysDate=/*[[${sysDate}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/entrust/etrautomanagementaccount/EtrAutoManagementAccount001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
