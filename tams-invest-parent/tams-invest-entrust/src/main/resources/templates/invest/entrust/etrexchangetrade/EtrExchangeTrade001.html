<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorator="~{layout/default}">
<head>
    <style type="text/css">
        .layui-form-item .layui-input-inline {
            float: left;
            left: 4px;
            margin: 0 0 0 0;
        }

        .layui-form-label {
            padding: 5px 2px !important;
        }

        .layui-inline layui-input-inline {
            padding: 0px 5px ;
        }

        .layui-form-item {
            padding-top: 2px;
            margin-bottom: 0;
            clear: both;
        }

        .select2-container .select2-selection--single {
            height: 26px;
        }

        .layui-tab-title {
            height: 28px;
        }

        .form-input {
            height: 26px;
        }

        .layui-fluid {
            padding: 0px 3px;
        }

        .layui-btn+.layui-btn {
            margin-left: 2px;
        }

        .layui-btn-sm {
            height: 24px;
            line-height: 24px;
        }

        .layui-btn-lock {
            float: right;
            margin-right: -20px;
        }

        .layui-form-radio {
            line-height: 24px;
            padding-right: 0px;
            margin: 0px;
        }
        .layui-form-radio div {
            font-size: 12px;
        }
        .layui-form-radio i{
            font-size: 14px;
        }

        .leftTopHide {
            display: none;
        }

        #seatId_div_dz ul.dropdown-menu {
            left: 0!important;
            width: 160px!important;
        }

        #counterOrg_div_gd ul.dropdown-menu {
            left: 0!important;
            width: 160px!important;
        }

        #counterTrader_div_gd ul.dropdown-menu {
            left: 0!important;
            width: 160px!important;
        }

        #trader_div_gd  ul.dropdown-menu {
            left: 0!important;
            width: 160px!important;
        }
        .label-deviation-degree{
            width: 50px;
            height: 24px;
            color: red;
            top: 0;
            right: -50px;
            position: absolute;
            text-align: center;
            line-height: 24px;
        }
        .price {
            width: -webkit-fill-available;
            /* position: absolute; */
            /* float: right; */
            height: 26px;
            margin-left: 0;
            margin-top: -2px;
            padding-left: 26px;
        }
        .priceTitle {
            margin-right: 20px;
        }
        .decrease-button {
            position: absolute;
            margin-top: 0;
            margin-left: 2px;
            height: 22px;
            width: 22px;
            font-size: 16px;
            font-weight: bolder;
            color: #999999;
            background-color: #efefef;
            border-radius: 2px 0 0 2px;
            border: 1px solid #E6E6E6;
        }
        .increase-button:hover {
            color: #7d7d7d;
        }
        .decrease-button:hover {
            color: #7d7d7d;
        }
        .increase-button {
            /* position: absolute; */
            /* margin-left: 0px; */
            float: right;
            margin-top: -24px;
            margin-right: 2px;
            height: 22px;
            width: 22px;
            font-size: 16px;
            font-weight: bolder;
            color: #999999;
            background-color: #efefef;
            border-radius: 0 2px 2px 0;
            border: 1px solid #E6E6E6;
        }
        .tab-list-wrap .layui-form-item .layui-inline .input-inline{
            width: 190px!important;
        }
        @media screen and (min-width: 450px) and (max-width: 768px){
            .tab-list-wrap .layui-form-item .layui-inline {
                width: 49%;
            }
        }
        @media screen and (max-width: 450px){
            .tab-list-wrap .layui-form-item .layui-inline {
                width: 100% !important;
            }
            .tab-list-wrap .layui-form-item .layui-form-label{
                width: 60px;
            }
        }
        @media screen and (min-width: 768px){
            .tab-list-wrap .layui-form-item .layui-inline {
                width: 33% !important;
            }.layui-form-label{
                 width: 120px;
             }
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <!-- 竞价交易 -->
    <div class="joyin-form-wrap tab-list-wrap" id="content_div_jj">
        <form class="layui-form pro-module-form" id="sumbitForm_jj">
            <input type="hidden" id="finprodType2_jj" name="finprodType2" data-th-value="${entity?.finprodType2}">
            <input type="hidden" id="entrustBussType_jj" name="entrustBussType" data-th-value="${entity?.entrustBussType}">
            <input type="hidden" id="acctTradeMarket_jj" name="acctTradeMarket">
            <input type="hidden" id="board_jj" name="board">
            <input type="hidden" id="secIdObjRelative_jj" name="secIdObjRelative">
            <input type="hidden" id="factPrice_jj" name="factPrice">
            <input type="text" id="entrustId_jj" name="entrustId" disabled="disabled" style="display: none;" data-th-value="${entity?.entrustId}">
            <input type="text" id="entrustStatus_jj" name="entrustStatus" disabled="disabled" style="display: none;" data-th-value="${entity?.entrustStatus}">
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label" style="font-size: 12px;">托管户可用现金:</label>
                    <label id="tgAcctCash_jj" class="layui-form-label"></label>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label" style="font-size: 12px;">证券户可用现金:</label>
                    <label id="secAcctCash_jj" class="layui-form-label" style="font-size: 12px;"></label>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label" style="font-size: 12px;">T1可用现金:</label>
                    <label id="t1Cash_jj" class="layui-form-label" style="font-size: 12px;"></label>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label" style="font-size: 12px;">可买数量:</label>
                    <label id="canBuyAmount_jj" class="layui-form-label" style="font-size: 12px;"></label>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label" style="font-size: 12px;">持仓数量:</label>
                    <label id="positionAmount_jj" class="layui-form-label" style="font-size: 12px;"></label>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label" style="font-size: 12px;">可卖数量:</label>
                    <label id="canSellAmount_jj" class="layui-form-label" style="font-size: 12px;"></label>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label" style="font-size: 12px;">成本价:</label>
                    <label id="costPrice_jj" class="layui-form-label" style="font-size: 12px;"></label>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label" data-th-text="#{EtrExchangeTrade002.portfolioName}">组合名称</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="portfolioId_jj" name="portfolioId" class="layui-input form-input input-select" th:placeholder="#{SysCommon.placeholder}" placeholder="请输入内容"
                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}" allowClear="true" formatoption="true" th:initValue="${entity?.portfolioId}" required>
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap" id="acctNo_div_jj" style="display:none;width: 50%; padding:0px;">
                    <label class="layui-form-label">资金账户</label>
                    <div class="layui-input-inline input-inline">
                        <select required type="text" id="acctNo_jj" name="acctNo" class="layui-input form-input input-select" placeholder="请输入内容" th:initValue="${entity?.acctNo}"
                                parentIds="portfolioId_jj" data-th-placeholder="#{SysCommon.placeholder}" data-th-data-url="@{/invest/entrust/etrexchangetrade/EtrExchangeTrade001/getPtlSecAcctInfo}" formatoption=true></select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label" data-th-text="#{EtrExchangeTrade001.finprodName}">资产名称</label>
                    <div class="layui-input-inline input-inline">
                        <div style="width: 73%">
                            <select required type="text" id="secId_jj" name="secId" class="layui-input form-input input-select" placeholder="请输入内容" th:initValue="${entity?.stockId}"
                                    parentIds="acctTradeMarket_jj" data-th-placeholder="#{SysCommon.placeholder}" data-th-data-url="@{'/invest/entrust/etrexchangetrade/EtrExchangeTrade001/getFinprodMarketInfo?tradePlat='+${SHARES_TRADE_PLATFORM_02}+'&expireSettleDate='+${iPlatformDate}}" formatoption=false></select>
                        </div>
                        <div style="width: 20%;">
                            <a id="EtrExchangeTrade001JJ_btn_search" class="layui-btn layui-btn-sm form-input-text">查看</a>
                        </div>
                    </div>
                </div>
                <div class="form-inline-wrap" id="secAcctId_div_jj" style="display: none;width: 50%; padding:0px;">
                    <label class="layui-form-label">证券账户</label>
                    <div class="layui-input-inline input-inline">
                        <select required type="text" id="secAcctId_jj" name="secAcctId" class="layui-input form-input input-select" placeholder="请输入内容" th:initValue="${entity?.secAcctId}"
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-url="@{/invest/entrust/etrexchangetrade/EtrExchangeTrade001/getSecAcctInfo}" formatoption=true></select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style="display:none;width: 50%; padding:0px;">
                    <label class="layui-form-label form-lable" data-th-text="#{EtrExchangeTrade001.finprodId}">资产代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="finprodId_jj" name="finprodId" disabled="disabled" class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.finprodId}">
                    </div>
                </div>
                <div class="form-inline-wrap" style="display:none;width: 50%; padding:0px;">
                    <label class="layui-form-label form-lable" data-th-text="#{EtrExchangeTrade001.finprodName}">资产名称</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="finprodName_jj" name="finprodName" disabled="disabled" class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.finprodName}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label" data-th-text="#{EtrExchangeTrade001.ps}">委托方向</label>
                    <div class="layui-input-inline input-inline">
                        <select required type="text" id="ps_jj" name="ps" allowClear="true" class="layui-input form-input input-select" data-th-data-result='${PS_JJ}'
                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true" data-th-initvalue="${entity?.ps}">
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap" style="display:none;width: 50%; padding:0px;">
                    <label class="layui-form-label" data-th-text="#{EtrExchangeTrade001.tradeMarket}">交易场所</label>
                    <div class="layui-input-inline input-inline">
                        <select required type="text" id="tradeMarket_jj" name="tradeMarket" allowClear="true" class="layui-input form-input input-select" data-th-data-result='${TRADE_PLACE}'
                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true" data-th-initvalue="${entity?.tradeMarket}">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label " th:text="#{EtrExchangeTrade001.priceModel}">价格模式</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="priceModel_jj" name="priceModel" class="layui-input form-input input-select" th:placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${PRICE_MODEL_JJ}' allowClear="true" th:initValue="${entity?.priceModel}" required></select>
                    </div>
                </div>
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label " th:text="#{EtrExchangeTrade001.targetType}">目标类型</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="targetType_jj" name="targetType" class="layui-input form-input input-select" th:placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${TARGET_CLASS}' allowClear="true" th:initValue="${entity?.targetType}" required></select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;" id="price_div_jj">
                    <label class="layui-form-label">
                        <input type="radio" lay-filter="calculateField" name="calculateField_jj" value="01" title="净价" checked="checked">
                    </label>
                    <div class="layui-input-inline input-inline">
                        <button type="button" class="decrease-button">-</button>
                        <input type="text" id="price_jj" name="price" placeholder="请输入内容" data-pattern="" data-fixtype="2" data-textrange='3' class="layui-input form-input text-number price"
                               data-th-value="${entity?.price}" required="required" autocomplete="off" maxlength=9>
                        <span class="input-right-show priceTitle">元</span>
                        <button type="button" class="increase-button">+</button>
                        <!--add by chenjiaixng 20210907 债券净价交易添加偏离度展示 start-->
                        <label class="label-deviation-degree" id="deviationDegree"></label>
                        <!--add by chenjiaixng 20210907 债券净价交易添加偏离度展示 end-->
                    </div>
                </div>
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;" id="fprice_div_jj">
                    <label class="layui-form-label">
                        <input type="radio" lay-filter="calculateField" name="calculateField_jj" value="02" title="全价">
                    </label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="fprice_jj" name="fprice" placeholder="请输入内容" data-pattern="" data-fixtype="2" data-textrange='3' class="layui-input form-input text-number"
                               data-th-value="${entity?.fprice}" required="required" disabled="disabled" autocomplete="off" maxlength=9>
                        <span class="input-right-show">元</span>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;" id="yield_div_jj">
                    <label class="layui-form-label">
                        <input type="radio" lay-filter="calculateField" name="calculateField_jj" value="03" title="收益率">
                    </label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="yield_jj" name="yield" placeholder="请输入内容" data-pattern="" data-fixtype="2" data-textrange='6' class="layui-input form-input text-number"
                               data-th-value="${entity?.yield}" required="required" disabled="disabled" autocomplete="off" maxlength=9>
                        <span class="input-right-show">%</span>
                    </div>
                </div>
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;" id="entrustPrice_div_jj">
                    <label id="entrustPrice_label_jj" class="layui-form-label " data-th-text="#{EtrExchangeTrade003.price}">指令价格</label>
                    <div class="layui-input-inline input-inline">
                        <button type="button" class="decrease-button">-</button>
                        <input type="text" id="entrustPrice_jj" name="entrustPrice" placeholder="请输入内容" data-pattern="" data-fixtype="2" data-textrange='4'
                               class="layui-input form-input text-number price" data-th-value="${entity?.entrustPrice}" required="required" autocomplete="off" maxlength=9>
                        <span id="entrustPriceUnit_jj" class="input-right-show priceTitle">元</span>
                        <button type="button" class="increase-button">+</button>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label id="entrustNum_label_jj" class="layui-form-label " data-th-text="#{EtrExchangeTrade001.entrustNum}">指令数量</label>
                    <div class="layui-input-inline input-inline">
                        <button type="button" class="decrease-button">-</button>
                        <input type="text" id="entrustNum_jj" name="entrustNum" placeholder="请输入内容" data-pattern="" data-fixtype="2" data-textrange='0'
                               class="layui-input form-input text-number price" data-th-value="${entity?.entrustNum}" required="required" disabled="disabled" autocomplete="off" maxlength=9>
                        <span id="entrustNumUnit_jj" class="input-right-show priceTitle">份</span>
                        <button type="button" class="increase-button">+</button>
                    </div>
                </div>
                <div class="form-inline-wrap" id="toShareAvailableNum_div_jj" style="display: none;width: 50%; padding:0px;">
                    <label id="toShareAvailableNum_label_jj" class="layui-form-label " data-th-text="#{EtrExchangeTrade001.toShareAvailableNum}">可转股数量</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="toShareAvailableNum_jj" name="toShareAvailableNum" placeholder="请输入内容" data-pattern="" data-fixtype="2" data-textrange='0'
                               class="layui-input form-input text-number" data-th-value="${entity?.toShareAvailableNum}" required="required" disabled="disabled" autocomplete="off" maxlength=9>
                        <span id="toShareAvailableNumUnit_jj" class="input-right-show">股</span>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label id="entrustAmt_label_jj" class="layui-form-label " data-th-text="#{EtrExchangeTrade001.entrustAmt}">指令金额</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="entrustAmt_jj" name="entrustAmt" placeholder="请输入内容" data-pattern="" data-fixtype="2" data-textrange='2'
                               class="layui-input form-input text-number" data-th-value="${entity?.entrustAmt}" required="required" autocomplete="off" maxlength=9>
                        <span id="entrustAmtUnit_jj" class="input-right-show">元</span>
                    </div>
                </div>
                <!--add by chenjiaxing 添加投资目的字段 start-->
<!--                <div th:if="${SHOW_INVAIM_OR_BUSSINSSMODEL} =='01' "  class="form-inline-wrap" style=" width: 50%; padding:0px;" id="invAim_div_jj">-->
<!--                    <label class="layui-form-label " th:text="#{EtrExchangeTrade001.invAim}">投资目的</label>-->
<!--                    <div class="layui-input-inline input-inline">-->
<!--                        <select type="text" id="invAim_jj" name="invAim" class="layui-input form-input input-select" th:placeholder="#{SysCommon.placeholder}"-->
<!--                                data-th-data-result='${INV_AIM}' allowClear="true" th:initValue="${entity?.invAim}" required></select>-->
<!--                    </div>-->
<!--                </div>-->

              <!--  <div th:if="${SHOW_INVAIM_OR_BUSSINSSMODEL} =='02' "  class="form-inline-wrap" id = "businessModelDiv_jj">
                    <label class="layui-form-label form-label-wrap"
                           data-th-text="#{EtrBondFirstLBidding002.businessModel}">业务模式</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="businessModel_jj" name="businessModel"
                                class="layui-input form-input input-select"
                                data-th-data-result='${BUSINESS_MODEL}' allowClear="true"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                required="required" formatoption="true"
                                data-th-initValue="${entity?.businessModel}">
                        </select>
                    </div>
                </div>-->

                <!--add by chenjiaxing 添加投资目的字段 end-->
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label " data-th-text="#{EtrExchangeTrade001.vdate}">开始日期</label>
                    <div class="layui-input-inline input-inline">
                        <input required class="layui-input form-input input-dateSelect" id="vdate_jj" name="vdate" placeholder="请选择时间" data-th-value="${iPlatformDate}" disabled="disabled">
                    </div>
                </div>
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label " data-th-text="#{EtrExchangeTrade001.mdate}">结束日期</label>
                    <div class="layui-input-inline input-inline">
                        <input required class="layui-input form-input input-dateSelect" id="mdate_jj" name="mdate" placeholder="请选择时间" data-th-value="${iPlatformDate}" disabled="disabled">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <!-- 大宗交易 -->
    <div class="joyin-form-wrap tab-list-wrap" id="content_div_dz" style="display: none">
        <form class="layui-form pro-module-form" id="sumbitForm_dz">
            <input type="hidden" id="dataSource_dz" name="dataSource" data-th-value="${entity?.dataSource}">
            <input type="hidden" id="finprodType2_dz" name="finprodType2" data-th-value="${entity?.finprodType2}">
            <input type="hidden" id="entrustBussType_dz" name="entrustBussType" data-th-value="${entity?.entrustBussType}">
            <input type="hidden" id="acctTradeMarket_dz" name="acctTradeMarket">
            <input type="hidden" id="board_dz" name="board">
            <input type="hidden" id="secIdObjRelative_dz" name="secIdObjRelative">
            <input type="hidden" id="factPrice_dz" name="factPrice">
            <input type="text" id="entrustId_dz" name="entrustId" disabled="disabled" style="display: none;" data-th-value="${entity?.entrustId}">
            <input type="text" id="entrustStatus_dz" name="entrustStatus" disabled="disabled" style="display: none;" data-th-value="${entity?.entrustStatus}">
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label" style="font-size: 12px;">托管户可用现金:</label>
                    <label class="layui-form-label" id="tgAcctCash_dz"></label>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label" style="font-size: 12px;">证券户可用现金:</label>
                    <label class="layui-form-label" id="secAcctCash_dz" style="font-size: 12px;"></label>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label" style="font-size: 12px;">T1可用现金:</label>
                    <label class="layui-form-label" id="t1Cash_dz" style="font-size: 12px;"></label>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label" style="font-size: 12px;">可买数量:</label>
                    <label class="layui-form-label" id="canBuyAmount_dz" style="font-size: 12px;"></label>
                </div>
