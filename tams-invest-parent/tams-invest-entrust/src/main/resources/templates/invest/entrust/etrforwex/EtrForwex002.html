<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
<title data-th-text="#{EtrForwex002}">外汇远期指令新建</title>
</head>
<body>
	<div layout:fragment="content">
        <div class="pro-module-container">
            <form class="layui-form joyin-form-wrap pro-module-form" id="searchForm">
                <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">																						 
                    <div class="pro-module">
                    	<h3 class="pro-module-title">
                    		<span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i>
                		</h3>
                        <input type="hidden" id="finprodIdhid" name="finprodId" th:value="${entity?.finprodId}">
                        <input type="hidden" id="finprodType2" name="finprodType2" th:value="${entity?.finprodType2}">
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                	<input type="text" id="entrustId" name="entrustId" disabled="disabled" style="display:none;" data-th-value="${entity?.entrustId}">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrForwex001.portfolioId}">组合代码</label>
			                        <div class="layui-input-inline input-inline">
			                            <select type="text" name="portfolioId" id="portfolioId"  
		                                    class="finprodIdList layui-input form-input input-select" allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
		                            		formatoption = true
		                            		required
		                            		data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}"
		                            		data-th-initvalue="${entity?.portfolioId}">
		                            		</select>
			                        </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrForwex001.vdate}">指令开始日</label>
			                        <div class="layui-input-inline input-inline">
			                            <input id='vdate' name='vdate'
			                                class="layui-input form-input input-dateSelect" placeholder="请选择时间" disabled="disabled"
			                                data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'
			                                required>
			                        </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrForwex001.mdate}">指令终止日</label>
			                        <div class="layui-input-inline input-inline">
			                            <input id='mdate' name='mdate'
			                                class="layui-input form-input input-dateSelect" placeholder="请选择时间" disabled="disabled"
			                                data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
			                                required>
			                        </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                            
                                 <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrForwex001.term}">期限</label>
			                        <div class="layui-input-inline input-inline">
			                            <select type="text" id="termType" name="termType"
			                               class="layui-input form-input input-select" data-th-data-result="${TERM_TYPE_EXC}"
			                               data-th-initvalue='${entity?.termType}'
			                               >
		                                </select>
			                        </div>
                                </div>
                                
                                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
			                        <label class="layui-form-label form-lable" data-th-text="#{EtrForwex002.settleDate}">交割日</label>
			                        <div class="layui-input-inline input-inline">
			                            <input id='settleDate' name='settleDate'
			                                class="layui-input form-input input-dateRangeSelect" placeholder="请选择时间区间"
			                                data-th-value='${settleDate}'
			                                data-th-placeholder="#{SysCommon.placeholder}">
			                        </div>
			                    </div>
			                                                            
			                    <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrForwex002.excDealType}">交易类型</label>
	                                <div class="layui-input-inline input-inline">
	                                    <select type="text" id="excDealType" name="excDealType"
	                                        childrenIds="curPair" class="layui-input form-input input-select"
	                                        data-th-data-result='${EXC_DEAL_TYPE}' required
	                                        data-th-initvalue='${entity?.excDealType?:EXC_DEAL_TYPE_default}'
	                                        allowClear="true" placeholder="请输入内容"
	                                        data-th-placeholder="#{SysCommon.placeholder}" formatoption="true">
	                                    </select>
	                                </div>
                                </div>
                                        
			                    
                            </div>
                            <div class="layui-form-item">
                            	<div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrForwex001.curPair}">货币对</label>
			                        <div class="layui-input-inline input-inline">
                                           <select type="text" id="curPair" name="curPair" parentIds="excDealType"
                                           	   childrenIds="ccy" 
                                               class="layui-input form-input input-select"
                                               data-th-data-result='${CYY_PAIR}' allowClear="true" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" required="required"
                                               formatoption="true" 
                                               data-th-initvalue="*{entity?.curPair}">
                                           </select>
                                       </div>
                                </div>
                                
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrForwex001.ps}">交易方向</label>
			                        <div class="layui-input-inline input-inline">
			                            <select type="text" id="ps" name="ps" required
			                               class="layui-input form-input input-select" data-th-data-result="${PS}"
			                               data-th-initvalue='${entity?.ps}'>
		                                </select>
			                        </div>
                                </div>
                                
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrForwex001.ccy}">交易币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="ccy" name="ccy" class="layui-input form-input input-select"
			                                data-th-data-result='${CCY}' allowClear="true" placeholder="请输入内容"
			                                parentIds="curPair"
			                                data-th-placeholder="#{SysCommon.placeholder}" formatoption = "true" 
			                                required  
			                                data-th-initvalue="${entity?.ccy?:CCY_default}">
			                            </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                            	<div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrForwex001.entrustAmt}">交易币种金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="entrustAmt" name="entrustAmt" class="layui-input form-input text-money"
                                        placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                        required="required"
                                        data-th-value="${entity?.entrustAmt}" maxlength="16">
                                    </div>
                                </div>
                                
	                           <div class="form-inline-wrap">
	                                 <label class="layui-form-label form-lable" data-th-text="#{EtrForwex002.proAvailableCash}">交易币种可用持仓</label>
	                                 <div class="layui-input-inline input-inline">
	                                       <input type="text" id="proAvailableCash" name="proAvailableCash" class="layui-input form-input text-money" 
	                                        disabled
                                        	data-th-value="${entity?.proAvailableCash}"
	                                        data-moneymemory="">
	                                 </div>
	                            </div>
                                
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrForwex001.price}">远期全价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="price" name="price" class="layui-input form-input text-money"
                                        placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                        required="required"
                                        data-th-value="${entity?.price}" maxlength="16" data-textrange="7">
                                    </div>
                                </div>
                            </div>
                            
                            <div class="layui-form-item">
                            
                            	<div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrForwex002.corCcy}">对应币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="corCcy" name="corCcy" class="layui-input form-input input-select"
			                                data-th-data-result='${CCY}' allowClear="true" disabled
			                                data-th-placeholder="#{SysCommon.placeholder}" formatoption = "true" 
			                                data-th-initvalue="${entity?.corCcy}">
			                            </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrForwex002.expCorAmt}">对应币种金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="expCorAmt" name="expCorAmt" class="layui-input form-input text-money"
                                        placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                        disabled
                                        data-th-value="${entity?.expCorAmt}" maxlength="16">
                                    </div>
                                </div>
                                
	                            <div class="form-inline-wrap">
	                                 <label class="layui-form-label form-lable" >对应币种可用持仓</label>
	                                 <div class="layui-input-inline input-inline">
	                                       <input type="text" id="corCurPos" name="corCurPos" class="layui-input form-input text-money" 
	                                        disabled
                                        	data-th-value="${entity?.corCurPos}"
	                                        data-moneymemory="">
	                                 </div>
	                            </div>
                            </div>
                            
                            <div class="layui-form-item">
                            
                            	<div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrForwex002.isDifSqu}">是否差额清算</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="isDifSqu" name="isDifSqu" class="layui-input form-input input-select"
			                                data-th-data-result='${YES_OR_NO}' allowClear="true" childrenIds="dealCurAcct,corCurAcct,cnyAcct"
			                                data-th-placeholder="#{SysCommon.placeholder}" formatoption = "true" 
			                                required="required"  
			                                data-th-initvalue="*{entity?.isDifSqu?:YES_OR_NO_default}">
			                            </select>
                                    </div>
                                </div>
                                
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrForwex002.invAim}">投资目的</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="invAim" name="invAim" class="layui-input form-input input-select"
			                                data-th-data-result='${INV_AIM}' allowClear="true"
			                                data-th-placeholder="#{SysCommon.placeholder}" formatoption = "true" 
			                                required 
			                                data-th-initvalue="*{entity?.invAim}">
			                            </select>
                                    </div>
                                </div>
                                
	                            <div class="form-inline-wrap">
	                                 <label class="layui-form-label form-lable"  data-th-text="#{EtrForwex002.dealCurAcct}" >交易货币账户</label>
	                                 <div class="layui-input-inline input-inline">
			                            <select name="dealCurAcct" id="dealCurAcct"  parentIds="portfolioId,ccy" 
		                            		data-th-data-url="@{/invest/entrust/etrforwex/EtrForwex002/selectPtlCapAcctNo}" 
		                                    class="layui-input form-input input-select" allowClear="true" data-th-placeholder="#{SysCommon.placeholder}"
		                            		formatoption = "true" 
		                            		th:initValue="${entity?.dealCurAcct}">
		                            		</select>
			                        </div>
                            	</div>
                            </div>
                            
                             <div class="layui-form-item">
                             
                            	<div class="form-inline-wrap">
	                                 <label class="layui-form-label form-lable"  data-th-text="#{EtrForwex002.corCurAcct}">对应货币账户</label>
	                                 <div class="layui-input-inline input-inline">
			                            <select name="corCurAcct" id="corCurAcct" parentIds="portfolioId,corCcy" 
		                            		data-th-data-url="@{/invest/entrust/etrforwex/EtrForwex002/selectPtlCapAcctNo}"
		                                    class="layui-input form-input input-select" allowClear="true" data-th-placeholder="#{SysCommon.placeholder}"
		                            		formatoption = "true" 
		                            		th:initValue="${entity?.corCurAcct}">
		                            		</select>
			                        </div>
                            	</div>
                                
                                <div class="form-inline-wrap">
	                                 <label class="layui-form-label form-lable"  data-th-text="#{EtrForwex002.cnyAcct}">人民币账户</label>
	                                 <div class="layui-input-inline input-inline">
			                            <select name="cnyAcct" id="cnyAcct" parentIds="portfolioId" 
		                                    class="layui-input form-input input-select" data-th-placeholder="#{SysCommon.placeholder}"
                                        	formatoption = "true" 
		                            		data-th-data-url="@{/invest/entrust/etrforwex/EtrForwex002/selectPtlCapAcctNo}" 
		                            		th:initValue ="${entity?.cnyAcct}" >
		                            		</select>
			                        </div>
                            	</div>
                                
                                
                            </div>
                            
                            
                            
                        </div>
                    </div>
                </div>
                </div>
                <div class="page-component" th:data-path="@{/component/trade/BussEtrInvestPersonInfo/init}" th:data-params="|{entityName: 'bussEtrInvestPersonInfoDto',entity:'${person_entity}',single:'1'}|"></div>
                <!-- 文件上传 -->
                <div class="page-component" th:data-path="@{/component/core/FileCommon/init}" th:data-params="|{entityName: 'FileCommon', businessId: '${businessId ?: ''}'}|"></div>
                    <!-- 备注 -->
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">备注</span><i
                                    class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item" style="padding-bottom: 8px;">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" style="width: 100%;">
                                        <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
										<textarea id="remark" name="remark" placeholder="请输入内容"
                                                  data-th-placeholder="#{SysCommon.placeholder}" maxlength="200"
                                                  class="layui-textarea" data-th-text="${entity?.remark}">
										</textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                <!-- 风险试算 -->
                <div th:if="${isEleShow['EtrForwex002_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}" th:data-params="|{workflowId: '${workflowId}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>
                </div>
            </form>
            <!-- </div> -->
            <div class="pro-module-wrapper pro-module-block" style="display: block;">
                <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
                    <div class="text-center">
                        <a th:if="${isEleShow['EtrForwex002_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'" th:id="|${pageId}_btn_riskCalculate|" class="layui-btn layui-btn-sm" >风险试算</a>
                        <a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                        <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                        <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
	<div layout:fragment="script">
        <script th:inline="javascript" type="text/javascript">
        	var YES = /*[[${YES}]]*/'';
        	var NO = /*[[${NO}]]*/'';

            var FINPROD_TYPE_TG_F12 = /*[[${FINPROD_TYPE_TG_F12}]]*/'';
            var MY_SUP_TIME_TYPE_01 = /*[[${MY_SUP_TIME_TYPE_01}]]*/'';
            var USE_STATUS_01 = /*[[${USE_STATUS_01}]]*/'';
            var sysDate = /*[[${sysDate}]]*/'';
            var PINAN_ASSET_TYPE_F14 = /*[[${PINAN_ASSET_TYPE_F14}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/entrust/etrforwex/EtrForwex002.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/component/trade/EtrForeignExchange.js}" type="text/javascript"></script>    
        <script data-th-src="@{/js/component/autocoupon/AutoCoupon.js}" type="text/javascript"></script>        
    </div>
</body>
</html>
