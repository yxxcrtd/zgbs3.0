<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
    <title data-th-text="#{EtrSecLend.add}">债券借贷投资委托新建</title>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
        <form class="layui-form joyin-form-wrap pro-module-form" id="searchForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">基本信息</span>（<span class="star-sign">*</span> 必填）<i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                       <input type="hidden" id="entrustId" name="entrustId" th:value="${entity?.entrustId}" />
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrSecLend.portfolioId}">组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption=true required="required"
                                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}"
                                                data-th-initvalue="${entity?.portfolioId}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrSecLend.vdate}">指令开始日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input class="layui-input form-input input-dateSelect" id="vdate"
                                               name="vdate" placeholder="请选择时间"
                                               data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'
                                               required="required">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrSecLend.mdate}">指令终止日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input class="layui-input form-input input-dateSelect" id="mdate"
                                               name="mdate" placeholder="请选择时间"
                                               data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
                                               required="required">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrSecLend.finprodId}">标的债券</label>
                                   <div class="layui-input-inline input-inline">
                                        <select type="text" id="finprodId" name="finprodId"
                                                class="layui-input form-input input-select" placeholder="请输入内容" required="required"
                                                th:placeholder="#{SysCommon.placeholder}" th:data-url="@{/invest/entrust/etrseclend/EtrSecLend002/getFinprodId}"
                                                allowClear="true" th:initValue="${entity?.finprodId}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrSecLend.totalAmt}">券面总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="totalAmt" name="totalAmt" placeholder="请输入内容"
                                               data-pattern="" data-fixtype="2" data-textrange="4"
                                               class="layui-input form-input text-number" required="required"
                                               data-th-value="${entity?.totalAmt}">
                                        <span class="input-right-show unitNum">万元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrSecLend.secAcctId}">证券托管户</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="secAcctId" name="secAcctId" parentIds="portfolioId,finprodId,tradeMarket"
                                                class="layui-input form-input input-select" placeholder="请输入内容" required="required"
                                                th:placeholder="#{SysCommon.placeholder}" th:data-url="@{/invest/entrust/etrseclend/EtrSecLend002/getSecManageAcctId}"
                                                allowClear="true" th:initValue="${entity?.secAcctId}"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" data-th-text="#{EtrRepo002.termType}">期限品种</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="termType" name="termType" parentIds="tradeMarket"
                                               class="layui-input form-input input-select"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-data-result='${TERM_TYPE_BONDLEND}'
                                               data-th-value="${entity?.termType}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrSecLend.settleSpreed}">清算速度</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="settleSpeed" name="settleSpeed"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${ACCOUNT_SPEED}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.settleSpeed}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrInvestBondInfo002.tradeMarket}">交易场所</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="tradeMarket" name="tradeMarket"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${TRADE_PLACE}' allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption="true"
                                                data-th-initvalue="${entity?.tradeMarket}"
                                                required="required">
                                            </select>
                                        </div>
                                    </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrSecLend.busiPs}">借贷方向</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="busiPs" name="busiPs"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${BACK_LEND_DIRECTION}' allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption="true"
                                                data-th-initvalue="${entity?.busiPs}"
                                                required="required">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrBoutRepo002.calendarId}">交易日历</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="calendarId" name="calendarId"
                                                class="layui-input form-input input-select"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-url="@{/business/common/CommonSelect/selectCalendarId}"
                                                 data-th-initvalue="${entity?.calendarId}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrSecLend.busiRate}">借贷费率(%)</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="busiRate" name="busiRate" placeholder="请输入内容"
                                               data-pattern="" data-fixtype="2" data-textrange="6"
                                               class="layui-input form-input text-number"
                                               data-th-value="${entity?.busiRate}" >
                                        <span class="input-right-show">%</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                 <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrSecLend.ccy}">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="ccy" name="ccy"
                                                class="layui-input form-input input-select" data-th-data-result='${CCY}'
                                                allowClear="true" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" required="required"
                                                formatoption="true"
                                                data-th-initvalue="*{entity?.ccy?:CCY_default}">
                                        </select>
                                    </div>
                                </div>
                                <!-- 组合现金、持仓查询 -->
                               <div id="avaStandardBondPositionDiv" class="page-component" th:data-path="@{/component/trade/BussTrdAvailableCashQuery/init}"
                                       th:data-params="|{entityName: 'bussTrdAvailableCashQuery'}|"></div>
                            </div>
                <!-- 引业务组件投资委托人员信息组件 -->
                <div class="page-component" th:data-path="@{/component/trade/BussEtrInvestPersonInfo/init}"
                     th:data-params="|{entityName: 'etrInvestPersonInfo', innerTrade: false,entity:'${person_entity}'}|"></div>
                <!--质押券信息-->
                 <div id="pledgeStamps_div" class="page-component" th:data-path="@{/component/trade/BussRepoSec/init}"
                    th:data-params="|{entityName: 'bussRepoSec', pageFrom: 'EtrSecLend002', entity:'${entity_bussRepoSecDto}', portfolioId:'${entity?.portfolioId==null?'':entity?.portfolioId}', ps:'${entity?.busiPs==null?'':entity?.busiPs}', bizCode:'${''}', entrustId:'${entity?.entrustId==null?'':entity?.entrustId}', tradeMarketId: 'tradeMarket'}|"></div>
             <!-- 引业务组件附件信息组件 -->
                <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                     th:data-params="|{entityName: 'FileCommon',businessId: '${businessId ?: ''}'}|"></div>
                <div id="ramark_DIV" class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">备注</span>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="layui-input-inline input-inline" style="width: 98%!important;margin:0 10px;">
                                    <textarea id="remark" name="remark" placeholder="请输入内容"
                                              data-th-placeholder="#{SysCommon.placeholder}" class="layui-textarea"
                                              data-th-text="${entity?.remark}" maxlength="300"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 风险试算 -->
                <div th:if="${isEleShow['EtrSecLend002_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}" th:data-params="|{workflowId: '${workflowId}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>
            </div>
            <div class="pro-module-wrapper pro-module-block">
                <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                    <div class="text-center">
                        <a th:if="${isEleShow['EtrSecLend002_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'"
                           id="EtrSecLend002_btn_riskcal" class="layui-btn layui-btn-sm"
                           data-th-text="#{EtrSecLend.riskcal}">风险试算</a>
                        <a id="EtrSecLend002_btn_save" class="layui-btn layui-btn-sm btn-save"
                           data-th-text="#{SysCommon.save}">保存</a>
                        <a id="EtrSecLend002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                           data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="EtrSecLend002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                           data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
    var BACK_LEND_DIRECTION_INTO = /*[[${BACK_LEND_DIRECTION_INTO}]]*/'';
    var BACK_LEND_DIRECTION_OUT = /*[[${BACK_LEND_DIRECTION_OUT}]]*/'';

    var MY_SUP_TIME_TYPE_01 = /*[[${MY_SUP_TIME_TYPE_01}]]*/'';
    var FINPROD_TYPE_TG_F29 = /*[[${FINPROD_TYPE_TG_F29}]]*/'';
    var FINPROD_TYPE_TG_F30 = /*[[${FINPROD_TYPE_TG_F30}]]*/'';
    var USE_STATUS_01 = /*[[${USE_STATUS_01}]]*/'';

    var sysDate = /*[[${sysDate}]]*/'';
    var fintype = /*[[${fintype}]]*/'';
    var PINAN_ASSET_TYPE_F12 = /*[[${PINAN_ASSET_TYPE_F12}]]*/'';
    //配置单位 add by yeming 20210723 end
    var entrustAmtUnit = /*[[${entrustAmtUnit}]]*/'';
    //配置单位 add by yeming 20210723 end
    </script>
    <script data-th-src="@{/js/invest/entrust/etrseclend/EtrSecLend002.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/component/autocoupon/AutoCoupon.js}" type="text/javascript"></script>
   </div>
</body>
</html>
