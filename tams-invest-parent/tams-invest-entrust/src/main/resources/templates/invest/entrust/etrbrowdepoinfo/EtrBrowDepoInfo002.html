                                    </div>

                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="proAvailableCash" name="proAvailableCash" class="layui-input form-input text-money"

                                            <input type="text" id="proAvailableCash1" name="proAvailableCash1" class="layui-input form-input text-money"

                                            <span class="input-right-show">元</span>
                                        </div>

                                    <label class="layui-form-label form-lable" >托管户剩余现金</label>

                                        <input type="text" id="accAvailableCash" name="accAvailableCash" class="layui-input form-input text-money"

                                        data-th-value="${entity?.accAvailableCash}">

                                    </div>
                                </div>
                            </div>
                            <div id="pschange2" style="display:none">

                                    <label class="layui-form-label form-lable">资产可用持仓</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="assetAvailablePosition" name="assetAvailablePosition" class="layui-input form-input text-money" 
                                        data-moneymemory="" 
                                        disabled

                                        <span class="input-right-show"></span>
                                    </div>
