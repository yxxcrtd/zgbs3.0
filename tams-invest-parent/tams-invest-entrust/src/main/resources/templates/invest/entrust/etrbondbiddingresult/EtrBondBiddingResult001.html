<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title>债券借贷投资交易</title>
    <style>
         .ptl-table .layui-table-view{
             height: 490px!important;
         }
         .ptl-table .layui-table-body{
             height: 405px!important;
         }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area" >
            <a class="layui-btn layui-btn-sm" th:id="|${pageId}_btn_manualRelease|">手工释放</a>
            <a class="layui-btn layui-btn-sm" th:id="|${pageId}_btn_payment|">分销缴款</a>
            <a class="layui-btn layui-btn-sm" th:id="|${pageId}_btn_paymentBatch|">批量缴款</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
            <form class="layui-form"  id="submitForm" >
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable" th:text="#{Etrbondbiddingresult001.portfolioId}">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="portfolioId" name="portfolioId"
                                    class="layui-input form-input input-select" allowClear="true"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-url="@{/invest/entrust/etrbondfirstlbidding/EtrBondFirstLBidding002/getentrustIdAdd}"
                                    formatoption=true multiple="true">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable" th:text="#{Etrbondbiddingresult001.finprodId}">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="finprodId" name="finprodId"
                                   class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-url="@{/business/common/CommonSelect/getAssetIdPrimaryBond(pageId=${pageId})}"
                                   data-idfield="code" data-keyfield="code"
                                   data-th-data-effectivefieldsalias='|{"code":"#{TrdBondInvestTrade001.finprodId}","shortName":"#{TrdBondInvestTrade001.finprodName}"}|'
                                   data-th-value="${entity?.finprodMarketId}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable" th:text="#{Etrbondbiddingresult001.tradeMarket}">交易场所</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="tradeMarket" name="tradeMarket"
                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${TRADE_PLACE}'
                                    allowClear="true" formatoption="true"></select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable" th:text="#{Etrbondbiddingresult001.paymentStatus}">缴款状态</label>
                        <div class="layui-input-inline input-inline">
                            <select id="paymentStatus"
                                    class="layui-input form-input input-select"
                                    data-th-data-result='${PAYMENT_STATUS}'
                                    placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    allowClear="true"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable" th:text="#{Etrbondbiddingresult001.counterId}">交易对手</label>
                        <div class="layui-input-inline input-inline">
                            <select id="counterId"
                                    data-th-data-url="@{/component/trade/TrdInvestPersonInfo002/selectCounterId?counterType=01}"
                                    formatOption="false"
                                    placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    class="layui-input form-input input-select">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable" th:text="#{Etrbondbiddingresult001.bidDate}">投标日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" class="layui-input form-input input-dateRangeSelect" id="bidDate" placeholder="请选择、支持区间">
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="ptl-table1">
            <table class="layui-table" id="dataTable"></table>
        </div>
        <!--<div class="ptl-table" style="display: none;">
            <table class="layui-table" id="dataTable"></table>
        </div>-->
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var finprodId = /*[[${finprodId}]]*/'';
        var mdate = /*[[${mdate}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/entrust/etrbondbiddingresult/EtrBondBiddingResult001.js?sdsd3sdssdd}" type="text/javascript"></script>
</div>
</body>

</html>
