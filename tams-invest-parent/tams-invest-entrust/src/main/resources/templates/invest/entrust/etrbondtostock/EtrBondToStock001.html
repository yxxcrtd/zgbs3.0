<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>可转债转股委托</title>
</head>
<body>
<div layout:fragment="content">
    <div class="layui-tab layui-tab-brief" lay-filter="docDemoTabBrief">
        <ul class="layui-tab-title">
            <li class="layui-this">委托</li>
            <li>持仓</li>
        </ul>
        <div class="layui-tab-content" style="height: 100px;">
            <div class="layui-tab-item layui-show">
            	<div class='layui-fluid'>
                    <div class="layui-col-md12 form-button-area entrust-form">
								<a class="layui-btn layui-btn-sm btn-revoke" id="EtrBondToStock001_btn_revoke">
								<i class="iconfont icon-revoke"></i>
								<span data-th-text="#{EtrBondToStock001.revoke}"></span>
								</a>
								<a class="layui-btn layui-btn-sm btn-close" id="EtrBondToStock001_btn_close">
								<i class="iconfont icon-close"></i>
								<span data-th-text="#{SysCommon.close}"></span></a>
                    </div>            	
	        		<div class="joyin-form-wrap joyin-filter-form condition-area curr-form entrust-form">
	           			 <form class="layui-form"  id="searchForm" >
	                			<div class="layui-form-item">
	                    			<div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
	                       		    <label class="layui-form-label form-lable" data-th-text="#{EtrInvestAllInfo001.portfolioId}">组合代码</label>
	                       					 <div class="layui-input-inline input-inline">
	                       					 <select type="text" id="portfolioId1" name="portfolioId1"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption="true" multiple="multiple"
                                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?ww=false}"
                                                data-th-initvalue="${entity?.portfolioId}">
                                            </select>
	                        				</div>
	                   				</div>
				                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
				                        <label class="layui-form-label form-lable" data-th-text="#{EtrBondToStock001.finprodId}">转债代码</label>
				                       	<div class="layui-input-inline input-inline">
				                          				  <select type="text" id="finprodId1" name="finprodId1"
				                                                class="layui-input form-input input-select" allowClear="true"
				                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
				                                                data-th-data-url="@{/invest/entrust/etrbondtostock/EtrBondToStock001/getFinprodId}"
				                                                formatoption="true" >
				                                            </select>
				                       	</div>
				                    </div>
				                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
				                        <label class="layui-form-label form-lable" data-th-text="#{EtrBondToStock001.shareId}">正股代码</label>
				                        <div class="layui-input-inline input-inline">
				                           					 <select type="text" id="shareId1" name="shareId1"
				                                                class="layui-input form-input input-select" allowClear="true"
				                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
				                                                data-th-data-url="@{/invest/entrust/etrbondtostock/EtrBondToStock001/getShareId}"
				                                                formatoption="true">
				                                            </select>
				                        </div>
				                    </div>
	             			   </div>
				                <div class="layui-form-item">
				                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
				                        <label class="layui-form-label form-lable" 
				                        data-th-text="#{EtrInvestAllInfo001.entrustStatus}">有效状态</label>
				                        <div class="layui-input-inline input-inline">
				                            <select class="layui-input form-input input-select" data-th-data-result='${ENTRUST_STATUS}'
				                            id="entrustStatus" name="entrustStatus" allowClear="true"
				                            placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
				                            formatoption="true">
				                            </select>
				                        </div>
				                    </div>
				                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
				                        <label class="layui-form-label form-lable">指令日期</label>
				                        <div class="layui-input-inline input-inline">
				                            <input type="text" id="entrustDate" name="entrustDate"
				                            class="layui-input form-input input-dateRangeSelect" 
				                            placeholder="请选择、支持区间">
				                        </div>
				                    </div>
				                </div>
				            </form>
	        	</div>
		            <table class="layui-table" id="dataTable"></table>
	    	</div>
	    </div>
	    <div class="layui-tab-item">
	    	<div class='layui-fluid'>
                    <div class="layui-col-md12 form-button-area position-form">
		        			<a class="layui-btn layui-btn-sm" id="EtrBondToStock001_btn_bondtostocke">
			                <i class="iconfont"></i>
			                <span data-th-text="#{EtrBondToStock001.bondtostock}"></span>
			          	    </a>
                    </div>	    	
        		<div class="joyin-form-wrap joyin-filter-form condition-area curr-form position-form">
            		<form class="layui-form"  id="othersearchForm" >
              		  <div class="layui-form-item">
                   		 <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        	<label class="layui-form-label form-lable" data-th-text="#{EtrInvestAllInfo001.portfolioId}">组合代码</label>
                        	<div class="layui-input-inline input-inline">
                        					<select type="text" id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption=true multiple="multiple"
                                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?ww=false}"
                                                data-th-initvalue="${entity?.portfolioId}">
                                            </select>
                       	    </div>
                    	</div>
                    	<div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        	<label class="layui-form-label form-lable" data-th-text="#{EtrBondToStock001.finprodId}">转债代码</label>
                        	<div class="layui-input-inline input-inline">
                            				<select type="text" id="finprodId" name="finprodId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-url="@{/invest/entrust/etrbondtostock/EtrBondToStock001/getFinprodId}"
                                                formatoption="true">
                                            </select>
                       	   </div>
                       </div>
                       <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        	<label class="layui-form-label form-lable" data-th-text="#{EtrBondToStock001.shareId}">正股代码</label>
                       		<div class="layui-input-inline input-inline">
                            				<select type="text" id="shareId" name="shareId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-url="@{/invest/entrust/etrbondtostock/EtrBondToStock001/getShareId}"
                                                formatoption="true">
                                            </select>
                           </div>
                   	  </div>
                	</div>
               		<div class="layui-form-item">
                      <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                       	   <label class="layui-form-label form-lable" data-th-text="#{EtrBondToStock001.convertible}">可转换</label>
                        	<div class="layui-input-inline input-inline">
                            <select type="text" id="convertible" name="convertible"  class="layui-input form-input input-select"  
                            data-th-data-result="${CONBONDSHOW}" th:initValue="${CONBONDSHOW_default}"></select>
                            </div>
                     </div>
                     <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrBondToStock001.sharepriceinterval}">正股价区间</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="sharepriceinterval" name="sharepriceinterval"  class="layui-input form-input input-select"  
                            data-th-data-result="${P_STOCK_PRICE_RANG}" th:initValue="${P_STOCK_PRICE_RANG_default}"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrBondToStock002.refreshTime}">自动刷新时间(s)</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="refreshTime" name="refreshTime"
                                                class="layui-input form-input text-number" value="30" data-textrange="0" data-fixtype="1" min="1" max="180"
                                                required="required">	 
                                        </div>
                   </div>
                </div>
            </form>
        </div>	
    					<table class="layui-table" id="otherDataTable"></table>
   		 		</div>
   			</div>
 		</div>
	</div>
</div>
<div layout:fragment="script">
   <script th:inline="javascript" type="text/javascript">
              var BTSRMS = /*[[${BTSRMS}]]*/'';
        </script>
    <script data-th-src="@{/js/invest/entrust/etrbondtostock/EtrBondToStock001.js}" type="text/javascript"></script>
</div>
</body>

</html>
