<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title data-th-text="#{EtrNewStock001}">新股申购指令</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <!--新建按钮-->
        <a id="EtrNewStock001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
        <!--关闭按钮-->
        <a id="EtrNewStock001_btn_close" class="layui-btn layui-btn-sm">
            <i class="iconfont icon-close"></i>
            <span data-th-text="#{SysCommon.close}"></span>
        </a>
        <!--撤回按钮-->
        <a id="EtrNewStock001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke">
            <i class="iconfont icon-revoke"></i>
            <span data-th-text="#{ETR_REVERT}"></span>
        </a>
        <!-- 导入按钮 -->
       <!-- <a id="EtrNewStock001_btn_import" class="layui-btn layui-btn-sm btn-import" >导入</a>-->
    </div>
    <!--查询条件-->
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{EtrWtFxswap001.portfolioId}">组合代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="portfolioId" name="portfolioId"
                                class="layui-input form-input input-select" allowClear="true"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                formatoption=true multiple="multiple"
                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?ww=false}"
                                data-th-initvalue="${entity?.portfolioId}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{EtrNewStock001.finprodId}">资产代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" class="layui-input form-input input-lenovoselect" id="finprodId"
                               name="finprodId" data-th-placeholder="#{SysCommon.placeholder}" data-idfield="code" data-keyfield="name"
                               data-th-data-effectivefieldsalias='|{"code":"#{EtrNewStock001.finprodId}", "shortName":"#{EtrNewStock001.finprodName}"}|'
                               data-th-data-url="@{/invest/entrust/etrnewstock/EtrNewStock001/getfinprodId}" maxlength="60">
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{EtrNewStock001.tradeMarket}">交易场所</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="tradeMarket" name="tradeMarket" class="layui-input form-input input-select" th:allowclear="true"
                               placeholder="请选择交易场所" data-th-placeholder="#{SysCommon.placeholder}" aria-hidden="true"
                               data-th-data-result="${TRADE_PLACE}" th:formatoption="true">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable" data-th-text="#{EtrNewStock002.purchModle}">申购方式</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="purchModle" name="purchModle" class="layui-input form-input input-select"
                                data-th-data-result='${PURCH_MODLE}' th:allowClear="true" th:placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                th:formatoption="true" data-th-initvalue="${entity?.purchModle}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{EtrNewStock001.entrustStatus}">有效状态</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="entrustStatus" name="entrustStatus" class="layui-input form-input input-select"
                                data-th-data-result='${ENTRUST_STATUS}' th:allowClear="true" th:placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" th:formatoption="true">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{EtrNewStock001.entrustDate}">指令日期</label>
                    <div class="layui-input-inline input-inline">
                        <input id='entrustDate' name='entrustDate' class="layui-input form-input input-dateRangeSelect"
                               placeholder="请选择时间区间" data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
            </div>

        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/entrust/etrnewstock/EtrNewStock001.js}" type="text/javascript"></script>
</div>
</body>
</html>
