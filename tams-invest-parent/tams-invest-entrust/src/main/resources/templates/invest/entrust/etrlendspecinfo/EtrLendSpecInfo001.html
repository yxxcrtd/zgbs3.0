<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
<title data-th-text="#{EtrLendSpecInfo001}">所有投资查询</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area">
            <a th:id="|${pageId}_btn_add|" class="layui-btn layui-btn-sm btn-create"
                data-th-text="#{SysCommon.create}"></a>
            <!-- add by gaopeng 20191231 导入按钮添加 start -->
            <a th:id="|${pageId}_btn_import|" class="layui-btn layui-btn-sm btn-import"
            data-th-text="#{EtrLendSpecInfo001.import}">导入</a> 
            <!-- add by gaopeng 20191231 导入按钮添加 end -->
            <a th:id="|${pageId}_btn_close|" class="layui-btn layui-btn-sm btn-close" 
                ><i class="iconfont icon-close"></i><span data-th-text="#{SysCommon.close}"></span></a>
            <a th:id="|${pageId}_btn_revoke|" class="layui-btn layui-btn-sm btn-revoke"
                ><i class="iconfont icon-revoke"></i><span data-th-text="#{ETR_REVERT}"></span></a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area ">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrLendSpecInfo001.portfolioId}">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption=true multiple="true"
                                                data-th-data-url="@{/invest/entrust/etrlendspecinfo/EtrLendSpecInfo002/getentrustIdAdd}"
                                                data-th-initvalue="${entity?.portfolioId}">
                                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrLendSpecInfo001.type6}">拆借类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="type6" name="type6" class="layui-input form-input input-select"
                                data-th-data-result='${BANK_LENDING_TYPE}' allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true" multiple="true">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrLendSpecInfo001.ccy}">币种</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="ccy" name="ccy" class="layui-input form-input input-select"
                                data-th-data-result='${CCY}' th:initValue="${CCY_default}" allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true">
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrLendSpecInfo001.ps}">交易方向</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="ps" name="ps" class="layui-input form-input input-select"
                                data-th-data-result='${BACK_LEND_DIRECTION}' allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrLendSpecInfo001.entrustStatus}">有效状态</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="entrustStatus" name="entrustStatus"
                                class="layui-input form-input input-select" data-th-data-result='${ENTRUST_STATUS}'
                                allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                formatoption="true" multiple="true">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrLendSpecInfo001.entrustDate}">指令日期</label>
                        <div class="layui-input-inline input-inline">
                            <input id='entrustDate' name='entrustDate'
                                class="layui-input form-input input-dateRangeSelect" placeholder="请选择支持区间"
                                data-th-placeholder="#{SysCommon.dateInterval}">
                        </div>
                    </div>
                </div>
               <!--  <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrLendSpecInfo001.tradeMarket}">交易场所</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="tradeMarket" name="tradeMarket"
                                   class="layui-input form-input input-select" allowclear="true"
                                   placeholder="请选择交易场所" data-th-placeholder="#{SysCommon.placeholder}" aria-hidden="true"
                                   data-th-data-result="${TRADE_PLACE}" formatoption="true">
                        </div>
                    </div>
                </div> -->
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/entrust/etrlendspecinfo/EtrLendSpecInfo001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
