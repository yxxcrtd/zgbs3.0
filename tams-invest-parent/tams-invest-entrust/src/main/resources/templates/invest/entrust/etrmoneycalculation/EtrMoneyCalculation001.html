<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{EtrMoneyCalculation001}">可投金额试算</title>
</head>
<body>
    <div layout:fragment="content">

        <div class="joyin-form-wrap ">
            <form class="layui-form" id="dataform">
                <div class="pro-module-wrapper pro-module-base step" title="基本信息" >
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="aleft stuff">基本信息</span>
                            </h3>
                            <input type="hidden" id="platDate" name="platDate" th:value="${platDate}">
                        </div>

                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" >组合代码<i class="must">*</i></label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption=true
                                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?ww=false}"
                                                >
                                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" >资产类型<i class="must">*</i></label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="finprodType" name="finprodType" childrenIds="curPair" class="layui-input form-input input-select"
                                data-th-data-result='${FINPROD_TYPE}'  allowClear="true" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true" data-th-initvalue="${FINPROD_TYPE_DEFUALT}">
                            </select>
                        </div>
                    </div>

                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" >资产代码<i class="must">*</i></label>
                        <div class="layui-input-inline input-inline" id="finprodone">
                            <select type="text" id="finprodId" name="finprodId" class="layui-input form-input input-select"
                                   placeholder="请输入内容" allowClear="true"   data-th-data-result='${FINPROD}'>
                            </select>
                        </div>

                    </div>

                </div>
                   <div class="layui-form-item" id="bond">
                           <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                               <label class="layui-form-label form-lable" data-th-text="#{EtrMoneyCalculation001.bondOneType}">债券一级分类</label>
                               <div class="layui-input-inline input-inline">
                               <input type="text" id="bondOneType" name="bondOneType" class="layui-input form-input " disabled="disabled">
                               </div>
                           </div>

                       <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                           <label class="layui-form-label form-lable" data-th-text="#{EtrMoneyCalculation001.bondTwoType}">债券二级分类</label>
                           <div class="layui-input-inline input-inline">
                               <input type="text" id="bondTwoType" name="bondTwoType" class="layui-input form-input " disabled="disabled">
                           </div>
                       </div>

                       <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                           <label class="layui-form-label form-lable" data-th-text="#{EtrMoneyCalculation001.publisher}">发行人</label>
                           <div class="layui-input-inline input-inline">
                               <input type="text" id="publisher" name="publisher" class="layui-input form-input " disabled="disabled">
                           </div>
                       </div>
                 </div>

                        <div class="layui-form-item"  id="bondPJ">
                            <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-lable" data-th-text="#{EtrMoneyCalculation001.bondRating}">债项评级</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="bondRating" name="bondRating" class="layui-input form-input " disabled="disabled">
                                </div>
                            </div>

                            <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-lable" data-th-text="#{EtrMoneyCalculation001.bondSubjectRating}">主体评级</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="bondSubjectRating" name="bondSubjectRating" class="layui-input form-input " disabled="disabled">
                                </div>
                            </div>


                        </div>

                        <div class="layui-form-item" id="fund">
                            <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-lable" data-th-text="#{EtrMoneyCalculation001.fundType}">基金类型</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="fundType" name="fundType" class="layui-input form-input " disabled="disabled">
                                </div>
                            </div>

                            <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-lable" data-th-text="#{EtrMoneyCalculation001.fundTwoType}">二级类型</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="fundTwoType" name="fundTwoType" class="layui-input form-input " disabled="disabled">
                                </div>
                            </div>

                            <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-lable" data-th-text="#{EtrMoneyCalculation001.manager}">管理人</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="manager" name="manager" class="layui-input form-input " disabled="disabled">
                                </div>
                            </div>
                        </div>

                        <div class="layui-form-item" id="stock">
                            <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-lable" data-th-text="#{EtrMoneyCalculation001.tradingPlace}">交易场所</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="tradingPlace" name="tradingPlace" class="layui-input form-input " disabled="disabled">
                                </div>
                            </div>

                            <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-lable" data-th-text="#{EtrMoneyCalculation001.board}">上市板</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="board" name="board" class="layui-input form-input " disabled="disabled">
                                </div>
                            </div>

                            <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-lable" data-th-text="#{EtrMoneyCalculation001.repIndustry}">行业</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="repIndustry" name="repIndustry" class="layui-input form-input " disabled="disabled">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-lable" data-th-text="#{EtrMoneyCalculation001.haveMoney}">可投金额</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="haveMoney" name="haveMoney" class="layui-input form-input " disabled="disabled">
                                </div>
                            </div>
                          <div style="text-align: right ">
                            <a id="EtrMoneyCalculation001_btn_calculation" class="layui-btn layui-btn-sm btn-create" data-th-text="计算"></a>
                            <a id="EtrMoneyCalculation001_btn_export" class="layui-btn layui-btn-sm btn-export" data-th-text="导出"></a>
                        </div>
                        </div>
                        <div class="layui-form-item"></div>
         </div>
    </div>
                <div>
                    <table class="layui-table" id="etrMoneyCalculationDetailDtoList"></table>
                </div>
            </form>

        </div>

    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">

        </script>
        <script data-th-src="@{/js/invest/entrust/etrmoneycalculation/EtrMoneyCalculation001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
