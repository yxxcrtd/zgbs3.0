<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{EtrInstruction003}">合同签署结果维护</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i
                                class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <input type="hidden" id="vdateStr" name="vdateStr"
                               th:value="${entity?.vdateStr}">
                        <input type="hidden" id="mdateStr" name="mdateStr"
                               th:value="${entity?.mdateStr}">
                        <input type="hidden" id="entrustId" name="entrustId"
                               data-th-value="${entity?.entrustId}">
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrInstruction001.assetTypeOne}">资产一级分类</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="assetType1" name="assetType1"
                                                class="layui-input form-input input-select"
                                                allowClear="true"
                                                placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.assetType1}"
                                                data-th-data-result='${PLAN_ASSET_TYPE}'
                                                childrenIds="assetTypeTwo">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrInstruction001.assetTypeTwo}">资产二级分类</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="assetType10" name="assetType10"
                                                class="layui-input form-input input-select"
                                                allowClear="true"
                                                placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.assetType10}"
                                                data-th-data-result='${PLAN_ASSET_SEC_TYPE}'
                                                parentIds="assetType10"
                                                formatoption=true>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrInstruction001.finprodMarketId}">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodMarketId"
                                               name="finprodMarketId"
                                               class="layui-input form-input"
                                               placeholder="" maxlength="75"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.finprodMarketId}"/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrInstruction001.finprodAbbr}">资产简称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodAbbr" name="finprodAbbr"
                                               class="layui-input form-input"
                                               placeholder="" maxlength="75"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.finprodAbbr}"/>
                                    </div>
                                </div>

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrInstruction001.repFinancier}">融资人/管理人</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="repFinancier" name="repFinancier"
                                               class="layui-input form-input"
                                               placeholder="" maxlength="75"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.repFinancier}"/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrInstruction001.vDate}">起息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="vDate" name="vDate"
                                               data-th-value="${#dates.format(entity?.vDate,'yyyy-MM-dd')}"
                                               class="layui-input form-input input-dateSelect ps02"/>
                                    </div>
                                </div>

                            </div>

                            <div class="layui-form-item">

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrInstruction001.mDate}">到期日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="mDate" name="mDate"
                                               data-th-value="${#dates.format(entity?.mDate,'yyyy-MM-dd')}"
                                               class="layui-input form-input input-dateSelect ps02"/>
                                    </div>
                                </div>

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrInstruction001.contractResult}">合同签署结果</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="contractResult" name="contractResult"
                                                class="layui-input form-input input-select"
                                                allowClear="true"
                                                placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.contractResult}"
                                                data-th-data-result='${CONTRACT_TYPE}'
                                                required>
                                        </select>
                                    </div>
                                </div>

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{EtrInstruction001.contractNo}">合同号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="contractNo" name="contractNo"
                                               data-th-value="${entity?.contractNo}"
                                               class="layui-input form-input " required/>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

            </div>
            <div class="pro-module-wrapper pro-module-block">
                <div
                        class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11"
                        style="margin: 50px;">
                    <div class="text-center">
                        <a id="EtrInstruction003_btn_save"
                           class="layui-btn layui-btn-sm btn-save"
                           data-th-text="保存">保存</a>
                        <a
                                id="EtrInstruction003_btn_submit1"
                                class="layui-btn layui-btn-sm btn-submit"
                                data-th-text="提交">提交</a>
                        <a
                                id="EtrInstruction003_btn_cancel"
                                class="layui-btn layui-btn-sm btn-cancel"
                                data-th-text="#{SysCommon.cancel}">取消</a>

                    </div>
                </div>
            </div>
        </div>

    </form>
</div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var workflowId = /*[[${entity?.workflowId}]]*/'';
        var sysDate = /*[[${sysDate}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/entrust/etrinstruction/EtrInstruction003.js}"
            type="text/javascript"></script>
</div>
</body>

</html>
