<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{EtrWtFxswap002}">外汇掉期指令新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="pro-module-container">
            <form class="layui-form joyin-form-wrap pro-module-form" id="searchForm">
                <div class="pro-module-wrapper pro-module-base">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">基本信息</span>
                                （
                                <span class="star-sign">*</span>
                                必填）
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <input type="hidden" id="finprodIdhid" name="finprodId" th:value="${entity?.finprodId}">
                            <input type="hidden" id="finvdate" name="finvdate" >
                            <input type="hidden" id="finmdate" name="finmdate" >
                            <input type="text" id="entrustId" name="entrustId" disabled="disabled"
                                        style="display: none;" data-th-value="${entity?.entrustId}">
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrWtFxswap002.portfolioId}">组合代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption=true required="required"
                                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}"
                                                data-th-initvalue="${entity?.portfolioId}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrWtFxswap002.vdate}">指令开始日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input class="layui-input form-input input-dateSelect" id="vdate"
                                                name="vdate" placeholder="请选择时间" disabled="disabled"
                                                data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'
                                                required="required"/>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrWtFxswap002.mdate}">指令终止日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input class="layui-input form-input input-dateSelect" id="mdate"
                                                name="mdate" placeholder="请选择时间" disabled="disabled"
                                                data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
                                                required="required"/>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                 <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrWtFxswap002.termType}">期限类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="termType" name="termType"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-result="${EXC_FXS_TERM_TYPE}"
                                                th:initValue="${entity?.termType}"
                                                required="required">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrWtFxswap002.proximalDeliveryDate}">近端交割日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input class="layui-input form-input input-dateRangeSelect" id="proximalDeliveryDate"
                                                name="proximalDeliveryDate" placeholder="请选择时间"
                                                data-th-value="${entity?.proximalDeliveryDate}"
                                                />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrWtFxswap002.remoteDeliveryDate}">远端交割日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input class="layui-input form-input input-dateRangeSelect" id="remoteDeliveryDate"
                                                name="remoteDeliveryDate" placeholder="请选择时间"
                                                data-th-value="${entity?.remoteDeliveryDate}"
                                               />
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrWtFxswap002.tradeType}">交易类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="tradeType" name="tradeType" childrenIds="ccyPair"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                required="required" data-th-data-result='${EXC_DEAL_TYPE}'
                                                th:initValue="*{entity?.tradeType?:EXC_DEAL_TYPE_default}">
                                            </select>
                                        </div>
                                    </div>
                                     <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrWtFxswap002.ccyPair}">货币对</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="ccyPair" name="ccyPair" childrenIds="tradeCcy" parentIds="tradeType"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                required="required" data-th-data-result='${CYY_PAIR}'
                                                th:initValue="${entity?.ccyPair}"
                                                >
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrWtFxswap002.tradePs}">交易方向</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="tradePs" name="tradePs"
                                                class="layui-input form-input input-select"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-result='${PS}'
                                                th:initValue="${entity?.tradePs}"
                                                required="required">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                   <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrWtFxswap002.tradeCcy}">交易货币</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="tradeCcy" name="tradeCcy" parentIds="ccyPair"
                                                allowClear="true"
                                                class="layui-input form-input input-select"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                th:initValue="${entity?.tradeCcy}"
                                                data-th-data-result='${CCY}'
                                                required="required">
                                             </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrWtFxswap002.tradeAmt}">交易货币金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="tradeAmt" name="tradeAmt" placeholder="请输入内容"
                                                data-pattern="" data-fixtype="2" maxlength="16" required="required"
                                                class="layui-input form-input text-money"
                                                data-th-value="${entity?.tradeAmt}"
                                                />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrWtFxswap002.tradeCcyAvailablePosition}">交易货币可用持仓</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="tradeCcyAvailablePosition" name="tradeCcyAvailablePosition"
                                                class="layui-input form-input text-number" placeholder="请输入内容"
                                                data-fixtype="2"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.tradeCcyAvailablePosition}"
                                                disabled="disabled"/>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrWtFxswap002.contraCcy}">对应货币</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="contraCcy" name="contraCcy"
                                                class="layui-input form-input input-select"
                                                allowClear="true"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                th:initValue="${entity?.contraCcy}"
                                                data-th-data-result='${CCY}'
                                                disabled="disabled">
                                             </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrWtFxswap002.swapsPoint}">掉期点</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="swapsPoint" name="swapsPoint" placeholder="请输入内容"
                                                data-pattern="" data-fixtype="2" maxlength="16"
                                                class="layui-input form-input text-money"
                                                data-th-value="${entity?.swapsPoint}"
                                                />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrWtFxswap002.tradeCcyAcct}">交易货币账户</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="tradeCcyAcct" name="tradeCcyAcct"
                                                class="layui-input form-input input-select"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-result='${TRADE_CCY_ACCT}'
                                                th:initValue="${entity?.tradeCcyAcct}"
                                                required="required">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                   <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrWtFxswap002.contraCcyAcct}">对应货币账户</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="contraCcyAcct" name="contraCcyAcct"
                                                class="layui-input form-input input-select"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-result='${CONTRA_CCY_ACCT}'
                                                th:initValue="${entity?.contraCcyAcct}"
                                                required="required">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                        </div>
                    </div>
                    <!-- 引业务组件投资委托人员信息组件 -->
                    <div class="page-component" th:data-path="@{/component/trade/BussEtrInvestPersonInfo/init}"
                        th:data-params="|{entityName: 'etrInvestPersonInfo',counterType:'${COUNTER_TYPE_01}', pageFrom: 'submitForm',entity:'${person_entity}',single:'1'}|"></div>
                    <!-- 引业务组件附件信息组件 -->
                    <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                        th:data-params="|{entityName: 'FileCommon',businessId: '${businessId ?: ''}'}|"></div>
                    <div id="ramark_DIV" class="pro-module-wrap">
                            <div class="pro-module">
                                <h3 class="pro-module-title">
                                    <span class="title-des">备注</span>
                                </h3>
                                <div class="pro-module-item" style="padding-bottom: 8px;">
                                    <div class="layui-form-item">
                                        <div class="form-inline-wrap" style="width: 100%;">
                                            <div class="layui-input-inline input-inline"
                                                 style="margin: 0 10px; width: 98% !important;">
                                            <textarea id="remark" name="remark" placeholder="请输入内容"
                                                      data-th-placeholder="#{SysCommon.placeholder}" maxlength="200"
                                                      class="layui-textarea" data-th-text="${entity?.remark}">
                                             </textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    <!-- 风险试算 -->
                    <div th:if="${isEleShow['EtrWtFxswap002_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component"
                         th:data-path="@{/component/common/BaseRiskMathComm/init}"
                         th:data-params="|{entity: '${riskTrialRetDto}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>
                </div>
                <div class="pro-module-wrapper pro-module-block">
                    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                        <div class="text-center">
                            <a th:if="${isEleShow['EtrWtFxswap002_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'"
                               id="EtrWtFxswap002_btn_riskcal" class="layui-btn layui-btn-sm"
                               data-th-text="#{EtrWtFxswap002.riskcal}">风险试算</a>
                            <a id="EtrWtFxswap002_btn_save" class="layui-btn layui-btn-sm btn-save"
                                data-th-text="#{SysCommon.save}">保存</a>
                            <a id="EtrWtFxswap002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                                data-th-text="#{SysCommon.submit}">提交</a>
                            <a id="EtrWtFxswap002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                                data-th-text="#{SysCommon.cancel}">取消</a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div layout:fragment="script">
            <script th:inline="javascript" type="text/javascript">
            var tradePsValue = /*[[${tradePs}]]*/'';
            var termType1 = /*[[${termType1}]]*/'';
            var termType2 = /*[[${termType2}]]*/'';
            var termType3 = /*[[${termType3}]]*/'';
            var termType4 = /*[[${termType4}]]*/'';
            var termType5 = /*[[${termType5}]]*/'';
            var fintype = /*[[${fintype}]]*/'';
            var MY_SUP_TIME_TYPE_01 = /*[[${MY_SUP_TIME_TYPE_01}]]*/'';
            var USE_STATUS_01 = /*[[${USE_STATUS_01}]]*/'';
            var acctType = /*[[${acctType}]]*/'';
            var sysDate = /*[[${sysDate}]]*/'';
            var PINAN_ASSET_TYPE_F15 = /*[[${PINAN_ASSET_TYPE_F15}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/entrust/etrwtfxswap/EtrWtFxswap002.js?v1}" type="text/javascript"></script>
    </div>
</body>
</html>
