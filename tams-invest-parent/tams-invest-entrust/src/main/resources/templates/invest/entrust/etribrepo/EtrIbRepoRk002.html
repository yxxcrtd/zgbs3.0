<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="质押券库新建">质押券库新建</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <input id="workflowId" name="workflowId" data-th-value="${workflowId}" type="hidden">
        <input id="pledgeStockId" name="pledgeStockId" data-th-value="${entity?.pledgeStockId}" type="hidden">
        <div class="layui-form-item">
            <div>
                <label class="layui-form-label form-label-wrap"
                       data-th-text="质押券库" style="width: 25%">质押券库</label>
                <div class="layui-input-inline input-inline" style="width: 70%!important;">
                    <input type="text" id="EtrIbRepoRk002_pledgeStockName" name="pledgeStockName" data-th-value='${entity?.pledgeStockName}'
                           class="layui-input form-input" placeholder="请输入内容" required="required"/>
                </div>
            </div>
        </div>
    </form>
    <div class="layui-col-md10" style="margin-top: 40px;">
        <div class="text-center">
        	<!-- <a id="EtrIbRepoRk002_btn_save"
               class="layui-btn layui-btn-sm btn-save"
               data-th-text="#{SysCommon.save}">保存</a> -->
            <a id="EtrIbRepoRk002_btn_submit"
               class="layui-btn layui-btn-sm btn-submit"
               data-th-text="#{SysCommon.save}">保存</a>
            <a id="EtrIbRepoRk002_btn_cancel"
               class="layui-btn layui-btn-sm btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
    	var workflowId = /*[[${workflowId}]]*/ ;
    </script>
    <script data-th-src="@{/js/invest/entrust/etribrepo/EtrIbRepoRk002.js}"
            type="text/javascript">
    </script>
</div>
</body>
</html>
