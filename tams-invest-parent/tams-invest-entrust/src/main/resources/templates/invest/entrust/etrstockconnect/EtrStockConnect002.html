<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{EtrStockConnect002}">港股通委托新建</title>
    <style>
        .price-boundary
        {
            height: 25px;
            padding: 0px 0;
        }

        .price-boundary .typical-price
        {
            float: left;
            width: 33.3%;
            height: 25px;
            line-height: 25px
        }

        .price-boundary .typical-price a
        {
            padding-left: 5px
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <img id="enlarge" th:src="@{'/img/enlarge.png'}" style="width: 24px;height: 24px; cursor: pointer;"></img>
        <img id="narrow" th:src="@{'/img/narrow.png'}" style="width: 24px;height: 24px; cursor: pointer; display: none;"></img>
        <div class="price-boundary" id = "cashPositionInfo">
            <div class="typical-price item-kyje" id="accAvailableCash_div" >港股通可用金额(元):<a id="accAvailableCash" class="price-anchor">0.00</a></div>
            <div class="typical-price item-kyje" id="positionNum_div">持仓数量:<a id="positionNum" class="price-anchor">0.00</a></div>
            <div class="typical-price item-kmsl" id="availableNum_div">可卖数量:<a id="availableNum" class="price-anchor">0.00</a></div>
        </div>
        <!-- 指令新建 -->
        <div class="pro-module-container">
            <form class="layui-form joyin-form-wrap pro-module-form" id = 'sumbitForm'>
               <input type="hidden" id="finprodIdhid" name="finprodId" th:value="${entity?.finprodId}">
                <input type="hidden" id="finprodType2" name="finprodType2" data-th-value="${entity?.finprodType2}">
                <input type="hidden" id="tradeMarket" name="tradeMarket" data-th-value="${entity?.tradeMarket}">
                <input type="hidden" id="invManagerId" name="invManagerId" data-th-value="${entity?.invManagerId}">
                <input type="text" id="entrustId" name="entrustId" disabled="disabled" style="display: none;" data-th-value="${entity?.entrustId}">
                <input type="text" id="entrustStatus" name="entrustStatus" disabled="disabled" style="display: none;" data-th-value="${entity?.entrustStatus}">
                <input type="hidden" id="ccy" name="ccy" th:value="${entity?.ccy}"/>
                <input type="hidden" id="referenceRateIn" name="referenceRateIn"/>
                <input type="hidden" id="referenceRateOut" name="referenceRateOut">
                <input type="hidden" id="secAcctId" name="secAcctId" th:value="${entity?.secAcctId}"/>
                <input type="hidden" id="acctNo" name="acctNo" th:value="${entity?.acctNo}"/>

                <!-- 可用现金 -->
                <input type="hidden" id="proAvailableCash" name="proAvailableCash" th:value="${entity?.proAvailableCash}">
                <input type="hidden" id="assetAvailablePosition" name="assetAvailablePosition" th:value="${entity?.assetAvailablePosition}">
                <div class="layui-form-item">
<!--                    <div class="form-inline-wrap" style=" width: 50%; padding:0px;">-->
<!--                        <label class="layui-form-label form-lable" style="width: 100px" data-th-text="#{EtrStockConnect002.portfolioName}">组合名称</label>-->
<!--                        <div class="layui-input-inline input-inline" style="margin: 0px; margin-left: auto">-->
<!--                            <select type="text" id="parentPortfolioId" name="parentPortfolioId" childrenIds="portfolioId" class="layui-input form-input input-select" th:placeholder="#{SysCommon.placeholder}" placeholder="请输入内容"-->
<!--                                    data-th-data-url="@{/business/common/CommonSelect/selectParentPortfolioId}" allowClear="true" formatoption="true" data-th-initvalue="${entity?.parentPortfolioId}" required>-->
<!--                            </select>-->
<!--                        </div>-->
<!--                    </div>-->
                    <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                        <label class="layui-form-label form-lable" style="width: 100px" data-th-text="#{EtrStockConnect002.portfolioName}">组合名称</label>
                        <div class="layui-input-inline input-inline" style="margin: 0px; margin-left: auto">
                            <select type="text" id="portfolioId" name="portfolioId" class="layui-input form-input input-select" th:placeholder="#{SysCommon.placeholder}" placeholder="请输入内容"
<!--                                    parentIds="parentPortfolioId"-->
                                    data-th-data-url="@{/business/common/CommonSelect/qryPortfolioIdChildByRequestParam}" allowClear="true" formatoption="true" th:initValue="${entity?.portfolioId}" required>
                            </select>
                        </div>
                    </div>

                    <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                        <label class="layui-form-label form-lable" style="width: 100px" data-th-text="#{EtrStockConnect002.finprodName}">资产代码</label>
                        <div class="layui-input-inline input-inline" style="margin: 0px; margin-left: auto">
                            <select type="text" id="finprodId" name="finprodMarketId" class="layui-input form-input input-select" th:placeholder="#{SysCommon.placeholder}" placeholder="请输入内容"
                                    data-th-data-url="@{/invest/entrust/etrstockconnect/EtrStockConnect002/getfinprodIdForAdd}"
                                    allowClear="true"  formatoption="true" th:initValue="${entity?.finprodMarketId}" required>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                        <label class="layui-form-label form-lable" style="width: 100px" data-th-text="#{EtrStockConnect002.hkseMarket}">港股通市场</label>
                        <div class="layui-input-inline input-inline" style="margin: 0px; margin-left: auto">
                            <select required type="text" id="hkseMarket" name="hkseMarket" allowClear="true" disabled="disabled"
                                    class="layui-input form-input input-select" data-th-data-result='${SH_OR_ZH}'
                                    data-th-placeholder="#{SysCommon.placeholder}" formatoption="true" data-th-initvalue="${entity?.hkseMarket}">
                            </select>
                        </div>
                    </div>

                    <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                        <label class="layui-form-label form-lable" style="width: 100px" data-th-text="#{EtrStockConnect002.ps}">委托方向</label>
                        <div class="layui-input-inline input-inline" style="margin: 0px; margin-left: auto">
                            <select required type="text" id="ps" name="ps" allowClear="true" class="layui-input form-input input-select" data-th-data-result='${PS}'
                                    data-th-placeholder="#{SysCommon.placeholder}" formatoption="true" data-th-initvalue="${entity?.ps}">
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">

                    <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                        <label class="layui-form-label form-lable" style="width: 100px" th:text="#{EtrStockConnect002.targetType}">目标类型</label>
                        <div class="layui-input-inline input-inline" style="margin: 0px; margin-left: auto">
                            <select type="text" id="targetType" name="targetType" class="layui-input form-input input-select" th:placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result='${TARGET_CLASS}' allowClear="true" th:initValue="${entity?.targetType}" required>
                            </select>
                        </div>
                    </div>

                    <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                        <label class="layui-form-label form-lable" style="width: 100px" th:text="#{EtrStockConnect002.priceModel}">价格模式</label>
                        <div class="layui-input-inline input-inline" style="margin: 0px; margin-left: auto">
                            <select type="text" id="priceModel" name="priceModel" class="layui-input form-input input-select" th:placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result='${PRICE_MODEL}' allowClear="true" th:initValue="${entity?.priceModel}" required>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">

                    <div class="form-inline-wrap" style=" width: 50%; padding:0px;" id="entrustPrice_div">
                        <label id="entrustPrice_label" class="layui-form-label form-lable" style="width: 100px" data-th-text="#{EtrStockConnect002.price}">指令价格</label>
                        <div class="layui-input-inline input-inline" style="margin: 0px; margin-left: auto">
                            <input type="text" id="price" name="price" placeholder="请输入内容"
                                   data-pattern="" data-fixtype="2" data-textrange='2'
                                   class="layui-input form-input text-number" data-th-value="${entity?.price}" required="required" autocomplete="off" maxlength=9>
                            <span id="entrustPriceUnit" class="input-right-show">港元</span>
                        </div>
                    </div>

                    <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                        <label id="entrustNum_label" class="layui-form-label form-lable" style="width: 100px" data-th-text="#{EtrStockConnect002.entrustNum}">指令数量</label>
                        <div class="layui-input-inline input-inline" style="margin: 0px; margin-left: auto">
                            <input type="text" id="entrustNum" name="entrustNum" placeholder="请输入内容"
                                   data-pattern="" data-fixtype="2" data-textrange='0'
                                   class="layui-input form-input text-number" data-th-value="${entity?.entrustNum}" required="required" autocomplete="off" maxlength=9>
                            <span id="entrustNumUnit" class="input-right-show">股/手</span>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">

                    <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                        <label class="layui-form-label form-lable" style="width: 100px" data-th-text="#{EtrStockConnect002.entrustAmt}">指令金额</label>
                        <div class="layui-input-inline input-inline" style="margin: 0px; margin-left: auto">
                            <input type="text" id="entrustAmtHk" name="entrustAmtHk" placeholder="请输入内容"
                                   data-pattern="" data-fixtype="2" data-textrange='2' required="required"
                                   class="layui-input form-input text-number" data-th-value="${entity?.entrustAmtHk}" autocomplete="off"  maxlength=9 >
                            <span class="input-right-show">港元</span>
                        </div>
                    </div>

                    <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                        <label  class="layui-form-label form-lable" style="width: 100px" data-th-text="#{EtrStockConnect002.entrustAmt}">指令金额</label>
                        <div class="layui-input-inline input-inline" style="margin: 0px; margin-left: auto">
                            <input type="text" id="entrustAmt" name="entrustAmt" placeholder="请输入内容"
                                   data-pattern="" data-fixtype="2" data-textrange='2' disabled="disabled" required="required"
                                   class="layui-input form-input text-number" data-th-value="${entity?.entrustAmt}"  autocomplete="off" maxlength=9>
                            <span class="input-right-show">元</span>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                        <label class="layui-form-label form-lable" style="width: 100px" data-th-text="#{EtrStockConnect002.vdate}">开始日期</label>
                        <div class="layui-input-inline input-inline" style="margin: 0px; margin-left: auto">
                            <input required class="layui-input form-input input-dateSelect" id="vdate" name="vdate" placeholder="请选择时间" data-th-value="${iPlatformDate}" disabled="disabled">
                        </div>
                    </div>
                    <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                        <label class="layui-form-label form-lable" style="width: 100px" data-th-text="#{EtrStockConnect002.mdate}">结束日期</label>
                        <div class="layui-input-inline input-inline" style="margin: 0px; margin-left: auto">
                            <input required class="layui-input form-input input-dateSelect" id="mdate" name="mdate" placeholder="请选择时间" data-th-value="${iPlatformDate}" disabled="disabled">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                        <label class="layui-form-label form-lable" style="width: 100px" data-th-text="#{EtrStockConnect002.referenceRate}">参考汇率</label>
                        <div class="layui-input-inline input-inline" style="margin: 0px; margin-left: auto">
                            <input type="text" id="referenceRateStr" name="referenceRateStr" disabled="disabled" class="layui-input form-input" placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.referenceRateStr}">
                        </div>
                    </div>
                    <div class="form-inline-wrap" style=" width: 50%; padding:0px;" id = 'saleCode_dev'>
                        <label class="layui-form-label form-lable" style="width: 100px" data-th-text="#{EtrStockConnect002.saleCode}">配售代码</label>
                        <div class="layui-input-inline input-inline" style="margin: 0px; margin-left: auto">
                            <input type="text" id="saleCode" name="saleCode" required="required"
                                   class="layui-input form-input" placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.saleCode}">
                        </div>
                    </div>
                </div>
                <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px">
                    <div class="text-center">
                        <a id="EtrStockConnect002_btn_riskcal" class="layui-btn layui-btn-sm" data-th-text="#{EtrStockConnect002.riskcal}">风险试算</a>
                        <a id="EtrStockConnect002_btn_save" class="layui-btn layui-btn-sm btn-save" style="display: none" data-th-text="#{SysCommon.save}">保存</a>
                        <a id="EtrStockConnect002_btn_submit" class="layui-btn layui-btn-sm btn-submit" style="display: none" data-th-text="#{SysCommon.submit}">提交</a>
                    </div>
                    <div
                            id="baseRiskMathComm"
                            class="page-component"
                            style="display: none"
                            th:data-path="@{/component/common/BaseRiskMathComm/init}"
                            th:data-params="|{workflowId: '${workflowId}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"
                    ></div>
                </div>
            </form>
        </div>
    </div>
   <div layout:fragment="script">
       <script th:inline="javascript" type="text/javascript">
              var todoList = /*[[${todoList}]]*/'';
              var FINPROD_TYPE_TG_F10 = /*[[${FINPROD_TYPE_TG_F10}]]*/'';//股票
              var PS_T01 = /*[[${PS_T01}]]*/'';
              var PS_T02 = /*[[${PS_T02}]]*/'';
              var PS_T46 = /*[[${PS_T46}]]*/'';
              var PS_T47 = /*[[${PS_T47}]]*/'';
              var PS_T104 = /*[[${PS_T104}]]*/'';
              var PRICE_MODEL_PRM01 = /*[[${PRICE_MODEL_PRM01}]]*/'';
              var PRICE_MODEL_PRM02 = /*[[${PRICE_MODEL_PRM02}]]*/'';
              var PRICE_MODEL_PRM03 = /*[[${PRICE_MODEL_PRM03}]]*/'';
              var TARGET_CLASS_01 = /*[[${TARGET_CLASS_01}]]*/''; // 数量
              var TARGET_CLASS_02 = /*[[${TARGET_CLASS_02}]]*/''; // 金额
              var iPlatformDate = /*[[${iPlatformDate}]]*/'';
              var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';

              var HKSE_MARKET_01 = /*[[${HKSE_MARKET_01}]]*/''; // 沪
              var HKSE_MARKET_02= /*[[${HKSE_MARKET_02}]]*/''; // 深
              var HKSE_MARKET_03 = /*[[${HKSE_MARKET_03}]]*/''; // 否
              var HKSE_MARKET_04= /*[[${HKSE_MARKET_04}]]*/''; // 沪深

              var TRADE_PLACE_03 = /*[[${TRADE_PLACE_03}]]*/''; // 沪
              var TRADE_PLACE_04 = /*[[${TRADE_PLACE_04}]]*/''; // 深
              var TRADE_PLACE_06 = /*[[${TRADE_PLACE_06}]]*/''; // 港

              var default_ccy= /*[[${default_ccy}]]*/''; // 人民币

       </script>
       <script data-th-src="@{/js/invest/entrust/etrstockconnect/EtrStockConnect002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
