<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{EtrIbRepoRk}">资产系列管理</title>
    <style>
        .input-btn-append a{
            color: #2693ff;
            line-height: 24px;
        }
        .icon-upload{
            color:limegreen;
        }
        .delt{
            color: red;
        }
        .del{
            color: red;
        }
        .iconinput{color:blue}
        .mixtree-node{
            height: 30px;
            padding: 10px;
            color:rgb(119, 119, 119);
            cursor: pointer;
            border-bottom: dashed 1px #dbdbdb;
        }
        .btn-trans:hover {
            boder-right: solid 1px #dbdbdb;
            boder-bottom: solid 1px #dbdbdb;
        }
        .mixtree-node:hover { background-color: #D9ECFF;}
        .node_div{width: 80%; display: inline-block;}
        .operate_div{
            width: 25%;
            padding: 3px;
            position: relative;
            display: none;
            top: -26px;
            left: 250px;}
        .btn-trans{background-color: transparent!important;border: 0px;font-weight: bold;}
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="layui-row">
        <form class="layui-form layui-col-md3" id="submitForm">
            <input style = "display:none;" id="code_hidden" />
            <div class="layui-form-item" style="border: 1px solid #ccc; padding: 5px; min-height: 460px; overflow:auto;">
                <!-- <div class="input-btn-append"> -->
                    <!-- <input type="text" id="schemeName" name="schemeName"
                           class="layui-input form-input input-fuzzy-text"
                           placeholder="请输入资产系列名称关键词" th:maxlength="200"
                           data-eventfunc="QueryFunc.serachKey"> -->
                    <a id="EtrIbRepoRk_btn_creat" class="layui-btn layui-btn-sm btn-create btn-trans"
                       data-th-text="#{SysCommon.create}" style="float: right; padding-right: 5px;margin-top: 3px;color: yellowgreen;border: 0px!important;">新建</a>
                <!-- </div> -->
                <div id="mixTree"></div>
            </div>
        </form>
        <div class="layui-col-md6" >
            <div>
                <table class="layui-table" id="etrSecStockConfig"></table>
            </div>
            <div class="text-center">
                <a id="EtrIbRepoRk_btn_submit"
                   class="layui-btn layui-btn-sm btn-submit"
                   data-th-text="#{SysCommon.save}">提交</a>
                <a id="EtrIbRepoRk002_btn_reset"
                   class="layui-btn layui-btn-sm btn-reset"
                   data-th-text="重置">取消</a>
            </div>
        </div>
        <form class="layui-form layui-col-md3" id="submitForm2" style="float:right;padding-left:10px;">
            <h3 style="line-height: 41px;float: left;">适用组合----------------</h3>
            <div class="layui-form-item">
                <div  style="float: left;width: 200px;">
                    <select type="text" id="portfolioId" name="portfolioId"
											class="layui-input form-input input-select"
											placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId}"
											data-th-value="${entity?.portfolioId}" multiple="true">
										</select>
                </div>
                <!-- <input type="hidden" id="pledgeStockId" th:value="${entity?.pledgeStockId}" /> -->
                <a id="EtrIbRepoRk_btn_select" class="layui-btn layui-btn-sm" style="float: right;"><span data-th-text="筛选"></a>
            	<a id="EtrIbRepoRk_btn_sele"
                   class="layui-btn layui-btn-sm"
                   data-th-text="查询">提交</a>
            </div>
            <div class="layui-input" style="border: 1px solid #dbdbdb; scroll-y: auto; scroll-x: hidden; overflow-y: scroll;" data-checkall="false"
                 id='typeDatatree' name="ptlSecStock" data-canedit='1' data-roottitle=''
                 data-th-url='|@{/invest/entrust/etribrepo/EtrIbRepoRk/getInterGroup}'></div>
        </form>
    </div>
</div>
<div layout:fragment="script">
	<script th:inline="javascript" type="text/javascript">
		var WINDTYPEONE = /*[[${WINDTYPEONE}]]*/''; // 一级分类
	    var WINDTYPETWO = /*[[${WINDTYPETWO}]]*/''; // 二级分类
        var CUSTOM_ASSET_TYPE_TWO = /*[[${CUSTOM_ASSET_TYPE_TWO}]]*/''; // 一级分类
        var CUSTOM_ASSET_TYPE_THREE = /*[[${CUSTOM_ASSET_TYPE_THREE}]]*/''; // 二级分类
        var MAIN_GRADE_RESULT = /*[[${MAIN_GRADE_RESULT}]]*/'';//评级
		var YES_OR_NO = /*[[${YES_OR_NO}]]*/''; // 是否
		var entity_etrSecStockConfig = eval(/*[[${entity_etrSecStockConfig}]]*/'');
		var entity_ptlSecStock = eval(/*[[${entity_ptlSecStock}]]*/'');
	</script>
    <script
            data-th-src="@{/js/invest/entrust/etribrepo/EtrIbRepoRk.js}" type="text/javascript">
    </script>
</div>
</body>
</html>
