                                <div class="layui-form-item">

                                            <label class="layui-form-label form-lable">托管户剩余现金</label>

                                        </div>
                                    </div>

                                            <label class="layui-form-label form-label-wrap rate-text" style="float: left;display: inline-block;width: 6%;padding:0px;">T+</label>
                                            <input type="text" id="purSpeed" name="purSpeed"  class="layui-input form-input"
                                                   disabled onkeyup="if(this.value.length<=1){this.value=this.value.replace(/[^0-9]/g,'')}else{this.value=parseInt(this.value.replace(/\D/g,''))}" onafterpaste="if(this.value.length<=1){this.value=this.value.replace(/[^0-9]/g,'0')}else{this.value=parseInt(this.value.replace(/\D/g,''))}"
                                                   style="float: left;display: inline-block; width: 89%;"/>
                                        </div>
                                    </div>
                                    <div class=" form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap redSpeed"

                                            <label class="layui-form-label form-label-wrap rate-text" style="float: left;display: inline-block;width: 6%;padding:0px;">T+</label>
                                            <input type="text" id="redSpeed" name="redSpeed"  class="layui-input form-input"
                                                   disabled onkeyup="if(this.value.length<=1){this.value=this.value.replace(/[^0-9]/g,'')}else{this.value=parseInt(this.value.replace(/\D/g,''))}" onafterpaste="if(this.value.length<=1){this.value=this.value.replace(/[^0-9]/g,'0')}else{this.value=parseInt(this.value.replace(/\D/g,''))}"
                                                   style="float: left;display: inline-block; width: 89%;"/>
                                        </div>
                                    </div>
                                </div>
                            </div>
