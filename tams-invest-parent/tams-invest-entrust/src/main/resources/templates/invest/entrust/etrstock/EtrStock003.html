<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.w3.org/1999/xhtml"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{EtrStock003}">股票多对多指令</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="pro-module-container">
            <form class="layui-form joyin-form-wrap pro-module-form" id="searchForm">
                <div class="pro-module-wrapper pro-module-base">
                    <div id="combDistribt_div" class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">委托列表</span>（<span class="star-sign">*</span> 必填）<i
                                    class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div>
                                <table class="layui-table" id="dataTable" name="selectedItem"></table>
                            </div>
                        </div>
                    </div>
                    <!-- 风险试算 -->
                    <div th:if="${isEleShow['EtrStock003_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component"
                        th:data-path="@{/component/common/BaseRiskMathComm/init}"
                        th:data-params="|{workflowId: '${workflowId}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>
                </div>
                <div class="pro-module-wrapper pro-module-block">
                    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                        <div class="text-center">
                            <a th:if="${isEleShow['EtrStock003_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'"
                               id="EtrStock003_btn_riskcal" class="layui-btn layui-btn-sm"
                                data-th-text="#{EtrInvestBondInfo002.riskcal}">风险试算</a> <a id="EtrStock003_btn_submit"
                                class="layui-btn layui-btn-sm  btn-submit" data-th-text="#{SysCommon.submit}">提交</a> <a
                                id="EtrStock003_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                                data-th-text="#{SysCommon.cancel}">取消</a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div layout:fragment="script">
        <script th:inline="javascript" type="text/javascript">
                                    var sysDate = /*[[${sysDate}]]*/'';
                                    var entity = /*[[${entity}]]*/'';
                                    var workflowId = /*[[${workflowId}]]*/'';
                                    var tradeId = /*[[${tradeId}]]*/'';
                                    var todoList = /*[[${TodoList}]]*/'';
                                    var fintype = /*[[${fintype}]]*/'';
                                    var etrPs = /*[[${etrPs}]]*/'';
                                    var TRADE_PLACE = /*[[${TRADE_PLACE}]]*/'';
                                    var MY_SUP_TIME_TYPE_01 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
                                    var etrStockDtoList = /*[[${etrStockDtoList}]]*/'';
                                    var USE_STATUS_01 ='';
                                </script>
        <script data-th-src="@{/js/invest/entrust/etrstock/EtrStock003.js}" type="text/javascript"></script>
    </div>
</body>
</html>
