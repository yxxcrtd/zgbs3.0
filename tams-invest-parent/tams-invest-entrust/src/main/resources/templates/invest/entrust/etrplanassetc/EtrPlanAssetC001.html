<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{EtrPlanAssetC001}">计划类货币型委托</title>
</head>
<body>
	<div layout:fragment="content">
		<div class="form-button-area">
			<a id="EtrPlanAssetC001_btn_add"
				class="layui-btn layui-btn-sm btn-create"
				data-th-text="#{SysCommon.create}">新建</a> <a
				id="EtrPlanAssetC001_btn_close" class="layui-btn layui-btn-sm"><i
				class="iconfont icon-close"></i><span
				data-th-text="#{SysCommon.close}"></a> <a
				id="EtrPlanAssetC001_btn_revoke"
				class="layui-btn layui-btn-sm btn-revoke"><i
				class="iconfont icon-revoke"></i><span data-th-text="#{ETR_REVERT}"></a>
                <!-- add by zhangpuyu 2020/1/2 start  -->
                <a id="EtrPlanAssetC001_btn_import" class="layui-btn layui-btn-sm btn-import">
                <i class="iconfont icon-import"></i><span data-th-text="#{EtrPlanAssetC001.import}"></span></a>
                <!-- add by zhangpuyu 2020/1/2 end  -->
		</div>
		<div class="joyin-form-wrap joyin-filter-form condition-area">
			<form class="layui-form" id="searchForm">
				<div class="layui-form-item">
					<div
						class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							data-th-text="#{EtrPlanAssetC001.portfolioId}">组合代码</label>
						<div class="layui-input-inline input-inline">
							<select type="text" id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption=true multiple="multiple"
                                                data-th-data-url="@{/invest/entrust/etrplanassetc/EtrPlanAssetC002/getentrustIdAdd}"
                                                data-th-initvalue="${entity?.portfolioId}">
                                            </select>
						</div>
					</div>
					<!--添加二-四级分类查询条件 lishuping 2019/7/29 start-->
					<!--<div
						class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4" >
						<label class="layui-form-label form-lable"
							data-th-text="#{EtrPlanAssetC001.assetType1}">资产类型</label>
						<div class="layui-input-inline input-inline">
							<select type="text" id="assetType1" name="assetType1"
								multiple="multiple" class="layui-input form-input input-select"
								data-th-data-result='${PLAN_ASSET_TYPE}' allowClear="true"
								placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								formatoption="true">
							</select>
						</div>
					</div>-->
					<div
							class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							   data-th-text="#{EtrPlanAssetC001.type9}">资产二级分类</label>
						<div class="layui-input-inline input-inline">
							<select type="text" id="assetType1" name="assetType1"
									multiple="multiple" class="layui-input form-input input-select"
									data-th-data-result='${CUSTOM_ASSET_TYPE_TWO}' allowClear="true"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									formatoption="true">
							</select>
						</div>
					</div>
					<div
							class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							   data-th-text="#{EtrPlanAssetC001.type10}">资产三级分类</label>
						<div class="layui-input-inline input-inline">
							<select type="text" id="assetType10" name="assetType10"
									multiple="multiple" class="layui-input form-input input-select"
									data-th-data-result='${CUSTOM_ASSET_TYPE_THREE}' allowClear="true"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									formatoption="true">
							</select>
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div
							class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4" style="display: none" id = "assetType11Div">
						<label class="layui-form-label form-lable"
							   data-th-text="#{EtrPlanAssetC001.type11}">资产四级分类</label>
						<div class="layui-input-inline input-inline">
							<select type="text" id="assetType11" name="assetType11"
									multiple="multiple" class="layui-input form-input input-select"
									data-th-data-result='${CUSTOM_ASSET_TYPE_FOUR}' allowClear="true"
									placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}"
									formatoption="true">
							</select>
						</div>
					</div>
					<!--添加二-四级分类查询条件 lishuping 2019/7/29 end-->
					<div
						class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							data-th-text="#{EtrPlanAssetC001.ccy}">币种</label>
						<div class="layui-input-inline input-inline">
							<select type="text" id="ccy" name="ccy"
								class="layui-input form-input input-select"
								data-th-data-result='${CCY}' allowClear="true"
								placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								formatoption="true">
							</select>
						</div>
					</div>


					<div
						class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							data-th-text="#{EtrPlanAssetC001.finprodId}">资产代码</label>
						<div class="layui-input-inline input-inline">
							<input type="text"
								class="layui-input form-input input-lenovoselect" id="finprodId"
								name="finprodId" data-th-placeholder="#{SysCommon.placeholder}"
								data-idfield="code" data-keyfield="name"
								data-th-data-effectivefieldsalias='|{"code":"#{EtrInvestAllInfo001.finprodId}",
                                    "shortName":"#{EtrInvestAllInfo001.finprodName}"}|'
								data-th-data-url="@{/invest/entrust/etrplanassetc/EtrPlanAssetC001/getfinprodId}"
								maxlength="60">
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div
						class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							data-th-text="#{EtrPlanAssetC001.ps}">交易方向</label>
						<div class="layui-input-inline input-inline">
							<select type="text" id="ps" name="ps"
								class="layui-input form-input input-select"
								data-th-data-result='${PS}' allowClear="true"
								placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								formatoption="true">
							</select>
						</div>
					</div>
					<div
						class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							data-th-text="#{EtrPlanAssetC001.entrustStatus}">委托状态</label>
						<div class="layui-input-inline input-inline">
							<select type="text" id="entrustStatus" name="entrustStatus"
								class="layui-input form-input input-select"
								data-th-data-result='${ENTRUST_STATUS}' allowClear="true"
								placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								formatoption="true">
							</select>
						</div>
					</div>


					<div
						class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							data-th-text="#{EtrPlanAssetC001.entrustDate}">委托日期</label>
						<div class="layui-input-inline input-inline">
							<input id='entrustDate' name='entrustDate'
								class="layui-input form-input input-dateRangeSelect"
								placeholder="请选择时间区间"
								data-th-placeholder="#{SysCommon.placeholder}">
						</div>
					</div>
				</div>
			</form>
		</div>
		<div>
			<table class="layui-table" id="dataTable"></table>
		</div>
	</div>
	<div layout:fragment="script">
	  <script th:inline="javascript" type="text/javascript">
	  var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
         </script>
		<script data-th-src="@{/js/invest/entrust/etrplanassetc/EtrPlanAssetC001.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
