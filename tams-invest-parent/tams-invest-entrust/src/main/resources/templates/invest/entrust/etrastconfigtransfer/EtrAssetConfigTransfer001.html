<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title data-th-text="#{EtrAssetConfigTransfer001}">资产配置快速转仓指令</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <!--资产配置按钮-->
        <a id="EtrAssetConfigTransfer001_btn_config" class="layui-btn layui-btn-sm btn-create">资产配置</a>
    </div>
    <!--查询条件-->
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{EtrAssetConfigTransfer001.portfolioId}">组合代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="portfolioId" name="portfolioId"
                                class="layui-input form-input input-select" allowClear="true"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                formatoption=true multiple="multiple"
                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?ww=false}"
                                data-th-initvalue="${entity?.portfolioId}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{EtrAssetConfigTransfer001.mDate}">到期日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="mDate" name="mDate" allowClear="true" class="layui-input form-input input-dateRangeSelect"
                               placeholder="请选择时间区间" data-th-placeholder="#{SysCommon.placeholder}">
                        </input>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var platDate = /*[[${platDate}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/entrust/etrastconfigtransfer/EtrAssetConfigTransfer001.js}" type="text/javascript"></script>
</div>
</body>
</html>
