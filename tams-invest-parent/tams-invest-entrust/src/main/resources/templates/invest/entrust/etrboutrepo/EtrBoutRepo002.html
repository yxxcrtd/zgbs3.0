                                                required="required" data-th-initvalue="${entity?.calendarId}">
                                            </select>
                                        </div>
                                    </div>

                                        <div class="layui-input-inline input-inline">

                                                    data-th-data-url="@{/invest/entrust/etrboutrepo/EtrBoutRepo002/getSecManageAcctId}"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initvalue="${entity?.securitiesCust}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" style="display: none" id="accAvailableCash_div">

                                                   class="layui-input form-input text-number" disabled="disabled"
                                                   data-th-value="${entity?.accAvailableCash}" />
                                        </div>
                                    </div>

                                    <div id="expectedCashAvailable_div" class="form-inline-wrap" Style="display: none">
                                        <label class="layui-form-label form-lable" data-th-text="#{CommonLabel.expectedCashAvailable}">预计委托可用现金</label>
                                        <div class="layui-input-inline input-inline">

                                                   disabled
                                                   data-moneymemory="" >
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                    <!-- 引业务组件投资委托人员信息组件 -->
                    <div class="page-component" th:data-path="@{/component/trade/BussEtrInvestPersonInfo/init}"
                        th:data-params="|{entityName: 'etrInvestPersonInfo',entity:'${person_entity}', innerTrade: false}|"></div>
                    <!--质押券信息-->

                    <!-- 引业务组件附件信息组件 -->

                        <div class="pro-module">

                                <span class="title-des">备注</span>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98% !important;">
                                        <textarea id="remark" name="remark" placeholder="请输入内容"

                                                  data-th-text="${entity?.remark}"></textarea>
                                    </div>
                                </div>
                            </div>
