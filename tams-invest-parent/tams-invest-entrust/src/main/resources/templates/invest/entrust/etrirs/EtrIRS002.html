<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
<title data-th-text="#{EtrIRS002}">利率互换投资委托新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form" id="searchForm">
                <div class="pro-module-wrapper pro-module-base">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">基本信息</span>
                                （
                                <span class="star-sign">*</span>
                                必填）
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrIRS.portfolioId}">组合代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption=true
                                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}"
                                                required="required" data-th-initvalue="${entity?.portfolioId}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrIRS.vdate}">指令开始日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input class="layui-input form-input input-dateSelect" id="vdate"
                                                name="vdate" placeholder="请选择时间" disabled="disabled"
                                                data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'
                                                required="required">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrIRS.mdate}">指令终止日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input class="layui-input form-input input-dateSelect" id="mdate"
                                                name="mdate" placeholder="请选择时间" disabled="disabled"
                                                data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
                                                required="required">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                
                                	<div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrIRS.dueDate}">到期日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input class="layui-input form-input input-dateRangeSelect" id="dueDate"
                                                name="dueDate" placeholder="请选择时间"
                                                data-th-value='${entity?.dueDate}'
                                               >
                                        </div>
                                    </div>
                                    
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrIRS.termType}">期限品种</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="termType" name="termType"
                                                 class="layui-input form-input input-select"
                                                data-th-data-result='${TERM_TYPE_IRS}'
                                                th:initValue="*{entity?.termType}"
                                                allowClear="true" placeholder="请输入内容"  
                                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true">
                                            </select>
                                        </div>
                                    </div>
                                    
                                    
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrIRS.ccy}">名义本金币种</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="ccy" name="ccy" 
                                                class="layui-input form-input input-select" data-th-data-result='${CCY}'
                                                allowClear="true" placeholder="请输入内容" disabled="disabled"
                                                data-th-placeholder="#{SysCommon.placeholder}" required="required"
                                                formatoption="true" data-th-initvalue="*{entity?.ccy}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrIRS.entrustAmt}">名义本金（万元）</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="entrustAmt" name="entrustAmt" placeholder="请输入内容"
                                                data-pattern=""  required="required" maxlength="16" data-textrange='6'
                                                class="layui-input form-input text-money"
                                                data-th-value="${entity?.entrustAmt}">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                    
                                     	<label class="layui-form-label form-lable" data-th-text="#{EtrIRS.busiPs}">互换方式</label>
				                        <div class="layui-input-inline input-inline">
				                            <select type="text" id="busiPs" name="busiPs"  class="layui-input form-input input-select"
				                                data-th-data-result='${IRS_TYPE}' allowClear="true" placeholder="请输入内容"
				                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true" required="required"
				                                th:initValue="*{entity?.busiPs}"
				                                 >
				                            </select>
				                        </div>
                                    </div>
                                    
                                     <div class="form-inline-wrap">
                                    
                                     	 <label class="layui-form-label form-lable" data-th-text="#{EtrIRS.dealMode}">挂钩利率</label>
					                        <div class="layui-input-inline input-inline">
					                            <select type="text" id="dealMode" name="dealMode" class="layui-input form-input input-select"
					                                data-th-data-result='${SECRATE_DATA}' allowClear="true" placeholder="请输入内容"
					                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true"  required="required"
													th:initValue="*{entity?.dealMode}" >
					                            </select>
					                        </div>
                                    </div>
                                    
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrIRS.matureYield}">固定利率%</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="matureYield" name="matureYield" placeholder="请输入内容"
                                                data-pattern=""  maxlength="16" required="required"
                                                class="layui-input form-input text-number" data-textrange='4'
                                                data-th-value="${entity?.matureYield}">
                                        </div>
                                    </div>
                                    <input type="text" id="entrustId" name="entrustId" disabled="disabled"
                                        style="display: none;" data-th-value="${entity?.entrustId}">
                                    <input type="text" id="entrustStatus" name="entrustId" disabled="disabled"
                                        style="display: none;" data-th-value="${entity?.entrustStatus}">
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- 引业务组件投资委托人员信息组件 -->
                    <div class="page-component" th:data-path="@{/component/trade/BussEtrInvestPersonInfo/init}"
                        th:data-params="|{entityName: 'etrInvestPersonInfo',entity:'${person_entity}', innerTrade: false}|"></div>
                    <!-- 引业务组件附件信息组件 -->
                    <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                        th:data-params="|{entityName: 'FileCommon', businessId: '${businessId ?: ''}'}|"></div>
                    <div id="ramark_DIV" class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">备注</span>
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item" style="padding-bottom: 8px;">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" style="width: 100%;">
                                        <div class="layui-input-inline input-inline"
                                            style="margin: 0 10px; width: 98% !important;">
                                            <textarea id="remark" name="remark" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" maxlength="200"
                                                class="layui-textarea" data-th-text="${entity?.remark}">
										        </textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- 风险试算 -->
                    <div th:if="${isEleShow['EtrIRS002_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component"
                        th:data-path="@{/component/common/BaseRiskMathComm/init}"
                        th:data-params="|{workflowId: '${workflowId}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>
                    <div class="pro-module-wrapper pro-module-block">
                        <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 20px 0;">
                            <div class="text-center">
                                <a th:if="${isEleShow['EtrIRS002_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'"
                                   id="EtrIRS002_btn_riskcal" class="layui-btn layui-btn-sm"
                                    data-th-text="#{EtrIRS.riskcal}">风险试算</a>
                                <a id="EtrIRS002_btn_save" class="layui-btn layui-btn-sm btn-save"
                                    data-th-text="#{SysCommon.save}">保存</a>
                                <a id="EtrIRS002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                                    data-th-text="#{SysCommon.submit}">提交</a>
                                <a id="EtrIRS002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                                    data-th-text="#{SysCommon.cancel}">取消</a>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div layout:fragment="script">
        <script th:inline="javascript" type="text/javascript">
        							// 风险试算用，待定 start
                                    var acctType = /*[[${acctType}]]*/'';
                                    var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
                                    var sysDate = /*[[${sysDate}]]*/'';
                                    var fintype_spotex = /*[[${fintype_spotex}]]*/'';
                                    // 风险试算用，待定 end
                                    var JPY = /*[[${JPY}]]*/'';
                                    var PINAN_ASSET_TYPE_F16 = /*[[${PINAN_ASSET_TYPE_F16}]]*/'';
                                </script>
        <script data-th-src="@{/js/component/trade/EtrForeignExchange.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/invest/entrust/etrirs/EtrIRS002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
