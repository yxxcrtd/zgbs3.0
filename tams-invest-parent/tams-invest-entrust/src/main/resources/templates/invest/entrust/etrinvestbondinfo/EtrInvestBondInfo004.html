<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title data-th-text="#{EtrInvestBondInfo004}">债券多对多指令新建</title>
</head>
<body>
<div layout:fragment="content">
        <form class="layui-form joyin-form-wrap pro-module-form" id="searchForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" data-th-text="#{EtrInvestBondInfo004.etrInvestBondInfoList}">委托列表</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <table class="layui-table" id="dataTable" name="selectedItem"></table>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 风险试算 -->
            <div th:if="${isEleShow['EtrInvestBondInfo004_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component"
                th:data-path="@{/component/common/BaseRiskMathComm/init}"
                th:data-params="|{workflowId: '${workflowId}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>
    </form>
    <!--  按钮 -->
    <div class="row text-center" style="margin: 20px 0;">
        <div class="text-center">
            <a th:if="${isEleShow['EtrInvestBondInfo004_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'"
               id="EtrInvestBondInfo004_btn_riskcal" class="layui-btn layui-btn-sm"
               data-th-text="#{EtrInvestBondInfo002.riskcal}">风险试算</a>
            <a id="EtrInvestBondInfo004_btn_submit" class="layui-btn layui-btn-sm btn-submit"
               data-th-text="#{SysCommon.submit}">提交</a>
            <a id="EtrInvestBondInfo004_cancel" class="layui-btn layui-btn-sm btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
    	var sysDate = /*[[${sysDate}]]*/'';
        var etrInvestBondInfoList = /*[[${etrInvestBondInfoList}]]*/'';
        var workflowId = /*[[${workflowId}]]*/'';
        var todoList = /*[[${TodoList}]]*/'';
        var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
        var fintype = /*[[${fintype}]]*/'';
     </script>
    <script data-th-src="@{/js/invest/entrust/etrinvestbondinfo/EtrInvestBondInfo004.js}" type="text/javascript"></script>
</div>
</body>
</html>
