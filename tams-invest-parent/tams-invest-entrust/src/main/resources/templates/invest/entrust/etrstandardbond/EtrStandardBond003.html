<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{EtrStandardBond003}">优先级设置</title>
</head>
<body>
	<div layout:fragment="content" id="EtrStandardBond003_DIV">
       <style type="text/css">
        	/* 
        	body{text-align:center} 
			.d ivcss5{margin:0 auto;width:90%;}
			*/
			.form-label-wrap{
				width:50%;
			}
			.layui-form-label-left{
			    text-align: left;
			}
    	</style>
    	<form id="submitForm">
        	<div class="divcss5">
            	<table class="layui-table" id="dataTable"></table>
        	</div>
        	<input type="hidden" id="B05" name="B05" value="B05">
        	
        	<!-- <input type="hidden" th:id="|${entityName}_payAcctNo|" th:name="selectValue" value="[]"> -->
			<div class="pro-module-item">
				<div class="layui-form-item">
		          	<div class="form-inline-wrap">
		            	<label class="layui-form-label form-lable" 
		            		data-th-text="#{EtrStandardBond003.lastPeriodPri}">剩余期限</label>
		        	</div>
		          	<div class="form-inline-wrap">
		        		<label class="layui-form-label form-label-wrap layui-form-label-left">
		              		<input type="radio" id="lastPeriodPri_01" name="lastPeriodPri" value="01" 
		              			th:text="#{EtrStandardBond003.lastPeriodPri.01}"
		              			th:checked="${entity?.lastPeriodPri == '01'}">
		          		</label>
		         	</div>
		           	<div class="form-inline-wrap">
		        		<label class="layui-form-label form-label-wrap layui-form-label-left">
		              		<input type="radio" id="lastPeriodPri_02" name="lastPeriodPri" value="02" 
		              			th:text="#{EtrStandardBond003.lastPeriodPri.02}"
		              			th:checked="${entity?.lastPeriodPri == '02'}">
		          		</label>
		      		</div>
	          	</div>
	          
	          	<div class="layui-form-item">
	  				<div class="form-inline-wrap">
	                  	<label class="layui-form-label form-lable"
	                      data-th-text="#{EtrStandardBond003.secGradePri}">债项评级</label>
	              	</div>
	              	<div class="form-inline-wrap">
	              		<label class="layui-form-label form-label-wrap layui-form-label-left">
	              			<input type="radio" id="secGradePri_01" name="secGradePri" value="01" 
	              				th:text="#{EtrStandardBond003.secGradePri.01}"
	              				th:checked="${entity?.secGradePri == '01'}">
	          			</label>
	              	</div>
	              	<div class="form-inline-wrap">
	              		<label class="layui-form-label form-label-wrap layui-form-label-left">
	              			<input type="radio" id="secGradePri_02" name="secGradePri" value="02" 
	              				th:text="#{EtrStandardBond003.secGradePri.02}"
	              				th:checked="${entity?.secGradePri == '02'}">
	          			</label>
	              	</div>
	          	</div>
	          
	          	<div class="layui-form-item">
	              	<div class="form-inline-wrap">
	                  	<label class="layui-form-label form-lable"
	                      	data-th-text="#{EtrStandardBond003.yesorno}">是否启用</label>
	              	</div>
	              	<div class="form-inline-wrap">
	              		<label class="layui-form-label form-label-wrap layui-form-label-left">
	              			<input type="radio" id="yesorno_yes" name="yesOrNo" value="Y"
	              				th:checked="${entity?.yesOrNo == 'Y'}">是
	          			</label>
	              	</div>
	              	<div class="form-inline-wrap">
	              		<label class="layui-form-label form-label-wrap layui-form-label-left">
	              			<input type="radio" id="yesorno_no" name="yesOrNo" value="N"
	              				th:checked="${entity?.yesOrNo == 'N'}">否
	          			</label>
	      			</div>
				</div>
	    	</div>
		</form>    		
    	<div class="row text-center" style="margin: 20px 0;">
            <!-- <a id="EtrStandardBond003_btn_save" class="layui-btn layui-btn-sm btn-save"
               data-th-text="#{SysCommon.save}">保存</a> -->
            <a id="EtrStandardBond003_btn_submit" class="layui-btn layui-btn-sm btn-submit"
               data-th-text="#{SysCommon.save}">保存</a>
            <a id="EtrStandardBond003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
    
    
    
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
            var WINDTYPEONE = /*[[${WINDTYPEONE}]]*/''; // 一级分类
            var WINDTYPETWO = /*[[${WINDTYPETWO}]]*/''; // 二级分类
            var PLEDGEPRI = /*[[${PLEDGEPRI}]]*/''; // 优先级
        </script>
        <script data-th-src="@{/js/invest/entrust/etrstandardbond/EtrStandardBond003.js}" type="text/javascript"></script>
    </div>
</body>

</html>
