<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
<title data-th-text="#{EtrLendSpecInfo002}">拆借投资指令新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form" id="searchForm">
                <div class="pro-module-wrapper pro-module-base">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrLendSpecInfo002.portfolioId}">组合代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption=true
                                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}"
                                                required="required" data-th-initvalue="${entity?.portfolioId}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrLendSpecInfo002.vdate}">指令开始日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input class="layui-input form-input input-dateSelect" id="vdate"
                                                name="vdate" placeholder="请选择时间" disabled="disabled"
                                                data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'
                                                required="required">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrLendSpecInfo002.mdate}">指令终止日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input class="layui-input form-input input-dateSelect" id="mdate"
                                                name="mdate" placeholder="请选择时间" disabled="disabled"
                                                data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
                                                required="required">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrLendSpecInfo002.ccy}">币种</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="ccy" name="ccy"
                                                class="layui-input form-input input-select" data-th-data-result='${CCY}'
                                                allowClear="true" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" required="required"
                                                formatoption="true" data-th-initvalue="*{entity?.ccy?:CCY_default}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrLendSpecInfo002.type6}">拆借类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="assetType1" name="assetType1"
                                                class="layui-input form-input input-checkbox"
                                                data-th-data-result='${BANK_LENDING_TYPE}' required="required"
                                                data-th-initvalue="${entity?.assetType1}" />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrLendSpecInfo002.ps}">交易方向</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="ps" name="ps"
                                                class="layui-input form-input input-checkbox"
                                                data-th-data-result='${BACK_LEND_DIRECTION}' required="required"
                                                data-th-initvalue="${entity?.ps}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrLendSpecInfo002.tradeMarket}">交易场所</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="tradeMarket" name="tradeMarket" required="required"
                                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${TRADE_PLACE}'
                                                    allowClear="true" formatoption="true" data-th-initvalue="${entity?.tradeMarket}"></select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrLendSpecInfo002.entrustAmt}">指令金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="entrustAmt" name="entrustAmt" placeholder="请输入内容"
                                                data-pattern="" data-fixtype="2" required="required"
                                                data-textrange="2" class="layui-input form-input text-number"
                                                data-th-value="${entity?.entrustAmt}">
                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrLendSpecInfo002.price}">利率</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="price" name="price" placeholder="请输入内容"
                                                data-pattern="" data-fixtype="2" data-textrange="4"
                                                class="layui-input form-input text-number"
                                                data-th-value="${entity?.price}">
                                            <span class="input-right-show">%</span>
                                        </div>
                                    </div>
                                </div>

                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrLendSpecInfo002.settleSpreed}">清算速度</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="settleSpreed" name="settleSpreed" class="layui-input form-input input-select"
                                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-data-result='${ACCOUNT_SPEED}' required="required"
                                                    allowClear="true" formatoption="true" data-th-initvalue="${entity?.settleSpreedStr}"></select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{EtrLendSpecInfo002.vdateAdd}">起息日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input class="layui-input form-input input-dateSelect" id="vdateAdd"
                                                   name="vdateAdd" placeholder="请选择时间" disabled="disabled"
                                                   data-th-value='${#dates.format(entity?.vdateAdd,"yyyy-MM-dd")}'>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrLendSpecInfo002.mdateAdd}">到期日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input class="layui-input form-input input-dateSelect" id="mdateAdd"
                                                name="mdateAdd" placeholder="请选择时间" disabled="disabled"
                                                data-th-value='${#dates.format(entity?.mdateAdd,"yyyy-MM-dd")}'>
                                        </div>
                                    </div>

                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{EtrLendSpecInfo002.calendarId}">交易日历</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="calendarId" name="calendarId" required="required"
                                                    class="layui-input form-input input-select"
                                                    data-th-data-result='${PROCESS_STATE}' allowClear="true"
                                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-data-url="@{/business/common/CommonSelect/selectCalendarId}"
                                                    formatoption="true" data-th-initvalue="${entity?.calendarId}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{EtrLendSpecInfo002.term}">期限</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="termDays" name="termDays" placeholder="请输入内容"
                                                   data-textrange="0" data-fixtype="1" required="required"
                                                   class="layui-input form-input text-number"
                                                   data-th-value="${entity?.termDays}" maxlength="10">
                                            <span class="input-right-show">天</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrLendSpecInfo002.termVarieties}">期限品种</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="termType" name="termType"
                                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${TERM_TYPE_RESOLUTE}'
                                                    allowClear="true" formatoption="true" data-th-initvalue="${entity?.termType}"></select>
                                        </div>
                                    </div>
                                </div>
                                 <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrLendSpecInfo002.minAmt}">最低成交金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="minAmt" name="minAmt" placeholder="请输入内容"
                                                data-pattern="" data-fixtype="2" 
                                                data-textrange="2" class="layui-input form-input text-number"
                                                data-th-value="${entity?.minAmt}">
                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style="display: none" id="proAvailableCash_div">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrLendSpecInfo002.proAvailableCash}">组合T日可用现金</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="proAvailableCash" name="proAvailableCash"
                                                placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                                class="layui-input form-input text-number" disabled="disabled"
                                                data-th-value="${entity?.proAvailableCash}">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style="display: none" id="proAvailableCash1_div">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrLendSpecInfo002.proAvailableCash1}">组合T+1日可用现金</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="proAvailableCash1" name="proAvailableCash1"
                                                placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                                class="layui-input form-input text-number" disabled="disabled">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style="display: none" id="accAvailableCash_div">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrLendSpecInfo002.accAvailableCash}">托管户剩余现金</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="accAvailableCash" name="accAvailableCash"
                                                placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                                class="layui-input form-input text-number" disabled="disabled"
                                                data-th-value="${entity?.accAvailableCash}">
                                        </div>
                                    </div>
                                    <input type="text" id="entrustId" name="entrustId" disabled="disabled"
                                        style="display: none;" data-th-value="${entity?.entrustId}">
                                    <input type="text" id="entrustStatus" name="entrustId" disabled="disabled"
                                        style="display: none;" data-th-value="${entity?.entrustStatus}">


                                </div>


                            </div>
                        </div>
                    </div>
                        <!-- 引业务组件投资指令人员信息组件 -->
                        <div class="page-component" th:data-path="@{/component/trade/BussEtrInvestPersonInfo/init}"
                            th:data-params="|{entityName: 'etrInvestPersonInfo',entity:'${person_entity}', innerTrade: false}|"></div>

                        <!-- 引业务组件附件信息组件 -->
                        <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                            th:data-params="|{entityName: 'FileCommon', businessId: '${businessId ?: ''}'}|"></div>
                        <div id="ramark_DIV" class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">备注</span>
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item" style="padding-bottom: 8px;">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" style="width: 100%;">
                                        <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98% !important;">
                                                <textarea id="remark" name="remark" placeholder="请输入内容"
                                                          data-th-placeholder="#{SysCommon.placeholder}" maxlength="200"
                                                          class="layui-textarea" data-th-text="${entity?.remark}">
										        </textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                        <!-- 风险试算 -->
                    <div id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}" th:data-params="|{workflowId: '${workflowId}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>
                    <div class="pro-module-wrapper pro-module-block">
                        <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 20px 0;">
                            <div class="text-center">
                                <a id="EtrLendSpecInfo002_btn_riskcal" class="layui-btn layui-btn-sm"
                                    data-th-text="#{EtrLendSpecInfo002.riskcal}">风险试算</a>
                                <a id="EtrLendSpecInfo002_btn_save" class="layui-btn layui-btn-sm btn-save"
                                    data-th-text="#{SysCommon.save}">保存</a>
                                <a id="EtrLendSpecInfo002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                                    data-th-text="#{SysCommon.submit}">提交</a>
                                <a id="EtrLendSpecInfo002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                                    data-th-text="#{SysCommon.cancel}">取消</a>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div layout:fragment="script">
        <script th:inline="javascript" type="text/javascript">
            var S01 = /*[[${S01}]]*/'';
            var S02 = /*[[${S02}]]*/'';
            var T32 = /*[[${T32}]]*/'';
            var T32name = /*[[${T32name}]]*/'';
            var T33 = /*[[${T33}]]*/'';
            var T33name = /*[[${T33name}]]*/'';
            var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
            var sysDate = /*[[${sysDate}]]*/'';
            var fintype_cr = /*[[${fintype_cr}]]*/'';
            var fintype_cc = /*[[${fintype_cc}]]*/'';
            var fintype_tccr = /*[[${fintype_tccr}]]*/'';
            var PINAN_ASSET_TYPE_F08 = /*[[${PINAN_ASSET_TYPE_F08}]]*/'';;
            var parentPageId = /*[[${parentPageId}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/entrust/etrlendspecinfo/EtrLendSpecInfo002.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/component/common/util.js}" type="text/javascript"></script>
    </div>
</body>
</html>
