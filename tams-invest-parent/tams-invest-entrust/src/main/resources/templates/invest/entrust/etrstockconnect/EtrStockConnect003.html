<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.w3.org/1999/xhtml" layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
<title data-th-text="#{EtrStockConnect003}">港股通多对多指令新建</title>
</head>
<body>
	<div layout:fragment="content">
		<div class="pro-module-container">
			<form class="layui-form joyin-form-wrap pro-module-form" id="searchForm">
				<div class="pro-module-wrapper pro-module-base">
					<div id="combDistribt_div" class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title">
								<span class="title-des">委托列表</span>（<span class="star-sign">*</span> 必填）<i
									class="iconfont icon-arrow-down pro-down-icon"></i>
							</h3>
							<div>
								<table class="layui-table" id="dataTable" name="selectedItem"></table>
							</div>
						</div>
					</div>
				</div>
			</form>
			<!-- 风险试算 -->
			<div id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}"
				 th:data-params="|{workflowId: '${workflowId}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>
		</div>
		<div class="pro-module-wrapper pro-module-block">
			<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
				<div class="text-center">
					<a id="EtrStockConnect003_btn_riskcal" class="layui-btn layui-btn-sm"
					   data-th-text="#{EtrStockConnect002.riskcal}">风险试算</a>
					<a id="EtrStockConnect003_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
					   data-th-text="#{SysCommon.submit}">提交</a>
					<a id="EtrStockConnect003_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
						data-th-text="#{SysCommon.cancel}">取消</a>
				</div>
			</div>
		</div>
	</div>
    <div layout:fragment="script">
        <script th:inline="javascript" type="text/javascript">
			var iPlatformDate = /*[[${iPlatformDate}]]*/'';
			var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
			var etrStockConnectDtoList = /*[[${etrStockConnectDtoList}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/entrust/etrstockconnect/EtrStockConnect003.js}" type="text/javascript"></script>
    </div>
</body>
</html>
