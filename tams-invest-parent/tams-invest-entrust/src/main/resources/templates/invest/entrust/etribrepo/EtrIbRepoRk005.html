<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{PtlManagementInfo002}">组合新建</title>
    <style>
        .form-label-wrap {
            width: 36% !important;
        }

        .manage-info-item {
            float: left;
            padding-right: 10px;
            margin-top: 10px;
        }

        .manage-info-item .layui-form-checkbox {
            margin-right: 2px;
            margin-top: -2px;
            padding-right: 0;
            line-height: 15px;
            width: 15px;
            height: 15px;
        }

        .manage-info-item .layui-form-checkbox i {
            line-height: 15px;
            width: 15px;
            height: 15px;
            border-left: 1px solid #d2d2d2;
            font-size: 15px;
        }

        .manage-info-item .layui-form-checked i, .manage-info-item .layui-form-checked:hover i {
            border-color: #2693ff;
            color: #2693ff;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container  page-step">
        <form id="basicInfoForm" class="layui-form joyin-form-wrap pro-module-form">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlManagementInfo001.portfolioName}">组合名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="portfolioId" name="portfolioId"
											class="layui-input form-input input-select"
											placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId}"
											data-th-value="${entity?.portfolioId}" multiple="true">
										</select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlManagementInfo001.revenueType}">收益类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="profitType" name="profitType"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${PROFIT_TYPE}'
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                required data-th-initvalue="${entity?.profitType}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlManagementInfo002.issueMode}">开放类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="openType" name="openType" required="required"
                                               class="layui-input form-input input-checkbox"
                                               data-th-data-result="${ISSUE_MODE}"
                                               data-th-initvalue="${entity?.openType}"/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlManagementInfo002.raisetype}">募集方式</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="raiseType" name="raiseType" required placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                class="layui-input form-input input-select"
                                                data-th-data-result="${RAISE_TYPE}"
                                                data-th-initvalue="${entity?.raiseType}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlManagementInfo002.investType}">投资性质</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="investNature" name="investNature"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                required data-th-data-result="${INVEST_TYPE}"
                                                data-th-initvalue="${entity?.investNature}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            <div class="text-center">
                   <a id="EtrIbRepoRk005005_btn_searchq"
                   class="layui-btn layui-btn-sm"
                   data-th-text="查询">提交</a>
                <a id="EtrIbRepoRk005_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                   data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
	    var WINDTYPEONE = /*[[${WINDTYPEONE}]]*/''; // 一级分类
	    var WINDTYPETWO = /*[[${WINDTYPETWO}]]*/''; // 二级分类
	    var MAIN_GRADE_RESULT = /*[[${MAIN_GRADE_RESULT}]]*/'';//评级
		var YES_OR_NO = /*[[${YES_OR_NO}]]*/''; // 是否
		var entity_etrSecStockConfig = eval(/*[[${entity_etrSecStockConfig}]]*/'');
		var entity_ptlSecStock = eval(/*[[${entity_ptlSecStock}]]*/'');
        var secDto = /*[[${secDto}]]*/'';
        var funDto = /*[[${funDto}]]*/'';
        var set = /*[[${set}]]*/'';
        var selectOptDto = /*[[${selectOptDto}]]*/'';
        var map1 = /*[[${map1}]]*/'';
        var userIdList = /*[[${userIdList}]]*/'';
        var profitType01 = /*[[${profitType01}]]*/'';
        var profitType02 = /*[[${profitType02}]]*/'';
        var profitType03 = /*[[${profitType03}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/entrust/etribrepo/EtrIbRepoRk005.js}">
    </script>
</div>
</body>
</html>
