<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title>委托质押券管理</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a class="layui-btn layui-btn-sm" id="EtrStandardBond001_btn_in"
           th:utext="#{EtrStandardBond001.in}">
            <i class="iconfont icon-putin-storage"></i>入库</a>
        <a class="layui-btn layui-btn-sm btn-default" id="EtrStandardBond001_btn_out"
           th:utext="#{EtrStandardBond001.out}">
            <i class="iconfont icon-outof-storage"></i>出库</a>
        <a th:if="!(${repo_pledge_model} =='01' and ${pageFrom}=='EtrIbRepoinfo001')" class="layui-btn layui-btn-sm btn-default" id="EtrStandardBond001_btn_priority"
           th:utext="#{EtrStandardBond001.level}">
            <i class="iconfont icon-outof-storage"></i>优先级设置</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
        <form class="layui-form" id="submitForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           th:utext="#{EtrStandardBond001.portfolioId}">组合代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="portfolioId" name="portfolioId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                th:placeholder="#{SysCommon.placeholder}"
                                th:data-url="@{/business/common/CommonSelect/selectPortfolioId}"
                                th:value="${entity?.portfolioId}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-label-wrap"
                           th:utext="|#{EtrStandardBond001.secAcctId}|">证券账户</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="secAcctId" name="secAcctId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                th:placeholder="#{SysCommon.placeholder}"
                                th:data-url="@{/invest/entrust/etrstandardbond/EtrStandardBond001/getSecManageAcctId}"
                                allowClear="true" formatoption="true"></select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           th:utext="#{EtrStandardBond001.tradePlace}">交易场所</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="tradePlace" name="tradePlace"
                                class="layui-input form-input input-select"
                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                allowClear="true" formatoption="true" th:data-result='${TRADE_PLACE}'>
                        </select>
                    </div>
                </div>
            </div>
            <!-- <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-label-wrap"
                           th:utext="#{invest.channelId}">通道</label>
                    <div class="layui-input-inline input-inline">
                        <select required type="text" id="channelId" name="channelId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                th:placeholder="#{SysCommon.placeholder}"
                                th:data-url="@{/invest/asset/channel/ChannelAsset001/getSecAcctId}"
                                allowClear="true" formatoption="true" multiple="true"></select>
                    </div>
                </div>
            </div> -->
        </form>
    </div>
    <div class="pledge-table-wrap">
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script th:src="@{/js/invest/entrust/etrstandardbond/EtrStandardBond001.js}" type="text/javascript"></script>
</div>
</body>
</html>
