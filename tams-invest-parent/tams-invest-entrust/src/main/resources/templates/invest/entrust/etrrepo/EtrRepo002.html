<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{EtrRepo002}">回购资产委托新建</title>

                                <span class="title-des">基本信息</span>
                                （
                                <span class="star-sign">*</span>
                                必填）
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">

                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"

                                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}"

                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable" data-th-text="#{EtrRepo002.vdate}">指令开始日</label>

                                <div class="layui-form-item">

                                        <div class="layui-input-inline input-inline">

                                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-data-result="${TRADE_PLACE}"
                                                    data-th-initvalue="${entity?.tradeMarket}" required="required">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" id="assetType1Div">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{EtrRepo002.assetType1}">回购类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="assetType1" name="assetType1"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                required="required" data-th-data-result="${TARGET_BACK_TYPE}"
                                                data-th-initvalue="${entity?.assetType1}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">

                                        <div class="layui-input-inline input-inline">

                                <div class="layui-form-item">

                                            </select>

                                        <div class="layui-input-inline input-inline">

<!--                                                data-th-value='${#dates.format(entity?.mdateAdd,"yyyy-MM-dd")}'>-->
<!--                                        </div>-->
<!--                                    </div>-->

                                <div class="layui-form-item">

                                        <div class="layui-input-inline input-inline">

                                                   data-th-value="${entity?.proAvailableCash}" />
                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>

                                        </div>
                                    </div>

                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" style="display: none" id="accAvailableCash_div">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{EtrRepo002.accAvailableCash}">托管户剩余现金</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="accAvailableCash" name="accAvailableCash"
                                                   placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                                   class="layui-input form-input text-number" disabled="disabled"
                                                   data-th-value="${entity?.accAvailableCash}" />
                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" id="assetAvailablePosition_div" Style="display: none">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{EtrRepo002.assetAvailablePosition}">可使用标准券额度</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="assetAvailablePosition" name="assetAvailablePosition"
                                                   placeholder="请输入内容" data-pattern="" data-fixtype="2"
                                                   class="layui-input form-input text-number" disabled="disabled" />
                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                    <div id="availableDay_div" class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{EtrRepo002.availableDay}">资金可用日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input class="layui-input form-input input-dateSelect" id="availableDay"
                                                   name="availableDay" placeholder="请选择时间"
                                                   data-th-value='${#dates.format(entity?.availableDay,"yyyy-MM-dd")}'>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{EtrRepo002.securitiesCust}">证券托管户</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="securitiesCust" name="securitiesCust"
                                                    class="layui-input form-input input-select" parentIds="portfolioId,tradeMarket"
                                                    data-th-data-url="@{/invest/entrust/etrrepo/EtrRepo002/getSecManageAcctId}"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initvalue="${entity?.securitiesCust}">
                                            </select>
                                        </div>
                                    </div>
                                <!-- 通道交易 新增 言伟 2019/03/28 start -->
                                    <div class="form-inline-wrap" id="chlId_value_div" Style="display: none">
                                        <label class="layui-form-label form-lable" data-th-text="|#{invest.channelId}#{EtrInvestBondInfo002.channelAvailableCash}|">通道可用现金</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="channelAvailableCash" name="channelAvailableCash" data-fixtype="2"
                                                   class="layui-input form-input text-number" disabled="disabled"/>
                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                </div>
                                <!-- 通道交易 新增 言伟 2019/03/28 end -->

                                <div class="layui-form-item">


                                    <input type="text" id="entrustId" name="entrustId" disabled="disabled"
                                        style="display: none;" data-th-value="${entity?.entrustId}">
                                    <input type="text" id="entrustStatus" name="entrustId" disabled="disabled"
                                        style="display: none;" data-th-value="${entity?.entrustStatus}">
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- 引业务组件投资委托人员信息组件 -->
                    <div class="page-component" th:data-path="@{/component/trade/BussEtrInvestPersonInfo/init}"
                        th:data-params="|{entityName: 'etrInvestPersonInfo',entity:'${person_entity}', innerTrade: false,callPageId:'EtrInvestBondInfo002'}|"></div>
                    <!--质押券信息-->
                    <div class="page-component" th:data-path="@{/component/trade/BussRepoSec/init}"
                     th:data-params="|{entityNameBussRepoSec: 'bussRepoSec', pageFrom: 'EtrRepo002', entity:'${entity_bussRepoSecDto}',
                     portfolioId:'${entity?.portfolioId==null?'':entity?.portfolioId}', ps:'${entity?.ps==null?'':entity?.ps}',
                     bizCode:'${buscode==null?'':buscode}', entrustId:'${entity?.entrustId==null?'':entity?.entrustId}',
                     securitiesCust: '${entity?.securitiesCust == null? '': entity?.securitiesCust}',
                     chlId:'${entity?.chlId == null? '': entity?.chlId}' , tradeMarketId: 'tradeMarket'}|"></div>
                    <!--<div id="ramark_DIV" class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">备注</span>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98% !important;">
                                        <textarea id="remark" name="remark" placeholder="请输入内容"
                                            data-th-placeholder="#{SysCommon.placeholder}" class="layui-textarea"
                                            data-th-text="${entity?.remark}" maxlength="200"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>-->
                    <!-- 引业务组件附件信息组件 -->
                    <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                        th:data-params="|{entityName: 'FileCommon',businessId: '${businessId ?: ''}'}|"></div>
                    <div id="ramark_DIV" class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">备注</span>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98% !important;">
                                        <textarea id="remark" name="remark" placeholder="请输入内容"
                                                  data-th-placeholder="#{SysCommon.placeholder}" class="layui-textarea"
                                                  data-th-text="${entity?.remark}" maxlength="200"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- 风险试算 -->
                    <div th:if="${isEleShow['EtrRepo002_BaseRiskMathComm']} ne 'N' and ${isEleShow['BaseRiskMathComm']} ne 'N'" id="baseRiskMathComm" class="page-component"
                        th:data-path="@{/component/common/BaseRiskMathComm/init}"
                        th:data-params="|{workflowId: '${workflowId}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>
                </div>
                <div class="pro-module-wrapper pro-module-block">
                    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                        <div class="text-center">
                            <a th:if="${isEleShow['EtrRepo002_btn_riskcal']} ne 'N' and ${isEleShow['BaseRiskMathComm_btn_riskcal']} ne 'N'"
                               id="EtrRepo002_btn_riskcal" class="layui-btn layui-btn-sm"
                                data-th-text="#{EtrRepo002.riskcal}">风险试算</a>
                            <a id="EtrRepo002_btn_save" class="layui-btn layui-btn-sm btn-save"
                                data-th-text="#{SysCommon.save}">保存</a>
                            <a id="EtrRepo002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                                data-th-text="#{SysCommon.submit}">提交</a>
                            <a id="EtrRepo002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                                data-th-text="#{SysCommon.cancel}">取消</a>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
