<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <style type="text/css">
        .item_panel {
            width:100%;
            float: right;
            height:49.5%;
            margin:1px;
            border: 1px solid #aaaaaa;
            display: inline-block;
        }
        
        .left_bottom_panel {
            width:42%;
            float:left;
            height:100%;
            border: 1px solid #aaaaaa;
            isplay: inline-block;
        }
        .right_bottom_panel {
            float:right;
            width:57.5%;
            height:100%;
            display: inline-block;
        }

        .gutter-vertical{
            width:100%;
            height:3px !important;
            background:#dbdbdd;
            -webkit-box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
            box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
            cursor:n-resize;
            float: right;
        }

        .gutter-horizontal{
            height:220px;
            width:3px !important;
            background:#dbdbdd;
            -webkit-box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
            box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
            cursor:ew-resize;
            float: left;
            margin-left: 2px;
        }
        
        #dataListDiv {
            width: 100%;
            height: 300px;
            border: 1px solid #aaaaaa;
            overflow-y: auto;
        }

        .panelPattern {
            height: 362px;
            overflow-y: auto;
        }

        .dataDiv {
            min-height: 70px;
            /*margin-bottom: 5px;*/
            /*margin-right: 5px;*/
            border: 1px solid #aaaaaa;
            display: block;
            background-color: #fff;
        }

        .dataDiv {
            text-align: center
        }

        .dataDiv p:first-child {
            margin-top: 20px
        }

        .panelPattern .dataDiv p:first-child {
            margin-top: 50px!important
        }

        .remark-left {
            text-align: center!important;
            margin-top: 10px!important;
        }

        .last-group {
            margin-top: 13px!important;
        }

        .search-left-input {
            border-radius: 0!important;
            margin-bottom: 5px;
            width: 90%
        }

        .cus-left {
            margin-top: 0!important;
            background-color: #f5f5f5;
        }

        #positonDiv .dataDiv p {
            font-size: 18px;
            font-weight: 600;
        }
        #dataListDiv .dataDiv i {
            display: none;
        }
        #positonDiv .layui-row {
            padding-top: 16px;
        }
        #positonDiv>.layui-row>.layui-icon{
            position: absolute;
            margin-top: -16px;
            right: 0px;
        }
        .dataDiv>.layui-icon{
            float:right;
        }
        .operationRow{
            /*position: absolute;*/
            /*margin-top: -42px;*/
            /*right: 0px;*/
            float: right;
            clear: both;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div data-th-fragment="content">
        <div class='operationRow'>
            <div class="form-inline-wrap" style=" width: 300px; padding:0px;">
                <div style="width: 300px; ">
                    <select
                        type="text"
                        id="search"
                        name="search"
                        class="layui-input form-input input-select"
                        placeholder="请选择数据"
                        th:data-url="@{/invest/entrust/home/Home/selectPage}"
                        allowClear="true"
                        formatoption="true"
                    ></select>
                </div>
            </div>
<!--            <a id="EtrIbBondinfoHq_checkbox_start" class="layui-btn layui-btn-sm " data-th-text="设置显示列"></a>-->
<!--            <a id="settingSwitch" class="layui-btn layui-btn-xs" style="margin-left: 5px;"><span class="layui-icon">&#xe620;</span>定制</a>-->
            <a id="settingReturn" class="layui-btn layui-btn-xs" style="margin-left: 10px;"><span class="layui-icon">&#xe9aa;</span>返回</a>
<!--            <a id="settingCreate" class="layui-btn layui-btn-xs" style="display:none;"><span class="layui-icon">&#xe642;</span>新建</a>-->
<!--            <a id="settingEdit" class="layui-btn layui-btn-xs" style="display:none;"><span class="layui-icon">&#xe642;</span>编辑</a>-->
            <a id="settingPreview" class="layui-btn layui-btn-xs btn-search" style="">预览</a>
<!--            <a id="settingShare" class="layui-btn layui-btn-xs" style="display:none;"><span class="layui-icon">&#xe641;</span>分享</a>-->
<!--            <a id="settingManage" class="layui-btn layui-btn-xs" style=""><span class="layui-icon">&#xe631;</span>管理</a>-->
            <a id="settingSave" class="layui-btn layui-btn-xs btn-save" style="">保存</a>
        </div>
        <div id="myHomeView" class="layui-col-md12 layui-col-xs12 layui-col-sm12 layui-col-lg12" style="display:none;">
            <div id="homeContainer" style="height:100%;">
            </div>
        </div> 
        <div id="myHomeSetting" class="layui-col-md12 layui-col-xs12 layui-col-sm12 layui-col-lg12" style="display:none;">
            <div class="layui-col-md10 layui-col-xs10 layui-col-sm10 layui-col-lg10 panelPattern" style="min-height:600px;overflow-y:auto" id="positonDiv">
            </div>
            <div class="layui-col-md2 layui-col-xs2 layui-col-sm2 layui-col-lg2">
                <div class="layui-collapse">
                    <div class="layui-colla-item">
                        <h2 class="layui-colla-title">布局设置</h2>
                        <div class="layui-colla-content layui-show">
                            <ul id="layoutListDiv">
                                <li>
                                    <div id="layout1" class="layui-btn layui-btn-fluid layui-btn-xs layui-btn-radius" draggable="true"
                                         data-layout="<div data-layouttype='1' data-type='frame' class='layui-row' draggable='true'><i class='layui-icon'>&#x1006;</i><div class='layui-col-md12 layui-col-xs12 layui-col-sm12 layui-col-lg12 dataDiv'></div></div>">12</div>
                                </li>
                                <li>
                                    <div id="layout2" class="layui-btn layui-btn-fluid layui-btn-xs layui-btn-radius" draggable="true"
                                         data-layout="<div data-layouttype='2' class='layui-row' draggable='true'><i class='layui-icon'>ဆ</i><div class='layui-col-md6 layui-col-xs6 layui-col-sm6 layui-col-lg6 dataDiv' style='width:49%'></div><div class='layui-col-md6 layui-col-xs6 layui-col-sm6 layui-col-lg6 dataDiv' style='width:49%;'></div></div>">6/6</div>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <div class="layui-colla-item" >
                        <h2 class="layui-colla-title">数据来源</h2>
                        <div class="layui-colla-content layui-show">
                            <div id="dataListDiv">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- javascript代码部分 -->
<div layout:fragment="script">
<!--    <script type="text/html" id="iframeEach">-->
<!--        <iframe th:src="abc" width="100%" class="one"-->
<!--                frameborder="0" style="border:none;"></iframe>-->
<!--    </script>-->
    <script data-th-src="@{/js/invest/entrust/etrexchangetrade/split.min.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/invest/entrust/home/Home.js}" type="text/javascript"></script>
</div>

</body>
</html>
