<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{EtrStockConnectMain}">港股通指令</title>
    <style type="text/css">
		html,body,.layui-fluid,#main_body{
			height: 100%;
		}
		.top_panel {
			width:100%;
			float: right;
			height:49.5%;
			margin:1px;
			border: 1px solid #aaaaaa;
			display: inline-block;
		}
		.bottom_panel {
			width:100%;
			float: right;
			height:49.5%;
			margin:1px;
			border: 1px solid #aaaaaa;
			display: inline-block;
		}
		.left_bottom_panel {
			width:42%;
			float:left;
			height:100%;
			border: 1px solid #aaaaaa;
			isplay: inline-block;
		}
		.right_bottom_panel {
			float:right;
			width:57.5%;
			height:100%;
			display: inline-block;
		}
		.gutter-vertical{
			width:100%;
			height:3px !important;
			background:#dbdbdd;
			-webkit-box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
			box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
			cursor:n-resize;
			float: right;
		}

		.gutter-horizontal{
			height:570px;
			width:3px !important;
			background:#dbdbdd;
			-webkit-box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
			box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
			cursor:ew-resize;
			float: left;
			margin-left: 2px;
		}
    </style>
</head>
<body>
	<div id="main_body" layout:fragment="content">
		<div class="top_panel" id="top_panel_dev" style="display:none">
			<iframe th:src="@{/invest/entrust/etrstockconnect/EtrStockConnect001/init}" width="100%"
					height="100%" frameborder="0" style="border:none;"></iframe>
		</div>
		<div class="bottom_panel" id = "bottom_panel_dev">
			<div class="left_bottom_panel" style="display:none" id="left_bottom_panel_dev">
				<iframe id = "etrStockConnectHq" th:src="@{'/invest/entrust/etrstockconnect/EtrStockConnect001/initHq'}" width="100%"
						height="100%"  frameborder="0"  style="border:none;"></iframe>
			</div>
			<div class="right_bottom_panel" id="right_bottom_panel_dev">
				<iframe  name ='etrStockConnect002' id = "etrStockConnect002" th:src="@{/invest/entrust/etrstockconnect/EtrStockConnect002/init}" width="100%"
						 height="90%"  frameborder="0"  style="border:none" ></iframe>
				<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 5px;">
					<div class="text-center">
						<a id="EtrStockConnect002_btn_riskcal" class="layui-btn layui-btn-sm" data-th-text="#{EtrStockConnectRiskcal}">风险试算</a>
						<a id="EtrStockConnect002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
						<a id="EtrStockConnect002_btn_submit" class="layui-btn layui-btn-sm  btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
						<a id="EtrStockConnect002_btn_reset" class="layui-btn layui-btn-sm  btn-reset" data-th-text="#{SysCommon.reset}">重置</a>
					</div>
				</div>
			</div>
		</div>
		<div id="baseRiskMathComm" class="page-component" style="display: none;"  th:data-path="@{/component/common/BaseRiskMathComm/init}"
			 th:data-params="|{workflowId: '${workflowId}',entityName:'riskTrialRetDto',tradeId:'${entrustId}'}|">
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">

		</script>
        <script data-th-src="@{/js/invest/entrust/etrexchangetrade/split.min.js}" type="text/javascript"></script>
    	<script data-th-src="@{/js/invest/entrust/etrstockconnect/EtrStockConnectMain.js}" type="text/javascript"></script>
    </div>
</body>
</html>
