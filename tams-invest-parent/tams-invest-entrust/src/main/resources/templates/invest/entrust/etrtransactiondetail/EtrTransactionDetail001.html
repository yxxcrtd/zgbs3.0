<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
<title data-th-text="#{EtrTransactionDetail001}">指令成交明细查询</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area">
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{EtrTransactionDetail001.entrustId}">指令代码</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="TrdCommandDispatcher001_entrustId" name="entrustId" maxlength="50"
									class="layui-input form-input input-lenovoselect" 
									data-th-data-url="@{/invest/trade/investtrade/commanddispatcher/TrdCommandDispatcher001/getEntIds}"
									data-idfield="code" data-th-data-effectivefields="code"
									data-th-data-effectivefieldsalias='|{"code":"#{TrdCommandDispatcher001.entrustId}"}|'
									placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
									/>
							</div>
						</div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrTransactionDetail001.portfolioId}">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" name="portfolioId" id="portfolioId"
		                                    class="finprodIdList layui-input form-input input-select" allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
		                            		formatoption = true multiple="multiple"
		                            		data-th-data-url="@{/invest/entrust/etrfund/EtrFund002/getSelectPortfolioId}" 
		                            		data-th-initvalue="${entity?.portfolioId}" >
		                            		</select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrTransactionDetail001.finprodType2}">资产类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="finprodType2" name="finprodType2"
                                class="layui-input form-input input-select" allowClear="true" placeholder="请选择市场日历类型"
                                data-th-placeholder="#{SysCommon.placeholder}" multiple=”true”
                                data-th-data-result="${PINAN_ASSET_TYPE}" formatoption = "true">
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrTransactionDetail001.finprodId}">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" class="layui-input form-input input-lenovoselect" id="finprodId"
                                name="finprodId" data-th-placeholder="#{SysCommon.placeholder}" data-idfield="code"
                                data-keyfield="name"
                                data-th-data-effectivefieldsalias='|{"code":"#{EtrTransactionDetail001.finprodId}",
                                    "shortName":"#{EtrTransactionDetail001.finprodName}"}|'
                                data-th-data-url="@{/invest/entrust/etrtransactiondetail/EtrTransactionDetail001/getfinprodId}"
                                maxlength="60">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrTransactionDetail001.tradeMarket}">交易场所</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="tradeMarket" name="tradeMarket"
                                class="layui-input form-input input-select" allowclear="true"
                                placeholder="请选择交易场所" data-th-placeholder="#{SysCommon.placeholder}" aria-hidden="true"
                                data-th-data-result="${TRADE_PLACE}" formatoption="true">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrTransactionDetail001.ps}">交易方向</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="ps" name="ps"
                                class="layui-input form-input input-select" allowclear="true"
                                placeholder="请选择节交易方向" data-th-placeholder="#{SysCommon.placeholder}" aria-hidden="true"
                                data-th-data-result="${PS}" formatoption="true">
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrTransactionDetail001.entrustStatus}">有效状态</label>
                        <div class="layui-input-inline input-inline">
                            <!--<input type="text" id="entrustStatus" name="entrustStatus"-->
                                <!--class="layui-input form-input input-select" allowclear="true"-->
                                <!--placeholder="请选择节假日标志" data-th-placeholder="#{SysCommon.placeholder}" aria-hidden="true"-->
                                <!--data-th-data-result="${ENTRUST_STATUS}" formatoption="true" multiple="true" data-th-initValue="${entrustStatus}">-->
                            <select type="text" id="entrustStatus" name="entrustStatus"
                                    class="layui-input form-input input-select" data-th-data-result='${ENTRUST_STATUS}'
                                    allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    formatoption="true" multiple="true" data-th-initValue="${entrustStatus}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrTransactionDetail001.entrustDate}">指令日期</label>
                        <div class="layui-input-inline input-inline">
                            <input id='entrustDate' name='entrustDate'
                                class="layui-input form-input input-dateRangeSelect" placeholder="请选择时间区间"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table id="dataTable"></table>
            <table class="layui-table" id="dataTableDetail"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script th:inline="javascript" type="text/javascript">
        	var F01 = /*[[${F01}]]*/'';
        	var F02 = /*[[${F02}]]*/'';
        	var F03 = /*[[${F03}]]*/'';
        	var F04 = /*[[${F04}]]*/'';
        	var F05 = /*[[${F05}]]*/'';
        	var F06 = /*[[${F06}]]*/'';
        	var F07 = /*[[${F07}]]*/'';
        	var F08 = /*[[${F08}]]*/'';
        	var F09 = /*[[${F09}]]*/'';
            // add by zhangpuyu 2910/10/18 修复指令查询买断式回购双击跳转失败 start
            var F10 = /*[[${F10}]]*/'';
            // add by zhangpuyu 2910/10/18 修复指令查询买断式回购双击跳转失败 end
            var F11 = /*[[${F11}]]*/'';
            var F12 = /*[[${F12}]]*/'';
        	var F13 = /*[[${F13}]]*/'';
        	var F14 = /*[[${F14}]]*/'';
        	var F15 = /*[[${F15}]]*/'';
        	var F16 = /*[[${F16}]]*/'';
            var F17 = /*[[${F17}]]*/'';
            var F36 = /*[[${F36}]]*/'';
            var F20 = /*[[${F20}]]*/'';
            var IRS_TYPE = /*[[${IRS_TYPE}]]*/'IRS_TYPE';
            var PS_T04 = /*[[${PS_T04}]]*/'';
            var PS_T49 = /*[[${PS_T49}]]*/'';
            
            var TRADE_PLACE_03 = /*[[${TRADE_PLACE_03}]]*/'';
            var TRADE_PLACE_04 = /*[[${TRADE_PLACE_04}]]*/'';

            var TARGET_BACK_TYPE_H01 = /*[[${TARGET_BACK_TYPE_H01}]]*/'';
            var ENTRUST_CLASS_01 = /*[[${ENTRUST_CLASS_01}]]*/'';
            var ENTRUST_CLASS_02 = /*[[${ENTRUST_CLASS_02}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/entrust/etrtransactiondetail/EtrTransactionDetail001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
