<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<style type="text/css">

.form-lable {
	width: 25%;
	padding: 0px 10px 0px 0px;
}

.layui-tab-content {
	padding: 0px !important;
}

.select2-container--default .select2-results>.select2-results__options {
	max-height: 150px;
	overflow-y: auto;
}

.layui-form-item .select2-container {
	max-width: 200px !important
}
.grid-demo {
	background-color: #f5f5f5;
	border: 1px solid red;
	border-radius: 3px;
	padding: 5px;
}
.layui-chcekbox{
	padding: 0px 1px;
	margin: 0 2px 0 0;
}
</style>
</head>
<body>
	<div layout:fragment="content">
		<div class="layui-tab" lay-filter="tradePlatform">
			<ul class="layui-tab-title">
				<li class="layui-this">指令管理</li>
				<li>持仓</li>
			</ul>
			<div class="layui-tab-content">
				<!-- 指令管理 -->
				<div class="layui-tab-item layui-show">
					<div class="joyin-form-wrap layui-fluid">
						<form class="layui-form" id="searchForm_zlgl">
							<div class="pro-module-wrapper pro-module-block" >
								<div class="layui-col-md12 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin-top: 15px;">
									<a id="EtrStockConnect001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="撤回"></span></a>
									<a id="EtrStockConnect001_btn_close" class="layui-btn layui-btn-sm ">
										<i class="iconfont icon-close"></i><span data-th-text="#{SysCommon.close}"></span></a>
									<a id="EtrStockConnect001_btn_import" class="layui-btn layui-btn-sm btn-import">
										<i class="iconfont icon-import"></i><span data-th-text="#{EtrInvestBondInfo001.import}">导入</span></a>
									<div style="float: right;">
										<input type="radio" name="entrustStatus" style="float: right;" lay-filter="entrustStatus" value="" title="全部" checked>
										<!--  <input type="radio" name="entrustStatus" style="float: right; display:none" lay-filter="entrustStatus" value="01" title="新建" > -->
										<input type="radio" name="entrustStatus" style="float: right;" lay-filter="entrustStatus" value="02" title="待接收" >
										<input type="radio" name="entrustStatus" style="float: right;" lay-filter="entrustStatus" value="09" title="待分发" >
										<input type="radio" name="entrustStatus" style="float: right;" lay-filter="entrustStatus" value="03" title="已接收" >
										<input type="radio" name="entrustStatus" style="float: right;" lay-filter="entrustStatus" value="04" title="已完成" >
										<input type="radio" name="entrustStatus" style="float: right;" lay-filter="entrustStatus" value="05" title="已退回" >
										<input type="radio" name="entrustStatus" style="float: right;" lay-filter="entrustStatus" value="06" title="已关闭" >
										<input type="radio" name="entrustStatus" style="float: right;" lay-filter="entrustStatus" value="07" title="已撤回" >
										<input type="radio" name="entrustStatus" style="float: right;" lay-filter="entrustStatus" value="08" title="流程中" >
									</div>
								</div>
								<div>
									<table class="layui-table" id="dateTable"></table>
								</div>
							</div>
						</form>
					</div>
				</div>
				<!-- 持仓 -->
				<div class="layui-tab-item">
					<div class="joyin-form-wrap layui-fluid">
						<form class="layui-form" id="searchForm_cc">
							<div class="layui-form-item">
								<div
									class="layui-inline layui-col-md3 layui-col-xs3 layui-col-sm3 layui-col-lg3">
									<label class="layui-form-label form-lable"
										data-th-text="#{EtrStockConnect001.portfolioName}">组合名称</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="portfolioId" name="portfolioId"
											class="layui-input form-input input-select"
											placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId}"
											data-th-value="${entity?.portfolioId}" multiple="true">
										</select>
									</div>
								</div>
								<div
									class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
									<label class="layui-form-label form-lable"
										data-th-text="#{EtrStockConnect001.hkseMarket}">港股通市场</label>
									<div class="layui-input-inline input-inline" style="width: 70% !important;">
										<input type="text" id="hkseMarket" name="hkseMarket" childrenIds="finprodId"
											class="layui-input form-input input-checkbox"
											placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-data-result='${SH_OR_ZH}'
											data-th-value="${entity?.hkseMarket}" />
									</div>
								</div>
								<div
									class="layui-inline layui-col-md3 layui-col-xs3 layui-col-sm3 layui-col-lg3">
									<label class="layui-form-label form-lable"
										data-th-text="#{EtrStockConnect001.finprodName}">资产名称</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="finprodId" name="finprodId" class="layui-input form-input input-select" placeholder="请输入内容" data-th-value="${entity?.finprodId}"
										 parentIds="hkseMarket" data-th-placeholder="#{SysCommon.placeholder}" data-th-data-url="@{'/invest/entrust/etrstockconnect/EtrStockConnect002/getfinprodIdForAdd'}" formatoption="true"></select>
									</div>
								</div>
								<div
									class="layui-inline layui-col-md1 layui-col-xs1 layui-col-sm1 layui-col-lg1">
									<a class="layui-btn layui-btn-sm btn-search"
										style="margin-left: 25px;" id="EtrStockConnect001_search_btn">
										<i class="iconfont icon-search"></i><span>查询</span>
									</a>
								</div>
							</div>
						</form>
					</div>
					<!-- 持仓列表 -->
					<div>
						<table class="layui-table" id="positionsTable"></table>
					</div>
				</div>
			</div>
		</div>
    </div>
	<div layout:fragment="script">
		<script th:inline="javascript" type="text/javascript">
		</script>
		<script
			data-th-src="@{/js/invest/entrust/etrstockconnect/EtrStockConnect001.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
