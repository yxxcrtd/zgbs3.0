<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{EtrRepo001}">回购委托查询</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area">
            <a th:id="|${pageId}_btn_add|" class="layui-btn layui-btn-sm btn-create"
                data-th-text="#{SysCommon.create}">新建</a>
            <a th:id="|${pageId}_btn_import|" class="layui-btn layui-btn-sm btn-import">
                <i class="iconfont icon-import"></i><span data-th-text="#{EtrRepo001.import}"></span></a>
            <a th:id="|${pageId}_btn_close|" class="layui-btn layui-btn-sm" ><i class="iconfont icon-close"></i><span data-th-text="#{SysCommon.close}"></a>
            <a th:id="|${pageId}_btn_revoke|" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="#{ETR_REVERT}"></a>
            <a th:id="|${pageId}_btn_manage|" class="layui-btn layui-btn-sm btn-default" ><i class="iconfont icon-quanka" ></i>质押券管理</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrRepo001.portfolioId}">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption=true multiple="true"
                                                data-th-data-url="@{/invest/entrust/etrrepo/EtrRepo002/getentrustIdAdd}"
                                                data-th-initvalue="${entity?.portfolioId}">
                                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrRepo001.assetType1}">回购类型</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="assetType1" name="assetType1" class="layui-input form-input input-select"
                                data-th-data-result='${TARGET_BACK_TYPE}' allowClear="true" th:initValue="${repoType}"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" formatoption="true">
                            </input>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrRepo001.ccy}">币种</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="ccy" name="ccy" class="layui-input form-input input-select"
                                data-th-data-result='${CCY}' th:initValue="${CCY_default}" allowClear="true"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" formatoption="true">
                            </input>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrRepo001.termType}">期限品种</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" class="layui-input form-input input-select" id="termType"
                                name="termType" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${TERM_TYPE_REBACK}'
                                maxlength="60">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrRepo001.ps}">交易方向</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="ps" name="ps" class="layui-input form-input input-select"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${BACK_LEND_DIRECTION}'>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrRepo001.entrustStatus}">有效状态</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="entrustStatus" name="entrustStatus"
                                class="layui-input form-input input-select" data-th-data-result='${ENTRUST_STATUS}'
                                allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                formatoption="true">
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrRepo001.entrustDate}">委托日期</label>
                        <div class="layui-input-inline input-inline">
                            <input id='entrustDate' name='entrustDate'
                                class="layui-input form-input input-dateRangeSelect" placeholder="请选择时间区间"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
	                    <label class="layui-form-label form-lable" data-th-text="#{EtrRepo001.priceModel}">价格模式</label>
	                    <div class="layui-input-inline input-inline">
	                        <select type="text" id="priceModel" name="priceModel" class="layui-input form-input input-select"
	                                data-th-data-result='${PRICE_MODEL}' th:allowClear="true" th:placeholder="请输入内容"
	                                data-th-placeholder="#{SysCommon.placeholder}" th:formatoption="true">
	                        </select>
	                    </div>
	                </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/entrust/etrrepo/EtrRepo001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
