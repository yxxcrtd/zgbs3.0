<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>债券一级投标委托</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area" >
            <a class="layui-btn layui-btn-sm btn-create" th:id="|${pageId}_btn_add|"
            data-th-text="#{SysCommon.create}">新建</a>
            <a th:id="|${pageId}_btn_import|" class="layui-btn layui-btn-sm btn-import">
                <i class="iconfont icon-import"></i><span data-th-text="#{EtrBondFirstLBidding001.import}"></span></a>
            <a th:id="|${pageId}_btn_revoke|" class="layui-btn layui-btn-sm btn-revoke">
                <i class="iconfont icon-revoke"></i><span data-th-text="#{ETR_REVERT}"></span></a>

            <a class="layui-btn layui-btn-sm btn-close" th:id="|${pageId}_btn_close|">
                <i class="iconfont icon-close"></i>
                <span data-th-text="#{SysCommon.close}"></span></a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
            <form class="layui-form"  id="searchForm" >
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrInvestAllInfo001.portfolioId}">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-url="@{/invest/entrust/etrbondfirstlbidding/EtrBondFirstLBidding002/getentrustIdAdd}"
                                                formatoption=true multiple="true">
                                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrInvestAllInfo001.ccy}">币种</label>
                        <div class="layui-input-inline input-inline">
                            <select type="ccy" name="ccy"  class="layui-input form-input input-select"  
                            data-th-data-result="${CCY}" th:initValue="${CCY_default}"></select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{EtrInvestAllInfo001.finprodId}">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" class="layui-input form-input input-lenovoselect" id="finprodId"
                                name="finprodId" data-th-placeholder="#{SysCommon.placeholder}" data-idfield="code"
                                data-keyfield="name"
                                data-th-data-effectivefieldsalias='|{"code":"#{EtrInvestAllInfo001.finprodId}",
                                    "shortName":"#{EtrInvestAllInfo001.finprodName}"}|'
                                data-th-data-url="@{/invest/entrust/etrbondfirstlbidding/EtrBondFirstLBidding001/getfinprodId(pageId=${pageId})}"
                                maxlength="60">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable" 
                        data-th-text="#{EtrBondFirstLBidding001.TradeMarket}">交易场所</label>
                         <div class="layui-input-inline input-inline">
                            <select type="text" id="tradeMarket" name="tradeMarket"
                            class="layui-input form-input input-select" data-th-data-result='${TRADE_PLACE}'
                            allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                            formatoption="true" ></select>
                        </div>   
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable" 
                        data-th-text="#{EtrInvestAllInfo001.entrustStatus}">有效状态</label>
                        <div class="layui-input-inline input-inline">
                            <select class="layui-input form-input input-select" data-th-data-result='${ENTRUST_STATUS}'
                            id="entrustStatus" name="entrustStatus" allowClear="true"
                            placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                            formatoption="true">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                        data-th-text="#{EtrBondFirstLBidding001.BidStatus}">中标状态</label>
                        <div class="layui-input-inline input-inline">
                            <select class="layui-input form-input input-select" data-th-data-result='${BID_STATUS}'
                            id="bidStatus" name="bidStatus" allowClear="true"  
                            placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                            formatoption="true">
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">指令日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="entrustDate" name="entrustDate"
                            class="layui-input form-input input-dateRangeSelect" 
                            placeholder="请选择、支持区间">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">投标日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="bidDate" name="bidDate"
                            class="layui-input form-input input-dateRangeSelect" 
                            placeholder="请选择、支持区间">
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="ptl-table">
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/invest/entrust/etrbondfirstlbidding/EtrBondFirstLBidding001.js}" type="text/javascript"></script>
</div>
</body>

</html>
