<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/default}">
<head>
	<title data-th-text="#{CfetsBondDealQuotedPrice001}">CFETS现券买卖报价</title>
	<style type="text/css">
		html,body,div.layui-fluid,#main_body{
			height: 100%;
		}
		.top_panel,.bottom_panel {
			width:100%;
			height: calc(50% - 5px);
			border: 1px solid #aaaaaa;
		}
		.bottom_panel {
			margin-top: 5px;
		}
		.left_bottom_panel {
			width:42%;
			float:left;
			height:100%;
			border: 1px solid #aaaaaa;
			display: inline-block;
		}
		.right_bottom_panel {
			width: 58%;
			height: 100%;
			padding-left: 10px;
			display: inline-block;
		}
		.gutter-vertical{
			width:100%;
			height:3px !important;
			background:#dbdbdd;
			-webkit-box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
			box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
			cursor:n-resize;
			float: right;
		}

		.gutter-horizontal{
			height:570px;
			width:3px !important;
			background:#dbdbdd;
			-webkit-box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
			box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
			cursor:ew-resize;
			float: left;
			margin-left: 2px;
		}
		/* 单个控件按钮长度 */
		.form-inline-wrap-btn {
			display: inline-block;
			float: left;
			width: 30%;
		}
		.form-label-wrap-radio {
			color: #444;
			line-height: 28px;
			padding: 0 10px 0 0;
			float: left;
			display: block;
			font-weight: 400;
			text-align: right;
		}
		.sgePortDiv{
			width:100%;
			overflow:hidden;
			clear:both;
			padding-top: 8px;
			display: inline-block;
		}
	</style>
</head>
<body>
<div id="main_body" layout:fragment="content">
	<div class="top_panel" id="top_panel_dev">
		<div style="height: 100%">
				<iframe th:src="@{/invest/bankuplink/bond/CfetsBondDealQuotedPriceMainQuery/init}" width="100%"
						height="100%" frameborder="0" style="border:none;"></iframe>
		</div>
	</div>
	<div class="bottom_panel" id="bottom_panel_dev">
		<div class="left_bottom_panel" id = "left_bottom_panel_dev" >
			<iframe id = "EtrEtfInfoHq" th:src="@{'/invest/bankuplink/bond/CfetsBondDealQuotedPriceMain/initHq'}" width="100%"
					height="100%"  frameborder="0"  style="border:none;"></iframe>
		</div>
		<div class="right_bottom_panel" id = "right_bottom_panel_dev" >
			<div class="layui-tab" style="height:calc(100% - 50px)" lay-filter="zlPlatform">
				<ul class="layui-tab-title">
					<li class="layui-this" id="danEtr_li">单组合交易下单</li>
					<li>组合系列交易下单</li>
					<img id="enlarge" th:src="@{'/img/enlarge.png'}" style="width: 20px;height: 20px; cursor: pointer;"></img>
					<img id="narrow" th:src="@{'/img/narrow.png'}" style="width: 20px;height: 20px; cursor: pointer; display: none;"></img>
				</ul>
				<div class="layui-tab-content" style="height:calc(100% - 20px)">
					<!-- 单组合指令 -->
					<div class="layui-tab-item layui-show" style="height: 100%;" id="danEtr_div">
							<div class="form-inline-wrap-btn">
							<a id="cfetsBondDealQuotedPriceSingle_dialogueBtn" class="layui-btn layui-btn-sm" data-th-text="#{CfetsBondDealQuotedPrice001.entrustOrder.searchArea.dialogueBtn}">对话</a>
							<a id="cfetsBondDealQuotedPriceSingle_requestBtn" class="layui-btn layui-btn-sm"  data-th-text="#{CfetsBondDealQuotedPrice001.entrustOrder.searchArea.requestBtn}">请求</a>
							</div>
							<iframe th:src="@{/invest/bankuplink/bond/CfetsBondDealQuotedPriceSingle/init}" width="100%"
									height="100%" frameborder="0" style="border:none;"></iframe>
<!--							<div style="height: 90%">-->
<!--							<iframe th:src="@{/invest/entrust/etribbondinfo/EtrIbBondinfo002/init}" width="100%"-->
<!--									height="100%" frameborder="0" style="border:none;"></iframe>-->
<!--							</div>-->
<!--							<div style="height: 90%;display: none">-->
<!--								<iframe th:src="@{/invest/entrust/etribbondinfo/EtrIbBondinfo002/init}" width="100%"-->
<!--										height="100%" frameborder="0" style="border:none;"></iframe>-->
<!--							</div>-->
					</div>
					<!-- 多组合指令 -->
					<div class="layui-tab-item"  style="height: 100%;">
							<div class="form-inline-wrap-btn">
								<a id="cfetsBondDealQuotedPriceMuti_dialogueBtn" class="layui-btn layui-btn-sm" data-th-text="#{CfetsBondDealQuotedPrice001.entrustOrder.searchArea.dialogueBtn}">对话</a>
								<a id="cfetsBondDealQuotedPriceMuti_requestBtn" class="layui-btn layui-btn-sm"  data-th-text="#{CfetsBondDealQuotedPrice001.entrustOrder.searchArea.requestBtn}">请求</a>
							</div>
							<iframe th:src="@{/invest/bankuplink/bond/CfetsBondDealQuotedPriceMuti/init}" width="100%"
									height="100%" frameborder="0" style="border:none;"></iframe>
					</div>
				</div>
			</div>
			<div id="baseRiskMathComm" class="page-component" style="display: none;"  th:data-path="@{/component/common/BaseRiskMathComm/init}"
				 th:data-params="|{workflowId: '${workflowId}',entityName:'riskTrialRetDto',tradeId:'${entrustId}'}|">
			</div>
			<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 5px;">
				<div class="text-center">
					<a id="EtrIbBondinfoMain_btn_fileupload" class="layui-btn layui-btn-sm" data-th-text="#{CfetsBondDealQuotedPrice001.fileupload}">上传附件</a>
					<a id="EtrIbBondinfoMain_btn_riskcal" class="layui-btn layui-btn-sm" data-th-text="#{CfetsBondDealQuotedPrice001.riskcal}">风险试算</a>
					<a id="EtrIbBondinfoMain_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
					<a id="EtrIbBondinfoMain_btn_submit" class="layui-btn layui-btn-sm  btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
					<a id="EtrIbBondinfoMain_btn_reset" class="layui-btn layui-btn-sm  btn-reset" data-th-text="#{SysCommon.reset}">重置</a>
				</div>
			</div>
		</div>
	</div>
</div>
<div layout:fragment="script">
	<script type="text/javascript" data-th-src="@{/public/js/message}"></script>
	<script data-th-inline="javascript" type="text/javascript">
		var entrustStatusUnAccept = /*[[${entrustStatusUnAccept}]]*/'';
		var entrustStatusAccept = /*[[${entrustStatusAccept}]]*/'';
		var quoteTypeDialog = /*[[${quoteTypeDialog}]]*/'';
		var quoteTypeRequest = /*[[${quoteTypeRequest}]]*/'';
		var ibuFlag_startDialogueQuoteWithNoEntrust = /*[[${ibuFlag_startDialogueQuoteWithNoEntrust}]]*/'';
		var ps_pay_name = /*[[${ps_pay_name}]]*/'';
		var ps_sell_name = /*[[${ps_sell_name}]]*/'';
		var sendStatus_fail = /*[[${sendStatus_fail}]]*/'';
		var sendStatus_unsend = /*[[${sendStatus_unsend}]]*/'';
		var sendStatus_send = /*[[${sendStatus_send}]]*/'';
		var quoteStatus_added = /*[[${quoteStatus_added}]]*/'';
		var quoteRoleTypeXJ = /*[[${quoteRoleTypeXJ}]]*/'';
		var quoteRoleTypeHF = /*[[${quoteRoleTypeHF}]]*/'';
		var quoteRoleTypeFZS = /*[[${quoteRoleTypeFZS}]]*/'';
		var quoteRoleTypeZS = /*[[${quoteRoleTypeZS}]]*/'';
		var bondTopic = /*[[${bondTopic}]]*/'';
	</script>
	<script data-th-src="@{/js/invest/entrust/etrexchangetrade/split.min.js}" type="text/javascript"></script>
	<script data-th-src="@{/js/invest/bankuplink/bond/CfetsBondDealQuotedPriceMain.js}" type="text/javascript"></script>
</div>
</body>
</html>
