<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>

</head>
<body>
<div layout:fragment="content">
    <style type="text/css">
        .form-inline-wrap {
            display: inline-block;
            float: left;
            width: 32%;
            padding-top: 10px;
        }
        .layui-form-radio {
            line-height: 28px;
            margin: 0 0 0 0;
            padding-right: 0px;
            cursor: pointer;
            font-size: 0;
        }
    </style>
    <div class="pro-module-container" style="margin-bottom: 20px;">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <input type="hidden" id="CfetsBondDealQuotedPrice005_hidden_entrustId" th:value="${entity?.entrustId}" />
            <input type="hidden" id="CfetsBondDealQuotedPrice005_hidden_finprodId" th:value="${entity?.finprodId}" />
            <input type="hidden" name="quotaPageModel" id="CfetsBondDealQuotedPrice005_hidden_quotaPageModel" th:value="${entity?.quotaPageModel}" />
            <input type="hidden" name="checkType" id="CfetsBondDealQuotedPrice005_hidden_checkType" th:value="${entity?.checkType}" />
            <input type="hidden" name="quoteId" th:value="${entity?.quoteId}" />
            <input type="hidden" name="quoteRoleType" th:value="${initQuoteRoleType}" />
            <input type="hidden" name="sendStatus" th:value="${initSendStatus}" />
            <input type="hidden" name="tradeStatus" th:value="${initTradeStatus}" />
            <input type="hidden" id="CfetsBondDealQuotedPrice005_hidden_entrustAmt" name="entrustAmt" th:value="${entity?.entrustNum}" />
            <div class="pro-module-wrapper pro-module-base" th:title="#{CfetsBondDealQuotedPrice003.baseinfo}">
                <input type="hidden" name="workflowId" th:value="${entity?.workflowId}" />
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" th:text="#{CfetsBondDealQuotedPrice003.baseinfo}">基本信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <!-- <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{CfetsBondDealQuotedPrice003.entrustId}">指令代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select th:disabled="${isRevert } eq ${YES_OR_NO_Y}" type="text" id="CfetsBondDealQuotedPrice003_entrustId" name="entrustId"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/queryEntrustInfoList}"
                                                allowClear="true" th:initValue="${entity?.entrustId}" formatoption="false"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{CfetsBondDealQuotedPrice003.portfolioName}">组合名称</label>
                                    <div class="layui-input-inline input-inline">
                                         <select required th:disabled="${isRevert } eq ${YES_OR_NO_Y}" type="text" id="CfetsBondDealQuotedPrice003_portfolioName" name="portfolioId"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/selectPortfolioId}" allowClear="true"
                                            formatoption="true"
                                            th:initValue="${entity?.portfolioId}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{CfetsBondDealQuotedPrice003.portfolioId}">组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                         <input required disabled type="text" id="CfetsBondDealQuotedPrice003_portfolioId"
                                           class="layui-input form-input" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.portfolioId}">

                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPrice003.my}">本方</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required th:disabled="${isRevert } eq ${YES_OR_NO_Y}" type="text" id="CfetsBondDealQuotedPrice005_mySide" name="mySide"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" parentIds="CfetsBondDealQuotedPrice005_portfolioName"
                                                th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/queryMySideList}" allowClear="true"
                                                formatoption="true"
                                                th:initValue="${entity?.mySide}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{CfetsBondDealQuotedPrice003.myTradeId}">本方交易员</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required th:disabled="${isRevert } eq ${YES_OR_NO_Y}" type="text" id="CfetsBondDealQuotedPrice005_mySideTrader" name="mySideTrader"

                                                formatoption="true"
                                                th:initValue="${entity?.mySideTrader}"></select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des" th:text="#{CfetsBondDealQuotedPrice003.offerInfo}">报价要素</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPrice003.ps}">交易方向</label>
                                <div class="layui-input-inline input-inline">
                                    <select required th:disabled="${isRevert } eq ${YES_OR_NO_Y}" type="text" id="CfetsBondDealQuotedPrice005_ps" name="ps"
                                            class="layui-input form-input input-select"
                                            placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                            th:data-result='${PS}' allowClear="true" formatoption="true"
                                            th:initValue="${entity?.ps}"></select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPrice003.effDate}">有效时间</label>
                                <div class="layui-input-inline input-inline">
                                    <!-- <input disabled type="text" id="effDate" name="effDate"
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.effDate==null ? ibuVar_quoteEffTime : #dates.format(entity?.effDate,'HH:mm')}"> -->

                                           class="layui-input form-input" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.effDate ==null ? effTime : entity?.effDate}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPrice003.settleCcy}">结算币种</label>
                                <div class="layui-input-inline input-inline">
                                    <select required disabled type="text" id="CfetsBondDealQuotedPrice005_settleCcy" name="settleCcy" class="layui-input form-input input-select"
                                            placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                            th:data-result='${CCY}' allowClear="true" formatoption="true"
                                            data-th-initvalue="${entity?.settleCcy}"></select>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{CfetsBondDealQuotedPrice003.bond}" >债券</label>
                                <div class="layui-input-inline input-inline buss-inline-wrap" style="width: 30%!important;display: inline-block;">
                                    <select required th:disabled="${isRevert } eq ${YES_OR_NO_Y}" type="text" id="CfetsBondDealQuotedPrice005_finprodName" name="finprodName"
                                            class="layui-input form-input input-select" allowClear="true"
                                            placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/queryFinprodIdPage}"
                                            data-th-initvalue="${entity?.finprodMarketId}">
                                    </select>
                                </div>
                                <div class="layui-input-inline input-inline buss-inline-wrap" style="width: 30%!important;display: inline-block;">
                                    <input disabled type="text" id="CfetsBondDealQuotedPrice005_finprodMarketId"
                                           class="layui-input form-input" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.finprodMarketId}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-text="#{CfetsBondDealQuotedPrice003.settleSpeed}" >清算速度</label>
                                <div class="layui-input-inline input-inline buss-inline-wrap" style="width: 30%!important;display: inline-block;">
                                    <select required th:disabled="${isRevert } eq ${YES_OR_NO_Y}" type="text" id="CfetsBondDealQuotedPrice005_settleSpreed" name="settleSpreed"
                                            class="layui-input form-input input-select"
                                            placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                            th:data-result='${ACCOUNT_SPEED}' allowClear="true" formatoption="true"
                                            th:initValue="${entity?.settleSpreed}"></select>
                                </div>
                                <div class="layui-input-inline input-inline buss-inline-wrap" style="width: 30%!important;display: inline-block;">
                                    <input disabled type="text" id="CfetsBondDealQuotedPrice005_settleDate" name="settleDate"
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${#dates.format(entity?.settleDate,'yyyy-MM-dd')}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPrice003.bondPrinamt}">券面总额</label>
                                <div class="layui-input-inline input-inline">
                                    <input required th:disabled="${isRevert } eq ${YES_OR_NO_Y}" type="text" id="CfetsBondDealQuotedPrice005_avaNum" name="avaNum"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           data-fixtype="2" data-textrange="2"
                                           th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.avaNumStr}">
                                    <span class="input-right-show">万元</span>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPrice003.settleMethod}">结算方式</label>
                                <div class="layui-input-inline input-inline">
                                    <select required th:disabled="${isRevert } eq ${YES_OR_NO_Y}" type="text" id="CfetsBondDealQuotedPrice005_settleMethod" name="settleMethod"
                                            class="layui-input form-input input-select"
                                            placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                            th:data-result='${SETT_MODE}' allowClear="true" formatoption="true"
                                            th:initValue="${entity?.settleMethod}"></select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPrice003.settleType}">清算类型</label>
                                <div class="layui-input-inline input-inline">
                                    <select required th:disabled="${isRevert } eq ${YES_OR_NO_Y}" type="text" id="CfetsBondDealQuotedPrice005_settleType" name="settleType"
                                            class="layui-input form-input input-select"
                                            placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                            th:data-result='${CLEAR_TYPE}' allowClear="true" formatoption="true"
                                            th:initValue="${entity?.settleType}"></select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des" th:text="#{CfetsBondDealQuotedPrice003.selectOrg}">可选机构</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item" th:if="${entity?.quotaPageModel}  neq 'response'">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPrice003.orgType}">选择机构</label>
                                <div class="layui-input-inline input-inline">
                                    <select type="text" id="CfetsBondDealQuotedPrice005_orgType" name="orgType"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/queryMySideList}" allowClear="true"
                                            formatoption="true"
                                    ></select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <a id="CfetsBondDealQuotedPrice005_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.add}">添加</a>

                            </div>
                        </div>
                        <div>
                            <table class="layui-table" id="CfetsBondDealQuotedPrice005_orgTable"></table>
                        </div>
                    </div>
                </div>

                <!-- 组合分配信息 -->
                <div class="page-component" th:data-path="@{/invest/bankuplink/common/CfetsQuotedCommon001/init}" id="cfetsQuotedCommon_div"
                     th:data-params="|{entityName: 'bussTrdTransferOrder', pageFrom: 'submitForm', entity:'${cfetsBondDealRequestQuoteDtoList}', bizCode:'${tradeId}', quoteType: '02'}|">
                </div>

                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des" th:text="#{CfetsBondDealQuotedPrice003.remark}">备注</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="layui-form-item">
                                    <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                    <textarea id="CfetsBondDealQuotedPrice005_remark" name="remark" maxlength="200" th:text="${entity?.remark}"
                                              class="layui-textarea" placeholder="请输入内容"
                                              th:placeholder="#{SysCommon.placeholder}"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        <div class="row text-center" style="margin: 20px 0;">
            <a id="CfetsBondDealQuotedPrice005_btn_save" th:if="${isRevert } ne ${YES_OR_NO_Y}" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="CfetsBondDealQuotedPrice005_btn_submit" th:if="${isRevert } ne ${YES_OR_NO_Y}" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="CfetsBondDealQuotedPrice005_btn_revokeBtn" th:if="${isRevert } eq ${YES_OR_NO_Y}"  class="layui-btn layui-btn-sm" data-th-text="#{CfetsBondDealQuotedPrice003.revokeBtn}">撤回</a>
            <a id="CfetsBondDealQuotedPrice005_btn_clinchDeal" th:if="${isRevert } eq ${YES_OR_NO_Y}" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{CfetsRepoDealQuotedPrice003.clinchDeal}">成交</a>
            <a id="CfetsBondDealQuotedPrice005_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var ACCOUNT_SPEED_1 = /*[[${ACCOUNT_SPEED_1}]]*/'';
        var ACCOUNT_SPEED_0 = /*[[${ACCOUNT_SPEED_0}]]*/'';
        var CNY = /*[[${CNY}]]*/'';
        var SETT_MODE_03 = /*[[${SETT_MODE_03}]]*/'';
        var CLEAR_TYPE_02 = /*[[${CLEAR_TYPE_02}]]*/'';
        var entity = /*[[${entity}]]*/'';
        var isRevert = /*[[${isRevert}]]*/'';
        var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'';
        var ouTraderIdCanEditFlag = /*[[${ouTraderIdCanEditFlag}]]*/'';
        var tradeStatus12 = /*[[${tradeStatus12}]]*/'';// 已回复
        var mySideInit = /*[[${entity?.mySide}]]*/'';
        var mySideTraderInit = /*[[${entity?.mySideTrader}]]*/'';
        var counterInfoList = /*[[${entity?.counterInfoList}]]*/'';
        var busWorkflowId = /*[[${busWorkflowId}]]*/'';
        var assetIsRight = /*[[${assetIsRight}]]*/'';
        var quotaPageModel = /*[[${quotaPageModel}]]*/'';
    </script>
    <script th:src="@{/js/invest/bankuplink/bond/CfetsBondDealQuotedPrice005.js}" type="text/javascript"></script>
</div>
