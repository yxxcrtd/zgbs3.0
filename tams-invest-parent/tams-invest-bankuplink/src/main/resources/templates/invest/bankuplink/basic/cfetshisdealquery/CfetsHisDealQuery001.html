<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">

<head>
<title data-th-text="#{CfetsHisDealQuery001}">CFETS历史报价查询</title>
</head>

<body>
	<div layout:fragment="content">
		<style type="text/css">
	        /* 按钮长度 */
	        .layui-btn-sm{
	        	width: 80px;
	        }
	        .layui-btn-sm-table {
			    width: 50px;
			}
	        
	        /* 单个控件长度 */
	        .form-inline-wrap {
			    width: 21%;
			}
			/* 单个控件label长度 */
			.form-label-wrap {
			    color: #444;
			    line-height: 28px;
			    padding: 0 10px 0 0;
			    width: 26%;
			}
			/* 单个控件按钮长度 */
	        .form-inline-wrap-btn {
			    display: inline-block;
			    float: left;
			    width: 10%;
			}
			/* 下拉框长度 */
			.select2-container--default{
				width: 161px !important;
			}
			
			/* 放大镜特殊处理 */
			.iconfont {
			    font-size: 21px;
			}
			
			
			/* 焦点选中颜色 */
			tr.layui-table-hover {
			   background: #f2f2f2 !important;
			}
			/* 鼠标点击颜色 */
			.layui-table tbody .table-row-select, .layui-table[lay-even] .table-row-select:nth-child(even) {
			    background-color: #33dee4 !important;
			}
			/* 表格字体大小 */
			.layui-table-header .layui-table-cell{
				font-weight: bolder;
			}
	    </style>
	    
	    
		<div class="layui-tab layui-tab-brief" lay-filter="docDemoTabBrief">
			<ul class="layui-tab-title">
				<li class="layui-this">现券买卖历史报价</li>
				<li>质押式回购历史报价</li>
			</ul>
			<div class="layui-tab-content">
				<!-- 现券买卖历史报价 -->
				<div class="layui-tab-item layui-show">
					<div class='layui-fluid'>
						<div class="layui-col-md12 form-button-area"></div>
						<div >
								<form class="layui-form" id="dvpTransferForm">
									<input type="hidden" class="layui-input form-input" name="loginTraderId" th:value="${loginTraderId}"/>
									<div class="layui-col-md12">
									
										<div class="layui-form-item">
											<div class="form-inline-wrap">
				                                 <label class="layui-form-label form-label-wrap"
				                                 	data-th-text="#{CfetsHisDealQuery001.Bond.portfolioId}">组合代码</label>
				                                 <div class="layui-input-inline input-inline">
				                                     <select type="text" id="bondProtfolioId" name="portfolioId" class="layui-input form-input input-select"
		                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" maxlength="60"
		                                                data-th-data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/selectPortfolioId}" formatoption = true></select>
				                                 </div>
				                            </div>
				                            <div class="form-inline-wrap">
				                                 <label class="layui-form-label form-label-wrap"
				                                 	data-th-text="#{CfetsHisDealQuery001.Bond.ps}">本方方向</label>
				                                 <div class="layui-input-inline input-inline">
				                                     <select type="text" id="bondPs" name="ps" class="layui-input form-input input-select"
		                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" maxlength="60"
		                                                data-th-data-result='${PS}' formatoption = true></select>
				                                 </div>
				                            </div>
				                            <div class="form-inline-wrap">
				                                 <label class="layui-form-label form-label-wrap"
				                                 	data-th-text="#{CfetsHisDealQuery001.Bond.assetId}">资产代码</label>
				                                 <div class="layui-input-inline input-inline">
				                                     <input type="text" id="bondFinprodId" name="finprodId" class="layui-input form-input input-lenovoselect"
		                                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" maxlength="60"
															data-th-data-effectivefieldsalias='|{"shortName":"#{FinBondTargetAsset002.finprodName}","code":"#{FinBondTargetAsset002.finprodId}"}|'
		                                               data-th-data-url="@{/invest/entrust/etrinvestbondinfo/EtrInvestBondInfo001/getfinprodId}" formatoption = true/>
				                                 </div>
				                            </div>
				                            <div class="form-inline-wrap">
				                                 <label class="layui-form-label form-label-wrap"
				                                 	data-th-text="#{CfetsHisDealQuery001.Bond.cpPartyId}">对手方</label>
				                                 <div class="layui-input-inline input-inline">
				                                     <select type="text" id="bondCpPartyId" name="cpPartyId" class="layui-input form-input input-select"
		                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" maxlength="60"
		                                                data-th-data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/queryMySideList}" formatoption = true>
		                                        	 </select>
				                                 </div>
				                            </div>
				                            <div class="layui-inline" style="float: left;">
												<a id="CfetsHisDealQuery001_btn_bondSearch" class="layui-btn layui-btn-sm btn-search">查询</a>
											</div>
		                                	<div class="layui-inline" style="padding-left:5px;">
												<a id="CfetsHisDealQuery001_btn_bondRevoke" class="layui-btn layui-btn-sm" data-th-text="#{CfetsHisDealQuery001.Bond.revoke}">撤销</a>
											</div>
				                            
				                        </div>
				                        <div class="layui-form-item">
				                        	<div class="form-inline-wrap">
				                                 <label class="layui-form-label form-label-wrap"
				                                 	data-th-text="#{CfetsHisDealQuery001.Bond.quoteDate}">交易日期</label>
				                                 <div class="layui-input-inline input-inline">
				                                     <input type="text" id="bondQuoteDate" name="bondQuoteDate" class="layui-input form-input input-dateRangeSelect"
		                                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" maxlength="60" formatoption = true/>
				                                 </div>
				                            </div>
				                            <div class="form-inline-wrap">
				                                 <label class="layui-form-label form-label-wrap"
				                                 	data-th-text="#{CfetsHisDealQuery001.Bond.tradeStatus}">成交状态</label>
				                                 <div class="layui-input-inline input-inline">
				                                     <select type="text" id="bondTradeStatus" name="tradeStatus" class="layui-input form-input input-select"
		                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" maxlength="60"
		                                                data-th-data-result='${DEAL_TYPE_IBU}' formatoption = true></select>
				                                 </div>
				                            </div>
				                            <div class="form-inline-wrap">
			                                    <label class="layui-form-label form-label-wrap"
			                                    	data-th-text="#{CfetsHisDealQuery001.Bond.cfetsQuoteId}">报价编号</label>
			                                    <div class="layui-input-inline input-inline">
			                                        <input type="text" id="bndQuoteId" name="cfetsQuoteId" class="layui-input form-input input-lenovoselect"
			                                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" maxlength="60"
														   data-th-data-effectivefieldsalias='|{"shortName":"#{CfetsHisDealQuery001.Bond.cfetsQuoteId}","code":"#{CfetsHisDealQuery001.Bond.cfetsQuoteId}"}|'
			                                               data-th-data-url="@{/invest/bankuplink/bond/CfetsBondDealQuotedPrice001/queryCfetsQuoteIdList}" formatoption = true/>
			                                    </div>
			                                </div>
			                                <div class="form-inline-wrap">
			                                    <label class="layui-form-label form-label-wrap"
			                                    	data-th-text="#{CfetsHisDealQuery001.Bond.entrustId}">指令代码</label>
			                                    <div class="layui-input-inline input-inline">
			                                        <input  type="text" id="bondEntrustId" name="entrustId" class="layui-input form-input input-lenovoselect" maxlength="60"
														placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
														data-th-data-effectivefieldsalias='|{"shortName":"#{CfetsHisDealQuery001.Bond.entrustId}","code":"#{CfetsHisDealQuery001.Bond.entrustId}"}|'
														data-th-data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/queryHisEntrustInfoList}" formatoption = true/>
		                                    	</div>
		                                	</div>
		                                	<!-- <div class="layui-inline" style="float: right;">
												<a id="CfetsHisDealQuery001_btn_bondExport" class="layui-btn layui-btn-sm btn-export btn-default" data-th-text="#{CfetsHisDealQuery001.Bond.export}">导出</a>
											</div> -->
											
			                            </div>
			                            
									</div>
								</form>
							</div>
						<div>
							<table class="layui-table" id="dvpTransferTable"></table>
						</div>
					</div>
				</div>
				
				<!-- 质押式回购欧历史报价 -->
				<div class="layui-tab-item">
					<div class='layui-fluid'>
					<div class="layui-col-md12 form-button-area substitutionSearchDiv">
						</div>
					<div>
						<form class="layui-form" id="transferForm">
							<input type="hidden" class="layui-input form-input" name="loginTraderId" th:value="${loginTraderId}"/>
							<div class="layui-col-md12">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
		                                 <label class="layui-form-label form-label-wrap"
		                                 	data-th-text="#{CfetsHisDealQuery001.Repo.portfolioId}">组合代码</label>
		                                 <div class="layui-input-inline input-inline">
		                                     <select type="text" id="repoProtfolioId" name="portfolioId" class="layui-input form-input input-select"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" maxlength="60"
                                                data-th-data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/selectPortfolioId}" formatoption = true></select>
		                                 </div>
		                            </div>
		                            <div class="form-inline-wrap">
		                                 <label class="layui-form-label form-label-wrap"
		                                 	data-th-text="#{CfetsHisDealQuery001.Repo.ps}">本方方向</label>
		                                 <div class="layui-input-inline input-inline">
		                                     <select type="text" id="repoPs" name="ps" class="layui-input form-input input-select"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" maxlength="60"
                                                data-th-data-result='${BACK_LEND_DIRECTION}' formatoption = true></select>
		                                 </div>
		                            </div>
		                            <div class="form-inline-wrap">
		                                 <label class="layui-form-label form-label-wrap"
		                                 	data-th-text="#{CfetsHisDealQuery001.Repo.cpPartyId}">对手方</label>
		                                 <div class="layui-input-inline input-inline">
		                                     <select type="text" id="repoCpPartyId" name="cpPartyId" class="layui-input form-input input-select"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" maxlength="60"
                                                data-th-data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/queryMySideList}" formatoption = true>
                                        </select>
		                                 </div>
		                            </div>		                            
		                            <div class="form-inline-wrap">
		                                 <label class="layui-form-label form-label-wrap"
		                                 	data-th-text="#{CfetsHisDealQuery001.Repo.quoteDate}">交易日期</label>
		                                 <div class="layui-input-inline input-inline">
		                                     <input type="text" id="repoQuoteDate" name="repoQuoteDate" class="layui-input form-input input-dateRangeSelect"
                                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" maxlength="60" formatoption = true/>
		                                 </div>
		                            </div>
		                            <div class="layui-inline" style="float: left;">
										<a id="CfetsHisDealQuery001_btn_repoSearch" class="layui-btn layui-btn-sm btn-search">查询</a>
									</div>
		                            <div class="layui-inline" style="padding-left:5px;">
										<a id="CfetsHisDealQuery001_btn_repoRevoke" class="layui-btn layui-btn-sm" data-th-text="#{CfetsHisDealQuery001.Repo.revoke}">撤销</a>
									</div>
		                            
		                            
		                        </div>
		                        <div class="layui-form-item">
		                            <div class="form-inline-wrap">
		                                 <label class="layui-form-label form-label-wrap"
		                                 	data-th-text="#{CfetsHisDealQuery001.Repo.tradeStatus}">成交状态</label>
		                                 <div class="layui-input-inline input-inline">
		                                     <select type="text" id="repoTradeStatus" name="tradeStatus" class="layui-input form-input input-select"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" maxlength="60"
                                                data-th-data-result='${DEAL_TYPE_IBU}' formatoption = true></select>
		                                 </div>
		                            </div>
		                            <div class="form-inline-wrap">
	                                    <label class="layui-form-label form-label-wrap"
	                                    	data-th-text="#{CfetsHisDealQuery001.Repo.cfetsQuoteId}">报价编号</label>
	                                    <div class="layui-input-inline input-inline">
	                                        <input type="text" id="repoQuoteId" name="cfetsQuoteId" class="layui-input form-input input-lenovoselect"
	                                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" maxlength="60"
												   data-th-data-effectivefieldsalias='|{"shortName":"#{CfetsHisDealQuery001.Bond.cfetsQuoteId}","code":"#{CfetsHisDealQuery001.Bond.cfetsQuoteId}"}|'
												   data-th-data-url="@{/invest/bankuplink/repo/CfetsRepoDealQuotedPrice001/queryCfetsQuoteIdList}" formatoption = true/>
	                                    </div>
	                                </div>
	                                <div class="form-inline-wrap">
	                                    <label class="layui-form-label form-label-wrap"
	                                    	data-th-text="#{CfetsHisDealQuery001.Repo.entrustId}">指令代码</label>
	                                    <div class="layui-input-inline input-inline">
	                                    	<input  type="text" id="repoEntrustId" name="entrustId" class="layui-input form-input input-lenovoselect" maxlength="60"
										    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
										    data-th-data-effectivefieldsalias='|{"shortName":"#{CfetsHisDealQuery001.Bond.entrustId}","code":"#{CfetsHisDealQuery001.Bond.entrustId}"}|'
										    data-th-data-url="@{/invest/bankuplink/repo/CfetsRepoDealQuotedPrice002/queryHisEntrustInfoList}" formatoption = true/>
                                    	</div>
                                	</div>
                                	<!-- <div class="layui-inline" style="float: right;">
										<a id="CfetsHisDealQuery001_btn_repoExport" class="layui-btn layui-btn-sm btn-export btn-default" data-th-text="#{CfetsHisDealQuery001.Repo.export}">导出</a>
									</div>  -->                            	
	                            </div>
							</div>
						</form>
						</div>
						<div>
							<table class="layui-table" id="transferTable"></table>
						</div>
					</div>
				</div>
			</div>
		</div>

	</div>
	<div layout:fragment="script">
		<script type="text/javascript" data-th-src="@{/public/js/message}"></script>
		<script data-th-inline="javascript" type="text/javascript">
			var ps_pay_name = /*[[${ps_pay_name}]]*/'';
			var ps_sell_name = /*[[${ps_sell_name}]]*/'';
			var quoteRoleTypeFZS = /*[[${quoteRoleTypeFZS}]]*/'';
		</script>

		<script data-th-src="@{/js/invest/bankuplink/basic/cfetshisdealquery/CfetsHisDealQuery001.js}" type="text/javascript"></script>
	</div>
</body>

</html>
