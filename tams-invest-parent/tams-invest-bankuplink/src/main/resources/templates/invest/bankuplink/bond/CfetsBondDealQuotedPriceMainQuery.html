<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/default}">
<head>
	<title data-th-text="#{CfetsBondDealQuotedPrice001}">CFETS现券买卖报价</title>
	<style type="text/css">
		html {
			overflow: hidden;
		}
		.top_panel {
			width:100%;
			float: right;
			border: 1px solid #aaaaaa;
			display: inline-block;
		}
		.bottom_panel {
			width:100%;
			float: right;
			height:45.5%;
			margin:1px;
			border: 1px solid #aaaaaa;
			display: inline-block;
		}
		.left_bottom_panel {
			width:42%;
			float:left;
			height:100%;
			border: 1px solid #aaaaaa;
			display: inline-block;
		}
		.right_bottom_panel {
			float:right;
			width:57.5%;
			height:100%;
			display: inline-block;
		}
		.gutter-vertical{
			width:100%;
			height:3px !important;
			background:#dbdbdd;
			-webkit-box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
			box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
			cursor:n-resize;
			float: right;
		}

		.gutter-horizontal{
			height:570px;
			width:3px !important;
			background:#dbdbdd;
			-webkit-box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
			box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
			cursor:ew-resize;
			float: left;
			margin-left: 2px;
		}
		/* 单个控件按钮长度 */
		.form-label-wrap-radio {
			color: #444;
			line-height: 28px;
			padding: 0 10px 0 0;
			float: left;
			display: block;
			font-weight: 400;
			text-align: right;
		}
		.sgePortDiv{
			width:100%;
			overflow:hidden;
			clear:both;
			padding-top: 8px;
			display: inline-block;
		}
	</style>
</head>
<body>
<div id="main_body" layout:fragment="content">
		<div class="layui-tab"  lay-filter="TopPlatform">
			<ul class="layui-tab-title">
				<li id="ZLZX" class="layui-this">指令执行</li>
				<li id="WTCX">委托查询</li>
				<li id="CJCX">成交查询</li>
			</ul>
			<div class="layui-tab-content">
				<!-- 指令执行 -->
				<div id="zlzx_tab" class="layui-tab-item layui-show">
						<form class="layui-form" id="cfetsBondDealQuotedPrice001_entrustOrder_form">
							<div class="layui-row layui-col-space10" style="background: #f5f5f5;">
								<div class="layui-inline layui-col-md3 layui-col-lg3">
									<a id="cfetsBondDealQuotedPrice001_accept" class="layui-btn layui-btn-sm" data-th-text="#{CfetsBondDealQuotedPrice001.entrustOrder.searchArea.accept}">接收</a>

								<div class="layui-inline layui-col-md3 layui-col-lg3">

										<a id='CfetsBondDealQuotedPrice001_entrustOrder_search' class="iconinput" href='javascript:;'><i class='iconfont icon-search'></i></a>
									</div>
								</div>
								<div class="layui-inline layui-col-md4 layui-col-lg4 layui-col-md-offset1 layui-col-lg-offset1">
									<label class="form-label-wrap-radio">
										<input type="radio" name="entrustStatus" value="whole" title="全部" checked>
									</label>
									<label class="form-label-wrap-radio">
										<input type="radio" name="entrustStatus" value="unAccept"

									</label>
									<label class="form-label-wrap-radio">
										<input type="radio" name="entrustStatus" value="unComplete"

									</label>

									</label>
								</div>
								<div class="layui-inline layui-col-md1 layui-col-lg1">
									<!----start-->
									<div  style="display: inline-block;float: left;">
										<a class="layui-btn layui-btn-sm "  id="CfetsBondDealQuotedPrice001_entrustOrder_btn_seach">查询</a>
										<div id="selectorConditionFilter001" style="margin-top: 10px;display:none;border: 1px solid #ccc;position: absolute; right:100px;background: #fff;z-index: 100 ;width:400px;">
											<div class="sgePortDiv">
												<label class="layui-form-label form-label"

												<div class="layui-input-inline input-inline" >

													</select>
												</div>
											</div>
											<div class="sgePortDiv">
												<label class="layui-form-label form-label"

												<div class="layui-input-inline input-inline" >
													<select type="text" name="finprodId"  id="finprodId" multiple="true"
															class="layui-input form-input input-select" placeholder="请输入内容"

															allowClear="true">
													</select>
												</div>

											</div>
											<div class="sgePortDiv">
												<label class="layui-form-label form-label">交易方向</label>

													<select type="text" id="ps"name="ps" class="layui-input form-input input-select"
															placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
															data-th-data-result='${PS}' allowClear="true" formatoption="true"></select>
												</div>
											</div>
											<div class="sgePortDiv" style="display: none">

													<select type="text" id="settleSpreed" name="settleSpreed" class="layui-input form-input input-select"

															data-th-data-result='${ACCOUNT_SPEED}' allowClear="true" formatoption="true"></select>
												</div>
											</div>
											<div class="sgePortDiv">
												<label class="layui-form-label form-label"

												<div class="layui-input-inline input-inline">
													<select type="text" name="invManagerId" id="invManagerId"

															allowClear="true" placeholder="请输入内容" multiple="true"
															data-th-placeholder="#{SysCommon.placeholder}"
															data-th-data-url="@{/invest/trade/investtrade/commanddispatcher/TrdCommandDispatcher001/getManagers}">
													</select>
												</div>
											</div>
											<div class="sgePortDiv" style="display: none">
												<label class="layui-form-label form-label"
													   data-th-text="#{CfetsHisDealQuery001.Bond.entrustId}">委托代码</label>
												<div class="layui-input-inline input-inline">
													<select  type="text" id="entrustId" name="entrustId" class="layui-input form-input input-select" maxlength="60"
															 placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
															 data-th-data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/queryEntrustInfoList?noLoginUserId=true}" formatoption = "false"></select>
												</div>
											</div>
											<div class="sgePortDiv" style="display: none">
												<label class="layui-form-label form-lable" style="width: 80px!important;padding-left:15px;">指令日期</label>
												<div class="layui-input-inline input-inline" style="width: 212px!important;padding-left: 5px;margin-right: 130px;">
													<input id='entrustDate' name='entrustDate'
														   class="layui-input form-input input-dateRangeSelect" placeholder="请选择时间区间"
														   data-th-placeholder="#{SysCommon.placeholder}">
												</div>
											</div>

											<div class="sgePortDiv" style="text-align: center">
												<a id="CfetsBondDealQuotedPrice001_entrustOrder_btn_realseach" style="margin-left:40px" class="layui-btn layui-btn-sm"
												   data-th-text="确定">确定</a>
												<a id="CfetsBondDealQuotedPrice001_entrustOrder_btn_seachClose" style="margin-left:40px" class="layui-btn layui-btn-sm"
												   data-th-text="取消">取消</a>
												<a id="CfetsBondDealQuotedPrice001_entrustOrder_btn_seachReset" style="margin-left:40px" class="layui-btn layui-btn-sm"
												   data-th-text="重置">重置</a>

										</div>
									</div>
									<!----end-->
									<div style="display: inline-block;float: left; padding-left:10px;">
										<a class="layui-btn layui-btn-sm"  id="CfetsBondDealQuotedPrice001_entrustOrder_btn_export" >导出</a>
									</div>

							</div>
						</form>
						<div>
							<table class="layui-table" id="CfetsBond001_entrust_table"></table>
						</div>
				</div>

								</div>
								<div class="layui-inline layui-col-md1 layui-col-lg1">

												</div>

													<select type="text" id="mySideTrader" name="mySideTrader"
															class="layui-input form-input input-select" placeholder="请输入内容"
															th:placeholder="#{SysCommon.placeholder}" parentIds="mySide"
															th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/queryMySideTraderList}" allowClear="true"
															formatoption="true" ></select>
												</div>
											</div>
											<div class="sgePortDiv">
												<label class="layui-form-label form-label">对手方</label>
												<div class="layui-input-inline input-inline">
													<select type="text" id="counterId" name="counterId"
															class="layui-input form-input input-select"
															th:placeholder="#{SysCommon.placeholder}" placeholder="请输入内容"
															th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/queryCounterSideList}" allowClear="true"
															formatoption="true" ></select>
												</div>
											</div>
											<div class="sgePortDiv">
												<label class="layui-form-label form-label">对手方交易员</label>
												<div class="layui-input-inline input-inline">
													<select type="text" id="counterTrader" name="counterTrader"
															class="layui-input form-input input-select" parentIds="CfetsBondDealQuotedPrice002_counterId"

															th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/queryMySideTraderList}" allowClear="true"
															formatoption="true" ></select>
												</div>
											</div>
											<div class="sgePortDiv" style="display: none">

														   data-fixtype="2" data-textrange="2"

										<a class="layui-btn layui-btn-sm "  id="CfetsBondDealQuotedPrice001_dayOffer_btn_seach">查询</a>

								</div>
							</div>

							<table class="layui-table" id="CfetsBond001_dayOffer_table"></table>
