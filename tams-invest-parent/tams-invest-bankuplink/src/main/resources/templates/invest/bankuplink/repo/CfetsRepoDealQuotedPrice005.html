<!DOCTYPE html>
<html  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"  xmlns:th="http://www.springframework.org/schema/mvc"
    layout:decorate="~{layout/default}">

<head>
<title data-th-text="#{CfetsBondDealQuotedPrice005}">指令明细查询</title>
</head>

<body>
    <div layout:fragment="content">
        <style type="text/css">
			/* 单个控件长度 */
			.form-inline-wrap {
				display: inline-block;
				float: left;
				width: 15%;
				padding-top: 10px;
			}
			/* 单个控件label长度 */
			.form-label-wrap {
				color: #444;
				line-height: 28px;
				padding: 0 10px 0 0;
				width: 26%;
			}
			/* 单个控件按钮长度 */
			.form-inline-wrap-btn {
				display: inline-block;
				float: left;
				width: 10%;
			}
			/* 下拉框长度 */
			.select2-container--default {
				width: 164px !important;
			}
			/* 放大镜特殊处理 */
			.iconfont {
				font-size: 21px;
			}
			/* 焦点选中颜色 */
			tr.layui-table-hover {
			   background: #f2f2f2 !important;
			}
			/* 鼠标点击颜色 */
			.layui-table tbody .table-row-select, .layui-table[lay-even] .table-row-select:nth-child(even) {
			    background-color: #33dee4 !important;
			}
			/* 表格字体大小 */
			.layui-table-header .layui-table-cell{
				font-weight: bolder;
			}
			/* 单个控件radio样式 */
			/* 单个控件radio长度 */
			.form-inline-wrap-radio {
			    display: inline-block;
			    float: left;
			    width: 14%;
			}
			.form-label-wrap-radio {
			    color: #444;
			    line-height: 28px;
			    padding: 0 10px 0 0;
			    float: left;
			    display: block;
			    font-weight: 400;
			    text-align: right;
			}
			.layui-form-radio {
			    line-height: 28px;
			    cursor: pointer;
			    font-size: 0;
			    margin: 0 0 0 0 !important;
			    padding-right: 0px !important;
			}
			.layui-form-radio>i {
			    font-size: 11px;
			}
</style>
        <div class="layui-tab-item layui-show">
            <div class='layui-fluid'>
                <form class="layui-form joyin-form-wrap pro-module-form"
                    id="cfetsRepoDealQuotedPrice005_entrustOrder_form">
                    <input type="hidden" id="entrustIds" th:value="${entrustIds}" name="entrustIds"/>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md2  layui-col-sm2 layui-col-lg2">
                            <label class="layui-form-label form-label-wrap" style="width: 30%!important;"
                                th:text="#{CfetsRepoDealQuotedPrice001.entrustOrder.searchArea.portfolioId}">组合代码</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" name="portfolioId" class="layui-input form-input input-select"
                                    placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}" multiple="true"
                                    th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/selectPortfolioId}" allowClear="true">
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md2  layui-col-sm2 layui-col-lg2">
                            <label class="layui-form-label form-label-wrap" style="width: 30%!important;"
                                th:text="#{CfetsRepoDealQuotedPrice001.entrustOrder.searchArea.ps}">方向</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" name="ps" class="layui-input form-input input-select"
                                    th:disabled="${isDzh} eq 'Y'"
                                    placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}" th:initValue="${ps}"
                                    data-th-data-result='${BACK_LEND_DIRECTION}' allowClear="true" formatoption="true"></select>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md2  layui-col-sm2 layui-col-lg2">
                            <label class="layui-form-label form-label-wrap" style="width: 30%!important;"
                                th:text="#{CfetsRepoDealQuotedPrice001.entrustOrder.searchArea.invManagerId}">投资经理</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" name="invManagerId" class="layui-input form-input input-select"
                                    allowClear="true" placeholder="请输入内容" multiple="true"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-url="@{/invest/trade/investtrade/commanddispatcher/TrdCommandDispatcher001/getManagers}">
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md2  layui-col-sm2 layui-col-lg2">
                            <label class="layui-form-label form-label-wrap" style="width: 30%!important;"
                                th:text="#{CfetsRepoDealQuotedPrice001.entrustOrder.searchArea.entrustId}">指令代码</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" name="entrustId" class="layui-input form-input input-select" formatoption="false"
                                        placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}" multiple="true"
                                        th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/selectEntrustId?finprodType2=F03}" allowClear="true">
                                </select>
                                <input type="hidden" name="entrustIdOne" class="layui-input form-input" placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}" th:value="${entrustIdOne}">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md3  layui-col-sm3 layui-col-lg3">
                            <label class="layui-form-label form-label-wrap"> <a
                                id='CfetsRepoDealQuotedPrice005_entrustOrder_search' class="input-right-show"
                                href='javascript:;' style='border: none; color: #4893e6; left: 0%; padding-top: 5px;'>
                                    <i class='iconfont icon-search'></i>
                            </a>
                            </label>
                            <!-- </label> <label class="form-label-wrap-radio" style="padding-left: 45px;"> <input
                                type="radio" name="entrustStatus" value="unAccept"
                                th:title="#{CfetsRepoDealQuotedPrice001.entrustOrder.searchArea.unAcceptRadio}">
                            </label> <label class="form-label-wrap-radio"> <input type="radio" name="entrustStatus"
                                value="unComplete"
                                th:title="#{CfetsRepoDealQuotedPrice001.entrustOrder.searchArea.unComplete}">
                            </label> <label class="form-label-wrap-radio"> <input type="radio" name="entrustStatus"
                                value="completed"
                                th:title="#{CfetsRepoDealQuotedPrice001.entrustOrder.searchArea.completed}">
                            </label> -->
                        </div>
                    </div>
                </form>
                <div>
                    <table class="layui-table" id="CfetsRepoDealQuotedPrice005_entrust_table"></table>
                </div>
                <div class="row text-center" style="margin: 20px 0;">
                    <a id="CfetsRepoDealQuotedPrice005_btn_confirm" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.confirm}">确认</a>
                    <a id="CfetsRepoDealQuotedPrice005_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script type="text/javascript" data-th-src="@{/public/js/message}"></script>
        <script data-th-inline="javascript" type="text/javascript">
        	var settleSpreed = /*[[${settleSpreed}]]*/'';
        	var isDzh = /*[[${isDzh}]]*/'';
            var term = /*[[${term}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/bankuplink/repo/CfetsRepoDealQuotedPrice005.js}" type="text/javascript"></script>
    </div>
</body>

</html>
