<!DOCTYPE html>
<html style="height:80%;" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.w3.org/1999/xhtml" layout:decorate="~{layout/default}">
<meta charset="UTF-8" />
<head>
</head>
<body>
<div layout:fragment="content" id="CfetsBondDealQuotedPriceSingle002_bodydiv">
    <style type="text/css">
        .layui-form-radio {
            line-height: 24px;
            padding-right: 0px;
            margin: 0px;
        }
        .layui-form-radio div {
            font-size: 12px;
        }
        .layui-form-radio i{
            font-size: 14px;
        }
    </style>
    <div class="joyin-form-wrap">
        <form class="layui-form pro-module-form" id="submitForm">
            <input type="hidden" id="businessId" name="businessId" th:value="${businessId?: ''}">
            <input type="hidden" id="CfetsBondDealQuotedPriceSingle002_hidden_entrustId" th:value="${entity?.entrustId}" />
            <input type="hidden" id="CfetsBondDealQuotedPriceSingle002_hidden_finprodId" th:value="${entity?.finprodId}" />
            <input type="hidden" id="CfetsBondDealQuotedPriceSingle002_settleCcy" name="settleCcy" th:value="${entity?.settleCcy?:CNY}"/>
            <input type="hidden" id="CfetsBondDealQuotedPriceSingle002_hidden_calculateField" th:value="${calcTypeUnitCprice}" />
            <input type="hidden" name="quotaPageModel" id="CfetsBondDealQuotedPriceSingle002_hidden_quotaPageModel" th:value="${entity?.quotaPageModel}" />
            <input type="hidden" name="checkType" id="CfetsBondDealQuotedPriceSingle002_hidden_checkType" th:value="${entity?.checkType}" />
            <input type="hidden" name="quoteId" th:value="${entity?.quoteId}" />
            <input type="hidden" name="quoteRoleType" th:value="${initQuoteRoleType}" />
            <input type="hidden" name="sendStatus" th:value="${initSendStatus}" />
            <input type="hidden" name="tradeStatus" th:value="${initTradeStatus}" />
            <input type="hidden" id="CfetsBondDealQuotedPriceSingle002_hidden_entrustAmt" name="entrustAmt" th:value="${entity?.entrustNum}" />
            <input type="hidden" name="workflowId" th:value="${entity?.workflowId}" />
            <div class="layui-tab-item layui-show" style="height:30px;" id="cash_div">
                <iframe th:src="@{/invest/bankuplink/reponew/CfetsRepoDealQuotedPrInitCash/initCash}" width="100%"
                        height="100%" frameborder="0" style="border:none;"></iframe>
            </div>

            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap"
                           th:text="#{CfetsBondDealQuotedPriceSingle.entrustId}">指令代码</label>
                    <div class="layui-input-inline input-inline">
                        <select disabled type="text" id="CfetsBondDealQuotedPriceSingle002_entrustId" name="entrustId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                th:placeholder="#{SysCommon.placeholder}" th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/queryEntrustInfoList}"
                                allowClear="true" th:initValue="${entity?.entrustId}" formatoption="false"></select>
                    </div>
                </div>

                <div class="form-inline-wrap" style=" width: 50%; padding:0px;" >
                    <label class="layui-form-label form-label-wrap" data-th-text="#{CfetsBondDealQuotedPriceSingle.portfolioId}">组合名称</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <select required
                                type="text"
                                id="CfetsBondDealQuotedPriceSingle002_portfolioId"
                                name="portfolioId"
                                class="layui-input form-input input-select"
                                placeholder="请输入内容"
                                th:placeholder="#{SysCommon.placeholder}"
                                th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/selectPortfolioId}"
                                allowClear="true"
                                formatoption="true"
                                th:initValue="${entity?.portfolioId}"
                        ></select>
                    </div>
                </div>
            </div>

            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{CfetsBondDealQuotedPriceSingle.finprodId}">资产代码</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <select disabled
                                type="text"
                                id="CfetsBondDealQuotedPriceSingle002_finprodId"
                                name="finprodMarketId"
                                class="layui-input form-input input-select"
                                allowClear="true"
                                placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                required="required"
                                data-formatoption="true"
                                data-th-data-url="@{/invest/bankuplink/bond/CfetsBondDealQuotedPriceSingle/getfinprodIdForAdd}"
                                data-th-initvalue="${entity?.finprodMarketId}"
                        ></select>
                    </div>
                </div>

                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.ps}">交易方向</label>
                    <div class="layui-input-inline input-inline">
                        <select required disabled type="text" id="CfetsBondDealQuotedPriceSingle002_ps" name="ps"
                                class="layui-input form-input input-select"
                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                th:data-result='${PS}' allowClear="true" formatoption="true"
                                th:initValue="${entity?.ps}"></select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.settleType}">清算类型</label>
                    <div class="layui-input-inline input-inline">
                        <select required type="text" id="CfetsBondDealQuotedPriceSingle002_settleType" name="settleType"
                                class="layui-input form-input input-select"
                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                th:data-result='${CLEAR_TYPE}' allowClear="true" formatoption="true"
                                th:initValue="${entity?.settleType}"></select>
                    </div>
                </div>

                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{CfetsBondDealQuotedPriceSingle.settleSpeed}" >清算速度</label>
                    <div class="layui-input-inline input-inline" >
                        <select required type="text" id="CfetsBondDealQuotedPriceSingle002_settleSpreed" name="settleSpreed"
                                class="layui-input form-input input-select"
                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                th:data-result='${ACCOUNT_SPEED}' allowClear="true" formatoption="true"
                                th:initValue="${entity?.settleSpreed}"></select>
                    </div>
                </div>

            </div>

            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.tradeDate}">交易日期</label>
                    <div class="layui-input-inline input-inline buss-inline-wrap" >
                        <input disabled type="text" id="CfetsBondDealQuotedPriceSingle002_tradeDate" name="tradeDate"
                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                               th:placeholder="#{SysCommon.placeholder}"
                               th:value="${platDate}">
                    </div>
                </div>

                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.settleMethod}">结算方式</label>
                    <div class="layui-input-inline input-inline">
                        <select required type="text" id="CfetsBondDealQuotedPriceSingle002_settleMethod" name="settleMethod"
                                class="layui-input form-input input-select"
                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                th:data-result='${SETT_MODE}' allowClear="true" formatoption="true"
                                th:initValue="${entity?.settleMethod}"></select>
                    </div>
                </div>

            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.settleDate}">结算日期</label>
                    <div class="layui-input-inline input-inline buss-inline-wrap" >
                        <input disabled type="text" id="CfetsBondDealQuotedPriceSingle002_settleDate" name="settleDate"
                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                               th:placeholder="#{SysCommon.placeholder}"
                               th:value="${#dates.format(entity?.settleDate,'yyyy-MM-dd')}">
                    </div>
                </div>

                <div class="form-inline-wrap"  style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap"
                           th:text="#{CfetsBondDealQuotedPriceSingle.secManageAcctId}">证券账户</label>
                    <div class="layui-input-inline input-inline">
                        <select disabled type="text" id="CfetsBondDealQuotedPriceSingle002_secManageAcctId" name="secManageAcctId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                th:placeholder="#{SysCommon.placeholder}"  th:data-url="@{/component/trade/BussChannelCommon/getSecManageAcctId}"
                                allowClear="true" th:initValue="${entity?.secManageAcctId}"></select>
                    </div>
                </div>

            </div>

            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.bondPrinamt}">券面总额(万元)</label>
                    <div class="layui-input-inline input-inline">
                        <input required type="text" id="CfetsBondDealQuotedPriceSingle002_avaNum" name="avaNum"
                               class="layui-input form-input text-number" placeholder="请输入内容"
                               data-fixtype="2" data-textrange="2"
                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.avaNumStr}">
                        <span class="input-right-show">万元</span>
                    </div>
                </div>

                <div class="form-inline-wrap" style=" width: 50%; padding:0px;" >
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.effDate}">有效时间</label>
                    <div class="layui-input-inline input-inline">
                        <input disabled type="text" id="CfetsBondDealQuotedPriceSingle002_effDate" name="effDate"
                               class="layui-input form-input" placeholder="请输入内容"
                               th:placeholder="#{SysCommon.placeholder}"
                               th:value="${entity?.effDate ==null ? effTime : entity?.effDate}">
                    </div>
                </div>
            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPrice002.my}">本方</label>
                    <div class="layui-input-inline input-inline">
                        <select required type="text" id="CfetsBondDealQuotedPriceSingle002_mySide" name="mySide"
                                class="layui-input form-input input-select" parentIds="CfetsBondDealQuotedPriceSingle002_portfolioId"
                                th:placeholder="#{SysCommon.placeholder}" placeholder="请输入内容"
                                th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/queryMySideList}" allowClear="true"
                                formatoption="true" th:initValue="${entity?.mySide}"></select>
                    </div>
                </div>

                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap"
                           th:text="#{CfetsBondDealQuotedPriceSingle.myTradeId}">本方交易员</label>
                    <div class="layui-input-inline input-inline">
                        <select required type="text" id="CfetsBondDealQuotedPriceSingle002_mySideTrader" name="mySideTrader"
                                class="layui-input form-input input-select" parentIds="CfetsBondDealQuotedPriceSingle002_mySide"
                                th:placeholder="#{SysCommon.placeholder}" placeholder="请输入内容"
                                th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/queryMySideTraderList}" allowClear="true"
                                formatoption="true" th:initValue="${entity?.mySideTrader}"></select>
                    </div>
                </div>
            </div>

            <div class="pro-module-wrap">

                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des" th:text="#{CfetsBondDealQuotedPrice003.selectOrg}">可选机构</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item" th:if="${entity?.quotaPageModel}  neq 'response'">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPrice003.orgType}">选择机构</label>
                                <div class="layui-input-inline input-inline">
                                    <select type="text" id="CfetsBondDealQuotedPriceSingle002_orgType" name="orgType"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/queryMySideList}" allowClear="true"
                                            formatoption="true"
                                    ></select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <a id="CfetsBondDealQuotedPriceSingle002_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.add}">添加</a>
                            </div>
                        </div>
                        <div>
                            <table class="layui-table" id="CfetsBondDealQuotedPriceSingle002_orgTable"></table>
                        </div>
                    </div>
                </div>

                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des" th:text="#{CfetsBondDealQuotedPriceSingle.remark}">备注</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="layui-form-item">
                                <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                    <textarea id="CfetsBondDealQuotedPriceSingle002_remark" name="remark" maxlength="200" th:text="${entity?.remark}"
                                              class="layui-textarea" placeholder="请输入内容"
                                              th:placeholder="#{SysCommon.placeholder}"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row text-center" style="margin: 20px 0;">
                <a id="CfetsBondDealQuotedPriceSingle002_btn_save" th:if="${isRevert } ne ${YES_OR_NO_Y}" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                <a id="CfetsBondDealQuotedPriceSingle002_btn_submit" th:if="${isRevert } ne ${YES_OR_NO_Y}" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="CfetsBondDealQuotedPriceSingle002_btn_revokeBtn" th:if="${isRevert } eq ${YES_OR_NO_Y}"  class="layui-btn layui-btn-sm" data-th-text="#{CfetsBondDealQuotedPrice003.revokeBtn}">撤回</a>
                <a id="CfetsBondDealQuotedPriceSingle002_btn_clinchDeal" th:if="${isRevert } eq ${YES_OR_NO_Y}" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{CfetsRepoDealQuotedPrice003.clinchDeal}">成交</a>
                <a id="CfetsBondDealQuotedPriceSingle002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
            <div id="baseRiskMathComm" class="page-component" style="display: none;"  th:data-path="@{/component/common/BaseRiskMathComm/init}"
                 th:data-params="|{workflowId: '${workflowId}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var ACCOUNT_SPEED_1 = /*[[${ACCOUNT_SPEED_1}]]*/'';
        var ACCOUNT_SPEED_0 = /*[[${ACCOUNT_SPEED_0}]]*/'';
        var CNY = /*[[${CNY}]]*/'';
        var SETT_MODE_03 = /*[[${SETT_MODE_03}]]*/'';
        var CLEAR_TYPE_02 = /*[[${CLEAR_TYPE_02}]]*/'';
        var entity = /*[[${entity}]]*/'';
        var isRevert = /*[[${isRevert}]]*/'';
        var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'';
        var ouTraderIdCanEditFlag = /*[[${ouTraderIdCanEditFlag}]]*/'';
        var tradeStatus12 = /*[[${tradeStatus12}]]*/'';// 已回复
        var mySideInit = /*[[${entity?.mySide}]]*/'';
        var mySideTraderInit = /*[[${entity?.mySideTrader}]]*/'';
        var counterInfoList = /*[[${entity?.counterInfoList}]]*/'';
        var busWorkflowId = /*[[${busWorkflowId}]]*/'';
        var assetIsRight = /*[[${assetIsRight}]]*/'';
        var todoList = /*[[${todoList}]]*/'';

        var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
        var FINPROD_TYPE_F01 = /*[[${FINPROD_TYPE_F01}]]*/'';
        var sysDate = /*[[${sysDate}]]*/ '';
        var isMain = /*[[${isMain}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/bankuplink/bond/CfetsBondDealQuotedPriceSingle002.js}" type="text/javascript"></script>
</div>
</body>
</html>
