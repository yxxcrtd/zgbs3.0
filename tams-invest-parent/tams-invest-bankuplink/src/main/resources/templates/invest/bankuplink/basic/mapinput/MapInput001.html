<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">

<head>
<title data-th-text="#{MapInput001}">Map数据输入</title>
<style type="text/css">
	.btn-margion {
		margin:15px 0px 0px 0px;
	}
	.map-input {
		width:100%
	}
</style>
</head>

<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="map-input">
            	<textarea name="mapJson"  id="mapJson" rows="25" cols="180" maxlength="20000" 
            	                class="layui-textarea" placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}">
            	</textarea>
			</div>
			<div class="btn-margion">
				<a id="MapInput001_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-src="@{/js/invest/bankuplink/basic/mapinput/MapInput001.js}" type="text/javascript"></script>
	</div>
</body>
</html>
