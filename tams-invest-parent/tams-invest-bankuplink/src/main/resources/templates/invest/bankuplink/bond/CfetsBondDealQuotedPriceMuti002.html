                    <label class="layui-form-label form-label-wrap" data-th-text="#{CfetsBondDealQuotedPriceSingle.finprodId}">资产代码</label>

                                required="required"
                                data-formatoption="true"
                                data-th-data-url="@{/invest/bankuplink/bond/CfetsBondDealQuotedPriceSingle/getfinprodIdForAdd}"
                                data-th-initvalue="${entity?.finprodMarketId}"
                        ></select>
                    </div>
                </div>

                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.ps}">交易方向</label>
                    <div class="layui-input-inline input-inline">
                        <select required disabled type="text" id="CfetsBondDealQuotedPriceMuti002_ps" name="ps"
                                class="layui-input form-input input-select"
                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"

                                th:initValue="${entity?.ps}"></select>
                    </div>
                </div>

            <div class="layui-form-item">

                    <div class="layui-input-inline input-inline">

                    </div>
                </div>

            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.settleDate}">结算日期</label>
                    <div class="layui-input-inline input-inline buss-inline-wrap" >

                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.bondPrinamt}">券面总额(万元)</label>
                    <div class="layui-input-inline input-inline">
                        <input required type="text" id="CfetsBondDealQuotedPriceMuti002_avaNum" name="avaNum"
                               class="layui-input form-input text-number" placeholder="请输入内容"

                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.avaNumStr}">
                        <span class="input-right-show">万元</span>
                    </div>
                </div>
            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPrice002.my}">本方</label>
                    <div class="layui-input-inline input-inline">
                        <select required type="text" id="CfetsBondDealQuotedPriceMuti002_mySide" name="mySide"
                                class="layui-input form-input input-select"
                                th:placeholder="#{SysCommon.placeholder}" placeholder="请输入内容"

                                formatoption="true" th:initValue="${entity?.mySide}"></select>
                    </div>
                </div>

                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap"
                           th:text="#{CfetsBondDealQuotedPriceSingle.myTradeId}">本方交易员</label>
                    <div class="layui-input-inline input-inline">
                        <select required type="text" id="CfetsBondDealQuotedPriceMuti002_mySideTrader" name="mySideTrader"
                                class="layui-input form-input input-select"
                                th:placeholder="#{SysCommon.placeholder}" placeholder="请输入内容"

                                formatoption="true" th:initValue="${entity?.mySideTrader}"></select>
                    </div>
                </div>
            </div>

            <div class="layui-form-item">

                <div class="form-inline-wrap" style=" width: 50%; padding:0px;" >
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.effDate}">有效时间</label>
                    <div class="layui-input-inline input-inline">

                               class="layui-input form-input" placeholder="请输入内容"
                               th:placeholder="#{SysCommon.placeholder}"
                               th:value="${effTime}">
                    </div>
                </div>

            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des" th:text="#{CfetsBondDealQuotedPrice003.selectOrg}">可选机构</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item" th:if="${entity?.quotaPageModel}  neq 'response'">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPrice003.orgType}">选择机构</label>
                                <div class="layui-input-inline input-inline">
                                    <select type="text" id="CfetsBondDealQuotedPriceMuti002_orgType" name="orgType"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/queryMySideList}" allowClear="true"
                                            formatoption="true"
                                    ></select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <a id="CfetsBondDealQuotedPriceMuti002_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.add}">添加</a>

                            </div>

                        <div>
                            <table class="layui-table" id="CfetsBondDealQuotedPriceMuti002_orgTable"></table>
                        </div>
                    </div>

                    <h3 class="pro-module-title"><span class="title-des" th:text="#{CfetsBondDealQuotedPriceSingle.remark}">备注</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>

                                              class="layui-textarea" placeholder="请输入内容"
                                              th:placeholder="#{SysCommon.placeholder}"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            <div class="row text-center" style="margin: 20px 0;">
                <a id="CfetsBondDealQuotedPriceMuti002_btn_save" th:if="${isRevert } ne ${YES_OR_NO_Y}" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                <a id="CfetsBondDealQuotedPriceMuti002_btn_submit" th:if="${isRevert } ne ${YES_OR_NO_Y}" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="CfetsBondDealQuotedPriceMuti002_btn_revokeBtn" th:if="${isRevert } eq ${YES_OR_NO_Y}"  class="layui-btn layui-btn-sm" data-th-text="#{CfetsBondDealQuotedPrice003.revokeBtn}">撤回</a>
                <a id="CfetsBondDealQuotedPriceMuti002_btn_clinchDeal" th:if="${isRevert } eq ${YES_OR_NO_Y}" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{CfetsRepoDealQuotedPrice003.clinchDeal}">成交</a>
                <a id="CfetsBondDealQuotedPriceMuti002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>

<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var ACCOUNT_SPEED_1 = /*[[${ACCOUNT_SPEED_1}]]*/'';
        var ACCOUNT_SPEED_0 = /*[[${ACCOUNT_SPEED_0}]]*/'';

        var ouTraderIdCanEditFlag = /*[[${ouTraderIdCanEditFlag}]]*/'';

        var mySideInit = /*[[${entity?.mySide}]]*/'';

        var counterInfoList = /*[[${entity?.counterInfoList}]]*/'';
        var busWorkflowId = /*[[${busWorkflowId}]]*/'';
        var assetIsRight = /*[[${assetIsRight}]]*/'';
        var quotaPageModel = /*[[${quotaPageModel}]]*/'';
        var cfetsBondDealRequestQuoteDtoList = /*[[${cfetsBondDealRequestQuoteDtoList}]]*/'';

        var CCY_CNY = /*[[${CCY_CNY}]]*/'';

        var FINPROD_TYPE_F01 = /*[[${FINPROD_TYPE_F01}]]*/'';
