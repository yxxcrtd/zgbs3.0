<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">

<head>
<title data-th-text="#{CfetsRepoDealQuotedPrice002.nrepoInfo}">质押券信息(逆回购)</title>
</head>

<body>
    <div layout:fragment="content">
    		<style type="text/css">
			.form-inline-wrap {
				display: inline-block;
				float: left;
				width: 24%;
				padding-top: 10px;
			}
			/* 放大镜特殊处理 */
			.iconfont {
				font-size: 21px;
			}
			</style>
        <div class="layui-tab layui-tab-card kit-tab">
            <ul class="layui-tab-title">
                <li class="layui-this">可质押列表</li>
            </span>
            </ul>
            <div class="layui-tab-content">
                <div class="layui-tab-item layui-show">
                    <div class='layui-fluid'>
                        <form class="layui-form joyin-form-wrap pro-module-form" id="cfetsRepoDealQuotedPrice004_form_1">
                            <div class="layui-form-item  layui-col-space10">
                                <div class="layui-inline layui-col-md1  layui-col-sm1 layui-col-lg1">
                                    <label class="layui-form-label form-label-wrap" style="width:100%;"
                                        th:text="托管机构">托管机构</label>
                                </div>
                                <div class="layui-inline layui-col-md2  layui-col-sm2 layui-col-lg2">
                                     <select type="text" name="repRegistOrg"
                                             class="layui-input form-input input-select" placeholder="请输入内容"
                                             th:placeholder="#{SysCommon.placeholder}"
                                             data-th-data-result='${CHB_REGIST_ORG_INV}'
                                             allowClear="true">
                                     </select>
                                </div>
                                <div class="layui-inline layui-col-md1  layui-col-sm1 layui-col-lg1">
                                    <label class="layui-form-label form-label-wrap" style="width:100%;"
                                        th:text="资产代码">资产代码</label>
                                </div>
                                <div class="layui-inline layui-col-md2  layui-col-sm2 layui-col-lg2">
                                     <input type="text" id="CfetsRepoDealQuotedPrice003_bondCode" name="bondCode"
                                           class="layui-input form-input" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}">
                                </div>
                                <div class="layui-inline layui-col-md1  layui-col-sm1 layui-col-lg1">
                                    <label class="layui-form-label form-label-wrap" style="width:100%;"
                                        th:text="是否永续">是否永续</label>
                                </div>
                                <div class="layui-inline layui-col-md1  layui-col-sm1 layui-col-lg1">
                                     <select type="text" name="isSus"
                                             class="layui-input form-input input-select" placeholder="请输入内容"
                                             th:placeholder="#{SysCommon.placeholder}"
                                             data-th-data-result='${YES_OR_NO}'
                                             allowClear="true">
                                     </select>
                                </div>
                                <div class="layui-inline layui-col-md1  layui-col-sm1 layui-col-lg1">
                                    <label class="layui-form-label form-label-wrap" style="width:100%;"
                                        th:text="是否次级">是否次级</label>
                                </div>
                                <div class="layui-inline layui-col-md1  layui-col-sm1 layui-col-lg1">
                                     <select type="text" name="isSecBond"
                                             class="layui-input form-input input-select" placeholder="请输入内容"
                                             th:placeholder="#{SysCommon.placeholder}"
                                             data-th-data-result='${YES_OR_NO}'
                                             allowClear="true">
                                     </select>
                                </div>
                                <div class="layui-inline layui-col-md1  layui-col-sm1 layui-col-lg1">
                                    <label class="layui-form-label form-label-wrap">
                                        <a id='CfetsRepoDealQuotedPrice004_entrustOrder_search' class="input-right-show" href='javascript:;' style='border: none;color: #4893e6; left: 0%;'>
                                            <i class='iconfont icon-search'></i>
                                        </a>
                                    </label>
                                </div>
                            </div>
                        </form>
                        <div>
                            <table class="layui-table" id="CfetsRepoDealQuotedPrice004_table_1"></table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="layui-tab layui-tab-card kit-tab"  lay-filter="docDemoTabBrief">
            <ul class="layui-tab-title">
                <li class="layui-this">已选质押券</li>
            </ul>
            <div class="layui-tab-content">
                <!-- 已选质押券 -->
                <div class="layui-tab-item layui-show">
                    <div class='layui-fluid'>
                        <form class="layui-form joyin-form-wrap pro-module-form" id="cfetsRepoDealQuotedPrice004_form_2">
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md2  layui-col-sm2 layui-col-lg2">
                                    <a id="cfetsRepoDealQuotedPrice004_form_2_btn1" class="layui-btn layui-btn-sm" 
                                        data-th-text="#{CfetsRepoDealQuotedPrice002.repoInfo.add}">添加</a>
                                    <a id="cfetsRepoDealQuotedPrice004_form_2_btn2" class="layui-btn layui-btn-sm layui-btn-warm" 
                                        data-th-text="#{CfetsRepoDealQuotedPrice002.nrepoInfo.remove}">移除</a>
                                </div>
                            </div>
                        </form>
                        <div>
                            <table class="layui-table" id="CfetsRepoDealQuotedPrice004_table_2"></table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;margin-top: 1px;">
            <div class="text-center">
                <a class="layui-btn layui-btn-sm btn-save" th:id="CfetsRepoDealQuotedPrice004_save" data-th-text="#{SysCommon.save}">确认</a>
                <a class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>

    </div>
    <div layout:fragment="script">
        <script type="text/javascript" data-th-src="@{/public/js/message}"></script>
        <script data-th-inline="javascript" type="text/javascript">
            var portfolioId = /*[[${portfolioId}]]*/'';
            var secAcctId = /*[[${secAcctId}]]*/'';
            var entity = eval(/*[[${entity}]]*/'');
            var ibuFlag_repoOverAvaCanContinue = eval(/*[[${ibuFlag_repoOverAvaCanContinue}]]*/'');
        </script>
        
        <script data-th-src="@{/js/invest/bankuplink/repo/CfetsRepoDealQuotedPrice004.js}" type="text/javascript"></script>
        
    </div>
</body>

</html>
