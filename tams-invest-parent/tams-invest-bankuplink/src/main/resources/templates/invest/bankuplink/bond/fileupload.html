<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title th:text="#{FwFileUpload.title}">文件上传</title>
<style>
span.layui-upload-choose {
	display: block;
	margin-top: 20px;
}

#test10 {
	padding: 5px;
	float: left;
}

.layui-table-cell {
	height: auto !important;
}

.errorBorder {
/* 	border:1px solid #ff0000; */
	background-color:#ea0d0d54;
}

.CfetsBondDealQuotedPrice001_import_delete {
	color:white;
	background-color: orange;
	height:18px;
	line-height:18px;
}

</style>
</head>
<body>
	<div layout:fragment="content">
		<div style="padding: 0px 40px; height: 92px; text-align: center"
			data-th-switch="${type}">
			<div class="layui-upload" data-th-case="'singleImage'">
				<button type="button" class="layui-btn" id="test1">上传图片</button>
				<div class="layui-upload-list">
					<img class="layui-upload-img" id="demo1">
					<p id="demoText"></p>
				</div>
			</div>

			<div class="layui-upload" data-th-case="'mutiImage'">
				<button type="button" class="layui-btn" id="test2">多图片上传</button>
				<blockquote class="layui-elem-quote layui-quote-nm"
					style="margin-top: 10px;">
					预览图：
					<div class="layui-upload-list" id="demo2"></div>
				</blockquote>
			</div>

			<div data-th-case="'allowFile'">
				<button type="button" class="layui-btn" id="test4">
					<i class="layui-icon"></i>上传文件
				</button>
				<div style="margin-top: 10px;">
					<!-- 示例-970 -->
					<ins class="adsbygoogle"
						style="display: inline-block; width: 970px; height: 90px"
						data-ad-client="ca-pub-6111334333458862" data-ad-slot="3820120620"></ins>
				</div>
			</div>

			<div class="layui-upload" data-th-case="'noAutoUpload'">
				<button type="button" class="layui-btn layui-btn-normal" id="test8">选择文件</button>
				<button type="button" class="layui-btn" id="tplDowload">模板下载</button>
				<button type="button" class="layui-btn" id="test9">开始上传</button>
			</div>

			<div class="layui-upload" data-th-case="'drag'">
				<div class="layui-upload-drag" id="test10" style="width:980px;">
					<i class="layui-icon"></i>
					<p>点击上传，或将文件拖拽到此处</p>
				</div>
				<div style="width: 120px; float: right; height: 70px; padding: 10px;">
					<div>
						<button type="button" class="layui-btn layui-btn-disabled" id="dragUploadAction"
							disabled data-ignore="all">导入预览</button>
					</div>
					<div style="padding-top: 10px" data-th-if="${not hideTpl}">
						<a style="text-decoration: underline; color: #337ab7;"
							id="tplDowload" href="javascript:void(0);">模板下载</a>
					</div>
				</div>
			</div>

			<div class="layui-upload" data-th-case="'list'">
				<button type="button" class="layui-btn layui-btn-normal"
					id="testList">选择多文件</button>
				<div class="layui-upload-list">
					<table class="layui-table">
						<thead>
							<tr>
								<th>文件名</th>
								<th>大小</th>
								<th>状态</th>
								<th>操作</th>
							</tr>
						</thead>
						<tbody id="demoList"></tbody>
					</table>
				</div>
				<button type="button" class="layui-btn" id="tplDowload">模板下载</button>
				<button type="button" class="layui-btn" id="testListAction">开始上传</button>
			</div>
		</div>
		<div style="padding: 0 10px; height: 385px" id="msgArea">
			<!-- 导入验证结果显示区域 -->
		</div>
        <div class="row text-center" style="margin: 10px 0;">
            <!-- <a id="CfetsBondDealQuotedPrice001_import_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{CfetsBondDealQuotedPrice001.fileUpload.batchDelete}">批量删除</a> -->
        	<a id="CfetsBondDealQuotedPrice001_import_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="CfetsBondDealQuotedPrice001_import_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
		  var exts = /*[[${exts}]]*/'xls|xlsx';
		  var currentPageId = /*[[${currentPageId}]]*/'';
		  var maxFileSize = /*[[${maxFileSize}]]*/'204800';
		  var sendStatus_fail = /*[[${sendStatus_fail}]]*/'';
	  	  var sendStatus_unsend = /*[[${sendStatus_unsend}]]*/'';
	  	  var sendStatus_sent = /*[[${sendStatus_sent}]]*/'';
		</script>
		<script data-th-src="@{/js/invest/bankuplink/bond/fileupload.js}" type="text/javascript"></script>
	</div>
</body>
</html>
