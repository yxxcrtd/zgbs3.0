</head>

                   th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.secAcctId}">-->

                             style="height:100px;overflow:auto;">
                        </div>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap"
                           th:text="#{CfetsRepoDealQuotedPrice002.entrustId}">指令代码</label>
                    <div class="layui-input-inline input-inline">
                        <select disabled type="text" name="entrustId" class="layui-input form-input input-select"

                                allowClear="true">
                        </select>
                    </div>
                </div>

                    <div class="layui-input-inline input-inline">

                                class='iconfont icon-search'></i></a>
                    </div>

                </div>
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">

                                formatoption="true"></select>

                    <div class="layui-input-inline input-inline">

                                th:initValue="${entity?.settleSpreed == null? '01':entity?.settleSpreed}"
                                allowClear="true" formatoption="true"></select>
                    </div>
                </div>

                </div>
            </div>

                        <span class="input-right-show">天</span>
                    </div>
                </div>
            </div>

                    <div class="layui-input-inline input-inline">

                    <div class="layui-input-inline input-inline">
                        <select required type="text"

                                th:initValue="${entity?.mySideTrader}"></select>

                                th:initValue="${entity?.counterTrader}"></select>
