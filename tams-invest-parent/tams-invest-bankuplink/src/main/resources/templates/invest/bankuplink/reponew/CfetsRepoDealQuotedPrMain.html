<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  xmlns:th="http://www.springframework.org/schema/mvc"
	  layout:decorate="~{layout/default}">
<head>
	<title data-th-text="#{EtrIbRepoMain}">银行间质押式回购指令</title>
	<style type="text/css">
		html,body,div.layui-fluid,#main_body{
			height: 100%;
		}
		.top_panel {
			width:100%;
			float: right;
			height:49.5%;
			margin:1px;
			border: 1px solid #aaaaaa;
			display: inline-block;
		}
		.bottom_panel {
			width:100%;
			float: right;
			height:49.5%;
			margin:1px;
			border: 1px solid #aaaaaa;
			display: inline-block;
		}
		.left_bottom_panel {
			width:32%;
			float:left;
			height:100%;
			isplay: inline-block;
		}
		.right_bottom_panel {
			float:right;
			width:67.5%;
			height:100%;
			display: inline-block;
		}
		.gutter-vertical{
			width:100%;
			height:3px !important;
			background:#dbdbdd;
			-webkit-box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
			box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
			cursor:n-resize;
			float: right;
		}

		.gutter-horizontal{
			height:570px;
			width:3px !important;
			background:#dbdbdd;
			-webkit-box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
			box-shadow:0 0 1px 0 rgba(28,36,56,0.4);
			cursor:ew-resize;
			float: left;
			margin-left: 2px;
		}
	</style>
	<script>
		// function setIframeHeight(iframe) {
		// 	var height = Math.max(document.documentElement.scrollHeight || 0, document.body.scrollHeight || 0);
		// 	$(iframe).css({height: height - 55, 'min-height':200});
		// }
	</script>
</head>
<body>
<div id="main_body" layout:fragment="content">
	<div class="top_panel" id = "top_panel_dev">
		<div style="height: 100%">
			<iframe th:src="@{/invest/bankuplink/reponew/CfetsRepoDealQuotedPr001/init}" width="100%"
					height="100%" frameborder="0" style="border:none;" id="CfetsRepoDealQuotedPr001_iframe"></iframe>
		</div>
	</div>
	<div class="bottom_panel" id = "bottom_panel_dev">
		<div class="left_bottom_panel" id = "left_bottom_panel_dev" >
			<iframe id = "EtrEtfInfoHq" th:src="@{'/invest/bankuplink/reponew/CfetsRepoDealQuotedPr001/initHq'}" width="100%"
					height="100%"  frameborder="0"  style="border:none;"></iframe>
		</div>
		<div class="right_bottom_panel" id = "right_bottom_panel_dev" >
			<div class="layui-tab" style="height:100%;" lay-filter="zlPlatform">
				<ul class="layui-tab-title">
					<li class="layui-this">单组合交易下单</li>
					<li>组合系列交易下单</li>
					<img id="enlarge" th:src="@{'/img/enlarge.png'}" style="width: 20px;height: 20px; cursor: pointer;"></img>
					<img id="narrow" th:src="@{'/img/narrow.png'}" style="width: 20px;height: 20px; cursor: pointer; display: none;"></img>
				</ul>
				<div class="layui-tab-content" style="height:98%;">
					<!-- 单组合交易下单 -->
					<div class="layui-tab-item layui-show" style="height:95%;">
						<iframe th:src="@{/invest/bankuplink/reponew/CfetsRepoDealQuotedPr002/init}" width="100%"
								height="100%" frameborder="0" style="border:none;" id="cfetsRepoDealQuotedPr002_iframe" ></iframe>
					</div>
					<!-- 组合系列交易下单 -->
					<div class="layui-tab-item" style="height:95%;">
						<iframe th:src="@{/invest/bankuplink/reponew/CfetsRepoDealQuotedPr003/init}" width="100%"
								height="100%" frameborder="0" style="border:none;" id="cfetsRepoDealQuotedPr003_iframe"></iframe>
					</div>
				</div>
			</div>
			<div id="baseRiskMathComm" class="page-component" style="display: none;"  th:data-path="@{/component/common/BaseRiskMathComm/init}"
			th:data-params="|{workflowId: '${workflowId}',entityName:'riskTrialRetDto',tradeId:'${entrustId}'}|">
      		</div>
		</div>
	</div>
</div>
<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">
		var ENTRUST_STATUS_05 = /*[[${ENTRUST_STATUS_05}]]*/'05';
		var ENTRUST_STATUS_07 = /*[[${ENTRUST_STATUS_07}]]*/'07';
		var FINPROD_TYPE_TG_F01 = /*[[${FINPROD_TYPE_TG_F01}]]*/'';
		var single_etr_isshow = /*[[${single_etr_isshow}]]*/'Y';
	</script>
	<script data-th-src="@{/js/invest/bankuplink/reponew/split.min.js}" type="text/javascript"></script>
	<script data-th-src="@{/js/invest/bankuplink/reponew/CfetsRepoDealQuotedPrMain.js}" type="text/javascript"></script>

</div>
</body>
</html>
