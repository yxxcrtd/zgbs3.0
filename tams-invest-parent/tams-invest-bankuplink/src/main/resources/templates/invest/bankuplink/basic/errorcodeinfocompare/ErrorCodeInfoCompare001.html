<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{ErrorCodeInfoCompare001}">错误码信息查询</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area">
        	
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md6 layui-col-xs6 layui-col-sm6 layui-col-lg6">
                        <label class="layui-form-label form-lable"
                        	data-th-text="#{ErrorCodeInfoCompare001.errCode}">错误码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="errCode" name="errCode" class="layui-input form-input"
                                data-th-placeholder="#{SysCommon.placeholder}" placeholder="请输入内容" formatoption = true/>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md6 layui-col-xs6 layui-col-sm6 layui-col-lg6">
                        <label class="layui-form-label form-lable"
                        	data-th-text="#{ErrorCodeInfoCompare001.errMsg}">错误信息</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="errMsg" name="errMsg" class="layui-input form-input"
                                data-th-placeholder="#{SysCommon.placeholder}" placeholder="请输入内容" formatoption = true/>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
       <script data-th-src="@{/js/invest/bankuplink/basic/errorcodeinfocompare/ErrorCodeInfoCompare001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
