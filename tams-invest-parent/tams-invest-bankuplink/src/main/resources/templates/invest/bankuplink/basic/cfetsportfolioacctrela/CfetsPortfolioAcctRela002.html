<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<title data-th-text="#{CfetsPortfolioAcctRela002}">CFETS账户关联</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="">
             <div class="pro-module-wrapper pro-module-base" style="border-top: none;">
                <div class="">
                    <div class="pro-module">
                        <div class="pro-module-item">
                            <form class="layui-form joyin-form-wrap pro-module-form" id="CfetsPortfolioAcctRela002_form">
                                <input type="hidden" name="partyIdOld" class="layui-input form-input"
                                                            data-th-value="${entity?.partyId}" 
                                                            data-th-placeholder="#{SysCommon.placeholder}" />
                                <input type="hidden" name="portfolioIdOld" class="layui-input form-input"
                                                            data-th-value="${entity?.portfolioId}" 
                                                            data-th-placeholder="#{SysCommon.placeholder}" />
                                <input type="hidden" name="cfetsAcctTypeOld" class="layui-input form-input"
                                                            data-th-value="${entity?.cfetsAcctType}" 
                                                            data-th-placeholder="#{SysCommon.placeholder}" />
                                <div class="pro-module-wrap">
                                    <div class="pro-module">
                                        <h3 class="pro-module-title" style="border-top: 1px solid #ccc;"><span class="title-des">CFETS账户关联信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                                        <div class="pro-module-item">
                                            <div class="layui-form-item">
                                                <div class="form-inline-wrap">
                                                    <label class="layui-form-label form-label-wrap" data-th-text="#{CfetsPortfolioAcctRela001.portfolioId}">组合代码<i class="must">*</i></label>
                                                    <div class="layui-input-inline input-inline">
                                                        <select type="text" id="portfolioId" name="portfolioId" class="layui-input form-input input-select" required multiple="true"
                                                                data-th-data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/selectPortfolioId}" th:initvalue="${entity?.portfolioId}">
                                                        </select>
                                                    </div>
                                                </div>
                                                <div class="form-inline-wrap">
                                                    <label class="layui-form-label form-label-wrap" data-th-text="#{CfetsPortfolioAcctRela001.partyName}">机构全称<i class="must">*</i></label>
                                                    <div class="layui-input-inline input-inline">
                                                        <select type="text" id="partyName" name="partyName" class="layui-input form-input input-select" required
                                                            data-th-initvalue="${entity?.partyId}"
                                                            data-th-data-url="@{/invest/bankuplink/basic/cfetsportfolioacctrela/CfetsPortfolioAcctRela001/selectMstCfetsCustomerInfo}">
                                                        </select>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="layui-form-item">
                                                <div class="form-inline-wrap">
                                                    <label class="layui-form-label form-label-wrap" data-th-text="#{CfetsPortfolioAcctRela002.partyId}">机构21位码<i class="must">*</i></label>
                                                    <div class="layui-input-inline input-inline">
                                                        <input type="text" id="partyId" name="partyId" class="layui-input form-input " maxLength="6" required formatoption = true placeholder="请输入内容" 
                                                            data-th-value="${entity?.partyId}" 
                                                            data-th-placeholder="#{SysCommon.placeholder}" disabled> 
                                                    </div>
                                                </div>
                                                <div class="form-inline-wrap">
                                                    <label class="layui-form-label form-label-wrap" data-th-text="#{CfetsPortfolioAcctRela002.partyCustomerId}">机构6位码<i class="must">*</i></label>
                                                    <div class="layui-input-inline input-inline">
                                                        <input type="text" id="partyCustomerId" name="partyCustomerId" class="layui-input form-input " maxLength="21" required formatoption = true placeholder="请输入内容" 
                                                            data-th-value="${entity?.partyCustomerId}" 
                                                            data-th-placeholder="#{SysCommon.placeholder}" disabled>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="layui-form-item">
                                                <div class="form-inline-wrap">
                                                    <label class="layui-form-label form-label-wrap" data-th-text="#{CfetsPortfolioAcctRela001.cfetsAcctType}">账户来源<i class="must">*</i></label>
                                                    <div class="layui-input-inline input-inline">
                                                        <input type="text" id="cfetsAcctType" required name="cfetsAcctType" data-th-value="${entity?.cfetsAcctType}" class="layui-input form-input input-select" data-th-data-result='${ACCOUNT_SOURCE}' formatoption = true placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" "margin:20px 0;">
                    <div class="text-center">
                        <a id="CfetsPortfolioAcctRela002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                        <a id="CfetsPortfolioAcctRela002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="CfetsPortfolioAcctRela002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
    	<script data-th-inline="javascript" type="text/javascript">
		</script>
    	<script data-th-src="@{/js/invest/bankuplink/basic/cfetsportfolioacctrela/CfetsPortfolioAcctRela002.js}">
    	</script>
    </div>
</body>
</html>
