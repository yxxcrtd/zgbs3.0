<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>错误码信息明细</title>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
                <div class="pro-module-wrapper pro-module-base">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">基本信息</span>
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable">错误码</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" class="layui-input form-input" 
                                            	id="errCode" name="errCode" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" required="required"
                                                data-th-value="${entity?.errCode}" maxlength="80">
                                        </div>
                                    </div>  
                                </div>
                                <div class="layui-form-item">
                                    <label class="layui-form-label form-lable" style="width: 11.9%;">错误信息</label>
                                    <div class="layui-input-inline input-inline" style="width: 85%!important;">
                                        <textarea type="text" class="layui-textarea" id="errMsg" name="errMsg"
                                                  placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                  data-th-text="${entity?.errMsg}" maxlength="80"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/bankuplink/basic/errorcodeinfocompare/ErrorCodeInfoCompare002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
