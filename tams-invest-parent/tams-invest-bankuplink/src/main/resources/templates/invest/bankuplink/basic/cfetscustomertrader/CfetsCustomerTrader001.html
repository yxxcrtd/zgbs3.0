<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">

<head>
<title data-th-text="#{CfetsCustomerTrader001}">银行间交易员信息</title>
</head>

<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area curr-form' >
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{CfetsCustomerTrader001.partyId}">交易成员ID</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="partyId" name="partyId" class="layui-input form-input " maxLength="32"  formatoption = true placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{CfetsCustomerTrader001.partyName}">交易成员</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="partyName" name="partyName" class="layui-input form-input " maxLength="32"  formatoption = true placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{CfetsCustomerTrader001.traderName}">交易员姓名</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="traderName" name="traderName" class="layui-input form-input " maxLength="32"  formatoption = true placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{CfetsCustomerTrader001.traderId}">交易员ID</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="traderId" name="traderId" class="layui-input form-input " maxLength="32"  formatoption = true placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
					</div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-src="@{/js/invest/bankuplink/basic/cfetscustomertrader/CfetsCustomerTrader001.js}" type="text/javascript"></script>
	</div>
</body>

</html>
