<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
    <style type="text/css">
        .typical-secinfo
        {
            float: left;
            width: 100%;
            height: 50px;
            line-height: 50px
        }
        .typical-secinfo a
        {
            padding-left: 20px
        }
        .typical-price
        {
            float: left;
            width: 100%;
            height: 30px;
            line-height: 30px
        }
        .typical-price a
        {
            padding-left: 10px
        }
        .left_bottom_panel {
            width:57%;
            float:left;
            height:100%;
            isplay: inline-block;
        }
        .right_amount_panel {
            width:42%;
            float:right;
            height:100%;
            isplay: inline-block;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="layui-tab-item layui-show">
        <div  class="left_bottom_panel" style="height: 120px; ">
            <div class="level2-panel">
                <div class="price-boundary" style="clear: both;">
                    <div class="typical-secinfo">
                        <label>债券代码:</label>
                        <label id="secId"></label>
                    </div>
                </div>
                <div class="price-boundary" style="clear: both;">
                    <div class="typical-secinfo">
                        <label>债券简称:</label>
                        <label id="secAbbr"></label>
                    </div>
                </div>
            </div>
        </div>
        <div class="right_amount_panel">
            <div class="price-boundary" style="clear: both;">
                <div class="typical-price">
                    <label>持仓数量:</label>
                    <label id ="positionAmount">0.00万元</label>
                </div>
                <div class="typical-price">
                    <label>可卖数量:</label>
                    <label id ="canSellAmount">0.00万元</label>
                </div>
                <div class="typical-price">
                    <label>可买数量:</label>
                    <label id="canBuyAmount">0.00万元</label>
                </div>
                <div id = "costPrice_div" class="typical-price">
                    <label id="costPrice_label">成本价:</label>
                    <label id="costPrice">0.00元</label>
                </div>
                <div id = "cashAmount_div" class="typical-price">
                    <label id="cashAmount_label">可用现金:</label>
                    <label id="cashAmount">0.00万元</label>
                </div>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
    var MarketInfoInterf_BaseUrl = /*[[${MarketInfoInterf_BaseUrl}]]*/'';
    </script>
    <script data-th-src="@{/invest/js/dynamic/dynView.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/invest/bankuplink/bond/initAmount.js}" type="text/javascript"></script>
</div>
</body>
</html>
