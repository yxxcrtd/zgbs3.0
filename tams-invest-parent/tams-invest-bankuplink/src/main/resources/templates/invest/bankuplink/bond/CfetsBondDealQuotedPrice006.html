<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">

<head>
<title data-th-text="#{CfetsBondDealQuotedPrice006}">指令明细查询</title>
</head>

<body>
	<div layout:fragment="content">
		<style type="text/css">
	        /* 单个控件长度 */
	        .form-inline-wrap {
			    display: inline-block;
			    float: left;
			    width: 20%;
			    padding-top: 10px;
			}
			/* 单个控件label长度 */
			.form-label-wrap {
			    color: #444;
			    line-height: 30px;
			    padding: 0 10px 0 0;
			    width: 26%;
			}
			/* 单个控件按钮长度 */
	        .form-inline-wrap-btn {
			    display: inline-block;
			    float: left;
			    width: 10%;
			}
			/* 下拉框长度 */
			.select2-container--default{
				width: 140px !important;
			}
			/* 放大镜特殊处理 */
			.iconfont {
			    font-size: 21px;
			}
			/* 焦点选中颜色 */
			tr.layui-table-hover {
			   background: #f2f2f2 !important;
			}
			/* 鼠标点击颜色 */
			.layui-table tbody .table-row-select, .layui-table[lay-even] .table-row-select:nth-child(even) {
			    background-color: #33dee4 !important;
			}
			/* 表格字体大小 */
			.layui-table-header .layui-table-cell{
				font-weight: bolder;
			}
	    </style>
    
		<div class='layui-fluid'>
 			<form class="layui-form joyin-form-wrap pro-module-form" id="cfetsBondDealQuotedPrice006_entrustOrder_form">
 			<input type="hidden" id="entrustIds" th:value="${entrustIds}" name="entrustIds"/>
			<div class="layui-col-md12">
				<div class="form-inline-wrap">
                              <label class="layui-form-label form-label-wrap"
                                     th:text="#{CfetsBondDealQuotedPrice001.entrustOrder.searchArea.portfolioId}">组合代码</label>
                              <div class="layui-input-inline input-inline">
                                  <select type="text" name="portfolioId"
                                          class="layui-input form-input input-select" placeholder="请输入内容" multiple="true"
                                          th:placeholder="#{SysCommon.placeholder}" th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/selectPortfolioId}"
                                          allowClear="true">
                                  </select>
                              </div>
                         </div>
                         <div class="form-inline-wrap">
                              <label class="layui-form-label form-label-wrap"
                                     th:text="#{CfetsBondDealQuotedPrice001.entrustOrder.searchArea.assetId}">资产代码</label>
                              <div class="layui-input-inline input-inline">
                                  <input id="CfetsBondDealQuotedPrice006_finprodId" type="text" class="layui-input form-input input-lenovoselect"
		                               name="finprodId" data-th-placeholder="#{SysCommon.placeholder}" data-idfield="code"
		                               data-keyfield="name" maxlength="60" th:value="${finprodId}"
		                               data-th-data-effectivefieldsalias='|{"code":"#{EtrInvestAllInfo001.finprodId}", "shortName":"#{EtrInvestAllInfo001.finprodName}"}|'
		                               data-th-data-url="@{/invest/entrust/etrinvestbondinfo/EtrInvestBondInfo001/getfinprodId}">
                              </div>
                         </div>
                         <div class="form-inline-wrap">
                              <label class="layui-form-label form-label-wrap"
                                     th:text="#{CfetsBondDealQuotedPrice001.entrustOrder.searchArea.ps}">方向</label>
                              <div class="layui-input-inline input-inline">
                                  <select id="CfetsBondDealQuotedPrice006_ps"  type="text" name="ps" class="layui-input form-input input-select"
                                  	placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}" th:initValue="${ps}"
                              	data-th-data-result='${PS}' allowClear="true" formatoption="true"></select>
                              </div>
                         </div>
                         <div class="form-inline-wrap">
                              <label class="layui-form-label form-label-wrap"
                                     th:text="#{CfetsBondDealQuotedPrice001.entrustOrder.searchArea.invManagerId}">投资经理</label>
                              <div class="layui-input-inline input-inline">
                                  <select type="text" name="invManagerId"
							class="layui-input form-input input-select"
							allowClear="true" placeholder="请输入内容" multiple="true"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-data-url="@{/invest/trade/investtrade/commanddispatcher/TrdCommandDispatcher001/getManagers}">
						</select>
                              </div>
                         </div>
                         <div class="form-inline-wrap">
                              <label class="layui-form-label form-label-wrap"
                                     th:text="#{CfetsBondDealQuotedPrice001.entrustOrder.searchArea.entrustId}">指令代码</label>
                              <div class="layui-input-inline input-inline">
								  <select type="text" name="entrustId" class="layui-input form-input input-select" formatoption="false"
										  placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}" multiple="true"
										  th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/selectEntrustId?finprodType2=F01}" allowClear="true">
								  </select>
                              </div>
                         </div>
                         <a id='CfetsBondDealQuotedPrice006_entrustOrder_search' class="input-right-show" href='javascript:;' style='color: #4893e6; left: 98%; padding-top: 5px;'><i class='iconfont icon-search'></i></a>
				</div>
			</form>
			<div>
				<table class="layui-table" id="CfetsBondDealQuotedPrice006_entrust_table"></table>
			</div>
	        <div class="row text-center" style="margin: 20px 0;">
	            <a id="CfetsBondDealQuotedPrice006_btn_confirm" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.confirm}">确认</a>
	            <a id="CfetsBondDealQuotedPrice006_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
	        </div>
		</div>
	</div>
	<div layout:fragment="script">
		<script type="text/javascript" data-th-src="@{/public/js/message}"></script>
		<script data-th-inline="javascript" type="text/javascript">
			var secAcctSourceJ = /*[[${secAcctSourceJ}]]*/''; 
			var mySide = /*[[${mySide}]]*/'';
			var settleSpreed = /*[[${settleSpreed}]]*/'';
			var quotaPageModel = /*[[${quotaPageModel}]]*/'';
			var editFlag = /*[[${editFlag}]]*/'';
			var isDzh = /*[[${isDzh}]]*/'';
		</script>
		
		<script data-th-src="@{/js/invest/bankuplink/bond/CfetsBondDealQuotedPrice006.js}" type="text/javascript"></script>
		
	</div>
</body>

</html>
