<head>
    <style type="text/css">
        .form-lable {
            width: 35%;
            padding: 0px 10px 0px 0px;
        }

        .layui-tab-content {
            padding: 0px !important;
        }

        .select2-container--default .select2-results > .select2-results__options {
            max-height: 150px;
            overflow-y: auto;
        }

        /* span.select2-selection.select2-selection--single {
            max-width: 150px;
        } */

        .layui-form-item .select2-container {
            max-width: 100% !important
        }

        .position-col-width {
            width: 30%;
        }

        .position-col-width-zqzy {
            width: 22%;
        }

        .position-col-width-zqzy1 {
            width: 45%;
        }

        #positionsTable_zqzy_div {
            margin-top: -38px;
            margin-left: 40px;
            margin-bottom: 12px;
        }

        .form-lable {
            width: 25% !important;;
        }

        .grid-demo {
            background-color: #f5f5f5;
            border: 1px solid red;
            border-radius: 3px;
            padding: 5px;
        }

        .sgePortDiv {
            width: 100%;
            overflow: hidden;
            clear: both;
            padding-top: 8px;
            display: inline-block;
        }

        .form-label-wrap-radio {
            color: #444;
            padding: 0 10px 0 0;
            float: left;
            display: block;
            font-weight: 400;
            text-align: right;
        }

        .keywords {
            border-radius: 25px !important;
            width: 100%;
        }
        /* 单个控件按钮长度 */
        .form-inline-wrap-btn {
            display: inline-block;
            float: left;
            width: 30%;
        }
        /* 单个控件按钮长度 */
        .form-inline-wrap-btn-row {
            display: inline-block;
            float: left;
            width: 30%;
        }

        .sgePortDiv .layui-input-inline {
            width: 100%;
