<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">

<head>
<title data-th-text="#{CfetsPortfolioAcctRela001}">CFETS账户关联</title>
</head>

<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				<a id="CfetsPortfolioAcctRela001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
				<a id="CfetsPortfolioAcctRela001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}" style="display: none;">删除</a>
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area curr-form' style="padding-bottom: 30px;">
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{CfetsPortfolioAcctRela001.portfolioId}">组合代码</label>
							<div class="layui-input-inline input-inline">
	                            <select type="text" id="portfolioId" name="portfolioId"
	                                                class="layui-input form-input input-select" allowClear="true"
	                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
	                                                formatoption=true multiple="true"
	                                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?ww=false}"
	                                                data-th-initvalue="${entity?.portfolioId}">
                                </select>
	                        </div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{CfetsPortfolioAcctRela001.partyId3}">机构代码</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="partyId" name="partyId" class="layui-input form-input " maxLength="32"  formatoption = true placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
				    </div>
					<div class="layui-form-item">
					</div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-src="@{/js/invest/bankuplink/basic/cfetsportfolioacctrela/CfetsPortfolioAcctRela001.js}" type="text/javascript"></script>
	</div>
</body>

</html>
