            <input type="hidden" name="workflowId" th:value="${entity?.workflowId}" />
            <div class="pro-module-wrapper pro-module-base" th:title="#{CfetsBondDealQuotedPrice002.baseinfo}">
                <div class="pro-module-wrap">

                        <div class="pro-module-item">

                                            th:initValue="${entity?.portfolioId}"></select>
