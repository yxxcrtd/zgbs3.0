<!DOCTYPE html>
<html style="height:80%;" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.w3.org/1999/xhtml" layout:decorate="~{layout/default}">

<div layout:fragment="content" id="CfetsBondDealQuotedPriceMuti001_bodydiv">
    <style type="text/css">
        .layui-form-radio {
            line-height: 24px;
            padding-right: 0px;
            margin: 0px;
        }
        .layui-form-radio div {
            font-size: 12px;
        }
        .layui-form-radio i{
            font-size: 14px;
        }
        .label-deviation-degree{
            width: 50px;
            height: 24px;
            color: red;
            top: 0;
            right: 0;
            position: absolute;
            text-align: center;
            line-height: 24px;
        }

    <div class="joyin-form-wrap">

            <input type="hidden" id="businessId" name="businessId" th:value="${businessId?: ''}">
            <input type="hidden" id="CfetsBondDealQuotedPriceMuti001_hidden_entrustId" th:value="${entity?.entrustId}" />
            <input type="hidden" id="CfetsBondDealQuotedPriceMuti001_hidden_finprodId" th:value="${entity?.finprodId}" />

            <input type="hidden" id="CfetsBondDealQuotedPriceMuti001_hidden_assetTypeOne" name="assetTypeOne" th:value="${entity?.assetTypeOne}" />

                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <select disabled id="CfetsBondDealQuotedPriceMuti001_portfolioSeries" name="portfolioSeries"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                required data-th-data-result="${PORTFOLIO_SERIES}"
                                data-th-initvalue="${entity?.portfolioSeries}">
                        </select>
                    </div>
                </div>
            </div>

            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{CfetsBondDealQuotedPriceSingle.finprodId}">资产代码</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <select disabled
                                type="text"
                                id="CfetsBondDealQuotedPriceMuti001_finprodId"

                                allowClear="true"
                                placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"

                                data-formatoption="true"
                                data-th-data-url="@{/invest/bankuplink/bond/CfetsBondDealQuotedPriceSingle/getfinprodIdForAdd}"
                                data-th-initvalue="${entity?.finprodMarketId}"

                    </div>
                </div>

                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.ps}">交易方向</label>
                    <div class="layui-input-inline input-inline">
                        <select required disabled type="text" id="CfetsBondDealQuotedPriceMuti001_ps" name="ps"

                                th:initValue="${entity?.ps}"></select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">

                    <div class="layui-input-inline input-inline">
                        <select required type="text" id="CfetsBondDealQuotedPriceMuti001_settleType" name="settleType"

                                th:initValue="${entity?.settleType}"></select>
                    </div>
                </div>
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" data-th-text="#{CfetsBondDealQuotedPriceSingle.settleSpeed}" >清算速度</label>
                    <div class="layui-input-inline input-inline" >
                        <select required type="text" id="CfetsBondDealQuotedPriceMuti001_settleSpreed" name="settleSpreed"
                                class="layui-input form-input input-select"
                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                th:data-result='${ACCOUNT_SPEED}' allowClear="true" formatoption="true"
                                th:initValue="${entity?.settleSpreed}"></select>
                    </div>
                </div>

            </div>

            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.tradeDate}">交易日期</label>
                    <div class="layui-input-inline input-inline buss-inline-wrap" >
                        <input disabled type="text" id="CfetsBondDealQuotedPriceMuti001_tradeDate" name="tradeDate"
                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                               th:placeholder="#{SysCommon.placeholder}"
                               th:value="${platDate}">
                    </div>
                </div>
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.settleMethod}">结算方式</label>
                    <div class="layui-input-inline input-inline">
                        <select required type="text" id="CfetsBondDealQuotedPriceMuti001_settleMethod" name="settleMethod"

                                th:data-result='${SETT_MODE}' allowClear="true" formatoption="true"
                                th:initValue="${entity?.settleMethod}"></select>
                    </div>
                </div>

            </div>
            <div class="layui-form-item">

                    </div>
                </div>
            </div>

                        <input required disabled type="text" id="CfetsBondDealQuotedPriceMuti001_unitInt" name="unitInt" data-textrange="5" data-th-value="${entity?.unitInt}" class="layui-input form-input text-number" placeholder="请输入">
                        <span class="input-right-show">元</span>
                    </div>
                </div>
            </div>

                        <span class="input-right-show">元</span>
                    </div>
                </div>
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.intAmt}">应计利息总额</label>
                    <div class="layui-input-inline input-inline">

                        <span class="input-right-show">元</span>
                    </div>
                </div>
            </div>

                            <input type="radio" style="float: left;" id="calculateField_exerYield" name="calculateField" value="03" th:checked="${entity?.calculateField eq calcTypeExecYield}">
                            <span th:if="${entity?.calculateField eq calcTypeExecYield}" style="color: blue;" data-th-text="#{CfetsBondDealQuotedPriceSingle.exerYield}"></span>
                            <span id="calculateField_span_exerYield" th:if="${entity?.calculateField != calcTypeExecYield}" data-th-text="#{CfetsBondDealQuotedPriceSingle.exerYield}"></span>

                    </div>
                </div>

                    <label class="layui-form-label form-label-wrap">

                        <span th:if="${entity?.calculateField eq calcTypeYield}" style="color: blue;" data-th-text="#{CfetsBondDealQuotedPriceSingle.matureYield}"></span>
                        <span id="calculateField_span_yield" th:if="${entity?.calculateField != calcTypeYield}" data-th-text="#{CfetsBondDealQuotedPriceSingle.matureYield}"></span>
                    </label>
                    <div class="layui-input-inline input-inline buss-inline-wrap">
                        <input required disabled type="text" id="CfetsBondDealQuotedPriceMuti001_matureYield" name="matureYield"

                               data-fixtype="2" data-textrange="4" th:value="${entity?.matureYield}">
                        <span class="input-right-show">%</span>
                    </div>

                </div>
            </div>

            <div class="layui-form-item">
                <div class="form-inline-wrap" id="CfetsBondDealQuotedPriceMuti001_div_responseAmt" style="display: none;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPrice002.answerPrinamt}">回复量</label>
                    <div class="layui-input-inline input-inline">

                        <span class="input-right-show">元</span>
                    </div>
                </div>
            </div>

                <div class="form-inline-wrap" style=" width: 50%; padding:0px;" id="CfetsBondDealQuotedPriceMuti001_div_abs1">

                    <div class="layui-input-inline input-inline">
                        <input required disabled type="text" id="CfetsBondDealQuotedPriceMuti001_parValue" name="parValue" data-th-value="${entity?.parValue}" class="layui-input form-input text-number" placeholder="请输入">
                        <span class="input-right-show">元</span>
                    </div>
                </div>
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;" id="CfetsBondDealQuotedPriceMuti001_div_abs2">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPrice002.prinAmt}">本金额</label>
                    <div class="layui-input-inline input-inline">
                        <input required disabled type="text" id="CfetsBondDealQuotedPriceMuti001_parValueAmt" name="parValueAmt" data-th-value="${entity?.parValueAmt}" class="layui-input form-input text-number" placeholder="请输入">
                        <span class="input-right-show">元</span>
                    </div>
                </div>
            </div>

            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPrice002.my}">本方</label>
                    <div class="layui-input-inline input-inline">
                        <select required type="text" id="CfetsBondDealQuotedPriceMuti001_mySide" name="mySide"

                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap"

                    <div class="layui-input-inline input-inline">

                                formatoption="true" th:initValue="${entity?.mySideTrader}"></select>
                    </div>
                </div>
            </div>

            <div class="layui-form-item">
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.counterId}">交易对手</label>
                    <div class="layui-input-inline input-inline">
                        <select required type="text" id="CfetsBondDealQuotedPriceMuti001_counterId" name="counterId"
                                class="layui-input form-input input-select"
                                th:placeholder="#{SysCommon.placeholder}" placeholder="请输入内容"

                                formatoption="true"
                                th:initValue="${entity?.counterId}"></select>
                    </div>
                </div>
                <div class="form-inline-wrap" style=" width: 50%; padding:0px;">
                    <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPriceSingle.counterTradeId}">对手方交易员</label>
                    <div class="layui-input-inline input-inline">
                        <select required type="text" id="CfetsBondDealQuotedPriceMuti001_counterTrader" name="counterTrader"

                                th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/queryMySideTraderList}" allowClear="true"
                                formatoption="true"
                                th:initValue="${entity?.counterTrader}"></select>
                    </div>
                </div>
            </div>
