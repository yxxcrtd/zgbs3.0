<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ActualTimeAsset001}">实时资产头寸查询</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area curr-form' >
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{ActualTimeAsset001.portfolioId}">组合代码</label>
							<div class="layui-input-inline input-inline">
                      			<select type="text" id="portfolioId" name="portfolioId"
                      				class="layui-input form-input input-select" placeholder="请输入内容" multiple=true
                      				data-th-placeholder="#{SysCommon.placeholder}" 
                      				data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?ww=false}" >
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" data-th-text="#{ActualTimeAsset001.cdate}">查询日期</label>
							<div class="layui-input-inline input-inline">
	                        	<input required type="text" id="cdate" name="cdate"
	                                class="layui-input form-input input-dateSelect" th:value="${sysDate}">
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
				                            data-th-text="#{ActualTimeAsset001.secManageAcctId}">证券账户</label>
	                        <div class="layui-input-inline input-inline">
	                        	<select type="text" id="secManageAcctId" name="secManageAcctId" multiple
                      				class="layui-input form-input input-select" placeholder="请输入内容"
                      				data-th-placeholder="#{SysCommon.placeholder}" parentIds="portfolioId" 
                      				data-th-data-url="@{/invest/portfolio/actualtimeasset/ActualTimeAsset001/getSecAcct}" >
								</select>
	                        	<!-- <input type="text" id="secManageAcctId" name="secManageAcctId"
	                                parentIds="portfolioId" class="layui-input form-input input-select" 
	                                data-th-data-url="@{/invest/portfolio/actualtimeasset/ActualTimeAsset001/getSecAcct}" > -->
	                        </div>
                        </div>
                     </div>
                     <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
				                            data-th-text="#{ActualTimeAsset001.type8}">资产类型</label>
	                        <div class="layui-input-inline input-inline">
	                        	<input type="text" id="type8" name="type8"
	                                class="layui-input form-input input-select" 
	                                data-th-data-result="${PINAN_ASSET_TYPE}">
	                        </div>
                        </div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{ActualTimeAsset001.finprodId}">资产代码</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="finprodId" name="finprodId" class="layui-input form-input input-select" placeholder="请输入内容" 
                      					parentIds="type8" data-th-placeholder="#{SysCommon.placeholder}" data-th-data-url="@{/invest/portfolio/actualtimeasset/ActualTimeAsset001/getAssetsInfo}">
                      			</select>
							</div>
						</div>
					</div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var sysDate = /*[[${sysDate}]]*/'';
		</script>
		<script data-th-src="@{/js/invest/portfolio/actualtimeasset/ActualTimeAsset001.js?v=11}"></script>
	</div>
</body>
</html>
