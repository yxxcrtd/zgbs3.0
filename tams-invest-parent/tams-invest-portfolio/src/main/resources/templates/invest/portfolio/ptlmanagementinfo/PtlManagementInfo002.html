<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"

<head>
    <title data-th-text="#{PtlManagementInfo002}">组合新建</title>
    <style>
        .form-label-wrap {
            width: 36% !important;
        }

        .manage-info-item {
            float: left;
            padding-right: 10px;
            margin-top: 10px;
        }

        .manage-info-item .layui-form-checkbox {
            margin-right: 2px;
            margin-top: -2px;
            padding-right: 0;
            line-height: 15px;
            width: 15px;
            height: 15px;
        }

        .manage-info-item .layui-form-checkbox i {
            line-height: 15px;
            width: 15px;
            height: 15px;
            border-left: 1px solid #d2d2d2;
            font-size: 15px;
        }

        .manage-info-item .layui-form-checked i, .manage-info-item .layui-form-checked:hover i {
            border-color: #2693ff;
            color: #2693ff;
        }
    </style>
