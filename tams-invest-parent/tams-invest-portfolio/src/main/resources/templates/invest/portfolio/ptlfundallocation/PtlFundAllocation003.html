<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{PtlFundAllocation003}">银证转账多组合新建</title>
</head>
<body>
<div layout:fragment="content">
    <div>
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <input type="hidden" id="isImportFlag" name="isImportFlag" class="layui-input form-input" th:value="${entity?.isImportFlag}"><!-- 导入后数据显示修改 add by liuwei 20210329 -->
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="aleft stuff">基本信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item pro-item-wrap">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlFundAllocation001.settleDate}">转账日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="settleDate" name="settleDate" class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" data-th-value='${#dates.format(entity?.settleDate,"yyyy-MM-dd")}'required>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlFundAllocation001.payType}">划款类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select class="layui-input form-input input-select baseInfo" id="payType"
                                                name="payType" th:data-result="${ORDER_TYPE}"  th:initValue='${entity?.payType==null?"1001":entity?.payType}'
                                                data-th-placeholder="#{SysCommon.placeholder}"required>
                                        </select>
                                    </div>
                                </div>
                                <!-- 多组合新建，“收款账户”、“付款账户”、“币种”调整为必填 modified by liuwei 20210421 start -->
                                <div class="form-inline-wrap" id="counterAcctNo_id">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlFundAllocation001.counterAcctNo}" >收款账户</label>
                                    <div class="layui-input-inline input-inline">
                                        <select class="layui-input form-input input-select" placeholder="请输入内容"
                                                id="counterAcctNo" name="counterAcctNo" required
                                                data-th-placeholder="#{SysCommon.placeholder}" parentIds="portfolioId,payType" th:initValue='${entity?.counterAcctNo}'
                                                data-th-data-url="@{/invest/portfolio/ptlfundallocation/PtlFundAllocation003/getAcctNo}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" id="myAcctNo_id">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlFundAllocation001.myAcctNos}">付款账户</label>
                                    <div class="layui-input-inline input-inline">
                                        <select class="layui-input form-input input-select" id="myAcctNo"
                                                name="myAcctNo" parentIds="portfolioId,payType" required
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" th:initValue='${entity?.myAcctNo}'
                                                data-th-data-url="@{/invest/portfolio/ptlfundallocation/PtlFundAllocation003/getAcctNo}">
                                        </select>
                                    </div>
                                    <input type="hidden" id="acctNo" name="acctNo">
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlFundAllocation002.ccy}">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select class="layui-input form-input input-select " id="ccy" required
                                                name="ccy" th:data-result="${CCY}" placeholder="请输入内容" th:initValue='${entity?.ccy?:CCY_default}'
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                        </select>
                                    </div>
                                </div>
                                <!-- 多组合新建，“收款账户”、“付款账户”、“币种”调整为必填 modified by liuwei 20210421 end -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlFundAllocation001.settleAmts}">划拨金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" class="layui-input form-input text-number" disabled placeholder="请输入内容"
                                               id="settleAmt" name="settleAmt" data-textrange="2" maxLength="29" data-th-value='${entity?.settleAmt}' data-th-placeholder="#{SysCommon.placeholder}">
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="aleft stuff" >明细信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item pro-item-wrap">
                            <form class="layui-form joyin-form-wrap" id="listForm" >
                                <div id="showTable">
                                    <table class="layui-table" id="dataTable" name="ptlFundAllocation001Dtos"></table>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- 划款信息 -->
                <div id="transferInformation" class="page-component"
                     th:data-path="@{/component/trade/BussTrdTransferOrder/init}"
                     th:data-params="|{entityName: 'bussTrdTransferOrder', pageFrom: 'submitForm', entityList:'${stlPayOrdersList}',bizCode:'${tradeId}',isMulti:'1'}|"></div>
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des" >备注</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item pro-item-wrap">
                            <div class="layui-form-item">
                                <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                    <textarea class="layui-textarea" id="remark" maxLength="1000" name="remark" data-th-placeholder="#{SysCommon.placeholder}"  th:text="${entity?.remark}" placeholder="请输入内容"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="text-center" align="text-center" style="margin-top:10px;">
                <a id="PtlFundAllocation003_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                <a id="PtlFundAllocation003_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="PtlFundAllocation003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var Fin_Type = /*[[${Fin_Type}]]*/'';
        var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
        var ptlFundAllocation001Dtos = /*[[${ptlFundAllocation001Dtos}]]*/'';
        var payType1001 =/*[[${payType1001}]]*/'';
        var payType1002 =/*[[${payType1002}]]*/'';
        var formTodoList =/*[[${formTodoList}]]*/'';
        function zd(){
            hklx = $('#payType').val();
            if(hklx == '1001' && hklx != undefined && hklx != null){
                //银证转账
                var a = "银证转账";
                $("#remark").val(a);
            }
            if(hklx == '1002' && hklx != undefined && hklx != null ){
                //证银转账
                var a = "证银转账";
                $("#remark").val(a);
            }

        }

    </script>
    <script data-th-src="@{/js/invest/portfolio/ptlfundallocation/PtlFundAllocation003.js}" type="text/javascript"></script>
</div>
</body>
