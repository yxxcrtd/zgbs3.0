<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{PtlDvpFundAllocation001}">DVP资金调拨管理</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="layui-col-md12 form-button-area" style="margin: 10px;">
            <a id="PtlDvpFundAllocation001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
            <a id="PtlDvpFundAllocation001_btn_revoke" class="layui-btn layui-btn-sm btn-delete"><i class="iconfont icon-revoke"></i>撤销</a>
        </div>
        <div class='joyin-form-wrap joyin-filter-form condition-area'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" 
                            data-th-text="#{PtlDvpFundAllocation001.portfolioId}">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <!-- TISHKBS-2310查询页面和新建页面保持一致，只需要产品组合  by wangyaning 20210623 start -->
                            <select id="portfolioId" name="portfolioId"
                                    allowClear="true"
                                    class="layui-input form-input input-select"
                                    data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}"
                                    placeholder="请输入内容" multiple=true
                                    formatoption = "false"
                                    data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                            <!-- TISHKBS-2310查询页面和新建页面保持一致，只需要产品组合  by wangyaning 20210623 end -->
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                            data-th-text="#{PtlDvpFundAllocation001.counterAcctNo}">收款账户</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" class="layui-input form-input input-lenovoselect" 
                                id="counterAcctNo" name="counterAcctNo"
                                data-th-data-url="@{/invest/portfolio/ptlfundallocation/PtlFundAllocation001/getAcct}" 
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-idfield="code" data-keyfield="code" 
                                data-th-data-effectivefieldsalias='|{"code":"#{PtlDvpFundAllocation001.counterAcctNo}","shortName":"#{PtlDvpFundAllocation001.counterAcctName}"}|'>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                            data-th-text="#{PtlDvpFundAllocation001.myAcctNo}">支付账户</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" class="layui-input form-input input-lenovoselect" 
                                id="myAcctNo" name="myAcctNo"
                                data-th-data-url="@{/invest/portfolio/ptlfundallocation/PtlFundAllocation001/getAcct}" 
                                data-th-placeholder="#{SysCommon.placeholder}" data-idfield="code" data-keyfield="code" 
                                data-th-data-effectivefieldsalias='|{"code":"#{PtlDvpFundAllocation001.myAcctNo}","shortName":"#{PtlDvpFundAllocation001.myAcctName}"}|'>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                            data-th-text="#{PtlDvpFundAllocation001.payType}">划款类型</label>
                        <div class="layui-input-inline input-inline">
                            <select id="payType" name="payType" th:data-result="${PS}" class="layui-input form-input input-select" data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                            data-th-text="#{PtlDvpFundAllocation001.dataStatus}">有效状态</label>
                        <div class="layui-input-inline input-inline">
                            <select id="dataStatus" name="dataStatus" th:data-result="${PAGE_DATA_STATUS}" class="layui-input form-input input-select" data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                            data-th-text="#{PtlDvpFundAllocation001.dataDate}">转账日期</label>
                        <div class="layui-input-inline input-inline">
                            <input class="layui-input form-input input-dateRangeSelect" id="dataDate" name="dataDate" placeholder="请选择时间区间">
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
            var pageStatus = /*[[${pageStatus}]]*/'';
            var pageStatusText = /*[[${pageStatusText}]]*/'';
        </script>
    <script data-th-src="@{/js/invest/portfolio/ptldvpfundallocation/PtlDvpFundAllocation001.js}"></script>
</div>
</body>
</html>
