<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PtlCashFlow002}">自定义现金流新建</title>
</head>
<body>
	<div layout:fragment="content">
		<form id="submitForm"
			class="layui-form joyin-form-wrap pro-module-form">
			<div class="pro-module-container">
				<div class="pro-module-wrapper pro-module-base">
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title">
								<span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i
									class="iconfont icon-arrow-down pro-down-icon"></i>
							</h3>
							<div class="pro-module-item">

								<div class="layui-form-item">
									<!-- <div
										class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											data-th-text="#{PtlCashFlow001.busiNo}">业务编号</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="busiNo" maxlength="32" name="busiNo"
												class="layui-input form-input" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												disabled="true" data-th-value="${entity?.busiNo}">
										</div>
									</div> -->
									<div style="display: none">
										<input type="text" id="busiNo" name="busiNo"
											data-th-value="${entity?.busiNo}" />
									</div>
									<div style="display: none">
										<input type="text" id="finprodId" name="finprodId"
											data-th-value="${entity?.finprodId}" />
									</div>
									<div
										class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											data-th-text="#{PtlCashFlow001.portfolioId}">组合代码</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="portfolioId" name="portfolioId"
												class="layui-input form-input input-select"
												data-th-initValue="${entity?.portfolioId}"
												data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}"
												placeholder="请输入内容"  required="required"
												data-th-placeholder="#{SysCommon.placeholder}">
											</select>
										</div>
									</div>
									<div
										class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											data-th-text="#{PtlCashFlow001.settleDate}">资金到账日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="settleDate" name="settleDate"
												class="layui-input form-input input-dateSelect"
												formatoption=true placeholder="请输入内容"  required="required"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-value='${#dates.format(entity?.settleDate,"yyyy-MM-dd")}'>
										</div>
									</div>
									<div
										class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											data-th-text="#{PtlCashFlow001.ps}">收支方向</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="ps" name="ps"  required="required"
												class="layui-input form-input input-checkbox"
												data-th-data-result='${PS}' data-th-initValue="${entity?.ps}" />
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div
										class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											data-th-text="#{PtlCashFlow002.tradeAmt}">金额</label>
										<div class="layui-input-inline input-inline">
											<input id="tradeAmt" name="tradeAmt"  required="required"
												class="layui-input form-input text-money"
												placeholder="请输入金额" data-th-value="${entity?.tradeAmt}">
											<span class="input-right-show">元</span>
										</div>
									</div>
									<div
										class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											data-th-text="#{PtlCashFlow001.ccy}">币种</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="ccy" name="ccy"
												class="layui-input form-input input-select"
												placeholder="请选择" data-th-data-result='${CCY}'
												data-th-initValue="*{entity?.ccy?:CCY_default}"  required="required">
											</select>
										</div>
									</div>
									<div
										class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											data-th-text="#{PtlCashFlow001.finprodType2}">资产类型</label>
										<div class="layui-input-inline input-inline">
											<select id="finprodType2" name="finprodType2"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-result='${PINAN_ASSET_TYPE}' childrenIds="finprodMarketId"
												data-th-initValue="${entity?.finprodType2}">
											</select>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div
										class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											data-th-text="#{PtlCashFlow001.finprodAbbr}">资产名称</label>
										<div class="layui-input-inline input-inline">
											<select id="finprodMarketId" name="finprodMarketId"
												parentIds="finprodType2"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-url="@{/invest/portfolio/ptlcashflow/PtlCashFlow002/getFinprodMarketIdToNew}"
												data-th-initValue="${entity?.finprodMarketId}">
											</select>
										</div>
									</div>
									<div
										class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											data-th-text="#{PtlCashFlow001.finprodMarketId}">资产代码</label>
										<div class="layui-input-inline input-inline">
											<input id="finprodAbbr" name="finprodAbbr"
												class="layui-input form-input" disabled="disabled"
												data-th-value="${entity?.finprodAbbr}">
										</div>
									</div>
									<div
										class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											data-th-text="#{PtlCashFlow001.customCashType}">业务类型</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="customCashType" name="customCashType"
												class="layui-input form-input input-select"
												placeholder="请选择"  required="required"
												data-th-data-result='${CUSTOM_CASHFLOW_TYPE}'
												data-th-initValue="${entity?.customCashType}">
											</select>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div
										class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											data-th-text="#{PtlCashFlow001.fTradeId}">关联业务编号</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="fTradeId" maxlength="32"
												name="fTradeId" formatoption="false"
												class="layui-input form-input input-select"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-url="@{/invest/portfolio/ptlcashflow/PtlCashFlow002/getFTradeId}"
												data-th-initvalue="${entity?.fTradeId}">
											</select>
										</div>
									</div>
									<!-- <div
										class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											data-th-text="#{PtlCashFlow002.isClean}">是否结清</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="isClean" name="isClean"
												class="layui-input form-input input-checkbox"
												data-th-data-result='${YES_OR_NO}' formatoption=true
												data-th-initValue="${entity?.isClean}" />
										</div>
									</div> -->
									<div
										class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											data-th-text="#{PtlCashFlow001.counterId}">交易对手</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="counterId" name="counterId"
												class="layui-input form-input input-select"
												placeholder="请输入内容" required="required"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-url="@{/invest/portfolio/ptlcashflow/PtlCashFlow002/getCounterId}"
												data-th-initvalue="${entity?.counterId}">
											</select>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
					<!-- 划款账户信息组件   -->
					<div class="page-component" id="bussTrdTransferOrder_div"
						th:data-path="@{/component/trade/BussTrdTransferOrder/init}"
						th:data-params="|{entityName: 'bussTrdTransferOrder', pageFrom: 'basicInfoForm',bizCode:'${entity?.busiNo}', entity:'${entity_bussTrdTransferOrderDto}'}|"></div>
					<!-- 备注 -->
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title">
								<span class="title-des">备注</span><i
									class="iconfont icon-arrow-down pro-down-icon"></i>
							</h3>
							<div class="pro-module-item" style="padding-bottom: 8px;">
								<div class="layui-form-item">
									<div class="form-inline-wrap" style="width: 100%;">
										<div class="layui-input-inline input-inline"
											style="margin:0 10px;width: 98% !important;">
											<textarea id="remark" name="remark" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												maxlength="300" class="layui-textarea"
												data-th-text="${entity?.remark}">
										</textarea>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

				</div>
				<div
					class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11"
					style="margin: 50px;">
					<div class="text-center">
						<a id="PtlCashFlow002_btn_save"`
							class="layui-btn layui-btn-sm btn-save"
							data-th-text="#{SysCommon.save}">保存</a> <a
							id="PtlCashFlow002_btn_submit"
							class="layui-btn layui-btn-sm btn-submit"
							data-th-text="#{SysCommon.submit}">提交</a> <a
							id="PtlCashFlow002_btn_cancel"
							class="layui-btn layui-btn-sm btn-cancel"
							data-th-text="#{SysCommon.cancel}">取消</a>
					</div>
				</div>
		</form>
	</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var CUSTOM_CASHFLOW_TYPE_04 = /*[[${CUSTOM_CASHFLOW_TYPE_04}]]*/'';
			var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
			var PTL04 = /*[[${PTL04}]]*/'';
			var F23 = /*[[${F23}]]*/'';
			var GEN_PAY_ORDERS_AUTO= /*[[${GEN_PAY_ORDERS_AUTO}]]*/; // 系统参数_是否显示划款指令
		</script>
		<script data-th-src="@{/js/invest/portfolio/ptlcashflow/PtlCashFlow002.js}"></script>
	</div>
</body>
</html>
