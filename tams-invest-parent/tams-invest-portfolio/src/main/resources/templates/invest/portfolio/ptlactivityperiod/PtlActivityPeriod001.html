<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PtlActivityPeriod001}">活期结息</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				<a id="PtlActivityPeriod001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
				<a id="PtlActivityPeriod001_btn_delete" class="layui-btn layui-btn-sm"><i class="iconfont icon-revoke"></i>撤销</a>
				<a id="PtlActivityPeriod001_btn_import" class="layui-btn layui-btn-sm btn-import ">导入</a>
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area curr-form' >
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{PtlActivityPeriod001.busiNo}">业务编号</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="busiNo" maxlength="32" name="busiNo" class="layui-input form-input input-lenovoselect" placeholder="请输入内容" 
                      					data-th-placeholder="#{SysCommon.placeholder}" data-th-data-url="@{/invest/portfolio/ptlactivityperiod/PtlActivityPeriod001/getBusiNo}" 
                      					data-idfield="code" data-keyfield="code" data-th-data-effectivefields="code" data-th-data-effectivefieldsalias='|{"code":"#{PtlActivityPeriod001.busiNo}"}|'>
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{PtlActivityPeriod001.acctNo1}">账户</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="acctNo" name="acctNo" class="layui-input form-input input-select" formatoption = true multiple="true"
										placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" data-th-data-url="@{/invest/portfolio/ptlactivityperiod/PtlActivityPeriod001/getBusiAcctNo}" >
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" data-th-text="#{PtlActivityPeriod001.mdate}">本次收息日</label>
							<div class="layui-input-inline input-inline">
								<input id="mdate" name="mdate" class="layui-input form-input input-dateRangeSelect" placeholder="请输入日期">
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" data-th-text="#{PtlActivityPeriod001.settleDate}">支付日</label>
							<div class="layui-input-inline input-inline">
								<input id="settleDate" name="settleDate" class="layui-input form-input input-dateRangeSelect" placeholder="请输入日期">
							</div>
						</div>
				    	<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{PtlActivityPeriod001.status}">有效状态</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="tradeStatus" name="tradeStatus" class="layui-input form-input input-select" data-th-data-result='${TRADE_FLOW_STATUS}' formatoption = true placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
				    </div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-src="@{/js/invest/portfolio/ptlactivityperiod/PtlActivityPeriod001.js}"></script>
	</div>
</body>
</html>
