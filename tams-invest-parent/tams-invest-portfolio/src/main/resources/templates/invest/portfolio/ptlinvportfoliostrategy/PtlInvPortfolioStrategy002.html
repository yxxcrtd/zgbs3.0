<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PtlInvPortfolioStrategy002}">投资组合策略管理新建</title>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap" id="submitForm">
			<input id="indexId" name="indexId" data-th-value="${indexId}"
				type="hidden" /> <input type="hidden" id="workflowId"
				name="workflowId" data-th-value="${entity?.workflowId}" /> <input
				type="hidden" id="ptlStgyId" name="ptlStgyId"
				data-th-value="${entity?.ptlStgyId}" />
			<div class="layui-form-item">
				<div class="form-inline-wrap">
					<label class="layui-form-label form-lable"
						data-th-text="#{PtlInvPortfolioStrategy001.portfolioId}">组合代码</label>
					<div class="layui-input-inline input-inline">
						<select id="portfolioId" name="portfolioId"
							class="layui-input form-input input-select"
							data-th-data-url="@{/invest/portfolio/ptlinvportfoliostrategy/PtlInvPortfolioStrategy001/getPortfolioId}"
							required="required" allowClear="true" searchable="true"
							data-th-initValue='${entity?.portfolioId}'>
						</select>
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-lable"
						data-th-text="#{PtlInvPortfolioStrategy001.portfolioName}">组合名称</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="portfolioName" name="portfolioName"
							required="required" class="layui-input form-input"
							data-th-value="${entity?.portfolioName}" disabled />
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-lable"
						data-th-text="#{PtlInvPortfolioStrategy001.strategyType}">策略类型</label>
					<div class="layui-input-inline input-inline">
						<select name="strategyType" id="strategyType"
							class="layui-input form-input input-select"
							data-th-initValue='${entity?.strategyType}'
							data-th-data-result="${STRATEGY_TYPE}" required disabled>
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="form-inline-wrap">
					<label class="layui-form-label form-lable"
						data-th-text="#{PtlInvPortfolioStrategy001.strategyId}">策略代码</label>
					<div class="layui-input-inline input-inline">
						<select id="strategyId" name="strategyId"
							class="layui-input form-input input-select"
							data-th-data-url="@{/invest/portfolio/ptlinvportfoliostrategy/PtlInvPortfolioStrategy001/getStrategyId}"
							required="required" allowClear="true" searchable="true"
							data-th-initValue='${entity?.strategyId}'
							parentIds="strategyType">
						</select>
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-lable"
						data-th-text="#{PtlInvPortfolioStrategy001.strategyName}">策略名称</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="strategyName" name="strategyName"
							required="required" class="layui-input form-input"
							data-th-value="${entity?.strategyName}" disabled />
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-lable"
						data-th-text="#{PtlInvPortfolioStrategy001.strategyDesc}">策略描述</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="strategyDesc" name="strategyDesc"
							required="required" class="layui-input form-input"
							data-th-value="${entity?.strategyDesc}" disabled />
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="form-inline-wrap">
					<label class="layui-form-label form-lable"
						data-th-text="#{PtlInvPortfolioStrategy001.effDate}">生效日</label>
					<div class="layui-input-inline input-inline">
						<input id="effDate" name="effDate"
							class="layui-input form-input input-dateSelect"
							data-th-value="${entity?.effDate}" required>
					</div>
				</div>
				<div class="form-inline-wrap">
					<!-- 隐藏域  -->
					<div class="layui-input-inline input-inline">
						 <input type="hidden" id="tableShowFlag" name="tableShowFlag" data-th-value="${entity?.tableShowFlag}" />
					</div>
				</div>
			</div>
			<div id="div_dataTable" style="display: none">
				<table class="layui-table" id="dataTable"></table>
			</div>
		</form>
		<div class="layui-col-md10" style="margin: 30px 0;">
			<div class="text-center">
				<a id="PtlInvPortfolioStrategy002_btn_save"
					class="layui-btn layui-btn-sm btn-save"
					data-th-text="#{SysCommon.save}">保存</a> <a
					id="PtlInvPortfolioStrategy002_btn_submit"
					class="layui-btn layui-btn-sm btn-submit"
					data-th-text="#{SysCommon.submit}">提交</a> <a
					id="PtlInvPortfolioStrategy002_btn_cancel"
					class="layui-btn layui-btn-sm btn-cancel"
					data-th-text="#{SysCommon.cancel}">取消</a>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var SECRATE_DATA = /*[[${SECRATE_DATA}]]*/'';
			var EVAL_INDEX = /*[[${EVAL_INDEX}]]*/'';
			var EVAL_INCOME_TYPE = /*[[${EVAL_INCOME_TYPE}]]*/'';
			var ptlIncomeIndexList = /*[[${ptlIncomeIndexList}]]*/'';
		</script>
		<script
			data-th-src="@{/js/invest/portfolio/ptlinvportfoliostrategy/PtlInvPortfolioStrategy002.js}"
			type="text/javascript">
			
		</script>
	</div>

</body>

</html>
