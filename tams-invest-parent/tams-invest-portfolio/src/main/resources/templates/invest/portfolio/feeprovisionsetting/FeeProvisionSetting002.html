<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{FeeProvisionSetting002}">费用预提新建</title>
</head>
<body>
<div class="pro-module-wrap">
    <div layout:fragment="content">
        <div>
            <div class="pro-module-wrapper pro-module-base" style="border-top: none;">
                <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
                    <input type="text" name="seqNo" id="seqNo" th:value="${entity?.seqNo}" hidden>
                    <input type="text" name="workflowId" id="workflowId" th:value="${workflowId}" hidden>
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title" style="border-top: 1px solid #cccccc;"><span class="title-des">基本信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{FeeProvisionSetting001.feeType}">费用类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="FeeProvisionSetting002_feeType" name="feeType" required
                                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                                    th:placeholder="#{SysCommon.placeholder}"
                                                    data-th-data-result="${FEE_TYPE}"
                                                    formatoption="true"  type="text"
                                                    th:initValue="${entity?.feeType}"></select>
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                                        <label class="layui-form-label form-lable"
                                               data-th-text="#{FeeProvisionSetting001.secAcctId}">证券账户</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="FeeProvisionSetting002_secAcctId" name="secAcctId" formatoption="true" required
                                                    class="tabJump layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-data-url="@{/invest/portfolio/feeprovisionsetting/FeeProvisionSetting001/getSecAcctId}"
                                                    data-th-initValue="${entity?.secAcctId}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{FeeProvisionSetting002.payCycle}">支付频率</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="FeeProvisionSetting002_payCycle" name="payCycle" required
                                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                                    th:placeholder="#{SysCommon.placeholder}"
                                                    data-th-data-result="${FREQUENCY_UNIT}"
                                                    formatoption="true"  type="text"
                                                    th:initValue="${entity?.payCycle}"></select>
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{FeeProvisionSetting002.payDate}">几号</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="FeeProvisionSetting002_payDate" name="payDate" required
                                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                                    th:placeholder="#{SysCommon.placeholder}"
                                                    data-th-data-result="${DAY_OF_MONTH}"
                                                    formatoption="true"  type="text"
                                                    th:initValue="${entity?.payDate}"></select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{FeeProvisionSetting001.positionStartDate}">计提开始日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="positionStartDate" id="FeeProvisionSetting002_positionStartDate" required
                                                   class="layui-input form-input input-dateSelect"
                                                   data-th-value='${entity?.positionStartDate eq null ? positionStartDate : #dates.format(entity?.positionStartDate,"yyyy-MM-dd")}'>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{FeeProvisionSetting001.positionEndDate}">计提结束日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="positionEndDate" id="FeeProvisionSetting002_positionEndDate" required
                                                   class="layui-input form-input input-dateSelect"
                                                   data-th-value='${entity?.positionEndDate eq null ? positionEndDate : #dates.format(entity?.positionEndDate,"yyyy-MM-dd")}'>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{FeeProvisionSetting001.actPositionEndDate}">实际计提结束日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="actPositionEndDate" id="FeeProvisionSetting002_actPositionEndDate" disabled
                                                   class="layui-input form-input input-dateSelect"
                                                   data-th-value='${entity?.actPositionEndDate eq null ? actPositionEndDate : #dates.format(entity?.actPositionEndDate,"yyyy-MM-dd")}'>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" id='IFeeProvisionSetting002_div_feeAmtTotal'>
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{FeeProvisionSetting002.feeAmtTotal}">每季费用金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="feeAmtTotal" id="FeeProvisionSetting002_feeAmtTotal" required disabled
                                                   class="layui-input form-input text-number"
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   data-th-value='${entity?.feeAmtTotal}'>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{FeeProvisionSetting002.registOrg}">登记托管机构</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="FeeProvisionSetting002_registOrg" name="registOrg" required
                                                    class="layui-input form-input input-select"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue='${entity?.registOrg}'
                                                    data-th-data-result="${REGIST_ORG}">
                                            </select>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title"><span class="title-des">产品费用明细</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                            <div class="pro-module-item">
                                <div class='table-wrap'>
                                    <table class="layui-table" id="dataTable"></table>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="row text-center stepbar">
                <div class="text-center">
                    <a id="FeeProvisionSetting002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                    <a id="FeeProvisionSetting002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                    <a id="FeeProvisionSetting002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">

    </script>
    <script data-th-src="@{/js/invest/portfolio/feeprovisionsetting/FeeProvisionSetting002.js}" type="text/javascript"></script>
</div>
</body>
</html>
