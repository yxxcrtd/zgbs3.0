<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PtlRepoPledgeSearch001}">债券质押查询</title>
</head>
<body>
	<div layout:fragment="content">
		<div class="layui-tab layui-tab-brief" lay-filter="docDemoTabBrief">
			<ul class="layui-tab-title">
				<li class="layui-this">债券质押明细查询</li>
				<li>质押券置换查询</li>
				<li id="PtlRepoPledgeSummarySearchLi">债券质押汇总查询</li>
			</ul>
			<div class="layui-tab-content" >
				<div class="layui-tab-item layui-show">
					<div class='layui-fluid'>
						<div class="layui-col-md12 form-button-area"></div>
						<div class='joyin-form-wrap joyin-filter-form condition-area'>
							<form class="layui-form" id="searchForm"> 
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
                                   data-th-text="#{PtlRepoPledgeSearch001.counterId}">组合代码</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="counterId" name="counterId" placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}" class="layui-input form-input input-select"
										data-th-data-url="@{/invest/portfolio/portfolioanalysis/ptlrepopledgesearch/PtlRepoPledgeSearch001/getCounterId}"
                                        allowClear="true" multiple="true" formatoption="true">
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
                                   data-th-text="#{PtlRepoPledgeSearch001.finprodMarketId}">资产代码</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="finprodMarketId" name="finprodMarketId"
                                        class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
										data-th-data-url="@{/invest/portfolio/portfolioanalysis/ptlrepopledgesearch/PtlRepoPledgeSearch001/getFinprodMarketId}"
                                        allowClear="true" formatoption="true">
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
                                   data-th-text="#{PtlRepoPledgeSearch001.type4}">债券一级分类</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="type4" name="type4"  class="layui-input form-input input-select"
                                        allowClear="true" data-th-data-result = '${WINDTYPEONE}'
										formatoption="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{PtlRepoPledgeSearch001.type5}">债券二级分类</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="type5" name="type5"  class="layui-input form-input input-select"
										allowClear="true"data-th-data-result = '${WINDTYPETWO}'
										formatoption="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
                        <!--  add by wangyang1 【吉林银行】 增加 产品经理  2019年9月29日 start -->
                        <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4" id="div_prodManager">
                            <label class="layui-form-label form-lable">产品经理</label>
                            <div class="layui-input-inline input-inline">
                              <!--   <input type="text" name="prodManager" id="prodManager"
                                    class="layui-input form-input input-lenovoselect" maxlength=60
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-url="@{/invest/product/common/getUserName}"> -->
                                 <select type="text" name="prodManager" id="prodManager"
                                    class="layui-input form-input input-select" maxlength=60
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-url="@{/invest/product/common/getUserName}">
                                </select>    
                            </div>
                        </div>
                        <!--  add by wangyang1 【吉林银行】 增加 产品经理 end -->
						<!--  add by swwan 【重庆银行】 增加 业务类型  2021年7月20日 start -->
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{PtlRepoPledgeSearch001.finprodType2}">业务类型</label>
							<div class="layui-input-inline input-inline">
								<select type="text" name="busiType" id="busiType"
										class="layui-input form-input input-select"
										allowClear="true" data-th-data-result='${BusiType}' multiple="true"
										formatoption="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
										>
								</select>
							</div>
						</div>
						<!--  add by swwan 【重庆银行】 增加 业务类型  2021年7月20日 end -->
					</div>
					<!--  add by swwan 【重庆银行】 增加 交易对手  2021年7月22日 start -->
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{PtlRepoPledgeSearch001.counter}">交易对手</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="counter" name="counter" placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}" class="layui-input form-input input-select"
										data-th-data-url="@{/invest/portfolio/portfolioanalysis/ptlrepopledgesearch/PtlRepoPledgeSearch001/getCounter}"
										allowClear="true" multiple="true" formatoption="true">
								</select>
							</div>
						</div>
					</div>
					<!--  add by swwan 【重庆银行】 增加 交易对手  2021年7月22日 end -->
				</form>
						</div>
						<div>
							<table class="layui-table" id="dataTable"></table>
						</div>
					</div>
				</div>
				<div class="layui-tab-item">
					<div class='layui-fluid'>
						<div class="layui-col-md12 form-button-area substitutionSearchDiv">
						</div>

						<div class='joyin-form-wrap joyin-filter-form condition-area condition-area-substitution_1'>
							<form class="layui-form" id="substitutionSearchForm">
								<div class="layui-form-item">
									<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											   data-th-text="#{PledgeSubstitution001.substitutionPortfolioId}">组合代码</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="substitutionPortfolioId" name="substitutionPortfolioId" placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}" class="layui-input form-input input-select"
													data-th-data-url="@{/invest/portfolio/portfolioanalysis/ptlrepopledgesearch/PtlRepoPledgeSearch001/getCounterId}"
													allowClear="true" multiple="true" formatoption="true">
											</select>
										</div>
									</div>
									<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											   data-th-text="#{PledgeSubstitution001.substitutionTradeType}">交易类型</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="substitutionTradeType" name="substitutionTradeType"
													class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
													data-th-data-result = '${TradeType}'
													allowClear="true" formatoption="true">
											</select>
										</div>
									</div>
									<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											   data-th-text="#{PledgeSubstitution001.substitutionTradePs}">交易方向</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="substitutionTradePs" name="substitutionTradePs"  class="layui-input form-input input-select"
													allowClear="true" data-th-data-result = '${TradePs}'
													formatoption="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
											</select>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											   data-th-text="#{PledgeSubstitution001.substitutionTradeDate}">交易日期</label>
										<div class="layui-input-inline input-inline">
											<input id='substitutionTradeDate' name='substitutionTradeDate'
												   class="layui-input form-input input-dateRangeSelect"
												   placeholder="请选择、支持区间"
												   data-th-placeholder="#{SysCommon.dateInterval}">
										</div>
									</div>

									<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4" >
										<label class="layui-form-label form-lable"data-th-text="#{PledgeSubstitution001.substitutionDate}">置换日期</label>
										<div class="layui-input-inline input-inline">
											<input id='substitutionDate' name='substitutionDate'
												   class="layui-input form-input input-dateRangeSelect"
												   placeholder="请选择、支持区间"
												   data-th-placeholder="#{SysCommon.dateInterval}">
										</div>
									</div>

								</div>
							</form>
						</div>
						<div>
							<table class="layui-table" id="substitutionDataTable"></table>
						</div>
					</div>
				</div>
				<div id="PtlRepoPledgeSummarySearch" class="layui-tab-item">
					<div class='layui-fluid'>
						<div class="layui-col-md12 form-button-area pledgeSummarySearchDiv">
						<a id="PtlRepoPledgeSearch001_btn_reset" class="layui-btn layui-btn-sm btn-reset" data-th-text="#{SysCommon.reset}">重置</a>
						</div>
						<div class='joyin-form-wrap joyin-filter-form condition-area condition-area-substitution_2'>
							<form class="layui-form" id="pledgeSummarySearchForm">
								<div class="layui-form-item">
									<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											   data-th-text="#{PledgeSubstitution001.substitutionPortfolioId}">组合代码</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="pledgeSummaryPortfolioId" name="pledgeSummaryPortfolioId" placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}" class="layui-input form-input input-select"
													data-th-data-url="@{/invest/portfolio/portfolioanalysis/ptlrepopledgesearch/PtlRepoPledgeSearch001/getCounterId}"
													allowClear="true" multiple="true" formatoption="true" required>
											</select>
										</div>
									</div>
									<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											   data-th-text="#{PledgeSubstitution001.substitutionTradeDate}">交易日期</label>
										<div class="layui-input-inline input-inline">
											<input id="pledgeSummaryTradeDate" name='pledgeSummaryTradeDate'
												   type="text" class="layui-input form-input input-dateSelect"
												   data-th-value="${sysDate}" placeholder="请选择日期" required/>
										</div>
									</div>
								</div>
							</form>
						</div>
						<div>
							<table class="layui-table" id="pledgeSummaryDataTable"></table>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-src="@{/js/invest/portfolio/portfolioanalysis/ptlrepopledgesearch/PtlRepoPledgeSearch001.js}"></script>
	</div>
</body>
</html>
