<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PtlCashFlow001}">自定义现金流</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				<a id="PtlCashFlow001_btn_add"
					class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a>
				<a id="PtlCashFlow001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="#{SysCommon.revoke}"></a>
			</div>
			<div
				class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{PtlCashFlow001.busiNo}">业务编号</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="busiNo" maxlength="32" name="busiNo"
									class="layui-input form-input input-lenovoselect"
									placeholder="请输入内容" 
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-url="@{/invest/portfolio/ptlcashflow/PtlCashFlow001/getBusiNo}"
									data-keyfield="code" data-th-data-effectivefields="code"
									data-th-data-effectivefieldsalias='|{"code":"#{PtlCashFlow001.busiNo}"}|' />
							</div>
						</div>
						<div
							class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{PtlCashFlow001.portfolioId}">组合代码</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="portfolioId" name="portfolioId"
									class="layui-input form-input input-select"
									data-th-data-url="@{/invest/portfolio/ptlcashflow/PtlCashFlow001/getPortfolioId}"
									formatoption=true placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}" multiple="true">
								</select>
							</div>
						</div>
						<div
							class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{PtlCashFlow001.ps}">收支方向</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="ps" name="ps"
									class="layui-input form-input input-checkbox"
									data-th-data-result='${PS}'/>
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{PtlCashFlow001.finprodType2}">资产类型</label>
							<div class="layui-input-inline input-inline">
								<select id="finprodType2" name="finprodType2"
									class="layui-input form-input input-select"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result='${PINAN_ASSET_TYPE}'>
								</select>
							</div>
						</div>
						<div
							class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{PtlCashFlow001.finprodMarketId}">资产代码</label>
							<div class="layui-input-inline input-inline">
								<input id="finprodMarketId" name="finprodMarketId"
									class="layui-input form-input input-lenovoselect"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-url="@{/invest/portfolio/ptlcashflow/PtlCashFlow001/getFinprodMarketId}"
									data-th-data-effectivefieldsalias='|{"code":"#{PtlCashFlow001.finprodMarketId}","shortName":"#{PtlCashFlow001.finprodAbbr}"}|'  />
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{PtlCashFlow001.customCashType}">业务类型</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="customCashType" name="customCashType"
									class="layui-input form-input input-select" placeholder="请选择"
									data-th-data-result='${CUSTOM_CASHFLOW_TYPE}'>
								</select>
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{PtlCashFlow001.settleDate}">发生日期</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="settleDate" name="settleDate"
									class="layui-input form-input input-dateRangeSelect"
									placeholder="请选择时间区间"
									data-th-placeholder="#{SysCommon.placeholder}" />
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" data-th-text="#{PtlCashFlow001.status}">有效状态</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="status" name="status"
										class="layui-input form-input input-select" placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result='${TRADE_FLOW_STATUS}'
										allowClear="true" formatoption="true" ></select>
							</div>
						</div>
					</div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-src="@{/js/invest/portfolio/ptlcashflow/PtlCashFlow001.js}"></script>
	</div>
</body>
</html>
