<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{PtlDvpFundAllocation002}">DVP资金调拨新建</title>
</head>
<body>
<div layout:fragment="content">
    <div>
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <input type="hidden" id="orderId" name="orderId" th:value="${entity?.orderId}" />
            <input type="hidden" id="tradeId" name="tradeId" th:value="${entity?.tradeId}" />
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="aleft stuff title-des">基本信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item pro-item-wrap">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                        data-th-text="#{PtlDvpFundAllocation001.portfolioId}">组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required id="portfolioId" name="portfolioId" class="layui-input form-input input-select baseInfo" placeholder="请输入内容" 
                                            data-th-placeholder="#{SysCommon.placeholder}" childrenIds="counterAcctNo,myAcctNo" th:initvalue="${entity?.portfolioId}"
                                            data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                        data-th-text="#{PtlDvpFundAllocation001.settleDate}">转账日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="settleDate" name="settleDate" class="layui-input form-input input-dateSelect" placeholder="请输入内容" 
                                            data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.settleDate==null ? platDate : #dates.format(entity?.settleDate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                        data-th-text="#{PtlDvpFundAllocation002.ccy}">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required class="layui-input form-input input-select baseInfo" id="ccy" 
                                            name="ccy" th:data-result="${CCY}" placeholder="请输入内容" th:initValue='*{entity?.ccy?:CCY_default}'
                                            data-th-placeholder="#{SysCommon.placeholder}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                        data-th-text="#{PtlDvpFundAllocation001.payType}">划款类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required class="layui-input form-input input-select baseInfo" id="payType"
                                                childrenIds="counterAcctNo,myAcctNo"
                                            name="payType" th:data-result="${PS}" placeholder="请输入内容" th:initValue='*{entity?.payType}'
                                            data-th-placeholder="#{SysCommon.placeholder}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                        data-th-text="#{PtlDvpFundAllocation001.myAcctNos}">付款账户</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required class="layui-input form-input input-select" id="myAcctNo" 
                                             name="myAcctNo" parentIds="portfolioId,payType,ccy"
                                             placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" th:initValue='${entity?.myAcctNo}'
                                             data-th-data-url="@{/invest/portfolio/ptldvpfundallocation/PtlDvpFundAllocation002/getMyAcctNo}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                        data-th-text="#{PtlDvpFundAllocation001.myAcctAmount}">付款账户余额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="myAcctAmount" name="myAcctAmount" class="layui-input form-input text-number" 
                                            disabled placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" th:value="${entity?.myAcctAmount}">
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" style="display:none">
                                    <label class="layui-form-label form-label-wrap"
                                        data-th-text="#{PtlDvpFundAllocation001.busiNo}">业务编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" class="layui-input form-input" placeholder="请输入内容" 
                                            data-th-placeholder="#{SysCommon.placeholder}"  id="busiNo" name="busiNo" th:value='${entity?.busiNo}'
                                            disabled="disabled">
                                    </div>
                                </div>
                                
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                        data-th-text="#{PtlDvpFundAllocation001.counterAcctNo}" >收款账户</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required class="layui-input form-input input-select" placeholder="请输入内容"
                                            id="counterAcctNo" name="counterAcctNo" 
                                            data-th-placeholder="#{SysCommon.placeholder}" parentIds="portfolioId,payType,ccy" th:initValue='${entity?.counterAcctNo}'
                                            data-th-data-url="@{/invest/portfolio/ptldvpfundallocation/PtlDvpFundAllocation002/getCounterAcctNo}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                        data-th-text="#{PtlDvpFundAllocation001.counterAcctAmount}">收款账户余额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="counterAcctAmount" name="counterAcctAmount" class="layui-input form-input text-number" 
                                            disabled placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" th:value="${entity?.counterAcctAmount}">
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                        data-th-text="#{PtlDvpFundAllocation001.settleAmts}">划拨金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" class="layui-input form-input text-number" placeholder="请输入内容" 
                                            id="settleAmt" name="settleAmt" data-textrange="2" maxLength="29" data-th-value='${entity?.settleAmt}' data-th-placeholder="#{SysCommon.placeholder}">
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                 <!-- 划款信息 -->
                <div id="transferInformation" class="page-component"
                    th:data-path="@{/component/trade/BussTrdTransferOrder/init}"
                    th:data-params="|{entityName: 'bussTrdTransferOrder', pageFrom: 'submitForm', entity:'${stlPayOrdersList}',bizCode:'${tradeId}'}|"></div>
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="aleft stuff title-des" >备注信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item pro-item-wrap">
                            <div class="layui-form-item">
                                <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                    <textarea class="layui-textarea" id="remark" maxLength="1000" name="remark" data-th-placeholder="#{SysCommon.placeholder}"  th:text="${entity?.remark}" placeholder="请输入内容"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="text-center" align="text-center" style="margin-top:10px;">
                <a id="PtlDvpFundAllocation002_btn_save" class="layui-btn layui-btn-sm btn-save" style="display: none" data-th-text="#{SysCommon.save}">保存</a>
                <a id="PtlDvpFundAllocation002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="PtlDvpFundAllocation002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
            var Fin_Type = /*[[${Fin_Type}]]*/'';
            var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
            var myAcctNoInitValue = /*[[${entity?.myAcctNo}]]*/'';
            var counterAcctNoInitValue = /*[[${entity?.counterAcctNo}]]*/'';
            // 流程退回重新生成指令没有check修正 add by renping 20191102 start
            var stlPayOrdersList = /*[[${stlPayOrdersList}]]*/'';
            // 流程退回重新生成指令没有check修正 add by renping 20191102 end
        </script>
    <script data-th-src="@{/js/invest/portfolio/ptldvpfundallocation/PtlDvpFundAllocation002.js}" type="text/javascript"></script>
</div>
</body>

</html>
