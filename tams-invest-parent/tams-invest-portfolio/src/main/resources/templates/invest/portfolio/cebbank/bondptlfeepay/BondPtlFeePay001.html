<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{BondPtlFeePay001}">证券组合费支付查询</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="form-button-area">
				<a id="BondPtlFeePay001_btn_add" class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a> 
				<a id="BondPtlFeePay001_btn_revoke" class="layui-btn layui-btn-sm" data-th-text="撤销">撤销</a>
			</div>
			<div
				class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" data-th-text="证券账户">证券账户</label>
							<div class="layui-input-inline input-inline">
								<!-- <input  type="text" id="secAcctId" name="secAcctId" class="layui-input form-input input-lenovoselect" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" 
		                       		data-th-data-url="@{/cebbank/bondptlfeepay/BondPtlFeePay001/getSecAcctId}" 
		                      		data-idfield="code" data-keyfield="name" data-th-data-effectivefieldsalias='|{"code":"#{InvestFeePay001.secAcctCode}","shortName":"#{InvestFeePay001.secAcctName}"}|'> -->
		                      	<select type="text" id="secAcctId" name="secAcctId"
                      				class="layui-input form-input input-select" placeholder="请输入内容" multiple=true
                      				data-th-placeholder="#{SysCommon.placeholder}"
                      				data-th-data-url="@{/cebbank/bondptlfeepay/BondPtlFeePay001/getSecAcctIdS}">
								</select>
							</div>
						</div>
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" data-th-text="付费日期">付费日期</label>
							<div class="layui-input-inline input-inline">
								<input id="BondPtlFeePay001_paydate" name='paydate'
									class="layui-input form-input input-dateRangeSelect"
									placeholder="请选择时间区间"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-value = '${quaryDate}'>
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" data-th-text="有效状态">有效状态</label>
							<div class="layui-input-inline input-inline">
								<select name="status" id="BondPtlFeePay001_status"
									class="layui-input form-input input-select"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result="${STATUS_VALID}"
									data-th-initValue="${statusUndo}">							
								</select>
							</div>
						</div>	
					</div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var REM_TYPE = [[${remType}]];
        </script>
		<script data-th-src="@{/js/invest/portfolio/cebbank/bondptlfeepay/BondPtlFeePay001.js}" type="text/javascript"></script>
		<script data-th-src="@{/js/invest/product/productelement/common/FinProductCommon.js}" type="text/javascript"></script>
		<script data-th-inline="javascript" type="text/javascript">
		
		</script>
	</div>
</body>
</html>
