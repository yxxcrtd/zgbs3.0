<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PtlInvestStrategyPool001}">投资策略池管理</title>
</head>
<body>
    <div layout:fragment="content">
        <div class='layui-fluid'>
            <div class="layui-col-md12 form-button-area" style="margin: 10px;">
                <a id="PtlInvestStrategyPool001_btn_add" class="layui-btn layui-btn-sm btn-create"
                    data-th-text="#{SysCommon.create}">新建</a>
            </div>
            <div class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
                <form class="layui-form" id="searchForm">
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                                data-th-text="#{PtlInvestStrategyPool001.strategyId}">策略代码</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="strategyId" name="strategyId"
                                    class="layui-input form-input input-select" placeholder="请选择"
                                    data-th-placeholder="#{SysCommon.placeholder}" multiple="true"
                                    data-th-data-url="@{/invest/portfolio/ptlinvportfoliostrategy/PtlInvPortfolioStrategy001/getStrategyId}">
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                                data-th-text="#{PtlInvestStrategyPool001.strategyName}">策略名称</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="strategyName" name="strategyName" class="layui-input form-input"
                                    placeholder="请输入内容">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable" data-th-text="#{PtlInvestStrategyPool001.type2}">资产二级分类</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="type2" name="type2" class="layui-input form-input input-select"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" allowClear="true"
                                    multiple="true" formatoption="true" childrenIds="type3"
                                    data-th-data-url="@{/invest/portfolio/ptlinveststrategypool/PtlInvestStrategyPool002/queryMulType2}"></select>
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable" data-th-text="#{PtlInvestStrategyPool001.type3}">资产三级分类</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="type3" name="type3" class="layui-input form-input input-select"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" multiple="true"
                                    allowClear="true" formatoption="true" parentIds="type2" childrenIds="type4"
                                    data-th-data-url="@{/invest/portfolio/ptlinveststrategypool/PtlInvestStrategyPool002/queryMulType3}"></select>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable" data-th-text="#{PtlInvestStrategyPool001.type4}">资产四级分类</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="type4" name="type4" class="layui-input form-input input-select"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" multiple="true"
                                    allowClear="true" formatoption="true" parentIds="type3" ,childrenIds="type5"
                                    data-th-data-url="@{/invest/portfolio/ptlinveststrategypool/PtlInvestStrategyPool002/queryMulType4}"></select>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable" data-th-text="#{PtlInvestStrategyPool001.type5}">资产五级分类</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="type5" name="type5" class="layui-input form-input input-select"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" multiple="true"
                                    allowClear="true" formatoption="true" parentIds="type4"
                                    data-th-data-url="@{/invest/portfolio/ptlinveststrategypool/PtlInvestStrategyPool002/queryMulType5}"></select>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/portfolio/ptlinveststrategypool/PtlInvestStrategyPool001.js}"></script>
    </div>
</body>
</html>
