<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title>母资管计划查询</title>
</head>
<body>
    <div layout:fragment="content">
        <div class='layui-fluid'>
            <div class="form-button-area"></div>
            <div class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
                <form class="layui-form" id="searchForm">
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                            <label class="layui-form-label form-lable">资产名称</label>
                            <div class="layui-input-inline input-inline">
								<select id="finprodMarketId" name="finprodMarketId" formatoption='true'
	                                class="layui-input form-input input-select"
	                                data-th-data-url="@{/invest/portfolio/parentAssetManage/ParentAssetManage001/getAssetIdOption}"
                                    allowClear="true" placeholder="请输入内容"
	                                data-th-placeholder="#{SysCommon.placeholder}"
	                                data-th-initValue='${finprodId}'>
	                        	</select>
                            </div>
                        </div>
                	</div>
                	
                	<div class="layui-form-item">
                        <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable">查询日</label>
                            <div class="layui-input-inline input-inline">
                                <input id="ParentAssetManage001_date_searchdate" name='qDate'
                                    class="layui-input form-input input-dateSelect"
                                    data-th-value="|${currentDate}|"
                                    placeholder="请选择时间区间"
                                    data-th-placeholder="#{SysCommon.placeholder}">
                            </div>
                        </div>      
                    </div>
                </form>
            </div>
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
		<script th:inline="javascript">
        </script>
        <script data-th-src="@{/js/invest/portfolio/parentAssetManage/ParentAssetManage001.js}"></script>
    </div>
</body>
</html>
