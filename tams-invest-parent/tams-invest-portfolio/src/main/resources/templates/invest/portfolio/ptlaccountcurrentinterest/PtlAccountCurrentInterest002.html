<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PtlAccountCurrentInterest002}">账户活期利率新建</title>
<style type="text/css">
.form-label-wrap{
    width: 25%;
}
</style>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
				<form class="layui-form" id="searchForm">
				    <input type="text" id="pageModel" name="pageModel" class="layui-input form-input" data-th-value="${pageModel}" style = "display: none">
					<div class="pro-module-wrap" style="margin-top: 20px;">
						<div class="pro-module">
							<h3 class="pro-module-title" style="border-top: 1px solid #cccccc;"><span class="title-des">账户信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{PtlAccountCurrentInterest001.acctName}">账户名称</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="busiAcctNo" maxlength="32" name="busiAcctNo" class="layui-input form-input input-select" placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}" data-th-data-url="@{/invest/portfolio/ptlaccountcurrentinterest/PtlAccountCurrentInterest002/getBusiAcctNo(pageModel=${pageModel})}"
													data-th-initValue="${entity?.busiAcctNo}" required>
											</select>
											<input type="hidden" id="cashId" name="cashId" data-th-value="${entity?.cashId}">
											<input type="hidden" id="finprodType" name="finprodType" data-th-value="${entity?.finprodType}">
											<input type="hidden" id="oldEffDate" name="oldEffDate" data-th-value="${#dates.format(entity?.effDate,'yyyy-MM-dd')}">
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{PtlAccountCurrentInterest001.ccy}">币种</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="ccy" maxlength="32" name="ccy" class="layui-input form-input input-select" placeholder="请输入内容"
													disabled data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${CCY}" data-th-initValue="${entity?.ccy?:CCY_default}" required>
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{PtlAccountCurrentInterest001.effDate}">生效日</label>
										<div class="layui-input-inline input-inline">
											<input id="effDate" name="effDate" class="layui-input form-input input-dateSelect" data-th-value='${#dates.format(entity?.effDate,"yyyy-MM-dd")}' required placeholder="请输入日期">
										</div>
									</div>
								</div>
                                
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{PtlAccountCurrentInterest001.basis}">计息基础</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="basis" maxlength="32" name="basis" class="layui-input form-input input-select" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${BASIS}"
                                                    data-th-initValue="${entity?.basis}" allowClear=false required>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                
							</div>
						</div>
					</div>
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">利率信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{PtlAccountCurrentInterest001.rateType}">利率类型</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="rateType" name="rateType"
												   class="layui-input form-input input-select" data-th-value="${entity?.rateType}"
												   placeholder="请输入内容" data-th-data-result="${INT_TYPE}" required>
										</div>
									</div>
									<div id="rateDiv" class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{PtlAccountCurrentInterest001.rate}">利率</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="rate" name="rate" maxLength="16" required
												   class="layui-input form-input text-number" data-th-value="${entity?.rate}"
												   placeholder="请输入内容">
										</div>
									</div>
								</div>
								<div class="layui-form-item" id="currentRateDiv">
									<div  class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{PtlAccountCurrentInterest001.currentRate}">活期利率</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="currentRate" name="indexId" required
													class="layui-input form-input input-select" data-th-initValue="${entity?.indexId}"
													placeholder="请输入内容" data-th-data-result="${RATE_SOURCE}"> <!-- data-th-data-url="@{/invest/portfolio/ptlaccountcurrentinterest/PtlAccountCurrentInterest002/getcurrentRate}" -->
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" ><span style="padding-right:30px;">*</span>系数</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="coefficient" name="coefficient" maxLength="15"
												   class="layui-input form-input text-number" data-th-value="${entity?.coefficient}"
												   placeholder="请输入内容">
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"><span style="padding-right:30px;">+</span>利差(%)</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="spreadRate" name="spreadRate" maxLength="15"
												   class="layui-input form-input text-number" data-th-value="${entity?.spreadRate}"
												   placeholder="请输入内容">
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</form>
				<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="position: fixed;bottom: 30px;">
                    <div class="text-center">
                        <a id="PtlAccountCurrentInterest002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                        <a id="PtlAccountCurrentInterest002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="PtlAccountCurrentInterest002_btn_cancle" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-src="@{/js/invest/portfolio/ptlaccountcurrentinterest/PtlAccountCurrentInterest002.js}"></script>
	</div>
</body>
</html>
