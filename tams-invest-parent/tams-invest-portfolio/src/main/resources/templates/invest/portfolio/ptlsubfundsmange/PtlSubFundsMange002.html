<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PtlSubFundsMange002}">产品交易资产分配新建</title>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap" id="submitForm">
			<input type="hidden" id="portfolioId" name="portfolioId" data-th-value="${entity?.portfolioId}">
<!-- 			<input type="hidden" id="seqNoList" name="seqNoList" data-th-value="${entity?.seqNoList}"> -->
			<input type="hidden" id="seqNo" name="seqNo" data-th-value="${entity?.seqNo}">
			<input type="hidden" id="pageDataStatus" name="pageDataStatus" data-th-value="${entity?.pageDataStatus}">
			<input type="hidden" id="workflowId" name="workflowId" data-th-value="${entity?.workflowId}">
			<div class="layui-form-item">
				<div class="form-inline-wrap">
					<label class="layui-form-label form-lable"
						data-th-text="#{PtlSubFundsMange002.totleTradeId}">交易编号</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="totleTradeId" name="totleTradeId"
							class="layui-input form-input"
							data-th-value="${entity?.totleTradeId}" disabled />
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-lable"
						data-th-text="#{PtlSubFundsMange002.finprodId}">产品代码</label>
					<div class="layui-input-inline input-inline">
						<input id="finprodId" name="finprodId"
							class="layui-input form-input"
							data-th-value="${entity?.finprodId}" disabled
							data-th-initValue="${entity?.finprodId}"><!-- 展示金融市场代码 -->
						</input>
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-lable"
						data-th-text="#{PtlSubFundsMange002.finprodName}">产品名称</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="finprodName" name="finprodName"
							class="layui-input form-input"
							data-th-value="${entity?.finprodName}" disabled />
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="form-inline-wrap">
					<label class="layui-form-label form-lable"
						data-th-text="#{PtlSubFundsMange002.tradeDate}">交易日</label>
					<div class="layui-input-inline input-inline">
						<input id="tradeDate" name="tradeDate"
							class="layui-input form-input input-dateSelect"
							data-th-value="${entity?.tradeDateStr}" disabled>
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-lable"
						data-th-text="#{PtlSubFundsMange002.ccy}">币种</label>
					<div class="layui-input-inline input-inline">
						<input id="ccy" name="ccy" class="layui-input form-input"
							data-th-value="${entity?.ccy}" disabled>
					</div>
				</div>
				<div class="form-inline-wrap">
					<label class="layui-form-label form-lable"
						data-th-text="#{PtlSubFundsMange002.tradeAmt}">交易金额</label>
					<div class="layui-input-inline input-inline">
						<input name="tradeAmt" id="tradeAmt"
							class="layui-input form-input text-number"
							data-th-value="${entity?.tradeAmt}" disabled>
						</input>
					</div>
				</div>
			</div>
			<!-- 表格 -->
			<div id="div_dataTable">
				<table class="layui-table" id="dataTable"></table>
			</div>
			<!-- 备注 -->
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="title-des"><label data-th-text="#{PtlSubFundsMange002.remark}">备注</label></span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                <textarea id="remark" name="remark" placeholder="请输入内容"
                                          maxlength="300" data-th-placeholder="#{SysCommon.placeholder}" 
                                          class="layui-textarea" data-th-text="${entity?.remark}"></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
		</form>
		<div class="layui-col-md10" style="margin: 30px 0;">
			<div class="text-center">
				<a id="PtlSubFundsMange002_btn_save"
					class="layui-btn layui-btn-sm btn-submit"
					data-th-text="#{SysCommon.save}">保存</a> 
				<a id="PtlSubFundsMange002_btn_submit"
					class="layui-btn layui-btn-sm btn-submit"
					data-th-text="#{SysCommon.submit}">提交</a> 
				<a id="PtlInvPortfolioStrategy002_btn_cancel"
					class="layui-btn layui-btn-sm btn-cancel"
					data-th-text="#{SysCommon.cancel}">取消</a>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
	    <script data-th-inline="javascript" type="text/javascript">
			var portfolioDetailTable = /*[[${portfolioDetailTable}]]*/'';
		</script>
		<script
			data-th-src="@{/js/invest/portfolio/ptlsubfundsmange/PtlSubFundsMange002.js}"
			type="text/javascript"></script>
	</div>
</body>

</html>
