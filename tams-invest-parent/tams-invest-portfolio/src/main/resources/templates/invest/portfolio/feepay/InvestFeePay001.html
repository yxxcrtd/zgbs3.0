<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{InvestFeePay001}">投资端费用支付查询</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="form-button-area">
				<a id="InvestFeePay001_btn_add" class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a>
				<a id="InvestFeePay001_btn_revoke" class="layui-btn layui-btn-sm" data-th-text="#{InvestFeePay001.revoke}">撤销</a>
				<a id="InvestFeePay001_btn_confirm" class="layui-btn layui-btn-sm" data-th-text="#{InvestFeePay001.confirm}">确认</a>
			</div>
			<div
				class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" data-th-text="#{InvestFeePay001.secAcctId}">证券账户</label>
							<div class="layui-input-inline input-inline">
								<select  type="text" id="secAcctId" name="secAcctId" class="layui-input form-input input-select"
										 placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
										 data-th-data-url="@{/invest/portfolio/feepay/InvestFeePay001/getSecAcctIdS}"
										 multiple=”true” allowClear="true" >
								</select>
								<!--<input  type="text" id="secAcctId" name="secAcctId" class="layui-input form-input input-lenovoselect" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
		                       		data-th-data-url="@{/invest/portfolio/feepay/InvestFeePay001/getSecAcctId}"
		                      		data-idfield="code" data-keyfield="name" data-th-data-effectivefieldsalias='|{"code":"#{InvestFeePay001.secAcctCode}","shortName":"#{InvestFeePay001.secAcctName}"}|'>-->
							</div>
						</div>
						<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" data-th-text="#{InvestFeePay001.feeType}">费用类型</label>
							<div class="layui-input-inline input-inline">
								<select formatoption="true" type="text"
										name="feeType"
										class="layui-input form-input input-select"
										data-th-data-result='${INVEST_FEE_TYPE}'
										allowClear="true"
										placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}">
								</select>
							</div>
						</div>
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" data-th-text="#{InvestFeePay001.payDate}">支付日</label>
							<div class="layui-input-inline input-inline">
								<input id="InvestFeePay001_paydate" name='paydate'
									class="layui-input form-input input-dateRangeSelect"
									placeholder="请选择时间区间"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-value = '${quaryDate}'>
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" data-th-text="#{InvestFeePay001.effectStatus}">有效状态</label>
							<div class="layui-input-inline input-inline">
								<select name="status"
									class="layui-input form-input input-select"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result="${STATUS_VALID}">
								</select>
							</div>
						</div>					
					</div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var REM_TYPE = [[${remType}]];
        </script>
		<script data-th-src="@{/js/invest/portfolio/feepay/InvestFeePay001.js}" type="text/javascript"></script>
		<script data-th-src="@{/js/invest/product/productelement/common/FinProductCommon.js}" type="text/javascript"></script>
		<script data-th-inline="javascript" type="text/javascript">
		
		</script>
	</div>
</body>
</html>
