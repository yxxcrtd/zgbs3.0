<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{TrdPbRelation001}">PB编号管理</title>
</head>
<body>
    <div layout:fragment="content">
        <div class='layui-fluid'>
            <div class="layui-col-md12 form-button-area" style="margin: 10px;">
                <a id="TrdPbRelation001_btn_add" class="layui-btn layui-btn-sm btn-create"
                    data-th-text="#{SysCommon.create}">新建</a>
            </div>
            <div class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
                <form class="layui-form" id="searchForm">
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable"
                                data-th-text="#{TrdPbRelation001.prdId}">产品代码</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="prdId" name="prdId"
                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}" multiple="true"
                                    data-th-data-url="@{/invest/product/durdeal/FinProductDurDeal001/queryProdIdInfo}">
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                            <label class="layui-form-label form-lable" data-th-text="#{TrdPbRelation001.portfolioId}">子组合代码</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="portfolioId" name="portfolioId" class="layui-input form-input input-select"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" allowClear="true"
                                    multiple="true" formatoption="true" 
                                    data-th-data-url="@{/invest/portfolio/ptlsubfundsmange/PtlSubFundsMange001/getSubPortfolioId}"></select>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/invest/portfolio/trdpbrelation/TrdPbRelation001.js}"></script>
    </div>
</body>
</html>
