<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PtlAnalyzeAfterInvest003}">触发统计</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area" filter="false"></div>
        <div class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
            <form class="layui-form" id="searchForm">
				<div class="layui-form-item">
                    <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{PtlAnalyzeAfterInvest003.dateRange}">日期范围</label>
                        <div class="layui-input-inline input-inline">
                            <input id='dateRange' name='dateRange'
                                class="layui-input form-input input-dateRangeSelect" placeholder="请选择、支持区间"
                                data-th-placeholder="#{SysCommon.dateInterval}">
                        </div>
                    </div>
				</div>
			</form>
		</div>
		<div>
			<div class="layui-form-item">
	            <div class="layui-inline layui-col-md3  layui-col-sm3 layui-col-lg3 layui-col-xs3">
	                <label class="layui-form-label form-lable" data-th-text="#{PtlAnalyzeAfterInvest003.closeTime}">触发平仓次数</label>
	                <label class="layui-form-label form-lable" id="closeTime"></label>
	            </div>
	            <div class="layui-inline layui-col-md3  layui-col-sm3 layui-col-lg3 layui-col-xs3">
	                <label class="layui-form-label form-lable" data-th-text="#{PtlAnalyzeAfterInvest003.warningTime}">触发预警次数</label>
	                <label class="layui-form-label form-lable" id="warningTime"></label>
	            </div>
			</div>
			<table class="layui-table" id="dataTable"></table>
		</div>
	    <div class="pro-module-block">
	        <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
	            <div class="text-center">
	                <a id="PtlAnalyzeAfterInvest003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.close}">关闭</a>
	            </div>
	        </div>
	    </div>
	</div>
	<div layout:fragment="script">
    	<script data-th-inline="javascript" type="text/javascript">
	   		var CATEGORYDATA = /*[[${categoryData}]]*/;
	   		var VALUES = /*[[${values}]]*/;
       		var WARNINGLINE = /*[[${warningLine}]]*/;
       		var CLOSELINE = /*[[${closeLine}]]*/;
    	</script>
		<script data-th-src="@{/js/invest/portfolio/ptlanalyzeafterinvest/PtlAnalyzeAfterInvest003.js}"></script>
	</div>
</body>
</html>
