<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PtlCashFlow001}">单一资产持仓分析</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area"></div>
        <div class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <!-- <input type="text" id="finprodId" name="finprodId"
                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/business/common/CommonSelect/getAssetIdBond}" data-idfield="code"
                                data-keyfield="hidCode"
                                data-th-data-effectivefieldsalias='|{"code":"#{TrdBondInvestTrade001.finprodId}","shortName":"#{TrdBondInvestTrade001.finprodName}"}|'
                                data-th-value="${entity?.finprodMarketId}" multiple> -->
                                <select type="text" id="finprodId" name="finprodId"
                                        class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                        data-th-data-url="@{/invest/portfolio/ptlsingleassetpositionanalysis/PtlSingleAssetPositionAnalysis001/getFinprodMarketId}"
                                        allowClear="true" formatoption="true" multiple>
                                </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable">查询日期</label>
                        <div class="layui-input-inline input-inline">
                            <input required id="searchDate" name="searchDate"
                                   class="layui-input form-input input-dateSelect"
                                   th:value="${sysDate}"/>
                            <!--<input id="searchDate" name="searchDate"
                                class="layui-input form-input input-dateRangeSelect" placeholder="请选择、支持区间"
                                data-th-placeholder="#{SysCommon.dateInterval}">-->
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable">是否穿透</label>
                        <div class="layui-input-inline input-inline input-radio-inline">
                            <input type="radio" name="sex" value="01" title="不穿透" checked="">
                            <input type="radio" name="sex" value="02" title="穿透">
                        </div>
                    </div>
                </div>
               <!-- <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable">是否穿透</label>
                        <div class="layui-input-inline input-inline input-radio-inline">
                            <input type="radio" name="sex" value="01" title="不穿透" checked="">
                            <input type="radio" name="sex" value="02" title="穿透">
                        </div>
                    </div>
                </div>-->
            </form>
        </div>
        <!-- <div class="ptl-table1">
				<table class="layui-table" id="dataTable1"></table>
			</div> -->
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
	    <style>
		.input-radio-inline .layui-form-radio {
			margin: 0;
		}
		
		.input-radio-inline .layui-form-radio .layui-icon {
			color: #6d9ed9;
			font-size: 18px;
		}
		
		.ptl-table .layui-table-view {
			height: 500px !important;
		}
		
		.ptl-table .layui-table-view .layui-table-box .layui-table-body {
			height: 417px !important;
		}
		</style>
        <script data-th-src="@{/js/invest/portfolio/ptlsingleassetpositionanalysis/PtlSingleAssetPositionAnalysis001.js}"></script>

        <script th:inline="javascript" type="text/javascript">
            var AUTHORITY_TYPE = /*[[${AUTHORITY_TYPE}]]*/'';
        </script>
    </div>
</body>
</html>
