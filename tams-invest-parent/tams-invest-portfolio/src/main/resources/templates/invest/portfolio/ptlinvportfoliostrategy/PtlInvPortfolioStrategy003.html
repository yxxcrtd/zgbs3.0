<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PtlInvPortfolioStrategy003}">投资组合策略管理新建</title>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap" id="submitForm">
			<input id="indexId" name="indexId" data-th-value="${indexId}"
				type="hidden" />
			<div class="layui-form-item">
				<div class="form-inline-wrap">
					<label class="layui-form-label form-lable"
						data-th-text="#{PtlInvPortfolioStrategy001.incomeType}">收益目标类型</label>
					<div class="layui-input-inline input-inline">
						<select name="incomeType" id="incomeType"
							class="layui-input form-input input-select"
							data-th-initValue='${entity?.incomeType}'
							data-th-data-result="${EVAL_INCOME_TYPE}" required>
						</select>
					</div>
				</div>
				
				<div class="form-inline-wrap" id="div_spreadRate"style="display: none">
					<label class="layui-form-label form-lable"
						data-th-text="#{PtlInvPortfolioStrategy001.spreadRate}">利差</label>
					<div class="layui-input-inline input-inline">
						<input type="text" data-fixtype="2" unit="1"
							data-th-data-textrange="2"
							class="layui-input form-input text-number" id="spreadRate"
							name="spreadRate" data-th-value="${entity?.spreadRate}" required/>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="form-inline-wrap" id="div_incomeTarget"
					style="display: none">
					<label class="layui-form-label form-lable"
						data-th-text="#{PtlInvPortfolioStrategy001.incomeTarget}">收益目标%</label>
					<div class="layui-input-inline input-inline">
						<input type="text" data-fixtype="2" unit="1"
							data-th-data-textrange="2"
							class="layui-input form-input text-number" id="incomeTarget"
							name="incomeTarget" data-th-value="${entity?.incomeTarget}" />
					</div>
				</div>
				<div class="form-inline-wrap" id="div_minIncomeTarget"
					style="display: none">
					<label class="layui-form-label form-lable"
						data-th-text="#{PtlInvPortfolioStrategy001.minIncomeTarget}">最低收益目标%</label>
					<div class="layui-input-inline input-inline">
						<input type="text" data-fixtype="2" unit="1"
							data-th-data-textrange="2"
							class="layui-input form-input text-number" id="minIncomeTarget"
							name="minIncomeTarget" data-th-value="${entity?.minIncomeTarget}" />
					</div>
				</div>
				<div class="form-inline-wrap" id="div_maxIncomeTarget"
					style="display: none">
					<label class="layui-form-label form-lable"
						data-th-text="#{PtlInvPortfolioStrategy001.maxIncomeTarget}">最高收益目标%</label>
					<div class="layui-input-inline input-inline">
						<input type="text" data-fixtype="2" unit="1"
							data-th-data-textrange="2"
							class="layui-input form-input text-number" id="maxIncomeTarget"
							name="maxIncomeTarget" data-th-value="${entity?.maxIncomeTarget}" />
					</div>
				</div>
			</div>
			<div id="div_dataTable" style="display: none">
				<table class="layui-table" id="dataTable"></table>
			</div>
		</form>
		<div class="layui-col-md10" style="margin: 30px 0;">
			<div class="text-center">
				<a id="PtlInvPortfolioStrategy003_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a> 
				<a id="PtlInvPortfolioStrategy003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var SECRATE_DATA = /*[[${SECRATE_DATA}]]*/'';
			var floatList = /*[[${floatList}]]*/'';
		</script>
		<script
			data-th-src="@{/js/invest/portfolio/ptlinvportfoliostrategy/PtlInvPortfolioStrategy003.js}"
			type="text/javascript">
			
		</script>
	</div>

</body>

</html>
