<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
    layout:decorate="~{layout/default}">
<head>
<title>可选资产</title>
</head>
<body>
    <div layout:fragment="content" id="PtlMockTest003_DIV">
        <div class="form-button-area"></div>
        <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
            <form class="layui-form" id="submitForm">
                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{PtlMockTest002.portfolioId}">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="portfolioId" name="portfolioId" allowClear="true"
                                class="layui-input form-input input-select"
                                data-th-data-url="@{/invest/portfolio/ptlmock/PtlMockTest002/getPtlInfo}"
                                formatoption=true placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap">组合到期日</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="mdatep" name="mdatep"
                                class="layui-input form-input input-dateRangeSelect"
                                data-th-value="|${mdatepStr} - ${mdatepEnd}|">
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap" data-th-text="#{PtlMockTest002.portfolioType}">组合类型</label>
                        <div class="layui-input-inline input-inline">
                            <select id="profitType" name="profitType" class="layui-input form-input input-select"
                                data-th-data-result='${PROFIT_TYPE}' data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-initvalue="${entity?.profitType}">
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap">资产类型</label>
                        <div class="layui-input-inline input-inline">
                            <select id="type8" name="type8" class="layui-input form-input input-select"
                                data-th-data-result='${PINAN_ASSET_TYPE}' data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-initvalue="${entity?.type8}">
                            </select>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="finprodId" name="finprodId" allowClear="true"
                                class="layui-input form-input input-select" maxLength="32"
                                data-th-data-url="@{/invest/portfolio/ptlmock/PtlMockTest003/getFinprodId}"
                                parentIds="type8"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-label-wrap">资产到期日</label>
                        <div class="layui-input-inline input-inline">
                            <input id="mdate" name="mdate" class="layui-input form-input input-dateRangeSelect"
                                data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'>
                        </div>
                    </div>
                </div>
                <div>
                    <table class="layui-table" id="dataTable"></table>
                </div>
            </form>
        </div>
        <div class="row text-center" style="margin: 20px 0;">
            <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit">确定</a>
            <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel"
                data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
            var selectedFinprodId = /*[[${selectedFinprodId}]]*/'';
    </script>
        <script th:src="@{/js/invest/portfolio/ptlmock/PtlMockTest003.js}" type="text/javascript"></script>
    </div>
</body>
</html>
