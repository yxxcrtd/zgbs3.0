<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PtlActivityPeriod002}">活期结息新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <div class="pro-module-wrapper pro-module-base">
             	<form id="basicInfoForm" class="layui-form joyin-form-wrap pro-module-form">
             			<input type="hidden" id="acctNo" name="acctNo" class="layui-input form-input" th:value="${entity?.acctNo}">
             			<input type="hidden" id="acctName" name="acctName" class="layui-input form-input" th:value="${entity?.acctName}">
	                	<div class="pro-module-wrap">
	                    	<div class="pro-module">
	                        	<h3 class="pro-module-title"><span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
	                        	<div class="pro-module-item">
	                                <div class="layui-form-item">
	                                	<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												data-th-text="#{PtlActivityPeriod001.busiNo}">业务编号</label>
											<div class="layui-input-inline input-inline">
												<input type="text" id="busiNo" name="busiNo" class="layui-input form-input" placeholder="请输入内容" 
	                      							data-th-placeholder="#{SysCommon.placeholder}" th:value="${entity?.busiNo}" disabled="true">
											</div>
										</div>
										
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap" data-th-text="#{PtlActivityPeriod001.bankDep}">开户机构</label>
											<div class="layui-input-inline input-inline">
												<select type="text" id="bankDep" name="bankDep" data-th-initValue="${entity?.bankDep}"  formatoption="false"
												class="layui-input form-input input-select" placeholder="请选择" data-th-data-url="@{/invest/portfolio/ptlactivityperiod/PtlActivityPeriod002/getBankDep}"
												childrenIds = "busiAcctNo" 
												>
												</select>
											</div>
										</div>
										
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap" data-th-text="#{PtlActivityPeriod001.acctNo1}">活期账号</label>
											<div class="layui-input-inline input-inline">
												<select type="text" id="busiAcctNo" name="busiAcctNo" required data-th-initValue="${entity?.busiAcctNo}" 
												class="layui-input form-input input-select" placeholder="请选择" data-th-data-url="@{/invest/portfolio/ptlactivityperiod/PtlActivityPeriod001/getBusiAcctNo}"
												parentIds = "bankDep" multiple="true"
												>
												</select>
											</div>
										</div>
	
	                                </div>
	                                <div class="layui-form-item">
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap" data-th-text="#{PtlActivityPeriod001.mdate}">本次收息日</label>
											<div class="layui-input-inline input-inline">
												<input id="mdate" name="mdate" required th:value='${#dates.format(entity?.mdate != null?entity?.mdate:platDate,"yyyy-MM-dd")}' class="layui-input form-input input-dateSelect" placeholder="请输入日期">
											</div>
										</div>
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap" data-th-text="#{PtlActivityPeriod001.settleDate}">支付日</label>
											<div class="layui-input-inline input-inline">
												<input id="settleDate" name="settleDate" required th:value='${#dates.format(entity?.settleDate,"yyyy-MM-dd")}' class="layui-input form-input input-dateSelect" placeholder="请输入日期">
											</div>
										</div>
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap" data-th-text="#{PtlActivityPeriod001.tradeAmts}">划款金额</label>
											<div class="layui-input-inline input-inline">
												<input id="tradeAmt" name="tradeAmt" required th:value="${entity?.tradeAmt}" class="layui-input form-input text-money" placeholder="元"
												disabled="true">
											</div>
										</div>
	                                </div>
	                            
	                        </div>
	                    </div>
	                </div>
	                <div class="pro-module-wrap">
	                	<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">明细信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="table-wrap" >
									<div>
										<table class="layui-table" id="detailsListTable"></table>
									</div>
								</div>
							</div>
						</div>
	                </div>
            <!-- 划款账户信息组件   -->
            <!-- 划款指令-->
				<!-- <div id="BussTrdTransferOrder" class="page-component" th:data-path="@{/component/trade/BussTrdTransferOrder/init}" th:data-params="|{entity: '${stlPayOrdersList}',entityName:'bussTrdTransferOrder',bizCode:'${tradeId}'}|"></div> -->
					<div class="pro-module-wrap" th:id="bussTrdTransferOrder_div">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des" data-th-text="划款信息">划款信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="table-wrap" >
									<a id="bussTrdTransferOrder_btn_generate" class="layui-btn layui-btn-sm">生成指令</a>
									<div class ="BussTrdTransferOrderTable">
										<table class="layui-table" id="BussTrdTransferOrderTable"></table>
									</div>
								</div>
							</div>
						</div>
					</div>
				</form> 
            </div>
                <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:30px;">
                    <div class="text-center">
                        <a id="PtlActivityPeriod002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                        <a id="PtlActivityPeriod002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="PtlActivityPeriod002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </div>
    </div>
    <div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
		    var secDto = /*[[${secDto}]]*/'';
		    var funDto = /*[[${funDto}]]*/''; 
		    var StlPayOrders = /*[[${StlPayOrders}]]*/''; 
		    var YES_NO = /*[[${YES_OR_NO}]]*/'';
		    var YES_OR_NO_N  = /*[[${YES_OR_NO_N}]]*/''; 
		    
		 // 一体化对应etliu start
		    // var PAY_TYPE = /*[[${PAY_TYPE}]]*/'';
		 	var PAY_TYPE = /*[[${PA_PAY_TYPE}]]*/'';
		 // 一体化对应etliu end
		 
		    var PAY_TYPE_01 = /*[[${PAY_TYPE_01}]]*/''; 
		    var PAY_TYPE_01_NAME = /*[[${PAY_TYPE_01_NAME}]]*/''; 
		    var ASSET_SOURCE = /*[[${ASSET_SOURCE}]]*/'';
		    
	        var BUSI_TYPE_PTL03 = /*[[${BUSI_TYPE_PTL03}]]*/'';
	        var FINPROD_TYPE_F21 = /*[[${FINPROD_TYPE_F21}]]*/'';
	        var PS_T09 = /*[[${PS_T09}]]*/'';
			var workflowId = /*[[${workflowId}]]*/'';// 工作流代码
			var orderList = /*[[${entity.bussTrdTransferOrderList}]]*/'';
	</script>
       <script data-th-src="@{/js/invest/portfolio/ptlactivityperiod/PtlActivityPeriod002.js}"></script>
    </div>
</body>
</html>
