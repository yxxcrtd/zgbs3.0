<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
	<script type="text/javascript" data-th-src="@{/public/js/message}"></script>
	<title data-th-text="#{PtlFundAcctPosi001}">资金账户头寸查询</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
			
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area curr-form' >
				<form class="layui-form" id="searchForm"> 
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{PtlActivityPeriod001.portfolioId}">组合代码</label>
							<div class="layui-input-inline input-inline">
                      			<!-- <select type="text" id="portfolioId" name="portfolioId" 
                      				class="layui-input form-input input-select" 
                      				data-th-data-url="@{/invest/portfolio/ptlactivityperiod/PtlActivityPeriod001/getPortfolioId}" 
                      				formatoption = true 
                      				placeholder="请输入内容" 
                      				data-th-placeholder="#{SysCommon.placeholder}">
                      			</select> -->
                      			<select type="text" id="portfolioId" name="portfolioId"
                      				class="layui-input form-input input-select" placeholder="请输入内容"
                      				data-th-placeholder="#{SysCommon.placeholder}" multiple="true"
                      				data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?ww=false}" >
								</select>
                      				<!--data-idfield="code" data-keyfield="shortName" -->
                      				<!--data-th-data-effectivefieldsalias='|{"code":"#{PtlActivityPeriod001.portfolioId}","shortName":"#{PtlFundAcctPosi001.portfolioName}"}|'-->

							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
				                            data-th-text="#{MstCaptialAccount001.accountType}">账户类型</label>
	                        <div class="layui-input-inline input-inline">
	                        	<input type="text" id="accountType" name="accountType"
	                                class="layui-input form-input input-select" 
	                                data-th-data-result="${ACCT_TYPE}">
	                        </div>
                        </div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
				                            data-th-text="#{OperationManage001.cdate}">日期</label>
	                        <div class="layui-input-inline input-inline">
	                        	<input required type="text" id="cdate" name="cdate"
	                                class="layui-input form-input input-dateRangeSelect" th:value="${sysDate}">
	                        </div>
                        </div>
				    </div>
                    <div class="layui-form-item">
                        <!--  add by wangyang1 【吉林银行】 增加 产品经理  2019年9月29日 start -->
                        <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4" id="div_prodManager">
                            <label class="layui-form-label form-lable">产品经理</label>
                            <div class="layui-input-inline input-inline">
                             <!--    <input type="text" name="prodManager" id="prodManager"
                                    class="layui-input form-input input-lenovoselect" maxlength=60
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-url="@{/invest/product/common/getUserName}"> -->
                                 <select type="text" name="prodManager" id="prodManager"
                                    class="layui-input form-input input-select" maxlength=60
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-url="@{/invest/product/common/getUserName}">
                                </select>    
                            </div>
                        </div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{PtlFundAcctPosi001.trusteeId}">托管机构</label>
							<div class="layui-input-inline input-inline">
								<select id="trusteeId" name="trusteeId"
										class="layui-input form-input input-select"
										data-th-data-url="@{getOriginalInterestHolder}"
										allowClear="true" placeholder="请选择托管机构">
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
							<label class="layui-form-label form-lable"
								   data-th-text="#{PtlFundAcctPosi001.quota}">发生额不为0</label>
							<div class="layui-input-inline input-inline">
								<select id="quota" name="quota"
										class="layui-input form-input input-select"
										data-th-data-result="${YES_OR_NO}"
										data-th-initValue='${YES_OR_NO_YES}'
										allowClear="true" placeholder="请选择">
								</select>
							</div>
						</div>
						<!--  add by wangyang1 【吉林银行】 增加 产品经理 end -->
                    </div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var sysDate = /*[[${sysDate}]]*/'';
			var YES_OR_NO_YES = /*[[${YES_OR_NO_YES}]]*/'';
		</script>
		<script data-th-src="@{/js/invest/portfolio/ptlfundacctposi/PtlFundAcctPosi001.js}"></script>
	</div>
</body>
</html>
