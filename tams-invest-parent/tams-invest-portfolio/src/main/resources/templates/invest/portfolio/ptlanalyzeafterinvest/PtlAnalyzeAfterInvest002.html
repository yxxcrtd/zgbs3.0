<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PtlAnalyzeAfterInvest002}">押品盯市</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="pro-module-wrap">
            <div class="pro-module">
                <h3 class="pro-module-title">
                    <span class="title-des">资产与质押券信息</span>
                </h3>
            </div> 
			<div class="layui-form-item">
	            <div class="layui-inline layui-col-md3  layui-col-sm3 layui-col-lg3 layui-col-xs3">
	                <label class="layui-form-label form-lable" data-th-text="#{PtlAnalyzeAfterInvest001.finprodId}">资产名称</label>
	                <label class="layui-form-label form-lable" id="finprodId"></label>
	            </div>
	            <div class="layui-inline layui-col-md3  layui-col-sm3 layui-col-lg3 layui-col-xs3">
	                <label class="layui-form-label form-lable" data-th-text="#{PtlAnalyzeAfterInvest001.finprodName}">资产代码</label>
	                <label class="layui-form-label form-lable" id="finprodName"></label>
	            </div>
	            <div class="layui-inline layui-col-md3  layui-col-sm3 layui-col-lg3 layui-col-xs3">
	                <label class="layui-form-label form-lable" data-th-text="#{PtlAnalyzeAfterInvest001.pledgeStockId}">质押股票代码</label>
	                <label class="layui-form-label form-lable" id="pledgeStockId"></label>
	            </div>
	            <div class="layui-inline layui-col-md3  layui-col-sm3 layui-col-lg3 layui-col-xs3">
	                <label class="layui-form-label form-lable" data-th-text="#{PtlAnalyzeAfterInvest001.pledgeStockName}">质押股票名称</label>
	                <label class="layui-form-label form-lable" id="pledgeStockName"></label>
	            </div>
			</div>
		</div>
        <div class="pro-module-wrap">
            <div class="pro-module">
                <h3 class="pro-module-title">
                    <span class="title-des">质押行情波动图</span>
                </h3>
                <div class="ptl-table1">
                    <div id="pledgeChart" style="width: 100%;height:400px;"></div>
                </div>
            </div>
        </div>
	    <div class="pro-module-block">
	        <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
	            <div class="text-center">
	                <a id="PtlAnalyzeAfterInvest002_btn_export" class="layui-btn layui-btn-sm  btn-export" data-th-text="#{SysCommon.export}">导出</a>
	                <a id="PtlAnalyzeAfterInvest002_btn_statistics" class="layui-btn layui-btn-sm btn-create">触发统计</a>
	                <a id="PtlAnalyzeAfterInvest002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel" data-th-text="#{SysCommon.close}">关闭</a>
	            </div>
	        </div>
	    </div>
	</div>
	<div layout:fragment="script">
    	<script data-th-inline="javascript" type="text/javascript">
    		var FINPRODID = /*[[${finprodId}]]*/;
       		var FINPRODNAME = /*[[${finprodName}]]*/;
       		var PLEDGESTOCKID = /*[[${pledgeStockId}]]*/;
       		var PLEDGESTOCKNAME = /*[[${pledgeStockName}]]*/;
       		var WARNINGLINE = /*[[${warningLine}]]*/;
       		var CLOSELINE = /*[[${closeLine}]]*/;
    	</script>
		<script data-th-src="@{/js/invest/portfolio/ptlanalyzeafterinvest/PtlAnalyzeAfterInvest002.js}"></script>
	</div>
</body>
</html>
