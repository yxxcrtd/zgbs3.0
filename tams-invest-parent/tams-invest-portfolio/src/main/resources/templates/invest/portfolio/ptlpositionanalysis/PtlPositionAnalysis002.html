<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PtlPositionAnalysis002}">组合持仓分析报表</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area " id="buttonDiv">
            <a id="PtlPositionAnalysis002_btn_target" class="layui-btn layui-btn-sm " data-th-text="设置显示列"></a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
            <form class="layui-form" id="submitForm"> 
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="portfolioId" name="portfolioId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/portfolio/ptlpositionanalysis/PtlPositionAnalysis001/getPortFolioInfo}"
                                allowClear="true"
                                formatoption="true" multiple>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">收益类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="profitType" name="profitType"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" allowClear="true"
                                data-th-data-result='${PROFIT_TYPE}' formatoption="true" multiple>
                            </select>
                        </div>
                    </div>

                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">查询日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id='searchDate' name='searchDate'
                                   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-value='${platDate}' required="required">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="finprodMarketId" name="finprodMarketId"
                                    class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-url="@{/invest/portfolio/ptlsingleassetpositionanalysis/PtlSingleAssetPositionAnalysis001/getFinprodMarketId}"
                                    allowClear="true" formatoption="true" multiple>
                            </select>
                        </div>
                    </div>

                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">下钻层级</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="deepLevel" name="deepLevel"
                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}" allowClear="true"
                                    data-th-initValue='${DEEP_LEVEL_defualt}' required="required"
                                    data-th-data-result='${DEEP_LEVEL}' formatoption="true" >
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">展示方式</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="displayType" name="displayType"
                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}" allowClear="true"
                                    data-th-initValue='${DISPLAY_TYPE_defualt}' required="required"
                                    data-th-data-result='${DISPLAY_TYPE}' formatoption="true" >
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4" id="div_prodManager">
                        <label class="layui-form-label form-lable">产品经理</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" name="prodManager" id="prodManager"
                                    class="layui-input form-input input-select" maxlength=60
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-url="@{/invest/product/common/getUserName}" multiple>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">是否穿透</label>
                        <div class="layui-input-inline input-inline input-radio-inline">
                            <input type="radio" name="pass" value="01" title="不穿透" checked="" required>
                            <input type="radio" name="pass" value="02" title="穿透">
                        </div>
                    </div>

                </div>


            </form>
            <div id="dataTableDiv">
                <table id="dataTable"></table>
            </div>
        </div>

    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
            var platDate = /*[[${platDate}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/portfolio/ptlpositionanalysis/PtlPositionAnalysis002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
