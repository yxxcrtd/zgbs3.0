<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{TrdDepositInvestTrade001}">存款类资产</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area"></div>
        <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
            <form class="layui-form" id="submitForm"> 
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="portfolioId" name="portfolioId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/portfolio/ptlpositionanalysis/PtlPositionAnalysis001/getPortFolioInfo}"
                                allowClear="true"
                                formatoption="true" multiple>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">资产类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="assetType" name="assetType"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" allowClear="true"
                                data-th-data-result='${PINAN_ASSET_TYPE}' formatoption="true" multiple>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">是否穿透</label>
                        <div class="layui-input-inline input-inline input-radio-inline">
                            <input type="radio" name="sex" value="01" title="不穿透" checked="">
                            <input type="radio" name="sex" value="02" title="穿透">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">查询日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id='searchDate' name='searchDate'
                                class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-value='${platDate}' required="required">
                        </div>
                    </div>
                    <!--  add by wangyang1 【吉林银行】 增加 产品经理  2019年9月29日 start -->
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4" id="div_prodManager">
                        <label class="layui-form-label form-lable">产品经理</label>
                        <div class="layui-input-inline input-inline">
                           <!--  <input type="text" name="prodManager" id="prodManager"
                                class="layui-input form-input input-lenovoselect" maxlength=60
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/product/common/getUserName}"> -->
                                <select type="text" name="prodManager" id="prodManager"
                                    class="layui-input form-input input-select" maxlength=60
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-url="@{/invest/product/common/getUserName}">
                                </select>       
                        </div>
                    </div>
                    <!--  add by wangyang1 【吉林银行】 增加 产品经理 end -->
                </div>
            </form>
        </div>
       <!--  <div class="ptl-table1">
            <table class="layui-table" id="dataTable1"></table>
        </div> -->
        <div style="height: 254px">
            <table id="dataTable"></table>
        </div>
        <div class="pro-module-wrap" style="margin-top: 10px;">
            <div class="pro-module">
                <h3 class="pro-module-title" style="border-top: 1px solid #ccc;">
                    <span class="title-des">资产配置汇总列表</span>
                    <i class="iconfont icon-arrow-down pro-down-icon"></i>
                </h3>
                <div class="pro-module-item pro-item-wrap" style="overflow:auto !important; height: 180px;">
                    <div class="trast-list-left">
                        <table class="layui-table" id="trastList"></table>
                    </div>
                    <div class="trast-list-right">
                        <div id="main" style="height: 180px;"></div>
                        <!--<div class="trast-list-show">
                        <div class="trast-icon-wrap"><i class="iconfont icon-listview"></i></div>
                        <div class="trast-print-wrap" style="display: none;">
                            <h3>打印图表</h3>
                            <ul>
                                <li><a href="javascript:;">下载PNG文件</a></li>
                                <li><a href="javascript:;">下载JPEG文件</a></li>
                                <li><a href="javascript:;">下载PDF文件</a></li>
                                <li><a href="javascript:;">下载SVG文件</a></li>
                            </ul>
                        </div>
                    </div>-->
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
	    <style>
		.layui-table {
			width: 100% !important;
		}
		
		.trast-list-left {
			float: left;
			width: 60%;
		}
		
		.trast-list-right {
			float: left;
			width: 40%;
			position: relative;
		}
		
		.trast-list-left .layui-table-view {
			height: 300px !important;
		}
		
		.trast-list-left .layui-table-view .layui-table-box .layui-table-body {
			height: 156px !important;
		}
		
		.trast-list-show {
			position: absolute;
			top: 10px;
			right: 15px;
		}
		
		.trast-icon-wrap {
			text-align: right;
		}
		
		.trast-icon-wrap i {
			color: #666;
			background: #d9ecff;
			font-size: 25px;
		}
		
		.trast-print-wrap {
			border: 1px solid #ddd;
		}
		
		.trast-print-wrap h3 {
			padding: 10px 0 10px 10px;
			border-bottom: 1px solid #ddd;
			color: #999;
		}
		
		.trast-print-wrap ul {
			padding: 0 10px 10px 10px;
		}
		
		.trast-print-wrap ul li {
			padding-top: 10px;
		}
		
		.trast-print-wrap ul li a {
			color: #999;
		}
		
		table thead tr th {
			background-color: #d9ecff;
		}
		
		.ptl-table .layui-table-view .layui-table-box .layui-table-header table thead tr th
			{
			padding: 1px 0;
			text-align: center;
		}
		
		.ptl-table .layui-table-view .layui-table-box .layui-table-body {
			height: 504px !important;
		}
		
		.input-radio-inline .layui-form-radio {
			margin: 0;
		}
		
		.input-radio-inline .layui-form-radio .layui-icon {
			color: #6d9ed9;
			font-size: 18px;
		}
		</style>
    <script data-th-inline="javascript" type="text/javascript">
            var platDate = /*[[${platDate}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/portfolio/ptlpositionanalysis/PtlPositionAnalysis001.js}" type="text/javascript"></script>
        <script th:inline="javascript" type="text/javascript">
            var AUTHORITY_TYPE = /*[[${AUTHORITY_TYPE}]]*/'';
        </script>
    </div>
</body>
</html>
