<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{BondPtlFeePay002}">证券组合费支付新建</title>
</head>
<body>
<div class="pro-module-wrap">
	<div layout:fragment="content">
		<div>
			<div class="pro-module-wrapper pro-module-base" style="border-top: none;">
				<form class="layui-form joyin-form-wrap pro-module-form" id="BondPtlFeePay002_Form">
					<input type="text" name="tradeId" id="BondPtlFeePay002_hidden_tradeId" th:value="${entity?.tradeId}" hidden>
					<input type="text" name="feeTypehidden" id="BondPtlFeePay002_hidden_feeType" th:value="${entity?.feeType}" hidden>
					<input type="text" name="feeName" id="BondPtlFeePay002_hidden_feeName" th:value="${entity?.feeName}" hidden>
					<input type="text" name="cashId" id="BondPtlFeePay002_hidden_cashId" th:value="${entity?.cashId}" hidden>
					<input type="text" name="confirmFlag" id="BondPtlFeePay002_hidden_operateType" th:value="${entity?.confirmFlag}" hidden>
					<input type="text" id="BondPtlFeePay002_hidden_tradeAmt" th:value="${entity?.actPayAmt != null? entity?.actPayAmt : '0'}" hidden>
					<input type="text" id="BondPtlFeePay002_positionEndDateHide" data-th-value='${entity?.endDate eq null ? platDate : #dates.format(entity?.endDate,"yyyy-MM-dd")}' hidden>
					<input type="text" name="chargeType" id="BondPtlFeePay002_hidden_chargeType" th:value="${entity?.chargeType}" hidden>
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">费用信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable" data-th-text="证券账户">证券账户</label>
										<div class="layui-input-inline input-inline">
		                      					<select type="text" id="BondPtlFeePay002_secAcctId" name="secAcctId" required
						                               class="layui-input form-input input-select" placeholder="请输入内容" 
						                              data-th-data-url="@{/cebbank/bondptlfeepay/BondPtlFeePay001/getSecAcctIdS}" 
						                                data-th-initValue="${entity?.secAcctId}">
						                          </select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="付费日期">付费日期</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="BondPtlFeePay002_payDate" name="payDate" 
												class="layui-input form-input input-dateSelect" required
												data-th-value='${entity?.payDate eq null ? platDate : #dates.format(entity?.payDate,"yyyy-MM-dd")}'>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="前一日港股持仓市值">前一日港股持仓市值</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="BondPtlFeePay002_yesterdayPosition" name="yesterdayPosition" 
												class="layui-input form-input text-number" required disabled
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-value='${entity?.yesterdayPosition}'>
											<span class="input-right-show">港元</span>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap" id='BondPtlFeePay002_div_payAmt'>
										<label class="layui-form-label form-label-wrap" data-th-text="实付金额">实付金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="BondPtlFeePay002_actPayAmtHk" name="actPayAmtHk" 
												class="layui-input form-input text-number" required
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-value='${entity?.actPayAmtHk}' >
											<span class="input-right-show">港元</span>
										</div>
									</div>
									<div class="form-inline-wrap" id='BondPtlFeePay002_div_actPayAmt'>
										<label class="layui-form-label form-label-wrap" data-th-text="实付金额">实付金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="BondPtlFeePay002_actPayAmt" name="actPayAmt" 
												class="layui-input form-input text-number" required disabled
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-value='${entity?.actPayAmt}'>
											<span class="input-right-show">元</span>
										</div>
									</div>
									<div class="form-inline-wrap">
	                                    <label class="layui-form-label form-label-wrap"
	                                           th:text="卖出结算汇兑比率">卖出结算汇兑比率</label>
	                                    <div class="layui-input-inline input-inline">
	                                        <input  type="text" id="BondPtlFeePay002_sellSettleRate" name="sellSettleRate" data-textrange='4'
	                                               class="layui-input form-input text-number" placeholder="请输入内容"
	                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.sellSettleRate}" />
	                                    </div>
	                                </div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap" id='BondPtlFeePay002_div_calculate' style="width: 120px!important; float: right;">
										<div class="layui-input-inline input-inline">
											<a id="BondPtlFeePay002_btn_calculate" class="layui-btn layui-btn-sm"
	                                           data-th-text="计算">计算</a>
										</div>
									</div>
								</div>
								<div id="fee_div">
									<table class="layui-table" id="fee_dataTable" name="feeInfoList" th:title="组合费用明细">
									</table>
								</div>
							</div>
						</div>
					</div>
					<div class="pro-module-wrap" data-th-if="${entity?.revokeReason}">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">撤销理由</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<label class="layui-form-label form-label-wrap" style="width: 11.9%;">备注</label>
									<div class="layui-input-inline input-inline" style="width: 85%!important;">
											<textarea id="revokeReason" name="revokeReason"  
													   placeholder="请输入内容"
													  class="layui-textarea" data-th-text="${entity?.revokeReason}"></textarea>
									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="pro-module-wrap" th:id="|bussTrdTransferOrder_div|">
	                    <div class="pro-module">
	                        <h3 class="pro-module-title"><span class="title-des">指令信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
	                        <div class="pro-module-item">
	                            <div class="layui-form-item">
	                                <input type="hidden" th:id="|bussTrdTransferOrder_payAcctNo|" th:name="selectValue" value="pay">
	                                <input type="hidden" th:id="|bussTrdTransferOrder_recAcctNo|" th:name="selectValue" value="rec">
	                                <a th:id="|bussTrdTransferOrder_btn_generate|" class="layui-btn layui-btn-sm" th:text="#{BussTrdTransferOrder.generate}">生成指令</a>
	                            </div>
	                            <table class="layui-table" th:id="|bussTrdTransferOrder_table|" th:name="bussTrdTransferOrder"></table>
	                        </div>
	                    </div>
	                </div>
					<!-- 划款指令 -->
<!-- 					<div class="page-component" th:data-path="@{/component/trade/BussTrdTransferOrder/init}" -->
<!-- 	                 	th:data-params="|{entityName: 'bussFinProductFeePay', pageFrom: 'submitForm', entity:'${entity_bussTrdTransferOrder}', bizCode:'${entity?.tradeId}'}|"> -->
<!-- 	            	</div> -->
					<!-- 附件信息 -->
		            <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
		                th:data-params="|{entityName: 'fileArray', businessId: '${entity?.tradeId}'}|"></div>
		            <div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">备注</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<label class="layui-form-label form-label-wrap" style="width: 11.9%;">备注</label>
									<div class="layui-input-inline input-inline" style="width: 85%!important;">
											<textarea id="remark" name="remark" placeholder="请输入内容" maxlength="300"
													  data-th-placeholder="#{SysCommon.placeholder}"
													  class="layui-textarea" data-th-text="${entity?.remark}"></textarea>
									</div>
								</div>
							</div>
						</div>
					</div>
				</form>
				</div>
				<div class="row text-center stepbar">
					<div class="text-center">
						<a id="BondPtlFeePay002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
						<a id="BondPtlFeePay002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
						<a id="BondPtlFeePay002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var feeType_settle = /*[[${feeType_settle}]]*/;
			var feeType_acctno = /*[[${feeType_acctno}]]*/;
			var feeChargetype_norule = /*[[${feeChargetype_norule}]]*/;
			var feeChargetype_prov = /*[[${feeChargetype_prov}]]*/;
			var yesFlag = /*[[${yesFlag}]]*/;
		    var YES_NO = /*[[${YES_OR_NO}]]*/'';
		    var ps = /*[[${ps}]]*/;
			var workflowId = /*[[${workflowId}]]*/;// 工作流代码
			var bussTrdTransferOrderDtos = /*[[${entity?.bussTrdTransferOrder}]]*/'';//划款指令
			function zd(){
				jyfx = $('#BondPtlFeePay002_hidden_feeType').val();
				if(jyfx != undefined && jyfx != null){
	        		zcmc = $('#BondPtlFeePay002_feeType').val();
	        		var s1 = "费用支付";
	        		var a =zcmc+s1;
	        		$("#remark").val(a);
	        	}
			}
        </script>
		<script data-th-src="@{/js/invest/portfolio/cebbank/bondptlfeepay/BondPtlFeePay002.js}" type="text/javascript"></script>
	</div>
</body>
</html>
