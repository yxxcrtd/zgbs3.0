<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PtlAccountCurrentInterest001}">账户活期利率</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				<a id="PtlAccountCurrentInterest001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
				<a id="PtlAccountCurrentInterest001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}" style="display:none;">删除</a>
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area curr-form' >
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{PtlAccountCurrentInterest001.busiAcctNo}">账户名称</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="busiAcctNo" maxlength="32" name="busiAcctNo" class="layui-input form-input input-select" placeholder="请输入内容" 
                      					data-th-placeholder="#{SysCommon.placeholder}" data-th-data-url="@{/invest/portfolio/ptlaccountcurrentinterest/PtlAccountCurrentInterest001/getBusiAcctNo}">
                      			</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" data-th-text="#{PtlAccountCurrentInterest001.effDate}">生效日</label>
							<div class="layui-input-inline input-inline">
								<input id="effDate" name="effDate" class="layui-input form-input input-dateRangeSelect" placeholder="请输入日期">
							</div>
						</div>
					</div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-src="@{/js/invest/portfolio/ptlaccountcurrentinterest/PtlAccountCurrentInterest001.js}"></script>
	</div>
</body>
</html>
