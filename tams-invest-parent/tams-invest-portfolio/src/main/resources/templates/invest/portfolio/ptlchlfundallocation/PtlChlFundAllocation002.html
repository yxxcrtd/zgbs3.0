<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{PtlChlFundtongdaoAllocation002}">通道资金划拨新建</title>
</head>
<body>
<div layout:fragment="content">
    <div>
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <input type="hidden" id="tradeId" name="tradeId" th:value="${entity?.tradeId}" />
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">基本信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item pro-item-wrap">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlChlFundAllocation001.portfolioId}">组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required id="portfolioId" name="portfolioId" class="layui-input form-input input-select baseInfo" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" childrenIds="counterAcctNo,myAcctNo" th:initvalue="${entity?.portfolioId}"
                                                data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlChlFundAllocation001.settleDate}">转账日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="settleDate" name="settleDate" class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.settleDate==null ? platDate : #dates.format(entity?.settleDate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlChlFundAllocation002.ccy}">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required class="layui-input form-input input-select baseInfo" id="ccy"
                                                name="ccy" th:data-result="${CCY}" placeholder="请输入内容" th:initValue='*{entity?.ccy?:CCY_default}'
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlChlFundAllocation001.payType}">划款类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required class="layui-input form-input input-select baseInfo" id="payType" childrenIds="counterAcctNo,myAcctNo"
                                                name="payType" th:data-result="${PS}" placeholder="请输入内容" th:initValue='*{entity?.payType}'
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="|#{invest.channelId}#{ChannelAsset002.finprodIdBak}|">通道代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required id="chlId" name="chlId" class="layui-input form-input input-select baseInfo" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" childrenIds="counterAcctNo,myAcctNo" th:initvalue="${entity?.chlId}"
                                                data-th-data-url="@{/component/trade/BussChannelCommon/getYcxhkChannelId}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlChlFundAllocation001.myAcctNos}">付款账户</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required class="layui-input form-input input-select" id="myAcctNo"
                                                name="myAcctNo" parentIds="portfolioId,payType,chlId,ccy"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" th:initValue='${entity?.myAcctNo}'
                                                data-th-data-url="@{/invest/portfolio/ptlchlfundallocation/PtlChlFundAllocation002/getMyAcctNo}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" style="display:none">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlChlFundAllocation001.busiNo}">业务编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" class="layui-input form-input" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"  id="busiNo" name="busiNo" th:value='${entity?.busiNo}'
                                               disabled="disabled">
                                    </div>
                                </div>

                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlChlFundAllocation001.myAcctAmount}">付款账户余额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="myAcctAmount" name="myAcctAmount" class="layui-input form-input text-number"
                                               disabled placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" th:value="${entity?.myAcctAmount}">
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlChlFundAllocation001.counterAcctNo}" >收款账户</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required class="layui-input form-input input-select" placeholder="请输入内容"
                                                id="counterAcctNo" name="counterAcctNo"
                                                data-th-placeholder="#{SysCommon.placeholder}" parentIds="portfolioId,payType,chlId" th:initValue='${entity?.counterAcctNo}'
                                                data-th-data-url="@{/invest/portfolio/ptlchlfundallocation/PtlChlFundAllocation002/getCounterAcctNo}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlChlFundAllocation001.counterAcctAmount}">收款账户余额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="counterAcctAmount" name="counterAcctAmount" class="layui-input form-input text-number"
                                               disabled placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" th:value="${entity?.counterAcctAmount}">
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlChlFundAllocation001.settleAmts}">划拨金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" class="layui-input form-input text-number" placeholder="请输入内容"
                                               id="settleAmt" name="settleAmt" data-textrange="2" maxLength="29" data-th-value='${entity?.settleAmt}' data-th-placeholder="#{SysCommon.placeholder}">
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <!-- 划款类型选择通道回款增加本金和收益 add by renping 20190929 start -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlChlFundAllocation001.prinAmt}">本金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" class="layui-input form-input text-number" placeholder="请输入内容"
                                               id="prinAmt" name="prinAmt" data-textrange="2" maxLength="29" data-th-value='${entity?.prinAmt}' data-th-placeholder="#{SysCommon.placeholder}">
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{PtlChlFundAllocation001.intAmt}">收益</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" class="layui-input form-input text-number" placeholder="请输入内容"
                                               id="intAmt" name="intAmt" data-textrange="2" maxLength="29" data-th-value='${entity?.intAmt}' data-th-placeholder="#{SysCommon.placeholder}">
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <!-- 划款类型选择通道回款增加本金和收益 add by renping 20190929 end -->
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 划款信息 -->
                <div id="transferInformation" class="page-component"
                     th:data-path="@{/component/trade/BussTrdTransferOrder/init}"
                     th:data-params="|{entityName: 'bussTrdTransferOrder', pageFrom: 'submitForm', entity:'${stlPayOrdersList}',bizCode:'${tradeId}'}|"></div>
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des" >备注信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item pro-item-wrap">
                            <div class="layui-form-item">
                                <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                    <textarea class="layui-textarea" id="remark" maxLength="1000" name="remark" data-th-placeholder="#{SysCommon.placeholder}"  th:text="${entity?.remark}" placeholder="请输入内容"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="text-center" align="text-center" style="margin-top:10px;">
                <a id="PtlChlFundAllocation002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                <a id="PtlChlFundAllocation002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="PtlChlFundAllocation002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var Fin_Type = /*[[${Fin_Type}]]*/'';
        var formTodoList = /*[[${formTodoList}]]*/'';
        var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
        var payTypeHK10 = /*[[${payTypeHK10}]]*/'';
        var myAcctNoInitValue = /*[[${entity?.myAcctNo}]]*/'';
        var counterAcctNoInitValue = /*[[${entity?.counterAcctNo}]]*/'';
        var GEN_PAY_ORDERS_AUTO= /*[[${GEN_PAY_ORDERS_AUTO}]]*/; // 系统参数_是否显示划款指令
    </script>
    <script data-th-src="@{/js/invest/portfolio/ptlchlfundallocation/PtlChlFundAllocation002.js}" type="text/javascript"></script>
</div>
</body>

</html>
