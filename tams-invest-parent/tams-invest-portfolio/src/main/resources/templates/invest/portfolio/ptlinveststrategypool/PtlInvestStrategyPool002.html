<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PtlInvestStrategyPool002}">投资策略池新建</title>
</head>
<body>
	<div layout:fragment="content">
		<div class="pro-module-wrapper pro-module-base" style="border-top: none;">
				<form class="layui-form joyin-form-wrap" id="submitForm">
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title" style="border-top: 1px solid #ccc;"><span class="title-des">基础信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{PtlInvestStrategyPool001.strategyId}">策略代码</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="strategyId" name="strategyId" disabled
												   class="layui-input form-input" required
												   data-th-value="${entity?.strategyId}">
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{PtlInvestStrategyPool001.strategyType}">策略类型</label>
										<div class="layui-input-inline input-inline">
											<select id="strategyType" name="strategyType" 
                                            		class="layui-input form-input input-select" 
                                            		data-th-data-result='${STRATEGY_TYPE}'
                                            		placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" 
                                            		formatoption = "true" 
                                            		required data-th-initvalue="${entity?.strategyType}">
                                            </select>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">策略明细列表</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<table class="layui-table" id="dataTable"></table>
							</div>
						</div>
					</div>
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">策略其他信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{PtlInvestStrategyPool001.strategyName}">策略名称</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="strategyName" name="strategyName"
												   class="layui-input form-input" required
												   data-th-value="${entity?.strategyName}">
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{PtlInvestStrategyPool002.strategyDesc}">策略描述</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="strategyDesc" name="strategyDesc"
												   class="layui-input form-input" required
												   data-th-value="${entity?.strategyDesc}">
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{PtlInvestStrategyPool002.evalIndex}">策略指标</label>
										<div class="layui-input-inline input-inline">
											<select id="evalIndex" name="evalIndex" 
                                            		class="layui-input form-input input-select" 
                                            		data-th-data-result='${EVAL_INDEX}' multiple=true
                                            		placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" 
                                            		data-th-initvalue="${entity?.evalIndex}">
                                            </select>
										</div>
									</div>
								</div>
								<div class="layui-form-item space">
									<div class = "form-inline-wrap" style="width:100%">
										<label class="layui-form-label form-lable" style="width: 12%;">备注</label>
										<div class="layui-input-inline input-inline" style="width:87%">
											<textarea id="remark" name="remark" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
											    class="layui-textarea" data-th-text="${entity?.remark}">
											</textarea>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</form>
				<div class="layui-col-md11" style="margin:20px 0;">
					<div class="text-center">
						<a id="PtlInvestStrategyPool002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
						<a id="PtlInvestStrategyPool002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
						<a id="PtlInvestStrategyPool002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
					</div>
				</div>
			</div>	
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
		    var CUSTOM_ASSET_TYPE_TWO = /*[[${CUSTOM_ASSET_TYPE_TWO}]]*/'';
		    var CUSTOM_ASSET_TYPE_THREE = /*[[${CUSTOM_ASSET_TYPE_THREE}]]*/'';
		    var CUSTOM_ASSET_TYPE_FOUR = /*[[${CUSTOM_ASSET_TYPE_FOUR}]]*/'';
		    var CUSTOM_ASSET_TYPE_FIVE = /*[[${CUSTOM_ASSET_TYPE_FIVE}]]*/'';
	        var workflowId = /*[[${workflowId}]]*/'';
		</script>
		<script data-th-src="@{/js/invest/portfolio/ptlinveststrategypool/PtlInvestStrategyPool002.js}"></script>
		<script data-th-src="@{/js/component/common/util.js}"></script>
	</div>
</body>
</html>
