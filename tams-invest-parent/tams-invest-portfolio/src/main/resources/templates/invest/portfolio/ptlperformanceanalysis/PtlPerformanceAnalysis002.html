<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title>指标设置</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="repo-trade-wrap">
            <div class="repo-trade-left">
                <h3 class="repo-trade-title">
                        <span class="title-des"
                              >可选指标</span>
                </h3>
                <div  style="border: 1px solid #fff; overflow:auto; height: 400px;" data-checkable="false" id="tree" data-th-url='|@{/invest/portfolio/ptlperformanceanalysis/PtlPerformanceAnalysis002/getAllTreeNode}'></div>
            </div>
            <div class="repo-trade-middle">
                <a class="trade-btn-wrap trade-add-btn" th:id="btn_add" href="javascript:;">
                    <i class="iconfont icon-batch-down"></i>
                    <span >加入</span>
                </a>
                <a class="trade-btn-wrap trade-romove-btn" th:id="btn_remove" href="javascript:;">
                    <i class="iconfont icon-batch-upturn"></i>
                    <span >移除</span>
                </a>
            </div>
            <div class="repo-trade-right">
                <h3 class="repo-trade-title">
                        <span class="title-des"
                              >显示指标</span>
                </h3>
             <div id="targetDiv"></div>
            </div>
        </div>
        <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:30px;">
            <div class="text-center">
                <a class="layui-btn layui-btn-sm btn-save" th:id="save" data-th-text="#{SysCommon.save}">保存</a>
                <a class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>

    </div>
    <div layout:fragment="script">
        <style>
            .repo-trade-wrap {
                overflow: hidden;
            }

            .repo-trade-left, .repo-trade-right {
                width: 45%;
                float: left;
            }

            .repo-trade-middle {
                width: 10%;
                float: left;
                margin-top: 90px;
            }

            .trade-btn-wrap {
                display: block;
                text-align: center;
                margin: 0 12px;
                color: #0b72f1;
                padding: 5px 0;
                background: #f5f5f5;
                border: 1px solid #dddddd;
            }

            .trade-btn-wrap:hover {
                color: #0b72f1;
            }

            .trade-btn-wrap i {
                display: block;
            }

            .trade-romove-btn {
                margin-top: 15px;
            }

            .repo-trade-title {
                padding: 5px 0;
            }
        </style>
        <script data-th-inline="javascript" type="text/javascript">
            var platDate = /*[[${platDate}]]*/'';
        </script>
        <script data-th-src="@{/js/invest/portfolio/ptlperformanceanalysis/PtlPerformanceAnalysis002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
