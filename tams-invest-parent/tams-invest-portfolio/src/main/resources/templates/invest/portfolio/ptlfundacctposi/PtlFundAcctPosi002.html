<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PtlActivityPeriod001}">活期结息</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
			
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area curr-form' >
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable">类型</label>
	                        <div class="layui-input-inline input-inline">
	                        	<input type="text" id="busiType" name="busiType"
									   th:data-result="${FINPROD_TYPE_TG}"
	                                class="layui-input form-input input-select" placeholder="请输入内容"
	                               data-th-data-result="${FINPROD_TYPE_TG}"
	                                data-th-placeholder="#{SysCommon.placeholder}">    
	                        </div>
                        </div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable">交易方向</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="ps" name="ps"
									   th:data-result="${PS}"
									   class="layui-input form-input input-select" placeholder="请输入内容"
									   data-th-data-result="${PS}"
									   data-th-placeholder="#{SysCommon.placeholder}">
							</div>
						</div>
					</div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
		<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:30px;">
             <div class="text-center">
                 <a id="PtlActivityPeriod002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
             </div>
         </div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
            var PORTFOLIO_ID = /*[[${PORTFOLIO_ID}]]*/'';
            var HODING_TYPE = /*[[${HODING_TYPE}]]*/'';
            var ACCT_ID = /*[[${ACCT_ID}]]*/'';
            var CCY = /*[[${CCY}]]*/'';
            var CDATE = /*[[${CDATE}]]*/'';
        </script>
		<script data-th-src="@{/js/invest/portfolio/ptlfundacctposi/PtlFundAcctPosi002.js}"></script>
	</div>
</body>
</html>
