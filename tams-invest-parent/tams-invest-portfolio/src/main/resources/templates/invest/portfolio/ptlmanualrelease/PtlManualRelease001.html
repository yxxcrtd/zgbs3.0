<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title>手动释放头寸</title>
</head>
<body>
    <div layout:fragment="content" >
        
       <div>
            <div class="layui-tab layui-tab-brief" lay-filter=docDemoTabBrief>
                <ul class="layui-tab-title">
                    <li id="RS-title" class="layui-this">质押式正回购</li>
                    <li id="Rb-title">质押式逆回购</li>
                </ul>
                <div class="layui-tab-content">
                    <div class="layui-tab-item layui-show">
                       <div class="layui-col-md12 " >
						<!-- <a id="PtlManualRelease001_btn_add"
								class="layui-btn layui-btn-sm btn-create"
								data-th-text="#{SysCommon.create}">新建</a>  -->
								<a id="PtlManualRelease001_Rs_filter" class="layui-btn layui-btn-sm btn-filter" ><i class="iconfont icon-filter"></i>筛选</a>
						       <a id="PtlManualRelease001_Rs_revoke" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i>手动释放</a>
						        
						</div>
                        <div class='joyin-form-wrap  curr-form layui-col-md12'  id="div_typeRSForm"  style="background-color: #f5f5f5;" >
                            <form class="layui-form layui-col-md11" id="typeRSForm">
                                <div class="layui-form-item" >
									<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											data-th-text="#{PtlManualRelease001.tradeDate}">交易日期</label>
										<div class="layui-input-inline input-inline">
			                                 <input type="text" id="tradeDateRs" name="tradeDateRs"
												class="layui-input form-input input-dateRangeSelect"
												placeholder="请选择时间区间"
												data-th-placeholder="#{SysCommon.placeholder}" />										
												</div>
									</div>

									<div  class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											data-th-text="#{PtlManualRelease001.counterId}">交易对手</label>
										<div class="layui-input-inline input-inline">
											<input  type="text" id="counterIdRs" name="counterIdRs" class="layui-input form-input input-lenovoselect" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" 
							                       data-th-data-url="@{/invest/portfolio/ptlmanualrelease/PtlManualRelease001/getCounterId}" 
							                      data-idfield="code" data-keyfield="name" data-th-data-effectivefieldsalias='|{"code":"#{PtlManualRelease001.counterId}","shortName":"#{PtlManualRelease001.counterName}"}|'>																													
										</div>
									</div>
									
									<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											data-th-text="#{PtlManualRelease001.tradeMarket}">交易场所</label>
										<div class="layui-input-inline input-inline">
				                                   <select type="text" id="tradeMarketRs" name="tradeMarketRs"
				                                   class="layui-input form-input input-select"
				                                   data-th-data-result='${TRADE_PLACE}' allowClear="true" placeholder="请输入内容"
				                                   data-th-placeholder="#{SysCommon.placeholder}"
				                                    formatoption=true data-th-initValue="${entity?.tradeMarket}"></select>										
				                         </div>
									</div>									
					           </div>
                               <div class="layui-form-item">
									<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											data-th-text="#{PtlManualRelease001.portfolioId}">组合代码</label>
										<div class="layui-input-inline input-inline">		
											<input  type="text" id="portfolioIdRs" name="portfolioIdRs" class="layui-input form-input input-lenovoselect" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" 
							                       data-th-data-url="@{/invest/portfolio/ptlmanualrelease/PtlManualRelease001/getPortfolioId}" 
							                      data-idfield="code" data-keyfield="name" data-th-data-effectivefieldsalias='|{"code":"#{PtlManualRelease001.portfolioId}","shortName":"#{PtlManualRelease001.portfolioName}"}|'>															
										</div>
									</div>
									<div  class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											data-th-text="#{PtlManualRelease001.releaseStatus}">有效状态</label>
										<div class="layui-input-inline input-inline">
				                            <select id="releaseStatusRs" name="releaseStatusRs" th:data-result="${RELEASE_STATUS}" class="layui-input form-input input-select" data-th-placeholder="#{SysCommon.placeholder}">
				                            </select>
										</div>
									</div>
									<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											data-th-text="#{PtlManualRelease001.finprodId}">债券代码</label>
										<div class="layui-input-inline input-inline">
						                      <input type="text" id="secIdRs"  name="secIdRs" class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
						                      data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-url="@{/invest/asset/common/getAssetId(finprodType2=${FINPROD_TYPE_TG_F01})}"
						                      data-idfield="code" data-keyfield="code"
						                      data-th-data-effectivefieldsalias='|{"shortName":"#{PtlManualRelease001.secName}","code":"#{PtlManualRelease001.secId}"}|'>
 
										</div>
									</div>
								
					           </div>   
					           <div class="layui-form-item">
									<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											data-th-text="#{PtlManualRelease001.registOrg}">登记托管机构</label>
										<div class="layui-input-inline input-inline">
				                                   <select type="text" id="registOrgRs" name="registOrgRs"
				                                   class="layui-input form-input input-select"
				                                   data-th-data-result='${REGIST_ORG}' allowClear="true" placeholder="请输入内容"
				                                   data-th-placeholder="#{SysCommon.placeholder}"
				                                    formatoption=true data-th-initValue="${entity?.registOrg}"></select>										
				                         </div>
									</div>
									<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											data-th-text="#{PtlManualRelease001.truAcct}">证券托管户</label>
					                    <div class="layui-input-inline input-inline">										
							                	<input  type="text" id="acctIdRs" name="acctIdRs" class="layui-input form-input input-lenovoselect" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" 
							                       data-th-data-url="@{/invest/portfolio/ptlmanualrelease/PtlManualRelease001/getSecAcctId}" 
							                      data-idfield="code" data-keyfield="name" data-th-data-effectivefieldsalias='|{"code":"#{PtlManualRelease001.secAcctId}","shortName":"#{PtlManualRelease001.secAcctName}"}|'>
							                </div>
									</div>

					           </div>                      
                            </form>
                            <div class="layui-col-md1">
                                <div class="layui-form-item">
                                    <button type="button" class="layui-btn layui-btn-sm btn-search"
                                        id="PtlManualRelease001_Rs_search">查询</button>
                                </div>
                                <div class="layui-form-item">
                                    <button type="button" class="layui-btn layui-btn-sm btn-default btn-reset"
                                        id="PtlManualRelease001_Rs_reset">重置</button>
                                </div>
                            </div>
                        </div>
                        <div><table class="layui-table" id="typeRs-table"></table></div>
                    </div>
                   
                    <div class="layui-tab-item">
                       
                        <div class="layui-col-md12 ">
								<a id="PtlManualRelease001_Rb_filter" class="layui-btn layui-btn-sm btn-filter" ><i class="iconfont icon-filter"></i>筛选</a>
						       <a id="PtlManualRelease001_Rb_revoke" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i>手动释放</a></a>
						        
                      </div>
                        <div class='joyin-form-wrap   curr-form layui-col-md12' id="div_typeRBForm" style="background-color: #f5f5f5;" >
                            <form class="layui-form layui-col-md11" id="typeRBForm">
                                <div class="layui-form-item">
									<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											data-th-text="#{PtlManualRelease001.tradeDate}">交易日期</label>
										<div class="layui-input-inline input-inline">
			                                 <input type="text" id="tradeDateRb" name="tradeDateRb"
												class="layui-input form-input input-dateRangeSelect"
												placeholder="请选择时间区间"
												data-th-placeholder="#{SysCommon.placeholder}" />										</div>
									</div>
									<div  class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											data-th-text="#{PtlManualRelease001.counterId}">交易对手</label>
										  <div class="layui-input-inline input-inline">
											<input  type="text" id="counterIdRb" name="counterIdRb" class="layui-input form-input input-lenovoselect" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" 
							                       data-th-data-url="@{/invest/portfolio/ptlmanualrelease/PtlManualRelease001/getCounterId}" 
							                      data-idfield="code" data-keyfield="name" data-th-data-effectivefieldsalias='|{"code":"#{PtlManualRelease001.counterId}","shortName":"#{PtlManualRelease001.counterName}"}|'>																													
										</div>
									</div>									
									<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											data-th-text="#{PtlManualRelease001.tradeMarket}">交易场所</label>
										<div class="layui-input-inline input-inline">
				                                   <select type="text" id="tradeMarketRb" name="tradeMarketRb"
				                                   class="layui-input form-input input-select"
				                                   data-th-data-result='${TRADE_PLACE}' allowClear="true" placeholder="请输入内容"
				                                   data-th-placeholder="#{SysCommon.placeholder}"
				                                    formatoption=true data-th-initValue="${entity?.tradeMarket}"></select>										
				                         </div>
									</div>

					           </div>
                               <div class="layui-form-item">
									<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											data-th-text="#{PtlManualRelease001.portfolioId}">组合代码</label>
										<div class="layui-input-inline input-inline">		
											<input  type="text" id="portfolioIdRb" name="portfolioIdRb" class="layui-input form-input input-lenovoselect" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" 
							                       data-th-data-url="@{/invest/portfolio/ptlmanualrelease/PtlManualRelease001/getPortfolioId}" 
							                      data-idfield="code" data-keyfield="name" data-th-data-effectivefieldsalias='|{"code":"#{PtlManualRelease001.portfolioId}","shortName":"#{PtlManualRelease001.portfolioName}"}|'>															
										</div>
									</div>
									
									<div  class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											data-th-text="#{PtlManualRelease001.releaseStatus}">有效状态</label>
										<div class="layui-input-inline input-inline">
                                            <select id="releaseStatusRb" name="releaseStatusRb" th:data-result="${RELEASE_STATUS}" class="layui-input form-input input-select" data-th-placeholder="#{SysCommon.placeholder}">
				                            </select>
										</div>
									</div>
									<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											data-th-text="#{PtlManualRelease001.truAcct}">证券托管户</label>
						                    <div class="layui-input-inline input-inline">										
							                	<input  type="text" id="acctIdRb" name="acctIdRb" class="layui-input form-input input-lenovoselect" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" 
							                       data-th-data-url="@{/invest/portfolio/ptlmanualrelease/PtlManualRelease001/getSecAcctId}" 
							                      data-idfield="code" data-keyfield="name" data-th-data-effectivefieldsalias='|{"code":"#{MstSecuritiesAccount001.secAcctId}","shortName":"#{MstSecuritiesAccount001.secAcctName}"}|'>
							                </div>
									</div>
					           </div>	
                               				           				           
                            </form>
                             <div class="layui-col-md1">
                                <div class="layui-form-item">
                                    <button type="button" class="layui-btn layui-btn-sm btn-search"
                                        id="PtlManualRelease001_Rb_search">查询</button>
                                </div>
                                <div class="layui-form-item">
                                    <button type="button" class="layui-btn layui-btn-sm btn-default btn-reset"
                                        id="PtlManualRelease001_Rb_reset">重置</button>
                                </div>
                            </div>
                        </div>
                        <div><table class="layui-table" id="typeRb-table"></table></div>
                    </div>
                </div>
            </div>
        </div>
<!--         <div id="divlist" name="divlist" style="display: none;margin-bottom:40px;">
             <table class="layui-table" id="typeDiv-table"></table>           
        </div>  -->                                                     
        <div class="pro-module-wrap" id="divlist" name="divlist"  style="display: none;margin-top: 40px;">
            <div class="pro-module">
                <h3 class="pro-module-title" style="border-top: 1px solid #ccc;">
                    <span class="title-des">质押券信息</span>
                    <i class="iconfont icon-arrow-down pro-down-icon"></i>
                </h3>
                <div class="pro-module-item pro-item-wrap" style="overflow:auto !important; height: 180px;">
                    <div class="trast-list-left">
                        <table class="layui-table" id="typeDiv-table"></table>
                    </div>

                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
           <script data-th-src="@{/js/invest/portfolio/ptlmanualrelease/PtlManualRelease001.js}"></script>
    </div>
</body>
</html>
