<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{PtlActivityPeriod004}">活期结息批量导入</title>
</head>
<body>
<div layout:fragment="content">
    <div>
        <div class="pro-module-wrapper pro-module-base">
            <form id="basicInfoForm" class="layui-form joyin-form-wrap pro-module-form">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">明细信息</span>（<span
                                class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="table-wrap">
                                <div>
                                    <table class="layui-table" id="detailsListTable"></table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 划款账户信息组件   -->
                <!-- 划款指令-->
                <!-- <div id="BussTrdTransferOrder" class="page-component" th:data-path="@{/component/trade/BussTrdTransferOrder/init}" th:data-params="|{entity: '${stlPayOrdersList}',entityName:'bussTrdTransferOrder',bizCode:'${tradeId}'}|"></div> -->
                <div class="pro-module-wrap" th:id="bussTrdTransferOrder_div">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des" data-th-text="划款信息">划款信息</span>（<span
                                class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="table-wrap">
                                <a id="bussTrdTransferOrder_btn_generate" class="layui-btn layui-btn-sm">生成指令</a>
                                <div class="BussTrdTransferOrderTable">
                                    <table class="layui-table" id="BussTrdTransferOrderTable"></table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:30px;">
            <div class="text-center">
                <a id="PtlActivityPeriod004_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                   data-th-text="#{SysCommon.submit}">提交</a>
                <a id="PtlActivityPeriod004_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                   data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">

        // var PAY_TYPE = /*[[${PAY_TYPE}]]*/'';
        var PAY_TYPE = /*[[${PA_PAY_TYPE}]]*/'';
        // 一体化对应etliu end

        var PAY_TYPE_01 = /*[[${PAY_TYPE_01}]]*/'';
        var PAY_TYPE_01_NAME = /*[[${PAY_TYPE_01_NAME}]]*/'';

    <script data-th-src="@{/js/invest/portfolio/ptlactivityperiod/PtlActivityPeriod004.js}"></script>
</div>

</html>
