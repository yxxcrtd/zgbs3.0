<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/default}">
<head>
	<title data-th-text="#{InvestFeePay004}">投资端费用支付确认</title>
</head>
<body>
<div class="pro-module-wrap">
	<div layout:fragment="content">
		<div>
			<div class="pro-module-wrapper pro-module-base" style="border-top: none;">
				<form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
					<input type="text" name="workflowId" id="workflowId" th:value="${workflowId}" hidden>
					<input type="text" name="tradeId" id="tradeId" th:value="${tradeId}" hidden>
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title" style="border-top: 1px solid #cccccc;"><span class="title-des">账户信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{InvestFeePay002.feeType}">费用类型</label>
										<div class="layui-input-inline input-inline">
											<select id="InvestFeePay004_feeType" name="feeType" required
													class="layui-input form-input input-select" placeholder="请输入内容"
													th:placeholder="#{SysCommon.placeholder}"
													data-th-data-result="${INVEST_FEE_TYPE}"
													formatoption="true"  type="text"
													th:initValue="${entity?.feeType}"></select>
										</div>
									</div>
									<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable"
											   data-th-text="#{InvestFeePay002.secAcctId}">证券账户</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="InvestFeePay004_secAcctId" name="secAcctId"
													class="layui-input form-input input-select" placeholder="请输入内容"
													data-th-data-url="@{/invest/portfolio/feepay/InvestFeePay001/getSecAcctIdS}"
													data-th-initValue="${entity?.secAcctId}">
											</select>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{InvestFeePay004.feeAmtTotal}">费用金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="payAmt" id="InvestFeePay004_feeAmt" required
												   class="layui-input form-input text-number"
												   data-th-placeholder="#{SysCommon.placeholder}"
												   data-th-value='${entity?.payAmt}'>
										</div>
									</div>
									<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{InvestFeePay004.payDate}">支付日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="payDate" id="InvestFeePay004_payDate"
												   class="layui-input form-input input-dateSelect" required
												   data-th-value='${entity?.payDate eq null ? platDate : #dates.format(entity?.payDate,"yyyy-MM-dd")}'>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">费用信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class='table-wrap'>
									<table class="layui-table" id="dataTable"></table>
								</div>
							</div>
						</div>
					</div>
					<div class="pro-module-wrap" th:id="|bussTrdTransferOrder_div|">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">指令信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<input type="hidden" th:id="|bussTrdTransferOrder_payAcctNo|" th:name="selectValue" value="pay">
									<input type="hidden" th:id="|bussTrdTransferOrder_recAcctNo|" th:name="selectValue" value="rec">
									<a th:id="|bussTrdTransferOrder_btn_generate|" class="layui-btn layui-btn-sm" th:text="#{BussTrdTransferOrder.generate}">生成指令</a>
								</div>
								<table class="layui-table" th:id="|bussTrdTransferOrder_table|" th:name="bussTrdTransferOrder"></table>
							</div>
						</div>
					</div>
				</form>
			</div>
			<div class="row text-center stepbar">
				<div class="text-center">
					<a id="InvestFeePay004_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
					<a id="InvestFeePay004_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
					<a id="InvestFeePay004_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
				</div>
			</div>
		</div>
	</div>
</div>
<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">
		var YES_NO = /*[[${YES_OR_NO}]]*/'';
		var ps = /*[[${ps}]]*/'';
		var bussTrdTransferOrderDtos = /*[[${entity?.bussTrdTransferOrder}]]*/'';//划款指令
	</script>
	<script data-th-src="@{/js/invest/portfolio/feepay/InvestFeePay004.js}" type="text/javascript"></script>
</div>
</body>
</html>
