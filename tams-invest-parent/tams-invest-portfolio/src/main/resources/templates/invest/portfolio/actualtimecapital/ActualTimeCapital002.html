<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ActualTimeCapital002}">实时资金头寸手工调整</title>
<style type="text/css">
.form-label-wrap{
    width: 25%;
}
</style>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
				<form class="layui-form" id="searchForm">
				    <input type="text" id="pageModel" name="pageModel" class="layui-input form-input" data-th-value="${pageModel}" style = "display: none">
					<div class="pro-module-wrap" style="margin-top: 20px;">
						<div class="pro-module">
							<!-- <h3 class="pro-module-title" style="border-top: 1px solid #cccccc;"><span class="title-des">账户信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3> -->
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{ActualTimeCapital001.portfolioId}">组合代码</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="portfolioId" name="portfolioId"
			                      				class="layui-input form-input input-select" placeholder="请输入内容"
			                      				data-th-placeholder="#{SysCommon.placeholder}" 
			                      				data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?ww=false}" 
			                      				data-th-initValue="${entity?.portfolioId}" required>
											</select>
											<!-- <input type="hidden" id="oldEffDate" name="oldEffDate" data-th-value="${#dates.format(entity?.effDate,'yyyy-MM-dd')}"> -->
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{ActualTimeCapital002.adjDate}">日期</label>
										<div class="layui-input-inline input-inline">
											<div class="layui-input-inline input-inline">
					                        	<input type="text" id="adjDate" name="adjDate"
					                                class="layui-input form-input input-dateSelect" data-th-value="${#dates.format(entity?.adjDate,'yyyy-MM-dd')}" required>
											</div>
										</div>
									</div>
								</div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{ActualTimeCapital001.acctNoLabel}">资金账户</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="acctId" name="acctId" parentIds="portfolioId" 
			                      				class="layui-input form-input input-select" placeholder="请输入内容"
			                      				data-th-placeholder="#{SysCommon.placeholder}" 
			                      				data-th-data-url="@{/invest/portfolio/actualtimecapital/ActualTimeCapital001/getAcctInfo}" 
			                      				data-th-initValue="${entity?.acctId}" required>
											</select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{ActualTimeCapital001.ccy}">币种</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="ccy" id="ccy"
												class="layui-input form-input" 
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-value='${entity?.ccy}' required>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{ActualTimeCapital002.adjAmt}">调整值</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="adjAmt" id="adjAmt"
												class="layui-input form-input text-number" data-textrange="2"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-value='${entity?.adjAmt}' required>
                                        </div>
                                    </div>
                                </div>
							</div>
						</div>
					</div>
				</form>
				<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="position: fixed;bottom: 30px;">
                    <div class="text-center">
                        <a id="ActualTimeCapital002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="ActualTimeCapital002_btn_cancle" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-src="@{/js/invest/portfolio/actualtimecapital/ActualTimeCapital002.js?v=11}"></script>
	</div>
</body>
</html>
