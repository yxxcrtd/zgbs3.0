<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PtlCashFlow001}">单一发行人持仓分析</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
                <!--  add by wangyang1 【吉林银行】添加导出一级明细数据   2019年9月29日 start -->
                <a id="PtlCashFlow001_btn_detailOneExport" class="layui-btn layui-btn-sm btn-export btn-default">导出明细</a>
                <!--  add by wangyang1 【吉林银行】 添加导出一级明细数据  end -->
			</div>
			<div
				class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
				<form class="layui-form" id="searchForm">
                    <!--  add by wangyang1 【吉林银行】添加导出一级明细数据   2019年9月29日 start -->
                    <input type="text" id="bankCode" name="bankCode" data-th-value='${bankCode}' hidden>
                    <!--  add by wangyang1 【吉林银行】 添加导出一级明细数据  end -->
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable">发行人</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="publisher" name="publisher"  
									class="layui-input form-input input-select" 
									data-th-data-url="@{/invest/portfolio/ptlsingleissuerpositionanalysis/PtlSingleIssuerPositionAnalysis001/getPublisher}"
									data-idfield="code" data-keyfield="hidCode"
									placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
									allowClear="true" multiple="true" >
								</select>
							</div>
						</div>
						<div
							class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable">查询日期</label>
							<div class="layui-input-inline input-inline">
								<input id="searchDate" name="searchDate"
									   class="layui-input form-input input-dateSelect"
									   th:value="${sysDate}" required/>
								<!--<input id="searchDate" name="searchDate"
									   class="layui-input form-input input-dateRangeSelect"
									   placeholder="请选择时间区间"
									   data-th-placeholder="#{SysCommon.placeholder}" th:value="${sysDate}"/>-->
							</div>
						</div>
					</div>
				</form>
			</div>
<!-- 			<div class="ptl-table1">
				<table class="layui-table" id="dataTable1"></table>
			</div> -->
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<style>
	        .ptl-table .layui-table-view{
	            height: 500px!important;
	        }
	        .ptl-table .layui-table-view .layui-table-box .layui-table-body{
	            height: 417px!important;
	        }
	    </style>
		<script data-th-src="@{/js/invest/portfolio/ptlsingleissuerpositionanalysis/PtlSingleIssuerPositionAnalysis001.js}"></script>
		<script th:inline="javascript" type="text/javascript">
			var AUTHORITY_TYPE = /*[[${AUTHORITY_TYPE}]]*/'';
		</script>
	</div>
</body>
</html>
