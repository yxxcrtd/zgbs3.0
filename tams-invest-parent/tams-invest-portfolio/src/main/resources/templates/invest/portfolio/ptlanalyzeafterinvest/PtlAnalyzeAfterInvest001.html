<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PtlAnalyzeAfterInvest001}">投后分析</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area"></div>
        <div class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
            <form class="layui-form" id="searchForm">
				<div class="layui-form-item">
                    <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{PtlAnalyzeAfterInvest001.finprodId}">资产名称</label>
                        <div class="layui-input-inline input-inline">
	                        <select type="text" id="finprodId" name="finprodId"
	                                class="layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
	                                data-th-data-url="@{/invest/portfolio/ptlsingleassetpositionanalysis/PtlSingleAssetPositionAnalysis001/getFinprodMarketId}"
	                                allowClear="true" formatoption="true" multiple>
	                        </select>
                        </div>
                    </div>
	                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
	                    <label class="layui-form-label form-lable" data-th-text="#{PtlAnalyzeAfterInvest001.pledgeStatus}">质押券状态</label>
	                    <div class="layui-input-inline input-inline">
	                        <select type="text" id="pledgeStatus" name="pledgeStatus"  class="layui-input form-input input-select"  data-th-data-result="${PLEDGE_SHARES_STATUS}"></select>
	                    </div>
	                </div>
				</div>
			</form>
		</div>
		<div>
			<table class="layui-table" id="dataTable"></table>
		</div>
	</div>
	<div layout:fragment="script">
    	<script data-th-inline="javascript" type="text/javascript">
    	
    	</script>
		<script data-th-src="@{/js/invest/portfolio/ptlanalyzeafterinvest/PtlAnalyzeAfterInvest001.js}"></script>
	</div>
</body>
</html>
