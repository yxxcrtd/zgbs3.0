<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PtlManagementInfo003}">用户分配</title>
<style>
.form-input-text{
right:0;
width:auto;
}
</style>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<form class="layui-form" id="submitForm">
				<div class="layui-form-item">
					<div class="form-inline-wrap">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{PtlManagementInfo003.allocationWay}">分配方法</label>
						<div class="layui-input-inline input-inline">
							<select type="text" id="allocationWay" name="allocationWay" class="layui-input input-select" required
									data-result='[{"id":"01","text":"组合"},{"id":"02","text":"用户"}]' data-th-initValue="${entity?.allocationWay}"
									formatoption = true placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
							</select>
						</div>
					</div>
					<div class="form-inline-wrap user">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{PtlManagementInfo003.user}">用户</label>
						<div class="layui-input-inline input-inline">
							<select type="text" id="userId" name="userId" class="layui-input form-input input-select" 
								data-th-data-url="@{/invest/portfolio/ptlmanagementinfo/PtlManagementInfo003/getUserId}" 
								th:initValue="${entity?.userId}" required
								formatoption = true placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
							</select>
						</div>
					</div>
					<div class="form-inline-wrap filter" style="display:none;">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{PtlManagementInfo001.portfolioName}">组合名称</label>
						<div class="layui-input-inline input-inline" style="position: relative;">
							<input type="text" id="filter" name="filter" class="layui-input form-input" formatoption = true placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
							<a id="PtlManagementInfo003_btn_001" class="layui-btn layui-btn-sm form-input-text" data-ignore=true>
								<i class="iconfont icon-search"></i>
								<span data-th-text="#{PtlManagementInfo003.select}">查询</span>
							</a>
						</div>
					</div>
					<!-- <div class="form-inline-wrap filter">
						<a id="PtlManagementInfo001_btn_allocation" class="layui-btn layui-btn-sm " >
							<i class="iconfont icon-search"></i>
							<span data-th-text="#{PtlManagementInfo003.select}">查询</span>
						</a>
					</div> -->
					<div class="form-inline-wrap portfolio" style="display:none;">
						<label class="layui-form-label form-label-wrap"
							data-th-text="#{PtlManagementInfo003.portfolio}">组合</label>
						<div class="layui-input-inline input-inline">
							<select type="text" id="portfolioId" name="portfolioId" class="layui-input form-input input-select" data-th-data-url="@{/invest/portfolio/ptlmanagementinfo/PtlManagementInfo003/getPortfolioId}" required
									data-th-initValue="${entity?.portfolioId}" formatoption = true placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
							</select>
						</div>
					</div>
					<div class="layui-form-item portfolio" style="display:none;margin-left:10%">
						<input type="checkbox" parentsId = "portfolioId" lay-skin="switch" data-th-lay-text="#{SystemActorRole001.expandAll}" id="expandAll" data-ignore=true>
						<div class="layui-input" style="border: 1px solid #dbdbdb; scroll-y: auto; scroll-x: hidden; width:80%;height:500px; overflow-y: scroll;" id='tree' data-th-url='|@{/invest/portfolio/ptlmanagementinfo/PtlManagementInfo003/getUser}?workflowId=${entity?.workflowId}'>
	                	</div>
					</div>
				</div>
				<div class="user">
					<table class="layui-table" id="dataTable"></table>
				</div>
			</form>
			 <div class="layui-form-item" align="center" style="margin-top:20px;">
                    <div class="text-center" style="padding-bottom:20px;">
                        <a id="PtlManagementInfo003_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                        <a id="PtlManagementInfo003_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="PtlManagementInfo003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
		</div>
	</div>
	<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">
		    var portData = /*[[${portData}]]*/'';
		</script>
		<script data-th-src="@{/js/invest/portfolio/ptlmanagementinfo/PtlManagementInfo003.js}"></script>
	</div>
</body>
</html>
