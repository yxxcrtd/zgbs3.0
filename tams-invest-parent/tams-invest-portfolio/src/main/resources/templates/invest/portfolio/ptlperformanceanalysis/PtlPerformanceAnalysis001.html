<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title >组合表现分析报表</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area " id="buttonDiv">
            <a id="PtlPerformanceAnalysis001_btn_target" class="layui-btn layui-btn-sm " data-th-text="设置显示列"></a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
            <form class="layui-form" id="submitForm"> 
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">组合代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="portfolioId" name="portfolioId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/invest/portfolio/ptlpositionanalysis/PtlPositionAnalysis001/getPortFolioInfo}"
                                allowClear="true"
                                formatoption="true" multiple>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">收益类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="profitType" name="profitType"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" allowClear="true"
                                data-th-data-result='${PROFIT_TYPE}' formatoption="true" multiple="true">
                            </select>
                        </div>
                    </div>

                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4" id="div_prodManager">
                        <label class="layui-form-label form-lable">产品经理</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" name="prodManager" id="prodManager"
                                    class="layui-input form-input input-select" maxlength=60
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-data-url="@{/invest/product/common/getUserName}" multiple="true">
                            </select>
                        </div>
                    </div>

                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable">查询时间</label>
                        <div class="layui-input-inline input-inline">
								<input type="text" id="searchDate" name="searchDate"
									class="layui-input form-input input-dateRangeSelect"
									placeholder="请选择、支持区间"
									data-th-placeholder="#{SysCommon.dateInterval}" />
						</div>
                    </div>

                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">比较指标</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="comparisonIndex" name="comparisonIndex"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" allowClear="true"
                                initValue = "01"
                                data-th-data-result='${COMPARISON_INDEX}' formatoption="true" >
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                	<div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">业绩基准</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="benchmark" name="benchmark"
                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}" allowClear="true"
                                    data-th-data-result='${INDEX_ID_SOURCE}' formatoption="true" 
                                    >
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable">*&nbsp; &nbsp; &nbsp; 系数</label>
                        <div class="layui-input-inline input-inline">
                        <input type="text"  id="coefficient" name="coefficient" length="5"
									class="layui-input form-input text-number" style="display:inline-block;" data-textrange="2"
									value="1" />


						</div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable">+&nbsp; &nbsp; &nbsp; 利差</label>
                        <div class="layui-input-inline input-inline">
                        <input type="text" id="spreadRate" name="spreadRate" length="5"
									class="layui-input form-input text-number" style="display:inline-block;" data-textrange="4" 
									value="0"/><span class="input-right-show">%</span>
						</div>
                    </div>                    
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                        <label class="layui-form-label form-lable">无风险利率</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="noRiskRate" name="noRiskRate"
                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}" allowClear="true"
                                    data-th-data-result='${INDEX_ID_SOURCE}' formatoption="true" 
                                    >
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable">*&nbsp; &nbsp; &nbsp; 系数</label>
                        <div class="layui-input-inline input-inline">
                        <input type="text"  id="noRiskCoefficient" name="noRiskCoefficient" length="5"
									class="layui-input form-input text-number" style="display:inline-block;" data-textrange="2"
									value="1" />


						</div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable">+&nbsp; &nbsp; &nbsp; 利差</label>
                        <div class="layui-input-inline input-inline">
                        <input type="text" id="noRiskSpreadRate" name="noRiskSpreadRate" length="5"
									class="layui-input form-input text-number" style="display:inline-block;" data-textrange="4" 
									value="0" /><span class="input-right-show">%</span>
						</div>
						
                    </div>                  
                </div>
            </form>
        </div>
        
        <div id="dataTableDiv">
            <table id="dataTable"></table>
        </div>
        <div class="pro-module-wrap" style="margin-top: 10px;">
            <div class="pro-module">
                <h3 class="pro-module-title" style="border-top: 1px solid #ccc;">
                    <span class="title-des">组合表现分析折线图</span>
                    <i class="iconfont icon-arrow-down pro-down-icon"></i>
                </h3>
                <div class="pro-module-item pro-item-wrap" style="overflow:auto !important; height: 180px;">
                 <div class="layui-card-body">
                     <div id="main" style="height: 180px;">
					</div>
				</div>
						
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
            var platDate = /*[[${platDate}]]*/'';
    </script>
    <script data-th-src="@{/js/invest/portfolio/ptlperformanceanalysis/PtlPerformanceAnalysis001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
