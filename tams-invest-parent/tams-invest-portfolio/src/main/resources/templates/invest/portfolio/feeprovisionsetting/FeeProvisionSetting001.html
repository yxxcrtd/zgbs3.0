<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FeeProvisionSetting001}">费用预提设置</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="form-button-area">
				<a id="FeeProvisionSetting001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a> 
				<a id="FeeProvisionSetting001_btn_revoke" class="layui-btn layui-btn-sm" data-th-text="#{pingan.common.revoke}">撤销</a>
				<a id="FeeProvisionSetting001_btn_modify" class="layui-btn layui-btn-sm" data-th-text="#{SysCommon.modify}">修改</a>
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" data-th-text="#{FeeProvisionSetting001.secAcctId}">证券账户</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="FeeProvisionSetting002_secAcctId" name="secAcctId"
										class="tabJump layui-input form-input input-select" placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}"
										formatoption = "true"
										data-th-data-url="@{/invest/portfolio/feeprovisionsetting/FeeProvisionSetting001/getSecAcctId}"
								>
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" data-th-text="#{FeeProvisionSetting001.dealStatus}">有效状态</label>
							<div class="layui-input-inline input-inline">
								<select name="dealStatus"
									class="layui-input form-input input-select"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-data-result="${STATUS_VALID}"
									>
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable" data-th-text="#{FeeProvisionSetting001.positionDate}">计提日期</label>
							<div class="layui-input-inline input-inline">
								<input id="FeeProvisionSetting001_positionDate" name='positionDate'
									   class="layui-input form-input input-dateRangeSelect"
									   placeholder="请选择时间区间"
									   data-th-placeholder="#{SysCommon.placeholder}"
									   data-th-value = '${quaryDate}'>
							</div>
						</div>
					</div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">

        </script>
		<script data-th-src="@{/js/invest/portfolio/feeprovisionsetting/FeeProvisionSetting001.js}" type="text/javascript"></script>
	</div>
</body>
</html>
