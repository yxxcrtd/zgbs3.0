<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PtlInvPortfolioStrategy001}">投资组合策略管理</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
				<a id="PtlInvPortfolioStrategy001_btn_add"
					class="layui-btn layui-btn-sm btn-create"
					data-th-text="#{SysCommon.create}">新建</a>
			</div>
			<div
				class='joyin-form-wrap joyin-filter-form condition-area curr-form'>
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{PtlInvPortfolioStrategy001.portfolioId}">组合代码</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="portfolioId" name="portfolioId"
									class="layui-input form-input input-select" placeholder="请选择"
									multiple="true"
									data-th-data-url="@{/invest/portfolio/ptlinvportfoliostrategy/PtlInvPortfolioStrategy001/getPortfolioId}">
								</select>
							</div>
						</div>
						<div
							class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{PtlInvPortfolioStrategy001.strategyId}">策略代码</label>
							<div class="layui-input-inline input-inline">
								<select type="text" id="strategyId" name="strategyId"
									class="layui-input form-input input-select" placeholder="请选择"
									multiple="true"
									data-th-data-url="@{/invest/portfolio/ptlinvportfoliostrategy/PtlInvPortfolioStrategy001/getStrategyId}">
								</select>
							</div>
						</div>
						<div
							class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{PtlInvPortfolioStrategy001.strategyType}">策略类型</label>
							<div class="layui-input-inline input-inline">
								<select name="strategyType" id="strategyType"
									class="layui-input form-input input-select" placeholder="请选择"
									data-th-initValue='${entity?.strategyType}' multiple="true"
									data-th-data-result="${STRATEGY_TYPE}">
								</select>
							</div>
						</div>

					</div>
					<div class="layui-form-item">
						<div
							class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{PtlInvPortfolioStrategy001.effDate}">生效日</label>
							<div class="layui-input-inline input-inline">
								<input id="effDate" name="effDate"
									class="layui-input form-input input-dateRangeSelect"
									placeholder="请输入日期">
							</div>
						</div>
					</div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script
			data-th-src="@{/js/invest/portfolio/ptlinvportfoliostrategy/PtlInvPortfolioStrategy001.js}"></script>
	</div>
</body>
</html>
