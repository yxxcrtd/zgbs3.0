<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PtlManagementInfo004}">创建子组合</title>
	<style>
		.form-label-wrap{
			width: 36% !important;
		}
		.manage-info-item{
			float: left;
			padding-right: 10px;
			margin-top: 10px;
		}
		.manage-info-item .layui-form-checkbox{
			margin-right: 2px;
			margin-top: -2px;
			padding-right: 0;
			line-height: 15px;
			width: 15px;
			height: 15px;
		}
		.manage-info-item .layui-form-checkbox i{
			line-height: 15px;
			width: 15px;
			height: 15px;
			border-left: 1px solid #d2d2d2;
			font-size: 15px;
		}
		.manage-info-item .layui-form-checked i,.manage-info-item .layui-form-checked:hover i{
			border-color: #2693ff;
			color: #2693ff;
		}
	</style>
</head>
<body>
    <div layout:fragment="content">
        <div class="pro-module-container">
			<form id="basicInfoForm" class="layui-form joyin-form-wrap pro-module-form">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">基本信息</span>（<span
                                class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{PtlManagementInfo001.portfolioId}">组合代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="portfolioId" name="portfolioId" class="layui-input form-input" placeholder="请输入内容" 
                                            		data-th-placeholder="#{SysCommon.placeholder}" maxLength="32"
                                            		required data-th-value="${entity?.portfolioId}">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{PtlManagementInfo001.portfolioName}">组合名称</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="portfolioName" name="portfolioName" 
                                            		class="layui-input form-input" placeholder="请输入内容" 
                                            		data-th-placeholder="#{SysCommon.placeholder}" maxLength="200"
                                            		required data-th-value="${entity?.portfolioName}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{PtlManagementInfo001.revenueType}">收益类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="profitType" name="profitType" 
                                            		class="layui-input form-input input-select"
                                                    data-th-data-result="${PROFIT_TYPE}"
                                            		placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                    required="required" data-th-initvalue="${entity?.profitType}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{PtlManagementInfo002.issueMode}">开放类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="openType"  name="openType" required="required"
                                                   class="layui-input form-input input-checkbox"  
                                                   data-th-data-result="${ISSUE_MODE}" data-th-initvalue="${entity?.openType}" disabled="disabled"/>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{PtlManagementInfo002.raisetype}">募集方式</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="raiseType" name="raiseType" required="required"
                                                   class="layui-input form-input input-select"
                                                    data-th-data-result="${RAISE_TYPE}" data-th-initvalue="${entity?.raiseType}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                   <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{PtlManagementInfo002.investType}">投资性质</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="investNature" name="investNature" 
                                            		class="layui-input form-input input-select" placeholder="请输入内容"
                                            		data-th-placeholder="#{SysCommon.placeholder}" 
                                            		required data-th-data-result="${INVEST_TYPE}" data-th-initvalue="${entity?.investNature}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{PtlManagementInfo001.vDate}">成立日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input id="vdate" name="vdate" 
                                            		class="layui-input form-input input-dateSelect"
                                            		data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'
                                            		required>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{PtlManagementInfo001.mDate}">到期日</label>
                                        <div class="layui-input-inline input-inline">
                                           <input id="mdate" name="mdate" 
                                           		class="layui-input form-input input-dateSelect"
                                           		data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
                                           		required>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{PtlManagementInfo004.childPortfolioId}">子组合代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="childPortfolioId" name="childPortfolioId" required
                                                   class="layui-input form-input" placeholder="请输入内容"
                                                   data-th-value="${entity?.childPortfolioId}">
                                        </div>
                                    </div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{PtlManagementInfo004.childPortfolioName}">子组合名称</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="childPortfolioName" name="childPortfolioName"
                                                   required="required"
                                                   class="layui-input form-input" placeholder="请输入内容"
                                                   data-th-value="${entity?.childPortfolioName}">
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{PtlManagementInfo004.inheritanceRatio}">继承比例%</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="disPercent" name="disPercent"
                                                   required="required" data-textrange="2" data-fixtype="2"
                                                   class="layui-input form-input text-number" placeholder="请输入内容"
                                                   data-th-value="${entity?.disPercent}">
										</div>
									</div>

									<div class="form-inline-wrap" style="display: none">
										<label class="layui-form-label form-label-wrap" data-th-text="#{PtlManagementInfo004.separateValuation}">单独估值</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="separateValuation" name="separateValuation"
											>
										</div>
									</div>
                                    <div class="form-inline-wrap" style="display: none">
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="isGuarantee" name="isGuarantee"
                                                   data-th-value="${entity?.isGuarantee}">
                                        </div>
                                    </div>
                                </div>

						</div>

					</div>
				</div>

                <!-- 用户分配  -->
                <div class="pro-module-wrap" id="userDiv">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">用户分配</span>（<span
                                class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <!-- <div id="userAssign">
                                <div data-th-each="key,list : ${map1}" class="layui-form-item" style="margin: 0 8px;">
                                    <div class="layui-form-item">
                                        <label class=""><i class="iconfont icon-open-folder_fill" style="color: #e2c914ed;padding-right: 2px;"></i><span data-th-text="${list.current.key}"></span></label>
                                    </div>
                                    <ul class="">
                                        <li data-th-each="option : ${list.current.value}" class="manage-info-item">
                                            <input type="checkbox" th:id="${option?.id}" class='layui-input form-input userId' name="userId" data-th-value="${option?.id}" th:text="${option.text}"/>
                                        </li>
                                    </ul>
                                </div>
                            </div> -->
                            <div class="layui-form-item" style="margin-left:5%" id="expandAll1">
                                <input type="checkbox" parentsId="portfolioId" lay-skin="switch"
                                       data-th-lay-text="#{SystemActorRole001.expandAll}" id="expandAll"
                                       data-ignore=true>
                                <div class="layui-input" style="border: 1px solid #dbdbdb; scroll-y: auto; scroll-x: hidden;
        						width:90%;height:500px; overflow-y: scroll;" id='tree'
                                     data-th-url='|@{/invest/portfolio/ptlmanagementinfo/PtlManagementInfo002/getTree}?workflowId=${entity?.workflowId}&portfolioId=${entity?.childPortfolioId}|'>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">备注</span><i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item" style="padding-bottom: 8px;">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" style="width: 100%;">
                                    <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                        <textarea id="remark" name="remark" value="" class="layui-textarea" placeholder="请输入内容"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
			</form>
                <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
                    <div class="text-center">
                        <a id="PtlManagementInfo004_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                        <a id="PtlManagementInfo004_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="PtlManagementInfo004_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
         </div>
    </div>
    <div layout:fragment="script">
    	<script data-th-inline="javascript" type="text/javascript">
            var entity = /*[[${entity}]]*/'';
		</script>
    	<script data-th-src="@{/js/invest/portfolio/ptlmanagementinfo/PtlManagementInfo004.js}">
    	</script>
    </div>
</body>
</html>
