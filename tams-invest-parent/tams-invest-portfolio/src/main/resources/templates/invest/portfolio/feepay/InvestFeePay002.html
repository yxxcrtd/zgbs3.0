<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{InvestFeePay002}">投资端费用支付新建</title>
</head>
<body>
<div class="pro-module-wrap">
	<div layout:fragment="content">
		<div>
			<div class="pro-module-wrapper pro-module-base" style="border-top: none;">
				<form class="layui-form joyin-form-wrap pro-module-form" id="InvestFeePay002_Form">
					<input type="text" name="tradeId" id="InvestFeePay002_hidden_tradeId" th:value="${entity?.tradeId}" hidden>
					<input type="text" name="feeTypehidden" id="InvestFeePay002_hidden_feeType" th:value="${entity?.feeType}" hidden>
					<input type="text" name="feeName" id="InvestFeePay002_hidden_feeName" th:value="${entity?.feeName}" hidden>
					<input type="text" name="cashId" id="InvestFeePay002_hidden_cashId" th:value="${entity?.cashId}" hidden>
					<input type="text" name="confirmFlag" id="InvestFeePay002_hidden_operateType" th:value="${entity?.confirmFlag}" hidden>
					<input type="text" id="InvestFeePay002_hidden_tradeAmt" th:value="${entity?.actPayAmt != null? entity?.actPayAmt : '0'}" hidden>
					<input type="text" id="InvestFeePay002_positionEndDateHide" data-th-value='${entity?.endDate eq null ? platDate : #dates.format(entity?.endDate,"yyyy-MM-dd")}' hidden>
					<input type="text" name="chargeType" id="InvestFeePay002_hidden_chargeType" th:value="${entity?.chargeType}" hidden>
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title" style="border-top: 1px solid #cccccc;"><span class="title-des">账户信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable" data-th-text="#{InvestFeePay002.secAcctId}">证券账户</label>
										<div class="layui-input-inline input-inline">
											<!-- <input  type="text" id="InvestFeePay002_secAcctId" name="secAcctId" class="layui-input form-input input-lenovoselect" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" 
		                       					data-th-data-url="@{/invest/portfolio/feepay/InvestFeePay001/getSecAcctId}" 
		                      					data-idfield="code" data-keyfield="name" data-th-data-effectivefieldsalias='|{"code":"#{InvestFeePay002.secAcctCode}","shortName":"#{InvestFeePay002.secAcctName}"}|'> -->
		                      					
		                      				<!--	<select type="text" id="InvestFeePay002_secAcctId" name="secAcctId" formatoption="true"
													class="tabJump layui-input form-input input-select" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
													data-th-data-url="@{/invest/portfolio/feeprovisionsetting/FeeProvisionSetting001/getSecAcctId}"
													data-th-initValue="${entity?.secAcctId}">
												</select>-->
		                      					<select type="text" id="InvestFeePay002_secAcctId" name="secAcctId"
						                               class="layui-input form-input input-select" placeholder="请输入内容" required
						                              data-th-data-url="@{/invest/portfolio/feepay/InvestFeePay001/getSecAcctIdS}"
						                                data-th-initValue="${entity?.secAcctId}">
						                          </select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{InvestFeePay002.feeType}">费用类型</label>
										<div class="layui-input-inline input-inline">
											<select id="InvestFeePay002_feeType" name="feeType"
                                                class="layui-input form-input input-select" placeholder="请输入内容" required
                                                th:placeholder="#{SysCommon.placeholder}" 
                                                data-th-data-result="${INVEST_FEE_TYPE}"
                                                formatoption="true"  type="text" childrenIds="InvestFeePay002_regTrustOrg"
                                                th:initValue="${entity?.feeType}"></select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{InvestFeePay002.regTrustOrg}">登记托管机构</label>
										<div class="layui-input-inline input-inline">
											<select id="InvestFeePay002_regTrustOrg" name="regTrustOrg" required
												class="layui-input form-input input-select" parentIds="InvestFeePay002_feeType"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-initValue='${entity?.regTrustOrg}'
												data-th-data-result="${REGIST_ORG}">
											</select>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">费用信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap" id='InvestFeePay002_div_positionStartDate'>
										<label class="layui-form-label form-label-wrap" data-th-text="#{InvestFeePay002.positionStartDate}">计费开始日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="startDate" id="InvestFeePay002_positionStartDate"
												class="layui-input form-input input-dateSelect" required disabled
												data-th-value='${#dates.format(entity?.startDate,"yyyy-MM-dd")}'>
										</div>
									</div>
									<div class="form-inline-wrap" id='InvestFeePay002_div_positionEndDate'>
										<label class="layui-form-label form-label-wrap" data-th-text="#{InvestFeePay002.positionEndDate}">计费结束日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="endDate" id="InvestFeePay002_positionEndDate"
											   class="layui-input form-input input-dateSelect" required
											   data-th-value='${entity?.endDate eq null ? platDate : #dates.format(entity?.endDate,"yyyy-MM-dd")}'>
										</div>
									</div>
									<div class="form-inline-wrap" id='InvestFeePay002_div_payAmt'>
										<label class="layui-form-label form-label-wrap" data-th-text="#{InvestFeePay002.payAmt}">理论费用金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="payAmt" id="InvestFeePay002_payAmt"
												   class="layui-input form-input text-number" required disabled
												   data-th-placeholder="#{SysCommon.placeholder}"
												   data-th-value='${entity?.payAmt}' >
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{InvestFeePay002.payDate}">支付日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="payDate" id="InvestFeePay002_payDate"
												   class="layui-input form-input input-dateSelect" required
												   data-th-value='${entity?.payDate eq null ? platDate : #dates.format(entity?.payDate,"yyyy-MM-dd")}'>
										</div>
									</div>
									<div class="form-inline-wrap" id='InvestFeePay002_div_actPayAmt'>
										<label class="layui-form-label form-label-wrap" data-th-text="#{InvestFeePay002.actPayAmt}">实付费用金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="actPayAmt" id="InvestFeePay002_actPayAmt"
												class="layui-input form-input text-number" required disabled
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-value='${entity?.actPayAmt}'>
										</div>
									</div>
									<div class="form-inline-wrap" id='InvestFeePay002_div_adjustAmt'>
										<label class="layui-form-label form-label-wrap" data-th-text="#{InvestFeePay002.adjustAmt}">调整金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="adjustAmt" id="InvestFeePay002_adjustAmt"
												class="layui-input form-input text-number" required disabled
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-value='${entity?.adjustAmt}'>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap" id='InvestFeePay002_div_calculate' style="width: 120px!important; float: right;">
										<div class="layui-input-inline input-inline">
											<a id="InvestFeePay002_btn_calculate" class="layui-btn layui-btn-sm"
	                                           data-th-text="#{InvestFeePay002.calculate}">计算</a>
										</div>
									</div>
								</div>
								<div id="fee_div">
									<table class="layui-table" id="fee_dataTable" name="feeInfoList" th:title="#{InvestFeePay002.field.feeInfo}">
									</table>
								</div>
							</div>
						</div>
					</div>
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">交易备注</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<label class="layui-form-label form-label-wrap" style="width: 11.9%;">备注</label>
									<div class="layui-input-inline input-inline" style="width: 85%!important;">
											<textarea id="remark" name="remark" placeholder="请输入内容" maxlength="300"
													  data-th-placeholder="#{SysCommon.placeholder}"
													  class="layui-textarea" data-th-text="${entity?.remark}"></textarea>
									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="pro-module-wrap" data-th-if="${entity?.revokeReason}">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">撤销理由</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<label class="layui-form-label form-label-wrap" style="width: 11.9%;">备注</label>
									<div class="layui-input-inline input-inline" style="width: 85%!important;">
											<textarea id="revokeReason" name="revokeReason"  
													   placeholder="请输入内容"
													  class="layui-textarea" data-th-text="${entity?.revokeReason}"></textarea>
									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="pro-module-wrap" th:id="|bussTrdTransferOrder_div|">
	                    <div class="pro-module">
	                        <h3 class="pro-module-title"><span class="title-des">指令信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
	                        <div class="pro-module-item">
	                            <div class="layui-form-item">
	                                <input type="hidden" th:id="|bussTrdTransferOrder_payAcctNo|" th:name="selectValue" value="pay">
	                                <input type="hidden" th:id="|bussTrdTransferOrder_recAcctNo|" th:name="selectValue" value="rec">
	                                <a th:id="|bussTrdTransferOrder_btn_generate|" class="layui-btn layui-btn-sm" th:text="#{BussTrdTransferOrder.generate}">生成指令</a>
	                            </div>
	                            <table class="layui-table" th:id="|bussTrdTransferOrder_table|" th:name="bussTrdTransferOrder"></table>
	                        </div>
	                    </div>
	                </div>
					<!-- 划款指令 -->
<!-- 					<div class="page-component" th:data-path="@{/component/trade/BussTrdTransferOrder/init}" -->
<!-- 	                 	th:data-params="|{entityName: 'bussFinProductFeePay', pageFrom: 'submitForm', entity:'${entity_bussTrdTransferOrder}', bizCode:'${entity?.tradeId}'}|"> -->
<!-- 	            	</div> -->
					<!-- 附件信息 -->
		            <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
		                th:data-params="|{entityName: 'fileArray', businessId: '${entity?.tradeId}'}|"></div>
				</form>
				</div>
				<div class="row text-center stepbar">
					<div class="text-center">
						<a id="InvestFeePay002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
						<a id="InvestFeePay002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
						<a id="InvestFeePay002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var feeType_settle = /*[[${feeType_settle}]]*/;
			var feeType_acctno = /*[[${feeType_acctno}]]*/;
			var feeChargetype_norule = /*[[${feeChargetype_norule}]]*/;
			var feeChargetype_prov = /*[[${feeChargetype_prov}]]*/;
			var yesFlag = /*[[${yesFlag}]]*/;
		    var YES_NO = /*[[${YES_OR_NO}]]*/'';
		    var ps = /*[[${ps}]]*/;
			var workflowId = /*[[${workflowId}]]*/;// 工作流代码
			var bussTrdTransferOrderDtos = /*[[${entity?.bussTrdTransferOrder}]]*/'';//划款指令
			function zd(){
				jyfx = $('#InvestFeePay002_hidden_feeType').val();
				if(jyfx != undefined && jyfx != null){
	        		zcmc = $('#InvestFeePay002_feeType').val();
	        		var s1 = "费用支付";
	        		var a =zcmc+s1;
	        		$("#remark").val(a);
	        	}
			}
        </script>
		<script data-th-src="@{/js/invest/portfolio/feepay/InvestFeePay002.js}" type="text/javascript"></script>
	</div>
</body>
</html>
