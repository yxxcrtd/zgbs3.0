<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
	<script type="text/javascript" data-th-src="@{/public/js/message}"></script>
	<title data-th-text="#{PtlFutureCashPosi001}">组合未来头寸分析</title>
</head>
<body>
	<div layout:fragment="content">
		<div class='layui-fluid'>
			<div class="layui-col-md12 form-button-area" style="margin: 10px;">
			</div>
			<div class='joyin-form-wrap joyin-filter-form condition-area curr-form' >
				<form class="layui-form" id="searchForm"> 
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
								data-th-text="#{PtlFutureCashPosi001.portfolioId}">组合代码</label>
							<div class="layui-input-inline input-inline">
                      			<select type="text" id="portfolioId" name="portfolioId"
                      				class="layui-input form-input input-select" placeholder="请输入内容"
                      				data-th-placeholder="#{SysCommon.placeholder}" multiple="true"
                      				data-th-data-url="@{/business/common/CommonSelect/selectPortfolioId?ww=false}" >
								</select>
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
				                            data-th-text="#{PtlFutureCashPosi001.profitType}">收益类型</label>
	                        <div class="layui-input-inline input-inline">
	                        	<input type="text" id="profitType" name="accountType"
	                                class="layui-input form-input input-select" 
	                                data-th-data-result="${PROFIT_TYPE}">
	                        </div>
                        </div>
                        <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4" id="div_prodManager">
                            <label class="layui-form-label form-lable"
				                            data-th-text="#{PtlFutureCashPosi001.prodManager}">产品经理</label>
                            <div class="layui-input-inline input-inline">
                                 <select type="text" name="prodManager" id="prodManager"
                                    class="layui-input form-input input-select" maxlength=60
                                    data-th-placeholder="#{SysCommon.placeholder}" multiple="true"
                                    data-th-data-url="@{/invest/product/common/getUserName}">
                                </select>    
                            </div>
                        </div>
				    </div>
                    <div class="layui-form-item">
						<div class="form-inline-wrap">
							<label class="layui-form-label form-label-wrap"
								data-th-text="#{PtlFutureCashPosi001.showDimension}">展示维度</label>
							<div class="layui-input-inline input-inline">
								<input type="text" id="showDimension" name="showDimension"
									required class="layui-input form-input input-checkbox"
									data-th-data-result="${SHOW_DIMENSION}" />
							</div>
						</div>
						<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
							<label class="layui-form-label form-lable"
				                            data-th-text="#{PtlFutureCashPosi001.cdate}">日期</label>
	                        <div class="layui-input-inline input-inline">
	                        	<input required type="text" id="cdate" name="cdate"
	                                class="layui-input form-input input-dateSelect"
	                                th:value="${sysDateNext}">
	                        </div>
                        </div>
                    </div>
				</form>
			</div>
			<div>
				<table class="layui-table" id="dataTable"></table>
			</div>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
			var showDimensionShort = /*[[${showDimensionShort}]]*/'';
		</script>
		<script data-th-src="@{/js/invest/portfolio/ptlfuturecashposi/PtlFutureCashPosi001.js}"></script>
	</div>
</body>
</html>
