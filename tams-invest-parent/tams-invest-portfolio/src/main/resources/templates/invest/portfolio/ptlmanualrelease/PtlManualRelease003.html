<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
<title >手工释放</title>
</head>
   <body>
		<div layout:fragment="content">
        <div class="pro-module-container">
            <!-- <div class="pro-module-wrapper pro-module-base"> -->
            <form class="layui-form joyin-form-wrap pro-module-form" id="searchForm">
                <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">																						 
                    <div class="pro-module">
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <!-- 1 -->
                                <div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap">交易编号</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="tradeId" name="tradeId"
											   data-th-placeholder="#{SysCommon.placeholder}"
											   data-th-value="${entity?.tradeId}" class="layui-input form-input" />
									</div>
								</div>
                                <!-- 2 -->
                                <div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap">首次结算金额</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="prinAmt" name="prinAmt"
											   data-th-placeholder="#{SysCommon.placeholder}"
											   disabled
											   data-th-value="${entity?.prinAmt}" class="layui-input form-input" />
									</div>
								</div>
                                <!-- 3 -->
                                <div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap">到期结算金额</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="mtradeAmt" name="mtradeAmt"
											   data-th-placeholder="#{SysCommon.placeholder}"
											   data-th-value="${entity?.mtradeAmt}" class="layui-input form-input" />
									</div>
								</div>
                           </div>

						<div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin-top: 40px;">
							<div class="text-center">
								<a id="PtlManualRelease003_btn_save"
								   class="layui-btn layui-btn-sm btn-save"
								   data-th-text="#{SysCommon.save}">保存</a> <a
									id="PtlManualRelease003_btn_submit"
									class="layui-btn layui-btn-sm btn-submit"
									data-th-text="#{SysCommon.submit}">提交</a> <a
									id="PtlManualRelease003_btn_cancel"
									class="layui-btn layui-btn-sm btn-cancel"
									data-th-text="#{SysCommon.cancel}">取消</a>
							</div>
						</div>
            </form>
          
        </div>
    </div>
<div layout:fragment="script">
       
      <script data-th-src="@{/js/invest/portfolio/ptlmanualrelease/PtlManualRelease003.js}"></script>
</div>
  </body>
</html>
