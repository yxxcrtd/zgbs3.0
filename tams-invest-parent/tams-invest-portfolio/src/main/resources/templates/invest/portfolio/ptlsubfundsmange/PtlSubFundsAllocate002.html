<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PtlSubFundsAllocate002}">子组合资金调配新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="pro-module-container">
			<form id="basicInfoForm" class="layui-form joyin-form-wrap pro-module-form">
			<input id="tradeId" name="tradeId" data-th-value="${entity?.tradeId}" type="hidden" />
			<input type="hidden" id="wfId" name="wfId" data-th-value="${wfId}">
			<input type="hidden" id="parentPortfolioId" name="parentPortfolioId" data-th-value="${parentPortfolioId}">
			<input type="hidden" id="portfolioId2" name="portfolioId2" data-th-value="${portfolioId2}">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">交易数据</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{PtlSubFundsAllocate001.portfolioId}">组合代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <select required id="portfolioId"
												name="portfolioId" class="layui-input form-input input-select" data-th-initValue="${entity?.portfolioId}" placeholder="请选择" formatoption=false
												data-th-data-url="@{/invest/portfolio/ptlsubfundsmange/PtlSubFundsAllocate002/getPortfolioId}">
											</select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap" data-th-text="#{PtlSubFundsAllocate001.portfolioName}">组合名称</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="portfolioName" name="portfolioName" class="layui-input form-input" data-th-placeholder="#{SysCommon.placeholder}"
															   data-th-value="${entity?.portfolioName}" disabled/>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap" data-th-text="#{PtlSubFundsAllocate001.settleDate}">调配日期</label>
											<div class="layui-input-inline input-inline">
												<input type="text" id="settleDate" name="settleDate" class="layui-input form-input input-dateSelect" placeholder="请选择调配日期"
													data-th-value="${sysDate}" data-th-placeholder="#{SysCommon.placeholder}" disabled/>
											</div>
									</div>
                                </div>
						</div>

					</div>
				</div>
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title"><span class="title-des">资金调配明细</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
						<div class="pro-module-item">
							<table class="layui-table" id="dataTable"></table>
						</div>
					</div>
				</div>
            </div>
			</form>
                <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
                    <div class="text-center">
                        <a id="PtlSubFundsAllocate002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                        <a id="PtlSubFundsAllocate002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="PtlSubFundsAllocate002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
         </div>
    </div>
    <div layout:fragment="script">
    	<script data-th-inline="javascript" type="text/javascript">
		    var secDto = /*[[${secDto}]]*/'';
		    var funDto = /*[[${funDto}]]*/'';
		    var set = /*[[${set}]]*/'';
		    var selectOptDto = /*[[${selectOptDto}]]*/'';
		    var map1 = /*[[${map1}]]*/'';
		    var userIdList = /*[[${userIdList}]]*/'';
		    var profitType01 = /*[[${profitType01}]]*/'';
		    var profitType02 = /*[[${profitType02}]]*/'';
		    var profitType03 = /*[[${profitType03}]]*/'';
		</script>
    	<script data-th-src="@{/js/invest/portfolio/ptlsubfundsmange/PtlSubFundsAllocate002.js}">
    	</script>
    </div>
</body>
</html>
