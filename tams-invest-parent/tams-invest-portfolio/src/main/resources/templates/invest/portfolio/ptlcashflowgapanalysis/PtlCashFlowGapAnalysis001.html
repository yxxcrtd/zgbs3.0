<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PtlCashFlowGapAnalysis001}">现金流缺口分析</title>
</head>
<body>
<div layout:fragment="content">
	<div class="layui-tab layui-tab-brief" lay-filter="docDemoTabBrief">
	  <ul class="layui-tab-title cash-table-wrap">
		<li class="layui-this">现金流明细</li>
		<li>现金流汇总</li>
	  </ul>
	  <div class="layui-tab-content" style="height: 100px;">
		<div class="layui-tab-item layui-show">
			<div class='layui-fluid'>
				<div class="layui-col-md12 form-button-area export_detail"></div>
				<div class='joyin-form-wrap joyin-filter-form condition-area curr-form detail-form-wrap'>
					<form class="layui-form" id="searchForm"> 
						<div class="layui-form-item">
							<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
								<label class="layui-form-label form-lable">组合代码</label>
								<div class="layui-input-inline input-inline">
									<select type="text" id="portfolioId" name="portfolioId" 
										class="layui-input form-input input-select" placeholder="请输入内容" 
										data-th-placeholder="#{SysCommon.placeholder}" multiple="true"
									    data-th-data-url="@{/invest/portfolio/ptlcashflowgapanalysis/PtlCashFlowGapAnalysis001/getPortfolioId}">
									 </select>
								</div>
							</div>

							<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
								<label class="layui-form-label form-lable">资金账户</label>
								<div class="layui-input-inline input-inline">
									<select type="text" id="fundAccount" name="fundAccount"
											class="layui-input form-input input-select" multiple="true" 
											data-th-data-url="@{/invest/portfolio/ptlcashflowgapanalysis/PtlCashFlowGapAnalysis001/getFundAccount}"
											placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
									</select>
								</div>
							</div>
							<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
								<label class="layui-form-label form-lable">现金流发生日<i class="iconfont must" style="display: inline;">*</i></label>
								<div class="layui-input-inline input-inline">
									<input  type="text" id="searchDate" name="searchDate" 
											class="layui-input form-input input-dateRangeSelect" data-th-value="${platDate}"
											placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
								</div>
							</div>
						</div>

						<div class="layui-form-item">
							<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
								<label class="layui-form-label form-lable" > 金额显示精度 
								<i class="iconfont must" style="display: inline;">*</i>
								</label>
								<div class="layui-input-inline input-inline">
									<select id="displayAccuracy" name="displayAccuracy"
										class="layui-input form-input input-select"
										data-th-formatoption="true" allowClear="false"
										data-th-data-result="${AMOUNT_DISPLAY_ACCURACY}"
										placeholder="请输入内容" data-th-initValue="${entity?.displayAccuracy}">
									</select>
								</div>
							</div>
							<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
								<label class="layui-form-label form-lable">币种</label>
								<div class="layui-input-inline input-inline">
									<select type="text" id="ccy" name="ccy" class="layui-input form-input input-select"
											 placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" 
											 data-th-data-result='${CCY}' th:initValue="${CCY_default}" allowClear="true" >
									</select>
								</div>
							</div> 
                            <!--  add by wangyang1 【吉林银行】 增加 产品经理  2019年9月29日 start -->
                            <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4" id="div_prodManager">
                                <label class="layui-form-label form-lable">产品经理</label>
                                <div class="layui-input-inline input-inline">
                                   <!--  <input type="text" name="prodManager"
                                        id="prodManager"
                                        class="layui-input form-input input-lenovoselect" maxlength=60
                                        data-th-placeholder="#{SysCommon.placeholder}"
                                        data-th-data-url="@{/invest/product/common/getUserName}"> -->
                                    <select type="text" name="prodManager" id="prodManager"
                                        class="layui-input form-input input-select" maxlength=60
                                        data-th-placeholder="#{SysCommon.placeholder}"
                                        data-th-data-url="@{/invest/product/common/getUserName}">
                                    </select>   
                                </div>
                            </div>
                            <!--  add by wangyang1 【吉林银行】 增加 产品经理 end --> 
						</div>
						<div class="layui-form-item">
							<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
								<label class="layui-form-label form-lable">类型</label>
								<div class="layui-input-inline input-inline">
									<select type="text" id="cashType" name="cashType" class="layui-input form-input input-select"
											placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  multiple="true"
											data-th-data-result='${FINPROD_TYPE_TG}'  allowClear="true">
									</select>
								</div>
							</div>
							<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
								<label class="layui-form-label form-lable">交易方向</label>
								<div class="layui-input-inline input-inline">
									<select type="text" id="ps" name="ps" class="layui-input form-input input-select"
											placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"  multiple="true"
											data-th-data-result='${PS}'  allowClear="true">
									</select>
								</div>
							</div>
							<!--  add by swwan 【重庆银行】 增加 组合系列 start -->
							<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
								<label class="layui-form-label form-label-wrap">组合系列</label>
								<div class="layui-input-inline input-inline">
									<select id="portfolioSeries" name="portfolioSeries"
											class="layui-input form-input input-select" placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}" multiple="true"
											data-th-data-result="${PORTFOLIO_SERIES}" allowClear="true">
									</select>
								</div>
							</div>
							<!--  add by swwan 【重庆银行】 增加 组合系列 end -->
						</div>
					</form>
				</div>
				<div>
					<table class="layui-table" id="dataTable"></table>
				</div>
			</div>
		</div>
		
		<!-- 现金流汇总查询 -->
		<div class="layui-tab-item">
			<div class='layui-fluid'>
				<div class="layui-col-md12 form-button-area export_total"></div>
				<div class='joyin-form-wrap joyin-filter-form condition-area curr-form total-form-wrap'>
					<form class="layui-form" id="searchForm1">
						<div class="layui-form-item">
							<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
								<label class="layui-form-label form-lable">组合代码</label>
								<div class="layui-input-inline input-inline">
									<select type="text" id="portfolioId1" name="portfolioId1" multiple="true"
										class="layui-input form-input input-select" placeholder="请输入内容" 
										data-th-placeholder="#{SysCommon.placeholder}"
									    data-th-data-url="@{/invest/portfolio/ptlcashflowgapanalysis/PtlCashFlowGapAnalysis001/getPortfolioId}">
									 </select>
								</div>
							</div>
							<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
								<label class="layui-form-label form-lable">资金账户</label>
								<div class="layui-input-inline input-inline">
									<select type="text" id="fundAccount1" name="fundAccount1"
											class="layui-input form-input input-select" allowClear="true"
											data-th-data-url="@{/invest/portfolio/ptlcashflowgapanalysis/PtlCashFlowGapAnalysis001/getFundAccount}"
											placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" >
									</select>
								</div>
							</div>
							<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
								<label class="layui-form-label form-lable">现金流发生日
								<i class="iconfont must" style="display: inline;">*</i></label>
								<div class="layui-input-inline input-inline">
									<input  type="text" id="searchDate1" name="searchDate1"
											class="layui-input form-input input-dateRangeSelect"  data-th-value="${platDate}"
											placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
								</div>
							</div>
						</div>
						<div class="layui-form-item">
							<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
									<label class="layui-form-label form-lable">汇总维度
									<i class="iconfont must" style="display: inline;">*</i></label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="aggregDimension" name="aggregDimension" 
												class="layui-input form-input input-select" placeholder="请输入内容" 
												data-th-placeholder="#{SysCommon.placeholder}" allowClear="false">
											<option value="01">日期</option>
											<option value="02">期限结构</option>
										</select>
									</div>
							</div>
							<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
								<label class="layui-form-label form-lable">币种
								<i class="iconfont must" style="display: inline;">*</i></label>
								<div class="layui-input-inline input-inline">
									<select type="text" id="ccy1" name="ccy1" class="layui-input form-input input-select"
											 placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" 
											 data-th-data-result='${CCY}' th:initValue="${CCY_default}" data-th-initValue=${entity?.ccy} 
											 allowClear="false" required >
									</select>
								</div>
							</div>
							<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
								<label class="layui-form-label form-lable" > 金额显示精度 
								<i class="iconfont must" style="display: inline;">*</i></label>
								<div class="layui-input-inline input-inline">
									<select type="text" id="displayAccuracy1" name="displayAccuracy1"
										class="layui-input form-input input-select"
										data-th-formatoption="true" allowClear="false"
										data-th-data-result="${AMOUNT_DISPLAY_ACCURACY}"
										placeholder="请输入内容" data-th-initValue="${entity?.displayAccuracy}">
									</select>
								</div>
							</div>
						</div>
                        <div class="layui-form-item">
                             <!--  add by wangyang1 【吉林银行】 增加 产品经理  2019年9月29日 start -->
                            <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4" id="div_prodManager">
                                <label class="layui-form-label form-lable">产品经理</label>
                                <div class="layui-input-inline input-inline">
                                    <!-- <input type="text" name="prodManager"
                                        id="prodManager"
                                        class="layui-input form-input input-lenovoselect" maxlength=60
                                        data-th-placeholder="#{SysCommon.placeholder}"
                                        data-th-data-url="@{/invest/product/common/getUserName}"> -->
                                     <select type="text" name="prodManager1" id="prodManager1"
                                        class="layui-input form-input input-select" maxlength=60
                                        data-th-placeholder="#{SysCommon.placeholder}"
                                        data-th-data-url="@{/invest/product/common/getUserName}">
                                    </select>    
                                </div>
                            </div>
                            <!--  add by wangyang1 【吉林银行】 增加 产品经理 end -->
							<!--  add by swwan 【重庆银行】 增加 组合系列 start -->
							<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
								<label class="layui-form-label form-label-wrap">组合系列</label>
								<div class="layui-input-inline input-inline">
									<select id="portfolioSeries1" name="portfolioSeries1"
											class="layui-input form-input input-select" placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}" multiple="true"
											data-th-data-result="${PORTFOLIO_SERIES}" allowClear="true">
									</select>
								</div>
							</div>
							<!--  add by swwan 【重庆银行】 增加 组合系列 end -->
                        </div>
					</form>
				</div>
				<div class="total-table" style="display: block;">
					<table class="layui-table" id="dataTable1"></table>
				</div>
			</div>
		</div>
	  </div>
	</div>
</div>
	<div layout:fragment="script">
		<style>
	        .cash-table-wrap .layui-this{
	            color: #6d9ed9!important;
	        }
	        .cash-table-wrap .layui-this:after{
	            border-bottom: 2px solid #6d9ed9!important;
	        }
	        .detail-table .layui-table-view,.total-table .layui-table-view{
	            height: 440px!important;
	        }
	        .detail-table .layui-table-view .layui-table-box .layui-table-body,.total-table .layui-table-view .layui-table-box .layui-table-body{
	            height: 355px!important;
	        }
	    </style>
		<script data-th-inline="javascript" type="text/javascript">
			var sysDate = /*[[${sysDate}]]*/'';
		</script>
		<script data-th-src="@{/js/invest/portfolio/ptlcashflowgapanalysis/PtlCashFlowGapAnalysis001.js}"></script>
	</div>
</body>
</html>
