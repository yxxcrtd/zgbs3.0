<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{PtlSubFundsMange001}">子组合资金管理</title>
</head>
<body>
</body>
<div layout:fragment="content">
	<div class="layui-col-md12">
		<div class="layui-tab layui-tab-card" lay-filter="tabContainer">
			<ul class="layui-tab-title">
				<li id="accountDetails-title" class="layui-this">子组合资金调配</li>
				<li id="specialAssets-title">产品交易资金分配</li>
			</ul>
			<div class="layui-tab-content" style="padding: 0">
				<div class="layui-tab-item layui-show">
					<div class="layui-col-md12" style="margin: 10px 10px">
						<button type="button" class="layui-btn layui-btn-sm btn-filter"
							id="PtlSubFundsAllocate001_btn_filter">筛选</button>
						<button type="button" class="layui-btn layui-btn-sm btn-create"
							id="PtlSubFundsAllocate001_btn_add">资金调配新建</button>
						<button type="button" class="layui-btn layui-btn-sm btn-export"
							id="PtlSubFundsAllocate001_btn_export">导出</button>
					</div>
					<div class="layui-col-md12" id="c_fundsAllocateForm"
						style="background-color: #f5f5f5;">
						<form class="layui-form layui-col-md11" id="fundsAllocateForm">
							<div class="layui-form-item">
								<div class="layui-inline layui-col-md4">
									<label class="layui-form-label form-lable"
										data-th-text="#{PtlSubFundsAllocate001.portfolioId}">
										组合代码</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="portfolioId"
											name="portfolioId"
											class="layui-input form-input input-select" placeholder="请选择"
											multiple="true"
											data-th-data-url="@{/invest/portfolio/ptlsubfundsmange/PtlSubFundsMange001/getPortfolioId}">
										</select>
									</div>
								</div>
								<div class="layui-inline layui-col-md4">
									<label class="layui-form-label form-lable"
										data-th-text="#{PtlSubFundsAllocate001.subPortfolioId}">
										子组合代码 </label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="subPortfolioId"
											name="subPortfolioId"
											class="layui-input form-input input-select" placeholder="请选择"
											multiple="true"
											data-th-data-url="@{/invest/portfolio/ptlsubfundsmange/PtlSubFundsMange001/getSubPortfolioId}">
										</select>
									</div>
								</div>
								<div class="layui-inline layui-col-md4">
									<label class="layui-form-label form-lable"
										data-th-text="#{PtlSubFundsAllocate001.settleDate}">
										调配日期</label>
									<div class="layui-input-inline input-inline">
										<input id="settleDate" name="settleDate"
											class="layui-input form-input input-dateRangeSelect"
											placeholder="请输入日期">
									</div>
								</div>
							</div>
						</form>
						<div class="layui-col-md1">
							<div class="layui-form-item">
								<button type="button" class="layui-btn layui-btn-sm btn-search"
									id="PtlSubFundsAllocate001_btn_search">查询</button>
							</div>
						</div>
					</div>
					<table class="layui-table" id="fundsAllocate-table"></table>
				</div>
				<div class="layui-tab-item">
					<div class="layui-col-md12" style="margin: 10px 10px">
						<button type="button" class="layui-btn layui-btn-sm btn-filter"
							id="PtlSubFundsMange001_btn_filter">筛选</button>
						<button type="button" class="layui-btn layui-btn-sm btn-create"
							id="PtlSubFundsMange001_btn_add">资金分配</button>
						<button type="button" class="layui-btn layui-btn-sm btn-export"
							id="PtlSubFundsMange001_btn_export">导出</button>
					</div>
					<div class="layui-col-md12" id="c_incomeStatisticsForm"
						style="background-color: #f5f5f5;">
						<form class="layui-form layui-col-md11" id="incomeStatisticsForm">
							<div class="layui-form-item">
								<div
									class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
									<label class="layui-form-label form-lable"
										data-th-text="#{FinProductBuild001.prodId}">产品代码</label>
									<div class="layui-input-inline input-inline">
										<select type="text" name="prodId" id="prodId"
											class="layui-input form-input input-select" allowClear="true"
											placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}"
											formatoption=true multiple="true"
											data-th-data-url="@{/invest/portfolio/ptlsubfundsmange/PtlSubFundsMange001/queryProdIdInfo}">
										</select>
									</div>
								</div>
								<!-- <div
									class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
									<label class="layui-form-label form-lable">产品名称</label>
									<div class="layui-input-inline input-inline">
										<select type="text" name="prodName" id="prodName"
											class="layui-input form-input input-select" allowClear="true"
											placeholder="请输入内容"
											data-th-placeholder="#{SysCommon.placeholder}"
											formatoption=true multiple="true"
											data-th-data-url="@{/invest/portfolio/ptlsubfundsmange/PtlSubFundsMange001/queryProdNameInfo}">
										</select>
									</div>
								</div> -->
								<div
									class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
									<label class="layui-form-label form-lable">交易日</label>
									<div class="layui-input-inline input-inline">
										<input class="layui-input form-input input-dateRangeSelect"
											id="vdate" name="vdate" placeholder="请选择时间区间">
									</div>
								</div>
								
								<div class="layui-inline layui-col-md4">
									<label class="layui-form-label form-lable">分配状态</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="distributionstatus"
											name="distributionstatus" placeholder="请选择"
											data-th-data-result="${DISTRIBUTION_STATUS}"
											class="layui-input form-input input-select"></select>
									</div>
								</div>

							</div>
							<!-- <div class="layui-form-item">
								<div class="layui-inline layui-col-md4">
									<label class="layui-form-label form-lable">分配状态 <i
										class="iconfont must"> * </i>
									</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="distributionstatus"
											name="distributionstatus" placeholder="请选择"
											data-th-data-result="${DISTRIBUTION_STATUS}"
											data-th-required="true"
											class="layui-input form-input input-select"></select>
									</div>
								</div>
							</div> -->
						</form>
						<div class="layui-col-md1">
							<div class="layui-form-item">
								<button type="button" class="layui-btn layui-btn-sm btn-search"
									id="PtlSubFundsMange001_btn_search">查询</button>
							</div>
							<div class="layui-form-item">
								<button type="button"
									class="layui-btn layui-btn-sm btn-default btn-reset"
									id="PtlSubFundsMange001_btn_reset">重置</button>
							</div>
						</div>
					</div>
					<table class="layui-table" id="incomeStatistics-table"></table>
				</div>
			</div>
		</div>
	</div>
</div>
</div>
<div layout:fragment="script">
	<script
		data-th-src="@{/js/invest/portfolio/ptlsubfundsmange/PtlSubFundsMange001.js}"
		type="text/javascript"></script>
</div>
</html>
