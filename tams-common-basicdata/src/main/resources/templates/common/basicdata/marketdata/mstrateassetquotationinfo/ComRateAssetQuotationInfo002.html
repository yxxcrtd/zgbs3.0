<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
<title>项目类/计划类利率型估值行情</title>
</head>
<body>
    <div layout:fragment="content">
        <style>
            .mst-lable{
                width: 20%;
            }
        </style>
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
                <div class="layui-form-item" style="display: none">
                    <label class="layui-form-label form-lable mst-lable">收益类型</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="profitType" name="profitType"
                                class="layui-input form-input input-checkbox" placeholder="请输入内容"
                                data-th-data-result="${PROFIT_TYPE}"
                                data-th-initValue="${entity?.profitType == null ? '02' : entity?.profitType}">
                    </div>
                </div>
                <div class="layui-form-item">
                    <input type="text" id="finprodId" name="finprodId" class="layui-input form-input"
                           data-th-value="${entity?.finprodId}" style="display: none">
                    <input type="text" id="finprodType2" name="finprodType2" class="layui-input form-input"
                           data-th-value="${entity?.finprodType2}" style="display: none">
                    <input type="text" id="finprodType" name="finprodType" class="layui-input form-input"
                           data-th-value="${entity?.finprodType}" style="display: none">
                    <label class="layui-form-label form-lable mst-lable">资产代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="finProdMarketId" name="finProdMarketId"
                               class="layui-input form-input input-select" placeholder="请输入内容"
                               data-th-data-url="@{/common/basicdata/marketdata/mstrateassetquotationinfo/ComRateAssetQuotationInfo002/getAssetCodeList}"
                               required="required" data-th-initValue="${entity?.finProdMarketId}">
                          </select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label form-lable mst-lable">资产简称</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="finProdName" name="finProdName" required="required"
                               class="layui-input form-input" data-th-value="${entity?.finProdName}"
                               data-th-placeholder="#{SysCommon.placeholder}" disabled>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label form-lable mst-lable">估值日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="valDate" name="valDate" required="required"
                               class="layui-input form-input input-dateSelect"
                               data-th-value='${#dates.format(entity?.valDate,"yyyy-MM-dd")}'
                               placeholder="请输入日期" data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label form-lable mst-lable">估值来源</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="valueSource" name="valueSource" data-th-data-result='${VALUATION_SOURCE}'
                                data-th-initValue="${entity?.valueSource}" required
                                class="layui-input form-input input-select" allowClear="true"
                                placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"></select>
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label form-lable mst-lable" >全价估值(每百元）</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="fullValuation" name="fullValuation" required="required"
                               data-pattern="" data-fixtype="2" data-textrange="4" maxlength="30"
                               class="layui-input form-input text-number"
                               data-th-value="${entity?.fullValuation}" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label form-lable mst-lable" >净价估值（每百元）</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="valuation" name="valuation" required="required"
                               data-pattern="" data-fixtype="2" data-textrange="4" maxlength="30"
                               class="layui-input form-input text-number"
                               data-th-value="${entity?.valuation}" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>

                <div class="layui-form-item">
                    <label class="layui-form-label form-lable mst-lable">备注</label>
                    <div class="layui-input-inline input-inline">
                            <textarea id="remark" name="remark" th:value="${remark}" data-th-text="${entity?.remark}"
                            class="layui-textarea" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"></textarea>
                    </div>
                </div>
            </form>
            <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="position: fixed;bottom: 30px;">
                <div class="text-center">
                    <a id="ComRateAssetQuotationInfo002_btn_save" class="layui-btn layui-btn-sm btn-save"
                       data-th-text="#{SysCommon.save}">保存</a>
                    <a id="ComRateAssetQuotationInfo002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                       data-th-text="#{SysCommon.submit}">提交</a>
                    <a id="ComRateAssetQuotationInfo002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                       data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/common/basicdata/marketdata/mstrateassetquotationinfo/ComRateAssetQuotationInfo002.js}"
            type="text/javascript"></script>
        <script data-th-inline="javascript" type="text/javascript">
            var getManagerAndName = /*[[@{/invest/basicdata/mstnetassetquotationinfo/MstRateAssetQuotationInfo002/getManagerAndName}]]*/'';
            //var finprodId = /*[[@{finprodId}]]*/'';
        </script>
    </div>
</body>
</html>
