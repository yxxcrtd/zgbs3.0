<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>利率互换行情信息</title>
    <style>
        .ptl-table .layui-table-view{
            height: 360px!important;
        }
        .ptl-table .layui-table-body{
            height: 405px!important;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area" >
        <a class="layui-btn layui-btn-sm" id="ComRateSwapInformation001_btn_add">新建</a>
        <a id="ComRateSwapInformation001_btn_import" class="layui-btn layui-btn-sm btn-import">
            <i class="iconfont icon-import"></i><span data-th-text="#{SysCommon.import}">导入</span></a>
        <a class="layui-btn layui-btn-sm" id="ComRateSwapInformation001_btn_edit">编辑</a>
        <a class="layui-btn layui-btn-sm" id="ComRateSwapInformation001_btn_del">删除</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form"  id="searchForm" >
            <div class="layui-form-item">
                <select  type="hidden" id="termTypeIrs" name="termTypeIrs" data-th-data-result='${TERM_TYPE_IRS}'></select>
                <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable">品种</label>
	                    <div class="layui-input-inline input-inline">
                            <select id="curveCode"
                                    formatoption=false
                                    name="curveCode"
                                    allowClear="true"
                                    class="layui-input form-input input-select"
                                    data-th-data-url="@{/common/basicdata/marketdata/rateswapinformation/ComRateSwapInformation002/getCurveType}"
                                    placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    required>
                            </select>
	                        <!--<select id="curveCode" name="curveCode" class="layui-input form-input input-select"-->
	                                <!--data-th-data-url="@{/common/basicdata/marketdata/rateswapinformation/ComRateSwapInformation002/getCurveType}"-->
	                                <!--th:allowClear="true" th:placeholder="请输入内容" searchable="false"-->
	                                <!--data-th-placeholder="#{SysCommon.placeholder}" data-th-initvalue='${curveCode}' formatoption="false" required="required">-->
	                        <!--</select>-->
	                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable">日期</label>
                    <div class="layui-input-inline input-inline">
                        <input class="layui-input form-input input-dateSelect" id="curveDate" name="curveDate" placeholder="请选择日期" required="required">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div style="height: 500px;overflow:auto" >
        <div id="main" style="width: 100%;height:400px;"></div>
        <div class="ptl-table1">
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/common/basicdata/marketdata/rateswapinformation/ComRateSwapInformation001.js}" type="text/javascript"></script>
</div>
</body>

</html>
