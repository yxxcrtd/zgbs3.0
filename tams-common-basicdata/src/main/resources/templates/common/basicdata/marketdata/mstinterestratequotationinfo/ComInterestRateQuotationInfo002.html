<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ComInterestRateQuotationInfo002}">基准利率信息</title>
</head>
<body>
    <div layout:fragment="content">
        <style>
            .mst-lable{
                width: 20%;
            }
        </style>
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable"
                               data-th-text="#{ComInterestRateQuotationInfo002.relaeseDate}">发布日</label>
                        <div class="layui-input-inline input-inline">
                            <input id="relaeseDate" name="relaeseDate"
                                   class="layui-input form-input input-dateSelect" required="required"
                                   data-th-value='${#dates.format(entity?.relaeseDate,"yyyy-MM-dd")}'
                                   data-th-data-result='${COMMON_BUSINESS_TYPE}' placeholder="请选择时间">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable"
                               data-th-text="#{ComInterestRateQuotationInfo002.intRateName}">利率名称</label>
                        <div class="layui-input-inline input-inline">
                            <input id="intRateId" name="intRateId"
                                   class="layui-input form-input input-select" required="required"
                                   placeholder="请输入内容" data-th-value="${entity?.intRateId}"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-result='${SECRATE_DATA}' formatoption=true>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable"
                               data-th-text="#{ComInterestRateQuotationInfo002.ccy}">币种</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="ccy" name="ccy"
                                   class="layui-input form-input input-select" required="required"
                                   data-th-data-result='${CCY}' placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-initValue="*{entity?.ccy?:CCY_default}" formatoption=true>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable"
                               data-th-text="#{ComInterestRateQuotationInfo002.intRate}">利率值%</label>
                        <div class="layui-input-inline input-inline">
                            <input id="intRate" name="intRate"
                                   class="layui-input form-input text-number" data-textrange="4"
                                   data-th-value="${entity?.intRate}" maxLength="30" required="required"
                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable"
                               data-th-text="#{ComInterestRateQuotationInfo002.effDate}">生效日</label>
                        <div class="layui-input-inline input-inline">
                            <input id="effDate" name="effDate"
                                   class="layui-input form-input input-dateSelect" required="required"
                                   data-th-value='${#dates.format(entity?.effDate,"yyyy-MM-dd")}'
                                   data-th-data-result='${COMMON_BUSINESS_TYPE}' placeholder="请选择时间">
                        </div>
                    </div>
                </div>
            </form>
            <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="position: fixed;bottom: 30px;">
                <div class="text-center">
                    <a id="ComInterestRateQuotationInfo002_btn_save" class="layui-btn layui-btn-sm btn-save"
                       data-th-text="#{SysCommon.save}">保存</a>
                    <a id="ComInterestRateQuotationInfo002_btn_submit"
                       class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                    <a id="ComInterestRateQuotationInfo002_btn_cancel"
                       class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/common/basicdata/marketdata/mstinterestratequotationinfo/ComInterestRateQuotationInfo002.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
