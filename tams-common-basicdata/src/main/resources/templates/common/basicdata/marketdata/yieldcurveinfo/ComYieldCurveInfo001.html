<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<title data-th-text="#{ComYieldCurveInfo001}">收益率曲线信息</title>
</head>
<body>
     <div layout:fragment="content">
         <div class="form-button-area">
            <a id="ComYieldCurveInfo001_btn_add" class="layui-btn layui-btn-sm btn-create">新建</a>
            <a id="ComYieldCurveInfo001_btn_delete" class="layui-btn layui-btn-sm btn-delete">删除</a>
            <a id="ComYieldCurveInfo001_btn_import" class="layui-btn layui-btn-sm " >导入</a>
        </div>
       <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form"  id="submitForm">
            <div class="layui-form-item">
                <!--修改曲线名称、曲线类型下拉框值 modified by lishuping 20191008 start-->
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{ComYieldCurveInfo001.curveName}">曲线名称</label>
                     <div class="layui-input-inline input-inline">
	                 <select type="text" id="curveCode" name="curveCode" class="layui-input form-input input-select"  
		                     placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                             data-th-data-url="@{/common/basicdata/marketdata/yieldcurveinfo/ComYieldCurveInfo001/getCurveName}"
                             allowClear="true"
		                     formatoption = "true">
                        <option></option>
                     </select>
                                   
                    </div>   
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{ComYieldCurveInfo001.curveType}">曲线类型</label>
                    <div class="layui-input-inline input-inline">
                    <select type="text" id="curveType" name="curveType" 
                            class="layui-input form-input input-select" 
                            data-th-data-result='${CURVE_INT_TYPE}' allowClear="true"
                            placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                            formatoption = "true" >
                          <option></option>
                    </select>
                    </div>
                </div>
                <!--修改曲线名称、曲线类型下拉框值 modified by lishuping 20191008 end-->
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{ComYieldCurveInfo001.curveDate}">曲线日期</label>
                    <div class="layui-input-inline input-inline">
                        <input id="curveDate" name="curveDate" 
                               class="layui-input form-input input-dateSelect" 
                               placeholder="请选择时间" >
                    </div>
                </div> 
            </div>
        </form>
        </div>    
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>       
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/common/basicdata/marketdata/yieldcurveinfo/ComYieldCurveInfo001.js}" type="text/javascript"></script>
    </div>                                
</body>

</html>
