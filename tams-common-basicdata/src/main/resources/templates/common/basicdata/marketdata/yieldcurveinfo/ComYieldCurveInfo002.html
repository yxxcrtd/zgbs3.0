<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ComYieldCurveInfo002}">收益率曲线新建</title>
</head>
<body>
    <div layout:fragment="content">
        <style>
            .mst-lable{
                width: 20%;
            }
        </style>
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable"
                               data-th-text="#{ComYieldCurveInfo001.curveName}">曲线名称</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="curveCode" name="curveCode"
                                    class="layui-input form-input input-select"
                                    data-th-data-url="@{/common/basicdata/marketdata/yieldcurveinfo/ComYieldCurveInfo001/getCurveName}"
                                    allowClear="true"
                                    placeholder="请输入内容" data-th-initValue="${entity?.curveCode}"
                                    required="required" data-th-placeholder="#{SysCommon.placeholder}"
                                    formatoption="true">
                                <option></option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable"
                               data-th-text="#{ComYieldCurveInfo001.curveType}">曲线类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="curveType" name="curveType"
                                    class="layui-input form-input input-select"
                                    data-th-data-result='${CURVE_INT_TYPE}' allowClear="true" editable="false"
                                    placeholder="请输入内容" data-th-initValue="${entity?.curveType}"
                                    required="required" data-th-placeholder="#{SysCommon.placeholder}"
                                    formatoption="true" disabled>
                                <option></option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable"
                               data-th-text="#{ComYieldCurveInfo001.keyPoint}">关键年限点</label>
                        <div class="layui-input-inline input-inline">
                            <input id="keyPoint" name="keyPoint" type="text"
                                   class="layui-input form-input text-number" data-fixtype="2"
                                   placeholder="请输入内容" required="required" maxLength="10"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-value="${entity?.keyPoint}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable"
                               data-th-text="#{ComYieldCurveInfo001.yield}">收益率%</label>
                        <div class="layui-input-inline input-inline">
                            <input id="yield" name="yield" type="text" maxLength="16"
                                   class="layui-input form-input text-number" placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}" required="required"
                                   data-th-value="${entity?.yield}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable"
                               data-th-text="#{ComYieldCurveInfo001.curveDate}">曲线日期</label>
                        <div class="layui-input-inline input-inline">
                            <input id="curveDate" name="curveDate"
                                   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}" required="required"
                                   data-th-value="${#dates.format(entity?.curveDate,'yyyy-MM-dd')}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable"
                               data-th-text="#{ComYieldCurveInfo001.N}">N</label>
                        <div class="layui-input-inline input-inline">
                            <input id="n" name="n" class="layui-input form-input text-number" maxLength="16"
                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-value="${entity?.n}" disabled="disabled">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div >
                        <label class="layui-form-label form-lable mst-lable"
                               data-th-text="#{ComYieldCurveInfo001.K}">K</label>
                        <div class="layui-input-inline input-inline">
                            <input id="k" name="k" class="layui-input form-input text-number" maxLength="16"
                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-value="${entity?.k}" disabled="disabled">
                        </div>
                    </div>
                </div>
            </form>
            <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="position: fixed;bottom: 30px;">
                <div class="text-center">
                    <a id="ComYieldCurveInfo002_btn_save" class="layui-btn layui-btn-sm btn-save"
                       data-th-text="#{SysCommon.save}">保存</a>
                    <a id="ComYieldCurveInfo002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                       data-th-text="#{SysCommon.submit}">提交</a>
                    <a id="ComYieldCurveInfo002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                       data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/common/basicdata/marketdata/yieldcurveinfo/ComYieldCurveInfo002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
