<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ComMarketCalendarInfo001}">市场日历信息</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area">
            <a id="ComMarketCalendarInfo001_btn_import" class="layui-btn layui-btn-sm " data-th-text="#{ComMarketCalendarInfo001.import}">导入</a>
            <a id="ComMarketCalendarInfo001_btn_sethday" class="layui-btn layui-btn-sm" style="display: none" data-th-text="#{ComMarketCalendarInfo001.sethday}">设为节假日</a>
            <a id="ComMarketCalendarInfo001_btn_setwday" class="layui-btn layui-btn-sm" style="display: none" data-th-text="#{ComMarketCalendarInfo001.setwday}">设为工作日</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{ComMarketCalendarInfo001.calendarType}">市场日历类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="calendarType" name="calendarType"
                                class="layui-input form-input input-select" allowClear="true" placeholder="请选择市场日历类型" data-th-placeholder="#{SysCommon.placeholder}" multiple=”true” data-th-data-result="${calendarType}" showAll='true'>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{ComMarketCalendarInfo001.Date}">日期</label>
                        <div class="layui-input-inline input-inline">
                            <input id='cdate' name='cdate' class="layui-input form-input input-dateRangeSelect"
                                placeholder="请选择时间区间" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable" data-th-text="#{ComMarketCalendarInfo001.ishDay}">是否节假日</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="ishDay" name="ishDay"
                                class="layui-input form-input input-select select2-hidden-accessible" allowclear="true"
                                placeholder="请选择节假日标志" data-th-placeholder="#{SysCommon.placeholder}" aria-hidden="true" data-th-data-result="${YES_OR_NO}" formatoption = "true">
                                </select>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script th:inline="javascript" type="text/javascript">
        	var yes = /*[[${_yes}]]*/'';
            var no = /*[[${_no}]]*/'';
        </script>
        <script data-th-src="@{/js/common/basicdata/marketdata/mstmarketcalendarinfo/ComMarketCalendarInfo001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
