<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>每日债券行情</title>
</head>
<body>
	<div layout:fragment="content">
		<div class="form-button-area">
			<a id="ComBondMarketInfo001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
			<a id="ComBondMarketInfo001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}">删除</a>
			<a id="ComBondMarketInfo001_btn_import" class="layui-btn layui-btn-sm " >导入</a>
		</div>
		<div class="joyin-form-wrap joyin-filter-form condition-area">
			<form class="layui-form" id="searchForm">
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">资产代码</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="finprodId" name="finprodId"
								class="layui-input form-input" value="" placeholder="请输入内容">
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">债券简称</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="finprodAbbr" name="finprodAbbr"
								class="layui-input form-input" value="" placeholder="请输入内容">
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">估值日</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="valueDate" name="valueDate"
								placeholder="请选择、支持区间"
								class="layui-input form-input input-dateRangeSelect"
								allowClear="true">
						</div>
					</div>
				</div>

                            <input id="valueSource" name="valueSource"

                                placeholder="请选择"

                        <div class="layui-input-inline input-inline">
                            <input type="text" id="valueDate" name="valueDate"
                                placeholder="请输入内容"
                                class="layui-input form-input input-dateRangeSelect"
                                allowClear="true">
                        </div>
                    </div>
                </div> -->

						</div>
					</div>
				</div> -->
			</form>
		</div>
		<table class="layui-table" id="dataTable"></table>
	</div>
</body>
<div layout:fragment="script">
	<script
		data-th-src="@{/js/common/basicdata/marketdata/bond/ComBondMarketInfo001.js}"
