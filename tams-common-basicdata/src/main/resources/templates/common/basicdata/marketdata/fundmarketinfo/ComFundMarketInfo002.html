<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>每日基金行情新建</title>
</head>
<body>
<div layout:fragment="content">
    <div>
        <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"> <span class="title-des">基本信息</span> （<span class="star-sign">*</span>必填）
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">基金代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="finprodId" name="finprodId"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                data-th-data-url="@{/common/basicdata/marketdata/fundmarketinfo/ComFundMarketInfo002/getFinProductList}"
                                                required="required" data-th-initValue="${entity?.finprodId}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">基金名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" readonly="readonly" id="fundName" name="fundName"
                                               class="layui-input form-input" data-th-value='${entity?.fundName}'
                                               placeholder="请输入内容" required disabled>
                                    </div>
                                </div>
<!--                                <div class="form-inline-wrap">-->
<!--                                    <label class="layui-form-label form-lable">基金类型</label>-->
<!--                                    <div class="layui-input-inline input-inline">-->
<!--                                        <input type="text" id="fundType" name="fundType"-->
<!--                                               class="layui-input form-input" placeholder="请输入内容"-->
<!--                                               data-th-placeholder="#{SysCommon.placeholder}" required-->
<!--                                               data-th-value='${entity?.fundType}'>-->
<!--                                    </div>-->
<!--                                </div>-->

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">基金类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="fundType" name="fundType" class="layui-input form-input input-select" disabled
                                                data-th-data-result="${FUND_TYPE}" allowClear="true" required placeholder="请选择"
                                                data-th-initValue="${entity?.fundType}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">估值日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="valueDate" name="valueDate"
                                               class="layui-input form-input input-dateSelect"
                                               data-th-value='${entity?.valueDate}'
                                               placeholder="请输入内容" required>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">收盘价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="closePrice" name="closePrice" class="layui-input form-input text-number"
                                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                               required data-th-value='${entity?.closePrice}' data-textrange="3" maxlength="11">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">平均价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="averagePrice" name="averagePrice" required
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${entity?.averagePrice}' data-textrange="3" maxlength="11">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">最高价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="maxPrice" name="maxPrice" required
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${entity?.maxPrice}' data-textrange="3" maxlength="11">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">最低价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="minPrice" name="minPrice" required
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${entity?.minPrice}' data-textrange="3" maxlength="11">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">买一价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="buyOnePrice" name="buyOnePrice" required
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${entity?.buyOnePrice}' data-textrange="3" maxlength="11">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">卖一价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="sellOnePrice" name="sellOnePrice" required
                                               class="layui-input form-input text-number"
                                               data-th-value='${entity?.sellOnePrice}' placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" data-textrange="3" maxlength="11">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        <div class="layui-form-item">
            <div align="center" style="height:50px;padding-top: 10px;">
                <a id="ComFundMarketInfo002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                <a id="ComFundMarketInfo002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="ComFundMarketInfo002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/common/basicdata/marketdata/market/ComFundMarketInfo002.js}" type="text/javascript"></script>
</div>
</body>
</html>
