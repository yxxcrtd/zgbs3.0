<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ComNetAssetQuotationInfo001}">计划类（净值型）资产估值行情信息</title>
</head>
<body>
    <div layout:fragment="content">
        <div class='layui-fluid'>
            <div class="layui-col-md12 layui-col-sm12 layui-col-lg12 layui-col-xs12 form-button-area" style="margin: 10px;">
                <a id="ComNetAssetQuotationInfo001_btn_add" class="layui-btn layui-btn-sm btn-create"
                    data-th-text="#{SysCommon.create}">新建</a>
                <a id="ComNetAssetQuotationInfo001_btn_import" class="layui-btn layui-btn-sm btn-import">
                    <i class="iconfont icon-import"></i><span data-th-text="#{SysCommon.import}">导入</span></a>
                <a id="ComNetAssetQuotationInfo001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
                    data-th-text="#{SysCommon.delete}" style="display: none;">删除</a>
            </div>
            <div class='joyin-form-wrap joyin-filter-form condition-area'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{ComNetAssetQuotationInfo001.assetCode}">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="finProdMarketId" name="finProdMarketId" class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                             data-th-data-url="@{/common/basicdata/marketdata/mstnetassetquotationinfo/ComNetAssetQuotationInfo001/getAssetCode}"
                             data-idfield="code" data-keyfield="code" data-th-data-effectivefieldsalias='|{"code":"#{ComNetAssetQuotationInfo001.assetCode}",
                             "shortName":"#{ComNetAssetQuotationInfo001.assetName}"}|' data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{ComNetAssetQuotationInfo001.valuationDate}">估值日期</label>
                        <div class="layui-input-inline input-inline">
                            <input id="valDate" name="valDate" class="layui-input form-input input-dateSelect" placeholder="请选择时间" 
                            data-th-value="${valDate}" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable" data-th-text="#{ComNetAssetQuotationInfo001.assetName}">资产名称</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="finProdName" name="finProdName" class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                             data-th-data-url="@{/common/basicdata/marketdata/mstnetassetquotationinfo/ComNetAssetQuotationInfo001/getAssetName}"
                             data-idfield="shortName" data-keyfield="shortName" data-th-data-effectivefieldsalias='|{"code":"#{ComNetAssetQuotationInfo001.assetCode}",
                             "shortName":"#{ComNetAssetQuotationInfo001.assetName}"}|' data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
            </form>
            </div>           
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/common/basicdata/marketdata/mstnetassetquotationinfo/ComNetAssetQuotationInfo001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
