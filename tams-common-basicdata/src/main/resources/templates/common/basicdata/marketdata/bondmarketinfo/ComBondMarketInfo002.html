<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>每日债券行情新建</title>
</head>
<body>
<div layout:fragment="content">
    <div>
        <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"> <span class="title-des">基本信息</span> （<span class="star-sign">*</span>必填）
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">债券代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="finprodId" name="finprodId"
                                                class="layui-input form-input input-select" placeholder="请输入内容" th:formatoption="false"
                                                data-th-data-url="@{/common/basicdata/marketdata/bondmarketinfo/ComBondMarketInfo002/getFinProductList}"
                                                required="required" data-th-initValue="${entity?.finprodId}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">债券简称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" readonly="readonly" id="finprodAbbr" name="finprodAbbr"
                                               class="layui-input form-input" data-th-value='${entity?.finprodAbbr}'
                                               placeholder="请输入内容" required disabled>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">估值日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="valueDate" name="valueDate"
                                               class="layui-input form-input input-dateSelect"
                                               data-th-value='${entity?.valueDate}'
                                               placeholder="请输入内容" required>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
<!--                                 <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">剩余期限</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="lastPeriod" name="lastPeriod"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${entity?.lastPeriod}' data-textrange="3" maxlength="11">
                                    </div>
                                </div> -->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">收盘价净价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="cloPrice" name="cloPrice" class="layui-input form-input text-number"
                                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                               required data-th-value='${entity?.cloPrice}' data-textrange="3" maxlength="11">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">平均价净价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="avgPrice" name="avgPrice"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" data-th-required="true"
                                               data-th-value='${entity?.avgPrice}' data-textrange="3" maxlength="11">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">买一价净价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="buyOnePrice" name="buyOnePrice"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" data-th-required="true"
                                               data-th-value='${entity?.buyOnePrice}' data-textrange="3" maxlength="11">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">卖一价净价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="sellOnePrice" name="sellOnePrice"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" data-th-required="true"
                                               data-th-value='${entity?.sellOnePrice}' data-textrange="3" maxlength="11">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">最高价净价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="maxPrice" name="maxPrice"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" required
                                               data-th-value='${entity?.maxPrice}' data-textrange="3" maxlength="11">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">最低价净价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="minPrice" name="minPrice"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-value='${entity?.minPrice}' required
                                               data-th-placeholder="#{SysCommon.placeholder}" data-textrange="3" maxlength="11">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">收盘价全价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="cloPriceFull" name="cloPriceFull"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-th-value='${entity?.cloPriceFull}' required
                                               data-th-placeholder="#{SysCommon.placeholder}" data-textrange="3" maxlength="11">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">平均价全价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="avgPriceFull" name="avgPriceFull"
                                               class="layui-input form-input text-number" data-th-required="true"
                                               data-th-value='${entity?.avgPriceFull}' placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" data-textrange="3" maxlength="11">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">买一价全价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="buyOnePriceFull" name="buyOnePriceFull"
                                               class="layui-input form-input text-number" data-th-required="true"
                                               data-th-value='${entity?.buyOnePriceFull}' placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" data-textrange="3" maxlength="11">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">卖一价全价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="sellOnePriceFull" name="sellOnePriceFull"
                                               class="layui-input form-input text-number" data-th-required="true"
                                               data-th-value='${entity?.sellOnePriceFull}' placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" data-textrange="3" maxlength="11">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">最高价全价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="maxPriceFull" name="maxPriceFull"
                                               class="layui-input form-input text-number" required
                                               data-th-value='${entity?.maxPriceFull}' placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" data-textrange="3" maxlength="11"/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">最低价全价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="minPriceFull" name="minPriceFull"
                                               class="layui-input form-input text-number" required
                                               data-th-value='${entity?.minPriceFull}' placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" data-textrange="3" maxlength="11">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">债券市场余额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="marketAmt" name="marketAmt"
                                               class="layui-input form-input text-number" required
                                               data-th-value='${entity?.marketAmt}' placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" data-textrange="3" maxlength="11">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        <div class="layui-form-item">
            <div align="center" style="height:50px;padding-top: 10px;">
                <a id="ComBondMarketInfo002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                <a id="ComBondMarketInfo002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="ComBondMarketInfo002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/common/basicdata/marketdata/bond/ComBondMarketInfo002.js}" type="text/javascript"></script>
</div>
</body>
</html>
