<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>利率互换估值信息</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a id="ComRateSwapValuationInfo001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
        <a id="ComRateSwapValuationInfo001_btn_import" class="layui-btn layui-btn-sm btn-import">
            <i class="iconfont icon-import"></i><span data-th-text="#{SysCommon.import}">导入</span></a>
        <a id="ComRateSwapValuationInfo001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}">删除</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">交易编号</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="finprodId2" name="finprodId2" formatoption="false"
                               class="layui-input form-input input-select"  placeholder="请输入内容"
                               data-th-data-url="@{/common/basicdata/marketdata/rateswapvaluationinfo/ComRateSwapValuationInfo001/getFinprodId2}" allowClear="true">
                        </select>       
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">估值日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="valDate" name="valDate"
                               placeholder="请选择、支持区间"
                               class="layui-input form-input input-dateRangeSelect"
                               allowClear="true">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <table class="layui-table" id="dataTable"></table>
</div>
</body>
<div layout:fragment="script">
    <script
            data-th-src="@{/js/common/basicdata/marketdata/rateswapvaluationinfo/ComRateSwapValuationInfo001.js}"
            type="text/javascript"></script>
</div>
</html>
