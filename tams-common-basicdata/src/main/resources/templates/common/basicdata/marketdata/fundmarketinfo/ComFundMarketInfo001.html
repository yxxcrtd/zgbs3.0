<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorator="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>每日基金行情</title>
</head>
<body>
	<div layout:fragment="content">
		<!-- 画面内容 -->
		<div class="form-button-area">
			<a id="ComFundMarketInfo001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
			<a id="ComFundMarketInfo001_btn_import" class="layui-btn layui-btn-sm btn-import">
				<i class="iconfont icon-import"></i><span data-th-text="#{SysCommon.import}">导入</span></a>
			<a id="ComFundMarketInfo001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}" style="display: none">删除</a>
		</div>
		<div class="joyin-form-wrap joyin-filter-form condition-area">
			<form class="layui-form" id="searchForm">
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">基金代码</label>
						<div class="layui-input-inline input-inline">
<!--							<input type="text" id="fundCode" name="fundCode"-->
<!--								class="layui-input form-input" placeholder="请输入内容">-->
							<select type="text" id="fundCode" name="fundCode"
									class="layui-input form-input input-select" placeholder="请输入内容"
									data-th-data-url="@{/common/basicdata/marketdata/fundmarketinfo/ComFundMarketInfo002/getFinProductList}">
							</select>
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">基金名称</label>
						<div class="layui-input-inline input-inline">
<!--							<input type="text" id="fundName" name="fundName"-->
<!--								class="layui-input form-input" placeholder="请输入内容">-->
							<select type="text" id="fundName" name="fundName"
									class="layui-input form-input input-select" placeholder="请输入内容"
									data-th-data-url="@{/common/basicdata/marketdata/fundmarketinfo/ComFundMarketInfo002/getFinProductList}">
							</select>
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">估值日期</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="valueDate" name="valueDate"
								placeholder="请选择、支持区间"
								class="layui-input form-input input-dateRangeSelect" />
						</div>
					</div>
				</div>
				<!--  <div class="layui-form-item"> -->
				<!-- 					<div class="layui-inline layui-col-md4"> -->
				<!-- 						<label class="layui-form-label form-lable">估值来源</label> -->
				<!-- 						<div class="layui-input-inline input-inline"> -->
				<!-- 							<input id="valueSource" name="valueSource" -->
				<!-- 								class="layui-input form-input input-select" placeholder="请输入内容" -->
				<!-- 								data-th-data-result="${VALUATION_TRADE_MARKET}" -->
				<!-- 								allowClear="true"> -->
				<!-- 						</div> -->
				<!-- 					</div> -->
				<!-- </div> -->
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">基金类型</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="fundType" name="fundType"
								class="layui-input form-input input-select" placeholder="请选择"
								data-url="/system/log/SysBatchLog001/getPrdGroup"
								data-idfield="code" data-keyfield="shortName"
								data-th-data-result="${FUND_TYPE}" allowClear="true">
						</div>
					</div>
				</div>
			</form>
		</div>
		<div>
			<table class="layui-table" id="dataTable"></table>
		</div>
	</div>
</body>
<div layout:fragment="script">
	<script
		data-th-src="@{/js/common/basicdata/marketdata/market/ComFundMarketInfo001.js}"
		type="text/javascript"></script>
</div>
</html>
