<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ComSharePrice001}">股票行情信息</title>
</head>
<body>
     <div layout:fragment="content">
         <div class="form-button-area">
            <a id="ComSharePrice001_btn_add" class="layui-btn layui-btn-sm btn-create">新建</a>
            <a id="ComSharePrice001_btn_delete" class="layui-btn layui-btn-sm btn-delete">删除</a>
            <a id="ComSharePrice001_btn_import" class="layui-btn layui-btn-sm " >导入</a>
        </div>
       <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form"  id="submitForm">
            <div class="layui-form-item">       
                 <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{ComSharePrice001.sharesId}">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="sharesId" name="sharesId"
                                                class="layui-input form-input input-select" th:allowClear="true"
                                                th:placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                 th:formatoption="true"
                                                data-th-data-url="@{/common/basicdata/marketdata/mstshareprice/ComSharePrice001/getFinprodIdForAdd}"
                                                >
                                        </select>
                                    </div>
                                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable" data-th-text="#{ComSharePrice001.dealDate}">交易日期</label>
                    <div class="layui-input-inline input-inline">
                        <input id="dealDate" name="dealDate" 
                               class="layui-input form-input input-dateSelect" 
                               placeholder="请选择时间" >
                    </div>
                </div> 
            </div>
             
        </form>
        </div>    
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>       
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/common/basicdata/marketdata/mstshareprice/ComSharePrice001.js}" type="text/javascript"></script>
    </div>                                
</body>

</html>
