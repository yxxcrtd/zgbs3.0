<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorator="~{layout/default}">
<head>
</head>
<body>
<div layout:fragment="content">
    <style type="text/css">
        .layui-form-label {
            padding: 5px 5px;
        }

        .layui-form-label .must {
            height: 16px;
        }

        .layui-form-item {
            padding-top: 2px;
            margin-bottom: 0;
            clear: both;
        }

        .select2-container .select2-selection--single {
            height: 26px;
        }

        .layui-tab-title {
            height: 28px;
        }

        .form-input {
            height: 26px;
        }

        .layui-fluid {
            padding: 0px 3px;
        }

        .layui-btn+.layui-btn {
            margin-left: 2px;
        }

        .layui-btn-sm {
            height: 24px;
            line-height: 24px;
        }

        .joyin-form-wrap {
            border: 1px solid #aaaaaa;
        }

        .dividing-line {
            width: 100%;
            height: 1px;
            border: 1px solid #aaaaaa;
        }

        .layui-btn-lock {
            float: right;
            margin-right: -20px;
        }

        .s-color-red{color:red !important}.s-color-green{color:green !important}
        .level2-panel
        {

            width: auto
        }

        .level2-panel h3
        {
            font-weight: bold;
            line-height: 26px;
            text-align: left;
            position: relative
        }

        .level2-panel .price-bulletin
        {
            height: 40px;
            border-bottom: 1px solid #E6E6E6
        }

        .level2-panel .price-bulletin>*
        {
            display: block;
            line-height: 40px
        }

        .level2-panel .price-bulletin .latest-price,  .level2-panel .price-bulletin .change-direction
        {
            float: left;
            padding-left: 5px;
            font-size: 18px
        }

        .level2-panel .price-bulletin .latest-price .icon-up,  .level2-panel .price-bulletin .latest-price .icon-down,  .level2-panel .price-bulletin .change-direction .icon-up,  .level2-panel .price-bulletin .change-direction .icon-down
        {
            display: none
        }

        .level2-panel .price-bulletin .change-direction .icon-down
        {
            display: none
        }

        .level2-panel .price-bulletin .change-info
        {
            float: right;
            padding-right: 10px
        }

        .level2-panel .price-bulletin .change-info .change
        {
            position: relative;
            top: 3px;
            line-height: 14px
        }

        .level2-panel .price-bulletin .change-info .percentage
        {
            position: relative;
            top: 7px;
            line-height: 14px
        }

        .level2-panel .price-boundary
        {
            height: 65px;
            padding: 5px 0;
            border-bottom: 1px solid #E6E6E6
        }

        .level2-panel .price-boundary .typical-price
        {
            float: left;
            width: 50%; padding-top:6px;
            height: 22px;
            line-height: 22px
        }

        .level2-panel .price-boundary .typical-price a
        {
            padding-left: 5px
        }

        .level2-panel .level .level-item
        {
            line-height: 20px
        }

        .level2-panel .level .level-item>*
        {
            display: inline-block
        }

        .level2-panel .level .level-item .level-name
        {
            width: 20%
        }

        .level2-panel .level .level-item .level-price
        {
            width: 40%;
            text-align: center
        }

        .level2-panel .level .level-item .level-volume
        {
            width: 30%;
            padding-right: 10px;
            text-align: right
        }

        .level2-panel .level.level-sell
        {
            border-bottom: 1px solid #E6E6E6
        }

        .level2-panel .price-anchor
        {
            cursor: pointer
        }

        .level2-panel .price-anchor:hover
        {
            text-decoration: underline
        }
        .layui-form-radio {
            line-height: 24px;
            padding-right: 0px;
            margin: 0px;
        }
        .layui-form-radio div {
            font-size: 12px;
        }
        .layui-form-radio i{
            font-size: 14px;
        }
        .level2-panel .price-bulletin .change-direction .icon-down:before {
            content: "";
        }
        .leftTopHide {
            display: none;
        }

        #seatId_div_dz ul.dropdown-menu {
            left: 0!important;
            width: 160px!important;
        }

        #counterOrg_div_gd ul.dropdown-menu {
            left: 0!important;
            width: 160px!important;
        }

        #counterTrader_div_gd ul.dropdown-menu {
            left: 0!important;
            width: 160px!important;
        }

        #trader_div_gd  ul.dropdown-menu {
            left: 0!important;
            width: 160px!important;
        }

    </style>
    <div class="joyin-form-wrap">
        <form class="layui-form pro-module-form" id="sumbitForm_hg">
            <input type="hidden" id="redoType" name="redoType" data-th-value="${entity?.redoType}">
            <input type="hidden" id="homeTrader" name="homeTrader" data-th-value="homeTrader">
            <input type="hidden" id="entrustId" name="entrustId" data-th-value="${entity?.entrustId}">
            <input type="hidden" id="psList" name="psList" data-th-value="${entity?.psList}">
            <input type="hidden" id="finprodId" name="finprodId" data-th-value="${entity?.finprodId}">
            <input type="hidden" id="pledgeFaceValue" name="pledgeFaceValue" data-th-value="${entity?.pledgeFaceValue}">
            <input type="hidden" id="newfinprodId" name="newfinprodId" data-th-value="${entity?.newfinprodId}">
            <input type="hidden" id="newpledgeFaceValue" name="newpledgeFaceValue" data-th-value="${entity?.newpledgeFaceValue}">
            <input type="hidden" id="acctTradeMarket" name="acctTradeMarket" data-th-value="${entity?.acctTradeMarket}" >
            <input type="hidden" id="invManagerId" name="invManagerId" data-th-value="${entity?.invManagerId}" >
            <input type="hidden" id="pledgeUnit" name="pledgeUnit" data-th-value="${entity?.pledgeUnit}" >
            <div class="layui-form-item">
                <div class="form-inline-wrap" style="width: 50%; padding-top:6px;display: none" id="cashUse_div">
                    <!--<label class="layui-form-label" style="width: 150px;" >资金可用</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <input type="text" id="cashUse"  placeholder="请输入内容" data-pattern="" data-fixtype="2" data-textrange='2' class="layui-input form-input text-number"
                                autocomplete="off" maxlength=10 style="" disabled="disabled">
                        <span class="input-right-show">元</span>
                    </div>-->
                </div>
                <div class="form-inline-wrap" style="width: 50%; padding-top:6px;display: none" id="cashGet_div">
                    <!--<label class="layui-form-label" style="width: 150px;" >资金可取</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <input type="text" id="cashGet"  placeholder="请输入内容" data-pattern="" data-fixtype="2" data-textrange='2' class="layui-input form-input text-number"
                               autocomplete="off" maxlength=10 style="" disabled="disabled">
                        <span class="input-right-show">元</span>
                    </div>-->
                </div>
                <div class="form-inline-wrap" style="width: 50%; padding-top:6px;" id="portfolioId_div">
                    <label class="layui-form-label" data-th-text="#{EtrExchangeAgreRepTrade001.portfolioId}" style="width: 150px;">组合名称</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <select type="text" id="portfolioId" name="portfolioId" class="layui-input form-input input-select" th:placeholder="#{SysCommon.placeholder}" placeholder="请输入内容"
                                th:data-url="@{/business/common/CommonSelect/selectPortfolioId?act=true}" allowClear="true" formatoption="true" th:initValue="${entity?.portfolioId}" required>
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap" style="width: 50%; padding-top:6px;" id="acctNo_div">
                    <label class="layui-form-label" style="width: 150px;" data-th-text="#{EtrExchangeAgreRepTrade001.acctNo}">资金账号</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <select required type="text" id="acctNo" name="acctNo" class="layui-input form-input input-select" placeholder="请输入内容" th:initValue="${entity?.acctNo}"
                                parentIds="portfolioId,tradeMarket" data-th-placeholder="#{SysCommon.placeholder}" data-th-data-url="@{/etrexchange/agreementrep/EtrExchangeAgreRepTrade001/getPtlSecAcctInfoWfl}" formatoption=true></select>
                    </div>
                </div>
                <div class="form-inline-wrap" style="width: 50%; padding-top:6px;" id="tradeMarket_div">
                    <label class="layui-form-label" style="width: 150px;" data-th-text="#{EtrExchangeAgreRepTrade001.tradeMarket}">交易场所</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <select required type="text" id="tradeMarket" name="tradeMarket" allowClear="true" class="layui-input form-input input-select" data-th-data-result='${TRADE_PLACE}'
                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true" data-th-initvalue="${entity?.tradeMarket}">
                        </select>
                    </div>
                </div>
                <div class="layui-form-item" id="secAcctId_div_gd" style="display: none;">
                    <label class="layui-form-label" data-th-text="#{EtrExchangeAgreRepTrade001.secAcctId}">证券账户</label>
                    <div class="layui-input-inline input-inline">
                        <select required type="text" id="secAcctId" name="secAcctId" class="layui-input form-input input-select" placeholder="请输入内容" th:initValue="${entity?.secAcctId}"
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-url="@{/etrexchange/agreementrep/EtrExchangeAgreRepTrade001/getSecAcctInfoWfl}" formatoption=true></select>
                    </div>
                </div>
                <div class="form-inline-wrap" style="width: 50%; padding-top:6px;" id="tradeId_div">
                    <label class="layui-form-label" style="width: 150px;" >初始交易编号</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <input type="text" id="tradeId" name="tradeId" class="layui-input form-input" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-value="${entity?.tradeId}" maxlength=30>
                    </div>
                </div>
                <div class="form-inline-wrap" style="width: 50%; padding-top:6px;" id="ps_div">
                    <label class="layui-form-label" style="width: 150px;" data-th-text="#{EtrExchangeAgreRepTrade001.ps}">业务类型</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <select required type="text" id="ps" name="ps" allowClear="true" class="layui-input form-input input-select" data-th-data-result='${PS}' data-th-initvalue="${entity?.ps}"
                                parentIds="tradeMarket,psList" data-th-placeholder="#{SysCommon.placeholder}" formatoption="true" th:data-url= "@{/etrexchange/agreementrep/EtrExchangeAgreRepTrade001/selectPs}">
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap" style="width: 50%; padding-top:6px;" id="repPs_div">
                    <label class="layui-form-label" style="width: 150px;" data-th-text="#{EtrExchangeAgreRepTrade001.repPs}">委托方向</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <select required type="text" id="repPs" name="repPs" allowClear="true" class="layui-input form-input input-select" data-th-initvalue="${entity?.repPs}"
                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true" data-th-data-result='${BACK_LEND_DIRECTION}'>
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap" style="width: 50%; padding-top:6px;" id="term_div">
                    <label class="layui-form-label" style="width: 150px;" data-th-text="#{EtrExchangeAgreRepTrade001.term}">回购期限</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <input type="text" id="term" name="term" placeholder="请输入内容" data-pattern="" data-fixtype="2" data-textrange='0' class="layui-input form-input text-number"
                               data-th-value="${entity?.term}" required="required" autocomplete="off" maxlength=6>
                        <span class="input-right-show">天</span>
                    </div>
                </div>
                <div class="form-inline-wrap" style="width: 50%; padding-top:6px;" id="tradeAmt_div">
                    <label class="layui-form-label" style="width: 150px;" data-th-text="#{EtrExchangeAgreRepTrade001.tradeAmt}">回购金额</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <input type="text" id="tradeAmt" name="tradeAmt" placeholder="请输入内容" data-pattern="" data-fixtype="2" data-textrange='2' class="layui-input form-input text-number"
                               data-th-value="${entity?.tradeAmt}" required="required" autocomplete="off" maxlength=9>
                        <span class="input-right-show">元</span>
                    </div>
                </div>
                <div class="form-inline-wrap" style="width: 50%; padding-top:6px;" id="yield_div">
                    <label class="layui-form-label" style="width: 150px;" data-th-text="#{EtrExchangeAgreRepTrade001.yield}">回购利率</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <input type="text" id="yield" name="yield" placeholder="请输入内容" data-pattern="" data-fixtype="2" data-textrange='4' class="layui-input form-input text-number"
                               data-th-value="${entity?.yield}" required="required" autocomplete="off" maxlength=9>
                        <span class="input-right-show">%</span>
                    </div>
                </div>
                <div class="form-inline-wrap" style="width: 50%; padding-top:6px;" id="fristSettleDate_div">
                    <label class="layui-form-label" style="width: 150px;" data-th-text="#{EtrExchangeAgreRepTrade001.fristSettleDate}">首期结算日</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <input required class="layui-input form-input input-dateSelect" id="fristSettleDate" name="fristSettleDate" placeholder="请选择时间" data-th-value="${entity?.fristSettleDate}">
                    </div>
                </div>
                <div class="form-inline-wrap" style="width: 50%; padding-top:6px;" id="hgMDate_div">
                    <label class="layui-form-label" style="width: 150px;">回购到期日</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <input required disabled="disabled" class="layui-input form-input input-dateSelect" id="hgMDate" name="hgMDate" placeholder="请选择时间" data-th-value="${entity?.hgMDate}">
                    </div>
                </div>
                <div class="form-inline-wrap" style="width: 50%; padding-top:6px;" id="expireSettleDate_div">
                    <label class="layui-form-label" style="width: 150px;" data-th-text="#{EtrExchangeAgreRepTrade001.expireSettleDate}">到期结算日</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <input required class="layui-input form-input input-dateSelect" id="expireSettleDate" name="expireSettleDate" placeholder="请选择时间" data-th-value="${entity?.expireSettleDate}" >
                    </div>
                </div>

<!--                    </div>-->
<!--                </div>-->
                <div class="form-inline-wrap" style="width: 50%; padding-top:6px;" id="occupyDays_div">
                    <label class="layui-form-label" style="width: 150px;">占款天数</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <input type="text" id="occupyDays" name="occupyDays" placeholder="请输入内容" data-pattern="" data-fixtype="2" data-textrange='0' class="layui-input form-input text-number"
                               data-th-value="${entity?.occupyDays}" required="required" autocomplete="off" maxlength=9>
                        <span class="input-right-show">天</span>
                    </div>
                </div>
                <div class="form-inline-wrap" style="width: 50%; padding-top:6px;" id="intAmt_div">
                    <label class="layui-form-label" style="width: 150px;" data-th-text="#{EtrExchangeAgreRepTrade001.intAmt}">回购利息</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <input type="text" id="intAmt" name="intAmt" placeholder="请输入内容" data-pattern="" data-fixtype="2" data-textrange='2' class="layui-input form-input text-number"
                               data-th-value="${entity?.intAmt}" required="required" autocomplete="off" maxlength=10>
                        <span class="input-right-show">元</span>
                    </div>
                </div>
                <div class="form-inline-wrap" style="width: 50%; padding-top:6px;" id="expireSettleAmt_div">
                    <label class="layui-form-label" style="width: 150px;" data-th-text="#{EtrExchangeAgreRepTrade001.expireSettleAmt}">到期结算金额</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <input type="text" id="expireSettleAmt" name="expireSettleAmt" placeholder="请输入内容" data-pattern="" data-fixtype="2" data-textrange='2' class="layui-input form-input text-number"
                               data-th-value="${entity?.expireSettleAmt}" required="required" autocomplete="off" maxlength=10 style="">
                        <span class="input-right-show">元</span>
                    </div>
                </div>
                <div class="form-inline-wrap" style="width: 50%; padding-top:6px;" id="repSecId_div">
                    <label class="layui-form-label" style="width: 150px;" id="repSecIdLabel" data-th-text="#{EtrExchangeAgreRepTrade001.repSecId}">质押券</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <select required type="text" id="repSecId" name="repSecId" class="layui-input form-input input-select" placeholder="请输入内容" data-th-data-url="@{'/etrexchange/agreementrep/EtrExchangeAgreRepTrade001/getFinprodMarketInfoWfl'}"
                                 parentIds="acctTradeMarket,expireSettleDate" th:initValue="${entity?.repSecId}" data-th-placeholder="#{SysCommon.placeholder}"  formatoption=false></select>
                    </div>
                </div>
                <div class="form-inline-wrap" style="width: 50%; padding-top:6px;" id="conRatio_div">
                    <label class="layui-form-label" style="width: 150px;" data-th-text="#{EtrExchangeAgreRepTrade001.conRatio}"> 折算率</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <input type="text" id="conRatio" name="conRatio" placeholder="请输入内容" data-pattern="" data-fixtype="2" data-textrange='2' class="layui-input form-input text-number"
                               data-th-value="${entity?.conRatio}" autocomplete="off" maxlength=9 required="required">
                        <span class="input-right-show">%</span>
                    </div>
                </div>

                <div class="form-inline-wrap" style="width: 50%; padding-top:6px;" id="repSecNum_div">
                    <label class="layui-form-label" style="width: 150px;" >质押数量</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <input required type="text" id="repSecNum" name="repSecNum" placeholder="请输入内容" data-pattern="" data-fixtype="2" data-textrange='0' class="layui-input form-input text-number"
                               data-th-value="${entity?.repSecNum}"  autocomplete="off" maxlength=9>
                        <span id ="repSecNumUnit" class="input-right-show">万元</span>
                    </div>
                </div>

                <div class="form-inline-wrap" style="width: 50%; padding-top:6px;" id="printAmt_div">
                    <label class="layui-form-label" style="width: 150px;" data-th-text="#{EtrExchangeAgreRepTrade001.printAmt}">券面金额</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <input type="text" id="printAmt" name="printAmt" placeholder="请输入内容" data-pattern="" data-fixtype="2" data-textrange='2' class="layui-input form-input text-number"
                               data-th-value="${entity?.printAmt}"  autocomplete="off" maxlength=10>
                        <span class="input-right-show">元</span>
                    </div>
                </div>

                <div class="form-inline-wrap" style="width: 50%; padding-top:6px;" id="newRepSecId_div" >
                    <label class="layui-form-label" style="width: 150px;" data-th-text="#{EtrExchangeAgreRepTrade001.newRepSecId}">新质押券</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <select required type="text" id="newRepSecId" name="newRepSecId" class="layui-input form-input input-select" placeholder="请输入内容" data-th-data-url="@{'/etrexchange/agreementrep/EtrExchangeAgreRepTrade001/getFinprodMarketInfoWfl'}"
                                parentIds="acctTradeMarket,expireSettleDate" th:initValue="${entity?.newRepSecId}" data-th-placeholder="#{SysCommon.placeholder}"  formatoption=false></select>
                    </div>
                </div>
                <div class="form-inline-wrap" style="width: 50%; padding-top:6px;" id="newConRatio_div">
                    <label class="layui-form-label" style="width: 150px;" data-th-text="#{EtrExchangeAgreRepTrade001.newConRatio}">新折算比例</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <input type="text" id="newConRatio" name="newConRatio" placeholder="请输入内容" data-pattern="" data-fixtype="2" data-textrange='2' class="layui-input form-input text-number"
                               data-th-value="${entity?.newConRatio}" required="required" autocomplete="off" maxlength=9>
                        <span class="input-right-show">%</span>
                    </div>
                </div>
                <div class="form-inline-wrap" style="width: 50%; padding-top:6px;" id="newRepSecNum_div">
                    <label class="layui-form-label" style="width: 150px;" data-th-text="#{EtrExchangeAgreRepTrade001.newRepSecNum}">新质押数量</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <input type="text" id="newRepSecNum" name="newRepSecNum" placeholder="请输入内容" data-pattern="" data-fixtype="2" data-textrange='0' class="layui-input form-input text-number"
                               data-th-value="${entity?.newRepSecNum}" required="required" autocomplete="off" maxlength=9>
                        <span id ="newRepSecNumUnit" class="input-right-show">万元</span>
                    </div>
                </div>
                <div class="form-inline-wrap" style="width: 50%; padding-top:6px;" id="newPrintAmt_div">
                    <label class="layui-form-label" style="width: 150px;" data-th-text="#{EtrExchangeAgreRepTrade001.newPrintAmt}">新券面金额</label>
                    <div class="layui-input-inline input-inline" style=" margin: 0px; margin-left: auto;">
                        <input type="text" id="newPrintAmt" name="newPrintAmt" placeholder="请输入内容" data-pattern="" data-fixtype="2" data-textrange='2' class="layui-input form-input text-number"
