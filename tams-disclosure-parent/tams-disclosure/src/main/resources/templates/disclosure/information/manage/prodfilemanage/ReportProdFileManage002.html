<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ReportProdFileManage002}">产品文件新建</title>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
			<!-- 隐藏字段 金融产品代码 -->
				<input type="text" name="produuid" data-th-value='${produuid}' hidden>
			<div class="pro-module-wrap" title="基本信息">
				<div class="pro-module">
					<h3 class="pro-module-title">
						<span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i
							class="iconfont icon-arrow-down pro-down-icon"></i>
					</h3>
					<div class="pro-module-item">
						<div class="layui-form-item">
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.prodId}">产品代码</label>
								<div class="layui-input-inline input-inline">
									<input type="text" name="prodId" id="prodId"
										class="layui-input form-input" maxLength="32"
										data-th-value='${entity?.prodId}'
										data-th-placeholder="#{SysCommon.placeholder}" onblur="setFinprodAbbr();" required>
								</div>
							</div>
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.prodName}">产品名称</label>
								<div class="layui-input-inline input-inline">
									<input type="text" name="prodName" id="prodName"
										class="layui-input form-input" maxLength="60"
										data-th-value='${entity?.prodName}'
										data-th-placeholder="#{SysCommon.placeholder}" required>
								</div>
							</div>
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.regCode}">产品登记编码</label>
								<div class="layui-input-inline input-inline">
									<input type="text" name="regCode" id="regCode"
										class="layui-input form-input" maxlength=60
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-value='${entity?.regCode}' required>
								</div>
							</div>
						</div>
						<div class="layui-form-item">
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.prodSeries}">产品系列</label>
								<div class="layui-input-inline input-inline">
									<input type="text" name="prodSeries" id="prodSeries"
										class="layui-input form-input" maxlength=60
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-value='${entity?.prodSeries}' required>
								</div>
							</div>
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.profitType}">收益类型</label>
								<div class="layui-input-inline input-inline">
									<select id="profitType" name="profitType"
										class="layui-input form-input input-select"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-initValue='${entity?.profitType}'													
										data-th-data-result="${PROFIT_TYPE}" required>
									</select>
								</div>
							</div>
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.dealMode}">产品处理模式</label>
								<div class="layui-input-inline input-inline">
									<select id="dealMode" name="dealMode"
										class="layui-input form-input input-select"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-initValue='${entity?.dealMode}'													
										data-th-data-result="${DISPOSE_PATTERN}" required>
									</select>
								</div>
							</div>
						</div>
						<div class="layui-form-item">
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.issueType}">发行方式</label>
								<div class="layui-input-inline input-inline">
									<select id="issueType" name="issueType"
										class="layui-input form-input input-select"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-initValue='${entity?.issueType}'													
										data-th-data-result="${ISSUE_MODE}" required>
									</select>
								</div>
							</div>
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.operateMode}">产品运作模式</label>
								<div class="layui-input-inline input-inline">												
									<select id="operateMode" name="operateMode"
										class="layui-input form-input input-select"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-initValue='${entity?.operateMode}'												
										data-th-data-result="${SVR_OPERATEMODE_DECLARE}" required >
									</select>
								</div>
							</div>
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
								data-th-text="#{ReportProdFileManage002.profitFlag}">产品收益标识</label>
								<div class="layui-input-inline input-inline">
									<select name="profitFlag" id="profitFlag"
										class="layui-input form-input input-select"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-initValue='${entity?.profitFlag}'
										data-th-data-result="${PRODPROFITFLAG}" required >
									</select>
								</div>
							</div> 
						</div>
						<div class="layui-form-item">
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.ivstorientation}">投资性质</label>
								<div class="layui-input-inline input-inline">
									<select name="ivstorientation" id="ivstorientation"
										class="layui-input form-input input-select"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-initValue='${entity?.ivstorientation}'
										data-th-data-result="${INVEST_TYPE}" required >
									</select>
								</div>
							</div>
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
								data-th-text="#{ReportProdFileManage002.ccy}">理财币种</label>
								<div class="layui-input-inline input-inline">
									<select id="ccy" name="ccy"
										class="layui-input form-input input-select" placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-initValue='${entity?.ccy}'
										data-th-data-result="${CCY}" required >
									</select>
								</div>
							</div>
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.raiseType}">募集方式</label>
								<div class="layui-input-inline input-inline">
									<select name="raiseType" id="raiseType"
										class="layui-input form-input input-select"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-initValue='${entity?.raiseType}'
										data-th-data-result="${RAISE_TYPE}" required >
									</select>
								</div>
							</div>
						</div>
						<div class="layui-form-item">
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.riskLevel}">产品风险评级</label>
								<div class="layui-input-inline input-inline">
									<select name="riskLevel" id="riskLevel"
										class="layui-input form-input input-select"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-initValue='${entity?.riskLevel}'
										data-th-data-result="${RISKLEVEL}" required>
									</select>
								</div>
							</div>	
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.riskType}">投资者风险偏好</label>
								<div class="layui-input-inline input-inline">
									<select type="text" name="riskType" id="riskType"
										class="layui-input form-input input-select" 
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-initValue='${entity?.riskType}' 
										data-th-data-result="${RISKTYPE}" required>
									</select>
								</div>
							</div>
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.payType}">分红方式</label>
								<div class="layui-input-inline input-inline">
									<select name="payType" id="payType"
										class="layui-input form-input input-select"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-initValue='${entity?.payType}'
										data-th-data-result="${BONUS_MODE}" required >
									</select>
								</div>
							</div>
						</div>
						<div class="layui-form-item">
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.beforeendFlag}">是否允许提前终止</label>
								<div class="layui-input-inline input-inline">
									<select name="beforeendFlag" id="beforeendFlag"
										class="layui-input form-input input-select"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-initValue='${entity?.beforeendFlag}'
										data-th-data-result="${YES_OR_NO}" required>
									</select>
								</div>
							</div>
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.raiseVdate}">募集开始日</label>
								<div class="layui-input-inline input-inline">
									<input type="text" name="raiseVdate" id="raiseVdate" 
										class="layui-input form-input input-dateSelect"
										data-th-value='${#dates.format(entity?.raiseVdate,"yyyy-MM-dd")}'
										required>
								</div>
							</div>
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.raiseEnddate}">募集结束日</label>
								<div class="layui-input-inline input-inline">
									<input type="text" name="raiseEnddate" id="raiseEnddate" 
										class="layui-input form-input input-dateSelect"
										data-th-value='${#dates.format(entity?.raiseEnddate,"yyyy-MM-dd")}'
										required>
								</div>
							</div>
						</div>
						<div class="layui-form-item">
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.vdate}">起息日</label>
								<div class="layui-input-inline input-inline">
									<input type="text" name="vdate" id="vdate" 
										class="layui-input form-input input-dateSelect"
										data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'
										required>
								</div>
							</div>
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.mdate}">到期日</label>
								<div class="layui-input-inline input-inline">
									<input type="text" name="mdate" id="mdate" 
										class="layui-input form-input input-dateSelect"
										data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
										required>
								</div>
							</div>
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.term}">产品期限</label>
								<div class="layui-input-inline input-inline">
									<input type="text" name="term" id="term"
										class="layui-input form-input text-number"
										placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-textrange="0" data-th-value='${entity?.term}'
										disabled required> <span class="input-right-show">天</span>
								</div>
							</div>
						</div>		
						<div class="layui-form-item">
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.investcloseFlag}">是否有投资封闭期</label>
								<div class="layui-input-inline input-inline">
									<select name="investcloseFlag" id="investcloseFlag"
										class="layui-input form-input input-select"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-initValue='${entity?.investcloseFlag}'
										data-th-data-result="${YES_OR_NO}" required>
									</select>
								</div>
							</div>
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.investcloseStrdate}">投资封闭期（从）</label>
								<div class="layui-input-inline input-inline">
									<input type="text" name="investcloseStrdate" id="investcloseStrdate" 
										class="layui-input form-input input-dateSelect"
										data-th-value='${#dates.format(entity?.investcloseStrdate,"yyyy-MM-dd")}' >
								</div>
							</div>
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.investcloseEnddate}">投资封闭期（到）</label>
								<div class="layui-input-inline input-inline">
									<input type="text" name="investcloseEnddate" id="investcloseEnddate" 
										class="layui-input form-input input-dateSelect"
										data-th-value='${#dates.format(entity?.investcloseEnddate,"yyyy-MM-dd")}' >
								</div>
							</div>
						</div>
						<div class="layui-form-item">
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.liquidationDate}">清盘日</label>
								<div class="layui-input-inline input-inline">
									<input type="text" name="liquidationDate" id="liquidationDate" 
										class="layui-input form-input input-dateSelect"
										data-th-value='${#dates.format(entity?.liquidationDate,"yyyy-MM-dd")}' required >
								</div>
							</div>
							<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
											data-th-text="#{ReportProdFileManage002.termtype}">期限</label>
									<div class="layui-input-inline input-inline">
										<select name="termtype" id="termtype"
											class="layui-input form-input input-select"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-th-initValue='${entity?.termtype}'
											data-th-data-result="${TERM_TYPE}" >
										</select>
								</div>
							</div>
							<div class="form-inline-wrap" id='investmentCycleDiv'>
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.investmentCycle}">投资周期(天)</label>
								<div class="layui-input-inline input-inline">
									<input type="text" name="investmentCycle" id="investmentCycle"
										class="layui-input form-input"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-value='${entity?.investmentCycle}' ><!-- <span class="input-right-show"> --></span>
								</div>
							</div>
						</div>
						<div class="layui-form-item">
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.autocontinueFlag}">是否自动续投</label>
								<div class="layui-input-inline input-inline">
									<select name="autocontinueFlag" id="autocontinueFlag"
										class="layui-input form-input input-select"
										data-th-initValue='${entity?.autocontinueFlag}'
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-data-result="${YES_OR_NO}">
									</select>
								</div>
							</div>
							<div class="form-inline-wrap">
							    <label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.yield}">预期年化收益率</label>
								<div class="layui-input-inline input-inline">
									<input type="text" name="yield" id="yield"
											class="layui-input form-input text-number"
											data-th-placeholder="#{SysCommon.placeholder}"
											data-textrange="4" data-th-value='${entity?.yield}'> <span
											class="input-right-show">%</span>
								</div>
						    </div>
						    <div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.basic}">计息基础</label>
								<div class="layui-input-inline input-inline">
									<select name="basic" id="basic"
										class="layui-input form-input input-select"
										data-th-initValue='${entity?.basic}'
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-data-result="${BASIS}" required>
									</select>
								</div>
							</div>
						</div>
						<div class="layui-form-item">
							<div class="form-inline-wrap" >
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.investManager}">投资管理人</label>
								<div class="layui-input-inline input-inline">
									<input type="text" name="investManager" id="investManager"
										class="layui-input form-input" maxlength=60
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-value='${entity?.investManager}' required>
								</div>
							</div>
							<div class="form-inline-wrap" >
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.trustee}">理财产品托管人</label>
								<div class="layui-input-inline input-inline">
									<input type="text" name="trustee" id="trustee"
										class="layui-input form-input" maxlength=60
										data-th-placeholder="#{SysCommon.placeholder}"
										data-th-value='${entity?.trustee}' required>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
			<div class="pro-module-wrap" title="交易信息">
				<div class="pro-module">
					<h3 class="pro-module-title">
						<span class="title-des">交易信息</span><i
							class="iconfont icon-arrow-down pro-down-icon"></i>
					</h3>
					<div class="pro-module-item">
						<div class="layui-form-item">
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.raiseAmtPlan}">计划募集金额</label>
								<div class="layui-input-inline input-inline">
									<input type="text" name="raiseAmtPlan" id="raiseAmtPlan"
										class="layui-input form-input text-number"
										placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-textrange="5" data-th-value='${entity?.raiseAmtPlan}' required> 
								</div>
							</div>
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.saleMax}">募集上限</label>
								<div class="layui-input-inline input-inline">
									<input type="text" name="saleMax" id="saleMax"
										class="layui-input form-input text-number"
										placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-textrange="5" data-th-value='${entity?.saleMax}' required> 
								</div>
							</div>
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.saleMin}">募集下限</label>
								<div class="layui-input-inline input-inline">
									<input type="text" name="saleMin" id="saleMin"
										class="layui-input form-input text-number"
										placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-textrange="5" data-th-value='${entity?.saleMin}' required> 
								</div>
							</div>
						</div>
						<div class="layui-form-item">
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.startamt}">起点金额</label>
								<div class="layui-input-inline input-inline">
									<input type="text" name="startamt" id="startamt"
										class="layui-input form-input text-number"
										placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-textrange="5" data-th-value='${entity?.startamt}' required> 
								</div>
							</div>
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.lowestamt}">最少追加金额</label>
								<div class="layui-input-inline input-inline">
									<input type="text" name="lowestamt" id="lowestamt"
										class="layui-input form-input text-number"
										placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-textrange="5" data-th-value='${entity?.lowestamt}' required> 
								</div>
							</div>
							<div class="form-inline-wrap">
								<label class="layui-form-label form-label-wrap"
									data-th-text="#{ReportProdFileManage002.subsamtMax}">单笔购买金额上限</label>
								<div class="layui-input-inline input-inline">
									<input type="text" name="subsamtMax" id="subsamtMax"
										class="layui-input form-input text-number"
										placeholder="请输入内容"
										data-th-placeholder="#{SysCommon.placeholder}"
										data-textrange="5" data-th-value='${entity?.subsamtMax}' required> 
								</div>
							</div>
						</div>
						<div class="layui-form-item">
