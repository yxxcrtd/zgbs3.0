<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{ReportContentEnum001}">自定义指标</title>
<style>
.input-btn-append a{
    background: #ffff;
    color: #4893e6;
    line-height:20px;
}
.joyin-form-container{
    background:#fff;
}
.report-colla-wrap .layui-table-body table{
    width:100%;
}
.report-colla-wrap .layui-table-body table tbody tr td .layui-table-cell{
    width:auto;
    float:left;
    height: 24px;
    line-height: 24px;
}

</style>
<style type="text/css">
#aaa{
text-align: right;
}	
</style>
</head>
<body>
    <div layout:fragment="content">
        <div class="layui-col-md3" style="width: 22%;margin-top:-5px">
            <div class="joyin-form-wrap joyin-form-container">
                <form class="layui-form" id="schemeForm">
                    <div class="layui-form-item">
                        <input type="text" id="searchKey" name="searchKey"
                            class="layui-input form-input input-fuzzy-text" placeholder="请输入指标库关键字">
                    </div>
                </form>
            </div>
            <div class="layui-collapse">
                <div class="layui-colla-item" style="padding: 0">
                    <div class="layui-row layui-colla-title" style="margin: 0; line-height: 30px;height:30px;">
                        <div class="layui-col-md6">
                            <span>指标库</span>
                        </div>
                        <div class="layui-col-md3 layui-col-md-offset3">
                            <button type="button" class="layui-btn layui-btn-sm btn-create"
                                id="ReportContentEnum001_btn_add_index" style="margin-top: -3px;">新建</button>
                        </div>
                    </div>
                    <!--左表格  -->
                    <div class="layui-colla-content layui-show report-colla-wrap" style="padding: 0">
                        <table class="layui-table" id="indexIdTable"></table>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-col-md9" style="width: 78%;margin-top: -9px;" >
            <div class="layui-tab layui-tab-card" lay-filter="tabContainer">             
                <div class="layui-tab-content" style="padding: 0">
                    <!--右表  -->
                    <div class="layui-tab-item layui-show"> 
                        <div class="layui-col-md12">
                            <span id="span" style="line-height: 26px;display: inline-block; font-size: 12px;"></span>
                            <div style="float: right;display: inline-block;">
                            <button type="button" class="layui-btn layui-btn-sm btn-create"
                                id="ReportContentEnum003_btn_add">新建</button>
                            <button type="button" class="layui-btn layui-btn-sm btn-delete"
                                id="ReportContentEnum003_btn_delete">删除</button>
                            <button type="button" class="layui-btn layui-btn-sm btn-export btn-default"
                                id="ReportContentEnum003_btn_export">导出</button>  
                            </div>
                                                    
                        </div> 
                        <table class="layui-table" id="typeAssets-table"></table>
                    </div>               
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script
            data-th-src="@{/js/disclosure/information/config/reportcontentenum/ReportContentEnum001.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
