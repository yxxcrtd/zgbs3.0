<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{ReportTreeMenuConfiguration003}">增加子级</title>
<link rel="stylesheet" type="text/css" data-th-href="@{/css/disclosure/report.css}">
</head>
<body>
<div layout:fragment="content">
  <form class="layui-form joyin-form-wrap" id="submitForm">
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md10">
        <label class="layui-form-label form-lable">父级ID</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="PId" name="PId" disabled="true"  class="layui-input form-input" >
        </div>
      </div>
      </div>
      <div class="layui-form-item"> 
      <div class="layui-inline layui-col-md10">
        <label class="layui-form-label form-lable">ID</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="treeId" name="treeId" class="layui-input form-input" required>
        </div>
      </div>
      </div>
      <div class="layui-form-item">
      <div class="layui-inline layui-col-md10">
        <label class="layui-form-label form-lable">子级名称</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="treeName" name="treeName" class="layui-input form-input" required>
        </div>
      </div>
    </div>
    <div class="layui-col-md11" style="margin:50px;">
      <div class="text-center"> <a id="ReportTreeMenuConfiguration003_btn_save" class="layui-btn layui-btn-sm btn-save">保存</a> 
      <a id="ReportTreeMenuConfiguration003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a> </div>
    </div>
  </form>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        	var PId = /*[[${PId}]]*/'';
            $("#PId").val(PId);
    </script>
  <script data-th-src="@{/js/disclosure/information/config/reporttree/ReportTreeMenuConfiguration003.js}" type="text/javascript"></script> 
</div>
</body>
</html>
