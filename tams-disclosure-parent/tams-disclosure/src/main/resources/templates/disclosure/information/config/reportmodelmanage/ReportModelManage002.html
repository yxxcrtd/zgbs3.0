<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>报表模板配置新建</title>
<style type="text/css">
.report-input {
	width: 77.2% !important;
}
.layui-upload-drag {padding-top: 0px;}
</style>
</head>

<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap" style="padding: -15px 0;"
			id="submitForm">			
            <div class="layui-tab layui-tab-card">
            	<div class="layui-tab-item layui-show">
	            	<!-- 文件名字隐藏 -->
	            	<div class="layui-input-inline input-inline" style="display:none;">                               
	                       <input type="text" id="fileName" name="fileName" placeholder="请输入内容"
	                           class="layui-input form-input">
					</div>
					<!-- 文件路径隐藏 -->
					<div class="layui-input-inline input-inline" style="display:none;">                               
	                       <input type="text" id="filePath" name="filePath" placeholder="请输入内容"
	                           class="layui-input form-input">
					</div>
            		<div class="layui-form-item">
            			<div class="layui-inline layui-col-md6 layui-col-xs6 layui-col-sm6 layui-col-lg6">
            				<label class="layui-form-label form-lable" style="width: 100px;">
            				报表编号<i class="iconfont must" style="display: inline;">*</i></label>
            				<div class="layui-input-inline input-inline">
								<input disabled="disabled" type="text" id="repId" name="repId" 
									class="layui-input form-input"
									data-th-Value="${entity?.repId}" required>
							</div>
            			</div>
            			<div class="layui-inline layui-col-md6 layui-col-xs6 layui-col-sm6 layui-col-lg6">
            				<label class="layui-form-label form-lable" style="width: 63px;">
            				报表仓库<i class="iconfont must" style="display: inline;">*</i></label>
            				<div class="layui-input-inline input-inline">
            					<input type="text" id="reportWarehouse" name="reportWarehouse" placeholder="请输入内容"
									class="layui-input form-input"
									data-th-Value="${reportWarehouse}" required disabled="disabled">
            				</div>
            			</div>
            			
            		</div>
            		<div class="layui-form-item">
						<div class="layui-inline layui-col-md6 layui-col-xs6 layui-col-sm6 layui-col-lg6">
            				<label class="layui-form-label form-lable" style="width: 100px;">
            				中文描述<i class="iconfont must" style="display: inline;">*</i></label>
            				<div class="layui-input-inline input-inline">
            					<input type="text" id="reportDesc" name="reportDesc" placeholder="请输入内容"
									class="layui-input form-input"
									data-th-Value="${entity?.reportDesc}" required>
            				</div>
            			</div>
            			<div class="layui-inline layui-col-md6 layui-col-xs6 layui-col-sm6 layui-col-lg6">
            				<label class="layui-form-label form-lable" style="width: 63px;">
            				文件夹<i class="iconfont must" style="display: inline;">*</i></label>
            				<div class="layui-input-inline input-inline">
            					<input type="text" id="folder" name="folder" placeholder="请输入内容"
									class="layui-input form-input"
									data-th-Value="${entity?.folder}" required>
            				</div>
            			</div>
            		</div>
            		<div class="layui-form-item"  style="display:none;">
						<div class="layui-inline layui-col-md6 layui-col-xs6 layui-col-sm6 layui-col-lg6">
            				<label class="layui-form-label form-lable" style="width: 100px;">数据源</label>
            				<div class="layui-input-inline input-inline">
            					<input type="text" id="dataSource" name="dataSource" placeholder="请输入内容"
									class="layui-input form-input"
									data-th-Value="${dataSource}" required>
            				</div>
            			</div>
            			<div class="layui-inline layui-col-md6 layui-col-xs6 layui-col-sm6 layui-col-lg6">
            				<label class="layui-form-label form-lable" style="width: 63px;">生成方式</label>
            				<div class="layui-input-inline input-inline">
            					<input type="text" id="createWay" name="createWay" placeholder="请输入内容"
									class="layui-input form-input"
									data-th-Value="${createWay}" required>
            				</div>
            			</div>
            		</div>
            		<div class="layui-form-item" style="display:none;">
						<div class="layui-inline layui-col-md6 layui-col-xs6 layui-col-sm6 layui-col-lg6">
            				<label class="layui-form-label form-lable" style="width: 63px;">报表名称</label>
            				<div class="layui-input-inline input-inline">
            					<input type="text" id="repName" name="repName" placeholder="请输入内容"
									class="layui-input form-input"
									data-th-Value="${entity?.repName}" required>
            				</div>
            			</div>
            			<div class="layui-inline layui-col-md6 layui-col-xs6 layui-col-sm6 layui-col-lg6">
            				<label class="layui-form-label form-lable" style="width: 63px;">用户名</label>
            				<div class="layui-input-inline input-inline">
            					<input type="text" id="userName" name="userName" placeholder="请输入内容"
									class="layui-input form-input"
									data-th-Value="${userName}" required>
            				</div>
            			</div>
            		</div>
            		<div class="layui-form-item">
            			<div class="layui-inline layui-col-md6 layui-col-xs6 layui-col-sm6 layui-col-lg6"  style="display:none;">
	            			<label class="layui-form-label form-lable" style="width: 100px;">密码</label>
	            				<div class="layui-input-inline input-inline">
	            					<input type="text" id="passWord" name="passWord" placeholder="请输入内容"
										class="layui-input form-input"
										data-th-Value="${passWord}" required>
	            				</div>
	            		</div>
            	    </div>
            	    <div class="layui-form-item">
	            			<label class="layui-form-label form-lable" style="width: 100px;">参数配置
	            			<i class="iconfont must" style="display: inline;"></i></label>
	            			<div class="layui-input-inline input-inline"
									style="width: 15% !important;">
	
								</div>
								<div class="layui-input-inline input-inline"
									style="width: 15% !important;">
									<input type="text" id="paramName1" name="paramName1"
										class="layui-input form-input input-input" placeholder="请输入参数名称"
										>
									</input>
								</div>
								<div class="layui-input-inline input-inline"
									style="width: 15% !important;">
									<input type="text" id="name1" name="name1"
										class="layui-input form-input input-input" placeholder="请输入参数中文描述"
										>
									</input>
								</div>
								<div class="layui-input-inline input-inline"
									style="width: 15% !important;">
									<select id="paramType1" name="paramType1" class="layui-input form-input input-select"
				                        placeholder="请选择" data-th-data-result="${DIS_DATA_TYPE}" allowClear="true"
				                        >
				                   </select>
								</div>
								<div class="layui-input-inline input-inline"
									style="width: 5% !important;">
									<a id="ReportModelManage002_btn_paramAdd"
										class="layui-btn layui-btn-sm btn-download">参数增加
									</a>
	            		</div>
            	    
            	    
            			
							
            	    </div>
            	    <div class="layui-form-item">
            	    	<label class="layui-form-label form-lable" style="width: 110px;"></label>
            	    	<div class="layui-inline report-input"  style="transform:translate(110px,0px)">
								<table class="layui-table" id="addParam" name="addParam" ></table>
						</div>
            	    </div>
            	    
            	    
            	    <div class="layui-form-item">
            				<label class="layui-form-label form-lable"style="width: 103px;">
	                                                                                   文件上传<i class="iconfont must" style="display: inline;">*</i></label>
	                		<div class="layui-inline layui-col-md6" >
	            				<div class="upload" id="uploadReport" style="width:400px;height:75px;"
	                				data-option="{ allowFileType: 'zip',type: 'drag', muiltiple: false, callback: 'FileCommon.onUploaded'}">
	            				</div>
	            				
	            			</div>
	            			<label class="layui-form-label form-lable"style="width: 300px;">文件仅支持上传zip格式文件,将文件大小限制为10MB</label>
            			
            		</div>
            		
            		<div class="layui-form-item">
            			<div class="layui-inline layui-col-md6 layui-col-xs6 layui-col-sm6 layui-col-lg6" id="ReportModelManage002_btn_downtablefield" style="display:none;">
            				<label class="layui-form-label form-lable" style="width: 100px;">文件下载
	            			<i class="iconfont must" style="display: inline;"></i></label>
	                		<div class="layui-inline layui-col-md6" >
	            				<button type="button" class="layui-btn layui-btn-sm btn-default"
										id="downloadReport">
										<i class="iconfont icon-export"></i>下载报表模板
									</button>
	            			</div>
            			</div>
            			
            		</div>
            		
            		
            		<div class="layui-form-item">

            	    </div>

            <!-- 	     <div class="layui-form-item">
								<div class="layui-inline report-input" style="transform:translate(53px,0px)">
									<a id="ReportModelManage002_btn_upload"
										class="layui-btn layui-btn-sm btn-download">文件上传
									</a>
									<a id="ReportModelManage002_btn_deletAll"
										class="layui-btn layui-btn-sm btn-download">全部删除
									</a>
								</div>
            	    </div> -->
            	    <!-- <div class="layui-form-item">
            	    	<div class="layui-inline report-input"  style="transform:translate(53px,0px)">
								<table class="layui-table" id="fileTable" name="fileTable" ></table>
						</div>
            	    </div> -->
                </div>
            </div>
            <div class="layui-col-md11" style="margin: 50px;">
				<div class="text-center">
					<a id="ReportModelManage002_btn_save"
						class="layui-btn layui-btn-sm btn-save"
						data-th-text="#{SysCommon.save}">保存</a> <a
						id="ReportModelManage002_btn_cancel"
						class="layui-btn layui-btn-sm btn-cancel"
						data-th-text="#{SysCommon.cancel}">取消</a>
				</div>
			</div>
        </form>
	</div>
</body>
<div layout:fragment="script">
         <script
        data-th-src="@{/js/disclosure/information/config/reportmodelmanage/ReportModelManage002.js}"
        type="text/javascript"></script>  
</div>

</html>
