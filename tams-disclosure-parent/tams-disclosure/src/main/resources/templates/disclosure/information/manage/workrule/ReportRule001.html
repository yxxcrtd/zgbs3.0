<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>报表规则配置</title>
</head>
<body>

</body>
<div layout:fragment="content">
    <div class="form-button-area" export="false">
        <!-- 新建-->
        <button type="button" class="layui-btn layui-btn-sm btn-default" id="ReportRule001_btn_add"><i class="iconfont icon-add"></i>新建 </button>
        <!-- 删除 -->
        <button type="button" class="layui-btn layui-btn-sm btn-default" id="ReportRule001_btn_delete"><i class="iconfont icon-delete"></i>删除 </button>
        <!-- 导出 -->
        <button type="button" class="layui-btn layui-btn-sm btn-default" id="ReportRule001_btn_export"><i class="iconfont icon-export"></i>导出</button>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
      <form class="layui-form" id="searchForm"> 
          <div class="layui-form-item">
              <div class="layui-inline layui-col-md4">
                  <label class="layui-form-label form-lable">规则名称</label>
                  <div class="layui-input-inline input-inline">
                      <input type="text" id="ruleName" name="ruleName" class="layui-input form-input" 
                             placeholder="请输入" 
                             allowClear="true"  data-th-placeholder="#{SysCommon.placeholder}">
                  </div>
              </div>
              <div class="layui-inline layui-col-md4">
                  <label class="layui-form-label form-lable">报表名称</label>
                  <div class="layui-input-inline input-inline">
                      <select id="repName" name="repName"
										class="layui-input form-input input-select"
										data-th-formatoption="false"
										data-th-data-result="${REPORT_NAME}" allowClear="true"
										placeholder="请输入内容" data-th-initValue="${entity?.repId}">
					  </select>
                  </div>
              </div>

          </div>
      </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/disclosure/information/manage/workrule/ReportRule001.js}" type="text/javascript"></script>
</div>
</html>
