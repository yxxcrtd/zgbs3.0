
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{ReportMenuPowerConfig001}">报表菜单权限配置</title>
</head>
<body>
<div layout:fragment="content">
	<div class="layui-row layui-col-space15">	   
        <div class="form-button-area" export="true">
		<a id="ReportMenuPowerConfig001_btn_powerAssign" class="layui-btn layui-btn-sm btn-default">
  			<i class="iconfont icon-hand"></i>权限分配</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">         
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable2">报表名称</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="reportName" name="reportName" placeholder="请输入内容" class="layui-input form-input">
                        </div>
                    </div>   
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>   	
    </div>
</div>
</body>
<div layout:fragment="script">
  <script data-th-src="@{/js/disclosure/information/reportpower/ReportMenuPowerConfig001.js}" type="text/javascript"></script>
</div>

</html>
