<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>导出报表</title>
<style type="text/css">
/* .report-input { 
	width: 77.2% !important;
}*/
</style>
</head>

<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap" style="padding: -15px 0;" id="submitForm">			
			<input type="hidden" id="tabNum" name="tabNum" data-th-Value="${tabNum}">
            <div class="layui-tab layui-tab-card">
            	<!-- 报表生成条件div -->
            	<div class="layui-tab-item layui-show" id="reporSearch">
                </div>
            </div>
            <div class="layui-col-md11" style="margin: 50px;">
				<div class="text-center">
					<a id="PoiReportModelManage003_btn_generate" class="layui-btn layui-btn-sm btn-export">生成</a>
					<a id="PoiReportModelManage003_btn_export" class="layui-btn layui-btn-sm btn-export">导出</a>
					<a id="PoiReportModelManage003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
				</div>
			</div>
        </form>
	</div>
</body>
<div layout:fragment="script">
	<script data-th-src="@{/js/disclosure/information/config/poireportmodelmanage/PoiReportModelManage003.js}" type="text/javascript"></script> 
	<script data-th-inline="javascript" type="text/javascript">
	    var cureDate = [[${cureDate}]];
	</script>
</div>
</html>
