<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>渠道接口信息查询</title>
</head>
<body>

</body>
<div layout:fragment="content">
	<div class="form-button-area" export="false">
		<!-- 获取反馈信息 -->
		<button type="button" class="layui-btn layui-btn-sm btn-default"
			id="ChannelInterface001_btn_receiveinfo">
			<i class="iconfont icon-circle-correct_fill"></i>获取反馈信息
		</button>
		<!-- 重新发送 -->
		<button type="button" class="layui-btn layui-btn-sm btn-default"
			id="ChannelInterface001_btn_resend">
			<i class="iconfont icon-reverse_audit"></i>重新发送
		</button>
		<!-- 导出 -->
		<button type="button" class="layui-btn layui-btn-sm btn-default"
			id="ChannelInterface001_btn_export">
			<i class="iconfont icon-export"></i>导出
		</button>
	</div>

	<div class="joyin-form-wrap joyin-filter-form condition-area">
		<form class="layui-form" id="searchForm">

			<input type="hidden" name="confromPage" id="confromPage"
				data-th-value="${confromPage}"> <input type="hidden"
				name="revealEndDateHidden" id="revealEndDateHidden"
				data-th-value="${searchDate}"> <input type="hidden"
				name="searchDateStart" id="searchDateStart"
				data-th-value="${searchDateStart}"> <input type="hidden"
				name="searchDateEnd" id="searchDateEnd"
				data-th-value="${searchDateEnd}">

			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">产品编号</label>
					<div class="layui-input-inline input-inline">
						<select id="prodId" name="prodId"
							class="layui-input form-input input-select" placeholder="请选择，可复选"
							data-url='getPrdInfoSelect' allowClear="true" multiple="multiple">
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">发送状态</label>
					<div class="layui-input-inline input-inline">
						<select id="sendStatus" name="sendStatus"
							class="layui-input form-input input-select" placeholder="请选择，可复选"
							data-th-data-result="${REVEAL_PUSH_STATUS}" allowClear="true"
							multiple="multiple">
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">反馈状态</label>
					<div class="layui-input-inline input-inline">
						<select id="receiveStatus" name="receiveStatus"
							class="layui-input form-input input-select" placeholder="请选择，可复选"
							data-th-data-result="${REVEAL_REVEICE_STATUS}" allowClear="true"
							multiple="multiple">
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">报表类别</label>
					<div class="layui-input-inline input-inline">
						<select id="repType" name="repType" class="layui-input form-input input-select" data-th-formatoption="false"
                           placeholder="请选择，可复选" data-th-data-result="${REPORT_STYLE}" allowClear="true"
                           multiple="multiple" data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
					</div>
				</div>

				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">文件名称</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="fileName" name="fileName"
							class="layui-input form-input" placeholder="请选择"
							data-th-data-result="${REPORT_ID}" allowClear="true"
							multiple="multiple"
							data-th-placeholder="#{SysCommon.placeholder}">
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">发送日期</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="sendDate" name="sendDate"
							placeholder="请选择时间区间"
							class="layui-input form-input input-dateRangeSelect" value="">
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">披露渠道</label>
					<div class="layui-input-inline input-inline">
						<select id="channelCode" name="channelCode"
							class="layui-input form-input input-select" placeholder="请选择，可复选"
							data-th-data-result="${REVEAL_CHANNEL}" allowClear="true"
							multiple="multiple">
						</select>
					</div>
				</div>
			</div>
		</form>
		<!-- <input type="text" id="workflowId" name="workflowId"
			data-th-value="${workflowId}" disabled="disabled"
			style="display: none;">
		按条件查询列  -->
	</div>
	<div>
		<table class="layui-table" id="dataTable"></table>
	</div>
</div>
<div layout:fragment="script">
	<script data-th-src="@{/js/disclosure/information/reveal/channelinterface/ChannelInterface001.js}"
		type="text/javascript">
		
	</script>
</div>
</html>
