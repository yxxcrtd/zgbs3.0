<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>报表作业监控</title>
</head>
<body>

</body>
<div layout:fragment="content">
    <div class="form-button-area" export="false">
        <!-- 新建-->
<!--         <button type="button" class="layui-btn layui-btn-sm btn-default" id="ReportWorkMonitor001_btn_add"><i class="iconfont icon-add"></i>新建 </button> -->
        <!-- 删除 -->
<!--         <button type="button" class="layui-btn layui-btn-sm btn-default" id="ReportWorkMonitor001_btn_delete"><i class="iconfont icon-delete"></i>删除 </button> -->
        <!-- 导出 -->
        <button type="button" class="layui-btn layui-btn-sm btn-default" id="ReportWorkMonitor001_btn_export"><i class="iconfont icon-export"></i>导出</button>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
      <form class="layui-form" id="searchForm"> 
          <div class="layui-form-item">
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">任务名称</label>
                <div class="layui-input-inline input-inline">
                    <select id="jobId" name="jobId" class="layui-input form-input input-select" data-th-formatoption="false"
                        placeholder="请选择，可复选" data-th-data-result="${JOBID_LIST}" allowClear="true"
                        multiple="multiple" data-th-placeholder="#{SysCommon.placeholder}">
                    </select>
                </div>
            </div>

            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">执行状态</label>
                <div class="layui-input-inline input-inline">
                    <select id="execStatus" name="execStatus" class="layui-input form-input input-select"
                        placeholder="请选择" data-th-data-result="${EXEC_STATUS}" allowClear="true"
                        multiple="multiple">
                    </select>
                </div>
            </div>
		</div>
	  	<div class="layui-form-item">
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">执行日期</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="runDate" name="runDate" placeholder="请选择、支持区间" 
                        class="layui-input form-input input-dateRangeSelect" value="">
                </div>
            </div> 
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">执行结果</label>
                <div class="layui-input-inline input-inline">
                    <select id="execResult" name="execResult" class="layui-input form-input input-select"
                        placeholder="请选择" data-th-data-result="${EXEC_RESULT}" allowClear="true"
                        multiple="multiple">
                    </select>
                </div>
            </div> 
          </div>
      </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/disclosure/information/manage/workmonitor/ReportWorkMonitor001.js}" type="text/javascript"></script>
</div>
</html>
