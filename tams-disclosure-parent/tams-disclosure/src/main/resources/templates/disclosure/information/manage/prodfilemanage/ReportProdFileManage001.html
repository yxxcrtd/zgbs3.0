<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{ReportProdFileManage001}">产品文件管理</title>
</head>
<body>

<div layout:fragment="content">
	<div class="form-button-area" export="false">
        <!-- 新建-->
        <button type="button" class="layui-btn layui-btn-sm btn-default" id="ReportProdFileManage001_btn_add"><i class="iconfont icon-add"></i>新建 </button>
        <!-- 删除 -->
        <button type="button" class="layui-btn layui-btn-sm btn-default" id="ReportProdFileManage001_btn_delete"><i class="iconfont icon-delete"></i>删除 </button>
		<a class="layui-btn layui-btn-sm btn-select" id="ReportProdFileManage001_btn_export">导出文件<i class="iconfont icon-down"></i></a>
		<ul class="btn-select-wrap" style="display: none;width: 75px;" id="toExport">
          	<li><a href="javascript:;" id="wordExport">word</a></li>
         	<li><a href="javascript:;" id="pdfExport">pdf</a></li>
      	</ul>
		<a class="layui-btn layui-btn-sm btn-select" id="ReportProdFileManage001_btn_generate">生成文件<i class="iconfont icon-down"></i></a>
    	<ul class="btn-select-wrap" style="display: none;width: 75px;" id="toSubmit">
        	<li><a href="javascript:;" id="wordSubimt">word</a></li>
        	<li><a href="javascript:;" id="pdfSubimt">pdf</a></li>
              
     	</ul>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
    	<form class="layui-form" id="searchForm"> 
        	<div class="layui-form-item">
        		<div class="layui-inline layui-col-md4">
	                <label class="layui-form-label form-lable">文件类别</label>
	                <div class="layui-input-inline input-inline">
	                    <select id="reportType" name="reportType" class="layui-input form-input input-select"
	                        placeholder="请选择" data-th-data-result="${DIS_REPORT_TYPE}" allowClear="true"
	                        data-th-placeholder="#{SysCommon.placeholder}"
	                        data-th-initValue='${reportType}' required>
	                    </select>
	                </div>
            	</div>
          		<div class="layui-inline layui-col-md4">
	                <label class="layui-form-label form-lable">产品代码</label>
	                <div class="layui-input-inline input-inline">
	                    <select id="prodId" name="prodId" class="layui-input form-input input-select"
	                        placeholder="请选择" data-url='getPrdInfoSelectPF' allowClear="true"
	                        data-th-placeholder="#{SysCommon.placeholder}" multiple="multiple">
	                    </select>
	                </div>
	            </div>
            	<div class="layui-inline layui-col-md4">
                  	<label class="layui-form-label form-lable">收益类型</label>
	              	<div class="layui-input-inline input-inline">
	                	<select id="profitType" name="profitType" class="layui-input form-input input-select"
	                     	placeholder="请选择" data-th-data-result="${PROFIT_TYPE}" allowClear="true"
	                        data-th-placeholder="#{SysCommon.placeholder}" multiple="multiple">
	                    </select>
	                </div>
              </div>
          </div>
          <div class="layui-form-item">
        		<div class="layui-inline layui-col-md4">
	                <label class="layui-form-label form-lable">产品系列</label>
	                <div class="layui-input-inline input-inline">
	                	<select id="prodSeries" name="prodSeries" class="layui-input form-input input-select"
	                     	placeholder="请选择" data-url='getProdSeriesSelectPF' allowClear="true"
	                        data-th-placeholder="#{SysCommon.placeholder}" multiple="multiple">
	                    </select>
	                </div>
            	</div>
          		<div class="layui-inline layui-col-md4">
	                <label class="layui-form-label form-lable">发行方式</label>
	                <div class="layui-input-inline input-inline">
	                	<select id="issueType" name="issueType" class="layui-input form-input input-select"
	                     	placeholder="请选择" data-th-data-result="${ISSUE_MODE}" allowClear="true"
	                        data-th-placeholder="#{SysCommon.placeholder}" multiple="multiple">
	                    </select>
	                </div>
	            </div>
            	<div class="layui-inline layui-col-md4">
                  	<label class="layui-form-label form-lable">有效状态</label>
	              	<div class="layui-input-inline input-inline">
	                	<select id="dataStatus" name="dataStatus" class="layui-input form-input input-select"
	                     	placeholder="请选择" data-th-data-result="${MAINTAIN_STATUS}" allowClear="true"
	                        data-th-placeholder="#{SysCommon.placeholder}" multiple="multiple">
	                    </select>
	                </div>
              </div>
          </div>
          <div class="layui-form-item">
          		<div class="layui-inline layui-col-md4">
	                <label class="layui-form-label form-lable">募集起始日</label>
	                <div class="layui-input-inline input-inline">
						<input id="raiseVdate" name='raiseVdate' placeholder="请选择时间区间"
							class="layui-input form-input input-dateRangeSelect"
							data-th-placeholder="#{SysCommon.placeholder}">
					</div>
	            </div>
            	<div class="layui-inline layui-col-md4">
                  	<label class="layui-form-label form-lable">募集结束日</label>
	              	<div class="layui-input-inline input-inline">
						<input id="raiseEnddate" name='raiseEnddate' placeholder="请选择时间区间"
							class="layui-input form-input input-dateRangeSelect"
							data-th-placeholder="#{SysCommon.placeholder}">
					</div>
              </div>
              <div class="layui-inline layui-col-md4">
	                <label class="layui-form-label form-lable">募集方式</label>
	                <div class="layui-input-inline input-inline">
	                	<select id="raiseType" name="raiseType" class="layui-input form-input input-select"
	                     	placeholder="请选择" data-th-data-result="${RAISE_TYPE}" allowClear="true"
	                        data-th-placeholder="#{SysCommon.placeholder}" multiple="multiple">
	                    </select>
	                </div>
            	</div>
          </div>
          <div class="layui-form-item">
        		<div class="layui-inline layui-col-md4">
	                <label class="layui-form-label form-lable">产品起息日</label>
	                <div class="layui-input-inline input-inline">
						<input id="vdate" name='vdate' placeholder="请选择时间区间"
							class="layui-input form-input input-dateRangeSelect"
							data-th-placeholder="#{SysCommon.placeholder}">
					</div>
            	</div>
          		<div class="layui-inline layui-col-md4">
	                <label class="layui-form-label form-lable">募集币种</label>
	                <div class="layui-input-inline input-inline">
	                	<select id="ccy" name="ccy" class="layui-input form-input input-select"
	                     	placeholder="请选择" data-th-data-result="${CCY}" allowClear="true"
	                        data-th-placeholder="#{SysCommon.placeholder}" multiple="multiple">
	                    </select>
	                </div>
	            </div>
            	<div class="layui-inline layui-col-md4">
                  	<label class="layui-form-label form-lable">产品收益标识</label>
	              	<div class="layui-input-inline input-inline">
	                	<select id="profitFlag" name="profitFlag" class="layui-input form-input input-select"
	                     	placeholder="请选择" data-th-data-result="${PRODPROFITFLAG}" allowClear="true"
	                        data-th-placeholder="#{SysCommon.placeholder}" multiple="multiple">
	                    </select>
	                </div>
              </div>
          </div>
      </form>
    </div>
    <div>
    <div class="layui-fluid">
		<div class="layui-tab layui-tab-brief " id="tabList" lay-filter="tabList" style="margin-bottom: 0px;" overflow>
			<ul class="layui-tab-title">
                <li class="layui-this" lay-id="01">产品说明书</li>
				<!-- <li lay-id="02">XXX</li> -->
			</ul>
			<div class="layui-tab-content" >
	            <div class="layui-tab-item layui-show">
	                <table class="layui-table" id="dataTable01"></table>
	            </div>
			    <!-- <div class="layui-tab-item">
					<table class="layui-table" id="dataTable02"></table>
				</div> -->
			</div>
		</div>
	</div>
    </div>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/disclosure/information/manage/prodfilemanage/ReportProdFileManage001.js}" type="text/javascript"></script>
	<script data-th-src="@{/js/disclosure/report.js}" type="text/javascript"></script>
	<script data-th-inline="javascript" type="text/javascript">
        var prod = [[${prodInfoList}]];
        var prodArray =  $.parseJSON(prod);
        var REPORT_SERVER_URL = [[${REPORT_SERVER_URL}]];
        var REPORT_USERNAME = [[${REPORT_USERNAME}]];
        var REPORT_PASSWORD = [[${REPORT_PASSWORD}]];
        var REPORT_SERVER_PATH = [[${REPORT_SERVER_PATH}]];
        var cureDate = [[${cureDate}]];
	</script>
</div>
</body>
</html>
