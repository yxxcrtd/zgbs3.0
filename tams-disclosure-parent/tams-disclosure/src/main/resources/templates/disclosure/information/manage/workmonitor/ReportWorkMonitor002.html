<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>报表作业管理</title>
</head>
<body>

</body>
<div layout:fragment="content">
    <div class="form-button-area" export="false">
    	<!-- 导出 -->
        <button type="button" class="layui-btn layui-btn-sm btn-default" id="ReportWorkMonitor002_btn_export"><i class="iconfont icon-export"></i>导出</button>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
      <form class="layui-form" id="searchForm"> 
          <input id="execDateHidden" type="hidden" name="execDateHidden" data-th-value="${execDate}">
          <input type="hidden" name="confromPage" id="confromPage" data-th-value="${confromPage}">
          <!-- <input type="hidden" id="revealEndDateHidden" name="revealEndDateHidden" data-th-value="${searchDate}"> -->
          <input type="hidden" name="searchDateStart" id="searchDateStart" data-th-value="${searchDateStart}">
          <input type="hidden" name="searchDateEnd" id="searchDateEnd" data-th-value="${searchDateEnd}">
          <div class="layui-form-item">
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">产品</label>
                <div class="layui-input-inline input-inline">
                    <select id="prodId" name="prodId" class="layui-input form-input input-select"
                        placeholder="请选择" data-url='getPrdInfoSelect' allowClear="true"
                        multiple="multiple">
                    </select>
                </div>
            </div>

            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">报表</label>
                <div class="layui-input-inline input-inline">
	                <input type="text" id="repName" name="repName" class="layui-input form-input" 
	                       placeholder="请选择" data-th-data-result="${REPORT_ID}" 
	                       allowClear="true" multiple="multiple" 
	                       data-th-placeholder="#{SysCommon.placeholder}">
                </div>
            </div>
            
            <!-- <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">执行状态</label>
                <div class="layui-input-inline input-inline">
                    <select id="execStatus" name="execStatus" class="layui-input form-input input-select"
                        placeholder="请选择" data-th-data-result="${EXEC_RESULT}" allowClear="true"
                        multiple="multiple">
                    </select>
                </div>
            </div>  -->
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">执行日期</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="execDate" name="execDate" placeholder="请选择、支持区间" 
                        class="layui-input form-input input-dateRangeSelect" value=""
                        data-th-value="${execDate}">
                </div>
            </div>
		</div>
	  	<div class="layui-form-item">
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">执行结果</label>
                <div class="layui-input-inline input-inline">
                    <select id="execResult" name="execResult" class="layui-input form-input input-select"
                        placeholder="请选择" data-th-data-result="${EXEC_RESULT}" allowClear="true"
                        multiple="multiple" data-th-initValue='${execResult}'>
                    </select>
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">作业名称</label>
                <div class="layui-input-inline input-inline">
                    <select id="jobId" name="jobId" class="layui-input form-input input-select" data-th-formatoption="false"
                        placeholder="请选择，可复选" data-th-data-result="${JOBID_LIST}" allowClear="true"
                        multiple="multiple" data-th-placeholder="#{SysCommon.placeholder}"
                        data-th-initValue='${jobId}'>
                    </select>
                </div>
            </div> 
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">报表类别</label>
                <div class="layui-input-inline input-inline">
                    <select id="repType" name="repType" class="layui-input form-input input-select"
                        placeholder="请选择，可复选" data-th-data-result="${REPORT_STYLE}" allowClear="true"
                        multiple="multiple" data-th-placeholder="#{SysCommon.placeholder}" data-th-initValue='${repType}'>
                    </select>
                </div>
            </div>
          </div>
          <div class="layui-form-item">
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">披露截止日</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="revealEndDate" name="revealEndDate" placeholder="请选择、支持区间" 
                        class="layui-input form-input input-dateRangeSelect" value="">
                </div>
            </div>
          </div>
      </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/disclosure/information/manage/workmonitor/ReportWorkMonitor002.js}" type="text/javascript"></script>
</div>
</html>
