<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>报表规则设置</title>
</head>
<body>
</body>
<div layout:fragment="content">
	<form class="layui-form joyin-form-wrap" style="padding: -15px 0;"
		id="submitForm">
		<fieldset class="layui-elem-field layui-field-title">
			<div class="layui-collapse" lay-filter="test">
				<div class="layui-colla-item">
					<h2 class="layui-colla-title">
						<a href="javascript:;">新建</a>
					</h2>
					<div class="layui-colla-content layui-show">
						<div class="layui-form-item">
							<div class="layui-inline layui-col-md6">
								<label class="layui-form-label form-lable" style="width: 100px">
									报表名称 <i class="iconfont must" style="display: inline;">*</i>
								</label>
								<div class="layui-input-inline input-inline">
									<select id="repName" name="repName"
										class="layui-input form-input input-select"
										data-th-formatoption="false"
										data-th-data-result="${REPORT_NAME}" allowClear="true"
										placeholder="请输入内容" data-th-initValue="${entity?.repId}">
									</select>
								</div>
							</div>
							<div class="layui-inline layui-col-md4">
								<input id="id" name="id" type="hidden" 
									class="layui-input form-input " allowClear="true"
									placeholder="请输入内容" data-th-Value="${entity?.id}">
							</div>
						</div>
						<div class="layui-form-item">
							<div class="layui-inline layui-col-md6">
								<label class="layui-form-label form-lable " style="width: 100px">
									报表规则名称 <i class="iconfont must" style="display: inline;">*</i>
								</label>
								<div class="layui-input-inline input-inline">
									<input id="ruleName" name="ruleName" title=" " onmouseover="this.title = this.value" 
										class="layui-input form-input " allowClear="true"
										placeholder="请输入内容" data-th-Value="${entity?.ruleName}"
										>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</fieldset>
		<fieldset class="layui-elem-field layui-field-title">
			<div class="layui-collapse" lay-filter="test">
				<div class="layui-colla-item">
					<h2 class="layui-colla-title">
						<a href="javascript:;">报表生成规则</a>
					</h2>
					<div class="layui-colla-content layui-show">
						<div class="layui-form-item">
							<div class="layui-inline layui-col-md4">
								<label class="layui-form-label form-lable" style="width: 100px"> 披露频率 
								 <i class="iconfont must" style="display: inline;">*</i>
								</label>
								<div class="layui-input-inline input-inline">
									<input id="rcfType" name="rcfType"
										class="layui-input form-input input-select"
										data-th-formatoption="false"
										data-th-data-result="${REVEAL_FREQUENCY}" allowClear="true"
										placeholder="请输入内容" data-th-Value="${entity?.rcfType}">
								</div>
							</div>
						</div>
						<div class="layui-form-item">
							<div class="layui-inline layui-col-md4">
								<label class="layui-form-label form-lable" style="width: 100px"> 
									基准日 <i class="iconfont must" style="display: inline;">*</i>
								</label>
								<div class="layui-input-inline input-inline">
									<input id="basisDateType" name="basisDateType"
										class="layui-input form-input input-select"
										data-th-formatoption="false"
										data-th-data-result="${BASIS_DATE_TYPE}" allowClear="true"
										placeholder="请输入内容" data-th-Value="${entity?.basisDateType}">
								</div>
							</div>
						</div>
						<div class="layui-form-item">
								<label class="layui-form-label form-lable" style="width: 100px"> 
									生成时点 <i class="iconfont must" style="display: inline;" >*</i>
								</label>
								<div class="layui-input-inline input-inline"style="width: 20% !important;">
									<input id="makeType" name="makeType"
										class="layui-input form-input input-select"
										data-th-formatoption="false" allowClear="true"
										data-th-data-result="${MAKE_TIME_TYPE}"
										data-th-Value="${entity?.makeType}" placeholder="请输入内容">
								</div>
								
								<div class="layui-input-inline input-inline" style="width: 15% !important;margin-left:10px;" >
									<input type="text" id="makeValue" name="makeValue"
										class="layui-input form-input text-number" data-textrange="0"
										placeholder="请输入天数" data-th-Value="${entity?.makeValue}">
								</div>
								<div class="layui-input-inline input-inline" style="width: 15% !important;margin-left:10px;">
									<input id="makeDateType" name="makeDateType"
										class="layui-input form-input input-select"
										data-th-formatoption="false" allowClear="true"
										data-th-data-result="${DIS_DATE_TYPE}"
										data-th-Value="${entity?.makeDateType}" placeholder="请输入内容">
								</div>
						</div>
						<div class="layui-form-item">
								<label class="layui-form-label form-lable" style="width: 100px"> 
									披露截止时点 <i class="iconfont must" style="display: inline;">*</i>
								</label>
								<div class="layui-input-inline input-inline" style="width: 20% !important;">
									<input id="revealType" name="revealType"
										class="layui-input form-input input-select"
										data-th-formatoption="false" allowClear="true"
										data-th-data-result="${TIME_TYPE}"
										data-th-Value="${entity?.revealType}" placeholder="输入内容">
								</div>
								<div class="layui-input-inline input-inline" style="width: 15% !important;margin-left:10px;">
									<input type="text" id="revealValue" name="revealValue"
										class="layui-input form-input text-number" data-textrange="0"
										placeholder="请输入天数" data-th-Value="${entity?.revealValue}">
								</div>
								<div class="layui-input-inline input-inline" style="width: 15% !important;margin-left:10px;">
									<input id="revealDateType" name="revealDateType"
										class="layui-input form-input input-select"
										data-th-formatoption="false" allowClear="true"
										data-th-data-result="${DIS_DATE_TYPE}"
										data-th-Value="${entity?.revealDateType}" placeholder="输入内容">
								</div>
								<div class="layui-input-inline input-inline"style="width: 15% !important;margin-left:10px;">
									<input type="time" id="revealTime" name="revealTime"
										placeholder="请选择时间" class="layui-input form-input "
										format:"HH:mm" allowClear="true" 
										data-th-Value="${entity?.revealTime}?:${time}" >
										
								</div>
						</div>
					</div>
				</div>
			</div>
		</fieldset>
		<fieldset class="layui-elem-field layui-field-title">
			<div class="layui-collapse" lay-filter="test">
				<h2 class="layui-colla-title">
					<a href="javascript:;">内容取数规则</a>
				</h2>
				<div class="layui-colla-content layui-show">
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4">
							<label class="layui-form-label form-lable" style="width: 100px"> 
							报表数据类型 <i class="iconfont must" style="display: inline;">*</i>
							</label>
							<div class="layui-input-inline input-inline">
								<input id="dataType" name="dataType"
									class="layui-input form-input input-select"
									data-th-formatoption="false" 
									data-th-data-result="${REPORT_DATA_TYPE}" allowClear="true"
									placeholder="请输入内容" data-th-Value="${entity?.dataType}">
							</div>
						</div>
						<div class="layui-inline layui-col-md4">
							<label class="layui-form-label form-lable" style="width: 100px"> 
								取数范围<i class="iconfont must" style="display: inline;">*</i>
							 </label>
							<div class="layui-input-inline input-inline">
								<input id="dataRange" name="dataRange"
									class="layui-input form-input input-select"
									data-th-formatoption="false" 
									data-th-data-result="${DATA_RANGE}" allowClear="true"
									placeholder="请输入内容" data-th-Value="${entity?.dataRange}">
							</div>
						</div>
					</div>
					<div class="layui-form-item">
						<div class="layui-inline layui-col-md4">
							<label class="layui-form-label form-lable" style="width: 100px"> 取数开始日 </label>
							<div class="layui-input-inline input-inline">
								<input id="dataBegin" name="dataBegin"
									class="layui-input form-input input-select"
									data-th-formatoption="false"
									data-th-data-result="${WEEK}" allowClear="true"
									placeholder="请输入内容" data-th-Value="${entity?.dataBegin}">
							</div>
						</div>
						<div class="layui-inline layui-col-md4">
							<label class="layui-form-label form-lable" style="width: 100px"> 取数结束日 </label>
							<div class="layui-input-inline input-inline">
								<input id="dataEnd" name="dataEnd"
									class="layui-input form-input input-select"
									data-th-formatoption="false"
									data-th-data-result="${WEEK}" allowClear="true"
									placeholder="请输入内容" data-th-Value="${entity?.dataEnd}">
							</div>
						</div>
						<div class="layui-inline layui-col-md4">
							<label class="layui-form-label form-lable" style="width: 100px"> 
							范围值 
							</label>
							<div class="layui-input-inline input-inline">
								<input id="dataValue" name="dataValue"
									class="layui-input form-input input-select"
									data-th-formatoption="false"
									data-th-data-result="${WEEK}" allowClear="true"
									placeholder="请输入内容" data-th-Value="${entity?.dataValue}">
								<!-- <input type="text" id="dataValue" name="dataValue"
									class="layui-input form-input"
									data-th-placeholder="#{SysCommon.placeholder}"
									data-th-Value="${entity?.dataValue}"> -->
							</div>
						</div>
					</div>
				</div>
			</div>
		</fieldset>
		<fieldset class="layui-elem-field layui-field-title">
			<div class="layui-collapse" lay-filter="test">
				<div class="layui-colla-item">
					<h2 class="layui-colla-title">
						<a href="javascript:;">确认规则</a>
					</h2>
					<div class="layui-colla-content layui-show">
						<div class="layui-form-item">
							<div
								class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
								<label class="layui-form-label form-lable" style="width: 100px"> 
								确认方式 <i class="iconfont must" style="display: inline;">*</i>
								</label>
								<div class="layui-input-inline input-inline">
									<input type="text" id="isConfirm" name="isConfirm"
										conFirmType="" placeholder="请输入内容"
										class="layui-input form-input input-checkbox"
										data-th-data-result="${CONFIRM_TYPE}"
										data-th-initValue="${entity?.isConfirm}">
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</fieldset>
		<fieldset class="layui-elem-field layui-field-title">
			<div class="layui-collapse" lay-filter="test">
				<div class="layui-colla-item">
					<h2 class="layui-colla-title">
						<a href="javascript:;">报表披露规则</a>
					</h2>
					<div class="layui-colla-content layui-show">
						<div class="layui-form-item">
							<div
								class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
								<label class="layui-form-label form-lable"
									style="text-align: left"> <strong>输出文件选项</strong>
									
								</label>
							</div>
						</div>
						<div class="layui-form-item">
							<div class="layui-inline layui-col-md6">
								<label class="layui-form-label form-lable" style="width: 100px">默认文件名</label>
								<div class="layui-input-inline input-inline">
									<input type="text" disabled="disabled" id="defaultFileName"
										name="defaultFileName" title=" " onmouseover="this.title = this.value"
										data-th-Value="${REPORT_DEFAULT_FILENAME}"
										class="layui-input form-input">
								</div>
							</div>
						</div>
						<div class="layui-form-item">
							<div class="layui-inline layui-col-md6">
								<label class="layui-form-label form-lable" style="width: 100px">
									默认输出格式 <i class="iconfont must" style="display: inline;">*</i></label>
								<div class="layui-input-inline input-inline">
									<input type="text" id="fileOutType" name="fileOutType"
										conFirmType="" placeholder="请输入内容"
										class="layui-input form-input input-checkbox"
										data-th-data-result="${DIS_FILE_TYPE}"
										data-th-initValue="${entity?.fileOutType}">
								</div>
							</div>
						</div>
						<div class="layui-form-item">
							<div
								class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
								<label class="layui-form-label form-lable"
									style="text-align: left"> <strong>输出文件目录</strong>
								</label>
							</div>
						</div>
						<div class="layui-form-item">
							<div class="layui-inline layui-col-md4">
								<label class="layui-form-label form-lable" style="width: 100px">默认输出路径</label>
								<div class="layui-input-inline input-inline">
									<input type="text" disabled="disabled" id="ftpId" name="ftpId"
										data-th-Value="${REPORT_DOWNLOAD_PATH}" 
										title=" " onmouseover="this.title = this.value"
										class="layui-input form-input ">
								</div>
							</div>
						</div>
						<div class="layui-form-item">
							<div class="layui-inline layui-col-md6">
								<label class="layui-form-label form-lable" style="width: 100px">
									披露方式 <i class="iconfont must" style="display: inline;">*</i></label>
								<div class="layui-input-inline input-inline">
									<input type="text" id="isReveal" name="isReveal" conFirmType=""
										placeholder="请输入内容"
										class="layui-input form-input input-checkbox"
										data-th-data-result="${CONFIRM_TYPE}"
										data-th-initValue="${entity?.isReveal}">
								</div>
							</div>
						</div>
						<div class="layui-form-item" style="display: none;">
							<div class="layui-inline layui-col-md6">
								<label class="layui-form-label form-lable" style="width: 100px">披露渠道
								<i class="iconfont must" style="display: inline;">*</i></label>
								<div class="layui-input-inline input-inline layui-col-md4">
									<input type="checkbox" name="revealChannelW"
										id="revealChannelW" lay-skin="primary" title="官网"
										data-th-checked="${entity?.revealChannelW==''}?'false':${entity?.revealChannelW}"
										data-result="${YES_OR_NO}"> <input type="checkbox"
										name="revealChannelO" id="revealChannelO" lay-skin="primary"
										data-th-checked="${entity?.revealChannelO}" title="点对点"
										data-result="${YES_OR_NO}"> <input type="checkbox"
										name="revealChannelC" id="revealChannelC" lay-skin="primary"
										data-th-checked="${entity?.revealChannelC}" title="其他"
										data-result="${YES_OR_NO}">
								</div>
							</div>
						</div>
						<div class="layui-form-item">
							<div class="layui-inline layui-col-md12">
								<label class="layui-form-label form-lable" style="width: 100px">报表披露要求说明</label>
								<div class="layui-input-inline input-inline layui-col-md8">
									<input id="detail" name="detail" title=" " onmouseover="this.title = this.value" 
										class="layui-input form-input " allowClear="true"
										placeholder="请输入内容" data-th-Value="${entity?.detail}">
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</fieldset>
	</form>
	<div class="layui-col-md11" style="margin: 50px;">
		<div class="text-center">
			<a id="ReportRule002_btn_save"
				class="layui-btn layui-btn-sm btn-save"
				data-th-text="#{SysCommon.save}">保存</a> <a
				id="ReportRule002_btn_cancel"
				class="layui-btn layui-btn-sm btn-cancel"
				data-th-text="#{SysCommon.cancel}">取消</a>
		</div>
	</div>
</div>
<div layout:fragment="script">
	<script
		data-th-src="@{/js/disclosure/information/manage/workrule/ReportRule002.js}"
		type="text/javascript"></script>
</div>
<script>
	
</script>
</html>
