<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>报表模板配置</title>
</head>

<body>
	<div layout:fragment="content">
		<div id="oldBtnDiv" class="form-button-area"export="false">     
             <a class="layui-btn layui-btn-sm btn-select" id="ReportModelManage001_btn_download">下载<i class="iconfont icon-down"></i></a>
	                <ul class="btn-select-wrap" style="display: none;width: 60px;" id="toExport">
	                    <li><a href="javascript:;" id="excelExport">excel</a></li>
	                    <li><a href="javascript:;" id="wordExport">word</a></li>
	                    <li><a href="javascript:;" id="pdfExport">pdf</a></li>
	                </ul>
             <a id="ReportModelManage001_btn_export" class="layui-btn layui-btn-sm btn-export btn-default">导出</a>
             <a id="ReportModelManage001_btn_design" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-add"></i>新建</a>           
        </div>
        
		<div class="joyin-form-wrap joyin-filter-form condition-area">			
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">             
					<div class="layui-inline layui-col-md6">
						<label class="layui-form-label form-lable">模板英文名</label>
						<div class="layui-input-inline input-inline">                               
                                <input type="text" id="temName" name="temName" placeholder="请输入内容"
                                class="layui-input form-input"
                                data-th-Value="${temName}"
                                >
						</div>
					</div>
               	    <div class="layui-inline layui-col-md6">
						<label class="layui-form-label form-lable">模板中文名</label>
						<div class="layui-input-inline input-inline">                               
                                <input type="text" id="temDescription" name="temDescription" placeholder="请输入内容"
                                class="layui-input form-input "
                                data-th-Value="${temDescription}"
                                >
						</div>
			        </div>
                  <!--   <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">模板路径</label>
                        <div class="layui-input-inline input-inline">                               
                                <input type="text" id="temLoad" name="temLoad" placeholder="请选择或者输入关键字"
                                class="layui-input form-input"
                                data-th-Value="${temLoad}"
                                >
                        </div>
                    </div> -->               
				</div>                                            
			</form>
		</div>
		<div style="display: none;">
			<table class="layui-table" id="dataTable"></table>
        </div>
        <div >
			<table class="layui-table" id="dataTable2"></table>
           <!--  <marquee direction="up" behavior="scroll" scrollamount="1" scrolldelay="0" loop="-1" width="1000" height="50" bgcolor="#0099FF" hspace="10" vspace="10"> -->	
        </div>
		<div id="isModelSelect" style="text-align: center;display:none;">
        <a id="ReportModelManage001_btn_submit" class="layui-btn layui-btn-sm btn-submit">确认</a>
             <a id="ReportModelManage001_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                    data-th-text="#{SysCommon.cancel}">取消</a>           
        </div>
        <div style="height:20px;"></div>
	</div>
</body>
<div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
		    var isModelSelect = /*[[${isModelSelect}]]*/;
		    var REPORT_SERVER_URL = [[${REPORT_SERVER_URL}]];
		    var REPORT_USERNAME = [[${REPORT_USERNAME}]];
		    var REPORT_PASSWORD = [[${REPORT_PASSWORD}]];
		    var REPORT_SERVER_PATH = [[${REPORT_SERVER_PATH}]];
		</script>
      <script data-th-src="@{/js/disclosure/report.js}"
            type="text/javascript"></script>
         <script
        data-th-src="@{/js/disclosure/information/config/reportmodelmanage/ReportModelManage001.js}"
        type="text/javascript"></script>  
</div>

</html>
