<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>报表确认管理</title>
</head>
<body>

</body>
<div layout:fragment="content">
	<div class="form-button-area" export="false">
		<!-- 上传 -->
		<!--         <button type="button" class="layui-btn layui-btn-sm btn-default" id="ReportConfirmManage001_btn_upload"><i class="iconfont icon-upload"></i>上传</button> -->
		<!-- 删除 -->
		<button type="button"
			class="layui-btn layui-btn-sm btn-delete btn-default"
			id="ReportConfirmManage001_btn_delete">
			<i class="iconfont icon-delete"></i>删除
		</button>
		<!-- 确认 -->
		<button type="button" class="layui-btn layui-btn-sm btn-submit"
			id="ReportConfirmManage001_btn_submit" style="background: #4893e6;">
			<i class="iconfont icon-circle-correct_fill"></i>确认
		</button>
		<!-- 取消确认 -->
		<button type="button" class="layui-btn layui-btn-sm btn-default"
			id="ReportConfirmManage001_btn_confirmCancle">
			<i class="iconfont icon-reverse_audit"></i>取消确认
		</button>
		<!-- 新建报表-->
		<button type="button" class="layui-btn layui-btn-sm btn-default"
			id="ReportConfirmManage001_btn_upload">
			<i class="iconfont icon-upload"></i>新建报表
		</button>
		<!-- 导出 -->
		<button type="button" class="layui-btn layui-btn-sm btn-default"
			id="ReportConfirmManage001_btn_export">
			<i class="iconfont icon-export"></i>导出
		</button>
		<!-- 批量下载 -->
		<button type="button" class="layui-btn layui-btn-sm btn-default"
			id="ReportConfirmManage001_btn_download">
			<i class="iconfont icon-export"></i>导出报表文件
		</button>
		<!-- 批量上传披露文档 -->
		<button type="button" class="layui-btn layui-btn-sm btn-default"
			id="ReportConfirmManage001_btn_batchUpload">
			<i class="iconfont icon-upload"></i>批量上传披露文档
		</button>
	</div>
	<div class="joyin-form-wrap joyin-filter-form condition-area">
		<form class="layui-form" id="searchForm">
			<input type="hidden" name="confromPage" id="confromPage"
				data-th-value="${confromPage}">
			<!-- <input type="hidden" name="revealEndDateHidden" id="revealEndDateHidden" data-th-value="${searchDate}"> -->
			<input type="hidden" name="searchDateStart" id="searchDateStart"
				data-th-value="${searchDateStart}"> <input type="hidden"
				name="searchDateEnd" id="searchDateEnd"
				data-th-value="${searchDateEnd}">
			<div class="layui-form-item">

				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">产品名称</label>
					<div class="layui-input-inline input-inline">
						<select id="finprodId" name="finprodId"
							class="layui-input form-input input-select" placeholder="请选择，可复选"
							data-url='getPrdInfoSelect' allowClear="true" multiple="multiple">
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">报表名称</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="reportName" name="reportName"
							class="layui-input form-input" placeholder="请选择"
							data-th-data-result="${REPORT_ID}" allowClear="true"
							multiple="multiple"
							data-th-placeholder="#{SysCommon.placeholder}">
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">报表类别</label>
					<div class="layui-input-inline input-inline">
						<select id="repType" name="repType"
							class="layui-input form-input input-select" placeholder="请选择，可复选"
							data-th-data-result="${reportCategoryList}" allowClear="true"
							multiple="multiple" data-th-initValue='${repType}'>
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">确认状态</label>
					<div class="layui-input-inline input-inline">
						<input id="confirmStatus" name="confirmStatus"
							class="layui-input form-input input-checkbox"
							data-th-data-result="${CONFIRM_STATUS}"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-initValue='${confirmStatus}'>
					</div>
				</div>
				
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">披露截止日</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="revealEndDate" name="revealEndDate"
							placeholder="请选择时间区间"
							class="layui-input form-input input-dateRangeSelect" value="">
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">披露渠道</label>
					<div class="layui-input-inline input-inline">
						<select id="revealChanel" name="revealChanel"
							class="layui-input form-input input-select" placeholder="请选择，可复选"
							data-th-data-result="${REVEAL_CHANNEL}" allowClear="true"
							multiple="multiple">
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">生成日期</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="makeDate" name="makeDate"
							placeholder="请选择时间区间"
							class="layui-input form-input input-dateRangeSelect" value="">
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">确认日期</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="confirmDate" name="confirmDate"
							placeholder="请选择时间区间"
							class="layui-input form-input input-dateRangeSelect" value="">
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">确认方式</label>
					<div class="layui-input-inline input-inline">
						<select id="confirmType" name="confirmType"
							class="layui-input form-input input-select" placeholder="请选择，可复选"
							data-th-data-result="${CONFIRM_TYPE}" allowClear="true"
							multiple="multiple">
						</select>
					</div>
				</div>
			</div>
		</form>
		<input type="text" id="workflowId" name="workflowId"
			data-th-value="${workflowId}" disabled="disabled"
			style="display: none;">
		<!--按条件查询列  -->
	</div>
	<div>
		<table class="layui-table" id="dataTable"></table>
	</div>
</div>
<div layout:fragment="script">
	<script
		data-th-src="@{/js/disclosure/information/reveal/reportconfirm/ReportConfirmManage001.js}"
		type="text/javascript"></script>
</div>
</html>
