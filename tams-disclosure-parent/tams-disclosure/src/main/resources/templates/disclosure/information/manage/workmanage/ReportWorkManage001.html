<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>报表作业管理</title>
</head>
<body>

</body>
<div layout:fragment="content">
    <div class="form-button-area" export="false">
        <!-- 新建-->
        <button type="button" class="layui-btn layui-btn-sm btn-default" id="ReportWorkManage001_btn_add"><i class="iconfont icon-add"></i>新建 </button>
        <!-- 删除 -->
        <button type="button" class="layui-btn layui-btn-sm btn-default" id="ReportWorkManage001_btn_delete"><i class="iconfont icon-delete"></i>删除 </button>
        <!-- 导出 -->
        <button type="button" class="layui-btn layui-btn-sm btn-default" id="ReportWorkManage001_btn_export"><i class="iconfont icon-export"></i>导出</button>
         <!-- 刷新作业规则 -->
       <!--  <button type="button" class="layui-btn layui-btn-sm btn-default" id="ReportWorkManage001_btn_refresh"><i class="iconfont icon-search"></i>刷新作业规则</button> -->
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
      <form class="layui-form" id="searchForm"> 
          <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">作业编号</label>
                    <div class="layui-input-inline input-inline">
                        <select id="jobId" name="jobId" class="layui-input form-input input-select" data-th-formatoption="false"
                            placeholder="请选择，可复选"  data-url='getReportIdList' allowClear="true"
                            multiple="multiple" data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
                 <div class="layui-inline layui-col-md4">
                  <label class="layui-form-label form-lable">作业名称</label>
                  <div class="layui-input-inline input-inline">
                      <input type="text" id="jobName" name="jobName" class="layui-input form-input" 
                             placeholder="请选择" 
                             allowClear="true"  data-th-placeholder="#{SysCommon.placeholder}">
                  </div>
              </div>
              
              <div class="layui-inline layui-col-md4">
	               <label class="layui-form-label form-lable">执行日期</label>
	               <div class="layui-input-inline input-inline">
	                  <input type="text" id="execDate" name="execDate" placeholder="请选择执行日期" class="layui-input form-input input-dateSelect" data-th-value="${sysDate}">
	               </div>
              </div>
          </div>
      </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/disclosure/information/manage/workmanage/ReportWorkManage001.js}" type="text/javascript"></script>
</div>
</html>
