<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-4.dtd">
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
    <style type="text/css" rel="stylesheet" link=""></style>
</head>
    <body>
        <div layout:fragment="content">
            <div id="pageContent">
                <ul class="debt-home-ul">
                    <!-- 待披露  -->
                    <li class="debt-home-item">
                        <p class="clearfix debt-home-title">
                            <i class="iconfont icon-horn" style="float:left;line-height: 20px;color:#ff0000"></i>
                            <span class="menu-title" style="float: left;padding-right: 10px;color:#ff0000">待披露</span>
                            <span class="input-append date" style="padding-top: 3px;position: relative;">
                                <label class="layui-form-label form-lable" style="width: 6%;font-size:14px">披露截止日</label>
                                <div class="layui-inline layui-col-md2">
            	                  <input type="text" id="searchDate" name="timeControl" placeholder="请选择日期" 
                                        class="layui-input form-input input-dateRangeSelect">
            	                </div>
                            </span>
                        </p>
                        <div class="layui-inline">
                            <table id="dataTable1"  class="layui-table"></table>
                        </div>
                    </li>
                    
                    <!-- 今日已披露  -->
                    <li class="debt-home-item" >
                        <p class="clearfix debt-home-title" style="height: 22px;">
                            <i class="iconfont icon-template" style="float:left;line-height: 20px;color:#00AA00"></i>
                            <span class="menu-title" style="float: left;padding-right: 10px;color:#00AA00">今日状态</span>
                        </p>
                        <div class="layui-inline">
                            <table id="dataTable2" class="layui-table"></table>
                        </div>
                    </li>
                    
                    <!-- 预计披露  -->
                    <li class="debt-home-item" >
                        <p class="debt-home-title" style="height: 22px;">
                            <i class="iconfont icon-clock" style="float:left;line-height: 20px;color:#ff8000"></i>
                            <span class="menu-title" style="color:#ff8000">预计披露</span>
                        </p>
                        <div class="layui-inline">
                            <table id="dataTable3" class="layui-table"></table>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
        <!-- javascript代码部分 -->
        <div layout:fragment="script">
            <script data-th-src="@{/js/disclosure/myHome.js}" type="text/javascript"></script>
           <style>
                /*表格表头样式*/
                th span{ 
                    font-weight:bold;
                    font-size:13px;
                }
                /*表格内容字体（表头和第一列除外）*/
                .datacell{ 
                    font-weight:bold;
                    font-size:16px; 
                }
               /*By zhengyan*/
               /*首页样式*/
               .debt-home-ul {
                   padding-left: 0;
               }
               .debt-home-item {
                   margin: 5px 0;
               }
               .debt-home-title i {
                   font-size: 22px;
                   color: #aaaaaa;
                   vertical-align: sub;
               }
               .menu-title-wrap {
                   margin: 25px 0 10px 0;
                   border-left: 5px solid #1d8ce7;
               }
               .menu-title {
                   color: #666666;
                   font-size: 16px;
                   padding-left: 10px;
               }
               .menu-list-wrap {
                   display: inline-block;
                   width: 15%;
               }
           </style>
        </div>
    </body>
</html>
