<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
	<meta charset="utf-8">
	<title data-th-text="#{proRegistCodeManage001}">文件上传</title>
	<style>
		span.layui-upload-choose {
			display: block;
			margin-top: 20px;
		}

		#test10 {
			padding: 5px;
			float: left;
		}

		.layui-table-cell {
			height: auto !important;
		}
	</style>
</head>
<body style="overflow:hidden" layout:fragment="content">
    <div style="padding: 10px 50px; height:100px; text-align: center">
		<div class="layui-upload" th:if="${type eq 'singleImage'}">
			<button type="button" class="layui-btn" id="test1">上传图片</button>
			<div class="layui-upload-list">
				<img class="layui-upload-img" id="demo1">
				<p id="demoText"></p>
			</div>
		</div>

		<div class="layui-upload" th:if="${type eq 'mutiImage' }">
			<button type="button" class="layui-btn" id="test2">多图片上传</button>
			<blockquote class="layui-elem-quote layui-quote-nm" style="margin-top: 10px;">
				预览图：
				<div class="layui-upload-list" id="demo2"></div>
			</blockquote>
		</div>

		<div th:if="${type eq 'allowFile' }">
			<button type="button" class="layui-btn" id="test4">
				<i class="layui-icon"></i>上传文件
			</button>
			<div style="margin-top: 10px;">
			<!-- 示例-970 -->
			<ins class="adsbygoogle"
				style="display: inline-block; width: 970px; height: 90px"
				data-ad-client="ca-pub-6111334333458862" data-ad-slot="3820120620"></ins>
			</div>
		</div>

		<div class="layui-upload" th:if="${type eq 'noAutoUpload' }">
			<button type="button" class="layui-btn layui-btn-normal" id="test8">选择文件</button>
			<button type="button" class="layui-btn" id="tplDowload">模板下载</button>
			<button type="button" class="layui-btn" id="test9">开始上传</button>
		</div>

		<div class="layui-upload" th:if="${type eq 'drag' }">
		<div class="layui-upload-drag" id="test10" style="width:520px;">
			<i class="layui-icon"></i>
			<p>点击上传，或将文件拖拽到此处</p>
		</div>
		<div style="width:120px; float:right; height:85px; padding: 10px;">
			<div>
				<button type="button" class="layui-btn" id="dragUploadAction" disabled>开始上传</button>
			</div>
	        <div style="padding-top:10px" th:if="${not hideTpl}">
	        	<a style="text-decoration: underline; color: #337ab7;" id="tplDowload" href="javascript:void(0);">模板下载</a>
	        </div>
		</div>
		</div>

		<div class="layui-upload" th:if="${type eq 'list' }">
			<button type="button" class="layui-btn layui-btn-normal" id="testList">选择多文件</button>
			<div class="layui-upload-list">
				<table class="layui-table">
					<thead>
						<tr>
							<th>文件名</th>
							<th>大小</th>
							<th>状态</th>
							<th>操作</th>
						</tr>
					</thead>
					<tbody id="demoList"></tbody>
				</table>
			</div>
            <button type="button" class="layui-btn" id="tplDowload">模板下载</button>
			<button type="button" class="layui-btn" id="testListAction">开始上传</button>
		</div>
<!-- 	</fieldset> -->
	</div>
	<div id="loading" style="position: fixed; left: 50%; margin-left: -73px; background-color: #000; opacity: 0.3; display:none;">
     <img class="layui-upload-img" src="<c:url value='/resources/images/loading.gif' />">
	</div>
	<div style="padding: 0 20px; height:270px" id="msgArea">
	   <!-- 导入验证结果显示区域 -->
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
            var uploadPath = '/fileUpload/uploadFile';
            var exts = '${exts}';
		</script>
		<script data-th-src="@{/js/disclosure/jquery.validate.js}" type="text/javascript"></script>
		<script data-th-src="@{/js/disclosure/joyinvalid.js}" type="text/javascript"></script>
		<script data-th-src="@{/js/disclosure/report-common.js}" type="text/javascript"></script>
		<script data-th-src="@{/js/disclosure/common/DisFileUpload.js}" type="text/javascript"></script>
	</div>
</body>
</html>
