<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>自定义SQL查询</title>
</head>
<body>

</body>
<div layout:fragment="content">
       <form class="layui-form joyin-form-wrap" id="submitForm" style="background: #ffffff; padding: 10px 0;">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md10">
                    <label class="layui-form-label form-lable">查询SQL</label>
                    <div class="layui-input-inline input-inline">
                        <textarea id="inputSql" name="inputSql" class="layui-textarea"  data-th-placeholder="#{SysCommon.placeholder}" rows="15" required></textarea>
                    </div>
                </div>
            </div>
            <div style="display:none;" id="div1">
               <table class="layui-table" id="SystemSqlQuery001_table"></table>
            </div>
       </form>
            <div class="layui-col-md11" style="margin:50px;">
               <div class="text-center">
                   <a id="SystemSqlQuery001_btn_submit" class="layui-btn layui-btn-sm btn-submit">执行</a>
                   <!-- <a id="SystemSqlQuery001_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a> -->
               </div>
           </div>
</div>

<div layout:fragment="script">
  <script data-th-src="@{/js/disclosure/system/systemsqlquery/DisSystemSqlQuery001.js}" type="text/javascript"></script>
</div>
</html>
