<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="#{CfetsBondDealQuotedPrice002}">交收管理</title>
</head>
<body>
<div layout:fragment="content">
    <style type="text/css">
        .form-inline-wrap {
            display: inline-block;
            float: left;
            width: 32%;
            padding-top: 10px;
        }

        .layui-form-radio {
            line-height: 28px;
            margin: 0 0 0 0;
            padding-right: 0px;
            cursor: pointer;
            font-size: 0;
        }

        .layui-form-radio>i {
            margin-right: 0px;
            font-size: 15px;
            color: rgb(194, 194, 194);
        }
        /* 放大镜特殊处理 */
        .iconfont {
            font-size: 21px;
        }
    </style>
    <div class="pro-module-container" style="margin-bottom: 20px;">
    <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
                <!--交收信息-->
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <div class="pro-module-item">
                            <table class="layui-table" id="settleinfoList" th:name="settleinfoList"></table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-form-item" align="center">
            <a id="CfetsManualSettle_btn_submit" class="layui-btn layui-btn-sm  btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="CfetsManualSettle_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </form>
</div>

<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var settleinfoList = /*[[${settleinfoList}]]*/;
    </script>
    <script th:src="@{/js/cfets/manualsettle/CfetsManualSettle.js}" type="text/javascript"></script>
</div>
</body>
</html>
