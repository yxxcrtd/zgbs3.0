<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="#{CfetsBondDealQuotedPrice002}">交收管理修改</title>
</head>
<body>
<div layout:fragment="content">
    <style type="text/css">
        .form-inline-wrap {
            display: inline-block;
            float: left;
            width: 32%;
            padding-top: 10px;
        }

        .layui-form-radio {
            line-height: 28px;
            margin: 0 0 0 0;
            padding-right: 0px;
            cursor: pointer;
            font-size: 0;
        }

        .layui-form-radio>i {
            margin-right: 0px;
            font-size: 15px;
            color: rgb(194, 194, 194);
        }
        /* 放大镜特殊处理 */
        .iconfont {
            font-size: 21px;
        }
    </style>
    <div class="pro-module-container" style="margin-bottom: 20px;">
    <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">基本信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" >资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodMarketId" data-th-value="${entity?.finprodMarketId}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" >资产简称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodMarketAbbr" data-th-value="${entity?.finprodAbbr}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" >资产类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="finprodType2Str" name="finprodType2Str"
                                                th:initValue="*{entity?.finprodType2}" class="layui-input form-input input-select"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-result="${PINAN_ASSET_TYPE}" disabled></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" >业务类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="tgBusiTypeStr" name="tgBusiTypeStr"
                                                th:initValue="*{entity?.tgBusiType}" class="layui-input form-input input-select"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-result="${BUSI_TYPE_POSITION}" disabled></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" >交易方向</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="psStr" name="psStr"
                                                th:initValue="*{entity?.ps}" class="layui-input form-input input-select"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-result="${PS}" disabled></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" >原业务编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeId" name="tradeId" data-th-value="${entity?.tradeId}" class="layui-input form-input" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交收日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="settleDate" name="settleDate" data-th-value="${entity?.settleDate}" class="layui-input form-input input-dateSelect" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交收数量（万元）</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="settleNumT" name="settleNumT" data-th-value="${entity?.settleNumT}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" >交收金额（元）</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="settleAmtT" name="settleAmtT" data-th-value="${entity?.settleAmtT}" class="layui-input form-input text-number" disabled/>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!--组合信息-->
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <div class="pro-module-item">
                            <table class="layui-table" id="portSettleinfoDtoList" th:name="portSettleinfoDtoList"></table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-form-item" align="center">
            <a id="CfetsManualSettleUpdate_btn_submit" class="layui-btn layui-btn-sm  btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="CfetsManualSettleUpdate_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </form>
</div>

<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var portSettleinfoDtoList = /*[[${entity?.portSettleinfoDtoList}]]*/'';
    </script>
    <script th:src="@{/js/cfets/manualsettle/ManualSettleUpdate.js}" type="text/javascript"></script>
</div>
</body>
</html>
