<!DOCTYPE html>
<html style="height:80%;" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
    <title data-th-text="#{CfetsTrdRedeem001}">银行间债券交易新建</title>
</head>
<body>
<div layout:fragment="content" id="CfetsTrdRedeem001_bodydiv">
    <style type="text/css">
		        .layui-form-radio {
		            line-height: 24px;
		            padding-right: 0px;
		            margin: 0px;
		        }
		        .layui-form-radio div {
		            font-size: 12px;
		        }
		        .layui-form-radio i{
		            font-size: 14px;
		        }
                .label-deviation-degree{
                    width: 50px;
                    height: 24px;
                    color: red;
                    top: 0;
                    right: 0;
                    position: absolute;
                    text-align: center;
                    line-height: 24px;
                }
                .riskclu{
                   border: 1px solid #ccc;
                   margin: 7px 5px 0px 5px;
                   height: 35px
               }
               .riskclu span{
               font-weight: bold;
               }
	</style>

        <form class="layui-form joyin-form-wrap pro-module-form" id="searchForm">
            <div class="pro-module-container">
            <input type="hidden" id="finprodIdhid" name="finprodId" th:value="${entity?.finprodId}">
            <input type="hidden" id="mySideTrader" name="mySideTrader" th:value="${entity?.mySideTrader}">
            <input type="hidden" id="totleTradeId" name="totleTradeId" th:value="${entity?.totleTradeId}" />
                <div class="pro-module-wrapper pro-module-base" title="基本信息">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i
                                    class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">


                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" style=" width: 25%; padding:0px;">
                                        <label class="layui-form-label form-label-wrap" >登记日期</label>
                                        <div class="layui-input-inline input-inline buss-inline-wrap">
                                            <div class="layui-input-inline input-inline buss-inline-wrap">
                                                <input disabled type="text"  name="tradeDate"
                                                       class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                                       th:placeholder="#{SysCommon.placeholder}"
                                                       th:value="${#dates.format(entity?.tradeDate,'yyyy-MM-dd')}">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style=" width: 25%; padding:0px;">
                                        <label class="layui-form-label form-lable" style="width: 105px;"
                                               data-th-text="#{CfetsEtribBondInfo003.ps}">交易方向</label>
                                        <div class="layui-input-inline input-inline">
                                            <select  type="text" id="ps" name="ps" allowClear="true"
                                                     class="layui-input form-input input-select" data-th-data-result='${PS}'
                                                     placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                     formatoption="true" data-th-initvalue="${entity?.ps}" disabled="disabled">
                                            </select>
                                        </div>
                                    </div>

                                    <div class="form-inline-wrap" style=" width: 25%; padding:0px;">
                                        <label class="layui-form-label form-lable" style="width: 105px;">资产代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="finprodMarketId" name="finprodMarketId"
                                                    class="layui-input form-input input-select" allowClear="true"
                                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                    required="required"
                                                    data-th-data-url="@{/common/joyinbusinessCommon/getfinprodIdForSelect(ps=${entity?.ps})}"
                                                    data-th-initvalue="${entity?.finprodMarketId}"
                                            >
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style=" width: 25%; padding:0px;">
                                        <label class="layui-form-label form-lable" style="width: 105px;">资产简称</label>
                                        <div class="layui-input-inline input-inline buss-inline-wrap">
                                            <input required type="text" id="finprodAbbr" name="finprodAbbr"
                                                   class="layui-input form-input" placeholder="请输入内容"
                                                   th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.finprodAbbr}" disabled="disabled">
                                        </div>
                                    </div>

                                </div>

                                <div class="layui-form-item">

                                    <div class="form-inline-wrap" style=" width: 25%; padding:0px;">
                                        <label class="layui-form-label form-label-wrap" >理论行权日</label>
                                        <div class="layui-input-inline input-inline buss-inline-wrap">
                                            <div class="layui-input-inline input-inline buss-inline-wrap">
                                                <input disabled type="text"  id="theoreticalExerciseDate" name="theoreticalExerciseDate"
                                                       class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                                       th:placeholder="#{SysCommon.placeholder}"
                                                       th:value="${#dates.format(entity?.theoreticalExerciseDate,'yyyy-MM-dd')}">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style=" width: 25%; padding:0px;">
                                        <label class="layui-form-label form-label-wrap" >实际行权日</label>
                                        <div class="layui-input-inline input-inline buss-inline-wrap">
                                            <div class="layui-input-inline input-inline buss-inline-wrap">
                                                <input disabled type="text"  id="actSetteDate" name="actSetteDate"
                                                       class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                                       th:placeholder="#{SysCommon.placeholder}"
                                                       th:value="${#dates.format(entity?.actSetteDate,'yyyy-MM-dd')}">
                                            </div>
                                        </div>
                                    </div>

                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" style=" width: 100%; padding:0px;">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{CfetsEtribBondInfo003.remark}" style="width: 105px;">备注</label>
                                        <div class="layui-input-inline" style="width: 80%; margin: 0px; margin-left: auto;">
                                <textarea id="remark" name="remark" th:value="${entity?.remark}"
                                          data-th-text="${entity?.remark}" class="layui-textarea"
                                          placeholder="请输入内容"
                                          data-th-placeholder="#{SysCommon.placeholder}" ></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des"
                                      th:text="#{CfetsEtribBondInfo003.amtInfo}">金额信息</span><i
                                    class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" style=" width: 25%; padding:0px;">
                                        <label class="layui-form-label form-label-wrap">币种</label>
                                        <div class="layui-input-inline input-inline">
                                            <select required disabled type="text"  name="ccy" class="layui-input form-input input-select" id="ccy"
                                                    placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                    th:data-result='${CCY}' allowClear="true" formatoption="true"
                                                    th:initValue="*{entity?.ccy}"></select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style=" width: 25%; padding:0px;">
                                        <label class="layui-form-label form-lable" style="width: 105px;">行权净价</label>
                                        <div class="layui-input-inline input-inline">
                                            <input required type="text" id="exercisePrice" name="exercisePrice" placeholder="请输入内容"
                                                   data-pattern="" data-fixtype="2" data-textrange='4'
                                                   class="layui-input form-input text-number"
                                                   data-th-value="${entity?.exercisePrice}">
                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style=" width: 25%; padding:0px;">
                                        <label class="layui-form-label form-lable" style="width: 105px;">赎回比例</label>
                                        <div class="layui-input-inline input-inline">
                                            <input required type="text" id="redeemRate" name="redeemRate" placeholder="请输入内容"
                                                   data-pattern="" data-fixtype="2" data-textrange='4'
                                                   class="layui-input form-input text-number"
                                                   data-th-value="${entity?.redeemRate}">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style=" width: 25%; padding:0px;">
                                        <label class="layui-form-label form-lable" style="width: 105px;">账户持仓</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="shareAmt" name="shareAmt" placeholder="请输入内容"
                                                   data-pattern="" data-fixtype="2" data-textrange='4'
                                                   class="layui-input form-input text-number" disabled="disabled"
                                                   data-th-value="${entity?.shareAmt}">
                                            <span class="input-right-show">万元</span>
                                        </div>
                                    </div>
                                </div>
                        </div>
                    </div>

                    </div>

                    <div id="combDistribt_div" class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title pro-item-wrap">
                                <span class="title-des">组合分配</span>
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div id="combDistribt">
                                    <table class="layui-table" id="bussCombDistribtTable"
                                           name="ptlAllocatios"></table>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                        <div class="text-center">
                            <a id="CfetsTrdRedeem001_btn_save" class="layui-btn layui-btn-sm btn-save" style="display: none;"
                               data-th-text="#{SysCommon.save}">保存</a>
                            <a id="CfetsTrdRedeem001_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                               style="display: none;"
                               data-th-text="#{SysCommon.submit}">提交</a>
                        </div>
                    </div>
                </div>
           </div>
        </form>

</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
     	var PS_T39 = /*[[${PS_T39}]]*/'';
        var ptlAllocatios = eval(/*[[${ptlAllocatios}]]*/'');
    </script>
    <script data-th-src="@{/js/cfets/trdredeem/CfetsTrdRedeem001.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/component/autocoupon/AutoCoupon.js}" type="text/javascript"></script>
</div>
</body>
