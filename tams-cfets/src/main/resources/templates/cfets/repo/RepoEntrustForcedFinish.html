<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>指令强制完成</title>
</head>
<body>
<div layout:fragment="content" id="RepoEntrustForcedFinish_DIV">
    <div class="pro-module-container page-step">
        <form class="layui-form joyin-form-wrap pro-module-form"
              id="submitForm">
            <input id="entrustId" name="entrustId"
                   data-th-value="${entity?.entrustId}" hidden>
            <div class="pro-module-wrapper pro-module-base step" title="指令信息">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">基本信息</span>
                        </h3>
                        <div class="pro-module-item pro-item-wrap">
                                <div>
                                    <table class="layui-table" id="entrustIdsTable"></table>
                                </div>
                        </div>
                    </div>
                </div>
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">交易执行明细</span>
                        </h3>
                        <div class="pro-module-item pro-item-wrap">
                            <div>
                                <table class="layui-table" id="dealTable"></table>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">强制完成原因</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item" style="padding-bottom: 8px;">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" style="width: 100%;">
                                    <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
										<textarea id="remark" name="remark" placeholder="请输入内容"
                                                  data-th-placeholder="#{SysCommon.placeholder}" maxlength="300"
                                                  class="layui-textarea" data-th-text="${entity?.remark}">
										</textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row text-center stepbar">
                 <a id="RepoEntrustForcedFinish_btn_submit"
                    class="layui-btn layui-btn-sm btn-submit"
                    data-th-text="#{SysCommon.submit}">提交</a> <a
                    id="RepoEntrustForcedFinish_btn_cancel"
                    class="layui-btn layui-btn-sm btn-cancel"
                    data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var entity = /*[[${entity}]]*/'';
        var repo_pledge_model = /*[[${repo_pledge_model}]]*/'';
    </script>
    <script th:src="@{/js/cfets/repo/RepoEntrustForcedFinish.js}" type="text/javascript"></script>
</div>
</body>

</html>
