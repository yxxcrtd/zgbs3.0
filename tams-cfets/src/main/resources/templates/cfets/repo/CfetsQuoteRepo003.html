<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title th:text="#{CfetsQuoteRepo003}">质押式回购-对话</title>
</head>
<body>
<div layout:fragment="content" id="CfetsQuoteRepo003_bodydiv">
    <style type="text/css">
        .form-inline-wrap {
            display: inline-block;
            float: left;
            width: 32%;
            padding-top: 10px;
        }

        .layui-form-radio {
            line-height: 28px;
            margin: 0 0 0 0;
            padding-right: 0px;
            cursor: pointer;
            font-size: 0;
        }

        .layui-form-radio > i {
            margin-right: 0px;
            font-size: 15px;
            color: rgb(194, 194, 194);
        }

        /* 放大镜特殊处理 */
        .iconfont {
            font-size: 21px;
        }
    </style>
    <div class="pro-module-container" style="margin-bottom: 20px;">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <input type="hidden" id="operatorType" name="operatorType" th:value="${entity?.operatorType}"/>
            <input type="hidden" id="basis" name="basis" th:value="${entity?.basis}"/>
            <input type="hidden" id="isDzh" name="isDzh" th:value="${entity?.isDzh}"/>
            <input type="hidden" id="invManagerId" name="invManagerId" th:value="${entity?.invManagerId}"/>
            <input type="hidden" id="quoteId" name="quoteId" th:value="${entity?.quoteId}"/>
            <input type="hidden" id="quotaPageModel" name="quotaPageModel" th:value="${entity?.quotaPageModel}"/>
            <input type="hidden" id="pageId" name="pageId" th:value="${entity?.pageId}"/>
            <input type="hidden" id="elementId" name="elementId" th:value="${entity?.elementId}"/>
            <input type="hidden" id="softSkipMode" name="softSkipMode" th:value="${entity?.softSkipMode}"/>
            <input type="hidden" id="tradeDate" name="tradeDate" th:value="${#dates.format(entity?.tradeDate,'yyyy-MM-dd')}"/>
            <input type="hidden" id="dipType" name="dipType" th:value="${entity?.dipType}"/>
            <input type="hidden" id="secAcctId" name="secAcctId" th:value="${entity?.secAcctId}"/>
            <input type="hidden" id="workflowId" name="workflowId" th:value="${entity?.workflowId}"/>
            <input type="hidden" id="quoteType" name="quoteType" th:value="${entity?.quoteType}"/>
            <input type="hidden" id="systemAct" name="systemAct" th:value="${entity?.systemAct}"/>
            <input type="hidden" id="counterTrader" name="counterTrader" th:value="${entity?.counterTrader}"/>
            <input type="hidden" id="pledgePrinTotal" name="pledgePrinTotal" th:value="${entity?.pledgePrinTotal}"/>
            <input type="hidden" id="operateType" name="operateType" th:value="${entity?.operateType}"/>
            <input type="hidden" id="version" name="version" th:value="${entity?.version}"/>
            <input type="hidden" id="bVersion" name="bVersion" th:value="${entity?.bVersion}"/>
            <input type="hidden" id="quoteRoleType" name="quoteRoleType" th:value="${entity?.quoteRoleType}"/>

            <!--<input type="hidden" id="openModel" name="openModel" th:value="${entity?.openModel}"/>
            <input type="hidden" id="tradeMarket" name="tradeMarket" th:value="${entity?.tradeMarket}"/>-->
            <div class="pro-module-wrapper pro-module-base" th:title="#{IbuQuoteRepo004.baseinfo}">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" th:text="#{IbuQuoteRepo004.baseinfo}">基本信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{IbuQuoteRepo004.ps}">交易方向</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="ps" name="ps" disabled
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${PS}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.ps}"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{IbuQuoteRepo004.my}">本方</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="mySide" name="mySide" disabled
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:data-url="@{/common/joyinbusinessCommon/queryMySideOrCount}"
                                                allowClear="true" th:initValue="${entity?.mySide}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{IbuQuoteRepo004.myTradeId}">本方交易员</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="mySideTrader" name="mySideTrader" disabled
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" parentIds="mySide"
                                                th:data-url="@{/common/joyinbusinessCommon/queryMySideTraderOrCountTrader}"
                                                allowClear="true" th:initValue="${entity?.mySideTrader}"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{IbuQuoteRepo004.counterId}">对手方</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="counterId" name="counterId"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:data-url="@{/common/joyinbusinessCommon/queryMySideOrCount?dealType}"
                                                allowClear="true" th:initValue="${entity?.counterId}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">对手方交易员</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="select_counterTrader"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" parentIds="counterId"
                                                th:data-url="@{/common/joyinbusinessCommon/queryMySideTraderOrCountTrader}"
                                                allowClear="true" th:initValue="${entity?.counterTrader}"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">回购方式</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="repoMethod" name="repoMethod" disabled
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${REPO_METHOD}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.repoMethod}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{IbuQuoteRepo004.settleSpeed}">清算速度</label>
                                    <div class="layui-input-inline input-inline buss-inline-wrap">
                                        <select required type="text" id="CfetsQuoteRepo003_settleSpreed"
                                                name="settleSpreed" disabled
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${ACCOUNT_SPEED}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.settleSpreed}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" name="ccy"
                                                class="layui-input form-input input-select" disabled
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${CCY}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.ccy}"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">回购期限</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" name="term" id="term" disabled
                                               class="layui-input form-input" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.term}">
                                        <span class="input-right-show">天</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">回购利率（%）</label>
                                    <div class="layui-input-inline input-inline buss-inline-wrap">
                                        <input required type="text" name="price" id="price"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-fixtype="2" data-textrange="4"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.price}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">结算币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" name="settleCcy" disabled
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${CCY}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.settleCcy}"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交易金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" name="dealAmt" id="dealAmt"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-fixtype="2" data-textrange="2"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.dealAmt}">
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">券面总额合计</label>
                                    <div class="layui-input-inline input-inline buss-inline-wrap">
                                        <input required type="text" name="shareAmtStr" id="shareAmtStr"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-fixtype="2" data-textrange="2" disabled
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.shareAmtStr}">
                                        <span class="input-right-show">万元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">质押券折算总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" name="shareCtAmt" id="shareCtAmt"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-fixtype="2" data-textrange="2" disabled
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.shareCtAmt}">
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">首次结算方式</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" name="vDeliveryType"
                                                class="layui-input form-input input-select" disabled
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${SETT_MODE}' allowClear="true" formatoption="true"
                                                th:initValue="*{entity?.vDeliveryType}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">到期结算方式</label>
                                    <div class="layui-input-inline input-inline buss-inline-wrap">
                                        <select required type="text" name="mDeliveryType"
                                                class="layui-input form-input input-select" disabled
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${SETT_MODE}' allowClear="true" formatoption="true"
                                                th:initValue="*{entity?.mDeliveryType}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">清算类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" name="settleType"
                                                class="layui-input form-input input-select" disabled
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${CLEAR_TYPE}' allowClear="true" formatoption="true"
                                                th:initValue="*{entity?.settleType}"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交易手续费</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="dealFeeAmt" name="dealFeeAmt"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-fixtype="2" data-textrange="2"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.dealFeeAmt}">
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">结算服务费</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="settFeeAmt" name="settFeeAmt"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-fixtype="2" data-textrange="2"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.settFeeAmt}">
                                        <span class="input-right-show">元</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des" th:text="#{IbuQuoteRepo004.remark}">备注</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="layui-form-item">
                                <div class="layui-input-inline input-inline"
                                     style="margin:0 10px;width: 98%!important;">
                                    <textarea id="CfetsQuoteRepo003_remark" name="remark" maxlength="200"
                                              th:text="${entity?.remark}"
                                              class="layui-textarea" placeholder="请输入内容"
                                              th:placeholder="#{SysCommon.placeholder}"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="title-des">金额信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap">首次结算日</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" name="vSettleDate" disabled
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${#dates.format(entity?.vSettleDate,'yyyy-MM-dd')}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap">到期结算日</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" name="mSettleDate" disabled
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${#dates.format(entity?.mSettleDate,'yyyy-MM-dd')}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap">回购利息</label>
                                <div class="layui-input-inline input-inline">
                                    <input required type="text" name="mIntAmt" id="mIntAmt" disabled
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           data-fixtype="2" data-textrange="2"
                                           th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.mIntAmt}">
                                    <span class="input-right-show">元</span>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap">到期结算金额</label>
                                <div class="layui-input-inline input-inline">
                                    <input required type="text" name="mTradeAmt" id="mTradeAmt" disabled
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           data-fixtype="2" data-textrange="2"
                                           th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.mTradeAmt}">
                                    <span class="input-right-show">元</span>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap">实际占款天数</label>
                                <div class="layui-input-inline input-inline">
                                    <input required type="text" name="actDays" id="actDays" disabled
                                           class="layui-input form-input" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.actDays}">
                                    <span class="input-right-show">天</span>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap">期限品种</label>
                                <div class="layui-input-inline input-inline buss-inline-wrap">
                                    <input required type="text" name="termType" id="termType" disabled
                                           class="layui-input form-input" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.termType}">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title pro-item-wrap">
                        <span class="title-des">组合分配</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item" id="distributionDiv"  data-th-if="${entity?.ps} eq ${PS_04}">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap" data-th-utext="#{BussRepoSecPtl.distribution}">分配方式</label>
                                <div class="layui-input-inline input-inline">
                                    <select type="text" id="distribution" class="layui-input form-input input-select" name="distribution"
                                            placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                            allowClear="true" formatoption="true"  th:initValue="${distribution}"
                                            data-th-data-result='${DISTRIBUTION}'>
                                    </select>
                                </div>
                            </div>
                            <div class="form-inline-wrap" >
                                <a  id="btn_autoAllocation"  class="layui-btn layui-btn-sm">自动分配</a>
                            </div>
                        </div>
                        <div>
                            <table class="layui-table" id="bussCombDistribtTable"></table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title pro-item-wrap">
                        <span class="title-des">质押券信息</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item">
                        <div>
                            <table class="layui-table" id="pledgeTable"></table>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        <div class="row text-center" style="margin: 20px 0;">
            <a th:id="CfetsQuoteRepo003_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
            <a id="CfetsQuoteRepo003_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
            <a id="CfetsQuoteRepo003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
    </script>
    <script th:inline="javascript" type="text/javascript">
        var ps = /*[[${ps}]]*/'';
        var ptlAllocations = /*[[${ptlAllocations}]]*/'';
        var repoEntrustPledgeDtos = /*[[${repoEntrustPledgeDtos}]]*/'';
        var PRICE_MODEL = /*[[${PRICE_MODEL}]]*/'';
        var isEdit = /*[[${isEdit}]]*/'';
        var PS_04 = /*[[${PS_04}]]*/'';
        var PS_03 = /*[[${PS_03}]]*/'';
    </script>
    <script th:src="@{/js/cfets/repo/CfetsQuoteRepo003.js}" type="text/javascript"></script>
</div>
</body>
</html>
