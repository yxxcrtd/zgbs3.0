<!DOCTYPE html>
<html style="height:80%;" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout/default}">

<head>

    <style type="text/css">
		        .layui-form-radio {
		            line-height: 24px;
		            padding-right: 0px;
		            margin: 0px;
		        }
		        .layui-form-radio div {
		            font-size: 12px;
		        }
		        .layui-form-radio i{
		            font-size: 14px;
		        }
                .label-deviation-degree{
                    width: 50px;
                    height: 24px;
                    color: red;
                    top: 0;
                    right: 0;
                    position: absolute;
                    text-align: center;
                    line-height: 24px;
                }
                .riskclu{
                   border: 1px solid #ccc;
                   margin: 7px 5px 0px 5px;
                   height: 35px

        <form class="layui-form joyin-form-wrap pro-module-form" id="searchForm">

                <div class="pro-module-wrapper pro-module-base" title="基本信息">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i

                            </h3>
                            <div class="pro-module-item">

                                    <div class="form-inline-wrap" style=" width: 25%; padding:0px;">

                                        <div class="layui-input-inline input-inline">
                                          <!--  <select required type="text" id="ouPartyId" name="ouPartyId"
                                                    class="layui-input form-input input-select" parentIds="CfetsBondDealQuotedPrice004_portfolioName"
                                                    th:placeholder="#{SysCommon.placeholder}" placeholder="请输入内容"
                                                    th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/queryMySideList}" allowClear="true"
                                                    formatoption="true" th:initValue="${entity?.ouPartyId}"></select>-->
                                            <input type="text" id="ouPartyIdStr" name="ouPartyIdStr"
                                                   class="layui-input form-input"
                                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"

                                                   data-th-value="${entity?.ouPartyIdStr}" disabled="disabled">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style=" width: 25%; padding:0px;">
                                        <label class="layui-form-label form-label-wrap"

                                        <div class="layui-input-inline input-inline">
                                            <input type="text" name="ouTraderIdStr" id="ouTraderIdStr"

                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style=" width: 25%; padding:0px;">

                                        <div class="layui-input-inline input-inline">

                                                    class="layui-input form-input input-select"
                                                    th:placeholder="#{SysCommon.placeholder}" placeholder="请输入内容"
                                                    th:data-url="@{/invest/bankuplink/common/CfetsQuotedCommon/queryCounterSideList}" allowClear="true"
                                                    formatoption="true"
                                                    th:initValue="${entity?.counterId}"></select>-->

                                                   class="layui-input form-input"
                                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"

                                                   data-th-value="${entity?.counterIdStr}" disabled="disabled">

                                    </div>

                                        <div class="layui-input-inline input-inline">
                                            <!--<select required type="text" id="counterTraderStr" name="counterTraderStr"
                                                    class="layui-input form-input input-select"
                                                    th:placeholder="#{SysCommon.placeholder}" placeholder="请输入内容"
                                                    th:initValue="${entity?.counterTraderStr}"></select>-->

                                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                   required="required"
                                                   data-th-value="${entity?.counterTraderStr}" disabled="disabled">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" style="width: 25%; padding:0px;">
                                        <label class="layui-form-label form-label-wrap">成交编号</label>
                                        <div class="layui-input-inline input-inline buss-inline-wrap">

                                                   th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.execid}">
                                        </div>
                                    </div>

                                        <div class="layui-input-inline input-inline">
                                            <select  type="text" id="ps" name="ps" allowClear="true"

                                                     placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                     formatoption="true" data-th-initvalue="${entity?.ps}" disabled="disabled">
                                            </select>
                                        </div>
                                    </div>

                                            <select  disabled type="text"  id="repoType"  name="repoType"

                                                     placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                     th:data-result='${REPO_METHOD}' allowClear="true" formatoption="true"
                                                     th:initValue="${entity?.repoType}"></select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style=" width: 25%; padding:0px;">
                                        <label class="layui-form-label form-label-wrap">交易场所</label>
                                        <div class="layui-input-inline input-inline">

                                                     th:data-result='${TRADE_PLACE}' allowClear="true" formatoption="true"

                                        </div>
                                    </div>

                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" style=" width: 25%; padding:0px;">
                                        <label class="layui-form-label form-label-wrap" >成交日期</label>

                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item" >

                                                    th:initValue="*{entity?.settCcy}"></select>
                                        </div>
                                    </div>

                                                   data-th-value="${entity?.tradeAmt}">
                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>

                                        </div>
                                    </div>

                                <div class="layui-form-item" >

                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style=" width: 25%; padding:0px;">
                                        <label class="layui-form-label form-label-wrap" th:text="#{CfetsBondDealQuotedPrice002.settleType}">清算类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <select  disabled type="text"  id="clearType"  name="clearType"

                                                     placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                     th:data-result='${CLEAR_TYPE}' allowClear="true" formatoption="true"
                                                     th:initValue="${entity?.clearType}"></select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style=" width: 25%; padding:0px;">
                                        <label class="layui-form-label form-label-wrap">结算方式</label>
                                        <div class="layui-input-inline input-inline">
                                            <select required disabled type="text"  id="deliveryType" name="deliveryType" class="layui-input form-input input-select"
                                                    placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                    th:data-result='${SETT_MODE}' allowClear="true" formatoption="true"

                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style=" width: 25%; padding:0px;">
                                        <label class="layui-form-label form-label-wrap">到期结算方式</label>
                                        <div class="layui-input-inline input-inline">
                                            <select required disabled type="text"  id="mdeliveryType" name="mdeliveryType" class="layui-input form-input input-select"
                                                    placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                    th:data-result='${SETT_MODE}' allowClear="true" formatoption="true"
                                                    th:initValue="${entity?.mdeliveryType}"></select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item" >
                                    <div class="form-inline-wrap" style=" width: 25%; padding:0px;">
                                        <label class="layui-form-label form-label-wrap">交易手续费</label>
                                        <div class="layui-input-inline input-inline">
                                            <input required type="text" id="procedureAmt" name="procedureAmt"

                                                   data-fixtype="2" data-textrange="2"
                                                   th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.procedureAmt}">
                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style=" width: 25%; padding:0px;">
                                        <label class="layui-form-label form-label-wrap">结算服务费</label>
                                        <div class="layui-input-inline input-inline">
                                            <input required type="text" id="settleServiceAmt" name="settleServiceAmt"
                                                   class="layui-input form-input text-number" placeholder="请输入内容"
                                                   data-fixtype="2" data-textrange="2"
                                                   th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.settleServiceAmt}">
                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" style=" width: 100%; padding:0px;">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{CfetsEtribBondInfo003.remark}" style="width: 105px;">备注</label>
                                        <div class="layui-input-inline" style="width: 80%; margin: 0px; margin-left: auto;">
                                <textarea id="remark" name="remark" th:value="${entity?.remark}"
                                          data-th-text="${entity?.remark}" class="layui-textarea"
                                          placeholder="请输入内容"
                                          data-th-placeholder="#{SysCommon.placeholder}" disabled></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des"
                                      th:text="#{CfetsEtribBondInfo003.amtInfo}">金额信息</span><i
                                    class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">

                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style=" width: 25%; padding:0px;">
                                        <label class="layui-form-label form-label-wrap" >到期结算日</label>
                                        <div class="layui-input-inline input-inline buss-inline-wrap">
                                            <div class="layui-input-inline input-inline buss-inline-wrap">
                                                <input disabled type="text"  name="msettleDate"
                                                       class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                                       th:placeholder="#{SysCommon.placeholder}"

                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" style=" width: 25%; padding:0px;">
                                        <label class="layui-form-label form-lable" style="width: 105px;">回购利息</label>
                                        <div class="layui-input-inline input-inline">

                                    <div class="form-inline-wrap" style=" width: 25%; padding:0px;">
                                        <label class="layui-form-label form-lable" style="width: 105px;">到期结算金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="mtradeAmt" name="mtradeAmt" placeholder="请输入内容"
                                                   data-pattern="" data-fixtype="2" data-textrange='2'
                                                   class="layui-input form-input text-number" disabled="disabled"
                                                   data-th-value="${entity?.mtradeAmt}">
                                            <span class="input-right-show">元</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" style=" width: 25%; padding:0px;">
                                        <label class="layui-form-label form-lable" style="width: 105px;">实际占款天数</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="actRepoTerm" name="actRepoTerm" placeholder="请输入内容"
                                                   data-pattern=""
                                                   class="layui-input form-input text-number" disabled="disabled"
                                                   data-th-value="${entity?.actRepoTerm}">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">期限品种</label>
                                        <div class="layui-input-inline input-inline buss-inline-wrap">
                                            <select  disabled type="text"  id="termType"  name="termType"
                                                     class="layui-input form-input input-select"
                                                     placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                     th:data-result='${TERM_TYPE_REBACK}' allowClear="true" formatoption="true"
                                                     th:initValue="${entity?.termType}"></select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">计息基础</label>
                                        <div class="layui-input-inline input-inline buss-inline-wrap">
                                            <select  disabled type="text"  id="basis"  name="basis"
                                                     class="layui-input form-input input-select"
                                                     placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                     th:data-result='${BASIS}' allowClear="true" formatoption="true"
                                                     th:initValue="${entity?.basis}"></select>
                                        </div>
                                    </div>
                                </div>
                        </div>
                    </div>

                    </div>

                    <div id="combDistribt_div" class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title pro-item-wrap">
                                <span class="title-des">组合分配</span>
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div id="combDistribt">
                                    <table class="layui-table" id="bussCombDistribtTable"
                                           name="bussCombDistribtList"></table>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div id="combPledge_div" class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title pro-item-wrap">
                                <span class="title-des">质押券信息</span>
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div id="combPledge">
                                    <table class="layui-table" id="bussCombPledgeTable"
                                           name="bussCombPledgeList"></table>
                                </div>
                            </div>
                        </div>
                    </div>
                   <!-- <div id="riskTrialRet_div" class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title pro-item-wrap">
                                <span class="title-des">风险试算</span>
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="riskclu" id="CfetsTrdRepoTrade002_DIV2"><span id="riskTrialSpan"></span></div>
                                <div id="riskTrialRet">
                                    <table class="layui-table" id="riskTrialRetTable"
                                           name="riskTrialRetList"></table>
                                </div>
                            </div>
                        </div>
                    </div>-->
                    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                        <div class="text-center">
                            <a id="CfetsTrdRepoTrade002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                               style="display: none;"
                               data-th-text="#{SysCommon.submit}">提交</a>
                        </div>
                    </div>
                </div>
           </div>
        </form>

</div>
