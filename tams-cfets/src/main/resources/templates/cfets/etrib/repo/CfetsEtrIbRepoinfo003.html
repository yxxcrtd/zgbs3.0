<!DOCTYPE html>
<html style="height:80%;" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
    <title data-th-text="#{EtribRepoInfo003}">银行间质押式回购指令多组合指令新建</title>
</head>
<body>
<div layout:fragment="content">
    <div class="joyin-form-wrap">
        <form class="layui-form pro-module-form" id="searchForm">
            <input type="hidden" id="finprodIdhid" name="finprodId" th:value="${entity?.finprodId}">
            <input type="hidden" id="ccy" name="ccy" th:value="${entity?.ccy}">
            <input type="hidden" id="workflowId" name="workflowId" th:value="${workflowId?: ''}">
            <input type="hidden" id="invManagerId" name="invManagerId" th:value="${entity?.invManagerId}">
            <input type="hidden" id="tradeMarketMode" name="tradeMarketMode" th:value="${entity?.tradeMarketMode}">
            <input type="hidden" id="totalEtrustId" name="totalEtrustId" th:value="${entity?.totalEtrustId}">
            <input type="hidden" id="systemAct" name="systemAct" th:value="${entity?.systemAct}">

            <div class="layui-form-item" >
                <div class="form-inline-wrap" >
                    <label class="layui-form-label" style="width: 125px;" data-th-text="#{EtrIbRepoinfo002.ps}">交易方向</label>
                            <div class="layui-input-inline input-inline">

                                <select
                                        required
                                        type="text"
                                        id="ps" disabled
                                        name="ps"
                                        allowClear="true"
                                        class="layui-input form-input input-select"
                                        data-th-data-result="${BACK_LEND_DIRECTION}"
                                        placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}"
                                        formatoption="true"
                                        data-th-initvalue="${entity?.ps}"
                                ></select>
                            </div>
                </div>
                 <div class="form-inline-wrap" >
                        <label class="layui-form-label" style="width: 125px;" >指令金额</label>
                            <div class="layui-input-inline input-inline">
                                <input
                                    type="text"
                                    id="entrustAmt"
                                    name="entrustAmt" disabled
                                    placeholder="请输入内容"
                                    data-pattern=""
                                    data-fixtype="2"
                                    class="layui-input form-input text-number"
                                    required="required"
                                    data-th-value="${entity?.entrustAmt}"
                                />
                                <span class="input-right-show">元</span>
                            </div>
                    </div>
                <div class="form-inline-wrap" >
                    <label class="layui-form-label" style="width: 125px;" data-th-text="#{EtrIbRepoinfo002.settleSpreed}">清算速度</label>
                    <div class="layui-input-inline input-inline">
                        <select
                                required
                                type="text"
                                id="settleSpreed"
                                name="settleSpreed"
                                allowClear="true"
                                class="layui-input form-input input-select"
                                data-th-data-result="${ACCOUNT_SPEED}"
                                placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                formatoption="true"
                                data-th-initvalue="${entity?.settleSpreed}"
                        ></select>
                    </div>
                </div>
             </div>   
                <div class="layui-form-item">

                    <div class="form-inline-wrap" >
                        <label class="layui-form-label" style="width: 125px;" data-th-text="#{EtrIbRepoinfo002.priceModel}">价格模式</label>
                            <div class="layui-input-inline input-inline">
                                <select
                                    type="text"
                                    id="priceModel"
                                    name="priceModel"
                                    required
                                    class="layui-input form-input input-select"
                                    placeholder="请输入内容"
                                    th:placeholder="#{SysCommon.placeholder}"
                                    data-th-data-result="${PRICE_MODEL}"
                                    allowClear="true"
                                    th:initValue="${entity?.priceModel}"
                                ></select>
                            </div>
                    </div>
                    <div class="form-inline-wrap" >
                        <label class="layui-form-label" style="width: 125px;" >回购利率</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="price" name="price" placeholder="请输入内容"
                                   data-pattern="" data-fixtype="2"  data-textrange="4"
                                   class="layui-input form-input text-number" required="required"
                                   data-th-value="${entity?.price}"/>
                            <span class="input-right-show">%</span>
                        </div>
                    </div>

                    <div class="form-inline-wrap" >
                        <label class="layui-form-label" style="width: 125px;" data-th-text="#{EtrRepo002.repoTerm}">回购期限</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="repoTerm" name="repoTerm" placeholder="请输入内容"
                                   data-pattern="" data-fixtype="2"
                                   class="layui-input form-input text-number" required="required" maxlength="10" data-textrange="0"
                                   data-th-value="${entity?.repoTerm}"/>
                            <span class="input-right-show">天</span>
                        </div>
                    </div>
                     
                </div>

                <div class="layui-form-item">
                   
                    <div class="form-inline-wrap" >
                        <label class="layui-form-label" style="width: 125px;" data-th-text="#{EtrRepo002.termType}">期限品种</label>
                            <div class="layui-input-inline input-inline">
                                <select type="text" id="termType" name="termType"
                                                    class="layui-input form-input input-select"
                                                    placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-data-result='${TERM_TYPE_REBACK}'
                                                    allowClear="true" disabled="disabled"
                                                    formatoption="true"
                                                    data-th-initvalue="${entity?.termType}" ></select>
                            </div>
                    </div>
                    <div class="form-inline-wrap" >
                        <label class="layui-form-label" style="width: 125px;" >指令日期</label>
                        <div class="layui-input-inline input-inline">
                            <input
                                    class="layui-input form-input input-dateSelect"
                                    id="entrustDate"
                                    name="entrustDate"
                                    placeholder="请选择时间"
                                    data-th-value='${#dates.format(entity?.entrustDate,"yyyy-MM-dd")}'
                                    required="required"
                                    disabled="disabled"
                            />
                        </div>
                    </div>
                     <div class="form-inline-wrap" >
                        <label class="layui-form-label" style="width: 125px;" data-th-text="#{EtrIbRepoinfo002.counterId}">交易对手</label>
                            <div class="layui-input-inline input-inline">

                                <select type="text" id="counterId" name="counterId"
                                        class="layui-input form-input input-select"
                                        th:placeholder="#{SysCommon.placeholder}" placeholder="请输入内容"
                                        th:data-url="@{/common/joyinbusinessCommon/queryMySideListForSelect?dealType=01}" allowClear="true"
                                        formatoption="true"
                                        th:initValue="${entity?.counterId}"></select>
                            </div>
                    </div>
                    
                </div>

                <div class="layui-form-item">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap" style=" width: 100%; padding:0px;">
                            <label class="layui-form-label form-label-wrap"
                                   data-th-text="#{CfetsEtribBondInfo003.remark}" style="width: 105px;">备注</label>
                            <div class="layui-input-inline" style="width: 80%; margin: 0px; margin-left: auto;">
                            <textarea id="remark" name="remark" th:value="${entity?.remark}"
                                      data-th-text="${entity?.remark}" class="layui-textarea"
                                      placeholder="请输入内容"
                                      data-th-placeholder="#{SysCommon.placeholder}" ></textarea>
                            </div>
                        </div>
                    </div>
                </div>
            <div>
                <div th:if=" ${repo_pledge_model} =='02'"  class="pro-module" id="pledgeBondTotalTblDetailed_div" >
                    <h3 class="pro-module-title">
                        <span class="title-des" data-th-utext="#{BussRepoSecPtl.pledgeInfo}">质押券汇总信息</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div>
                        <table class="layui-table" id="pledgeBondTotalListDetailed" name="pledgeBondTotalListDetailed"></table>
                    </div>
                </div>
            </div>
            <div id="combDistribt_div">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="title-des">组合分配</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item">
                        <div id="combDistribt">
                            <table class="layui-table" id="etrInvestRepoInfoDtos"
                                   name="etrInvestRepoInfoDtos"></table>
                        </div>
                    </div>
                </div>
            </div>

            <div id="riskTrialRet_div" class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title pro-item-wrap">
                        <span class="title-des">风险试算</span>
                        <i class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item">
                        <div class="riskclu" id="CfetsEtribBondinfo003_DIV2"><span id="riskTrialSpan"></span></div>
                        <div id="riskTrialRet">
                            <table class="layui-table" id="riskTrialRetTable" name="riskTrialRetDto"></table>
                        </div>
                    </div>
                </div>
            </div>
            <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                <div class="text-center">
                    <a id="CfetsEtrIbRepoinfo003_btn_riskcal" class="layui-btn layui-btn-sm" >风险试算</a>
                    <a id="CfetsEtrIbRepoinfo003_btn_save" class="layui-btn layui-btn-sm btn-save" style="display: none;"
                       data-th-text="#{SysCommon.save}">保存</a>
                    <a id="CfetsEtrIbRepoinfo003_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                       style="display: none;"
                       data-th-text="#{SysCommon.submit}">提交</a>
                </div>
            </div>

        </form>
    </div>
</div>
