server:
  port: 28080
  address: 0.0.0.0
  contextPath: /interf
#主配置文件，配置了这个会优先读取里面的属性覆盖主配置文件的属性
spring:
  application:
    name: VALUATION-INTERF-SERVER #服务名称
  profiles:
    active: dev
  datasource:
    driverClassName: oracle.jdbc.driver.OracleDriver
application:
  sysCode: VAL
interf:
  properties:
    chunkNumber: 100
    concurrency: 10
    queueCapacity: 50
    sleeptime: 20000
    maxSqlNum: 1000
    fourLevelSubjectKg: Y
# fourLevelSubjectKg:存款类、拆借类资产是否生成对应的四级科目尾号 Y:生成 N:不生成
eureka:
  instance:
    hostname: ${spring.cloud.client.ipAddress}
    instanceId: ${spring.cloud.client.ipAddress}:${server.port}
    preferIpAddress: true
  client:
    enabled: false

jixu:
#  datasource:
#    driverClassName: oracle.jdbc.driver.OracleDriver
#    url: jdbc:oracle:thin:@localhost:1521:orcl
#    username: tams_mastz
#    password: tams_mastz
#    defaultSchema: tams_mastz
#用户系统
#1 jixu用户系统
#2 joyin用户系统
#3 joyinBatch用户系统
  user:
    type: 2

#是否使用和joyin整合后的缩表版本,该参数为临时存在，在尚未完成缩表结构前,测试人员还是测试用原表进行功能测试
#true 精简锁表版本
#false 使用原始的jixu表结构
  joyintables:
    flag: true

#主配置文件，配置了这个会优先读取里面的属性覆盖主配置文件的属性
##目标数据库的类型
#Oracle=11;
#MySQL=12;
#SQLServer=13;
#DB2=14;
#Access=15;
#  adapter:
#    targetDB:
#      dbType: 11

##是否同步数据到数据中心
#0:不同步
#1:同步数据
#如果在StartDate和EndDate输入日期,则是同步一段区间内的数据
#默认都是空,则是同步做账日的数据
#DataCenter.StartDate=2017-07-19
#  dataCenter:
#    synchFlag: 0
#    startDate:
#    endDate:

##使用Hibernate或MyBatis框架
#0:使用Hibernate框架
#1:使用MyBatis框架
#  frameWork:
#    flag: 0

##0 jixu独立系统
##1 jixu调用joyin的主键生成系统
#  keyGenerate:
#    flag: 0

#是否需要生成估值表,余额表等报表。外接入其它系统时，不需要几许生成报表
#  genValreport:
#    flag: false
