server:
  port: 8889
agent:
  servers: 127.0.0.1:9190
  name: default
  type: mock #mock #ufx #KDGateway #ufx #kcbp
  query:
    interval: 1000
    count: 2
  cache:
    path: cache
    clean: 0 0 16 ? * MON-FRI

#主配置文件，配置了这个会有限读取里面的属性覆盖著配置文件的属性
spring:
  profiles:
    active: joyin-210
  application:
    name: terminal

trade:
  serverName: exchangeService # 交易核心的注册服务名 微服务版本时启用
  server:
    single: true #交易为是否一体化， 是一体化 需要配置下面交易节点项，不是则无需配置
    nodes: 127.0.0.1:8080,192.168.70.210:8080 #一体化节点地址集，多个节点之间用逗号隔开
    prefix: /tams/service #一体化服务访问地址前缀信息

log:
  path: /home/tams/logs/terminal
  level: debug

netty:
  port: 9190
  buffer:
    recv: 4194304
    send: 4194304
    write:
      high: 524288
      low: 32768
  idle:
    read: 20
    write: 10
    all: 0
  thread:
    num:
      boss: 1
      worker: 2
  reconnect:
    delay: 2

# kcbp config
kcbp:
  active: false
  keep:
    fixRate: 30000 #kcbp终端维持连接频率
  # 上报本机信息
  client:
    address: 192.168.1.175
    # 16进制紧缩形式,AABBCCDDEEFF
    mac: 001EEC10D59A
    # 固定8位16进制,aaaaaaaa,例如:000006fd
    cpuid: 000006fd
    # 硬盘ID，不定长,由各硬盘厂商确定
    hdid: S1DBNSAF492660H
    # 计算机名称
    computename: ZXJT_PC
    # 机器GUID，由标准GUID算法确定
    guid: 92516-OEM-7502605-10173
    # 客户公司名称
    company: 中信建投

# ufx config
ufx:
  active: false
  path: tams-exchange-terminal/ufxconfig/t2sdk_hundsun-config.xml
  opStation:
    #终端名称
    cinfo: O32Client
    #终端版本
    cver: V2.0
    #特征码
    ch: ZYYH
    #后台系统的版本号
    sver: O32Server1.0
    #接入网关的ip地址
    ar: 121.8.190.120

KDGateway:
  active: false
  # 上报本机信息
  client:
    # 扩展信息
    mark: JOYIN;V0.0.0.1@V1.0

jsd:
  active: false
  connectTimeout: 10000

ctp:
  active: false
---
spring:
  profiles: joyin-210
  datasource:
    url: jdbc:oracle:thin:@//192.168.70.245:1521/orcl
    username: BS303INIT_EXCHANGE0106
    password: BS303INIT_EXCHANGE0106
    maxTotal: 50
    connectionProperties: oracle.net.CONNECT_TIMEOUT=50000;oracle.net.ReadTimeout=50000
base:
  datasource:
    url: jdbc:oracle:thin:@//192.168.70.245:1521/orcl
    username: BS303INIT_EXCHANGE0106
    password: BS303INIT_EXCHANGE0106
    maxTotal: 50
    connectionProperties: oracle.net.CONNECT_TIMEOUT=50000;oracle.net.ReadTimeout=50000
eureka:
  client:
    enabled: false #是否启用eureka客户端，如果启用，则需要有eureka服务器，默认为true
