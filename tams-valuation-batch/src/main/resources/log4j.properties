### 设置###
log4j.rootLogger = debug,stdout,detail

### 输出信息到控制抬 ###
log4j.appender.stdout = org.apache.log4j.ConsoleAppender
log4j.appender.stdout.Target = System.out
log4j.appender.stdout.layout = org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern = [%-5p] %d{yyyy-MM-dd HH:mm:ss,SSS} method:%l%n%m%n

### 输出DETAIL级别日志 ###
log4j.appender.detail = org.apache.log4j.DailyRollingFileAppender
log4j.appender.detail.File =/home/tams/logs/batch/detail/detail
log4j.appender.detail.DatePattern='_'yyyy-MM-dd
log4j.appender.detail.Encoding=UTF-8
log4j.appender.detail.Append = true
log4j.appender.detail.Threshold = ERROR
log4j.appender.detail.layout = org.apache.log4j.PatternLayout
log4j.appender.detail.layout.ConversionPattern = %-d{yyyy-MM-dd HH:mm:ss}  [ %t:%r ] - [ %p ]  %m%n

