        <div class="joyin-form-wrap layui-row">

                <label class="layui-form-label form-lable">资产代码</label>
                <div class="layui-input-inline input-inline">

                </div>
            </div>
            <div class="layui-col-md3">

                           class="layui-input form-input input-dateSelect" />
                </div>
            </div>
            <div class="layui-col-sm3 layui-col-lg3 layui-col-md-offset2">
                <button class="layui-btn layui-btn-sm " id="ModValBatchTask001_btn_doExecBtn"><i class="iconfont icon-execute"></i>执行</button>
                <button class="layui-btn layui-btn-sm  btn-default" id="ModValBatchTask001_btn_searchBtn"><i class="iconfont icon-search"></i>查询</button>
            </div>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
