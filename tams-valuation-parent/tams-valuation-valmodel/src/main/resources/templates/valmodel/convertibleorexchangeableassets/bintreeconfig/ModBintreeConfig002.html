<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	xmlns:th="http://www.w3.org/1999/xhtml"
	layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
<title data-th-text="#{ModBintreeConfig002}">二叉树模型参数配置修改</title>
</head>
<body>
	<div layout:fragment="content">

		<form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-lable">资产名称</label>
					<div class="layui-input-inline input-inline">
						<!--<input type="text" id="finprodId" name="finprodId"
							class="layui-input form-input" placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-value="${entity?.finprodId}" required/>-->
						<select type="text" id="finprodId" name="finprodId"
								class="layui-input form-input input-select" allowClear="true" required="required"
								data-th-placeholder="#{SysCommon.placeholder}" formatOption="true"
								data-th-data-url="@{/valmodel/convertibleorexchangeableassets/bintreeconfig/ModBintreeConfig002/getSecAssetInfo}"
								data-th-initvalue="${entity?.finprodId}"> </select>
					</div>
				</div>
				<div class="layui-inline layui-col-md6" style="display: none;">
					<label class="layui-form-label form-lable">资产名称</label>
					<div class="layui-input-inline input-inline">
						<input id="finprodName" name="finprodName"
							 type="text" disabled="true"
							data-th-value="${entity?.finprodName}"
							class="layui-input form-input" placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}" required/>
					</div>
				</div>
				<div class="layui-inline layui-col-md6" >
					<label class="layui-form-label form-lable">资产代码</label>
					<div class="layui-input-inline input-inline">
						<input id="finprodName1" name="finprodName"
							   type="text" disabled="true"
							   data-th-value="${entity?.finprodName}"
							   class="layui-input form-input" placeholder="请输入内容"
							   data-th-placeholder="#{SysCommon.placeholder}" required/>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-lable">标的股票代码</label>
					<div class="layui-input-inline input-inline">
						<input id="stockId" name="stockId"
							   class="layui-input form-input" allowClear="true"
							   data-th-placeholder="#{SysCommon.placeholder}"
							   data-th-value="${entity?.stockId}"/>
					</div>
				</div>
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-lable">标的公司上市状态</label>
					<div class="layui-input-inline input-inline">
						<!--<input type="text" id="stockBordsttus" name="stockBordsttus"
							   class="layui-input form-input input-select"
							placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-value="${entity?.stockBordsttus}"
							data-th-data-result='${MODEL_BOARD_STATUS}' required />-->
						<select id="stockBordsttus" name="stockBordsttus"
								class="layui-input form-input input-select"
								data-th-data-result='${MODEL_BOARD_STATUS}' allowClear="true"
								placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
								formatoption="true"  required="required"
								data-th-initvalue="${entity?.stockBordsttus}" disabled>
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-lable">可比公司</label>
					<div class="layui-input-inline input-inline">
						<select type="text" id="compOrg"
							data-th-initvalue='${entity?.compOrg}' name="compOrg"
							class="tabJump layui-input form-input input-select"
							data-th-data-url="@{/valmodel/convertibleorexchangeableassets/bintreeconfig/ModBintreeConfig002/getMarketId}"
							placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}">
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-lable">可比公司股票</label>
					<div class="layui-input-inline input-inline">
						<select type="text" id="compStockid"
								data-th-initvalue='${entity?.compStockid}' name="compStockid"
								class="layui-input form-input input-select" allowClear="true"
								data-th-data-url="@{/valmodel/convertibleorexchangeableassets/bintreeconfig/ModBintreeConfig002/getStockAssetInfo}"
								placeholder="请输入内容"  parentIds="compOrg"
								data-th-placeholder="#{SysCommon.placeholder}" >
						</select>
						<!--<input id="compStockid" name="compStockid"
							   class="layui-input form-input text" allowClear="true"
							   data-th-placeholder="#{SysCommon.placeholder}"
							   data-th-value="${entity?.compStockid}" disabled/>-->
					</div>

				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-lable">市场乘数方法</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="marketMulti" name="marketMulti"
							class="layui-input form-input input-select"
							placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-value="${entity?.marketMulti}"
							data-th-data-result='${MODEL_MARKET_MULTI}'/>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-lable">标的公司每股收益</label>
					<div class="layui-input-inline input-inline">
						<input id="finprodProit" name="finprodProit"
							   class="layui-input form-input text-number" allowClear="true"
							   data-th-placeholder="#{SysCommon.placeholder}"
							   data-th-value="${entity?.finprodProit}"/>
					</div>
				</div>
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-lable">标的公司每股净资产</label>
					<div class="layui-input-inline input-inline">
						<input id="finprodNetasset" name="finprodNetasset"
							class="layui-input form-input text-number" allowClear="true"
							data-th-placeholder="#{SysCommon.placeholder}" 
							data-th-value="${entity?.finprodNetasset}"/>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-lable">无风险利率曲线名称</label>
					<div class="layui-input-inline input-inline">
						<!--<input type="text" id="curveCode" name="curveCode"
							disabled="true" class="layui-input form-input input-select"
							placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-value="${entity?.curveCode}"
							data-th-data-result='${CURVE_CODE}' required/>-->
						<select type="text" id="curveCode"
								data-th-initvalue='${entity?.curveCode}' name="curveCode"
								formatoption="true" required="required"
								class="layui-input form-input input-select"
								data-th-data-url="@{/valmodel/convertibleorexchangeableassets/bintreeconfig/ModBintreeConfig002/getCurveCode}"
								placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}" disabled>
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-lable">连续股息率%</label>
					<div class="layui-input-inline input-inline">
						<input id="smoothsection" name="smoothsection"
							class="layui-input form-input text-number" allowClear="true"
							data-th-placeholder="#{SysCommon.placeholder}" 
							data-th-value="${entity?.smoothsection}*100" required/>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-lable">二叉树步数</label>
					<div class="layui-input-inline input-inline">
						<input id="bintreeStep" name="bintreeStep"
							   class="layui-input form-input text-number" allowClear="true"
							   data-th-placeholder="#{SysCommon.placeholder}" data-textrange="0"
							   data-th-value="${entity?.bintreeStep}" required/>
					</div>
				</div>
			</div>
			<div class="layui-col-md10" style="margin: 30px 0;">
				<div class="text-center">
					<a th:id="|${pageId}_btn_save|"
						class="layui-btn layui-btn-sm btn-save"
						data-th-text="#{SysCommon.save}">保存</a> <a
						th:id="|${pageId}_btn_submit|"
						class="layui-btn layui-btn-sm btn-submit"
						data-th-text="#{SysCommon.submit}">提交</a> <a
						th:id="|${pageId}_btn_cancel|"
						class="layui-btn layui-btn-sm btn-cancel"
						data-th-text="#{SysCommon.cancel}">取消</a>
				</div>
			</div>

		</form>

	</div>
	<div layout:fragment="script">
		<script th:inline="javascript" type="text/javascript">

	</script>
		<script data-th-inline="javascript" type="text/javascript">
		var workflowId = /*[[${workflowId}]]*/;
		var productsDue = /*[[${productsDue}]]*/;
		var MODEL_MAIN_GRADE_TYPE = /*[[${MODEL_MAIN_GRADE_TYPE}]]*/'';
		var SEQNO = /*[[${SEQNO}]]*/;
	</script>
		<script data-th-src="@{/js/valmodel/common/util.js}"
			type="text/javascript"></script>
		<script
			data-th-src="@{/js/valmodel/convertibleorexchangeableassets/bintreeconfig/ModBintreeConfig002.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
