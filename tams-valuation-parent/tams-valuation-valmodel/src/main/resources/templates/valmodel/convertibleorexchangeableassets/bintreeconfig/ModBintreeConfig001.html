<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<title data-th-text="#{ModBintreeConfig001}">二叉树模型参数配置查询</title>
<body>
	<div id="insertTable">
		<div layout:fragment="content">
			<div class="form-button-area" export="false">
					<!-- <a id="LossGivenDefaultMaintain_btn_chbexport"
					class="layui-btn layui-btn-sm btn-export btn-default">导出</a>
					<a id="LossGivenDefaultMaintain_btn_search"
					class="layui-btn layui-btn-sm btn-default">查询</a>
					 -->
				<a id="ModBintreeConfig001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
				<a id="ModBintreeConfig001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}">删除</a>
			</div>
			<div class="joyin-form-wrap joyin-filter-form condition-area">
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
	                    <div class="layui-inline layui-col-md6">
	                        <label class="layui-form-label form-lable">资产名称</label>
	                        <div class="layui-input-inline input-inline">
	                            <select id="finprodName" name="finprodName" data-th-data-url="@{/valmodel/convertibleorexchangeableassets/bintreeconfig/ModBintreeConfig001/getFinprodIdForBintree}"
		                           data-th-data-formatoption=true class="input-select" placeholder="请选择" 
		                           data-th-placeholder="#{SysCommon.selectplaceholder}" 
		                           allowClear="true" multiple="multiple">
	                            </select>
	                        </div>
	                    </div>
						<div class="layui-inline layui-col-md6">
							<label class="layui-form-label form-lable">标的公司上市状态</label>
							<div class="layui-input-inline input-inline">
								<select id="stockBordsttus" name="stockBordsttus"  data-th-data-result='${MODEL_BOARD_STATUS}'
										data-th-data-formatoption=true class="input-select" placeholder="请选择"
										data-th-placeholder="#{SysCommon.selectplaceholder}"
										allowClear="true">
								</select>
							</div>
						</div>
					</div>
				</form>
			</div>
	
			<div>
				<table class="layui-table" id="dataTable">
				</table>
			</div>
		</div>
		<div layout:fragment="script">
			<script data-th-inline="javascript" type="text/javascript">
				var isMain = /*[[${isMain}]]*/'';
				var searchDataStart = /*[[${searchDataStart}]]*/'';
				var searchDataEnd = /*[[${searchDataEnd}]]*/'';
				var submitStatus = /*[[${submitStatus}]]*/'';
				var indentifyMark = /*[[${indentifyMark}]]*/'';
				var submitFeedbackStatus = /*[[${submitFeedbackStatus}]]*/'';
			</script>
			<script data-th-src="@{/js/report/report-common.js}"
				type="text/javascript"></script>
			<script data-th-src="@{/js/report/jquery.validate.js}"
				type="text/javascript"></script>
			<script data-th-src="@{/js/report/joyinvalid.js}"
				type="text/javascript"></script>
			<script
				data-th-src="@{/js/valmodel/convertibleorexchangeableassets/bintreeconfig/ModBintreeConfig001.js}"
				type="text/javascript"></script>
		</div>
	</div>
</body>
</html>
