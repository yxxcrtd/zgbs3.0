<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="utf-8">
    <title>现金流折现模型曲线配置查询</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area" export="false">
        <a id="ValCashFlowDiscount001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
        <a id="ValCashFlowDiscount001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}">删除</a>
        <a id="ValCashFlowDiscount001_btn_export" class="layui-btn layui-btn-sm btn-export btn-default">导出</a>
        <a id="ValCashFlowDiscount001_btn_reset" class="layui-btn layui-btn-sm btn-reset btn-default">重置</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md3"id="asset_type">
                    <label class="layui-form-label form-lable">资产类型</label>
                    <div class="layui-input-inline input-inline">
                        <select id="secTypeModel" name="secTypeModel" searchable="false" type="text"
                                data-th-data-result='${SEC_TYPE}'
                                data-th-initValue="${entity?.secTypeModel}"
                                class="layui-input form-input input-select" placeholder="请选择">
                        </select>
                    </div>
                </div>

                <div class="layui-inline layui-col-md3" id="asset_detail_type">
                    <label class="layui-form-label form-lable">资产细分类</label>
                    <div class="layui-input-inline input-inline">
                        <select id="secDetailTypeModel" name="secDetailTypeModel" searchable="false" type="text"
                                data-th-data-result='${BOND_TYPE}'
                                data-th-initValue="${entity?.secDetailTypeModel}"
                                class="layui-input form-input input-select" placeholder="请选择">
                        </select>
                    </div>
                </div>

                <div class="layui-inline layui-col-md3" id="asset_detail_type_plan" >
                    <label class="layui-form-label form-lable">资产细分类</label>
                    <div class="layui-input-inline input-inline">
                        <select id="secDetailTypeModel_plan" name="secDetailTypeModel" searchable="false" type="text"
                                data-th-data-result='${PLANNED_TYPE}'
                                data-th-initValue="${entity?.secDetailTypeModel}"
                                class="layui-input form-input input-select" placeholder="请选择">
                        </select>
                    </div>
                </div>

                <div class="layui-inline layui-col-md3"id="asset_Name">
                    <!-- modify by yanya on 20210821 去除资产名称条件，增加日期查询条件
                    <label class="layui-form-label form-lable">资产名称</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="finprodId" name="finprodId"
                               class="layui-input form-input input-lenovoselect" data-th-data-url="@{/valmodel/valgeneralfixedincomeassets/cashflowdiscountmanagement/CashFlowDiscount001/getFinprodIdForValuation}"
                                placeholder="请选择"
                                data-parentids="secTypeModel,secDetailTypeModel"
                                data-th-placeholder="#{SysCommon.selectplaceholder}"
                                data-idfield="code"  data-keyfield="shortName" data-th-data-effectivefieldsalias='|{"shortName":"资产名称","code":"资产代码"}|'
                                >
                    </div>-->
                    <label class="layui-form-label form-lable">查询日期</label>
                    <div class="layui-input-inline input-inline">
                        <input id='qryDate' name='qryDate' class="layui-input form-input input-dateRangeSelect"
                               placeholder="请选择时间区间" data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
		var MODEL_MAIN_GRADE_TYPE = /*[[${MODEL_MAIN_GRADE_TYPE}]]*/;
		var MODEL_SEC_DETAIL_TYPE = /*[[${MODEL_SEC_DETAIL_TYPE}]]*/;
	</script>
    <script data-th-src="@{/js/lossmodel/common/util.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/valmodel/valgeneralfixedincomeassets/cashflowdiscountmanagement/CashFlowDiscount001.js}" type="text/javascript"></script>
</div>
</body>
</html>
