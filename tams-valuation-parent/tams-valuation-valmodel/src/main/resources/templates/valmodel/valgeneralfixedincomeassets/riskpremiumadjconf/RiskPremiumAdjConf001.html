<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>风险溢价调整配置</title>
</head>
<body>
</body>
<div layout:fragment="content">
    <div class="form-button-area"  export="false">
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">资产类型</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="assetType" name="assetType" class="layui-input form-input input-select" placeholder="请选择"
                               data-th-data-result="${SEC_TYPE}" allowClear="true" multiple="multiple" >
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">资产名称</label>
                    <div class="layui-input-inline input-inline">
                        <select id="assetId" name="assetId"
                                class="layui-input form-input input-select"
                                data-th-data-url="@{/valmodel/valgeneralfixedincomeassets/riskpremiumadjconf/RiskPremiumAdjConf001/getFinprodIdForRiskPremium}"
                                multiple="multiple" allowClear="true" data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div id="dataTable"></div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valmodel/valgeneralfixedincomeassets/riskpremiumadjconf/RiskPremiumAdjConf001.js}" type="text/javascript"></script>
</div>
</html>
