<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>风险溢价调整配置</title>
</head>
<body>
</body>
<div layout:fragment="content">
        <form class="layui-form joyin-form-wrap pro-module-form" id="searchForm">
            <h3 class="pro-module-title">
                <span class="title-des">风险溢价调整配置</span>
            </h3>
            <div class="layui-form-item" style="display: none;">
                <input id="seqno" name="seqno" class="layui-input form-input" placeholder="序列号"
                       data-th-value="${entity?.seqno}"/>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">资产代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="finprodId" name="finprodId" disabled="disabled"
                               class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-value="${entity?.finprodId}" required>
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">资产名称</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="finprodName" name="finprodName" disabled="disabled"
                               class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-value="${entity?.finprodName}" required>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">资产类型</label>
                    <div class="layui-input-inline input-inline">
                        <select id="secTypeModel" name="secTypeModel" disabled="disabled"
                                class="layui-input form-input input-select"
                                data-th-data-result='${SEC_TYPE}' allowClear="true"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                formatoption="true"
                                data-th-initvalue="${entity?.secTypeModel}" required>
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">评级来源</label>
                    <div class="layui-input-inline input-inline">
                        <select id="gradeSource" name="gradeSource" disabled="disabled"
                                class="layui-input form-input input-select"
                                data-th-data-result='${MODEL_GRADE_TYPE}' allowClear="true"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                formatoption="true"
                                data-th-initvalue="${entity?.gradeSource}" required>
                        </select>
                    </div>
                </div>
            </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">评级</label>
                        <div class="layui-input-inline input-inline">
                            <select id="gradeResult" name="gradeResult"
                                    class="layui-input form-input input-select" disabled="disabled"
                                    data-th-data-result='${MAIN_GRADE_RESULT}' allowClear="true"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    formatoption="true"
                                    data-th-initvalue="${entity?.gradeResult}" required>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md6">
                        <!-- modify by yanya on 20210823 调整基准日为定价日-->
                        <label class="layui-form-label form-lable">定价日</label>
                        <div class="layui-input-inline input-inline">
                            <input class="layui-input form-input input-dateSelect" id="basedate"
                                   name="basedate" placeholder="请选择时间" disabled="disabled"
                                   data-th-value='${#dates.format(entity?.basedate,"yyyy-MM-dd")}'
                                   required>
                        </div>
                    </div>
                </div>
            <!-- modify by yanya on 20210823 增加曲线名称、曲线日期 start-->
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">曲线名称</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="curveName" name="curveName" disabled="disabled"
                               class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-value="${entity?.curveName}" required>
                        <input type="text" id="curveCode" name="curveCode" disabled="disabled" style="display: none;"
                               class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-value="${entity?.curveCode}" required>
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">曲线日期</label>
                    <div class="layui-input-inline input-inline">
                        <input class="layui-input form-input input-dateSelect" id="curveDate"
                               name="curveDate" placeholder="请选择时间" disabled="disabled"
                               data-th-value='${#dates.format(entity?.curveDate,"yyyy-MM-dd")}'
                               required>
                    </div>
                </div>
            </div>
            <!-- modify by yanya on 20210823 增加曲线名称、曲线日期 end-->
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">风险溢价%</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="spread" name="spread" placeholder="请输入内容" disabled="disabled"
                               data-pattern="" data-fixtype="2" data-textrange="4"
                               class="layui-input form-input text-number"
                               data-th-value="${entity?.spread}" required>
                        <span class="input-right-show">%</span>
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">风险溢价调整%</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="spreadAdj" name="spreadAdj" placeholder="请输入内容"
                               data-pattern="" data-fixtype="2" data-textrange="4"
                               class="layui-input form-input text-number" required="required"
                               data-th-value="${entity?.spreadAdj}">
                        <span class="input-right-show">%</span>
                    </div>
                </div>
            </div>
            <div class="layui-row" style="margin: 50px;">
                <div class="text-center">
                    <button type="button" class="layui-btn btn-submit" id="AssetImpairmentManagement002_btn_submit">提交</button>
                    <a type="button" class="layui-btn btn-cancel" id="AssetImpairmentManagement002_btn_cancel">取消</a>
                </div>
            </div>
        </form>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valmodel/valgeneralfixedincomeassets/riskpremiumadjconf/RiskPremiumAdjConf002.js}" type="text/javascript"></script>
</div>

</html>
