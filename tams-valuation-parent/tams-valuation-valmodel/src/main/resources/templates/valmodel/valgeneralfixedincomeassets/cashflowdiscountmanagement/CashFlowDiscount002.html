<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="utf-8">
    <title data-th-text="#{CashFlowDiscount002}">现金流模型曲线配置管理</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" style="padding: 10px 0;" id="submitForm">

        <div class="layui-form-item" style="display: none">
            <input id="operateType" name="operateType"
                   class="layui-input form-input" placeholder="操作类型" data-th-value="${entity?.operateType}">
            <input id="pageModel" name="pageModel"
                   class="layui-input form-input" placeholder="pageModel" data-th-value="${pageModel}">
            <input id="seqNo" name="seqNo"
                   class="layui-input form-input" placeholder="流水号" data-th-value="${entity?.seqNo}">
            <input id="status" name="status"
                   class="layui-input form-input" placeholder="流程状态" data-th-value="${status}">
            <input type="text" id="workflowId" name="workflowId"  placeholder="流程 Id"
                   class="layui-input form-input" data-th-value="${entity?.workflowId}" >
        </div>
        <div class="layui-form-item">
            <div class="layui-row layui-col-space20">
                <div class="layui-inline layui-col-md5 "id="asset_type">
                    <label class="layui-form-label form-lable">资产类型</label>
                    <div class="layui-input-inline input-inline">
                        <select id="secTypeModel" name="secTypeModel" searchable="false" type="text"
                                data-th-data-result='${SEC_TYPE}'
                                data-th-initValue="${entity?.secTypeModel}"
                                class="layui-input form-input input-select" placeholder="请选择" required>
                        </select>
                    </div>
                </div>

                <div class="layui-inline layui-col-md5" id="asset_detail_type">
                    <label class="layui-form-label form-lable">资产细分类</label>
                    <div class="layui-input-inline input-inline">
                        <select id="secDetailTypeModel" name="secDetailTypeModel" searchable="false" type="text"
                                data-th-data-result='${BOND_TYPE}'
                                data-th-initValue="${entity?.secDetailTypeModel}"
                                class="layui-input form-input input-select" placeholder="请选择" required>
                        </select>
                    </div>
                </div>

                <div class="layui-inline layui-col-md5" id="asset_detail_type_plan">
                    <label class="layui-form-label form-lable">资产细分类</label>
                    <div class="layui-input-inline input-inline">
                        <select id="secDetailTypeModel_plan" name="secDetailTypeModel" searchable="false" type="text"
                                data-th-data-result='${PLANNED_TYPE}'
                                data-th-initValue="${entity?.secDetailTypeModel}"
                                class="layui-input form-input input-select" placeholder="请选择" required>
                        </select>
                    </div>
                </div>
                <!-- modify by yanya on 20210821 去除资产名称start-->
                <!--<div class="layui-inline layui-col-md5">
                    <label class="layui-form-label form-lable">资产名称</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="finprodName" name="finprodName"
                               class="layui-input form-input input-lenovoselect" data-th-data-url="@{/valmodel/valgeneralfixedincomeassets/cashflowdiscountmanagement/CashFlowDiscount001/getFinprodIdForValuation}"
                               placeholder="请选择"
                               data-parentids="secTypeModel,secDetailTypeModel"
                               data-th-placeholder="#{SysCommon.selectplaceholder}"
                               data-th-value="${entity?.finprodName}"
                               data-idfield="code"  data-keyfield="shortName" data-th-data-effectivefieldsalias='|{"shortName":"资产名称","code":"资产代码"}|'
                        >
                    </div>
                </div>
                <div class="layui-inline layui-col-md5">
                    <label class="layui-form-label form-lable">资产代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="finprodId" name="finprodId" disabled="true"
                               class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-value="${entity?.finprodId}">
                    </div>
                </div>-->
                <!-- modify by yanya on 20210821 去除资产名称start-->
                <div class="layui-inline layui-col-md5"id="asset_Name">
                    <label class="layui-form-label form-lable">曲线族</label>
                    <div class="layui-input-inline input-inline">
                        <select id="curveGroupCode" name="curveGroupCode" searchable="false" type="text"
                                data-th-data-result='${CURVE_GROUP}'
                                data-th-initValue="${entity?.curveGroupCode}"
                                class="layui-input form-input input-select" placeholder="请选择" required>
                        </select>
                    </div>
                </div>

                <div class="layui-inline layui-col-md5">
                    <label class="layui-form-label form-lable">曲线类型</label>
                    <div class="layui-input-inline input-inline">
                        <select id="curveType" name="curveType" searchable="false" type="text"
                                data-th-data-result='${CURVE_TYPE}'
                                data-th-initValue="${entity?.curveType}"
                                class="layui-input form-input input-select" placeholder="请选择" required>
                        </select>
                    </div>
                </div>

                <div class="layui-inline layui-col-md5">
                    <label class="layui-form-label form-label-wrap">是否使用兜底评级</label>
                    <div class="layui-input-inline input-inline">
                        <input type="checkbox" id="isBottomGrade" name="isBottomGrade" lay-filter="isBottomGrade"
                               lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                               data-th-checked="${YES_OR_NO_Y} ==${entity?.isBottomGrade}" required>
                    </div>
                </div>
                <div class="layui-inline layui-col-md5" id="isBottomGradeDiv">
                    <label class="layui-form-label form-lable">兜底评级</label>
                    <div class="layui-input-inline input-inline">
                        <select name="bottomGrade" id="bottomGrade"
                                class="layui-input form-input input-select"
                                placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${MAIN_GRADE_RESULT}"
                                data-th-initValue="*{entity?.bottomGrade}">
                        </select>
                    </div>
                </div>

                <div class="layui-inline layui-col-md5" style="float:left;">
                    <label class="layui-form-label form-lable">生效日期</label>
                    <div class="layui-input-inline input-inline">
                        <input class="layui-input form-input input-dateSelect"
                               id="effDate" name="effDate"
                               th:value="${#dates.format(entity?.effDate,'yyyy-MM-dd')}"
                               placeholder="请选择时间" required>
                    </div>
                </div>
                <div class="layui-inline layui-col-md5" style="float:left;">
                    <label class="layui-form-label form-label-wrap">是否平滑曲线</label>
                    <div class="layui-input-inline input-inline">
                        <input type="checkbox" id="isSmooth" name="isSmooth" lay-filter="isSmooth"
                               lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
                               data-th-checked="${YES_OR_NO_Y} ==${entity?.isSmooth}" required>
                    </div>
                </div>
                <div class="layui-inline layui-col-md5" id="smoothSectionDiv">
                    <label class="layui-form-label form-lable">平滑区间</label>
                    <div class="layui-input-inline input-inline">
                        <select name="smoothSection" id="smoothSection"
                                class="layui-input form-input input-select"
                                placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result="${SMOOTHSECTION}"
                                data-th-initValue="*{entity?.smoothSection}">
                        </select>
                    </div>
                </div>
            </div>

        </div>



    </form>
    <div class="layui-col-md11" style="position: fixed;bottom: 30px;">
        <div class="text-center">
            <!--<a id="ValCashFlowDiscount002_btn_save" class="layui-btn layui-btn-sm btn-save">保存</a>-->
            <a id="ValCashFlowDiscount002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
            <a id="ValCashFlowDiscount002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
		var MODEL_MAIN_GRADE_TYPE = /*[[${MODEL_MAIN_GRADE_TYPE}]]*/'';
		var MODEL_SEC_DETAIL_TYPE = /*[[${MODEL_SEC_DETAIL_TYPE}]]*/'';
        var SMOOTHSECTION_02 = /*[[${SMOOTHSECTION_02}]]*/'';
	</script>
    <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/valmodel/common/util.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/valmodel/valgeneralfixedincomeassets/cashflowdiscountmanagement/CashFlowDiscount002.js}" type="text/javascript"></script>
</div>
</body>
</html>
