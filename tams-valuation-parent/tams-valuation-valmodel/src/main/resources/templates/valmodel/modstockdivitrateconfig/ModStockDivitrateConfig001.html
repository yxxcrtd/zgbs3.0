<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ModStockDivitrateConfig001}">预期股息增长率配置</title>
</head>
<body>
    <div layout:fragment="content">
        <!-- 画面信息 -->
        <div class="form-button-area">
            <a id="ModStockDivitrateConfig001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
            <a id="ModStockDivitrateConfig001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}" style="display: none">删除</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
					<div
						class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable">资产名称</label>
						<div class="layui-input-inline input-inline">
	                         <select type="text" id="finprodId" name="finprodId"
	                         	class="layui-input form-input input-select" placeholder="请输入内容" data-th-parentids="profitType"
	                         	data-th-data-url="@{/valmodel/modstockdivitrateconfig/ModStockDivitrateConfig001/getAssetCodeList}"
	                         	>
	                         </select>
                       </div>
					</div>
                </div>
                <!--<div class="layui-form-item" style="margin-top: 20px">
                    <label class="layui-form-label form-lable"></label>
                </div>-->
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valmodel/modstockdivitrateconfig/ModStockDivitrateConfig001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
