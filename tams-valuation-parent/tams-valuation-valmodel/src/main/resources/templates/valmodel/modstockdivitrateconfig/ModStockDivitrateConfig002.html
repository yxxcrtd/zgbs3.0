<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
<title>预期股息增长率配置</title>
    <style>
        .mst-lable{
            width: 20%;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form" style="padding: 10px 0;" id="submitForm">
                <div class="layui-form-item" style="display: none">
                	<input type="text" id="seqno" name="seqno" class="layui-input form-input"
                           data-th-value="${entity?.seqno}">
		            <input id="operateType" name="operateType" class="layui-input form-input" placeholder="操作类型"
		                   data-th-value="${entity?.operateType}"/>
		            <input type="text" id="workflowId" name="workflowId" placeholder="流程 Id"
                   			class="layui-input form-input" data-th-value="${entity?.workflowId}"/>
                </div>
                <!--<div class="layui-form-item" style="display: none;">
                    <label class="layui-form-label form-lable mst-lable" >资产类型</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="secTypeModel" name="secTypeModel"
							required="required"
							data-th-data-result='${SEC_TYPE}'
							data-th-initValue="${entity?.secTypeModel}"
							class="layui-input form-input input-select" allowClear="true"
							placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}"></select>
                    </div>
                </div>
                <div class="layui-form-item" style="display: none;">
                    <label class="layui-form-label form-lable mst-lable">资产细分类</label>
					<div class="layui-input-inline input-inline">
						<select type="text" id="secDetailTypeModel" name="secDetailTypeModel"
							required="required"
							data-th-data-result='${MODEL_SEC_DETAIL_TYPE}'
							data-th-initValue="${entity?.secDetailTypeModel}"
							class="layui-input form-input input-select" allowClear="true"
							placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}"></select>
					</div>
                </div>-->
                <div class="layui-form-item ">
                    <div class="layui-row ">
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md5">
                                <label class="layui-form-label form-lable mst-lable">资产代码</label>
                                <div class="layui-input-inline input-inline">
                                    <select type="text" id="finprodId" name="finprodId" formatoption="true"
                                            class="layui-input form-input input-select" placeholder="请输入内容" data-th-parentids="${pageModel}"
                                            data-th-data-url="@{/valmodel/modstockdivitrateconfig/ModStockDivitrateConfig002/getAssetCodeListExceptExsits}"
                                            required="required" data-th-initValue="${entity?.finprodId}">
                                    </select>
                                </div>
                            </div>

                        </div>
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md5">
                                <label class="layui-form-label form-lable mst-lable">资产名称</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" readonly="readonly" id="finProdName" name="finProdName"
                                           class="layui-input form-input" data-th-value='${entity?.finProdName}'
                                           placeholder="请输入内容" required disabled>
                                </div>
                            </div>

                        </div>
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md5">
                                <label class="layui-form-label form-lable mst-lable" >预期股息增长率%</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="stockIntarte" name="stockIntarte" required="required"
                                           data-pattern="" data-fixtype="2" data-textrange="4" maxlength="30"
                                           class="layui-input form-input text-number"
                                           data-th-value="${entity?.stockIntarte}" placeholder="请输入内容"
                                           data-th-placeholder="#{SysCommon.placeholder}">
                                </div>
                            </div>

                        </div>
                    </div>
                </div>

            </form>
            <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="position: fixed;bottom: 30px;">
                <div class="text-center">
                    <a id="ModStockDivitrateConfig002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                       data-th-text="#{SysCommon.submit}">提交</a>
                    <a id="ModStockDivitrateConfig002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                       data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valmodel/modstockdivitrateconfig/ModStockDivitrateConfig002.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
