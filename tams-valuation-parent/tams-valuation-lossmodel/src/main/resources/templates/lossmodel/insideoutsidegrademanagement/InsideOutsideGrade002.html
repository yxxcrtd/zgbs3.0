<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>内外部评级映射管理</title>
    <style>
.adver-form {
	background: #fff;
}

.adver-fieldset {
	background-color: #eff3f7;
	border: 1px solid #ddd;
	margin-bottom: 20px;
}

.dataTable2 .layui-border-box, .dataTable3 .layui-border-box {
	height: 300px !important;
}

.dataTable3 .layui-table-box, .dataTable2 .layui-table-box {
	height: 290px !important;
}

.layui-table-box {
	overflow-y: auto;
	overflow-x: hidden;
}




</style>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
        <div class="pro-module-wrapper pro-module-base">
            <div class="marketInstitutions">
                <!-- 市场机构  -->
                <form id="marketForm" class="layui-form joyin-form-wrap adver-form">
                    <div class="layui-form-item" style="display: none">
                        <input id="operateType" name="operateType"
                               class="layui-input form-input" placeholder="操作类型" data-th-value="${entity?.operateType}">
                        <input id="pageModel" name="pageModel"
                               class="layui-input form-input" placeholder="pageModel" data-th-value="${pageModel}">
                        <input id="status" name="status"
                               class="layui-input form-input" placeholder="流程状态" data-th-value="${status}">
                        <input type="text" id="workflowId" name="workflowId"  placeholder="流程 Id"
                               class="layui-input form-input" data-th-value="${entity?.workflowId}" >
                    </div>

                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title"><span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                            <div class="layui-form-item" style="padding-bottom: 6px;">
                                <div class="layui-inline layui-col-md4"id="asset_type">
                                    <label class="layui-form-label form-lable">评级机构</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="gradeInst" name="gradeInst" searchable="false" type="text"
                                                data-th-data-result='${GRADE_PARTY}'
                                                data-th-initValue="${entity?.gradeInst}"
                                                class="layui-input form-input input-select" placeholder="请选择" required>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>

            <div class="marketInstitutions">
                <form class="layui-form joyin-form-wrap">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title"><span class="title-des">评级映射表</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                            <div class="pro-module-item">
                                <div class='table-wrap'>
                                    <div class="dataTable2" style="height:320px;">
                                        <table class="layui-table" id="dataTable" name="selectInsideOutsideDetail"></table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div class="layui-col-xs10 layui-col-md10 layui-col-sm10 layui-col-lg10" style="margin-left: 50px;margin-bottom:10px;margin-top:10px;">
        <div class="text-center">
            <a id="ValInsideOutsideGrade002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
               data-th-text="#{SysCommon.submit}">提交</a>
            <a id="ValInsideOutsideGrade002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
		var GRADE_PARTY = /*[[${GRADE_PARTY}]]*/;
		var MAIN_GRADE_RESULT = /*[[${MAIN_GRADE_RESULT}]]*/;
		var MODEL_STANDARD_GRADE_RESULT = /*[[${MODEL_STANDARD_GRADE_RESULT}]]*/;
		var detailList = /*[[${detailList}]]*/;
		var MAIN_GRADE_RESULT_TOTAL = /*[[${MAIN_GRADE_RESULT}]]*/;
	</script>
    <script data-th-src="@{/js/component/common/util.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/lossmodel/insideoutsidegrademanagement/InsideOutsideGrade002.js}" type="text/javascript"></script>
</div>
</body>
</html>
