<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="utf-8">
    <title>内外部评级映射管理查询</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area" export="false">
        <a id="ValInsideOutsideGrade001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
        <a id="ValInsideOutsideGrade001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}">删除</a>
        <a id="ValInsideOutsideGrade001_btn_export" class="layui-btn layui-btn-sm btn-export btn-default">导出</a>
        <!--<a id="ValCashFlowDiscount001_btn_reset" class="layui-btn layui-btn-sm btn-reset btn-default">重置</a>-->
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md3">
                    <label class="layui-form-label form-lable">评级机构</label>
                    <div class="layui-input-inline input-inline">
                        <select id="gradeInst" name="gradeInst" searchable="false" type="text"
                                data-th-data-result='${GRADE_PARTY}'
                                data-th-initValue="${entity?.gradeInst}"
                                class="layui-input form-input input-select" placeholder="请选择">
                        </select>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
		var GRADE_PARTY = /*[[${GRADE_PARTY}]]*/;
	</script>
    <script data-th-src="@{/js/component/common/util.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/lossmodel/insideoutsidegrademanagement/InsideOutsideGrade001.js}" type="text/javascript"></script>
</div>
</body>
</html>
