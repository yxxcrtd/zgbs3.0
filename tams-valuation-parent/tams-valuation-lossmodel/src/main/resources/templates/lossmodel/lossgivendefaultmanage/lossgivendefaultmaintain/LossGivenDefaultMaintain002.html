<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	xmlns:th="http://www.w3.org/1999/xhtml"
	layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
<title data-th-text="#{LossGivenDefaultMaintain002}">LGD违约损失率修改</title>
</head>
<body>
	<div layout:fragment="content">

		<form class="layui-form joyin-form-wrap pro-module-form"
			id="submitForm">
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4"  style="display:inline">
					<label class="layui-form-label form-lable">资产类别</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="assetType" name="assetType" disabled="true"
							class="layui-input form-input input-select" placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-value="${entity?.assetType}"
							data-th-data-result='${SEC_TYPE}'>
					</div>
				</div>
				<div id="assetDetailTypeDiv" style="display:inline">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">债券类型</label>
						<div class="layui-input-inline input-inline">
							<select id="assetDetailType" name="assetDetailType" searchable="false" type="text" disabled="true"
								data-th-data-result='${BOND_TYPE}'
								data-th-initValue="${entity?.assetDetailType}"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}" required>
							</select>
						</div>
					</div>
				</div>
				<div id="ckAssetDetailTypeDiv"  style="display:none;">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">存款类型</label>
						<div class="layui-input-inline input-inline">
							<select id="depositeType" name="depositeType" searchable="false" type="text" disabled="true"
									data-th-data-result='${DEPOSIT_TYPE}'
									data-th-initValue="${entity?.assetDetailType}"
									class="layui-input form-input input-select" placeholder="请输入内容"
									data-th-placeholder="#{SysCommon.placeholder}" required>
							</select>
						</div>
					</div>
				</div>
				<div id="isContainPledgeDiv"  style="display:inline">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">是否含有抵质押物</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="isContainPledge" name="isContainPledge" disabled="true"
								class="layui-input form-input input-select" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}"
								data-th-value="${entity?.isContainPledge}"
								data-th-data-result='${YES_OR_NO}'>
						</div>
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">LGD%</label>
					<div class="layui-input-inline input-inline">
							<input id="lgd" name="lgd" class="layui-input form-input text-number" 
                            allowClear="true" data-th-placeholder="#{SysCommon.placeholder}" data-textrange="2" maxlength="6"
                            data-th-value="${entity?.lgd}" required>
					</div>
				</div>
			</div>
			<div class="layui-col-md10" style="margin: 30px 0;">
				<div class="text-center">
					<!-- <a th:id="|${pageId}_btn_save|"
						class="layui-btn layui-btn-sm btn-save"
						data-th-text="#{SysCommon.save}">保存</a>  -->
						<a th:id="|${pageId}_btn_submit|"
						class="layui-btn layui-btn-sm btn-submit"
						data-th-text="#{SysCommon.submit}">提交</a>
						<a th:id="|${pageId}_btn_cancel|"
						class="layui-btn layui-btn-sm btn-cancel"
						data-th-text="#{SysCommon.cancel}">取消</a>
						
				</div>
			</div>

		</form>

	</div>
	<div layout:fragment="script">
		<script th:inline="javascript" type="text/javascript">

	</script>
		<script data-th-inline="javascript" type="text/javascript">
		var workflowId = /*[[${workflowId}]]*/;
		var productsDue = /*[[${productsDue}]]*/;
		var MODEL_MAIN_GRADE_TYPE = /*[[${MODEL_MAIN_GRADE_TYPE}]]*/'';
		var SEQNO = /*[[${SEQNO}]]*/;
	</script>
		<script data-th-src="@{/js/component/common/util.js}" type="text/javascript"></script>
		<script
			data-th-src="@{/js/lossmodel/lossgivendefaultmanage/lossgivendefaultmaintain/LossGivenDefaultMaintain002.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
