<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{LossGivenDefaultManage001}">LGD违约损失率管理</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="layui-tab" style="margin-bottom: 0px;">
		  <ul class="layui-tab-title">
		    <li  th:if="${isShowRemind}" class="layui-this">&nbsp;
			    <span data-th-text="LGD违约损失率维护">LGD违约损失率维护</span>
		    </li>
		    <li  th:if="${isShowMyHome}">&nbsp;
			    <span data-th-text="特殊资产LGD维护">特殊资产LGD维护</span>
		    </li>
		  </ul>
		  <div class="layui-tab-content">
		    <!-- 资产大类评级配置 -->
		    <div class="layui-tab-item layui-show">
            	<iframe th:src="@{/model/impairment/lossgivendefaultmanage/lossgivendefaultmaintain/LossGivenDefaultMaintain001/init}" width="100%" height="80%" frameborder="0" style="border:none;min-height:600px;" ></iframe>
            </div>
		    <!-- 特殊资产评级配置 -->
		    <div class="layui-tab-item" >
					<iframe th:src="@{/model/impairment/lgddefultmanager/lgdspecialconfig/LgdSpecialConfig001/init}" width="100%" height="100%" frameborder="0" style="border:none;min-height:600px;" ></iframe>
            </div>
		  </div>
		</div>
    </div>
    <div layout:fragment="script">
     
    </div>
</body>
</html>
