<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
    <title>评级PD维护信息</title>
    <style>
        .mst-lable{
            width: 20%;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div>
        <form class="layui-form joyin-form-wrap pro-module-form" style="padding: 10px 0;"id="submitForm">

            <div class="layui-form-item" style="display: none;">
                <input type="text" id="seqNo" name="seqNo" class="layui-input form-input"
                       data-th-value="${entity?.seqNo}">
                <input id="operateType" name="operateType" class="layui-input form-input" placeholder="操作类型"
                       data-th-value="${entity?.operateType}"/>
                <input type="text" id="workflowId" name="workflowId" placeholder="流程 Id"
                       class="layui-input form-input" data-th-value="${entity?.workflowId}"/>
            </div>
            <div class="layui-form-item">
                <div class="layui-row ">
                    <div class="layui-form-item">
                        <div >
                            <label class="layui-form-label form-lable ">年份</label>
                            <div class="layui-input-inline input-inline">
                                <!--<input id="vouchYear" name="vouchYear" class="layui-input form-input"
                                       allowClear="true" data-th-value="${entity?.vouchYear}"
                                       data-th-placeholder="#{SysCommon.placeholder}" required="required">-->
                                <input id="vouchYear" name="vouchYear" class="layui-input form-input" autocomplete="off"
                                       allowClear="true" data-th-value="${entity?.vouchYear}" required="required"
                                       data-th-placeholder="#{SysCommon.placeholder}">
                            </div>
                        </div>
                    </div>

                    <div class="layui-form-item">
                        <div >
                            <label class="layui-form-label form-lable " >评级结果</label>
                            <div class="layui-input-inline input-inline">
                                <select id="gradeResult" name="gradeResult"
                                        class="layui-input form-input input-select"
                                        data-th-data-result='${MODEL_STANDARD_GRADE_RESULT}'
                                        placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                        required="required"
                                        data-th-initvalue="${entity?.gradeResult}">
                                </select>

                            </div>

                        </div>
                    </div>

                    <div class="layui-form-item">
                        <div >
                            <label class="layui-form-label form-lable">前瞻前年度边际PD%</label>
                            <div class="layui-input-inline input-inline ">
                                <input id="forwardYearPd" name="forwardYearPd"
                                       class="layui-input form-input text-number"
                                       data-th-value="${entity?.forwardYearPd}" data-textrange="4"  maxLength="30" required="required"
                                       placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
        <div class="layui-col-md10" style="margin: 30px 0;">
            <div class="text-center">
                <!--<a id="ModGradePdConfig002_btn_save" class="layui-btn layui-btn-sm btn-save"
                   data-th-text="#{SysCommon.save}">保存</a>-->
                <a id="ModGradePdConfig002_btn_submit"
                   class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="ModGradePdConfig002_btn_cancel"
                   class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var MODEL_STANDARD_GRADE_RESULT = /*[[${MODEL_STANDARD_GRADE_RESULT}]]*/;
    </script>
    <script data-th-src="@{/js/lossmodel/common/util.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/lossmodel/pddefaultmanager/gradepdconfig/ModGradePdConfigInfo002.js}"
            type="text/javascript"></script>
</div>
</body>
</html>
