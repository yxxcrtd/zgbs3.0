<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{PdFactorKpmgConfig001}">前瞻因子维护</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area" filter='false'  export="true">
            <a id="PdFactorKpmgConfig001_btn_add" class="layui-btn layui-btn-sm btn-create"
               data-th-text="#{SysCommon.create}">新建</a>
            <a id="PdFactorKpmgConfig001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
               data-th-text="#{SysCommon.delete}" style="display: none">删除</a>
        </div>

        <div class='joyin-form-wrap condition-area'>
            <form class="layui-form " id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable" data-th-text="#{PdFactorKpmgConfig001.vouchYear}">年份</label>
                        <div class="layui-input-inline input-inline"><!-- input-dateSelect  -->
                            <input type="text" id="vouchYear"  name="vouchYear" class="layui-input form-input"  autocomplete="off" placeholder="请选择年份" />
                        </div>
                    </div>

                </div>
            </form>
        </div>

        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>

    <div layout:fragment="script">
    	<script data-th-inline="javascript" type="text/javascript">
        	var searchDataEnd=/*[[${searchDataEnd}]]*/'';
        </script>
        <script data-th-src="@{/js/lossmodel/pddefaultmanager/pdfactorkpmgconfig/PdFactorKpmgConfig001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
