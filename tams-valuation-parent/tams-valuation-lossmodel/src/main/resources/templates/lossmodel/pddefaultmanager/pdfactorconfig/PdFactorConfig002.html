<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>前瞻因子维护</title>
    <style>
        .mst-lable{
            width: 20%;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form"style="padding: 10px 0;" id="submitForm">
        <div class="layui-form-item" style="display: none;">
        	<input type="text" id="seqno" name="seqno" class="layui-input form-input"
                           data-th-value="${entity?.seqno}">
            <input id="operateType" name="operateType" class="layui-input form-input" placeholder="操作类型"
                   data-th-value="${entity?.operateType}"/>
            <input type="text" id="workflowId" name="workflowId" placeholder="流程 Id"
                   class="layui-input form-input" data-th-value="${entity?.workflowId}"/>
        </div>
        <div class="layui-form-item ">
            <div class="layui-row ">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">年份</label>
                        <div class="layui-input-inline input-inline">
                            <input id="vouchYear" name="vouchYear" class="layui-input form-input" autocomplete="off" REQUIRED="required"
                                   allowClear="true" data-th-value="${entity?.vouchYear}"
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">季度</label>
                        <div class="layui-input-inline input-inline">
                            <select id="vouchQuarter" name="vouchQuarter" class="layui-input form-input input-select"
                                    allowClear="true" data-th-data-result="${QUARTER}"  REQUIRED="required"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    data-th-initvalue="${entity?.vouchQuarter}">
                            </select>
                        </div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">乐观因子</label>
                        <div class="layui-input-inline input-inline">
                            <input id="optimisticFactor" name="optimisticFactor" class="layui-input form-input text-number"  REQUIRED="required"
                                    allowClear="true" data-th-placeholder="#{SysCommon.placeholder}" data-fixtype="2" data-textrange="4" maxlength="10"
                                    data-th-value="${entity?.optimisticFactor}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">基础因子</label>
                    <div class="layui-input-inline input-inline">
                        <input id="basicFactor" name="basicFactor" class="layui-input form-input text-number"  REQUIRED="required"
                               allowClear="true" data-th-placeholder="#{SysCommon.placeholder}" data-fixtype="2" data-textrange="4" maxlength="10"
                               data-th-value="${entity?.basicFactor}">
                    </div>
                </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">悲观因子</label>
                        <div class="layui-input-inline input-inline">
                            <input id="pessimismFactor" name="pessimismFactor" class="layui-input form-input text-number"  REQUIRED="required"
                                    allowClear="true" data-th-placeholder="#{SysCommon.placeholder}" data-fixtype="2" data-textrange="4" maxlength="10"
                                    data-th-value="${entity?.pessimismFactor}">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
    <div class="layui-col-md10" style="margin: 30px 0;">
        <div class="text-center">
            <a id="PdFactorConfig002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
               data-th-text="#{SysCommon.submit}">提交</a>
            <a id="PdFactorConfig002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>

</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/lossmodel/pddefaultmanager/pdfactorconfig/PdFactorConfig002.js}"
            type="text/javascript"></script>
</div>
</body>
</html>
