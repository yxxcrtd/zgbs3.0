<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title >评级PD维护表查询</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a id="ModGradePdConfig001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
        <a id="ModGradePdConfig001_btn_import" class="layui-btn layui-btn-sm btn-import ">导入</a>
        <a id="ModGradePdConfig001_btn_del" class="layui-btn layui-btn-sm btn-delete">删除</a>
    </div>
    <div class="joyin-form-wrap  condition-area">
        <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs4 layui-col-md4  layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"  >年份</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="vouchYear"  name="vouchYear" class="layui-input form-input"  autocomplete="off" placeholder="请选择年份" />
                        </div>
                    </div>
                </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var MODEL_STANDARD_GRADE_RESULT = /*[[${MODEL_STANDARD_GRADE_RESULT}]]*/;
    </script>
    <script data-th-src="@{/js/lossmodel/common/util.js}" type="text/javascript"></script>
    <script
            data-th-src="@{/js/lossmodel/pddefaultmanager/gradepdconfig/ModGradePdConfigQuery001.js}"  type="text/javascript">
    </script>
</div>
</body>
</html>
