<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{PdDefaultManager001}">PD违约概率管理</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="layui-tab" style="margin-bottom: 0px;">
		  <ul class="layui-tab-title">
		    <!--<li  th:if="${isShowMyHome} and  ${lossType} eq '02'" class="layui-this">&nbsp;
			    <span data-th-text="前瞻因子维护">前瞻因子维护</span>
		    </li>-->
		  <li  th:if="${lossType} eq '01'" class="layui-this">&nbsp;
			  <span data-th-text="综合因子维护">综合因子维护</span>
		  </li>
		  <li  th:if="${lossType} eq '02'" class="layui-this">&nbsp;
			  <span data-th-text="前瞻因子维护">前瞻因子维护</span>
		  </li>

		    <li>&nbsp;
			    <span data-th-text="债券、其他债权评级PD维护">债券、其他债权评级PD维护</span>
		    </li>
		    <li  th:if="${lossType} eq '01'">&nbsp;
			    <span data-th-text="回购评级PD维护">回购评级PD维护</span>
		    </li>
			<li  th:if="${lossType} eq '01'">&nbsp;
				  <span data-th-text="存款评级PD维护">存款评级PD维护</span>
			</li>
		  </ul>
		  <div class="layui-tab-content">
		    <!--  前瞻因子维护 -->
		    <div th:if="${lossType} eq '02'" class="layui-tab-item  layui-show">
                <iframe th:src="@{/model/impairment/pddefaultmanager/pdfactorconfig/PdFactorConfig001/init}" width="100%"
                        height="100%" frameborder="0" style="border:none;min-height:600px;"></iframe>
            </div>
		    <!--  前瞻因子维护 （毕马威）-->
		    <div th:if="${lossType} eq '01'" class="layui-tab-item  layui-show">
			  <iframe th:src="@{/model/impairment/pddefaultmanager/pdfactorkpmgconfig/PdFactorKpmgConfig001/init}" width="100%"
					  height="100%" frameborder="0" style="border:none;min-height:600px;"></iframe>
		    </div>
             <!-- 债券、其他债权评级PD维护    -->
		    <div class="layui-tab-item " >
            	<iframe th:src="@{/model/impairment/pddefaultmanager/gradepdconfig/ModGradePdConfig001/init}" width="100%"
                        height="100%" frameborder="0" style="border:none;min-height:600px;"></iframe>
            </div>
		    <!-- 回购评级PD维护    -->
		    <div th:if="${lossType} eq '01'"  class="layui-tab-item " >
				<iframe th:src="@{/model/impairment/pddefaultmanager/hggradepdconfig/ModHgGradePdConfig001/init}" width="100%"
					  height="100%" frameborder="0" style="border:none;min-height:600px;"></iframe>
			</div>
		    <!-- 存款评级PD维护    -->
		    <div th:if="${lossType} eq '01'"  class="layui-tab-item " >
			    <iframe th:src="@{/model/impairment/pddefaultmanager/ckgradepdconfig/ModCkGradePdConfig001/init}" width="100%"
					  height="100%" frameborder="0" style="border:none;min-height:600px;"></iframe>
		    </div>
		  </div>
		</div>
    </div>
    <div layout:fragment="script">
     
    </div>
</body>
</html>
