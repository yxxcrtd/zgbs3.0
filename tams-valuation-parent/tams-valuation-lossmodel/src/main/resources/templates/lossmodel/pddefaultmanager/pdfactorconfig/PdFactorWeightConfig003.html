<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
<title>前瞻因子权重配置</title>
    <style>
        .mst-lable{
            width: 20%;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
                <div class="layui-form-item" style="display:none;">
                    <input type="text" id="seqno" name="seqno" class="layui-input form-input"
                           data-th-value="${entity?.seqno}">
		            <input id="operateType" name="operateType" class="layui-input form-input" placeholder="操作类型"
		                   data-th-value="${entity?.operateType}"/>
		            <input type="text" id="workflowId" name="workflowId" placeholder="流程 Id"
                   			class="layui-input form-input" data-th-value="${entity?.workflowId}"/>
                </div>
                <div class="layui-form-item">
                	<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
		                <label class="layui-form-label form-lable">乐观权重</label>
		                <div class="layui-input-inline input-inline">
	                        <input type="text" id="optimisticWeight" name="optimisticWeight" required="required"
	                               data-textrange="2" maxlength="10" class="layui-input form-input text-number"
	                               data-th-value="${entity?.optimisticWeight}" placeholder="请输入内容"
	                               data-th-placeholder="#{SysCommon.placeholder}">
	                    </div>
		            </div>
		            <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
		                <label class="layui-form-label form-lable">基础权重</label>
		                <div class="layui-input-inline input-inline">
	                        <input type="text" id="basicWeight" name="basicWeight" required="required"
	                               data-textrange="2" maxlength="10" class="layui-input form-input text-number"
	                               data-th-value="${entity?.basicWeight}" placeholder="请输入内容"
	                               data-th-placeholder="#{SysCommon.placeholder}">
	                    </div>
		            </div>
		            <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
		                <label class="layui-form-label form-lable">悲观权重</label>
		                <div class="layui-input-inline input-inline">
	                        <input type="text" id="pessimismWeight" name="pessimismWeight" required="required"
	                               data-textrange="2" maxlength="10" class="layui-input form-input text-number"
	                               data-th-value="${entity?.pessimismWeight}" placeholder="请输入内容"
	                               data-th-placeholder="#{SysCommon.placeholder}" disabled>
	                    </div>
		            </div>
                    
                </div>
            </form>
            <div  class="layui-row" style="margin: 50px;">
                <div class="text-center">
                    <a id="PdFactorWeightConfig003_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                       data-th-text="#{SysCommon.submit}">提交</a>
                    <a id="PdFactorWeightConfig003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                       data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/lossmodel/pddefaultmanager/pdfactorconfig/PdFactorWeightConfig003.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
