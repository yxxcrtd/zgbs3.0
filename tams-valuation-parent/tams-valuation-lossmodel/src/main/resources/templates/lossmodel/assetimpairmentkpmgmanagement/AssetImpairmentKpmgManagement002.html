<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>资产减值新建</title>
</head>
<body>
</body>
<div layout:fragment="content">
        <form class="layui-form joyin-form-wrap pro-module-form" id="searchForm">
            <h3 class="pro-module-title">
                <span class="title-des">资产减值信息</span>
            </h3>
            <div class="layui-form-item" style="display: none;">
                <input id="seqNo" name="seqNo" class="layui-input form-input" placeholder="序列号"
                       data-th-value="${entity?.seqNo}"/>
                <input id="prodName" name="prodName" class="layui-input form-input" placeholder="产品名称"
                       data-th-value="${entity?.prodName}"/>
                <input id="assetName" name="assetName" class="layui-input form-input" placeholder="资产名称"
                       data-th-value="${entity?.assetName}"/>
                <input id="portfolioId" name="portfolioId" class="layui-input form-input" placeholder="组合代码"
                       data-th-value="${entity?.portfolioId}"/>
                <input id="actionStatus" name="actionStatus" class="layui-input form-input" placeholder="初始操作类型"
                       data-th-value="${actionStatus}"/>
                <input id="sysDate" name="sysDate" class="layui-input form-input" placeholder="系统时间"
                       data-th-value="${sysDate}"/>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable">产品名称</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="prodName1" name="prodName1"
                                class="layui-input form-input input-select"
                                data-th-data-url="@{/model/impairment/assetimpairmentkpmgmanagement/AssetImpairmentKpmgManagement001/getProdIdByLossResult}"
                                data-th-placeholder="#{SysCommon.placeholder}" required="required"
                                data-th-initvalue="${entity?.prodId}">
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable">产品代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="prodId" name="prodId" disabled="disabled"
                               class="layui-input form-input" placeholder="请输入内容"
                               childrenIds="bussNo"
                               data-th-placeholder="#{SysCommon.placeholder}" required="required"
                               data-th-value="${entity?.prodId}">
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable">资产名称</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="assetName1" name="assetName1"
                                class="layui-input form-input input-select"
                                data-th-data-url="@{/model/impairment/assetimpairmentkpmgmanagement/AssetImpairmentKpmgManagement001/getFinprodIdByLossResult}"
                                data-th-placeholder="#{SysCommon.placeholder}" required="required"
                                data-th-initvalue="${entity?.assetId}">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable">资产代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="assetId" name="assetId" disabled="disabled"
                               class="layui-input form-input" placeholder="请输入内容"
                               childrenIds="bussNo"
                               data-th-placeholder="#{SysCommon.placeholder}" required="required"
                               data-th-value="${entity?.assetId}">
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable">资产类型</label>
                    <div class="layui-input-inline input-inline">
                        <select id="assetType" name="assetType" disabled="disabled"
                                class="layui-input form-input input-select"
                                data-th-data-result='${SEC_TYPE}' allowClear="true"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                formatoption="true" required="required"
                                data-th-initvalue="${entity?.assetType}">
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable">减值日</label>
                    <div class="layui-input-inline input-inline">
                        <input class="layui-input form-input input-dateSelect" id="decDate"
                               name="decDate" placeholder="请选择时间"
                               data-th-value='${#dates.format(entity?.decDate,"yyyy-MM-dd")}'
                               required="required">
                    </div>
                </div>
            </div>
                <!--<div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-lable">业务编号</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="bussNo" name="bussNo"
                                    class="layui-input form-input input-select"
                                    parentIds="prodId,assetId"
                                    data-th-data-url="@{/model/impairment/assetimpairmentmanagement/AssetImpairmentManagement001/getBusiNumByLossResult}"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    formatoption="false" required="required"
                                    data-th-initvalue="${entity?.bussNo}">
                            </select>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-lable">交易方向</label>
                        <div class="layui-input-inline input-inline">
                            <select id="ps" name="ps"
                                    class="layui-input form-input input-select" disabled="disabled"
                                    data-th-data-result='${PS}' allowClear="true"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    formatoption="true" required="required"
                                    data-th-initvalue="${entity?.ps}">
                            </select>
                        </div>
                    </div>
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-lable">交易日期</label>
                        <div class="layui-input-inline input-inline">
                            <input class="layui-input form-input input-dateSelect" id="tradeDate"
                                   name="tradeDate" placeholder="请选择时间" disabled
                                   data-th-value='${#dates.format(entity?.tradeDate,"yyyy-MM-dd")}'
                                   required="required">
                        </div>
                    </div>
                </div>-->
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap">减值阶段</label>
                    <div class="layui-input-inline input-inline">
                        <select id="stage" name="stage"
                                class="layui-input form-input input-select"
                                data-th-data-result='${FIN_STAGE}' allowClear="true"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                formatoption="true" required="required"
                                data-th-initvalue="${entity?.stage}">
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable">前瞻前PD违约概率</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="preProspectivePd" name="preProspectivePd" placeholder="请输入内容"
                               data-pattern="" data-fixtype="2" data-textrange="4"
                               class="layui-input form-input text-number" required="required"
                               data-th-value="${entity?.preProspectivePd}">
                        <span class="input-right-show">%</span>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable">前瞻后PD违约概率</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="prospectivePd" name="prospectivePd" placeholder="请输入内容"
                               data-pattern="" data-fixtype="2" data-textrange="4"
                               class="layui-input form-input text-number" required="required"
                               data-th-value="${entity?.prospectivePd}">
                        <span class="input-right-show">%</span>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable">LGD违约损失率</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="lgd" name="lgd" placeholder="请输入内容"
                               data-pattern="" data-fixtype="2" data-textrange="4"
                               class="layui-input form-input text-number" required="required"
                               data-th-value="${entity?.lgd}">
                        <span class="input-right-show">%</span>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable">EAD违约风险暴露</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="ead" name="ead" placeholder="请输入内容"
                               data-pattern="" data-fixtype="2" data-textrange="2"
                               class="layui-input form-input text-number" required="required"
                               data-th-value="${entity?.ead}">
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-label-wrap">是否允许模型覆盖</label>
                    <div class="layui-input-inline input-inline">
                        <select id="allowModelCover" name="allowModelCover"
                                class="layui-input form-input input-select"
                                data-th-data-result='${YES_OR_NO}' allowClear="true"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                formatoption="true" required="required"
                                data-th-initvalue="${entity?.allowModelCover}">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">前瞻前ECL预期信用损失</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="preProspectiveEcl" name="preProspectiveEcl" placeholder="请输入内容"
                               data-pattern="" data-fixtype="2" data-textrange="2" disabled="disabled"
                               class="layui-input form-input text-number" required="required"
                               data-th-value="${entity?.preProspectiveEcl}">
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">前瞻后ECL预期信用损失</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="prospectiveEcl" name="prospectiveEcl" placeholder="请输入内容"
                               data-pattern="" data-fixtype="2" data-textrange="2" disabled="disabled"
                               class="layui-input form-input text-number" required="required"
                               data-th-value="${entity?.prospectiveEcl}">
                    </div>
                </div>
            </div>
            <div class="layui-row" style="margin: 50px;">
                <div class="text-center">
                    <button type="button" class="layui-btn btn-save" id="AssetImpairmentKpmgManagement002_btn_save">保存</button>
                    <button type="button" class="layui-btn btn-submit" id="AssetImpairmentKpmgManagement002_btn_submit">提交</button>
                    <a type="button" class="layui-btn btn-cancel" id="AssetImpairmentKpmgManagement002_btn_cancel">取消</a>
                </div>
            </div>
        </form>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/lossmodel/assetimpairmentkpmgmanagement/AssetImpairmentKpmgManagement002.js}" type="text/javascript"></script>
</div>

</html>
