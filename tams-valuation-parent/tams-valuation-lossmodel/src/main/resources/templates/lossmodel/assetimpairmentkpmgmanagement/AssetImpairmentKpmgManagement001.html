<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>资产减值管理</title>
</head>
<body>
</body>
<div layout:fragment="content">
    <div class="form-button-area">
<!--        <a id="AssetImpairmentKpmgManagement001_btn_add" class="layui-btn layui-btn-sm btn-create"-->
<!--            data-th-text="#{SysCommon.create}">新建</a>-->
        <a id="AssetImpairmentKpmgManagement001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
           data-th-text="#{SysCommon.delete}">删除</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">产品代码</label>
                    <div class="layui-input-inline input-inline">
                        <select id="finprodId" name="finprodId"
                                class="layui-input form-input input-select"
                                data-th-data-url="@{/model/impairment/assetimpairmentkpmgmanagement/AssetImpairmentKpmgManagement001/getProdIdByLossResult}"
                                multiple="multiple" allowClear="true" data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">资产代码</label>
                    <div class="layui-input-inline input-inline">
                        <select id="assetId" name="assetId"
                                class="layui-input form-input input-select"
                                data-th-data-url="@{/model/impairment/assetimpairmentkpmgmanagement/AssetImpairmentKpmgManagement001/getFinprodIdByLossResult}"
                                multiple="multiple" allowClear="true" data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">数据来源</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="dataSource" name="dataSource" class="layui-input form-input input-select" placeholder="请选择"
                               data-th-data-result="${LOSS_INPUT_TYPE}" allowClear="true" multiple="multiple" >
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">减值日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="impairDate" name="impairDate" placeholder="请选择、支持区间" class="layui-input form-input input-dateRangeSelect" allowClear="true">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">减值阶段</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="impairStage" name="impairStage" class="layui-input form-input input-select" placeholder="请选择"
                               data-th-data-result="${FIN_STAGE}" allowClear="true" multiple="multiple" >
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div id="dataTable"></div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/lossmodel/assetimpairmentkpmgmanagement/AssetImpairmentKpmgManagement001.js}" type="text/javascript"></script>
</div>
</html>
