<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>减值情况计提表</title>
</head>
<body>
</body>
<div layout:fragment="content">
    <div class="form-button-area">
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">产品名称</label>
                    <div class="layui-input-inline input-inline">
                        <select id="prodId" name="prodId"
                                class="layui-input form-input input-select"
                                data-th-data-url="@{/model/impairment/impairmentprovision/ImpairmentProvision001/getProdId}"
                                multiple="multiple" allowClear="true" data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">资产二级分类</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="type9" name="type9" class="layui-input form-input input-select" placeholder="请选择"
                               data-th-data-result="${busiType}" allowClear="true" multiple="multiple" >
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">查询日期</label>
                    <div class="layui-input-inline input-inline">
                        <input required type="text" id="decDate" name="decDate"
                               class="layui-input form-input input-dateSelect" th:value="${sysDate}">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div id="dataTable"></div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/lossmodel/impairmentprovision/ImpairmentProvision001.js}" type="text/javascript"></script>
</div>
</html>
