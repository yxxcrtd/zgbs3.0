<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}" style="overflow: hidden">
<head>
    <style>
    .upload .layui-table th{
        padding: 6px 15px;
    }
    .upload .layui-table td{
        padding: 2px 15px;
    }
    /*.upload{
        height: 200px;
        overflow: auto;
        }*/
    </style>
</head>
<body>
	<div id="insertTable">
		<div layout:fragment="content">
			<div class="form-button-area" export="false">
					<a id="Specialassets_btn_add"
					class="layui-btn layui-btn-sm btn-create">新建</a>
					 
					<a id="Specialassets_btn_del"
					class="layui-btn layui-btn-sm btn-delete">删除</a> 
					<a id="Specialassets_btn_chbexport"
					class="layui-btn layui-btn-sm btn-export btn-default">导出</a>
					<!-- <a id="Specialassets_btn_search"
					class="layui-btn layui-btn-sm btn-default">查询</a> -->
					
			</div>
			<div class="joyin-form-wrap joyin-filter-form condition-area">
				<form class="layui-form" id="searchForm">
					<div class="layui-form-item">
	                    <div class="layui-inline layui-col-md4">
	                        <label class="layui-form-label form-lable">资产代码</label>
	                        <div class="layui-input-inline input-inline">
	                           <select id="assetcode" name="assetcode" data-th-data-url="@{/model/impairment/assetratingallocation/specialassets/Specialassets001/getAssetInfoSelectOption}"
		                           data-th-data-formatoption=true class="layui-input form-input input-select" placeholder="请选择"
		                           data-th-placeholder="#{SysCommon.selectplaceholder}"
		                           allowClear="true" multiple="multiple">
	                            </select>

								<!--<select id="assetcode" name="assetcode"
										class="layui-input form-input input-select"
										data-th-data-url="@{/model/impairment/lgddefultmanager/lgdspecialconfig/LgdSpecialConfig002/getFinprodIdByLossType?lossType=01}"
										allowClear="true"  placeholder="请输入内容"  multiple="multiple">
								</select>-->

							</div>
	                    </div>
					</div>
				</form>
			</div>
	
			<div>
				<table class="layui-table" id="dataTable">
				</table>
			</div>
		</div>
		<div layout:fragment="script">
			<script data-th-inline="javascript" type="text/javascript">
				var isMain = /*[[${isMain}]]*/'';
				var searchDataStart = /*[[${searchDataStart}]]*/'';
				var searchDataEnd = /*[[${searchDataEnd}]]*/'';
				var submitStatus = /*[[${submitStatus}]]*/'';
				var indentifyMark = /*[[${indentifyMark}]]*/'';
				var submitFeedbackStatus = /*[[${submitFeedbackStatus}]]*/'';
			</script>
			<script data-th-src="@{/js/lossmodel/common/report-common.js}"
				type="text/javascript"></script>
			<script data-th-src="@{/js/lossmodel/common/jquery.validate.js}"
				type="text/javascript"></script>
			<script data-th-src="@{/js/lossmodel/common/joyinvalid.js}"
				type="text/javascript"></script>
			<script
				data-th-src="@{/js/lossmodel/assetratingallocation/specialassets/Specialassets001.js}"
				type="text/javascript"></script>
		</div>
	</div>
</body>
</html>
