<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="utf-8">
    <title>资产大类评级配置</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area" export="false">
        <a id="ValAssetCategories001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
        <a id="ValAssetCategories001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}">删除</a>
        <a id="ValAssetCategories001_btn_export" class="layui-btn layui-btn-sm btn-export btn-default">导出</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">资产类别</label>
                    <div class="layui-input-inline input-inline" style="display: block;">
                        <select id="assetType" name="assetType" class="layui-input form-input input-select" placeholder="请选择" data-th-data-result="${SEC_TYPE}" allowClear="true">
                        </select>
                    </div>
                </div>

                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">资产分类</label>
                    <div class="layui-input-inline input-inline" style="display: block;">
                        <!--<select id="assetDetailType" name="assetDetailType" class="layui-input form-input input-select" placeholder="请选择" data-th-data-result="${BOND_TYPE}" allowClear="true">
                        </select>-->
                        <select id="assetDetailType" name="assetDetailType" class="layui-input form-input input-select"
                                allowClear="true" placeholder="请选择"
                                data-th-initvalue="${entity?.assetDetailType}" parentIds="assetType" formatoption = "true"
                                data-th-data-url="@{/model/impairment/assetratingallocation/assetcategories/AssetCategories001/getAssetDetailType}">
                            <option></option>
                        </select>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
		var MODEL_MAIN_GRADE_TYPE = /*[[${MODEL_MAIN_GRADE_TYPE}]]*/;
		var MODEL_SEC_DETAIL_TYPE = /*[[${MODEL_SEC_DETAIL_TYPE}]]*/;
	</script>
    <script data-th-src="@{/js/lossmodel/assetratingallocation/assetcategories/AssetCategories001.js}" type="text/javascript"></script>
</div>
</body>
</html>
