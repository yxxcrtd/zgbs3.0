<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	xmlns:th="http://www.w3.org/1999/xhtml"
	layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
<title data-th-text="#{Specialassets002}">产品规划信息维护新建</title>
</head>
<body>
	<div layout:fragment="content">

		<form class="layui-form joyin-form-wrap pro-module-form"
			id="submitForm">
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-lable">资产名称</label>
					<div class="layui-input-inline input-inline">
						<select id="finprodName" name="finprodName" type="text"
								data-th-data-url='@{/model/impairment/assetratingallocation/specialassets/Specialassets002/getAssetInfoSelectOption}'
								data-th-initvalue="${entity?.finprodId}"
								class="layui-input form-input input-select" placeholder="请选择" required>
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-lable">资产代码</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="finprodId" name="finprodId" disabled="true"
							class="layui-input form-input" placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-value="${entity?.finprodId}" required>
					</div>
				</div>
			</div>

			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6" id="grade_party_type">
					<label class="layui-form-label form-lable">评级机构</label>
					<div class="layui-input-inline input-inline">
						<select id="gradeOrgType" name="gradeOrgType" searchable="false" type="text"
								data-th-data-result='${GRADE_PARTY_TYPE}'
								data-th-initValue="${entity?.gradeOrgType}"
								class="layui-input form-input input-select" placeholder="请选择" required>
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md6" id="grade_org_id">
					<label class="layui-form-label form-lable">指定评级机构</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="gradeOrgId" name="gradeOrgId"
							   class="layui-input form-input input-select" placeholder="请输入内容"
							   data-th-placeholder="#{SysCommon.placeholder}"
							   data-th-value="${entity?.gradeOrgId}"
							   data-th-data-result='${GRADE_PARTY}' required>
					</div>
				</div>
			</div>


			<div class="layui-form-item">

				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-lable">评级类型</label>
					<div class="layui-input-inline input-inline">
						<select id="oType" name="oType" class="layui-input form-input input-select" placeholder="请选择"
								allowClear="true" data-th-data-result="${MODEL_MAIN_GRADE_TYPE}" data-th-initvalue="${entity?.oType}"
								data-th-required="true" parentIds="finprodId" formatoption = "true"
								data-th-data-url="@{/model/impairment/assetratingallocation/specialassets/Specialassets002/getGradeType}">
							<option></option>
						</select>
					</div>
				</div>
			</div>
			<div class="layui-col-md10" style="margin: 30px 0;">
				<div class="text-center">
					<!-- <a th:id="|${pageId}_btn_save|"
						class="layui-btn layui-btn-sm btn-save"
						data-th-text="#{SysCommon.save}" style="display: none;">保存</a>  -->
						<a th:id="|${pageId}_btn_submit|"
						class="layui-btn layui-btn-sm btn-submit"
						data-th-text="#{SysCommon.submit}">提交</a> 
						
						<a th:id="|${pageId}_btn_cancel|"
						class="layui-btn layui-btn-sm btn-cancel"
						data-th-text="#{SysCommon.cancel}">取消</a>
						
				</div>
			</div>
<!--			<div style="display: none;">
				<div class="page-component" th:data-path="@{/component/core/FileCommon/init}"
                th:data-params="|{entityName: 'uploadFileList', businessId: '${tradeId ?: ''}'}|"></div>
			</div>-->
            
		</form>

	</div>
	<div layout:fragment="script">
		<script th:inline="javascript" type="text/javascript">

	</script>
		<script data-th-inline="javascript" type="text/javascript">
		var workflowId = /*[[${workflowId}]]*/;
		var pageModel = /*[[${pageModel}]]*/;
		var productsDue = /*[[${productsDue}]]*/;
		var MODEL_MAIN_GRADE_TYPE = /*[[${MODEL_MAIN_GRADE_TYPE}]]*/'';
		var SEQNO = /*[[${SEQNO}]]*/;
	</script>
		<script data-th-src="@{/js/lossmodel/common/util.js}" type="text/javascript"></script>
		<script data-th-src="@{/js/lossmodel/common/termTypeUtil.js}" type="text/javascript"></script>
		<script
			data-th-src="@{/js/lossmodel/assetratingallocation/specialassets/Specialassets002.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
