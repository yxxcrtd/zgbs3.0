<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{AssetRatingAllocation001}">资产评级配置</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="layui-tab" style="margin-bottom: 0px;">
		  <ul class="layui-tab-title">
		    <li  th:if="${isShowRemind}" class="layui-this">&nbsp;
			    <span data-th-text="资产大类评级配置">资产大类评级配置</span>
		    </li>
		    <li  th:if="${isShowMyHome}">&nbsp;
			    <span data-th-text="特殊资产评级配置">特殊资产评级配置</span>
		    </li>
		  </ul>
		  <div class="layui-tab-content">
		    <!-- 资产大类评级配置 -->
		    <div class="layui-tab-item layui-show">
                <iframe th:src="@{/model/impairment/assetratingallocation/assetcategories/AssetCategories001/init}" width="100%" height="100%" frameborder="0" style="border:none;min-height:600px;" ></iframe>
            </div>
		    <!-- 特殊资产评级配置 -->
		    <div class="layui-tab-item" >
              <iframe th:src="@{/model/impairment/assetratingallocation/specialassets/Specialassets001/init}" width="100%" height="100%" frameborder="0" style="border:none;min-height:600px;" ></iframe>
            </div>
		  </div>
		</div>
    </div>
    <div layout:fragment="script">
     
    </div>
</body>
</html>
