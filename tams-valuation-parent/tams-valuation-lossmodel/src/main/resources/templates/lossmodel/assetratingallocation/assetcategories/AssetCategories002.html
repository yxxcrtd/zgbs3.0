<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="utf-8">
    <title data-th-text="#{AssetCategories002}">资产大类评级配置管理</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" style="padding: 10px 0;" id="submitForm">

        <div class="layui-form-item" style="display: none">
            <input id="operateType" name="operateType"
                   class="layui-input form-input" placeholder="操作类型" data-th-value="${entity?.operateType}">
            <input id="pageModel" name="pageModel"
                   class="layui-input form-input" placeholder="pageModel" data-th-value="${pageModel}">
            <input id="seqNo" name="seqNo"
                   class="layui-input form-input" placeholder="流水号" data-th-value="${entity?.seqNo}">
            <input id="status" name="status"
                   class="layui-input form-input" placeholder="流程状态" data-th-value="${status}">
            <input type="text" id="workflowId" name="workflowId"  placeholder="流程 Id"
                   class="layui-input form-input" data-th-value="${entity?.workflowId}" >
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6"id="asset_type">
            <label class="layui-form-label form-lable">资产类别</label>
            <div class="layui-input-inline input-inline">
                <select id="assetType" name="assetType" searchable="false" type="text"
                        data-th-data-result='${SEC_TYPE}'
                        data-th-initValue="${entity?.assetType}"
                        class="layui-input form-input input-select" placeholder="请选择" required>
                </select>
            </div>
            </div>

            <div class="layui-inline layui-col-md6"id="asset_detail_type">
                <label class="layui-form-label form-lable">资产分类</label>
                <div class="layui-input-inline input-inline">
                    <select id="assetDetailType" name="assetDetailType" class="layui-input form-input input-select"
                            allowClear="true" placeholder="请选择"
                            data-th-initvalue="${entity?.assetDetailType}" parentIds="assetType" formatoption = "true"
                            data-th-data-url="@{/model/impairment/assetratingallocation/assetcategories/AssetCategories001/getAssetDetailType}">
                        <option></option>
                    </select>
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6" id="grade_party_type">
                <label class="layui-form-label form-lable">评级机构</label>
                <div class="layui-input-inline input-inline">
                    <select id="gradeOrgType" name="gradeOrgType" searchable="false" type="text"
                            data-th-data-result='${GRADE_PARTY_TYPE}'
                            data-th-initValue="${entity?.gradeOrgType}"
                            class="layui-input form-input input-select" placeholder="请选择" required>
                    </select>
                </div>
            </div>
            <div class="layui-inline layui-col-md6"id="grade_org_id"  >
                <label class="layui-form-label form-lable">指定评级机构</label>
                <div class="layui-input-inline input-inline">
                    <select id="gradeOrgId" name="gradeOrgId"  searchable="false" type="text"
                            data-th-data-result='${GRADE_PARTY}' data-th-required="true"
                            data-th-initValue="${entity?.gradeOrgId}"
                            class="layui-input form-input input-select" placeholder="请选择" >
                    </select>
                </div>
            </div>
        </div>

        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6"id="o_Type">
                <label class="layui-form-label form-lable">评级类型</label>
                <div class="layui-input-inline input-inline">
                    <!--<select id="oType" name="oType" searchable="false" type="text"
                            data-th-data-result='${MODEL_MAIN_GRADE_TYPE}'
                            data-th-initValue="${entity?.oType}"
                            class="layui-input form-input input-select" placeholder="请选择" required>
                    </select>-->
                    <select id="oType" name="oType" class="layui-input form-input input-select" placeholder="请选择"
                            allowClear="true" data-th-data-result="${MODEL_MAIN_GRADE_TYPE}" data-th-initvalue="${entity?.oType}"
                            data-th-required="true" parentIds="assetType" formatoption = "true"
                            data-th-data-url="@{/model/impairment/assetratingallocation/assetcategories/AssetCategories002/getGradeType}">
                        <option></option>
                    </select>

                </div>
            </div>
        </div>
    </form>
    <div class="layui-col-md11" style="margin: 10px 0 10px 0;">
        <div class="text-center">
            <!--<a id="ValAssetCategories002_btn_save" class="layui-btn layui-btn-sm btn-save">保存</a>-->
            <a id="ValAssetCategories002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
            <a id="ValAssetCategories002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
		var MODEL_MAIN_GRADE_TYPE = /*[[${MODEL_MAIN_GRADE_TYPE}]]*/;
		var MODEL_SEC_DETAIL_TYPE = /*[[${MODEL_SEC_DETAIL_TYPE}]]*/;
	</script>
    <script data-th-src="@{/js/lossmodel/common/util.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/lossmodel/common/common.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/lossmodel/assetratingallocation/assetcategories/AssetCategories002.js}" type="text/javascript"></script>
</div>
</body>
</html>
