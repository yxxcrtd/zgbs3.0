<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>减值阶段参数维护</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form "  id="submitForm">
        <div class="layui-form-item" style="display: none;">
        	<input type="text" id="seqno" name="seqno" class="layui-input form-input"
                           data-th-value="${entity?.seqno}">
            <input id="operateType" name="operateType" class="layui-input form-input" placeholder="操作类型"
                   data-th-value="${entity?.operateType}"/>
            <input type="text" id="workflowId" name="workflowId" placeholder="流程 Id"
                   class="layui-input form-input" data-th-value="${entity?.workflowId}"/>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label form-lable mst-lable">资产所属阶段</label>
			<div class="layui-input-inline input-inline">
				<select type="text" id="stageOfAeest" name="stageOfAeest"
					required="required" 
					data-th-data-result='${FIN_STAGE}'
					data-th-initValue="${entity?.stageOfAeest}"
					class="layui-input form-input input-select" allowClear="true"
					placeholder="请输入内容"
					data-th-placeholder="#{SysCommon.placeholder}"></select>
			</div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label form-lable mst-lable">要素绝对值</label>
			<div class="layui-input-inline input-inline">
				<select type="text" id="absoluteOfElements" name="absoluteOfElements"
					required="required" 
					data-th-data-result='${MODEL_ABSOLUTE_OF_ELEMENT}'
					data-th-initValue="${entity?.absoluteOfElements}"
					class="layui-input form-input input-select" allowClear="true"
					placeholder="请输入内容"
					data-th-placeholder="#{SysCommon.placeholder}"></select>
			</div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label form-lable mst-lable">要素</label>
			<div class="layui-input-inline input-inline">
				<select type="text" id="elements" name="elements"
					required="required"
					data-th-data-result='${MODEL_DEC_ELEMENT}'
					data-th-initValue="${entity?.elements}"
					class="layui-input form-input input-select" allowClear="true"
					placeholder="请输入内容"
					data-th-placeholder="#{SysCommon.placeholder}"></select>
			</div>
        </div>



        <div class="layui-form-item" id="inputType" style="display:none;">
            <label class="layui-form-label form-lable mst-lable">参数值</label>
			<div class="layui-input-inline input-inline">
				<input type="text" id="inputValue" name="inputValue" class="layui-input form-input" 
					 data-th-value='${entity?.elementsValue}' onkeyup="value=value.replace(/^(0+)|[^\d]+/g,'')"
                     placeholder="请输入内容" >
			</div>
        </div>
        <div class="layui-form-item" id="selectRate" style="display:none;">
            <label class="layui-form-label form-lable mst-lable">参数值</label>
			<div class="layui-input-inline input-inline">
				<select type="text" id="selectRateValue" name="selectRateValue"
					data-th-data-result='${MODEL_STANDARD_GRADE_RESULT}'
					data-th-initValue="${entity?.elementsValue}"
					class="layui-input form-input input-select" allowClear="true"
					placeholder="请输入内容"
					data-th-placeholder="#{SysCommon.placeholder}"></select>
			</div>
        </div>
        <div class="layui-form-item" id="selectRsk" style="display:none;">
            <label class="layui-form-label form-lable mst-lable">参数值</label>
			<div class="layui-input-inline input-inline">
				<select type="text" id="selectRskValue" name="selectRskValue"
					multiple="true"
					data-th-data-result='${BOND_RISK_TYPE}'
					data-th-initValue="${entity?.elementsValue}"
					class="layui-input form-input input-select" allowClear="true"
					placeholder="请输入内容"
					data-th-placeholder="#{SysCommon.placeholder}"></select>
			</div>
        </div>

		<div class="layui-form-item">
			<label class="layui-form-label form-lable mst-lable">启用状态</label>
			<div class="layui-input-inline input-inline">
				<select id="useStatus" name="useStatus"
						class="layui-input form-input input-select"
						data-th-data-result='${USE_STATUS}'
						placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
						required="required"
						data-th-initvalue="${entity?.useStatus}">
				</select>
			</div>
		</div>

        <div class="layui-row" style="margin: 50px;">
            <div class="text-center">
                <button type="button" class="layui-btn btn-submit" id="ModStagePara002_btn_submit">提交</button>
                <a type="button" class="layui-btn btn-cancel" id="ModStagePara002_btn_cancel">取消</a>
            </div>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/lossmodel/phaseparameter/ModStagePara002.js}" type="text/javascript"></script>
</div>
</body>
</html>
