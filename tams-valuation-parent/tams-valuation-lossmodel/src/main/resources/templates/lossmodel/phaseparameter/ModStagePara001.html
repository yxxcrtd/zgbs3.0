<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ModStagePara001}">减值阶段参数管理</title>
</head>
<body>
    <div layout:fragment="content">
            <div class="form-button-area" export="true">
                <!-- <a id="PdFactorConfig001_btn_add" class="layui-btn layui-btn-sm btn-create"
                    data-th-text="#{SysCommon.create}">新建</a>
                <a id="PdFactorConfig001_btn_weight" class="layui-btn layui-btn-sm">权重配置</a> -->
                <a id="ModStagePara001_btn_on" class="layui-btn layui-btn-sm">启用</a>
                <a id="ModStagePara001_btn_off" class="layui-btn layui-btn-sm">停用</a>
            </div>
            <div class='joyin-form-wrap condition-area'>
                <form class="layui-form " filter='false' id="searchForm">
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable" data-th-text="#{ModStagePara001.stageOfAeest}">所属阶段</label>
                            <div class="layui-input-inline input-inline">
                                    <select type="text" id="stageOfAeest" name="stageOfAeest"  class="layui-input form-input input-select" 
									 allowClear="true" placeholder="请输入内容"
									      data-th-data-result="${FIN_STAGE}"
									data-th-placeholder="#{SysCommon.placeholder}">
									<option></option>
                                </select>
                            </div>
                        </div>
                        
                    </div>
                </form>
            </div>
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/lossmodel/phaseparameter/ModStagePara001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
