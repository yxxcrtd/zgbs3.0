<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title>特殊资产LGD维护信息</title>
    <style>
        .mst-lable{
            width: 20%;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">

                <div class="layui-form-item" style="display: none;">
                    <input type="text" id="seqNo" name="seqNo" class="layui-input form-input"
                           data-th-value="${entity?.seqNo}">
                    <input id="operateType" name="operateType" class="layui-input form-input" placeholder="操作类型"
                           data-th-value="${entity?.operateType}"/>
                    <input type="text" id="workflowId" name="workflowId" placeholder="流程 Id"
                           class="layui-input form-input" data-th-value="${entity?.workflowId}"/>
                </div>

                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">资产名称</label>
                        <div class="layui-input-inline input-inline">
                            <select id="finprodName" name="finprodName"
                                    data-th-data-url='@{/model/impairment/lgddefultmanager/lgdspecialconfig/LgdSpecialConfig002/getAssetInfoSelectOption}'
                                    data-th-data-formatoption=true class="layui-input form-input input-select"
                                    placeholder="请选择"
                                    data-th-placeholder="#{SysCommon.selectplaceholder}"
                                    data-th-initValue="${entity?.finprodId}" allowClear="true" required>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="finprodId" name="finprodId" disabled="true"
                                   class="layui-input form-input" placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-value="${entity?.finprodId}" required>
                        </div>
                    </div>
                </div>

                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md6">
                        <div >
                            <label class="layui-form-label form-lable">LGD(%)</label>
                            <div class="layui-input-inline input-inline ">
                                <input id="lgd" name="lgd"
                                       class="layui-input form-input text-number"
                                       data-th-value="${entity?.lgd}" data-textrange="2"  maxLength="30"
                                       placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="layui-col-md12" style="margin: 30px 0;">
                    <div class="text-center">
                        <!--           <a id="LgdSpecialConfig002_btn_save" class="layui-btn layui-btn-sm btn-save"
                                      data-th-text="#{SysCommon.save}">保存</a>-->
                        <a id="LgdSpecialConfig002_btn_submit"
                           class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="LgdSpecialConfig_btn_cancel"
                           class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/lossmodel/lgddefultmanager/lgdspecialconfig/LgdSpecialConfig002.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
