<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>特殊资产LGD维护</title>
    <script th:inline="javascript">
        var isInit = [[${isInit}]];
        var hzSchemeSwitch = [[${hzSchemeSwitch}]];
    </script>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a id="LgdSpecialConfig001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
        <a id="LgdSpecialConfig001_btn_del" class="layui-btn layui-btn-sm btn-delete">删除</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">

                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">资产代码</label>
                    <div class="layui-input-inline input-inline">
                        <select id="finprodIds" name="finprodIds" data-th-data-url='@{/model/impairment/lgddefultmanager/lgdspecialconfig/LgdSpecialConfig001/getAssetInfoSelectOption}'
                                data-th-data-formatoption=true class="input-select" placeholder="请选择"
                                data-th-placeholder="#{SysCommon.selectplaceholder}"
                                allowClear="true" multiple="multiple">
                        </select>
                    </div>
                </div>
            </div>

        </form>
    </div>
    <!--filter="false"-->

    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>

</div>
<div layout:fragment="script">
    <script
            data-th-src="@{/js/lossmodel/lgddefultmanager/lgdspecialconfig/LgdSpecialConfig001.js}"
            type="text/javascript"></script>
</div>
</body>
</html>
