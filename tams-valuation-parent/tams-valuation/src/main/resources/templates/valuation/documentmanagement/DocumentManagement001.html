<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>文档列表</title>
</head>
<body>
    <div layout:fragment="content">  
    <div class="form-button-area"> 
     <button class="layui-btn layui-btn-sm btn-create" id="DocumentManagement001_btn_add" data-th-text="#{SysCommon.create}">新建</button>
    </div>          
            <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm" style="background: #ffffff; padding: 10px 0;">
                <div class="layui-form-item">
                  <div class="layui-inline layui-col-md6" >
                    <label class="layui-form-label form-lable">上传时间</label>
                    <div class="layui-input-inline input-inline">
                      <input type="text" id="uploadTime" name="uploadTime" placeholder="请选择日期区间" class="layui-input form-input input-dateRangeSelect"   />
                    </div>
                </div>                 
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">上传人</label>
                        <div class="layui-input-inline input-inline">                               
                                <input type="text" id="createUser" name="createUser" placeholder="请输入内容"
                                class="layui-input form-input"
                                data-th-Value="${createUser}"
                                >
                        </div>
                    </div>                
                </div>  
                 <div class="layui-form-item">
                  <div class="layui-inline layui-col-md6" >
                    <label class="layui-form-label form-lable">文档类型</label>
                    <div class="layui-input-inline input-inline">
                      <input type="text" id="fileType" name="fileType" placeholder="请输入内容"
                                class="layui-input form-input input-select"
                                data-th-Value="${fileType}" data-th-data-result="${FILE_TYPE}"
                                >
                    </div>
                </div>                 
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">文档名称</label>
                        <div class="layui-input-inline input-inline">                               
                                <input type="text" id="fileName" name="fileName" placeholder="请输入内容"
                                class="layui-input form-input"
                                data-th-Value="${fileName}"
                                >
                        </div>
                    </div>                
                </div>
                
            </form>
        </div>
            <div>
                <table id="dataTable"></table>
           </div>        
        </div>      
    </div>
</body>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/documentmanagement/DocumentManagement001.js}"
        type="text/javascript"></script>
</div>
</html>
