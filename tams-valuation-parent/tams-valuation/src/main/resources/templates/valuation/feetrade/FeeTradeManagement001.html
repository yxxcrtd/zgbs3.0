<!DOCTYPE html>
<html
        xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
        layout:decorate="~{layout/default}">
<head>
    <title data-th-text="FeeTradeManagement001">费用交易管理</title>
</head>
<body>
<div layout:fragment="content">
	<div class="layui-col-md12">
		<div class="layui-tab layui-tab-card" lay-filter="tabContainer">
			<div class="layui-tab-content" style="padding: 0">
				<div class="layui-tab-item layui-show">
					<div class="layui-col-md12" style="margin: 10px 10px">
						<button type="button" class="layui-btn layui-btn-sm btn-create"
							id="FeeTradeManagement001_btn_add">新建</button>
						<button type="button" class="layui-btn layui-btn-sm btn-modify"
							id="FeeTradeManagement001_btn_modify">修改</button>
						<button type="button" class="layui-btn layui-btn-sm btn-delete"
							id="FeeTradeManagement001_btn_delete">删除</button>
						<button type="button" class="layui-btn layui-btn-sm btn-export"
							id="FeeTradeManagement001_prd_export">导出</button>
					</div>
					<div class="layui-col-md12" id="c_fundsAllocateForm"
						style="background-color: #f5f5f5;">
						<form class="layui-form layui-col-md11" id="fundsAllocateForm">
							<div class="layui-form-item">
								<div class="layui-inline layui-col-md4">
									<label class="layui-form-label form-lable"
										data-th-text="#{FeeTradeManagement001.bookSetName}">
										账套</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="bookSetId"
											name="bookSetId"
											class="layui-input form-input input-select" placeholder="请选择"
											data-th-data-url="@{/valuation/feetrade/FeeTradeManagement002/getBookSetList}">
										</select>
									</div>
								</div>
								<div class="layui-inline layui-col-md4">
									<label class="layui-form-label form-lable"
										data-th-text="#{FeeTradeManagement002.feeType}">
										费用类型</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="feeType" name="feeType"
											class="layui-input form-input input-select" placeholder="请选择"
											data-th-data-result="${feeTypeSelect}">
										</select>
									</div>
								</div>
								<div class="layui-inline layui-col-md4">
									<label class="layui-form-label form-lable"
										data-th-text="#{FeeTradeManagement002.payDate}">
										支付日期</label>
									<div class="layui-input-inline input-inline">
										<input id="payDate" name="payDate"
											class="layui-input form-input input-dateSelect"
											placeholder="请输入日期">
									</div>
								</div>
							</div>
						</form>
						<div class="layui-col-md1">
							<div class="layui-form-item">
								<button type="button" class="layui-btn layui-btn-sm btn-search"
									id="FeeTradeManagement001_search">查询</button>
							</div>
						</div>
					</div>
					<table class="layui-table" id="table"></table>
				</div>
			</div>
		</div>
	</div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
    	var feeTypeSelect = /*[[${feeTypeSelect}]]*/'';
		var YES_OR_NO = /*[[${YES_OR_NO}]]*/'';	 	
    </script>
    <script data-th-src="@{/js/valuation/feetrade/FeeTradeManagement001.js}"></script>
</div>
</body>
</html>
