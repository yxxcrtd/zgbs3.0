<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title>账套日期切换</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <label class="layui-form-label form-lable">账套代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="booksetId" name="booksetId" class="layui-input form-input"
                            data-th-value="${booksetId}" disabled="disabled">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <label class="layui-form-label form-lable">账套名称</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="booksetName" name="booksetName" class="layui-input form-input"
                            data-th-value="${booksetName}" disabled="disabled">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <label class="layui-form-label form-lable">当前日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="booksetDate" name="booksetDate" placeholder="请选择" class="layui-input form-input input-dateSelect" data-th-value="${booksetDate}">
                    </div>
                </div>    
            </div>
        </form>
        <div class="layui-col-md11" style="margin:10px 0 10px 0;">
            <div class="text-center">
    <!--             <a id="ValAssetBook003_btn_save" class="layui-btn layui-btn-sm btn-save">保存</a> -->
                <a id="ValBooksetDateSwitch002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
                <a id="ValBooksetDateSwitch002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/accounadjustmanage/booksetdateswitch/ValBooksetDateSwitch002.js}" type="text/javascript"></script>
    </div>
</body>

</html>
