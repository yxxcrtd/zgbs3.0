<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{ValAssetBookParameter002}">账套参数管理</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" style="padding: 10px 0;" id="submitForm">
        
        <div class="layui-form-item" style="display: none">
                <input id="operateType" name="operateType"
                    class="layui-input form-input" placeholder="操作类型" data-th-value="${entity?.operateType}">
                <input id="pageModel" name="pageModel"
                    class="layui-input form-input" placeholder="pageModel" data-th-value="${pageModel}">
                <input id="status" name="status"
                    class="layui-input form-input" placeholder="流程状态" data-th-value="${entity?.status}">
                <input type="text" id="workflowId" name="workflowId"  placeholder="流程 Id"
                            class="layui-input form-input" data-th-value="${entity?.workflowId}" >   
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6"id="c_booksetId1"style="display: none">
                    <label class="layui-form-label form-lable">账套</label>
                    <div class="layui-input-inline input-inline">
                        <select id="booksetId" name="booksetId"
                                class="layui-input form-input input-select"
                                data-th-data-url="@{/valuation/accounadjustmanage/assetbookparameter/ValAssetBookParameter001/getBooksetId}"
                                 allowClear="true" placeholder="请输入内容">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md6"id="c_paramCode1"style="display: none">
                    <label class="layui-form-label form-lable">参数</label>
                    <div class="layui-input-inline input-inline">
                        <select id="paramCode" name="paramCode" 
                            class="layui-input form-input input-select" data-th-data-url='@{/valuation/accounadjustmanage/assetbookparameter/ValAssetBookParameter002/findParam}' allowClear="true"
                            data-th-placeholder="#{SysCommon.placeholder}" data-th-initvalue="${entity?.paramCode}" parentIds="booksetId" >
                            <option></option>
                        </select>
                    </div>
                </div>
	            <div class="layui-inline layui-col-md6"id="c_booksetId2">
					<label class="layui-form-label form-lable"> 账套代码</label>
					<div class="layui-input-block input-inline">
						<input type="text" id="booksetId" name="booksetId" class="layui-input form-input "
							placeholder="请输入"data-th-required="true"data-th-value="${entity?.booksetId}"disabled>
					</div>
	            </div>
                <div class="layui-inline layui-col-md6"id="c_paramCode2">
                    <label class="layui-form-label form-lable">参数代码</label>
                    <div class="layui-input-inline input-inline">
                        <input id="paramCode" name="paramCode" class="layui-input form-input" placeholder="请输入"
                            data-th-value="${entity?.paramCode}" data-th-required="true"disabled>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6"id="c_booksetName">
                    <label class="layui-form-label form-lable"> 账套名称</label>
                    <div class="layui-input-block input-inline">
                        <input type="text" id="booksetName" name="booksetName" class="layui-input form-input "
                            placeholder="请输入"data-th-required="true"data-th-value="${entity?.booksetName}"disabled>
                    </div>
                </div>
                <div class="layui-inline layui-col-md6"id="c_paramName">
                    <label class="layui-form-label form-lable">参数名称</label>
                    <div class="layui-input-inline input-inline">
                        <input id="paramName" name="paramName" class="layui-input form-input" placeholder="请输入"
                            data-th-value="${entity?.paramName}" data-th-required="true"disabled>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">参数值</label>
                    <div class="layui-input-inline input-inline">
                        <input id="paramValue" name="paramValue" class="layui-input form-input" placeholder="请输入"
                            data-th-value="${entity?.paramValue}" data-th-required="true">
                    </div>
                </div> 
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">参数说明</label>
                    <div class="layui-input-inline input-inline">
                        <input id="remark" name="remark" class="layui-input form-input" placeholder="请输入"
                            data-th-value="${entity?.remark}" >
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">参数类型</label>
                    <div class="layui-input-inline input-inline">
                        <input id="paramType" name="paramType" type="text"
                               class="layui-input form-input input-select" data-th-value="${entity?.paramType}"
                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-data-result="${BOOKSET_PARAM_TYPE}" formatoption = true>
                    </div>
                </div>
            </div>

        </form>
        <div class="layui-col-md11" style="margin: 10px 0 10px 0;">
            <div class="text-center">
                <a id="ValAssetBookParameter002_btn_save" class="layui-btn layui-btn-sm btn-save">保存</a>
                <a id="ValAssetBookParameter002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a> 
                <a id="ValAssetBookParameter002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/valuation/accounadjustmanage/assetbookparameter/ValAssetBookParameter002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
