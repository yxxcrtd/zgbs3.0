<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>手工凭证</title>
</head>

<body>

<div layout:fragment="content">
    <div class="form-button-area" >
        <a id="ValManualVoucher001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
        <a id="ValManualVoucher001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}">删除</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">所属账套</label>
                    <div class="layui-input-inline input-inline">
                    	<select id="booksetId" name="booksetId" class="layui-input form-input input-select" 
                            		data-th-data-url="@{/valuation/accounadjustmanage/manualvoucher/ValManualVoucher001/getBooksetId}" 
                            		multiple="multiple"
                                  allowClear="true" placeholder="请输入内容">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">业务类型</label>
                    <div class="layui-input-inline input-inline" style="display: block;">
                      <input id="finprodType" name="finprodType" class="layui-input form-input input-select" placeholder="请选择" data-th-data-result="${FINPROD_TYPE}" allowClear="true">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">资产/负债代码</label>
                    <div class="layui-input-inline input-inline">
                      <input type="text" id="busiId" name="busiId" class="layui-input form-input" value="" placeholder="请输入内容">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">记账日期</label>
                    <div class="layui-input-inline input-inline">
                      <input type="text" id="bookDate" name="bookDate" data-th-value="${sysDate}" placeholder="请选择、支持区间" class="layui-input form-input input-dateRangeSelect" allowClear="true">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">业务编号</label>
                    <div class="layui-input-inline input-inline">
                      <input type="text" id="tradeId" name="tradeId" class="layui-input form-input" placeholder="请输入内容" value="">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">凭证类型</label>
                    <div class="layui-input-inline input-inline" style="display: block;">
                      <input id="bookType" name="bookType" class="layui-input form-input input-select" placeholder="请选择" data-th-initValue="${bookType}"
                      data-th-data-result="${BOOK_TYPE}" allowClear="true" disabled="disabled">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">凭证编号</label>
                    <div class="layui-input-inline input-inline">
                      <input type="text" id="bookId" name="bookId" class="layui-input form-input" placeholder="请输入内容" value="">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4" >
                   <label class="layui-form-label form-lable">凭证是否展示分录</label>
                   <div class="layui-input-inline input-inline" >
                       <input type="checkbox" name="isShowfl" id ="isShowfl" lay-skin="switch" lay-text="是|否"
                       data-th-checked="${YES}"   data-th-value="${YES_OR_NO}" >
                   </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
</body>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/accounadjustmanage/manualvoucher/ValManualVoucher001.js}" type="text/javascript"></script>
</div>

</html>
