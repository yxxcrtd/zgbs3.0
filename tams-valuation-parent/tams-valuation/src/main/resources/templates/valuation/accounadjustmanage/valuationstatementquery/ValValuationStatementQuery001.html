<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{ValValuationStatementQuery001}">估值表查询</title>
</head>

<body>
    <div layout:fragment="content">
    <div class="form-button-area" export="false">
             <a id="ValFinprodTradeQuery001_btn_export" class="layui-btn layui-btn-sm"><i class="iconfont icon-export"></i><span>导出</span></a> 
        </div>
		 <form class="layui-form joyin-form-wrap joyin-filter-form" id="searchForm" style="display: none;">        
            <div class="layui-form-item">
            <div class="layui-inline layui-col-md3">
                <label class="layui-form-label form-lable2" data-th-text="#{ValSubjectSet001.booksetId}">所属账套</label>
                <div class="layui-input-inline input-inline">
                  <input type="text" id="booksetId" name="booksetId" class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                        data-th-placeholder="#{SysCommon.placeholder}" data-th-data-url="@{/valuation/accounadjustmanage/assetbook/ValAssetBook001/getBooksetId}"
                        data-idfield="code" data-keyfield="code" data-th-data-effectivefieldsalias='|{"code":"#{ValSubjectSet001.booksetId}","shortName":"#{ValSubjectSet001.booksetName}"}|'>
                </div>
            </div>
            <div class="layui-inline layui-col-md3">
                <label class="layui-form-label form-lable">文件类型</label>
                <div class="layui-input-inline input-inline">
                    <select id="fileType" name="fileType" class="layui-input form-input input-select" placeholder="请选择" data-th-data-result="${FILE_TYPE}" allowClear="true"><option></option></select>
                </div>
            </div>
            <div class="layui-inline layui-col-md3">
                <label class="layui-form-label form-lable">日期</label>
                <div class="layui-input-inline input-inline">
                  <input type="text" id="sdate" name="sdate" placeholder="请选择" class="layui-input form-input input-dateSelect" value="">
                </div>
            </div>
             <div class="layui-inline layui-col-md3">
                <a class="layui-btn layui-btn-sm btn-search" id="ValFinprodTradeQuery001_btn_search"><i class="iconfont icon-search"></i><span>&nbsp;&nbsp;查询</span></a>
            </div>  
            </div>  
        </form>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/accounadjustmanage/valuationstatementquery/ValValuationStatementQuery001.js}" type="text/javascript"></script>
    </div>
</body>

</html>
