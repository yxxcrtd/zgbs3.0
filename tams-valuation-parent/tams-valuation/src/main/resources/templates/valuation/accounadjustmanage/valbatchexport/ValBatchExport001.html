<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>三表批量导出</title>
<style type="text/css">
.btn-reset {
	display: none;
}

.btn-search {
	display: none;
}
</style>
<script th:inline="javascript">
	var curUser=[[${session.curUser}]];
</script>
</head>
<body>
</body>
<div layout:fragment="content">
	<div class="form-button-area"></div>
	<div class="joyin-form-wrap joyin-filter-form condition-area">
		<form class="layui-form" id="searchForm" autocomplete="off">
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md3">
					<label class="layui-form-label form-lable">报表维度</label>
					<!-- <div class="layui-input-inline input-inline"style="width: 100% !important"> -->
					<div class="layui-input-inline input-inline">
						<input type="text" id="batchBooksetType" name="batchBooksetType"
							class="layui-input form-input input-checkbox"
							data-th-data-result="${BATCH_BOOKSET_TYPE}" data-th-initvalue="0"
							allowClear="true" required>
					</div>
				</div>
				<div class="layui-inline layui-col-md3">
					<label class="layui-form-label form-lable" id="dynamicName">账套组</label>
					<div class="layui-input-inline input-inline">
						<select id="booksetId" name="booksetId"
							class="layui-input form-input input-select" multiple="multiple"
							allowClear="true" showAll="true" placeholder="请选择"
							parentIds="booksets" formatoption="false"
							data-th-data-url="@{/valuation/dailyoperation/dailyaccountmake/valaccounthandle/ValAccountHandle001/getBookSetIdNew}"
							required>
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md3">
					<label class="layui-form-label form-lable">报表类型</label>
					<div class="layui-input-inline input-inline">
						<input type="text" class="layui-input form-input input-select"
							id="reportType" multiple="multiple" name="reportType"
							placeholder="请选择报表类型" allowClear="true"
							data-th-data-result="${REPORT_TYPE_EXPORT}" required />
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md3" id="lastDimendiv">
					<label class="layui-form-label form-lable">上期维度</label>
					<div class="layui-input-inline input-inline">
						<select type="text" class="layui-input form-input input-select"
							id="lastDimen" name="lastDimen" placeholder="请选择上期维度"
							allowClear="true" data-th-data-result="${LAST_DIMEN}" required>
							<option></option>
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md3">
					<label class="layui-form-label form-lable">筛选条件</label>
					<div class="layui-input-inline input-inline">
						<select type="text" class="layui-input form-input input-select"
							id="reportTermType" name="reportTermType" placeholder="请选择报表期限类型"
							allowClear="true" data-th-data-result="${REPORT_TERM_TYPE}"
							childrenIds="reportTerm" required>
							<option></option>
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md3">
					<div class="layui-input-inline input-inline" id="c_year_reportDate"
						style="display: none;">
						<input type="text" class="layui-input form-input"
							id="year_reportDate" name="reportDate" placeholder="请选择日期">
					</div>
					<div class="layui-input-inline input-inline"
						id="c_month_reportDate" style="display: none;">
						<input type="text" class="layui-input form-input"
							id="month_reportDate" name="reportDate" placeholder="请选择日期">
					</div>
					<div class="layui-input-inline input-inline" id="c_date_reportDate"
						style="display: none;">
						<input type="text" class="layui-input form-input"
							id="date_reportDate" name="reportDate" placeholder="请选择日期">
					</div>
				</div>
				<div class="layui-inline layui-col-md3" id="c_reportTerm"
					style="display: none;">
					<label class="layui-form-label form-lable">期限</label>
					<div class="layui-input-inline input-inline">
						<select type="text" class="layui-input form-input input-select"
							id="reportTerm" name="reportTerm" placeholder="请选择期限"
							allowClear="true" data-url="getTermLink"
							parentIds="reportTermType" required>
							<option></option>
						</select>
					</div>
				</div>
				<div style="display: none;">
					<select type="text" class="layui-input form-input input-select"
						id="booksets" name="booksets" allowClear="true"
						childrenIds="booksetId">
						<option value="0">0</option>
						<option value="1">1</option>
					</select>
				</div>
			</div>
		</form>
	</div>

</div>
<div layout:fragment="script">
	<script
		data-th-src="@{/js/valuation/accounadjustmanage/valbatchexport/ValBatchExport001.js}"
