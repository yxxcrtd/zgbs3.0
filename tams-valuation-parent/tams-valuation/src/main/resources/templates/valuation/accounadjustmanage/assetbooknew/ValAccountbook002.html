<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{ValAccountbook002}">新建账套</title>
</head>

<body>
<div layout:fragment="content">
  <form id="submitForm">
    <div class="layui-form layui-clear" style="margin-top: 10px;">
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>账套代码</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="ValAssetBook002_id" class="layui-input form-input input-lenovoselect" placeholder="请选择产品或输入关键词" value="">
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>账套名称</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="ValAssetBook002_name" class="layui-input form-input input-lenovoselect" placeholder="请选择产品或输入关键词" value="">
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>账套模板</label>
        <div class="layui-input-inline input-inline">
          <input type='checkbox' name='muban' lay-skin='switch' value='02' lay-text='是|否'>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2">账套类别</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="ValAssetBook002_type" name="status" class="layui-input form-input input-checkbox" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;银行账套&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;理财账套&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;03&quot;,&quot;text&quot;:&quot;特殊账套&quot;,&quot;col&quot;:&quot;&quot;}]'
          initValue='01'  >
        </div>
      </div>
      <div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2">核算主体代码</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="ValAssetBook002_ACCT_SUBJECT_ID" class="layui-input form-input input-lenovoselect" placeholder="请选择产品或输入关键词" value="">
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2">核算主体类别</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="ValAssetBook002_ACCT_SUBJECT_TYPE" class="layui-input form-input input-lenovoselect" placeholder="请选择产品或输入关键词" value="">
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2">模板账套</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="ValAssetBook002_BOOKSET_ID_TMPL" class="layui-input form-input input-lenovoselect" placeholder="请选择产品或输入关键词" value="">
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2">会计准则</label>
        <div class="layui-input-inline  input-inline">
          <select type="text" id="ValAssetBook002_ACCT_STANDARD" class="layui-input form-input input-select"  placeholder="请选择" data-th-data-url="@{/valuation/accounadjustmanage/assetbook/ValAssetBook002/ValAssetBook002getACCT_STANDARD}" allowClear="true"><option></option></select>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2">本位币</label>
        <div class="layui-input-inline input-inline">
          <select type="text" id="ValAssetBook002_STANDARD_CCY" class="layui-input form-input input-select"  placeholder="请选择" data-th-data-url="@{/valuation/accounadjustmanage/assetbook/ValAssetBook002/ValAssetBook002getSTANDARD_CCY}" allowClear="true"><option></option></select>
        </div>
      </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2">对币种规则</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="ValAssetBook002_type" name="status" class="layui-input form-input input-checkbox" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;分币种记账&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;本币种记账&quot;,&quot;col&quot;:&quot;&quot;}]'
          initValue='01'  >
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2">账套开始日</label>
        <div class="layui-input-inline input-inline">
          <input class="layui-input form-input input-dateSelect" id="ValAssetBook002_DATE_startDate">
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2">账套结束日</label>
        <div class="layui-input-inline input-inline">
          <input class="layui-input form-input input-dateSelect" id="ValAssetBook002_DATE_endDate">
        </div>
      </div>
    </div>
  </form>
  <div class="layui-col-md11" style="margin:10px 0 10px 0;">
    <div class="text-center">
      <a id="ValAssetBook002_btn_save" class="layui-btn layui-btn-sm btn-save">保存</a>
      <a id="ValAssetBook002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
      <a id="ValAssetBook002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
    </div>
  </div>
</div>
<div layout:fragment="script"> 
  <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script>
</div>
</body>
</html>
