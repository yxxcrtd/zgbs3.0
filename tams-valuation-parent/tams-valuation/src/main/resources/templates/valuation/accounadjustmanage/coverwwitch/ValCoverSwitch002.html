<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>新建账套切换</title>
</head>
<body>

</body>
<div layout:fragment="content">
  <form id="submitForm">
    <div class="layui-form" style=" margin-top:10px;">
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>产品代码</label>
        <div class="layui-input-block input-inline">
          <input type="text"  class="layui-input form-input input-lenovoselect" placeholder="请选择产品或输入关键词" value="" data-url="/system/institution/SysInstitution001/getInstitutionCode" data-idfield="code" data-keyfield="code" data-effectivefieldsalias='{&quot;code&quot;:&quot;产品代码&quot;,&quot;shortName&quot;:&quot;产品名称&quot;}'>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>产品代码</label>
        <div class="layui-input-block input-inline">
          <input type="text" class="layui-input form-input" value="选产品代码自动代入名称">
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>所属账套</label>
        <div class="layui-input-block  input-inline">
          <input type="text"  class="layui-input form-input input-lenovoselect" placeholder="请选择产品或输入关键词" value="" data-url="/system/institution/SysInstitution001/getInstitutionCode" data-idfield="code" data-keyfield="code" data-effectivefieldsalias='{&quot;code&quot;:&quot;账套代码&quot;,&quot;shortName&quot;:&quot;账套名称&quot;}'>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>切换账套</label>
        <div class="layui-input-block  input-inline">
          <input type="text"  class="layui-input form-input input-lenovoselect" placeholder="请选择产品或输入关键词" value="" data-url="/system/institution/SysInstitution001/getInstitutionCode" data-idfield="code" data-keyfield="code" data-effectivefieldsalias='{&quot;code&quot;:&quot;账套代码&quot;,&quot;shortName&quot;:&quot;账套名称&quot;}'>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>并行开始日</label>
        <div class="layui-input-block  input-inline">
          <input type="text" class="layui-input form-input input-dateSelect" placeholder="请选择日期" required>
        </div>
      </div>
    </div>
  </form>
  <div class="layui-col-md11" style="margin:10px;">
   	<div class="text-center">
<!--         <a id="ValCoverSwitch002_btn_save" class="layui-btn layui-btn-sm btn-save">保存</a> -->
        <a id="ValCoverSwitch002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
        <a id="ValCoverSwitch002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
    </div>
   </div>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script>
</div>
</html>
