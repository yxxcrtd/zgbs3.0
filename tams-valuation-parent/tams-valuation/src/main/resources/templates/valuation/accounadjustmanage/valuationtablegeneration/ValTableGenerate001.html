<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>估值表生成</title>
</head>

<body>

<div layout:fragment="content">
	<div class="form-button-area" >
        <a id="ValTableGenerate001_btn_create" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.handle}">手动生成</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                
                <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">账套</label>
                        <div class="layui-input-inline input-inline">
                            <select id="prodId" name="prodId" class="layui-input form-input input-select"
                                placeholder="请选择，可复选" data-th-data-url="@{/valuation/accounadjustmanage/valuationtablegeneration/ValTableGenerate001/getBooksetId}" allowClear="true"
                                multiple="multiple" data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                </div>
                <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">估值日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="valDate" name="valDate" placeholder="请选择、支持区间"
                                class="layui-input form-input input-dateRangeSelect" allowClear="true">
                        </div>
                </div>
                <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">收益类型</label>
                        <div class="layui-input-inline input-inline">
                            <select id="prodType" name="prodType" class="layui-input form-input input-select"
                                placeholder="请选择，可复选" data-th-data-result="${PROFIT_TYPE}" allowClear="true"
                                multiple="multiple" data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">生成状态</label>
                        <div class="layui-input-inline input-inline">
                            <select id="buildStatus" name="buildStatus" class="layui-input form-input input-select"
                                placeholder="请选择，可复选" data-th-data-result="${BUILD_STATUS}" allowClear="true"
                                multiple="multiple" data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
</body>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/accounadjustmanage/valuationtablegeneration/ValTableGenerate001.js}" type="text/javascript"></script>
</div>

</html>
