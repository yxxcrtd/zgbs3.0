<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{valuation/layout/print}">
<head>
    <title>记账凭证</title>
</head>
<body>
<div data-th-if="entity eq null">无数据</div>
<div layout:fragment="content" data-th-if="entity ne null">
    <style type="text/css">
        th, td {
            padding: 4px;
            line-height: 12px;
            font-size: 8px;
        }

        .styl-money {
            text-align: right;
            min-width: 80px;
            max-width: 120px;
        }

        .print-table th {
            border: 1px solid #000;
            padding: 4px;
        }

        .print-table td {
            border: 1px solid #000 ;
            max-width: 200px;
            word-break:break-all;
        }

        .print-table .styl-sum {
            border-top: 2px solid black;
        }
    </style>
    <!-- 其他资产类别 -->
    <div style="width: 94%; margin: 40px auto !important;border: 4px double black;">
        <div style="border-bottom: 4px double black;margin-bottom: 4px">
            <div style="text-align:center;margin: 10px"><h2 data-th-text="记账凭证"></h2></div>
            <table style="width: 80%; margin: 10px auto !important;table-layout: fixed;">
                <tr>
                    <td colspan="2" data-th-text="|记账日期：${entity?.bookDate}|"></td>
                    <td colspan="2" style="text-indent:2em;" data-th-text="|账套：${entity?.booksetName}|"></td>
                    <td data-th-text="|附件张数：|"></td>
                </tr>
                <tr>
                    <td colspan="2" data-th-text="|凭证编号：${entity?.busVouchnum}|"></td>
                    <td colspan="2" data-th-text="|业务类别：${entity?.tableId}|"></td>
                </tr>
            </table>
        </div>
        <div style="padding: 4px">
            <table style="border-collapse:collapse; border:2px solid black; width: 100%;" class="print-table">
                <thead>
                <tr>
                    <th style="width:120px">摘要</th>
                    <th>科目号</th>
                    <th>科目名称</th>
                    <th>借方金额(本币)</th>
                    <th>贷方金额(本币)</th>
                    <th>借方金额(原币)</th>
                    <th>贷方金额(原币)</th>
                    <th>原币币种</th>
                    <th>数量</th>
                </tr>
                </thead>
                    <!-- TODO 目前支持完美打印 20 条以内 。 -->
                    <tr data-th-each="item : ${entity?.list}">
                        <td data-th-text="${item?.vouchRemark}"></td>
                        <td data-th-text="${item?.subjectNo}"></td>
                        <td data-th-text="${item?.subjectName}"></td>
                        <td class="styl-money" data-th-text="${item?.dBHappenAmt}"></td>
                        <td class="styl-money" data-th-text="${item?.cBHappenAmt}"></td>
                        <td class="styl-money" data-th-text="${item?.dHappenAmt}"></td>
                        <td class="styl-money" data-th-text="${item?.cHappenAmt}"></td>
                        <td style="width: 90px" data-th-text="${item?.ccy}"></td>
                        <td class="styl-money" data-th-text="${item?.happenNumber}"></td>
                    </tr>
                    <tr>
                        <td style="text-align: center" class="styl-sum"  colspan="3" >汇总：</td>
                        <td class="styl-money styl-sum" data-th-text="${entity?.dBAmtSum}"></td>
                        <td class="styl-money styl-sum" data-th-text="${entity?.cBAmtSum}"></td>
                        <td class="styl-money styl-sum" data-th-text="${entity?.dAmtSum}"></td>
                        <td class="styl-money styl-sum" data-th-text="${entity?.cAmtSum}"></td>
                        <td class="styl-sum" data-th-text="${entity?.ccy}"></td>
                        <td class="styl-money styl-sum" data-th-text="${entity?.numSum}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div style="border-top: 4px double black;margin-top: 4px">
            <table style="width: 80%; margin: 10px auto !important; table-layout: fixed;">
                <tr>
                    <td colspan="2" data-th-text="|经办人：|"></td>
                    <td data-th-text="|复核人：|"></td>
                </tr>
            </table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script>
        $(function () {
            /**
             * 金额格式化
             * @param s 金额
             * @param n 小数位
             * @returns {string}
             */
            var formatMoney = function (s, n)
            {
                n = n > 0 && n <= 20 ? n : 2;
                s = parseFloat((s + '').replace(/[^\d\.-]/g, '')).toFixed(n) + '';
                var l = s.split('.') [0].split('').reverse(),
                    r = s.split('.') [1];
                var t = '';
                for (var i = 0; i < l.length; i++)
                {
                    t += l[i] + ((i + 1) % 3 == 0 && (i + 1) != l.length ? ',' : '');
                }
                return t.split('').reverse().join('') + '.' + r;

            };

            $(".styl-money").each(function (index, element){
                var value = $(element).text();
                if (value){
                    $(element).text(formatMoney(value, 2));
                }

            });
        });
    </script>
</div>
</body>
</html>
