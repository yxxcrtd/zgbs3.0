<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>凭证查询</title>
</head>

<body>

<div layout:fragment="content">
	<div class="form-button-area" >
        <a id="ValVoucherQuery001_btn_print" class="layui-btn layui-btn-sm btn-print">打印凭证</a>
        <a id="ValVoucherQuery001_btn_send" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-send"></i>发送</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
               <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">账套类别</label>
                    <div class="layui-input-inline input-inline">
                    	<select id="booksetType" name="booksetType" class="layui-input form-input input-select" 
                            		data-th-data-url="@{/valuation/accounadjustmanage/voucherquery/ValVoucherQuery001/findBooksetType}"
                            		
                                  allowClear="true" placeholder="请输入内容">
                        </select>
                   </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">所属账套</label>
                    <div class="layui-input-inline input-inline">
                    	<select id="booksetId" name="booksetId" class="layui-input form-input input-select" 
                            		data-th-data-url="@{/valuation/accounadjustmanage/voucherquery/ValVoucherQuery001/findBooksetId}"
                            		multiple="multiple"
                                  allowClear="true" placeholder="请输入内容">
                        </select>
                    <!-- 
                        <input type="text" id="booksetId" name="booksetId"
                            class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                            data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-data-url="@{/valuation/accounadjustmanage/assetbook/ValAssetBook001/getBooksetId2}"
                            data-idfield="code" data-keyfield="code"
                            data-th-data-effectivefieldsalias='|{"code":"#{ValSubjectSet001.booksetId}","shortName":"#{ValSubjectSet001.booksetName}"}|'> -->
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">业务类别</label>
                    <div class="layui-input-inline input-inline" style="display: block;">
                      <select id="tableId" name="tableId" class="layui-input form-input input-select" placeholder="请输入内容" data-th-data-result="${TABLE_ID}" multiple="multiple" allowClear="true">
                      </select>
                    </div>
                </div>                
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">资产/负债代码</label>
                    <div class="layui-input-inline input-inline">
                      <input type="text" id="busiId" name="busiId" class="layui-input form-input" value="" placeholder="请输入">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">业务编号</label>
                    <div class="layui-input-inline input-inline">
                      <input type="text" id="tradeId" name="tradeId" class="layui-input form-input" placeholder="请输入" value="">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">记账日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="bookDate" name="bookDate" data-th-value="${sysDate}" placeholder="请选择、支持区间" class="layui-input form-input input-dateRangeSelect" allowClear="true">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">原始业务编号</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="pTradeId" name="pTradeId" class="layui-input form-input" placeholder="请输入" value="">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">生成日期</label>
                    <div class="layui-input-inline input-inline">
                      <input type="text" id="happenDate" name="happenDate" placeholder="请选择、支持区间" class="layui-input form-input input-dateRangeSelect" value="" >
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">凭证类型</label>
                    <div class="layui-input-inline input-inline">
                      <input type="text" id="bookType" name="bookType" class="layui-input form-input input-select"  data-th-data-result="${BOOK_TYPE}" placeholder="请选择" allowClear="true">
                    </div>
                </div>                
            </div>
            <div class="layui-form-item">
	               <div class="layui-inline layui-col-md4">
	                    <label class="layui-form-label form-lable">凭证编号</label>
	                    <div class="layui-input-inline input-inline">
	                      <input type="text" id="busVouchnum" name="busVouchnum" class="layui-input form-input" placeholder="请输入" value="">
	                    </div>
	               </div>
                   <div class="layui-inline layui-col-md4">
                           <label class="layui-form-label form-lable">凭证是否展示分录</label>
                           <div class="layui-input-inline input-inline">
                                   <input type="checkbox" id="isShowfl"  name="isShowfl" lay-skin="switch"  lay-text="是|否" lay-filter="isShowfl" checked>
                           </div>
                   </div>
                   <div class="layui-inline layui-col-md4">
                       <label class="layui-form-label form-lable">科目号</label>
                       <div class="layui-input-inline input-inline">
                           <select type="text" id="subjectNo" name="subjectNo"
                                   class="layui-input form-input input-select"
                                   parentIds = "subjectLevel" formatoption = "false"
                                   data-th-data-url='@{/valuation/accounadjustmanage/subjectset/ValSubjectSet001/getSubjectId2}'
                                   allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                           </select>
                       </div>
                   </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
</body>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/accounadjustmanage/voucherquery/ValVoucherQuery001.js}" type="text/javascript"></script>
</div>

</html>
