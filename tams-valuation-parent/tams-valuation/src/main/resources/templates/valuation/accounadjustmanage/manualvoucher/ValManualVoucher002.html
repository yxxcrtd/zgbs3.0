<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>查看手工凭证</title>
    <style>
    .select2-container--default{
        max-width: 249px;
    }
    </style>
</head>

<body>

<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm" style="background: #ffffff; padding: 10px 0;">
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md4" id="seqnoDiv" style="display:none;">
                <label class="layui-form-label form-lable">
                    凭证流水
                </label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="seqno" name="seqno" class="layui-input form-input"
                           placeholder="提交后自动生成，无需填写" data-th-value="${entity?.seqno}" disabled="disabled">
                    <input type="hidden" id="bookId" name="bookId" data-th-value="${entity?.bookId}" >

                    <input type="hidden" id="profitType" name="profitType" data-th-value="${entity?.profitType}">
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">
                    <i class="iconfont must" style="display: inline;">*</i>
                    账套
                </label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="booksetId" name="booksetId"
                           class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                           data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-data-url="@{/valuation/accounadjustmanage/manualvoucher/ValManualVoucher003/getBooksetId2}"
                           data-idfield="code" data-keyfield="code"
                           data-th-data-effectivefieldsalias='|{"code":"#{ValSubjectSet001.booksetId}","shortName":"#{ValSubjectSet001.booksetName}"}|'
                           data-th-value="${entity?.booksetId}"
                    >
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">
                    <i class="iconfont must" style="display: inline;">*</i>
                    分录类型
                </label>
                <div class="layui-input-inline input-inline" style="display: inline-block;">
                    <input id="recordType" name="recordType" class="layui-input form-input input-select"
                           placeholder="请选择" data-th-initValue="${entity?.recordType}"
                           data-th-data-result="${RECORD_TYPE}" allowClear="true">
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">
                    <i class="iconfont must" style="display: inline;">*</i>
                    冲销标志
                </label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="offsetFlag" name="offsetFlag" class="layui-input form-input input-checkbox"
                           placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-initValue="${offsetFlag}"
                           data-th-data-result="${OFFSET_FLAG}"  allowClear="true">
                </div>
            </div>
        </div>
        <div class="layui-form-item">

            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">
                    <i class="iconfont must" style="display: inline;">*</i>
                    记账日
                </label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="bookDate" name="bookDate" placeholder="请选择"
                           data-th-value="${sysDate}"
                           class="layui-input form-input input-dateSelect" allowClear="true"
                    >
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">
                    <i class="iconfont must" style="display: inline;">*</i>
                    业务类型
                </label>
                <div class="layui-input-inline input-inline">
                    <input id="finprodType" name="finprodType" class="layui-input form-input input-select"
                           placeholder="请选择" data-th-initValue="${entity?.finprodType}"
                           data-th-data-result="${FINPROD_TYPE}" allowClear="true">
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">
                    <i class="iconfont must" style="display: inline;">*</i>
                    资产代码
                </label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="busiId" name="busiId" class="layui-input form-input input-lenovoselect"
                           data-th-placeholder="#{SysCommon.placeholder}" data-th-data-url="@{/valuation/accounadjustmanage/manualvoucher/ValManualVoucher003/getBusiId}"
                           data-parentids="finprodType,booksetId"
                           data-idfield="shortName" data-keyfield="code" data-th-data-effectivefieldsalias='|{"code":"#{ValManualVoucher.busiId}","shortName":"#{ValManualVoucher.busiName}"}|'
                           data-th-value="${entity?.busiId}">
                </div>
            </div>
        </div>
        <div class="layui-form-item">

            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable" style="dispaly: inline-block;line-height:15px">
                    自定义现<br/>金流编号
                </label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="cashId" name="cashId" class="layui-input form-input"
                           data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.cashId}" >
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">
                    <i class="iconfont must" style="display: inline;">*</i>
                    记账顺序
                </label>
                <div class="layui-input-inline input-inline">
                    <input id="accountOrder" name="accountOrder" class="layui-input form-input input-select"
                           placeholder="请选择" data-th-initValue="${entity?.accountOrder}"
                           data-th-data-result="${ACCOUNT_ORDER}" allowClear="true">
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-label-wrap" >摘要</label>
                <div class="input-inline layui-input-block">
                    <input type="text" id="bookRemark" name="bookRemark" class="layui-input form-input"
                           data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.bookRemark}">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md4" id="invAimDiv" style="display:none;">
                <label class="layui-form-label form-label-wrap"
                >投资目的</label>
                <div class="layui-input-inline input-inline">
                    <select  type="text" id="invAim" name="invAim"
                             class="layui-input form-input input-select" placeholder="请输入内容"
                             th:placeholder="#{SysCommon.placeholder}"
                             th:data-result='${INV_AIM}'
                             allowClear="true" formatoption="true"
                             th:initValue="${entity?.invAim}"></select>
                </div>
            </div>
        </div>

    </form>

    <input type="text" id="workflowId" name="workflowId" class="layui-input form-input" data-th-value="${workflowId}" disabled="disabled" style = "display:none;">

    <form class="layui-form joyin-form-wrap" id="listForm">
        <div>
            <table class="layui-table" id="ValManualVoucher002_table"></table>
        </div>
    </form>

</div>
</body>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/accounadjustmanage/manualvoucher/ValManualVoucher002.js}" type="text/javascript"></script>
</div>

</html>
