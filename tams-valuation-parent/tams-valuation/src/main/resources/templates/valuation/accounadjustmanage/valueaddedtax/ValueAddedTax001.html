<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ValueAddedTax001}">增值税台账</title>
<script th:inline="javascript">
    var isInit = [[${isInit}]];
    var yearDateInit = [[${yearDateInit}]];
    var declarDateInit =  [[${declarDateInit}]];
</script>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area">
            <a id="ValueAddedTaxQuery001_btn_create" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.build}">生成</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 col-inline">
                    <label class="layui-form-label form-lable"> 年份</label>
                    <div class="layui-input-block input-inline">
                    	<input type="text" class="layui-input form-input" id="yearDate" name="yearDate" data-th-value="${yearDate}"
                                placeholder="请选择年份">
<!--                       <select id="yearDate" name="yearDate" class="input-select" th:data-result="${yearDates}" -->
<!--                                    th:initValue="${yearDateInit}"   placeholder="请选择" allowClear="true" required><option></option></select> -->
                    </div>
<!--                     <div class="layui-input-inline input-inline"> -->
<!--                         <select type="text" id="yearDate" class="layui-input form-input input-select" -->
<!--                             placeholder="请选择" data-th-data-result="${YEAR_DATE}" -->
<!--                              allowClear="true"> -->
<!--                              <option></option> -->
<!--                          </select> -->
<!--                     </div> -->
                </div>
                <div class="layui-inline layui-col-md3 col-inline">
                    <label class="layui-form-label form-lable"> 申报期 </label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="declarDate" class="layui-input form-input input-select"
                            placeholder="请选择" data-th-data-result="${DECLAR_DATE}" data-th-initValue = "${declarDateInit}"
                             allowClear="true" required>
                             <option></option>
                         </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md5 col-inline">
                    <label class="layui-form-label form-lable">汇总维度</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="sumDimen" name="sumDimen"
                            class="layui-input form-input input-checkbox" data-th-data-result="${SUM_DIMEN}"
                            data-th-initValue='${sumDimen}' required>
                    </div>
                </div>             
            </div>
        </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script
            data-th-src="@{/js/valuation/accounadjustmanage/valueaddedtax/ValueAddedTax001.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
