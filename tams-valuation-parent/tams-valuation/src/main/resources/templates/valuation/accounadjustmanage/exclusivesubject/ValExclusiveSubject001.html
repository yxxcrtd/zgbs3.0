<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>专属科目设置</title>
<link rel="stylesheet" type="text/css" data-th-href="@{/css/font/iconfont.css}">
</head>

<body>
<div layout:fragment="content">
  <div class="layui-col-md12" style="margin:10px 0;">
    <a id="ValExclusiveSubject001_btn_add" class="layui-btn layui-btn-sm"><i class="iconfont icon-found"></i><span>新建</span></a>
    <!-- <a id="ValExclusiveSubject001_btn_copy" class="layui-btn layui-btn-sm"><i class="iconfont icon-fuzhi"></i><span>复制</span></a> -->
    <a id="ValExclusiveSubject001_btn_delete" class="layui-btn layui-btn-sm"><i class="iconfont icon-delete"></i><span>删除</span></a>
    <!-- <a id="ValExclusiveSubject001_btn_export" class="layui-btn layui-btn-sm"><i class="iconfont icon-export"></i><span>导出</span></a> -->
    <a id="ValExclusiveSubject001_btn_filter" class="layui-btn layui-btn-sm btn-filter"><i class="iconfont icon-btn-filter"></i><span>筛选</span></a>
  </div>
  <form class="layui-form joyin-form-wrap joyin-filter-form" id="searchForm" style="display: none;">
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">产品</label>
        <div class="layui-input-inline input-inline">
          <input type="text"  class="layui-input form-input input-lenovoselect" placeholder="请选择产品或输入关键词" value="" data-url="/system/institution/SysInstitution001/getInstitutionCode" data-idfield="code" data-keyfield="code" data-effectivefieldsalias='{&quot;code&quot;:&quot;产品代码&quot;,&quot;shortName&quot;:&quot;产品名称&quot;}'>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">所属账套</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;账套1&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;账套2&quot;,&quot;col&quot;:&quot;&quot;}]'>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">上级科目</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;1201&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;1502&quot;,&quot;col&quot;:&quot;&quot;}]'>
        </div>
      </div>
    </div>
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">科目级别</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;1级&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;2级&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;03&quot;,&quot;text&quot;:&quot;3级&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;04&quot;,&quot;text&quot;:&quot;4级&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;05&quot;,&quot;text&quot;:&quot;5级&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;06&quot;,&quot;text&quot;:&quot;6级&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;07&quot;,&quot;text&quot;:&quot;7级&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;08&quot;,&quot;text&quot;:&quot;8级&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;09&quot;,&quot;text&quot;:&quot;9级&quot;,&quot;col&quot;:&quot;&quot;}
        ]'>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <a class="layui-btn layui-btn-sm"><i class="iconfont icon-search"></i><span>&nbsp;&nbsp;查询</span></a>
        <a class="layui-btn layui-btn-sm"><i class="iconfont icon-reset"></i><span>&nbsp;&nbsp;重置</span></a>
      </div>
    </div>
  </form>
  <div id="dataTable"></div>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/valuation/accounadjustmanage/exclusivesubject/ValExclusiveSubject001.js}" type="text/javascript"></script>
</div>
</body>
</html>
