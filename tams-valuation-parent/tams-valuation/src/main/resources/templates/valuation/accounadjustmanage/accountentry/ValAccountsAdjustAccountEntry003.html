<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>新建会计分录</title>
</head>
<body>
</body>
<div layout:fragment="content">
  <input type="hidden" id="hasSub" data-th-value="${hasSub }" />
  <input type="hidden" id="ACCOUNTEVENTS" data-th-value="${ACCOUNTEVENTS }" />
  <form class="layui-form joyin-form-wrap" style="padding:10px 0;" id="submitForm">
     <input type="hidden" name="level" id="level" data-th-value="${level }" />
     <input type="hidden" name="booksetId" id="booksetId" data-th-value="${booksetId }" />
     <input type="hidden" name="sceneNodeId" id="sceneNodeId" data-th-value="${sceneNodeId }" />
     <input type="hidden" name="tableId" id="tableId" data-th-value="${tableId }" />
     <input type="hidden" name="updateTimeLong" id="updateTimeLong" data-th-value="${updateTimeLong }" />
     
     <div class="layui-form-item">
          <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>上级节点</label>
          <div class="layui-input-block input-inline">
              <select id="fsceneNodeid" name="fsceneNodeid" class="input-select" th:data-result="${FSCENE_NODEID}"
                     th:initValue="${fSceneNodeId}"      placeholder="请选择" allowClear="true" required><option></option></select>
          </div>
      </div>
      <div class="layui-form-item">
	          <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>影响记账元素</label>
	          <div class="layui-input-block input-inline">
	            <select id="nodeId" name="nodeId" class="input-select" th:data-result="${nodeIds}"
	                       th:initValue="${entity?.nodeId}"    placeholder="请选择" allowClear="true" required><option></option><option></option></select>
	          </div>
      </div>
      <div class="layui-form-item">
	      <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>值域</label>
	      <div class="layui-input-block input-inline">
	         <select id="nodeValue" name="nodeValue" class="input-select" th:data-result="${tableIds}"
	                 th:initValue="${entity?.nodeValue}"   placeholder="请选择" allowClear="true" required><option></option></select>
	      </div>
      </div>
      <div class="layui-form-item">
	        <label class="layui-form-label form-lable2">备注</label>
	        <div class="layui-input-block input-inline">
	          <textarea name="remark" id="remark" data-th-text="${entity?.remark}" class="layui-textarea"></textarea>
	        </div>
      </div>
      <div class="layui-form-item">
      		<label class="layui-form-label form-lable2">同时生成该节点<br>的所有其他分录</label>
	        <div class="layui-input-block input-inline">
                <input type="checkbox" id="isGen" name="isGen" lay-skin="switch" lay-text="是|否">
            </div>
      </div>
      <div class="layui-form-item">
	      	<div class="fieldsetDiv">
                <fieldset>
                    <legend>会计分录配置</legend>
                    <div class="form-group">
                        <a id="ValAccountsAdjustAccountEntry003_btn_add" class="layui-btn layui-btn-sm"><i class="iconfont icon-found"></i><span>新建</span></a>
                    	<table class="layui-table" id="ValAccountsAdjustAccountEntry003_dataTable"></table>
                    </div>
                </fieldset>
            </div>
      </div>
  </form>
  <div class="layui-col-md11" style="margin:10px;">
   	<div class="text-center">
        <a id="ValAccountsAdjustAccountEntry003_btn_save" class="layui-btn layui-btn-sm btn-save">提交</a>
        <a id="ValAccountsAdjustAccountEntry003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
    </div>
   </div>
</div>
<div layout:fragment="script">
<script data-th-src="@{/js/valuation/accounadjustmanage/accountentry/ValAccountsAdjustAccountEntry003.js}" type="text/javascript"></script>
</div>
</html>
