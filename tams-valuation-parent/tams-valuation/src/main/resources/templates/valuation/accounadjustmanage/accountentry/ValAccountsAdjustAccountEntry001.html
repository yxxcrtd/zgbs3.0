<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>会计分录管理</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area" export="false">
<!--             <a id="ValAccountsAdjustAccountEntry001_btn_add" class="layui-btn layui-btn-sm"> -->
<!--                 <i class="iconfont icon-found"></i> -->
<!--                 <span>新建</span> -->
<!--             </a> -->
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">所属账套</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="booksetId" name="booksetId"
                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{getBooksetId}"
                                childrenIds="tableId"
                                data-idfield="code" data-keyfield="code" required
                                data-th-data-effectivefieldsalias='|{"code":"#{ValSubjectSet001.booksetId}","shortName":"#{ValSubjectSet001.booksetName}"}|'>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable2">场景模块</label>
                        <div class="layui-input-inline input-inline">
                            <select id="tableId" name="tableId" class="layui-input form-input input-select"
                                parentIds="booksetId"
                                placeholder="请选择"
                                data-th-data-url="@{/valuation/accounadjustmanage/accountentry/ValAccountsAdjustAccountEntry001/findTableIds}"
                                allowClear="true">
                            </select>
<!--                        <select id="tableId" type="text" name="tableId" class="layui-input form-input input-select"
                                placeholder="请选择" data-th-data-result="${FIND_TABLEIDS}" allowClear="true">
                                <option></option>
                            </select> -->
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="treeTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/accounadjustmanage/accountentry/ValAccountsAdjustAccountEntry001.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
