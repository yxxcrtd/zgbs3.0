<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{TaxFlowQuery001}">计税流水表查询</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area"></div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
               <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">所属账套</label>
                    <div class="layui-input-inline input-inline">
                        <select id="booksetId" name="booksetId" class="layui-input form-input input-select" 
                                    data-th-data-url="@{/valuation/accounadjustmanage/taxflowquery/TaxFlowQuery001/getBooksetId}" 
                                    multiple="multiple"
                                  allowClear="true" placeholder="请输入内容">
                        </select>
                    </div>
                </div>           
<!--                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">资产代码</label>
                    <div class="layui-input-inline input-inline">                  
                            <input type="text" id="bokDetailId" name="bokDetailId" class="layui-input form-input"
                            placeholder="请输入内容">                      
                    </div>
                </div>  -->
                
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">资产代码</label>
                    <div class="layui-input-inline input-inline">
                      <input type="text" id="bokDetailId" name="bokDetailId" class="layui-input form-input" placeholder="请输入">
                    </div>
                </div>
              <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">发生日期</label>
                    <div class="layui-input-inline input-inline">
                      <input type="text" id="happenDate" name="happenDate" placeholder="请选择、支持区间" class="layui-input form-input input-dateRangeSelect" allowClear="true">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
            
                 <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">资产分类</label>
                    <div class="layui-input-inline input-inline">                 
                      <input type="text" id="finType" name="finType" class="layui-input form-input input-select" placeholder="请选择" 
                      data-th-data-result="${TAX_ASSET_TYPE}" allowClear="true" multiple="multiple" >
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">收入类型</label>
                    <div class="layui-input-inline input-inline">                                                                 
                     <input type="text" id="vatType" name="vatType" class="layui-input form-input input-select" placeholder="请选择" 
                      data-th-data-result="${VAT_TYPE}" allowClear="true" multiple="multiple" >
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">应税标识</label>
                    <div class="layui-input-inline input-inline">                                     
                    <input type="text" id="calcType" name="calcType" class="layui-input form-input input-select" placeholder="请选择" 
                      data-th-data-result="${TAXABLE_SIGN}" allowClear="true" multiple="multiple" >
                    </div>
                </div>
            </div>
              <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                 <label class="layui-form-label form-lable">业务类型</label>
                 <div class="layui-input-inline input-inline">                                     
                    <input type="text" id="taxPType" name="taxPType" class="layui-input form-input input-select" placeholder="请选择" 
                      data-th-data-result="${TAX_P_TYPE}" allowClear="true" multiple="multiple" >
                    </div>
                </div>
              </div>
        </form>
    </div>
    <table class="layui-table" id="dataTable"></table>
</div>
    <div layout:fragment="script">
        <script
            data-th-src="@{/js/valuation/accounadjustmanage/taxflowquery/TaxFlowQuery001.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
