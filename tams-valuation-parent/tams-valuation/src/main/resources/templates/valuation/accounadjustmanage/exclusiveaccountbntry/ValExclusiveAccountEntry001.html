<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>专属会计分录设置</title>
<link rel="stylesheet" type="text/css" data-th-href="@{/css/font/iconfont.css}">
</head>

<body>
<div layout:fragment="content">
  <div class="layui-col-md12" style="margin:10px 0;">
    <a id="ValExclusiveAccountEntry001_btn_add" class="layui-btn layui-btn-sm"><i class="iconfont icon-found"></i><span>新建</span></a>
    <a id="ValExclusiveAccountEntry001_btn_addchild" class="layui-btn layui-btn-sm"><i class="iconfont icon-fuzhi1"></i><span>添加子节点</span></a>
    <a id="ValExclusiveAccountEntry001_btn_copy" class="layui-btn layui-btn-sm"><i class="iconfont icon-fuzhi"></i><span>复制</span></a>
    <a id="ValExclusiveAccountEntry001_btn_delete" class="layui-btn layui-btn-sm"><i class="iconfont icon-delete"></i><span>删除</span></a>
    <!-- <a id="ValExclusiveAccountEntry001_btn_export" class="layui-btn layui-btn-sm"><i class="iconfont icon-export"></i><span>导出</span></a> -->
    <a id="ValExclusiveAccountEntry001_btn_filter" class="layui-btn layui-btn-sm btn-filter"><i class="iconfont icon-btn-filter"></i><span>筛选</span></a>
  </div>
  <form class="layui-form joyin-form-wrap joyin-filter-form" id="searchForm" style="display: none;">
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">产品</label>
        <div class="layui-input-inline input-inline">
          <input type="text"  class="layui-input form-input input-lenovoselect" placeholder="请选择产品或输入关键词" value="" data-url="/system/institution/SysInstitution001/getInstitutionCode" data-idfield="code" data-keyfield="code" data-effectivefieldsalias='{&quot;code&quot;:&quot;产品代码&quot;,&quot;shortName&quot;:&quot;产品名称&quot;}'>
        </div>
      </div>
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable2">所属账套</label>
        <div class="layui-input-inline input-inline">
        <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;账套1&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;账套2&quot;,&quot;col&quot;:&quot;&quot;}]'>
        </div>
      </div>
    </div>
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable2">场景模块</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;1201&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;1502&quot;,&quot;col&quot;:&quot;&quot;}]'>
        </div>
      </div>
      <div class="layui-inline layui-col-md6">
        <a class="layui-btn layui-btn-sm"><i class="iconfont icon-search"></i><span>&nbsp;&nbsp;查询</span></a>
        <a class="layui-btn layui-btn-sm"><i class="iconfont icon-reset"></i><span>&nbsp;&nbsp;重置</span></a>
      </div>
    </div>
  </form>
  <div id="treeTable"></div>
</div>
<div layout:fragment="script">
<script type="text/javascript" data-th-inline="javascript">
	// 树形表格
     $(function() {
         $("#treeTable").joyintable({
             ajax: {
                 url: /*[[@{/js/valuation/accounadjustmanage/exclusiveaccountbntry/data.json}]]*/,
                 type: 'get',
                 data: function() {
                     return {};
                 }
             }
             ,tree:true
             ,searchOnInit:true
             ,treeId:'sd_id'//树形id字段名称
             ,treeUpId:'sd_up_id'//树形父id字段名称
             ,treeShowName:'sd_fzjd'//以树形式显示的字段
             ,cols:[
                    {field:'sd_fzjd', edit:'text',width:'200', title: '分支节点'},
                    {field:'sd_yxjzys', edit:'text',width:'300', title: '影响记账元素'},
                    {field:'sd_yxjzysmc', edit:'text',width:'300', title: '影响记账元素名称'},
                    {field:'sd_yszdm', edit:'text',width:'150', title: '元素值代码'},
                    {field:'sd_yszmc', edit:'text',width:'300', title: '元素值名称'},
                    {field:'sd_bhfl', edit:'text',width:'90', title: '是否包含分录'},
                   {fixed:'right', title: '操作', width:120, align:'center', type:'action', buttons: ['copy','addchild','edit','delt']}
             ]
         });
     });
</script>
<script data-th-src="@{/js/valuation/accounadjustmanage/exclusiveaccountbntry/ValExclusiveAccountEntry001.js}" type="text/javascript"></script>
</div>
</body>
</html>
