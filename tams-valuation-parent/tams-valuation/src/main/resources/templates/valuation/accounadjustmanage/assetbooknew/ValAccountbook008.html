<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{ValAccountbook008}">新建会计分录配置</title>
</head>

<body>
<div layout:fragment="content">
  <div layout:fragment="content">
  <form id="submitForm">
    <div class="layui-form" style=" margin-top:10px;">
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>所属账套</label>
        <div class="layui-input-block input-inline">
          <input type="text"  class="layui-input form-input input-lenovoselect" placeholder="请选择产品或输入关键词" value="" data-url="/system/institution/SysInstitution001/getInstitutionCode" data-idfield="code" data-keyfield="code" data-effectivefieldsalias='{&quot;code&quot;:&quot;账套代码&quot;,&quot;shortName&quot;:&quot;账套名称&quot;}'>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>科目</label>
        <div class="layui-input-block input-inline">
          <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;科目名称1&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;科目名称2&quot;,&quot;col&quot;:&quot;&quot;}]'>
          <!--<input type="text" class="layui-input form-input" value="选产品代码自动代入名称"> -->
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>借贷方向</label>
        <div class="layui-input-block  input-inline">
          <input name="status" type="text" class="layui-input form-input input-checkbox" id="status" data-result='[{&quot;id&quot;:&quot;SR&quot;,&quot;text&quot;:&quot;贷方&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;ZC&quot;,&quot;text&quot;:&quot;借方&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;SZ&quot;,&quot;text&quot;:&quot;借贷双方&quot;,&quot;col&quot;:&quot;&quot;}]' initValue='DF'>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>金额元素</label>
        <div class="layui-input-block  input-inline">
          <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;核算数量&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;划款金额&quot;,&quot;col&quot;:&quot;&quot;}]'>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2">记账网点</label>
        <div class="layui-input-block  input-inline">
          <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;资管网点&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;金融市场网点&quot;,&quot;col&quot;:&quot;&quot;}]'>
        </div>
      </div>
    </div>
  </form>
  <div class="layui-col-md11" style="margin:10px;">
   	<div class="text-center">
        <a id="ValAccountingEntry003_btn_save" class="layui-btn layui-btn-sm btn-save">保存</a>
        <a id="ValAccountingEntry003_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
        <a id="ValAccountingEntry003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
    </div>
   </div>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script>
</div>
</body>
</html>
