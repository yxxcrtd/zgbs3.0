<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{ValAccountbook003}">新建账套分组</title>
</head>

<body>
<div layout:fragment="content">
  <form id="submitForm">
    <div class="layui-form layui-clear" style="margin-top: 10px;">
      <div class="layui-form-item">
        <strong><i class="iconfont must">*</i>账套组名称</strong>
        <p><input type="text" id="ValAssetBook002_id" class="layui-input form-input" placeholder="请输入关键词" value=""></p>
      </div>
      <div class="layui-form-item">
      <table width="350" border="0" cellpadding="0" cellspacing="0">
        <tr>
          <td width="150" valign="top">
            <strong>未选</strong>
            <p><input type="text" name="unsearch" id="unsearch" class="layui-input form-input" style="width:150px;"></p>
            <select name="unselected" size="12" multiple id="unselected" style="width:150px; display:block;">
              <option value="zt001">账套M1</option>
              <option value="zt002">账套M2</option>
              <option value="zt003">账套M3</option>
              <option value="zt004">账套M4</option>
              <option value="zt005">账套M5</option>
              <option value="zt006">账套M6</option>
            </select>
          </td>
          <td width="50" align="center" valign="middle"><input type="submit" name="button" id="button" value="&lt;&lt;"><br><br><input type="submit" name="button" id="button" value="&gt;&gt;"></td>
          <td width="150" valign="top">
            <strong>已选</strong>
            <p><input type="text" name="searched" id="searched" class="layui-input form-input" style="width:150px;"></p>
            <select name="selected" size="12" multiple id="selected" style="width:150px; display:block;">
              <option value="zt001">账套M1</option>
              <option value="zt002">账套M2</option>
              <option value="zt003">账套M3</option>
              <option value="zt004">账套M4</option>
              <option value="zt005">账套M5</option>
              <option value="zt006">账套M6</option>
            </select>
          </td>
        </tr>
      </table>
      </div>
    </div>
  </form>
  <div class="layui-col-md11" style="margin:10px 0 10px 0;">
    <div class="text-center">
      <a id="ValAssetBook002_btn_save" class="layui-btn layui-btn-sm btn-save">保存</a>
      <a id="ValAssetBook002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
      <a id="ValAssetBook002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
    </div>
  </div>
</div>
<div layout:fragment="script"> 
  <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script>
</div>
</body>
</html>
