<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<title>深证通对账结果明细界面</title>
</head>
<body>
	<div layout:fragment="content">
		<div class="form-button-area" export="false">
	    </div>
		<div class="joyin-form-wrap joyin-filter-form condition-area">
			<form class="layui-form" id="searchForm">
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">产品</label>
						<div class="layui-input-inline input-inline">
							<select id="fundId" name="fundId"
								class="layui-input form-input input-select"
								data-th-data-url="@{/valuation/accounadjustmanage/valsztinterfcommon/ValSztInterfCommon001/getFinprodId}"
								allowClear="true" placeholder="请输入内容" formatoption="true">
							</select>
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">关联流水号</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="refNo" name="refNo" class="layui-input form-input" placeholder="请输入">
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">对账类型</label>
						<div class="layui-input-inline input-inline">
							<select id="checkFlag" name="checkFlag"
								class="layui-input form-input input-select" placeholder="请选择"
								data-th-data-result="${CHECK_FLAG}" allowClear="true"><option></option></select>
						</div>
					</div>
				</div>
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">对账状态</label>
						<div class="layui-input-inline input-inline">
							<select id="checkStatus" name="checkStatus"
								class="layui-input form-input input-select" placeholder="请选择"
								data-th-data-result="${SZT_CHECK_STATUS}" allowClear="true"><option></option></select>
						</div>
					</div>
				</div>
			</form>
		</div>
		<div>
			<table class="layui-table" id="dataTable"></table>
		</div>
	</div>


	<div layout:fragment="script">
		<script
			data-th-src="@{/js/valuation/accounadjustmanage/valsztinterfdetail/ValSztInterfDetail001.js}"
			type="text/javascript"></script>
	</div>
</body>

</html>
