<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>新建专属科目</title>
</head>
<body>

</body>
<div layout:fragment="content">
  <form id="submitForm">
    <div class="layui-form layui-clear" style=" margin-top:10px;">
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>产品代码</label>
        <div class="layui-input-block input-inline2">
          <input type="text"  class="layui-input form-input input-lenovoselect" placeholder="请选择产品或输入关键词" value="" data-url="/system/institution/SysInstitution001/getInstitutionCode" data-idfield="code" data-keyfield="code" data-effectivefieldsalias='{&quot;code&quot;:&quot;产品代码&quot;,&quot;shortName&quot;:&quot;产品名称&quot;}'>
        </div>
      </div>
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable2">产品名称</label>
        <div class="layui-input-block input-inline2">
          <input type="text" class="layui-input form-input" value="选择产品代码自动代入">
        </div>
      </div>
    </div>
    <div class="layui-form layui-clear" style=" margin-top:10px;">
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>所属账套</label>
        <div class="layui-input-block input-inline2">
          <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;账套1&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;账套2&quot;,&quot;col&quot;:&quot;&quot;}]'>
        </div>
      </div>
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable2">上级科目</label>
        <div class="layui-input-block input-inline2">
          <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;1201&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;1502&quot;,&quot;col&quot;:&quot;&quot;}]'>
        </div>
      </div>
    </div>
    <div class="layui-form layui-clear" style=" margin-top:10px;">
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>科目号</label>
        <div class="layui-input-block  input-inline2">
          <input type="text" class="layui-input form-input" value="">
        </div>
      </div>
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>科目名称</label>
        <div class="layui-input-block  input-inline2">
          <input type="text" class="layui-input form-input" value="">
        </div>
      </div>
    </div>
    <div class="layui-form layui-clear" style=" margin-top:10px;">
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>科目类型</label>
        <div class="layui-input-block  input-inline2">
          <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[
          {&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;资产类&quot;,&quot;col&quot;:&quot;&quot;},
          {&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;负债类&quot;,&quot;col&quot;:&quot;&quot;},
          {&quot;id&quot;:&quot;03&quot;,&quot;text&quot;:&quot;损益类&quot;,&quot;col&quot;:&quot;&quot;},
          {&quot;id&quot;:&quot;04&quot;,&quot;text&quot;:&quot;所有者权益类&quot;,&quot;col&quot;:&quot;&quot;},
          {&quot;id&quot;:&quot;05&quot;,&quot;text&quot;:&quot;资产负债共同类&quot;,&quot;col&quot;:&quot;&quot;},
          {&quot;id&quot;:&quot;06&quot;,&quot;text&quot;:&quot;表外科目&quot;,&quot;col&quot;:&quot;&quot;},
          {&quot;id&quot;:&quot;07&quot;,&quot;text&quot;:&quot;登记簿类&quot;,&quot;col&quot;:&quot;&quot;}
         ]'>
        </div>
      </div>
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable2">科目性质</label>
        <div class="layui-input-block  input-inline2">
          <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[
          {&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;性质1&quot;,&quot;col&quot;:&quot;&quot;},
          {&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;性质2&quot;,&quot;col&quot;:&quot;&quot;},
          {&quot;id&quot;:&quot;03&quot;,&quot;text&quot;:&quot;性质3&quot;,&quot;col&quot;:&quot;&quot;}
         ]'>
        </div>
      </div>
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>余额方向</label>
        <div class="layui-input-block  input-inline2">
          <input type="text" id="status" name="status" class="layui-input form-input input-checkbox" data-result='[{&quot;id&quot;:&quot;DF&quot;,&quot;text&quot;:&quot;贷方&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;JF&quot;,&quot;text&quot;:&quot;借方&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;JD&quot;,&quot;text&quot;:&quot;借贷双方&quot;,&quot;col&quot;:&quot;&quot;}]'
          initValue='JF'>
        </div>
      </div>
    </div>
    <div class="layui-form layui-clear" style=" margin-top:10px;">
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>收支方向</label>
        <div class="layui-input-block  input-inline2">
          <input name="status" type="text" class="layui-input form-input input-checkbox" id="status" data-result='[{&quot;id&quot;:&quot;SR&quot;,&quot;text&quot;:&quot;收入&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;ZC&quot;,&quot;text&quot;:&quot;支出&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;SZ&quot;,&quot;text&quot;:&quot;收支双方&quot;,&quot;col&quot;:&quot;&quot;}]' initValue='DF'>
        </div>
      </div>
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>未实现损益</label>
        <div class="layui-input-block  input-inline2">
          <input type="checkbox" name="sunyi" lay-skin="switch" value="02" lay-text="是|否">
        </div>
      </div>
    </div>
    <div class="layui-form layui-clear" style=" margin-top:10px;">
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>是否核算数量</label>
        <div class="layui-input-block  input-inline2">
          <input type="checkbox" name="hssl" lay-skin="switch" value="02" lay-text="是|否">
        </div>
      </div>
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>自动生成子科目</label>
        <div class="layui-input-block  input-inline2">
          <input type="checkbox" name="zdsc" lay-skin="switch" value="02" lay-text="是|否">
        </div>
      </div>
    </div>
    <div class="layui-form layui-clear" style=" margin-top:10px;">
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2">备注</label>
        <div class="layui-input-block input-inline2">
           <textarea name="remark" class="layui-textarea" placeholder="请输入内容" style="width:90%;height:80px;"></textarea>
        </div>
      </div>
    </div>
  </form>
  <div class="layui-col-md11" style="margin:10px;">
   	<div class="text-center">
<!--         <a id="ValExclusiveSubject002_btn_save" class="layui-btn layui-btn-sm btn-save">保存</a> -->
        <a id="ValExclusiveSubject002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
        <a id="ValExclusiveSubject002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
    </div>
   </div>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script>
</div>
</html>
