<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{CashFlowsStatement001}">现金流量表查询</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area"></div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm" autocomplete="off">
                <div class="layui-form-item">
                    <!--<div class="layui-inline layui-col-md3">
                        <label class="layui-form-label form-lable2" data-th-text="#{CashFlowsStatement001.booksetId}">账套代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="booksetId" name="booksetId"
                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/valuation/accounadjustmanage/cashflowsstatement/CashFlowsStatement001/getBooksetId2}"
                                data-idfield="code" data-keyfield="code"
                                data-th-data-effectivefieldsalias='|{"code":"#{CashFlowsStatement001.booksetId}","shortName":"#{CashFlowsStatement001.booksetName}"}|'
                                required data-th-Value="${finprodId}">
                        </div>
                    </div>-->
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable" >报表维度</label>
                        <div class="layui-input-inline input-inline" >
                              <input type="text" id="reportDimen" name="reportDimen" 
                                class="layui-input form-input input-checkbox" required="required"
                               data-th-data-result="${BATCH_BOOKSET_TYPE}" data-th-initvalue="${reportDimen}" allowClear="true">
                        </div>
                    </div>
                <div class="layui-inline layui-col-md4" id="c_booksetGroup">
                    <label class="layui-form-label form-lable" >账套组</label>
                    <div class="layui-input-inline input-inline">
                          <select id="booksetGroup" name="booksetGroup"
                              class="layui-input form-input input-select" allowClear="true" formatoption = "false"
                              placeholder="请选择" required="required"
                              data-th-data-url='@{/valuation/accounadjustmanage/cashflowsstatement/CashFlowsStatement001/findBooksetGroup}'>
                          </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4" id="c_booksetId">
                    <label class="layui-form-label form-lable" >账套</label>
                    <div class="layui-input-inline input-inline">
                          <select id="booksetId" name="booksetId"
                              class="layui-input form-input input-select" allowClear="true"
                              placeholder="请选择" required="required"
                              data-th-data-url='@{/valuation/accounadjustmanage/cashflowsstatement/CashFlowsStatement001/findBooksetId}'>
                          </select>
                    </div>
                </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">筛选条件</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" class="layui-input form-input input-select" id="reportTermType"
                                name="reportTermType" placeholder="请选择报表期限类型" allowClear="true"
                                data-th-data-result="${REPORT_TERM_TYPE}" childrenIds="reportTerm" required>
                                <option></option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <div class="layui-input-inline input-inline" id="c_year_reportDate" style="display: none;">
                            <input type="text" class="layui-input form-input" id="year_reportDate" name="reportDate"
                                placeholder="请选择日期">
                        </div>
                        <div class="layui-input-inline input-inline" id="c_month_reportDate" style="display: none;">
                            <input type="text" class="layui-input form-input" id="month_reportDate" name="reportDate"
                                placeholder="请选择日期">
                        </div>
                        <div class="layui-input-inline input-inline" id="c_date_reportDate" style="display: none;">
                            <input type="text" class="layui-input form-input" id="date_reportDate" name="reportDate"
                                placeholder="请选择日期">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md3" style="display: none;">
                        <label class="layui-form-label form-lable">上期维度</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" class="layui-input form-input input-select" id="lastDimen"
                               name="lastDimen" placeholder="请选择上期维度" allowClear="true" data-th-initvalue="${LAST_DIMEN_01}"
                               data-th-data-result="${LAST_DIMEN}" required> 
                    	    </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md3" id="c_reportTerm" style="display: none;">
                    	<label class="layui-form-label form-lable">期限</label>
                        <div class="layui-input-inline input-inline">
		                    <select type="text" class="layui-input form-input input-select" id="reportTerm" 
		                        name="reportTerm" placeholder="请选择期限" allowClear="true" data-url="getTermLink"
		                        parentIds="reportTermType" required>
		                        <option></option>
		                    </select>
	                    </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <h2 style="text-align: center; font-weight: bold;">现金流量表</h2>
                </div>
            </div>
            <div class="layui-row">
                <div class="layui-col-md2 layui-col-md-offset0" id="org">编制单位：</div>
                <div class="layui-col-md2 layui-col-md-offset8" id="statementType">报表类型：</div>
            </div>
            <div class="layui-row">
                <div class="layui-col-md2 layui-col-md-offset0" id="statementDate">统计日期：</div>
                <div class="layui-col-md2 layui-col-md-offset8">单位： 元</div>
            </div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/accounadjustmanage/cashflowsstatement/CashFlowsStatement001.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
