<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{BokBalanceStatementQuery001}">余额表查询</title>
<script th:inline="javascript">
    var isInit = [[${isInit}]];
</script>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area">
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable2" data-th-text="#{ValBalanceStatementQuery001.booksetId}">账套代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="booksetId" name="booksetId"
                            class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                            data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-data-url="getBooksetId2"
                            data-idfield="code" data-keyfield="code"
                            data-th-data-effectivefieldsalias='|{"code":"#{ValBalanceStatementQuery001.booksetId}","shortName":"#{ValBalanceStatementQuery001.booksetName}"}|'
                            required
                            data-th-Value="${finprodId}"
                            >
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">查询日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="balDate" name="balDate" placeholder="请选择日期"
                            class="layui-input form-input input-dateSelect" required
                            data-th-Value="${balDate}"
                            >
                    </div>
                </div>                
            </div>
        </form>
        </div>
        <div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <h2 style="text-align: center; font-weight: bold;">产品科目余额表</h2>
                </div>
            </div>
            <div class="layui-form-item" id="prodInfo" style="display: none;">
                <h3 id="prod" class="layui-inline layui-col-md6" style="text-align: right; padding-right: 1%;"></h3>
                <h3 id="valueDate" class="layui-inline layui-col-md5" style="text-align: left; padding-left: 1%;">
                </h3>
            </div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script
            data-th-src="@{/js/valuation/accounadjustmanage/bokbalancestatementquery/BokBalanceStatementQuery001.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
