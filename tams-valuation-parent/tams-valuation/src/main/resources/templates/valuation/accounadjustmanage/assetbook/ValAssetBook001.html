<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="utf-8">
    <title data-th-text="#{ValAssetBook001}">账套管理</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area" export="false">
        <!--             <a id="ValAssetBook001_btn_add" class="layui-btn layui-btn-sm"> -->
        <!--                 <i class="iconfont icon-found"></i> -->
        <!--                 <span>新建</span> -->
        <!--             </a> -->
        <!--        <a id="ValAssetBook001_btn_copy" class="layui-btn layui-btn-sm"><i class="iconfont icon-fuzhi"></i><span>复制</span></a> -->
        <a id="ValAssetBook001_btn_delete" class="layui-btn layui-btn-sm">
            <i class="iconfont icon-delete"></i>
            <span>删除</span>
        </a>
        <a id="ValAssetBook001_btn_modification" class="layui-btn layui-btn-sm">
            <i class="iconfont icon-customer-info"></i>
            <span>账套参数修改</span>
        </a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">账套类别</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="booksetType" name="booksetType"
                               class="layui-input form-input input-checkbox" data-th-data-result="${BOOKSET_TYPE}"
                               data-th-initValue='${defaultType}'>
                    </div>
                </div>
                <div class="layui-inline layui-col-md5">
                    <label class="layui-form-label form-lable">所属账套</label>
                    <div class="layui-input-inline input-inline">

                        <select id="ValAssetBook001_name" name="ValAssetBook001_name"
                                class="layui-input form-input input-select" parentIds = 'booksetType'
                                data-th-data-url="@{/valuation/accounadjustmanage/assetbook/ValAssetBook001/findBooksetIds}"
                                multiple="multiple" allowClear="true" placeholder="请输入内容">
                        </select>


                        <!--  <input type="text" id="ValAssetBook001_name" name="ValAssetBook001_name"
                           class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                           data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-data-url="@{getBooksetId}"
                           data-idfield="code" data-keyfield="code"
                           data-th-data-effectivefieldsalias='|{"code":"#{ValSubjectSet001.booksetId}","shortName":"#{ValSubjectSet001.booksetName}"}|'>
                       -->

                    </div>
                </div>

            </div>
        </form>
    </div>
    <div>
        <table id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
			var sysDate = /*[[${sysDate}]]*/'';
	</script>
    <script data-th-src="@{/js/valuation/accounadjustmanage/assetbook/ValAssetBook001.js}" type="text/javascript"></script>
</div>
</body>
</html>
