<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{ValAssetBook002}">新建账套管理</title>
<script th:inline="javascript">
	var hasVoucher = /*[[${hasVoucher}]]*/false;
</script>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" style="padding: 10px 0;" id="submitForm">
            <div class="layui-form-item" style="display: none">
                <input type="text" id="booksetSchemeId" name="booksetSchemeId" class="layui-input form-input "
                    data-th-value="${entity?.booksetSchemeId}">
                <input type="text" id="booksetTaxSchemeId" name="booksetTaxSchemeId" class="layui-input form-input "
                    data-th-value="${entity?.booksetTaxSchemeId}">
                <input type="text" id="booksetShadowPriceSchemeId" name="booksetShadowPriceSchemeId" class="layui-input form-input "
                    data-th-value="${entity?.booksetShadowPriceSchemeId}">
                <input type="text" id="bookSetDate"  class="layui-input form-input "
                    data-th-value="${entity?.bookSetDate}">
                <input type="text" id="oldStartDate"  class="layui-input form-input "
                    data-th-value="${initDate}">
                 <input type="text" id="oldEndDate"  class="layui-input form-input "
                    data-th-value="${endDate}">
                    
                <input type="text" id="workflowId" name="workflowId"  placeholder="流程 Id"
                            class="layui-input form-input" data-th-value="${workflowId}" >   
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable"><i class="iconfont must"> * </i> 账套代码 </label>
                    <div class="layui-input-block input-inline">
                        <input type="hidden" id="isEdit" name="isEdit" data-th-value="${entity?.isEdit}"> <input
                            type="text" id="booksetId" name="booksetId" class="layui-input form-input "
                            data-th-placeholder="#{SysCommon.placeholder}" data-th-disabled="${newOrEdit}"
                            data-th-value="${entity?.booksetId}">
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable"> <i class="iconfont must"> * </i> 账套全称
                    </label>
                    <div class="layui-input-block input-inline">
                        <input type="text" id="booksetFullname" name="booksetFullname" class="layui-input form-input "
                            data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.booksetFullname}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
             <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable"> <i class="iconfont must"> * </i> 账套名称
                    </label>
                    <div class="layui-input-block input-inline">
                        <input type="text" id="booksetName" name="booksetName" class="layui-input form-input "
                            data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.booksetName}">
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">账套类别</label>
                    <div class="layui-input-block input-inline">
                        <input type="text" id="booksetType" name="booksetType"
                            data-th-placeholder="#{SysCommon.placeholder}" class="layui-input form-input input-checkbox"
                            data-th-data-result='${BOOKSET_TYPE}' data-th-initValue="${entity?.booksetType}"data-th-disabled="${EditCheck}">
                    </div>
                </div>
                <!-- <div class="layui-inline layui-col-md6"> -->
                <!--                 <label class="layui-form-label form-lable">是否默认</label> -->
                <!--                 <div class="layui-input-block input-inline"> -->
                <!--                     <input type="text" id="isDefault" name="isDefault" -->
                <!--                         class="layui-input form-input input-checkbox" -->
                <!--                         data-th-data-result='${YES_OR_NO}'> -->
                <!--                 </div> -->
                <!-- </div> -->
                </div>
                <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">核算主体代码</label>
                    <div class="layui-input-block input-inline">
                        <input type="text" id="acctSubjectId" name="acctSubjectId" class="layui-input form-input"
                            data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.acctSubjectId}">
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">核算主体类别</label>
                    <div class="layui-input-block input-inline">
                    	 <input type="text" id="acctSubjectType" name="acctSubjectType"
                            data-th-placeholder="#{SysCommon.placeholder}" class="layui-input form-input input-select"
                            data-th-data-result='${FINPROD_TYPE}' data-th-initValue="${entity?.acctSubjectType}">
                    </div>
                </div>
                </div>
                <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">模板账套代码</label>
                    <div class="layui-input-block input-inline">
                        <input type="text" id="booksetIdTmpl" name="booksetIdTmpl" class="layui-input form-input"
                            data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.booksetIdTmpl}">
                    </div>
                </div>
            <!--             <div class="layui-form-item"> -->
            <!--                 <label class="layui-form-label form-lable">对币种规则</label> -->
            <!--                 <div class="layui-input-block input-inline"> -->
            <!--                     <input type="text" id="ValAssetBook002_type" name="status" -->
            <!--                         class="layui-input form-input input-checkbox" -->
            <!--                         data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;分币种记账&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;本币种记账&quot;,&quot;col&quot;:&quot;&quot;}]' -->
            <!--                         initValue='01'> -->
            <!--                 </div> -->
            <!--             </div> -->
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">会计准则</label>
                     <div class="layui-input-block input-inline">
                        <input type="text" id="acctStandard" name="acctStandard"
                            data-th-placeholder="#{SysCommon.placeholder}" class="layui-input form-input input-checkbox"
                            data-th-data-result='${ZJ}' data-th-initValue="${entity?.acctStandard}"data-th-disabled="${EditCheck}">
                    </div>                
                </div>
                </div>
                <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">本位币</label>
                    <div class="layui-input-block input-inline">
                        <input type="text" id="standardCcy" name="standardCcy"
                            class="layui-input form-input input-select" data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-data-result="${CCY}" data-th-initValue="${standardCcy}">
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">账套开始日</label>
                    <div class="layui-input-block input-inline">
                        <input class="layui-input form-input input-dateSelect" id="startDate" name="startDate"
                            data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${initDate}">
                    </div>
                </div>
                </div>
                <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">账套结束日</label>
                    <div class="layui-input-block input-inline">
                        <input class="layui-input form-input input-dateSelect" id="endDate" name="endDate"
                            data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${endDate}">
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">所属估值方案</label>
                    <div class="layui-input-block input-inline">
                        <select type="text" id="schemeId" name="schemeId" formatResult="{id:id}" th:disabled="${hasVoucher}"
                            class="layui-input form-input input-select" data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-initvalue="${entity?.schemeId}" data-th-data-url="@{/valuation/accounadjustmanage/assetbook/ValAssetBook002/getScheme}">
                            <option></option>
                        </select>
                    </div>
                </div>
            </div>
             <div class="layui-form-item">
                 <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">所属影子定价方案</label>
                    <div class="layui-input-block input-inline">
                        <select type="text" id="shadowPriceSchemeId" name="shadowPriceSchemeId" formatResult="{id:id}"
                            class="layui-input form-input input-select" data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-initvalue="${entity?.shadowPriceSchemeId}" data-th-data-url="@{/valuation/accounadjustmanage/assetbook/ValAssetBook002/getShadowPriceScheme}">
                            <option></option>
                        </select>
                    </div>
                </div>
                    <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">所属税务方案</label>
                    <div class="layui-input-block input-inline">
                        <select type="text" id="taxSchemeId" name="taxSchemeId" formatResult="{id:id}" th:disabled="${hasVoucher}"
                            class="layui-input form-input input-select" data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-initvalue="${entity?.taxSchemeId}" data-th-data-url="@{/valuation/accounadjustmanage/assetbook/ValAssetBook002/getTaxScheme}">
                            <option></option>
                        </select>
                    </div>
                </div>
             
             </div>
        </form>
        <div class="layui-col-md11" style="margin: 10px 0 10px 0;">
            <div class="text-center">
                <!--                 <a id="ValAssetBook002_btn_save" class="layui-btn layui-btn-sm btn-save">保存</a> -->
                <a id="ValAssetBook002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a> <a
                    id="ValAssetBook002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/valuation/accounadjustmanage/assetbook/ValAssetBook002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
