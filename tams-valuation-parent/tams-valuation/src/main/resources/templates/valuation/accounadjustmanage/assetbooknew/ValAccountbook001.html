<!doctype html>

<head>
<meta charset="utf-8">
<title data-th-text="#{ValAccountbook001}">账套管理(新)</title>
<link rel="stylesheet" type="text/css" data-th-href="@{/css/font/iconfont.css}">
<link rel="stylesheet" type="text/css" data-th-href="@{/css/valuation/common.css}">
</head>

<body>
<div class="layui-col-md12 accountmanage" layout:fragment="content">
  <div class="layui-col-md2 assetbook">
    <div class="input-inline assetbook-search">
      <input type="text" class="layui-input form-input" placeholder="请输入账套代码或账套名称">
      <a id="ValAccountbook001_BTN_search" class="layui-btn layui-btn-sm btnsrh"><i class="iconfont icon-search"></i></a>
    </div>
    <div class="layui-collapse">
      <div class="layui-colla-item">
        <h2 class="layui-colla-title">账套模版</h2>
        <div class="layui-colla-content layui-show" style="padding:5px 0;">
          <ul class="layui-colla-listtree">
            <li><a href="javascript:;"><i class="layui-icon layui-tree-leaf">&#xe621;</i><cite>M1模板</cite></a></li>
            <li class="layui-this"><a href="javascript:;"><i class="layui-icon layui-tree-leaf">&#xe621;</i><cite>M2模板</cite></a></li>
            <li><a href="javascript:;"><i class="layui-icon layui-tree-leaf">&#xe621;</i><cite>M3模板</cite></a></li>
            <li><a href="javascript:;"><i class="layui-icon layui-tree-leaf">&#xe621;</i><cite>M4模板</cite></a></li>
            <li><a href="javascript:;"><i class="layui-icon layui-tree-leaf">&#xe621;</i><cite>M5模板</cite></a></li>
            <li><a href="javascript:;"><i class="layui-icon layui-tree-leaf">&#xe621;</i><cite>M6模板</cite></a></li>
          </ul>
        </div>
      </div>
      <div class="layui-colla-item">
        <h2 class="layui-colla-title">账套组</h2>
        <div class="layui-colla-content layui-colla-tree layui-show">
          <ul id="demo1">
          </ul>
        </div>
      </div>
    </div>
    <div class="layui-col-md12">
      <a class="layui-btn layui-btn-sm layui-btngroup" title="新建"><i class="iconfont icon-found"></i><b></b>
        <div>
          <p id="ValAccountbook001_btn_add">新建账套</p>
          <p id="ValAccountbook001_btn_subgroup">新建分组</p>
        </div>
      </a>
      <a id="ValAssetBook001_btn_copy" class="layui-btn layui-btn-sm" title="修改"><i class="iconfont icon-edit"></i></a>
      <a id="ValAssetBook001_btn_copy" class="layui-btn layui-btn-sm" title="复制"><i class="iconfont icon-fuzhi"></i></a>
      <a id="ValAssetBook001_btn_delete" class="layui-btn layui-btn-sm" title="删除"><i class="iconfont icon-delete"></i></a>
    </div>
  </div>
  <div class="layui-col-md10">
    <div class="layui-tab layui-tab-brief" lay-filter="docDemoTabBrief" style=" padding:0 10px;">
      <ul class="layui-tab-title">
        <li class="layui-this">科目</li>
        <li>会计分录</li>
      </ul>
      <div class="layui-tab-content">
        <div class="layui-tab-item layui-show">
          <div class="layui-col-md12 layui-actbtn">
            <div class="opebtn layui-clear" style="padding-left:10px;">
              <a id="ValAccountbook001_btn_subject" class="layui-btn layui-btn-sm"><i class="iconfont icon-found"></i><span>新建</span></a>
              <a id="ValAccountbook001_btn_subject_import" class="layui-btn layui-btn-sm"><i class="iconfont icon-import"></i><span>导入</span></a>
              <a id="ValAccountbook001_btn_subject_delete" class="layui-btn layui-btn-sm"><i class="iconfont icon-delete"></i><span>删除</span></a>
              <a id="ValAccountbook001_btn_subject_filter" class="layui-btn layui-btn-sm btn-filter"><i class="iconfont icon-btn-filter"></i><span>筛选</span></a>
            </div>
            <form class="layui-form joyin-form-wrap joyin-filter-form" id="searchForm">
              <div class="layui-form-item">
                <div class="layui-inline layui-col-md3">
                  <label class="layui-form-label form-lable2">科目类别</label>
                  <div class="layui-input-inline input-inline">
                    <input type="text" class="input-select" multiple allowClear="true" placeholder="请选择" data-result='[
                    {&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;资产类&quot;,&quot;col&quot;:&quot;&quot;},
                    {&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;负债类&quot;,&quot;col&quot;:&quot;&quot;},
                    {&quot;id&quot;:&quot;03&quot;,&quot;text&quot;:&quot;共同类&quot;,&quot;col&quot;:&quot;&quot;},
                    {&quot;id&quot;:&quot;04&quot;,&quot;text&quot;:&quot;权益类&quot;,&quot;col&quot;:&quot;&quot;},
                    {&quot;id&quot;:&quot;05&quot;,&quot;text&quot;:&quot;损益类&quot;,&quot;col&quot;:&quot;&quot;},
                    {&quot;id&quot;:&quot;06&quot;,&quot;text&quot;:&quot;表外类&quot;,&quot;col&quot;:&quot;&quot;}
                  ]'>
                  </div>
                </div>
                <div class="layui-inline layui-col-md3">
                  <label class="layui-form-label form-lable2">上级科目</label>
                  <div class="layui-input-inline input-inline">
                    <input type="text" class="input-select" placeholder="请选择" data-result='[
                    {&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;1002&quot;,&quot;col&quot;:&quot;&quot;},
                    {&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;100201&quot;,&quot;col&quot;:&quot;&quot;},
                    {&quot;id&quot;:&quot;03&quot;,&quot;text&quot;:&quot;10020101&quot;,&quot;col&quot;:&quot;&quot;},
                    {&quot;id&quot;:&quot;04&quot;,&quot;text&quot;:&quot;10020102&quot;,&quot;col&quot;:&quot;&quot;},
                    {&quot;id&quot;:&quot;05&quot;,&quot;text&quot;:&quot;1003&quot;,&quot;col&quot;:&quot;&quot;}
                    ]'>
                  </div>
                </div>
                <div class="layui-inline layui-col-md3">
                  <label class="layui-form-label form-lable2">科目级别</label>
                  <div class="layui-input-inline input-inline">
                    <input type="text" class="input-select" placeholder="请选择" data-result='[
                    {&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;1级&quot;,&quot;col&quot;:&quot;&quot;},
                    {&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;2级&quot;,&quot;col&quot;:&quot;&quot;},
                    {&quot;id&quot;:&quot;03&quot;,&quot;text&quot;:&quot;3级&quot;,&quot;col&quot;:&quot;&quot;},
                    {&quot;id&quot;:&quot;04&quot;,&quot;text&quot;:&quot;4级&quot;,&quot;col&quot;:&quot;&quot;}
                    ]'>
                  </div>
                </div>
                <div class="layui-inline layui-col-md3">
                  <a id="ValAccountbook001_btn_subject_search" class="layui-btn layui-btn-sm"><i class="iconfont icon-search"></i><span>&nbsp;&nbsp;查询</span></a>
                  <a id="SysInstitution001_BTN_reset" class="layui-btn layui-btn-sm"><i class="iconfont icon-reset"></i><span>&nbsp;&nbsp;重置</span></a>
                </div>
              </div>
            </form>
          </div>
          <div class="layui-clear"></div>
          <table class="layui-table" id="dataTable1" style="display:none"></table>
        </div>
        <div class="layui-tab-item" style="display:none">
          <div class="layui-col-md12 layui-actbtn">
            <div class="opebtn layui-clear" style="padding-left:10px;">
              <a id="ValAccountbook001_btn_record" class="layui-btn layui-btn-sm"><i class="iconfont icon-found"></i><span>新建</span></a>
              <a id="ValAccountbook001_btn_record_export" class="layui-btn layui-btn-sm"><i class="iconfont icon-export"></i><span>导出</span></a>
              <a id="ValAccountbook001_btn_record_filter" class="layui-btn layui-btn-sm btn-filter"><i class="iconfont icon-btn-filter"></i><span>筛选</span></a>
            </div>
            <form class="layui-form joyin-form-wrap joyin-filter-form" id="searchForm">
              <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                  <label class="layui-form-label form-lable2">系统交易</label>
                  <div class="layui-input-inline input-inline">
                    <input type="text" class="input-select" placeholder="请选择" data-result='[
                      {&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;银证转账&quot;,&quot;col&quot;:&quot;&quot;},
                      {&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;活期存款交易&quot;,&quot;col&quot;:&quot;&quot;},
                      {&quot;id&quot;:&quot;03&quot;,&quot;text&quot;:&quot;活期存款收息&quot;,&quot;col&quot;:&quot;&quot;}
                    ]'>
                  </div>
                </div>
                <div class="layui-inline layui-col-md4">
                  <label class="layui-form-label form-lable2">会计事件</label>
                  <div class="layui-input-inline input-inline">
                    <input type="text" class="input-select" placeholder="请选择" data-result='[
                      {&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;银转证&quot;,&quot;col&quot;:&quot;&quot;},
                      {&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;证转银&quot;,&quot;col&quot;:&quot;&quot;}
                    ]'>
                  </div>
                </div>
                <div class="layui-inline layui-col-md3">
                  <a id="ValAccountbook001_btn_record_search" class="layui-btn layui-btn-sm"><i class="iconfont icon-search"></i><span>&nbsp;&nbsp;查询</span></a>
                  <a id="SysInstitution001_BTN_reset" class="layui-btn layui-btn-sm"><i class="iconfont icon-reset"></i><span>&nbsp;&nbsp;重置</span></a>
                </div>
              </div>
            </form>
          </div>
          <div class="layui-clear"></div>
          <table class="layui-table" id="dataTable2" style="display:none"></table>
        </div>
      </div>
    </div>
  </div>
  <div class="layui-clear"></div>
</div>
<div layout:fragment="script"> 
  <script type="text/javascript" data-th-inline="javascript">
    layui.use(['element', 'layer'], function(){
      var element = layui.element;
    });
	layui.tree({
	  elem: '#demo1', //传入元素选择器
	  nodes: [{ //节点
		name: '账套M1(开发要实现拖拉进来)',
		spread: true,
		children: [{
	 	  name: 'PA1实例'
		},{
		  name: 'PA2实例'
		},{
		  name: 'PA3实例'
		},{
		  name: 'PA4实例'
		},{
		  name: 'PA5实例'
		}]
	  },{
		name: '账套M2',
		children: [{
		  name: 'PB1实例',
		},{

		  name: 'PB2实例'
		},{
		  name: 'PB3实例'
		}]
	  },{
		name: '账套M3',
		children: [{
		  name: 'PC1实例',
		},{
		  name: 'PC2实例'
		},{
		  name: 'PC3实例'
		},{
		  name: 'PC4实例'
		}]
	  }]
	});
  </script> 
  <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script>  
  <script data-th-src="@{/js/valuation/accounadjustmanage/assetbooknew/ValAccountbook001.js}" type="text/javascript"></script> 
</div>
