<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title>账套日期批量修改</title>
<script th:inline="javascript">
    var ID_DATA = [[${booksetId}]];
</script>
</head>
<body>
	<div layout:fragment="content">
		<div class="joyin-form-wrap">
			<form class="layui-form" id="searchForm">
				<div class="layui-form-item" style="display:none;">
					<input type="text" id="workflowId" name="workflowId"  placeholder="流程 Id"
                            class="layui-input form-input" data-th-value="${workflowId}" >
				</div>
				<div class="layui-form-item" style="padding: 20px 0">
					<div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">修改日期</label>
                        <div class="layui-input-inline input-inline">
                          <input type="text" id="booksetDate" name="booksetDate" placeholder="请选择日期" class="layui-input form-input input-dateSelect" value="">
                        </div>
                    </div>
				</div>
			</form>
		</div>
		<div>
			<table class="layui-table" id="dataTable"></table>
		</div>
		<div class="layui-col-md11" style="margin:10px 0 10px 0;">
            <div class="text-center">
    <!--             <a id="ValBooksetDateSwitch003_btn_save" class="layui-btn layui-btn-sm btn-save">保存</a> -->
                <a id="ValBooksetDateSwitch003_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
                <a id="ValBooksetDateSwitch003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
            </div>
        </div>
	</div>
	<div layout:fragment="script">
		<script
			data-th-src="@{/js/valuation/accounadjustmanage/booksetdateswitch/ValBooksetDateSwitch003.js}"
			type="text/javascript"></script>
	</div>
</body>

</html>
