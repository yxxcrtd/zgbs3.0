<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">

<head>
    <title>产品估值表对账</title>
</head>

<body>
	<div layout:fragment="content">
	    <div class="form-button-area" export="false">
          <button type="button" class="layui-btn layui-btn-sm btn-default" id="ProductValuationReconciliation001_BTN_confirm"><i class="iconfont icon-send_fill"></i>执行对账</button>
          <button type="button" class="layui-btn layui-btn-sm btn-default" id="ProductValuationReconciliation001_BTN_cancleConfirm"><i class="iconfont icon-revoke"></i>取消对账</button>
          <button type="button" class="layui-btn layui-btn-sm btn-default" id="ProductValuationReconciliation001_BTN_adjust"><i class="iconfont icon-send_fill"></i>调整</button>
	    </div>
	    <div class="joyin-form-wrap joyin-filter-form condition-area">
	      <form class="layui-form" id="searchForm"> 
	          <div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">估值日期</label>
					      <div class="layui-input-inline input-inline">
		                  		<input type="text" id="valDate" name="valDate" placeholder="请选择、支持区间" 
		                  		class="layui-input form-input input-dateRangeSelect" value="">
		                  </div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">产品</label>
						<div class="layui-input-inline input-inline">
							<select id="finprodId" name="finprodId"
								class="layui-input form-input input-select"
								placeholder="请选择，可复选" data-th-data-url="@{/valuation/accounadjustmanage/valuareconcy/ProductValuationReconciliation001/getFinprodId}"
								allowClear="true" multiple="multiple"
								data-th-placeholder="#{SysCommon.placeholder}">
							</select>
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">对账状态</label>
						<div class="layui-input-inline input-inline">
							<select id="reconcileStatus" name="reconcileStatus"
								class="layui-input form-input input-select" placeholder="请选择"
								data-th-data-result="${CHECK_STATUS}" allowClear="true"><option></option></select>
						</div>
					</div>
				</div>
	          <div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">对账结果</label>
						<div class="layui-input-inline input-inline">
							<select id="reconcileResult" name="reconcileResult"
								class="layui-input form-input input-select" placeholder="请选择"
								data-th-data-result="${CHECK_RESULT}" allowClear="true"><option></option></select>
						</div>
					</div>
				</div>
	      </form>
	    </div>
	    <div>
	        <table class="layui-table" id="dataTable"></table>
	    </div>
	</div>

    
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/accounadjustmanage/valuareconcy/ProductValuationReconciliation001.js}" type="text/javascript"></script>
    </div>
</body>

</html>
