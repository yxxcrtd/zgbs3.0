<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ValProfitQuery001}">所有者权益变动表-账套明细列表</title>
<script th:inline="javascript">
	// 表格ID
	var tableId = [[${entity?.tableId}]];
	// 报表期限类型
	var reportTermType = [[${entity?.reportTermType}]];
	// 期限
	var reportTerm = [[${entity?.reportTerm}]];
	// 报表维度
	var reportDimen = [[${entity?.reportDimen}]];
	// 账套组
	var booksetGroup = [[${entity?.booksetGroup}]];
	// 维度
	var lastDimen = [[${entity?.lastDimen}]];
</script>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area"></div>
        
        <div class="joyin-form-wrap joyin-filter-form">
            <form class="layui-form " id="searchForm" style="background: #ffffff; padding: 10px 0;">   
              <fieldset class="layui-elem-field layui-field-title">
                <div class="layui-collapse" lay-filter="test">
                <div class="layui-colla-item">
                <h2 class="layui-colla-title"><a href="javascript:;">基本信息</a></h2>
                <div class="layui-colla-content layui-show"> 
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                    	<label class="layui-form-label form-lable2">日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="valDate" name="valDate" class="layui-input form-input" data-th-value="${entity?.valDate}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable2">指标</label>
                        <div class="layui-input-inline input-inline">
                        	<input type="text" id="project" name="project" class="layui-input form-input" data-th-value="${entity?.project}">
                        </div>
                    </div>
                </div>
                </div> 
                </div> 
                </div> 
              </fieldset>
<!----------------------------本期金额-------------------------------------------------------------------------------------------------------------------------------- -->                
            <fieldset class="layui-elem-field layui-field-title">
                <div class="layui-collapse" lay-filter="test"> 
                <div class="layui-colla-item">
                <h2 class="layui-colla-title"><a href="javascript:;">本期金额</a></h2>
                <div class="layui-colla-content layui-show">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable2">实收资本</label>
                        <div class="layui-input-inline input-inline">
                        	<input type="text" id="tIncomeFund" name="tIncomeFund" class="layui-input form-input" data-th-value="${entity?.tIncomeFund}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable2">未分配利润</label>
                        <div class="layui-input-inline input-inline">
                        	<input type="text" id="tUnQuarterProfit" name="tUnQuarterProfit" class="layui-input form-input" data-th-value="${entity?.tUnQuarterProfit}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable2">其他综合收益</label>
                        <div class="layui-input-inline input-inline">
                        	<input type="text" id="tOtherCompIncome" name="tOtherCompIncome" class="layui-input form-input" data-th-value="${entity?.tOtherCompIncome}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable2">所有者权益合计</label>
                        <div class="layui-input-inline input-inline">
                        	<input type="text" id="tOwnerEquityTot" name="tOwnerEquityTot" class="layui-input form-input" data-th-value="${entity?.tOwnerEquityTot}">
                        </div>
                    </div>
                </div>
                </div> 
                </div> 
                </div> 
              </fieldset>
<!----------------------------上期金额-------------------------------------------------------------------------------------------------------------------------------- -->                
            <fieldset class="layui-elem-field layui-field-title">
                <div class="layui-collapse" lay-filter="test"> 
                <div class="layui-colla-item">
                <h2 class="layui-colla-title"><a href="javascript:;">上期金额</a></h2>
                <div class="layui-colla-content layui-show">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable2">实收资本</label>
                        <div class="layui-input-inline input-inline">
                        	<input type="text" id="yIncomeFund" name="yIncomeFund" class="layui-input form-input" data-th-value="${entity?.yIncomeFund}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable2">未分配利润</label>
                        <div class="layui-input-inline input-inline">
                        	<input type="text" id="yUnQuarterProfit" name="yUnQuarterProfit" class="layui-input form-input" data-th-value="${entity?.yUnQuarterProfit}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable2">其他综合收益</label>
                        <div class="layui-input-inline input-inline">
                        	<input type="text" id="yOtherCompIncome" name="yOtherCompIncome" class="layui-input form-input" data-th-value="${entity?.yOtherCompIncome}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable2">所有者权益合计</label>
                        <div class="layui-input-inline input-inline">
                        	<input type="text" id="yOwnerEquityTot" name="yOwnerEquityTot" class="layui-input form-input" data-th-value="${entity?.yOwnerEquityTot}">
                        </div>
                    </div>
                </div>
                </div> 
                </div> 
                </div> 
              </fieldset>
            </form>
            </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div> 
    <div layout:fragment="script">
        <script data-th-src="@{/js//valuation/accounadjustmanage/ownerequitychange/OwnerEquityChange002.js}"
            type="text/javascript"></script>
    </div>

</html>
