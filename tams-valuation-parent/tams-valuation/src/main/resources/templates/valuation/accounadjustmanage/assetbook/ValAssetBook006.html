<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>账套参数修改</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area"  filter="false">
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <input type="text" id="booksetId" name="booksetId" data-th-value="${booksetId}" style="display:none">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">参数代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="paramCode" name="paramCode"
                                   class="layui-input form-input input-lenovoselect" data-parentIds="booksetId"
                                   data-th-data-url="@{/valuation/accounadjustmanage/assetbook/ValAssetBook006/getParamCode}"
                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-effectivefieldsalias='|{"code":"参数代码","shortName":"参数名称"}|'>
                        </div>
                    </div>

                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">参数名称</label>
                        <div class="layui-input-inline input-inline">
                            <input id="paramName" name="paramName" maxlength="50"
                                   class="layui-input form-input" autocomplete="off"
                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>

                    <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">备注</label>
                        <div class="layui-input-inline input-inline">
                            <input id="remark" name="remark" maxlength="200"
                                   class="layui-input form-input" autocomplete="off"
                                   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>

    <div>
        <div class="layui-col-md11" style="margin: 10px 0 10px 0;">
            <div class="text-center">
                <a id="ValAssetBook006_btn_save" class="layui-btn layui-btn-sm btn-save">保存</a>
                <a id="ValAssetBook006_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
                <a id="ValAssetBook006_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
            </div>
        </div>
    </div>

</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
			var modifyFlag = /*[[${modifyFlag}]]*/'';
			var booksetId = /*[[${booksetId}]]*/'';
			var workflowId=/*[[${workflowId}]]*/'';

    </script>
    <script data-th-src="@{/js/valuation/accounadjustmanage/assetbook/ValAssetBook006.js}"
            type="text/javascript"></script>
</div>

</body>

</html>
