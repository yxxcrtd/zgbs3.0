<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ValCurrentDepositInterest001}">活期存款利息报表</title>
</head>
<body>
	<div layout:fragment="content">
		
			 <form class="layui-form" id="searchForm"> 
				<div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">年</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" class="layui-input form-input " id="year" data-th-value="${year}"
                                name="year" placeholder="请选择年" allowClear="true" required>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">季度</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" class="layui-input form-input input-select" id="quarter"
                                name="quarter" placeholder="请选择季度" allowClear="true" data-th-initvalue="${quarter}"
                                data-th-data-result="${QUARTER}" required>
                             </select>   
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                    <a id="ValCurrentDepositInterest001_btn_export" class="layui-btn layui-btn-sm btn-export btn-default">导出</a>
                    </div>
                    
                </div>
			</form> 
		</div>
	<div layout:fragment="script">
		<script
			data-th-src="@{/js//valuation/accounadjustmanage/valcurrentdepositinterest/ValCurrentDepositInterest001.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
