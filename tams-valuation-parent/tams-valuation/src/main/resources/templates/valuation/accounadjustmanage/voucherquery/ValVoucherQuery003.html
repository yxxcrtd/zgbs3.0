<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>凭证查询</title>
</head>

<body>

<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <input type="hidden" id="vouchNum" name="vouchNum" data-th-value="${vouchNum}">
        <div class="layui-form-item">
            <label class="layui-form-label form-label-wrap" ><i class="iconfont must" ></i>摘要</label>
            <div class="layui-input-block">
                <textarea name="vouchRemark" id="vouchRemark"  maxlength="200" data-th-text="${vouchRemark}" class="layui-textarea" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"></textarea>
            </div>
        </div>         
    </form>
    <div class="layui-col-md11" style="margin:10px 0 10px 0;">
        <div class="text-center">
<!--             <a id="ValAssetBook003_btn_save" class="layui-btn layui-btn-sm btn-save">保存</a> -->
            <a id="ValVoucherQuery003_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
            <a id="ValVoucherQuery003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
        </div>
    </div>
</div>
</body>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/accounadjustmanage/voucherquery/ValVoucherQuery003.js}" type="text/javascript"></script>
</div>

</html>
