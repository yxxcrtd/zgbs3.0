<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{ValAccountbook005}">新建科目</title>
</head>

<body>
<div layout:fragment="content">
  <form id="submitForm">
    <div class="layui-form layui-clear" style="margin-top:10px;">
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>账套</label>
        <div class="layui-input-inline input-inline">
          <select class="input-select" allowClear="true" placeholder="请选择" data-url="/js/valuation/demo/selectSimple.json" data-effectivefieldsalias='{&quot;code&quot;:&quot;账套代码&quot;,&quot;shortName&quot;:&quot;账套名称&quot;}'><option></option></select>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>上级科目</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="input-select" placeholder="请选择" data-result='[
            {&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;1002&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;100201&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;03&quot;,&quot;text&quot;:&quot;10020101&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;04&quot;,&quot;text&quot;:&quot;10020102&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;05&quot;,&quot;text&quot;:&quot;1003&quot;,&quot;col&quot;:&quot;&quot;}
          ]'>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>科目号</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input" placeholder="请输入科目号" value="">
        </div>
      </div>
      <div class="layui-form-item">
       <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>科目名称</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input" placeholder="请输入科目名称" value="">
        </div>
      </div>
      <div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2">科目类别</label>
        <div class="layui-input-block input-inline2">
          <input type="text" id="ValAssetBook002_type" name="status" class="layui-input form-input input-checkbox" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;资产类&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;负债类&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;03&quot;,&quot;text&quot;:&quot;共同类&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;04&quot;,&quot;text&quot;:&quot;权益类&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;04&quot;,&quot;text&quot;:&quot;损益类&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;04&quot;,&quot;text&quot;:&quot;表外类&quot;,&quot;col&quot;:&quot;&quot;}]'
          initValue='01'>
          <!--<ul class="checklabel radiolabel">
            <li class="curr"><span>资产类</span></li><li><span>负债类</span></li><li><span>共同类</span></li><li><span>权益类</span></li><li><span>损益类</span></li><li><span>表外类</span></li>
          </ul> -->
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2">核算项目</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;项目1&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;项目2&quot;,&quot;col&quot;:&quot;&quot;}]'>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2">余额方向</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="ValAssetBook002_type" name="status" class="layui-input form-input input-checkbox" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;贷方&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;借方&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;03&quot;,&quot;text&quot;:&quot;借贷双方&quot;,&quot;col&quot;:&quot;&quot;}]'
          initValue='01'>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2">收支方向</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="ValAssetBook002_type" name="status" class="layui-input form-input input-checkbox" disabled data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;收入&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;支出&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;03&quot;,&quot;text&quot;:&quot;收支双方&quot;,&quot;col&quot;:&quot;&quot;}]'
          initValue='01'>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2">是否核算数量</label>
        <div class="layui-input-inline input-inline">
          <input type='checkbox' name='hssl' lay-skin='switch' value='02' lay-text='是|否'>
        </div>
      </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2">核算币种</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="input-select" placeholder="请选择" data-result='[
            {&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;人民币&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;其他币种&quot;,&quot;col&quot;:&quot;&quot;}
          ]'>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2">备注</label>
        <div class="layui-input-inline input-inline">
          <textarea name="depict" class="layui-textarea" style="min-height:60px;" placeholder="请输入内容"></textarea>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2">自动生成子科目</label>
        <div class="layui-input-inline input-inline">
          <input type='checkbox' name='auto' lay-skin='switch' value='02' lay-text='是|否'>
        </div>
      </div>
    </div>
  </form>
  <div class="layui-col-md11" style="margin:10px 0 10px 0;">
    <div class="text-center">
      <a id="ValAssetBook002_btn_save" class="layui-btn layui-btn-sm btn-save">保存</a>
      <a id="ValAssetBook002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
      <a id="ValAssetBook002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
    </div>
  </div>
</div>
<div layout:fragment="script"> 
  <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script> 
</div>
</body>
</html>
