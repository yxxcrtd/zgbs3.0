<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>新建账套模板</title>
</head>
<body>

</body>
<div layout:fragment="content">
  <form id="submitForm">
    <div class="layui-form" style=" margin-top:10px;">
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>账套名称</label>
        <div class="layui-input-block input-inline">
            <input type="text" class="layui-input form-input" placeholder="请输入内容"  value="">
        </div>
       </div>
       <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>适用产品范围</label>
        <div class="layui-input-block input-inline">
          <select id="syfw" class="input-select select2-hidden-accessible" data-url="" multiple="" placeholder="请选择，可多选" allowclear="true" tabindex="-1" aria-hidden="true"><option value="01">收益型</option><option value="02">货币型</option><option value="03">净值型</option></select>
        </div>
       </div>
       <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>账套类型</label>
        <div class="layui-input-block">
          <input type="text" id="status" name="status" class="layui-input form-input input-checkbox" data-result='[{&quot;id&quot;:&quot;B&quot;,&quot;text&quot;:&quot;银行账套&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;L&quot;,&quot;text&quot;:&quot;理财账套&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;T&quot;,&quot;text&quot;:&quot;特殊账套&quot;,&quot;col&quot;:&quot;&quot;}]'
          initValue='B'>
        </div>
       </div>
    </div>
  </form>
  <div class="layui-col-md11" style="margin:10px;">
   	<div class="text-center">
        <a id="ValAssetBook002_btn_save" class="layui-btn layui-btn-sm btn-save">保存</a>
        <a id="ValAssetBook002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
        <a id="ValAssetBook002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
    </div>
   </div>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script>
</div>
</html>
