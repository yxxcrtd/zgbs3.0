<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{ValBalanceInquiry001}">余额查询</title>
<link rel="stylesheet" type="text/css" data-th-href="@{/css/font/iconfont.css}">
</head>

<body>
<div layout:fragment="content">
  <div class="layui-col-md12" style="margin-top:10px;">
    <a id="ValBalanceInquiry001_btn_export" class="layui-btn layui-btn-sm"><i class="iconfont icon-export"></i><span>导出</span></a>
    <a id="ValBalanceInquiry001_btn_filter" class="layui-btn layui-btn-sm btn-filter"><i class="iconfont icon-btn-filter"></i><span>筛选</span></a>
  </div>
  <form class="layui-form joyin-form-wrap joyin-filter-form" id="searchForm">
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md3">
        <label class="layui-form-label form-lable2">统计日期</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-dateRangeSelect" placeholder="请选择日期">
        </div>
      </div>
      <div class="layui-inline layui-col-md3">
        <label class="layui-form-label form-lable2">账套</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-lenovoselect" multiple="multiple" placeholder="请选择产品或输入关键词" value="" data-url="/js/valuation/demo/lenovoSelect.json"  data-effectivefieldsalias='{&quot;code&quot;:&quot;账套代码&quot;,&quot;shortName&quot;:&quot;账套名称&quot;}'>
          <!-- <select class="input-select" allowClear="true" multiple="multiple"  placeholder="请选择" data-url="/js/valuation/demo/selectSimple.json"></select> -->
        </div>
      </div>
      <div class="layui-inline layui-col-md3">
        <label class="layui-form-label form-lable2">科目级别</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;1级&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;2级&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;03&quot;,&quot;text&quot;:&quot;3级&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;04&quot;,&quot;text&quot;:&quot;4级&quot;,&quot;col&quot;:&quot;&quot;}]'>
        </div>
      </div>
      <div class="layui-inline layui-col-md3">
        <label class="layui-form-label form-lable2">科目</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="input-select" placeholder="请选择" data-result='[
            {&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;银行存款&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;活期存款&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;03&quot;,&quot;text&quot;:&quot;券商保证金&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;04&quot;,&quot;text&quot;:&quot;存拆放款项&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;05&quot;,&quot;text&quot;:&quot;存放同业&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;06&quot;,&quot;text&quot;:&quot;存放境内银行业存款类金融机构&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;07&quot;,&quot;text&quot;:&quot;存放境内银行业非存款类金融机构&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;08&quot;,&quot;text&quot;:&quot;存放境内证券业金融机构&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;09&quot;,&quot;text&quot;:&quot;存放境内保险业金融机构&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;10&quot;,&quot;text&quot;:&quot;存放境内交易及结算类金融机构&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;11&quot;,&quot;text&quot;:&quot;存放境内其他金融机构金融机构&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;12&quot;,&quot;text&quot;:&quot;存放境内特殊目的载体(SPV)&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;13&quot;,&quot;text&quot;:&quot;存放境外存款类金融机构&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;13&quot;,&quot;text&quot;:&quot;存放境外其他金融机构&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;14&quot;,&quot;text&quot;:&quot;存放境外非金融性公司&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;15&quot;,&quot;text&quot;:&quot;拆放同业&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;16&quot;,&quot;text&quot;:&quot;持有至到期金融资产投资&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;17&quot;,&quot;text&quot;:&quot;持有至到期银行间国债&quot;,&quot;col&quot;:&quot;&quot;}
          ]'>
        </div>
      </div>
    </div>
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md3">
        <label class="layui-form-label form-lable2">币种</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="input-select" placeholder="请选择" data-result='[
            {&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;人民币(CNY)&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;港元(HKD)&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;03&quot;,&quot;text&quot;:&quot;美元(USD)&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;04&quot;,&quot;text&quot;:&quot;欧元(EUR)&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;05&quot;,&quot;text&quot;:&quot;日元(JPY)&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;06&quot;,&quot;text&quot;:&quot;澳门元(MOP)&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;07&quot;,&quot;text&quot;:&quot;瑞士法郎(CHF)&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;08&quot;,&quot;text&quot;:&quot;英镑(GBP)&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;09&quot;,&quot;text&quot;:&quot;俄罗斯卢布(RUB)&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;10&quot;,&quot;text&quot;:&quot;加拿大元(CAD)&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;11&quot;,&quot;text&quot;:&quot;丹麦克朗(DKK)&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;12&quot;,&quot;text&quot;:&quot;澳大利亚元(AUD)&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;13&quot;,&quot;text&quot;:&quot;瑞典克朗(SEK)&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;13&quot;,&quot;text&quot;:&quot;新加坡元(SGD)&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;14&quot;,&quot;text&quot;:&quot;新台币(TWD)&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;15&quot;,&quot;text&quot;:&quot;其他&quot;,&quot;col&quot;:&quot;&quot;}
          ]'>
        </div>
      </div>
      <div class="layui-inline layui-col-md3">
        <label class="layui-form-label form-lable2">有期末余额</label>
        <div class="layui-input-inline input-inline">
          <input type='checkbox' name='moren' lay-skin='switch' value='02' lay-text='是|否'>
        </div>
      </div>
      <div class="layui-inline layui-col-md3">
        <a id="ValTradingInquiry001_BTN_search" class="layui-btn layui-btn-sm"><i class="iconfont icon-search"></i><span>&nbsp;&nbsp;查询</span></a>
        <a id="SysInstitution001_BTN_reset" class="layui-btn layui-btn-sm"><i class="iconfont icon-reset"></i><span>&nbsp;&nbsp;重置</span></a>
      </div>
    </div>
  </form>
  <div class="layui-clear"></div>
  <!-- <table class="layui-table" id="dataTable"></table> -->
  <div style="margin-top:10px;">
    <table class="layui-table" lay-data="{url:'/js/valuation/accounadjustmanage/balanceinquiry/ValBalanceInquiry001.json', page:true, id:'test1'}" lay-filter="test1">
      <thead>
        <tr>
          <th lay-data="{field:'tjrq', width:100, sort:true}" rowspan="2">统计日期</th>
          <th lay-data="{field:'cpdm', width:150, sort:true}" rowspan="2">产品代码</th>
          <th lay-data="{field:'kmh', width:80, sort:true}" rowspan="2">科目号</th>
          <th lay-data="{field:'kmmc', width:180, sort:true}" rowspan="2">科目名称</th>
          <th lay-data="{field:'bizhong', width:150, sort:true}" rowspan="2">币种</th>
          <th lay-data="{align:'center',}" colspan="6">原币种金额</th>
          <th lay-data="{field:'huilv', width:120, sort:true}" rowspan="2">汇率</th>
          <th lay-data="{align:'center',}" colspan="6">本位币金额</th>
        </tr>
        <tr>
          <th lay-data="{field:'y-jdfx1', width:70, sort:true}">借或贷</th>
          <th lay-data="{field:'y-qcye', width:160, sort:true}">期初余额</th>
          <th lay-data="{field:'y-jffsye', width:160, sort:true}">本期发生金额(借方)</th>
          <th lay-data="{field:'y-dffsye', width:160, sort:true}">本期发生金额(贷方)</th>
          <th lay-data="{field:'y-jdfx2', width:70, sort:true}">借或贷</th>
          <th lay-data="{field:'y-qmye', width:160, sort:true}">期末余额</th>
          <th lay-data="{field:'b-jdfx1', width:70, sort:true}">借或贷</th>
          <th lay-data="{field:'b-qcye', width:160, sort:true}">期初余额</th>
          <th lay-data="{field:'b-jffsye', width:160, sort:true}">本期发生金额(借方)</th>
          <th lay-data="{field:'b-dffsye', width:160, sort:true}">本期发生金额(贷方)</th>
          <th lay-data="{field:'b-jdfx2', width:70, sort:true}">借或贷</th>
          <th lay-data="{field:'b-qmye', width:160, sort:true}">期末余额</th>
        </tr>
      </thead>
    </table>
  </div>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/accounadjustmanage/balanceinquiry/ValBalanceInquiry001.js}" type="text/javascript"></script>
</div>
</body>
</html>
