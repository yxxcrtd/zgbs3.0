<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>手工凭证模板</title>
</head>

<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm" style="background: #ffffff; padding: 10px 0;">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">模板编号</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="tmpCode" name="tmpCode" class="layui-input form-input"
                               placeholder="提交后自动生成，无需填写" data-th-value="${entity?.tmpCode}" disabled="disabled">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">
                        <i class="iconfont must" style="display: inline;">*</i>
                        模板名称
                    </label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="tmpName" name="tmpName"
                               class="layui-input form-input" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-value="${entity?.tmpName}"
                        >
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">
                        分录类型
                    </label>
                    <div class="layui-input-inline input-inline" style="display: inline-block;">
                        <input id="recordType" name="recordType" class="layui-input form-input input-select"
                               placeholder="请选择" data-th-initValue="${entity?.recordType}"
                               data-th-data-result="${RECORD_TYPE}" allowClear="true">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">摘要</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="remark" name="remark" class="layui-input form-input"
                               data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.remark}">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">
                        业务类型
                    </label>
                    <div class="layui-input-inline input-inline">
                        <input id="busiType" name="busiType" class="layui-input form-input input-select"
                               placeholder="请选择" data-th-initValue="${entity?.busiType}"
                               data-th-data-result="${FINPROD_TYPE}" allowClear="true">
                    </div>
                </div>
            </div>
        </form>

        <input type="text" id="workflowId" name="workflowId" class="layui-input form-input" data-th-value="${workflowId}" disabled="disabled" style = "display:none;">

        <form class="layui-form joyin-form-wrap" id="listForm">
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
        </form>
        <div class="layui-col-md11" style="margin: 50px;">
            <div class="text-center">
                <a id="ValManualVoucherTemplete003_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                   data-th-text="#{SysCommon.submit}">提交</a>
                <a id="ValManualVoucherTemplete003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                   data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
        	var CCY_DATA = /*[[${CCY}]]*/'';

        </script>
        <script data-th-src="@{/js/valuation/accounadjustmanage/manualvouchertemplete/ValManualVoucherTemplete003.js}" type="text/javascript"></script>
    </div>
</body>
</html>
