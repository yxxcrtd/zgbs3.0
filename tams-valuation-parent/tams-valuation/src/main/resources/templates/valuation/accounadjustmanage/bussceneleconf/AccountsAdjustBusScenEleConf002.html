<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>业务场景新建</title>
</head>
<body>

</body>
<div layout:fragment="content">
    <form id="submitForm">
        <div class="layui-form layui-clear" style="margin-top: 10px;">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable2">
                   <i class="iconfont must">*</i>
                                                            业务场景代码
                </label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="AccountsAdjustBusScenEleConf002_tableId" class="layui-input form-input input-lenovoselect"
                        placeholder="请输入业务场景代码" value="" data-th-value="${tableId}">
                </div>
            </div>
          </div>
             <div class="layui-form layui-clear" style="margin-top: 10px;">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable2">
                 <i class="iconfont must">*</i>
                                                             业务场景名称
                </label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="AccountsAdjustBusScenEleConf002_tableName" class="layui-input form-input input-lenovoselect"
                        placeholder="请输入业务场景名称" value="" data-th-value="${tableName}">
                </div>
            </div>   
            
        </div>
        <div class="layui-form layui-clear" style="margin-top: 10px;">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable2">备注</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="AccountsAdjustBusScenEleConf002_remark"
                        class="layui-input form-input input-lenovoselect" placeholder="请输入备注信息" value="" data-th-value="${remark}">
                </div>
            </div>
          </div>
    </form>
    <div class="layui-col-md11" style="margin: 10px;">
        <div class="text-center">
            <a id="AccountsAdjustBusScenEleConf002_btn_save" class="layui-btn layui-btn-sm btn-save">提交</a> 
            <a id="AccountsAdjustBusScenEleConf002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/valuation/accounadjustmanage/bussceneleconf/AccountsAdjustBusScenEleConf002.js}" type="text/javascript"></script>
</div>
</html>
