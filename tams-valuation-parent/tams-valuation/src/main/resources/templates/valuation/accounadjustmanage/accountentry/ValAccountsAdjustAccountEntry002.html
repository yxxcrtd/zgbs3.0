<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>会计分录配置新建</title>
</head>
<body>
</body>
<div layout:fragment="content">
  <input type="hidden" id="ACCOUNTSET_TYPE02" data-th-value="${ACCOUNTSET_TYPE02 }" />
  <input type="hidden" id="cdFlagNet" data-th-value="${cdFlag }" />
  <form class="layui-form joyin-form-wrap" style="padding:10px 0;" id="ValAccountsAdjustAccountEntry002_FORM_001">
    <div class="layui-form" style=" margin-top:10px;">
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>所属账套</label>
        <div class="layui-input-block input-inline">
        	<select disabled="disabled" id="booksetId" name="booksetId" class="input-select" th:data-url="@{/valuation/accounadjustmanage/accountentry/ValAccountsAdjustAccountEntry001/findBooksets}"
                          th:initValue="${booksetId}"  placeholder="请选择" allowClear="true"><option></option></select>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>科目</label>
        <div class="layui-input-block input-inline">
          <select id="subjectId" name="subjectId" class="input-select" th:data-result="${subjects}"
                       th:initValue="${subjectId}"   placeholder="请选择" allowClear="true"><option></option></select>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>借贷方向</label>
        <div class="layui-input-block  input-inline">
          <input name="cdFlag" type="text" class="layui-input form-input input-checkbox" id="cdFlag" th:data-result='${CD_FLAG}'>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>金额元素</label>
        <div class="layui-input-block  input-inline">
          	<select id="formEle" name="formEle" class="input-select" th:data-result="${formEles}"
                      th:initValue="${formEle}"    placeholder="请选择" allowClear="true"><option></option></select>
        </div>
      </div>
      <div class="layui-form-item" id="accountNet_div">
        <label class="layui-form-label form-lable2">记账网点</label>
        <div class="layui-input-block  input-inline">
          <select id="accountNet" name="accountNet" class="input-select" th:data-result="${ACCOUNTING_NETWORK}"
          		th:initValue="${accountNetReal}"  placeholder="请选择" allowClear="true"><option></option></select>
        </div>
      </div>
    </div>
  </form>
  <div class="layui-col-md11" style="margin:10px;">
   	<div class="text-center">
        <a id="ValAccountsAdjustAccountEntry002_btn_save" class="layui-btn layui-btn-sm btn-save">提交</a>
        <a id="ValAccountsAdjustAccountEntry002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
    </div>
   </div>
</div>
<div layout:fragment="script">
<script data-th-src="@{/js/valuation/accounadjustmanage/accountentry/ValAccountsAdjustAccountEntry002.js}" type="text/javascript"></script>
</div>
</html>
