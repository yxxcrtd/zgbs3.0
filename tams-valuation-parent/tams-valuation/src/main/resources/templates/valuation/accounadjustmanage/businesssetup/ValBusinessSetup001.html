<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>业务场景参数配置</title>
<link rel="stylesheet" type="text/css" data-th-href="@{/css/font/iconfont.css}">
</head>

<body>
<div layout:fragment="content">
  <div class="layui-col-md12" style="margin:10px 0;">
    <a id="ValBusinessSetup001_btn_add" class="layui-btn layui-btn-sm"><i class="iconfont icon-found"></i><span>新建业务场景参数</span></a>
    <a id="ValBusinessSetup001_btn_deploy" class="layui-btn layui-btn-sm"><i class="iconfont icon-found"></i><span>新建业务参数设置</span></a>
    <a id="ValBusinessSetup001_btn_delete" class="layui-btn layui-btn-sm"><i class="iconfont icon-delete"></i><span>删除</span></a>
    <!-- <a id="ValAssetBookTemplet001_btn_export" class="layui-btn layui-btn-sm"><i class="iconfont icon-export"></i><span>导出</span></a> -->
    <a id="ValAssetBookTemplet001_btn_filter" class="layui-btn layui-btn-sm btn-filter"><i class="iconfont icon-btn-filter"></i><span>筛选</span></a>
  </div>
  <form class="layui-form joyin-form-wrap joyin-filter-form" id="searchForm" style="display: none;">
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable">业务场景名称</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input" placeholder="请输入内容"  value="">
        </div>
      </div>
      <div class="layui-inline layui-col-md3">
        <a class="layui-btn layui-btn-sm"><i class="iconfont icon-search"></i><span>&nbsp;&nbsp;查询</span></a>
        <a class="layui-btn layui-btn-sm"><i class="iconfont icon-reset"></i><span>&nbsp;&nbsp;重置</span></a>
      </div>
    </div>
  </form>
  <div id="dataTable"></div>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/valuation/accounadjustmanage/businesssetup/ValBusinessSetup001.js}" type="text/javascript"></script>
</div>
</body>
</html>
