<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>估值表（数据溯源信息查看）</title>
    <style>
        .global{
            padding: 20px;
        }
        .inputDate{
            display: inline;
            width: 300px;
        }
        .top{
            margin: 5px;
        }
    </style>
</head>
<body>
<div layout:fragment="content" class="global">
    <input type="hidden" id="booksetId" data-th-Value="${booksetId}">
    <input type="hidden" id="id" data-th-Value="${id}">
    <input type="hidden" id="detailSubjectNoTail" data-th-Value="${detailSubjectNoTail}">
    <input type="hidden" id="formatDate" data-th-Value="${formatDate}">
    <input type="hidden" id="seqNo" data-th-Value="${seqNo}">
    <input type="hidden" id="tradeId" data-th-Value="${tradeId}">
    <div class="layui-form-item top">
        <div class="layui-inline layui-col-md3">
            <label class="layui-form-label form-lable2">账套：</label>
            <div class="layui-input-inline input-inline">
                <!--                    <label class="layui-form-label form-lable2">账套：</label>-->
                <input type="text" id="booksetName" name="booksetName"
                       class="layui-input form-input"  disabled="disabled"
                       data-th-placeholder="#{SysCommon.placeholder}"
                       data-th-Value="${booksetName}"
                >
            </div>
        </div>
        <div class="layui-inline layui-col-md3">
            <label class="layui-form-label form-lable2">科目：</label>
            <div class="layui-input-inline input-inline">
                <input type="text" id="subjectName" name="subjectName"
                       class="layui-input form-input" disabled="disabled"
                       data-th-placeholder="#{SysCommon.placeholder}"
                       data-th-Value="${name}"
                >
            </div>
        </div>
        <div class="layui-inline layui-col-md3">
            <label class="layui-form-label form-lable2">资产：</label>
            <div class="layui-input-inline input-inline">
                <input type="text" id="finprodMarketId" name="finprodMarketId"
                       class="layui-input form-input" disabled="disabled"
                       data-th-placeholder="#{SysCommon.placeholder}"
                       data-th-Value="${detailSubnameTail}"
                >
            </div>
        </div>
        <div class="layui-inline layui-col-md3">
            <label class="layui-form-label form-lable2">原币币种：</label>
            <div class="layui-input-inline input-inline">
                <input type="text" id="oCcyFmt" name="oCcyFmt"
                       class="layui-input form-input" disabled="disabled"
                       data-th-placeholder="#{SysCommon.placeholder}"
                       data-th-Value="${oCcyFmt}"
                >
            </div>
        </div>
    </div>

    <div class="pro-module-wrap">
        <div class="pro-module">
            <h3 class="pro-module-title">
                <span class="title-des">余额流水信息</span>
                <div class="layui-inline layui-col-md2">
                <input type="text" id="jizhangDate" name="jizhangDate" data-th-value="${sysDateRange}"
                       placeholder="记账日期，支持区间" class="layui-input form-input input-dateRangeSelect ">
                </div>
                <a id="ValBalanceStatementQuery002_btn_search" class="layui-btn layui-btn-sm">今天</a>
                <a id="ValBalanceStatementQuery002_btn_search2" class="layui-btn layui-btn-sm">昨天</a>
                <a id="ValBalanceStatementQuery002_btn_search3" class="layui-btn layui-btn-sm">前天</a>
                <a id="ValBalanceStatementQuery002_btn_search4" class="layui-btn layui-btn-sm">近5天</a>
                <i class="iconfont icon-arrow-down pro-down-icon"></i>
            </h3>
            <div class="pro-module-item">
                <div id="tableDiv1" style="margin-top: -1%;">
                    <table class="layui-table" id="dataTable1"></table>
                </div>
            </div>
        </div>
    </div>

    <div class="pro-module-wrap">
        <div class="pro-module">
            <h3 class="pro-module-title">
                <span class="title-des" id="vocher">凭证信息:</span>
                <a id="ValBalanceStatementQuery002_btn_view" class="layui-btn layui-btn-sm">查看交易信息</a>
                <i class="iconfont icon-arrow-down pro-down-icon"></i>
            </h3>
            <div class="pro-module-item">
                <div id="tableDiv2" style="margin-top: -1%;">
                    <table class="layui-table" id="dataTable2"></table>
                </div>
            </div>
        </div>
    </div>

    <div class="pro-module-wrap">
        <div class="pro-module">
            <h3 class="pro-module-title">
                <span class="title-des">交易信息</span>
                <i class="iconfont icon-arrow-down pro-down-icon"></i>
            </h3>
            <div class="pro-module-item">
                <div id="tableDiv3" style="margin-top: -1%;">
                    <table class="layui-table" id="dataTable3"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script
            data-th-src="@{/js/valuation/accounadjustmanage/valbalancestatementquery/ValBalanceStatementQuery002.js}"
            type="text/javascript"></script>
</div>
</body>
</html>
