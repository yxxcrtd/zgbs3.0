<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{ValSubjectSet001}">科目</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area" export="false">
             <a id="ValSubjectSet001_btn_add" class="layui-btn layui-btn-sm btn-create"
                 data-th-text="#{SysCommon.create}">新建</a>
            <a id="ValSubjectSet001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
                data-th-text="#{SysCommon.delete}">删除</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable2" data-th-text="#{ValSubjectSet001.booksetId}">所属账套</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="booksetId" name="booksetId"
                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{getBooksetId}"
                                data-idfield="code" data-keyfield="code"
                                data-th-data-effectivefieldsalias='|{"code":"#{ValSubjectSet001.booksetId}","shortName":"#{ValSubjectSet001.booksetName}"}|'>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable2">上级科目号</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="fsubjectId" name="fsubjectId"
                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/valuation/accounadjustmanage/subjectset/ValSubjectSet001/getFSubjectId}"
                                data-idfield="code" data-keyfield="code"
                                data-th-data-effectivefieldsalias='|{"code":"#{ValSubjectSet001.fsubjectId}","shortName":"#{ValSubjectSet001.subjectName}"}|'>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable2">科目级别</label>
                        <div class="layui-input-inline input-inline">
                            <!-- <input type="text" id="subjectLevel" name="subjectLevel" placeholder="请选择"
                                class="layui-input form-input input-select" 
                                data-th-data-result='${SUBJECT_LEVEL}' > -->
                               <select type="text" id="subjectLevel" name="subjectLevel" 
                                   class="layui-input form-input input-select" 
                                   parentIds = "subjectNo" 
                                   data-th-data-url='@{/valuation/accounadjustmanage/subjectset/ValSubjectSet001/getSubjectLevel}' 
                                   allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                               </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable2">科目号</label>
                        <div class="layui-input-inline input-inline">
                            <!-- <input type="text" id="subjectNo" name="subjectNo" placeholder="请输入内容" class="layui-input form-input"> -->
                            <!-- <input type="text" id="subjectNo" name="subjectNo"
                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                data-parentIds = "subjectLevel" 
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/valuation/accounadjustmanage/subjectset/ValSubjectSet001/getSubjectId2}"
                                data-idfield="code" data-keyfield="code"
                                data-th-data-effectivefieldsalias='|{"code":"#{ValSubjectSet001.subjectNo}","shortName":"#{ValSubjectSet001.subjectName}"}|'> -->
                               <select type="text" id="subjectNo" name="subjectNo" 
                                   class="layui-input form-input input-select" 
                                   parentIds = "booksetId,subjectLevel" formatoption = "false"
                                   data-th-data-url='@{/valuation/accounadjustmanage/subjectset/ValSubjectSet001/getSubjectId2}' 
                                   allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                               </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable2">科目名称</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="subjectName" name="subjectName" placeholder="请输入内容" class="layui-input form-input">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable2" data-th-text="#{ValSubjectSet001.subjectType}"></label>
                        <div class="layui-input-inline input-inline">
                            <input id="subjectType" name="subjectType" class="input-select"
                                data-th-data-result="${SUBJECT_TYPE}" placeholder="请选择" allowClear="true">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable2">余额方向</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="balFlag" name="balFlag" placeholder="请选择"
                                class="layui-input form-input input-select" data-th-data-result='${BAL_FLAG}'>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/valuation/accounadjustmanage/subjectset/ValSubjectSet001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
