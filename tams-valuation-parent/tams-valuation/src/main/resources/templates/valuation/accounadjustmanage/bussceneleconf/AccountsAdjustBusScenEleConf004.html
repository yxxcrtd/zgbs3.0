<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>业务要素新建</title>
</head>
<body>

</body>
<div layout:fragment="content">
    <form id="submitForm">
        <div class="layui-form layui-clear" style="margin-top: 10px;">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable2">
                                                            业务场景代码
                </label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="AccountsAdjustBusScenEleConf004_tableId" class="layui-input form-input input-lenovoselect"
                        disabled="disabled" data-th-value="${tableId}">
                </div>
            </div>
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable2">
                                                             业务场景名称
                </label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="AccountsAdjustBusScenEleConf004_tableName" class="layui-input form-input input-lenovoselect"
                       disabled="disabled" data-th-value="${tableName}">
                </div>
            </div>   
          </div>
          <div class="layui-form layui-clear" style="margin-top: 10px;">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable2">
                 <i class="iconfont must">*</i>
                                                             数据项代码
                </label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="AccountsAdjustBusScenEleConf004_dictCode" class="layui-input form-input input-lenovoselect"
                        placeholder="请输入数据项代码" value="" data-th-value="${dictCode}">
                </div>
            </div> 
             <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable2">
                 <i class="iconfont must">*</i>
                                                             数据项名称
                </label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="AccountsAdjustBusScenEleConf004_dictName" class="layui-input form-input input-lenovoselect"
                        placeholder="请输入数据项名称" value="" data-th-value="${dictName}">
                </div>
            </div>     
        </div>
        
         <div class="layui-form layui-clear" style="margin-top: 10px;">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable2">
                 <i class="iconfont must">*</i>
                                                             数据类型
                </label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="AccountsAdjustBusScenEleConf004_dictType"  class="layui-input form-input input-checkbox" data-result='[{&quot;id&quot;:&quot;N&quot;,&quot;text&quot;:&quot;数值型&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;Y&quot;,&quot;text&quot;:&quot;下拉框&quot;,&quot;col&quot;:&quot;&quot;}]'
                        data-th-data-result="${DICT_TYPE}" data-th-value="${dictType}">
                </div>
            </div> 
             <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable2">
                 <i class="iconfont must">*</i>
                                                             数据来源
                </label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="AccountsAdjustBusScenEleConf004_dictSource" class="layui-input form-input input-lenovoselect"
                        placeholder="请输入数据项名称" value="" data-th-value="${dictSource}">
                </div>
            </div>   
            <input type="text" id="AccountsAdjustBusScenEleConf004_dealtype" class="layui-input form-input input-lenovoselect"
                        disabled="disabled" data-th-value="${dealType}" style="display:none;">       
        </div>
    </form>
    <div class="layui-col-md11" style="margin: 10px;">
        <div class="text-center">
            <a id="AccountsAdjustBusScenEleConf004_btn_save" class="layui-btn layui-btn-sm btn-save">提交</a> 
            <a id="AccountsAdjustBusScenEleConf004_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/valuation/accounadjustmanage/bussceneleconf/AccountsAdjustBusScenEleConf004.js}" type="text/javascript"></script>
</div>
</html>
