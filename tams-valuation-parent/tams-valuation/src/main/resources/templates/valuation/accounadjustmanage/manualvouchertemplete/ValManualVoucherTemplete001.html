<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>手工凭证模板</title>
</head>

<body>

<div layout:fragment="content">
    <div class="form-button-area" >
        <a id="ValManualVoucherTemplete001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
        <a id="ValManualVoucherTemplete001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}">删除</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">模板编号</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="tmpCode" name="tmpCode" class="layui-input form-input" value="" placeholder="请输入内容">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">模板名称</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="tmpName" name="tmpName" class="layui-input form-input" value="" placeholder="请输入内容">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">业务类型</label>
                    <div class="layui-input-inline input-inline" style="display: block;">
                      <input id="busiType" name="busiType" class="layui-input form-input input-select" placeholder="请选择" data-th-data-result="${FINPROD_TYPE}" allowClear="true">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4" >
                   <label class="layui-form-label form-lable">凭证是否展示分录</label>
                   <div class="layui-input-inline input-inline" >
                       <input type="checkbox" name="isShowfl" id ="isShowfl" lay-skin="switch" lay-text="是|否"
                       data-th-checked="${YES}"   data-th-value="${YES_OR_NO}" >
                   </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
</body>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/accounadjustmanage/manualvouchertemplete/ValManualVoucherTemplete001.js}" type="text/javascript"></script>
</div>

</html>
