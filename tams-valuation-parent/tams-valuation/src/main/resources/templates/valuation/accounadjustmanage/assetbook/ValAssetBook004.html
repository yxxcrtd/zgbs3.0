<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{ValAssetBook004}">复制账套管理</title>
</head>

<body>
<div layout:fragment="content">
  <form id="submitForm">
    <div class="layui-form" style=" margin-top:10px;">
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>产品代码</label>
        <div class="layui-input-block input-inline">
          <input type="text"  class="layui-input form-input input-lenovoselect" placeholder="请选择产品或输入关键词" value="" data-url="/system/institution/SysInstitution001/getInstitutionCode" data-idfield="code" data-keyfield="code" data-effectivefieldsalias='{&quot;code&quot;:&quot;产品代码&quot;,&quot;shortName&quot;:&quot;产品名称&quot;}'>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>产品名称</label>
        <div class="layui-input-block input-inline">
          <input type="text" class="layui-input form-input" value="选产品代码自动代入名称">
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>所属账套</label>
        <div class="layui-input-block  input-inline">
          <input type="text" class="layui-input form-input" value="银行账套" disabled>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>当前账套</label>
        <div class="layui-input-block  input-inline">
          <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;银行账套&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;10&quot;,&quot;text&quot;:&quot;理财账套&quot;,&quot;col&quot;:&quot;&quot;}]'>
        </div>
      </div>
    </div>
  </form>
  <div class="layui-col-md11" style="margin:10px 0 10px 0;">
    <div class="text-center">
<!--       <a id="ValAssetBook002_btn_save" class="layui-btn layui-btn-sm btn-save">保存</a> -->
      <a id="ValAssetBook002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
      <a id="ValAssetBook002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
    </div>
  </div>
</div>
<div layout:fragment="script"> 
  <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script> 
</div>
</body>
</html>
