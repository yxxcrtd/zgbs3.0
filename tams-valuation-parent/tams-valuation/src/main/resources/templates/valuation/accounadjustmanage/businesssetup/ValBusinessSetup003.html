<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>新建业务参数设置</title>
</head>
<body>

</body>
<div layout:fragment="content">
  <form id="submitForm">
    <div class="layui-form" style=" margin-top:10px;">
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>业务场景代码</label>
        <div class="layui-input-block input-inline">
          <input type="text" class="layui-input form-input" placeholder="请输入内容"  value="">
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>业务场景名称</label>
        <div class="layui-input-block input-inline">
          <input type="text" class="layui-input form-input" placeholder="请输入内容"  value="">
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>数据项代码</label>
        <div class="layui-input-block input-inline">
          <input type="text" class="layui-input form-input" placeholder="请输入内容"  value="">
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>数据项名称</label>
        <div class="layui-input-block input-inline">
          <input type="text" class="layui-input form-input" placeholder="请输入内容"  value="">
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>数据类型</label>
        <div class="layui-input-block input-inline">
          <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;某某类型A&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;10&quot;,&quot;text&quot;:&quot;某某类型B&quot;,&quot;col&quot;:&quot;&quot;}]'>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>数据来源</label>
        <div class="layui-input-block input-inline">
          <input type="text" class="layui-input form-input" placeholder="请输入内容"  value="">
        </div>
      </div>
    </div>
  </form>
  <div class="layui-col-md11" style="margin:10px;">
   	<div class="text-center">
        <a id="ValBusinessSetup002_btn_save" class="layui-btn layui-btn-sm btn-save">保存</a>
        <a id="ValBusinessSetup002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
        <a id="ValBusinessSetup002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
    </div>
   </div>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script>
</div>
</html>
