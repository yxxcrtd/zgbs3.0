<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ValProfitQuery001}">资产负债表-账套明细列表</title>
<script th:inline="javascript">
	// 表格ID
	var tableId = [[${entity?.tableId}]];
	// 报表期限类型
	var reportTermType = [[${entity?.reportTermType}]];
	// 期限
	var reportTerm = [[${entity?.reportTerm}]];
	// 报表维度
	var reportDimen = [[${entity?.reportDimen}]];
	// 账套组
	var booksetGroup = [[${entity?.booksetGroup}]];
</script>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area"></div>
        
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm" autocomplete="off" style="heigth:60px;">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                    	<label class="layui-form-label form-lable2">日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="reportDate" name="reportDate" class="layui-input form-input" data-th-value="${entity?.reportDate}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable2">指标</label>
                        <div class="layui-input-inline input-inline">
                        	<input type="text" id="itemName" name="itemName" class="layui-input form-input" data-th-value="${entity?.itemName}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable2">期末余额</label>
                        <div class="layui-input-inline input-inline">
                        	<input type="text" id="endingBalance" name="endingBalance" class="layui-input form-input" data-th-value="${entity?.endingBalance}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable2">年初余额</label>
                        <div class="layui-input-inline input-inline">
                        	<input type="text" id="initialBalance" name="initialBalance" class="layui-input form-input" data-th-value="${entity?.initialBalance}">
                        </div>
                    </div>
                </div>
            </form>
            </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/financialstatement/assetliailitystatement/AssetLiabilityStatementQuery002.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
