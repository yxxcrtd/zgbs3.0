<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>资产负债表</title>
</head>
<body>
</body>
<div layout:fragment="content">
    <div class="form-button-area">
        <!-- 默认有导出按钮 #ValAssetsFundQuery001_btn_export-->
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm" autocomplete="off" >
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md3">
                    <label class="layui-form-label form-lable" >报表维度</label>
                    <div class="layui-input-inline input-inline" >
                        <input type="text" id="reportDimen" name="reportDimen"
                               class="layui-input form-input input-checkbox" required="required"
                               data-th-data-result="${BATCH_BOOKSET_TYPE}" data-th-initvalue="${reportDimen}" allowClear="true">
                    </div>
                </div>
                <div class="layui-inline layui-col-md3" id="c_booksetGroup">
                    <label class="layui-form-label form-lable" >账套组</label>
                    <div class="layui-input-inline input-inline">
                        <select id="booksetGroup" name="booksetGroup"
                                class="layui-input form-input input-select" allowClear="true" formatoption = "false"
                                placeholder="请选择" required="required"
                                data-th-data-url='@{/valuation/financialstatement/assetliailitystatementnew/AssetLiabilityStatementNewQuery001/findBooksetGroup}'>
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md3" id="c_booksetId">
                    <label class="layui-form-label form-lable" >账套</label>
                    <div class="layui-input-inline input-inline">
                        <select id="booksetId" name="booksetId"
                                class="layui-input form-input input-select" allowClear="true"
                                placeholder="请选择" required="required"
                                data-th-data-url='@{/valuation/financialstatement/assetliailitystatementnew/AssetLiabilityStatementNewQuery001/findBooksetId}'>
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md3">
                    <label class="layui-form-label form-lable">筛选条件</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" class="layui-input form-input input-select" id="reportTermType"
                                name="reportTermType" placeholder="请选择报表期限类型" allowClear="true"
                                data-th-data-result="${REPORT_TERM_TYPE}" childrenIds="reportTerm" required>
                            <option></option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md3">
                    <div class="layui-input-inline input-inline" id="c_year_reportDate" style="display:none;">
                        <input type="text" class="layui-input form-input" id="year_reportDate"
                               name="reportDate" placeholder="请选择日期" >
                    </div>
                    <div class="layui-input-inline input-inline" id="c_month_reportDate" style="display:none;">
                        <input type="text" class="layui-input form-input" id="month_reportDate"
                               name="reportDate" placeholder="请选择日期" >
                    </div>
                    <div class="layui-input-inline input-inline" id="c_date_reportDate"style="display:none;">
                        <input type="text" class="layui-input form-input" id="date_reportDate"
                               name="reportDate" placeholder="请选择日期"  >
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md3" id="c_reportTerm" style="display:none;">
                    <label class="layui-form-label form-lable">期限</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" class="layui-input form-input input-select" id="reportTerm"
                                name="reportTerm" placeholder="请选择期限" allowClear="true" data-url="getTermLink"
                                parentIds="reportTermType" required>
                            <option></option>
                        </select>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="layui-form-item">
        <div class="layui-col-md12">
            <h2 style="text-align: center; font-weight: bold;">资产负债表</h2>
        </div>
    </div>
    <div class="layui-row">
        <div class="layui-col-md2 layui-col-md-offset4" id="org">编制单位： </div>
        <div class="layui-col-md2 layui-col-md-offset1" id="statementType">报表类型： </div>
    </div>
    <div class="layui-row">
        <div class="layui-col-md2 layui-col-md-offset4" id="statementDate">统计日期： </div>
        <div class="layui-col-md2 layui-col-md-offset1">单位： 元</div>
    </div>
    <div class="layui-row" style="height: 30px!important;">
        <div class="layui-inline layui-col-md6">
            <table id="AssetTable"></table>
        </div>
        <div class="layui-inline layui-col-md6">
            <table id="LiabilityInterestTable"></table>
        </div>
    </div>
    <div class="layui-row">
        <div class="layui-inline layui-col-md12">
            <span style="font-size: 1px;">
                附注：理财产品份额净值<span id="valuation" name="valuation"></span>元，理财产品份额总额<span id="sumprice" name="sumprice"></span>份。
            </span>
        </div>
    </div>
    <div style="display: block; height: 40px; width: 100%;"></div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/financialstatement/assetliailitystatementnew/AssetLiabilityStatementNewQuery001.js}"
            type="text/javascript"></script>
</div>
</html>
