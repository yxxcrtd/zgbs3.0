<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{ValInertfLog001}">接口日志</title>
</head>
<body>
    <div layout:fragment="content">
               <div class="form-button-area" export="false">
<!--                  <a id="ValInertfLog001_btn_export" class="layui-btn layui-btn-sm"> -->
<!--                  <i class="iconfont icon-export"></i> <span>导出</span></a> -->
                 </div>
                    <div class="joyin-form-wrap joyin-filter-form condition-area">
           <form class="layui-form" id="ValInertfLog001_FORM_pageForm">
             <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">模板名称</label>
                    <div class="layui-input-inline input-inline">
                            <input type="text" id="ValInertfLog001_tmp"  placeholder="请输入内容" class="layui-input form-input">
                    </div>
                </div>
                 
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">文件名称</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="ValInertfLog001_name" placeholder="请输入内容" class="layui-input form-input">
                    </div>
                </div>
                </div>
                   <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="ValInertfLog001_exdate" placeholder="请选择、支持区间" class="layui-input form-input input-dateSelect">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">是否通过</label>
                    <div class="layui-input-inline input-inline">
                        <select id="ValInertfLog001_check" class="input-select"
                            data-result='[{&quot;id&quot;:&quot;Y&quot;,&quot;text&quot;:&quot;通过&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;N&quot;,&quot;text&quot;:&quot;不通过&quot;,&quot;col&quot;:&quot;&quot;}]'
                            placeholder="请选择" allowClear="true">
                            </select>
                    </div>
                </div>
            </div>
        </form>
        </div>
        <table class="layui-table" id="dataTable"></table>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/interf/inertfLog/ValInertfLog001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
