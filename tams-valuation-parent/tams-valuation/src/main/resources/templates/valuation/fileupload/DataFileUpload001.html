<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>文件上传</title>
</head>
<body>
</body>
<div layout:fragment="content">
    <div class="form-button-area" export="false">
        <!-- 默认有导出按钮 #DataFileUpload001_btn_export-->
        <a id="DataFileUpload001_btn_upload" class="layui-btn layui-btn-sm ">上传</a>
        <button type="button" class="layui-btn layui-btn-sm btn-delete" id="DataFileUpload001_btn_delete">删除</button>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable"> 文件名称 </label>
                    <div class="layui-input-inline input-inline">
                        <input id="fileName" name="fileName" class="layui-input form-input" placeholder="请输入内容"
                            allowClear="true" multiple="multiple">
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable-wrap"> 文件日期 </label>
                    <div class="layui-input-inline input-inline">
                        <input id="fileTime" name="fileTime" class="layui-input form-input input-dateRangeSelect"
                            allowClear="true" placeholder="请选择，支持区间">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div id="dataTable"></div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/fileupload/DataFileUpload001.js}" type="text/javascript"></script>
</div>
</html>
