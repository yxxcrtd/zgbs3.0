<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>新建上传文档</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm" style="background: #ffffff; padding: 10px 0;">
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md12">
                <label class="layui-form-label form-lable-wrap"> <i class="iconfont must"
                                                                    style="display: inline;">*</i> 文档类型
                </label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="fileType" name="fileType" placeholder="请输入内容"
                           class="layui-input form-input input-select" data-th-Value="${fileType}"
                           data-result="[{&quot;id&quot;:&quot;05&quot;,&quot;text&quot;:&quot;估值表对账文件&quot;,&quot;col&quot;:&quot;&quot;}
                            ]">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md12  layui-col-xs12 layui-col-sm12 layui-col-lg12"
                 style="margin: 30px;">
                <!--                     <div class="layui-upload-drag upload" id="template" data-allowfiletype=''
                                        data-th-data-url='@{/framework/fileUpload/uploadFile}' data-callback='FileUpload001.onUploaded'>
                                    </div> -->

                <div class="upload"
                     th:disabled="${pageModel} eq ${pageModelReference}"
                     th:data-data='${attachmentFiles}'
                     data-option="{allowFileType: 'xls|xlsx', muiltiple: false, autoUpload: true, type: 'drag', callback: 'FileUpload001.onUploaded'}">
                </div>


            </div>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/fileupload/DataFileUpload002.js}" type="text/javascript"></script>
</div>
</body>
</html>
