
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>报表查询展示</title>
<script th:inline="javascript">
</script>
</head>

<body>
<div layout:fragment="content">
	<div class="layui-row layui-col-space15">
		<div class="layui-col-md3" style="width: 22%">
		    <div class="joyin-form-wrap">
		      <form class="layui-form" id="proidSearchForm"> 
                   <div class="layui-form-item" >
                         <input type="text" id="reportCode" name="reportCode"
			                        class="layui-input form-input input-fuzzy-text"
			                        placeholder="输入报表名称或关键字"
			                        data-eventfunc="serachKey">
                   </div>
		      </form>
		    </div> 
		    <div class="layui-input" style="border: 1px solid #dbdbdb; scroll-y: auto; scroll-x: hidden; overflow-y: scroll;" data-checkall="false"
		    id='typeDatatree'  data-checkable='false' data-roottitle='披露报表'
		    data-th-url='|@{/disclosure/information/reveal/detailshow/ValRepDetailsShow001/getRepGroup}'></div>
	    </div>
	   	<div class="layui-col-md9" style="width: 78%">
	   		<div class="joyin-form-wrap condition-area" id="showSearch" style="height: 30px;">
		    </div>
		    <div class="layui-inline layui-col-md-offset9" style="margin-top: 10px;">
                
              	<a class="layui-btn layui-btn-sm btn-select" id="doSubimt" style="visibility: hidden;">生成<i class="iconfont icon-down"></i></a>
	                <ul class="btn-select-wrap" style="display: none;" id="toSubmit">
	                    <li><a href="javascript:;" id="excelSubimt">excel</a></li>
	                    <li><a href="javascript:;" id="wordSubimt">word</a></li>
                    	<li><a href="javascript:;" id="pdfSubimt">pdf</a></li>
	                    
	                </ul> 
	                
	            <button class="layui-btn layui-btn-sm " id="showDetailBtn"><i class="iconfont icon-search"></i>预览</button>  
	              
                <a class="layui-btn layui-btn-sm btn-select" id="doExport">导出<i class="iconfont icon-down"></i></a>
	                <ul class="btn-select-wrap" style="display: none;" id="toExport">
	                    <li><a href="javascript:;" id="excelExport">excel</a></li>
	                    <li><a href="javascript:;" id="wordExport">word</a></li>
	                    <li><a href="javascript:;" id="pdfExport">pdf</a></li>
	                    <li><a href="javascript:;" id="htmlExport">html</a></li>
	                </ul>
	                
           	</div>
			<div class="layui-tab layui-tab-card">
	        	<div id="showtable" style="overflow:auto"></div>
	    	</div>
	    </div>
    </div>
</div>
</body>
<div layout:fragment="script">
  	<script data-th-src="@{/js/valuation/disclosure/information/reveal/detailshow/ValRepDetailsShow001.js}" type="text/javascript"></script>
<!-- 	<script data-th-src="@{/js/valuation/report/report.js}" type="text/javascript"></script> -->
	<script data-th-inline="javascript" type="text/javascript">		
		//净值型产品列表
		var prod_jzx = [[${prodInfoList_jzx}]];
		var prodArray_jzx =  $.parseJSON(prod_jzx);
		//货币型产品列表
		var prod_hbx = [[${prodInfoList_hbx}]];
		var prodArray_hbx =  $.parseJSON(prod_hbx);
		//产品对象-全局变量
		var prodArray = new Object();
		
		var REPORT_SERVER_URL = [[${REPORT_SERVER_URL}]];
	    var REPORT_USERNAME = [[${REPORT_USERNAME}]];
	    var REPORT_PASSWORD = [[${REPORT_PASSWORD}]];
	    var REPORT_SERVER_PATH = [[${REPORT_SERVER_PATH}]];
	</script>
</div>

</html>
