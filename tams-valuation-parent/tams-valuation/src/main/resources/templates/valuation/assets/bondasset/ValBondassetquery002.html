<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<title>查看债券类资产</title>

<script th:inline="javascript">
	var initisright = [[${entity?.isRight}]];
    var initcouponType = [[${entity?.couponTypeCode}]];
    var initRatestr = [[${entity?.ratestr}]];
    var workflowId = [[${workflowId}]];
    var hasDeals = [[${hasDeals}]];
    var ratestr = [[${entity?.ratestr}]];
</script>

 <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm" style="background: #ffffff; padding: 10px 0;">  
  <!-- 基本信息---------------------------------------------------------------------------------------------------------------------------------------------------------------- -->                
            <fieldset class="layui-elem-field layui-field-title">
                <div class="layui-collapse" lay-filter="test">
  
                <div class="layui-colla-item">

                <div class="layui-colla-content layui-show">
                   <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4">
                          <label class="layui-form-label form-lable">资产代码</label>
                          <div class="layui-input-inline input-inline">
                              <input type="text" id="finprodId" name="finprodId"   disabled="disabled"

                       </div>

                             </div>
                        </div>
                        <div class="layui-inline layui-col-md4">
                             <label class="layui-form-label form-lable">债券简称</label>

                        </div>
                   </div>
                   <div class="layui-form-item">
                          <div class="layui-inline layui-col-md4">

                       </div>

                       <div class="layui-inline layui-col-md4">

                       </div>
                   </div>
                   <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4">

                           </div>
                        </div>
                        <div class="layui-inline layui-col-md4">
                           <label class="layui-form-label form-lable">债券分类</label>
                           <div class="layui-input-inline input-inline">

                           </div>
                        </div>

                               </div>

                   </div>

                                 </select>
                             </div>
                        </div>
                   </div>
                   <div class="layui-form-item">
                         <div class="layui-inline layui-col-md4">
                           <label class="layui-form-label form-lable">起息日</label>
                           <div class="layui-input-inline input-inline">
                               <input type="text" id="vdate1" name="vdate1" class="layui-input form-input input-dateSelect" data-th-value="${entity?.vdate1}" disabled="disabled">
                           </div>
                        </div>
                        <div class="layui-inline layui-col-md4" >

                             <div class="layui-input-inline input-inline">
                                 <input type="text" id="mdate1" name="mdate1"  class="layui-input form-input input-dateSelect" data-th-value="${entity?.mdate1}" disabled="disabled">
                              </div>
                        </div>
                        <div class="layui-inline layui-col-md4" >
					        <label class="layui-form-label form-lable">是否永续</label>
					        <div class="layui-input-inline input-inline">
                                <input type="text" id="isSus" name="isSus" class="layui-input form-input input-checkbox" data-th-data-result="${YES_OR_NO}" data-th-initvalue="${entity?.isSus}">
                            </div>
				        </div>
				   </div>
                   <div class="layui-form-item">
                       <!--   <div class="layui-inline layui-col-md4">
                           <label class="layui-form-label form-lable">到期赎回价</label>
                           <div class="layui-input-inline input-inline">
                              <input type="text" id="dqshj" name="dqshj" class="layui-input form-input "  
                                 disabled="disabled" data-th-value="${entity?.dqshj}" >
                          </div>
                        </div>-->
                        <div class="layui-inline layui-col-md4">
                           <label class="layui-form-label form-lable">行权摊销日设置</label>
                           <div class="layui-input-inline input-inline">
                              <input type="text" id="exeDate" name="exeDate" class="layui-input form-input input-select"

                                 data-th-initValue="${entity?.exeDate}">
                          </div>
                        </div>
                        <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">是否含权债</label>
                                <div class="layui-input-inline input-inline">
                                    <select type="text" id="isRight" name="isRight" class="layui-input form-input input-select"  
                                          data-th-data-result="${YES_OR_NO}"
                                          data-th-initValue="${entity?.isRight}"></select>
                                </div>
                            </div>
                   </div>
                 </div>  
               </div>

             </fieldset>
  <!-- 计息要素---------------------------------------------------------------------------------------------------------------------------------------------------------------- -->             
             <fieldset class="layui-elem-field layui-field-title">
                <div class="layui-collapse" lay-filter="test">
                <div class="layui-colla-item">
                <h2 class="layui-colla-title"><a href="javascript:;">计息要素</a></h2>
                <div class="layui-colla-content layui-show">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                           <label class="layui-form-label form-lable">息票品种</label>
                           <div class="layui-input-inline input-inline">
                                <input type="text" id="couponType" name="couponType" class="layui-input form-input input-select"

                    <div class="layui-inline layui-col-md4">

                          </div>
                    </div>

                           <label class="layui-form-label form-lable">利息分配方式</label>
                           <div class="layui-input-inline input-inline">
                                 <input type="text" id="inttype" name="inttype" class="layui-input form-input input-select"

                                 </select>
                             </div>
                    </div> -->

                                <div class="layui-input-inline input-inline">
                                     <input type="text" id="ratetype" name="ratetype"

                                      data-th-initvalue="${entity?.ratetype}" allowClear="true" disabled="disabled">

                     <div class="layui-inline layui-col-md4">

                          <div class="layui-input-inline input-inline">
                              <input type="text" id="ratestr" name="ratestr" class="layui-input form-input"  
                                  data-th-value="${entity?.ratestr}" disabled="disabled">
                          </div>
                       </div>               
                </div>
                </div>
                </div>
                </div>
             </fieldset>
  <!-- 行权信息 -是否含权债为是时显示---------------------------------------------------------------------------------------------------------------------------------------------------------------- -->             
             <div id="div1" >
             <fieldset class="layui-elem-field layui-field-title">
             <div class="layui-collapse" lay-filter="test">
             <div class="layui-colla-item">

             <div class="layui-collapse" lay-filter="test">
             <div class="layui-colla-item">
             <h2 class="layui-colla-title"><a href="javascript:;">债券利率报价信息</a></h2>

                     <table class="layui-table" id="dataTable1"></table>

             </div>

  <!-- 付息信息---------------------------------------------------------------------------------------------------------------------------------------------------------------- -->

             <div class="layui-collapse" lay-filter="test">
             <div class="layui-colla-item">

             <div class="layui-colla-content layui-show">
             <div class="layui-form-item">

                           </div>
                    </div>-->

                          <div class="layui-input-inline input-inline">
                              <input type="text" id="paycycle" name="paycycle" class="layui-input form-input input-select" 
                                      allowClear="true" data-th-initValue="${entity?.paycycle}" disabled="disabled"
                                     data-th-data-result="${FREQUENCY_UNIT}" >

                                      data-th-value="${entity?.calcrule}" allowClear="true" disabled="disabled"> -->
                                      <input type="text" id="calcrule" name="calcrule" class="layui-input form-input input-checkbox"
                                                    data-result="[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;起息日向后&quot;,&quot;col&quot;:&quot;&quot;},
                                                                 {&quot;id&quot;:&quot;03&quot;,&quot;text&quot;:&quot;首次付息日&quot;,&quot;col&quot;:&quot;&quot;}]"
                                                    data-th-initvalue="${entity?.calcrule}" disabled="disabled">

                               data-th-value="${entity?.fpayDate}" class="layui-input form-input input-dateSelect" disabled="disabled">
                           </div>
                </div>
             </div>
             </div>
             </div>
             </div>            
             </fieldset> 
            
  <!-- 付息计划列表---------------------------------------------------------------------------------------------------------------------------------------------------------------- -->             
             <fieldset class="layui-elem-field layui-field-title">
             <div class="layui-collapse" lay-filter="test">
             <div class="layui-colla-item">
             <h2 class="layui-colla-title"><a href="javascript:;">付息计划列表</a></h2>
             <div class="layui-colla-content layui-show" >
                 <div>
                      <table class="layui-table" id="dataTable2"></table>
                 </div>  
             </div>
             </div>
             </div>                            
             </fieldset> 
  <!-- 还本计划列表------------------------------------------------------------------------------------------------------------------------------------------------------------------>             
             <fieldset class="layui-elem-field layui-field-title">
             <div class="layui-collapse" lay-filter="test">
             <div class="layui-colla-item">
             <h2 class="layui-colla-title"><a href="javascript:;">还本计划列表</a></h2>

                  <a id="ValBondassetquery002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                      data-th-text="#{SysCommon.submit}">提交</a> 
                  <a id="ValBondassetquery002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                    data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/assets/bondasset/ValBondassetquery002.js}"
