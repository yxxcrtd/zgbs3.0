<!DOCTYPE html>

<link rel="stylesheet" type="text/css"

<script th:inline="javascript">
    var entityType = [[${entity?.type1}]];
</script>

						<div class="layui-colla-content layui-show">

									</div>
								</div>

									       <input type="text" id="finprodType" name="finprodType" class="layui-input form-input input-select"

									</div>
								</div>
							
                                <div class="layui-inline layui-col-md4" >
                                <label class="layui-form-label form-lable">到期日</label>

								</div>

                                    </div>
                                </div>
								<div class="layui-inline layui-col-md4">

									<div class="layui-input-inline input-inline">
										<input type="text" id="blnArea" name="blnArea" data-th-required="${newOrEdit}"

											data-th-initvalue="${entity?.blnArea}" 
											data-th-disabled="${newOrEdit}">
									</div>
								</div>
                                </div>
                                <div class="layui-form-item">

                                    <label class="layui-form-label form-lable">资产类型</label>
                                    <div class="layui-input-inline input-inline">

                                            data-th-data-result="${DEPOSIT_TYPE}"   data-th-required="true"

							</div>
                      


						</div>
					</div>
				</div>
	
				<div class="layui-collapse" lay-filter="test">

						<h2 class="layui-colla-title">
							<a href="javascript:;">计息要素</a>
						</h2>
						<div class="layui-colla-content layui-show">
							<div class="layui-form-item">
								<div class="layui-inline layui-col-md4">
									<label class="layui-form-label form-lable">计息基础</label>
									<div class="layui-input-inline input-inline">
										<select id="basis" name="basis"  data-th-required="true"
											class="layui-input form-input input-select" allowClear="true"
											data-th-initvalue="${entity?.basis}"  data-th-data-result="${BASIS}"
											data-th-disabled="${(!notEditOrgCode)&&newOrEdit}">
										</select>
									</div>
								</div>
								<div class="layui-inline layui-col-md4">
									<label class="layui-form-label form-lable">初始利率(%)</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="basicRate" name="basicRate" 
											class="layui-input form-input"  placeholder="提交后自动生成"
											data-th-value="${entity?.basicRate}" data-th-disabled="true">
									</div>
								</div>
                                
                            <div class="layui-inline layui-col-md4">
									<label class="layui-form-label form-lable">利率类型</label>
									<div class="layui-input-inline input-inline">

											class="layui-input form-input input-select" allowClear="true" data-th-required="true"

										</select>
									</div>
								</div>

							</div>
						</div>
					</div>
				</div>

							<a href="javascript:;">付息信息</a>

						<div class="layui-colla-content layui-show">

									<div class="layui-input-inline input-inline">
                                            <input type="text" id="tdayRule" name="tdayRule" class="layui-input form-input input-checkbox"

									</div>
								</div>-->

									<div class="layui-input-inline input-inline">
										<input type="text" id="payCycle" name="payCycle" class="layui-input form-input input-select" 
											data-th-data-result="${FREQUENCY_UNIT}" allowClear="true" data-th-required="true"
											data-th-value="${entity?.payCycle}" data-th-disabled="${(!notEditOrgCode)&&newOrEdit}">
									</div>
								</div>
								
								<div class="layui-inline layui-col-md6">
									<label class="layui-form-label form-lable">推算方式</label>
									<div class="layui-input-inline input-inline">

						<div class="layui-colla-content layui-show">

					</div>
				</div>
                
                <!-- modify by dongun on 20181201 start -->
		        <div class="layui-collapse" lay-filter="test" id="hbjh">
                    <div class="layui-colla-item">
                        <h2 class="layui-colla-title">
                            <a href="javascript:;">还本计划表</a>

                        <div class="layui-colla-content layui-show">

                            </div>
                        </div>
                    </div>
                </div>
                <!-- modify by dongun on 20181201 end -->
                
				<div class="layui-collapse" lay-filter="test">

			<div class="layui-form-item">
				<div class="text-center">
					<a id="ValDespositAssetQuery002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a> <a
                    id="ValDespositAssetQuery002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
				</div>

         <input type="text" id="workflowId" name="workflowId" class="layui-input form-input" data-th-value="${workflowId}" disabled="disabled" style = "display:none;">
         <input type="text" id="status" name="status" class="layui-input form-input" data-th-value="${status}" disabled="disabled" style = "display:none;">

	<div layout:fragment="script">
          <script data-th-inline="javascript" type="text/javascript">
            var CCY_DATA = /*[[${CCY}]]*/'';
            var QTYSK_BJ = /*[[${QTYSK_BJ}]]*/'';
            var QTYSK_LX = /*[[${QTYSK_LX}]]*/'';
        </script>
		<script
			data-th-src="@{/js/valuation/assets/posit/ValDespositAssetQuery002.js}"
			type="text/javascript"></script>
	</div>
