<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{ValPlannedassetquery001}">计划类资产查询</title>
</head>

<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a id="ValPlannedassetquery001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
        <a id="ValPlannedassetquery001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}" >删除</a>
        <a id="ValPlannedassetquery001_btn_copy" class="layui-btn layui-btn-sm btn-copy" data-th-text="#{SysCommon.copy}">复制</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">       
            <div class="layui-form-item">              
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">资产代码</label>
                    <div class="layui-input-inline input-inline">
                        <select id="bond" name="bond"  class="layui-input form-input input-select"  placeholder="请输入资产代码或名称"
                            data-th-data-url="@{/valuation/assets/plan/ValPlannedassetquery001/getBondId}"
                            multiple="multiple" allowClear="true" >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">收益类型</label>
                    <div class="layui-input-inline input-inline" >
                      <select type="text" id="profitType" name="profitType" class="layui-input form-input input-select" placeholder="请输入内容" 
                      data-th-data-result="${PROFIT_TYPE}" multiple="multiple" allowClear="true">
                      </select>
                    </div>
                </div>  
                 <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">资产类型</label>
                    <div class="layui-input-inline input-inline">
                      <select type="text" id="assetType" name="assetType" placeholder="请输入内容" class="layui-input form-input input-select" 
                      data-th-data-result="${PLANNED_TYPE}" multiple="multiple" allowClear="true">
                      </select>  
                    </div>
                </div>                  
            </div>
            <div class="layui-form-item">               
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">起息日</label>
                    <div class="layui-input-inline input-inline">
                      <input type="text" id="vdate" name="vdate" placeholder="请选择、支持区间" class="layui-input form-input input-dateRangeSelect" allowClear="true">
                    </div>
                </div>                   
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">到期日</label>
                    <div class="layui-input-inline input-inline">
                      <input type="text" id="mdate" name="mdate" placeholder="请选择、支持区间" class="layui-input form-input input-dateRangeSelect" allowClear="true">
                    </div>
                </div>
             </div>            
        </form>
        </div>
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
     </div>
</body>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/assets/plan/ValPlannedassetquery001.js}" type="text/javascript"></script>
</div>

</html>
