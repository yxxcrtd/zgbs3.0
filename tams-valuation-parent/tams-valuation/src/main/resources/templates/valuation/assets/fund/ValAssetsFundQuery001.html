<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>基金类资产查询</title>
</head>
<body>
</body>
<div layout:fragment="content">
    <div class="form-button-area">
        <!-- 默认有导出按钮 #ValAssetsFundQuery001_btn_export-->
        <a id="ValAssetsFundQuery001_btn_add" class="layui-btn layui-btn-sm btn-create"
            data-th-text="#{SysCommon.create}">新建</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">资产</label>
                    <div class="layui-input-inline input-inline">
                        <select id="finprodId" name="finprodId" formatResult="{id:id}"
                            class="layui-input form-input input-select" data-url='getAssets' allowClear="true"
                            placeholder="请选择资产或输入代码及关键词" multiple="multiple">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">基金类型</label>
                    <div class="layui-input-inline input-inline">
                        <select id="fundType" name="fundType" class="layui-input form-input input-select"
                            data-th-data-result='${FUND_TYPE}' allowClear="true" multiple="multiple" placeholder="请输入内容"
                            data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable"> 管理人</label>
                    <div class="layui-input-inline input-inline">
                        <input id="issuer" name="issuer" class="layui-input form-input" placeholder="请输入内容"
                            allowClear="true" multiple="multiple">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div id="dataTable"></div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/assets/fund/ValAssetsFundQuery001.js}" type="text/javascript"></script>
</div>
</html>
