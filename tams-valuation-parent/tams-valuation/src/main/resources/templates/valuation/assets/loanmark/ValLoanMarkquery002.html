<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>拆借标的查看</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm" style="background: #ffffff; padding: 10px 0;">
            <!-- 基本信息---------------------------------------------------------------------------------------------------------------------------------------------------------------- -->
            <fieldset class="layui-elem-field layui-field-title">
                <div class="layui-collapse" lay-filter="test">
                    <div class="layui-colla-item">
                        <h2 class="layui-colla-title">
                            <a href="javascript:;">基本要素</a>
                        </h2>
                        <div class="layui-colla-content layui-show">
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodId" name="finprodId"
                                            class="layui-input form-input" data-th-value="${entity?.finprodId}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">核算分类</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="type2Code" name="type2Code"
                                            class="layui-input form-input input-select"
                                            data-th-data-result="${LEND_ACCOUNTING_CLASSIFICATION}" allowClear="true"
                                            data-th-initValue="${entity?.type2}">
                                        </select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">本金收益特征</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="capiIncomeFeature" name="capiIncomeFeature"
                                            class="layui-input form-input input-select"
                                            data-th-data-result="${AMT_INCOME_TYPE}" allowClear="true"
                                            data-th-initValue="${entity?.capiIncomeFeature}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">拆借方向</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="finprodTypeCode" name="finprodTypeCode"
                                            class="layui-input form-input input-select"
                                            data-th-data-result="${FINPROD_TYPE}" allowClear="true"
                                            data-th-initValue="${entity?.finprodType}">
                                        </select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">期限品种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="termTypeCode" name="termTypeCode"
                                            class="layui-input form-input input-select"
                                            data-th-data-result="${TERM_TYPE_RESOLUTE}" allowClear="true"
                                            data-th-initValue="${entity?.termType}">
                                        </select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="ccy" name="ccy" class="layui-input form-input input-select"
                                            data-th-data-result="${CCY}" allowClear="true"
                                            data-th-initValue="${entity?.ccy}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">起息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="vdate" name="vdate" data-th-value="${entity?.vdate}"
                                            class="layui-input form-input" value="">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">到期日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="mdate" name="mdate" data-th-value="${entity?.mdate}"
                                            class="layui-input form-input" value="">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">计息基础</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="basis" name="basis" class="layui-input form-input input-select"
                                            data-th-data-result="${BASIS}" allowClear="true"
                                            data-th-initValue="${entity?.basis}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable"> 交易日历</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="calendarName" name="calendarName"
                                            class="layui-input form-input input-select"
                                            data-th-data-result="${TRANSACTION_CALENDAR}" allowClear="true"
                                            data-th-initValue="${entity?.calendarId}">
                                        </select>
                                        <input type="text" id="calendarId" name="calendarId" style="display: none;"
                                            data-th-value="${entity?.calendarId}">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </fieldset>
            <!-- 金额信息 ---------------------------------------------------------------------------------------------------------------------------------------------------------------- -->
            <div id="div1">
                <fieldset class="layui-elem-field layui-field-title">
                    <div class="layui-collapse" lay-filter="test">
                        <div class="layui-colla-item">
                            <h2 class="layui-colla-title">
                                <a href="javascript:;">金额信息</a>
                            </h2>
                            <div class="layui-colla-content layui-show">
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">拆借金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="prin" name="prin"
                                                class="layui-input form-input text-money" allowClear="true"
                                                data-th-Value="${entity?.prin}">
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">拆借利率（%）</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="intRate" name="intRate"
                                                class="layui-input form-input text-money" allowClear="true"
                                                data-th-Value="${entity?.intRate}">
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">应计利息</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="mIntAmt" name="mIntAmt"
                                                class="layui-input form-input text-money"
                                                data-th-value="${entity?.mIntAmt}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">到期本息和</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="mTradeAmt" name="mTradeAmt"
                                                class="layui-input form-input text-money" allowClear="true"
                                                data-th-Value="${entity?.mTradeAmt}">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </fieldset>
                <fieldset class="layui-elem-field layui-field-title">
                    <div class="layui-collapse" lay-filter="test">
                        <div class="layui-colla-item">
                            <h2 class="layui-colla-title">
                                <a href="javascript:;">备注</a>
                            </h2>
                            <div class="layui-colla-content layui-show">
                                <div class="layui-form-item layui-form-text">
                                    <div class="layui-input-block">
                                        <textarea name="remark" class="layui-textarea"></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </fieldset>
            </div>
        </form>
        <div class="layui-col-md11" style="margin: 50px;">
            <div class="text-center">
                <a id="ValManualVoucher003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                    data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
    <div layout:fragment="script"></div>
</body>
</html>
