<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>查看回购类资产</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm" style="background: #ffffff; padding: 10px 0;">
            <!-- 基本要素---------------------------------------------------------------------------------------------------------------------------------------------------------------- -->
            <fieldset class="layui-elem-field layui-field-title">
                <div class="layui-collapse" lay-filter="test">
                    <div class="layui-colla-item">
                        <h2 class="layui-colla-title">
                            <a href="javascript:;">基本信息</a>
                        </h2>
                        <div class="layui-colla-content layui-show">
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodId" name="finprodId"
                                            class="layui-input form-input" data-th-value="${entity?.finprodId}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">本金收益特征</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="capiIncomeFeature" name="capiIncomeFeature"
                                            class="layui-input form-input input-select"
                                            data-th-data-result="${AMT_INCOME_TYPE}"
                                            data-th-value="${entity?.capiIncomeFeature}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">资产类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodType" name="finprodType"
                                            class="layui-input form-input input-select"
                                            data-th-data-result="${FINPROD_TYPE}" data-th-value="${entity?.finprodType}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">交易场所</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeMarket" name="tradeMarket" class="layui-input form-input input-select"
                                            data-th-data-result="${VALUATION_TRADE_MARKET}"
                                            data-th-value="${entity?.tradeMarket}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="ccy" name="ccy" 
                                        data-th-data-result="${CCY}"
                                        data-th-value="${entity?.ccy}"
                                            class="layui-input form-input input-select">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">起息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="vdate1" name="vdate1" data-th-value="${entity?.vdate1}"
                                            class="layui-input form-input">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">到期日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="mdate1" name="mdate1" data-th-value="${entity?.mdate1}"
                                            class="layui-input form-input">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">回购品种</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="termType" name="termType" class="layui-input form-input input-select"
                                            data-th-data-result="${TERM_TYPE_COLLATERALISED_REPO}"
                                            data-th-value="${entity?.termType}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">计息基础</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="basis" name="basis"
                                            class="layui-input form-input input-select" data-th-data-result="${BASIS}"
                                            data-th-value="${entity?.basis}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">交易日历</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="calendarId" name="calendarId"
                                               data-th-data-result="${CALENDAR_ID}"
                                               class="layui-input form-input input-select" allowClear="true"
                                               data-th-value="${entity?.calendarId}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">首期交付日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="vpayDate" name="vpayDate" data-th-value="${entity?.vpayDate}"
                                               class="layui-input form-input">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">到期交付日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="mpayDate" name="mpayDate" data-th-value="${entity?.mpayDate}"
                                               class="layui-input form-input">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">合同编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="contractNo" name="contractNo" data-th-value="${entity?.contractNo}"
                                               class="layui-input form-input">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">计提天数方式</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="seRepDayTypeCode" name="seRepDayTypeCode"
                                               data-th-data-result="${SE_REP_DAY_TYPE}"
                                               class="layui-input form-input input-select" allowClear="true"
                                               data-th-value="${entity?.seRepDayTypeCode}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">实际占款天数</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="actCapDays" name="actCapDays" data-th-value="${entity?.actCapDays}"
                                               class="layui-input form-input">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">交易对手类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="counterType" name="counterType"
                                               data-th-data-result="${COUNTER_TYPE}"
                                               class="layui-input form-input input-select" allowClear="true"
                                               data-th-value="${entity?.counterType}">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </fieldset>
            <!-- 金额信息---------------------------------------------------------------------------------------------------------------------------------------------------------------- -->
            <fieldset class="layui-elem-field layui-field-title">
                <div class="layui-collapse" lay-filter="test">
                    <div class="layui-colla-item">
                        <h2 class="layui-colla-title">
                            <a href="javascript:;">金额信息</a>
                        </h2>
                        <div class="layui-colla-content layui-show">
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">首次结算金额</label>
                                    <div class="layui-input-inline input-inline input-inline-wrap">
                                        <input type="text" id="prin" name="prin" class="layui-input form-input "
                                            data-th-value="${entity?.prin}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">固定利率</label>
                                    <div class="layui-input-inline input-inline input-inline-wrap">
                                        <input type="text" id="intRate" name="intRate" class="layui-input form-input "
                                            data-th-value="${entity?.intRate}"><span class="input-right-show">%</span>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">到期本金</label>
                                    <div class="layui-input-inline input-inline input-inline-wrap">
                                        <input type="text" id="mPrinAmt" name="mPrinAmt" class="layui-input form-input "
                                            data-th-value="${entity?.mPrinAmt}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">到期利息</label>
                                    <div class="layui-input-inline input-inline input-inline-wrap">
                                        <input type="text" id="mIntAmt" name="mIntAmt" class="layui-input form-input "
                                            data-th-value="${entity?.mIntAmt}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">到期结算金额</label>
                                    <div class="layui-input-inline input-inline input-inline-wrap">
                                        <input type="text" id="mTradeAmt" name="mTradeAmt"
                                            class="layui-input form-input " data-th-value="${entity?.mTradeAmt}">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </fieldset>
            <!-- 抵押品信息---------------------------------------------------------------------------------------------------------------------------------------------------------------- -->
            <fieldset class="layui-elem-field layui-field-title">
                <div class="layui-collapse" lay-filter="test">
                    <div class="layui-colla-item">
                        <h2 class="layui-colla-title">
                            <a href="javascript:;">抵押品信息</a>
                        </h2>
                        <div class="layui-colla-content layui-show">
                            <div>
                                <table class="layui-table" id="dataTable"></table>
                            </div>
                        </div>
                    </div>
                </div>
            </fieldset>
            <!-- 备注---------------------------------------------------------------------------------------------------------------------------------------------------------------- -->
            <fieldset class="layui-elem-field layui-field-title">
                <div class="layui-collapse" lay-filter="test">
                    <div class="layui-colla-item">
                        <h2 class="layui-colla-title">
                            <a href="javascript:;">备注</a>
                        </h2>
                        <div class="layui-colla-content layui-show">
                            <div class="layui-form-item layui-form-text">
                                <div class="layui-input-block">
                                    <textarea name="remark"
                                        class="layui-textarea"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </fieldset>
        </form>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/assets/repurchase/ValRepurchaseAssetQuery002.js}"
            type="text/javascript">
        </script>
    </div>
</body>
</html>
