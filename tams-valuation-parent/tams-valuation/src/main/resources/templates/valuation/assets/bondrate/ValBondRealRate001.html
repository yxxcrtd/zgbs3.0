<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ValBondRealRate001}">债券实际利率查询</title>
<script th:inline="javascript">
    var workflowId = [[${workflowId}]];
</script>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area"></div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">账套</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="booksetId" name="booksetId"
                                class="layui-input form-input input-select" placeholder="请选择账套或输入代码及关键词"
                                data-th-data-url='@{getBooksetId}' allowClear="true">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">会计日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="vdate" name="vdate" placeholder="请选择、支持区间"
                                class="layui-input form-input input-dateRangeSelect" value="">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">债券代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="bondId" name="bondId" data-th-data-url='@{getBondId}'
                                class="layui-input form-input input-select" value="" placeholder="请输入内容"> </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">交易市场</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="market" name="market" placeholder="请输入内容"
                                class="layui-input form-input input-select"
                                data-th-data-result="${VALUATION_TRADE_MARKET}" allowClear="true">
                            </select>
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</body>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/assets/bondrate/ValBondRealRate001.js}" type="text/javascript"></script>
</div>
</html>
