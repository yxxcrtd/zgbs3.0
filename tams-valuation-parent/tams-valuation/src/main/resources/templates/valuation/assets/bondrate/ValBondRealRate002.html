<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ValBondRealRate001}">债券实际利率详情</title>
<script th:inline="javascript">
    var workflowId = [[${workflowId}]];
</script>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form" id="submitForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6" id="dBasicRate">
                    <label class="layui-form-label form-lable">账套代码</label>
                    <div class="layui-input-inline input-inline">
                           <input type="text" id="booksetId" name="booksetId" 
                           data-th-value="${entity?.booksetId}" 
                           class="layui-input form-input input-lenovoselect">
                    </div>
                </div>
                <div class="layui-inline layui-col-md6" id="dBasicRate">
                    <label class="layui-form-label form-lable">账套名称</label>
                    <div class="layui-input-inline input-inline">
                         <input type="text" id="booksetName" name="booksetName" 
                         data-th-value="${entity?.booksetName}" 
                         class="layui-input form-input input-lenovoselect">
                    
                    
                    </div>
                </div>
            </div>
             <div class="layui-form-item">
                <div class="layui-inline layui-col-md6" id="dBasicRate">
                    <label class="layui-form-label form-lable">债券代码</label>
                    <div class="layui-input-inline input-inline">
                           <input type="text" id="bondId" name="bondId" 
                           data-th-value="${entity?.bondId}" 
                           class="layui-input form-input input-lenovoselect">
                    </div>
                </div>
                <div class="layui-inline layui-col-md6" id="dBasicRate">
                    <label class="layui-form-label form-lable">债券名称</label>
                    <div class="layui-input-inline input-inline">
                         <input type="text" id="bondName" name="bondName" 
                         data-th-value="${entity?.bondName}" 
                         class="layui-input form-input input-lenovoselect">
                    
                    
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6" id="dBasicRate">
                    <label class="layui-form-label form-lable">会计日期</label>
                    <div class="layui-input-inline input-inline">
                          <input type="text" id="vdate" name="vdate" data-th-required="true"
                                        data-th-value="${entity?.vdate}"  
                                        class="layui-input form-input input-dateSelect"
                                        >
                    </div>
                </div>
                <div class="layui-inline layui-col-md6" id="dBasicRate">
                    <label class="layui-form-label form-lable">交易场所</label>
                    <div class="layui-input-inline input-inline">
                        <input id="market" name="market"
                            class="layui-input form-input input-select" 
                            data-th-initvalue="${entity?.market}"
                             placeholder="帐户选择后自动生成" 
                            data-th-data-result='${VALUATION_TRADE_MARKET}' 
                            allowClear="false" 
                            
                        >
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6" id="dBasicRate">
                    <label class="layui-form-label form-lable">实际日利率</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="realRate" name="realRate"
                           data-textrange="12" data-th-required="true"
                            class="layui-input form-input text-number" maxlength='14' data-th-value="${entity?.realRate}" >
                    </div>
                </div>
                <div class="layui-inline layui-col-md6" id="dBasicRate">
                    <label class="layui-form-label form-lable">折溢价余额</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="changeAmt" name="changeAmt" data-textrange="2" data-th-required="true"
                            class="layui-input form-input text-number" maxlength='14' data-th-value="${entity?.changeAmt}" >
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6" id="dBasicRate">
                    <label class="layui-form-label form-lable">摊余成本</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="tdyCostAmt" name="tdyCostAmt"
                           data-textrange="2" data-th-required="true"
                            class="layui-input form-input text-number" maxlength='14' data-th-value="${entity?.tdyCostAmt}" >
                    </div>
                </div>
                <div class="layui-inline layui-col-md6" id="dBasicRate">
                    <label class="layui-form-label form-lable">摊余净价</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="tdyNPAmt" name="tdyNPAmt" data-textrange="2" data-th-required="true"
                            class="layui-input form-input text-number" maxlength='14' data-th-value="${entity?.tdyNPAmt}" >
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6" id="dBasicRate">
                    <label class="layui-form-label form-lable">摊余全价</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="tdyFPAmt" name="tdyFPAmt"
                           data-textrange="2" data-th-required="true"
                            class="layui-input form-input text-number" maxlength='14' data-th-value="${entity?.tdyFPAmt}" >
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="text-center">
                    <a id="AccountCurrentRate002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a> <a
                        id="AccountCurrentRate002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
                </div>
            </div>
        </form>
    </div>
</body>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/assets/bondrate/ValBondRealRate002.js}" type="text/javascript"></script>
</div>
</html>
