<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{ValAssetsFundQuery002}">新建基金类资产</title>
<script th:inline="javascript">
     var trade = [[${trade}]];
     var profitType = [[${trade}]];
</script>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form " id="fundForm" style="background: #ffffff; padding: 10px 0;">
            <fieldset class="layui-elem-field layui-field-title">
                <div class="layui-collapse" lay-filter="test">
                    <div class="layui-colla-item">
                        <h2 class="layui-colla-title">
                            <a href="javascript:;">基本信息</a>
                        </h2>
                        <div class="layui-colla-content layui-show">
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">
                                        <i class="iconfont must"> * </i>
                                        资产代码
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="hidden" id="operateType" name="operateType"
                                            data-th-value="${entity?.operateType}">
                                        <input id="finprodId" name="finprodId" class="layui-input form-input"
                                            data-th-value="${entity?.finprodId}" data-th-disabled="${newOrEdit}" maxlength="32">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">
                                        <i class="iconfont must"> * </i>
                                        资产名称
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="finprodAbbr" name="finprodAbbr" class="layui-input form-input"
                                            data-th-value="${entity?.finprodAbbr}" maxlength="200">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">市场代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="finprodMarketId" name="finprodMarketId" maxlength="50"
                                            class="layui-input form-input" data-th-value="${entity?.finprodMarketId}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">
                                        <i class="iconfont must"> * </i>
                                        基金类型
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="fundType" name="fundType" class="layui-input form-input input-select"
                                            placeholder="" data-th-data-result="${FUND_TYPE}" allowClear="true"
                                            data-th-value="${fundType}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">
                                        <i class="iconfont must"> * </i>
                                        管理人
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="issuer" name="issuer" class="layui-input form-input " placeholder=""
                                            allowClear="true" data-th-value="${entity?.issuer}" maxlength="32">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">
                                        <i class="iconfont must"> * </i>
                                        币种
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="ccy" name="ccy" class="layui-input form-input input-select"
                                            placeholder="" allowClear="true" data-th-data-result="${CCY}"
                                            data-th-value="${entity?.ccy}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">
                                        <i class="iconfont must"> * </i>
                                        发行日
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="idate" name="idate" placeholder=""
                                            class="layui-input form-input input-dateSelect" data-th-value="${idate}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">
                                        <i class="iconfont must"> * </i>
                                        交易日历
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <!-- modify by yanya on 20210207 交易日历改造-->
                                       <!-- <input id="calendarId" name="calendarId"
                                            class="layui-input form-input input-select" placeholder=""
                                            data-th-data-result="${TRANSACTION_CALENDAR}" allowClear="true"
                                            data-th-value="${calendarId}">-->
                                        <select id="calendarId" name="calendarId" class="layui-input form-input input-select"
                                                placeholder="请选择" data-th-initValue="${entity?.calendarId}"
                                                data-th-data-url="@{/valuation/assets/fund/ValAssetsFundQuery002/getCalendarInfo}" allowClear="true"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                        </select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">
                                        <i class="iconfont must"> * </i>
                                        境内外
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="blnArea" name="blnArea" class="layui-input form-input input-checkbox"
                                            data-th-data-result="${BLN_AREA}" data-th-initvalue="${blnArea}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">
                                        <i class="iconfont must"> * </i>
                                        交易场所
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="tradeMarket" name="tradeMarket"
                                            class="layui-input form-input input-select" placeholder=""
                                            data-th-data-result="${TRADE_PLACE}" allowClear="true"
                                            data-th-value="${tradeMarket}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable"> 托管人 </label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="custodian" name="custodian" class="layui-input form-input "
                                            placeholder="" data-th-value="${entity?.custodian}" maxlength="32">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">
                                        <i class="iconfont must"> * </i>
                                        申购确认速度
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="purSpeed" name="purSpeed" class="layui-input form-input input-select"
                                            placeholder="" data-th-data-result="${APPLY_SPEED}" allowClear="true"
                                            data-th-value="${purSpeed}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">
                                        <i class="iconfont must"> * </i>
                                        赎回确认速度
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="redSpeed" name="redSpeed" class="layui-input form-input input-select"
                                            placeholder="" data-th-data-result="${REDEM_SPEED}" allowClear="true"
                                            data-th-value="${redSpeed}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">
                                        <i class="iconfont must"> * </i>
                                        本金收益特征
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="capiIncomeFeature" name="capiIncomeFeature"
                                            class="layui-input form-input input-checkbox"
                                            data-th-data-result="${AMT_INCOME_TYPE}"
                                            data-th-initvalue="${capiIncomeFeature}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4" id="isCompoundIntDiv">
                                    <label class="layui-form-label form-lable">是否按日复利</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="checkbox" name="isCompoundInt" id="isCompoundInt" lay-skin="switch"
                                            data-th-value="${YES_OR_NO}" lay-text="是|否"
                                            data-th-checked="${isCompoundInt eq 'Y' ? true : false}">
                                    </div>
                                </div>
                            </div>
<!--                             <div class="layui-form-item"> -->
<!--                             <div class="layui-inline layui-col-md4" id="profitTypeDiv"> -->
<!--                             	 <label class="layui-form-label form-lable">收益类型</label> -->
<!--                             	 <div class="layui-input-inline input-inline"> -->
<!--                                         <input id="profitType" name="profitType" class="layui-input form-input input-select" -->
<!--                                             placeholder="" data-th-data-result="${PROFIT_TYPE}" allowClear="true" -->
<!--                                             data-th-value="${entity?.profitType}"> -->
<!--                                 </div> -->
<!--                            </div> -->
<!--                            </div> -->
                        </div>
                    </div>
                </div>
            </fieldset>
            <fieldset class="layui-elem-field layui-field-title" style="margin-top: 20px; display: none" id="rule">
                <div class="layui-collapse" lay-filter="test">
                    <div class="layui-colla-item">
                        <h2 class="layui-colla-title">
                            <a href="javascript:;">分红规则</a>
                        </h2>
                        <div class="layui-colla-content layui-show">
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">分红频率</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="payCycle" name="payCycle" class="layui-input form-input input-select"
                                            data-th-data-result="${FUND_CARRYOVER_CYCLE}" allowClear="true"
                                            data-th-value="${payCycle}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">
                                        <i class="iconfont must"> * </i>
                                        分红日
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="sdate" name="sdate" placeholder=""
                                            class="layui-input form-input input-dateSelect" data-th-value="${sdate}"
                                            disabled="">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">营业日准则</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="tdayRule" name="payTdayRule" class="layui-input form-input input-select"
                                            data-th-value="${payTdayRule}" allowClear="true"
                                            data-th-data-result="${TDAY_RULE}" disabled="">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">推算方式</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="calcRule" name="calcRule" class="layui-input form-input input-select"
                                            data-th-value="${calcRule}" allowClear="true"
                                            data-th-data-result="${CALC_RULE}" disabled="">
                                    </div>
                                </div>
                                <!-- <div class="layui-inline layui-col-md4">
                                    <a class="layui-btn" id="showPlan" data-ignore="true">预览</a>
                                </div> -->
                            </div>
                        </div>
                    </div>
                </div>
            </fieldset>

                        <h2 class="layui-colla-title">
                            <a href="javascript:;">分红计划</a>
                        </h2>
                        <div class="layui-colla-content layui-show">
                            <div class="layui-form-item" data-th-if="${#lists.size(entity?.planList) eq 0}">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">没有分红计划信息！</label>

                                    </div>
                                </div>

        </form>
        <input type="text" id="workflowId" name="workflowId" class="layui-input form-input" data-th-value="${workflowId}" disabled="disabled" style = "display:none;">
        <!-- modify by yanya on 20210207 trad隐藏属性-->
        <input type="text" id="trade" name="trade" class="layui-input form-input" data-th-value="${trade}" disabled="disabled" style = "display:none;">
        <div class="layui-col-md11" style="margin: 10px 0 10px 0;">
            <div class="text-center">
                <a id="ValAssetsFundQuery002_btn_save" class="layui-btn layui-btn-sm btn-save">保存</a>
                <a id="ValAssetsFundQuery002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
                <a id="ValAssetsFundQuery002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script>
        <script data-th-src="@{/js/valuation/assets/fund/ValAssetsFundQuery002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
