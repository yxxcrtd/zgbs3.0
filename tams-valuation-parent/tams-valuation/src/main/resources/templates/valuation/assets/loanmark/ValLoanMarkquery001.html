<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="#{ValLoanMarkquery001}">拆借标的查询</title>
</head>

<body>
<div layout:fragment="content">
    <div class="form-button-area" >
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">       
            <div class="layui-form-item">              
            <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">资产</label>
                    <div class="layui-input-inline input-inline">
                        <input id="assets" name="assets"
                            class="layui-input form-input"
                            placeholder="请输入内容" allowClear="true"
                            multiple="multiple">
                    </div>
                </div>                 
                <div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">拆借方向</label>
						<div class="layui-input-inline input-inline">
							<select type="text" id="directionBorrowing"
								class="layui-input form-input input-select" placeholder="请选择"
								data-th-data-result="${FINPROD_TYPE}" allowClear="true"><option></option></select>
						</div>
					</div>          
                    <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">起息日</label>
                    <div class="layui-input-inline input-inline">
                      <input type="text" id="vDate" name="vDate" placeholder="请选择、支持区间" class="layui-input form-input input-dateRangeSelect" value="" >
                    </div>
                	</div> 
            </div>
            <div class="layui-form-item">                                              
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">到期日</label>
                    <div class="layui-input-inline input-inline">
                      <input type="text" id="mDate" name="mDate" placeholder="请选择、支持区间" class="layui-input form-input input-dateRangeSelect" value="" >
                    </div>
                </div>
             </div>            
        </form>
        </div>
            <div>
                <table class="layui-table" id="dataTable"></table>
            </div>
     </div>
</body>
<div layout:fragment="script">

  <script data-th-src="@{/js/valuation/assets/loanmark/ValLoanMarkquery001.js}" type="text/javascript"></script>
</div>

</html>
