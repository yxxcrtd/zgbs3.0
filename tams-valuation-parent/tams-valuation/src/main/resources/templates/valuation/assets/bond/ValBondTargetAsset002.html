<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ValBondTargetAsset002}">债券标的资产新建</title>
</head>
<body>
	<div layout:fragment="content" id="ValBondTargetAsset002_DIV">
		<div class="pro-module-container page-step">
			<form class="layui-form joyin-form-wrap pro-module-form"
				id="submitForm">
				<input id="finprodId" name="finprodId"
					data-th-value="${entity?.finprodId}" hidden> <input
					id="finprodType2" name="finprodType2"
					data-th-value="${entity?.finprodType2}" hidden> <input
					id="workflowId" name="workflowId" data-th-value="${workflowId}"
					hidden> <input type="text" id="seqno" name="seqno"
					class="layui-input form-input" data-th-value="${entity?.seqno}"
					style="display: none"> <input type="text" id="creditMstId"
					name="creditMstId" class="layui-input form-input"
					data-th-value="${entity?.creditMstId}" style="display: none">
				<input type="text" id="pfhId" name="pfhId"
					class="layui-input form-input" data-th-value="${entity?.pflsh}"
					style="display: none"> <input type="text" id="hapCreditAmt"
					name="hapCreditAmt" class="layui-input form-input"
					data-th-value="${entity?.hapCreditAmt}" style="display: none">
				<input type="text" id="creditFlag" name="creditFlag" style="display: none"
					data-th-value="${entity?.creditFlag}">
				<div class="pro-module-wrapper pro-module-base step" title="基本信息">
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title">
								<span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i
									class="iconfont icon-arrow-down pro-down-icon"></i>
							</h3>
							<div class="pro-module-item pro-item-wrap">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap">资产代码</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="finprodMarketId"
												name="finprodMarketId"
												data-th-value="${entity?.finprodMarketId}"
												class="layui-input form-input" placeholder="请输入内容"
												style="width: 85%!important; display: inline-block;"
												data-th-placeholder="#{SysCommon.placeholder}" required>
											<input type="text" id="tradeMarketId" name="tradeMarketId" 
                                                data-th-value="${tradeMarketId}"
                                            	class="layui-input form-input" 
                                            	style="width: 15%!important; display: inline-block;" readonly>
										</div>
									</div>
									<div class="form-inline-wrap">
                             			<label class="layui-form-label form-label-wrap">债券代码</label>
                             			<div class="layui-input-inline input-inline">
                                 			<input type="text" id="finprodId" name="finprodId" class="layui-input form-input" 
                                       				data-th-value="${entity?.finprodId}">
                             			</div>
                        			</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap">债券名称</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="finprodName"
												data-th-value="${entity?.finprodName}"
												class="layui-input form-input" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" >
										</div>
									</div>
									<a id='magnifier' class="input-right-show" href='javascript:;' style='color:#4893e6;left: 32.5%; top: 42px;'><i class='iconfont icon-search'></i></a>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap">债券简称</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="finprodAbbr"
												data-th-value="${entity?.finprodAbbr}"
												class="layui-input form-input" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap">交易场所</label>
										<div class="layui-input-inline input-inline">
											<select id="tradeMarket" name="tradeMarket"
												th:initValue="*{entity?.tradeMarket}"
												class="layui-input form-input input-select"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required
												data-th-data-result="${TRADE_PLACE}">
											</select>
										</div>
									</div>
									<!-- <div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap">交易日历</label>
										<div class="layui-input-inline input-inline">
											<select name="calendarId" id="calendarId"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-url="@{/business/common/CommonSelect/selectCalendarId}"
												data-th-initValue='${entity?.calendarId}'
												required="required">
											</select>
										</div>
									</div> -->
									<div class="form-inline-wrap">
                                    	<label class="layui-form-label form-label-wrap">交易日历</label>
										<div class="layui-input-inline input-inline">
											<select th:id="|${pageId}_calendarId|"
												name="productModuleInfo.calendarId"
												class="layui-input form-input input-select"
												placeholder="请输入内容"
												formatoption="false"
												data-th-placeholder="#{SysCommon.placeholder}" required
												data-th-data-url="@{/valuation/assets/bond/ValBondTargetAsset002/queryCalendarInfoList}"
												data-th-initValue='${entity?.calendarId}'>
											</select>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap">发行价格</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="issuePrice" name="issuePrice"
												data-th-value="${entity?.issuePrice}"
												class="layui-input form-input text-number"
												data-textrange="5" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap">发行日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="idate"
												data-th-value='${#dates.format(entity?.idate,"yyyy-MM-dd")}'
												required="required"
												class="layui-input form-input input-dateSelect" />
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap">起息日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="vdate" name="vdate"
												data-th-value='${#dates.format(entity?.vdate?:iPlatformDate,"yyyy-MM-dd")}'
												required="required"
												class="layui-input form-input input-dateSelect" />
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap">到期日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="mdate" name="mdate"
												data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
												required="required"
												class="layui-input form-input input-dateSelect" />
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap">是否永续</label>
										<div class="layui-input-inline input-inline">
											<input type="checkbox" id="isSus" name="isSus"
												lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
												data-th-checked="${YES_OR_NO_Y} ==${entity?.isSus}">
										</div>
									</div>
									<div class="form-inline-wrap" id="level1">
										<label class="layui-form-label form-label-wrap">债券一级分类
										</label>
										<div class="layui-input-inline input-inline">
											<select id="type4" name="type4"
												th:initValue="*{entity?.type4}"
												class="layui-input form-input input-select"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-result="${WINDTYPEONE}"
												childrenIds="type5"></select>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap" id="level2">
										<label class="layui-form-label form-label-wrap">债券二级分类
										</label>
										<div class="layui-input-inline input-inline">
											<select id="type5" name="type5"
												th:initValue="*{entity?.type5}"
												class="layui-input form-input input-select"
												allowClear="true" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-result="${WINDTYPETWO}" formatoption=true
												></select>
										</div>
									</div>
									<!-- <div class="layui-inline layui-col-md4" style="display: none">
                          				<label class="layui-form-label form-lable">发行总额</label>
                          				<div class="layui-input-inline input-inline input-inline-wrap">
                              				<input type="text" id="sumprice" name="sumprice" class="layui-input form-input"  
                                 				data-th-value="${entity?.sumprice}" >
                              					<span class="input-right-show">万元</span>
                          				</div>
                       				</div> -->
                       				<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap">发行人</label>
										<div class="layui-input-inline input-inline">
											<select name="issuer" id="issuer"
												class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-url="@{/valuation/assets/bond/ValBondTargetAsset002/getIssuerId}"
												data-th-initValue='${entity?.issuer}' required="required">
											</select>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
	                                    <label class="layui-form-label form-label-wrap">是否金融机构发行</label>
	                                    <div class="layui-input-inline input-inline">
											<input type="checkbox" id="isFinOrg" name="isFinOrg"
												lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
												data-th-checked="${YES_OR_NO_Y} ==${entity?.isFinOrg}">
	                                    </div>
	                                </div>
	                                <div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap">登记托管机构</label>
										<div class="layui-input-inline input-inline">
											<select id="registOrg"
												name="registOrg"
												th:initValue="${entity?.registOrg}"
												class="layui-input form-input input-select"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required
												data-th-data-result="${SVR_REGIST_ORG}">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap">是否含权债</label>
										<div class="layui-input-inline input-inline">
											<input type="checkbox" id="isRight" name="isRight"
												lay-skin="switch" lay-filter="isRight"
												data-th-value="${YES}" lay-text="是|否"
												data-th-checked="${YES_OR_NO_Y} ==${entity?.isRight}">
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap">境内外</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="blnArea" name="blnArea"
												th:initValue="${entity?.blnArea}" required
												class="layui-input form-input input-checkbox"
												data-th-data-result="${BLN_AREA}" />
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap">币种</label>
										<div class="layui-input-inline input-inline">
											<select name="ccy" id="ccy"
												th:initValue="*{entity?.ccy?:CCY_INIT}"
												class="layui-input form-input input-select"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required
												data-th-data-result="${CCY}">
											</select>
										</div>
									</div>
									<div class="layui-inline layui-col-md4">
                        				<label class="layui-form-label form-lable">税务分类</label>
                        				<div class="layui-input-inline input-inline">
                            				<select id="type3Code" name="type3Code"
                                					class="layui-input form-input input-select"
                                					data-th-data-result="${LEND_ACCOUNTING_CLASSIFICATION}" allowClear="true">
                            				</select>
                        				</div>
                    				</div>
								</div>
								<div class="layui-form-item">
									<div class="layui-inline layui-col-md4">
                        				<label class="layui-form-label form-lable">核算分类</label>
                        				<div class="layui-input-inline input-inline">
                            				<select id="type2Code" name="type2Code"
                                					class="layui-input form-input input-select"
                                					data-th-data-result="${LEND_ACCOUNTING_CLASSIFICATION}" allowClear="true">
                            				</select>
                        				</div>
                    				</div>
                    				<div class="layui-inline layui-col-md4">
                         				<label class="layui-form-label form-lable">本金收益特征</label>
                         				<div class="layui-input-inline input-inline">
                             				<input type="text" id="capiIncomeFeature" name="capiIncomeFeature"
                                 					class="layui-input form-input input-checkbox"
                                 					data-th-data-result="${AMT_INCOME_TYPE}">
                         				</div>
                     				</div>
                     				<div class="form-inline-wrap">
                                    	<label class="layui-form-label form-label-wrap">面值</label>
                                    	<div class="layui-input-inline input-inline">
                                        	<input type="text" required name="faceValue" data-th-value="${entity?.faceValue?:100}" class="layui-input form-input text-number" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" >
                                    	</div>
                                	</div>
								</div>
							</div>
						</div>
					</div>
					<!-- 计息要素业务 -->
					<div class="page-component"
						th:data-path="@{/valuation/component/element/ValFinInterestFactor/init}"
						th:data-params="|{entityName:'finInterestFactorDto',entityNamePayInterest:'finPayInterestStdInfoDto',entityNamebussFinRepayment:'bussFinRepaymentDto',entityNamebusiFinExercisePlan:'busiFinExercisePlanDto',vdate:'${#dates.format(entity?.vdate,'yyyy-MM-dd')}',finprodId:'${entity?.finprodId?:''}',couponSpecies:'${entity?.couponSpecies}',workflowId:'${workflowId?:''}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}'}|"></div>
					<!-- 付息信息业务 -->
					<div class="page-component"
						th:data-path="@{/valuation/component/element/ValFinPayInterestStdInfo/init}"
						th:data-params="|{entityName:'finPayInterestStdInfoDto',entityNameFinInterestFactor:'finInterestFactorDto',finprodId:'${entity?.finprodId?:''}',vdate:'${#dates.format(entity?.vdate,'yyyy-MM-dd')}',workflowId:'${workflowId?:''}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}'}|"></div>
					<!-- 还本信息业务 -->
					<div class="page-component"
						th:data-path="@{/valuation/component/element/ValBussFinRepayment/init}"
						th:data-params="|{entityName:'bussFinRepaymentDto',entityNameFinInterestFactor:'finInterestFactorDto',entityNameFinPayInterestStdInfo:'finPayInterestStdInfoDto',finprodId:'${entity?.finprodId?:''}',vdate:'${#dates.format(entity?.vdate,'yyyy-MM-dd')}',workflowId:'${workflowId?:''}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}'}|"></div>
					<!-- 行权计划 -->
					<div class="page-component"
						th:data-path="@{/valuation/component/element/ValBusiFinExercisePlan/init}"
						th:data-params="|{entityName:'busiFinExercisePlanDto',finprodId:'${entity?.finprodId?:''}',workflowId:'${workflowId?:''}', pageId:'${pageId}'}|"></div>
					<!-- 附件信息 -->
					<!-- <div class="page-component"
						th:data-path="@{/component/core/FileCommon/init}"
						th:data-params="|{entityName: 'fileCommonDto',businessId:'${entity?.finprodId?:''}'}|"></div> -->
					<!-- add by zhangpuyu 2019/10/29 start-->
					<!-- 备注 -->
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title">
								<span class="title-des">备注</span><i
									class="iconfont icon-arrow-down pro-down-icon"></i>
							</h3>
							<div class="pro-module-item" style="padding-bottom: 8px;">
								<div class="layui-form-item">
									<div class="form-inline-wrap" style="width: 100%;">
										<div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
										<textarea id="remark" name="remark" placeholder="请输入内容"
												  data-th-placeholder="#{SysCommon.placeholder}" maxlength="300"
												  class="layui-textarea" data-th-text="${entity?.remark}">
										</textarea>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</form>
		</div>
		<div class="layui-col-md11" style="margin: 50px;">
            <div class="text-center">
            	  <a id="ValBondTargetAsset002_btn_save" class="layui-btn layui-btn-sm btn-save"
							data-th-text="#{SysCommon.save}">保存</a>
                  <a id="ValBondTargetAsset002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                      data-th-text="#{SysCommon.submit}">提交</a> 
                  <a id="ValBondTargetAsset002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                    data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
	</div>
	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
            var FINPROD_TYPE_TG_F01 = /*[[${FINPROD_TYPE_TG_F01}]]*/'F01'; //债券资产类型code
            var FINPROD_TYPE_TG_F07 = /*[[${FINPROD_TYPE_TG_F07}]]*/'F07'; //存款资产类型code
            var FINPROD_TYPE_TG_F17 = /*[[${FINPROD_TYPE_TG_F17}]]*/'F17'; //计划类资产类型code
            var FINPROD_TYPE_TG_F18 = /*[[${FINPROD_TYPE_TG_F18}]]*/'F17'; //项目类资产类型code
            var CUSTOM_ASSET_TYPE_FIVE_009 = /*[[${CUSTOM_ASSET_TYPE_FIVE_009}]]*/'009'; //金融机构次级债code
            var CUSTOM_ASSET_TYPE_FIVE_158 = /*[[${CUSTOM_ASSET_TYPE_FIVE_158}]]*/'158'; //政策性金融次级债code
            var COUPON_SPECIES_02 = /*[[${COUPON_SPECIES_02}]]*/'02'; //息票品种--贴现
            var COUPON_SPECIES_03 = /*[[${COUPON_SPECIES_03}]]*/'03'; //息票品种--零息
            var isTransInAsset = /*[[${isTransInAsset}]]*/'';//该资产是否有交易
            var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'Y';
            var CE_MODEL = /*[[${CE_MODEL}]]*/'02';
            var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
            var isHqTrade = /*[[${isHqTrade}]]*/'';
            var SVR_SHARES_TYPE_02 = /*[[${SVR_SHARES_TYPE_02}]]*/'02';
			var WINDTYPEONE_B14 = /*[[${WINDTYPEONE_B14}]]*/'B14';
			var WINDTYPEONE_B15 = /*[[${WINDTYPEONE_B15}]]*/'B15';
		</script>
        <!-- <script data-th-src="@{/js/component/asset/BussAssetFiveType.js}" type="text/javascript"></script>  -->
		<script data-th-src="@{/js/valuation/assets/bond/ValBondTargetAsset002.js}"
			type="text/javascript"></script>
        <!-- <script data-th-src="@{/js/component/autocoupon/AutoCoupon.js}" type="text/javascript"></script>        
        <script data-th-src="@{/js/invest/asset/common/AssetCommon.js}" type="text/javascript"></script> -->
	</div>
</body>

</html>
