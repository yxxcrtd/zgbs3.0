<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ValBondTargetAsset001}">债券标的信息查询</title>
</head>
<body>
    <div layout:fragment="content" id="ValBondTargetAsset001_DIV">
        <div class="form-button-area">
            <a id="ValBondTargetAsset001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
            <a id="ValBondTargetAsset001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}" style="display: none">删除</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
        <form class="layui-form" id="searchForm" >
            <div class="layui-form-item">       
                <!-- <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable">资产代码</label>
                     <div class="layui-input-inline input-inline">
                      <input type="text" id="finprodId"  name="finprodId" class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                      data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-url="@{/valuation/assets/bond/ValBondTargetAsset001/getBondId}"
                      data-idfield="code" data-keyfield="code"
                      data-th-data-effectivefieldsalias='|{"shortName":"#{ValBondTargetAsset002.finprodName}","code":"#{ValBondTargetAsset002.finprodId}"}|'>
                    </div>
                </div> -->
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">债券代码</label>
                    <div class="layui-input-inline input-inline" >
                        <select type="text"  id="finprodId" name="finprodId" class="layui-input form-input input-select"  placeholder="请选择资产或输入代码及关键词"                            
                            data-th-data-url='@{/valuation/assets/bond/ValBondTargetAsset001/getBondId}'
                            allowClear="true"  multiple="multiple" >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable">息票品种</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" name="couponSpecies"  class="layui-input form-input input-select"  data-th-data-result="${COUPON_SPECIES}"></select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable">债券一级分类</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" name="type4" class="layui-input form-input input-select"
                                allowClear="true" formatoption=true multiple="true"
                                data-th-data-result="${WINDTYPEONE}">
                            </select>
                        </div>
                    </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable">债券二级分类</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" name="type5"  class="layui-input form-input input-select"  data-th-data-result="${WINDTYPETWO}"></select>
                    </div>
                </div>
				<div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
					<label class="layui-form-label form-lable">起息日</label>
					<div class="layui-input-inline input-inline">
						<input name="vdate"
							class="layui-input form-input input-dateRangeSelect"
							placeholder="请选择、支持区间"
							data-th-placeholder="#{SysCommon.dateInterval}">
					</div>
				</div>
				<div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
					<label class="layui-form-label form-lable">到期日</label>
					<div class="layui-input-inline input-inline">
						<input name="mdate"
							class="layui-input form-input input-dateRangeSelect"
							placeholder="请选择、支持区间"
							data-th-placeholder="#{SysCommon.dateInterval}">
					</div>
				</div>
            </div>
            </form>   
        </div> 
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
    	<script data-th-inline="javascript" type="text/javascript">
    	var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
    	</script>
        <script data-th-src="@{/js/valuation/assets/bond/ValBondTargetAsset001.js}" type="text/javascript"></script>
        <!-- <script data-th-src="@{/js/invest/asset/common/AssetCommon.js}" type="text/javascript"></script> -->
    </div>
</body>

</html>
