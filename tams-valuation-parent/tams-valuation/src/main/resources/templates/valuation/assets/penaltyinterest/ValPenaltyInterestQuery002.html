  <!-- 基本信息---------------------------------------------------------------------------------------------------------------------------------------------------------------- -->                
            <fieldset class="layui-elem-field layui-field-title">
                <div class="layui-collapse" lay-filter="test">
  
                <div class="layui-colla-item">
                <h2 class="layui-colla-title"><a href="javascript:;">基本信息</a></h2>
                <div class="layui-colla-content layui-show">
                   <div class="layui-form-item">
                       <div class="layui-inline layui-col-md4">
                          <label class="layui-form-label form-lable">金融产品代码</label>
                          <div class="layui-input-inline input-inline">
                              <input type="text" id="finprodId" name="finprodId"   disabled="disabled"
                                  class="layui-input form-input"  data-th-value="${entity?.finprodId}" >
                          </div>
                       </div>
                        <div class="layui-inline layui-col-md4">
                          <label class="layui-form-label form-lable">金融产品名称</label>
                          <div class="layui-input-inline input-inline">
                              <input type="text" id="finprodName" name="finprodName" class="layui-input form-input" 
                                 disabled="disabled" data-th-value="${entity?.finprodName}" >
                          </div>
                       </div>
                       <div class="layui-inline layui-col-md4">
	                        <label class="layui-form-label form-lable">金融产品类型</label>
	                        <div class="layui-input-inline input-inline">
	                            <input type="text" id="finprodType" name="finprodType"
                                            class="layui-input form-input input-select"
                                            data-th-data-result="${FINPROD_TYPE}" data-th-value="${entity?.finprodType}">
	                        </div>
                       </div>
                       <div class="layui-form-item">
                       <div class="layui-inline layui-col-md4">
	                        <label class="layui-form-label form-lable">分支类型</label>
	                        <div class="layui-input-inline input-inline">
	                            <input type="text" id="branchType" name="branchType"
	                                class="layui-input form-input input-select"
	                                data-th-data-result="${BRANCH_TYPE}" data-th-value="${entity?.branchType}">
	                        </div>
                       </div>
                       <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">分支序号</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="branchNo" name="branchNo" data-th-value="${entity?.branchNo}"
                                       class="layui-input form-input">
                            </div>
                       </div>
                       <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">是否罚息计提</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="ifPenalty" name="ifPenalty" data-th-value="${entity?.ifPenalty}"
                                       class="layui-input form-input input-select" data-th-data-result="${YES_OR_NO}">
                            </div>
                       </div>
                       </div>
                       <div class="layui-form-item">
                       <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">截止日是否冲回</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="ifRushBack" name="ifRushBack" data-th-value="${entity?.ifRushBack}"
                                       class="layui-input form-input input-select" data-th-data-result="${YES_OR_NO}">
                            </div>
                       </div>
                       <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">计息基础</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="basis" name="basis"
                                            class="layui-input form-input input-select" data-th-data-result="${BASIS}"
                                            data-th-value="${entity?.basis}">
                                    </div>
                                </div>
                       </div>
                   </div>
                 </div>  
               </div>
               </div>                                                               
             </fieldset>

             <div class="layui-colla-item">
             <h2 class="layui-colla-title"><a href="javascript:;">罚息利率报价信息</a></h2>
