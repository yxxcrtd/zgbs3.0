<!doctype html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{ValUnfairlendingQuery001}">科目流水查询</title>
<!-- <link rel="stylesheet" type="text/css"
	data-th-href="@{/css/font/iconfont.css}"> -->
<link rel="stylesheet" type="text/css"
	data-th-href="@{/css/valuation/common.css}">
</head>
<body>
	<div layout:fragment="content">
		<div class="form-button-area"></div>
		<div class="joyin-form-wrap joyin-filter-form condition-area">
			<form class="layui-form" id="searchForm">
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">所属账套</label>
						<div class="layui-input-inline input-inline">
							<select id="booksetId" name="booksetId"
								class="layui-input form-input input-select"
								data-th-data-url="@{/valuation/financemanage/balancecheck/unfairlending/ValUnfairlendingQuery001/findBooksetId}"
								multiple="multiple" allowClear="true" placeholder="请输入内容">
							</select>
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">资产/负债代码</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="busiId" name="busiId"
								class="layui-input form-input" value="" placeholder="请输入">
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">记账日期</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="bookDate" name="bookDate"
								placeholder="请选择、支持区间"
								class="layui-input form-input input-dateRangeSelect"
								allowClear="true">
						</div>
					</div>
				</div>
			</form>
		</div>
		<div>
			<table class="layui-table" id="dataTable"></table>
		</div>
	</div>
	<div layout:fragment="script">
		<script data-th-src="@{/js/valuation2/common.js}"
			type="text/javascript"></script>
		<script
			data-th-src="@{/js/valuation2/financemanage/balancecheck/unfairlending/ValUnfairlendingQuery001.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
