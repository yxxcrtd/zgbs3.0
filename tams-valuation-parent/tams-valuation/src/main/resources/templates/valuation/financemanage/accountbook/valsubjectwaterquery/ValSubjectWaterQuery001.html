<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{ValSubjectWaterQuery001}">科目流水查询</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area" ></div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
	               <div class="layui-inline layui-col-md4">
	                   <label class="layui-form-label form-lable">账套类别</label>
	                   <div class="layui-input-inline input-inline">
	                   	<select id="booksetType" name="booksetType" class="layui-input form-input input-select" 
	                           		data-th-data-url="@{/valuation/accounadjustmanage/voucherquery/ValVoucherQuery001/findBooksetType}"
	                                 allowClear="true" placeholder="请输入内容">
	                       </select>
	                  </div>
	               </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">所属账套</label>
                        <div class="layui-input-inline input-inline">
                            <!-- <input type="text" id="booksetId" name="booksetId"
                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/valuation/accounadjustmanage/assetbook/ValAssetBook001/getBooksetId2}"
                                data-idfield="code" data-keyfield="code"
                                data-th-data-effectivefieldsalias='|{"code":"#{ValSubjectSet001.booksetId}","shortName":"#{ValSubjectSet001.booksetName}"}|'> -->
                        	<!-- <select id="booksetId" name="booksetId" class="layui-input form-input input-select" 
                            		data-th-data-url="@{/valuation/financemanage/accountbook/valsubjectwaterquery/ValSubjectWaterQuery001/findBooksetId}" 
                            		multiple="multiple"
                                  allowClear="true" placeholder="请输入内容">
                           </select> -->
                           <select id="booksetId" name="booksetId" class="layui-input form-input input-select"
                                   data-th-data-url="@{/valuation/financemanage/accountbook/valsubjectwaterquery/ValSubjectWaterQuery001/findBooksetId}"
                            		multiple="multiple" parentIds = 'booksetType'
                                  allowClear="true" placeholder="请输入内容">
                           </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">业务类别</label>
                        <div class="layui-input-inline input-inline" style="display: block;">
                            <input id="comTableId" name="comTableId" class="layui-input form-input input-select" placeholder="请选择"
                                data-th-data-result="${TABLE_ID}" allowClear="true" multiple="multiple">
                        </div>
                    </div>
                    
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">资产/负债代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="busiId" name="busiId" class="layui-input form-input" value=""
                                placeholder="请输入">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">记账日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="bookDate" name="bookDate" placeholder="请选择、支持区间"
                                class="layui-input form-input input-dateRangeSelect" allowClear="true">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">科目号</label>
                        <div class="layui-input-inline input-inline" style="display: inline;">
                            <select id="subjectNo" name="subjectNo"  class="layui-input form-input input-select"
                                data-th-data-url='@{/valuation/financemanage/accountbook/valsubjectwaterquery/ValSubjectWaterQuery001/getSubjectNo}'
                                allowClear="true" placeholder="请选择" multiple="multiple">
                            </select>    
                        </div>
                    </div>
                    
                </div>
                <div class="layui-form-item">
                	<div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">原币币种</label>
                        <div class="layui-input-inline input-inline" style="display: block;">
                            <input id="ccy" name="ccy" class="layui-input form-input input-select" placeholder="请选择"
                                data-th-data-result="${CCY}" allowClear="true">
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation2/common.js}" type="text/javascript"></script>
        <script
            data-th-src="@{/js/valuation2/financemanage/accountbook/valsubjectwaterquery/ValSubjectWaterQuery001.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
