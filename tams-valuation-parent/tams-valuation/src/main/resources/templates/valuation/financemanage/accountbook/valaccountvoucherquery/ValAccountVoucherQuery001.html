<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{ValAccountVoucherQuery001}">估值表对账</title>
<link rel="stylesheet" type="text/css" data-th-href="@{/css/valuation/common.css}">
</head>

<body> 
<div class="layui-tab layui-tab-brief" lay-filter="docDemoTabBrief" layout:fragment="content">
  <ul class="layui-tab-title">
    <li class="layui-this">管理人估值对账</li>
    <li>托管人估值对账</li>
  </ul>
  <div class="layui-tab-content" style=" padding:10px 0;">
    <div class="layui-tab-item layui-show">
      <div class="layui-col-md12 layui-actbtn">
        <div class="opebtn layui-clear"> 
          <a id="ValReconciliation001_btn_execute" class="layui-btn layui-btn-sm layui-btngroup"><span>执行对账</span><b></b>
            <div>
              <p>全部对账</p>
            </div>
          </a>
          <a id="ValReconciliation001_btn_cancel" class="layui-btn layui-btn-sm"><span>取消对账</span></a>
          <a id="ValReconciliation001_btn_filter" class="layui-btn layui-btn-sm btn-filter"><i class="iconfont icon-btn-filter"></i><span>筛选</span></a>
          <a class="link-blue ValReconciliation001_gzdzmx" href='javascript:void(0);'>表格双击行查看详情,请点这里</a>
        </div>
        <form class="layui-form joyin-form-wrap joyin-filter-form" id="searchForm">
          <div class="layui-form-item">
            <div class="layui-inline layui-col-md4">
              <label class="layui-form-label form-lable2">估值日期</label>
              <div class="layui-input-inline input-inline">
                <input type="text" class="layui-input form-input input-dateRangeSelect" placeholder="请选择日期">
              </div>
            </div>
            <div class="layui-inline layui-col-md4">
              <label class="layui-form-label form-lable2">产品类型</label>
              <div class="layui-input-inline input-inline">
                <input type="text" class="input-select" placeholder="请选择" data-result='[ {&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;类型1&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;类型2&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;类型3&quot;,&quot;col&quot;:&quot;&quot;}]'>
              </div>
            </div>
            <div class="layui-inline layui-col-md4">
              <label class="layui-form-label form-lable2">产品</label>
              <div class="layui-input-inline input-inline">
                <input type="text" class="layui-input form-input input-lenovoselect" multiple="multiple" placeholder="请选择产品或输入关键词" value="" data-url="/js/valuation/demo/lenovoSelect.json"  data-effectivefieldsalias='{&quot;code&quot;:&quot;产品代码&quot;,&quot;shortName&quot;:&quot;产品名称&quot;}'>
                <!-- <select class="input-select" allowClear="true" multiple="multiple"  placeholder="请选择" data-url="/js/valuation/demo/selectSimple.json"></select> --> 
              </div>
            </div>
            
          </div>
          <div class="layui-form-item">
            <div class="layui-inline layui-col-md4">
              <label class="layui-form-label form-lable2">对账状态</label>
              <div class="layui-input-inline input-inline">
                <input type="text" class="input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;未对账&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;已对账&quot;,&quot;col&quot;:&quot;&quot;}]'>
              </div>
            </div>
            <div class="layui-inline layui-col-md4">
              <label class="layui-form-label form-lable2">对账结果</label>
              <div class="layui-input-inline input-inline">
                <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;对账一致&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;对账不一致&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;03&quot;,&quot;text&quot;:&quot;未找到文件&quot;,&quot;col&quot;:&quot;&quot;}]'>
              </div>
            </div>
            <div class="layui-inline layui-col-md4"> <a id="ValReconciliation001_BTN_search" class="layui-btn layui-btn-sm"><i class="iconfont icon-search"></i><span>&nbsp;&nbsp;查询</span></a> <a id="SysInstitution001_BTN_reset" class="layui-btn layui-btn-sm"><i class="iconfont icon-reset"></i><span>&nbsp;&nbsp;重置</span></a> </div>
          </div>
        </form>
      </div>
      <div class="layui-clear"></div>
      <table class="layui-table" id="dataTable1" style="display:none"></table>
    </div>
    <div class="layui-tab-item" style="display:none">
      <div class="layui-col-md12 layui-actbtn">
        <div class="opebtn layui-clear"> 
          <a id="ValReconciliation001_btn_execute" class="layui-btn layui-btn-sm layui-btngroup"><span>发送</span><b></b>
            <div>
              <p>全部发送</p>
            </div>
          </a>
          <a id="ValReconciliation001_btn_confirm" class="layui-btn layui-btn-sm layui-btngroup"><span>确认对账</span><b></b>
            <div>
              <p>取消对账</p>
            </div> 
          </a>
          <a id="ValReconciliation001_btn_filter" class="layui-btn layui-btn-sm btn-filter"><i class="iconfont icon-btn-filter"></i><span>筛选</span></a>
        </div>
        <form class="layui-form joyin-form-wrap joyin-filter-form" id="searchForm">
          <div class="layui-form-item">
            <div class="layui-inline layui-col-md4">
              <label class="layui-form-label form-lable2">估值日期</label>
              <div class="layui-input-inline input-inline">
                <input type="text" class="layui-input form-input input-dateRangeSelect" placeholder="请选择日期">
              </div>
            </div>
            <div class="layui-inline layui-col-md4">
              <label class="layui-form-label form-lable2">产品类型</label>
              <div class="layui-input-inline input-inline">
                <input type="text" class="input-select" placeholder="请选择" data-result='[ {&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;类型1&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;类型2&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;类型3&quot;,&quot;col&quot;:&quot;&quot;}]'>
              </div>
            </div>
            <div class="layui-inline layui-col-md4">
              <label class="layui-form-label form-lable2">产品</label>
              <div class="layui-input-inline input-inline">
                <input type="text" class="layui-input form-input input-lenovoselect" multiple placeholder="请选择产品或输入关键词" value="" data-url="/js/valuation/demo/lenovoSelect.json"  data-effectivefieldsalias='{&quot;code&quot;:&quot;产品代码&quot;,&quot;shortName&quot;:&quot;产品名称&quot;}'>
                <!-- <select class="input-select" allowClear="true" multiple="multiple"  placeholder="请选择" data-url="/js/valuation/demo/selectSimple.json"></select> --> 
              </div>
          </div>
          <div class="layui-form-item">
            <div class="layui-inline layui-col-md4">
              <label class="layui-form-label form-lable2">发送状态</label>
              <div class="layui-input-inline input-inline">
                <input type="text" class="input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;未发送&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;已发送&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;发送失败&quot;,&quot;col&quot;:&quot;&quot;}]'>
              </div>
            </div>
            <div class="layui-inline layui-col-md4">
              <label class="layui-form-label form-lable2">对账状态</label>
              <div class="layui-input-inline input-inline">
                <input type="text" class="input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;未对账&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;已对账&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;对账失败&quot;,&quot;col&quot;:&quot;&quot;}]'>
              </div>
            </div>
            <div class="layui-inline layui-col-md4">
              <label class="layui-form-label form-lable2">对账结果</label>
              <div class="layui-input-inline input-inline">
                <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;对账一致&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;对账不一致&quot;,&quot;col&quot;:&quot;&quot;}]'>
              </div>
            </div>
            <div class="layui-inline layui-col-md4"> <a id="ValReconciliation001_BTN_search" class="layui-btn layui-btn-sm"><i class="iconfont icon-search"></i><span>&nbsp;&nbsp;查询</span></a> <a id="SysInstitution001_BTN_reset" class="layui-btn layui-btn-sm"><i class="iconfont icon-reset"></i><span>&nbsp;&nbsp;重置</span></a> </div>
          </div>
        </form>
      </div>
      <div class="layui-clear"></div>
      <table class="layui-table" id="dataTable2" style="display:none"></table>
    </div>
  </div>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation2/common.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/valuation2/financemanage/accountbook/valaccountvoucherquery/ValAccountVoucherQuery001.js}" type="text/javascript"></script>
</div>
</body>
</html>
