<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>到期产品科目余额异常查询</title>
</head>
<body>
</body>
<div layout:fragment="content">
    <div class="form-button-area"></div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="bookDate" name="bookDate" class="layui-input form-input input-dateSelect"
                            data-th-value="${bookDate}" allowClear="true">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">账套代码</label>
                    <div class="layui-input-inline input-inline">
                        <select id="booksetId" name="booksetId" class="layui-input form-input input-select"
                            data-th-data-url="@{/valuation/financemanage/valsubjectbalanceabnormalquery/ValSubjectBalanceAbnormalQuery001/findBooksetId}"
                            multiple="multiple" allowClear="true" placeholder="请输入内容">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">是否考虑全部赎回</label>
                    <div class="layui-input-inline input-inline">
                        <input type="checkbox" name="isRed" id="isRed" lay-skin="switch" data-th-value="${YES_OR_NO}"
                            lay-text="是|否">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script
        data-th-src="@{/js/valuation2/financemanage/valsubjectbalanceabnormalquery/ValSubjectBalanceAbnormalQuery001.js}"
        type="text/javascript"></script>
</div>
</html>
