<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>产品资产查询</title>
</head>
<body>
</body>
<div layout:fragment="content">
    <div class="form-button-area" ></div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                 
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="bookDate" name="bookDate" placeholder="请选择、支持区间"
                            class="layui-input form-input input-dateRangeSelect" allowClear="true">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                   <label class="layui-form-label form-lable">账套类别</label>
                   <div class="layui-input-inline input-inline">
                   	<select id="booksetType" name="booksetType" class="layui-input form-input input-select" 
                           		data-th-data-url="@{/valuation/accounadjustmanage/voucherquery/ValVoucherQuery001/findBooksetType}"
                           		
                                 allowClear="true" placeholder="请输入内容">
                       </select>
                  </div>
               </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">所属账套</label>
                    <div class="layui-input-inline input-inline">
                    	<!-- <select id="booksetId" name="booksetId" class="layui-input form-input input-select" 
                            		data-th-data-url="@{/valuation/financemanage/accountbook/valsubjectbalancequery/ValSubjectBalanceQuery001/findBooksetId}" 
                            		multiple="multiple"
                                  allowClear="true" placeholder="请输入内容">
                        </select> -->
                        <select id="booksetId" name="booksetId" class="layui-input form-input input-select"
                                data-th-data-url="@{/valuation/financemanage/accountbook/valsubjectbalancequery/ValSubjectBalanceQuery001/findBooksetId}"
                            		multiple="multiple"
                                  allowClear="true" placeholder="请输入内容">
                        </select>
                        <!-- <input type="text" id="booksetId" name="booksetId"
                            class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                            data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-data-url="@{/valuation/accounadjustmanage/assetbook/ValAssetBook001/getBooksetId}"
                            data-idfield="code" data-keyfield="code"
                            data-th-data-effectivefieldsalias='|{"code":"#{ValSubjectSet001.booksetId}","shortName":"#{ValSubjectSet001.booksetName}"}|'> -->
                    </div>
                </div>
                
            </div>
            <div class="layui-form-item">
               <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">科目级别</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="subjectLevel" name="subjectLevel" placeholder="请选择"
                            class="layui-input form-input input-select" data-th-data-result='${SUBJECT_LEVEL}'>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">科目号</label>
                    <div class="layui-input-inline input-inline" style="display: inline;">
                            <select id="subjectNo" name="subjectNo"  class="layui-input form-input input-select"
                                data-th-data-url='@{getSubjectNo}' parentIds="subjectLevel,booksetId"
                                allowClear="true" placeholder="请选择">
                                <option></option>
                            </select>    
                        </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">原币币种</label>
                    <div class="layui-input-inline input-inline">
                        <input id="ccy" name="ccy" class="layui-input form-input input-select"
                            data-th-data-result="${CCY}" allowClear="true" placeholder="请选择">
                    </div>
                </div>
                
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">显示科目</label>
                    <div class="layui-input-inline input-inline">
                        <input id="showSubject" name="showSubject" class="layui-input form-input input-checkbox"
                            data-th-data-result="${YES_OR_NO}" data-th-placeholder="#{SysCommon.placeholder}" data-th-initVale="${yearOrNo}">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">展示维度</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="issueType" name="issueType" class="layui-input form-input input-checkbox"
                            data-result="[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;合并展示&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;逐账套展示&quot;,&quot;col&quot;:&quot;&quot;}]"
                            initvalue="02" style="display: none;">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script
        data-th-src="@{/js/valuation2/financemanage/accountbook/valsubjectbalancequery/ValSubjectBalanceQuery001.js}"
        type="text/javascript"></script>
</div>
</html>
