<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title>缴税增值税撤销</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm" style="background: #ffffff; padding: 10px 0;">
            <fieldset class="layui-elem-field layui-field-title" style="margin-top: 1px;">
                <div class="layui-collapse">
                    <div class="layui-colla-item">
                        <h2 class="layui-colla-title">
                            <a href="javascript:;">基本信息</a>
                        </h2>
                        <div class="layui-colla-content layui-show">
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">交易编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeId" name="tradeId"
                                            class="layui-input form-input" data-th-value="${tradeId}" disabled="disabled">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">账套代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="booksetId" name="booksetId"
                                            class="layui-input form-input" data-th-value="${booksetId}" disabled="disabled">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">账套名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="booksetName" name="booksetName"
                                            class="layui-input form-input" data-th-value="${booksetName}" disabled="disabled">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="taxidenType" name="taxidenType" disabled="disabled"
                                            class="layui-input form-input input-checkbox"
                                            data-th-data-result="${PS}" data-th-initValue="${taxidenType}"
                                            allowClear="true">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">缴税/退税日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="seitleDate" name="seitleDate" class="layui-input form-input"
                                            data-th-value="${seitleDate}" disabled="disabled">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">缴税/退税开始日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="vDate" name="vDate" class="layui-input form-input"
                                            data-th-value="${vDate}" disabled="disabled">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">缴税/退税截止日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="mDate" name="mDate" class="layui-input form-input"
                                            data-th-value="${mDate}" disabled="disabled">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">利息收入</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="interestIncome" name="interestIncome" class="layui-input form-input"
                                            data-th-value="${interestIncome}" disabled="disabled">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">红利收入</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="dividendIncome" name="dividendIncome" class="layui-input form-input"
                                            data-th-value="${dividendIncome}" disabled="disabled">
                                    </div>
                                </div>                               
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">价差收入</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="difbetIncome" name="difbetIncome" class="layui-input form-input"
                                            data-th-value="${difbetIncome}" disabled="disabled">
                                    </div>
                                </div>  
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">增值税</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="appreciationTax" name="appreciationTax" class="layui-input form-input"
                                            data-th-value="${appreciationTax}" disabled="disabled">
                                    </div>
                                </div>  
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">城建税附加</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="constructionTax" name="constructionTax" class="layui-input form-input"
                                            data-th-value="${constructionTax}" disabled="disabled">
                                    </div>
                                </div>                                                                 
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">教育税附加</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="educationTax" name="educationTax" class="layui-input form-input"
                                            data-th-value="${educationTax}" disabled="disabled">
                                    </div>
                                </div> 
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">地方教育费附加</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="placeeducationTax" name="placeeducationTax" class="layui-input form-input"
                                            data-th-value="${placeeducationTax}" disabled="disabled">
                                    </div>
                                </div> 
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">增值税附加</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="additionalTax" name="additionalTax" class="layui-input form-input"
                                            data-th-value="${additionalTax}" disabled="disabled">
                                    </div>
                                </div>                                                                 
                            </div>
                        </div>
                    </div>
                </div>
            </fieldset>
        </form>
        <div class="layui-col-md11" style="margin: 50px;">
            <div class="text-center">
                <a id="PayTheVatQuery003_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="PayTheVatQuery003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/trademanage/paythevatquery/PayTheVatQuery003.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
