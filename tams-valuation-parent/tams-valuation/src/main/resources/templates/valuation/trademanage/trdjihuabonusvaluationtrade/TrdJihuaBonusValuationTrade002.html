<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"

    <div layout:fragment="content">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
				<form id="basicInfoForm" class="layui-form joyin-form-wrap pro-module-form">
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">

										<div class="layui-input-inline input-inline">
											<input type="text" id="tradeId" name="tradeId"
												   required disabled
												   placeholder="提交后自动生成，无需填写"
												   class="layui-input form-input"
												   data-th-value="${entity?.tradeId}">
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{TrdJihuaBonusValuationTrade002.prodName}">产品名称</label>
										<div class="layui-input-inline input-inline" >
											<select id="prodId" name="prodId" required
													class="layui-input form-input input-select"

													data-th-initValue="${entity?.prodId}" >
											</select>
										</div>
									</div>

										<label class="layui-form-label form-label-wrap"

										<div class="layui-input-inline input-inline">
											<input  type="text" id="prodName" name="prodName" required disabled
													class="layui-input form-input" placeholder="请输入内容"
													th:placeholder="#{SysCommon.placeholder}"
													th:value="${entity?.prodName}">
										</div>
									</div>
								</div>

								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{TrdJihuaBonusValuationTrade002.assetAbbr}">资产名称</label>
										<div class="layui-input-inline input-inline">
											<select id="assetId" name="assetId" required
													class="layui-input form-input input-select"
													data-th-data-url="@{/valuation/trademanage/trdjihuabonusvaluationtrade/TrdJihuaBonusValuationTrade001/getAssetId}"
													allowClear="true" placeholder="请输入内容"
													data-th-initValue="${entity?.assetId}" >
											</select>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{TrdJihuaBonusValuationTrade002.assetId}">资产代码</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="assetAbbr" name="assetAbbr"
												   class="layui-input form-input"
												   required disabled
												   data-th-value="${entity?.assetAbbr}"
												   placeholder="请输入内容">
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{TrdJihuaBonusValuationTrade002.ps}">交易类型</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="ps" name="ps" required
													class="layui-input form-input input-select"
													placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
													data-th-data-result='${PS}'
													allowClear="true"
													formatoption="true"
													data-th-initValue="${entity?.ps}">
											</select>
										</div>
									</div>
								</div>

								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdJihuaBonusValuationTrade002.ccy}">币种</label>
										<div class="layui-input-inline input-inline">
											<select  type="text" id="ccy" name="ccy" required
													 class="layui-input form-input input-select"
													 placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
													 th:data-result='${CCY}'
													 allowClear="true"
													 formatoption="true"
													 th:initValue="*{entity?.ccy?:CCY_default}"></select>
										</div>
									</div>
								</div>

							</div>
						</div>
					</div>

					<div class="pro-module-wrap" id="xjfh">

							<h3 class="pro-module-title"><span class="title-des">清算信息</span><i
									class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">

										<label class="layui-form-label form-lable"
											   data-th-text="#{TrdJihuaBonusValuationTrade002.tradeDate}">交易日期</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="tradeDate" name="tradeDate" required
												   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}"
												   data-th-value='${#dates.format(entity?.tradeDate?:iPlatformDate,"yyyy-MM-dd")}'>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{TrdJihuaBonusValuationTrade002.mdate}">权益登记日</label>
										<div class="layui-input-inline input-inline">

										</div>
									</div>
									<div class="form-inline-wrap">

												   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}"

										</div>
									</div>
								</div>

								<div class="layui-form-item">

										<div class="layui-input-inline input-inline">
											<input type="text" id="bonusAmt" name="bonusAmt" maxLength="28" required
												   class="layui-input form-input text-number"
												   data-textrange="2" data-fixtype="2"
												   th:value="${entity?.bonusAmt?:0}"
												   placeholder="请输入内容">
										</div>
									</div>
<!--									<div class="form-inline-wrap" >-->
<!--										<label class="layui-form-label form-label-wrap"-->
<!--											   data-th-text="#{TrdJihuaBonusValuationTrade002.settleAmt}">结算金额</label>-->
<!--										<div class="layui-input-inline input-inline">-->

<!--													th:placeholder="#{SysCommon.placeholder}"-->

<!--										</div>-->

									<div class="form-inline-wrap" >

										<div class="layui-input-inline input-inline" >
											<select id="myAcctNo" name="myAcctNo"
													class="layui-input form-input input-select" required
													data-th-data-url="@{/valuation/trademanage/trdstockvaluationduration/TrdStockValuationDuration002/getTrdAcctId}"
													allowClear="true" placeholder="请输入内容"
													data-th-initValue="${entity?.myAcctNo}">
											</select>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

							<h3 class="pro-module-title"><span class="title-des">清算信息</span><i
									class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"

										<div class="layui-input-inline input-inline">

										</div>
									</div>
									<div class="form-inline-wrap">

										<div class="layui-input-inline input-inline">
											<input type="text" id="bonusAmtReInvest" name="bonusAmtReInvest" maxLength="28" required
												   class="layui-input form-input text-number"
												   data-textrange="2" data-fixtype="2"
												   th:value="${entity?.bonusAmtReInvest?:0}"
												   placeholder="请输入内容">
										</div>
									</div>
								</div>

								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{TrdJihuaBonusValuationTrade002.dealNum}">分红份额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="dealNumReInvest" name="dealNumReInvest" required
												   class="layui-input form-input text-number"
												   maxLength="28" data-textrange="2" data-fixtype="2"
												   th:value="${entity?.dealNumReInvest?:0}"
												   placeholder="请输入内容">
										</div>
									</div>
									<div class="form-inline-wrap">

											   data-th-text="#{TrdJihuaBonusValuationTrade002.unitBonusUnitValue}">单位分红净值</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="unitBonusUnitValue" name="unitBonusUnitValue" required disabled
												   class="layui-input form-input text-number"
												   maxLength="30" data-textrange="4" data-fixtype="2"
												   th:value="${entity?.unitBonusUnitValue}"
												   placeholder="请输入内容">
										</div>
									</div>
<!--									<div class="form-inline-wrap" >-->
<!--										<label class="layui-form-label form-label-wrap"-->

<!--										<div class="layui-input-inline input-inline">-->
<!--											<input  type="text" id="settleAmtReInvest" name="settleAmtReInvest" required-->

<!--													th:placeholder="#{SysCommon.placeholder}"-->
<!--													th:value="${entity?.settleAmtReInvest}" />-->
<!--										</div>-->
<!--									</div>-->
<!--									<div class="form-inline-wrap" >-->

<!--										<div class="layui-input-inline input-inline" >-->

<!--													data-th-data-url="@{/valuation/trademanage/trdstockvaluationduration/TrdStockValuationDuration002/getTrdAcctId}"-->

<!--													data-th-initValue="${entity?.myAcctNoReInvest}">-->
<!--											</select>-->
<!--										</div>-->

								</div>
							</div>
						</div>
					</div>

					<input type="hidden" id="workflowId" name="workflowId" data-th-initValue="${entity?.workflowId}" />

				</form>
                <div class="layui-form-item">
				<div align="center" style="height:50px;padding-top: 10px;">
					<a id="TrdJihuaBonusValuationTrade002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
					<a id="TrdJihuaBonusValuationTrade002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
					<a id="TrdJihuaBonusValuationTrade002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
				</div>
			</div>
         </div>
    </div>
    </div>
    <div layout:fragment="script">
    	<script data-th-inline="javascript" type="text/javascript">
    			var PS_T01 = /*[[${PS_T01}]]*/'';
    			var YES = /*[[${YES}]]*/'';
    			var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
    			var finprodId = /*[[${finprodId}]]*/'';
    			var CCY = /*[[${CCY}]]*/'';

                var tradeId = /*[[${tradeId}]]*/'';
                var PS_T02 = /*[[${PS_T02}]]*/'';
		</script>
    	<script data-th-src="@{/js/valuation/trademanage/trdjihuabonusvaluationtrade/TrdJihuaBonusValuationTrade002.js}">
    	</script>
