<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>新建活期存款收息</title>
</head>
<body>

</body>
<div layout:fragment="content">
  <form id="submitForm">
    <div class="layui-form layui-clear" style=" margin-top:10px;">
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>资金账户账号</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;账户1&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;10&quot;,&quot;text&quot;:&quot;账户2&quot;,&quot;col&quot;:&quot;&quot;}]'>
        </div>
      </div>
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable2">资金账户名称</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input" value="请输入内容">
        </div>
      </div>
    </div>
    <div class="layui-form layui-clear" style=" margin-top:10px;">
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable2">利率</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-dateSelect" required>
        </div>
      </div>
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable2">生效日</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-dateSelect" placeholder="请选择日期" required>
        </div>
      </div>
    </div>
    <div class="layui-form layui-clear" style=" margin-top:10px;">
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable2">数据状态</label>
        <div class="layui-input-inline input-inline">
          <input type="text" id="status" name="status" class="layui-input form-input input-checkbox" data-result='[{&quot;id&quot;:&quot;SH&quot;,&quot;text&quot;:&quot;待审核&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;YX&quot;,&quot;text&quot;:&quot;有效&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;SC&quot;,&quot;text&quot;:&quot;删除&quot;,&quot;col&quot;:&quot;&quot;}]'
          initValue='SH'>
        </div>
      </div>
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable2">机构</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;机构1&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;10&quot;,&quot;text&quot;:&quot;机构2&quot;,&quot;col&quot;:&quot;&quot;}]'>
        </div>
      </div>
    </div>
    <div class="layui-form layui-clear" style=" margin-top:10px;">
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable2">部门</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;部门1&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;10&quot;,&quot;text&quot;:&quot;部门2&quot;,&quot;col&quot;:&quot;&quot;}]'>
        </div>
      </div>
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable2">创建人</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input" placeholder="请输入内容" value="">
        </div>
      </div>
    </div>
    <div class="layui-form layui-clear" style=" margin-top:10px;">
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable2">创建时间</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-dateSelect" placeholder="请选择日期" required>
        </div>
      </div> 
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable2">更新时间</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-dateSelect" placeholder="请选择日期" required>
        </div>
      </div>
    </div>
    <div class="layui-form layui-clear" style=" margin-top:10px;">
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable2">更新人</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input" placeholder="请输入内容" value="">
        </div>
      </div>
      <div class="layui-inline layui-col-md6">
        <label class="layui-form-label form-lable2">&nbsp;</label>
        <div class="layui-input-inline input-inline">
          &nbsp;
        </div>
      </div>
    </div>
  </form>
  <div class="layui-col-md11" style="margin:10px;">
    <div class="text-center"> <a id="ValCurrentDeposit002_btn_save" class="layui-btn layui-btn-sm btn-save">保存</a> <a id="ValCurrentDeposit002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a> <a id="ValCurrentDeposit002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a> </div>
  </div>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script>
</div>
</html>
