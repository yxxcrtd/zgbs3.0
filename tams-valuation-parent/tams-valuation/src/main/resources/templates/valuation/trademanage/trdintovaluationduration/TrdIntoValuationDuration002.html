<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title th:text="#{TrdIntoValuationDuration002}">存款类存续期新建</title>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
            <form id="submitForm" class="layui-form joyin-form-wrap pro-module-form">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdIntoValuationDuration002.tradeId}">交易编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text"  id="tradeId" name="tradeId"
                                               class="layui-input form-input"
                                               placeholder="提交后自动生成，无需填写"
                                               disabled="disabled"
                                               data-th-value="${entity?.tradeId}" maxlength="60">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">产品名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="prodId" name="prodId" th:initValue="${entity?.prodId}"
                                                class="layui-input form-input input-select available"
                                                data-th-placeholder="#{SysCommon.placeholder}" required
                                                data-th-data-url="@{/valuation/trademanage/trdintovaluationduration/TrdIntoValuationDuration001/getFinprodId}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">产品代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" class="layui-input form-input" id="prodName"
                                               name="prodName" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" required="required" disabled="disabled"
                                               data-th-value="${entity?.prodName}" maxlength="60">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="secId" name="secId" class="layui-input form-input input-select" required
                                                data-th-placeholder="#{SysCommon.placeholder}" th:initValue="${entity?.secId}"  childrenIds='chlId'
                                                data-th-data-url="@{/valuation/trademanage/trdintovaluationduration/TrdIntoValuationDuration001/getAssetId}">

                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="secAbbr" name="secAbbr" th:value="${entity?.secAbbr}" class="layui-input form-input hidden" placeholder="请输入内容"
                                               required="required" disabled="disabled" data-th-placeholder="#{SysCommon.placeholder}">
                                    </div>
                                </div>

                                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable">交易类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="ps" name="ps" class="layui-input form-input input-select"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required="required"
                                                data-th-data-result='${PS}' allowClear="true" formatoption="true"
                                                data-th-initValue="${entity?.ps}"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdDepositValuationTrade002.ccy}">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="ccy" name="ccy"
                                                data-th-data-result="${CCY}"
                                                th:initvalue="*{entity?.ccy?:CCY_default}" class="layui-input form-input input-select hidden"
                                                data-th-placeholder="#{SysCommon.placeholder}" required="required">
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="pro-module-wrap" th:id="value_div">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">清算信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdIntoValuationDuration002.tradeDate}">交易日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="tradeDate" name="tradeDate"
                                               class="layui-input form-input input-dateSelect hidden" required="required"
                                               data-th-value='${#dates.format(entity?.tradeDate?:iPlatformDate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdIntoValuationDuration002.settleDate}">交割日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="settleDate" name="settleDate"
                                               class="layui-input form-input input-dateSelect hidden" required="required"
                                               data-th-value='${#dates.format(entity?.settleDate?:iPlatformDate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdIntoValuationDuration002.vdate}">计息开始日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="vdate" name="vdate"
                                               class="layui-input form-input input-dateSelect hidden" required="required"
                                               data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdIntoValuationDuration002.mdate}">计息结束日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="mdate" name="mdate"
                                               class="layui-input form-input input-dateSelect hidden" required="required"
                                               data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">实收本金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" th:id="actCapi" th:name="actCapi" required th:value="${entity?.actCapi?:0}" maxlength="28"
                                               data-textrange="2" data-fixtype="2" class="layui-input form-input text-number"
                                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wra">实收利息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" th:id="actInt" name="actInt" maxLength="28"
                                               required th:value="${entity?.actInt?:0}" class="layui-input form-input text-number rateCal"
                                               data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">结算金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" th:id="settleAmt" th:name="settleAmt" required th:value="${entity?.settleAmt}" maxlength="28"
                                               data-textrange="2" data-fixtype="2" class="layui-input form-input text-number"
                                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-lable" >资金账户</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="myAcctNo" name="myAcctNo" class="layui-input form-input input-select" parentIds="prodId"
                                                th:data-url="@{/valuation/trademanage/trdintovaluationduration/TrdIntoValuationDuration002/getTrdAcctId}"
                                                allowClear="true" placeholder="请输入内容" required="required"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initvalue="${entity?.myAcctNo}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        <div class="layui-form-item">
            <div align="center" style="height:50px;padding-top: 10px;">

                <a id="TrdIntoValuationDuration002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                <a id="TrdIntoValuationDuration002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="TrdIntoValuationDuration002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>

    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
    </script>
    <script th:src="@{/js/valuation/trademanage/trdintovaluationduration/TrdIntoValuationDuration002.js}" type="text/javascript"></script>
</div>
</body>
</html>
