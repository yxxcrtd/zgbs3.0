<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title th:text="#{TrdIrsValuationDuration002}">利率互换存续期管理新建</title>
</head>
<body>
<div layout:fragment="content">
    <style type="text/css">
        .layui-form-radio {
            line-height: 24px;
            padding-right: 0px;
            margin: 0px;
        }
        .layui-form-radio div {
            font-size: 12px;
        }
        .layui-form-radio i{
            font-size: 14px;
        }
    </style>
    <div class="pro-module-container" style="margin-bottom: 20px;">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base" >
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" >基础信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdIrsValuationDuration002.tradeId}">交易编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeId" name="tradeId"
                                               required disabled
                                               placeholder="提交后自动生成，无需填写"
                                               class="layui-input form-input"
                                               data-th-value="${entity?.tradeId}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdIrsValuationDuration002.pTradeId}">原始交易编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="pTradeId" name="pTradeId" required
                                                class="layui-input form-input input-select"
                                                data-th-data-url="@{/valuation/trademanage/trdirsvaluationduration/TrdIrsValuationDuration002/getTradeId}"
                                                allowClear="true"
                                                th:formatoption="false"
                                                data-th-initValue="${entity?.pTradeId}"
                                                placeholder="请输入内容">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdIrsValuationDuration002.prodId}">产品代码</label>
                                        <div class="layui-input-inline input-inline" >
                                            <select id="prodId" name="prodId" required disabled
                                                    class="layui-input form-input input-select"
                                                    data-th-data-url="@{/valuation/trademanage/trdirsvaluationduration/TrdIrsValuationDuration002/getFinprodId}"
                                                     allowClear="true" placeholder="请输入内容"
                                                    th:formatoption="false"
                                                    data-th-initValue="${entity?.prodId}" >
                                            </select>
                                        </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdIrsValuationDuration002.prodName}">产品名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="prodName" name="prodName" required disabled
                                                class="layui-input form-input" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${entity?.prodName}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdIrsValuationDuration002.ps}">交易类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="ps" name="ps" required
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-result='${IRS_DUR_TYPE}'
                                                allowClear="true"
                                                formatoption="true"
                                                data-th-initValue="${entity?.ps}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdIrsValuationDuration002.counterId}">交易对手</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="counterId" name="counterId"
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" required="required"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-url="@{/valuation/trademanage/trddepositvaluationtrade/TrdDepositValuationTrade002/getCounterId}"
                                                data-th-initvalue="${entity?.counterId}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdIrsValuationDuration002.irsPsIntType}">收付息类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="irsPsIntType" name="irsPsIntType" required
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${IRS_PS_INT_TYPE}'
                                                allowClear="true" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                                data-th-value="${entity?.irsPsIntType}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdIrsValuationDuration002.tradeDate}">交易日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeDate" name="tradeDate" required
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${#dates.format(entity?.tradeDate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdIrsValuationDuration002.fixPayDate}">固定利息支付日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="fixPayDate" name="fixPayDate"
                                               class="layui-input form-input input-dateSelect"
                                               placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${#dates.format(entity?.fixPayDate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdIrsValuationDuration002.floatPayDate}">浮动利息支付日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="floatPayDate" name="floatPayDate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${#dates.format(entity?.floatPayDate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdIrsValuationDuration002.beforeEndPayDate}">提前终止支付日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="beforeEndPayDate" name="beforeEndPayDate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${#dates.format(entity?.beforeEndPayDate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdIrsValuationDuration002.beforeEndPs}">提前终止收付方向</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="beforeEndPs" name="beforeEndPs"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${PS}'
                                                allowClear="true" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                                data-th-value="${entity?.beforeEndPs}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">金额信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdIrsValuationDuration002.prin}">名义本金</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="prin" name="prin" required maxLength="28"
                                           class="layui-input form-input text-number"
                                           data-textrange="2" data-fixtype="2"
                                           th:value="${entity?.prin}"
                                           placeholder="请输入内容">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdIrsValuationDuration002.remainPrin}">剩余名义本金</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="remainPrin" name="remainPrin" required maxLength="28"
                                           class="layui-input form-input text-number"
                                           data-textrange="2" data-fixtype="2"
                                           th:value="${entity?.remainPrin}"
                                           placeholder="请输入内容">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdIrsValuationDuration002.ccy}">币种</label>
                                <div class="layui-input-inline input-inline">
                                    <select  type="text" id="ccy" name="ccy" required
                                             class="layui-input form-input input-select"
                                             placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                             th:data-result='${CCY}'
                                             allowClear="true"
                                             formatoption="true"
                                             th:initValue="*{entity?.ccy?:CCY_default}"></select>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdIrsValuationDuration002.fixIntAmt}">固定利息</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="fixIntAmt" name="fixIntAmt"  maxLength="28"
                                           class="layui-input form-input text-number"
                                           data-textrange="2" data-fixtype="2"
                                           th:value="${entity?.fixIntAmt}"
                                           placeholder="请输入内容">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdIrsValuationDuration002.floatIntAmt}">浮动利息</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="floatIntAmt" name="floatIntAmt"  maxLength="28"
                                           class="layui-input form-input text-number"
                                           data-textrange="2" data-fixtype="2"
                                           th:value="${entity?.floatIntAmt}"
                                           placeholder="请输入内容">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdIrsValuationDuration002.beforeEndPrin}">提前终止名义本金</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="beforeEndPrin" name="beforeEndPrin"  maxLength="28"
                                           class="layui-input form-input text-number"
                                           data-textrange="2" data-fixtype="2"
                                           th:value="${entity?.beforeEndPrin}"
                                           placeholder="请输入内容">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdIrsValuationDuration002.beforeEndAmt}">提前终止收付金额</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="beforeEndAmt" name="beforeEndAmt"  maxLength="28"
                                           class="layui-input form-input text-number"
                                           data-textrange="2" data-fixtype="2"
                                           th:value="${entity?.beforeEndAmt}"
                                           placeholder="请输入内容">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">费用信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdIrsValuationDuration002.otherAmt}">其他费用</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="otherAmt" name="otherAmt"
                                                class="layui-input form-input text-number" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${entity?.otherAmt?:0}" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">汇总信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdIrsValuationDuration002.settleAmt}">结算金额</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text" id="settleAmt" name="settleAmt" required
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.settleAmt}" />
                                </div>
                            </div>
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdIrsValuationDuration002.myAcctNo}">资金账户</label>
                                <div class="layui-input-inline input-inline" >
                                    <select id="myAcctNo" name="myAcctNo"
                                            class="layui-input form-input input-select"
                                            data-th-data-url="@{/valuation/trademanage/trdirsvaluationduration/TrdIrsValuationDuration002/getTrdAcctId}"
                                            allowClear="true" placeholder="请输入内容"
                                            data-th-initValue="${entity?.myAcctNo}">
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </form>

        <input type="text" id="workflowId" name="workflowId" class="layui-input form-input" data-th-value="${workflowId}" disabled="disabled" style = "display:none;">

        <div class="row text-center" style="margin: 20px 0;">
            <a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save"
               data-th-text="#{SysCommon.save}">保存</a>
            <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit"
               data-th-text="#{SysCommon.submit}">提交</a>
            <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">

    </script>
    <script th:src="@{/js/valuation/trademanage/trdirsvaluationduration/TrdIrsValuationDuration002.js}" type="text/javascript"></script>
</div>
</body>
</html>
