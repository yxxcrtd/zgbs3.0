<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorator="~{layout/default}">

<head>
	<title data-th-text="#{TrdFundValuationTrade002}">基金交易新建</title>
</head>
<body>
<div layout:fragment="content">
	<div class="pro-module-container">
		<div class="pro-module-wrapper pro-module-base">
			<form id="basicInfoForm" class="layui-form joyin-form-wrap pro-module-form">
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title"><span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{TrdFundValuationTrade002.tradeId}">交易编号</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="tradeId" name="tradeId"
											   required disabled
											   placeholder="提交后自动生成，无需填写"
											   class="layui-input form-input"
											   data-th-value="${entity?.tradeId}">
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{TrdFundValuationTrade002.outTradeId}">外部成交编号</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="outTradeId" name="outTradeId"
											   class="layui-input form-input"
											   data-th-value="${entity?.outTradeId}">
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{TrdFundValuationTrade002.prodName}">产品名称</label>
									<div class="layui-input-inline input-inline" >
										<select id="prodId" name="prodId" required
												class="layui-input form-input input-select"
												data-th-data-url="@{/valuation/trademanage/trdfundvaluationtrade/TrdFundValuationTrade001/getFinprodId}"
												allowClear="true" placeholder="请输入内容"
												data-th-initValue="${entity?.prodId}" >
										</select>
									</div>
								</div>
							</div>

							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdFundValuationTrade002.prodId}">产品代码</label>
									<div class="layui-input-inline input-inline">
										<input  type="text" id="prodName" name="prodName" required disabled
												class="layui-input form-input" placeholder="请输入内容"
												th:placeholder="#{SysCommon.placeholder}"
												th:value="${entity?.prodName}">
									</div>
								</div>

								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{TrdFundValuationTrade002.assetAbbr}">资产名称</label>
									<div class="layui-input-inline input-inline">
										<select id="assetId" name="assetId" required
												class="layui-input form-input input-select"
												data-th-data-url="@{/valuation/trademanage/trdfundvaluationtrade/TrdFundValuationTrade001/getAssetId}"
												allowClear="true" placeholder="请输入内容"
												data-th-initValue="${entity?.assetId}" >
										</select>
									</div>
								</div>

								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{TrdFundValuationTrade002.assetId}">资产代码</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="assetAbbr" name="assetAbbr"
											   class="layui-input form-input"
											   required disabled
											   data-th-value="${entity?.assetAbbr}"
											   placeholder="请输入内容">
									</div>
								</div>
							</div>

							<div class="layui-form-item">

								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{TrdFundValuationTrade002.ps}">交易类型</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="ps" name="ps" required
												class="layui-input form-input input-select"
												placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-result='${PS}'
												allowClear="true"
												formatoption="true"
												data-th-initValue="${entity?.ps}">
										</select>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{TrdFundValuationTrade002.tradeMarket}">交易场所</label>
									<div class="layui-input-inline input-inline">
										<input id="tradeMarket" name="tradeMarket" class="input-select" required
											   placeholder="请选择" disabled
											   data-th-data-result="${TRADE_PLACE}"
											   allowClear="true"
											   data-th-placeholder="#{SysCommon.placeholder}"
											   data-th-initValue="${entity?.tradeMarket}">
									</div>
								</div>

								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdFundValuationTrade002.ccy}">币种</label>
									<div class="layui-input-inline input-inline">
										<select  type="text" id="ccy" name="ccy" required
												 class="layui-input form-input input-select"
												 placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
												 th:data-result='${CCY}'
												 allowClear="true"
												 formatoption="true"
												 th:initValue="*{entity?.ccy?:CCY_default}"></select>
									</div>
								</div>
							</div>

						</div>
					</div>
				</div>

				<div class="pro-module-wrap" id="tradeInfo">
					<div class="pro-module">
						<h3 class="pro-module-title"><span class="title-des">交易信息</span><i
								class="iconfont icon-arrow-down pro-down-icon"></i></h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{TrdFundValuationTrade002.tradeDate}">交易日期</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="tradeDate" name="tradeDate" required
											   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
											   data-th-placeholder="#{SysCommon.placeholder}"
											   data-th-value='${#dates.format(entity?.tradeDate?:iPlatformDate,"yyyy-MM-dd")}'>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{TrdFundValuationTrade002.settleDate}">结算日期</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="settleDate" name="settleDate" required
											   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
											   data-th-placeholder="#{SysCommon.placeholder}"
											   data-th-value='${#dates.format(entity?.settleDate?:iPlatformDate,"yyyy-MM-dd")}'>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{TrdFundValuationTrade002.dealNum}">成交数量</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="dealNum" name="dealNum" required
											   class="layui-input form-input text-number"
											   maxLength="28" data-textrange="2" data-fixtype="2"
											   th:value="${entity?.dealNum}"
											   placeholder="请输入内容">
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{TrdFundValuationTrade002.tradeAmt}">成交金额</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="tradeAmt" name="tradeAmt" required
											   class="layui-input form-input text-number"
											   maxLength="28" data-textrange="2" data-fixtype="2"
											   th:value="${entity?.tradeAmt}"
											   placeholder="请输入内容">
									</div>
								</div>
								<div class="form-inline-wrap" >
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdFundValuationTrade002.myAcctNo}">资金账户</label>
									<div class="layui-input-inline input-inline" >
										<select id="trdMyAcctNo" name="trdMyAcctNo" required
												class="layui-input form-input input-select"
												data-th-data-url="@{/valuation/trademanage/bondlend/TrdBondLendTrade002/getTrdAcctId}"
												allowClear="true" placeholder="请输入内容"
												data-th-initValue="${entity?.trdMyAcctNo}">
										</select>
									</div>
								</div>
								<div class="form-inline-wrap" >
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdFundValuationTrade002.brokerage}">经手费</label>
									<div class="layui-input-inline input-inline">
										<input  type="text" id="brokerage" name="brokerage" required
												class="layui-input form-input text-number" placeholder="请输入内容"
												maxLength="28" data-textrange="2" data-fixtype="2"
												th:placeholder="#{SysCommon.placeholder}"
												th:value="${entity?.brokerage?:0}" />
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap" >
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdFundValuationTrade002.commission}">净佣金</label>
									<div class="layui-input-inline input-inline">
										<input  type="text" id="commission" name="commission" required
												class="layui-input form-input text-number" placeholder="请输入内容"
												maxLength="28" data-textrange="2" data-fixtype="2"
												th:placeholder="#{SysCommon.placeholder}"
												th:value="${entity?.commission?:0}" />
									</div>
								</div>
								<div class="form-inline-wrap" >
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdFundValuationTrade002.settleAmt}">结算金额</label>
									<div class="layui-input-inline input-inline">
										<input  type="text" id="settleAmt" name="settleAmt" required
												class="layui-input form-input text-number" placeholder="请输入内容"
												maxLength="28" data-textrange="2" data-fixtype="2"
												th:placeholder="#{SysCommon.placeholder}"
												th:value="${entity?.settleAmt}" />
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>

				<div class="pro-module-wrap" id="subscriptionInfo">
					<div class="pro-module">
						<h3 class="pro-module-title"><span class="title-des">认购信息</span><i
								class="iconfont icon-arrow-down pro-down-icon"></i></h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdFundValuationTrade002.applyDate}">申请日期</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="applyDate" name="applyDate" required
											   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
											   th:placeholder="#{SysCommon.placeholder}"
											   data-th-value='${#dates.format(entity?.applyDate?:iPlatformDate,"yyyy-MM-dd")}'>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{TrdFundValuationTrade002.settleDate}">结算日期</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="subSettleDate" name="subSettleDate" required
											   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
											   data-th-placeholder="#{SysCommon.placeholder}"
											   data-th-value='${#dates.format(entity?.subSettleDate?:iPlatformDate,"yyyy-MM-dd")}'>
									</div>
								</div>
								<div class="form-inline-wrap" >
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdFundValuationTrade002.applyAmt}">申请金额</label>
									<div class="layui-input-inline input-inline">
										<input  type="text" id="applyAmt" name="applyAmt" required
												class="layui-input form-input text-number" placeholder="请输入内容"
												maxLength="28" data-textrange="2" data-fixtype="2"
												th:placeholder="#{SysCommon.placeholder}"
												th:value="${entity?.applyAmt}" />
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap" >
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdFundValuationTrade002.myAcctNo}">资金账户</label>
									<div class="layui-input-inline input-inline" >
										<select id="subMyAcctNo" name="subMyAcctNo" required
												class="layui-input form-input input-select"
												data-th-data-url="@{/valuation/trademanage/bondlend/TrdBondLendTrade002/getTrdAcctId}"
												allowClear="true" placeholder="请输入内容"
												data-th-initValue="${entity?.subMyAcctNo}">
										</select>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>

				<div class="pro-module-wrap" id="purchaseInfo">
					<div class="pro-module">
						<h3 class="pro-module-title"><span class="title-des">申购信息</span><i
								class="iconfont icon-arrow-down pro-down-icon"></i></h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdFundValuationTrade002.applyDate}">申请日期</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="purApplyDate" name="purApplyDate" required
											   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
											   th:placeholder="#{SysCommon.placeholder}"
											   data-th-value='${#dates.format(entity?.purApplyDate?:iPlatformDate,"yyyy-MM-dd")}'>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{TrdFundValuationTrade002.settleDate}">结算日期</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="purSettleDate" name="purSettleDate" required
											   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
											   data-th-placeholder="#{SysCommon.placeholder}"
											   data-th-value='${#dates.format(entity?.purSettleDate?:iPlatformDate,"yyyy-MM-dd")}'>
									</div>
								</div>
								<div class="form-inline-wrap" >
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdFundValuationTrade002.applyAmt}">申请金额</label>
									<div class="layui-input-inline input-inline">
										<input  type="text" id="purApplyAmt" name="purApplyAmt" required
												class="layui-input form-input text-number" placeholder="请输入内容"
												maxLength="28" data-textrange="2" data-fixtype="2"
												th:placeholder="#{SysCommon.placeholder}"
												th:value="${entity?.purApplyAmt}" />
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap" >
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdFundValuationTrade002.myAcctNo}">资金账户</label>
									<div class="layui-input-inline input-inline" >
										<select id="purMyAcctNo" name="purMyAcctNo" required
												class="layui-input form-input input-select"
												data-th-data-url="@{/valuation/trademanage/bondlend/TrdBondLendTrade002/getTrdAcctId}"
												allowClear="true" placeholder="请输入内容"
												data-th-initValue="${entity?.purMyAcctNo}">
										</select>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>

				<div class="pro-module-wrap" id="subConfirmInfo">
					<div class="pro-module">
						<h3 class="pro-module-title"><span class="title-des">确认信息</span><i
								class="iconfont icon-arrow-down pro-down-icon"></i></h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdFundValuationTrade002.subConfirmDate}">确认日期</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="subConfirmDate" name="subConfirmDate" required
											   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
											   th:placeholder="#{SysCommon.placeholder}"
											   data-th-value='${#dates.format(entity?.subConfirmDate?:iPlatformDate,"yyyy-MM-dd")}'>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{TrdFundValuationTrade002.subConfirmNum}">确认数量</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="subConfirmNum" name="subConfirmNum" required
											   class="layui-input form-input text-number"
											   maxLength="28" data-textrange="2" data-fixtype="2"
											   th:value="${entity?.subConfirmNum}"
											   placeholder="请输入内容">
									</div>
								</div>
								<div class="form-inline-wrap" >
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdFundValuationTrade002.subConfirmAmt}">确认金额</label>
									<div class="layui-input-inline input-inline">
										<input  type="text" id="subConfirmAmt" name="subConfirmAmt"
												class="layui-input form-input text-number" placeholder="请输入内容"
												maxLength="28" data-textrange="2" data-fixtype="2"
												th:placeholder="#{SysCommon.placeholder}"
												th:value="${entity?.subConfirmAmt}" />
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap" >
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdFundValuationTrade002.raiseInterest}">募集期利息</label>
									<div class="layui-input-inline input-inline">
										<input  type="text" id="raiseInterest" name="raiseInterest"
												class="layui-input form-input text-number" placeholder="请输入内容"
												maxLength="28" data-textrange="2" data-fixtype="2"
												th:placeholder="#{SysCommon.placeholder}"
												th:value="${entity?.raiseInterest}" />
									</div>
								</div>
								<div class="form-inline-wrap" >
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdFundValuationTrade002.subFee}">认购费</label>
									<div class="layui-input-inline input-inline">
										<input  type="text" id="subFee" name="subFee" required
												class="layui-input form-input text-number" placeholder="请输入内容"
												maxLength="28" data-textrange="2" data-fixtype="2"
												th:placeholder="#{SysCommon.placeholder}"
												th:value="${entity?.subFee?:0}" />
									</div>
								</div>
								<div class="form-inline-wrap" >
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdFundValuationTrade002.myAcctNo}">资金账户</label>
									<div class="layui-input-inline input-inline" >
										<select id="subConfirmMyAcctNo" name="subConfirmMyAcctNo" required
												class="layui-input form-input input-select"
												data-th-data-url="@{/valuation/trademanage/bondlend/TrdBondLendTrade002/getTrdAcctId}"
												allowClear="true" placeholder="请输入内容"
												data-th-initValue="${entity?.subConfirmMyAcctNo}">
										</select>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>

				<div class="pro-module-wrap" id="purConfirmInfo">
					<div class="pro-module">
						<h3 class="pro-module-title"><span class="title-des">确认信息</span><i
								class="iconfont icon-arrow-down pro-down-icon"></i></h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdFundValuationTrade002.subConfirmDate}">确认日期</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="purConfirmDate" name="purConfirmDate" required
											   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
											   th:placeholder="#{SysCommon.placeholder}"
											   data-th-value='${#dates.format(entity?.purConfirmDate?:iPlatformDate,"yyyy-MM-dd")}'>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{TrdFundValuationTrade002.subConfirmNum}">确认数量</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="purConfirmNum" name="purConfirmNum" required
											   class="layui-input form-input text-number"
											   maxLength="28" data-textrange="2" data-fixtype="2"
											   th:value="${entity?.purConfirmNum}"
											   placeholder="请输入内容">
									</div>
								</div>
								<div class="form-inline-wrap" >
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdFundValuationTrade002.subConfirmAmt}">确认金额</label>
									<div class="layui-input-inline input-inline">
										<input  type="text" id="purConfirmAmt" name="purConfirmAmt"
