<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form " id="fundForm">
            <div class="layui-collapse">
                <div class="layui-colla-item">
                    <h2 class="layui-colla-title">基本信息</h2>
                    <div class="layui-colla-content layui-show">
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">交易编号</label>
                                <div class="layui-input-inline input-inline">
                                    <input id="tradeId" name="tradeId" class="layui-input form-input"
                                        data-th-value="${entity?.tradeId}">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">投资主体代码</label>
                                <div class="layui-input-inline input-inline">
                                    <input id="prodId" name="prodId" class="layui-input form-input " placeholder=""
                                        allowClear="true" data-th-value="${entity?.prodId}">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">投资主体名称</label>
                                <div class="layui-input-inline input-inline">
                                    <input id="prodAbbr" name="prodAbbr" class="layui-input form-input "
                                        placeholder="" allowClear="true" data-th-value="${entity?.prodAbbr}">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">拆借方向</label>
                                <div class="layui-input-inline input-inline">
                                    <input id="finprodType" name="finprodType"
                                        class="layui-input form-input input-checkbox" placeholder=""
                                        data-result=" [{&quot;id&quot;:&quot;F08&quot;,&quot;text&quot;:&quot;拆入&quot;,&quot;col&quot;:&quot;&quot;},
                                        				{&quot;id&quot;:&quot;F09&quot;,&quot;text&quot;:&quot;拆出&quot;,&quot;col&quot;:&quot;&quot;},
                                        				{&quot;id&quot;:&quot;F21&quot;,&quot;text&quot;:&quot;同业借款&quot;,&quot;col&quot;:&quot;&quot;}]"
                                        allowClear="true" data-th-initvalue="${entity?.finprodTypeCode}"
                                        disabled="disabled">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">期限品种</label>
                                <div class="layui-input-inline input-inline">
                                    <input id="termType" name="termType" class="layui-input form-input"
                                        placeholder="" allowClear="true" data-th-value="${entity?.termTypeLend}">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">交易对手</label>
                                <div class="layui-input-inline input-inline">
                                    <input id="tradeMarket" name="tradeMarket" class="layui-input form-input"
                                        placeholder="" allowClear="true" data-th-value="${entity?.counterName}">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">交易日</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="tradeDate" name="tradeDate" placeholder=""
                                        class="layui-input form-input input-dateSelect"
                                        data-th-value="${entity?.tradeDate}">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">交割日</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="settleDate" name="settleDate" placeholder=""
                                        class="layui-input form-input input-dateSelect"
                                        data-th-value="${entity?.settleDate}">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">起息日</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="vDate" name="vDate" placeholder=""
                                        class="layui-input form-input input-dateSelect" data-th-value="${entity?.vDate}">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">到期日</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="settleDate" name="settleDate" placeholder=""
                                        class="layui-input form-input input-dateSelect" data-th-value="${entity?.mDate}">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">计息基础</label>
                                <div class="layui-input-inline input-inline ">
                                    <input id="" name="" class="layui-input form-input input-checkbox" placeholder=""
                                        allowClear="true"
                                        data-result="[{&quot;id&quot;:&quot;A/360&quot;,&quot;text&quot;:&quot;A/360&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;A/365&quot;,&quot;text&quot;:&quot;A/365&quot;,&quot;col&quot;:&quot;&quot;}]"
                                        data-th-initvalue="${entity?.basis}" disabled="disabled">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">交易员</label>
                                <div class="layui-input-inline input-inline">
                                    <input id="trader" name="trader" class="layui-input form-input"
                                        data-th-value="${entity?.trader}">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">本金收益特征</label>
                                <div class="layui-input-inline input-inline">
                                    <input id="capiIncomeFeature" name="capiIncomeFeature"
                                        class="layui-input form-input "
                                        data-th-data-result="${AMT_INCOME_TYPE}" placeholder="" allowClear="true"
                                        data-th-value="${entity?.capiIncomeFeature}">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="layui-colla-item">
                    <h2 class="layui-colla-title">金额信息</h2>
                    <div class="layui-colla-content layui-show">
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">拆借金额</label>
                                <div class="layui-input-inline input-inline">
                                    <input id="prinAmt" name="prinAmt" class="layui-input form-input text-money" data-textrange="2" placeholder=""
                                        allowClear="true" data-th-value="${entity?.prinAmt}">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">拆借利率(%)</label>
                                <div class="layui-input-inline input-inline">
                                    <input id="intRate" name="intRate" class="layui-input form-input " placeholder=""
                                        allowClear="true" data-th-value="${entity?.intRate}">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">应计利息</label>
                                <div class="layui-input-inline input-inline">
                                    <input id="intAmt" name="intAmt" class="layui-input form-input text-money" data-textrange="2" placeholder=""
                                        allowClear="true" data-th-value="${entity?.intAmt}">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">到期本息和</label>
                                <div class="layui-input-inline input-inline">
                                    <input id="tradeAmt" name="tradeAmt" class="layui-input form-input text-money" data-textrange="2"
                                        placeholder="" allowClear="true" data-th-value="${entity?.tradeAmt}">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="layui-colla-item">
                    <h2 class="layui-colla-title">清算信息</h2>
                    <div class="layui-colla-content layui-show">
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">出/收款账户</label>
                                <div class="layui-input-inline input-inline">
                                    <input id="myAcctName" name="myAcctName" class="layui-input form-input "
                                        placeholder="" allowClear="true" data-th-value="${entity?.myAcctName}">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">对手方资金账户</label>
                                <div class="layui-input-inline input-inline">
                                    <input id="counterAcctName" name="counterAcctName" class="layui-input form-input "
                                        placeholder="" allowClear="true" data-th-value="${entity?.counterAcctName}">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="layui-colla-item">
                    <h2 class="layui-colla-title">备注</h2>
                    <div class="layui-colla-content layui-show">
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md8">
                                <label class="layui-form-label form-label-wrap">备注</label>
                                <div class="layui-input-block">
                                    <textarea name="remark" maxlength="80" class="layui-textarea" placeholder="请输入内容"
                                        data-th-placeholder="#{SysCommon.placeholder}"></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
