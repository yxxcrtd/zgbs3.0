<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<script th:inline="javascript">
    var initps = [[${ps}]];
</script>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form " id="fundForm">
            <!-- 查看债券交易 -->
            <div id="div0" style="display: none;">
                <div class="layui-collapse">
                    <div class="layui-colla-item">
                        <h2 class="layui-colla-title">基本信息</h2>
                        <div class="layui-colla-content layui-show">
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">交易编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="tradeId" name="tradeId" class="layui-input form-input"
                                            data-th-value="${entity?.tradeId}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">投资主体</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="prodAbbr" name="prodAbbr" class="layui-input form-input "
                                            placeholder="" allowClear="true" data-th-value="${entity?.prodAbbr}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">债券代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="assetId" name="assetId" class="layui-input form-input "
                                            placeholder="" allowClear="true" data-th-value="${entity?.assetId}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">债券名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="assetAbbr" name="assetAbbr" class="layui-input form-input"
                                            data-th-value="${entity?.assetAbbr}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">交易方向</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="ps" name="ps" class="layui-input form-input input-select"
                                            placeholder="" data-th-data-result="${PS}" allowClear="true"
                                            data-th-value="${entity?.psCode}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">交易场所</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="tradeMarket" name="tradeMarket"
                                            class="layui-input form-input input-select" placeholder=""
                                            data-th-data-result="${TRADE_MARKET}" allowClear="true"
                                            data-th-value="${entity?.tradeMarketCode}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">清算速度</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="" name="" class="layui-input form-input input-checkbox"
                                            data-result="" initvalue="" allowClear="true">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">交易日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeDate" name="tradeDate" placeholder=""
                                            class="layui-input form-input input-dateSelect"
                                            data-th-value="${entity?.tradeDate}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">交割日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="settleDate" name="settleDate" placeholder=""
                                            class="layui-input form-input input-dateSelect"
                                            data-th-value="${entity?.settleDate}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">交易币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="ccy" name="ccy" class="layui-input form-input input-select"
                                            placeholder="" data-th-data-result="${CCY}" allowClear="true"
                                            data-th-value="${entity?.ccyCode}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">投资目的</label>
                                    <div class="layui-input-inline input-inline ">
                                        <input id="invAim" name="invAim" class="layui-input form-input" allowClear="true" data-th-value="${entity?.invAim}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">结算方式</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="" name="" class="layui-input form-input input-select"
                                             allowClear="true" data-result="" value="">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">交易员</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="trader" name="trader" class="layui-input form-input"
                                            data-th-value="${entity?.trader}">
                                    </div>
                                </div>
                                <!--  <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">交易对手类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="counterType" name="counterType"
                                            class="layui-input form-input input-select"
                                            data-th-data-result="${COUNTER_TYPE}" placeholder="" allowClear="true"
                                            data-th-value="${entity?.counterTypeCode}">
                                    </div>
                                </div>-->
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">交易对手</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="counterName" name="counterName" class="layui-input form-input "
                                            placeholder="" allowClear="true" data-th-value="${entity?.counterName}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">对手方交易员</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="" name="" class="layui-input form-input" value="">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">证券管理户</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="secManageAcctId" name="secManageAcctId"
                                            class="layui-input form-input " placeholder="" allowClear="true"
                                            data-th-value="${entity?.secManageAcctId}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">通道</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="chlId" name="chlId" class="layui-input form-input " 
                                            allowClear="true" data-th-value="${entity?.chlId}">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="layui-colla-item">
                        <h2 class="layui-colla-title">交易信息</h2>
                        <div class="layui-colla-content layui-show">
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">券面总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="shareAmt" name="shareAmt" class="layui-input form-input text-money"
                                            data-th-value="${entity?.shareAmt}" data-textrange="2">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">单位净价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="unitCprice" name="unitCprice" class="layui-input form-input text-money"
                                            data-th-value="${entity?.unitCprice}" data-textrange="6">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">单位应计利息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="unitInt" name="unitInt" class="layui-input form-input text-money"
                                            data-th-value="${entity?.unitInt}" data-textrange="6">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">单位全价</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="unitFprice" name="unitFprice" class="layui-input form-input text-money"
                                            data-th-value="${entity?.unitFprice}" data-textrange="6">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">净价总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="cpriceAmt" name="cpriceAmt" class="layui-input form-input text-money"
                                            data-th-value="${entity?.cpriceAmt}" data-textrange="2">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">应收利息总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="intAmt" name="intAmt" class="layui-input form-input text-money"
                                            data-th-value="${entity?.intAmt}" data-textrange="2">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">全价总额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="fpriceAmt" name="fpriceAmt" class="layui-input form-input text-money"
                                            data-th-value="${entity?.fpriceAmt}" data-textrange="2">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">随交易支付费用</label>
                                    <div class="layui-input-inline input-inline ">
                                        <input id="feeAmtPay" name="feeAmtPay" class="layui-input form-input text-money"
                                            data-th-value="${entity?.feeAmtPay}" data-textrange="2">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">不随交易支付费用</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="feeAmtUnpay" name="feeAmtUnpay" class="layui-input form-input text-money"
                                            data-th-value="${entity?.feeAmtUnpay}" data-textrange="2">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">通道费</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="tdFeeAmt" name="tdFeeAmt" class="layui-input form-input text-money"
                                            data-th-value="${entity?.tdFeeAmt}" data-textrange="2">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">交易总费用</label>
                                    <div class="layui-input-inline input-inline ">
                                        <input id="feeAmt" name="feeAmt" class="layui-input form-input text-money"
                                            data-th-value="${entity?.feeAmt}" data-textrange="2">
                                    </div>
                                </div>
                                <!-- TODO PAGE_MODEL_REFERENCE存在bug，会导致checked失效 -->
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">显示包含费用</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="checkbox" id="isShowFeeList" data-ignore="false" name="isShowFeeList" lay-skin="switch"
                                            lay-filter="isShowFeeList" lay-text="是|否">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item layui-bg-gray feeList" id="feeList" style="margin: 10px 0">
                                <div  data-th-each="fee : ${entity.tradeFeeDetailDtoList}">
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable" data-th-text="${fee?.feeTypeName}">费用名称</label>
                                        <div class="layui-input-inline input-inline">
                                            <input id="feeAmt" name="feeAmt" class="layui-input form-input"
                                                data-th-value="${fee?.feeAmt}">
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md2">
                                        <div class="layui-input-inline input-inline">
                                            <input type="checkbox" id="isPayWithTrade" name="isPayWithTrade"
                                                title="随交易支付" lay-skin="primary"
                                                data-th-checked="${fee?.isPayWithTrade} eq 'Y'">
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">交易金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="tradeAmt" name="tradeAmt" class="layui-input form-input text-money"
                                            data-th-value="${entity?.tradeAmt}" data-textrange="2">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">到期收益率(%)</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="yield" name="yield" class="layui-input form-input "
                                            data-th-value="${entity?.yield}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">行权收益率(%)</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="exerYield" name="exerYield" class="layui-input form-input "
                                            data-th-value="${entity?.exerYield}">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 查看债券存续期交易 -->
            <div id="div1" style="display: none;">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">交易编号</label>
                        <div class="layui-input-inline input-inline">
                            <input id="tradeId" name="tradeId" class="layui-input form-input"
                                data-th-value="${entity?.tradeId}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">投资主体</label>
                        <div class="layui-input-inline input-inline">
                            <input id="prodAbbr" name="prodAbbr" class="layui-input form-input " placeholder=""
                                allowClear="true" data-th-value="${entity?.prodAbbr}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">债券代码</label>
                        <div class="layui-input-inline input-inline">
                            <input id="assetId" name="assetId" class="layui-input form-input " placeholder=""
                                allowClear="true" data-th-value="${entity?.assetId}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">债券名称</label>
                        <div class="layui-input-inline input-inline">
                            <input id="assetAbbr" name="assetAbbr" class="layui-input form-input"
                                data-th-value="${entity?.assetAbbr}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">交易方向</label>
                        <div class="layui-input-inline input-inline">
                            <input id="ps" name="ps" class="layui-input form-input input-select" placeholder=""
                                data-th-data-result="${PS}" allowClear="true" data-th-value="${entity?.psCode}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">投资目的</label>
                        <div class="layui-input-inline input-inline ">
                            <input id="invAim" name="invAim" class="layui-input form-input input-select"
                                placeholder="" allowClear="true" data-th-data-result="${INV_AIM}"
                                data-th-value="${entity?.invAimCode}">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md6">
                            <label class="layui-form-label form-lable">应收利息</label>
                            <div class="layui-input-inline input-inline">
                                <input id="intAmt" name="intAmt" class="layui-input form-input "
                                    data-th-value="${entity?.intAmt}">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md6">
                            <label class="layui-form-label form-lable">币种</label>
                            <div class="layui-input-inline input-inline">
                                <input id="ccy" name="ccy" class="layui-input form-input input-select" placeholder=""
                                    data-th-data-result="${CCY}" allowClear="true" data-th-value="${entity?.ccyCode}">
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md6">
                            <label class="layui-form-label form-lable">计息开始日</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="vdate" name="vDate" placeholder=""
                                    class="layui-input form-input input-dateSelect" data-th-value="${entity?.vDate}">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md6">
                            <label class="layui-form-label form-lable">计息截至日</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="mDate" name="mDate" placeholder=""
                                    class="layui-input form-input input-dateSelect" data-th-value="${entity?.mDate}">
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md6">
                            <label class="layui-form-label form-lable">计划支付日</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="tradeDate" name="tradeDate" placeholder=" "
                                    class="layui-input form-input input-dateSelect" data-th-value="${entity?.tradeDate}">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md6">
                            <label class="layui-form-label form-lable">当前券面总额</label>
                            <div class="layui-input-inline input-inline">
                                <input id="prinAmt" name="prinAmt" class="layui-input form-input  "
                                    data-th-value="${entity?.shareAmt}">
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md6">
                            <label class="layui-form-label form-lable">当前单位面值</label>
                            <div class="layui-input-inline input-inline">
                                <input id="parValue" name="parValue" class="layui-input form-input "
                                    data-th-value="${entity?.parValue}">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md6">
                            <label class="layui-form-label form-lable">应收本金</label>
                            <div class="layui-input-inline input-inline">
                                <input id="prinAmt" name="prinAmt" class="layui-input form-input " 
                                    allowClear="true" data-th-value="${entity?.prinAmt}">
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md6">
                            <label class="layui-form-label form-lable">证券管理户</label>
                            <div class="layui-input-inline input-inline">
                                <input id="secManageAcctId" name="secManageAcctId" class="layui-input form-input "
                                    allowClear="true" data-th-value="${entity?.secManageAcctId}">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md6">
                            <label class="layui-form-label form-lable">通道</label>
                            <div class="layui-input-inline input-inline">
                                <input id="chlId" name="chlId" class="layui-input form-input "
                                    allowClear="true" data-th-value="${entity?.chlId}">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>

        <input type="text" id="workflowId" name="workflowId" class="layui-input form-input" data-th-value="${workflowId}" disabled="disabled" style = "display:none;">

    </div>
</body>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/trademanage/investtradequery/bandtrade/BondTradeQuery001.js}"
        type="text/javascript"></script>
    <script type="text/javascript">
	$(function () {
	    $(".feeList").hide(); // 默认隐藏费用列表
	    layui.form.on("switch(isShowFeeList)", function(data){
	    	$(".feeList").toggle();
	    	if( data.elem.checked && $(".feeList").find("div").length == 0){
	    		layer.msg("没有相关费用信息！");
	    	}
	    });
	});
 </script>
</div>
</html>
