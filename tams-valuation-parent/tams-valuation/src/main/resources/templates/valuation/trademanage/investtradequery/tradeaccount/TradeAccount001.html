<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title>双击查看交易账户收划款</title>
<link rel="stylesheet" type="text/css" data-th-href="@{/css/font/iconfont.css}">
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm" style="background: #ffffff; padding: 10px 0;">
            <!--  style="display:none" -->
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">交易编号</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="tradeId" name="tradeId" class="layui-input form-input"
                            data-th-value="${entity?.tradeId}">
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">投资主体代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="prodId" name="prodId" class="layui-input form-input"
                            data-th-value="${entity?.prodId}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">投资主体名称</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="prodAbbr" name="prodAbbr" class="layui-input form-input"
                            data-th-value="${entity?.prodAbbr}">
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">收划款类型</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="type" name="type" class="layui-input form-input"
                            data-th-value="${entity?.type}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">收划款日期 </label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="settleDat" name="settleDat"
                            class="layui-input form-input input-dateSelect" allowClear="true"
                            data-th-value="${entity?.settleDat}">
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">收划款金额</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="settleAmt" name="settleAmt" class="layui-input form-input text-money"
                            data-th-value="${entity?.settleAmt}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable"> 币种 </label>
                    <div class="layui-input-inline input-inline">
                        <select id="ccy" name="ccy" class="layui-input form-input input-select"
                            data-th-data-result="${CCY}" allowClear="true" data-th-initValue="${entity?.ccyCode}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">收款账户户名</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="myAcctName" name="myAcctName" class="layui-input form-input"
                            data-th-value="${entity?.myAcctName}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">收款账户账号</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="myAcctNo" name="myAcctNo" class="layui-input form-input"
                            data-th-value="${entity?.myAcctNo}">
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">付款账户户名</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="counterAcctName" name="counterAcctName" class="layui-input form-input"
                            data-th-value="${entity?.counterAcctName}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">付款账户账号</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="counterAcctNo" name="counterAcctNo" class="layui-input form-input"
                            data-th-value="${entity?.counterAcctNo}">
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">收划款状态</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="status" name="status" class="layui-input form-input"
                            data-th-value="${entity?.status}">
                    </div>
                </div>
            </div>
        </form>
        <div class="layui-col-md11" style="margin: 50px;">
            <div class="text-center">
                <!--                 <a id="ValManualVoucher003_btn_save" class="layui-btn layui-btn-sm btn-save" 
                       data-th-text="#{SysCommon.save}">保存</a> 
                  <a id="ValManualVoucher003_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                      data-th-text="#{SysCommon.submit}">提交</a>-->
                <a id="ValManualVoucher003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                    data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
</body>
</html>
