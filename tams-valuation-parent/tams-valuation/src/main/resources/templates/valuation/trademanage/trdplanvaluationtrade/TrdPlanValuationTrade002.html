<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<title data-th-text="#{TrdPlanValuationTrade002}">计划类投资交易新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
				<form id="basicInfoForm" class="layui-form joyin-form-wrap pro-module-form">
					<div style="display: none">
						<input id="finprodType" name="finprodType" type="hidden" th:value="${entity?.finprodType}">
						<input id="profitType" name="profitType" type="hidden" th:value="${entity?.profitType}">
					</div>
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdPlanValuationTrade001.tradeId}">交易编号</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="tradeId"
												   data-th-value="${entity?.tradeId}"
												   class="layui-input form-input" placeholder="请输入内容" disabled
												   data-th-placeholder="#{SysCommon.placeholder}" >
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdPlanValuationTrade001.outTradeId}">外部交易编号</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="outTradeId"
												   data-th-value="${entity?.outTradeId}"
												   class="layui-input form-input" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}" >
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanValuationTrade001.portfolioName}">产品名称</label>
										<div class="layui-input-inline input-inline">
											<select id="portfolioId" name="portfolioId" th:initValue="${entity?.portfolioId}"
													class="layui-input form-input input-select available" required
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-data-url="@{/valuation/trademanage/trdplanvaluationtrade/TrdPlanValuationTrade002/findPortfolioId}">
											</select>
										</div>
									</div>
								</div>

								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdPlanValuationTrade001.portfolioId}">产品代码</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="portfolioName" name="portfolioName"
												   data-th-value="${entity?.portfolioName}" required
												   class="layui-input form-input" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}" disabled>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanValuationTrade002.tradeDate}">交易日期</label>
										<div class="layui-input-inline input-inline">
											<input id="tradeDate" name="tradeDate" required
												   class="layui-input form-input input-dateSelect hidden"
												   data-th-value='${#dates.format(entity?.tradeDate,"yyyy-MM-dd")}'>
										</div>
									</div>
								</div>

								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdPlanValuationTrade001.finprodName}">资产名称</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="finprodId" name="finprodId" class="layui-input form-input input-select" required
													placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" th:initValue="${entity?.finprodId}"
													data-th-data-url="@{/valuation/trademanage/trdplanvaluationtrade/TrdPlanValuationTrade002/findFinprodId}" allowClear="true" showField="id" formatoption="true"></select>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdPlanValuationTrade001.finprodId}">资产代码</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="finprodName"  id="finprodName"
												   data-th-value="${entity?.finprodName}" required
												   class="layui-input form-input" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}" disabled>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanValuationTrade001.ps}">交易类型</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="ps" name="ps"
													class="layui-input form-input input-select"
													data-th-data-result='${PS}' allowClear="true"
													placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
													required="required" formatoption="true"
													data-th-initValue="${entity?.ps}">
											</select>
										</div>
									</div>
								</div>
									
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdPlanValuationTrade002.todayArriveFlag}">是否当日到账</label>
										<div class="layui-input-inline input-inline">
											<select id="todayArriveFlag" name="todayArriveFlag" data-th-initValue="${entity?.ps}"
													class="layui-input form-input input-select" placeholder="请输入内容" required
													data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${YES_OR_NO}">
											</select>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="pro-module-wrap" id="value_div_sq">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">申请信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanValuationTrade002.tradeAmt}">交易金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="tradeAmt" name="tradeAmt" maxLength="16" required
												    th:value="${entity?.tradeAmt}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanValuationTrade002.nums}">交易份额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="nums" name="nums" maxLength="16" required
												    th:value="${entity?.nums}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>

								</div>
							</div>
						</div>
					</div>

					<div class="pro-module-wrap" th:id="value_div_qr">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">确认信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanValuationTrade002.confirmTradeAmt}">确认金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="confirmTradeAmt" name="confirmTradeAmt" maxLength="16"
												   required th:value="${entity?.confirmTradeAmt}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanValuationTrade002.confirmNums}">交易份额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="confirmNums" name="confirmNums" maxLength="16"
												   required th:value="${entity?.confirmNums}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanValuationTrade002.confirmIntAmt}">利息确认金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="confirmIntAmt" name="confirmIntAmt" maxLength="16"
												   required th:value="${entity?.confirmIntAmt}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanValuationTrade002.refundAmount}">返款金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="refundAmount" name="refundAmount" maxLength="16"
												   required th:value="${entity?.refundAmount}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanValuationTrade002.rateRefundAmount}">利息返还金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="rateRefundAmount" name="rateRefundAmount" maxLength="16"
												   required th:value="${entity?.rateRefundAmount}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanValuationTrade002.unitValue}">单位净值</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="unitValue" name="unitValue" maxLength="16"
												   required th:value="${entity?.unitValue}" class="layui-input form-input text-number rateCal" disabled
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="pro-module-wrap" th:id="value_div_dz">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">到账信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanValuationTrade002.settleAmt}">到账金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="settleAmt" name="settleAmt" maxLength="16"
												   required th:value="${entity?.settleAmt}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="pro-module-wrap" th:id="value_div">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">费用信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanValuationTrade002.feeAmt}">交易费用</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="feeAmt" name="feeAmt" maxLength="16"
												   required th:value="${entity?.feeAmt}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanValuationTrade002.advFeeOut}">投资顾问费</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="advFeeOut" name="advFeeOut" maxLength="16"
												   required th:value="${entity?.advFeeOut}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanValuationTrade002.feeAmtQT}">其他费用</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="feeAmtQT" name="feeAmtQT" maxLength="16"
												   required th:value="${entity?.feeAmtQT}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="pro-module-wrap" th:id="value_div">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">汇总信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanValuationTrade002.ccy}">币种</label>
										<div class="layui-input-inline input-inline">
											<select id="ccy" name="ccy"
													data-th-data-result="${CCY}"
													th:initvalue="*{entity?.ccy?:CCY_default}" class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}" required>
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanValuationTrade002.mdateSettleAmt}">结算金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="mdateSettleAmt" name="mdateSettleAmt" maxLength="16"
												   required th:value="${entity?.mdateSettleAmt}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
									<div class="form-inline-wrap" >
										<label class="layui-form-label form-lable" >资金账户</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="trdAcctId" name="trdAcctId" class="layui-input form-input input-select" parentIds="portfolioId"
													th:data-url="@{/valuation/trademanage/trdplanvaluationtrade/TrdPlanValuationTrade002/getTrdAcctId}"
													allowClear="true" placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}">
											</select>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
					<!-- 人员信息 -->
					<!--<div class="page-component" th:data-path="@{/component/trade/TrdInvestPersonInfo002/init}" th:data-params="|{entity: '${trdInvestPersonInfo002Dto}',entityName:'trdInvestPersonInfo002Dto', psId : 'ps'}|"></div>-->

				</form>
                <div class="layui-form-item">
                    <div align="center" style="height:50px;padding-top: 10px;">

                        <a id="TrdPlanValuationTrade002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                        <a id="TrdPlanValuationTrade002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="TrdPlanValuationTrade002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
         </div>
    </div>
    </div>
    <div layout:fragment="script">
    	<script data-th-inline="javascript" type="text/javascript">
    			var PS_T01 = /*[[${PS_T01}]]*/'';
    			var YES = /*[[${YES}]]*/'';
    			var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
    			var finprodId = /*[[${finprodId}]]*/'';
    			var CCY = /*[[${CCY}]]*/'';
    			var FINPROD_TYPE_F17 = /*[[${FINPROD_TYPE_F17}]]*/'';
                var tradeId = /*[[${tradeId}]]*/'';
                var PS_T02 = /*[[${PS_T02}]]*/'';
		</script>
    	<script data-th-src="@{/js/valuation/trademanage/trdplanvaluationtrade/TrdPlanValuationTrade002.js}">
    	</script>
    </div>
</body>
</html>
