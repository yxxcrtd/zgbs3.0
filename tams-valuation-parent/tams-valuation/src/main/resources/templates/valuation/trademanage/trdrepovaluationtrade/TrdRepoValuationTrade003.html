<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title th:text="#{TrdRepoValuationTrade003}">质押式回购交易新建</title>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
            <form id="submitForm" class="layui-form joyin-form-wrap pro-module-form">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdRepoValuationTrade002.tradeId}">交易编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" class="layui-input form-input" id="tradeId"
                                               name="tradeId" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" required="required" disabled="disabled"
                                               data-th-value="${entity?.tradeId?:12345}" maxlength="60">
                                    </div>
                                </div>
<!--                                <div class="form-inline-wrap">-->
<!--                                    <label class="layui-form-label form-lable"-->
<!--                                           data-th-text="#{TrdRepoValuationTrade002.outTradeId}">外部成交编号</label>-->
<!--                                    <div class="layui-input-inline input-inline">-->
<!--                                        <input type="text" class="layui-input form-input" id="outTradeId"-->
<!--                                               name="outTradeId" placeholder="请输入内容"-->
<!--                                               data-th-placeholder="#{SysCommon.placeholder}"-->
<!--                                               data-th-value="${entity?.outTradeId}" maxlength="60">-->
<!--                                    </div>-->
<!--                                </div>-->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">产品名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="portfolioId" name="portfolioId" th:initValue="${entity?.portfolioId}"
                                                class="layui-input form-input input-select available"
                                                data-th-placeholder="#{SysCommon.placeholder}" required disabled
                                                data-th-data-url="@{/valuation/trademanage/trdrepovaluationtrade/TrdRepoValuationTrade001/findPortfolioId}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">产品代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" class="layui-input form-input" id="portfolioName"
                                               name="portfolioName" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}" required="required" disabled="disabled"
                                               data-th-value="${entity?.portfolioName}" maxlength="60">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">交易场所</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="tradeMarket" name="tradeMarket" class="layui-input form-input input-select"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required="required"
                                                data-th-data-result='${TRADE_PLACE}' allowClear="true" formatoption="true" disabled
                                                data-th-initValue="${entity?.tradeMarket}"></select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable">交易对手</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="counterId" name="counterId"
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" required="required"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-url="@{/valuation/trademanage/trddepositvaluationtrade/TrdDepositValuationTrade002/getCounterId}"
                                                data-th-initvalue="${entity?.counterId}">
                                        </select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                                    <label class="layui-form-label form-lable">交易类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="ps" name="ps" class="layui-input form-input input-select"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" required="required"
                                                data-th-data-result='${PS}' allowClear="true" formatoption="true"
                                                data-th-initValue="${entity?.ps}"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">



                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdRepoValuationTrade002.tradeDate}">交易日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="tradeDate" name="tradeDate"
                                               class="layui-input form-input input-dateSelect hidden" required="required"
                                               data-th-value='${#dates.format(entity?.tradeDate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">资金到账日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="settleDate" name="settleDate"
                                               class="layui-input form-input input-dateSelect hidden" required="required"
                                               data-th-value='${#dates.format(entity?.settleDate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" id="endate">
                                    <label class="layui-form-label form-label-wrap">到期日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="mdate" name="mdate"
                                               class="layui-input form-input input-dateSelect hidden" required="required"
                                               data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
                <div class="pro-module-wrap" th:id="value_div">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">金额信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wra">本金金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" th:id="prinAmt" name="prinAmt" maxLength="28"
                                               required th:value="${entity?.prinAmt}" class="layui-input form-input text-number rateCal"
                                               data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wra">回购利率%</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" th:id="rebackPrice" name="rebackPrice" maxLength="30"
                                               required th:value="${entity?.rebackPrice}" class="layui-input form-input text-number rateCal"
                                               data-textrange="4" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">应计利息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" th:id="intAmt" th:name="intAmt" required th:value="${entity?.intAmt}" maxlength="28"
                                               data-textrange="2" data-fixtype="2" class="layui-input form-input text-number"
                                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">


                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wra">提前终止利率%</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" th:id="terminateRate" name="terminateRate" maxLength="30"
                                                th:value="${entity?.terminateRate}" class="layui-input form-input text-number rateCal"
                                               data-textrange="4" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
                                    </div>
                                </div>

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wra">逾期利息金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" th:id="overdueAmt" name="overdueAmt" maxLength="30"
                                                th:value="${entity?.overdueAmt}" class="layui-input form-input text-number rateCal"
                                               data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
                                    </div>
                                </div>

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap" data-th-text="#{TrdDepositValuationTrade002.ccy}">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="ccy" name="ccy"
                                                data-th-data-result="${CCY}"
                                                th:initvalue="*{entity?.ccy?:CCY_default}" class="layui-input form-input input-select hidden"
                                                data-th-placeholder="#{SysCommon.placeholder}" required="required">
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pro-module-wrap" th:id="value_div">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">费用信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">




                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">其他费用</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" th:id="otherAmt" th:name="otherAmt" required th:value="${entity?.otherAmt?:0}" maxlength="28"
                                               data-textrange="2" data-fixtype="2" class="layui-input form-input text-number"
                                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pro-module-wrap" th:id="value_div">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">汇总信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">结算金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" th:id="settleAmt" th:name="settleAmt" required th:value="${entity?.settleAmt}" maxlength="28"
                                               data-textrange="2" data-fixtype="2" class="layui-input form-input text-number"
                                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-lable" >资金账户</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="trdAcctId" name="trdAcctId" class="layui-input form-input input-select" parentIds="portfolioId"
                                                th:data-url="@{/valuation/trademanage/bondlend/TrdBondLendTrade002/getTrdAcctId}"
                                                allowClear="true" placeholder="请输入内容" required="required"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </form>
        <div class="layui-form-item">
            <div align="center" style="height:50px;padding-top: 10px;">

                <a id="TrdRepoValuationTrade003_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                <a id="TrdRepoValuationTrade003_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="TrdRepoValuationTrade003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>

    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var entrustId = /*[[${entrustId}]]*/'';
        var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'';
        var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
        var PS_T01 = /*[[${PS_T01}]]*/'';
        var BANK_LENDING_TYPE_01 = /*[[${BANK_LENDING_TYPE_01}]]*/'';
        var BANK_LENDING_TYPE_02 = /*[[${BANK_LENDING_TYPE_02}]]*/'';
        var BACK_LEND_DIRECTION_01 = /*[[${BACK_LEND_DIRECTION_01}]]*/'';
        var BACK_LEND_DIRECTION_02 = /*[[${BACK_LEND_DIRECTION_02}]]*/'';
        var FINPROD_TYPE_TG_F08 = /*[[${FINPROD_TYPE_TG_F08}]]*/'';
        var FINPROD_TYPE_TG_F09 = /*[[${FINPROD_TYPE_TG_F09}]]*/'';
        var FINPROD_TYPE_TG_F09 = /*[[${FINPROD_TYPE_TG_F09}]]*/'';
        var FINPROD_TYPE_TG_F25 = /*[[${FINPROD_TYPE_TG_F25}]]*/'';
        var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
        var FINPROD_TYPE_F08 = /*[[${FINPROD_TYPE_F08}]]*/'';
        var FINPROD_TYPE_F09 = /*[[${FINPROD_TYPE_F09}]]*/'';
        var pp = /*[[${pp}]]*/'';
    </script>
    <script th:src="@{/js/valuation/trademanage/trdrepovaluationtrade/TrdRepoValuationTrade003.js}" type="text/javascript"></script>
</div>
</body>
</html>
