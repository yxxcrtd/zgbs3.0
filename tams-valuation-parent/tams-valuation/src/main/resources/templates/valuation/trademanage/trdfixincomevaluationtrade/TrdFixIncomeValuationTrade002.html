<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<title data-th-text="#{TrdFixIncomeValuationTrade002}">固收类交易新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
				<form id="basicInfoForm" class="layui-form joyin-form-wrap pro-module-form">
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{TrdFixIncomeValuationTrade.tradeId}">交易编号</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="tradeId" name="tradeId"
												   required disabled
												   placeholder="提交后自动生成，无需填写"
												   class="layui-input form-input"
												   data-th-value="${entity?.tradeId}">
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdFixIncomeValuationTrade.outTradeId}">外部交易编号</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="outTradeId"
												   data-th-value="${entity?.outTradeId}"
												   class="layui-input form-input" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}" >
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{TrdFixIncomeValuationTrade.prodName}">产品名称</label>
										<div class="layui-input-inline input-inline" >
											<select id="prodId" name="prodId" required
													class="layui-input form-input input-select"
													data-th-data-url="@{/valuation/trademanage/trdfixincomevaluationtrade/TrdFixIncomeValuationTrade001/getFinprodId}"
													allowClear="true" placeholder="请输入内容"
													data-th-initValue="${entity?.prodId}" >
											</select>
										</div>
									</div>
								</div>

								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdFixIncomeValuationTrade.prodId}">产品代码</label>
										<div class="layui-input-inline input-inline">
											<input  type="text" id="prodName" name="prodName" required disabled
													class="layui-input form-input" placeholder="请输入内容"
													th:placeholder="#{SysCommon.placeholder}"
													th:value="${entity?.prodName}">
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{TrdFixIncomeValuationTrade.assetName}">资产名称</label>
										<div class="layui-input-inline input-inline">
											<select id="assetId" name="assetId" required
													class="layui-input form-input input-select"
													data-th-data-url="@{/valuation/trademanage/trdfixincomevaluationtrade/TrdFixIncomeValuationTrade002/getAssetId}"
													allowClear="true"
													data-th-initValue="${entity?.assetId}"
													placeholder="请输入内容">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{TrdFixIncomeValuationTrade.assetId}">资产代码</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="assetName" name="assetName"
												   class="layui-input form-input"
												   required disabled
												   data-th-value="${entity?.assetName}"
												   placeholder="请输入内容">
										</div>
									</div>
								</div>

								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{TrdFixIncomeValuationTrade.ps}">交易类型</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="ps" name="ps" required
													class="layui-input form-input input-select"
													placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
													data-th-data-result='${PS}'
													allowClear="true"
													formatoption="true"
													data-th-initValue="${entity?.ps}">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdFixIncomeValuationTrade.ccy}">币种</label>
										<div class="layui-input-inline input-inline">
											<select  type="text" id="ccy" name="ccy" required
													 class="layui-input form-input input-select"
													 placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
													 th:data-result='${CCY}'
													 allowClear="true"
													 formatoption="true"
													 th:initValue="*{entity?.ccy?:CCY_default}"></select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{TrdFixIncomeValuationTrade.invAim}">会计分类</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="invAim" name="invAim" required
													class="layui-input form-input input-select"
													data-th-data-result='${INV_AIM}' allowClear="true"
													placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
													formatoption="true"
													data-th-initValue="${entity?.invAim}">
											</select>
										</div>
									</div>
								</div>

							</div>
						</div>
					</div>

					<div class="pro-module-wrap" id="value_div_sq">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">清算信息</span>
								<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{TrdFixIncomeValuationTrade.tradeDate}">交易日期</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="tradeDate" name="tradeDate" required
												   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}"
												   data-th-value='${#dates.format(entity?.tradeDate,"yyyy-MM-dd")}'>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{TrdFixIncomeValuationTrade.effDate}">交割日期</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="effDate" name="effDate" required
												   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}"
												   data-th-value='${#dates.format(entity?.effDate,"yyyy-MM-dd")}'>
										</div>
									</div>
<!--									<div class="form-inline-wrap">-->
<!--										<label class="layui-form-label form-lable"-->
<!--											   data-th-text="#{TrdFixIncomeValuationTrade.fundSettleDate}">资金交收日期</label>-->
<!--										<div class="layui-input-inline input-inline">-->
<!--											<input type="text" id="fundSettleDate" name="fundSettleDate" required-->
<!--												   class="layui-input form-input input-dateSelect" placeholder="请输入内容"-->
<!--												   data-th-placeholder="#{SysCommon.placeholder}"-->
<!--												   data-th-value='${#dates.format(entity?.fundSettleDate,"yyyy-MM-dd")}'>-->
<!--										</div>-->
<!--									</div>-->
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{TrdFixIncomeValuationTrade.capital}">本金金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="capital" name="capital" required
												   class="layui-input form-input text-number"
												   maxLength="28" data-textrange="2" data-fixtype="2"
												   th:value="${entity?.capital}"
												   placeholder="请输入内容">
										</div>
									</div>
								</div>

								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{TrdFixIncomeValuationTrade.cpriceAmt}">净价总额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="cpriceAmt" name="cpriceAmt" required
												   class="layui-input form-input text-number"
												   maxLength="28" data-textrange="2" data-fixtype="2"
												   th:value="${entity?.cpriceAmt}"
												   placeholder="请输入内容">
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdFixIncomeValuationTrade.intAmt}">应收利息总额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="intAmt" name="intAmt" required
												   class="layui-input form-input text-number"
												   maxLength="28" data-textrange="2" data-fixtype="2"
												   placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
												   th:value="${entity?.intAmt}" />
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdFixIncomeValuationTrade.cprice}">净价</label>
										<div class="layui-input-inline input-inline">
											<input  type="text"  id="cprice" name="cprice" required disabled
													class="layui-input form-input text-number" placeholder="请输入内容"
													maxLength="28" data-textrange="2" data-fixtype="2"
													th:placeholder="#{SysCommon.placeholder}"
													data-th-value="${entity?.cprice}">
										</div>
									</div>
								</div>

								<div class="layui-form-item">
<!--									<div class="form-inline-wrap" >-->
<!--										<label class="layui-form-label form-label-wrap"-->
<!--											   data-th-text="#{TrdFixIncomeValuationTrade.otherAmt}">其他费用</label>-->
<!--										<div class="layui-input-inline input-inline">-->
<!--											<input  type="text" id="otherAmt" name="otherAmt" required-->
<!--													class="layui-input form-input text-number" placeholder="请输入内容"-->
<!--													maxLength="28" data-textrange="2" data-fixtype="2"-->
<!--													th:placeholder="#{SysCommon.placeholder}"-->
<!--													th:value="${entity?.otherAmt?:0}" />-->
<!--										</div>-->
<!--									</div>-->
									<div class="form-inline-wrap" >
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdFixIncomeValuationTrade.settleAmt}">结算金额</label>
										<div class="layui-input-inline input-inline">
											<input  type="text" id="settleAmt" name="settleAmt" required
													class="layui-input form-input text-number" placeholder="请输入内容"
													maxLength="28" data-textrange="2" data-fixtype="2"
													th:placeholder="#{SysCommon.placeholder}"
													th:value="${entity?.settleAmt}" />
										</div>
									</div>
									<div class="form-inline-wrap" >
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdFixIncomeValuationTrade.myAcctNo}">资金账户</label>
										<div class="layui-input-inline input-inline" >
											<select id="myAcctNo" name="myAcctNo" required
													class="layui-input form-input input-select"
													data-th-data-url="@{/valuation/trademanage/bondlend/TrdBondLendTrade002/getTrdAcctId}"
													allowClear="true" placeholder="请输入内容"
													data-th-initValue="${entity?.myAcctNo}">
											</select>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>


				</form>
                <div class="layui-form-item">
                    <div align="center" style="height:50px;padding-top: 10px;">

                        <a id="TrdFixIncomeValuationTrade002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                        <a id="TrdFixIncomeValuationTrade002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="TrdFixIncomeValuationTrade002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
         </div>
    </div>
    </div>
    <div layout:fragment="script">
    	<script data-th-inline="javascript" type="text/javascript">
    			var PS_T01 = /*[[${PS_T01}]]*/'';
    			var YES = /*[[${YES}]]*/'';
    			var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
    			var finprodId = /*[[${finprodId}]]*/'';
    			var CCY = /*[[${CCY}]]*/'';
    			var FINPROD_TYPE_F17 = /*[[${FINPROD_TYPE_F17}]]*/'';
                var tradeId = /*[[${tradeId}]]*/'';
                var PS_T02 = /*[[${PS_T02}]]*/'';
		</script>
    	<script data-th-src="@{/js/valuation/trademanage/trdfixincomevaluationtrade/TrdFixIncomeValuationTrade002.js}">
    	</script>
    </div>
</body>
</html>
