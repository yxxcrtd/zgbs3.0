<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>应收款项信息查询</title>
<script th:inline="javascript">
    var sysDate = [[${sysDate}]];
</script>
</head>
<body>
</body>
<div layout:fragment="content">
	<div class="form-button-area"></div>
	<div class="joyin-form-wrap joyin-filter-form condition-area">
		<form class="layui-form" id="searchForm">
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">账套代码</label>
					<div class="layui-input-inline input-inline">
						<select id="bookSetId" name="bookSetId"
							class="layui-input form-input input-select" allowClear="true"
							data-th-placeholder="#{SysCommon.placeholder}" childrenIds="bdFinprodId"
							data-th-data-url="@{/valuation/trademanage/accountsreceivableinfoquery/AccountsReceivableInfoQuery001/getBookSetId}">
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">账务日</label>
					<div class="layui-input-inline input-inline">
						<input id="bookDate" name="bookDate" placeholder="请选择、支持区间" required
							class="layui-input form-input input-dateSelect">
					</div>
					
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">日期</label>
					<div class="layui-input-inline input-inline">
						<input id="Date" name="Date" placeholder="请选择、支持区间"
							class="layui-input form-input input-dateRangeSelect">
					</div>
					
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">应收款项类别</label>
					<div class="layui-input-inline input-inline">
						<select id="receivablesType" name="receivablesType"
							class="layui-input form-input input-select"
							data-th-data-result="${RECEIVABLES_TYPE}" allowClear="true" 
							data-th-placeholder="#{SysCommon.placeholder}">
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">标的资产</label>
					<div class="layui-input-inline input-inline">
						<select id="bdFinprodId" name="bdFinprodId"
							class="layui-input form-input input-select" 
							allowClear="true" multiple="multiple"
							data-th-placeholder="#{SysCommon.placeholder}"
							parentIds="bookSetId"
							data-th-data-url="@{/valuation/trademanage/accountsreceivableinfoquery/AccountsReceivableInfoQuery001/getBdFinprodId}">
						</select>
					</div>
				</div>
			</div>
		</form>
	</div>
	<div id="dataTable"></div>
</div>
<div layout:fragment="script">
	<script
		data-th-src="@{/js/valuation/trademanage/accountsreceivableinfoquery/AccountsReceivableInfoQuery001.js}"
		type="text/javascript"></script>
</div>
</html>
