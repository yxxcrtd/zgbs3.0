<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>基金转换交易</title>
</head>
<body>

</body>
<div layout:fragment="content">
  <div class="layui-col-md12" style="margin:10px 0;">
    <a id="ValFundConversion001_btn_add" class="layui-btn layui-btn-sm"><i class="iconfont icon-found"></i><span>新建基金转入转出交易(货币型转出)</span></a>
    <a id="ValFundConversion001_btn_add1" class="layui-btn layui-btn-sm"><i class="iconfont icon-found"></i><span>新建基金转入转出交易(净值型转出）</span></a>
    <a id="ValFundConversion001_btn_delete" class="layui-btn layui-btn-sm"><i class="iconfont icon-delete"></i><span>删除</span></a>
    <a id="ValFundConversion001_btn_export" class="layui-btn layui-btn-sm"><i class="iconfont icon-export"></i><span>导出</span></a>
    <a id="ValFundConversion001_btn_filter" class="layui-btn layui-btn-sm btn-filter"><i class="iconfont icon-btn-filter"></i><span>筛选</span></a>
  </div>
  <form class="layui-form joyin-form-wrap joyin-filter-form" id="searchForm" style="display: none;">
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">交易方向</label>
        <div class="layui-input-inline input-inline">
        <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;首期&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;10&quot;,&quot;text&quot;:&quot;到期&quot;,&quot;col&quot;:&quot;&quot;}]'>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">交易日</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-dateRangeSelect" placeholder="请选择日期">
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">投资账户</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input" value="">
        </div>
      </div>
    </div>
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">通道</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-lenovoselect" placeholder="请选择通道或输入关键词" value="" data-url="/system/institution/SysInstitution001/getInstitutionCode" data-idfield="code" data-keyfield="code" data-effectivefieldsalias='{&quot;code&quot;:&quot;资产代码&quot;,&quot;shortName&quot;:&quot;资产名称&quot;}'>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">交易编号</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input" value="">
        </div>
      </div>
    </div>
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">记账日</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-dateRangeSelect" placeholder="请选择日期">
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <a class="layui-btn layui-btn-sm"><i class="iconfont icon-search"></i><span>&nbsp;&nbsp;查询</span></a>
        <a class="layui-btn layui-btn-sm"><i class="iconfont icon-reset"></i><span>&nbsp;&nbsp;重置</span></a>
      </div>
    </div>
  </form>
  <div id="dataTable"></div>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/trademanage/fundconversion/ValFundConversion001.js}" type="text/javascript"></script>
</div>
</html>
