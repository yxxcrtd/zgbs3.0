<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title>双击查看活期存款交易</title>
<link rel="stylesheet" type="text/css" data-th-href="@{/css/font/iconfont.css}">
<script type="text/javascript">
    
</script>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm" style="background: #ffffff; padding: 10px 0;">
            <fieldset class="layui-elem-field layui-field-title " style="margin-top: 1px;">
                <div class="layui-collapse" lay-filter="test">
                    <div class="layui-colla-item">
                        <h2 class="layui-colla-title">
                            <a href="javascript:;">基本信息</a>
                        </h2>
                        <div class="layui-colla-content layui-show">
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">交易编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeId" name="tradeId" class="layui-input form-input"
                                            data-th-value="${entity?.tradeId}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">投资主体代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="prodId" name="prodId" class="layui-input form-input"
                                            data-th-value="${entity?.prodId}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">投资主体名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="prodAbbr" name="prodAbbr" class="layui-input form-input"
                                            data-th-value="${entity?.prodAbbr}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">资金账户户名</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="id1" name="name1" class="layui-input form-input"
                                        	data-th-value="${entity?.acctName}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">资金账户账号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="id2" name="name2" class="layui-input form-input"
                                        	data-th-value="${entity?.acctNo}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">上次收息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="vDate" name="vDate"
                                            class="layui-input form-input input-dateSelect" allowClear="true"
                                            data-th-value="${entity?.vDate}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">本次收息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="mDate" name="mDate"
                                            class="layui-input form-input input-dateSelect" allowClear="true"
                                            data-th-value="${entity?.mDate}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">理论利息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="theoryIntAmt" name="theoryIntAmt" class="layui-input form-input text-money"
                                         data-th-value="${entity?.theoryIntAmt}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">实际利息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="realIntAmt" name="realIntAmt"
                                            class="layui-input form-input  text-money" data-th-value="${entity?.realIntAmt}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="ccy" name="ccy" class="layui-input form-input input-select"
                                            data-th-data-result="${CCY}" allowClear="true"
                                            data-th-initValue="${entity?.ccyCode}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </fieldset>
            <fieldset class="layui-elem-field layui-field-title" style="margin-top: 1px;">
                <div class="layui-collapse" lay-filter="test">
                    <div class="layui-colla-item">
                        <h2 class="layui-colla-title">
                            <a href="javascript:;">计提明细信息</a>
                        </h2>
                        <div class="layui-colla-content layui-show">
                            <table id="dataTable"></table>
                        </div>
                    </div>
                </div>
            </fieldset>
        </form>
        <div class="layui-col-md11" style="margin: 50px;">
            <div class="text-center">
                <!--                 <a id="ValManualVoucher003_btn_save" class="layui-btn layui-btn-sm btn-save" 
                       data-th-text="#{SysCommon.save}">保存</a> 
                  <a id="ValManualVoucher003_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                      data-th-text="#{SysCommon.submit}">提交</a>-->
                <a id="ValManualVoucher003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                    data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
</body>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/trademanage/investtradequery/currentdeposit/CurrentDeposit001.js}"
        type="text/javascript"></script>
</div>
</html>
