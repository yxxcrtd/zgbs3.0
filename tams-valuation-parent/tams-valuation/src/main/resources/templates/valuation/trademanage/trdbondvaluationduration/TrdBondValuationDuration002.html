<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title th:text="#{TrdBondValuationDuration002}">债券存续期管理新建</title>
</head>
<body>
<div layout:fragment="content">
    <style type="text/css">
        .layui-form-radio {
            line-height: 24px;
            padding-right: 0px;
            margin: 0px;
        }
        .layui-form-radio div {
            font-size: 12px;
        }
        .layui-form-radio i{
            font-size: 14px;
        }
    </style>
    <div class="pro-module-container" style="margin-bottom: 20px;">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base" >
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" >基础信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondValuationDuration.tradeId}">交易编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeId" name="tradeId"
                                               required disabled
                                               placeholder="提交后自动生成，无需填写"
                                               class="layui-input form-input"
                                               data-th-value="${entity?.tradeId}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondValuationDuration.prodId}">产品代码</label>
                                        <div class="layui-input-inline input-inline" >
                                            <select id="prodId" name="prodId" required
                                                    class="layui-input form-input input-select"
                                                    data-th-data-url="@{/valuation/trademanage/trdbondvaluationduration/TrdBondValuationDuration002/getFinprodId}"
                                                     allowClear="true" placeholder="请输入内容"
                                                    th:formatoption="false"
                                                    data-th-initValue="${entity?.prodId}" >
                                            </select>
                                        </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdBondValuationDuration.prodName}">产品名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="prodName" name="prodName" required disabled
                                                class="layui-input form-input" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${entity?.prodName}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondValuationDuration.assetId}">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="assetId" name="assetId" required
                                                class="layui-input form-input input-select"
                                                data-th-data-url="@{/valuation/trademanage/trdbondvaluationduration/TrdBondValuationDuration002/getAssetId}"
                                                allowClear="true"
                                                th:formatoption="false"
                                                data-th-initValue="${entity?.assetId}"
                                                placeholder="请输入内容">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondValuationDuration.assetAbbr}">资产简称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="assetAbbr" name="assetAbbr"
                                               class="layui-input form-input"
                                               required disabled
                                               data-th-value="${entity?.assetAbbr}"
                                               placeholder="请输入内容">
                                    </div>
                                </div>
<!--                                <div class="form-inline-wrap">-->
<!--                                    <label class="layui-form-label form-label-wrap"-->
<!--                                           data-th-text="#{TrdBondValuationDuration.secManageAcctId}">证券账户</label>-->
<!--                                    <div class="layui-input-inline input-inline">-->
<!--                                        <select  type="text" id="secManageAcctId" name="secManageAcctId"-->
<!--                                                 class="layui-input form-input input-select" placeholder="请输入内容"-->
<!--                                                 data-th-placeholder="#{SysCommon.placeholder}"-->
<!--                                                 data-th-data-url="@{/valuation/trademanage/bond/TrdBondTrade002/getSecManageAcctId}"-->
<!--                                                 allowClear="true" data-th-initvalue="${entity?.secManageAcctId}"></select>-->
<!--                                    </div>-->
<!--                                </div>-->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdBondValuationDuration.secManageAcctId}">证券账户</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="secManageAcctId" name="secManageAcctId" required
                                                class="layui-input form-input " placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.secManageAcctId}" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondValuationDuration.ps}">交易类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="ps" name="ps" required
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-result='${PS}'
                                                allowClear="true"
                                                formatoption="true"
                                                data-th-initValue="${entity?.ps}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondValuationDuration.invAim}">会计分类</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="invAim" name="invAim" required
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${INV_AIM}' allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption="true"
                                                data-th-initValue="${entity?.invAim}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdBondValuationDuration.ccy}">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select  type="text" id="ccy" name="ccy" required
                                                 class="layui-input form-input input-select"
                                                 placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                 th:data-result='${CCY}'
                                                 allowClear="true"
                                                 formatoption="true"
                                                 th:initValue="*{entity?.ccy?:CCY_default}"></select>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">清算信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdBondValuationDuration.mdate}">计划支付日</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="mdate" name="mdate" required
                                           class="layui-input form-input input-dateSelect"
                                           placeholder="请输入内容"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdBondValuationDuration.fundSettleDate}">资金交收日</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="fundSettleDate" name="fundSettleDate"
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value='${#dates.format(entity?.fundSettleDate,"yyyy-MM-dd")}'>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdBondValuationDuration.actInt}">实收利息</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="actInt" name="actInt" required maxLength="28"
                                           class="layui-input form-input text-number"
                                           data-textrange="2" data-fixtype="2"
                                           th:value="${entity?.actInt?:0}"
                                           placeholder="请输入内容">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdBondValuationDuration.actCapi}">实收本金</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="actCapi" name="actCapi" required maxLength="28"
                                           class="layui-input form-input text-number"
                                           data-textrange="2" data-fixtype="2"
                                           th:value="${entity?.actCapi?:0}"
                                           placeholder="请输入内容">
                                </div>
                            </div>
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdBondValuationDuration.otherAmt}">其他费用</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text" id="otherAmt" name="otherAmt" required
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.otherAmt?:0}" />
                                </div>
                            </div>
                            <div  class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdBondValuationDuration.isClean2}">是否结清</label>
                                <div class="layui-input-inline input-inline" required>
                                    <select id="isClean2" name="isClean2"
                                            class="layui-input form-input input-select"
                                            data-th-data-result='${YES_OR_NO}' allowClear="true"
                                            th:initValue="${entity?.isClean2?:YES_OR_NO_N}"
                                            data-th-placeholder="#{SysCommon.placeholder}" >
                                    </select>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdBondValuationDuration.settleAmt}">结算金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="settleAmt" name="settleAmt" required
                                                class="layui-input form-input text-number" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${entity?.settleAmt}" />
                                    </div>
                                </div>
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdBondValuationDuration.myAcctNo}">资金账户</label>
                                    <div class="layui-input-inline input-inline" >
                                        <select id="myAcctNo" name="myAcctNo" required
                                                class="layui-input form-input input-select"
                                                data-th-data-url="@{/valuation/trademanage/bondlend/TrdBondLendTrade002/getTrdAcctId}"
                                                allowClear="true" placeholder="请输入内容"
                                                data-th-initValue="${entity?.myAcctNo}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </form>

        <input type="text" id="workflowId" name="workflowId" class="layui-input form-input" data-th-value="${workflowId}" disabled="disabled" style = "display:none;">

        <div class="row text-center" style="margin: 20px 0;">
            <a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save"
               data-th-text="#{SysCommon.save}">保存</a>
            <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit"
               data-th-text="#{SysCommon.submit}">提交</a>
            <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">

    </script>
    <script th:src="@{/js/valuation/trademanage/trdbondvaluationduration/TrdBondValuationDuration002.js}" type="text/javascript"></script>
</div>
</body>
</html>
