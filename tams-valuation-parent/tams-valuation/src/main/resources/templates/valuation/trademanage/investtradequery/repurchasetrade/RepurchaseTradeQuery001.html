<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form " id="fundForm" style="display: none;">
        <div class="layui-collapse">
            <div class="layui-colla-item">
                <h2 class="layui-colla-title">基本信息</h2>
                <div class="layui-colla-content layui-show">
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">交易编号</label>
                            <div class="layui-input-inline input-inline">
                                <input id="tradeId" name="tradeId" class="layui-input form-input"
                                       data-th-value="${entity?.tradeId}">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">投资主体代码</label>
                            <div class="layui-input-inline input-inline">
                                <input id="prodId" name="prodId" class="layui-input form-input " placeholder=""
                                       allowClear="true" data-th-value="${entity?.prodId}">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">投资主体名称</label>
                            <div class="layui-input-inline input-inline">
                                <input id="prodAbbr" name="prodAbbr" class="layui-input form-input "
                                       placeholder="" allowClear="true" data-th-value="${entity?.prodAbbr}">
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">回购类型</label>
                            <div class="layui-input-inline input-inline">
                                <input id="busiType" name="busiType" class="layui-input form-input input-checkbox"
                                       placeholder=""
                                       data-result="[{&quot;id&quot;:&quot;04&quot;,&quot;text&quot;:&quot;质押式&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;05&quot;,&quot;text&quot;:&quot;买断式&quot;,&quot;col&quot;:&quot;&quot;}]"
                                       allowClear="true" data-th-initvalue="${entity?.busiTypeCode}"
                                       disabled="disabled">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">回购方向</label>
                            <div class="layui-input-inline input-inline">
                                <input id="finprodType" name="finprodType"
                                       class="layui-input form-input input-checkbox" placeholder=""
                                       data-result=" [{&quot;id&quot;:&quot;F02orF04&quot;,&quot;text&quot;:&quot;正回购&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;F03orF05&quot;,&quot;text&quot;:&quot;逆回购&quot;,&quot;col&quot;:&quot;&quot;}]"
                                       allowClear="true" data-th-initvalue="${entity?.finprodTypeCode}"
                                       disabled="disabled">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">交易方向</label>
                            <div class="layui-input-inline input-inline">
                                <input id="ps" name="ps" class="layui-input form-input input-select"
                                       placeholder="" data-th-data-result="${PS}" allowClear="true"
                                       data-th-value="${entity?.psCode}">
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">交易对手</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="counterId" name="counterId" placeholder=""
                                       class="layui-input form-input" data-th-value="${entity?.counterId}">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">交易日</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="tradeDate" name="tradeDate" placeholder=""
                                       class="layui-input form-input input-dateSelect"
                                       data-th-value="${entity?.tradeDate}">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">起息日</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="vDate" name="vDate" placeholder=""
                                       class="layui-input form-input input-dateSelect" data-th-value="${entity?.vDate}">
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">到期日</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="mDate" name="mDate" placeholder=""
                                       class="layui-input form-input input-dateSelect" data-th-value="${entity?.mDate}">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">期限品种</label>
                            <div class="layui-input-inline input-inline">
                                <input id="termType" name="termType" class="layui-input form-input"
                                       placeholder="" allowClear="true" data-th-value="${entity?.termType}">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">币种</label>
                            <div class="layui-input-inline input-inline">
                                <input id="ccy" name="ccy" class="layui-input form-input input-select"
                                       placeholder="" data-th-data-result="${CCY}" allowClear="true"
                                       data-th-value="${entity?.ccyCode}">
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">通道</label>
                            <div class="layui-input-inline input-inline">
                                <input id="chlId" name="chlId" class="layui-input form-input " placeholder=""
                                       allowClear="true" data-th-value="${entity?.chlId}">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="layui-colla-item">
                <h2 class="layui-colla-title">金额信息</h2>
                <div class="layui-colla-content layui-show">
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4" id="c_prinAmt">
                            <label class="layui-form-label form-lable">交易本金</label>
                            <div class="layui-input-inline input-inline">
                                <input id="prinAmt" name="prinAmt" class="layui-input form-input text-money" placeholder=""
                                       allowClear="true" data-th-value="${entity?.prinAmt}">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4" id=c_firSetAmt"">
                            <label class="layui-form-label form-lable">首次结算金额</label>
                            <div class="layui-input-inline input-inline">
                                <input id="firSetAmt" name="firSetAmt" class="layui-input form-input text-money" placeholder=""
                                       allowClear="true" data-th-value="${entity?.firSetAmt}">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">回购利率(%)</label>
                            <div class="layui-input-inline input-inline">
                                <input id="intRate" name="intRate" class="layui-input form-input " placeholder=""
                                       allowClear="true" data-th-value="${entity?.intRate}">
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4" id="c_expSetAmt">
                            <label class="layui-form-label form-lable">到期结算金额</label>
                            <div class="layui-input-inline input-inline">
                                <input id="expSetAmt" name="expSetAmt" class="layui-input form-input text-money"
                                       placeholder="" allowClear="true" data-th-value="${entity?.expSetAmt}">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4" id="c_intAmt">
                            <label class="layui-form-label form-lable">应计利息</label>
                            <div class="layui-input-inline input-inline">
                                <input id="intAmt" name="intAmt" class="layui-input form-input text-money" placeholder=""
                                       allowClear="true" data-th-value="${entity?.intAmt}">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4" id="c_divAmt">
                            <label class="layui-form-label form-lable">派息金额</label>
                            <div class="layui-input-inline input-inline">
                                <input id="divAmt" name="divAmt" class="layui-input form-input text-money" placeholder=""
                                       allowClear="true" data-th-value="${entity?.divAmt}">
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4" id="c_tranAmt">
                            <label class="layui-form-label form-lable">转入/转出利息金额</label>
                            <div class="layui-input-inline input-inline">
                                <input id="tranAmt" name="tranAmt" class="layui-input form-input text-money" placeholder=""
                                       allowClear="true" data-th-value="${entity?.tranAmt}">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">通道费用</label>
                            <div class="layui-input-inline input-inline">
                                <input id="tdFeeAmt" name="tdFeeAmt" class="layui-input form-input text-money"
                                       placeholder="" allowClear="true" data-th-value="${entity?.tdFeeAmt}">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">交易金额</label>
                            <div class="layui-input-inline input-inline">
                                <input id="tradeAmt" name="tradeAmt" class="layui-input form-input text-money"
                                       placeholder="" allowClear="true" data-th-value="${entity?.tradeAmt}">
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md4" data-th-if="${entity?.feeAmtPay} != null">
                            <label class="layui-form-label form-lable">随交易支付费用</label>
                            <div class="layui-input-inline input-inline">
                                <input id="feeAmtPay" name="feeAmtPay" class="layui-input form-input text-money"
                                       data-th-value="${entity?.feeAmtPay}">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4" data-th-if="${entity?.feeAmtUnpay} != null">
                            <label class="layui-form-label form-lable">不随交易支付费用</label>
                            <div class="layui-input-inline input-inline">
                                <input id="feeAmtUnpay" name="feeAmtUnpay" class="layui-input form-input text-money"
                                       data-th-value="${entity?.feeAmtUnpay}">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
</body>
<div layout:fragment="script">
    <script type="text/javascript">
        /*
            1)  对于首期、到期交易：交易本金、首次结算金额、到期结算金额、应计利息显示值；
            2)  对于转入、转出交易：转入/转出利息金额显示值；
            3)  对于派息交易：派息金额显示值；
        */
        $(function(){
            // TODO 2.0.7.8 框架bug: 使用text-money时，需要先隐藏，否则报错导致当前页面 js 不生效。
            // Cannot read property 'replace' of undefined at HTMLInputElement.<anonymous> (common.js:401)
            $("#fundForm").show();
            var psCode = $("#ps").val();
            var ps1=['T07'];// T07-到期,
            var ps2=['T20','T21','T25','T26'];// T20-转入,T21-转出,T25-应收款项转入,T26-应收款项转出
            var ps3=['T27'];// T27-债券派息
            if(ps1.indexOf(psCode)>=0){// 对于首期、到期交易：交易本金、首次结算金额、到期结算金额、应计利息显示值；
                $("#c_prinAmt").show();
                $("#c_firSetAmt").show();
                $("#c_expSetAmt").show();
                $("#c_intAmt").show();
            }else{
                $("#c_prinAmt").hide();
                $("#c_firSetAmt").hide();
                $("#c_expSetAmt").hide();
                $("#c_intAmt").hide();
            }
            if(ps2.indexOf(psCode)>=0){//  对于转入、转出交易：转入/转出利息金额显示值；
                $("#c_tranAmt").show();
            }else{
                $("#c_tranAmt").hide();
            }
            if(ps3.indexOf(psCode)>=0){//  3)  对于派息交易：派息金额显示值；
                $("#c_divAmt").show();
            }else{
                $("#c_divAmt").hide();
            }
        });

    </script>
</div>
</html>
