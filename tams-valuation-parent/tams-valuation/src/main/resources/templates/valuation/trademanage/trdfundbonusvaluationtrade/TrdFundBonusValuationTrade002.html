<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<title data-th-text="#{TrdFundBonusValuationTrade002}">基金交易新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
				<form id="basicInfoForm" class="layui-form joyin-form-wrap pro-module-form">
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdFundBonusValuationTrade002.tradeId}">交易编号</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="tradeId"
												   data-th-value="${entity?.tradeId}"
												   class="layui-input form-input" placeholder="请输入内容" disabled
												   data-th-placeholder="#{SysCommon.placeholder}" >
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFundBonusValuationTrade002.portfolioName}">产品名称</label>
										<div class="layui-input-inline input-inline">
											<select id="portfolioId" name="portfolioId" th:initValue="${entity?.portfolioId}"
													class="layui-input form-input input-select available" required
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-data-url="@{/valuation/trademanage/trdfundbonusvaluationtrade/TrdFundBonusValuationTrade002/findPortfolioId}">
											</select>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdFundBonusValuationTrade002.portfolioId}">产品代码</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="portfolioName" name="portfolioName"
												   data-th-value="${entity?.portfolioName}" required
												   class="layui-input form-input" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}" disabled>
										</div>
									</div>
								</div>

								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdFundBonusValuationTrade002.finprodName}">资产名称</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="finprodId" name="finprodId" class="layui-input form-input input-select" required
													placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" th:initValue="${entity?.finprodId}"
													data-th-data-url="@{/valuation/trademanage/trdfundbonusvaluationtrade/TrdFundBonusValuationTrade002/findFinprodId}" allowClear="true" showField="id" formatoption="true"></select>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdFundBonusValuationTrade002.finprodId}">资产代码</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="finprodName"  id="finprodName"
												   data-th-value="${entity?.finprodName}" required
												   class="layui-input form-input" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}" disabled>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFundBonusValuationTrade002.tradeMarket}">交易场所</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="tradeMarket" name="tradeMarket"
													class="layui-input form-input input-select"
													data-th-data-result='${TRADE_PLACE}' allowClear="true"
													placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
													required="required" formatoption="true"
													data-th-initValue="${entity?.tradeMarket}">
											</select>
										</div>
									</div>
								</div>

								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFundBonusValuationTrade002.ps}">交易类型</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="ps" name="ps"
													class="layui-input form-input input-select"
													data-th-data-result='${PS}' allowClear="true"
													placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
													required="required" formatoption="true"
													data-th-initValue="${entity?.ps}">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFundBonusValuationTrade002.tradeDate}">交易日期</label>
										<div class="layui-input-inline input-inline">
											<input id="tradeDate" name="tradeDate" required
												   class="layui-input form-input input-dateSelect hidden"
												   data-th-value='${#dates.format(entity?.tradeDate,"yyyy-MM-dd")}'>
										</div>
									</div>
								</div>

							</div>
						</div>
					</div>

					<div class="pro-module-wrap" id="value_div_je">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">金额信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFundBonusValuationTrade002.bonusAmt}">分红金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="bonusAmt" name="bonusAmt" maxLength="16"
												    th:value="${entity?.bonusAmt}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFundBonusValuationTrade002.nums}">交易份额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="nums" name="nums" maxLength="16"
												    th:value="${entity?.nums}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFundBonusValuationTrade002.unitCprice}">单位分红净值</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="unitCprice" name="unitCprice" maxLength="16" required disabled
												   th:value="${entity?.unitCprice}" class="layui-input form-input text-number rateCal"
												   data-textrange="4" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
								</div>

								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFundBonusValuationTrade002.ccy}">币种</label>
										<div class="layui-input-inline input-inline">
											<select id="ccy" name="ccy"
													data-th-data-result="${CCY}"
													th:initvalue="*{entity?.ccy}" class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}" required>
											</select>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="pro-module-wrap" th:id="value_div_fy">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">费用信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFundBonusValuationTrade002.feeAmtQT}">其他费用</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="feeAmtQT" name="feeAmtQT" maxLength="16"
												   required th:value="${entity?.feeAmtQT}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="pro-module-wrap" th:id="value_div">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">汇总信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFundBonusValuationTrade002.mdateSettleAmt}">结算金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="mdateSettleAmt" name="mdateSettleAmt" maxLength="16"
												   required th:value="${entity?.mdateSettleAmt}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
									<div class="form-inline-wrap" >
										<label class="layui-form-label form-lable" >资金账户</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="trdAcctId" name="trdAcctId" class="layui-input form-input input-select" parentIds="portfolioId"
													th:data-url="@{/valuation/trademanage/trdfundbonusvaluationtrade/TrdFundBonusValuationTrade002/getTrdAcctId}"
													allowClear="true" placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}">
											</select>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

				</form>
                <div class="layui-form-item">
				<div align="center" style="height:50px;padding-top: 10px;">
					<a id="TrdFundBonusValuationTrade002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
					<a id="TrdFundBonusValuationTrade002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
					<a id="TrdFundBonusValuationTrade002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
				</div>
			</div>
         </div>
    </div>
    </div>
    <div layout:fragment="script">
    	<script data-th-inline="javascript" type="text/javascript">
    			var PS_T01 = /*[[${PS_T01}]]*/'';
    			var YES = /*[[${YES}]]*/'';
    			var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
    			var finprodId = /*[[${finprodId}]]*/'';
    			var CCY = /*[[${CCY}]]*/'';
    			var FINPROD_TYPE_F17 = /*[[${FINPROD_TYPE_F17}]]*/'';
                var tradeId = /*[[${tradeId}]]*/'';
                var PS_T02 = /*[[${PS_T02}]]*/'';
		</script>
    	<script data-th-src="@{/js/valuation/trademanage/trdfundbonusvaluationtrade/TrdFundBonusValuationTrade002.js}">
    	</script>
    </div>
</body>
</html>
