<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>纳税增值税新建</title>
</head>

<body>

<div layout:fragment="content">
			<form class="layui-form" id="submitForm">
				<div class="layui-form-item">
				 <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">类型</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="taxidenType" name="taxidenType" class="layui-input form-input input-checkbox"
                          data-th-data-result="${PS}"
                          data-th-initValue="${entity?.taxidenType}">
                    </div>
                </div>
				<div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">账套代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id=booksetId name="booksetId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/valuation/trademanage/paythevatquery/PayTheVatQuery001/getBooksetId}"
                                data-th-initValue="${entity?.booksetId}"
                                multiple="multiple" allowClear="true" >
                            </select>
                        </div>
                    </div>
              	</div>
                <div class="layui-form-item">
				<div class="layui-inline layui-col-md4" id="paytax">
					<label class="layui-form-label form-lable" id="">缴税日期</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="payTaxVDate" name="payTaxVDate"
							class="layui-input form-input input-dateSelect" 
                            data-th-value="${entity?.payTaxVDate}"
							placeholder="请选择日期">
					</div>
				</div>
				<div class="layui-inline layui-col-md4" id="paytax2">
					<label class="layui-form-label form-lable">缴税截止日期</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="payTaxMDate" name="payTaxMDate"
							class="layui-input form-input input-dateSelect"
                            data-th-value="${entity?.payTaxMDate}"
							placeholder="请选择日期">
					</div>
				</div>
				<div class="layui-inline layui-col-md4  hidden" id="drawback" style="display: none;">
					<label class="layui-form-label form-lable">退税日期</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="refundTaxVDate" name="refundTaxVDate"
							class="layui-input form-input input-dateSelect"
                            data-th-value="${entity?.refundTaxVDate}"
							placeholder="请选择日期">
					</div>
				</div>
				<div class="layui-inline layui-col-md4 " id="drawback2" style="display: none;">
					<label class="layui-form-label form-lable">退税截止日期</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="refundTaxMDate" name="refundTaxMDate"
							class="layui-input form-input input-dateSelect" 
                            data-th-value="${entity?.refundTaxMDate}"
							placeholder="请选择日期">
					</div>
				</div>
				 <a id="PayTheVatQuery002_btn_search" class="layui-btn layui-btn-sm btn-search" data-th-text="#{SysCommon.search}">查询</a>
			</div>
			<div id="table1">
				<table id="dataTable"></table>
			</div>
			<div id="table2" style="display: none;">
				<table id="dataTable2"></table>
			</div>
		</form>
		<input type="text" id="workflowId" name="workflowId" class="layui-input form-input" data-th-value="${workflowId}" disabled="disabled" style = "display:none;">
		<div class="layui-col-md11" style="margin: 50px;">
            <div class="text-center">
                <a id="PayTheVatQuery002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                    data-th-text="#{SysCommon.submit}">提交</a>
                <a id="PayTheVatQuery002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                    data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
	</div>
</body>
<div layout:fragment="script">
	<script 
		data-th-src="@{/js/valuation/trademanage/paythevatquery/PayTheVatQuery002.js}"
		type="text/javascript"></script>
</div>

</html>
