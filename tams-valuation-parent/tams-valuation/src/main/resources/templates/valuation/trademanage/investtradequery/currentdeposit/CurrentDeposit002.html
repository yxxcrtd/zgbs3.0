<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title>查看活期存款收息交易</title>
<link rel="stylesheet" type="text/css" data-th-href="@{/css/font/iconfont.css}">
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm" style="background: #ffffff; padding: 10px 0;">
            <fieldset class="layui-elem-field layui-field-title" style="margin-top: 1px;">
                <div class="layui-collapse" lay-filter="test">
                    <div class="layui-colla-item">
                        <h2 class="layui-colla-title">
                            <a href="javascript:;">基本信息</a>
                        </h2>
                        <div class="layui-colla-content">
                            <input id="tradeId" name="tradeId" data-th-value=${entity?.tradeId} type="hidden" />
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md6">
                                    <label class="layui-form-label form-lable">资金账户账号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeId2" name="tradeId2" class="layui-input form-input">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md6">
                                    <label class="layui-form-label form-lable">上次收息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="vDate" name="vDate"
                                            class="layui-input form-input input-dateSelect" allowClear="true"
                                            data-th-value=${entity?.vDate}>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md6">
                                    <label class="layui-form-label form-lable">本次收息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="mDate" name="mDate"
                                            class="layui-input form-input input-dateSelect" allowClear="true"
                                            data-th-value=${entity?.mDate}>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md6">
                                    <label class="layui-form-label form-lable">理论利息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="prodId" name="prodId" class="layui-input form-input text-money">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md6">
                                    <label class="layui-form-label form-lable">实际利息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="realIntAmt" name="realIntAmt"
                                            class="layui-input form-input text-money" data-th-value="${entity?.realIntAmt}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md6">
                                    <label class="layui-form-label form-lable">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="ccy" name="ccy" class="layui-input form-input input-select"
                                            data-th-data-result="${CCY}" allowClear="true"
                                            data-th-initValue="${entity?.ccyCode}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </fieldset>
            <fieldset class="layui-elem-field layui-field-title" style="margin-top: 1px;">
                <div class="layui-collapse" lay-filter="test">
                    <div class="layui-colla-item">
                        <h2 class="layui-colla-title">
                            <a href="javascript:;">查看明细</a>
                        </h2>
                        <div class="layui-colla-content">
                            <table class="layui-table" id="dataTable"></table>
                        </div>
                    </div>
                </div>
            </fieldset>
            <fieldset class="layui-elem-field layui-field-title" style="margin-top: 1px;">
                <div class="layui-collapse" lay-filter="test">
                    <div class="layui-colla-item">
                        <h2 class="layui-colla-title">
                            <a href="javascript:;">对应投资主体收息信息</a>
                        </h2>
                        <div class="layui-colla-content">
                            <table class="layui-table" id="dataTable2"></table>
                        </div>
                    </div>
                </div>
            </fieldset>
        </form>
        <div class="layui-col-md11" style="margin: 50px;">
            <div class="text-center">
                <!--                 <a id="ValManualVoucher003_btn_save" class="layui-btn layui-btn-sm btn-save" 
                       data-th-text="#{SysCommon.save}">保存</a> 
                  <a id="ValManualVoucher003_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                      data-th-text="#{SysCommon.submit}">提交</a>-->
                <a id="ValManualVoucher003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                    data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
</body>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/trademanage/investtradequery/currentdeposit/CurrentDeposit002.js}"
        type="text/javascript"></script>
</div>
</html>
