<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorator="~{layout/default}">
<head>
	<title data-th-text="#{TrdPlanValuationTrade003}">计划类资产交易到账确认</title>
</head>
<body>
<div layout:fragment="content">
	<div class="pro-module-container">
		<div class="pro-module-wrapper pro-module-base">
			<form id="basicInfoForm" class="layui-form joyin-form-wrap pro-module-form">
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title"><span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdPlanValuationTrade002.tradeId}">交易编号</label>
									<div class="layui-input-inline input-inline">
										<input type="text" name="tradeId"
											   data-th-value="${entity?.tradeId}"
											   class="layui-input form-input" placeholder="请输入内容" disabled
											   data-th-placeholder="#{SysCommon.placeholder}" >
									</div>
								</div>

								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdPlanValuationTrade002.outTradeId}">外部交易编号</label>
									<div class="layui-input-inline input-inline">
										<input type="text" name="outTradeId"
											   data-th-value="${entity?.outTradeId}"
											   class="layui-input form-input" placeholder="请输入内容"
											   data-th-placeholder="#{SysCommon.placeholder}" >
									</div>
								</div>

								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanValuationTrade002.portfolioName}">产品名称</label>
									<div class="layui-input-inline input-inline">
										<select id="portfolioId" name="portfolioId" th:initValue="${entity?.portfolioId}"
												class="layui-input form-input input-select available" required
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-url="@{/valuation/trademanage/trdplanvaluationtrade/TrdPlanValuationTrade002/findPortfolioId}">
										</select>
									</div>
								</div>
							</div>

							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdPlanValuationTrade002.portfolioId}">产品代码</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="portfolioName" name="portfolioName"
											   data-th-value="${entity?.portfolioName}" required
											   class="layui-input form-input" placeholder="请输入内容"
											   data-th-placeholder="#{SysCommon.placeholder}" disabled>
									</div>
								</div>

								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdPlanValuationTrade002.finprodName}">资产名称</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="finprodId" name="finprodId" class="layui-input form-input input-select" required
												placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" th:initValue="${entity?.finprodId}"
												data-th-data-url="@{/valuation/trademanage/trdplanvaluationtrade/TrdPlanValuationTrade002/findFinprodId}" allowClear="true" showField="id" formatoption="true"></select>
									</div>
								</div>

								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdPlanValuationTrade002.finprodId}">资产代码</label>
									<div class="layui-input-inline input-inline">
										<input type="text" name="finprodName"  id="finprodName"
											   data-th-value="${entity?.finprodName}" required
											   class="layui-input form-input" placeholder="请输入内容"
											   data-th-placeholder="#{SysCommon.placeholder}" disabled>
									</div>
								</div>
							</div>

							<div class="layui-form-item">

								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanValuationTrade002.ps}">交易类型</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="ps" name="ps"
												class="layui-input form-input input-select"
												data-th-data-result='${PS}' allowClear="true"
												placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
												required="required" formatoption="true"
												data-th-initValue="${entity?.ps}">
										</select>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanValuationTrade002.tradeMarket}">交易场所</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="tradeMarket" name="tradeMarket"
												class="layui-input form-input input-select"
												data-th-data-result='${TRADE_PLACE}' allowClear="true"
												placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
												required="required" formatoption="true"
												data-th-initValue="${entity?.tradeMarket}">
										</select>
									</div>
								</div>

								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanValuationTrade002.ccy}">币种</label>
									<div class="layui-input-inline input-inline">
										<select id="ccy" name="ccy"
												data-th-data-result="${CCY}"
												th:initvalue="*{entity?.ccy?:CCY_default}" class="layui-input form-input input-select"
												data-th-placeholder="#{SysCommon.placeholder}" required>
										</select>
									</div>
								</div>
							</div>

						</div>
					</div>
				</div>

				<div class="pro-module-wrap" th:id="value_div">
					<div class="pro-module">
						<h3 class="pro-module-title"><span class="title-des">赎回信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanValuationTrade002.shqrTradeDate}">确认日期</label>
									<div class="layui-input-inline input-inline">
										<input id="shqrTradeDate" name="shqrTradeDate" required
											   class="layui-input form-input input-dateSelect hidden"
											   data-th-value='${#dates.format(entity?.shqrTradeDate,"yyyy-MM-dd")}'>
									</div>
								</div>

								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanValuationTrade002.shqrNums}">确认数量</label>
									<div class="layui-input-inline input-inline">
										<input type="text" th:id="shqrNums" name="shqrNums" maxLength="16"
											   required th:value="${entity?.shqrNums}" class="layui-input form-input text-number"
											   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
									</div>
								</div>


								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanValuationTrade002.shqrTradeAmt}">确认金额</label>
									<div class="layui-input-inline input-inline">
										<input type="text" th:id="shqrTradeAmt" name="shqrTradeAmt" maxLength="16"
											   required th:value="${entity?.shqrTradeAmt}" class="layui-input form-input text-number"
											   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
									</div>
								</div>
							</div>

							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanValuationTrade002.shqrUnitValue}">单位净值</label>
									<div class="layui-input-inline input-inline">
										<input type="text" th:id="shqrUnitValue" name="shqrUnitValue" maxLength="16"
											   th:value="${entity?.shqrUnitValue}" class="layui-input form-input text-number"
											   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanValuationTrade002.redemptionFee}" >赎回费</label>
									<div class="layui-input-inline input-inline">
										<input type="text" th:id="redemptionFee" name="redemptionFee" maxLength="16"
											   required th:value="${entity?.redemptionFee}" class="layui-input form-input text-number"
											   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>

				<div class="pro-module-wrap" th:id="value_div">
					<div class="pro-module">
						<h3 class="pro-module-title"><span class="title-des">赎回到账</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanValuationTrade002.shqrSettleDate}">到账日期</label>
									<div class="layui-input-inline input-inline">
										<input id="shqrSettleDate" name="shqrSettleDate" required
											   class="layui-input form-input input-dateSelect hidden"
											   data-th-value='${#dates.format(entity?.shqrSettleDate,"yyyy-MM-dd")}'>
									</div>
								</div>

								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap" data-th-text="#{TrdPlanValuationTrade002.shdzTradeAmt}">到账金额</label>
									<div class="layui-input-inline input-inline">
										<input type="text" th:id="shdzTradeAmt" name="shdzTradeAmt" maxLength="16"
											   required th:value="${entity?.shdzTradeAmt}" class="layui-input form-input text-number"
											   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
									</div>
								</div>

								<div class="form-inline-wrap" >
									<label class="layui-form-label form-lable" data-th-text="#{TrdPlanValuationTrade002.shdzTrdAcctId}">资金账户</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="shdzTrdAcctId" name="shdzTrdAcctId" class="layui-input form-input input-select"
												parentIds="portfolioId" required  data-th-initValue="${entity?.shdzTrdAcctId}"
												th:data-url="@{/valuation/trademanage/trdplanvaluationtrade/TrdPlanValuationTrade002/getTrdAcctId}"
												allowClear="true" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}">
										</select>
									</div>
								</div>
							</div>

						</div>
					</div>
				</div>

			</form>
			<div class="layui-form-item">
				<div align="center" style="height:50px;padding-top: 10px;">
					<a id="TrdPlanValuationTrade003_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
					<a id="TrdPlanValuationTrade003_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
					<a id="TrdPlanValuationTrade003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
				</div>
			</div>
		</div>
	</div>
</div>
<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">
		var PS_T01 = /*[[${PS_T01}]]*/'';
		var YES = /*[[${YES}]]*/'';
		var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
		var finprodId = /*[[${finprodId}]]*/'';
		var CCY = /*[[${CCY}]]*/'';
		var FINPROD_TYPE_F17 = /*[[${FINPROD_TYPE_F17}]]*/'';
		var tradeId = /*[[${tradeId}]]*/'';
		var PS_T02 = /*[[${PS_T02}]]*/'';
	</script>
	<script data-th-src="@{/js/valuation/trademanage/trdplanvaluationtrade/TrdPlanValuationTrade003.js}">
	</script>
</div>
</body>
</html>
