<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorator="~{layout/default}">
<head>
	<title data-th-text="#{TrdPlanValuationTrade003}">计划类资产交易到账确认</title>
</head>
<body>
<div layout:fragment="content">
	<div class="pro-module-container">
		<div class="pro-module-wrapper pro-module-base">
			<form id="basicInfoForm" class="layui-form joyin-form-wrap pro-module-form">
				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title"><span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{TrdPlanValuationTrade002.tradeId}">交易编号</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="tradeId" name="tradeId"
											   required disabled
											   placeholder="提交后自动生成，无需填写"
											   class="layui-input form-input"
											   data-th-value="${entity?.tradeId}">
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{TrdPlanValuationTrade002.outTradeId}">外部成交编号</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="outTradeId" name="outTradeId" disabled
											   class="layui-input form-input"
											   data-th-value="${entity?.outTradeId}">
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{TrdPlanValuationTrade002.prodName}">产品名称</label>
									<div class="layui-input-inline input-inline" >
										<select id="prodId" name="prodId" required disabled
												class="layui-input form-input input-select"
												data-th-data-url="@{/valuation/trademanage/trdplanvaluationtrade/TrdPlanValuationTrade001/getFinprodId}"
												allowClear="true" placeholder="请输入内容"
												data-th-initValue="${entity?.prodId}" >
										</select>
									</div>
								</div>
							</div>

							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdPlanValuationTrade002.prodId}">产品名称</label>
									<div class="layui-input-inline input-inline">
										<input  type="text" id="prodName" name="prodName" required disabled
												class="layui-input form-input" placeholder="请输入内容"
												th:placeholder="#{SysCommon.placeholder}"
												th:value="${entity?.prodName}">
									</div>
								</div>

								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{TrdPlanValuationTrade002.assetAbbr}">资产名称</label>
									<div class="layui-input-inline input-inline">
										<select id="assetId" name="assetId" required disabled
												class="layui-input form-input input-select"
												data-th-data-url="@{/valuation/trademanage/trdplanvaluationtrade/TrdPlanValuationTrade001/getAssetId}"
												allowClear="true" placeholder="请输入内容"
												data-th-initValue="${entity?.assetId}" >
										</select>
									</div>
								</div>

								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{TrdPlanValuationTrade002.assetId}">资产代码</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="assetAbbr" name="assetAbbr"
											   class="layui-input form-input"
											   required disabled
											   data-th-value="${entity?.assetAbbr}"
											   placeholder="请输入内容">
									</div>
								</div>
							</div>

							<div class="layui-form-item">

								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{TrdPlanValuationTrade002.ps}">交易类型</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="ps" name="ps" required disabled
												class="layui-input form-input input-select"
												placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-result='${PS}'
												allowClear="true"
												formatoption="true"
												data-th-initValue="${entity?.ps}">
										</select>
									</div>
								</div>

								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdPlanValuationTrade002.ccy}">币种</label>
									<div class="layui-input-inline input-inline">
										<select  type="text" id="ccy" name="ccy" required disabled
												 class="layui-input form-input input-select"
												 placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
												 th:data-result='${CCY}'
												 allowClear="true"
												 formatoption="true"
												 th:initValue="*{entity?.ccy?:CCY_default}"></select>
									</div>
								</div>
							</div>

						</div>
					</div>
				</div>

				<div class="pro-module-wrap" >
					<div class="pro-module">
						<h3 class="pro-module-title"><span class="title-des">赎回信息</span><i
								class="iconfont icon-arrow-down pro-down-icon"></i></h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdPlanValuationTrade002.subConfirmDate}">确认日期</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="redConfirmDate" name="redConfirmDate" required disabled
											   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
											   th:placeholder="#{SysCommon.placeholder}"
											   data-th-value='${#dates.format(entity?.redConfirmDate?:iPlatformDate,"yyyy-MM-dd")}'>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{TrdPlanValuationTrade002.subConfirmNum}">确认数量</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="redConfirmNum" name="redConfirmNum" required disabled
											   class="layui-input form-input text-number"
											   maxLength="28" data-textrange="2" data-fixtype="2"
											   th:value="${entity?.redConfirmNum}"
											   placeholder="请输入内容">
									</div>
								</div>
								<div class="form-inline-wrap" >
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdPlanValuationTrade002.subConfirmAmt}">确认金额</label>
									<div class="layui-input-inline input-inline">
										<input  type="text" id="redConfirmAmt" name="redConfirmAmt" required disabled
												class="layui-input form-input text-number" placeholder="请输入内容"
												maxLength="28" data-textrange="2" data-fixtype="2"
												th:placeholder="#{SysCommon.placeholder}"
												th:value="${entity?.redConfirmAmt}" />
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap" >
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdPlanValuationTrade002.purUnitValue}">单位净值</label>
									<div class="layui-input-inline input-inline">
										<input  type="text" id="redUnitValue" name="redUnitValue" disabled
												class="layui-input form-input text-number" placeholder="请输入内容"
												maxLength="28" data-textrange="2" data-fixtype="2"
												th:placeholder="#{SysCommon.placeholder}"
												th:value="${entity?.redUnitValue}" />
									</div>
								</div>
								<div class="form-inline-wrap" >
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdPlanValuationTrade002.redFee}">赎回费</label>
									<div class="layui-input-inline input-inline">
										<input  type="text" id="redFee" name="redFee" required
												class="layui-input form-input text-number" placeholder="请输入内容"
												maxLength="28" data-textrange="2" data-fixtype="2"
												th:placeholder="#{SysCommon.placeholder}"
												th:value="${entity?.redFee?:0}" />
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>

				<div class="pro-module-wrap">
					<div class="pro-module">
						<h3 class="pro-module-title"><span class="title-des">赎回到账</span><i
								class="iconfont icon-arrow-down pro-down-icon"></i></h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-lable"
										   data-th-text="#{TrdPlanValuationTrade002.arriveDate}">到账日期</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="arriveDate" name="arriveDate" required
											   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
											   data-th-placeholder="#{SysCommon.placeholder}"
											   data-th-value='${#dates.format(entity?.arriveDate?:iPlatformDate,"yyyy-MM-dd")}'>
									</div>
								</div>
								<div class="form-inline-wrap" >
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdPlanValuationTrade002.tradeAmtArrive}">到账金额</label>
									<div class="layui-input-inline input-inline">
										<input  type="text" id="tradeAmtArrive" name="tradeAmtArrive" required
												class="layui-input form-input text-number" placeholder="请输入内容"
												maxLength="28" data-textrange="2" data-fixtype="2"
												th:placeholder="#{SysCommon.placeholder}"
												th:value="${entity?.tradeAmtArrive?:0}" />
									</div>
								</div>
								<div class="form-inline-wrap" >
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{TrdPlanValuationTrade002.myAcctNo}">资金账户</label>
									<div class="layui-input-inline input-inline" >
										<select id="redMyAcctNo" name="redMyAcctNo" required
												class="layui-input form-input input-select"
												data-th-data-url="@{/valuation/trademanage/bondlend/TrdBondLendTrade002/getTrdAcctId}"
												allowClear="true" placeholder="请输入内容"
												data-th-initValue="${entity?.redMyAcctNo}">
										</select>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>

			</form>
			<div class="layui-form-item">
				<div align="center" style="height:50px;padding-top: 10px;">
					<a id="TrdPlanValuationTrade003_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
					<a id="TrdPlanValuationTrade003_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
					<a id="TrdPlanValuationTrade003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
				</div>
			</div>
		</div>
	</div>
</div>
<div layout:fragment="script">
	<script data-th-inline="javascript" type="text/javascript">
		var PS_T01 = /*[[${PS_T01}]]*/'';
		var YES = /*[[${YES}]]*/'';
		var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
		var finprodId = /*[[${finprodId}]]*/'';
		var CCY = /*[[${CCY}]]*/'';
		var FINPROD_TYPE_F17 = /*[[${FINPROD_TYPE_F17}]]*/'';
		var tradeId = /*[[${tradeId}]]*/'';
		var PS_T02 = /*[[${PS_T02}]]*/'';
	</script>
	<script data-th-src="@{/js/valuation/trademanage/trdplanvaluationtrade/TrdPlanValuationTrade003.js}">
	</script>
</div>
</body>
</html>
