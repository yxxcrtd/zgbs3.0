<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>投资交易查询</title>
</head>
<body>
</body>
<div layout:fragment="content">
	<div class="form-button-area" export="true"></div>
	<div class="joyin-form-wrap joyin-filter-form condition-area"
		style="display: block;">
		<form class="layui-form" id="searchForm">
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">交易编号</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="paTradeId" name="paTradeId"
							class="layui-input form-input"
							data-th-placeholder="#{SysCommon.placeholder}" value="">
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">资产</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="paAsset" name="paAsset"
							class="layui-input form-input" value=""
							data-th-placeholder="#{SysCommon.placeholder}">
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">业务类型</label>
					<div class="layui-input-inline input-inline">
						<select id="paBusiType" name="paBusiType"
							class="layui-input form-input input-select" placeholder="请选择"
							data-th-data-result="${BUSI_TYPE}" allowClear="true"
							multiple="multiple"
							data-th-placeholder="#{SysCommon.placeholder}">
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">投资账户</label>
					<div class="layui-input-inline input-inline">
						<select id="bookSetId" name="bookSetId"
							class="layui-input form-input input-select" allowClear="true"
							multiple="multiple"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-data-url="@{/valuation/trademanage/investtradequery/InvestTradeQuery001/getBookSetId}">
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">交易方向</label>
					<div class="layui-input-inline input-inline">
						<select id="paPs" name="paPs"
							class="layui-input form-input input-select" placeholder="请选择"
							data-th-data-result="${PS}" allowClear="true" multiple="multiple"
							data-th-placeholder="#{SysCommon.placeholder}">
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">发生日期</label>
					<div class="layui-input-inline input-inline">
						<input id="tradeDate" name="tradeDate" placeholder="请选择、支持区间"
							class="layui-input form-input input-dateRangeSelect">
					</div>
				</div>
			</div>
		</form>
	</div>
	<div class="layui-tab layui-tab-card" lay-filter="tabContainer"
		style="visibility: hidden;">
		<ul class="layui-tab-title">
			<li id="bond-title" class="layui-this">&nbsp;债券交易查询</li>
			<li id="plan-profit-title">&nbsp;计划类资产(收益型)查询</li>
			<li id="plan-netvalue-title">&nbsp;计划类资产(净值型)查询</li>
			<li id="plan-currency-title">&nbsp;计划类资产(货币型)查询</li>
			<li id="deposit-loan-title">&nbsp;存款类资产交易查询</li>
			<li id="lend-title">&nbsp;拆借交易查询</li>
			<li id="repurchase-title">&nbsp;回购交易查询</li>
			<li id="fund-currency-title">&nbsp;基金类资产(货币型)查询</li>
			<li id="fund-netvalue-title">&nbsp;基金类资产(净值型)查询</li>
			<li id="current-deposit-title">&nbsp;活期存款收息交易查询</li>
			<li id="cash-transactions-title">&nbsp;产品费用交易查询</li>
			<li id="trade-account-title">&nbsp;交易账户收划款查询</li>
			<li id="value-addedtaxs-title">&nbsp;增值税交易查询</li>
			<li id="value-reclass-title">&nbsp;债券重分类交易查询</li>
			<li id="bond-lend-title">&nbsp;债券借贷交易查询</li>
			<li id="overdue-penalty-title">&nbsp;逾期罚息交易查询</li>
		</ul>
		<div class="layui-tab-content" style="padding: 0">
			<div class="layui-tab-item layui-show">
				<table class="layui-table" id="bond-table"></table>
			</div>
			<div class="layui-tab-item">
				<table class="layui-table" id="plan-profit-table"></table>
			</div>
			<div class="layui-tab-item">
				<table class="layui-table" id="plan-netvalue-table"></table>
			</div>
			<div class="layui-tab-item">
				<table class="layui-table" id="plan-currency-table"></table>
			</div>
			<div class="layui-tab-item">
				<table class="layui-table" id="deposit-loan-table"></table>
			</div>
			<div class="layui-tab-item">
				<table class="layui-table" id="lend-table"></table>
			</div>
			<div class="layui-tab-item">
				<table class="layui-table" id="repurchase-table"></table>
			</div>
			<div class="layui-tab-item">
				<table class="layui-table" id="fund-currency-table"></table>
			</div>
			<div class="layui-tab-item">
				<table class="layui-table" id="fund-netvalue-table"></table>
			</div>
			<div class="layui-tab-item">
				<table class="layui-table" id="current-deposit-table"></table>
			</div>
			<div class="layui-tab-item">
				<table class="layui-table" id="cash-transactions-table"></table>
			</div>
			<div class="layui-tab-item">
				<table class="layui-table" id="trade-account-table"></table>
			</div>
			<div class="layui-tab-item">
				<table class="layui-table" id="value-addedtaxs-table"></table>
			</div>
			<div class="layui-tab-item">
				<table class="layui-table" id="value-reclass-table"></table>
			</div>
			<div class="layui-tab-item">
                <table class="layui-table" id="bond-lend-table"></table>
            </div>
            <div class="layui-tab-item">
                <table class="layui-table" id="overdue-penalty-table"></table>
            </div>
		</div>
	</div>
</div>
<div layout:fragment="script">
	<script
		data-th-src="@{/js/valuation/trademanage/investtradequery/InvestTradeQuery001.js}"
		type="text/javascript"></script>
</div>
</html>
