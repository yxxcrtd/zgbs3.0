<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorator="~{layout/default}">
<head>
<title data-th-text="#{TrdDepositValuationTrade002}">存款类交易新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
				<form id="basicInfoForm" class="layui-form joyin-form-wrap pro-module-form">
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">

									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{TrdDepositValuationTrade.tradeId}">交易编号</label>
										<div class="layui-input-inline input-inline">
											<input type="text" class="layui-input form-input"
												   id="tradeId" name="tradeId"
												   placeholder="提交后自动生成，无需填写"
												   disabled="disabled"
												   data-th-value="${entity?.tradeId}" maxlength="60">
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{TrdDepositValuationTrade.outTradeId}">外部成交编号</label>
										<div class="layui-input-inline input-inline">
											<input type="text" class="layui-input form-input" id="outTradeId"
												   name="outTradeId" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}"
												   data-th-value="${entity?.outTradeId}" maxlength="60">
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{TrdDepositValuationTrade.prodName}">产品名称</label>
										<div class="layui-input-inline input-inline" >
											<select id="prodId" name="prodId" required
													class="layui-input form-input input-select"
													data-th-data-url="@{/valuation/trademanage/trddepositvaluationtrade/TrdDepositValuationTrade001/getFinprodId}"
													allowClear="true" placeholder="请输入内容"
													data-th-initValue="${entity?.prodId}" >
											</select>
										</div>
									</div>
								</div>

								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdDepositValuationTrade.prodId}">产品代码</label>
										<div class="layui-input-inline input-inline">
											<input  type="text" id="prodName" name="prodName" required disabled
													class="layui-input form-input" placeholder="请输入内容"
													th:placeholder="#{SysCommon.placeholder}"
													th:value="${entity?.prodName}">
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{TrdDepositValuationTrade.assetName}">资产名称</label>
										<div class="layui-input-inline input-inline">
											<select id="assetId" name="assetId" required
													class="layui-input form-input input-select"
													data-th-data-url="@{/valuation/trademanage/trddepositvaluationtrade/TrdDepositValuationTrade001/getAssetId}"
													allowClear="true"
													data-th-initValue="${entity?.assetId}"
													placeholder="请输入内容">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{TrdDepositValuationTrade.assetId}">资产代码</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="assetName" name="assetName"
												   class="layui-input form-input"
												   required disabled
												   data-th-value="${entity?.assetName}"
												   placeholder="请输入内容">
										</div>
									</div>
								</div>

								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{TrdDepositValuationTrade.ps}">交易类型</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="ps" name="ps" required
													class="layui-input form-input input-select"
													placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
													data-th-data-result='${PS}'
													allowClear="true"
													formatoption="true"
													data-th-initValue="${entity?.ps}">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdDepositValuationTrade.ccy}">币种</label>
										<div class="layui-input-inline input-inline">
											<select  type="text" id="ccy" name="ccy" required
													 class="layui-input form-input input-select"
													 placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
													 th:data-result='${CCY}'
													 allowClear="true"
													 formatoption="true"
													 th:initValue="*{entity?.ccy?:CCY_default}"></select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable">交易对手</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="counterId" name="counterId"
													class="layui-input form-input input-select"
													placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-data-url="@{/valuation/trademanage/trddepositvaluationtrade/TrdDepositValuationTrade002/getCounterId}"
													data-th-initvalue="${entity?.counterId}">
											</select>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="pro-module-wrap" th:id="value_div">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">存款信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{TrdDepositValuationTrade.tradeDate}">交易日期</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="tradeDate" name="tradeDate" required
												   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}"
												   data-th-value='${#dates.format(entity?.tradeDate?:iPlatformDate,"yyyy-MM-dd")}'>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{TrdDepositValuationTrade.settDate}">交割日期</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="settDate" name="settDate" required
												   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}"
												   data-th-value='${#dates.format(entity?.settDate?:iPlatformDate,"yyyy-MM-dd")}'>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{TrdDepositValuationTrade.prinAmt}">交易本金</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="prinAmt" name="prinAmt" required
												   class="layui-input form-input text-number"
												   th:value="${entity?.prinAmt}"
												   placeholder="请输入内容">
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdDepositValuationTrade.intAmt}">应计利息总额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="intAmt" name="intAmt" required
												   class="layui-input form-input text-number"
												   maxLength="28" data-textrange="2" data-fixtype="2"
												   placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
												   th:value="${entity?.intAmt}" />
										</div>
									</div>
									<div class="form-inline-wrap" >
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdDepositValuationTrade.settleAmt}">结算金额</label>
										<div class="layui-input-inline input-inline">
											<input  type="text" id="settleAmt" name="settleAmt" required
													class="layui-input form-input text-number" placeholder="请输入内容"
													maxLength="28" data-textrange="2" data-fixtype="2"
													th:placeholder="#{SysCommon.placeholder}"
													th:value="${entity?.settleAmt}" />
										</div>
									</div>
									<div class="form-inline-wrap" >
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdDepositValuationTrade.myAcctNo}">资金账户</label>
										<div class="layui-input-inline input-inline" >
											<select id="myAcctNo" name="myAcctNo" required parentIds="prodId"
													class="layui-input form-input input-select"
													data-th-data-url="@{/valuation/trademanage/trddepositvaluationtrade/TrdDepositValuationTrade002/getTrdAcctId}"
													allowClear="true" placeholder="请输入内容"
													data-th-initValue="${entity?.myAcctNo}">
											</select>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</form>

                <div class="layui-form-item">
                    <div align="center" style="height:50px;padding-top: 10px;">

                        <a id="TrdDepositValuationTrade002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                        <a id="TrdDepositValuationTrade002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="TrdDepositValuationTrade002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
         </div>
    </div>
    </div>
    <div layout:fragment="script">
    	<script data-th-src="@{/js/valuation/trademanage/trddepositvaluationtrade/TrdDepositValuationTrade002.js}">
    	</script>
    </div>
</body>
</html>
