<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorator="~{layout/default}">
<head>
<title data-th-text="#{TrdDepositValuationTrade002}">存款类交易新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
				<form id="basicInfoForm" class="layui-form joyin-form-wrap pro-module-form">
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">

									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{TrdDepositValuation001.tradeId}">交易编号</label>
										<div class="layui-input-inline input-inline">
											<input type="text" class="layui-input form-input" id="tradeId"
												   name="tradeId" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}" required="required" disabled="disabled"
												   data-th-value="${entity?.tradeId}" maxlength="60">
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{TrdDepositValuation001.outTradeId}">外部成交编号</label>
										<div class="layui-input-inline input-inline">
											<input type="text" class="layui-input form-input" id="outTradeId"
												   name="outTradeId" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}"
												   data-th-value="${entity?.outTradeId}" maxlength="60">
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap">产品名称</label>
										<div class="layui-input-inline input-inline">
											<select id="portfolioId" name="portfolioId" th:initValue="${entity?.portfolioId}"
													class="layui-input form-input input-select available"
													data-th-placeholder="#{SysCommon.placeholder}" required
													data-th-data-url="@{/valuation/trademanage/trddepositvaluationtrade/TrdDepositValuationTrade002/findPortfolioId}">
											</select>
										</div>
									</div>
								</div>
									<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable">产品代码</label>
										<div class="layui-input-inline input-inline">
											<input type="text" class="layui-input form-input" id="portfolioName"
												   name="portfolioName" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}" required="required" disabled="disabled"
												   data-th-value="${entity?.portfolioName}" maxlength="60">
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											 >资产名称</label>
										<div class="layui-input-inline input-inline">
											<select id="finprodMarketId" name="finprodMarketId" class="layui-input form-input input-select" required
													data-th-placeholder="#{SysCommon.placeholder}" th:initValue="${entity?.finprodMarketId}"  childrenIds='chlId'
													data-th-data-url="@{/valuation/trademanage/trddepositvaluationtrade/TrdDepositValuationTrade002/findFinprodId}">

											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap">资产代码</label>
											<div class="layui-input-inline input-inline">
												<input type="text" id="finprodName" name="finprodName" th:value="${entity?.finprodName}" class="layui-input form-input hidden" placeholder="请输入内容"
													   required="required" disabled="disabled" data-th-placeholder="#{SysCommon.placeholder}">
											</div>
									</div>
								</div>

								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   th:text="#{TrdDepositValuation001.ps}">交易方向</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="ps" name="ps" required="required"
													class="layui-input form-input input-select"
													placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
													th:data-result='${PS}' allowClear="true" formatoption="true"
													th:initValue="${entity?.ps}"></select>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdDepositValuationTrade002.ccy}">币种</label>
										<div class="layui-input-inline input-inline">
											<select id="ccy" name="ccy"
													data-th-data-result="${CCY}"
													th:initvalue="*{entity?.ccy?:CCY_default}" class="layui-input form-input input-select hidden"
													data-th-placeholder="#{SysCommon.placeholder}" required="required">
											</select>
										</div>
									</div>
									<div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4">
										<label class="layui-form-label form-lable">交易对手</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="counterId" name="counterId"
													class="layui-input form-input input-select"
													placeholder="请输入内容" required="required"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-data-url="@{/valuation/trademanage/trddepositvaluationtrade/TrdDepositValuationTrade002/getCounterId}"
													data-th-initvalue="${entity?.counterId}">
											</select>
										</div>
									</div>

								</div>

							</div>
						</div>
					</div>
					<div class="pro-module-wrap" th:id="value_div">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">存款信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdDepositValuation001.tradeDate}">交易日</label>
										<div class="layui-input-inline input-inline">
											<input id="tradeDate" name="tradeDate"
												   class="layui-input form-input input-dateSelect hidden" required="required"
												   data-th-value='${#dates.format(entity?.tradeDate,"yyyy-MM-dd")}'>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap">交割日</label>
										<div class="layui-input-inline input-inline">
											<input id="settDate" name="settDate"
												   class="layui-input form-input input-dateSelect hidden" required="required"
												   data-th-value='${#dates.format(entity?.settDate,"yyyy-MM-dd")}'>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wra">交易本金</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="prinAmt" name="prinAmt" maxLength="28"
												   required th:value="${entity?.prinAmt}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>

								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap">应计利息</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="intAmt" th:name="intAmt" required th:value="${entity?.intAmt}" maxlength="28"
												   data-textrange="2" data-fixtype="2" class="layui-input form-input text-number"
												   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="pro-module-wrap" th:id="value_div">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">费用信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap">其他费用</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="otherAmt" th:name="otherAmt" required th:value="${entity?.otherAmt}" maxlength="28"
												   data-textrange="2" data-fixtype="2" class="layui-input form-input text-number"
												   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="pro-module-wrap" th:id="value_div">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">汇总信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap">结算金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="settleAmt" th:name="settleAmt" required th:value="${entity?.settleAmt}" maxlength="28"
												   data-textrange="2" data-fixtype="2" class="layui-input form-input text-number"
												   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>

<!--									<div class="form-inline-wrap">-->
<!--										<label class="layui-form-label form-label-wrap">本币交易金额</label>-->
<!--										<div class="layui-input-inline input-inline">-->
<!--											<input type="text" th:id="dealAmt" th:name="dealAmt" required th:value="${entity?.dealAmt}" maxlength="28"-->
<!--												   data-textrange="2" data-fixtype="2" class="layui-input form-input text-number"-->
<!--												   placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>-->
<!--										</div>-->
<!--									</div>-->
									<div class="form-inline-wrap" >
										<label class="layui-form-label form-lable" >资金账户</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="trdAcctId" name="trdAcctId" class="layui-input form-input input-select" parentIds="portfolioId" required
													th:data-url="@{/valuation/trademanage/bondlend/TrdBondLendTrade002/getTrdAcctId}"
													allowClear="true" placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}">
											</select>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

				</form>
                <div class="layui-form-item">
                    <div align="center" style="height:50px;padding-top: 10px;">

                        <a id="TrdDepositValuationTrade002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                        <a id="TrdDepositValuationTrade002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="TrdDepositValuationTrade002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
         </div>
    </div>
    </div>
    <div layout:fragment="script">
    	<script data-th-inline="javascript" type="text/javascript">
    			var buy = /*[[${buy}]]*/'';
    			var YES = /*[[${YES}]]*/'';
    			var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
    			var finprodId = /*[[${finprodId}]]*/'';
    			var interfSendOpicsList = /*[[${interfSendOpicsList}]]*/'';
    			var YES_OR_NO = /*[[${YES_OR_NO}]]*/'';
                <!-- 通道交易 新增 强成西 2019/03/26 start -->
                var PS_T01 = /*[[${PS_T01}]]*/'';
                <!-- 通道交易 新增 强成西 2019/03/26 end -->
                var CCY = /*[[${CCY}]]*/'';
    			var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
    			var FINPROD_TYPE_F07 = /*[[${FINPROD_TYPE_F07}]]*/'';
    			var PS_T02 = /*[[${PS_T02}]]*/'';
    			var collectType_01 = /*[[${collectType_01}]]*/'';
    			var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
    			var IS_CAL_LOADRATE = /*[[${IS_CAL_LOADRATE}]]*/'';
		</script>
		<script data-th-src="@{/js/component/common/TradeCommon.js}" type="text/javascript"></script>
		<script data-th-src="@{/js/invest/asset/channel/ChannelAssetCommon.js}" type="text/javascript"></script> 
    	<script data-th-src="@{/js/valuation/trademanage/trddepositvaluationtrade/TrdDepositValuationTrade002.js}">
    	</script>
    </div>
</body>
</html>
