<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>新建存款类资产交易-转入</title>
</head>
<body>

</body>
<div layout:fragment="content">
  <form id="submitForm">
    <div class="layui-form layui-clear" style=" margin-top:10px;">
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>产品代码</label>
        <div class="layui-input-inline input-inline">
          <input type="text"  class="layui-input form-input input-lenovoselect" placeholder="请选择产品或输入关键词" value="" data-url="/system/institution/SysInstitution001/getInstitutionCode" data-idfield="code" data-keyfield="code" data-effectivefieldsalias='{&quot;code&quot;:&quot;产品代码&quot;,&quot;shortName&quot;:&quot;产品名称&quot;}'>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">产品名称</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input" value="选产品代码自动代入名称">
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">账套代码</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input" placeholder="请输入内容" value="" required>
        </div>
      </div>
    </div>
    <div class="layui-form layui-clear" style=" margin-top:10px;">
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">交易类型</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;存款类资产交易&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;10&quot;,&quot;text&quot;:&quot;拆借交易&quot;,&quot;col&quot;:&quot;&quot;}]'>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">交易编号</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input" value="系统生成的" disabled>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">资产代码</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-lenovoselect" placeholder="请选择资产或输入关键词" value="" data-url="/system/institution/SysInstitution001/getInstitutionCode" data-idfield="code" data-keyfield="code" data-effectivefieldsalias='{&quot;code&quot;:&quot;资产代码&quot;,&quot;shortName&quot;:&quot;资产名称&quot;}'>
        </div>
      </div>
    </div>
    <div class="layui-form layui-clear" style=" margin-top:10px;">
      <div class="layui-inline layui-col-md8">
        <label class="layui-form-label form-lable2">交易方向</label>
        <div class="layui-input-inline">
          <input type="text" id="status" name="status" class="layui-input form-input input-checkbox" data-result='[{&quot;id&quot;:&quot;MR&quot;,&quot;text&quot;:&quot;买入&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;MC&quot;,&quot;text&quot;:&quot;到期卖出&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;SX&quot;,&quot;text&quot;:&quot;收息&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;HB&quot;,&quot;text&quot;:&quot;还本&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;ZR&quot;,&quot;text&quot;:&quot;转入&quot;,&quot;col&quot;:&quot;&quot;}, {&quot;id&quot;:&quot;ZC&quot;,&quot;text&quot;:&quot;转出&quot;,&quot;col&quot;:&quot;&quot;}]'
          initValue='ZR'>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">交易日</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-dateSelect" placeholder="请选择日期" required>
        </div>
      </div>
    </div>
    <div class="layui-form layui-clear" style=" margin-top:10px;">
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">交割日</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-dateSelect" placeholder="请选择日期" required>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">交易币种</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;人民币&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;10&quot;,&quot;text&quot;:&quot;澳大利亚元&quot;,&quot;col&quot;:&quot;&quot;}]'>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">记账币种</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input" value="自动代入交易币种" disabled>
        </div>
      </div>
    </div>
    <div class="layui-form layui-clear" style=" margin-top:10px;">
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">汇率</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input text-number" placeholder="请输入内容" value="" required>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">交易员</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input" placeholder="请输入内容" value="" required>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">交易对手</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input" placeholder="请输入内容" value="" required>
        </div>
      </div>
    </div> 
    <div class="layui-form layui-clear" style=" margin-top:10px;">
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">通道</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input" placeholder="请输入内容" value="" required>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">本金金额</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input text-money" placeholder="请输入内容" value="" required>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">应计利息总额</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input text-money" placeholder="请输入内容" value="" required>
        </div>
      </div>
    </div>
    <div class="layui-form layui-clear" style=" margin-top:10px;">
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">交易金额</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input text-money" placeholder="请输入内容" value="" required>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">出款账户</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;账户1&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;10&quot;,&quot;text&quot;:&quot;账户2&quot;,&quot;col&quot;:&quot;&quot;}]'>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">对手方资金账户</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;账户1&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;10&quot;,&quot;text&quot;:&quot;账户2&quot;,&quot;col&quot;:&quot;&quot;}]'>
        </div>
      </div>
    </div>
    <div class="layui-form layui-clear" style=" margin-top:10px;">
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">入账日</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-dateSelect" placeholder="请选择日期" required>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">通道费</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input text-money" placeholder="请输入内容" value="" required>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">转出产品代码</label>
        <div class="layui-input-inline input-inline">
          <input type="text"  class="layui-input form-input input-lenovoselect" placeholder="请选择产品或输入关键词" value="" data-url="/system/institution/SysInstitution001/getInstitutionCode" data-idfield="code" data-keyfield="code" data-effectivefieldsalias='{&quot;code&quot;:&quot;产品代码&quot;,&quot;shortName&quot;:&quot;产品名称&quot;}'>
        </div>
      </div>
    </div>
  </form>
  <div class="layui-col-md11" style="margin:10px;">
    <div class="text-center"> <a id="ValDepositTrede006_btn_save" class="layui-btn layui-btn-sm btn-save">保存</a> <a id="ValDepositTrede006_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a> <a id="ValDepositTrede006_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a> </div>
  </div>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script>
</div>
</html>
