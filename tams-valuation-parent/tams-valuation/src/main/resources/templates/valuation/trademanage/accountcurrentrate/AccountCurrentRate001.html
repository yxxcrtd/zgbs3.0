<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>账户活期利率查询</title>
</head>
<body>
</body>
<div layout:fragment="content">
	<div class="form-button-area">
        <a id="AccountCurrentRate001_btn_add" class="layui-btn layui-btn-sm btn-create">新建</a>
        <a id="AccountCurrentRate001_btn_delete" class="layui-btn layui-btn-sm btn-create">删除</a>
    </div>
	<div class="joyin-form-wrap joyin-filter-form condition-area">
		<form class="layui-form" id="searchForm">
			<div class="layui-form-item">			
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">账户类型</label>
					<div class="layui-input-inline input-inline">
						<select id="accountType" name="accountType"
							class="layui-input form-input input-select"
							data-th-data-result='${ACCT_TYPE}' allowClear="true"
							multiple="multiple" placeholder="请输入内容"  childrenIds="account"
							data-th-placeholder="#{SysCommon.placeholder}">
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">账号/账户名</label>
					<div class="layui-input-inline input-inline">
<!--                         <input type="text" id="account" name="account" class="layui-input form-input" value="" -->
<!--                             placeholder="请输入内容"> -->
<!--                         <input type="text" id="account" name="account" class="layui-input form-input input-lenovoselect" -->
<!--                             data-th-placeholder="#{SysCommon.placeholder}"  -->
<!--                             data-parentids="accountType"  -->
<!--                             data-th-data-url="@{/valuation/trademanage/accountcurrentrate/AccountCurrentRate002/getAccNo1}" -->
<!--                             data-idfield="code" data-keyfield="code" data-th-data-effectivefieldsalias='|{"code":"#{AccountCurrentRate.accountId}","shortName":"#{AccountCurrentRate.accountName}"}|' -->
<!--                             > -->
                    <select id="account" name="account"  class="layui-input form-input input-select" style="width:180px" multiple="multiple"
                        allowClear="true" showAll="true" placeholder="请选择账号" parentIds="accountType"
                         data-th-data-url="@{/valuation/trademanage/accountcurrentrate/AccountCurrentRate002/getAccNo}"> 
                      </select>
                    </div>
			</div>
            <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">利率类型</label>
                    <div class="layui-input-inline input-inline">
                       			 <input id="intType" name="intType" 
											 class="layui-input form-input input-select"  multiple="multiple"
                                             allowClear="true" data-th-data-result="${INT_TYPE}">
<!-- 							<select id="intType" name="intType" -->
<!--                             class="layui-input form-input input-select" -->
<!--                             data-th-data-result='${ACCT_TYPE}' allowClear="true" -->
<!--                             multiple="multiple" placeholder="请输入内容"  -->
<!--                             data-th-placeholder="#{SysCommon.placeholder}"> -->
                        </select>
                                    	
                    </div>
            </div>
			</div>
		</form>
	</div>
	<div ><table id="dataTable" lay-filter="dataTableFilter"></table></div>
</div>
<div layout:fragment="script">

	<script
		data-th-src="@{/js/valuation/trademanage/accountcurrentrate/AccountCurrentRate001.js}"
		type="text/javascript"></script>
    <script type="text/javascript">
    function js_method(obj,basePath){
        var data={};
        data.status="A";
        data.intRateId=obj
//         var temp = "?intRateId="+obj;
        var newTab = {
             pageId: "ValIntRateQuote001",
             title: '利率信息',
             url:basePath +'valuation/basedata/marketdata/intratequote/ValIntRateQuote001/init',
             id: 'VALINFOSERVICE_001_004_005', 
             icon: ''
         };
        var temp="?";
        for(var item in data){
            var jValue=data[item];//key所对应的value
            //可批量导出删除模板的Obj
            if(temp.length!=1){
                temp+="&";
            }
            temp=temp+item+"="+jValue+" ";
            //把需要传递的参数加在地址后面
        }
        
        
       
        newTab.url+=temp;
         top.tab.tabAdd(newTab);
         $('div[lay-item-id='+newTab.id+'] iframe', top.window.document.body).attr('src',newTab.url);
        
        
    }
    
    </script>
</div>
</html>
