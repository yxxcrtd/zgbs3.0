<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title th:text="#{TrdFixIncomeValuDuration002}">固收类存续期新建</title>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
            <form id="submitForm" class="layui-form joyin-form-wrap pro-module-form">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdFixIncomeValuDuration.tradeId}">交易编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeId" name="tradeId"
                                               required disabled
                                               placeholder="提交后自动生成，无需填写"
                                               class="layui-input form-input"
                                               data-th-value="${entity?.tradeId}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdFixIncomeValuDuration.prodName}">产品名称</label>
                                    <div class="layui-input-inline input-inline" >
                                        <select id="prodId" name="prodId" required
                                                class="layui-input form-input input-select"
                                                data-th-data-url="@{/valuation/trademanage/trdfixincomevaluduration/TrdFixIncomeValuDuration001/getFinprodId}"
                                                allowClear="true" placeholder="请输入内容"
                                                data-th-initValue="${entity?.prodId}" >
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdFixIncomeValuDuration.prodId}">产品代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="prodName" name="prodName" required disabled
                                                class="layui-input form-input" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${entity?.prodName}">
                                    </div>
                                </div>
                            </div>

                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdFixIncomeValuDuration.assetName}">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="assetId" name="assetId" required
                                                class="layui-input form-input input-select"
                                                data-th-data-url="@{/valuation/trademanage/trdfixincomevaluduration/TrdFixIncomeValuDuration001/getAssetId}"
                                                allowClear="true"
                                                data-th-initValue="${entity?.assetId}"
                                                placeholder="请输入内容">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdFixIncomeValuDuration.assetId}">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="assetName" name="assetName"
                                               class="layui-input form-input"
                                               required disabled
                                               data-th-value="${entity?.assetName}"
                                               placeholder="请输入内容">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdFixIncomeValuDuration.ps}">交易类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="ps" name="ps" required
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-result='${PS}'
                                                allowClear="true"
                                                formatoption="true"
                                                data-th-initValue="${entity?.ps}">
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdFixIncomeValuDuration.invAim}">会计分类</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="invAim" name="invAim" required
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${INV_AIM}' allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption="true"
                                                data-th-initValue="${entity?.invAim}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdFixIncomeValuDuration.ccy}">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select  type="text" id="ccy" name="ccy" required
                                                 class="layui-input form-input input-select"
                                                 placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                 th:data-result='${CCY}'
                                                 allowClear="true"
                                                 formatoption="true"
                                                 th:initValue="*{entity?.ccy?:CCY_default}"></select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="pro-module-wrap" th:id="value_div">
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">清算信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdFixIncomeValuDuration.tradeDate}">计划支付日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeDate" name="tradeDate" required
                                               class="layui-input form-input input-dateSelect"
                                               placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${#dates.format(entity?.tradeDate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdFixIncomeValuDuration.settleDate}">资金到账日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input id="settleDate" name="settleDate" required
                                               class="layui-input form-input input-dateSelect"
                                               placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${#dates.format(entity?.settleDate?:iPlatformDate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdFixIncomeValuDuration.actCapi}">实收本金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" th:id="actCapi" th:name="actCapi" required
                                               class="layui-input form-input text-number"
                                               maxlength="28" data-textrange="2" data-fixtype="2"
                                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.actCapi?:0}"/>
                                    </div>
                                </div>
                            </div>

                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wra"
                                           data-th-text="#{TrdFixIncomeValuDuration.actInt}">实收利息</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="actInt" name="actInt"
                                               class="layui-input form-input text-number"
                                               maxLength="28" data-textrange="2" data-fixtype="2"
                                               placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                               required th:value="${entity?.actInt?:0}"/>
                                    </div>
                                </div>
                                <div  class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdFixIncomeValuDuration.isClean2}">是否结清</label>
                                    <div class="layui-input-inline input-inline" required>
                                        <select id="isClean2" name="isClean2"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${YES_OR_NO}' allowClear="true"
                                                th:initValue="${entity?.isClean2?:YES_OR_NO_N}"
                                                data-th-placeholder="#{SysCommon.placeholder}" >
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdFixIncomeValuDuration.settleAmt}">结算金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="settleAmt" name="settleAmt" required
                                                class="layui-input form-input text-number" placeholder="请输入内容"
                                                maxLength="28" data-textrange="2" data-fixtype="2"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${entity?.settleAmt}" />
                                    </div>
                                </div>
                            </div>
                            
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdFixIncomeValuDuration.myAcctNo}">资金账户</label>
                                    <div class="layui-input-inline input-inline" >
                                        <select id="myAcctNo" name="myAcctNo" required parentIds="prodId"
                                                class="layui-input form-input input-select"
                                                data-th-data-url="@{/valuation/trademanage/trdfixincomevaluduration/TrdFixIncomeValuDuration002/getTrdAcctId}"
                                                allowClear="true" placeholder="请输入内容"
                                                data-th-initValue="${entity?.myAcctNo}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
        <div class="layui-form-item">
            <div align="center" style="height:50px;padding-top: 10px;">

                <a id="TrdFixIncomeValuDuration002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                <a id="TrdFixIncomeValuDuration002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="TrdFixIncomeValuDuration002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>

    </div>
</div>
<div layout:fragment="script">
    <script th:src="@{/js/valuation/trademanage/trdfixincomevaluduration/TrdFixIncomeValuDuration002.js}" type="text/javascript"></script>
</div>
</body>
</html>
