<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{TrdFxForwardValuationTrade002}">外汇远期交易新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
				<form id="basicInfoForm" class="layui-form joyin-form-wrap pro-module-form">
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdFxForwardValuationTrade001.tradeId}">交易编号</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="tradeId"
												   data-th-value="${entity?.tradeId}"
												   class="layui-input form-input" placeholder="请输入内容" disabled
												   data-th-placeholder="#{SysCommon.placeholder}" >
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdFxForwardValuationTrade001.outTradeId}">外部交易编号</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="outTradeId"
												   data-th-value="${entity?.outTradeId}"
												   class="layui-input form-input" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}" >
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxForwardValuationTrade001.portfolioName}">产品名称</label>
										<div class="layui-input-inline input-inline">
											<select id="portfolioId" name="portfolioId" th:initValue="${entity?.portfolioId}"
													class="layui-input form-input input-select available" required
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-data-url="@{/valuation/trademanage/trdfxforwardvaluationtrade/TrdFxForwardValuationTrade002/findPortfolioId}">
											</select>
										</div>
									</div>
								</div>

								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdFxForwardValuationTrade001.portfolioId}">产品代码</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="portfolioName" name="portfolioName"
												   data-th-value="${entity?.portfolioName}" required
												   class="layui-input form-input" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}" disabled>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdFxForwardValuationTrade002.curPair}">货币对</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="curPair" name="curPair"
													class="layui-input form-input input-select"
													data-th-data-result="${CYY_PAIR}" required
													allowClear="true"  placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-initValue="${entity?.curPair}">
											</select>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxForwardValuationTrade001.ps}">交易类型</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="ps" name="ps"
													class="layui-input form-input input-select"
													data-th-data-result='${PS}' allowClear="true"
													placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
													required="required" formatoption="true"
													data-th-initValue="${entity?.ps}">
											</select>
										</div>
									</div>
								</div>

								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxForwardValuationTrade002.tradeDate}">交易日期</label>
										<div class="layui-input-inline input-inline">
											<input id="tradeDate" name="tradeDate" required
												   class="layui-input form-input input-dateSelect hidden"
												   data-th-value='${#dates.format(entity?.tradeDate,"yyyy-MM-dd")}'>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxForwardValuationTrade002.settleDate}">交割日期</label>
										<div class="layui-input-inline input-inline">
											<input id="settleDate" name="settleDate" required
												   class="layui-input form-input input-dateSelect hidden"
												   data-th-value='${#dates.format(entity?.settleDate,"yyyy-MM-dd")}'>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxForwardValuationTrade002.termDate}">期限</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="termDate" name="termDate" required="required"
													class="layui-input form-input input-select" allowClear="true"
													placeholder="请输入内容" data-th-data-result='${TERM_DATE}'
													data-th-initvalue="${entity?.termDate}"
													data-th-placeholder="#{SysCommon.placeholder}">
											</select>
										</div>
									</div>
								</div>
									
								<div class="layui-form-item">

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxForwardValuationTrade002.settMode}">清算模式</label>
										<div class="layui-input-inline input-inline">
											<select id="settMode" name="settMode"
													data-th-data-result="${SETT_MODE}"
													th:initvalue="*{entity?.settMode}" class="layui-input form-input input-select" placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}" required>
											</select>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxForwardValuationTrade002.pricedDate}">定价日</label>
										<div class="layui-input-inline input-inline">
											<input id="pricedDate" name="pricedDate"
												   class="layui-input form-input input-dateSelect hidden"
												   data-th-value='${#dates.format(entity?.pricedDate,"yyyy-MM-dd")}'>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxForwardValuationTrade002.refRate}">差额交割参考汇率</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="refRate" name="refRate"
													class="layui-input form-input input-select"
													placeholder="请输入内容" data-th-data-result='${DIF_REF_RATE}'
													data-th-initvalue="${entity?.refRate}"
													data-th-placeholder="#{SysCommon.placeholder}">
											</select>
										</div>
									</div>
								</div>

								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxForwardValuationTrade002.difPs}">差额收付方向</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="difPs" name="difPs"
													class="layui-input form-input input-select"
													placeholder="请输入内容" data-th-data-result='${CD_FLAG_OFF}'
													data-th-initvalue="${entity?.difPs}"
													data-th-placeholder="#{SysCommon.placeholder}">
											</select>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="pro-module-wrap" id="value_div_sq">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">金额信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxForwardValuationTrade002.unitCprice}">即期汇率</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="unitCprice" name="unitCprice" maxLength="16" required
												    th:value="${entity?.unitCprice}" class="layui-input form-input text-number rateCal"
												   data-textrange="4" data-fixtype="4" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxForwardValuationTrade002.unitInt}">远期点</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="unitInt" name="unitInt" maxLength="16" required
												   th:value="${entity?.unitInt}" class="layui-input form-input text-number rateCal"
												   data-textrange="4" data-fixtype="4" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxForwardValuationTrade002.unitFprice}">远期全价</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="unitFprice" name="unitFprice" maxLength="16" required disabled
												   th:value="${entity?.unitFprice}" class="layui-input form-input text-number rateCal"
												   data-textrange="4" data-fixtype="4" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>

								</div>

								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxForwardValuationTrade002.dealCur}">交易货币</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="dealCur" name="dealCur" required="required"
													parentIds="curPair"
													class="layui-input form-input input-select" placeholder="请输入内容"
													th:placeholder="#{SysCommon.placeholder}" th:data-result='${CCY}'
													allowClear="true" formatoption="true" th:initValue="${entity?.dealCur}"></select>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxForwardValuationTrade002.dealCurAmt}">交易货币金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="dealCurAmt" name="dealCurAmt" maxLength="16" required
												   th:value="${entity?.dealCurAmt}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxForwardValuationTrade002.corCcy}">对应货币</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="corCcy" name="corCcy" required="required"
													parentIds="curPair" disabled
													class="layui-input form-input input-select" placeholder="请输入内容"
													th:placeholder="#{SysCommon.placeholder}" th:data-result='${CCY}'
													allowClear="true" formatoption="true" th:initValue="${entity?.corCcy}"></select>
										</div>
									</div>
								</div>


								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxForwardValuationTrade002.corCcyAmt}">对应货币金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="corCcyAmt" name="corCcyAmt" maxLength="16" required disabled
												   th:value="${entity?.corCcyAmt}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxForwardValuationTrade002.pricedDateRate}">定价日即期汇率</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="pricedDateRate" name="pricedDateRate" maxLength="16"
												   th:value="${entity?.pricedDateRate}" class="layui-input form-input text-number rateCal"
												   data-textrange="4" data-fixtype="4" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxForwardValuationTrade002.usdAmt}">折美元金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="usdAmt" name="usdAmt" maxLength="16" required
												   th:value="${entity?.usdAmt}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="pro-module-wrap" th:id="value_div">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">费用信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxForwardValuationTrade002.procedureAmt}">交易手续费</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="procedureAmt" name="procedureAmt" maxLength="16"
												   required th:value="${entity?.procedureAmt}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxForwardValuationTrade002.feeAmtQT}">结算服务费</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="settleServiceAmt" name="settleServiceAmt" maxLength="16"
												   required th:value="${entity?.settleServiceAmt}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxForwardValuationTrade002.feeAmtQT}">其他费用</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="feeAmtQT" name="feeAmtQT" maxLength="16"
												   required th:value="${entity?.feeAmtQT}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="pro-module-wrap" th:id="value_div">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">汇总信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxForwardValuationTrade002.mdateSettleAmt}">结算金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="mdateSettleAmt" name="mdateSettleAmt" maxLength="16"
												   required th:value="${entity?.mdateSettleAmt}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
									<div class="form-inline-wrap" >
										<label class="layui-form-label form-lable" >资金账户</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="trdAcctId" name="trdAcctId" class="layui-input form-input input-select" parentIds="portfolioId"
													th:data-url="@{/valuation/trademanage/trdfxforwardvaluationtrade/TrdFxForwardValuationTrade002/getTrdAcctId}"
													allowClear="true" placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}">
											</select>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

				</form>
                <div class="layui-form-item">
                    <div align="center" style="height:50px;padding-top: 10px;">
                        <a id="TrdFxForwardValuationTrade002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                        <a id="TrdFxForwardValuationTrade002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="TrdFxForwardValuationTrade002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
         </div>
    </div>
    </div>
    <div layout:fragment="script">
    	<script data-th-inline="javascript" type="text/javascript">
    			var PS_T01 = /*[[${PS_T01}]]*/'';
    			var YES = /*[[${YES}]]*/'';
    			var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
    			var finprodId = /*[[${finprodId}]]*/'';
    			var CCY = /*[[${CCY}]]*/'';
    			var FINPROD_TYPE_F17 = /*[[${FINPROD_TYPE_F17}]]*/'';
                var tradeId = /*[[${tradeId}]]*/'';
                var PS_T02 = /*[[${PS_T02}]]*/'';
		</script>
    	<script data-th-src="@{/js/valuation/trademanage/trdfxforwardvaluationtrade/TrdFxForwardValuationTrade002.js}">
    	</script>
    </div>
</body>
</html>
