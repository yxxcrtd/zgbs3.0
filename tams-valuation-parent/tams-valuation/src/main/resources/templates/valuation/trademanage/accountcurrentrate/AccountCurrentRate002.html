<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>账户活期利率查询</title>
</head>
<body>
</body>
<div layout:fragment="content">
		<form class="layui-form" id="submitForm">
			<div class="layui-form-item">			
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-lable">账号/账户名</label>
					<div class="layui-input-inline input-inline">
<!--                         <select type="text" id="accountId" name="accountId"  -->
<!--                         class="layui-input form-input input-select" data-th-required="${!notEditOrgCode}" -->
<!--                         data-th-initvalue="${entity?.accountId}"  -->
<!--                         data-th-disabled="${notEditOrgCode}" -->
<!--                         data-th-data-url="@{/valuation/trademanage/accountcurrentrate/AccountCurrentRate002/getAccNo}" -->
<!--                         data-parentid="accountType" -->
<!--                         placeholder="请输入内容"></select> -->
                        
                        <input type="text" id="accountId" name="accountId" class="layui-input form-input input-lenovoselect"
                            data-th-placeholder="#{SysCommon.placeholder}" 
                            data-th-data-url="@{/valuation/trademanage/accountcurrentrate/AccountCurrentRate002/getAccNo1}"
                            data-parentids="accountType"
                            data-idfield="code" data-keyfield="code" data-th-data-effectivefieldsalias='|{"code":"#{AccountCurrentRate.accountId}","shortName":"#{AccountCurrentRate.accountName}"}|'
                            data-th-value="${entity?.accountId}"
                            data-th-disabled="${notEditOrgCode}"
                            data-th-required="${!notEditOrgCode}"
                            >
                    </div>
<!--                       data-parentids="accountType"  -->
<!--                         data-th-data-result='${AcctNo}'  -->
			</div>
            <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">账户类型</label>
                    <div class="layui-input-inline input-inline">
                        <input id="accountType" name="accountType"
                            class="layui-input form-input input-select" 
                            data-th-initvalue="${entity?.accountType}"
                             placeholder="帐户选择后自动生成" 
                            data-th-data-result='${ACCT_TYPE}' 
                            allowClear="false"
                            data-th-disabled="${notEditOrgCode}"
                        >
                    </div>
<!--                     data-th-initvalue="${entity?.accountType}" -->
                </div>
			</div>
            <div class="layui-form-item"> 
                <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable">计息基础</label>
                   <div class="layui-input-inline input-inline">
										 <input id="basis" name="basis" data-th-initvalue="${entity?.basis}"
											 class="layui-input form-input input-checkbox"  data-th-required="true"
                                             data-th-data-result="${BASIS}" data-th-disabled="${newOrEdit}">
									</div>
                </div>
<!--                 <div class="layui-inline layui-col-md6"> -->
<!--                 <label class="layui-form-label form-lable">利率结构</label> -->
<!--                    <div class="layui-input-inline input-inline"> -->
<!-- 										 <input id="intRateStructure" name="intRateStructure" data-th-disabled="${newOrEdit}" data-th-initvalue="${entity?.intRateStructure}" -->
<!-- 											 class="layui-input form-input input-checkbox" allowClear="true" data-th-required="true" -->
<!--                                               data-result="[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;单层结构&quot;,&quot;col&quot;:&quot;&quot;}]" -->
<!--                                              > -->
<!--                                              data-th-initvalue="${entity?.intRateStructure}"  -->
<!-- 										data-th-data-result="${INT_RATE_STRUCTURE}" -->
<!-- 									</div> -->
<!--                 </div> -->
                <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable">利率类型</label>
                	<div class="layui-input-inline input-inline">
										 <input id="intType" name="intType" data-th-initvalue="${entity?.intType}" data-th-disabled="${newOrEdit}"
											 class="layui-input form-input input-checkbox" allowClear="true" data-th-required="true"data-th-data-result="${INT_TYPE}">
										
									</div>
                </div>
              </div>
             <div class="layui-form-item"> 
                 <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable">生效日</label>
                <div class="layui-input-inline input-inline">
                                        <input type="text" id="effDate" name="effDate" data-th-required="true"
                                        data-th-value="${entity?.effDate}" 
                                        class="layui-input form-input input-dateSelect" 
                                        >
                                    </div>
                </div>
             
             
                <div class="layui-inline layui-col-md6" id="dRate" >
                <label class="layui-form-label form-lable">利率</label>
                <div class="layui-input-inline input-inline input-inline-wrap">
                                        <input type="text" id="rate" name="rate"  data-th-value="${entity?.rate}"
                                            data-th-disabled="${!IntType}" data-textrange="4" data-th-required="true"
                                            class="layui-input form-input text-number" maxlength='7'>
                                            <span class="input-right-show">%</span>
                                    </div>
                </div>
                <div class="layui-inline layui-col-md6" id="dBasicRate" >
                <label class="layui-form-label form-lable">基准利率</label>
                <div class="layui-input-inline input-inline">
                                        <select type="text" id="basicRate" name="basicRate"  data-th-data-result="${BasicRate}"
                                           class="layui-input form-input input-select" data-th-initvalue="${entity?.basicRate}" 
                                            data-th-disabled="${(IntType)}" data-th-required="true" 
                                            ></select>
                                            
                                            
                                            
                                    </div>
                </div>
              
              </div>
<!--                <div class="layui-form-item">  -->
              
                
<!--               </div> -->
              <div class="layui-form-item">
                <div class="text-center">
                    <a id="AccountCurrentRate002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a> <a
                    id="AccountCurrentRate002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
                </div>
            </div>
		</form>
          <input type="text" id="workflowId" name="workflowId" class="layui-input form-input" data-th-value="${workflowId}" disabled="disabled" style = "display:none;">
	      <input type="text" id="cashId" name="cashId" class="layui-input form-input"  data-th-value="${entity?.cashId}" disabled="disabled" style = "display:none;">
           <input type="text" id="effDate1" name="effDate1" class="layui-input form-input"  data-th-value="${entity?.effDate}" disabled="disabled" style = "display:none;">
</div>
<div layout:fragment="script">
	<script
		data-th-src="@{/js/valuation/trademanage/accountcurrentrate/AccountCurrentRate002.js}"
		type="text/javascript"></script>
        </script>
</div>
</html>
