<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title>双击查看基金类资产(货币型)</title>
<script type="text/javascript">
    
</script>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm" style="background: #ffffff; padding: 10px 0;">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">账号</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="acctNo" name="acctNo" class="layui-input form-input"
                            data-th-value="${entity?.acctNo}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">账户名</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="acctName" name="acctName" class="layui-input form-input"
                            data-th-value="${entity?.acctName}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">账户类型</label>
                    <div class="layui-input-inline input-inline">
                        <select id="acctTypeCode" name="acctTypeCode" class="layui-input form-input input-select"
                            data-th-data-result="${ACCT_TYPE}" allowClear="true"
                            data-th-initValue="${entity?.acctTypeCode}">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable"> 开户行 </label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="bankDep" name="bankDep" class="layui-input form-input "
                            data-th-value="${entity?.bankDep}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">行内行外</label>
                    <div class="layui-input-inline input-inline">
                        <input id="inOutBankCode" name="inOutBankCode" class="layui-input form-input input-checkbox"
                            data-th-data-result="${IN_OUT_BANK}" data-th-initValue="${entity?.inOutBankCode}"
                            disabled="">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable"> 开户行联行行号 </label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="corrNo" name="corrNo" class="layui-input form-input "
                            data-th-value="${entity?.corrNo}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">大额支付系统号</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="largePayno" name="largePayno" class="layui-input form-input "
                            data-th-value="${entity?.largePayno}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">境内境外</label>
                    <div class="layui-input-inline input-inline">
                        <input id="blnAreaCode" name="blnAreaCode" class="layui-input form-input input-checkbox"
                            data-th-data-result="${BLN_AREA}" data-th-initValue="${entity?.blnAreaCode}" disabled="">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable"> SWIFT CODE </label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="swiftCode" name="swiftCode" class="layui-input form-input "
                            data-th-value="${entity?.swiftCode}">
                    </div>
                </div>
            </div>
        </form>
    </div>
</body>
</html>
