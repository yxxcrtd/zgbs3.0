<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>缴纳增值税查询</title>
</head>

<body>

<div layout:fragment="content">
		<div class="form-button-area">      
             <a id="PayTheVatQuery001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>    
             <button type="button" class="layui-btn layui-btn-sm btn-default" id="PayTheVatQuery001_btn_delete"><i class="iconfont icon-revoke"></i>撤销</button>     
        </div>
		<div class="joyin-form-wrap joyin-filter-form condition-area">
			<form class="layui-form" id="searchForm">
				<div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">交易编号</label>
                        <div class="layui-input-inline input-inline">
                          <input type="text" id="tradeId" name="tradeId" class="layui-input form-input" placeholder="请输入内容" value="">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">账套代码</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id=booksetId name="booksetId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{getBooksetId}"
                                multiple="multiple" allowClear="true" >
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">类型</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="taxidenType" name="taxidenType" class="layui-input form-input input-checkbox"
                              data-th-data-result="${PS}">
                        </div>
                    </div>
              	</div>
                <div class="layui-form-item">
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">缴税/退税日期</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="vatDate" name="vatDate"
							class="layui-input form-input input-dateRangeSelect" value=""
							placeholder="请选择，支持区间">
					</div>
				</div>
			</div>
		</form>
		</div>
		<div>
			<table id="dataTable"></table>
		</div>
	</div>
</body>
<div layout:fragment="script">
	<script 
		data-th-src="@{/js/valuation/trademanage/paythevatquery/PayTheVatQuery001.js}"
		type="text/javascript"></script>
</div>

</html>
