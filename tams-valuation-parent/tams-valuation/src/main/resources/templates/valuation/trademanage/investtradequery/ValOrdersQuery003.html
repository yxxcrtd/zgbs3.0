                                        data-th-value="${entity?.isClean}"
                                        data-th-checked="${entity?.isClean} eq 'Y'"
                                        lay-text="是|否" >
                                </div>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md6">
                            <label class="layui-form-label form-lable">通道费</label>
                            <div class="layui-input-inline input-inline">
                                <input id="tdFeeAmt" name="tdFeeAmt"
                                    class="layui-input form-input text-money" allowClear="true"
                                    data-th-value="${entity?.tdFeeAmt}">
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md6">
                            <label class="layui-form-label form-lable">结算金额</label>
                            <div class="layui-input-inline input-inline">
                                <input id="settleAmt" name="settleAmt"
                                    class="layui-input form-input text-money"
                                    data-th-value="${entity?.settleAmt}">
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
