<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>TA交易-明细查询</title>
<script th:inline="javascript">
    var s_finprodId = [[${finprodId}]];
    var s_settleDate = [[${settleDate}]];
    var s_hasChildren = [[${hasChildren}]];// 是否含有子节点
    var s_pFinprodId = [[${pFinprodId}]];
</script>
</head>
<body>
</body>
<div layout:fragment="content">
    <div class="layui-row" style="margin: 15px 20px 10px;line-height: 32px">
        <div class="layui-col-md8">
            <span id="commonDealTable-title"
                data-th-text="|产品类型：${profitType}  &nbsp;&nbsp;&nbsp;&nbsp;  确认日期：${settleDate} |"
                style="display: none;"></span> 
            <span id="parentDealTable-title"
                data-th-text="|母产品代码：${finprodId} &nbsp;&nbsp;&nbsp;&nbsp; 母产品简称：${finprodAbbr}  &nbsp;&nbsp;&nbsp;&nbsp;  产品类型：${profitType}  &nbsp;&nbsp;&nbsp;&nbsp;  确认日期：${settleDate} |"
                style="display: none;"></span> 
            <span id="childDealTable-title"
                data-th-text="|子产品代码：${finprodId} &nbsp;&nbsp;&nbsp;&nbsp; 子产品简称：${finprodAbbr}  &nbsp;&nbsp;&nbsp;&nbsp;  产品类型：${profitType}  &nbsp;&nbsp;&nbsp;&nbsp;  确认日期：${settleDate} |"
                style="display: none;"></span>
        </div>
        <div class="layui-col-md1 layui-col-md-offset3">
            <button type="button" class="layui-btn layui-btn-sm btn-export" id="ProductTradeDealQuery002_btn_export">导出</button>
        </div>
    </div>
    <div class="dealtable">
        <div id="c_commonDealTable" style="display: none;">
            <div id="commonDealTable"></div>
        </div>
	    <div id="c_parentDealTable" style="display: none;">
	        <div id="parentDealTable"></div>
	    </div>
	    <div id="c_childDealTable" style="display: none;">
	        <div id="childDealTable"></div>
	    </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/trademanage/producttradedeal/ProductTradeDealQuery002.js}"
        type="text/javascript"></script>
</div>
</html>
