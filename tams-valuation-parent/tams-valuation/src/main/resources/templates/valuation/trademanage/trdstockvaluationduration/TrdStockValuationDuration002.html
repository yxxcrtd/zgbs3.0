<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title th:text="#{TrdStockValuationDuration002}">股票存续期管理新建</title>
</head>
<body>
<div layout:fragment="content">
    <style type="text/css">
        .layui-form-radio {
            line-height: 24px;
            padding-right: 0px;
            margin: 0px;
        }
        .layui-form-radio div {
            font-size: 12px;
        }
        .layui-form-radio i{
            font-size: 14px;
        }
    </style>
    <div class="pro-module-container" style="margin-bottom: 20px;">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base" >
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" >基础信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdStockValuationDuration.tradeId}">交易编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeId" name="tradeId"
                                               required disabled
                                               placeholder="提交后自动生成，无需填写"
                                               class="layui-input form-input"
                                               data-th-value="${entity?.tradeId}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdStockValuationDuration.prodId}">产品代码</label>
                                        <div class="layui-input-inline input-inline" >
                                            <select id="prodId" name="prodId" required
                                                    class="layui-input form-input input-select"
                                                    data-th-data-url="@{/valuation/trademanage/trdstockvaluationduration/TrdStockValuationDuration002/getFinprodId}"
                                                     allowClear="true" placeholder="请输入内容"
                                                    th:formatoption="false"
                                                    data-th-initValue="${entity?.prodId}" >
                                            </select>
                                        </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdStockValuationDuration.prodName}">产品名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="prodName" name="prodName" required disabled
                                                class="layui-input form-input" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${entity?.prodName}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdStockValuationDuration.assetId}">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="assetId" name="assetId" required
                                                class="layui-input form-input input-select"
                                                data-th-data-url="@{/valuation/trademanage/trdstockvaluationduration/TrdStockValuationDuration002/getAssetId}"
                                                allowClear="true"
                                                th:formatoption="false"
                                                data-th-initValue="${entity?.assetId}"
                                                placeholder="请输入内容">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdStockValuationDuration.assetAbbr}">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="assetAbbr" name="assetAbbr"
                                               class="layui-input form-input"
                                               required disabled
                                               data-th-value="${entity?.assetAbbr}"
                                               placeholder="请输入内容">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdStockValuationDuration.ps}">交易类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="ps" name="ps" required
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-result='${STOCK_DEVISION_TYPE}'
                                                allowClear="true"
                                                formatoption="true"
                                                data-th-initValue="${entity?.ps}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdStockValuationDuration.ccy}">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select  type="text" id="ccy" name="ccy" required
                                                 class="layui-input form-input input-select"
                                                 placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                 th:data-result='${CCY}'
                                                 allowClear="true"
                                                 formatoption="true"
                                                 th:initValue="*{entity?.ccy?:CCY_default}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdStockValuationDuration.exRightsDate}">除权（除息）日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="exRightsDate" name="exRightsDate" required
                                               class="layui-input form-input input-dateSelect"
                                               placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${#dates.format(entity?.exRightsDate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
            <div class="pro-module-wrap" id="xjfh">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">清算信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdStockValuationDuration.regDate}">权益登记日</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="regDate" name="regDate" required
                                           class="layui-input form-input input-dateSelect"
                                           placeholder="请输入内容"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value='${#dates.format(entity?.regDate,"yyyy-MM-dd")}'>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdStockValuationDuration.dividDate}">派息日</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="dividDate" name="dividDate" required
                                           class="layui-input form-input input-dateSelect"
                                           placeholder="请输入内容"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value='${#dates.format(entity?.dividDate,"yyyy-MM-dd")}'>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdStockValuationDuration.amount}">权益登记日股本</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="amount" name="amount" required maxLength="30"
                                           class="layui-input form-input text-number"
                                           data-textrange="0"
                                           th:value="${entity?.actInt}"
                                           placeholder="请输入内容">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdStockValuationDuration.bonusAmt}">分红金额</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="bonusAmt" name="bonusAmt" maxLength="28"
                                           class="layui-input form-input text-number"
                                           data-textrange="2" data-fixtype="2"
                                           th:value="${entity?.actCapi}"
                                           placeholder="请输入内容">
                                </div>
                            </div>
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdStockValuationDuration.settleAmt}">结算金额</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text" id="settleAmt" name="settleAmt" required
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.settleAmt}" />
                                </div>
                            </div>
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdStockValuationDuration.myAcctNo}">资金账户</label>
                                <div class="layui-input-inline input-inline" >
                                    <select id="myAcctNo" name="myAcctNo"
                                            class="layui-input form-input input-select" required
                                            data-th-data-url="@{/valuation/trademanage/trdstockvaluationduration/TrdStockValuationDuration002/getTrdAcctId}"
                                            allowClear="true" placeholder="请输入内容"
                                            data-th-initValue="${entity?.myAcctNo}">
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pro-module-wrap" id="sz">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">清算信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdStockValuationDuration.regDate}">权益登记日</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="regDate_sz" name="regDate_sz" required
                                           class="layui-input form-input input-dateSelect"
                                           placeholder="请输入内容"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value='${#dates.format(entity?.regDate_sz,"yyyy-MM-dd")}'>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdStockValuationDuration.dividDate}">派息日</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="dividDate_sz" name="dividDate_sz" required
                                           class="layui-input form-input input-dateSelect"
                                           placeholder="请输入内容"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value='${#dates.format(entity?.dividDate_sz,"yyyy-MM-dd")}'>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdStockValuationDuration.amount}">权益登记日股本</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="amount_sz" name="amount_sz" required maxLength="30"
                                           class="layui-input form-input text-number"
                                           data-textrange="0"
                                           th:value="${entity?.actInt_sz}"
                                           placeholder="请输入内容">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdStockValuationDuration.devidentAmt}">分红股本</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="devidentAmt_sz" name="devidentAmt_sz"  required maxLength="30"
                                           class="layui-input form-input text-number"
                                           data-textrange="0"
                                           th:value="${entity?.devidentAmt_sz}"
                                           placeholder="请输入内容">
                                </div>
                            </div>
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdStockValuationDuration.myAcctNo}">资金账户</label>
                                <div class="layui-input-inline input-inline" >
                                    <select id="myAcctNo_sz" name="myAcctNo_sz"
                                            class="layui-input form-input input-select" required
                                            data-th-data-url="@{/valuation/trademanage/trdstockvaluationduration/TrdStockValuationDuration002/getTrdAcctId}"
                                            allowClear="true" placeholder="请输入内容"
                                            data-th-initValue="${entity?.myAcctNo_sz}">
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pro-module-wrap" id="fhsz">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">清算信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdStockValuationDuration.regDate}">权益登记日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="regDate_fhsz" name="regDate_fhsz" required
                                               class="layui-input form-input input-dateSelect"
                                               placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${#dates.format(entity?.regDate_fhsz,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdStockValuationDuration.dividDate}">派息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="dividDate_fhsz" name="dividDate_fhsz" required
                                               class="layui-input form-input input-dateSelect"
                                               placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${#dates.format(entity?.dividDate_fhsz,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdStockValuationDuration.amount}">权益登记日股本</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="amount_fhsz" name="amount_fhsz" required maxLength="30"
                                               class="layui-input form-input text-number"
                                               data-textrange="0"
                                               th:value="${entity?.actInt_fhsz}"
                                               placeholder="请输入内容">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdStockValuationDuration.bonusAmt}">分红金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="bonusAmt_fhsz" name="bonusAmt_fhsz" maxLength="28"
                                               class="layui-input form-input text-number"
                                               data-textrange="2" data-fixtype="2"
                                               th:value="${entity?.actCapi_fhsz}"
                                               placeholder="请输入内容">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdStockValuationDuration.devidentAmt}">分红股本</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="devidentAmt_fhsz" name="devidentAmt_fhsz"  maxLength="30"
                                               class="layui-input form-input text-number"
                                               data-textrange="0"
                                               th:value="${entity?.devidentAmt_fhsz}"
                                               placeholder="请输入内容">
                                    </div>
                                </div>
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdStockValuationDuration.settleAmt}">结算金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="settleAmt_fhsz" name="settleAmt_fhsz" required
                                                class="layui-input form-input text-number" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${entity?.settleAmt_fhsz}" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdStockValuationDuration.myAcctNo}">资金账户</label>
                                    <div class="layui-input-inline input-inline" >
                                        <select id="myAcctNo_fhsz" name="myAcctNo_fhsz"
                                                class="layui-input form-input input-select" required
                                                data-th-data-url="@{/valuation/trademanage/trdstockvaluationduration/TrdStockValuationDuration002/getTrdAcctId}"
                                                allowClear="true" placeholder="请输入内容"
                                                data-th-initValue="${entity?.myAcctNo_fhsz}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </form>

        <input type="text" id="workflowId" name="workflowId" class="layui-input form-input" data-th-value="${workflowId}" disabled="disabled" style = "display:none;">

        <div class="row text-center" style="margin: 20px 0;">
            <a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save"
               data-th-text="#{SysCommon.save}">保存</a>
            <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit"
               data-th-text="#{SysCommon.submit}">提交</a>
            <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">

    </script>
    <script th:src="@{/js/valuation/trademanage/trdstockvaluationduration/TrdStockValuationDuration002.js}" type="text/javascript"></script>
</div>
</body>
</html>
