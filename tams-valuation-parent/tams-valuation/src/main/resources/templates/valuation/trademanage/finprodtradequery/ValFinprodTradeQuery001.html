<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>金融产品交易查询</title>
</head>
<body>

</body>
<div layout:fragment="content">
    <div class="form-button-area" >
        <a id="ValFinprodTradeQuery001_btn_delete" class="layui-btn layui-btn-sm"><i class="iconfont icon-export"></i><span>删除</span></a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">业务类型</label>
                    <div class="layui-input-inline input-inline">
                        <input id="busiType" name="busiType" class="layui-input form-input input-select" placeholder="请选择" data-th-data-result="${BUSI_TYPE}" allowClear="true" multiple="multiple" data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                      <label class="layui-form-label form-lable">理财产品代码</label>
                      <div class="layui-input-inline input-inline">
                           <select id="prodId" name="prodId" class="layui-input form-input input-select" 
                                  data-th-data-url="@{/valuation/trademanage/finprodtradequery/ValFinprodTradeQuery001/getFinprodId}" multiple="multiple"
                                  allowClear="true" placeholder="请输入内容">
                           </select>
                      </div>
                 </div>
<!--                 <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">理财产品代码</label>
                    <div class="layui-input-inline input-inline">
                    	<select id="prodId" name="prodId" class="layui-input form-input input-select" 
                                  data-th-data-result="${FINPRODID_LIST}" multiple="multiple"
                                  allowClear="true" placeholder="请输入内容">
                           </select>
                    </div>
                </div> -->
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">金融产品代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="finprodId" name="finprodId" class="layui-input form-input" value="" data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
            </div>
                <!-- <div class="layui-inline layui-col-md3">
                    <label class="layui-form-label form-lable">交易编号</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="tradeId" name="tradeId" class="layui-input form-input" data-th-placeholder="#{SysCommon.placeholder}" value="">
                    </div>
                </div> -->
                <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">交易方向</label>
                    <div class="layui-input-inline input-inline">
                        <input id="ps" name="ps" class="input-select" placeholder="请选择" data-th-data-result="${PS}" allowClear="true" multiple="multiple" data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4"> 
                     <label class="layui-form-label form-lable">交易日</label>
                     <div class="layui-input-inline input-inline"> 
                       <input type="text" id="tradeDate" name="tradeDate"  class="layui-input form-input input-dateRangeSelect" placeholder ="请选择、支持区间"> 
                     </div>
                </div> 
                <div class="layui-inline layui-col-md4"> 
                     <label class="layui-form-label form-lable">交割日</label>
                     <div class="layui-input-inline input-inline"> 
                       <input type="text" id="settleDate" name="settleDate"  class="layui-input form-input input-dateRangeSelect" placeholder ="请选择、支持区间"> 
                     </div>
                </div> 
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/trademanage/finprodtradequery/ValFinprodTradeQuery001.js}" type="text/javascript"></script>
</div>
</html>
