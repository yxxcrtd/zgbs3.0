<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>简易计税余额查询</title>
</head>
<body>
</body>
<div layout:fragment="content">
	<div class="form-button-area"></div>
	<div class="joyin-form-wrap joyin-filter-form condition-area">
		<form class="layui-form" id="searchForm">
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">产品代码</label>
					<div class="layui-input-inline input-inline">
						<select id="finprodId" name="finprodId"
							class="layui-input form-input input-select" allowClear="true"
							multiple="multiple"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-data-url="@{/valuation/trademanage/taxbalancequery/TaxBalanceQuery001/getBookSetId}">
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">业务类型</label>
					<div class="layui-input-inline input-inline">
						<select id="taxPType" name="taxPType"
							class="layui-input form-input input-select" placeholder="请选择"
							data-th-data-result="${TAX_P_TYPE}" allowClear="true" multiple="multiple"
							data-th-placeholder="#{SysCommon.placeholder}">
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">收入类型</label>
					<div class="layui-input-inline input-inline">
						<select id="vatType" name="vatType"
							class="layui-input form-input input-select" placeholder="请选择"
							data-th-data-result="${VAT_TYPE}" allowClear="true" multiple="multiple"
							data-th-placeholder="#{SysCommon.placeholder}">
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">查询日期</label>
					<div class="layui-input-inline input-inline">
						<input id="Date" name="Date" placeholder="请选择、支持区间"
							class="layui-input form-input input-dateRangeSelect">
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">资产代码</label>
					<div class="layui-input-inline input-inline">
						<select id="assetId" name="assetId"
							class="layui-input form-input input-select" allowClear="true"
							multiple="multiple"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-data-url="@{/valuation/trademanage/taxbalancequery/TaxBalanceQuery001/getAssetId}">
						</select>
					</div>
				</div>
				
				<div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
		      		<label class="layui-form-label form-lable">产品维度汇总展示</label>
			        <div class="layui-input-block input-inline">
		                <input type="checkbox" id="prdCheckBox" name="prdCheckBox"  lay-skin="switch" lay-text="是|否">
		            </div>
     			 </div>
			</div>
		</form>
	</div>
	<table class="layui-table" id="dataTable"></table>
</div>
<div layout:fragment="script">
	<script
		data-th-src="@{/js/valuation/trademanage/taxbalancequery/TaxBalanceQuery001.js}"
		type="text/javascript"></script>
</div>
</html>
