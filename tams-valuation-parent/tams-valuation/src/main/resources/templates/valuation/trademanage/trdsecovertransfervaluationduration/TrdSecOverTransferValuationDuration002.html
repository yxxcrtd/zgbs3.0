<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title th:text="#{TrdSecOverTransferValuationDuration002}">应收款转让管理新建</title>
</head>
<body>
<div layout:fragment="content">
    <style type="text/css">
        .layui-form-radio {
            line-height: 24px;
            padding-right: 0px;
            margin: 0px;
        }
        .layui-form-radio div {
            font-size: 12px;
        }
        .layui-form-radio i{
            font-size: 14px;
        }
    </style>
    <div class="pro-module-container" style="margin-bottom: 20px;">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base" >
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" >基础信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">交易编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeId" name="tradeId"
                                               required disabled
                                               placeholder="提交后自动生成，无需填写"
                                               class="layui-input form-input"
                                               data-th-value="${entity?.tradeId}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">产品代码</label>
                                        <div class="layui-input-inline input-inline" >
                                            <select id="prodId" name="prodId" required
                                                    class="layui-input form-input input-select"
                                                    data-th-data-url="@{/valuation/trademanage/trdsecovertransfervaluationduration/TrdSecOverTransferValuationDuration002/getFinprodId}"
                                                     allowClear="true" placeholder="请输入内容"
                                                    th:formatoption="false"
                                                    data-th-initValue="${entity?.prodId}" >
                                            </select>
                                        </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">产品名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="prodName" name="prodName" required disabled
                                                class="layui-input form-input" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${entity?.prodName}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="assetId" name="assetId" required
                                                class="layui-input form-input input-select"
                                                data-th-data-url="@{/valuation/trademanage/trdsecovertransfervaluationduration/TrdSecOverTransferValuationDuration002/getAssetId}"
                                                allowClear="true"
                                                th:formatoption="false"
                                                data-th-initValue="${entity?.assetId}"
                                                placeholder="请输入内容">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="assetAbbr" name="assetAbbr"
                                               class="layui-input form-input"
                                               required disabled
                                               data-th-value="${entity?.assetAbbr}"
                                               placeholder="请输入内容">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" >交易类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="ps" name="ps" required
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-result='${PS}'
                                                allowClear="true"
                                                formatoption="true"
                                                data-th-initValue="${entity?.ps}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">交易日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeDate" name="tradeDate" required
                                               class="layui-input form-input input-dateSelect"
                                               placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.tradeDate}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">交割日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="settleDate" name="settleDate" required
                                               class="layui-input form-input input-dateSelect"
                                               placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.settleDate}">
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">金额信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap">币种</label>
                                <div class="layui-input-inline input-inline">
                                    <select  type="text" id="ccy" name="ccy" required
                                             class="layui-input form-input input-select"
                                             placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                             th:data-result='${CCY}'
                                             allowClear="true"
                                             formatoption="true"
                                             th:initValue="*{entity?.ccy?:CCY_default}"></select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable">本金金额</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="prinAmt" name="prinAmt" required maxLength="28"
                                           class="layui-input form-input text-number"
                                           data-textrange="2"
                                           th:value="${entity?.prinAmt}"
                                           placeholder="请输入内容">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable">应收利息总额</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="intAmt" name="intAmt" maxLength="28" required
                                           class="layui-input form-input text-number"
                                           data-textrange="2" data-fixtype="2"
                                           th:value="${entity?.intAmt}"
                                           placeholder="请输入内容">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable">罚息</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="theoryPenaltyInt" name="theoryPenaltyInt" required maxLength="28"
                                           class="layui-input form-input text-number"
                                           data-textrange="2"
                                           th:value="${entity?.theoryPenaltyInt}"
                                           placeholder="请输入内容">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">费用信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap">其他费用</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text" id="otherAmt" name="otherAmt"
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            maxLength="28" data-textrange="2" data-fixtype="2"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.otherAmt?:0}" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">汇总信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap">结算金额</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text" id="settleAmt" name="settleAmt" required
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.settleAmt}" />
                                </div>
                            </div>
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap">资金账户</label>
                                <div class="layui-input-inline input-inline" >
                                    <select id="myAcctNo" name="myAcctNo"
                                            class="layui-input form-input input-select" required
                                            data-th-data-url="@{/valuation/trademanage/bondlend/TrdBondLendTrade002/getTrdAcctId}"
                                            allowClear="true" placeholder="请输入内容"
                                            data-th-initValue="${entity?.myAcctNo}">
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </form>

        <input type="text" id="workflowId" name="workflowId" class="layui-input form-input" data-th-value="${workflowId}" disabled="disabled" style = "display:none;">

        <div class="row text-center" style="margin: 20px 0;">
            <a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save"
               data-th-text="#{SysCommon.save}">保存</a>
            <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit"
               data-th-text="#{SysCommon.submit}">提交</a>
            <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">

    </script>
    <script th:src="@{/js/valuation/trademanage/trdsecovertransfervaluationduration/TrdSecOverTransferValuationDuration002.js}" type="text/javascript"></script>
</div>
</body>
</html>
