<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
<title data-th-text="#{TrdFxSwapValuationTrade002}">外汇掉期交易新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
				<form id="basicInfoForm" class="layui-form joyin-form-wrap pro-module-form">
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdFxSwapValuationTrade002.tradeId}">交易编号</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="tradeId"
												   data-th-value="${entity?.tradeId}"
												   class="layui-input form-input" placeholder="请输入内容" disabled
												   data-th-placeholder="#{SysCommon.placeholder}" >
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdFxSwapValuationTrade002.outTradeId}">外部交易编号</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="outTradeId"
												   data-th-value="${entity?.outTradeId}"
												   class="layui-input form-input" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}" >
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxSwapValuationTrade002.portfolioName}">产品名称</label>
										<div class="layui-input-inline input-inline">
											<select id="portfolioId" name="portfolioId" th:initValue="${entity?.portfolioId}"
													class="layui-input form-input input-select available" required
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-data-url="@{/valuation/trademanage/trdfxswapvaluationtrade/TrdFxSwapValuationTrade002/findPortfolioId}">
											</select>
										</div>
									</div>
								</div>

								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdFxSwapValuationTrade002.portfolioId}">产品代码</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="portfolioName" name="portfolioName"
												   data-th-value="${entity?.portfolioName}" required
												   class="layui-input form-input" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}" disabled>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{TrdFxSwapValuationTrade002.curPair}">货币对</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="curPair" name="curPair"
													class="layui-input form-input input-select"
													data-th-data-result="${CYY_PAIR}" required
													allowClear="true"  placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-initValue="${entity?.curPair}">
											</select>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxSwapValuationTrade002.ps}">交易类型</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="ps" name="ps"
													class="layui-input form-input input-select"
													data-th-data-result='${PS}' allowClear="true"
													placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
													required="required" formatoption="true"
													data-th-initValue="${entity?.ps}">
											</select>
										</div>
									</div>
								</div>

								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxSwapValuationTrade002.tradeDate}">交易日期</label>
										<div class="layui-input-inline input-inline">
											<input id="tradeDate" name="tradeDate" required
												   class="layui-input form-input input-dateSelect hidden"
												   data-th-value='${#dates.format(entity?.tradeDate,"yyyy-MM-dd")}'>
										</div>
									</div>


									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxSwapValuationTrade002.termType}">期限类型</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="termType" name="termType" required="required"
													class="layui-input form-input input-select" allowClear="true"
													placeholder="请输入内容" data-th-data-result='${EXC_FXS_TERM_TYPE}'
													data-th-initvalue="${entity?.termType}"
													data-th-placeholder="#{SysCommon.placeholder}">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{TrdFxSwapValuationTrade002.ourRole}">我方角色</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="ourRole" name="ourRole" required
													class="layui-input form-input input-select" allowClear="true"
													placeholder="请输入内容" data-th-data-result='${OUR_ROLE}'
													data-th-initvalue="${entity?.ourRole}"
													data-th-placeholder="#{SysCommon.placeholder}">
											</select>
										</div>
									</div>
								</div>
									
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxSwapValuationTrade002.dealMode}">交易模式</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="dealMode" name="dealMode"  required
													class="layui-input form-input input-select"
													placeholder="请输入内容" data-th-data-result='${DEAL_MODE}'
													data-th-initvalue="${entity?.dealMode}"
													data-th-placeholder="#{SysCommon.placeholder}">
											</select>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxSwapValuationTrade002.settMode}">清算模式</label>
										<div class="layui-input-inline input-inline">
											<select id="settMode" name="settMode"
													data-th-data-result="${SETT_MODE}"
													th:initvalue="*{entity?.settMode}" class="layui-input form-input input-select" placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}" required>
											</select>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxSwapValuationTrade002.dealCur}">交易货币</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="dealCur" name="dealCur" required="required"
													parentIds="curPair"
													class="layui-input form-input input-select" placeholder="请输入内容"
													th:placeholder="#{SysCommon.placeholder}" th:data-result='${CCY}'
													allowClear="true" formatoption="true" th:initValue="${entity?.dealCur}"></select>
										</div>
									</div>
								</div>

								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable" data-th-text="#{TrdFxSwapValuationTrade002.corCcy}">对应货币</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="corCcy" name="corCcy"
													class="layui-input form-input input-select"
													allowClear="true"
													data-th-placeholder="#{SysCommon.placeholder}"
													th:initValue="${entity?.corCcy}"
													data-th-data-result='${CCY}'
													disabled="disabled">
											</select>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxSwapValuationTrade002.unitCprice}">即期汇率</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="unitCprice" name="unitCprice" maxLength="16" required
												   th:value="${entity?.unitCprice}" class="layui-input form-input text-number rateCal"
												   data-textrange="4" data-fixtype="4" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="pro-module-wrap" id="value_div_sq">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">近端交易</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">


									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxSwapValuationTrade002.nPoint}">近端掉期点</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="nPoint" name="nPoint" maxLength="16" required
												   th:value="${entity?.nPoint}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxSwapValuationTrade002.nFprice}">近端掉期全价</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="nFprice" name="nFprice" maxLength="16" required
												   th:value="${entity?.nFprice}" class="layui-input form-input text-number rateCal"
												   data-textrange="6" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>

								</div>

								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxSwapValuationTrade002.nDealCurAmt}">交易货币金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="nDealCurAmt" name="nDealCurAmt" maxLength="16" required
												   th:value="${entity?.nDealCurAmt}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxSwapValuationTrade002.nCorCcyAmt}">对应货币金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="nCorCcyAmt" name="nCorCcyAmt" maxLength="16" required
												   th:value="${entity?.nCorCcyAmt}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxSwapValuationTrade002.nUsdAmt}">折美元金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="nUsdAmt" name="nUsdAmt" maxLength="16" required
												   th:value="${entity?.nUsdAmt}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="pro-module-wrap" th:id="value_div">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">远端交易</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxSwapValuationTrade002.mdate}">远端交割日</label>
										<div class="layui-input-inline input-inline">
											<input id="mdate" name="mdate" required
												   class="layui-input form-input input-dateSelect hidden"
												   data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxSwapValuationTrade002.fPoint}">远端掉期点</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="fPoint" name="fPoint" maxLength="16"
												   required th:value="${entity?.fPoint}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxSwapValuationTrade002.fFprice}">远端掉期全价</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="fFprice" name="fFprice" maxLength="16"
												   required th:value="${entity?.fFprice}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
								</div>

								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxSwapValuationTrade002.fDealCurAmt}">交易货币金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="fDealCurAmt" name="fDealCurAmt" maxLength="16"
												   required th:value="${entity?.fDealCurAmt}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxSwapValuationTrade002.fCorCcyAmt}">对应货币金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="fCorCcyAmt" name="fCorCcyAmt" maxLength="16"
												   required th:value="${entity?.fCorCcyAmt}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>

									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxSwapValuationTrade002.fUsdAmt}">折美元金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="fUsdAmt" name="fUsdAmt" maxLength="16"
												   required th:value="${entity?.fUsdAmt}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="pro-module-wrap" th:id="value_div">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">费用信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxSwapValuationTrade002.procedureAmt}">交易手续费</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="procedureAmt" name="procedureAmt" maxLength="16"
												   required th:value="${entity?.procedureAmt}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxSwapValuationTrade002.feeAmtQT}">结算服务费</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="settleServiceAmt" name="settleServiceAmt" maxLength="16"
												   required th:value="${entity?.settleServiceAmt}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxSwapValuationTrade002.feeAmtQT}">其他费用</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="feeAmtQT" name="feeAmtQT" maxLength="16"
												   required th:value="${entity?.feeAmtQT}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

					<div class="pro-module-wrap" th:id="value_div">
						<div class="pro-module">
							<h3 class="pro-module-title"><span class="title-des">汇总信息</span><i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{TrdFxSwapValuationTrade002.mdateSettleAmt}">结算金额</label>
										<div class="layui-input-inline input-inline">
											<input type="text" th:id="mdateSettleAmt" name="mdateSettleAmt" maxLength="16"
												   required th:value="${entity?.mdateSettleAmt}" class="layui-input form-input text-number rateCal"
												   data-textrange="2" data-fixtype="2" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"/>
										</div>
									</div>
									<div class="form-inline-wrap" >
										<label class="layui-form-label form-lable" >资金账户</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="trdAcctId" name="trdAcctId" class="layui-input form-input input-select" parentIds="portfolioId"
													th:data-url="@{/valuation/trademanage/trdfxswapvaluationtrade/TrdFxSwapValuationTrade002/getTrdAcctId}"
													allowClear="true" placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}">
											</select>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>

				</form>
                <div class="layui-form-item">
                    <div align="center" style="height:50px;padding-top: 10px;">
                        <a id="TrdFxSwapValuationTrade002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                        <a id="TrdFxSwapValuationTrade002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="TrdFxSwapValuationTrade002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
         </div>
    </div>
    </div>
    <div layout:fragment="script">
    	<script data-th-inline="javascript" type="text/javascript">
    			var PS_T01 = /*[[${PS_T01}]]*/'';
    			var YES = /*[[${YES}]]*/'';
    			var YES_OR_NO_N = /*[[${YES_OR_NO_N}]]*/'';
    			var finprodId = /*[[${finprodId}]]*/'';
    			var CCY = /*[[${CCY}]]*/'';
    			var FINPROD_TYPE_F17 = /*[[${FINPROD_TYPE_F17}]]*/'';
                var tradeId = /*[[${tradeId}]]*/'';
                var PS_T02 = /*[[${PS_T02}]]*/'';
		</script>
    	<script data-th-src="@{/js/valuation/trademanage/trdfxswapvaluationtrade/TrdFxSwapValuationTrade002.js}">
    	</script>
    </div>
</body>
</html>
