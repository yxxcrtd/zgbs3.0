<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title>查看逾期交易信息</title>
<link rel="stylesheet" type="text/css" data-th-href="@{/css/font/iconfont.css}">
<script type="text/javascript">
		
</script>
<!-- <script th:inline="javascript">
    var initps = [[${ps}]];
</script> -->
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm" style="background: #ffffff; padding: 10px 0;">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">交易编号</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="tradeId" name="tradeId" class="layui-input form-input"
                                data-th-value="${entity?.tradeId}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">投资主体代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="prodId" name="prodId" class="layui-input form-input"
                                data-th-value="${entity?.prodId}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">投资主体名称</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="prodAbbr" name="prodAbbr" class="layui-input form-input"
                                data-th-value="${entity?.prodAbbr}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">交易方向</label>
                        <div class="layui-input-inline input-inline">
                            <select id="ps" name="ps" class="layui-input form-input input-select"
                                data-th-data-result="${PS}" allowClear="true" data-th-initValue="${entity?.psCode}">
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="assetId" name="assetId" class="layui-input form-input"
                                data-th-value="${entity?.assetId}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">资产名称</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="assetAbbr" name="assetAbbr" class="layui-input form-input"
                                data-th-value="${entity?.assetAbbr}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">币种</label>
                        <div class="layui-input-inline input-inline">
                            <select id="ccy" name="ccy" class="layui-input form-input input-select"
                                data-th-data-result="${CCY}" allowClear="true" data-th-initValue="${entity?.ccyCode}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">交易场所</label>
                        <div class="layui-input-inline input-inline">
                            <input id="tradeMarket" name="tradeMarket"
                                class="layui-input form-input input-select" 
                                data-th-data-result="${TRADE_MARKET}" allowClear="true"
                                data-th-initValue="${entity?.tradeMarketCode}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">投资目的</label>
                        <div class="layui-input-inline input-inline">
                            <input id="invAim" name="invAim"
                                class="layui-input form-input input-select" 
                                data-th-data-result="${INV_AIM}" allowClear="true"
                                data-th-initValue="${entity?.invAimCode}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">发生日</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="tradeDate" name="tradeDate" class="layui-input form-input"
                                allowClear="true" data-th-value="${entity?.tradeDate}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">交易本金</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="prinAmt" name="prinAmt" class="layui-input form-input  text-money" data-textrange="2"
                                allowClear="true" data-th-value="${entity?.prinAmt}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">交易利息</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="intAmt" name="intAmt" class="layui-input form-input  text-money" data-textrange="2"
                                allowClear="true" data-th-value="${entity?.intAmt}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">交易金额</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="tradeAmt" name="tradeAmt" class="layui-input form-input  text-money" data-textrange="2"
                                allowClear="true" data-th-value="${entity?.tradeAmt}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">交易状态</label>
                        <div class="layui-input-inline input-inline">
                            <input id="tradeStatus" name="tradeStatus"
                                class="layui-input form-input input-select" 
                                data-th-data-result="${TRADE_STATUS}" allowClear="true"
                                data-th-initValue="${entity?.tradeStatusCode}">
                        </div>
                    </div>
<!--                     <div class="layui-inline layui-col-md6">
                        <label class="layui-form-label form-lable">交易状态</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="tradeStatus" name="tradeStatus" class="layui-input form-input"
                                data-th-value="${entity?.tradeStatus}">
                        </div>
                    </div> -->
                </div>
        </form>
    </div>
</body>
</html>
