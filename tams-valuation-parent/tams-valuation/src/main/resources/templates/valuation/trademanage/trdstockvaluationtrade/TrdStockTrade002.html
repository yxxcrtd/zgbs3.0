<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title th:text="#{TrdStockTrade002}">股票交易</title>
</head>
<body>
<div layout:fragment="content">
    <style type="text/css">
        .layui-form-radio {
            line-height: 24px;
            padding-right: 0px;
            margin: 0px;
        }
        .layui-form-radio div {
            font-size: 12px;
        }
        .layui-form-radio i{
            font-size: 14px;
        }
    </style>
    <div class="pro-module-container" style="margin-bottom: 20px;">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base" >
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" >基础信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdStockTrade.tradeId}">交易编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeId" name="tradeId"
                                               required disabled
                                               placeholder="提交后自动生成，无需填写"
                                               class="layui-input form-input"
                                               data-th-value="${entity?.tradeId}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdStockTrade.outTradeId}">外部成交编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="outTradeId" name="outTradeId"
                                               class="layui-input form-input"
                                               data-th-value="${entity?.outTradeId}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdStockTrade.prodId}">产品代码</label>
                                        <div class="layui-input-inline input-inline" >
                                            <select id="prodId" name="prodId" required
                                                    class="layui-input form-input input-select"
                                                    data-th-data-url="@{/valuation/trademanage/trdstockvaluationtrade/TrdStockTrade002/getFinprodId}"
                                                     allowClear="true" placeholder="请输入内容"
                                                    th:formatoption="false"
                                                    data-th-initValue="${entity?.prodId}" >
                                            </select>
                                        </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdStockTrade.prodName}">产品名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="prodName" name="prodName" required disabled
                                               class="layui-input form-input" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.prodName}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdStockTrade.assetId}">资产代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="assetId" name="assetId" required
                                                class="layui-input form-input input-select"
                                                data-th-data-url="@{/valuation/trademanage/trdstockvaluationtrade/TrdStockTrade002/getAssetId}"
                                                allowClear="true"
                                                th:formatoption="false"
                                                data-th-initValue="${entity?.assetId}"
                                                placeholder="请输入内容">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdStockTrade.assetAbbr}">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="assetAbbr" name="assetAbbr"
                                               class="layui-input form-input"
                                               required disabled
                                               data-th-value="${entity?.assetAbbr}"
                                               placeholder="请输入内容">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdStockTrade.ps}">交易类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="ps" name="ps" required
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-result='${PS}'
                                                allowClear="true"
                                                formatoption="true"
                                                data-th-initValue="${entity?.ps}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdStockTrade.ccy}">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select  type="text" id="ccy" name="ccy" required
                                                 class="layui-input form-input input-select"
                                                 placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                 th:data-result='${CCY}'
                                                 allowClear="true"
                                                 formatoption="true"
                                                 th:initValue="*{entity?.ccy?:CCY_default}"></select>
                                    </div>
                                </div>
                                <div  class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdStockTrade.isLock}">是否锁定</label>
                                    <div class="layui-input-inline input-inline" required>
                                        <select id="isLock" name="isLock"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${YES_OR_NO}' allowClear="true"
                                                th:initValue="${entity?.isLock?:YES_OR_NO_N}"
                                                data-th-placeholder="#{SysCommon.placeholder}" >
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdStockTrade.endDate}">锁定期截止日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="endDate" name="endDate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${#dates.format(entity?.endDate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
            <div class="pro-module-wrap" id="qsxx">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">清算信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdStockTrade.dealDate}">成交日期</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="dealDate" name="dealDate" required
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value='${#dates.format(entity?.dealDate?:iPlatformDate,"yyyy-MM-dd")}'>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdStockTrade.settleDate}">结算日期</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="settleDate" name="settleDate" required
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value='${#dates.format(entity?.settleDate?:iPlatformDate,"yyyy-MM-dd")}'>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdStockTrade.fundSettleDate}">资金交收日期</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="fundSettleDate" name="fundSettleDate" required
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value='${#dates.format(entity?.fundSettleDate?:iPlatformDate,"yyyy-MM-dd")}'>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdStockTrade.dealNum}">成交数量</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="dealNum" name="dealNum" required
                                           class="layui-input form-input text-number"
                                           maxLength="28" data-textrange="2" data-fixtype="2"
                                           th:value="${entity?.dealNum}"
                                           placeholder="请输入内容">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdStockTrade.tradeAmt}">成交金额</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="tradeAmt" name="tradeAmt" required
                                           class="layui-input form-input text-number"
                                           maxLength="28" data-textrange="2" data-fixtype="2"
                                           th:value="${entity?.tradeAmt}"
                                           placeholder="请输入内容">
                                </div>
                            </div>
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdStockTrade.commission}">净佣金</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text" id="commission" name="commission" required
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            maxLength="28" data-textrange="2" data-fixtype="2"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.commission?:0}" />
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdStockTrade.stampDutyAmt}">印花税</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text" id="stampDutyAmt" name="stampDutyAmt" required
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            maxLength="28" data-textrange="2" data-fixtype="2"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.stampDutyAmt?:0}" />
                                </div>
                            </div>
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdStockTrade.brokerage}">经手费</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text" id="brokerage" name="brokerage" required
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            maxLength="28" data-textrange="2" data-fixtype="2"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.brokerage?:0}" />
                                </div>
                            </div>
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdStockTrade.certfFee}">证管费</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text" id="certfFee" name="certfFee" required
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            maxLength="28" data-textrange="2" data-fixtype="2"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.certfFee?:0}" />
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdStockTrade.ghfAmt}">过户费</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text" id="ghfAmt" name="ghfAmt" required
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            maxLength="28" data-textrange="2" data-fixtype="2"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.ghfAmt?:0}" />
                                </div>
                            </div>
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdStockTrade.stlAmt}">结算费</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text" id="stlAmt" name="stlAmt" required
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            maxLength="28" data-textrange="2" data-fixtype="2"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.stlAmt?:0}" />
                                </div>
                            </div>
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdStockTrade.otherAmt}">其他费用</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text" id="otherAmt" name="otherAmt" required
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            maxLength="28" data-textrange="2" data-fixtype="2"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.otherAmt?:0}" />
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdStockTrade.exchangeDate}">汇率日期</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="exchangeDate" name="exchangeDate"
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value='${#dates.format(entity?.exchangeDate,"yyyy-MM-dd")}'>
                                </div>
                            </div>
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdStockTrade.settleAmt}">结算金额</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text" id="settleAmt" name="settleAmt" required
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            maxLength="28" data-textrange="2" data-fixtype="2"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.settleAmt}" />
                                </div>
                            </div>
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdStockTrade.myAcctNo}">资金账户</label>
                                <div class="layui-input-inline input-inline" >
                                    <select id="myAcctNo" name="myAcctNo"
                                            class="layui-input form-input input-select"
                                            data-th-data-url="@{/valuation/trademanage/trdstockvaluationtrade/TrdStockTrade002/getTrdAcctId}"
                                            allowClear="true" placeholder="请输入内容"
                                            data-th-initValue="${entity?.myAcctNo}">
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pro-module-wrap" id="pgxx">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">配股信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdStockTrade.saleCode}">配售代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="saleCode" name="saleCode" required
                                               placeholder="请输入内容"
                                               class="layui-input form-input"
                                               data-th-value="${entity?.saleCode}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdStockTrade.settleDate}">结算日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="settleDate_pg" name="settleDate_pg" required
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${#dates.format(entity?.settleDate_pg?:iPlatformDate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdStockTrade.fundSettleDate}">资金交收日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="fundSettleDate_pg" name="fundSettleDate_pg" required
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${#dates.format(entity?.fundSettleDate_pg?:iPlatformDate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                            </div>

                            <div class="layui-form-item">
                                 <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdStockTrade.dealNum}">成交数量</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="dealNum_pg" name="dealNum_pg" required
                                               class="layui-input form-input text-number"
                                               maxLength="28" data-textrange="2" data-fixtype="2"
                                               th:value="${entity?.dealNum_pg}"
                                               placeholder="请输入内容">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdStockTrade.tradedPrice}">成交价格</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradedPrice" name="tradedPrice" required
                                               class="layui-input form-input text-number"
                                               maxLength="28" data-textrange="2" data-fixtype="2"
                                               th:value="${entity?.tradedPrice}"
                                               placeholder="请输入内容">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdStockTrade.paymentAmt}">缴款金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="paymentAmt_pg" name="paymentAmt_pg" required
                                               class="layui-input form-input text-number"
                                               maxLength="28" data-textrange="2" data-fixtype="2"
                                               th:value="${entity?.paymentAmt_pg}"
                                               placeholder="请输入内容">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdStockTrade.myAcctNo}">资金账户</label>
                                    <div class="layui-input-inline input-inline" >
                                        <select id="myAcctNo_pg" name="myAcctNo_pg" required
                                                class="layui-input form-input input-select"
                                                data-th-data-url="@{/valuation/trademanage/trdstockvaluationtrade/TrdStockTrade002/getTrdAcctId}"
                                                allowClear="true" placeholder="请输入内容"
                                                data-th-initValue="${entity?.myAcctNo_pg}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            <div class="pro-module-wrap" id="sgxx">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">申购信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdStockTrade.purchDate}">申购日期</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="purchDate" name="purchDate" required
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${#dates.format(entity?.purchDate?:iPlatformDate,'yyyy-MM-dd')}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdStockTrade.settleDate}">结算日期</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="settleDate_sg" name="settleDate_sg" required
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value='${#dates.format(entity?.settleDate_sg?:iPlatformDate,"yyyy-MM-dd")}'>
                                </div>
                            </div>
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdStockTrade.entrustAmt}">申购金额</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text" id="entrustAmt" name="entrustAmt" required
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            maxLength="28" data-textrange="2" data-fixtype="2"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.entrustAmt}" />
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdStockTrade.myAcctNo}">资金账户</label>
                                <div class="layui-input-inline input-inline" >
                                    <select id="myAcctNo_sg" name="myAcctNo_sg" required
                                            class="layui-input form-input input-select"
                                            data-th-data-url="@{/valuation/trademanage/bondlend/TrdBondLendTrade002/getTrdAcctId}"
                                            allowClear="true" placeholder="请输入内容"
                                            data-th-initValue="${entity?.myAcctNo_sg}">
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pro-module-wrap" id="qrxx">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">确认信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdStockTrade.confirmDate}">确认日期</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="confirmDate" name="confirmDate" required
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value='${#dates.format(entity?.confirmDate,"yyyy-MM-dd")}'>
                                </div>
                            </div>
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdStockTrade.confirmNum}">中签数量</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text" id="confirmNum" name="confirmNum" required
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            maxLength="28" data-textrange="2" data-fixtype="2"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.confirmNum}" />
                                </div>
                            </div>
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdStockTrade.confirmPrice}">中签价格</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text" id="confirmPrice" name="confirmPrice" required
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            maxLength="28" data-textrange="2" data-fixtype="2"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.confirmPrice}" />
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdStockTrade.confirmAmt}">中签金额</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text" id="confirmAmt" name="confirmAmt" required
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            maxLength="28" data-textrange="2" data-fixtype="2"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.confirmAmt}" />
                                </div>
                            </div>
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdStockTrade.myAcctNo}">资金账户</label>
                                <div class="layui-input-inline input-inline" >
                                    <select id="myAcctNo_qr" name="myAcctNo_qr" required
                                            class="layui-input form-input input-select"
                                            data-th-data-url="@{/valuation/trademanage/bondlend/TrdBondLendTrade002/getTrdAcctId}"
                                            allowClear="true" placeholder="请输入内容"
                                            data-th-initValue="${entity?.myAcctNo_qr}">
                                    </select>
                                </div>
                            </div>
                            <div id="paymentDateDiv" class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdStockTrade.paymentDate}">缴款日</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="paymentDate" name="paymentDate" required
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value='${#dates.format(entity?.paymentDate,"yyyy-MM-dd")}'>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdStockTrade.paymentAmt}">缴款金额</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text" id="paymentAmt" name="paymentAmt" required
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            maxLength="28" data-textrange="2" data-fixtype="2"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.paymentAmt}" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </form>

        <input type="text" id="workflowId" name="workflowId" class="layui-input form-input" data-th-value="${workflowId}" disabled="disabled" style = "display:none;">

        <div class="row text-center" style="margin: 20px 0;">
            <a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save"
               data-th-text="#{SysCommon.save}">保存</a>
            <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit"
               data-th-text="#{SysCommon.submit}">提交</a>
            <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'';
    </script>
    <script th:src="@{/js/valuation/trademanage/trdstockvaluationtrade/TrdStockTrade002.js}" type="text/javascript"></script>
</div>
</body>
</html>
