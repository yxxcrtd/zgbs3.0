<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title th:text="#{TrdIRSValuationTrade002}">利率互换交易新建</title>
</head>
<body>
<div layout:fragment="content">
    <style type="text/css">
        .layui-form-radio {
            line-height: 24px;
            padding-right: 0px;
            margin: 0px;
        }
        .layui-form-radio div {
            font-size: 12px;
        }
        .layui-form-radio i{
            font-size: 14px;
        }
    </style>
    <div class="pro-module-container" style="margin-bottom: 20px;">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base" >
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" >基本信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdIRSValuationTrade002.prodId}">产品代码</label>
                                        <div class="layui-input-inline input-inline" >
                                            <select id="prodId" name="prodId" required
                                                    class="layui-input form-input input-select"
                                                    data-th-data-url="@{/valuation/trademanage/irs/TrdIRSValuationTrade002/getFinprodId}"
                                                     allowClear="true" placeholder="请输入内容"
                                                    th:formatoption="false"
                                                    data-th-initValue="${entity?.prodId}" >
                                            </select>
                                        </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdIRSValuationTrade002.prodName}">产品名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="prodName" name="prodName" required disabled
                                                class="layui-input form-input" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${entity?.prodName}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdIRSValuationTrade002.ps}">交易类型</label>
                                    <div class="layui-input-inline input-inline">
                                            <select type="text" id="ps" name="ps" required
                                                    class="layui-input form-input input-select"
                                                    allowClear="true" placeholder="请输入内容"
                                                    data-th-data-result='${IRS_TYPE}'
                                                     data-th-placeholder="#{SysCommon.placeholder}">
                                            </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdIRSValuationTrade002.tradeId}">交易编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeId" name="tradeId"
                                               required disabled
                                               placeholder="提交后自动生成，无需填写"
                                               class="layui-input form-input"
                                               data-th-value="${entity?.tradeId}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdIRSValuationTrade002.outTradeId}">外部成交编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="outTradeId" name="outTradeId"
                                               class="layui-input form-input"
                                               data-th-value="${entity?.outTradeId}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdIRSValuationTrade002.tradeDate}">交易日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeDate" name="tradeDate" required
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${#dates.format(entity?.tradeDate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdIRSValuationTrade002.vdate}">起息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="vdate" name="vdate" required
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdIRSValuationTrade002.mdate}">到期日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="mdate" name="mdate" required
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdIRSValuationTrade002.prin}">名义本金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="prin" name="prin" required
                                               placeholder="请输入内容"  data-pattern="" data-textrange="2" maxLength="30"
                                               class="layui-input form-input text-number"
                                               th:value="${entity?.prin}" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdIRSValuationTrade002.ccy}">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select  type="text" id="ccy" name="ccy" required
                                                 class="layui-input form-input input-select"
                                                 placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                 th:data-result='${CCY}'
                                                 allowClear="true"
                                                 formatoption="true"
                                                 th:initValue="*{entity?.ccy?:CCY_default}"></select>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">固定端</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdIRSValuationTrade002.yield}">固定利率%</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="yield" name="yield" required
                                           placeholder="请输入内容"  data-pattern="" data-textrange="4" maxLength="30"
                                           class="layui-input form-input text-number"
                                           th:value="${entity?.yield}" />
                                </div>
                            </div>

                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdIRSValuationTrade002.fixBasis}">计息基础</label>
                                <div class="layui-input-inline input-inline">
                                    <select type="text" id="fixBasis" name="fixBasis" required="required"
                                            class="layui-input form-input input-select"
                                            placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                            th:data-result='${BASIS}'
                                            allowClear="true" formatoption="true"
                                            th:initValue="${entity?.fixBasis}">
                                    </select>
                                </div>
                            </div>

                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdIRSValuationTrade002.fixPayCycle}">付息频率</label>
                                <div class="layui-input-inline input-inline">
                                    <select type="text" id="fixPayCycle" name="fixPayCycle" required="required"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}" th:data-result='${FREQUENCY_UNIT}'
                                            allowClear="true" formatoption="true" th:initValue="${entity?.fixPayCycle}"></select>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdIRSValuationTrade002.firstPayDateR}">首期起息日</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="firstPayDateR" name="firstPayDateR" required
                                           class="layui-input form-input input-dateSelect" placeholder="请输入日期"
                                           data-th-value='${#dates.format(entity?.firstPayDateR,"yyyy-MM-dd")}'/>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">浮动端</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdIRSValuationTrade002.intType}">挂钩利率</label>
                                <div class="layui-input-inline input-inline">
                                    <select type="text" id="intType" name="intType" required="required"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}" th:data-result='${SECRATE_DATA}'
                                            allowClear="true" formatoption="true" th:initValue="${entity?.intType}"></select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdIRSValuationTrade002.spreadRate}">利差(BP)</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="spreadRate" name="spreadRate" required
                                           placeholder="请输入内容"  data-pattern="" data-textrange="4" maxLength="30"
                                           class="layui-input form-input text-number"
                                           th:value="${entity?.spreadRate}" />
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdIRSValuationTrade002.floatBasis}">计息基础</label>
                                <div class="layui-input-inline input-inline">
                                    <select type="text" id="floatBasis" name="floatBasis" required="required"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}" th:data-result='${BASIS}'
                                            allowClear="true" formatoption="true" th:initValue="${entity?.floatBasis}"></select>
                                </div>
                            </div>
                        </div>

                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdIRSValuationTrade002.floatPayCycle}">付息频率</label>
                                <div class="layui-input-inline input-inline">
                                    <select type="text" id="floatPayCycle" name="floatPayCycle" required="required"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}" th:data-result='${FREQUENCY_UNIT}'
                                            allowClear="true" formatoption="true" th:initValue="${entity?.floatPayCycle}"></select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdIRSValuationTrade002.firstPayDateF}">首期起息日</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="firstPayDateF" name="firstPayDateF" required class="layui-input form-input input-dateSelect" placeholder="请输入日期"
                                           data-th-value='${#dates.format(entity?.firstPayDateF,"yyyy-MM-dd")}'/>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdIRSValuationTrade002.firstResetDate}">首期利率确定日</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="firstResetDate" name="firstResetDate" required class="layui-input form-input input-dateSelect" placeholder="请输入日期"
                                           data-th-value='${#dates.format(entity?.firstResetDate,"yyyy-MM-dd")}'/>
                                </div>
                            </div>
                        </div>

                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdIRSValuationTrade002.resetFreq}">利率重置频率</label>
                                <div class="layui-input-inline input-inline">
                                    <select type="text" id="resetFreq" name="resetFreq" required="required"
                                            class="layui-input form-input input-select" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:data-result='${FREQUENCY_UNIT_RESET}'
                                            allowClear="true" formatoption="true"
                                            th:initValue="${entity?.resetFreq}"></select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">费用信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdIRSValuationTrade002.dealFeeAmt}">交易手续费</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="dealFeeAmt" name="dealFeeAmt" required
                                                class="layui-input form-input text-number" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${entity?.dealFeeAmt?:0}" />
                                    </div>
                                </div>
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdIRSValuationTrade002.stlFeeAmt}">结算服务费</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="stlFeeAmt" name="stlFeeAmt" required
                                                class="layui-input form-input text-number" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${entity?.stlFeeAmt?:0}" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">汇总信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdIRSValuationTrade002.settleAmt}">结算金额</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text" id="settleAmt" name="settleAmt" required
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.settleAmt}" />
                                </div>
                            </div>
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdIRSValuationTrade002.acctNo}">资金账户</label>
                                <div class="layui-input-inline input-inline" >
                                    <select id="acctNo" name="acctNo" required
                                            class="layui-input form-input input-select"
                                            data-th-data-url="@{/valuation/trademanage/bondlend/TrdBondLendTrade002/getTrdAcctId}"
                                            allowClear="true" placeholder="请输入内容"
                                            data-th-initValue="${entity?.acctNo}">
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </form>

        <input type="text" id="workflowId" name="workflowId" class="layui-input form-input" data-th-value="${workflowId}" disabled="disabled" style = "display:none;">

        <div class="row text-center" style="margin: 20px 0;">
            <a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save"
               data-th-text="#{SysCommon.save}">保存</a>
            <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit"
               data-th-text="#{SysCommon.submit}">提交</a>
            <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">

    <script th:src="@{/js/valuation/trademanage/irs/TrdIRSValuationTrade002.js}" type="text/javascript"></script>
</div>
</body>
</html>
