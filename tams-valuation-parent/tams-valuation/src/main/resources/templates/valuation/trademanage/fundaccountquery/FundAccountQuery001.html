<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>资金账户查询</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area"></div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">账户类型</label>
                        <div class="layui-input-inline input-inline">
                            <select id="acctType" name="acctType" class="layui-input form-input input-select"
                                placeholder="请选择" data-th-data-result="${ACCT_TYPE}" allowClear="true"
                                multiple="multiple">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">账户</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="acct" name="acct" class="layui-input form-input"
                                data-th-placeholder="#{SysCommon.placeholder}" value="">
                        </div>
                        <!-- <div class="layui-input-inline input-inline">
                            <input type="text" id="acct" name="acct" class="layui-input form-input input-lenovoselect"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/valuation/trademanage/fundaccountquery/FundAccountQuery001/getAcct}"
                                data-idfield="code" data-keyfield="code"
                                data-th-data-effectivefieldsalias='|{"code":"#{ValSubjectSet001.booksetId}","shortName":"#{ValSubjectSet001.booksetName}"}|'>
                        </div> -->
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</body>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/trademanage/fundaccountquery/FundAccountQuery001.js}" type="text/javascript"></script>
</div>
</html>
