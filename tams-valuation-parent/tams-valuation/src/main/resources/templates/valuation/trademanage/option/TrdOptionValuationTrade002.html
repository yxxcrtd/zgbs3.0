<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title th:text="#{TrdOptionValuationTrade002}">场外期权交易</title>
</head>
<body>
<div layout:fragment="content">
    <style type="text/css">
        .layui-form-radio {
            line-height: 24px;
            padding-right: 0px;
            margin: 0px;
        }
        .layui-form-radio div {
            font-size: 12px;
        }
        .layui-form-radio i{
            font-size: 14px;
        }
    </style>
    <div class="pro-module-container" style="margin-bottom: 20px;">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base" >
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" >基本信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">交易编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeId" name="tradeId"
                                               required disabled
                                               placeholder="提交后自动生成，无需填写"
                                               class="layui-input form-input"
                                               data-th-value="${entity?.tradeId}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">外部成交编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="outTradeId" name="outTradeId"
                                               class="layui-input form-input"
                                               data-th-value="${entity?.outTradeId}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">产品代码</label>
                                        <div class="layui-input-inline input-inline" >
                                            <select id="prodId" name="prodId" required
                                                    class="layui-input form-input input-select"
                                                    data-th-data-url="@{/valuation/trademanage/option/TrdOptionValuationTrade002/getFinprodId}"
                                                     allowClear="true" placeholder="请输入内容"
                                                    th:formatoption="false"
                                                    data-th-initValue="${entity?.prodId}" >
                                            </select>
                                        </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">产品名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="prodName" name="prodName" required disabled
                                               class="layui-input form-input" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.prodName}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">合约标的</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="targetId" name="targetId" required
                                                class="layui-input form-input input-select"
                                                data-th-data-url="@{/valuation/trademanage/option/TrdOptionValuationTrade001/selectTargetIdAbbr}"
                                                allowClear="true"
                                                th:formatoption="false"
                                                data-th-initValue="${entity?.targetId}"
                                                placeholder="请输入内容">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" >合约类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="contractType" name="contractType"
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-result='${STRUCTURE_TYPE}'
                                                data-th-initValue="${entity?.contractType}"
                                                allowClear="true" formatoption="true">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" >交易类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="ps" name="ps" required
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-result='${PS}'
                                                allowClear="true"
                                                formatoption="true"
                                                data-th-initValue="${entity?.ps}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" >交易日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeDate" name="tradeDate" required
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.tradeDate}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">期限</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="term" name="term"
                                               class="layui-input form-input text-number" placeholder="请输入内容" maxlength="10"
                                               th:placeholder="#{SysCommon.placeholder}" data-fixtype="2" data-textrange="0"
                                               data-th-value="${entity?.term}">
                                        <span class="input-right-show">天</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" >起息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="vdate" name="vdate" required
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.vdate}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable" >到期日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="mdate" name="mdate" required
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.mdate}">
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">交易信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable">名义本金</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="nomCapi" name="nomCapi" required
                                           class="layui-input form-input text-number"
                                           th:value="${entity?.nomCapi}"
                                           placeholder="请输入内容">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap">行权价基准日</label>
                                <div class="layui-input-inline input-inline">
                                    <input required type="text" id="exerciseDate" name="exerciseDate"
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.exerciseDate}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap">行权价格</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="exePrice" name="exePrice" maxlength="30" required
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.exePrice}">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap">敲出价格</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="knockPrice" name="knockPrice" maxlength="30"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.knockPrice}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap">低障碍价</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="lowHindPrice" name="lowHindPrice" maxlength="30"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.lowHindPrice}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap">低行权价</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="lowExercPrice" name="lowExercPrice" maxlength="30"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.lowExercPrice}">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap">高障碍价</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="highHindPrice" name="highHindPrice" maxlength="30"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.highHindPrice}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap">高行权价</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="highExercPrice" name="highExercPrice" maxlength="30"
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.highExercPrice}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap">行权方式</label>
                                <div class="layui-input-inline input-inline">
                                    <select required type="text" id="exerciseType" name="exerciseType"
                                            class="layui-input form-input input-select"
                                            placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                            th:data-result='${EXEC_MODE}' allowClear="true" formatoption="true"
                                            th:initValue="${entity?.exerciseType}"></select>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap">期权费类型</label>
                                <div class="layui-input-inline input-inline">
                                    <select required type="text" id="optFeePayType" name="optFeePayType"
                                            class="layui-input form-input input-select"
                                            placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                            th:data-result='${OPT_FEE_PAY_TYPE}' allowClear="true" formatoption="true"
                                            th:initValue="${entity?.optFeePayType}"></select>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap">期权费率%</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="optFeeRate" name="optFeeRate" maxlength="30" required
                                           class="layui-input form-input text-number" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.optFeeRate}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap">期权费</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="optFee" name="optFee"
                                           class="layui-input form-input text-number" placeholder="请输入内容" maxlength="30"
                                           th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.optFee}">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap">币种</label>
                                <div class="layui-input-inline input-inline">
                                    <select  type="text" id="ccy" name="ccy" required
                                             class="layui-input form-input input-select"
                                             placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                             th:data-result='${CCY}'
                                             allowClear="true"
                                             formatoption="true"
                                             th:initValue="*{entity?.ccy?:CCY_default}"></select>
                                </div>
                            </div>
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap" >交易对手</label>
                                <div class="layui-input-inline input-inline" >
                                    <select  type="text" id="counterId" name="counterId" required
                                            data-th-data-url="@{/valuation/trademanage/option/TrdOptionValuationTrade002/getCounterId}"
                                            th:initValue="${entity?.counterId}"
                                            class="layui-input form-input input-select"
                                            th:placeholder="#{SysCommon.placeholder}">
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">费用信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-label-wrap">其他费用</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="otherAmt" name="otherAmt" required
                                                class="layui-input form-input text-number" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${entity?.otherAmt?:0}" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">汇总信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap">结算金额</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text" id="settleAmt" name="settleAmt" required
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.settleAmt}" />
                                </div>
                            </div>
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap">资金账户</label>
                                <div class="layui-input-inline input-inline" >
                                    <select id="acctNo" name="acctNo" required parentIds="prodId"
                                            class="layui-input form-input input-select"
                                            data-th-data-url="@{/valuation/trademanage/bondlend/TrdBondLendTrade002/getTrdAcctId}"
                                            allowClear="true" placeholder="请输入内容"
                                            data-th-initValue="${entity?.acctNo}">
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </form>

        <input type="text" id="workflowId" name="workflowId" class="layui-input form-input" data-th-value="${workflowId}" disabled="disabled" style = "display:none;">

        <div class="row text-center" style="margin: 20px 0;">
            <a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save"
               data-th-text="#{SysCommon.save}">保存</a>
            <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit"
               data-th-text="#{SysCommon.submit}">提交</a>
            <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">

    <script th:src="@{/js/valuation/trademanage/option/TrdOptionValuationTrade002.js}" type="text/javascript"></script>
</div>
</body>
</html>
