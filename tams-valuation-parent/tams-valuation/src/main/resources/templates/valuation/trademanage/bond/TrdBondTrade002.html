<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title th:text="#{TrdBondTrade002}">债券投资交易</title>
</head>
<body>
<div layout:fragment="content">
    <style type="text/css">
        .layui-form-radio {
            line-height: 24px;
            padding-right: 0px;
            margin: 0px;
        }
        .layui-form-radio div {
            font-size: 12px;
        }
        .layui-form-radio i{
            font-size: 14px;
        }
    </style>
    <div class="pro-module-container" style="margin-bottom: 20px;">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base" >
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" >基础信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondTrade.tradeId}">交易编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeId" name="tradeId"
                                               required disabled
                                               placeholder="提交后自动生成，无需填写"
                                               class="layui-input form-input"
                                               data-th-value="${entity?.tradeId}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondTrade.outTradeId}">外部成交编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="outTradeId" name="outTradeId"
                                               class="layui-input form-input"
                                               data-th-value="${entity?.outTradeId}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondTrade.prodId}">产品代码</label>
                                        <div class="layui-input-inline input-inline" >
                                            <select id="prodId" name="prodId" required
                                                    class="layui-input form-input input-select"
                                                    data-th-data-url="@{/valuation/trademanage/bond/TrdBondTrade002/getFinprodId}"
                                                     allowClear="true" placeholder="请输入内容"
                                                    th:formatoption="false"
                                                    data-th-initValue="${entity?.prodId}" >
                                            </select>
                                        </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdBondTrade.prodName}">产品名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="prodName" name="prodName" required disabled
                                               class="layui-input form-input" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.prodName}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondTrade.secId}">债券代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="secId" name="secId" required
                                                class="layui-input form-input input-select"
                                                data-th-data-url="@{/valuation/trademanage/bond/TrdBondTrade002/getAssetId}"
                                                allowClear="true"
                                                th:formatoption="false"
                                                data-th-initValue="${entity?.secId}"
                                                placeholder="请输入内容">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondTrade.secAbbr}">债券简称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="secAbbr" name="secAbbr"
                                               class="layui-input form-input"
                                               required disabled
                                               data-th-value="${entity?.secAbbr}"
                                               placeholder="请输入内容">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondTrade.tradeMarket}">交易场所</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeMarket" name="tradeMarket"
                                               class="layui-input form-input input-select"
                                               placeholder="请输入内容"  required disabled="disabled"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-data-result='${TRADE_PLACE}'
                                               data-th-value="${entity?.tradeMarket}"/>
                                    </div>
                                </div>
<!--                                <div class="form-inline-wrap">-->
<!--                                    <label class="layui-form-label form-label-wrap"-->
<!--                                           data-th-text="#{TrdBondTrade.secManageAcctId}">证券账户</label>-->
<!--                                    <div class="layui-input-inline input-inline">-->
<!--                                        <select  type="text" id="secManageAcctId" name="secManageAcctId"-->
<!--                                                class="layui-input form-input input-select" placeholder="请输入内容"-->
<!--                                                data-th-placeholder="#{SysCommon.placeholder}"-->
<!--                                                data-th-data-url="@{/valuation/trademanage/bond/TrdBondTrade002/getSecManageAcctId}"-->
<!--                                                allowClear="true" data-th-initvalue="${entity?.secManageAcctId}"></select>-->
<!--                                    </div>-->
<!--                                </div>-->
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdBondTrade.secManageAcctId}">证券账户</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="secManageAcctId" name="secManageAcctId" required
                                                 class="layui-input form-input " placeholder="请输入内容"
                                                 data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.secManageAcctId}" />
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondTrade.ps}">交易类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="ps" name="ps" required
                                                class="layui-input form-input input-select"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-data-result='${PS}'
                                                allowClear="true"
                                                formatoption="true"
                                                data-th-initValue="${entity?.ps}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdBondTrade.ccy}">币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select  type="text" id="ccy" name="ccy" required
                                                 class="layui-input form-input input-select"
                                                 placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                 th:data-result='${CCY}'
                                                 allowClear="true"
                                                 formatoption="true"
                                                 th:initValue="*{entity?.ccy?:CCY_default}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondTrade.invAim}">会计分类</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="invAim" name="invAim" required
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${INV_AIM}' allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption="true"
                                                data-th-initValue="${entity?.invAim}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondTrade.chlId}">交易通道代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="chlId" name="chlId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                data-th-placeholder="#{SysCommon.placeholder}" formatoption="true"
                                                data-th-data-url="@{/valuation/trademanage/bond/TrdBondTrade002/getChannelId}"
                                                data-th-initValue="${entity?.chlId}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>

            <div class="pro-module-wrap" id="settleInfo">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">清算信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdBondTrade.dealDate}">成交日期</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="tradeDate" name="tradeDate" required
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value='${#dates.format(entity?.tradeDate,"yyyy-MM-dd")}'>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdBondTrade.settdateDate}">交割日期</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="settdateDate" name="settdateDate" required
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value='${#dates.format(entity?.settdateDate,"yyyy-MM-dd")}'>
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdBondTrade.fundSettleDate}">资金交收日期</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="fundSettleDate" name="fundSettleDate" required
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value='${#dates.format(entity?.fundSettleDate,"yyyy-MM-dd")}'>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdBondTrade.dealNum}">成交数量</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="dealNum" name="dealNum" required
                                           class="layui-input form-input text-number"
                                           maxLength="28" data-textrange="2" data-fixtype="2"
                                           th:value="${entity?.dealNum}"
                                           placeholder="请输入内容">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdBondTrade.tradeAmt}">交易金额</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="tradeAmt" name="tradeAmt" required
                                           class="layui-input form-input text-number"
                                           maxLength="28" data-textrange="2" data-fixtype="2"
                                           th:value="${entity?.tradeAmt}"
                                           placeholder="请输入内容">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdBondTrade.intAmt}">应收利息总额</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="intAmt" name="intAmt" required
                                           class="layui-input form-input text-number"
                                           maxLength="28" data-textrange="2" data-fixtype="2"
                                           placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.intAmt}" />
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdBondTrade.cprice}">净价</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text"  id="cprice" name="cprice" required disabled
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            maxLength="28" data-textrange="2" data-fixtype="2"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            data-th-value="${entity?.cprice}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdBondTrade.exchangeDate}">汇率日期</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="exchangeDate" name="exchangeDate" required
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value='${#dates.format(entity?.exchangeDate,"yyyy-MM-dd")}'>
                                </div>
                            </div>
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdBondTrade.brokerage}">经手费</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text" id="brokerage" name="brokerage" required
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            maxLength="28" data-textrange="2" data-fixtype="2"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.brokerage?:0}" />
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdBondTrade.stlAmt}">结算费</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text" id="stlAmt" name="stlAmt" required
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            maxLength="28" data-textrange="2" data-fixtype="2"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.stlAmt?:0}" />
                                </div>
                            </div>
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdBondTrade.commission}">净佣金</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text" id="commission" name="commission" required
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            maxLength="28" data-textrange="2" data-fixtype="2"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.commission?:0}" />
                                </div>
                            </div>
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdBondTrade.dealFeeAmt}">交易手续费</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text" id="dealFeeAmt" name="dealFeeAmt" required
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            maxLength="28" data-textrange="2" data-fixtype="2"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.dealFeeAmt?:0}" />
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdBondTrade.stlFeeAmt}">结算手续费</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text" id="stlFeeAmt" name="stlFeeAmt" required
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            maxLength="28" data-textrange="2" data-fixtype="2"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.stlFeeAmt?:0}" />
                                </div>
                            </div>
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdBondTrade.otherAmt}">其他费用</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text" id="otherAmt" name="otherAmt" required
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            maxLength="28" data-textrange="2" data-fixtype="2"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.otherAmt?:0}" />
                                </div>
                            </div>
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdBondTrade.settleAmt}">结算金额</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text" id="settleAmt" name="settleAmt" required
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            maxLength="28" data-textrange="2" data-fixtype="2"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.settleAmt}" />
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdBondTrade.myAcctNo}">资金账户</label>
                                <div class="layui-input-inline input-inline" >
                                    <select id="myAcctNo" name="myAcctNo" required
                                            class="layui-input form-input input-select"
                                            data-th-data-url="@{/valuation/trademanage/bondlend/TrdBondLendTrade002/getTrdAcctId}"
                                            allowClear="true" placeholder="请输入内容"
                                            data-th-initValue="${entity?.myAcctNo}">
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pro-module-wrap" id="purchInfo">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">申请信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdBondTrade.purchDate}">申购日期</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="purchDate" name="purchDate" required
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${#dates.format(entity?.purchDate,'yyyy-MM-dd')}">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdBondTrade.settleDate}">结算日期</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="settleDate" name="settleDate" required
                                           class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value='${#dates.format(entity?.settleDate,"yyyy-MM-dd")}'>
                                </div>
                            </div>
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdBondTrade.entrustAmt}">申购金额</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text" id="entrustAmt" name="entrustAmt" required
                                            class="layui-input form-input text-number" placeholder="请输入内容"
                                            maxLength="28" data-textrange="2" data-fixtype="2"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.entrustAmt}" />
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdBondTrade.myAcctNo_sq}">资金账户</label>
                                <div class="layui-input-inline input-inline" >
                                    <select id="myAcctNo_sq" name="myAcctNo_sq" required
                                            class="layui-input form-input input-select"
                                            data-th-data-url="@{/valuation/trademanage/bondlend/TrdBondLendTrade002/getTrdAcctId}"
                                            allowClear="true" placeholder="请输入内容"
                                            data-th-initValue="${entity?.myAcctNo_sq}">
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pro-module-wrap" id="confirmInfo">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">确认信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondTrade.confirmDate}">确认日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="confirmDate" name="confirmDate" required
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${#dates.format(entity?.confirmDate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdBondTrade.confirmNum}">中签数量</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="confirmNum" name="confirmNum" required
                                                class="layui-input form-input text-number" placeholder="请输入内容"
                                                maxLength="28" data-textrange="2" data-fixtype="2"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${entity?.confirmNum}" />
                                    </div>
                                </div>
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdBondTrade.confirmAmt}">中签金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="confirmAmt" name="confirmAmt" required
                                                class="layui-input form-input text-number" placeholder="请输入内容"
                                                maxLength="28" data-textrange="2" data-fixtype="2"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${entity?.confirmAmt}" />
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondTrade.receiptArriveDate}">补款到账日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="receiptArriveDate" name="receiptArriveDate" required
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${#dates.format(entity?.receiptArriveDate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdBondTrade.receiptAmt}">补款金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="receiptAmt" name="receiptAmt" required
                                                class="layui-input form-input text-number" placeholder="请输入内容"
                                                maxLength="28" data-textrange="2" data-fixtype="2"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${entity?.receiptAmt}" />
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondTrade.refundArriveDate}">返款到账日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="refundArriveDate" name="refundArriveDate" required
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${#dates.format(entity?.refundArriveDate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" >
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{TrdBondTrade.refundAmt}">返款金额</label>
                                        <div class="layui-input-inline input-inline">
                                            <input  type="text" id="refundAmt" name="refundAmt" required
                                                    class="layui-input form-input text-number" placeholder="请输入内容"
                                                    maxLength="28" data-textrange="2" data-fixtype="2"
                                                    th:placeholder="#{SysCommon.placeholder}"
                                                    th:value="${entity?.refundAmt}" />
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" >
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{TrdBondTrade.myAcctNo_qr}">资金账户</label>
                                        <div class="layui-input-inline input-inline" >
                                            <select id="myAcctNo_qr" name="myAcctNo_qr" required
                                                    class="layui-input form-input input-select"
                                                    data-th-data-url="@{/valuation/trademanage/bondlend/TrdBondLendTrade002/getTrdAcctId}"
                                                    allowClear="true" placeholder="请输入内容"
                                                    data-th-initValue="${entity?.myAcctNo_qr}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

        </form>

        <input type="text" id="workflowId" name="workflowId" class="layui-input form-input" data-th-value="${workflowId}" disabled="disabled" style = "display:none;">
        <input  type="hidden" id="operateType" name="operateType" th:value="${entity?.operateType}">

        <div class="row text-center" style="margin: 20px 0;">
            <a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save"
               data-th-text="#{SysCommon.save}">保存</a>
            <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit"
               data-th-text="#{SysCommon.submit}">提交</a>
            <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">

    <script th:src="@{/js/valuation/trademanage/bond/TrdBondTrade002.js}" type="text/javascript"></script>
</div>
</body>
</html>
