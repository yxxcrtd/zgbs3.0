<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title>双击查看债券借贷</title>
<link rel="stylesheet" type="text/css" data-th-href="@{/css/font/iconfont.css}">
<script type="text/javascript">
		
</script>
<script th:inline="javascript">
     var initps = [[${ps}]];
</script>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form " id="fundForm">
            <div class="layui-collapse">
                <div class="layui-colla-item" id="div0" style="display: none">
                    <h2 class="layui-colla-title">基本信息</h2>
                    <div class="layui-colla-content layui-show">
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">交易编号</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="tradeId" name="tradeId" class="layui-input form-input"
                                        data-th-value="${tradeId}">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">投资主体</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="prodId" name="prodId" class="layui-input form-input"
                                        data-th-value="${entity?.prodId}">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">交易方向</label>
                                <div class="layui-input-inline input-inline">
                                    <select id="ps" name="ps" class="layui-input form-input input-select"
                                        data-th-data-result="${PS}" allowClear="true" data-th-initValue="${ps}">
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">交易日</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="tradeDate" name="tradeDate"
                                        class="layui-input form-input input-dateSelect" allowClear="true"
                                        data-th-value="${entity?.tradeDate}">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">起息日</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="vDate" name="vDate"
                                        class="layui-input form-input input-dateSelect" allowClear="true"
                                        data-th-value="${entity?.vDate}">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">借贷期限</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="termType" name="termType" class="layui-input form-input"
                                        data-th-value="${entity?.termType}">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">到期日</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="mDate" name="mDate"
                                        class="layui-input form-input input-dateSelect" allowClear="true"
                                        data-th-value="${entity?.mDate}">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">借贷方向</label>
                                <div class="layui-input-inline input-inline">
                                    <input id="finprodType" name="finprodType"
                                        class="layui-input form-input input-checkbox" placeholder=""
                                        data-result=" [{&quot;id&quot;:&quot;F23&quot;,&quot;text&quot;:&quot;融入&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;F24&quot;,&quot;text&quot;:&quot;融出&quot;,&quot;col&quot;:&quot;&quot;}]"
                                        allowClear="true" data-th-initvalue="${entity?.finprodTypeCode}"
                                        disabled="disabled">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">计费基础</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="basis" name="basis" class="layui-input form-input"
                                        data-th-value="${entity?.basis}">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">费率(%)</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="intRate" name="intRate" class="layui-input form-input"
                                        data-th-value="${entity?.intRate}">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">币种</label>
                                <div class="layui-input-inline input-inline">
                                    <select id="ccy" name="ccy" class="layui-input form-input input-select"
                                        data-th-data-result="${CCY}" allowClear="true"
                                        data-th-initValue="${entity?.ccyCode}">
                                    </select>
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">标的券债券</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="assetId" name="assetId" class="layui-input form-input"
                                        data-th-value="${entity?.assetId}">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">券面总额</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="shareAmt" name="shareAmt" class="layui-input form-input text-money"
                                        data-th-value="${entity?.shareAmt}">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">借贷费用</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="cdAmt" name="cdAmt" class="layui-input form-input text-money"
                                        data-th-value="${entity?.cdAmt}">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">交易对手</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="counterName" name="counterName"
                                        class="layui-input form-input" data-th-value="${entity?.counterName}">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">登记托管机构</label>
                                <div class="layui-input-inline input-inline">
                                    <!--<input type="text" id="registOrg" name="registOrg" class="layui-input form-input"
                                           data-th-value="${entity?.registOrg}">-->
                                    <select id="registOrg"
                                            name="registOrg"
                                            th:initValue="${entity?.registOrg}"
                                            class="layui-input form-input input-select"
                                            placeholder="请输入内容"
                                            data-th-placeholder="#{SysCommon.placeholder}" required
                                            data-th-data-result="${REGIST_ORG}">
                                    </select>
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">结算手续费</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="feeAmt" name="feeAmt" class="layui-input form-input text-money"
                                           data-th-value="${entity?.feeAmt}">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">是否随交易支付</label>
                                <div class="layui-input-inline input-inline">
                                    <select id="isPayWithTrade" name="isPayWithTrade" class="layui-input form-input input-select"
                                            data-th-data-result="${YES_OR_NO}" allowClear="true" data-th-initValue="${entity?.isPayWithTrade}">
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md4" id="div01" style="display: none">
                                <label class="layui-form-label form-lable">首期结算方式</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="fPayment" name="fPayment" class="layui-input form-input">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4" id="div02" style="display: none">
                                <label class="layui-form-label form-lable">到期结算方式</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="mPayment" name="mPayment" class="layui-input form-input">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="layui-colla-item" id="div1" style="display: none">
                    <h2 class="layui-colla-title">费用支付信息</h2>
                    <div class="layui-colla-content layui-show">
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">实付费用</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="realAmt" name="realAmt" class="layui-input form-input text-money"
                                        data-th-value="${entity?.tradeAmt}">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">支付日</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="settleDate" name="settleDate"
                                        class="layui-input form-input input-dateSelect" allowClear="true"
                                        data-th-value="${entity?.settleDate}">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</body>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/trademanage/investtradequery/bondlend/BondLend001.js}" type="text/javascript"></script>
</div>
</html>
