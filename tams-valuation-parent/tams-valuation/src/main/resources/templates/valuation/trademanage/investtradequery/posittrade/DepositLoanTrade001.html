<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>查看存借款交易</title>
    <script type="text/javascript">

    </script>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form " id="fundForm">
        <fieldset class="layui-elem-field layui-field-title" style="margin-top: 1px;">
            <div class="layui-collapse" lay-filter="test">
                <div class="layui-colla-item">
                    <h2  class="layui-colla-title"><a href="javascript:;">基本信息</a></h2>
                    <div class="layui-colla-content layui-show">
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md6">
                                <label class="layui-form-label form-lable">交易编号</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="tradeId" name="tradeId" placeholder=""
                                           class="layui-input form-input"  data-th-value="${entity?.tradeId}">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md6">
                                <label class="layui-form-label form-lable">投资主体</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="prodAbbr" name="prodAbbr" class="layui-input form-input"
                                           placeholder="投资主体" data-th-value="${entity?.prodAbbr}">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md6">
                                <label class="layui-form-label form-lable">交易方向</label>
                                <div class="layui-input-inline input-inline">
                                    <select id="ps" name="ps" class="layui-input form-input input-select"
                                            data-th-data-result="${PS}" placeholder="交易方向" data-th-initValue="${entity?.psCode}">
                                    </select>
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md6">
                                <label class="layui-form-label form-lable">资产代码</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="assetId" name="assetId" class="layui-input form-input" placeholder="" data-th-value="${entity?.assetId}">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md6">
                                <label class="layui-form-label form-lable">资产名称</label>
                                <div class="layui-input-inline input-inline">
                                    <input id="assetAbbr" name="assetAbbr" class="layui-input form-input " placeholder=""
                                           allowClear="true" data-th-value="${entity?.assetAbbr}">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md6">
                                <label class="layui-form-label form-lable">交易对手</label>
                                <div class="layui-input-inline input-inline">
                                    <input id="counterId" name="counterId"
                                           class="layui-input form-input "
                                           allowClear="true" data-th-value="${entity?.counterId}">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
<!--                             <div class="layui-inline layui-col-md6">
                                <label class="layui-form-label form-lable">内外部交易</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="countertype" name="countertype"
                                           class="layui-input form-input input-checkbox"
                                           data-th-data-result="${COUNTER_TYPE}"
                                           data-th-initvalue="${entity?.counterType}" allowClear="true" disabled="disabled">
                                </div>
                            </div> -->
                            <div class="layui-inline layui-col-md6">
                                <label class="layui-form-label form-lable">交易日</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="tradeDate" name="tradeDate" placeholder=""
                                           class="layui-input form-input input-dateSelect"
                                           data-th-value="${entity?.tradeDate}">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md6">
                                <label class="layui-form-label form-lable">交割日</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="settleDate" name="settleDate" placeholder=""
                                           class="layui-input form-input input-dateSelect"
                                           data-th-value="${entity?.settleDate}">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md6">
                                <label class="layui-form-label form-lable">币种</label>
                                <div class="layui-input-inline input-inline">
                                    <input id="ccy" name="ccy"
                                           class="layui-input form-input" placeholder=""
                                           data-th-data-result="${CCY}" allowClear="true"
                                           data-th-value="${entity?.ccy}">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md6">
                                <label class="layui-form-label form-lable">通道</label>
                                <div class="layui-input-inline input-inline">
                                    <input id="pass" name="pass"
                                           class="layui-input form-input " placeholder=""
                                           allowClear="true" data-th-value="${entity?.pass}">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md6" id="interestBeginDateDiv">
                                <label class="layui-form-label form-lable">计息开始日</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="interestBeginDate" name="interestBeginDate" placeholder=""
                                           class="layui-input form-input input-dateSelect"
                                           data-th-value="${entity?.vDate}">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md6" id="interestEndDateDiv">
                                <label class="layui-form-label form-lable">计息结束日</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="interestEndDate" name="interestEndDate" placeholder=""
                                           class="layui-input form-input input-dateSelect"
                                           data-th-value="${entity?.mDate}">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md6" id="tradeDatediv">
                                <label class="layui-form-label form-lable">计划支付日</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="tradeDate" name="tradeDate" placeholder=""
                                           class="layui-input form-input input-dateSelect"
                                           data-th-value="${entity?.tradeDate}">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </fieldset>

        <fieldset class="layui-elem-field layui-field-title" style="margin-top: 1px;">
            <div class="layui-collapse" lay-filter="test">
                <div class="layui-colla-item">
                    <h2  class="layui-colla-title"><a href="javascript:;">金额信息</a></h2>
                    <div class="layui-colla-content layui-show">
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md6">
                                <label class="layui-form-label form-lable">交易本金</label>
                                <div class="layui-input-inline input-inline">
                                    <input  id="prinAmt" name="prinAmt" class="layui-input form-input text-money"
                                            placeholder="" allowClear="true" disabled="disabled"
                                            data-th-value="${entity?.prinAmt}">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md6">
                                <label class="layui-form-label form-lable">应计利息</label>
                                <div class="layui-input-inline input-inline ">
                                    <input  id="intAmt" name="intAmt" class="layui-input form-input text-money"
                                            placeholder="" allowClear="true"  disabled="disabled"
                                            data-th-value="${entity?.intAmt}">
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md6">
                                <label class="layui-form-label form-lable">通道费用</label>
                                <div class="layui-input-inline input-inline">
                                    <input id="tdFeeAmt" name="tdFeeAmt" disabled="disabled"
                                           class="layui-input form-input text-money" data-th-value="${entity?.tdFeeAmt}">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md6">
                                <label class="layui-form-label form-lable">交易金额</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id=tradeAmt name="tradeAmt"  disabled="disabled"
                                           class="layui-input form-input text-money" data-th-value="${entity?.tradeAmt}" allowClear="true">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </fieldset>
    </form>
    <div class="layui-col-md11" style="margin: 50px;">
        <div class="text-center">
            <a id="ValManualVoucher003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script type="text/javascript">
        //交易方向为收息到期时， 计划开始日，计划截止日，计划支付日显示，其余时隐藏。
        $(function(){
            var psCode = $("#ps").val();
            var ps1=['T07','T09'];  // T07-到期, T09-收息
            if(ps1.indexOf(psCode)>=0){// 对于收息、到期交易  计划开始日，计划截止日，计划支付日显示；
                $("#interestBeginDateDiv").show();
                $("#interestEndDateDiv").show();
                $("#tradeDateDiv").show();
            }else{
                $("#interestBeginDateDiv").hide();
                $("#interestEndDateDiv").hide();
                $("#tradeDatediv").hide();
            }

        });

    </script>
</div>
</body>
</html>
