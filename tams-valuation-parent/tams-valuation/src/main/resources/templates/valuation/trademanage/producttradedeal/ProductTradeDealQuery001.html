<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/default}">
<head>
	<meta charset="UTF-8">
	<title>TA交易-汇总查询</title>
</head>
<body>
</body>
<div layout:fragment="content">
	<div class="form-button-area"></div>
	<div class="joyin-form-wrap joyin-filter-form condition-area">
		<form class="layui-form" id="searchForm">
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">产品类型</label>
					<div class="layui-input-inline input-inline">
						<select id="profitType" name="profitType"
								class="layui-input form-input input-select"
								data-th-data-result='${PROFIT_TYPE}' allowClear="true"
								multiple="multiple" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}">
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">确认日</label>
					<div class="layui-input-inline input-inline">
						<input id="Date" name="Date" placeholder="请选择、支持区间"
							   class="layui-input form-input input-dateRangeSelect">
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">币种</label>
					<div class="layui-input-inline input-inline">
						<select id="ccy" name="ccy"
								class="layui-input form-input input-select"
								data-th-data-result='${CCY}' allowClear="true"
								multiple="multiple" placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}">
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">产品</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="finprodId" name="finprodId"
							   class="layui-input form-input input-lenovoselect"
							   placeholder="请输入内容" data-parentids="profitType"
							   data-th-placeholder="#{SysCommon.placeholder}"
							   data-th-data-url="@{/valuation/trademanage/producttradedeal/ProductTradeDealQuery001/getFinprodWithTd}"
							   data-idfield="code" data-keyfield="code"
							   data-th-data-effectivefieldsalias='|{"code":"#{ProductTradeDealQuery001.finprodId}","shortName":"#{ProductTradeDealQuery001.finprodNameAttr}"}|'>
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">发行方式</label>
					<div class="layui-input-inline input-inline">
						<!-- <input type="text" id="issueType" name="issueType"
                            class="layui-input form-input input-checkbox"
                            data-th-data-result="${ISSUE_TYPE}"
                            allowClear="true" multiple="multiple"> -->
						<!-- <input type="checkbox" class="issueType" name="issueType" title="封闭式" value="01">
                            <input type="checkbox" class="issueType" name="issueType" title="开放式" value="02">  -->
						<input type="text" id="issueType" name="issueType"
							   class="layui-input form-input input-select"
							   data-th-data-result="${ISSUE_TYPE}" allowClear="true"
							   placeholder="请输入内容" multiple="multiple">
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">展示维度</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="parentOrson" name="parentOrson"
							   class="layui-input form-input input-checkbox"
							   data-result="[{&quot;id&quot;:&quot;parent&quot;,&quot;text&quot;:&quot;母产品&quot;,&quot;col&quot;:&quot;&quot;},
                                          {&quot;id&quot;:&quot;son&quot;,&quot;text&quot;:&quot;子产品&quot;,&quot;col&quot;:&quot;&quot;}]"
							   initValue="parent" allowClear="true">
					</div>
				</div>
			</div>
		</form>
	</div>
	<div id="dataTable"></div>
</div>
<div layout:fragment="script">
	<script
			data-th-src="@{/js/valuation/trademanage/producttradedeal/ProductTradeDealQuery001.js}"
			type="text/javascript"></script>
</div>
</html>
