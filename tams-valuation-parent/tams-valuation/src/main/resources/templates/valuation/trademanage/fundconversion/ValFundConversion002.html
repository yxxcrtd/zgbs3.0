<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>新建-基金转入转出交易(货币型转出)</title>

<body>

</body>
<div layout:fragment="content">
  <form id="submitForm">
    <div class="layui-form layui-clear" style=" margin-top:10px;">
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>产品</label>
        <div class="layui-input-inline input-inline">
          <input type="text"  class="layui-input form-input input-lenovoselect" placeholder="请选择产品或输入关键词" value="" data-url="/system/institution/SysInstitution001/getInstitutionCode" data-idfield="code" data-keyfield="code" data-effectivefieldsalias='{&quot;code&quot;:&quot;产品代码&quot;,&quot;shortName&quot;:&quot;产品名称&quot;}'>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>账套代码</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input" placeholder="请输入内容" value="" required>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>转出基金代码</label>

          <input type="text"  class="layui-input form-input input-lenovoselect" placeholder="请选择基金或输入关键词" value="" data-url="/system/institution/SysInstitution001/getInstitutionCode" data-idfield="code" data-keyfield="code" data-effectivefieldsalias='{&quot;code&quot;:&quot;基金代码&quot;,&quot;shortName&quot;:&quot;基金名称&quot;}'>
        </div>
      </div>
    </div>
    <div class="layui-form layui-clear" style=" margin-top:10px;">
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>转出基金名称</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input" placeholder="自动代入" value="" disabled="disabled">
        </div>
      </div>
      <div class="layui-inline layui-col-md4">

        </div>
      </div>

        <label class="layui-form-label form-lable2">交易市场</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;上交所&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;10&quot;,&quot;text&quot;:&quot;深交所&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;银行间&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;10&quot;,&quot;text&quot;:&quot;中金所&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;中国黄金交易所&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;10&quot;,&quot;text&quot;:&quot;大连商品交易所&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;10&quot;,&quot;text&quot;:&quot;郑州商品交易所&quot;,&quot;col&quot;:&quot;&quot;}]'>
        </div>
      </div>
    </div>
    <div class="layui-form layui-clear" style=" margin-top:10px;">  
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>转出日期</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-dateSelect" placeholder="请选择日期" required>
        </div>
      </div> 
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>转出份额</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input text-money" placeholder="请输入内容" value="" required>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">转出费用</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input text-money" placeholder="请输入内容" value="" required>
        </div>
      </div>
    </div>
    <div class="layui-form layui-clear" style=" margin-top:10px;">
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>转出金额</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input text-money" placeholder="请输入内容" value="" required>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>转入基金代码</label>

          <input type="text"  class="layui-input form-input input-lenovoselect" placeholder="请选择基金或输入关键词" value="" data-url="/system/institution/SysInstitution001/getInstitutionCode" data-idfield="code" data-keyfield="code" data-effectivefieldsalias='{&quot;code&quot;:&quot;基金代码&quot;,&quot;shortName&quot;:&quot;基金名称&quot;}'>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>转入基金名称</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input" placeholder="自动代入" value="" disabled="disabled">
        </div>
      </div>
    </div>
    <div class="layui-form layui-clear" style=" margin-top:10px;"> 
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>转入市场代码</label>
        <div class="layui-input-inline input-inline">
          <input type="text"  class="layui-input form-input input-lenovoselect" placeholder="请选择基金或输入关键词" value="" data-url="/system/institution/SysInstitution001/getInstitutionCode" data-idfield="code" data-keyfield="code" data-effectivefieldsalias='{&quot;code&quot;:&quot;市场代码&quot;,&quot;shortName&quot;:&quot;市场名称&quot;}'>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">交易市场</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;上交所&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;10&quot;,&quot;text&quot;:&quot;深交所&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;银行间&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;10&quot;,&quot;text&quot;:&quot;中金所&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;中国黄金交易所&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;10&quot;,&quot;text&quot;:&quot;大连商品交易所&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;10&quot;,&quot;text&quot;:&quot;郑州商品交易所&quot;,&quot;col&quot;:&quot;&quot;}]'>
        </div>
      </div>

        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>转入份额</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input text-money" placeholder="请输入内容" value="" required>
        </div>
      </div>
    </div>
    <div class="layui-form layui-clear" style=" margin-top:10px;">

        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>转入净值</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input text-money" placeholder="请输入内容" value="" required>

      </div>

        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>转入金额</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input text-money" placeholder="请输入内容" value="" required>

      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>入账日</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-dateSelect" placeholder="请选择日期" required>
        </div>
      </div>
    </div>
    <div class="layui-form layui-clear" style=" margin-top:10px;">
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>交易币种</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;人民币&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;10&quot;,&quot;text&quot;:&quot;澳大利亚元&quot;,&quot;col&quot;:&quot;&quot;}]'>
        </div>
      </div>

        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>记账币种</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input" value="自动代入交易币种" disabled>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>汇率</label>

  <div class="layui-col-md11" style="margin:15px;">
    <div class="text-center"> <a id="ValFundConversion002_btn_save" class="layui-btn layui-btn-sm btn-save">保存</a> <a id="ValFundConversion002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a> <a id="ValFundConversion002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a> </div>
