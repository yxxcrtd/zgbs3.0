<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorator="~{layout/default}">
<head>
    <title th:text="#{TrdBondLendTrade002}">债券借贷交易</title>
</head>
<body>
<div layout:fragment="content">
    <style type="text/css">
        .layui-form-radio {
            line-height: 24px;
            padding-right: 0px;
            margin: 0px;
        }
        .layui-form-radio div {
            font-size: 12px;
        }
        .layui-form-radio i{
            font-size: 14px;
        }
    </style>
    <div class="pro-module-container" style="margin-bottom: 20px;">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base" >
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" >基本信息</span><i
                                class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondLendTrade002.tradeId}">交易编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeId" name="tradeId"
                                               required disabled
                                               placeholder="提交后自动生成，无需填写"
                                               class="layui-input form-input"
                                               data-th-value="${entity?.tradeId}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondLendTrade002.outTradeId}">外部成交编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="outTradeId" name="outTradeId"
                                               class="layui-input form-input"
                                               data-th-value="${entity?.outTradeId}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondLendTrade002.prodId}">产品代码</label>
                                        <div class="layui-input-inline input-inline" >
                                            <select id="prodId" name="prodId" required
                                                    class="layui-input form-input input-select"
                                                    data-th-data-url="@{/valuation/trademanage/bondlend/TrdBondLendTrade002/getFinprodId}"
                                                     allowClear="true" placeholder="请输入内容"
                                                    th:formatoption="false"
                                                    data-th-initValue="${entity?.prodId}" >
                                            </select>
                                        </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdBondLendTrade002.prodName}">产品名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="prodName" name="prodName" required disabled
                                               class="layui-input form-input" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.prodName}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondLendTrade002.secId}">标的债券代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="secId" name="secId" required
                                                class="layui-input form-input input-select"
                                                data-th-data-url="@{/valuation/trademanage/bondlend/TrdBondLendTrade002/getAssetId}"
                                                allowClear="true"
                                                th:formatoption="false"
                                                data-th-initValue="${entity?.secId}"
                                                placeholder="请输入内容">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondLendTrade002.secAbbr}">标的债券简称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="secAbbr" name="secAbbr"
                                               class="layui-input form-input"
                                               required disabled
                                               data-th-value="${entity?.secAbbr}"
                                               placeholder="请输入内容">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondLendTrade002.ps}">交易类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="ps" name="ps" required
                                                class="layui-input form-input input-select"
                                                allowClear="true" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initValue="${entity?.ps}">
                                            <option value=""></option>
                                            <option value="01">融入</option>
                                            <option value="02">融出</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondLendTrade002.term}">借贷期限</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="term" name="term"
                                               class="layui-input form-input text-number" placeholder="请输入内容" maxlength="30"
                                               th:placeholder="#{SysCommon.placeholder}" data-fixtype="2" data-textrange="0"
                                               data-th-value="${entity?.term}">
                                        <span class="input-right-show">天</span>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondLendTrade002.tradeDate}">交易日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="tradeDate" name="tradeDate" required
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${#dates.format(entity?.tradeDate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondLendTrade002.settdateDate}">交割日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="settdateDate" name="settdateDate" required
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${#dates.format(entity?.settdateDate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondLendTrade002.vdate}">起息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="vdate" name="vdate" required
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable"
                                           data-th-text="#{TrdBondLendTrade002.mdate}">到期日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="mdate" name="mdate" required
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               data-th-placeholder="#{SysCommon.placeholder}"
                                               data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">金额信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdBondLendTrade002.prinAmt}">券面总额（万元）</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="prinAmt" name="prinAmt" required
                                           class="layui-input form-input text-number"
                                           maxLength="28" data-textrange="2" data-fixtype="2"
                                           th:value="${entity?.prinAmt}"
                                           placeholder="请输入内容">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{TrdBondLendTrade002.feeRate}">借贷费率%</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="feeRate" name="feeRate" required
                                           class="layui-input form-input text-number"
                                           maxLength="30" data-textrange="4" data-fixtype="2"
                                           th:value="${entity?.feeRate}"
                                           placeholder="请输入内容">
                                </div>
                            </div>
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdBondLendTrade002.fee}">借贷费用</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="fee" name="fee" required
                                           class="layui-input form-input text-number"
                                           maxLength="28" data-textrange="2" data-fixtype="2"
                                           placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                           th:value="${entity?.fee}" />
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="form-inline-wrap">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{TrdBondLendTrade002.ccy}">币种</label>
                                <div class="layui-input-inline input-inline">
                                    <select  type="text" id="ccy" name="ccy" required
                                            class="layui-input form-input input-select"
                                            placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                            th:data-result='${CCY}'
                                            allowClear="true"
                                            formatoption="true"
                                            th:initValue="*{entity?.ccy?:CCY_default}"></select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">费用信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdBondLendTrade002.dealFeeAmt}">交易手续费</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="dealFeeAmt" name="dealFeeAmt"
                                                class="layui-input form-input text-number"
                                                maxLength="28" data-textrange="2" data-fixtype="2"
                                                placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${entity?.dealFeeAmt?:0}" />
                                    </div>
                                </div>
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdBondLendTrade002.stlFeeAmt}">结算服务费</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="stlFeeAmt" name="stlFeeAmt"
                                                class="layui-input form-input text-number"
                                                maxLength="28" data-textrange="2" data-fixtype="2"
                                                placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${entity?.stlFeeAmt?:0}" />
                                    </div>
                                </div>
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-label-wrap"
                                           data-th-text="#{TrdBondLendTrade002.otherAmt}">其他费用</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="otherAmt" name="otherAmt"
                                                class="layui-input form-input text-number"
                                                maxLength="28" data-textrange="2" data-fixtype="2"
                                                placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${entity?.otherAmt?:0}" />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title"><span class="title-des">汇总信息</span><i
                            class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label"
                                       data-th-text="#{TrdBondLendTrade002.settleAmt}">结算金额</label>
                                <div class="layui-input-inline input-inline">
                                    <input  type="text" id="settleAmt" name="settleAmt" required
                                            class="layui-input form-input text-number"
                                            maxLength="28" data-textrange="2" data-fixtype="2"
                                            placeholder="请输入内容"
                                            th:placeholder="#{SysCommon.placeholder}"
                                            th:value="${entity?.settleAmt}" />
                                </div>
                            </div>
                            <div class="form-inline-wrap" >
                                <label class="layui-form-label form-label"
                                       data-th-text="#{TrdBondLendTrade002.acctNo}">资金账户</label>
                                <div class="layui-input-inline input-inline" >
                                    <select id="acctNo" name="acctNo" required
                                            class="layui-input form-input input-select"
                                            data-th-data-url="@{/valuation/trademanage/bondlend/TrdBondLendTrade002/getTrdAcctId}"
                                            allowClear="true" placeholder="请输入内容"
                                            th:formatoption="true"
                                            data-th-initValue="${entity?.acctNo}">
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </form>

        <input type="text" id="workflowId" name="workflowId" class="layui-input form-input" data-th-value="${workflowId}" disabled="disabled" style = "display:none;">

        <div class="row text-center" style="margin: 20px 0;">
            <a th:id="|${pageId}_btn_save|" class="layui-btn layui-btn-sm btn-save"
               data-th-text="#{SysCommon.save}">保存</a>
            <a th:id="|${pageId}_btn_submit|" class="layui-btn layui-btn-sm btn-submit"
               data-th-text="#{SysCommon.submit}">提交</a>
            <a th:id="|${pageId}_btn_cancel|" class="layui-btn layui-btn-sm btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">

    <script th:src="@{/js/valuation/trademanage/bondlend/TrdBondLendTrade002.js}" type="text/javascript"></script>
</div>
</body>
</html>
