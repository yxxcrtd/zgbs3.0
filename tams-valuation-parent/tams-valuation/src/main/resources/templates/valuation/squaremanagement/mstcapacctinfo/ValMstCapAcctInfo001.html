<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title>清算账户查询</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="layui-col-md12" style="margin:10px;">
	        <a id="ValMstCapAcctInfo001_BTN_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
	        <a id="ValMstCapAcctInfo001_BTN_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}" style="display:none;">删除</a>
	        <!--  <a id="ValMstCapAcctInfo001_BTN_export" class="layui-btn layui-btn-sm btn-export" data-th-text="#{SysCommon.export}">导出</a>-->
        	<a id="ValMstCapAcctInfo001_btn_filter" class="layui-btn layui-btn-sm btn-filter" data-th-text="#{SysCommon.filter}">筛选</a>
       </div>
        <form class="layui-form joyin-form-wrap joyin-filter-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md3">
                    <label class="layui-form-label form-lable">账号</label>
	                <div class="layui-input-inline input-inline">
	                    <input type="text" id="acctNo" name="acctNo" class="layui-input form-input" value="">
	                </div>
                </div>
                <div class="layui-inline layui-col-md3">
                    <label class="layui-form-label form-lable">户名</label>
	                <div class="layui-input-inline input-inline">
	                    <input type="text" id="acctName" name="acctName" class="layui-input form-input" value="">
	                </div>
                </div>
               <div class="layui-inline layui-col-md3">
                    <label class="layui-form-label form-lable">开户行</label>
	                <div class="layui-input-inline input-inline">
	                    <input type="text" id="bankDep" name="bankDep" class="layui-input form-input" value="">
	                </div>
                </div>
                <div class="layui-inline layui-col-md3">
                    <a id="ValMstCapAcctInfo001_BTN_search" class="layui-btn layui-btn-sm btn-search" data-th-text="#{SysCommon.search}">查询</a>

                    <a id="ValMstCapAcctInfo001_BTN_reset" class="layui-btn layui-btn-sm btn-reset" data-th-text="#{SysCommon.reset}">重置</a>
                </div>
            </div>
        </form>

        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/squaremanagement/mstcapacctinfo/ValMstCapAcctInfo001.js}" type="text/javascript"></script>
    </div>
</body>

</html>
