<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>结算指令查询</title>
</head>
<body>

</body>
<div layout:fragment="content">
    <div class="form-button-area" export="false">
    </div>
    <form class="layui-form joyin-form-wrap joyin-filter-form" id="searchForm" style="display: none;">
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md3">
                <label class="layui-form-label form-lable">交易编号</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="tradeId" name="tradeId" class="layui-input form-input" value="">
                </div>
            </div>
            <div class="layui-inline layui-col-md3">
                <label class="layui-form-label form-lable">业务类型</label>
                <div class="layui-input-inline input-inline">
                    <select id="busiType" name="busiType" class="layui-input form-input input-select" placeholder="请选择" data-th-data-result="${BUSI_TYPE_ORDER_TYPE}" allowClear="true"></select>
                </div>
            </div>
            <div class="layui-inline layui-col-md3">
                <label class="layui-form-label form-lable">收付方向</label>
                <div class="layui-input-inline input-inline">
                    <select id="ps" name="ps" class="layui-input form-input input-select" placeholder="请选择" data-th-data-result="${PS}" allowClear="true"></select>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md3">
                <label class="layui-form-label form-lable">结算日期</label>
                <div class="layui-input-inline input-inline">
                  <input type="text" id="settleDateStart" name="settleDateStart" placeholder="请选择" class="layui-input form-input input-dateSelect" data-th-value="${accountDateStart}">
                </div>
            </div>
            <div class="layui-inline layui-col-md3">
                <label class="layui-form-label form-lable" style="text-align:center;">—</label>
                <div class="layui-input-inline input-inline">
                  <input type="text" id="settleDateEnd" name="settleDateEnd" placeholder="请选择" class="layui-input form-input input-dateSelect" data-th-value="${accountDateEnd}">
                </div>
            </div>
            <div class="layui-inline layui-col-md3">
                <a class="layui-btn layui-btn-sm btn-search" id="ValOrdersQuery001_btn_search"><i class="iconfont icon-search"></i><span>&nbsp;&nbsp;查询</span></a>
                <a class="layui-btn layui-btn-sm btn-reset" id="ValOrdersQuery001_btn_reset"><i class="iconfont icon-reset"></i><span>&nbsp;&nbsp;重置</span></a>
            </div>
        </div>
    </form>
    <div id="dataTable"></div>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/squaremanagement/ordersquery/ValOrdersQuery001.js}" type="text/javascript"></script>
</div>
</html>
