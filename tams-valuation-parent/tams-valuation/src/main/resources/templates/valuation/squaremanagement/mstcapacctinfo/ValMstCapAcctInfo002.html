<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title>清算账户新建</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">账号</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="acctNo" name="acctNo" class="layui-input form-input"
                            placeholder="请输入内容" data-th-value="${entity?.acctNo}"  maxlength="32" required>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">户名</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="acctName" name="acctName" class="layui-input form-input"
                            placeholder="请输入内容"  data-th-value="${entity?.acctName}" maxlength="200" required>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">开户行</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="bankDep" name="bankDep" class="layui-input form-input"
                            placeholder="请输入内容"  data-th-value="${entity?.bankDep}"
                            data-th-data-result='${DEPT_FUN}' maxlength="50" required>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">行内行外</label>
                    <div class="layui-input-inline input-inline">
                    <select id="inOutBank" name="inOutBank" class="layui-input form-input input-select" placeholder="请选择" 
                           data-th-value="${entity?.inOutBank}"
                           data-th-data-result="${IN_OUT_BANK}" allowClear="true"></select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">联行行号</label>
                    <div class="layui-input-inline input-inline">
                         <input type="text" id="corrNo" name="corrNo" class="layui-input form-input" placeholder="请输入内容"
                           data-th-value="${entity?.corrNo}" maxlength="100" >
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">大额支付系统号</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="largePayno" name="largePayno" class="layui-input form-input" placeholder="请输入内容"
                           data-th-value="${entity?.largePayno}" maxlength="100" >
                    </div>
                </div>
            </div>
             <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">境内境外</label>
                    <div class="layui-input-inline input-inline">
                    <select id="inOut" name="inOut" class="layui-input form-input input-select" placeholder="请选择" 
                      data-th-value="${entity?.inOut}"
                      data-th-data-result="${BLN_AREA}" allowClear="true"></select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">是否DVP清算</label>
                    <div class="layui-input-inline input-inline">
                    	<select id="isDvp" name="isDvp" class="layui-input form-input input-select" placeholder="请选择" 
                    	  data-th-value="${entity?.isDvp}"
                    	  data-th-data-result="${YES_OR_NO}" allowClear="true"></select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">是否允许透支</label>
                    <div class="layui-input-inline input-inline">
                    	<select id="isOverdraw" name="isOverdraw" class="layui-input form-input input-select" placeholder="请选择" 
                    	   data-th-value="${entity?.isOverdraw}"
                    	   data-th-data-result="${YES_OR_NO}" allowClear="true"></select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
             <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">币种</label>
                <div class="layui-input-inline input-inline">
                    <select id="cyy" name="cyy" class="layui-input form-input input-select" placeholder="请选择" 
                      data-th-value="${entity?.cyy}"
                      data-th-data-result="${CCY}" allowClear="true"></select>
                </div>
             </div>
              <div class="layui-inline layui-col-md4">
	              <div class="layui-input-inline input-inline" style="display:none;">
                     <input type="text" id="dealType" name="dealType" class="layui-input form-input"
                         placeholder="请输入内容" data-th-value="${entity?.dealType}" required>
	               </div>
             </div>
            </div>
        </form>
        <div class="layui-col-md11" style="margin:50px;">
            <div class="text-center">
<!--                 <a id="ValMstCapAcctInfo002_BTN_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a> -->
                <a id="ValMstCapAcctInfo002_BTN_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                <a id="ValMstCapAcctInfo002_BTN_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/squaremanagement/mstcapacctinfo/ValMstCapAcctInfo002.js}" type="text/javascript"></script>
    </div>
</body>

</html>
