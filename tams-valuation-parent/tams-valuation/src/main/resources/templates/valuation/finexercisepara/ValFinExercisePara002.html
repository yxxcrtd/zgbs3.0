<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title>新建含权债摊销参数设置</title>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form " id="dataForm">
			<div class="layui-form-item" style="display: none;">
			     <input type="text" id="branch" name="branch" placeholder="分支序号" class="layui-input form-input"
                    data-th-value="${entity?.branch}">
				<input type="text" id="workflowId" name="workflowId" placeholder="流程 Id" class="layui-input form-input"
					data-th-value="${entity?.workflowId}">
				<input type="hidden" id="pageModel" name="pageModel" th:value="${pageModel}" />
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md12">
					<label class="layui-form-label form-lable"><span style="color: red"> * </span> 账套代码</label>
					<div class="layui-input-inline input-inline">
						<select id="booksetId" name="booksetId" class="layui-input form-input input-select"
							data-th-data-url="@{/valuation/finexercisepara/ValFinExercisePara002/getBooksetId}"
							allowClear="true" data-th-initvalue="${entity?.booksetId}" placeholder="请输入内容"
							formatoption="false">
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md12">
					<label class="layui-form-label form-lable"><span style="color: red"> * </span> 资产代码</label>
					<div class="layui-input-inline input-inline">
						<select id="finprodId" name="finprodId" class="layui-input form-input input-select"
							data-th-data-url='@{/valuation/finexercisepara/ValFinExercisePara002/findFinprod}'
							allowClear="true" data-th-placeholder="#{SysCommon.placeholder}" data-th-initvalue="${entity?.finprodId}"
							formatoption="false">
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md12">
					<label class="layui-form-label form-lable">资产名称</label>
					<div class="layui-input-inline input-inline">
						<input id="finprodName" name="finprodName" class="layui-input form-input" placeholder="请输入"
							data-th-value="${entity?.finprodName}" disabled="disabled">
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md12">
					<label class="layui-form-label form-lable"><span style="color: red"> * </span>行权摊销日设置</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="exeDateType" name="exeDateType" class="layui-input form-input input-select"
							data-th-data-result="${EXEC_DATE}" data-th-initValue="${entity?.exeDateType}">
					</div>
				</div>
				<div class="layui-row" style="margin: 50px;">
					<div class="text-center">
						<!-- <button type="button" class="layui-btn btn-save" id="ValFinExercisePara002_btn_save">保存</button> -->
						<button type="button" class="layui-btn btn-submit" id="ValFinExercisePara002_btn_submit">提交</button>
						<a type="button" class="layui-btn btn-cancel" id="ValFinExercisePara002_btn_cancel">取消</a>
					</div>
				</div>
		</form>
	</div>
	<div layout:fragment="script">
		<script data-th-src="@{/js/valuation/finexercisepara/ValFinExercisePara002.js}" type="text/javascript"></script>
	</div>
</body>
</html>
