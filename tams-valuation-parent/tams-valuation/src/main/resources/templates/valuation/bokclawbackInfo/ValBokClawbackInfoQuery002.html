<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title>记账凭证查询</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form " id="schemeForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <label class="layui-form-label form-lable">凭证编号</label>
                    <div class="layui-input-inline input-inline">
                        <input id="vouchNum" name="vouchNum" class="layui-input form-input" placeholder="请输入"
                            data-th-value="${entity?.vouchNum}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <label class="layui-form-label form-lable">业务凭证编号</label>
                    <div class="layui-input-inline input-inline">
                        <input id="busVouchnum" name="busVouchnum" class="layui-input form-input" placeholder="请输入"
                            data-th-value="${entity?.busVouchnum}">
                    </div>
                </div>
            </div>
            <div class="layui-row" style="margin: 50px;">
                <div class="text-center">
                    <!-- <button type="button" class="layui-btn btn-save" id="ValBokClawbackInfoQuery001_btn_save">保存</button>
                    <button type="button" class="layui-btn btn-submit" id="ValBokClawbackInfoQuery001_btn_submit">提交</button> -->
                    <a type="button" class="layui-btn btn-cancel" id="ValBokClawbackInfoQuery001_btn_cancel">取消</a>
                </div>
            </div>
        </form>
    </div>
<!--     <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/taxparametermanage/taxscheme/ValBokClawbackInfoQuery001.js}" type="text/javascript"></script>
    </div> -->
</body>
</html>
