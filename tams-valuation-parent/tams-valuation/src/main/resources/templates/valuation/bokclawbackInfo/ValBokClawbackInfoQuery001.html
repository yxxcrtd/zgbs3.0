<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>回补信息查询</title>
</head>
<body>
</body>
<div layout:fragment="content">
	<div class="form-button-area" export="false"></div>
	<div class="joyin-form-wrap joyin-filter-form condition-area">
		<form class="layui-form" id="searchForm">
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-lable2"
						data-th-text="#{ValSubjectSet001.booksetId}">所属账套</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="booksetId" name="booksetId"
							class="layui-input form-input input-lenovoselect"
							placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}"
							data-th-data-url="@{/valuation/bokclawbackInfo/ValBokClawbackInfoQuery001/getBooksetId}" data-idfield="code"
							data-keyfield="code"
							data-th-data-effectivefieldsalias='|{"code":"#{ValSubjectSet001.booksetId}","shortName":"#{ValSubjectSet001.booksetName}"}|'>
					</div>
				</div>
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-lable">记账日期</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="booksetDate" name="booksetDate"
							class="layui-input form-input input-dateRangeSelect"
							placeholder="请选择时间区间">
					</div>
				</div>
			</div>
		</form>
	</div>
	<div id="dataTable"></div>
</div>
<div layout:fragment="script">
	<script
		data-th-src="@{/js/valuation/bokclawbackInfo/ValBokClawbackInfoQuery001.js}"
		type="text/javascript"></script>
</div>
</html>
