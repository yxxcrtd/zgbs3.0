<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>产品信息查询</title>
</head>
<body>

</body>
<div layout:fragment="content">
	<div class="form-button-area" export="true">
	        <a id="FinNCProductBuild001_btn_add" class="layui-btn layui-btn-sm btn-create">新建</a>
            <a id="FinNCProductBuild001_btn_delete" class="layui-btn layui-btn-sm btn-delete" >删除</a>
	</div>
	<div class="joyin-form-wrap joyin-filter-form condition-area">
		<form class="layui-form" id="searchForm">
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">产品类型</label>
					<div class="layui-input-inline input-inline">
						<select id="profitType" name="profitType"
							class="layui-input form-input input-select"
							data-th-data-result="${PROFIT_TYPE}" allowClear="true"
							multiple="multiple" placeholder="请输入内容" formatoption="true">
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">金融产品类型</label>
					<div class="layui-input-inline input-inline">
						<select id="finprodType" name="finprodType"
							class="layui-input form-input input-select"
							data-th-data-result="${FINPROD_TYPE}" allowClear="true"
							placeholder="请输入内容" formatoption="true">
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">发行方式</label>
					<div class="layui-input-inline input-inline">
						<select id="operationType" name="operationType"
							class="layui-input form-input input-select"
							data-th-data-result="${ISSUE_MODE}" allowClear="true"
							multiple="multiple" placeholder="请输入内容">
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">产品</label>
					<div class="layui-input-inline input-inline">
						<select id="finprodId" name="finprodId"
							class="layui-input form-input input-select"
							data-th-data-url="@{/valuation/finncproductbuild/FinNCProductBuild001/getFinprodId}" multiple="multiple"
							allowClear="true" placeholder="请输入内容" formatoption="true">
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">起息日</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="vdate" name="vdate"
							class="layui-input form-input input-dateRangeSelect" value=""
							placeholder="请选择，支持区间">
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">到期日</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="mdate" name="mdate"
							class="layui-input form-input input-dateRangeSelect" value=""
							placeholder="请选择，支持区间">
					</div>
				</div>
			</div>
		</form>
	</div>
	<div id="dataTable"></div>
</div>
<div layout:fragment="script">
	<script
		data-th-src="@{/js/valuation/finncproductbuild/FinNCProductBuild001.js}"
		type="text/javascript"></script>
</div>
</html>
