<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>费率调整</title>
</head>
<body>
<div layout:fragment="content">
		<form class="layui-form" id="saveForm">
			<div class="layui-form-item">
<!-- 				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-lable">期次</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="period" name="period" data-th-required="true"
                                            class="layui-input form-input" data-th-value="${entity?.period}">
					</div>
				</div> -->
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-lable">费用类型</label>
					<div class="layui-input-inline input-inline">
                        <select id="cashType2" name="cashType2" data-th-required="true"
                              class="layui-input form-input input-select" 
                              data-th-data-result="${CASH_TYPE_2}" disabled="disabled"
                              data-th-initvalue="${entity?.cashType2}">
                          </select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-lable">费率(%)</label>
					<div class="layui-input-inline input-inline">
						<input id="yield" name="yield" class="layui-input form-input text-number" 
						    placeholder="请输入"  data-th-required="true" digit:2>
					</div>
				</div>
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-lable">生效日</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="effDate" name="effDate"
				                               data-th-required="true"
				                               class="layui-input form-input input-dateSelect"
				                               allowClear="true">
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6" style="display: none">
                      <label class="layui-form-label form-lable">计费基础</label>
                      <div class="layui-input-inline input-inline">
                          <select id="basis" name="basis"
                              class="layui-input form-input input-select" 
                              data-th-data-result="${BASIS}" 
                              data-th-initvalue="${entity?.basis}">
                          </select>
                      </div>
                  </div>
                  <div class="layui-inline layui-col-md6" style="display: none">
                      <label class="layui-form-label form-lable">计费基数</label>
                      <div class="layui-input-inline input-inline">
                          <select id="baseType" name="baseType"
                              class="layui-input form-input input-select" 
                              data-th-data-result="${BASE_TYPE}"
                              data-th-initvalue="${entity?.baseType}">
                          </select>
                      </div>
                  </div>
			</div>
			<div class="layui-form-item">
                  <div class="layui-inline layui-col-md6" style="display: none">
                      <label class="layui-form-label form-lable">基数日期类型</label>
                      <div class="layui-input-inline input-inline">
                          <select id="baseDateType" name="baseDateType"
                              class="layui-input form-input input-select" allowClear="true"
                              data-th-data-result="${BASE_DATE_TYPE}"
                              data-th-initvalue="${entity?.baseDateType}">
                          </select>
                      </div>
                  </div>
                  <div class="layui-inline layui-col-md6" style="display: none">
                      <label class="layui-form-label form-lable">产品代码</label>
                      <div class="layui-input-inline input-inline">
                          <input type="text" id="finprodId" name="finprodId" 
                              class="layui-input form-input" data-th-value="${entity?.finprodId}">
                      </div>
                  </div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6" style="display: none">
					<label class="layui-form-label form-lable">金融产品类型</label>
					<div class="layui-input-inline input-inline">
						<select id="finprodType" name="finprodType"
							class="layui-input form-input input-select" 
							data-th-data-result="${FINPROD_TYPE}" 
							data-th-initValue="${entity?.finprodType}">
						</select>
					</div>
				</div>
			</div>
		</form>
        <div class="layui-col-md11" style="margin: 50px;">
            <div class="text-center">
                <a id="FinNCProductBuild003_btn_save" class="layui-btn layui-btn-sm btn-save" 
                       data-th-text="#{SysCommon.save}">保存</a> 
                <a id="FinNCProductBuild003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                    data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
</div>
<div layout:fragment="script">
	<script
		data-th-src="@{/js/valuation/finncproductbuild/FinNCProductBuild003.js}"
		type="text/javascript"></script>
</div>
</body>
</html>
