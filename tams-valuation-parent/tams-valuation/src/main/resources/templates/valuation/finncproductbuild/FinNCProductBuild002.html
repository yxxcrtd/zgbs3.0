<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title>产品新建</title>
<style type="text/css">
.layui-colla-icon {
	right: 15px;
	left: auto;
}

.layui-colla-title a {
	padding-left: 5px;
	border-left: 4px solid #4893e6;
}
</style>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm" style="background: #ffffff; padding: 10px 0;">
             <div class="layui-form-item" style="display: none;">
                <input id="operateType" name="operateType"
                    class="layui-input form-input" placeholder="请输入" data-th-value="${entity?.operateType}">
                <input type="text" id="workflowId" name="workflowId"  placeholder="流程 Id"
                            class="layui-input form-input" data-th-value="${entity?.workflowId}" >
            </div>
            <fieldset class="layui-elem-field layui-field-title" style="margin-top: 1px;">
                <div class="layui-collapse">
                    <div class="layui-colla-item">
                        <h2 class="layui-colla-title">
                            <a href="javascript:;">基本信息</a>
                        </h2>
                        <div class="layui-colla-content layui-show">
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">产品代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodId" name="finprodId" data-th-required="true"
                                            class="layui-input form-input" data-th-value="${entity?.finprodId}">
                                    </div>
                                </div>
								<div class="layui-inline layui-col-md4">
									<label class="layui-form-label form-lable">挂钩母产品</label>
									<div class="layui-input-inline input-inline">
										<select id="pFinprodId" name="pFinprodId"
											class="layui-input form-input input-select"
											data-th-data-url="@{/valuation/finncproductbuild/FinNCProductBuild002/getpFinprodId}" 
											data-th-initValue="${entity?.pFinprodId}">
										</select>
									</div>
								</div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">产品名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodName" name="finprodName" data-th-required="true"
                                            class="layui-input form-input" data-th-value="${entity?.finprodName}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">产品简称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodAbbr" name="finprodAbbr" data-th-required="true"
                                            class="layui-input form-input" data-th-value="${entity?.finprodAbbr}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">产品登记编码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="prodRegistCode" name="prodRegistCode" data-th-required="true"
                                            class="layui-input form-input" data-th-value="${entity?.prodRegistCode}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">发行方式</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="operationType" name="operationType"
                                            class="layui-input form-input input-select" data-th-required="true"
                                            data-th-data-result="${ISSUE_MODE}" allowClear="true"
                                            data-th-initValue="${entity?.operationType}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">收益标识</label>
                                    <div class="layui-input-inline input-inline">
										<select id="profitFlag" name="profitFlag"
											class="layui-input form-input input-select" data-th-required="true"
											data-th-data-result="${PRD_INCOME_TYPE}" allowClear="true"
											data-th-initValue="${entity?.profitFlag}">
										</select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">产品类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="profitType" name="profitType"
                                            class="layui-input form-input input-select" data-th-required="true"
                                            data-th-data-result="${PROFIT_TYPE}" allowClear="true"
                                            data-th-initValue="${entity?.profitType}">
                                    </div>
                                </div>
								<div class="layui-inline layui-col-md4">
									<label class="layui-form-label form-lable">金融产品类型</label>
									<div class="layui-input-inline input-inline">
										<select id="finprodType" name="finprodType"
											class="layui-input form-input input-select" data-th-required="true"
											data-th-data-result="${FINPROD_TYPE}" allowClear="true"
											data-th-initValue="${entity?.finprodType}">
										</select>
									</div>
								</div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">起息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="vdate" name="vdate"
				                               data-th-required="true"
				                               class="layui-input form-input input-dateSelect"
				                               data-th-value="${entity?.vdate}"  allowClear="true">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">到期日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="mdate" name="mdate"
				                               data-th-required="true"
				                               class="layui-input form-input input-dateSelect"
				                               data-th-value="${entity?.mdate}"  allowClear="true">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">是否永续</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="isSus" name="isSus"
                                            class="layui-input form-input input-select" data-th-required="true"
                                            data-th-data-result="${YES_OR_NO}" allowClear="true"
                                            data-th-initValue="${entity?.isSus}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">实际到期日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="actmdate" name="actmdate"
				                               data-th-required="true"
				                               class="layui-input form-input input-dateSelect"
				                               data-th-value="${entity?.actmdate}"  allowClear="true">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">清盘日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="liquidationDate" name="liquidationDate"
				                               data-th-required="true"
				                               class="layui-input form-input input-dateSelect"
				                               data-th-value="${entity?.liquidationDate}"  allowClear="true">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">产品期限</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="term" name="term" class="layui-input form-input"
                                            placeholder="" data-th-value="${entity?.term}" data-th-required="true"> <span
                                            class="input-right-show">天</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">计息基础</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="basis" name="basis" class="layui-input form-input input-select"
                                            data-th-data-result="${BASIS}" allowClear="true" data-th-required="true"
                                            data-th-initValue="${entity?.basis}">
                                        </select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">募集币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="ccy" name="ccy" class="layui-input form-input input-select"
                                            data-th-data-result="${CCY}" allowClear="true" data-th-required="true"
                                            data-th-initValue="${entity?.ccy}">
                                        </select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">募集金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="planraiseAmt" name="planraiseAmt" 
                                            data-th-value="${entity?.planraiseAmt}" class="layui-input form-input">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">是否周期型</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="isCycle" name="isCycle"
                                            class="layui-input form-input input-select" data-th-required="true"
                                            data-th-data-result="${YES_OR_NO}" allowClear="true"
                                            data-th-initValue="${entity?.isCycle}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">份额小数位</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="shareDecDigits" name="shareDecDigits" 
                                            data-th-value="${entity?.shareDecDigits}" class="layui-input form-input">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">份额尾数处理</label>
                                    <div class="layui-input-inline input-inline">
										<select id="shareDecType" name="shareDecType"
											class="layui-input form-input input-select" 
											data-th-data-result="${VALUATION_ROUND_RULE}" allowClear="true"
											data-th-initValue="${entity?.shareDecType}">
										</select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4" id="c_unitvalueDec">
                                    <label class="layui-form-label form-lable">单位净值小数位</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="unitvalueDec" name="unitvalueDec" 
                                            data-th-value="${entity?.unitvalueDec}" class="layui-input form-input">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4" id="c_unitvalueMode">
                                    <label class="layui-form-label form-lable">单位净值尾数处理</label>
                                    <div class="layui-input-inline input-inline">
										<select id="unitvalueMode" name="unitvalueMode"
											class="layui-input form-input input-select" 
											data-th-data-result="${VALUATION_ROUND_RULE}" allowClear="true"
											data-th-initValue="${entity?.unitvalueMode}">
										</select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4" id="c_milionProfitDec">
                                    <label class="layui-form-label form-lable">万份收益小数位</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="milionProfitDec" name="milionProfitDec" 
                                            data-th-value="${entity?.milionProfitDec}" class="layui-input form-input">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4" id="c_milionProfitDecMode">
                                    <label class="layui-form-label form-lable">万份收益尾数处理</label>
                                    <div class="layui-input-inline input-inline">
										<select id="milionProfitDecMode" name="milionProfitDecMode"
											class="layui-input form-input input-select" 
											data-th-data-result="${VALUATION_ROUND_RULE}" allowClear="true"
											data-th-initValue="${entity?.milionProfitDecMode}">
										</select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4" id="c_yearYieldDec">
                                    <label class="layui-form-label form-lable">7日年化收益率小数位</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="yearYieldDec" name="yearYieldDec" 
                                            data-th-value="${entity?.yearYieldDec}" class="layui-input form-input">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4" id="c_yearYieldDecMode">
                                    <label class="layui-form-label form-lable">7日年化收益率尾数处理</label>
                                    <div class="layui-input-inline input-inline">
										<select id="yearYieldDecMode" name="yearYieldDecMode"
											class="layui-input form-input input-select" 
											data-th-data-result="${VALUATION_ROUND_RULE}" allowClear="true"
											data-th-initValue="${entity?.yearYieldDecMode}">
										</select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">托管活期利息计提</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="isCountingCurInt" name="isCountingCurInt"
                                            class="layui-input form-input input-select" data-th-required="true"
                                            data-th-data-result="${YES_OR_NO}" allowClear="true"
                                            data-th-initValue="${entity?.isCountingCurInt}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">是否对账</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="isReconciliation" name="isReconciliation"
                                            class="layui-input form-input input-select" data-th-required="true"
                                            data-th-data-result="${YES_OR_NO}" allowClear="true"
                                            data-th-initValue="${entity?.isReconciliation}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">托管机构</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="trusteeId" name="trusteeId" class="layui-input form-input input-select"
                                            data-th-data-url="@{/valuation/finncproductbuild/FinNCProductBuild002/getCustomerId}" 
                                            allowClear="true" data-th-required="true" data-th-initValue="${entity?.trusteeId}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">创建机构</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="createOrg" name="createOrg" class="layui-input form-input input-select"
                                            data-th-data-url="@{/valuation/finncproductbuild/FinNCProductBuild002/getCustomerId}" 
                                            allowClear="true" data-th-required="true" data-th-initValue="${entity?.createOrg}">
                                        </select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">估值机构</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="valOrg" name="valOrg" class="layui-input form-input input-select"
                                            data-th-data-url="@{/valuation/finncproductbuild/FinNCProductBuild002/getCustomerId}" 
                                            allowClear="true" data-th-required="true" data-th-initValue="${entity?.valOrg}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </fieldset>
            <div class="layui-collapse">
                <div class="layui-colla-item">
                    <h2 class="layui-colla-title">
                        <a href="javascript:;">产品费用</a>
                    </h2>
                    <div class="layui-colla-content layui-show">
                        <div>
                            <fieldset class="layui-elem-field layui-field-title" style="margin: 0px 0px 0px;">
                                <legend>
                                    <a href="javascript:;" style="color: #0875ec; font-size: 10px;" id="div_cpfy">产品费用-固定费用</a>
                                </legend>
                            </fieldset>
                            <div id="div_dataTable_cpfy" style="margin-top: 0px;">
                                <table class="layui-table" id="dataTable_cpfy"></table>
                            </div>
                            <fieldset class="layui-elem-field layui-field-title" style="margin: 0px 0px 0px;">
                                <legend>
                                    <a href="javascript:;" style="color: #0875ec; font-size: 10px;" id="div_fdglf">产品费用-浮动费用</a>
                                </legend>
                            </fieldset>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                 <label class="layui-form-label form-lable">是否计提浮动管理费</label>
                                 <div class="layui-input-inline input-inline">
                                        <select id="isAccrFloManageFee" name="isAccrFloManageFee"
                                            class="layui-input form-input input-select" allowClear="true"
                                            data-th-data-result="${YES_OR_NO}" data-th-required="true"
                                            data-th-initvalue="${entity.ValProductInfoFeeDto?.isAccrFloManageFee}">
                                        </select>
                                 </div>
                             </div>
                            </div>
                            <div class="layui-form-item"></div>
                            <div id="div_dataTable_fdglf">
                                <div>
                                    <table class="layui-table" id="dataTable_yjbj"></table>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">基准生效规则</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="actRule" name="actRule"
                                                class="layui-input form-input input-select" allowClear="true"
                                                data-th-data-result="${ACT_RULE}"
                                                data-th-initvalue="${entity.ValProductInfoFeeDto?.actRule}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">计费基数</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="baseType" name="baseType"
                                                class="layui-input form-input input-select" allowClear="true"
                                                data-th-data-result="${BASE_TYPE}"
                                                data-th-initvalue="${entity.ValProductInfoFeeDto?.baseType}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">计费基础</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="basis1" name="basis1"
                                                class="layui-input form-input input-select" allowClear="true"
                                                data-th-data-result="${BASIS}" disabled="disabled"
                                                data-th-initvalue="${entity.ValProductInfoFeeDto?.basis}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">资产净值日</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="actVdateType" name="actVdateType"
                                                class="layui-input form-input input-select" allowClear="true"
                                                data-th-data-result="${CPRICE_RULE}"
                                                data-th-initvalue="${entity.ValProductInfoFeeDto?.actVdateType}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">首次计提日</label>
                                        <div class="layui-input-inline input-inline">
	                                       <input type="text" id="firCalculaDate" name="firCalculaDate"
				                               class="layui-input form-input input-dateSelect" allowClear="true"
				                               data-th-value="${entity.ValProductInfoFeeDto?.firCalculaDate}" >
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">计提结束日</label>
                                        <div class="layui-input-inline input-inline">
	                                       <input type="text" id="endCalculaDate" name="endCalculaDate"
				                               class="layui-input form-input input-dateSelect" allowClear="true"
				                               data-th-value="${entity.ValProductInfoFeeDto?.endCalculaDate}" >
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md4">
                                        <label class="layui-form-label form-lable">区间规则</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="accrCycle" name="accrCycle"
                                                class="layui-input form-input input-select" allowClear="true"
                                                data-th-data-result="${FREQUENCY_UNIT}"
                                                data-th-initvalue="${entity.ValProductInfoFeeDto?.accrCycle}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item"></div>
                                <div>
                                    <table class="layui-table" id="dataTable_jtzq"></table>
                                </div>
                        </div>
                        <div class="layui-form-item"></div>
                    </div>
                </div>
            </div>
            <div class="layui-form-item"></div>
            <div class="layui-form-item"></div>
            <div class="layui-collapse" lay-accordion="">
                <div class="layui-colla-item">
                    <h2 class="layui-colla-title">
                        <a href="javascript:;">资金账户</a>
                    </h2>
                    <div class="layui-colla-content layui-show">
                        <div>
                            <table class="layui-table" id="dataTable_zjzh"></table>
                        </div>
                    </div>
                </div>
            </div>
<!--            <div class="layui-form-item"></div>
            <div class="layui-collapse">
