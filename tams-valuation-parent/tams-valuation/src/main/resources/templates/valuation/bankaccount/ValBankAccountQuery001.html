<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>收入统计查询</title>
</head>
<body>
</body>
<div layout:fragment="content">
    <div class="layui-col-md12">
        <div class="layui-tab layui-tab-card" lay-filter="tabContainer">
            <ul class="layui-tab-title">
                <li id="accountDetails-title" class="layui-this">账务明细查询</li>
                <li id="specialAssets-title">收入统计查询</li>
            </ul>
            <div class="layui-tab-content" style="padding: 0">
                <div class="layui-tab-item layui-show">
                    <div class="layui-col-md12" style="margin: 10px 10px">
                        <!--                             <button type="button" class="layui-btn layui-btn-sm btn-create" -->
                        <!--                                 id="">新建</button> -->
                        <!--                             <button type="button" class="layui-btn layui-btn-sm btn-delete" -->
                        <!--                                 id="">删除</button> -->
                        <!--                             <button type="button" class="layui-btn layui-btn-sm btn-export" -->
                        <!--                                 id="">导出</button> -->
                        <button type="button" class="layui-btn layui-btn-sm btn-filter"
                            id="ValBankAccountQuery001_btn_filter">筛选</button>
                    </div>
                    <div class="layui-col-md12" id="c_accountDetailsForm" style="background-color: #f5f5f5;">
                        <form class="layui-form layui-col-md11" id="accountDetailsForm">
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md6">
                                    <label class="layui-form-label form-lable">
                                        科目名称
                                        <i class="iconfont must"> * </i>
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="subjectName" name="subjectName"
                                            class="layui-input form-input input-select" placeholder="请选择"
                                            data-th-data-result="${SUBJECT_NAME}" allowClear="true" multiple="multiple"></select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md6">
                                    <label class="layui-form-label form-lable">
                                        查询日期
                                        <i class="iconfont must"> * </i>
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="selectDate" name="selectDate" placeholder="请选择、支持区间"
                                            class="layui-input form-input input-dateRangeSelect" allowClear="true">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md6">
                                    <label class="layui-form-label form-lable">
                                        业务类别
                                        <i class="iconfont must"> * </i>
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="busiType" name="busiType"
                                            class="layui-input form-input input-select" placeholder="请选择"
                                            data-th-data-result="${BUSINESS_TYPE}" allowClear="true" multiple="multiple"></select>
                                    </div>
                                </div>
                            </div>
                        </form>
                        <div class="layui-col-md1">
                            <div class="layui-form-item">
                                <button type="button" class="layui-btn layui-btn-sm btn-search"
                                    id="ValBankAccountQuery001_btn_search">查询</button>
                            </div>
                            <div class="layui-form-item">
                                <button type="button" class="layui-btn layui-btn-sm btn-default btn-reset"
                                    id="ValBankAccountQuery001_btn_reset">重置</button>
                            </div>
                        </div>
                    </div>
                    <table class="layui-table" id="accountDetails-table"></table>
                </div>
                <div class="layui-tab-item">
                    <div class="layui-col-md12" style="margin: 10px 10px">
                        <!--                             <button type="button" class="layui-btn layui-btn-sm btn-create" -->
                        <!--                                 id="">新建</button> -->
                        <!--                             <button type="button" class="layui-btn layui-btn-sm btn-delete" -->
                        <!--                                 id="">删除</button> -->
                        <!--                             <button type="button" class="layui-btn layui-btn-sm btn-export" -->
                        <!--                                 id="">导出</button> -->
                        <button type="button" class="layui-btn layui-btn-sm btn-filter"
                            id="ValIncomeStatisticsQuery001_btn_filter">筛选</button>
                    </div>
                    <div class="layui-col-md12" id="c_incomeStatisticsForm" style="background-color: #f5f5f5;">
                        <form class="layui-form layui-col-md11" id="incomeStatisticsForm">
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable" type="text">起始日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input class="layui-input form-input input-dateSelect" id="vdate" name="vdate"
                                            placeholder="请选择">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable" type="text">截止日
                                       <i class="iconfont must"> * </i>
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <input class="layui-input form-input input-dateSelect" id="mdate" name="mdate"
                                            data-th-required="true" placeholder="请选择">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">产品</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="productId" name="productId" placeholder="请选择"
                                            data-th-data-url="@{/valuation/bankaccount/ValBankAccountQuery001/getProduct}" class="layui-input form-input input-select"
                                            allowClear="true" multiple="multiple" disabled=""
                                            ></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">日期统计维度
                                       <i class="iconfont must"> * </i>
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="dateDimension" name="dateDimension" placeholder="请选择"
                                            data-th-data-result="${DATE_DIMENSION}" data-th-required="true"
                                            class="layui-input form-input input-select"></select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">产品统计维度
                                       <i class="iconfont must"> * </i>
                                    </label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="productDimension" name="productDimension"
                                            placeholder="请选择" data-th-data-result="${PRODUCT_DIMENSION}"
                                            data-th-required="true" class="layui-input form-input input-select"></select>
                                    </div>
                                </div>
                            </div>
                        </form>
                        <div class="layui-col-md1">
                            <div class="layui-form-item">
                                <button type="button" class="layui-btn layui-btn-sm btn-search"
                                    id="ValIncomeStatisticsQuery001_btn_search">查询</button>
                            </div>
                            <div class="layui-form-item">
                                <button type="button" class="layui-btn layui-btn-sm btn-default btn-reset"
                                    id="ValIncomeStatisticsQuery001_btn_reset">重置</button>
                            </div>
                        </div>
                    </div>
                    <table class="layui-table" id="incomeStatistics-table"></table>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/bankaccount/ValBankAccountQuery001.js}" type="text/javascript"></script>
</div>
</html>
