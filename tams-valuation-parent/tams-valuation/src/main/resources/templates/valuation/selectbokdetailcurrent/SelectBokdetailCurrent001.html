<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>账务明细当前表查询</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
      
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">账套</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="booksetId" name="booksetId"
                               class="layui-input form-input input-select"  placeholder="请输入内容" 
                               data-th-data-url="@{/valuation/selectbokdetailcurrent/SelectBokdetailCurrent001/getBooksetId}"  allowClear="true">
                     	</select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">账务明细代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="bokDetailId" name="bokDetailId" class="layui-input form-input"
                                data-th-placeholder="#{SysCommon.placeholder}" value="">
                        </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">业务明细代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="busiId" name="busiId" class="layui-input form-input"
                                data-th-placeholder="#{SysCommon.placeholder}" value="">
                        </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">科目号</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="subjectNo" name="subjectNo" class="layui-input form-input"
                                data-th-placeholder="#{SysCommon.placeholder}" value="">
                        </div>
                </div>
                <div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">入账日期</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="bookDate" name="bookDate"
							class="layui-input form-input input-dateRangeSelect" value=""
							placeholder="请选择，支持区间">
					</div>
				</div>
            </div>
        </form>
    </div>
    <table class="layui-table" id="dataTable"></table>
</div>
</body>
<div layout:fragment="script">
    <script
            data-th-src="@{/js/valuation/selectbokdetailcurrent/SelectBokdetailCurrent001.js}"
            type="text/javascript"></script>
</div>
</html>
