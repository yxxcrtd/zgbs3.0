<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>资产减值余额查询</title>
</head>
<body>
</body>
<div layout:fragment="content">
    <div class="form-button-area" ></div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable">资产代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="busiId" name="busiId"
                                class="layui-input form-input input-select"
                                allowClear="true" placeholder="请输入内容"
                                data-th-data-url="@{/valuation/trdassetlossmanage/trdassetlossbalance/TrdAssetLossBalance001/getAssetInfoSelectOption}"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-label-wrap">账套代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="booksetId" name="booksetId"  class="layui-input form-input input-select"
                                allowClear="true" placeholder="请输入内容"
                                data-th-data-url="@{/valuation/trdassetlossmanage/trdassetlossbalance/TrdAssetLossBalance001/getBooksetId}"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable">日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="rangeDate" name="rangeDate" placeholder="请选择、支持区间"
                               class="layui-input form-input input-dateRangeSelect" data-th-value="${rangeDate}" allowClear="true">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/trdassetlossmanage/trdassetlossbalance/TrdAssetLossBalance001.js}" type="text/javascript"></script>
</div>
</html>
