<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
    <title data-th-text="#{TrdAssetLoss002}">资产减值新建</title>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
        <form class="layui-form joyin-form-wrap pro-module-form" id="searchForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">基本信息</span>（<span class="star-sign">*</span> 必填）<i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <input type="hidden" id="tradeId" name="tradeId" th:value="${entity?.tradeId}">
                        <input type="hidden" id="secId" name="secId" th:value="${entity?.secId}">

                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">资产类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="assetType" name="assetType"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${SEC_TYPE}' allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                required="required" formatoption="true" readonly="readonly"
                                                data-th-initvalue="${entity?.assetType}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="finprodId" name="finprodId" data-th-parentIds="assetType"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                required="required" data-formatoption="true"
                                                data-th-data-url="@{/valuation/trdassetlossmanage/trdassetloss/TrdAssetLoss002/getAssetInfoSelectOption}"
                                                data-th-initvalue="${entity?.finprodId}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">流通场所</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="tradeMarket" name="tradeMarket"
                                                class="layui-input form-input input-select" disabled
                                                data-th-data-result='${TRADE_MARKET}' allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption="true" readonly="readonly" required="required"
                                                data-th-initvalue="${entity?.tradeMarket}">
                                        </select>
                                    </div>
                                </div>


                            </div>

                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">发行人名称/机构名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="issuerName" name="issuerName" data-th-value="${entity?.issuerName}"
                                               required="required" disabled="disabled" class="layui-input form-input" text-number>
                                    </div>
                                </div>

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">组织机构代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="insitituteCode" name="insitituteCode" data-th-value="${entity?.insitituteCode}"
                                               required="required" disabled="disabled" class="layui-input form-input" text-number>
                                    </div>
                                </div>

                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">资产起息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input class="layui-input form-input input-dateSelect" id="vDate" disabled="disabled"
                                               name="vDate" placeholder="请选择时间"
                                               data-th-value='${#dates.format(entity?.vDate,"yyyy-MM-dd")}'
                                               required="required">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">资产到期日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input class="layui-input form-input input-dateSelect" id="mDate" disabled="disabled"
                                               name="mDate" placeholder="请选择时间"
                                               data-th-value='${#dates.format(entity?.mDate,"yyyy-MM-dd")}'
                                               required="required">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">资产行权日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input class="layui-input form-input input-dateSelect" id="assetExerciseDate" disabled="disabled"
                                               name="assetExerciseDate" placeholder="请选择时间"
                                               data-th-value='${#dates.format(entity?.assetExerciseDate,"yyyy-MM-dd")}'>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">减值行情日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input class="layui-input form-input input-dateSelect" id="valDate"
                                               name="valDate" placeholder="请选择时间"
                                               data-th-value='${#dates.format(entity?.valDate,"yyyy-MM-dd")}'
                                               required="required">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">初始确认起始日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input class="layui-input form-input input-dateSelect" id="strDate"
                                               name="strDate" placeholder="请选择时间"
                                               data-th-value='${#dates.format(entity?.strDate,"yyyy-MM-dd")}'
                                               required="required">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">初始确认截止日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input class="layui-input form-input input-dateSelect" id="endDate"
                                               name="endDate" placeholder="请选择时间"
                                               data-th-value='${#dates.format(entity?.endDate,"yyyy-MM-dd")}'
                                               required="required">
                                    </div>
                                </div>
                                <div class="form-inline-wrap" id="period_type">
                                    <label class="layui-form-label form-lable">待偿期类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="periodType" name="periodType"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${PRRIOD_TYPE}' allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                required="required" formatoption="true"
                                                data-th-initvalue="${entity?.periodType}">
                                        </select>
                                    </div>
                                </div>

                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">待偿期（年）</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="peroid" name="peroid" data-th-value="${entity?.peroid}" disabled
                                               required="required" class="layui-input form-input" text-number>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">逾期天数</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="overDays" name="overDays" data-th-value="${entity?.overDays}" disabled="disabled"
                                               class="layui-input form-input">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">减值阶段</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="stage" name="stage"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${FIN_STAGE}' allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption="true" readonly="readonly" required="required"
                                                data-th-initvalue="${entity?.stage}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">减值测算方式</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="lossTestType" name="lossTestType"
                                               class="layui-input form-input input-checkbox"
                                               data-th-data-result='${LOSS_CAL_PATTERN}' required="required"
                                               data-th-initvalue="${entity?.lossTestType}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">期限描述</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="termDescribe" name="termDescribe"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                required="required" data-formatoption="false"
                                                data-th-data-url="@{/valuation/trdassetlossmanage/trdassetloss/TrdAssetLoss002/getTermDescribe}"
                                                data-th-initvalue="${entity?.termDescribe}">
                                        </select>
                                    </div>
                                </div>
                            </div>


                        </div>
                    </div>
                </div>
                <!--外部评估-->
                <div class="pro-module-wrap" id="external_Evaluation_div" style="display: none">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">外部评估</span>（<span class="star-sign">*</span> 必填）<i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">减值比例%</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="lossRatio" name="lossRatio" data-th-value="${entity?.lossRatio}" disabled="disabled"
                                               required="required" data-fixtype="2" data-textrange="12" class="layui-input form-input text-number">
                                    </div>
                                </div>
                                <!--<div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">减值录入方式</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="lossInputPattern" name="lossInputPattern" disabled="disabled"
                                                class="layui-input form-input input-select"
                                                data-th-data-result='${LOSS_INPUT_PATTERN}' allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                formatoption="true" readonly="readonly"
                                                data-th-initvalue="${entity?.lossInputPattern}">
                                        </select>
                                    </div>
                                </div>-->
                            </div>
                        </div>
                    </div>
                </div>
                <!--预期信用损失模型-->
                <div class="pro-module-wrap" id="expected_loss_div" style="display: none">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">预期信用损失模型</span>（<span class="star-sign">*</span> 必填）<i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">PD违约概率%</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="pdValue" name="pdValue" data-th-value="${entity?.pdValue}" data-fixtype="2" data-textrange="4"
                                               required="required" class="layui-input form-input text-number">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">LGD违约损失率%</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="lgdValue" name="lgdValue" data-th-value="${entity?.lgdValue}" data-fixtype="2" data-textrange="4"
                                               required="required" class="layui-input form-input text-number">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">ECL预期信用损失比例%</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="eclVaule" name="eclVaule" data-th-value="${entity?.eclVaule}" data-fixtype="2" data-textrange="4"
                                               required="required" disabled="disabled" class="layui-input form-input text-number">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pro-module-wrapper pro-module-block">
                <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                    <div class="text-center">
                        <!--<a id="TrdAssetLoss002_btn_preview" class="layui-btn layui-btn-sm btn-preview">减值产品预览</a>-->
                        <a id="TrdAssetLoss002_btn_save" class="layui-btn layui-btn-sm btn-save"
                           data-th-text="#{SysCommon.save}">保存</a>
                        <a id="TrdAssetLoss002_btn_submit" class="layui-btn layui-btn-sm  btn-submit"
                           data-th-text="#{SysCommon.submit}">提交</a>
                        <a id="TrdAssetLoss002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                           data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var bankRoom = /*[[${bankRoom}]]*/'';
        var shse = /*[[${shse}]]*/'';
        var szse = /*[[${szse}]]*/'';
        var oneMarket = /*[[${oneMarket}]]*/'';
        var marketLv2 = /*[[${marketLv2}]]*/'02';
        var T01 = /*[[${T01}]]*/'';
        var T02 = /*[[${T02}]]*/'';
        var T03 = /*[[${T03}]]*/'';

        // 一体化对应etliu start
        var T39 = /*[[${T39}]]*/'';
        // 一体化对应etliu end

        var bankPlat = /*[[${bankPlat}]]*/'';
        var type01 = /*[[${type01}]]*/'';
        var type02 = /*[[${type02}]]*/'';
        var type03 = /*[[${type03}]]*/'';
        var aim01 = /*[[${aim01}]]*/'';
        var aim02 = /*[[${aim02}]]*/'';
        var N = /*[[${N}]]*/'';
        var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
        var sysDate = /*[[${sysDate}]]*/'';
        var fintype = /*[[${fintype}]]*/'';
        var IS_SHOW_TYPE = /*[[${isShowType}]]*/'02';
        var PRICEMODEL_03 = /*[[${PRICEMODEL_03}]]*/'PRM03';
        var TRADE_PLACE_01 = /*[[${TRADE_PLACE_01}]]*/'';
        var TRADE_PLACE_02 = /*[[${TRADE_PLACE_02}]]*/'';
        var TRADE_PLACE_03 = /*[[${TRADE_PLACE_03}]]*/'';
        var SHARES_TRADE_PLATFORM_01 = /*[[${SHARES_TRADE_PLATFORM_01}]]*/'';
        var SHARES_TRADE_PLATFORM_99 = /*[[${SHARES_TRADE_PLATFORM_99}]]*/'';
        var SHARES_TRADE_MARKET_01 = /*[[${SHARES_TRADE_MARKET_01}]]*/'';
        var SHARES_TRADE_MARKET_02 = /*[[${SHARES_TRADE_MARKET_02}]]*/'';
        var shortSellingSupported = /*[[${shortSellingSupported}]]*/'';
        var SYS_DATE = /*[[${SYS_DATE}]]*/'';
    </script>
    <!--<script data-th-src="@{/js/component/common/TradeCommon.js}" type="text/javascript"></script>-->
    <script data-th-src="@{/js/valuation/trdassetlossmanage/trdassetloss/TrdAssetLoss002.js}" type="text/javascript"></script>
    <!--<script data-th-src="@{/js/component/autocoupon/AutoCoupon.js}" type="text/javascript"></script>-->
</div>
</body>
</html>
