<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
    <title data-th-text="#{TrdAssetLoss001}">资产减值管理</title>
</head>
<body>
<div layout:fragment="content">
    <div class="joyin-form-wrap joyin-filter-form condition-area" style="display:none;">
        <form class="layui-form" id="searchForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">基本信息</span>（<span class="star-sign">*</span> 必填）<i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <input type="hidden" id="tradeId" name="tradeId" th:value="${entity?.tradeId}">
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="finprodId" name="finprodId"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                required="required" data-formatoption="true"
                                                data-th-data-url="@{/valuation/trdassetlossmanage/trdassetloss/TrdAssetLoss001/getfinprodIdForAdd}"
                                                data-th-initvalue="${entity?.finprodId}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">减值日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input class="layui-input form-input input-dateSelect" id="lossDate"
                                               name="lossDate" placeholder="请选择时间"
                                               data-th-value='${#dates.format(entity?.lossDate,"yyyy-MM-dd")}'
                                               required="required">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">减值测算方式</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="lossTestType" name="lossTestType"
                                               class="layui-input form-input input-checkbox"
                                               data-th-data-result='${LOSS_CAL_PATTERN}' required="required"
                                               data-th-initvalue="${entity?.lossTestType}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">减值比例%</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="lossRatio" name="lossRatio" data-th-value="${entity?.lossRatio}" disabled="disabled"
                                               class="layui-input form-input">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">PD违约概率%</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="pdValue" name="pdValue" data-th-value="${entity?.pdValue}" disabled="disabled"
                                               class="layui-input form-input">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-lable">LGD违约概率%</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="lgdValue" name="lgdValue" data-th-value="${entity?.lgdValue}" disabled="disabled"
                                               class="layui-input form-input">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var bankRoom = /*[[${bankRoom}]]*/'';
        var bankPlat = /*[[${bankPlat}]]*/'';
        var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
    </script>
    <script data-th-src="@{/js/valuation/trdassetlossmanage/trdassetloss/TrdAssetLoss003.js}" type="text/javascript"></script>
</div>
</body>
</html>
