<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title data-th-text="#{TrdAssetLoss002}">资产减值新建</title>
</head>
<body>
<div layout:fragment="content">
        <form class="layui-form joyin-form-wrap pro-module-form" id="searchForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des" data-th-text="#{TrdAssetLoss004.trdAssetLossList}">资产减值列表</span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <table class="layui-table" id="dataTable" name="selectedItem"></table>
                        </div>
                    </div>
                </div>
            </div>
    </form>
    <!--  按钮 -->
    <div class="row text-center" style="margin: 20px 0;">
        <div class="text-center">
            <a id="TrdAssetLoss004_btn_save" class="layui-btn layui-btn-sm btn-save"
               data-th-text="#{SysCommon.save}">保存</a>
            <a id="TrdAssetLoss004_btn_submit" class="layui-btn layui-btn-sm btn-submit"
               data-th-text="#{SysCommon.submit}">提交</a>
            <a id="TrdAssetLoss004_cancel" class="layui-btn layui-btn-sm btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
    	var sysDate = /*[[${sysDate}]]*/'';
        var trdAssetLossList = /*[[${trdAssetLossList}]]*/'';
        var workflowId = /*[[${workflowId}]]*/'';
        var todoList = /*[[${TodoList}]]*/'';
        var MY_SUP_TIME_TYPE_02 = /*[[${MY_SUP_TIME_TYPE_02}]]*/'';
        var fintype = /*[[${fintype}]]*/'';
     </script>
    <script data-th-src="@{/js/valuation/trdassetlossmanage/trdassetloss/TrdAssetLoss004.js}" type="text/javascript"></script>
</div>
</body>
</html>
