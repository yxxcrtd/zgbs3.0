<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
    <title data-th-text="#{TrdAssetLoss001}">资产减值管理</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a id="TrdAssetLoss001_btn_add" class="layui-btn layui-btn-sm btn-create">新建减值</a>
        <a id="TrdAssetLoss001_btn_import" class="layui-btn layui-btn-sm btn-import">
            <i class="iconfont icon-import"></i><span data-th-text="#{TrdAssetLoss001.import}">批量导入</span></a>
        <a id="TrdAssetLoss001_btn_import_ecl" class="layui-btn layui-btn-sm btn-import">
            <i class="iconfont icon-import"></i><span data-th-text="#{TrdAssetLoss001.import.ecl}">中债ECL批量导入</span></a>
        <a id="TrdAssetLoss001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke"><i class="iconfont icon-revoke"></i><span data-th-text="#{TrdAssetLoss001.revoke}">撤销</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable">资产名称</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="finprodId" name="finprodId"
                                class="layui-input form-input input-select" allowClear="true"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                formatoption=true multiple="true"
                                data-th-data-url="@{/valuation/trdassetlossmanage/trdassetloss/TrdAssetLoss002/getAssetInfoSelectOption}"
                                data-th-initvalue="${entity?.finprodId}">
                        </select>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable">减值行情日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="queryDate" name="queryDate" placeholder="请选择、支持区间"
                               class="layui-input form-input input-dateRangeSelect" allowClear="true">
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable">减值阶段</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="stage" name="stage"
                               class="layui-input form-input input-select"
                               data-th-data-result='${FIN_STAGE}'
                               data-th-initvalue="${entity?.stage}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable">资产类型</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="assetType" name="assetType"
                                class="layui-input form-input input-select" allowClear="true"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                formatoption=true
                                data-th-data-result="${SEC_TYPE}"/>
                    </div>
                </div>
                <div class="form-inline-wrap">
                    <label class="layui-form-label form-lable">数据来源</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="lossInputType" name="lossInputType"
                                class="layui-input form-input input-select" allowClear="true"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                formatoption=true
                                data-th-data-result="${LOSS_INPUT_TYPE}"/>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var bankRoom = /*[[${bankRoom}]]*/'';
        var bankPlat = /*[[${bankPlat}]]*/'';
        var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
    </script>
    <script data-th-src="@{/js/valuation/trdassetlossmanage/trdassetloss/TrdAssetLoss001.js}" type="text/javascript"></script>
</div>
</body>
</html>
