<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>资产减值余额明细</title>
</head>
<body>
</body>
<div layout:fragment="content">
    <div class="joyin-form-wrap joyin-filter-form condition-area" style="display:none;">
        <form class="layui-form" id="searchForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">基本信息</span>（<span class="star-sign">*</span> 必填）<i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <input type="hidden" id="busiId" name="busiId" th:value="${entity?.busiId}">
                        <input type="hidden" id="booksetId" name="booksetId" th:value="${entity?.booksetId}">
                        <input type="hidden" id="bokDetailId" name="bokDetailId" th:value="${entity?.bokDetailId}">
                        <input type="hidden" id="bookDate" name="bookDate" data-th-value='${#dates.format(entity?.bookDate,"yyyy-MM-dd")}'>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/trdassetlossmanage/trdassetlossbalance/TrdAssetLossBalance002.js}" type="text/javascript"></script>
</div>
</html>
