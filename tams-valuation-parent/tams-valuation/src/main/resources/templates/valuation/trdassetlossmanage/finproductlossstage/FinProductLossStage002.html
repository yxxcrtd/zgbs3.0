<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.w3.org/1999/xhtml"
      layout:decorate="~{layout/default}">
<meta charset="UTF-8">
<head>
    <title>资产减值阶段管理新建</title>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
        <form class="layui-form joyin-form-wrap pro-module-form" id="searchForm">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des">基本信息</span>（<span class="star-sign">*</span> 必填）<i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <input type="hidden" id="seqNo" name="seqNo" data-th-value="${seqNo}">
                        <div class="pro-module-item">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">资产名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="finprodId" name="finprodId" required
                                                class="layui-input form-input input-select"
                                                allowClear="true" placeholder="请输入内容"
                                                data-th-initValue="${finprodId}"
                                                data-th-data-url="@{/valuation/trdassetlossmanage/finproductlossstage/FinProductLossStage001/getFinprodName}"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">阶段</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="stage" name="stage" required
                                                class="layui-input form-input input-select"
                                                allowClear="true" placeholder="请输入内容"
                                                data-th-initValue="${stage}"
                                                data-th-data-result="${FIN_STAGE}"
                                                data-th-placeholder="#{SysCommon.placeholder}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">生效日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="effDate" name="effDate" required
                                               class="layui-input form-input input-dateSelect"
                                               data-th-value="${effDateStr}"
                                               allowClear="true" placeholder="请选择生效日期">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="pro-module-wrapper pro-module-block">
                <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                    <div class="text-center">
                        <a id="FinProductLossStage002_btn_save" class="layui-btn layui-btn-sm btn-save"
                           data-th-text="#{SysCommon.save}">保存</a>
                        <a id="FinProductLossStage002_btn_cancel" class="layui-btn layui-btn-sm  btn-cancel"
                           data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/trdassetlossmanage/finproductlossstage/FinProductLossStage002.js}" type="text/javascript"></script>
</div>
</body>
</html>
