<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>资产减值阶段管理</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="form-button-area">
            <a id="FinProductLossStage001_btn_add"
               class="layui-btn layui-btn-sm btn-create"
               data-th-text="#{SysCommon.create}">新建</a>
            <a id="FinProductLossStage001_btn_delete"
               class="layui-btn layui-btn-sm btn-delete"
               data-th-text="#{SysCommon.delete}">删除</a>
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">资产名称</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="finprodId" name="finprodId"
                                    class="layui-input form-input input-select"
                                    allowClear="true" placeholder="请输入内容"
                                    data-th-data-url="@{/valuation/trdassetlossmanage/finproductlossstage/FinProductLossStage001/getFinprodName}"
                                    data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-label-wrap">阶段</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="stage" name="stage"  class="layui-input form-input input-select"
                                    allowClear="true" placeholder="请输入内容"
                                    data-th-data-result="${FIN_STAGE}"
                                    data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable">查询日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="rangeDate" name="rangeDate" placeholder="请选择、支持区间"
                                   class="layui-input form-input input-dateRangeSelect" allowClear="true">
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/trdassetlossmanage/finproductlossstage/FinProductLossStage001.js}" type="text/javascript"></script>
</div>
</body>
</html>
