<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>账务明细代码调整</title>
</head>

<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap" id="submitForm" style="background: #ffffff; padding: 10px 0;">
			<!-- 调整前属性参数 -->
			<div class="layui-collapse">
				<div class="layui-colla-item">
	                 <div class="layui-colla-content layui-show">
	                 	<div class="layui-form-item">
	                 		<div class="layui-inline layui-col-md4">
			                    <label class="layui-form-label form-lable">账套代码</label>
			                    <div class="layui-input-inline input-inline">
			                        <select type="text" id="booksetId" name="booksetId"
			                               class="layui-input form-input input-select"  placeholder="请输入内容" 
			                               multiple="multiple"
			                               data-th-data-url="@{/valuation/bokdetailidupdate/BokDetailIdUpdate002/getBooksetId}"  allowClear="true">
			                     	</select>
			                    </div>
			                </div>
			                <div class="layui-inline layui-col-md4">
			                    <label class="layui-form-label form-lable">调整前资金账户号</label>
		                        <div class="layui-input-inline input-inline">
		                            <input type="text" id="acctNoOld" name="acctNoOld" class="layui-input form-input"
		                                data-th-placeholder="#{SysCommon.placeholder}" value="">
		                        </div>
			                </div>
	                 	</div>
	                 	<div class="layui-form-item">
	                 		<div class="layui-inline layui-col-md4">
			                    <label class="layui-form-label form-lable">调整前账务明细代码</label>
		                        <div class="layui-input-inline input-inline">
		                            <input type="text" id="bokdetailIdOld" name="bokdetailIdOld" class="layui-input form-input"
		                                data-th-placeholder="#{SysCommon.placeholder}" value="">
		                        </div>
			                </div>
	                 	</div>
	                 </div>
				</div>
			</div>
			<div class="layui-collapse">
				<div class="layui-colla-item">
					<h3 class="pro-module-title"><span class="title-des" >账务明细代码调整参数设置</span></h3>
	                 <div class="layui-colla-content layui-show">
	                 	<div class="layui-form-item">
			                <div class="layui-inline layui-col-md4">
			                    <label class="layui-form-label form-lable">资产类型</label>
		                        <div class="layui-input-inline input-inline">
                                     <select type="text" id="busiDetailType" name="busiDetailType" class="layui-input form-input input-select"  
                                      data-th-placeholder="#{SysCommon.placeholder}"
                                      data-th-data-result="${FINPROD_TYPE}">
                                      </select>
                                 </div>
			                </div>
			                <div class="layui-inline layui-col-md4">
			                    <label class="layui-form-label form-lable">资产代码</label>
		                        <div class="layui-input-inline input-inline">
			                        <input type="text" id="busiId" name="busiId" class="layui-input form-input input-lenovoselect"
			                            data-th-placeholder="#{SysCommon.placeholder}" data-th-data-url="@{/valuation/bokdetailidupdate/BokDetailIdUpdate002/getBusiId}"
			                            data-parentids="busiDetailType,booksetId"
			                            data-idfield="shortName" data-keyfield="code" data-th-data-effectivefieldsalias='|{"code":"#{BokDetailIdUpdate.busiId}","shortName":"#{BokDetailIdUpdate.busiName}"}|'
			                            >
			                    </div>
			                </div>
	                 	</div>
	                 	<div class="layui-form-item">
	                 		<div class="layui-inline layui-col-md4">
                                <label class="layui-form-label form-lable">理财子产品起息日</label>
                                <div class="layui-input-inline input-inline">
	                                <input type="text" id="vdate" name="vdate" class="layui-input form-input input-dateSelect" 
	                                data-th-value="${entity?.vdate}">
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4">
			                    <label class="layui-form-label form-lable">收益类型</label>
                                 <div class="layui-input-inline input-inline">
                                     <select type="text" id="profitType" name="profitType" class="layui-input form-input input-select"  
                                      data-th-placeholder="#{SysCommon.placeholder}"
                                      data-th-data-result="${PROFIT_TYPE}">
                                      </select>
                                 </div>
			                </div>
	                 	</div>
	                 	<div class="layui-form-item">
	                 		<div class="layui-inline layui-col-md4">
			                    <label class="layui-form-label form-lable">投资目的</label>
                                 <div class="layui-input-inline input-inline">
                                     <select type="text" id="invAim" name="invAim" class="layui-input form-input input-select"  
                                      data-th-placeholder="#{SysCommon.placeholder}"
                                      data-th-data-result="${INV_AIM}">
                                      </select>
                                 </div>
			                </div>
			                <div class="layui-inline layui-col-md4">
			                    <label class="layui-form-label form-lable">币种</label>
                                 <div class="layui-input-inline input-inline">
                                     <select type="text" id="ccy" name="ccy" class="layui-input form-input input-select" 
                                      data-th-placeholder="#{SysCommon.placeholder}" 
                                      data-th-data-result="${CCY}">
                                      </select>
                                 </div>
			                </div>
	                 	</div>
	                 	<div class="layui-form-item">
	                 		<div class="layui-inline layui-col-md4">
			                    <label class="layui-form-label form-lable">账务明细代码</label>
		                        <div class="layui-input-inline input-inline">
		                            <input type="text" id="bokdetailId" name="bokdetailId" class="layui-input form-input" value="" disabled="disabled">
		                        </div>
			                </div>
			                <div class="layui-inline layui-col-md4">
			                   <a id="BokDetailIdUpdate002_btn_preview" class="layui-btn layui-btn-sm">
			                        <i class="iconfont icon-search"></i><span>预览</span>
			                   </a>
			                </div>
	                 	</div>
	                 </div>
				</div>
			</div>
		</form>
		<div class="layui-col-md11" style="margin: 50px;">
            <div class="text-center">
               <a id="BokDetailIdUpdate002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="确认调整"></a> 
               <a id="BokDetailIdUpdate002_btn_scriptGeneration" class="layui-btn layui-btn-sm btn-submit" data-th-text="脚本生成"></a>
               <a id="BokDetailIdUpdate002_btn_reset" class="layui-btn layui-btn-sm btn-reset" data-th-text="#{SysCommon.reset}"></a>
            </div>
        </div>
	</div>
	<div layout:fragment="script">
	    <script
	            data-th-src="@{/js/valuation/bokdetailidupdate/BokDetailIdUpdate002.js}"
	            type="text/javascript"></script>
	</div>
</body>
</html>
