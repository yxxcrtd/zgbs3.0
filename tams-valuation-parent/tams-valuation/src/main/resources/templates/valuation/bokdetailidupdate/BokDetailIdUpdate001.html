<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>账务明细代码更新</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a id="BokDetailIdUpdate001_btn_update" class="layui-btn layui-btn-sm " data-th-text="#{SysCommon.update}">更新</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">账套</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="booksetId" name="booksetId"
                               class="layui-input form-input input-select"  placeholder="请输入内容" 
                               data-th-data-url="@{/valuation/bokdetailidupdate/BokDetailIdUpdate001/getBooksetId}"  allowClear="true">
                     	</select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">账务明细代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="bokDetailId" name="bokDetailId"
                               class="layui-input form-input input-select"  placeholder="请输入内容" 
                               data-th-data-url="@{/valuation/bokdetailidupdate/BokDetailIdUpdate001/getBokDetailId}"  allowClear="true">
                     	</select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">业务明细代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="busiId" name="busiId" class="layui-input form-input"
                                data-th-placeholder="#{SysCommon.placeholder}" value="">
                        </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">业务明细类型</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="busiDetailType" name="busiDetailType" class="layui-input form-input"
                                data-th-placeholder="#{SysCommon.placeholder}" value="">
                        </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">投资目的</label>
					<div class="layui-input-inline input-inline">
                            <select type="text" id="invAim" name="invAim"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-data-result="${INV_AIM}" allowClear="true" multiple="multiple">
                            </select>
					</div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">币种</label>
					<div class="layui-input-inline input-inline">
                            <select type="text" id="ccy" name="ccy"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-data-result="${CCY}" allowClear="true" multiple="multiple">
                            </select>
					</div>
                </div>
            </div>
        </form>
    </div>
    <table class="layui-table" id="dataTable"></table>
</div>
</body>
<div layout:fragment="script">
    <script
            data-th-src="@{/js/valuation/bokdetailidupdate/BokDetailIdUpdate001.js}"
            type="text/javascript"></script>
</div>
</html>
