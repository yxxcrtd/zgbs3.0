<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>一键做账</title>
<script th:inline="javascript">
	var sysDate = [[${sysDate}]];
	var curUser=[[${session.curUser}]];
    var YJZZ=[[${YJZZ}]];
    var batchTaskNums=[[${batchTaskNums}]];
</script>
</head>
<body>
    <div layout:fragment="content">
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md3">
                <div class="joyin-form-wrap">
                    <form class="layui-form" id="proidSearchForm">
                        <div class="layui-form-item">
                            <input type="text" id="batchName" name="batchName"
                                class="layui-input form-input input-fuzzy-text" placeholder="一键做账关键字"
                                data-eventfunc="searchByBatchName">
                        </div>
                    </form>
                </div>
                <div class="layui-input"
                    style="border: 1px solid #dbdbdb; scroll-y: auto; scroll-x: hidden; overflow-y: scroll;"
                    data-checkable="false" data-checkall="false" data-roottitle="一键做账" id='typeDatatree'
                    data-th-url='@{/valuation/makeaccount/OneKeyMakeAccount001/findAllTask}'></div>
            </div>
            <div class="layui-col-md9">
                <div class="layui-form joyin-form-wrap">
                    <div class="layui-form-item">
                        <div class="layui-inline layui-col-md2">
                            <div class="layui-input-inline input-inline" style="width: 100% !important">
                                <input type="text" id="batchBooksetType" name="batchBooksetType"
                                    class="layui-input form-input input-checkbox"
                                    data-th-data-result="${BATCH_BOOKSET_TYPE}" data-th-initvalue="0" allowClear="true">
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable" id="dynamicName">账套组</label>
                            <div class="layui-input-inline input-inline">
                                <select id="booksetId" name="booksetId" class="layui-input form-input input-select"
                                    multiple="multiple" allowClear="true" showAll="true" placeholder="请选择"
                                    parentIds="booksets" formatoption="false"
                                    data-th-data-url="@{/valuation/dailyoperation/dailyaccountmake/valaccounthandle/ValAccountHandle001/getBookSetId}">
                                </select>
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md4">
                            <label class="layui-form-label form-lable">日期</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="executeDate" name="executeDate" placeholder="请选择日期"
                                    class="layui-input form-input input-dateSelect" />
                            </div>
                        </div>
                        <div class="layui-inline layui-col-md-offset2">
                            <button class="layui-btn layui-btn-sm " id="OneKeyMakeAccount001_btn_doInterBtn">
                                <i class="iconfont icon-execute"></i>一键执行
                            </button>
                        </div>
                        <div style="display: none;">
                            <select type="text" class="layui-input form-input input-select" id="booksets"
                                name="booksets" allowClear="true" childrenIds="booksetId">
                                <option value="0">0</option>
                                <option value="1">1</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-tab layui-tab-card" lay-filter="tabContainer">
                    <ul class="layui-tab-title">
                        <li id="total-progress" class="layui-this"><i class="iconfont icon-risk_fill"
                            style="color: #1724c3;"></i>总进度</li>
                        <li id="interf-data"><i class="iconfont icon-document" style="color: #13a7edd1"></i>公共数据接入</li>
                        <li id="interf-deal"><i class="iconfont icon-document" style="color: #17c347;"></i>交易数据接入</li>
                        <li id="batch-task"><i class="iconfont icon-document" style="color: #ff2236;"></i>登账批处理</li>
                        <li id="valuation-build"><i class="iconfont icon-document" style="color: #ebef00d1;"></i>估值表生成</li>
                        <li id="valuation-check"><i class="iconfont icon-document" style="color: #1724c3;"></i>估值表核对</li>
                        <li id="balance-check"><i class="iconfont icon-document" style="color: #1724c3;"></i>余额表核对</li>
                        <li id="data-backhaul"><i class="iconfont icon-document" style="color: #1724c3;"></i>数据回转</li>
                        <li id="log-confirm"><i class="iconfont icon-document" style="color: #1724c3;"></i>净值确认下发</li>
                    </ul>
                    <div class="layui-tab-content" id="layui-tab-content">
                        <div class="layui-tab-item layui-show">
                          <div class="layui-tab-content" id="layui-tab-content-total">
                            <div id="dataTableDiv" class="layui-tab-item layui-show">
                                <table class="layui-table" id="log-total"></table>
                            </div>
                        </div></div>
                        <div class="layui-tab-item">
                         <div class="layui-tab layui-tab-card" lay-filter="tabContainer">
                            <ul class="layui-tab-title">
                                <li id="log-title-interf-data" class="layui-this"><i class="iconfont icon-document"
                                    style="color: #13a7edd1"></i>日志</li>
                                <li id="success-title-interf-data"><i class="iconfont icon-circle-correct_fill"
                                    style="color: #17c347;"></i>成功</li>
                                <li id="error-title-interf-data"><i class="iconfont icon-circle-wrong_fill"
                                    style="color: #ff2236;"></i>失败</li>
                                <li id="warning-title-interf-data"><i class="iconfont icon-sigh_fill"
                                    style="color: #ebef00d1;"></i>警告</li>
                                <li id="eWarning-title-interf-data"><i class="iconfont icon-risk_fill"
                                    style="color: #1724c3;"></i>预警信息</li>
                            </ul>
                            <div class="layui-tab-content" id="layui-tab-content-interf-data">
                                <div class="layui-tab-item layui-show">
                                    <table class="layui-table" id="log-table-interf-data"></table>
                                </div>
                                <div class="layui-tab-item">
                                    <table class="layui-table" id="success-table-interf-data"></table>
                                </div>
                                <div class="layui-tab-item">
                                    <table class="layui-table" id="error-table-interf-data"></table>
                                </div>
                                <div class="layui-tab-item">
                                    <table class="layui-table" id="warning-table-interf-data"></table>
                                </div>
                                <div class="layui-tab-item">
                                    <table class="layui-table" id="eWarning-table-interf-data"></table>
                                </div>
                            </div>
                        </div></div>
                        <div class="layui-tab-item">
                         <div class="layui-tab layui-tab-card" lay-filter="tabContainer">
                            <ul class="layui-tab-title">
                                <li id="log-title-interf-deal" class="layui-this"><i class="iconfont icon-document"
                                    style="color: #13a7edd1"></i>日志</li>
                                <li id="success-title-interf-deal"><i class="iconfont icon-circle-correct_fill"
                                    style="color: #17c347;"></i>成功</li>
                                <li id="error-title-interf-deal"><i class="iconfont icon-circle-wrong_fill"
                                    style="color: #ff2236;"></i>失败</li>
                                <li id="warning-title-interf-deal"><i class="iconfont icon-sigh_fill"
                                    style="color: #ebef00d1;"></i>警告</li>
                                <li id="eWarning-title-interf-deal"><i class="iconfont icon-risk_fill"
                                    style="color: #1724c3;"></i>预警信息</li>
                            </ul>
                            <div class="layui-tab-content" id="layui-tab-content-interf-deal">
                                <div class="layui-tab-item layui-show">
                                    <table class="layui-table" id="log-table-interf-deal"></table>
                                </div>
                                <div class="layui-tab-item">
                                    <table class="layui-table" id="success-table-interf-deal"></table>
                                </div>
                                <div class="layui-tab-item">
                                    <table class="layui-table" id="error-table-interf-deal"></table>
                                </div>
                                <div class="layui-tab-item">
                                    <table class="layui-table" id="warning-table-interf-deal"></table>
                                </div>
                                <div class="layui-tab-item">
                                    <table class="layui-table" id="eWarning-table-interf-deal"></table>
                                </div>
                            </div>
                        </div></div>
                        <div class="layui-tab-item">
                         <div class="layui-tab layui-tab-card" lay-filter="tabContainer">
                            <ul class="layui-tab-title">
                                <li id="log-title-batch-task" class="layui-this"><i class="iconfont icon-document"
                                    style="color: #13a7edd1"></i>日志</li>
                                <li id="success-title-batch-task"><i class="iconfont icon-circle-correct_fill"
                                    style="color: #17c347;"></i>成功</li>
                                <li id="error-title-batch-task"><i class="iconfont icon-circle-wrong_fill"
                                    style="color: #ff2236;"></i>失败</li>
                                <li id="warning-title-batch-task"><i class="iconfont icon-sigh_fill"
                                    style="color: #ebef00d1;"></i>警告</li>
                                <li id="eWarning-title-batch-task"><i class="iconfont icon-risk_fill"
                                    style="color: #1724c3;"></i>预警信息</li>
                            </ul>
                            <div class="layui-tab-content" id="layui-tab-content-batch-task">
                                <div id="dataTableDiv" class="layui-tab-item layui-show">
                                    <table class="layui-table" id="log-table-batch-task"></table>
                                </div>
                                <div class="layui-tab-item">
                                    <table class="layui-table" id="success-table-batch-task"></table>
                                </div>
                                <div class="layui-tab-item">
                                    <table class="layui-table" id="error-table-batch-task"></table>
                                </div>
                                <div class="layui-tab-item">
                                    <table class="layui-table" id="warning-table-batch-task"></table>
                                </div>
                                <div id="displaythis" class="layui-tab-item">
                                    <table class="layui-table" id="eWarning-table-batch-task"></table>
                                </div>
                            </div></div>
                        </div>
                        <div class="layui-tab-item"></div>
                        <div class="layui-tab-item">
                         <div class="layui-tab-content" id="layui-tab-content-total">
                            <div id="dataTableDiv" class="layui-tab-item layui-show">
                                <table class="layui-table" id="valuation-checklog"></table>
                            </div>
                        </div>
                        </div>
                       <div class="layui-tab-item">
                         <div class="layui-tab-content" id="layui-tab-content-total">
                            <div id="dataTableDiv" class="layui-tab-item layui-show">
                                <table class="layui-table" id="balance-checklog"></table>
                            </div>
                        </div>
                        </div>
                        <div class="layui-tab-item">
                        <div class="layui-tab layui-tab-card" lay-filter="tabContainer">
                            <ul class="layui-tab-title">
                                <li id="log-title-data-backhaul" class="layui-this"><i class="iconfont icon-document"
                                    style="color: #13a7edd1"></i>日志</li>
                                <li id="success-title-data-backhaul"><i class="iconfont icon-circle-correct_fill"
                                    style="color: #17c347;"></i>成功</li>
                                <li id="error-title-data-backhaul"><i class="iconfont icon-circle-wrong_fill"
                                    style="color: #ff2236;"></i>失败</li>
                                <li id="warning-title-data-backhaul"><i class="iconfont icon-sigh_fill"
                                    style="color: #ebef00d1;"></i>警告</li>
                                <li id="eWarning-title-data-backhaul"><i class="iconfont icon-risk_fill"
                                    style="color: #1724c3;"></i>预警信息</li>
                            </ul>
                            <div class="layui-tab-content" id="layui-tab-content-data-backhaul">
                                <div id="dataTableDiv" class="layui-tab-item layui-show">
                                    <table class="layui-table" id="log-table-data-backhaul"></table>
                                </div>
                                <div class="layui-tab-item">
                                    <table class="layui-table" id="success-table-data-backhaul"></table>
                                </div>
                                <div class="layui-tab-item">
                                    <table class="layui-table" id="error-table-data-backhaul"></table>
                                </div>
                                <div class="layui-tab-item">
                                    <table class="layui-table" id="warning-table-data-backhaul"></table>
                                </div>
                                <div id="displaythis" class="layui-tab-item">
                                    <table class="layui-table" id="eWarning-table-data-backhaul"></table>
                                </div>
                            </div></div>
                        </div>
                          <div class="layui-tab-item"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/makeaccount/OneKeyMakeAccount001.js}" type="text/javascript"></script>
</div>
</html>
