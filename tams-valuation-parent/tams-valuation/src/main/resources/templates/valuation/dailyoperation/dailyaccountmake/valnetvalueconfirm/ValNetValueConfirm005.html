<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ValNetValueConfirm005}">产品净值走势图</title>
</head>
<body>
	<div layout:fragment="content">

			<form class="layui-form" id="searchForm">
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							   data-th-text="#{ValNetValueConfirm005.productname}">产品简称</label>
						<div class="layui-input-inline input-inline">
							<select id="finprodId" name="finprodId"
									class="layui-input form-input input-select"
									data-th-data-url="@{/valuation/dailyoperation/dailyaccountmake/valnetvalueconfirm/ValNetValueConfirm005/findProduct}"
									required
									data-th-placeholder="#{SysCommon.placeholder}">
							</select>
						</div>
					</div>
					<div
							class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable"
							   data-th-text="#{ValNetValueConfirm005.startDate}">查询区间</label>
						<div class="layui-input-inline input-inline">
							<input id="repRaisePdate" name='repRaisePdate'
								   class="layui-input form-input input-dateRangeSelect"
								   placeholder="请选择时间区间" allowClear="true" required
								   data-th-placeholder="#{SysCommon.placeholder}">
						</div>
					</div>
					<div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
						<button type="button" class="layui-btn layui-btn-sm " id="ValNetValueConfirm005_btn_search"><i class="iconfont "></i>查询</button>
					</div>
				</div>
			</form>
			<div class="pro-module-wrap">
				<div class="pro-module ">
					<h3 class="pro-module-title">
						<span class="title-des">净值趋势</span>
					</h3>
					<div class="layui-form-item">
						<div class="layui-inline "
							 id="eChart1" style="height: 500px;width: 100%;">
						</div>
					</div>
				</div>
				<div class="pro-module ">
					<h3 class="pro-module-title">
						<span class="title-des">年化收益率</span>
					</h3>
					<div class="layui-form-item">
						<div class="layui-inline "
							 id="eChart2" style="height: 500px;width: 100%;">
						</div>
					</div>
				</div>
			</div>

	</div>

	<div layout:fragment="script">
		<script th:inline="javascript" type="text/javascript">
			var sysDate = /*[[${sysdate}]]*/'';
		</script>
		<script
				data-th-src="@{/js/valuation/dailyoperation/dailyaccountmake/valnetvalueconfirm/ValNetValueConfirm005.js}"></script>
	</div>
</body>

</html>
