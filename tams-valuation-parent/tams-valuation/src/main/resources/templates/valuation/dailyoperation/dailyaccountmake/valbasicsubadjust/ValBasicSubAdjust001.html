<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>拓展四级科目</title>
    <style>
        .layui-table tbody tr:hover, .layui-table thead tr, .layui-table-click, .layui-table-header, .layui-table-hover, .layui-table-mend, .layui-table-patch, .layui-table-tool, .layui-table[lay-even] tr:nth-child(even){
            background-color: #d9ecff!important;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <div class="layui-form-item">
            <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                <label class="layui-form-label form-lable">账套代码</label>
                <div class="layui-input-inline input-inline">
                    <select type="text" id="booksetIds" name="booksetIds"
                            class="layui-input form-input input-select" placeholder="请输入内容"
                            data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-data-url="@{/valuation/dailyoperation/dailyaccountmake/valbasicsubadjust/ValBasicSubAdjust001/selectBooksetIds}"
                            allowClear="true" childrenIds="subjectNo"
                            formatoption="true" multiple>
                    </select>
                </div>
            </div>
            <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                <label class="layui-form-label form-lable">科目号</label>
                <div class="layui-input-inline input-inline">
                    <select type="text" id="subjectNo" name="subjectNo"
                            class="layui-input form-input input-select" allowClear="true"
                            placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                            formatoption="true" required="required" parentIds="booksetIds"
                            data-th-data-url="@{/valuation/dailyoperation/dailyaccountmake/valbasicsubadjust/ValBasicSubAdjust001/selectSubjectNo}">
                    </select>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                <label class="layui-form-label form-lable">调整基础科目性质</label>
                <div class="layui-input-inline input-inline">
                    <select type="text" id="baseSubjectNature" name="baseSubjectNature"
                            class="layui-input form-input input-select" allowClear="true"
                            placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                            formatoption="true" required="required"
                            data-th-data-url="@{/valuation/dailyoperation/dailyaccountmake/valbasicsubadjust/ValBasicSubAdjust001/selectBaseSubjectNature}">
                    </select>
                </div>
            </div>
        </div>
    </form>
    <div class="layui-form-item">
        <div class="text-center">
            <a id="ValBasicSubAdjust001_btn_submit" class="layui-btn layui-btn-sm btn-submit">确认调整</a>
            <a id="ValBasicSubAdjust001_btn_sql" class="layui-btn layui-btn-sm btn-submit">脚本生成</a>
            <a id="ValBasicSubAdjust001_btn_reset" class="layui-btn layui-btn-sm btn-reset">重置</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/dailyoperation/dailyaccountmake/valbasicsubadjust/ValBasicSubAdjust001.js}" type="text/javascript"></script>
</div>
</body>
</html>
