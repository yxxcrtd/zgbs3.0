<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
    <title>对账明细余额表</title>
</head>
<body>
	<div layout:fragment="content">
        <div class="form-button-area" export="false">
        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
          <form class="layui-form" id="searchForm"> 
            <div class="layui-form-item" style="display: none;">
                <input id="serialNo" name="serialNo" class="layui-input form-input" placeholder="业务流水号"
                    data-th-value="${entity?.serialNo}"> 
                <input id="interType" name="interType"
                    class="layui-input form-input" placeholder="接口类型" data-th-value="${entity?.interType}">
            </div>
              <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">显示范围</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="displayRange" name="displayRange"
                                   placeholder="请选择" class="layui-input form-input input-select"
                                   allowClear="true">
                                   <option value='01'>显示全部</option>
                                   <option value='02'>显示差异部分</option>
                            </select>       
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">科目级别</label>
                        <div class="layui-input-inline input-inline">
                            <select id="subjectLevel" name="subjectLevel"
                                class="layui-input form-input input-select" placeholder="请选择"
                                data-th-data-result="${SUBJECT_LEVEL}" allowClear="true"><option></option></select>
                        </div>
                    </div>
                </div>
          </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
	</div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/dailyoperation/dailyaccountmake/valelectreconciliation/ValElectReconciliation003.js}" type="text/javascript"></script>
    </div>
</body>

</html>
