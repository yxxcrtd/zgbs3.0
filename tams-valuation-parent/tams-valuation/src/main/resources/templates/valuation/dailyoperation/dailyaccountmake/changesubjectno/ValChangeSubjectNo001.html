<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>科目信息变更</title>
    <style>
        .layui-upload-drag {
            padding-top: 5px;
            padding-left: 30px;
            padding-bottom: 15px;
            padding-right: 30PX;
        }
        span.btn-full {
           /* display: none;*/
            width: 160px;
            height: 30px;
            margin-left: 5px;
            margin-top: 90px;
            display: inline-block;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <div class="layui-form-item">
            <div class="layui-inline layui-col-xs6 layui-col-sm6 layui-col-md4 layui-col-lg6">
                <label class="layui-form-label form-lable"><span style="color: red"> * </span>处理方式</label>
                <div class="layui-input-inline input-inline">
                    <select id="changeSubjectType" name="changeSubjectType" class="layui-input form-input input-select" allowClear="false"
                            placeholder="请输入内容" data-th-data-result="${CHANGE_SUBJECT_TYPE}" data-th-initValue="${CHANGE_SUBJECT_TYPE_01}" >
                        <option></option>
                    </select>
                </div>
            </div>
            <div class="layui-inline layui-col-xs6 layui-col-sm6 layui-col-md4 layui-col-lg6" id="booksetIdsDiv">
                <label class="layui-form-label form-lable">账套代码</label>
                <div class="layui-input-inline input-inline">
                    <select id="booksetIds" name="booksetIds" class="layui-input form-input input-select"
                            data-th-data-url="@{/valuation/dailyoperation/dailyaccountmake/changesubjectno/ValChangeSubjectNo001/findBooksetId}"
                            multiple="multiple" allowClear="true" placeholder="请输入内容">
                    </select>
                </div>
            </div>
            <div style="display: none" class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4" id="downDiv">
                <label class="layui-form-label form-lable">&nbsp;</label>
                <div class="layui-input-inline input-inline">
                    <a style="text-decoration: underline; color: #337ab7; margin-bottom: 10px"
                        id="ValChangeSubjectNo001_btn_TPLDOWLOAD" href="javascript:void(0);">模板下载</a>
                </div>
            </div>
        </div>
        <div class="layui-form-item" id="defultDiv">
            <div class="layui-inline layui-col-xs6 layui-col-sm6 layui-col-md4 layui-col-lg6">
                <label class="layui-form-label form-lable"><span style="color: red"> * </span>原科目号</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="oriSubjectNo" name="oriSubjectNo" placeholder="请输入内容" class="layui-input form-input">
                </div>
            </div>
            <div class="layui-inline layui-col-xs6 layui-col-sm6 layui-col-md4 layui-col-lg6">
                <label class="layui-form-label form-lable"><span style="color: red"> * </span>替换科目号</label>
                <div class="layui-input-inline input-inline">
                    <select type="text" id="changeSubjectNo" name="changeSubjectNo"
                            class="layui-input form-input input-select" formatoption = "true"
                            data-th-data-url='@{/valuation/dailyoperation/dailyaccountmake/changesubjectno/ValChangeSubjectNo001/getSubjectId}'
                            allowClear="true" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
                    </select>
                </div>
            </div>
        </div>

        <div class="pro-module" id="condition">
            <h3 class="pro-module-title">
                <span class="title-des">科目变更条件</span>
<!--                <i class="iconfont icon-arrow-down pro-down-icon"></i>-->
            </h3>
            <div class="pro-module-item">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs6 layui-col-sm6 layui-col-md4 layui-col-lg6">
                        <label class="layui-form-label form-lable">金融产品类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="finprodType" name="finprodType"
                                    class="layui-input form-input input-select" allowClear="true"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    formatoption=true data-th-data-result="${FINPROD_TYPE}" childrenIds="type2">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs6 layui-col-sm6 layui-col-md4 layui-col-lg6">
                        <label class="layui-form-label form-lable">核算分类</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="type2" name="type2"
                                    class="layui-input form-input input-select" allowClear="true"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    formatoption=true parentIds="finprodType"
                                    data-th-data-url="@{/valuation/dailyoperation/dailyaccountmake/changesubjectno/ValChangeSubjectNo001/selectDataDictType}">
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-xs6 layui-col-sm6 layui-col-md4 layui-col-lg6">
                        <label class="layui-form-label form-lable">交易场所</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="tradeMarket" name="tradeMarket"
                                    class="layui-input form-input input-select" allowClear="true"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${TRADE_PLACE}"
                                    >
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-xs6 layui-col-sm6 layui-col-md4 layui-col-lg6">
                        <label class="layui-form-label form-lable">是否其他债权类资产</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="isQtzq" name="isQtzq"
                                    class="layui-input form-input input-select" allowClear="true"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${YES_OR_NO}"
                            >
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="layui-form-item" id="importDiv" style="display: none">
            <input type="text" style="display: none;" id="fileNameInput_" name="fileNameInput_" class="layui-input form-input">
            <div class="layui-inline layui-col-md12  layui-col-xs12 layui-col-sm12 layui-col-lg12">
                <div class="layui-upload-drag upload" id="template"
                     data-option="{allowFileType: 'xls|xlsx', muiltiple: false, width:750, height: 60,
                        autoUpload: true, type: 'drag', callback: 'FileUpload.onUploaded'}">
                </div>
            </div>
        </div>
    </form>
    <div class="layui-form-item" id="defultButtonDiv">
        <div class="text-center">
            <a id="ValChangeSubjectNo001_btn_submit" class="layui-btn layui-btn-sm btn-submit">变更</a>
            <a id="ValChangeSubjectNo001_btn_scriptGeneration" class="layui-btn layui-btn-sm btn-submit">脚本生成</a>
            <a id="ValChangeSubjectNo001_btn_reset" class="layui-btn layui-btn-sm btn-reset">重置</a>
        </div>
    </div>
    <form class="layui-form joyin-form-wrap" id="listForm">
        <div id="importResultDiv" style="display: none">
            <table class="layui-table" id="importResultTable"></table>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var CHANGE_SUBJECT_TYPE_01 = /*[[${CHANGE_SUBJECT_TYPE_01}]]*/'';
        var CHANGE_SUBJECT_TYPE_02 = /*[[${CHANGE_SUBJECT_TYPE_02}]]*/'';
    </script>
    <script data-th-src="@{/js/valuation/dailyoperation/dailyaccountmake/changesubjectno/ValChangeSubjectNo001.js}" type="text/javascript"></script>
</div>
</body>
</html>
