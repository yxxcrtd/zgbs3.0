<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>账务明细代码加密</title>
    <style>
        .layui-table tbody tr:hover, .layui-table thead tr, .layui-table-click, .layui-table-header, .layui-table-hover, .layui-table-mend, .layui-table-patch, .layui-table-tool, .layui-table[lay-even] tr:nth-child(even){
            background-color: #d9ecff!important;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <div class="layui-form-item">
            <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                <label class="layui-form-label form-lable">业务明细代码</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="busiDetailId" name="busiDetailId" placeholder="请输入内容" class="layui-input form-input" required="required" >
                </div>
            </div>
            <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                <label class="layui-form-label form-lable">业务明细类型</label>
                <div class="layui-input-inline input-inline">
                    <select type="text" id="busiDetailType" name="busiDetailType"
                            class="layui-input form-input input-select" allowClear="true"
                            placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                            formatoption="true" required="required" data-th-data-result="${FINPROD_TYPE}"
                           >
                    </select>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                <label class="layui-form-label form-lable">理财子产品起息日</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="vdate" name="vdate" placeholder="请选择日期"
                           class="layui-input form-input input-dateSelect"
                    >
                </div>
            </div>
            <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                <label class="layui-form-label form-lable">收益类型</label>
                <div class="layui-input-inline input-inline">
                    <select type="text" id="profitType" name="profitType"
                            class="layui-input form-input input-select" allowClear="true"
                            placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                            formatoption="true" data-th-data-result="${PROFIT_TYPE}"
                            >
                    </select>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                <label class="layui-form-label form-lable">投资目的</label>
                <div class="layui-input-inline input-inline">
                    <select type="text" id="invAim" name="invAim"
                            class="layui-input form-input input-select" allowClear="true"
                            placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                            formatoption="true" data-th-data-result="${INV_AIM}"
                            >
                    </select>
                </div>
            </div>
            <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                <label class="layui-form-label form-lable">币种</label>
                <div class="layui-input-inline input-inline">
                    <select type="text" id="ccy" name="ccy"
                            class="layui-input form-input input-select" allowClear="true"
                            placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                            formatoption="true" data-th-data-result="${CCY}"
                            >
                    </select>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                <label class="layui-form-label form-lable">账务明细代码</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="bokDetailId" name="bokDetailId" placeholder="请输入内容" class="layui-input form-input">
                </div>
            </div>
        </div>
    </form>
    <div class="layui-form-item">
        <div class="text-center">
            <a id="ValAccountEncryption001_btn_submit" class="layui-btn layui-btn-sm btn-submit">生成</a>
            <a id="ValAccountEncryption001_btn_reset" class="layui-btn layui-btn-sm btn-reset">重置</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/dailyoperation/dailyaccountmake/valaccountencryption/ValAccountEncryption001.js}" type="text/javascript"></script>
</div>
</body>
</html>
