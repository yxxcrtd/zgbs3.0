<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title data-th-text="${ValAccountHandle001}">登账处理</title>
<script th:inline="javascript">
    var sysDate = [[${sysDate}]];
    var curUser=[[${session.curUser}]];
    var batchTaskNums=[[${batchTaskNums}]];
</script>
<style type="text/css">
	.layui-form-label{
		width: 16%!important;
	}
</style>
</head>
<body>
<div layout:fragment="content">
	<div class="layui-row layui-col-space15">
		<div class="layui-col-md3">
		    <div class="joyin-form-wrap">
		      <form class="layui-form" id="proidSearchForm"> 
                   <div class="layui-form-item">
                   <input type="text" id="batchName" name="batchName"
                        class="layui-input form-input input-fuzzy-text"
                        placeholder="输入批处理名称或名称关键字"
                        data-eventfunc="searchByBatchName">
                   </div>
		      </form>
		    </div> 
             <div class="layui-input" style="border: 1px solid #dbdbdb; scroll-y: auto; scroll-x: hidden; overflow-y: scroll;" data-checkable="false" data-checkall="false"
               data-roottitle="登账批处理" id='typeDatatree' data-th-url='@{/valuation/dailyoperation/dailyaccountmake/valaccounthandle/ValAccountHandle001/findAllTask}'>
		    </div>
	    </div>
	   	<div class="layui-col-md9">
	   		<div class="layui-form joyin-form-wrap">
	   			<div class="layui-form-item">
		   			<div class="layui-inline layui-col-md2" th:if="${AUTHORITY_TYPE}=='01'">
		   				<div class="layui-input-inline input-inline"  style = "width:100%!important">
                              <input type="text" id="batchBooksetType" name="batchBooksetType" class="layui-input form-input input-checkbox"
                               data-th-data-result="${BATCH_BOOKSET_TYPE}" data-th-initvalue="0" allowClear="true">
                        </div>
<!-- 		                <div class="layui-input-inline input-inline"> -->
<!-- 		                    <input type="radio" name="booksetType" value="0" title="账套组" checked lay-filter="booksetType"> -->
<!-- 		                    <input type="radio" name="booksetType" value="1" title="账套" lay-filter="booksetType"> -->
<!-- 		                </div> -->
		            </div>
	                 <div class="layui-inline layui-col-md4">
                    	<label class="layui-form-label form-lable" id="dynamicName" th:if="${AUTHORITY_TYPE}=='01'">账套组</label>
	                    <label class="layui-form-label form-lable" id="dynamicName" th:if="${AUTHORITY_TYPE}=='02'">账套</label>
	                    <div class="layui-input-inline input-inline">
	                      	<select id="booksetId" name="booksetId"  class="layui-input form-input input-select"  multiple="multiple"
		                      	allowClear="true" showAll="true" placeholder="请选择" parentIds="booksets" formatoption = "false"
		                        data-th-data-url="@{/valuation/dailyoperation/dailyaccountmake/valaccounthandle/ValAccountHandle001/getBookSetIdNew}">
	                      	</select>
	                    </div>
	                 </div>
			         <div class="layui-inline layui-col-md3">
	                    <label class="layui-form-label form-lable">日期</label>
	                    <div class="layui-input-inline input-inline" >
	                      <input type="text" id="executeDate" name="executeDate" placeholder="请选择日期" class="layui-input form-input input-dateSelect"  />
	                    </div>
	               	</div>
	                <div class="layui-inline layui-col-md-offset2" >
	             <!--    <button class="layui-btn layui-btn-sm " id="checkBtn"><i class="iconfont icon-execute"></i>批前检查</button> -->
	                    <button class="layui-btn layui-btn-sm " id="ValAccountHandle001_btn_doInterBtn"><i class="iconfont icon-execute"></i>执行</button>
	<!-- 				    <button class="layui-btn layui-btn-sm  btn-default" id="stopInterBtn"><i class="iconfont icon-stopit"></i>终止</button>
	 -->				    <button class="layui-btn layui-btn-sm  btn-default" id="ValAccountHandle001_btn_logBtn"><i class="iconfont icon-document"></i>执行日志</button>
	                </div>
	                <div style="display:none;">
			            <select type="text" class="layui-input form-input input-select" id="booksets" name="booksets" allowClear="true" childrenIds="booksetId" th:if="${AUTHORITY_TYPE}=='01'">
	                        <option value="0">0</option>
	                        <option value="1">1</option>
	                    </select>
	                      <select type="text" class="layui-input form-input input-select" id="booksets" name="booksets" allowClear="true" childrenIds="booksetId" th:if="${AUTHORITY_TYPE}=='02'">
	                        <option value="1">1</option>
	                     </select>
                    </div>
	            </div>
		    </div>
			<div class="layui-tab layui-tab-card" lay-filter="tabContainer" >
			    	<ul class="layui-tab-title">
			        <!--   <li  id = "checking-title" ><i class="iconfont icon-risk_fill" style="color:#1724c3;"></i>批检信息</li> -->
			          <li  id = "log-title" class="layui-this"><i class="iconfont icon-document"style="color:#13a7edd1"></i>日志</li>
			          <li  id = "success-title"><i class="iconfont icon-circle-correct_fill" style="color:#17c347;"></i>成功</li>
		              <li  id = "error-title" ><i class="iconfont icon-circle-wrong_fill" style="color:#ff2236;"></i>失败</li>
		              <li  id = "warning-title" ><i class="iconfont icon-sigh_fill" style="color:#ebef00d1;"></i>警告</li>
		              <li  id = "eWarning-title" ><i class="iconfont icon-risk_fill" style="color:#1724c3;"></i>预警信息</li>
			        </ul>
			        <div class="layui-tab-content" id="layui-tab-content">
				        <div id="dataTableDiv" class="layui-tab-item layui-show">
				        	<table class="layui-table" id="log-table"></table>
				        </div>
				        <div class="layui-tab-item">
				        	<table class="layui-table" id="success-table"></table>
				        </div>
		                <div class="layui-tab-item">
		                    <table class="layui-table" id="error-table"></table>
		                </div>
		                <div class="layui-tab-item">
		                    <table class="layui-table" id="warning-table"></table>
		                </div>
		                <div id ="displaythis" class="layui-tab-item">
		                    <table class="layui-table" id="eWarning-table"></table>
		                </div>
			        </div>
			        <div class="layui-tab-content" id="layui-tab-check">
			        	<div id="layui-check" class="layui-tab-item layui-show">
                    		<table class="layui-table" id="dataTable"></table>
                    	</div>
                    </div>
	    	 </div>
   	    	 <div class="input-progressBar" data-key="progressBar" lay-filter="progressBar" id="progressBar" >
		    		<div class="layui-progress-bar" lay-percent="0%">0%</div>
	         </div>
	    </div>
    </div>
</div>
</body>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/dailyoperation/dailyaccountmake/valaccounthandle/ValAccountHandle001.js}" type="text/javascript"></script>
</div>
</html>
