<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>附件上传</title>
</head>

<body>
<div layout:fragment="content">
    <form class="layui-form " id="searchForm">
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">产品代码</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="finprodId" class="layui-input form-input input-lenovoselect"
                           data-th-value="${finprodId}"  disabled="true"/>
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">产品名称</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="finprodAbbr" class="layui-input form-input input-lenovoselect"
                           data-th-value="${finprodAbbr}"  disabled="true"/>
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">估值表/余额表</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="valBalFlag" class="layui-input form-input input-lenovoselect"
                           data-th-value="${valBalFlag}" disabled="true"/>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">估值日期</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="valDate" name="valDate" class="layui-input form-input input-dateSelect"  data-th-value="${valDate}" disabled="true"/>
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">日期</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="executeDate" name="executeDate" class="layui-input form-input input-dateSelect"  data-th-value="${sysDate}" />
                </div>
            </div>
            <div class="layui-inline layui-col-md12  layui-col-xs12 layui-col-sm12 layui-col-lg12" style="margin:35px 140px;;">

                <!--                     <div class="layui-upload-drag upload" id="template"
                                        data-allowfiletype=''
                                        data-th-data-url='@{/framework/fileUpload/uploadFile}'
                                        data-callback='ValNetValueConfirm003.onUploaded'>
                                    </div>
                                     -->

                <div class="upload" id="template"
                     th:disabled="${pageModel} eq ${pageModelReference}"
                     th:data-data='${attachmentFiles}'
                     data-option="{muiltiple: true, autoUpload: true, type: 'drag', callback: 'ValNetValueConfirm003.onUploaded'}">
                </div>

            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-col-md12  layui-col-xs12 layui-col-sm12 layui-col-lg12" style="text-align: center;">
                <!-- 	                <a id="FileUpload001_btn_reset" class="layui-btn layui-btn-sm btn-reset" data-th-text="#{SysCommon.reset}">重置</a> -->
                <!-- 	                <a id="FileUpload001_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a> -->
            </div>
        </div>

    </form>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>

</body>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/dailyoperation/dailyaccountmake/valnetvalueconfirm/ValNetValueConfirm003.js}" type="text/javascript"></script>
</div>

</html>
