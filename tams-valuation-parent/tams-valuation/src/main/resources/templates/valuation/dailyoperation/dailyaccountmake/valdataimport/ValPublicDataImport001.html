
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
	<meta charset="UTF-8">
	<title data-th-text="#{ValPublicDataImport001}">公共数据导入</title>
	<style>
		.input-btn-append a {
			line-height: 22px;
			height: 22px;
		}
	</style>
	<script th:inline="javascript">
		var sysDate = [[${sysDate}]];
	</script>
</head>

<body>
<div layout:fragment="content">

	<div class="layui-row layui-col-space15">
		<div class="layui-col-md3" style="width: 22%">
			<!-- <div class="joyin-form-wrap condition-area">
              <form class="layui-form" id="proidSearchForm">
                   <div class="layui-input-inline input-inline" style="width:250px;" >
                                   <input id="tmpEName" name="tmpEName" class="layui-input form-input input-fuzzy-text"
                                    placeholder="请输入交易数据关键词" data-th-data-result="${GROUP_CODE}" allowClear="true" style="width:200px;" >
                   </div>
              </form>
            </div>
            data-th-value="${sysDate}"  -->
			<div class="joyin-form-wrap">
				<form class="layui-form" id="proidSearchForm">
					<div class="layui-form-item" >
						<div style="float: left;width: 75%">
							<input type="text" id="TmpCName" name="TmpCName"
								   class="layui-input form-input input-fuzzy-text"
								   placeholder="输入接口名称或名称关键字"
								   data-eventfunc="serachKey">
						</div>
						<div style="float: right;width: 25%;line-height: 26px;cursor: pointer;color: #007fff;"
							 id="ValPublicDataImport001_btn_checkall">
							&nbsp;&nbsp;全选/取消
						</div>
					</div>

				</form>
			</div>
			<div class="layui-input" style="border: 1px solid #dbdbdb; scroll-y: auto; scroll-x: hidden; overflow-y: scroll;" data-checkall="false"
				 id='typeDatatree'  data-canedit='1' data-roottitle='数据类型'
				 data-th-url='|@{/valuation/dailyoperation/dailyaccountmake/valdataimport/ValPublicDataImport001/getInterGroup}'></div>
		</div>
		<div class="layui-col-md9" style="width: 78%">
			<div class="joyin-form-wrap condition-area" style="text-align:right">
				<div class="layui-inline layui-col-md4" >
					<label class="layui-form-label form-lable">日期</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="executeDate" name="executeDate"  placeholder="请选择、支持区间" class="layui-input form-input input-dateRangeSelect" allowClear="true" />
					</div>
				</div>
				<div class="layui-inline layui-col-md-offset4">
					<button class="layui-btn layui-btn-sm " id="ValPublicDataImport001_btn_doInterBtn"><i class="iconfont icon-execute"></i>执行</button>
					<button class="layui-btn layui-btn-sm  btn-default" id="ValPublicDataImport001_btn_stopInterBtn"><i class="iconfont icon-stopit"></i>终止</button>
					<button class="layui-btn layui-btn-sm  btn-default" id="ValPublicDataImport001_btn_logBtn"><i class="iconfont icon-document"></i>执行日志</button>
				</div>
			</div>
			<div class="layui-tab layui-tab-card" >
				<ul class="layui-tab-title">
					<li  id = "log-title" class="layui-this"><i class="iconfont icon-document"style="color:#13a7edd1"></i>日志</li>
					<li  id = "success-title"><i class="iconfont icon-circle-correct_fill" style="color:#17c347;"></i>成功</li>
					<li  id = "error-title" ><i class="iconfont icon-circle-wrong_fill" style="color:#ff2236;"></i>失败</li>
					<li  id = "warning-title" ><i class="iconfont icon-sigh_fill" style="color:#ebef00d1;"></i>警告</li>
					<li  id = "eWarning-title" ><i class="iconfont icon-risk_fill" style="color:#1724c3;"></i>预警信息</li>
				</ul>
				<div class="layui-tab-content" >
					<div class="layui-tab-item layui-show">
						<table class="layui-table" id="log-table"></table>
					</div>
					<div class="layui-tab-item">
						<table class="layui-table" id="success-table"></table>
					</div>
					<div class="layui-tab-item">
						<table class="layui-table" id="error-table"></table>
					</div>
					<div class="layui-tab-item">
						<table class="layui-table" id="warning-table"></table>
					</div>
					<div class="layui-tab-item">
						<table class="layui-table" id="eWarning-table"></table>
					</div>
				</div>
			</div>
			<div class="input-progressBar" data-key="progressBar" lay-filter="progressBar" id="progressBar" >
				<div class="layui-progress-bar" lay-percent="0%">0%</div>
			</div>
		</div>
	</div>
</div>
</body>
<div layout:fragment="script">
	<script data-th-src="@{/js/valuation/dailyoperation/dailyaccountmake/valdataimport/ValPublicDataImport001.js}" type="text/javascript"></script>
</div>

</html>
