<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>净值下发确认</title>
</head>
<body>

</body>
<div layout:fragment="content">
    <div class="form-button-area" export="false">
          <button type="button" class="layui-btn layui-btn-sm" id="ValNetValueConfirm001_btn_submit"><i class="iconfont icon-circle-correct_fill"></i>确认</button>
          <button type="button" class="layui-btn layui-btn-sm btn-default" id="ValNetValueConfirm001_btn_delete"><i class="iconfont icon-revoke"></i>撤销确认</button>
          <button type="button" class="layui-btn layui-btn-sm btn-default" id="ValNetValueConfirm001_btn_unfrozen"><i class="iconfont icon-send_fill"></i>下发</button>
          <button type="button" class="layui-btn layui-btn-sm btn-default" id="ValNetValueConfirm001_btn_deleteunfrozen"><i class="iconfont icon-revoke"></i>撤销下发</button>
          <button type="button" class="layui-btn layui-btn-sm btn-default" id="ValNetValueConfirm001_btn_export"><i class="iconfont icon-export"></i>导出</button>
          <button type="button" class="layui-btn layui-btn-sm " id="ValNetValueConfirm001_btn_chart"><i class="iconfont "></i>净值走势图</button>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
      <form class="layui-form" id="searchForm"> 
          <div class="layui-form-item">
              
              <div class="layui-inline layui-col-md4">
                  <label class="layui-form-label form-lable">产品类型</label>
                  <div class="layui-input-inline input-inline">
                      <input type="text" id="profitType" name="profitType" class="layui-input form-input input-select" 
                             placeholder="请选择" data-th-data-result="${PROFIT_TYPE}" 
                             allowClear="true" multiple="multiple" 
                             data-th-placeholder="#{SysCommon.placeholder}">
                  </div>
              </div>

               <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable">产品</label>
                        <div class="layui-input-inline input-inline">
                            <select id="finprodId" name="finprodId" class="layui-input form-input input-select"
                                placeholder="请选择，可复选" data-th-data-url="@{/valuation/dailyoperation/dailyaccountmake/valnetvalueconfirm/ValNetValueConfirm001/getFinprodId}" allowClear="true"
                                multiple="multiple" data-th-placeholder="#{SysCommon.placeholder}">
                            </select>
                        </div>
                </div>
               <div class="layui-inline layui-col-md4">
                  <label class="layui-form-label form-lable">估值日期</label>
                  <div class="layui-input-inline input-inline">
                    <input type="text" id="valDate" name="valDate" placeholder="请选择、支持区间" class="layui-input form-input input-dateRangeSelect" data-th-value="${platDate}">
                  </div>
              </div>
          </div>
          <div class="layui-form-item">
               <!-- <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">对账状态</label>
                <div class="layui-input-inline input-inline">
                        <select id="checkStatus" name="checkStatus" class="layui-input form-input input-select" multiple="multiple" 
                                        data-th-data-result="${CHECK_STATUS}" allowClear="true" > 
                        </select>
                </div>
              </div> -->
              <!-- <div class="layui-inline layui-col-md4">
                  <label class="layui-form-label form-lable">对账结果</label>
                  <div class="layui-input-inline input-inline">
                      <select id="checkResult" name="checkResult" class="layui-input form-input input-select" multiple="multiple" 
                        data-th-data-result="${CHECK_RESULT}" allowClear="true" > 
                      </select>
                  </div>
              </div> -->
              <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">确认状态</label>
                <div class="layui-input-inline input-inline">
                        <select id="confirmStatus" name="confirmStatus" class="layui-input form-input input-select" multiple="multiple" 
                                        data-th-data-result="${CONFIRM_STATUS}"  placeholder="请输入内容" allowClear="true" >
                        </select>
<!--                       <input type="text" id="confirmStatus" name="confirmStatus" class="layui-input form-input input-checkbox"
                        data-result="[{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;未确认&quot;,&quot;col&quot;:&quot;&quot;},
                                      {&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;已确认&quot;,&quot;col&quot;:&quot;&quot;}]"
                        initvalue="02" style="display: none;"> -->
                </div>
              </div>
              <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">下发状态</label>
                <div class="layui-input-inline input-inline">
                        <select id="noticeStatus" name="noticeStatus" class="layui-input form-input input-select" multiple="multiple" 
                                        data-th-data-result="${NOTICE_STATUS}" placeholder="请输入内容" allowClear="true" >
                        </select>
                </div>
              </div>
          </div>
      </form>
    </div>
<!--     <div class="layui-fluid" style="text-align:right;margin-top:15px;">
          <button type="button" class="layui-btn layui-btn-sm btn-submit" id="ValNetValueConfirm001_btn_submit">确认</button>
          <button type="button" class="layui-btn layui-btn-sm btn-delete" id="ValNetValueConfirm001_btn_delete">撤销</button>
          <button type="button" class="layui-btn layui-btn-sm btn-unfrozen" id="ValNetValueConfirm001_btn_unfrozen">下发</button>
          <button type="button" class="layui-btn layui-btn-sm btn-export" id="ValNetValueConfirm001_btn_export">导出</button>
    </div> -->
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/dailyoperation/dailyaccountmake/valnetvalueconfirm/ValNetValueConfirm001.js}" type="text/javascript"></script>
</div>
</html>
