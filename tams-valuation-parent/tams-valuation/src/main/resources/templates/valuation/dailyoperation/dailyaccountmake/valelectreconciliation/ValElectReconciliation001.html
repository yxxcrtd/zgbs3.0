<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
    <title>电子对账</title>
<!--     <script th:inline="javascript">
	    var sysDate = [[${sysDate}]];
	</script> -->
</head>
<body>
	<div layout:fragment="content">
	    <div class="form-button-area" >
          <button type="button" class="layui-btn layui-btn-sm btn-default" id="ValElectReconciliation001_btn_confirm"><i class="iconfont icon-send_fill"></i>发送</button>
          <button type="button" class="layui-btn layui-btn-sm btn-default" id="ValElectReconciliation001_btn_adjust"></i>调整</button>
          <button type="button" class="layui-btn layui-btn-sm btn-default" id="ValElectReconciliation001_btn_canadjust"></i>取消调整</button>
	    </div>
	    <div class="joyin-form-wrap joyin-filter-form condition-area">
	      <form class="layui-form" id="searchForm"> 
	          <div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">估值日期</label>
					      <div class="layui-input-inline input-inline">
		                  		<input type="text" id="valDate" name="valDate" placeholder="请选择日期" 
		                  		class="layui-input form-input input-dateSelect" required>
		                  </div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">产品代码</label>
						<div class="layui-input-inline input-inline">
							<select id="prodId" name="prodId"
								class="layui-input form-input input-select"
								data-th-data-url="@{/valuation/dailyoperation/dailyaccountmake/valelectreconciliation/ValElectReconciliation001/getFinprodId}"
								 multiple="multiple" allowClear="true"  placeholder="请输入内容" formatoption="true"required>
							</select>
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">对账对象</label>
						<div class="layui-input-inline input-inline">
							<select id="interType" name="interType"
								class="layui-input form-input input-select" placeholder="请选择"
								data-th-data-result="${CHECK_FLAG}" allowClear="true"><option></option></select>
						</div>
					</div>
				</div>
	          <div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">报文状态</label>
						<div class="layui-input-inline input-inline">
							<select id="xmlStatus" name="xmlStatus"
								class="layui-input form-input input-select" placeholder="请选择"
								data-th-data-result="${XML_STATUS}" allowClear="true"><option></option></select>
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">对账状态</label>
						<div class="layui-input-inline input-inline">
							<select id="checkStatus" name="checkStatus"
								class="layui-input form-input input-select" placeholder="请选择"
								data-th-data-result="${SZT_CHECK_STATUS}" allowClear="true"><option></option></select>
						</div>
					</div>
				</div>
	      </form>
	    </div>
	    <div>
	        <table class="layui-table" id="dataTable"></table>
	    </div>
	</div>

    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/dailyoperation/dailyaccountmake/valelectreconciliation/ValElectReconciliation001.js}" type="text/javascript"></script>
    </div>
</body>

</html>
