<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ValAssetReclassification001}">资产重分类</title>
<script th:inline="javascript">
     var INVAIM = [[${INV_AIM}]];
     
	var workflowId = [[${workflowId}]];

</script>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area" export="false" create="false">
        </div>

        <div class="joyin-form-wrap joyin-filter-form condition-area">
	        <form class="layui-form" id="searchForm">
	            <div class="layui-form-item">
	                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable">资产类型</label>
	                    <div class="layui-input-inline input-inline">
	                    	 <input type="hidden" id="valAssetReclassification001DtoList" name="valAssetReclassification001DtoList" />
	                         <select id="assetType" name="assetType" disabled="disabled"
								class="layui-input form-input input-select" required
								data-th-data-result='${FINPROD_TYPE}' allowClear="true" placeholder="请输入内容"
								data-th-initValue="${finproductTypeCode}">
							</select>
	                    </div>
	                </div>
	                <div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">账套</label>
						<div class="layui-input-inline input-inline">
							<select id="booksetId" name="booksetId" required
								class="layui-input form-input input-select"
								data-th-data-url='@{/valuation/dailyoperation/dailyaccountmake/valassetreclassification/ValAssetReclassification001/getBooksetId}' allowClear="true"
								placeholder="请输入内容">
							</select>
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">资产代码</label>
						<div class="layui-input-inline input-inline">
							<select id="finprodId" name="finprodId"
								class="layui-input form-input input-select"
								data-th-data-url='@{/valuation/dailyoperation/dailyaccountmake/valassetreclassification/ValAssetReclassification001/getFinprodId}' allowClear="true"
								multiple="multiple" placeholder="请输入内容">
							</select>
						</div>
					</div>             
	            </div>
	            <div class="layui-form-item">
	                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
						<label class="layui-form-label form-lable">资产细分类</label>
	                    <div class="layui-input-inline input-inline">
	                         <select id="assetDetailType" name="assetDetailType"
								class="layui-input form-input input-select"
								data-th-data-result='${BOND_TYPE}' allowClear="true"
								placeholder="请输入内容"
								data-th-placeholder="#{SysCommon.placeholder}">
							</select>
	                    </div>
	                </div> 
	                
	                <div id="submitDiv" class="btn-select-wrapper layui-inline layui-col-md2" style="left: 500px;">
			                <a class="layui-btn layui-btn-sm btn-select">应用所选行<i class="iconfont icon-down"></i></a>
			                <ul class="btn-select-wrap" style="display: none;">
			                    <li><a href="javascript:;" id="doAll">应用到全部行</a></li>
			                    <li><a href="javascript:;" id="doSelect">应用到选择行</a></li>
			                    <li><a href="javascript:;" id="doEmpty">应用到空行</a></li>
			                </ul>
			                
			                <a id="ValAssetReclassification001_btn_submit" class="layui-btn layui-btn-sm btn-submit"
			                    data-th-text="#{SysCommon.submit}">提交</a>
		            </div>            
	            </div>
	        </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/dailyoperation/dailyaccountmake/valassetreclassification/ValAssetReclassification001.js}" type="text/javascript"></script>
    </div>
</body>

</html>
