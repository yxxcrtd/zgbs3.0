<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>数据移植模板转换</title>
</head>

<body>
	<div layout:fragment="content">
	    <form class="layui-form " id="searchForm">
            <input type="hidden" id="errorData" name="errorData">
            <input type="hidden" id="datas" name="datas">
            <input type="hidden" id="exportType" name="exportType">
	        <div class="layui-form-item">
               <div class="layui-inline layui-col-md6">
                 <label class="layui-form-label form-lable">模版类型</label>
	                 <div class="layui-input-inline input-inline">
	                  	 <select type="text" id="modelType" name="modelType" 
	                  	 class="layui-input form-input input-select" data-th-data-result='${TRANSPLANT_FORMATION_MODEL_TYPE}' 
	                  	 allowClear="true" placeholder="请选择"> </select>       
	                 </div>
                </div>
		        <div class="layui-inline layui-col-md12  layui-col-xs12 layui-col-sm12 layui-col-lg12" style="margin:30px;">
		            <div class="layui-upload-drag upload" id="template" 
		                data-allowfiletype='' 
		                data-th-data-url='@{/framework/fileUpload/uploadFile}'
		                data-callback='FileUpload001.onUploaded'>
		            </div>
		        </div>
		        <div id="exportbtn" style="display: none">
		        	<a class="layui-btn layui-btn-sm btn-export" id="Transformation001_btn_export">下载</a>
		        </div>
	        </div> 
	    </form>
        <div style="display: none" id="showTable">
            <table class="layui-table" id="dateTable"></table>
        </div>
	</div>
	<div layout:fragment="script">
	  <script data-th-src="@{/js/valuation/transformation/Transformation001.js}" type="text/javascript"></script>
	</div>
</body>
</html>
