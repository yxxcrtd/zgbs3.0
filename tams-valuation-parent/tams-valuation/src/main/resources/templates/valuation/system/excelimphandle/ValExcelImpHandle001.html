<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>导入管理</title>
</head>

<body>

<div layout:fragment="content">
    <form class="layui-form " id="searchForm">
        <div class="layui-inline layui-col-md3" style="margin:30px;text-align: right;">
                         上传文件：
        </div>
        <div class="layui-inline layui-col-md7" style="margin:30px;">
            
            <div class="layui-upload-drag upload" id="template"
                data-allowfiletype='xls|xlsx' 
                data-th-data-url='@{/framework/fileUpload/uploadFile}'
                data-callback='ValExcelImpHandle.onUploaded'>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-col-md12" style="text-align: center;">
                <a class="layui-btn layui-btn-sm btn-reset" id="ValVoucherQuery001_btn_reset"><i class="iconfont icon-reset"></i><span>&nbsp;&nbsp;重置</span></a>
                 <a class="layui-btn layui-btn-sm btn-save" id="ValVoucherQuery001_btn_save"><i class="iconfont icon-save"></i><span>&nbsp;&nbsp;保存</span></a>
            </div>
        </div>
        
        <table class="layui-table" id="dataTable"></table>
    </form>
</div>
</body>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/system/excelimphandle/ValExcelImpHandle001.js}" type="text/javascript"></script>
</div>

</html>
