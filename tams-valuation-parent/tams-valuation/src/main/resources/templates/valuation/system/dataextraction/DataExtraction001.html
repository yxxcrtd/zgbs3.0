<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>数据提取</title>
</head>
<body>

</body>
<div layout:fragment="content">
	<form class="layui-form joyin-form-wrap" id="submitForm" style="background: #ffffff; padding: 10px 0;text-align:center">
		<div class="layui-form-item">
			<div class="layui-inline layui-col-md10 form-wrap">
				<label class="layui-form-label form-label">数据源</label>
				<div class="layui-input-inline input-inline">
					<input class="layui-input form-input input-checkbox"
						name="dataSource" id="dataSource" required="required"
						initvalue="base"
						data-result="[{&quot;id&quot;:&quot;base&quot;,&quot;text&quot;:&quot;base&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;mast&quot;,&quot;text&quot;:&quot;mast&quot;,&quot;col&quot;:&quot;&quot;}]">
				</div>
			</div>
		</div>
		<div class="layui-form-item" id = "c_length">
			<div class="layui-inline layui-col-md4 form-wrap">
				<label class="layui-form-label form-label">导出最大数目</label>
				<div class="layui-input-inline input-inline">
					<input class="layui-input form-input"
						name="length" id="length" required="required" value="1000">
				</div>
			</div>
		</div>
		<div class="layui-form-item">
			<div class="layui-inline layui-col-md10">
				<label class="layui-form-label form-label">查询SQL</label>
				<div class="layui-input-inline input-inline">
                	<textarea id="inputSql" name="inputSql" class="layui-textarea"  data-th-placeholder="#{SysCommon.placeholder}" rows="10" required></textarea>
                </div>               
			</div>
		</div>
		<div class="layui-col-md11" style="margin:20px;">
			<div class="text-center">
				<a id="DataExtraction001_btn_submit" class="layui-btn layui-btn-sm btn-submit">执行</a>
				<a id="DataExtraction001_btn_export" class="layui-btn layui-btn-sm btn-export">导出</a>
			</div>
		</div>
		<div style="display:none;" id="div1">
        	<table class="layui-table" id="dataTable"></table>
        </div>
	</form>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/system/dataextraction/DataExtraction001.js}" type="text/javascript"></script>
</div>
</html>
