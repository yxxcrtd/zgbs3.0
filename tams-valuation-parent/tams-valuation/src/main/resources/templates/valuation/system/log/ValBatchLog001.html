<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
<title data-th-text="#{ValBatchLog001}">批处理日志</title>
</head>
<body>
    <div layout:fragment="content">
		<div class="form-button-area">
		</div>
		<div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
	                <label class="layui-form-label form-lable" data-th-text="#{ValBatchLog001.taskGroupName}">任务组名称</label>
	                <div class="layui-input-inline input-inline">
	                	  <input type="text" id="taskGroup" name="taskGroup" class="layui-input form-input input-lenovoselect"
	                        placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-data-url="@{/valuation/system/log/ValBatchLog001/getTaskGroup}"
                            data-idfield="code" data-keyfield="shortName" data-effectiveFields="shortName"
                            data-th-data-effectivefieldsalias='|{"shortName":"#{ValBatchLog001.taskGroupName}","code":"#{ValBatchLog001.taskGroupId}"}|'>
	                </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
	                <label class="layui-form-label form-lable" data-th-text="#{ValBatchLog001.taskName}">任务名称</label>
	                <div class="layui-input-inline input-inline">
	                	  <input type="text" id="task" name="task" class="layui-input form-input input-lenovoselect"
	                        placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-data-url="@{/valuation/system/log/ValBatchLog001/getTask}"
                            data-idfield="code" data-keyfield="shortName" data-effectiveFields="shortName"
                            data-th-data-effectivefieldsalias='|{"shortName":"#{ValBatchLog001.taskName}","code":"#{ValBatchLog001.taskId}"}|'>
	                </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
	                <label class="layui-form-label form-lable" data-th-text="#{ValBatchLog001.prdGroupName}">产品组名称</label>
	                <div class="layui-input-inline input-inline">
	                	  <input type="text" id="prdGroup" name="prdGroup" class="layui-input form-input input-lenovoselect"
	                        placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-data-url="@{/valuation/system/log/ValBatchLog001/getPrdGroup}"
                            data-idfield="code" data-keyfield="shortName" data-effectiveFields="shortName"
                            data-th-data-effectivefieldsalias='|{"shortName":"#{ValBatchLog001.prdGroupName}","code":"#{ValBatchLog001.prdGroupId}"}|'>
	                </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{ValBatchLog001.businessDate}">业务日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="businessDate" data-th-placeholder="#{SysCommon.dateInterval}" name="businessDate" class="layui-input form-input input-dateRangeSelect" />
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
	                <label class="layui-form-label form-lable" data-th-text="#{ValBatchLog001.taskStatus}">执行状态</label>
	                <div class="layui-input-inline input-inline">
	                	  <select type="text" id="taskStatus" name="taskStatus" class="layui-input form-input input-select"
	                        placeholder="请输入内容" data-th-placeholder="#{SysCommon.selectplaceholder}"
                            data-th-data-result='${BATCH_STATUS}' allowClear="true"></select>
	                </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
		      		<label class="layui-form-label form-lable">是否有警告</label>
			        <div class="layui-input-block input-inline">
		                <input type="checkbox" id="isWarn" name="isWarn" lay-skin="switch" lay-text="是|否">
		            </div>
     			 </div>
            </div>
        </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/system/log/ValBatchLog001.js}" type="text/javascript"></script>
    </div>
</body>

</html>
