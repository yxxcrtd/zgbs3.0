<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <title>批处理任务详情</title>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-wrapper pro-module-base">
        <div class="pro-module-wrap">
            <div class="pro-module">
                <h3 class="pro-module-title">
                    <span class="title-des">基础信息</span><i
                        class="iconfont icon-arrow-down pro-down-icon"></i></h3>
                <div class="pro-module-item">

                    <div class="layui-form-item">
                        <div class="layui-col-md4">
                            <label class="layui-form-label form-lable">任务名称</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="taskName" name="taskName" class="layui-input form-input"
                                       data-th-value="${log?.taskName}"/>
                            </div>
                        </div>
                        <div class="layui-col-md4">
                            <label class="layui-form-label form-lable">执行日期</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="batchDate" name="batchDate" class="layui-input form-input"
                                       data-th-value="${log?.batchDate}"/>
                            </div>
                        </div>

                    </div>

                    <div class="layui-form-item">
                        <div class="layui-col-md8">
                            <label class="layui-form-label form-lable" style="width: 19%;">日志信息</label>
                            <div class="layui-input-inline layui-inline layui-textarea" id="logInfo"
                                 style="max-height: 350px;overflow-y: scroll;width: 80%;">
                            </div>
                            <div style="display: none;" id="logInfoHidden" data-th-text="${log?.logInfo}"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>


    <div class="pro-module-wrap" id="detail">
        <div class="pro-module">
            <h3 class="pro-module-title">
                <span class="title-des">详细信息</span><i
                    class="iconfont icon-arrow-down pro-down-icon"></i></h3>
            <div class="layui-form-item">
                <div class="layui-col-md4">
                    <label class="layui-form-label form-lable">账套代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="booksetId" name="booksetId" class="layui-input form-input"
                               data-th-value="${log?.booksetId}"/>
                    </div>
                </div>
                <div class="layui-col-md4">
                    <label class="layui-form-label form-lable">资产代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="finprodId" name="finprodId" class="layui-input form-input"
                               data-th-value="${log?.finprodId}"/>
                    </div>
                </div>
            </div>

            <div class="layui-form-item">
                <div class="layui-col-md4">
                    <label class="layui-form-label form-lable">业务代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="busiId" name="busiId" class="layui-input form-input"
                               data-th-value="${log?.busiId}"/>
                    </div>
                </div>


                <div class="layui-col-md4">
                    <label class="layui-form-label form-lable">日志文件</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="filePath" name="finprodId" class="layui-input form-input"
                               data-th-value="${log?.filePath}"/>
                    </div>
                </div>

            </div>
        </div>

        <div class="layui-form-item">
            <div class="layui-col-md8">
                <label class="layui-form-label form-lable" style="width: 19%;">详细日志信息</label>
                <div class="layui-input-inline layui-inline layui-textarea" id="resultInfo"
                     style="max-height: 350px;overflow-y: scroll;width: 80%;">
                </div>
                <div style="display: none;" id="resultInfoHidden" data-th-text="${log?.resultInfo}"></div>
            </div>
        </div>

        <div class="layui-form-item">
            <div class="layui-col-md8">
                <label class="layui-form-label form-lable" style="width: 19%;">扩展明细</label>
                <div class="layui-input-inline layui-inline" style="max-height: 350px;overflow-y: scroll;width: 80%;">
                    <table class="layui-table" id="dataTable"></table>
                </div>
                <div style="display: none;" id="seqNo" data-th-text="${log?.seqNo}"></div>
            </div>
        </div>


    </div>
</div>

</div>

</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/system/log/ValBatchLog003.js}" type="text/javascript"></script>
</div>
</body>
</html>
