<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>交易费用管理</title>
</head>

<body>
<div layout:fragment="content">
    <div class="form-button-area"  filter="false">
        <a id="TradeCostManagement001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
        <a id="TradeCostManagement001_btn_edit" class="layui-btn layui-btn-sm btn-create">修改</a>
        <a id="TradeCostManagement001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}">删除</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable2">账套代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="bookSetId" name="bookSetId"
                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-data-url="getBookSetId2"
                               data-idfield="code" data-keyfield="code"
                               data-effectivefieldsalias='{&quot;code&quot;:&quot;账套代码&quot;,&quot;shortName&quot;:&quot;账套名称&quot;}'
                               data-th-Value="${bookSetId}"
                        >
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">费用类型</label>
                    <div class="layui-input-inline input-inline">
                        <select id="feeType" name="feeType" class="layui-input form-input input-select"
                                multiple="true" allowClear="true" data-th-data-result="${FEE_TYPE}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">支付日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="payDate" name="payDate" placeholder="请选择日期" class="layui-input form-input input-dateSelect" data-th-Value="${payDate}">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
</body>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/tradecostmanagement/TradeCostManagement001.js}" type="text/javascript"></script>
</div>

</html>
