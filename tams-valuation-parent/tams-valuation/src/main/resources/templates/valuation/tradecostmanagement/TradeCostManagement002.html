<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>交易费用管理</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm" style="background: #ffffff; padding: 10px 0;">
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">交易编号</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="tradeId" name="tradeId" class="layui-input form-input"
                           placeholder="提交后自动生成，无需填写" data-th-value="${tradeId}" disabled="disabled">
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable"><i class="iconfont must" style="display: inline;">*</i>账套代码</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="bookSetId" name="bookSetId"
                           class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                           data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-data-url="@{getBookSetId2}"
                           data-idfield="code" data-keyfield="code"
                           data-effectivefieldsalias='{&quot;code&quot;:&quot;账套代码&quot;,&quot;shortName&quot;:&quot;账套名称&quot;}'
                           data-th-value="${bookSetId}"
                    >
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable"><i class="iconfont must" style="display: inline;">*</i>费用类型</label>
                <div class="layui-input-inline input-inline" style="display: inline-block;">
                    <input id="feeType" name="feeType" class="layui-input form-input input-select"
                           placeholder="请选择" data-th-initValue="${feeType}"
                           data-th-data-result="${FEE_TYPE}" allowClear="true">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable"><i class="iconfont must" style="display: inline;">*</i>支付日期</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="payDate" name="payDate" placeholder="请选择"
                           data-th-value="${payDate}"
                           class="layui-input form-input input-dateSelect" allowClear="true"
                    >
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable"><i class="iconfont must" style="display: inline;">*</i>应付日期</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="mDate" name="mDate" placeholder="请选择"
                           data-th-value="${mDate}"
                           class="layui-input form-input input-dateSelect" allowClear="true"
                    >
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable"><i class="iconfont must" style="display: inline;">*</i>费用金额</label>
                <div class="layui-input-inline input-inline">
                    <input id="feeAmt" name="feeAmt" class="layui-input form-input text-money"
                           placeholder="请选择" data-th-value="${feeAmt}">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable"><i class="iconfont must" style="display: inline;">*</i>币种</label>
                <div class="layui-input-inline input-inline" style="display: inline-block;">
                    <input id="ccy" name="ccy" class="layui-input form-input input-select"
                           placeholder="请选择" data-th-initValue="${ccy}"
                           data-th-data-result="${CCY}" allowClear="true">
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">是否待摊</label>
                <div class="layui-input-inline input-inline" style="display: inline-block;">
                    <input id="isPrepaid" name="isPrepaid" class="layui-input form-input input-select"
                           placeholder="请选择" data-th-initValue="${isPrepaid}"
                           data-th-data-result="${YES_OR_NO}" allowClear="true">
                </div>
            </div>
            <div class="layui-inline layui-col-md4" id="registOrgDiv">
                <label class="layui-form-label form-lable">登记托管机构</label>
                <div class="layui-input-inline input-inline">
                    <select type="text" id="registOrg" name="registOrg" class="layui-input form-input input-select"
                           data-th-placeholder="#{SysCommon.placeholder}" data-th-data-url="@{/valuation/tradecostmanagement/TradeCostManagement002/getRegistOrg}"
                           parentIds="feeType" data-th-initValue="${registOrg}">
                    </select>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md12">
                <label class="layui-form-label form-label-wrap" style="width: 10%;">备注</label>
                <div class="input-inline layui-input-block" style="width: 86.8% !important;">
                    <input type="text" id="remark" name="remark" class="layui-input form-input"
                           data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${remark}">
                </div>
            </div>
        </div>
    </form>
    <div class="layui-col-md11" style="margin: 50px;">
        <div class="text-center">
            <a id="TradeCostManagement002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
               data-th-text="#{SysCommon.submit}">提交</a>
            <a id="TradeCostManagement002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var FEE_TYPE_B08 = /*[[${FEE_TYPE_B08}]]*/'';
        var FEE_TYPE_B13 = /*[[${FEE_TYPE_B13}]]*/'';
    </script>
    <script data-th-src="@{/js/valuation/tradecostmanagement/TradeCostManagement002.js?}"
            type="text/javascript"></script>
</div>

</body>
</html>
