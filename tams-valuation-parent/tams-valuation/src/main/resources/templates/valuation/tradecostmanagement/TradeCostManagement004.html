<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>交易费用管理</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm" style="background: #ffffff; padding: 10px 0;">
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">交易编号</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="tradeId" name="tradeId" class="layui-input form-input"
                           data-th-value="${tradeId}" disabled="disabled">
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable"><i class="iconfont must" style="display: inline;">*</i>账套代码</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="bookSetId" name="bookSetId" class="layui-input form-input"
                           data-th-value="${bookSetId}" disabled="disabled">
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable"><i class="iconfont must" style="display: inline;">*</i>费用类型</label>
                <div class="layui-input-inline input-inline" style="display: inline-block;">
                    <input id="feeType" name="feeType" class="layui-input form-input input-select"
                           placeholder="请选择" data-th-initValue="${feeType}"
                           data-th-data-result="${FEE_TYPE}" allowClear="true" disabled="disabled">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable"><i class="iconfont must" style="display: inline;">*</i>支付日期</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="payDate" name="payDate" placeholder="请选择"
                           data-th-value="${payDate}" disabled="disabled"
                           class="layui-input form-input input-dateSelect" allowClear="true"
                    >
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable"><i class="iconfont must" style="display: inline;">*</i>应付日期</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="mDate" name="mDate" placeholder="请选择"
                           data-th-value="${mDate}" disabled="disabled"
                           class="layui-input form-input input-dateSelect" allowClear="true"
                    >
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable"><i class="iconfont must" style="display: inline;">*</i>费用金额</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="feeAmt" name="feeAmt" class="layui-input form-input text-money"
                           data-th-value="${feeAmt}" disabled="disabled">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable"><i class="iconfont must" style="display: inline;">*</i>币种</label>
                <div class="layui-input-inline input-inline" style="display: inline-block;">
                    <input id="ccy" name="ccy" class="layui-input form-input input-select"
                           placeholder="请选择" data-th-initValue="${ccy}"
                           data-th-data-result="${CCY}" allowClear="true" disabled="disabled">
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable"><i class="iconfont must" style="display: inline;">*</i>是否待摊</label>
                <div class="layui-input-inline input-inline" style="display: inline-block;">
                    <input id="isPrepaid" name="isPrepaid" class="layui-input form-input input-select"
                           placeholder="请选择" data-th-initValue="${isPrepaid}"
                           data-th-data-result="${YES_OR_NO}" allowClear="true" disabled="disabled">
                </div>
            </div>
            <div class="layui-inline layui-col-md4" id="registOrgDiv">
                <label class="layui-form-label form-lable">登记托管机构</label>
                <div class="layui-input-inline input-inline" style="display: inline-block;">
                    <input id="registOrg" name="registOrg" class="layui-input form-input input-select"
                           placeholder="请选择" data-th-initValue="${registOrg}"
                           data-th-data-result="${REGIST_ORG}" allowClear="true" disabled="disabled">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md12">
                <label class="layui-form-label form-label-wrap" style="width: 10%;">备注</label>
                <div class="input-inline layui-input-block" style="width: 86.8% !important;">
                    <input type="text" id="remark" name="remark" class="layui-input form-input"
                           data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${remark}" disabled="disabled">
                </div>
            </div>
        </div>
    </form>
    <div class="layui-col-md11" style="margin: 50px;">
        <div class="text-center">
            <a id="TradeCostManagement004_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">确认</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var FEE_TYPE_B08 = /*[[${FEE_TYPE_B08}]]*/'';
        var FEE_TYPE_B13 = /*[[${FEE_TYPE_B13}]]*/'';
        $(document).ready(function(){
            var feeType = $.trim($('#feeType').val());
            if (!(feeType == FEE_TYPE_B08 || feeType == FEE_TYPE_B13)) {//不是结算手续费和维护费
                $('#registOrgDiv').hide();
            }
        });
    </script>
</div>
</body>
</html>
