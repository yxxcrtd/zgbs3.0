<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
	<meta charset="UTF-8">
	<title>移植数据清空</title>
</head>

<body>
<div layout:fragment="content">
	<div class="form-button-area"  export="false">
		<button type="button" class="layui-btn layui-btn-sm btn-default" id="doInterBtn"><i class="iconfont icon-revoke"></i>执行</button>
	</div>
	<div class="joyin-form-wrap joyin-filter-form condition-area">
		<form class="layui-form" id="searchForm">
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable"><i class="iconfont must" style="display: inline;">*</i> 所属账套</label>
					<div class="layui-input-inline input-inline">
						<select id="booksetId" name="booksetId"
								class="layui-input form-input input-select"
								data-th-data-url="@{/valuation/datatransplant/DataClean001/getBooksetId}" multiple="multiple"
								allowClear="true" placeholder="请输入内容">
						</select>
					</div>
				</div>

				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">模版类型</label>
					<div class="layui-input-inline input-inline">
						<select type="text" id="modelType" name="modelType"
								class="layui-input form-input input-select"
								data-th-data-result='${DATA_TRANSPLANT_MODEL_TYPE}'
								allowClear="true" placeholder="请选择">
						</select>

					</div>
				</div>

				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">删除日期</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="deleteDate" name="deleteDate"
							   data-th-value="${deleteDate}" placeholder="请选择、支持区间"
							   class="layui-input form-input input-dateRangeSelect"
							   allowClear="true">
					</div>
				</div>
			</div>
		</form>
	</div>

	<!-- 		<div>
                <table class="layui-table" id="dataTable"></table>
            </div> -->

</div>


<div layout:fragment="script">
	<script
			data-th-src="@{/js/valuation/datatransplant/DataClean001.js}"
			type="text/javascript"></script>
</div>
</body>
</html>
