<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>预提费用设置</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form " id="dataForm">
        <div class="layui-form-item" style="display: none;">
        	<input id="seqNo" name="seqNo" class="layui-input form-input" placeholder="流水号"
                    data-th-value="${entity?.seqNo}"> 
            <input id="operateType" name="operateType" class="layui-input form-input" placeholder="操作类型"
                   data-th-value="${entity?.operateType}"/>
            <input type="text" id="workflowId" name="workflowId" placeholder="流程 Id"
                   class="layui-input form-input" data-th-value="${entity?.workflowId}"/>
        </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4" >
                    <label class="layui-form-label form-lable">费用类型</label>
                    <div class="layui-input-inline input-inline">
                        <select id="feeType" name="feeType" class="layui-input form-input input-select"
                            allowClear="true" placeholder="请输入" data-th-data-result="${FEE_TYPE}"disabled="disabled"
                            data-th-initvalue="${entity?.feeType}" data-th-required="true">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">账套代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="booksetId" name="booksetId"class="layui-input form-input input-select"  
                               placeholder="请输入内容" data-th-required="true"data-th-initvalue="${entity?.booksetId}" allowClear="true"
                               data-th-data-url="@{/valuation/valuationparametermanage/valtrdaccountmfconfig/ValTrdAccountmfConfig002/getBooksetId}" >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">登记托管机构</label>
                    <div class="layui-input-inline input-inline">
                        <select id="registOrg" name="registOrg" class="layui-input form-input input-select"
                            allowClear="true" placeholder="请输入" data-th-data-result="${REGIST_ORG}"
                            data-th-initvalue="${entity?.registOrg}" data-th-required="true">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">支付频率</label>
                    <div class="layui-input-inline input-inline">
                        <select id="payCycle" name="payCycle" class="layui-input form-input input-select"
                            allowClear="true" placeholder="请输入" data-th-data-result="${FREQUENCY_UNIT}"
                            data-th-initvalue="${entity?.payCycle}" disabled="disabled" data-th-required="true">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">计提开始日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="positionStartDate" name="positionStartDate"
                               placeholder="请选择"data-th-required="true"
                               class="layui-input form-input input-dateSelect"
                               allowClear="true"data-th-value="${entity?.positionStartDate}" >
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">计提结束日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="positionEndDate" name="positionEndDate"
                               placeholder="请选择"data-th-required="true"
                               class="layui-input form-input input-dateSelect"
                               allowClear="true"data-th-value="${entity?.positionEndDate}" >
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4" >
                    <label class="layui-form-label form-lable">区间费用金额</label>
                    <div class="layui-input-inline input-inline">
                        <input id="feeAmtTotal" name="feeAmtTotal" class="layui-input form-input text-number" placeholder="请输入" 
                            data-th-value="${entity?.feeAmtTotal}" data-th-required="true">
                    </div>
                </div>
            </div>
        <div class="layui-row" style="margin: 50px;">
            <div class="text-center">
<!--                 <button type="button" class="layui-btn btn-save" id="ValTrdAccountmfConfig002_btn_save">保存</button> -->
                <button type="button" class="layui-btn btn-submit" id="ValTrdAccountmfConfig002_btn_submit">提交</button>
                <a type="button" class="layui-btn btn-cancel" id="ValTrdAccountmfConfig002_btn_cancel">取消</a>
            </div>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/valuationparametermanage/valtrdaccountmfconfig/ValTrdAccountmfConfig002.js}"
            type="text/javascript"></script>
</div>
</body>
</html>
