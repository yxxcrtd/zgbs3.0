<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/default}">
<head>
	<title>对账方案管理</title>
	<style type="text/css">
		.layui-upload-drag {
			width: 55%;
			height: 30px;
		}
		.report-colla-wrap .layui-table-body table{
			width:100%;
		}
		.report-colla-wrap .layui-table-body table tbody tr td .layui-table-cell{
			width:auto;
			float:left;
			height: 24px;
			line-height: 24px;
		}
	</style>
</head>
<body>
<div layout:fragment="content">
	<div class="layui-col-md3" style="width: 22%;margin-top:-5px">
		<div class="joyin-form-wrap joyin-form-container">
			<form class="layui-form" id="schemeForm">
				<div class="layui-form-item">
					<input type="text" id="searchKey" name="searchKey"
						   class="layui-input form-input input-fuzzy-text" placeholder="请输入对账方案关键字">
				</div>
			</form>
		</div>
		<div class="layui-collapse">
			<div class="layui-colla-item" style="padding: -3">
				<div class="layui-row layui-colla-title" style="margin: 0; line-height: 30px;height:30px;">
					<div class="layui-col-md6">
						<span>方案名称</span>
					</div>
					<div class="layui-col-md3 layui-col-md-offset3">
						<button type="button" class="layui-btn layui-btn-sm btn-create"
								id="ValReconcileSchemeInfo001_btn_add" style="margin-top: -3px;">新建</button>
					</div>
				</div>
				<div class="layui-colla-content layui-show report-colla-wrap" style="padding: 0">
					<table class="layui-table" id="schemeTable"></table>
				</div>
			</div>
		</div>
	</div>
	<div class="layui-col-md9" style="width: 78%;margin-top: -9px;" >
		<form class="layui-form joyin-form-wrap" id="submitForm"
			  style="background: #ffffff;">
			<fieldset class="layui-elem-field layui-field-title"
					  style="margin-top: 1px;">
				<!-- <legend><a href="javascript:;">基本信息</a></legend> -->
				<div class="layui-collapse">
					<div class="layui-colla-item">
						<h2 class="layui-colla-title">
							<a href="javascript:;">方案信息</a>
						</h2>
						<div class="layui-colla-content layui-show" style="padding-bottom: 0px;">
							<div class="layui-form-item">
								<div class="layui-inline layui-col-md6">
									<div class="layui-form-item">
										<div class="layui-inline layui-col-md12">
											<label class="layui-form-label form-lable"> <i
													class="iconfont must" style="display: inline;">*</i> 方案名称
											</label>
											<div class="layui-input-inline input-inline">
												<input id="schName" name="schName" class="layui-input form-input" disabled>
												<input id="schId" name="schId" style="display:none;" value="">
											</div>
										</div>

									</div>
									<div class="layui-form-item">
										<div class="layui-inline layui-col-md12">
											<label class="layui-form-label form-lable"> 默认方案 </label>
											<div class="layui-input-inline input-inline"
												 style="display: inline-block;">
												<input id="isDefaultFmt" name="isDefaultFmt" class="layui-input form-input " disabled>
												<input id="isDefault" name="isDefault" class="layui-input form-input" style="display: none;">
											</div>
										</div>
									</div>
									<div class="layui-form-item">
										<div class="layui-inline layui-col-md12">
											<label class="layui-form-label form-lable"> <i
													class="iconfont must" style="display: inline;">*</i>
												单一科目允许误差
											</label>
											<div class="layui-input-inline input-inline"
												 style="display: inline-block;">
												<input id="errorNumber" name="errorNumber"
													   class="layui-input form-input text-number"
													   data-pattern="4" data-th-value="${entity?.errorNumber}"
													   placeholder="请输入" allowClear="true">
											</div>
										</div>
									</div>
									<div class="layui-form-item">
										<div class="layui-inline layui-col-md12">
											<label class="layui-form-label form-lable"> <i
													class="iconfont must" style="display: inline;">*</i> 本方数据起始行
											</label>
											<div class="layui-input-inline input-inline"
												 style="display: inline-block;">
												<input id="myStartRowNo" name="myStartRowNo"
													   class="layui-input form-input"
													   data-th-value="${entity?.myStartRowNo}"
													   placeholder="请输入" allowClear="true">
											</div>
										</div>
									</div>
									<div class="layui-form-item">
										<div class="layui-inline layui-col-md12">
											<label class="layui-form-label form-lable"> <i
													class="iconfont must" style="display: inline;">*</i>
												外部系统数据起始行
											</label>
											<div class="layui-input-inline input-inline"
												 style="display: inline-block;">
												<input id="othersideStartRowNo" name="othersideStartRowNo"
													   class="layui-input form-input"
													   data-th-value="${entity?.othersideStartRowNo}"
													   placeholder="请输入" allowClear="true">
											</div>
										</div>
									</div>
								</div>
								<div class="layui-inline layui-col-md6">
									<div class="layui-form-item">
										<div class="layui-inline layui-col-md12">
											<label class="layui-form-label form-lable" style="width: 18%;"> <i
													class="iconfont must" style="display: inline;">*</i> 对账类型
											</label>
											<div class="layui-input-inline input-inline"
												 style="display: inline-block;">
												<input id="schemeTypeFmt" name="schemeTypeFmt" class="layui-input form-input" disabled>
												<input id="schemeType" name="schemeType" class="layui-input form-input" style="display: none;"  >
											</div>
										</div>
									</div>
									<div class="layui-form-item">
										<div class="layui-inline layui-col-md12">
											<label class="layui-form-label form-lable" style="width: 18%;"> <i
													class="iconfont must" style="display: inline;">*</i> 所属账套
											</label>
											<div class="layui-input-inline input-inline"
												 style="display: inline-block;">
												<input id="booksetName" name="booksetName" class="layui-input form-input" disabled>
												<input id="booksetId" name="booksetId" class="layui-input form-input" style="display: none;"  >
											</div>
										</div>
									</div>
									<div class="layui-inline layui-col-md12  layui-col-xs12 layui-col-sm12 layui-col-lg12" style="margin:5px;">
										<!-- 			            <div class="layui-upload-drag upload" id="template"
                                                                    data-allowfiletype=''
                                                                    data-th-data-url='@{/framework/fileUpload/uploadFile}'
                                                                    data-autoUpload = 'false'
                                                                    data-callback='FileUpload.onUploaded'>
                                                                </div>
                                                                 -->
										<div class="upload"
											 th:disabled="${pageModel} eq ${pageModelReference}"
											 th:data-data='${attachmentFiles}'
											 data-option="{allowFileType: 'xls|xlsx', muiltiple: false, autoUpload: true, type: 'drag', callback: 'FileUpload.onUploaded'}">
										</div>


									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</fieldset>
			<div class="layui-tab">
				<ul class="layui-tab-title">
					<li class="layui-this">结构映射</li>
					<li>科目映射（一对多）</li>
					<li>科目性质映射（多对多）</li>
					<li>资产映射</li>
				</ul>
				<div class="layui-tab-content">
					<div class="layui-tab-item layui-show">
						<table class="layui-table" id="table_construct"></table>
					</div>
					<div class="layui-tab-item">
						<table class="layui-table" id="table_subject"></table>
					</div>
					<div class="layui-tab-item">
						<table class="layui-table" id="table_nature"></table>
					</div>
					<div class="layui-tab-item">
						<table class="layui-table" id="table_assest"></table>
					</div>
				</div>
			</div>
		</form>
		<div class="layui-col-md11" style="margin: 0px;">
			<div class="text-center">
				<!--                 <a id="ValReconcileSchemeInfo001_btn_save" class="layui-btn layui-btn-sm btn-save"
                       data-th-text="#{SysCommon.save}">保存</a>  -->
				<a id="ValReconcileSchemeInfo001_btn_submit" class="layui-btn layui-btn-sm btn-submit"
				   data-th-text="#{SysCommon.submit}">提交</a>
			</div>
		</div>
	</div>
</div>
<div layout:fragment="script">
	<script
			data-th-src="@{/js/valuation/valuationparametermanage/reconcilescheme/ValReconcileSchemeInfo001.js}"
			type="text/javascript"></script>
</div>
</body>
</html>
