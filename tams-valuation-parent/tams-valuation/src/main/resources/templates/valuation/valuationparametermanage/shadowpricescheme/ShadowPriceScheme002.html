<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form " id="schemeForm">
            <div class="layui-form-item" style="display:none;">
                <input id="operateType" name="operateType"
                            class="layui-input form-input" placeholder="请输入"
                            data-th-value="${entity?.operateType}" >
                <input id="orgSchId" name="orgSchId"
                            class="layui-input form-input"
                            data-th-value="${entity?.orgSchId}" >
               <!--  <input id="o_schemeId" name="o_schemeId"
                            class="layui-input form-input" placeholder="原方案代码"
                            data-th-value="${entity?.schemeId}">
                <input id="o_schemeName" name="o_schemeName"
                            class="layui-input form-input" placeholder="原方案名称"
                            data-th-value="${entity?.schemeName}"> -->
                 <input type="text" id="workflowId" name="workflowId" class="layui-input form-input"
                  data-th-value="${workflowId}" disabled="disabled" style = "display:none;">            
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <label class="layui-form-label form-lable">方案代码</label>
                    <div class="layui-input-inline input-inline">
                        <input id="schId" name="schId"
                            class="layui-input form-input" placeholder="请输入"
                            data-th-value="${entity?.schId}" required>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <label class="layui-form-label form-lable">方案名称</label>
                    <div class="layui-input-inline input-inline">
                        <input id="schName" name="schName"
                            class="layui-input form-input" placeholder="请输入"
                            data-th-value="${entity?.schName}" required>
                    </div>
                </div>
            </div>
            
          <!--    <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <label class="layui-form-label form-lable">适用范围</label>
                     <div class="layui-input-inline input-inline">
                            <input class="layui-input form-input input-checkbox" name="isdefault" id="isdefault" 
                                data-th-initvalue="${entity?.isdefault}" 
                                data-th-data-result="${YES_OR_NO}">
                    </div>
                </div>
            </div> -->
            
            <div class="layui-form-item">
               <div class="layui-inline layui-col-md12" >
                   <label class="layui-form-label form-lable">是否默认</label>
                    <div class="layui-input-inline input-inline">
                            <input class="layui-input form-input input-checkbox" name="isDefault" id="isDefault" 
                                data-th-initvalue="${entity?.isDefault}" 
                                data-th-data-result="${YES_OR_NO}">
                    </div>
                </div>
            </div>
            
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <label class="layui-form-label form-lable">方案描述</label>
                    <div class="layui-input-inline input-inline">
                        <textarea name="remark"
                            id="remark" placeholder="请输入内容"
                            class="layui-textarea"
                            data-th-text="${entity?.remark}">
                       </textarea>
                    </div>
                </div>
            </div>
      
            <div class="layui-row" style="margin: 50px;">
                <div class="text-center">
                    <button type="button" class="layui-btn btn-save"
                        id="ShadowPriceScheme002_btn_save">保存</button>
                    <button type="button" class="layui-btn btn-submit"
                        id="ShadowPriceScheme002_btn_submit">提交</button>
                    <a type="button" class="layui-btn btn-cancel"
                        id="ShadowPriceScheme002_btn_cancel">取消</a>
                </div>
            </div>
        </form>
    </div>
    <div layout:fragment="script">
        <script
            data-th-src="@{/js/valuation/valuationparametermanage/shadowpricescheme/ShadowPriceScheme002.js}"
            type="text/javascript">
        </script>
    </div>
</body>
</html>
