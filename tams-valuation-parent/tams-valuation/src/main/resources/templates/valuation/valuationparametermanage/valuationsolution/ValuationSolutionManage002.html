<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{ValuationSolutionManage002}">估值方案管理</title>
<link rel="stylesheet" type="text/css" data-th-href="@{/css/font/iconfont.css}">
</head>

<body>
<div layout:fragment="content">
  <form class="layui-form joyin-form-wrap" id="searchForm">
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">方案代码</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input" placeholder="请选择" id="schemeId" name="schemeId" data-th-value="${entity?.schemeId}" disabled>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">方案名称</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input" placeholder="请选择" id="schemeName" name="schemeName" data-th-value="${entity?.schemeName}" disabled>
        </div>
      </div>
    </div>
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md12">
        <label class="layui-form-label form-lable2">方案描述</label>
        <div class="layui-input-inline input-inline">
            <textarea rows="3" style="width:100%" disabled data-th-text="${entity?.schemeDescription}"></textarea>
        </div>
      </div>
    </div>
  </form>
  <table class="layui-table" id="dataTable"></table>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/valuationparametermanage/valuationsolution/ValuationSolutionManage002.js}" type="text/javascript"></script>
</div>
</body>
</html>
