<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title>对账方案新建</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <label class="layui-form-label form-lable">方案名称</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="schemeName" name="schemeName" maxlength="50" class="layui-input form-input" >
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <label class="layui-form-label form-lable">所属账套</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="booksetId" name="booksetId"
                            class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                            data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-data-url="@{getBooksetId}"
                            data-idfield="code" data-keyfield="code"
                            data-th-data-effectivefieldsalias='|{"code":"#{ValSubjectSet001.booksetId}","shortName":"#{ValSubjectSet001.booksetName}"}|'
                            data-th-value="${entity?.booksetId}"
                            >
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <label class="layui-form-label form-lable">方案类型</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="schemeType" name="schemeType" placeholder="请选择" class="layui-input form-input input-select"
                            data-th-data-result="${SCHEME_TYPE}" >
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <label class="layui-form-label form-lable">是否默认方案</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="isDefault" name="isDefault" placeholder="请选择" class="layui-input form-input input-select" data-th-data-result="${YES_OR_NO}" >
                    </div>
                </div>    
            </div>
        </form>
        <div class="layui-col-md11" style="margin:10px 0 10px 0;">
            <div class="text-center">
    <!--             <a id="ValAssetBook003_btn_save" class="layui-btn layui-btn-sm btn-save">保存</a> -->
                <a id="ValReconcileSchemeInfo002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
                <a id="ValReconcileSchemeInfo002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/valuationparametermanage/reconcilescheme/ValReconcileSchemeInfo002.js}" type="text/javascript"></script>
    </div>
</body>

</html>
