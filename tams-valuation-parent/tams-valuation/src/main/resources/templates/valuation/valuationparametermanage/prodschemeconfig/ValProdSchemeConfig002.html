<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>产品对账方案配置</title>
<script th:inline="javascript">
     var SCHEMENAME = [[${SCHEME_NAME}]];
     
 	var workflowId = [[${workflowId}]];

</script>
</head>

<body>

<div layout:fragment="content">
	<div class="joyin-form-wrap">
	    <form class="layui-form" id="searchForm">
	    	<input id="schemeType" name="schemeType" data-th-value="${schemeType}" style="display: none">
	    	<input id="booksetIds" name="booksetIds" data-th-value="${booksetIds}" style="display: none">
	        <div class="layui-form-item">
	        	<div class="layui-inline layui-col-md6">
		            <label class="layui-form-label form-lable" style="width:80px;padding-bottom: 8px;">对账方案</label>
		            <div class="layui-input-inline input-inline">
		            	<input id="schId" name="schId" class="layui-input form-input input-select" placeholder="请选择" data-th-data-result="${SCHEME_NAME}" allowClear="true">
		            </div>
	            </div>
	        </div>
	    </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
    <div class="layui-col-md11" style="margin: 50px;">
		<div class="text-center">
			<!--                 <a id="ValProdSchemeConfig002_btn_save" class="layui-btn layui-btn-sm btn-save" 
                      data-th-text="#{SysCommon.save}">保存</a>  -->
            <a id="ValProdSchemeConfig002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                   data-th-text="#{SysCommon.submit}">提交</a>
			<a id="ValProdSchemeConfig002_btn_cancel"
				class="layui-btn layui-btn-sm btn-cancel"
				data-th-text="#{SysCommon.cancel}">取消</a>
		</div>
	</div>
</div>
</body>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/valuationparametermanage/prodschemeconfig/ValProdSchemeConfig002.js}" type="text/javascript"></script>
</div>

</html>
