<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>待摊设置</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form " id="dataForm">
        <div class="layui-form-item" style="display: none;">
            <input id="operateType" name="operateType" class="layui-input form-input" placeholder="操作类型"
                   data-th-value="${entity?.operateType}"/>
            <input type="text" id="workflowId" name="workflowId" placeholder="流程 Id"
                   class="layui-input form-input" data-th-value="${entity?.workflowId}"/>
        </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6"id="c_booksetId1">
                    <label class="layui-form-label form-lable">账套代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="booksetId" name="booksetId"class="layui-input form-input input-select"  
                               placeholder="请输入内容" data-th-required="true"data-th-initvalue="${entity?.booksetId}" allowClear="true"
                               data-th-data-url="@{/valuation/valuationparametermanage/withholdingamortize/ValWithholdingAmortizeSet001/getBooksetId}" >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md6"id="c_booksetId2"style="display: none">
                    <label class="layui-form-label form-lable">账套代码</label>
                    <div class="layui-input-inline input-inline">
                        <input  id="booksetId" name="booksetId"class="layui-input form-input"
                               allowClear="true"placeholder="请选择" disabled="disabled"
                               data-th-value="${entity?.booksetId}" >
                    </div>
                </div>
                <div class="layui-inline layui-col-md6"id="c_finprodId1">
                    <label class="layui-form-label form-lable">业务编号</label>
                    <div class="layui-input-inline input-inline">
                        <select id="finprodId" name="finprodId"class="layui-input form-input input-select"  
                               placeholder="请输入内容" data-th-required="true" data-th-initValue="${entity?.finprodId}" allowClear="true"parentIds="booksetId" 
                               data-th-data-url="@{/valuation/valuationparametermanage/withholdingamortize/ValWithholdingAmortizeSet002/getFinprodId}" >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md6"id="c_finprodId2"style="display: none">
                    <label class="layui-form-label form-lable">业务编号</label>
                    <div class="layui-input-inline input-inline">
                        <input id="finprodId" name="finprodId"class="layui-input form-input"
                               allowClear="true"placeholder="请选择" disabled="disabled"
                               data-th-value="${entity?.finprodId}" >
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6" >
                    <label class="layui-form-label form-lable">费用类型</label>
                    <div class="layui-input-inline input-inline">
                        <select id="feeType" name="feeType" class="layui-input form-input input-select"
                            allowClear="true" placeholder="请输入" data-th-data-result="${FEE_TYPE}"disabled="disabled"
                            data-th-initvalue="${entity?.feeType}" data-th-required="true">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md6" >
                    <label class="layui-form-label form-lable">金额</label>
                    <div class="layui-input-inline input-inline">
                        <input id="prin" name="prin" class="layui-input form-input text-number" placeholder="请输入" 
                            data-th-value="${entity?.prin}" data-th-required="true">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">开始日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="vdate" name="vdate"
                               placeholder="请选择"data-th-required="true"
                               class="layui-input form-input input-dateSelect"
                               allowClear="true"data-th-value="${entity?.vdate}" >
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">结束日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="mdate" name="mdate"
                               placeholder="请选择"data-th-required="true"
                               class="layui-input form-input input-dateSelect"
                               allowClear="true"data-th-value="${entity?.mdate}" >
                    </div>
                </div>
            </div>
        <div class="layui-row" style="margin: 50px;">
            <div class="text-center">
<!--                 <button type="button" class="layui-btn btn-save" id="ValWithholdingAmortizeSet002_btn_save">保存</button> -->
                <button type="button" class="layui-btn btn-submit" id="ValWithholdingAmortizeSet002_btn_submit">提交</button>
                <a type="button" class="layui-btn btn-cancel" id="ValWithholdingAmortizeSet002_btn_cancel">取消</a>
            </div>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/valuationparametermanage/withholdingamortize/ValWithholdingAmortizeSet002.js}"
            type="text/javascript"></script>
</div>
</body>
</html>
