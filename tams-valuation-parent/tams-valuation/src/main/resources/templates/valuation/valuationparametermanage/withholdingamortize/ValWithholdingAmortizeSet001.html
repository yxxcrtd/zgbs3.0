<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>待摊设置</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a id="ValWithholdingAmortizeSet001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
        <a id="ValWithholdingAmortizeSet001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}">删除</a>
        <a id="ValWithholdingAmortizeSet001_btn_modify" class="layui-btn layui-btn-sm btn-modify" data-th-text="#{SysCommon.modify}">修改</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">账套代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="booksetId" name="booksetId"
                               class="layui-input form-input input-select"  placeholder="请输入内容" 
                               data-th-data-url="@{/valuation/valuationparametermanage/withholdingamortize/ValWithholdingAmortizeSet001/getBooksetId}"  allowClear="true">
                     	</select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">费用类型</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="feeType" name="feeType"
                               placeholder="请选择" multiple="multiple"
                               class="layui-input form-input input-select"allowClear="true"
                               data-th-data-result="${FEE_TYPE}">
                        </select>       
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">开始日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="vdate" name="vdate"
                               placeholder="请选择"
                               class="layui-input form-input input-dateSelect"
                               allowClear="true">
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">结束日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="mdate" name="mdate"
                               placeholder="请选择"
                               class="layui-input form-input input-dateSelect"
                               allowClear="true">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <table class="layui-table" id="dataTable"></table>
</div>
</body>
<div layout:fragment="script">
    <script
            data-th-src="@{/js/valuation/valuationparametermanage/withholdingamortize/ValWithholdingAmortizeSet001.js}"
            type="text/javascript"></script>
</div>
</html>
