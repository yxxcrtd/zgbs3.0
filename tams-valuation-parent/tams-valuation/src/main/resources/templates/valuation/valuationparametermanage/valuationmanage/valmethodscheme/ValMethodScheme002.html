<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{ValMethodScheme002}">新建估值方法方案</title>
</head>

<body>
<div layout:fragment="content">
  <form id="submitForm">
    <div class="layui-form" style=" margin-top:10px;">
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>方案代码</label>
        <div class="layui-input-block input-inline">
          <input type="text" name="code" class="layui-input form-input" value="" placeholder="请输入">
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>方案名称</label>
        <div class="layui-input-block input-inline">
          <input type="text" name="scheme" class="layui-input form-input" value="" placeholder="请输入">
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">&nbsp;</i>方案描述</label>
        <div class="layui-input-block  input-inline">
          <textarea name="depict" class="layui-textarea" placeholder="请输入内容"></textarea>
        </div>
      </div>
    </div>
  </form>
  <div class="layui-col-md11" style="margin:10px 0 15px 0;">
   	<div class="text-center">
<!--         <a id="ValCoverSwitch002_btn_save" class="layui-btn layui-btn-sm btn-save">保存</a> -->
        <a id="ValCoverSwitch002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
        <a id="ValCoverSwitch002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
    </div>
   </div>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script>
</div>
</body>
</html>
