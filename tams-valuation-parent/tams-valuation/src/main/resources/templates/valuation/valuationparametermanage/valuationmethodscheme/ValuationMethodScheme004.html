<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
</head>
<body>
    <div layout:fragment="content">
        <div class="layui-row"
            style="padding: 5px 20px 10px; margin: 0px -15px; line-height: 32px; background-color: #eeeeee">
            <!-- <button type="button" class="layui-btn btn-default layui-btn-sm btn-create" id="ValuationMethodScheme004_btn_add" disabled="disabled">新建</button>
                <button type="button" class="layui-btn btn-default layui-btn-sm layui-icon layui-icon-edit" id="ValuationMethodScheme004_btn_edit" >修改</button>
                <button type="button" class="layui-btn btn-default layui-btn-sm iconfont icon-copy" id="ValuationMethodScheme004_btn_copy" >复制</button>
                <button type="button" class="layui-btn btn-default layui-btn-sm btn-delete" id="ValuationMethodScheme004_btn_delete" >删除</button>
                <button type="button" class="layui-btn btn-default layui-btn-sm btn-reset" id="ValuationMethodScheme004_btn_reset" >重置</button> -->
            <button type="button" class="layui-btn btn-default layui-btn-sm btn-save"
                id="ValuationMethodScheme004_btn_save">保存</button>
            <button type="button" class="layui-btn btn-default layui-btn-sm btn-submit"
                id="ValuationMethodScheme004_btn_submit">提交</button>
            <!-- <button type="button" class="layui-btn btn-default layui-btn-sm btn-submit" id="ValuationMethodScheme004_btn_submit">上1条</button>
                <button type="button" class="layui-btn btn-default layui-btn-sm btn-submit" id="ValuationMethodScheme004_btn_submit">下1条</button>
                <button type="button" class="layui-btn btn-default layui-btn-sm btn-submit" id="ValuationMethodScheme004_btn_submit">帮助</button> -->
        </div>
        <form class="layui-form " id="dataForm">
            <div class="layui-form-item" style="display: none;">
                <input id="schemeDetailId" name="schemeDetailId" class="layui-input form-input" placeholder="请输入"
                    data-th-value="${entity?.schemeDetailId}"> 
                <input id="schemeId" name="schemeId"
                    class="layui-input form-input" placeholder="请输入" data-th-value="${entity?.schemeId}"> 
                <input id="operateType" name="operateType" class="layui-input form-input" placeholder="请输入"
                    data-th-value="${entity?.operateType}">
                <input type="text" id="workflowId" name="workflowId"  placeholder="流程 Id"
                            class="layui-input form-input" data-th-value="${entity?.workflowId}" >
                <input type="text" id="finprodType" name="finprodType"  placeholder="金融产品类型（估值核算）"
                       class="layui-input form-input" data-th-value="${entity?.finprodType}" >
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable-wrap">资产代码</label>
                    <div class="layui-input-inline input-inline">
                        <select id="finprodId" name="finprodId" formatResult="{id:id}"
                            class="layui-input form-input input-select" data-th-data-url='@{/valuation/valuationparametermanage/valuationmethodscheme/ValuationMethodScheme004/findFinprod}' allowClear="true"
                            data-th-placeholder="#{SysCommon.placeholder}" data-th-initvalue="${entity?.finprodId}" formatoption = "false"data-th-required="true">
                            <option></option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable-wrap">资产名称</label>
                    <div class="layui-input-inline input-inline">
                        <input id="finprodName" name="finprodName" class="layui-input form-input" placeholder="请输入"
                            data-th-value="${entity?.finprodName}" disabled="disabled"data-th-required="true">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6" id="div_tradeMarket">
                    <label class="layui-form-label form-lable-wrap">交易场所</label>
                    <div class="layui-input-inline input-inline">
                        <input id="tradeMarket" name="tradeMarket" class="layui-input form-input  input-select"
                            placeholder="请输入" data-th-data-result="${VALUATION_TRADE_MARKET}"
                            data-th-value="${entity?.tradeMarket}" 
                            disabled="disabled"data-th-required="true">
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable-wrap">投资目的</label>
                    <div class="layui-input-inline input-inline">
                       <!-- <select id="invAim" name="invAim" class="layui-input form-input input-select" placeholder="请输入"
                            allowClear="true" formatoption = "false"
                            data-th-data-result="${INV_AIM}"data-th-required="true"
                            data-th-initvalue="${entity?.invAim}" childrenIds="valuationMethod">
                            <option></option>
                        </select>-->
                            <select id="invAim" name="invAim" class="layui-input form-input input-select" placeholder="请输入"
                                    allowClear="true" data-th-data-result="${INV_AIM}" data-th-initvalue="${entity?.invAim}"
                                    data-th-required="true" parentIds="finprodId" formatoption = "true"
                                    data-th-data-url="@{/valuation/valuationparametermanage/valuationmethodscheme/ValuationMethodScheme004/getInvAim}">
                                <option></option>
                            </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6" id="c_valuationMethod">
                    <label class="layui-form-label form-lable-wrap">估值方法</label>
                    <div class="layui-input-inline input-inline">
                        <select id="valuationMethod" name="valuationMethod" class="layui-input form-input input-select"
                            allowClear="true" placeholder="请输入" data-th-data-result="${VALUATION_METHOD}"
                            data-th-initvalue="${entity?.valuationMethod}" parentIds="invAim,finprodType,finprodId"data-th-required="true"
                            data-th-data-url="@{/valuation/valuationparametermanage/valuationmethodscheme/ValuationMethodScheme004/getValuationMethod}">
                            <option></option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6" id="c_valuationPrice">
                    <label id="priceSourceId" class="layui-form-label form-lable-wrap" style="display: inline">市价来源</label>
                    <div class="layui-input-inline input-inline">
                        <select id="valuationPrice" name="valuationPrice" class="layui-input form-input input-select"
                            allowClear="true" placeholder="请输入" data-th-data-result="${VALUATION_PRICE}"
                            data-th-initvalue="${entity?.valuationPrice}" data-th-required="true"parentIds="tradeMarket,finprodType,finprodId,invAim,valuationMethod"
                            data-th-data-url="@{/valuation/valuationparametermanage/valuationmethodscheme/ValuationMethodScheme004/getValuationPrice}">
                            <option></option>
                        </select>
                    </div>
                </div>
                <!--<div class="layui-inline layui-col-md6" id="c_valuationPrice2">
                    <label class="layui-form-label form-lable-wrap">估值第二市价</label>
                    <div class="layui-input-inline input-inline">
                        <select id="valuationPrice2" name="valuationPrice2" class="layui-input form-input input-select"
                            allowClear="true" placeholder="请输入" data-th-data-result="${VALUATION_PRICE}"
                            data-th-initvalue="${entity?.valuationPrice2}" parentIds="tradeMarket,finprodType"
                            data-th-data-url="@{/valuation/valuationparametermanage/valuationmethodscheme/ValuationMethodScheme004/getValuationPrice}">
                            <option></option>
                        </select>
                    </div>
                </div>-->
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6" id="c_priceClass">
                    <label class="layui-form-label form-lable-wrap">价格类型</label>
                    <div class="layui-input-inline input-inline">
                        <select id="priceClass" name="priceClass" class="layui-input form-input input-select"
                                allowClear="true" placeholder="请输入" data-th-data-result="${PRICE_CLASS}"data-th-required="true"
                                data-th-initvalue="${entity?.priceClass}">
                            <option></option>
                        </select>
                    </div>
                </div>
               <div class="layui-inline layui-col-md6" id="c_valuationDate">
                    <label class="layui-form-label form-lable-wrap">行情日期</label>
                    <div class="layui-input-inline input-inline">
                        <select id="valuationDate" name="valuationDate" class="layui-input form-input input-select"
                            allowClear="true" placeholder="请输入" data-th-data-result="${VALUATION_DATE}" data-th-required="true"
                            data-th-initvalue="${entity?.valuationDate}">
                            <option></option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6" id="c_quotaDigit">
                    <label class="layui-form-label form-lable-wrap">行情位数</label>
                    <div class="layui-input-inline input-inline">
                        <input id="quotaDigit" name="quotaDigit" class="layui-input form-input  text-number" placeholder="请输入" data-textrange ="0"
                            data-th-value="${entity?.quotaDigit}"data-th-required="true">
                    </div>
                </div>
                <div class="layui-inline layui-col-md6" id="c_priceTailMode">
                    <label class="layui-form-label form-lable-wrap">行情尾数处理</label>
                    <div class="layui-input-inline input-inline">
                        <select id="priceTailMode" name="priceTailMode" class="layui-input form-input input-select"
                                allowClear="true" placeholder="请输入" data-th-data-result="${VALUATION_ROUND_RULE}"data-th-required="true"
                                data-th-initvalue="${entity?.priceTailMode}">
                            <option></option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable-wrap">开始日</label>
                    <div class="layui-input-inline input-inline">
                        <input id="vdate" name="vdate" class="layui-input form-input input-dateSelect" placeholder="请输入"
                            data-th-value="${entity?.vdate}"data-th-required="true">
                    </div>
                </div>
                <div class="layui-inline layui-col-md6" id="div_mdate">
                    <label class="layui-form-label form-lable-wrap">结束日</label>
                    <div class="layui-input-inline input-inline">
                        <input id="mdate" name="mdate" class="layui-input form-input input-dateSelect" placeholder="请输入"
                            data-th-value="${entity?.mdate}">
                    </div>
                </div>
            </div>
            <!-- <div class="layui-row" style="margin: 50px;">
                <div class="text-center">
                    <button type="button" class="layui-btn btn-save"
                        id="ValuationMethodScheme004_btn_save">保存</button>
                    <button type="button" class="layui-btn btn-submit"
                        id="ValuationMethodScheme004_btn_submit">提交</button>
                    <button type="button" class="layui-btn btn-cancel"
                        id="ValuationMethodScheme004_btn_cancel">取消</button>
                </div>
            </div> -->
        </form>
    </div>
    <div layout:fragment="script">
        <script
            data-th-src="@{/js/valuation/valuationparametermanage/valuationmethodscheme/ValuationMethodScheme004.js}"
            type="text/javascript">
									
								</script>
    </div>
</body>
</html>
