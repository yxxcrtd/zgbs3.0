<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title>估值方法方案</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="layui-col-md3" style="width: 22%">
            <div class="joyin-form-wrap">
                <form class="layui-form" id="schemeForm">
                    <div class="layui-form-item">
                        <input type="text" id="searchKey" name="searchKey"
                            class="layui-input form-input input-fuzzy-text" placeholder="请输入估值方案关键词">
                    </div>
                </form>
            </div>
            <div class="layui-collapse">
                <div class="layui-colla-item" style="padding: 0">
                    <div class="layui-row layui-colla-title" style="margin: 0; line-height: 32px;">
                        <div class="layui-col-md6">
                            <span>方案</span>
                        </div>
                        <div class="layui-col-md3 layui-col-md-offset3">
                            <button type="button" class="layui-btn btn-default layui-btn-sm btn-create"
                                id="ValuationMethodScheme001_btn_add_scheme" style="margin-top: 5px;">新建</button>
                        </div>
                    </div>
                    <div class="layui-colla-content layui-show" style="padding: 0">
                        <table class="layui-table" id="schemeTable"></table>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-col-md9" style="width: 78%">
            <div class="layui-tab layui-tab-card" lay-filter="tabContainer">
                <ul class="layui-tab-title">
                    <li id="typeAssets-title" class="layui-this">一般资产估值配置</li>
                    <li id="specialAssets-title">特殊资产估值配置</li>
                </ul>
                <div class="layui-tab-content" style="padding: 0">
                    <div class="layui-tab-item layui-show">
                        <div class="layui-col-md12" style="margin: 10px 10px">
                            <button type="button" class="layui-btn layui-btn-sm btn-create"
                                id="ValuationMethodScheme003_btn_add">新建</button>
                            <button type="button" class="layui-btn layui-btn-sm btn-delete"
                                id="ValuationMethodScheme003_btn_delete">删除</button>
                            <button type="button" class="layui-btn layui-btn-sm btn-export"
                                id="ValuationMethodScheme003_btn_export">导出</button>
                            <button type="button" class="layui-btn layui-btn-sm btn-filter"
                                id="ValuationMethodScheme003_btn_filter">筛选</button>
                        </div>
                        <div class="layui-col-md12" id="c_typeAsstesForm" style="background-color: #f5f5f5;">
                            <form class="layui-form layui-col-md11" id="typeAsstesForm">
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable-wrap">证券品种</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="typeAsstes_secType" name="secType"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" multiple="multiple"
                                                data-th-data-result="${SEC_TYPE}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable-wrap">交易场所</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="typeAsstes_tradeMarket" name="tradeMarket"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" multiple="multiple"
                                                data-th-data-result="${VALUATION_TRADE_MARKET}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable-wrap">证券细分类</label>
                                        <div class="layui-input-inline input-inline">
                                            <!--<select id="typeAsstes_secDetailType" name="secDetailType"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" multiple="multiple"
                                                data-th-data-result="${BOND_TYPE}">
                                            </select>-->
                                            <select id="typeAsstes_secDetailType" name="secDetailType" class="layui-input form-input input-select"
                                                    allowClear="true" placeholder="请输入"  multiple="multiple"
                                                     parentIds="typeAsstes_secType"
                                                    data-th-data-url="@{/valuation/valuationparametermanage/valuationmethodscheme/ValuationMethodScheme001/getSecDetailTypeBySecTypeList}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable-wrap">投资目的</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="typeAsstes_invAim" name="invAim"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" multiple="multiple" formatoption = "false"
                                                data-th-data-result="${INV_AIM}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </form>
                            <div class="layui-col-md1">
                                <div class="layui-form-item">
                                    <button type="button" class="layui-btn layui-btn-sm btn-search"
                                        id="ValuationMethodScheme003_btn_search">查询</button>
                                </div>
                                <div class="layui-form-item">
                                    <button type="button" class="layui-btn layui-btn-sm btn-default btn-reset"
                                        id="ValuationMethodScheme003_btn_reset">重置</button>
                                </div>
                            </div>
                        </div>
                        <table class="layui-table" id="typeAssets-table"></table>
                    </div>
                    <div class="layui-tab-item">
                        <div class="layui-col-md12" style="margin: 10px 10px">
                            <button type="button" class="layui-btn layui-btn-sm btn-create"
                                id="ValuationMethodScheme004_btn_add">新建</button>
                            <button type="button" class="layui-btn layui-btn-sm btn-delete"
                                id="ValuationMethodScheme004_btn_delete">删除</button>
                            <button type="button" class="layui-btn layui-btn-sm btn-export"
                                id="ValuationMethodScheme004_btn_export">导出</button>
                            <button type="button" class="layui-btn layui-btn-sm btn-filter"
                                id="ValuationMethodScheme004_btn_filter">筛选</button>
                        </div>
                        <div class="layui-col-md12" id="c_specialAsstesForm" style="background-color: #f5f5f5;">
                            <form class="layui-form layui-col-md11" id="specialAsstesForm">
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable-wrap">资产代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <!-- <input id="finprod" name="finprod"
                                                class="layui-input form-input" placeholder="请选择产品或输入关键词"> -->
                                            <select id="specialAsstes_finprodId" name="finprodId" formatResult="{id:id}"
                                                class="layui-input form-input input-select" data-th-data-url='@{/valuation/valuationparametermanage/valuationmethodscheme/ValuationMethodScheme004/findFinprod}'
                                                allowClear="true" placeholder="请输入内容" multiple="multiple" formatoption = "false">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable-wrap">交易场所</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="specialAsstes_tradeMarket" name="tradeMarket"
                                                class="layui-input form-input  input-select" placeholder="请输入内容"
                                                data-th-data-result="${VALUATION_TRADE_MARKET}" multiple="multiple">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable-wrap">投资目的</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="specialAsstes_invAim" name="invAim"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请输入内容" multiple="multiple" formatoption = "false"
                                                data-th-data-result="${INV_AIM}">
                                            </select>
                                        </div>
                                    </div>
<!--                                     <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable-wrap">投资目的</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="specialAsstes_invAim" name="invAim"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                multiple="multiple" formatoption = "false"
                                                allowClear="true">
                                                <option value='FVOCI'>公允价值变动计入其他综合收益</option>
                                                <option value='FVTPL'>公允价值变动计入当期损益</option>
                                            </select>
                                        </div>
                                    </div> -->
                                </div>
                            </form>
                            <div class="layui-col-md1">
                                <div class="layui-form-item">
                                    <button type="button" class="layui-btn layui-btn-sm btn-search"
                                        id="ValuationMethodScheme004_btn_search">查询</button>
                                </div>
                                <div class="layui-form-item">
                                    <button type="button" class="layui-btn layui-btn-sm btn-default btn-reset"
                                        id="ValuationMethodScheme004_btn_reset">重置</button>
                                </div>
                            </div>
                        </div>
                        <table class="layui-table" id="specialAssets-table"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script
            data-th-src="@{/js/valuation/valuationparametermanage/valuationmethodscheme/ValuationMethodScheme001.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
