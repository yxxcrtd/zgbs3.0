<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorator="~{layout/default}">
<head>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form " id="dataForm">
            <div class="layui-form-item" style="display: none;">
                <input id="schemeDetailId" name="schemeDetailId" class="layui-input form-input" placeholder="请输入"
                    data-th-value="${entity?.schemeDetailId}"> 
                <input id="operateType" name="operateType"
                    class="layui-input form-input" placeholder="请输入" data-th-value="${entity?.operateType}">
                <input type="text" id="workflowId" name="workflowId"  placeholder="流程 Id"
                            class="layui-input form-input" data-th-value="${entity?.workflowId}" >
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable-wrap">估值方案</label>
                    <div class="layui-input-inline input-inline">
                        <select id="schemeId" name="schemeId" formatResult="{id:id}" data-th-required="true"
                            class="layui-input form-input input-select" data-th-data-url='@{/valuation/valuationparametermanage/valuationmethodscheme/ValuationMethodScheme003/findScheme}' allowClear="true"
                            data-th-placeholder="#{SysCommon.placeholder}" data-th-initvalue="${entity?.schemeId}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable-wrap">证券品种</label>
                    <div class="layui-input-inline input-inline">
                        <select id="secType" name="secType" class="layui-input form-input input-select"
                            allowClear="true" placeholder="请输入" data-th-data-result="${SEC_TYPE}" data-th-required="true"
                            data-th-initvalue="${entity?.secType}" >
                            <option></option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6" id="c_tradeMarket">
                    <label class="layui-form-label form-lable-wrap">交易场所</label>
                    <div class="layui-input-inline input-inline">
                        <select id="tradeMarket" name="tradeMarket" class="layui-input form-input  input-select"
                            allowClear="true" placeholder="请输入" data-th-data-result="${VALUATION_TRADE_MARKET}"
                            data-th-initvalue="${entity?.tradeMarket}" parentIds="secType"
                            data-th-data-url="@{/valuation/valuationparametermanage/valuationmethodscheme/ValuationMethodScheme003/getTradeMarket}" >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md6" id="c_secDetailType" style="display:inline;">
                    <label class="layui-form-label form-lable-wrap">证券细分类</label>
                    <div class="layui-input-inline input-inline">
                        <select id="secDetailType" name="secDetailType" class="layui-input form-input input-select"
                            allowClear="true" placeholder="请输入" data-th-data-result="${BOND_TYPE}"
                            data-th-initvalue="${entity?.secDetailType}" parentIds="tradeMarket"
                            data-th-data-url="@{/valuation/valuationparametermanage/valuationmethodscheme/ValuationMethodScheme003/getSecDetailType}">
<!--                             <option></option>	multiple="multiple" -->
                        </select>
                    </div>
                </div>

                <div class="layui-inline layui-col-md6" id="c_secDetailTypePlan" style="display:none;">
                    <label class="layui-form-label form-lable-wrap">证券细分类</label>
                    <div class="layui-input-inline input-inline">
                        <select id="secDetailType" name="secDetailType" class="layui-input form-input input-select"
                                allowClear="true" placeholder="请输入" data-th-data-result="${PLANNED_TYPE}"
                                data-th-initvalue="${entity?.secDetailType}" parentIds="secType"
                                data-th-data-url="@{/valuation/valuationparametermanage/valuationmethodscheme/ValuationMethodScheme003/getSecDetailTypeBySecType}">
                            <!--                             <option></option>	multiple="multiple" -->
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6" id="c_invAim" >
                    <label class="layui-form-label form-lable-wrap">投资目的</label>
                    <div class="layui-input-inline input-inline">
                        <select id="invAim" name="invAim" class="layui-input form-input input-select" placeholder="请输入"
                            allowClear="true" data-th-data-result="${INV_AIM}" data-th-initvalue="${entity?.invAim}"
                            data-th-required="true" parentIds="secType" formatoption = "true" 
                            data-th-data-url="@{/valuation/valuationparametermanage/valuationmethodscheme/ValuationMethodScheme003/getInvAim}">
                           <option></option>
                        </select>
                    </div>
                </div>
               <div class="layui-inline layui-col-md6" id="c_valuationMethod">
                    <label class="layui-form-label form-lable-wrap">估值方法</label>
                    <div class="layui-input-inline input-inline">
                        <select id="valuationMethod" name="valuationMethod" class="layui-input form-input input-select"
                            allowClear="true" placeholder="请输入" data-th-data-result="${VALUATION_METHOD}"
                            data-th-initvalue="${entity?.valuationMethod}" parentIds="invAim,secType" data-th-required="true" formatoption = "true" 
                            data-th-data-url="@{/valuation/valuationparametermanage/valuationmethodscheme/ValuationMethodScheme003/getValuationMethod}">
                            <option></option>
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md6" id="c_valuationId" style="display: none">
                    <label class="layui-form-label form-lable-wrap">估值模型</label>
                    <div class="layui-input-inline input-inline">
                        <div class="layui-input-inline input-inline">
                            <select id="valuationId" name="valuationId" class="layui-input form-input input-select"
                                    allowClear="true" placeholder="请输入" data-th-data-result="${VALMODEL_ID}"data-th-required="true"
                                    data-th-initvalue="${entity?.valuationId}"parentIds="secType">
                                <option></option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6" id="c_valuationPrice">
                    <label id="priceSourceId" class="layui-form-label form-lable-wrap" style="display: inline">市价来源</label>
                    <div class="layui-input-inline input-inline">
                        <select id="valuationPrice" name="valuationPrice" class="layui-input form-input input-select"
                            allowClear="true" placeholder="请输入" data-th-data-result="${VALUATION_PRICE}"
                            data-th-initvalue="${entity?.valuationPrice}" parentIds="tradeMarket,secType,invAim,valuationMethod" data-th-required="true"
                            data-th-data-url="@{/valuation/valuationparametermanage/valuationmethodscheme/ValuationMethodScheme003/getValuationPrice}">
                            <option></option>
                        </select>
                    </div>
                </div>

            </div>
            <div class="layui-form-item">

                <div class="layui-inline layui-col-md6" id="c_priceClass"style="display: none">
                    <label class="layui-form-label form-lable-wrap">价格类型</label>
                    <div class="layui-input-inline input-inline">
                        <select id="priceClass" name="priceClass" class="layui-input form-input input-select"
                                allowClear="true" placeholder="请输入" data-th-data-result="${PRICE_CLASS}"data-th-required="true"
                                data-th-initvalue="${entity?.priceClass}"parentIds="secType">
                            <option></option>
                        </select>
                    </div>
                </div>

            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6" id="c_quotaDigit">
                    <label class="layui-form-label form-lable-wrap">行情位数</label>
                    <div class="layui-input-inline input-inline">
                        <input id="quotaDigit" name="quotaDigit" class="layui-input form-input text-number" placeholder="请输入" data-textrange ="0"
                            data-th-value="${entity?.quotaDigit}" parentIds="secType"data-th-required="true">
                    </div>
                </div>
                <div class="layui-inline layui-col-md6" id="c_priceTailMode">
                    <label class="layui-form-label form-lable-wrap">行情尾数处理</label>
                    <div class="layui-input-inline input-inline">
                        <select id="priceTailMode" name="priceTailMode" class="layui-input form-input input-select"
                                allowClear="true" placeholder="请输入" data-th-data-result="${VALUATION_ROUND_RULE}"data-th-required="true"
                                data-th-initvalue="${entity?.priceTailMode}"parentIds="secType">
                            <option></option>
                        </select>
                    </div>
                </div>

            </div>
            <div class="layui-form-item">
               <div class="layui-inline layui-col-md6" id="c_valuationDate">
                    <label class="layui-form-label form-lable-wrap">行情日期</label>
                    <div class="layui-input-inline input-inline">
                        <select id="valuationDate" name="valuationDate" class="layui-input form-input input-select"
                            allowClear="true" placeholder="请输入" data-th-data-result="${VALUATION_DATE}" data-th-required="true"
                            parentIds="secType"data-th-initvalue="${entity?.valuationDate}">
                            <option></option>
                        </select>
                    </div>
                </div>

                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable-wrap">开始日</label>
                    <div class="layui-input-inline input-inline">
                        <input id="vdate" name="vdate" class="layui-input form-input input-dateSelect" placeholder="请输入" data-th-required="true"
                            data-th-value="${entity?.vdate}">
                    </div>
                </div>


            </div>
             <div class="layui-row" style="margin: 50px;">
                <div class="text-center">
                    <button type="button" class="layui-btn btn-save" id="ValuationMethodScheme003_btn_save">保存</button>
                    <button type="button" class="layui-btn btn-submit" id="ValuationMethodScheme003_btn_submit">提交</button>
                    <a type="button" class="layui-btn btn-cancel"  id="ValuationMethodScheme003_btn_cancel">取消</a>
                </div>
            </div>
        </form>
    </div>
    <div layout:fragment="script">
        <script
            data-th-src="@{/js/valuation/valuationparametermanage/valuationmethodscheme/ValuationMethodScheme003.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
