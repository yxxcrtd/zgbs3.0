<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>产品对账方案配置</title>
</head>

<body>

<div layout:fragment="content">
	<div class="form-button-area">
		<a class="layui-btn layui-btn-sm " id="ValProdSchemeConfig001_btn_config"><i class="iconfont icon-execute"></i><span>&nbsp;&nbsp;配置</span></a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
            	<div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">账套代码</label>
                    <div class="layui-input-inline input-inline">
                      	<!-- <input type="text" id="booksetId" name="booksetId" class="layui-input form-input" value="" placeholder="请输入"> -->
                        <select  type="text" id="booksetId" name="booksetId" class="layui-input form-input input-select" 
                              data-th-data-url="@{/valuation/valuationparametermanage/prodschemeconfig/ValProdSchemeConfig001/getBooksetId2}" 
                              multiple="multiple" allowClear="true" placeholder="请输入内容">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">账套简称</label>
                    <div class="layui-input-inline input-inline" style="display: block;">
                      	<input type="text" id="booksetName" name="booksetName" class="layui-input form-input" value="" placeholder="请输入">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">收益类型</label>
                    <div class="layui-input-inline input-inline">
                      	<input id="acctMode" name="acctMode" class="layui-input form-input input-select" placeholder="请选择" data-th-data-result="${PROFIT_TYPE}" allowClear="true">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">方案类型</label>
                    <div class="layui-input-inline input-inline">
                      <input type="text" id="schemeType" name="schemeType" class="layui-input form-input input-select" data-th-data-result="${SCHEME_TYPE}" placeholder="请选择" allowClear="true">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">方案名称</label>
                    <div class="layui-input-inline input-inline">
                    	<input id="schId" name="schId" class="layui-input form-input input-select" placeholder="请选择" data-th-data-result="${SCHEME_NAME}" allowClear="true">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">模板账套</label>
                    <div class="layui-input-inline input-inline">
                      <input type="text" id="booksetIdTmpl" name="booksetIdTmpl"
                            class="layui-input form-input input-lenovoselect" placeholder="请选择"
                            data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-data-url="@{getBooksetId}"
                            data-idfield="code" data-keyfield="code"
                            data-th-data-effectivefieldsalias='|{"code":"#{ValSubjectSet001.booksetId}","shortName":"#{ValSubjectSet001.booksetName}"}|'
                            data-th-value="${entity?.booksetId}"
                            >
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
</body>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/valuationparametermanage/prodschemeconfig/ValProdSchemeConfig001.js}" type="text/javascript"></script>
</div>

</html>
