<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form " id="schemeForm">
            <div class="layui-form-item" style="display:none;">
                <input id="operateType" name="operateType"
                            class="layui-input form-input" placeholder="请输入"
                            data-th-value="${entity?.operateType}" >
                <input id="o_schemeId" name="o_schemeId"
                            class="layui-input form-input" placeholder="原方案代码"
                            data-th-value="${entity?.schemeId}">
                <input id="o_schemeName" name="o_schemeName"
                            class="layui-input form-input" placeholder="原方案名称"
                            data-th-value="${entity?.schemeName}">
                 <input type="text" id="workflowId" name="workflowId"  placeholder="流程 Id"
                            class="layui-input form-input" data-th-value="${entity?.workflowId}" >
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <label class="layui-form-label form-lable"><span
                        style="color: red"> * </span>方案代码</label>
                    <div class="layui-input-inline input-inline">
                        <input id="schemeId" name="schemeId"
                            class="layui-input form-input" placeholder="请输入"
                            data-th-value="${entity?.schemeId}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md12"style="display: none">
                    <label class="layui-form-label form-lable"><span
                        style="color: red"> * </span>旧方案代码</label>
                    <div class="layui-input-inline input-inline">
                        <input id="oldSchemeId" name="oldSchemeId"
                            class="layui-input form-input" placeholder="请输入"
                            data-th-value="${entity?.oldSchemeId}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <label class="layui-form-label form-lable"><span
                        style="color: red"> * </span>方案名称</label>
                    <div class="layui-input-inline input-inline">
                        <input id="schemeName" name="schemeName"
                            class="layui-input form-input" placeholder="请输入"
                            data-th-value="${entity?.schemeName}">
                    </div>
                </div>
            </div>
            <!-- <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <label class="layui-form-label form-lable">适用范围</label>
                    <div class="layui-input-inline input-inline">
                        <input id="" name=""
                            class="layui-input form-input input-checkbox"
                            disabled="disabled"
                            data-result="[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;净值型&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;货币型&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;03&quot;,&quot;text&quot;:&quot;收益型&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;04&quot;,&quot;text&quot;:&quot;结构化&quot;,&quot;col&quot;:&quot;&quot;}]">
                    </div>
                </div>
            </div> -->
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <label class="layui-form-label form-lable"><span
                        style="color: red"> * </span>是否默认</label>
                    <div class="layui-input-inline input-inline">
                    <!--  TODO 开关作为表单传数据困难 -->
                            <!-- <input type="checkbox" id="isdefault" name="isdefault" lay-skin="switch"
                                data-th-value="${entity?.isdefault}" data-th-checked="${entity?.isdefault} eq 'Y'"
                                lay-text="是|否"> -->
                            <input class="layui-input form-input input-checkbox" name="isdefault" id="isdefault" 
                                data-th-initvalue="${entity?.isdefault}" 
                                data-th-data-result="${YES_OR_NO}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <label class="layui-form-label form-lable">方案描述</label>
                    <div class="layui-input-inline input-inline">
                        <textarea name="schemeDescription"
                            id="schemeDescription" placeholder="请输入内容"
                            class="layui-textarea"
                            data-th-text="${entity?.schemeDescription}">
                       </textarea>
                    </div>
                </div>
            </div>
            <div class="layui-row" style="margin: 50px;">
                <div class="text-center">
                    <button type="button" class="layui-btn btn-save"
                        id="ValuationMethodScheme002_btn_save">保存</button>
                    <button type="button" class="layui-btn btn-submit"
                        id="ValuationMethodScheme002_btn_submit">提交</button>
                    <a type="button" class="layui-btn btn-cancel"
                        id="ValuationMethodScheme002_btn_cancel">取消</a>
                </div>
            </div>
        </form>
    </div>
    <div layout:fragment="script">
        <script
            data-th-src="@{/js/valuation/valuationparametermanage/valuationmethodscheme/ValuationMethodScheme002.js}"
            type="text/javascript">
        </script>
    </div>
</body>
</html>
