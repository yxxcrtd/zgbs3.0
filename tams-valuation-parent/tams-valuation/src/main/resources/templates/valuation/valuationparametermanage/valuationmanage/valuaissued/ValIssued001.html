<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{ValIssued001}">估值下发</title>
<link rel="stylesheet" type="text/css" data-th-href="@{/css/font/iconfont.css}">
<link rel="stylesheet" type="text/css" data-th-href="@{/css/valuation/common.css}">
</head>

<body>
<div layout:fragment="content">
  <div class="layui-col-md12" style="margin-top:10px;">
    <!-- <a id="ValConfirm001_btn_add" class="layui-btn layui-btn-sm"><i class="iconfont icon-found"></i><span>新建</span></a>
    <a id="ValConfirm001_btn_import" class="layui-btn layui-btn-sm"><i class="iconfont icon-import"></i><span>导入</span></a>
    <a id="ValConfirm001_btn_delete" class="layui-btn layui-btn-sm"><i class="iconfont icon-delete"></i><span>删除</span></a> -->
    <a id="ValConfirm001_btn_export" class="layui-btn layui-btn-sm layui-btngroup">
      <i class="iconfont icon-export"></i><span>导出</span><b></b>
      <div>
        <p>估值表导出</p>
        <p>导出查询结果</p>
      </div>
    </a>
    <a id="ValConfirm001_btn_send" class="layui-btn layui-btn-sm layui-btngroup">
      <span>下发确认</span><b></b>
      <div>
        <p>批量下发</p>
      </div>
    </a>
    <a id="ValConfirm001_btn_cancel" class="layui-btn layui-btn-sm">取消下发</a>
    <!-- <a id="ValConfirm001_btn_affirm" class="layui-btn layui-btn-sm">手动确认</a>
    <a id="ValConfirm001_btn_calloff" class="layui-btn layui-btn-sm">取消手动确认</a> -->
    <a id="ValConfirm001_btn_filter" class="layui-btn layui-btn-sm btn-filter"><i class="iconfont icon-btn-filter"></i><span>筛选</span></a>
    <!-- <a class="link-blue ValIssued001_detail" href='javascript:void(0);'>表格双击行查看详情,请点这里</a> -->
  </div>
  <form class="layui-form joyin-form-wrap joyin-filter-form" id="searchForm">
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">产品类型</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[
            {&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;收益型&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;净值型&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;03&quot;,&quot;text&quot;:&quot;货币型&quot;,&quot;col&quot;:&quot;&quot;}
          ]'>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">产品</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-lenovoselect" multiple="multiple" placeholder="请选择产品或输入关键词" value="" data-url="/js/valuation/demo/lenovoSelect.json"  data-effectivefieldsalias='{&quot;code&quot;:&quot;产品代码&quot;,&quot;shortName&quot;:&quot;产品名称&quot;}'>
          <!-- <select class="input-select" allowClear="true" multiple="multiple"  placeholder="请选择" data-url="/js/valuation/demo/selectSimple.json"></select> -->
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">估值日期</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="layui-input form-input input-dateRangeSelect" placeholder="请选择日期">
        </div>
      </div>
    </div>
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">下发状态</label>
        <div class="layui-input-inline input-inline">
          <input type="text" class="input-select" placeholder="请选择" data-result='[
            {&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;未下发&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;下发成功&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;03&quot;,&quot;text&quot;:&quot;下发失败&quot;,&quot;col&quot;:&quot;&quot;}
          ]'>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <a id="ValConfirm001_BTN_search" class="layui-btn layui-btn-sm"><i class="iconfont icon-search"></i><span>&nbsp;&nbsp;查询</span></a>
        <a id="SysInstitution001_BTN_reset" class="layui-btn layui-btn-sm"><i class="iconfont icon-reset"></i><span>&nbsp;&nbsp;重置</span></a>
      </div>
    </div>
  </form>
  <table class="layui-table" id="dataTable"></table>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/valuation/valuationmanage/valuaissued/ValIssued001.js}" type="text/javascript"></script>
</div>
</body>
</html>
