<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{ValuationSolutionManage001}">估值方案管理</title>
<link rel="stylesheet" type="text/css" data-th-href="@{/css/font/iconfont.css}">
</head>

<body>
<div layout:fragment="content">
  <form class="layui-form joyin-form-wrap" id="searchForm">
    <div class="layui-form-item">
      <div class="layui-inline layui-col-md4">
        <label class="layui-form-label form-lable2">估值方案</label>
        <div class="layui-input-inline input-inline">
            <select type="text" class="layui-input form-input input-select" placeholder="请选择" id="schemeId" name="schemeId" allowClear="true"
              data-th-data-url='@{/valuation/valuationparametermanage/valuationsolution/ValuationSolutionManage001/selectSolutionList}'>
            </select>
        </div>
      </div>
      <div class="layui-inline layui-col-md4">
        <a id="ValuationSolutionManage001_btn_search" class="layui-btn layui-btn-sm"><i class="iconfont icon-search"></i><span>&nbsp;&nbsp;查询</span></a>
        <a id="ValuationSolutionManage001_btn_reset" class="layui-btn layui-btn-sm"><i class="iconfont icon-reset"></i><span>&nbsp;&nbsp;重置</span></a>
      </div>
    </div>
  </form>
  <table class="layui-table" id="dataTable"></table>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/valuationparametermanage/valuationsolution/ValuationSolutionManage001.js}" type="text/javascript"></script>
</div>
</body>
</html>
