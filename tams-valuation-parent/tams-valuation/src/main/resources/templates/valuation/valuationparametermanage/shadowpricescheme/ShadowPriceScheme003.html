<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
</head>
<body>
    <div layout:fragment="content"> 
    <div class="layui-row"  style="padding: 5px 10px 5px; margin: 0px -10px; line-height: 32px; background-color: #eeeeee">
<!--             <a id="ShadowPriceScheme003_btn_add" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-add"></i>新建</a>
            <a id="ShadowPriceScheme003_btn_edit" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-edit"></i>修改</a>
            <a id="ShadowPriceScheme003_btn_copy" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-copy"></i>复制</a>
            <a id="ShadowPriceScheme003_btn_reset" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-reset"></i>重置</a> -->
            <a id="ShadowPriceScheme003_btn_save" class="layui-btn btn-save"><i class="iconfont icon-save"></i>保存</a>
            <a id="ShadowPriceScheme003_btn_submit" class="layui-btn btn-submit"><i class="iconfont icon-submit"></i>提交</a>
           <!--  <a id="ShadowPriceScheme003_btn_upper" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-upper"></i>上一条</a>
            <a id="ShadowPriceScheme003_btn_adown" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-adown"></i>下一条</a>
            <a id="ShadowPriceScheme003_btn_question" class="layui-btn layui-btn-sm btn-default"><i class="iconfont icon-question"></i>帮助</a> -->
      </div>
        <form class="layui-form " id="schemeForm">
            <div class="layui-form-item" style="display:none;">
                <input id="operateType" name="operateType"
                            class="layui-input form-input" placeholder="请输入"
                            data-th-value="${entity?.operateType}" >
                <input id="schemeDetailId" name="schemeDetailId"
                            class="layui-input form-input" placeholder="请输入"
                            data-th-value="${entity?.schemeDetailId}" >    
                <input type="text" id="workflowId" name="workflowId" class="layui-input form-input"
                  data-th-value="${workflowId}" disabled="disabled">    
                                
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">影子定价方案</label>
                      <div class="layui-input-inline input-inline">
                         <input id="schemeId" name="schemeId" class="layui-input form-input" 
                                   allowClear="true" placeholder="请输入内容" required
                                   data-th-value="${entity?.schemeId}">
                         </input>
                    </div>
                </div>
                 <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">证券品种</label>
                    <div class="layui-input-inline input-inline">
                        <input id="secType" name="secType"
                            class="layui-input form-input input-select" placeholder="请输入"
                            data-th-value="${entity?.secType}" required
                            data-th-data-result="${SEC_TYPE}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">交易市场</label>
                    <div class="layui-input-inline input-inline">
                        <select id="tradeMarket" name="tradeMarket" class="layui-input form-input  input-select"
                            allowClear="true" placeholder="请输入" data-th-data-result="${VALUATION_TRADE_MARKET}"
                            data-th-initvalue="${entity?.tradeMarket}" parentIds="secType" required
                            data-th-data-url="@{/valuation/valuationparametermanage/valuationmethodscheme/ValuationMethodScheme003/getTradeMarket}">
                            <option></option>
                        </select>
                    </div>
                </div>
                   <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">证券细分类</label>
                    <div class="layui-input-inline input-inline">
                        <select id="secDetailType" name="secDetailType" class="layui-input form-input input-select"
                            allowClear="true" placeholder="请输入" 
                            data-th-initvalue="${entity?.secDetailType}" parentIds="tradeMarket"
                            data-th-data-url="@{/valuation/valuationparametermanage/valuationmethodscheme/ValuationMethodScheme003/getSecDetailType}">
                            <option></option>
                        </select>
                    </div>
                </div>
            </div>   
                    
            <div class="layui-form-item">
               <div class="layui-inline layui-col-md6" >
                   <label class="layui-form-label form-lable" >估值第一市价</label>
                    <div class="layui-input-inline input-inline">
                            <input class="layui-input form-input input-select" name="valuationPrice" id="valuationPrice" 
                                data-th-initvalue="${entity?.valuationPrice}" 
                                required
                                data-th-data-result="${VALUATION_PRICE}">
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable" >估值第二市价</label>
                     <div class="layui-input-inline input-inline">
                            <input class="layui-input form-input input-select" name="valuationPrice2" id="valuationPrice2" 
                                data-th-initvalue="${entity?.valuationPrice2}" 
                                data-th-data-result="${VALUATION_PRICE}">
                    </div>
                </div>
            </div>
               <div class="layui-form-item">
                <div class="layui-inline layui-col-md6" >
                   <label class="layui-form-label form-lable">行情位数</label>
                    <div class="layui-input-inline input-inline">
                            <input id="quotaDigit" name="quotaDigit" class="layui-input form-input text-number" placeholder="请输入" data-textrange ="0"
                            data-th-value="${entity?.quotaDigit}" required>
                    </div>
                </div>
                <div class="layui-inline layui-col-md6" >
                    <label class="layui-form-label form-lable">行情位数处理</label>
                    <div class="layui-input-inline input-inline">
                        <select id="quotaDecType" name="quotaDecType" class="layui-input form-input input-select"
                                allowClear="true" placeholder="请输入" data-th-data-result="${VALUATION_ROUND_RULE}"data-th-required="true"
                                data-th-initvalue="${entity?.quotaDecType}">
                            <option></option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6" id="c_priceClass"style="display: none">
                    <label class="layui-form-label form-lable">价格类型</label>
                    <div class="layui-input-inline input-inline">
                        <select id="priceClass" name="priceClass" class="layui-input form-input input-select"
                                allowClear="true" placeholder="请输入" data-th-data-result="${PRICE_CLASS}"data-th-required="true"
                                data-th-initvalue="${entity?.priceClass}"parentIds="secType">
                            <option></option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
               <div class="layui-inline layui-col-md6" >
                   <label class="layui-form-label form-lable">行情日期</label>
                    <div class="layui-input-inline input-inline">
                            <input class="layui-input form-input input-checkbox" name="valuationDate" id="valuationDate" 
                                data-th-initvalue="${entity?.valuationDate}" 
                                data-th-data-result="${VALUATION_DATE}" required>
                    </div>
                </div>
                 <div class="layui-inline layui-col-md6" >
                   <label class="layui-form-label form-lable">开始日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="vdate" name="vdate" placeholder="请选择" 
                        class="layui-input form-input input-dateSelect" allowClear="true" required
                         data-th-value="${entity?.vdate}">
                    </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div layout:fragment="script">
        <script
            data-th-src="@{/js/valuation/valuationparametermanage/shadowpricescheme/ShadowPriceScheme003.js}"
            type="text/javascript">
        </script>
    </div>
</body>
</html>
