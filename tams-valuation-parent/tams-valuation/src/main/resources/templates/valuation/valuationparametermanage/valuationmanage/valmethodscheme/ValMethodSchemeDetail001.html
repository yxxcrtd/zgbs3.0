<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title data-th-text="#{ValMethodSchemeDetail001}">新建估值方法方案明细</title>
<link rel="stylesheet" type="text/css" data-th-href="@{/css/valuation/common.css}">
</head>

<body>
<div layout:fragment="content">
  <form id="submitForm">
    <div class="layui-form" style=" margin-top:10px;">
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>估值方案</label>
        <div class="layui-input-block input-inline">
          <input type="text" class="input-select" placeholder="请选择" data-result='[
            {&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;某某的某某的某某的产品估值方案001&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;某某的某某的某某的产品估值方案002&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;03&quot;,&quot;text&quot;:&quot;某某的某某的某某的产品估值方案003&quot;,&quot;col&quot;:&quot;&quot;}
          ]'>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>交易市场</label>
        <div class="layui-input-block input-inline2">
          <input type="text" id="status" name="status" class="layui-input form-input input-checkbox" data-result='[
          {&quot;id&quot;:&quot;SC01&quot;,&quot;text&quot;:&quot;银行间&quot;,&quot;col&quot;:&quot;&quot;},
          {&quot;id&quot;:&quot;SC02&quot;,&quot;text&quot;:&quot;上交所&quot;,&quot;col&quot;:&quot;&quot;},
          {&quot;id&quot;:&quot;SC03&quot;,&quot;text&quot;:&quot;深交所&quot;,&quot;col&quot;:&quot;&quot;},
          {&quot;id&quot;:&quot;SC04&quot;,&quot;text&quot;:&quot;中金所&quot;,&quot;col&quot;:&quot;&quot;},
          {&quot;id&quot;:&quot;SC05&quot;,&quot;text&quot;:&quot;黄金交易所&quot;,&quot;col&quot;:&quot;&quot;},
          {&quot;id&quot;:&quot;SC06&quot;,&quot;text&quot;:&quot;大连商品交易所&quot;,&quot;col&quot;:&quot;&quot;},
          {&quot;id&quot;:&quot;SC07&quot;,&quot;text&quot;:&quot;郑州商品交易所&quot;,&quot;col&quot;:&quot;&quot;}
          ]'
          initValue='SC01'>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>证券品种</label>
        <div class="layui-input-block input-inline linkage">
          <input type="text" class="input-select" style="width:50%; margin-right:5px;" placeholder="请选择一级分类" data-result='[
            {&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;基金&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;债券&quot;,&quot;col&quot;:&quot;&quot;}
          ]'>
          <input type="text" class="input-select" style="width:50%;" placeholder="请选择二级分类" data-result='[
            {&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;优先股&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;国债&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;03&quot;,&quot;text&quot;:&quot;地方债券&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;04&quot;,&quot;text&quot;:&quot;企业债券&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;05&quot;,&quot;text&quot;:&quot;ETF&quot;,&quot;col&quot;:&quot;&quot;}
          ]'>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>投资目的</label>
        <div class="layui-input-block input-inline">
          <input type="text" class="input-select" placeholder="请选择" data-result='[
            {&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;以公允价值计量且其变动计入当期损益（FVTPL）&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;以公允价值计量且其变动计入其他综合收益（FVOCI）&quot;,&quot;col&quot;:&quot;&quot;},
            {&quot;id&quot;:&quot;03&quot;,&quot;text&quot;:&quot;以摊余成本计量（AC）&quot;,&quot;col&quot;:&quot;&quot;}
          ]'>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>估值方法</label>
        <div class="layui-input-block input-inline">
          <input type="text" id="status" name="status" class="layui-input form-input input-checkbox" data-result='[
          {&quot;id&quot;:&quot;FF01&quot;,&quot;text&quot;:&quot;市值法&quot;,&quot;col&quot;:&quot;&quot;},
          {&quot;id&quot;:&quot;FF02&quot;,&quot;text&quot;:&quot;成本法&quot;,&quot;col&quot;:&quot;&quot;},
          {&quot;id&quot;:&quot;FF03&quot;,&quot;text&quot;:&quot;市值成本孰低法&quot;,&quot;col&quot;:&quot;&quot;},
          {&quot;id&quot;:&quot;FF04&quot;,&quot;text&quot;:&quot;摊余成本法&quot;,&quot;col&quot;:&quot;&quot;}
          ]'
          initValue='FF01'>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>估值市价来源</label>
        <div class="layui-input-block input-inline2">
          <ul class="checklabel multilabel">
            <li class="curr"><span>收盘价</span></li><li><span>平均价</span></li><li><span>最高价</span></li><li><span>最低价</span></li><li><span>买一价</span></li><li><span>卖一价</span></li><li class="disb"><span>中债登</span></li><li class="disb"><span>中证登</span></li><li class="disb"><span>上清所</span></li>
          </ul>
          <div class="layui-clear"></div>
          <!-- <ul class="checklabel layui-clear radiolabel" style=" margin-top:10px;">
            <li class="disb"><span>中债登</span></li><li class="disb"><span>中证登</span></li><li class="disb"><span>上清所</span></li>
          </ul> -->
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>估值市价</label>
        <div class="layui-input-block input-inline2">
          <p class="must" style="padding:5px 0;font-weight:bold;">优先：<span>平均价</span>，备用：<span>最低价</span></p>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>行情位数</label>
        <div class="layui-input-block input-inline">
          <input type="text" name="scheme" class="layui-input form-input" value="" placeholder="请输入数字">
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>行情日期</label>
        <div class="layui-input-block input-inline">
          <input type="text" id="status" name="status" class="layui-input form-input input-checkbox" data-result='[
          {&quot;id&quot;:&quot;GZRQ01&quot;,&quot;text&quot;:&quot;估值日-1&quot;,&quot;col&quot;:&quot;&quot;},
          {&quot;id&quot;:&quot;GZRQ02&quot;,&quot;text&quot;:&quot;估值日&quot;,&quot;col&quot;:&quot;&quot;},
          {&quot;id&quot;:&quot;GZRQ03&quot;,&quot;text&quot;:&quot;估值日+1&quot;,&quot;col&quot;:&quot;&quot;}
          ]'
          initValue='GZRQ01'>
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">*</i>开始日</label>
        <div class="layui-input-block input-inline">
          <input type="text" class="layui-input form-input input-dateSelect" placeholder="请选择日期">
        </div>
      </div>
      <div class="layui-form-item">
        <label class="layui-form-label form-lable2"><i class="iconfont must">&nbsp;</i>结束日</label>
        <div class="layui-input-block input-inline">
          <input type="text" class="layui-input form-input input-dateSelect" placeholder="请选择日期">
        </div>
      </div> 
    </div>
  </form>
  <div class="layui-col-md11" style="margin:10px 0 10px 0;">
   	<div class="text-center">
<!--         <a id="ValCoverSwitch002_btn_save" class="layui-btn layui-btn-sm btn-save">保存</a> -->
        <a id="ValCoverSwitch002_btn_submit" class="layui-btn layui-btn-sm btn-submit">提交</a>
        <a id="ValCoverSwitch002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel">取消</a>
    </div>
   </div>
</div>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script>
</div>
</body>
</html>
