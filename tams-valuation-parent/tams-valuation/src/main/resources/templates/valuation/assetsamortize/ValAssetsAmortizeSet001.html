<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>资产摊销设置</title>
</head>
<body>
</body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a id="ValAssetsAmortizeSet001_btn_add" class="layui-btn layui-btn-sm btn-create">新建</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">

                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">资产代码</label>
<!--                    <div class="layui-input-inline input-inline">
                        <select type="text" id="finprodId" name="finprodId" placeholder="请选择"
                            class="layui-input form-input input-select"
                             data-th-data-result="${FINPROD_ID}"
                            ></select>
                    </div>-->

                    <div class="layui-input-inline input-inline" style="display: inline;">
                        <select id="finprodId" name="finprodId"  class="layui-input form-input input-select"
                                data-th-data-url='@{getFinprodId}'    allowClear="true" placeholder="请选择">
                            <option></option>
                        </select>
                    </div>

                </div>


                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">会计账套</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="booksetId" name="booksetId" placeholder="请选择"
                            class="layui-input form-input input-select"
                            data-th-data-url="@{/valuation/assetsamortize/ValAssetsAmortizeSet001/getBooksetId}"
                            ></select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">会计日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="vdate" name="vdate" placeholder="请选择，支持区间"
                            class="layui-input form-input input-dateRangeSelect" value="">
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">重算方式</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="recalType" name="recalType" class="layui-input form-input input-checkbox"
                          data-th-data-result="${RECAL_TYPE}">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/assetsamortize/ValAssetsAmortizeSet001.js}" type="text/javascript"></script>
</div>
</html>
