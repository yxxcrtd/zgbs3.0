        <form class="layui-form " id="dataForm">
            <div class="layui-form-item" style="display: none;">
                <input id="operateType" name="operateType"
                    class="layui-input form-input" placeholder="操作类型" data-th-value="${entity?.operateType}">
                <input id="taxId" name="taxId" class="layui-input form-input" placeholder="taxId"
                    data-th-value="${entity?.taxId}"> 
                <input id="schId" name="schId" class="layui-input form-input" placeholder="税务方案代码"
                    data-th-value="${entity?.schId}"> 
                <input type="text" id="workflowId" name="workflowId"  placeholder="流程 Id"
                        class="layui-input form-input" data-th-value="${workflowId}" >
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <label class="layui-form-label form-lable"><span style="color: red"> * </span> 附加税类型</label>
                    <div class="layui-input-inline input-inline">
                        <input id="addTaxType" name="addTaxType" class="layui-input form-input input-select"
                            allowClear="true" data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-data-result="${ALT_TYPE}" data-th-value="${entity?.addTaxType}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <label class="layui-form-label form-lable"><span style="color: red"> * </span> 应税税率</label>
                    <div class="layui-input-inline input-inline">
                        <input id="taxRate" name="taxRate" class="layui-input form-input text-number" placeholder="请输入"
                            data-th-value="${entity?.taxRate}"><span class="input-right-show">%</span>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <label class="layui-form-label form-lable"><span style="color: red"> * </span> 规则生效日</label>
                    <div class="layui-input-inline input-inline">
                        <input id="effDate" name="effDate" class="layui-input form-input input-dateSelect"
                            placeholder="请输入" data-th-value="${entity?.effDate}">
                    </div>
                </div>
            </div>
            <div class="layui-row" style="margin: 50px;">
                <div class="text-center">
                    <button type="button" class="layui-btn btn-save" id="TaxScheme004_btn_save">保存</button>
                    <button type="button" class="layui-btn btn-submit" id="TaxScheme004_btn_submit">提交</button>
                    <a type="button" class="layui-btn btn-cancel" id="TaxScheme004_btn_cancel">取消</a>
                </div>
            </div>
        </form>
    </div>
    <div layout:fragment="script">
        <script data-th-inline="javascript" type="text/javascript">
            var institutionCode = /*[[${institutionCode}]]*/'';
        </script>

    </div>
