<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>会计场景计税配置</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form " id="dataForm">
        <div class="layui-form-item" style="display: none;">
            <input id="operateType" name="operateType" class="layui-input form-input" placeholder="操作类型"
                   data-th-value="${entity?.operateType}"/>
            <input id="seqNo" name="seqNo" class="layui-input form-input" placeholder="seqNo"
                   data-th-value="${entity?.seqNo}"/>
            <input id="isUsed" name="isUsed" class="layui-input form-input" placeholder="isUsed"
                   data-th-value="${entity?.isUsed}"/>
            <input type="text" id="workflowId" name="workflowId" placeholder="流程 Id"
                   class="layui-input form-input" data-th-value="${entity?.workflowId}"/>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"> 税务方案代码</label>
                <div class="layui-input-inline input-inline">
                    <input id="schemeId" name="schemeId" class="layui-input form-input" placeholder="税务方案代码"
                           data-th-value="${entity?.schemeId}" disabled="disabled">
                </div>
            </div>
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"><span style="color: red"> * </span> 配置代码</label>
                <div class="layui-input-inline input-inline">
                    <select id="configId" name="configId" class="layui-input form-input input-select"
                            allowClear="true" data-th-data-url="@{/valuation/taxparametermanage/taxscheme/TaxScheme007/getConfigInfo}"
                            data-th-initvalue="${entity?.configId}" formatoption = "false"></select>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"> 记账场景(会计事件编码)</label>
                <div class="layui-input-inline input-inline">
                    <select id="tableId" name="tableId" class="layui-input form-input input-select"
                            allowClear="true" data-th-data-result="${TABLE_ID}"
                            data-th-initvalue="${entity?.tableId}" disabled="disabled"></select>
                </div>
            </div>
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"> 发生额科目性质</label>
                <div class="layui-input-inline input-inline">
                    <select id="subjectNature" name="subjectNature" class="layui-input form-input input-select"
                            allowClear="true" disabled="disabled" parentIds="configId"
                            data-th-data-result="${BASE_SUBJECT_NATURE}"
                            data-th-initvalue="${entity?.subjectNature}"></select>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"> 增值税类型</label>
                <div class="layui-input-inline input-inline">
                    <select id="vatType" name="vatType" class="layui-input form-input input-select"
                            allowClear="true" data-th-data-result="${VAT_TYPE}"
                            data-th-initvalue="${entity?.vatType}" disabled="disabled"></select>
                </div>
            </div>
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"> 确认类型</label>
                <div class="layui-input-inline input-inline">
                    <select id="taxPType" name="taxPType" class="layui-input form-input input-select"
                            allowClear="true" data-th-data-result="${TAX_P_TYPE}"
                            data-th-initvalue="${entity?.taxPType}" disabled="disabled"></select>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable">发生场景</label>
                <div class="layui-input-inline input-inline">
                    <select id="incomeSource" name="incomeSource" class="layui-input form-input input-select"
                            allowClear="true" data-th-data-result="${ALT_INCOME_SOURCE}"
                            data-th-initvalue="${entity?.incomeSource}" disabled="disabled"></select>
                </div>
            </div>
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"> 增项/减项</label>
                <div class="layui-input-inline input-inline">
                    <select id="inOut" name="inOut" class="layui-input form-input input-select"
                            allowClear="true" data-th-data-result="${TAX_IN_OUT}"
                            data-th-initvalue="${entity?.inOut}" disabled="disabled"></select>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"> 计算方式</label>
                <div class="layui-input-inline input-inline">
                    <select id="calcType" name="calcType" class="layui-input form-input input-select"
                            allowClear="true" data-th-data-result="${TAX_CALC_TYPE}"
                            data-th-initvalue="${entity?.calcType}" disabled="disabled"></select>
                </div>
            </div>
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable">发生科目借贷方向</label>
                <div class="layui-input-inline input-inline">
                    <select id="cdFlag" name="cdFlag" class="layui-input form-input input-select"
                            allowClear="true" data-th-data-result="${CD_FLAG}"
                            data-th-initvalue="${entity?.cdFlag}" disabled="disabled"></select>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable">占比比例</label>
                <div class="layui-input-inline input-inline">
                    <select id="calcScale" name="calcScale" class="layui-input form-input input-select"
                            allowClear="true" data-th-data-result="${TAX_CALC_PROPORTION}"
                            data-th-initvalue="${entity?.calcScale}" disabled="disabled"></select>
                </div>
            </div>
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable">占比科目性质</label>
                <div class="layui-input-inline input-inline">
                    <select id="calcSnature" name="calcSnature" class="layui-input form-input input-select"
                            allowClear="true" disabled="disabled" parentIds="configId"
                            data-th-data-result="${BASE_SUBJECT_NATURE}"
                            data-th-data-url="@{/valuation/taxparametermanage/taxscheme/TaxScheme007/getBaseSubjectNature}"
                            data-th-initvalue="${entity?.calcSnature}"></select>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable">占比基数</label>
                <div class="layui-input-inline input-inline">
                    <select id="calcBase" name="calcBase" class="layui-input form-input input-select"
                            allowClear="true" data-th-data-result="${ALT_INCOME_SOURCE}"
                            data-th-initvalue="${entity?.calcBase}" disabled="disabled"></select>
                </div>
            </div>
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"> 金额计入方式</label>
                <div class="layui-input-inline input-inline">
                    <input id="isCarrt" name="isCarrt" class="layui-input form-input"
                           allowClear="true" autocomplete="off"
                           data-th-value="${entity?.isCarrt}" disabled="disabled">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable">处理条件</label>
                <div class="layui-input-inline input-inline">
                    <input id="intRepayHandle" name="intRepayHandle" class="layui-input form-input"
                           allowClear="true" autocomplete="off"
                           data-th-value="${entity?.intRepayHandle}" disabled="disabled">
                </div>
            </div>
        </div>
        <div class="layui-row" style="margin: 50px;">
            <div class="text-center">
                <button type="button" class="layui-btn btn-save" id="TaxScheme007_btn_save">保存</button>
                <button type="button" class="layui-btn btn-submit" id="TaxScheme007_btn_submit">提交</button>
                <a type="button" class="layui-btn btn-cancel" id="TaxScheme007_btn_cancel">取消</a>
            </div>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/taxparametermanage/taxscheme/TaxScheme007.js}" type="text/javascript"></script>
</div>
</body>
</html>
