<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title>税务方案</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form " id="schemeForm">
            <div class="layui-form-item" style="display: none;">
                <input id="operateType" name="operateType" class="layui-input form-input" placeholder="请输入"
                    data-th-value="${entity?.operateType}"> 
                <input id="o_schId" name="o_schId"
                    class="layui-input form-input" placeholder="原方案代码" data-th-value="${entity?.schId}"> 
                <input
                    id="o_schName" name="o_schName" class="layui-input form-input" placeholder="原方案名称"
                    data-th-value="${entity?.schName}">
                    
               <input id="refSchId" name="refSchId"
                    class="layui-input form-input" placeholder="参考方案代码" data-th-value="${entity?.refSchId}"> 
               
                <input type="text" id="workflowId" name="workflowId"  placeholder="流程 Id"
                            class="layui-input form-input" data-th-value="${entity?.workflowId}" >
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <label class="layui-form-label form-lable"><span style="color: red"> * </span>税务方案代码</label>
                    <div class="layui-input-inline input-inline">
                        <input id="schId" name="schId" class="layui-input form-input" placeholder="请输入"
                            data-th-value="${entity?.schId}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <label class="layui-form-label form-lable"><span style="color: red"> * </span>方案名称</label>
                    <div class="layui-input-inline input-inline">
                        <input id="schName" name="schName" class="layui-input form-input" placeholder="请输入"
                            data-th-value="${entity?.schName}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <label class="layui-form-label form-lable"><span style="color: red"> * </span>是否默认</label>
                    <div class="layui-input-inline input-inline">
                        <!--  TODO 开关作为表单传数据困难 -->
                        <!-- <input type="checkbox" id="isdefault" name="isdefault" lay-skin="switch"
                                data-th-value="${entity?.isdefault}" data-th-checked="${entity?.isdefault} eq 'Y'"
                                lay-text="是|否"> -->
                        <input class="layui-input form-input input-checkbox" name="isDefault" id="isDefault"
                            data-th-initvalue="${entity?.isDefault}" data-th-data-result="${YES_OR_NO}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <label class="layui-form-label form-lable">方案描述</label>
                    <div class="layui-input-inline input-inline">
                        <textarea name="remark" id="remark" placeholder="请输入内容" class="layui-textarea"
                            data-th-text="${entity?.remark}">
                       </textarea>
                    </div>
                </div>
            </div>
            <div class="layui-form-item" id="c_copyRange">
                <div class="layui-inline layui-col-md12">
                    <label class="layui-form-label form-lable"><span style="color: red"> * </span>复制范围</label>
                    <div class="layui-input-inline input-inline">
                        <!-- <select id="copyRange" name="copyRange" class="layui-input form-input input-select"
                            allowClear="true" placeholder="请选择，可多选" multiple="multiple"
                            data-th-data-result="${COPY_RANGE}" data-th-initvalue="${entity?.copyRange}">
                        </select> -->
                        <select id="copyRange" name="copyRange" class="layui-input form-input input-select"
                            allowClear="true" placeholder="请选择，可多选" multiple="multiple"
                            data-th-data-result="${COPY_RANGE}" data-th-initvalue="${entity?.copyRanges}">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-row" style="margin: 50px;">
                <div class="text-center">
                    <button type="button" class="layui-btn btn-save" id="TaxScheme002_btn_save">保存</button>
                    <button type="button" class="layui-btn btn-submit" id="TaxScheme002_btn_submit">提交</button>
                    <a type="button" class="layui-btn btn-cancel" id="TaxScheme002_btn_cancel">取消</a>
                </div>
            </div>
        </form>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/taxparametermanage/taxscheme/TaxScheme002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
