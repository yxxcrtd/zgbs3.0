<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="utf-8">
<title>税务方案</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="layui-col-md3" style="width: 22%">
            <div class="joyin-form-wrap">
                <form class="layui-form" id="schemeForm">
                    <div class="layui-form-item">
                        <input type="text" id="searchKey" name="searchKey"
                            class="layui-input form-input input-fuzzy-text" placeholder="请输入税务方案关键词">
                    </div>
                </form>
            </div>
            <div class="layui-collapse">
                <div class="layui-colla-item" style="padding: 0">
                    <div class="layui-row layui-colla-title" style="margin: 0; line-height: 32px;">
                        <div class="layui-col-md6">
                            <span>方案</span>
                        </div>
                        <div class="layui-col-md3 layui-col-md-offset3">
                            <button type="button" class="layui-btn btn-default layui-btn-sm btn-create"
                                id="TaxScheme001_btn_add_scheme" style="margin-top: 5px;">新建</button>
                        </div>
                    </div>
                    <div class="layui-colla-content layui-show" style="padding: 0">
                        <table class="layui-table" id="schemeTable"></table>
                    </div>
                </div>
            </div>
        </div>
        <div class="layui-col-md9" style="width: 78%">
            <div class="layui-tab layui-tab-card" lay-filter="tabContainer">
                <ul class="layui-tab-title">
                    <li id="vatTax-title" class="layui-this">增值税则表</li>
                    <li id="adtTax-title">附加税则表</li>
                    <li id="taxable-title">资产应税信息</li>
                    <li id="config-title">参数设置</li>
                    <li id="taxSchaBokConfig-title">会计场景计税配置</li>
                </ul>
                <div class="layui-tab-content" style="padding: 0">
                    <div class="layui-tab-item layui-show">
                        <div class="layui-col-md12" style="margin: 10px 10px">
                            <button type="button" class="layui-btn layui-btn-sm btn-create"
                                id="TaxScheme001_btn_vatTax_add">新建</button>
                            <button type="button" class="layui-btn layui-btn-sm btn-delete"
                                id="TaxScheme001_btn_vatTax_delete">删除</button>
                            <button type="button" class="layui-btn layui-btn-sm btn-export"
                                id="TaxScheme001_btn_vatTax_export">导出</button>
                            <button type="button" class="layui-btn layui-btn-sm btn-filter"
                                id="TaxScheme001_btn_vatTax_filter">筛选</button>
                        </div>
                        <div class="layui-col-md12" id="c_vatTaxForm" style="background-color: #f5f5f5;">
                            <form class="layui-form layui-col-md11" id="vatTaxForm">
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">资产分类</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="vatTax_assetClassify" name="assetClassify"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请选择，可多选" multiple="multiple"
                                                data-th-data-result="${TAX_ASSET_TYPE}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">本金收益特征</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="vatTax_capiIncomeFeature" name="capiIncomeFeature"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请选择，可多选" multiple="multiple"
                                                data-th-data-result="${AMT_INCOME_TYPE}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">收入类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="vatTax_incomeType" name="incomeType"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请选择，可多选" multiple="multiple"
                                                data-th-data-result="${VAT_TYPE2}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">免税收入类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="vatTax_feeType" name="feeType"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请选择，可多选" multiple="multiple"
                                                data-th-data-result="${TAX_FREE_TYPE}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">生效日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input id="vatTax_effDate" name="effDate"
                                                class="layui-input form-input input-dateRangeSelect" allowClear="true"
                                                placeholder="请选择，支持区间">
                                        </div>
                                    </div>
                                </div>
                            </form>
                            <div class="layui-col-md1">
                                <div class="layui-form-item">
                                    <button type="button" class="layui-btn layui-btn-sm btn-search"
                                        id="TaxScheme001_btn_vatTax_search">查询</button>
                                </div>
                                <div class="layui-form-item">
                                    <button type="button" class="layui-btn layui-btn-sm btn-default btn-reset"
                                        id="TaxScheme001_btn_vatTax_reset">重置</button>
                                </div>
                            </div>
                        </div>
                        <table class="layui-table" id="vatTax-table"></table>
                    </div>
                    <div class="layui-tab-item">
                        <div class="layui-col-md12" style="margin: 10px 10px">
                            <button type="button" class="layui-btn layui-btn-sm btn-create"
                                id="TaxScheme001_btn_adtTax_add">新建</button>
                            <button type="button" class="layui-btn layui-btn-sm btn-delete"
                                id="TaxScheme001_btn_adtTax_delete">删除</button>
                            <button type="button" class="layui-btn layui-btn-sm btn-export"
                                id="TaxScheme001_btn_adtTax_export">导出</button>
                            <button type="button" class="layui-btn layui-btn-sm btn-filter"
                                id="TaxScheme001_btn_adtTax_filter">筛选</button>
                        </div>
                        <div class="layui-col-md12" id="c_adtTaxForm" style="background-color: #f5f5f5;">
                            <form class="layui-form layui-col-md11" id="adtTaxForm">
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">附加税类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="adtTax_addTaxType" name="addTaxType"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请选择，可多选" multiple="multiple"
                                                data-th-data-result="${ALT_TYPE}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">生效日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input id="adtTax_effDate" name="effDate"
                                                class="layui-input form-input input-dateRangeSelect" allowClear="true"
                                                placeholder="请选择，支持区间">
                                        </div>
                                    </div>
                                </div>
                            </form>
                            <div class="layui-col-md1">
                                <div class="layui-form-item">
                                    <button type="button" class="layui-btn layui-btn-sm btn-search"
                                        id="TaxScheme001_btn_adtTax_search">查询</button>
                                </div>
                                <div class="layui-form-item">
                                    <button type="button" class="layui-btn layui-btn-sm btn-default btn-reset"
                                        id="TaxScheme001_btn_adtTax_reset">重置</button>
                                </div>
                            </div>
                        </div>
                        <table class="layui-table" id="adtTax-table"></table>
                    </div>
                    <div class="layui-tab-item">
                        <div class="layui-col-md12" style="margin: 10px 10px">
                            <button type="button" class="layui-btn layui-btn-sm btn-create"
                                id="TaxScheme001_btn_taxable_add">新建</button>
                            <button type="button" class="layui-btn layui-btn-sm btn-delete"
                                id="TaxScheme001_btn_taxable_delete">删除</button>
                            <button type="button" class="layui-btn layui-btn-sm btn-export"
                                id="TaxScheme001_btn_taxable_export">导出</button>
                            <button type="button" class="layui-btn layui-btn-sm btn-filter"
                                id="TaxScheme001_btn_taxable_filter">筛选</button>
                        </div>
                        <div class="layui-col-md12" id="c_taxableForm" style="background-color: #f5f5f5;">
                            <form class="layui-form layui-col-md11" id="taxableForm">
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">资产分类</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="taxable_assetClassify" name="assetClassify"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请选择，可多选" multiple="multiple"
                                                data-th-data-result="${TAX_ASSET_TYPE}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">资产代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="taxable_assetId" name="assetId" formatResult="{id:id}"
                                                class="layui-input form-input input-select" data-url='findAsset'
                                                allowClear="true" data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-initvalue="${entity?.assetId}" multiple="multiple" formatoption = "false">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">本金收益特征</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="taxable_capiIncomeFeature" name="capiIncomeFeature"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请选择，可多选" multiple="multiple"
                                                data-th-data-result="${AMT_INCOME_TYPE}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">收入类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="taxable_incomeType" name="incomeType"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请选择，可多选" multiple="multiple"
                                                data-th-data-result="${VAT_TYPE2}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">应税标识</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="taxable_taxableSign" name="taxableSign"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请选择，可多选" multiple="multiple"
                                                data-th-data-result="${TAXABLE_SIGN}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">生效日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input id="taxable_effDate" name="effDate"
                                                class="layui-input form-input input-dateRangeSelect" allowClear="true"
                                                placeholder="请选择，支持区间">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">维护方式</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="taxable_maintenanceMode" name="maintenanceMode"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请选择，可多选" multiple="multiple"
                                                data-th-data-result="${MAINTAIN_MODE}">>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </form>
                            <div class="layui-col-md1">
                                <div class="layui-form-item">
                                    <button type="button" class="layui-btn layui-btn-sm btn-search"
                                        id="TaxScheme001_btn_taxable_search">查询</button>
                                </div>
                                <div class="layui-form-item">
                                    <button type="button" class="layui-btn layui-btn-sm btn-default btn-reset"
                                        id="TaxScheme001_btn_taxable_reset">重置</button>
                                </div>
                            </div>
                        </div>
                        <table class="layui-table" id="taxable-table"></table>
                    </div>
                    <div class="layui-tab-item">
                        <div class="layui-col-md12" style="margin: 10px 10px">
                            <button type="button" class="layui-btn layui-btn-sm btn-create"
                                id="TaxScheme001_btn_config_add">新建</button>
                            <button type="button" class="layui-btn layui-btn-sm btn-delete"
                                id="TaxScheme001_btn_config_delete">删除</button>
                            <button type="button" class="layui-btn layui-btn-sm btn-export"
                                id="TaxScheme001_btn_config_export">导出</button>
                            <button type="button" class="layui-btn layui-btn-sm btn-filter"
                                id="TaxScheme001_btn_config_filter">筛选</button>
                        </div>
                        <div class="layui-col-md12" id="c_configForm" style="background-color: #f5f5f5;">
                            <form class="layui-form layui-col-md11" id="configForm">
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">项目</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="config_configId" name="configId"
                                                class="layui-input form-input input-select" data-url='findProject'
                                                allowClear="true" data-th-placeholder="#{SysCommon.placeholder}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">参数类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="config_schemeType2" name="schemeType2"
                                                class="layui-input form-input input-select" allowClear="true"
                                                placeholder="请选择，可多选" multiple="multiple"
                                                data-th-data-result="${SCHEME_TYPE2}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">生效日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input id="config_effDate" name="effDate"
                                                class="layui-input form-input input-dateRangeSelect" allowClear="true"
                                                placeholder="请选择，支持区间">
                                        </div>
                                    </div>
                                </div>
                            </form>
                            <div class="layui-col-md1">
                                <div class="layui-form-item">
                                    <button type="button" class="layui-btn layui-btn-sm btn-search"
                                        id="TaxScheme001_btn_config_search">查询</button>
                                </div>
                                <div class="layui-form-item">
                                    <button type="button" class="layui-btn layui-btn-sm btn-default btn-reset"
                                        id="TaxScheme001_btn_config_reset">重置</button>
                                </div>
                            </div>
                        </div>
                        <table class="layui-table" id="config-table"></table>
                    </div>
                    <div class="layui-tab-item">
                        <div class="layui-col-md12" style="margin: 10px 10px">
                            <button type="button" class="layui-btn layui-btn-sm btn-create"
                                    id="TaxScheme001_btn_taxSchaBokConfig_add">新建</button>
                            <button type="button" class="layui-btn layui-btn-sm btn-delete"
                                    id="TaxScheme001_btn_taxSchaBokConfig_delete">删除</button>
                            <button type="button" class="layui-btn layui-btn-sm btn-export"
                                    id="TaxScheme001_btn_taxSchaBokConfig_export">导出</button>
                            <button type="button" class="layui-btn layui-btn-sm btn-filter"
                                    id="TaxScheme001_btn_taxSchaBokConfig_filter">筛选</button>
                        </div>
                        <div class="layui-col-md12" id="c_taxSchaBokConfigForm" style="background-color: #f5f5f5;">
                            <form class="layui-form layui-col-md11" id="taxSchaBokConfigForm">
                                <div class="layui-form-item">
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">记账场景</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="taxSchaBokConfig_tableId" name="tableId"
                                                    class="layui-input form-input input-select"
                                                    data-th-data-result="${TABLE_ID}" multiple="multiple"
                                                    allowClear="true" data-th-placeholder="#{SysCommon.placeholder}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="layui-inline layui-col-md6">
                                        <label class="layui-form-label form-lable">增值税类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="taxSchaBokConfig_vatType" name="vatType"
                                                    class="layui-input form-input input-select" allowClear="true"
                                                    placeholder="请选择，可多选" multiple="multiple"
                                                    data-th-data-result="${VAT_TYPE}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </form>
                            <div class="layui-col-md1">
                                <div class="layui-form-item">
                                    <button type="button" class="layui-btn layui-btn-sm btn-search"
                                            id="TaxScheme001_btn_taxSchaBokConfig_search">查询</button>
                                </div>
                                <div class="layui-form-item">
                                    <button type="button" class="layui-btn layui-btn-sm btn-default btn-reset"
                                            id="TaxScheme001_btn_taxSchaBokConfig_reset">重置</button>
                                </div>
                            </div>
                        </div>
                        <table class="layui-table" id="taxSchaBokConfig-table"></table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/taxparametermanage/taxscheme/TaxScheme001.js}" type="text/javascript"></script>
    </div>
</body>
</html>
