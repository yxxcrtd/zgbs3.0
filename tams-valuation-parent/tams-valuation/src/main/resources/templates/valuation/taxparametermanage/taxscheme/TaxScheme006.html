</head>

        <form class="layui-form " id="dataForm">
            <div class="layui-form-item" style="display: none;">
                <input id="operateType" name="operateType" class="layui-input form-input" placeholder="操作类型"
                    data-th-value="${entity?.operateType}"> <input id="seqId" name="seqId"
                    class="layui-input form-input" placeholder="seqId" data-th-value="${entity?.seqId}"> <input
                    id="schemeId" name="schemeId" class="layui-input form-input" placeholder="税务方案代码"
                    data-th-value="${entity?.schemeId}"> <input id="dictCode" name="dictCode"
                    class="layui-input form-input" placeholder="数据字典" data-th-value="${entity?.dictCode}">
                    <input type="text" id="workflowId" name="workflowId"  placeholder="流程 Id"
                        class="layui-input form-input" data-th-value="${workflowId}" >
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <label class="layui-form-label form-lable"><span style="color: red"> * </span> 项目</label>
                    <div class="layui-input-inline input-inline">
                        <select id="configId" name="configId" class="layui-input form-input input-select"
                            data-th-data-url='@{/valuation/taxparametermanage/taxscheme/TaxScheme006/findProject}' allowClear="true" data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-initvalue="${entity?.configId}" childrenIds="configValue">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <label class="layui-form-label form-lable"><span style="color: red"> * </span> 值</label>
                    <div class="layui-input-inline input-inline" id="c_select_configValue">
                        <select id="select_configValue" name="configValue" class="layui-input form-input input-select"
                            data-th-data-url='@{/valuation/taxparametermanage/taxscheme/TaxScheme006/findValue}' allowClear="true" data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-initvalue="${entity?.configValue}" parentIds="configId">
                        </select>
                    </div>
                    <div class="layui-input-inline input-inline" id="c_input_configValue">
                        <input id="input_configValue" name="configValue" class="layui-input form-input "
                            data-th-value="${entity?.configValue}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md12">
                    <label class="layui-form-label form-lable"><span style="color: red"> * </span> 生效日期</label>
                    <div class="layui-input-inline input-inline">
                        <input id="effDate" name="effDate" class="layui-input form-input input-dateSelect"
                            placeholder="请输入" data-th-value="${entity?.effDate}">
                    </div>
                </div>
            </div>
            <div class="layui-row" style="margin: 50px;">
                <div class="text-center">
                    <button type="button" class="layui-btn btn-save" id="TaxScheme006_btn_save">保存</button>
                    <button type="button" class="layui-btn btn-submit" id="TaxScheme006_btn_submit">提交</button>
                    <a type="button" class="layui-btn btn-cancel" id="TaxScheme006_btn_cancel">取消</a>
                </div>
            </div>
        </form>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/taxparametermanage/taxscheme/TaxScheme006.js}" type="text/javascript"></script>
    </div>
</body>
</html>
