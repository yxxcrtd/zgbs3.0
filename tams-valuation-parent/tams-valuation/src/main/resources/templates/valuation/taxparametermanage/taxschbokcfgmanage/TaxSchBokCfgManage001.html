<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>基金类资产查询</title>
</head>
<body>
</body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a id="TaxSchBokCfgManage001_btn_add" class="layui-btn layui-btn-sm btn-create"
            data-th-text="#{SysCommon.create}">新建</a>
        <a id="TaxSchBokCfgManage001_btn_delete" class="layui-btn layui-btn-sm btn-delete"
           data-th-text="#{SysCommon.delete}">新建</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">记账场景</label>
                    <div class="layui-input-inline input-inline">
                        <select id="tableId" name="tableId"
                                class="layui-input form-input input-select"
                                data-th-data-result="${TABLE_ID}" multiple="multiple"
                                allowClear="true" data-th-placeholder="#{SysCommon.placeholder}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">增值税类型</label>
                    <div class="layui-input-inline input-inline">
                        <select id="vatType" name="vatType"
                                class="layui-input form-input input-select" allowClear="true"
                                placeholder="请选择，可多选" multiple="multiple"
                                data-th-data-result="${VAT_TYPE}">
                        </select>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div id="dataTable"></div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/taxparametermanage/taxschbokcfgmanage/TaxSchBokCfgManage001.js}" type="text/javascript"></script>
</div>
</html>
