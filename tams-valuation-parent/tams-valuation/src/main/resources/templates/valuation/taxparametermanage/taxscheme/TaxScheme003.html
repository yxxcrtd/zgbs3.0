<title>增值税则表</title>
</head>
<body>

        <form class="layui-form " id="dataForm">
            <div class="layui-form-item" style="display: none;">
                <input id="operateType" name="operateType"
                    class="layui-input form-input" placeholder="操作类型" data-th-value="${entity?.operateType}">
                <input id="seqNo" name="seqNo" class="layui-input form-input" placeholder="seqNo"
                    data-th-value="${entity?.seqNo}"> 
                <input id="schId" name="schId" class="layui-input form-input" placeholder="税务方案代码"
                    data-th-value="${entity?.schId}"> 
                <input type="text" id="workflowId" name="workflowId"  placeholder="流程 Id"
                            class="layui-input form-input" data-th-value="${entity?.workflowId}" >
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable"><span style="color: red"> * </span> 资产分类</label>
                    <div class="layui-input-inline input-inline">
                        <input id="assetClassify" name="assetClassify" class="layui-input form-input input-select"
                            allowClear="true" data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-data-result="${TAX_ASSET_TYPE}" data-th-value="${entity?.assetClassify}">
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable"> 本金收益特征</label>
                    <div class="layui-input-inline input-inline">
                        <input id="capiIncomeFeature" name="capiIncomeFeature"
                            class="layui-input form-input input-select" allowClear="true"
                            data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${AMT_INCOME_TYPE}"
                            data-th-value="${entity?.capiIncomeFeature}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable"><span style="color: red"> * </span> 收入类型</label>
                    <div class="layui-input-inline input-inline">
                        <input id="incomeType" name="incomeType" class="layui-input form-input input-checkbox"
                            placeholder="请输入" data-th-initvalue="${entity?.incomeType}"
                            data-th-data-result="${VAT_TYPE2}">
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable"><span style="color: red"> * </span> 应税标识</label>
                    <div class="layui-input-inline input-inline">
                        <input id="taxableSign" name="taxableSign" class="layui-input form-input input-checkbox"
                            placeholder="请输入" data-th-initvalue="${entity?.taxableSign}"
                            data-th-data-result="${TAXABLE_SIGN}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable"><span style="color: red;display : none" id= "span1"> * </span> 应税税率</label>
                    <div class="layui-input-inline input-inline">
                        <input id="taxRate" name="taxRate" class="layui-input form-input text-number" placeholder="请输入"
                            data-th-value="${entity?.taxRate}"><span class="input-right-show">%</span>
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable"><span style="color: red"> * </span> 规则生效日</label>
                    <div class="layui-input-inline input-inline">
                        <input id="effDate" name="effDate" class="layui-input form-input input-dateSelect"
                            placeholder="请输入" data-th-value="${entity?.effDate}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">免税收入类型</label>
                    <div class="layui-input-inline input-inline">
                        <input id="feeType" name="feeType" class="layui-input form-input input-select" allowClear="true"
                            data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${TAX_FREE_TYPE}"
                            data-th-value="${entity?.feeType}" >
                    </div>
                </div>
            </div>
            <div class="layui-row" style="margin: 50px;">
                <div class="text-center">
                    <button type="button" class="layui-btn btn-save" id="TaxScheme003_btn_save">保存</button>
                    <button type="button" class="layui-btn btn-submit" id="TaxScheme003_btn_submit">提交</button>
                    <a type="button" class="layui-btn btn-cancel" id="TaxScheme003_btn_cancel">取消</a>
                </div>
            </div>
        </form>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/taxparametermanage/taxscheme/TaxScheme003.js}" type="text/javascript"></script>
    </div>
</body>
</html>
