<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>场外期权交易</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form " id="submitForm">
        <div class="layui-form-item" style="display: none;">
            <input id="operateType" name="operateType" class="layui-input form-input" placeholder="操作类型"
                   data-th-value="${entity?.operateType}"/>
            <input type="text" id="workflowId" name="workflowId" placeholder="流程 Id"
                   class="layui-input form-input" data-th-value="${entity?.workflowId}"/>
        </div>
        <div class="layui-form-item">
             <div class="layui-inline layui-col-md6">
                 <label class="layui-form-label form-lable">交易编号</label>
                 <div class="layui-input-inline input-inline">
                     <input type="text" id=totleTradeId name="totleTradeId" data-th-required="true"
                         class="layui-input form-input" data-th-value="${entity?.totleTradeId}">
                 </div>
             </div>
             <div class="layui-inline layui-col-md6">
                 <label class="layui-form-label form-lable">合约标的</label>
                 <div class="layui-input-inline input-inline">
                     <input type="text" id="benchmarkId" name="benchmarkId" data-th-required="true"
                         class="layui-input form-input" data-th-value="${entity?.benchmarkId}">
                 </div>
             </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
				<label class="layui-form-label form-lable">账套代码</label>
				<div class="layui-input-inline input-inline">
<!-- 					<select id="booksetId" name="booksetId"
						class="layui-input form-input input-select"
						data-th-data-url="@{/valuation/basedata/marketdata/valotcopt/ValOtcOpt001/getBooksetId}" 
						placeholder="请输入内容" data-th-initValue="${entity?.booksetId}" > -->
						<input type="text" id="booksetId" name="booksetId" data-th-required="true"
                         class="layui-input form-input" data-th-value="${entity?.booksetId}">
					</select>
				</div>
			</div>
             <div class="layui-inline layui-col-md6">
                 <label class="layui-form-label form-lable">账套名称</label>
                 <div class="layui-input-inline input-inline">
                     <input type="text" id="booksetName" name="booksetName" data-th-required="true"
                         class="layui-input form-input" data-th-value="${entity?.booksetName}">
                 </div>
             </div>
        </div>
        <div class="layui-form-item">
             <div class="layui-inline layui-col-md6">
                 <label class="layui-form-label form-lable">交易方向</label>
                 <div class="layui-input-inline input-inline">
                     <input type="text" id="ps" name="ps"
                         class="layui-input form-input input-select" data-th-required="true"
                         data-th-data-result="${PS}" allowClear="true"
                         data-th-initValue="${entity?.ps}">
                 </div>
             </div>
	        <div class="layui-inline layui-col-md6">
	            <label class="layui-form-label form-lable">交易日期</label>
	            <div class="layui-input-inline input-inline">
	                <input type="text" id="tradeDate" name="tradeDate"
				           data-th-required="true"
				           class="layui-input form-input input-dateSelect"
				           data-th-value="${entity?.tradeDate}"  allowClear="true">
	            </div>
	        </div>
        </div>
        <div class="layui-form-item">
	        <div class="layui-inline layui-col-md6">
	            <label class="layui-form-label form-lable">结算日期</label>
	            <div class="layui-input-inline input-inline">
	                <input type="text" id="settleDate" name="settleDate"
				           data-th-required="true"
				           class="layui-input form-input input-dateSelect"
				           data-th-value="${entity?.settleDate}"  allowClear="true">
	            </div>
	        </div>
             <div class="layui-inline layui-col-md6">
                 <label class="layui-form-label form-lable">名义本金</label>
                 <div class="layui-input-inline input-inline">
                     <input type="text" id="shareAmt" name="shareAmt" data-th-required="true"
                         class="layui-input form-input text-number" data-th-value="${entity?.shareAmt}">
                 </div>
             </div>
        </div>
        <div class="layui-form-item">
             <div class="layui-inline layui-col-md6">
                 <label class="layui-form-label form-lable">行权价格</label>
                 <div class="layui-input-inline input-inline">
                     <input type="text" id="exePrice" name="exePrice" data-th-required="true"
                         class="layui-input form-input text-number" data-th-value="${entity?.exePrice}">
                 </div>
             </div>
             <div class="layui-inline layui-col-md6">
                 <label class="layui-form-label form-lable">期权费</label>
                 <div class="layui-input-inline input-inline">
                     <input type="text" id="fpriceAmt" name="fpriceAmt" data-th-required="true"
                         class="layui-input form-input text-number" data-th-value="${entity?.fpriceAmt}">
                 </div>
             </div>
        </div>
        <div class="layui-form-item">
             <div class="layui-inline layui-col-md6">
                 <label class="layui-form-label form-lable">期权费类型</label>
                 <div class="layui-input-inline input-inline">
                     <select id="optFeePayType" name="optFeePayType"
							class="layui-input form-input input-select"
							data-th-data-result="${OPT_FEE_PAY_TYPE}" allowClear="true"
							data-th-initValue="${entity?.optFeePayType}" placeholder="请输入内容" >
					  </select>
                 </div>
             </div>
            <div class="layui-inline layui-col-md6">
				<label class="layui-form-label form-lable">有效状态</label>
				<div class="layui-input-inline input-inline">
					<select id="activeState" name="activeState"
						class="layui-input form-input input-select"
						data-th-data-result="${TRADE_FLOW_STATUS}"  placeholder="请输入内容" 
						data-th-initValue="${entity?.activeState}" >
					</select>
				</div>
			</div>
        </div>
        <div class="layui-row" style="margin: 50px;">
            <div class="text-center">
                <a type="button" class="layui-btn btn-cancel" id="ValOtcOpt002_btn_cancel">取消</a>
            </div>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/basedata/marketdata/valotcopt/ValOtcOpt002.js}"
            type="text/javascript"></script>
</div>
</body>
</html>
