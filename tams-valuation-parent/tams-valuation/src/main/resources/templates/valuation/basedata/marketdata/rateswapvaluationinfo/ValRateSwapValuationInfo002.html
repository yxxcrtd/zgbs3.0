<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>利率互换估值信息</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form " id="dataForm">
        <div class="layui-form-item" style="display: none;">
            <input id="operateType" name="operateType" class="layui-input form-input" placeholder="操作类型"
                   data-th-value="${entity?.operateType}"/>
            <input type="text" id="workflowId" name="workflowId" placeholder="流程 Id"
                   class="layui-input form-input" data-th-value="${entity?.workflowId}"/>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"><span style="color: red"> * </span> 交易编号</label>
                <div class="layui-input-inline input-inline">
                    <select id="finprodId2" name="finprodId2" class="layui-input form-input input-select" allowClear="true"
                           data-th-placeholder="#{SysCommon.placeholder}" data-th-initValue="${entity?.finprodId2}"
                           data-th-data-url="@{/valuation/basedata/marketdata/rateswapvaluationinfo/ValRateSwapValuationInfo002/getFinprodId2}" >
                    </select>
                </div>
            </div>
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"><span style="color: red"> * </span> 估值日期</label>
                <div class="layui-input-inline input-inline">
                    <input id="valDate" name="valDate" class="layui-input form-input input-dateSelect"
                            allowClear="true" data-th-value="${entity?.valDate}"
                           data-th-placeholder="#{SysCommon.placeholder}">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"><span style="color: red"> * </span> 估值</label>
                <div class="layui-input-inline input-inline">
                    <input id="valuation" name="valuation" class="layui-input form-input text-number" 
                            allowClear="true" data-th-placeholder="#{SysCommon.placeholder}" data-textrange="14" maxlength="30"
                            data-th-value="${entity?.valuation}">
                </div>
            </div>
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"><span style="color: red"> * </span> 币种</label>
                <div class="layui-input-inline input-inline">
                    <select id="ccy" name="ccy" class="layui-input form-input input-select"
                            allowClear="true" data-th-data-result="${CCY}"
                            data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-initvalue="${entity?.ccy}">
                    </select>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <!-- <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable">估值模型</label>
                <div class="layui-input-inline input-inline">
                    <select id="valmodelId" name="valmodelId" class="layui-input form-input input-select"
                            allowClear="true" data-th-data-result="${VALUATION_METHOD}"
                            data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-initvalue="${entity?.valmodelId}">
                    </select>
                </div>
            </div> -->
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"><span style="color: red"> * </span> 估值来源</label>
                <div class="layui-input-inline input-inline">
                    <select id="datasourceType" name="datasourceType" class="layui-input form-input input-select"
                            allowClear="true" data-th-data-result="${VALUATION_SOURCE}"
                            data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-initvalue="${entity?.datasourceType}">
                    </select>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable">维护方式</label>
                <div class="layui-input-inline input-inline">
                    <select id="inputType" name="inputType" class="layui-input form-input input-select"
                            allowClear="true" data-th-data-result="${INPUT_TYPE}"
                            data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-initvalue="${entity?.inputType}">
                    </select>
                </div>
            </div>
        </div>
        <div class="layui-row" style="margin: 50px;">
            <div class="text-center">
                <button type="button" class="layui-btn btn-save" id="ValRateSwapValuationInfo002_btn_save">保存</button>
                <button type="button" class="layui-btn btn-submit" id="ValRateSwapValuationInfo002_btn_submit">提交
                </button>
                <a type="button" class="layui-btn btn-cancel" id="ValRateSwapValuationInfo002_btn_cancel">取消</a>
            </div>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/basedata/marketdata/rateswapvaluationinfo/ValRateSwapValuationInfo002.js}"
            type="text/javascript"></script>
</div>
</body>
</html>
