<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>债券估值行情详细</title>
</head>

<body>

<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <input type="hidden" id="valueSourceBfUpd" data-th-value="${entity?.valueSource}">
        <input type="hidden" id="valueDateBfUpd" data-th-value="${entity?.valueDate}">
        <input type="hidden" id="workflowId" name="workflowId" data-th-value="${entity?.workflowId}">
        <div class="layui-container">  
            <!-- 第1行 -->
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">资产代码</label>
					<div class="layui-input-inline input-inline">
                         <select id="secId" name="secId" data-th-required="true" placeholder="请选择"
                                 class="input-select"  data-th-data-url='@{getFinprodId}'
                            th:initValue="${entity?.secId}" data-th-disabled="${edit==null?false:true}" formatoption = "false">
                        </select>
					</div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">债券简称</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="finprodAbbr" name="finprodAbbr" disabled="disabled" data-th-required="true"
                            placeholder="请选择资产代码" 
                            data-th-value="${entity?.finprodAbbr}" class="layui-input form-input"></input>
                    </div>
                </div>
            </div>
            <!-- 第2行 -->
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">估值来源</label>
                    <div class="layui-input-inline input-inline">
                        <select id="valueSource" name="valueSource" class="input-select" data-th-required="true" 
                            placeholder="请选择" th:data-result="${VALUATION_SOURCE}"
                            th:initValue="${entity?.valueSource}" data-th-disabled="${newOrEdit}"></select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable">估值日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="valueDate" name="valueDate" data-th-required="true"
                            class="layui-input form-input input-dateSelect" placeholder="请选择"
                            data-th-value="${entity?.valueDate}" data-th-disabled="${newOrEdit}"></input>
                    </div>
                </div>
            </div>
            <!-- 第3行 -->
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label id="lastPeriodLable" class="layui-form-label form-lable">剩余期限</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="lastPeriod" name="lastPeriod" class="layui-input form-input text-number"
                            data-textrange="8" maxlength="12" data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-value="${entity?.lastPeriod}" data-th-disabled="${newOrEdit}"></input>
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label id="priceLabel" class="layui-form-label form-lable">市价全价</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="price" name="price" class="layui-input form-input text-number"
                            data-th-required="true" data-textrange="8" maxlength="12" data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-value="${entity?.price}" data-th-disabled="${newOrEdit}"></input>
                    </div>
                </div>
            </div>
            <!-- 第4行 -->
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label id="netpriceLabel" class="layui-form-label form-lable">市价净价</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="netprice" name="netprice" class="layui-input form-input text-number"
                            data-th-required="true" data-textrange="8" maxlength="12" data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-value="${entity?.netprice}" data-th-disabled="${newOrEdit}"></input>
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label id="mDurationLabel"class="layui-form-label form-lable">市价久期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="mDuration" name="mDuration" class="layui-input form-input text-number"
                            data-textrange="8" maxlength="12" data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-value="${entity?.mDuration}" data-th-disabled="${newOrEdit}"></input>
                    </div>
                </div>
            </div>
            <!-- 第5行 -->
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label id="mConvexityLabel" class="layui-form-label form-lable">市价凸性</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="mConvexity" name="mConvexity" class="layui-input form-input text-number"
                            data-textrange="8" maxlength="12" data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-value="${entity?.mConvexity}" data-th-disabled="${newOrEdit}"></input>
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label id="bpvalueLabel" class="layui-form-label form-lable">基点价值</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="bpvalue" name="bpvalue"  class="layui-input form-input text-number"
                            data-textrange="8" maxlength="12" data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-value="${entity?.bpvalue}" data-th-disabled="${newOrEdit}"></input>
                    </div>
                </div>
            </div>
            <!-- 第6行 -->
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label id="sdurationLabel" class="layui-form-label form-lable">利差久期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="sduration" name="sduration"  class="layui-input form-input text-number"
                            data-textrange="8" maxlength="12" data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-value="${entity?.sduration}" data-th-disabled="${newOrEdit}"></input>
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label id="scnvxtyLabel" class="layui-form-label form-lable">利差凸性</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="scnvxty" name="scnvxty"  class="layui-input form-input text-number"
                            data-textrange="8" maxlength="12" data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-value="${entity?.scnvxty}" data-th-disabled="${newOrEdit}"></input>
                    </div>
                </div>
            </div>
            <!-- 第7行 -->
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label id="interestDurationLabel" class="layui-form-label form-lable">利率久期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="interestDuration" name="interestDuration"  class="layui-input form-input text-number"
                            data-textrange="8" maxlength="12" data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-value="${entity?.interestDuration}" data-th-disabled="${newOrEdit}"></input>
                    </div>
                </div>
                <div class="layui-inline layui-col-md6">
                    <label id="interestCnvxtyLabel" class="layui-form-label form-lable">利率凸性</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="interestCnvxty" name="interestCnvxty"  class="layui-input form-input text-number"
                            data-textrange="8" maxlength="12" data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-value="${entity?.interestCnvxty}" data-th-disabled="${newOrEdit}"></input>
                    </div>
                </div>
            </div>
            <!-- 第8行 -->
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md6">
                    <label id="bpyieldLabel" class="layui-form-label form-lable">市价收益率</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="bpyield" name="bpyield"  class="layui-input form-input text-number"
                            data-textrange="8" maxlength="12" data-th-placeholder="#{SysCommon.placeholder}"
                            data-th-value="${entity?.bpyield}" data-th-disabled="${newOrEdit}"></input>
                    </div>
                </div>
            </div>
            <!-- 第9行，提交栏 -->
            <div class="layui-form-item"  style="margin: 50px;">
                <div class="text-center">
<!--                     <button type="button" class="layui-btn btn-save" id="ValuationMethodScheme002_btn_save">保存</button> -->
                    <button type="button" class="layui-btn btn-submit" id="ValBondValuationInfo003_btn_submit">提交</button>
                    <a type="button" class="layui-btn btn-cancel" id="ValBondValuationInfo003_btn_cancel">取消</a>
                </div>
            </div>
        </div>
    </form>
    
</div>
</body>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/basedata/marketdata/bondvaluationinfo/ValBondValuationInfo003.js}" type="text/javascript"></script>
</div>

</html>
