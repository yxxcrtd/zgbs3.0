<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{SystemActorRole001}">角色权限管理</title>
</head>
<body>
<div layout:fragment="content">
    <div class="layui-col-md12" style="margin:10px;">
        <a class="layui-btn layui-btn-sm btn-create">新建</a>
        <a class="layui-btn layui-btn-sm btn-filter">筛选</a>
    </div>
    <form class="layui-form joyin-form-wrap joyin-filter-form" id="searchForm">
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">通道代码</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" name="status" class="layui-input form-input">
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">通道名称</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" name="status" class="layui-input form-input">
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">查询履历</label>
                <div class="layui-input-inline input-inline">
                    <select class="input-select" placeholder="请选择" allowClear="true"> </select>
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">成立日期</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" class="layui-input form-input input-dateRangeSelect"/>
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">终止日期</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" class="layui-input form-input input-dateRangeSelect"/>
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <a class="layui-btn layui-btn-sm btn-search">查询</a>
                <a class="layui-btn layui-btn-sm btn-export">导出</a>
                <a class="layui-btn layui-btn-sm btn-reset">重置</a>
            </div>
        </div>
    </form>

    <div>
        <table class="layui-table" id="ValChannelManage001"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/basedata/businessdata/channel/ValNaturePerManage001.js}" type="text/javascript"></script>
</div>
</body>

</html>
