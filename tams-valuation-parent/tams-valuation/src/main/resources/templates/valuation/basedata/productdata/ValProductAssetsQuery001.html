<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>产品资产查询</title>
</head>
<body>
</body>
<div layout:fragment="content">
    <div class="form-button-area"></div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">金融工具类型</label>
                    <div class="layui-input-inline input-inline">
                        <select id="finprodType" name="finprodType" class="layui-input form-input input-select"
                            placeholder="请输入内容" data-th-data-result="${FINPROD_TYPE}" allowClear="true" multiple="true">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">金融工具代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="finprodId" name="finprodId" class="layui-input form-input" value=""
                            placeholder="请输入内容">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">金融工具名称</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="finprodName" name="finprodName" class="layui-input form-input" value=""
                            placeholder="请输入内容">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">起息日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="vDate" name="vDate" placeholder="请选择、支持区间"
                            class="layui-input form-input input-dateRangeSelect" value="">
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">到期日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="mDate" name="mDate" placeholder="请选择、支持区间"
                            class="layui-input form-input input-dateRangeSelect" value="">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div id="dataTable"></div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/basedata/productdata/ValProductAssetsQuery001.js}" type="text/javascript"></script>
</div>
</html>
