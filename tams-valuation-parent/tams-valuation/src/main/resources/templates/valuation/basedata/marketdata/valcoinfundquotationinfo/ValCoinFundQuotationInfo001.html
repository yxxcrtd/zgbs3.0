<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ValCoinFundQuotationInfo001.title}">货币型基金行情信息</title>
</head>
<body>
     <div layout:fragment="content">
     <div class='layui-fluid'>
       <div class="form-button-area" >
            <a id="ValCoinFundQuotationInfo001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
            <a id="ValCoinFundQuotationInfo001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}"  style="display:none;">删除</a>
       </div>
       <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
        <form class="layui-form "  id="submitForm" >
            <div class="layui-form-item">       
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{ValCoinFundQuotationInfo001.finprodId}">基金代码</label>
                     <div class="layui-input-inline input-inline">
                      <input type="text" id="finprodId" maxlength="32" name="finprodId" class="layui-input form-input input-lenovoselect" placeholder="请输入内容" 
                      data-th-placeholder="#{SysCommon.placeholder}" data-th-data-url="@{/valuation/basedata/marketdata/valcoinfundquotationinfo/ValCoinFundQuotationInfo001/getCodeName}" 
                      data-idfield="name" data-keyfield="name" data-th-data-effectivefieldsalias='|{"code":"#{ValCoinFundQuotationInfo001.productCode}","shortName":"#{ValCoinFundQuotationInfo001.productName}"}|'>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{ValCoinFundQuotationInfo001.fundManager}">基金管理人</label>
                    <div class="layui-input-inline input-inline">
                    	<input type="text" id="fundManager" name="fundManager" maxlength="66" class="layui-input form-input input-lenovoselect" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" data-th-data-url="@{/valuation/basedata/marketdata/valcoinfundquotationinfo/ValCoinFundQuotationInfo001/getManagement}" data-idfield="shortName" data-keyfield="shortName" data-th-data-effectivefieldsalias='|{"code":"#{ValCoinFundQuotationInfo001.customCode}","shortName":"#{ValCoinFundQuotationInfo001.customName}"}|'>
                    </div>
                </div> 
             	<div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{ValCoinFundQuotationInfo001.valDate}">估值日</label>
                    <div class="layui-input-inline input-inline">
                        <input id="valDate" name="valDate" class="layui-input form-input input-dateSelect" placeholder="请选择时间">
                    </div>
                </div> 
             </div>
            </form>   
        </div> 
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
       </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/basedata/marketdata/valcoinfundquotationinfo/ValCoinFundQuotationInfo001.js}" type="text/javascript"></script>
    </div>                                
</body>

</html>
