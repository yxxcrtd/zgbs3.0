<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>基金估值行情</title>
</head>
<body>
    <div layout:fragment="content">
	    <div class="form-button-area" >
	    </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">基金 </label>
                    <div class="layui-input-inline input-inline">
                      <input type="text" id="finprodId" name="finprodId" class="layui-input form-input" value="" placeholder="请输入内容">
                    </div>
                </div>
                <!-- <div class="layui-inline layui-col-md3">
                    <label class="layui-form-label form-lable">基金名称</label>
                    <div class="layui-input-inline input-inline">
                      <input type="text" id="fundAbbr" name="fundAbbr" class="layui-input form-input" value="" placeholder="请输入">
                    </div>
                </div> -->
                    <div class="layui-inline layui-col-md4 col-inline">
                        <label class="layui-form-label form-lable"> 基金类型 </label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="fundtype" class="layui-input form-input input-select"
                                placeholder="请选择" data-th-data-result="${FUND_TYPE}"
                                 allowClear="true">
                                 <option></option>
                             </select>
                        </div>
                    </div>
                    <!-- <div class="layui-inline layui-col-md3 col-inline">
                        <label class="layui-form-label form-lable"> 估值来源 </label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="intRateId" class="layui-input form-input input-select"
                                placeholder="请选择" data-th-data-result="${VALUATION_SOURCE}"
                              allowClear="true"><option></option></select>
                        </div>
                    </div> -->
                    <div class="layui-inline layui-col-md4 col-inline">
                        <label class="layui-form-label form-lable"> 估值日期 </label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="valuationDate" 
                            placeholder="请选择、支持区间"
                            class="layui-input form-input input-dateRangeSelect"
                                allowClear="true" />
                        </div>
                    </div>
                </div> 
            </form>
        </div>
        <div>
	        <table id="dataTable"></table>
	    </div>
    </div>
</body>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/basedata/marketdata/finproductvaluation/ValFinProductValuation001.js}"
        type="text/javascript"></script>
</div>
</html>
