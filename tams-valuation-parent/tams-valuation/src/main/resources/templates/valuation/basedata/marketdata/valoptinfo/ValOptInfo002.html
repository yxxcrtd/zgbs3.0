<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>场外期权标的</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form " id="submitForm">
        <div class="layui-form-item" style="display: none;">
            <input id="operateType" name="operateType" class="layui-input form-input" placeholder="操作类型"
                   data-th-value="${entity?.operateType}"/>
            <input type="text" id="workflowId" name="workflowId" placeholder="流程 Id"
                   class="layui-input form-input" data-th-value="${entity?.workflowId}"/>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"> 交易编号</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="finprodId" name="finprodId" data-th-required="true"
                           class="layui-input form-input" data-th-value="${entity?.finprodId}" disabled="disabled">
                </div>
            </div> 
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"> 期权标的类型</label>
                <div class="layui-input-inline input-inline">
                    <select type="text"  id="finprodType2" name="finprodType2"
							class="layui-input form-input input-select"
							data-th-data-result="${FINPROD_TYPE_TG}" allowClear="true"
							placeholder="请输入内容" data-th-initValue="${entity?.finprodType2}" >
						</select>
                </div>
            </div> 
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"> 合约类型</label>
                <div class="layui-input-inline input-inline">
                    <select type="text"  id="type6" name="type6"
							class="layui-input form-input input-select"
							data-th-data-result="${STRUCTURE_TYPE}" allowClear="true"
							placeholder="请输入内容" data-th-initValue="${entity?.type6}" >
						</select>
                </div>
            </div>
			<div class="layui-inline layui-col-md6">
				<label class="layui-form-label form-lable">起息日</label>
				<div class="layui-input-inline input-inline">
					<input type="text" id="vdate" name="vdate"
						class="layui-input form-input input-dateSelect" value=""
						placeholder="请选择" data-th-value="${entity?.vdate}" >
				</div>
			</div>
        </div>
        <div class="layui-form-item">
			<div class="layui-inline layui-col-md6">
				<label class="layui-form-label form-lable">到期日</label>
				<div class="layui-input-inline input-inline">
					<input type="text" id="mdate" name="mdate"
						class="layui-input form-input input-dateSelect" value=""
						placeholder="请选择" data-th-value="${entity?.mdate}" >
				</div>
			</div>
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"> 交易方向</label>
                <div class="layui-input-inline input-inline">
                    <select  type="text"  id="extPs" name="extPs"
							class="layui-input form-input input-select"
							data-th-data-result="${PS}" allowClear="true"
							placeholder="请输入内容" data-th-initValue="${entity?.extPs}" >
						</select>
                </div>
            </div> 
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"> 币种</label>
                <div class="layui-input-inline input-inline">
                    <select type="text"  id="ccy" name="ccy"
							class="layui-input form-input input-select"
							data-th-data-result="${CCY}" allowClear="true"
							placeholder="请输入内容" data-th-initValue="${entity?.ccy}" >
						</select>
                </div>
            </div> 
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"> 期限</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="term" name="term" data-th-required="true"
                           class="layui-input form-input" data-th-value="${entity?.term}" >
                </div>
            </div> 
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"> 合同编号</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="contractNo" name="contractNo" data-th-required="true"
                           class="layui-input form-input" data-th-value="${entity?.contractNo}" >
                </div>
            </div> 
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"> 合同名称</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="contractName" name="contractName" data-th-required="true"
                           class="layui-input form-input" data-th-value="${entity?.contractName}" >
                </div>
            </div> 
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"> 交易日历</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="calendarName" name="calendarName" data-th-required="true"
                           class="layui-input form-input" data-th-value="${entity?.calendarName}" >
                </div>
            </div> 
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"> 数量</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="prin" name="prin" data-th-required="true"
                           class="layui-input form-input text-number" data-th-value="${entity?.prin}" >
                </div>
            </div> 
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"> 交易场所</label>
                <div class="layui-input-inline input-inline">
                    <select type="text"  id="tradeMarket" name="tradeMarket"
							class="layui-input form-input input-select"
							data-th-data-result="${VALUATION_TRADE_MARKET}" allowClear="true"
							placeholder="请输入内容" data-th-initValue="${entity?.tradeMarket}" >
						</select>
                </div>
            </div> 
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"> 登记托管机构</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="registOrg" name="registOrg" data-th-required="true"
                           class="layui-input form-input" data-th-value="${entity?.registOrg}" >
                </div>
            </div> 
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"> 期权费类型</label>
                <div class="layui-input-inline input-inline">
                    <select type="text"  id="optFeePayType" name="optFeePayType"
							class="layui-input form-input input-select"
							data-th-data-result="${OPT_FEE_PAY_TYPE}" allowClear="true"
							placeholder="请输入内容" data-th-initValue="${entity?.optFeePayType}" >
						</select>
                </div>
            </div> 
            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"> 期权费率</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="optFeeRate" name="optFeeRate" data-th-required="true"
                           class="layui-input form-input text-number" data-th-value="${entity?.optFeeRate}" >
                </div>
            </div> 
        </div>
        <div class="layui-row" style="margin: 50px;">
            <div class="text-center">
<!--                 <button type="button" class="layui-btn btn-save" id="ValOptInfo002_btn_save">保存</button>
                <button type="button" class="layui-btn btn-submit" id="ValOptInfo002_btn_submit">提交</button> -->
                <a type="button" class="layui-btn btn-cancel" id="ValOptInfo002_btn_cancel">取消</a>
            </div>
        </div>
    </form>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/basedata/marketdata/valoptinfo/ValOptInfo002.js}"
            type="text/javascript"></script>
</div>
</body>
</html>
