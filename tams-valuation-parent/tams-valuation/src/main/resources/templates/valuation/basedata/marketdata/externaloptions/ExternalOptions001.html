<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <meta charset="UTF-8">
    <title>场外期权</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a id="ValFxValuztionInfo001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
        <a id="ExternalOptions001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}">删除</a>
        <a id="ExternalOptions001_btn_import" class="layui-btn layui-btn-sm btn-import btn-default">导入</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="searchForm">
            <div class="layui-form-item">

                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">合约标的</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="targetId" name="targetId" class="layui-input form-input input-lenovoselect" allowClear="true"
                               data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-data-url="findTargetId"
                               data-idfield="code" data-keyfield="code"
                               data-th-data-effectivefieldsalias='|{"code":"现金流代码"}|'
                               data-th-value="${entity?.targetId}"
                        >
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">估值日</label>
                    <div class="layui-input-inline input-inline">
                        <input id="valDate" name="valDate" class="layui-input form-input input-dateSelect"
                               allowClear="true" data-th-value="${entity?.valDate}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
            	<div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">交易编号</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="finprodId" name="finprodId" class="layui-input form-input input-lenovoselect" allowClear="true"
                               data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-data-url="findFinprodId"
                               data-idfield="code" data-keyfield="code"
                               data-th-data-effectivefieldsalias='|{"code":"交易编号"}|'
                               data-th-value="${entity?.finprodId}"
                        >
                    </div>
                </div>
            </div>
        </form>
    </div>
    <table class="layui-table" id="dataTable"></table>
</div>
</body>
<div layout:fragment="script">
    <script
            data-th-src="@{/js/valuation/basedata/marketdata/externaloptions/ExternalOptions001.js}"
            type="text/javascript"></script>
</div>
</html>
