<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ValBondQuotationInfo002}">债券行情信息新建</title>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
                <div class="pro-module-wrapper pro-module-base">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title"> <span class="title-des">基本信息</span> （<span class="star-sign">*</span>必填）
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{ValBondQuotationInfo001.secId}">资产代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <!-- <input type="text" id="secId" name="secId"
                                                class="layui-input form-input input-lenovoselect" allowClear="true"
                                                placeholder="请输入内容" required data-th-value='${entity?.secId}'
                                                data-th-data-url="@{/valuation/basedata/marketdata/valbondquotationinfo/ValBondQuotationInfo002/getSecIdToNew}"
                                                data-th-placeholder="#{SysCommon.placeholder}" data-idfield="code"
                                                data-keyfield="code" data-callback="selectCallback"
                                                data-th-data-effectivefieldsalias='|{"code":"#{ValBondQuotationInfo001.secId}","shortName":"#{ValBondQuotationInfo001.finprodAbbr}"}|' /> -->
                                       
                                       <select type="text" id="secId" name="secId"
                               class="layui-input form-input input-select" placeholder="请输入内容" data-th-parentids="profitType"
                               data-th-data-url="@{/valuation/basedata/marketdata/valbondquotationinfo/ValBondQuotationInfo002/getAssetCodeList}"
                               required="required" data-th-initValue="${entity?.secId}">
                          </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{ValBondQuotationInfo001.finprodAbbr}">债券简称</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" readonly="readonly" id="finprodAbbr" name="finprodAbbr"
                                                class="layui-input form-input" data-th-value='${entity?.finprodAbbr}'
                                                placeholder="请输入内容" required disabled>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{ValBondQuotationInfo002.valueDate}">估值日期</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="valueDate" name="valueDate"
                                                class="layui-input form-input input-dateSelect"
                                                data-th-value='${#dates.format(entity?.valueDate,"yyyy-MM-dd")}'
                                                placeholder="请输入内容" required>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{ValBondQuotationInfo002.lastPeriod}">剩余期限</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="lastPeriod" name="lastPeriod"
                                                class="layui-input form-input text-number" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value='${entity?.lastPeriod}' data-textrange="14" maxlength="30">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{ValBondQuotationInfo002.price}">市场全价</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="price" name="price" class="layui-input form-input text-number"
                                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                required data-th-value='${entity?.price}' data-textrange="14"
                                                maxlength="30">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{ValBondQuotationInfo002.netprice}">市价净价</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="netprice" name="netprice"
                                                class="layui-input form-input text-number" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" required
                                                data-th-value='${entity?.netprice}' data-textrange="14" maxlength="30">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{ValBondQuotationInfo002.mDuration}">市价久期</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="mDuration" name="mDuration"
                                                class="layui-input form-input text-number" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value='${entity?.mDuration}' data-textrange="14" maxlength="30">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{ValBondQuotationInfo002.mConvexity}">市价凸性</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="mConvexity" name="mConvexity"
                                                class="layui-input form-input text-number" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value='${entity?.mConvexity}' data-textrange="14" maxlength="30">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{ValBondQuotationInfo002.bpvalue}">基点价值</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="bpvalue" name="bpvalue"
                                                class="layui-input form-input text-number" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                data-th-value='${entity?.bpvalue}' data-textrange="14" maxlength="30">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{ValBondQuotationInfo002.sduration}">利差久期</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="sduration" name="sduration"
                                                class="layui-input form-input text-number" placeholder="请输入内容"
                                                data-th-value='${entity?.sduration}'
                                                data-th-placeholder="#{SysCommon.placeholder}" data-textrange="14"
                                                maxlength="30">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{ValBondQuotationInfo002.scnvxty}">利差凸性</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="scnvxty" name="scnvxty"
                                                class="layui-input form-input text-number" placeholder="请输入内容"
                                                data-th-value='${entity?.scnvxty}'
                                                data-th-placeholder="#{SysCommon.placeholder}" data-textrange="14"
                                                maxlength="30">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{ValBondQuotationInfo002.interestDuration}">利率久期</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="interestDuration" name="interestDuration"
                                                class="layui-input form-input text-number"
                                                data-th-value='${entity?.interestDuration}' placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" data-textrange="14"
                                                maxlength="30">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{ValBondQuotationInfo002.interestCnvxty}">利率凸性</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="interestCnvxty" name="interestCnvxty"
                                                class="layui-input form-input text-number"
                                                data-th-value='${entity?.interestCnvxty}' placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" data-textrange="14"
                                                maxlength="30">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											data-th-text="#{ValBondQuotationInfo002.valueSource}">估值来源</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="valueSource" name="valueSource" data-th-data-result='${VALUATION_SOURCE}'
												data-th-initValue="${entity?.valueSource}" required
												class="layui-input form-input input-select" allowClear="true"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}"></select>
										</div>
									</div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable"
                                            data-th-text="#{ValBondQuotationInfo002.bpyield}">市价收益率%</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="bpyield" name="bpyield"
                                                class="layui-input form-input text-number"
                                                data-th-value='${entity?.bpyield}' placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" data-textrange="14"
                                                maxlength="30"/>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
	        <div class="layui-form-item">
                <div align="center" style="height:50px;padding-top: 10px;">
                    <a id="ValBondQuotationInfo002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
                    <a id="ValBondQuotationInfo002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                    <a id="ValBondQuotationInfo002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/basedata/marketdata/valbondquotationinfo/ValBondQuotationInfo002.js}" type="text/javascript"></script>
    </div>
</body>
</html>
