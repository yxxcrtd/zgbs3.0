<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	  xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	  layout:decorate="~{layout/default}">
<head>
	<meta charset="UTF-8">
	<title>计划类资产净值信息</title>
</head>

<body>
<div layout:fragment="content">
	<div class="form-button-area">
		<a id="ValNetPlanQuotation001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
		<a id="ValNetPlanQuotation001_btn_edit" class="layui-btn layui-btn-sm btn-edit" data-th-text="#{SysCommon.modify}">修改</a>
		<a id="ValNetPlanQuotation001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}">删除</a>
	</div>
	<div class="joyin-form-wrap joyin-filter-form condition-area">
		<form class="layui-form" id="searchForm">
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-lable">资产代码</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="finprodId" name="finprodId"
							   class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
							   data-th-placeholder="#{SysCommon.placeholder}"
							   data-th-data-url="getFinprodId"
							   data-idfield="code" data-keyfield="code"
							   data-th-data-effectivefieldsalias='|{"code":"#{ValManualVoucher.busiId}","shortName":"#{ValManualVoucher.busiName}"}|'
							   data-th-Value="${finprodId}"
						>
					</div>
				</div>

				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-lable">资产名称</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="finprodAbbr" name="finprodAbbr" placeholder="请输入内容"
							   class="layui-input form-input"
							   data-th-Value="${finprodAbbr}"
						>
					</div>
				</div>

			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md6">
					<label class="layui-form-label form-lable">行情日期</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="valueDate" name="valueDate"
							   placeholder="请选择日期"
							   class="layui-input form-input input-dateRangeSelect"
							   allowClear="true">
					</div>
				</div>
			</div>
		</form>
	</div>
	<div>
		<table id="dataTable"></table>
	</div>
</div>
</body>
<div layout:fragment="script">
	<script
			data-th-src="@{/js/valuation/basedata/marketdata/netplanquotation/ValNetPlanQuotation001.js}"
			type="text/javascript"></script>
</div>

</html>
