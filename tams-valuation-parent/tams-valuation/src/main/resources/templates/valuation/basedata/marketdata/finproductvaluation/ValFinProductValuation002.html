<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>利率信息</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" style="padding: 10px 0;" id="submitForm" >
            <input type="hidden" id="finprodId" name="busVouchnum" data-th-value="${entity?.finprodId}">
            <input type="hidden" id="finprodType" name="busVouchnum" data-th-value="${entity?.finprodTypeFmt}">
<!--             <input type="hidden" id="valType" name="busVouchnum" data-th-value="${entity?.valType}"> -->
            <input type="hidden" id="valuation" name="busVouchnum" data-th-value="${entity?.valuation}">
            <input type="hidden" id="publishDate" name="busVouchnum" data-th-value="${entity?.publishDate}">
            <input type="hidden" id="valDate" name="busVouchnum" data-th-value="${entity?.valDate}">
             <input type="hidden" id="type1" name="busVouchnum" data-th-value="${entity?.type1Fmt}">
        </form>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</body>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/valuation/basedata/marketdata/finproductvaluation/ValFinProductValuation002.js}"
        type="text/javascript"></script>
</div>
</html>
