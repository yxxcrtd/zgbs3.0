<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>场外期权交易</title>
</head>
<body>

</body>
<div layout:fragment="content">
	<div class="form-button-area" export="true">
<!-- 	    <button type="button" class="layui-btn layui-btn-sm btn-default" id="ValOtcOpt001_btn_Revoke"></i>撤销</button> -->
	</div>
	<div class="joyin-form-wrap joyin-filter-form condition-area">
		<form class="layui-form" id="searchForm">
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">账套代码</label>
					<div class="layui-input-inline input-inline">
						<select id="booksetId" name="booksetId"
							class="layui-input form-input input-select"
							data-th-data-url="@{/valuation/basedata/marketdata/valotcopt/ValOtcOpt001/getBooksetId}" 
							allowClear="true" placeholder="请输入内容" >
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">交易编号</label>
					<div class="layui-input-inline input-inline">
                        <input type="text" id="totleTradeId" name="totleTradeId" class="layui-input form-input input-lenovoselect" allowClear="true"
                               data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-data-url="@{/valuation/basedata/marketdata/valotcopt/ValOtcOpt001/getTotleTradeId}" 
                               data-idfield="code" data-keyfield="code"
                               data-th-data-effectivefieldsalias='|{"code":"交易编号"}|'
                               data-th-value="${entity?.totleTradeId}"
                        >
                    </div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">合约标的</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="benchmarkId" name="benchmarkId" class="layui-input form-input input-lenovoselect" allowClear="true"
                               data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-data-url="@{/valuation/basedata/marketdata/valotcopt/ValOtcOpt001/getBenchmarkId}" 
                               data-idfield="code" data-keyfield="code"
                               data-th-data-effectivefieldsalias='|{"code":"合约标的"}|'
                               data-th-value="${entity?.benchmarkId}"
                        >
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">交易方向</label>
					<div class="layui-input-inline input-inline">
						<select id="ps" name="ps"
							class="layui-input form-input input-select"
							data-th-data-result="${PS}" allowClear="true"
							placeholder="请输入内容" >
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">交易日期</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="tradeDate" name="tradeDate"
							class="layui-input form-input input-dateRangeSelect" value=""
							placeholder="请选择，支持区间">
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">期权费类型</label>
					<div class="layui-input-inline input-inline">
						<select id="optFeePayType" name="optFeePayType"
							class="layui-input form-input input-select"
							data-th-data-result="${OPT_FEE_PAY_TYPE}" allowClear="true"
							placeholder="请输入内容" >
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">有效状态</label>
					<div class="layui-input-inline input-inline">
						<select id="activeState" name="activeState"
							class="layui-input form-input input-select"
							data-th-data-result="${TRADE_FLOW_STATUS}" allowClear="true"
							placeholder="请输入内容" >
						</select>
					</div>
				</div>
			</div>
		</form>
	</div>
	<div id="dataTable"></div>
</div>
<div layout:fragment="script">
	<script
		data-th-src="@{/js/valuation/basedata/marketdata/valotcopt/ValOtcOpt001.js}"
		type="text/javascript"></script>
</div>
</html>
