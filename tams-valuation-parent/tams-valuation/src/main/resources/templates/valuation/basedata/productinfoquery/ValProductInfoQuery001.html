<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>产品资产查询</title>
</head>
<body>

</body>
<div layout:fragment="content">
	<div class="form-button-area" export="true"></div>
	<div class="joyin-form-wrap joyin-filter-form condition-area">
		<form class="layui-form" id="searchForm">
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">产品类型</label>
					<div class="layui-input-inline input-inline">
						<select id="profitType" name="profitType"
							class="layui-input form-input input-select"
							data-th-data-result="${PROFIT_TYPE}" allowClear="true"
							multiple="multiple" placeholder="请输入内容" formatoption="true">
						</select>
					</div>
				</div>
<!-- 				<div class="layui-inline layui-col-md4">
					可能需要隐藏 style="display:none"
					<label class="layui-form-label form-lable">募集方式</label>
					<div class="layui-input-inline input-inline">
						                       <input type="text" id="raiseType" name="raiseType" class="layui-input form-input input-checkbox" 
						                              data-th-data-result="${RAISE_TYPE}" 
						                              data-th-initValue="${raiseType}"
						                              allowClear="true">
						                       </input>
						<select id="raiseType" name="raiseType"
							class="layui-input form-input input-select"
							data-th-data-result='${RAISE_TYPE}' allowClear="true"
							multiple="multiple" placeholder="请输入内容"
							data-th-placeholder="#{SysCommon.placeholder}">
						</select>
					</div>
				</div> -->
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">发行方式</label>
					<div class="layui-input-inline input-inline">
						<!-- <input type="text" id="issueType" name="issueType" class="layui-input form-input input-checkbox"
                                 data-th-placeholder="#{SysCommon.placeholder}"
                                 data-th-data-result="${ISSUE_TYPE}" 
                                 data-th-initValue="${issueType}" allowClear="true">-->
						<select id="issueType" name="issueType"
							class="layui-input form-input input-select"
							data-th-data-result="${ISSUE_TYPE}" allowClear="true"
							multiple="multiple" placeholder="请输入内容">
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">产品</label>
					<div class="layui-input-inline input-inline">
						<select id="finprodId" name="finprodId"
							class="layui-input form-input input-select"
							data-th-data-url="@{/valuation/basedata/productinfoquery/ValProductInfoQuery001/getFinprodId}" multiple="multiple"
							allowClear="true" placeholder="请输入内容" formatoption="true">
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">起息日</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="vdate" name="vdate"
							class="layui-input form-input input-dateRangeSelect" value=""
							placeholder="请选择，支持区间">
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">到期日</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="mdate" name="mdate"
							class="layui-input form-input input-dateRangeSelect" value=""
							placeholder="请选择，支持区间">
					</div>
				</div>
			</div>
<!-- 			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4">

					<div class="layui-input-inline input-inline">
						<select id="investType" name="investType"
							class="layui-input form-input input-select"

							multiple="multiple" placeholder="请输入内容">
						</select>
					</div>
				</div>
			</div> -->
		</form>
	</div>
	<div id="dataTable"></div>
</div>
<div layout:fragment="script">
	<script
		data-th-src="@{/js/valuation/basedata/productinfoquery/ValProductInfoQuery001.js}"
		type="text/javascript"></script>
</div>
</html>
