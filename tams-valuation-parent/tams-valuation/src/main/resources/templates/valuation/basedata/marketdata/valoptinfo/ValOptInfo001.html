<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>场外期权标的</title>
</head>
<body>

</body>
<div layout:fragment="content">
	<div class="form-button-area" export="true">
            <a id="ValOptInfo001_btn_delete" class="layui-btn layui-btn-sm btn-delete" >删除</a>
	</div>
	<div class="joyin-form-wrap joyin-filter-form condition-area">
		<form class="layui-form" id="searchForm">
			<div class="layui-form-item">
            	<div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable">交易编号</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="finprodId" name="finprodId" class="layui-input form-input input-lenovoselect" allowClear="true"
                               data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-data-url="findFinprodId"
                               data-idfield="code" data-keyfield="code"
                               data-th-data-effectivefieldsalias='|{"code":"交易编号"}|'
                               data-th-value="${entity?.finprodId}"
                        >
                    </div>
                </div>
<!-- 				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">期权标的类型</label>
					<div class="layui-input-inline input-inline">
						<select id="finprodType2" name="finprodType2"
							class="layui-input form-input input-select"
							data-th-data-result="${FINPROD_TYPE_TG}" allowClear="true"
							placeholder="请输入内容" >
						</select>
					</div>
				</div> -->
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">起息日</label>
					<div class="layui-input-inline input-inline">
						<input type="text" id="vdate" name="vdate"
							class="layui-input form-input input-dateSelect" value=""
							placeholder="请选择">
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">交易方向</label>
					<div class="layui-input-inline input-inline">
						<select id="extPs" name="extPs"
							class="layui-input form-input input-select"
							data-th-data-result="${PS}" allowClear="true"
							placeholder="请输入内容" >
						</select>
					</div>
				</div>
			</div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">币种</label>
					<div class="layui-input-inline input-inline">
						<select id="ccy" name="ccy"
							class="layui-input form-input input-select"
							data-th-data-result="${CCY}" allowClear="true"
							placeholder="请输入内容" >
						</select>
					</div>
				</div>
				<div class="layui-inline layui-col-md4">
					<label class="layui-form-label form-lable">期权费类型</label>
					<div class="layui-input-inline input-inline">
						<select id="optFeePayType" name="optFeePayType"
							class="layui-input form-input input-select"
							data-th-data-result="${OPT_FEE_PAY_TYPE}" allowClear="true"
							placeholder="请输入内容" >
						</select>
					</div>
				</div>
			</div>
		</form>
	</div>
	<div id="dataTable"></div>
</div>
<div layout:fragment="script">
	<script
		data-th-src="@{/js/valuation/basedata/marketdata/valoptinfo/ValOptInfo001.js}"
		type="text/javascript"></script>
</div>
</html>
