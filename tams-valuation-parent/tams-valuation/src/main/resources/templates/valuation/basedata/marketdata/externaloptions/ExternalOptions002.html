<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>场外期权</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form " id="dataForm">
        <div class="layui-form-item" style="display: none;">
            <input id="operateType" name="operateType" class="layui-input form-input" placeholder="操作类型"
                   data-th-value="${entity?.operateType}"/>
            <input type="text" id="workflowId" name="workflowId" placeholder="流程 Id"
                   class="layui-input form-input" data-th-value="${entity?.workflowId}"/>
        </div>
        <div class="layui-form-item">



            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"><span style="color: red"> * </span> 合约标的</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="targetId" name="targetId" class="layui-input form-input input-lenovoselect" allowClear="true"
                           data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-data-url="getFinprodId"
                           data-idfield="code" data-keyfield="code"
                           data-th-data-effectivefieldsalias='|{"code":"现金流代码","shortName":"交易编号"}|'
                           data-th-value="${entity?.targetId}"
                    >
                </div>
            </div>

            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"><span style="color: red"> * </span> 交易编号</label>
                <div class="layui-input-inline input-inline">

                    <input type="text" id="finprodId2" name="finprodId2" data-th-value="${entity?.finprodId2}" class="layui-input form-input input-lenovoselect">
                </div>
            </div>



            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"><span style="color: red"> * </span>期权价值</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="valuation" name="valuation"  class="layui-input form-input text-number" placeholder="请输入" 
                            data-th-value="${entity?.valuation}"  allowClear="true">
                </div>
            </div>


                <div class="layui-inline layui-col-md6">
                    <label class="layui-form-label form-lable"><span style="color: red"> * </span> 估值日期</label>
                    <div class="layui-input-inline input-inline">
                        <input id="valDate" name="valDate" class="layui-input form-input input-dateSelect"
                               allowClear="true" data-th-value="${entity?.valDate}">
                    </div>
                </div>

            <div class="layui-inline layui-col-md6">
                <label class="layui-form-label form-lable"><span style="color: red"> * </span> 公布日期</label>
                <div class="layui-input-inline input-inline">
                    <input id="publishDate" name="publishDate" class="layui-input form-input input-dateSelect"
                           allowClear="true" data-th-value="${entity?.publishDate}">
                </div>
            </div>

        </div>



            <div class="layui-row" style="margin: 50px;">
                <div class="text-center">
                    <button type="button" class="layui-btn btn-save" id="ExternalOptions002_btn_save">保存</button>
                    <button type="button" class="layui-btn btn-submit" id="ExternalOptions002_btn_submit">提交
                    </button>
                    <a type="button" class="layui-btn btn-cancel" id="ValFxValuztionInfo002_btn_cancel">取消</a>
                </div>
            </div>

    </form>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/basedata/marketdata/externaloptions/ExternalOptions002.js}"
            type="text/javascript"></script>
</div>
</body>
</html>
