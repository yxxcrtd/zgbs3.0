<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title>收益型产品</title>
<style type="text/css">
.layui-colla-icon {
	right: 15px;
	left: auto;
}

.layui-colla-title a {
	padding-left: 5px;
	border-left: 4px solid #4893e6;
}
</style>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="submitForm" style="background: #ffffff; padding: 10px 0;">
            <fieldset class="layui-elem-field layui-field-title" style="margin-top: 1px;">
                <!-- <legend><a href="javascript:;">基本信息</a></legend> -->
                <div class="layui-collapse">
                    <div class="layui-colla-item">
                        <h2 class="layui-colla-title">
                            <a href="javascript:;">基本信息</a>
                        </h2>
                        <div class="layui-colla-content layui-show">
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">产品代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodId" name="finprodId"
                                            class="layui-input form-input" data-th-value="${entity?.finprodId}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">挂钩母产品</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="pFinprodName" name="pFinprodName"
                                            class="layui-input form-input" data-th-value="${entity?.pFinprodName}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">投资组合</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="acctSubjectName" name="acctSubjectName"
                                            class="layui-input form-input" data-th-value="${entity?.acctSubjectName}" >
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">产品名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodName" name="finprodName"
                                            class="layui-input form-input" data-th-value="${entity?.finprodName}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">产品简称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodAbbr" name="finprodAbbr"
                                            class="layui-input form-input" data-th-value="${entity?.finprodAbbr}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">产品登记编码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="finprodId" name="finprodId"
                                            class="layui-input form-input" data-th-value="${entity?.finprodId}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">发行方式</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="issueType" name="issueType"
                                            class="layui-input form-input input-checkbox" disabled="disabled"
                                            data-th-data-result="${ISSUE_TYPE}" data-th-initValue="${entity?.issueType}"
                                            allowClear="true">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">产品类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="profitType" name="profitType"
                                            class="layui-input form-input input-select"
                                            data-th-data-result="${PROFIT_TYPE}" allowClear="true"
                                            data-th-initValue="${entity?.profitType}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">产品收益类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <!--                                     <input type="text" id="prdIncomeType" name="prdIncomeType" class="layui-input form-input input-checkbox"
                                             data-th-data-result="${PRD_INCOME_TYPE}" 
                                             data-th-initValue="${prdIncomeType}" allowClear="true">  -->
                                        <input type="text" id="prdIncomeType" name="prdIncomeType" disabled="disabled"
                                            class="layui-input form-input input-checkbox"
                                            data-result="[{&quot;id&quot;:&quot;03&quot;,&quot;text&quot;:&quot;非保本&quot;,&quot;col&quot;:&quot;&quot;},
                                                                {&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;保本浮动&quot;,&quot;col&quot;:&quot;&quot;},
                                                                {&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;保本&quot;,&quot;col&quot;:&quot;&quot;}]"
                                            data-th-initValue="${entity?.prdIncomeTypeCode}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">是否周期型</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="checkbox" name="isPeriodicType" lay-skin="switch"
                                            data-th-value="${YES_OR_NO}" lay-text="是|否"
                                            data-th-checked="${entity?.periodicTypeYorN}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">投资周期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="investCycle" name="investCycle"
                                            class="layui-input form-input" placeholder="天"
                                            data-th-value="${entity?.term}">
                                            <span class="input-right-show">天</span>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">是否分层</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="checkbox" name="isSaleLayer" lay-skin="switch"
                                            data-th-value="${YES_OR_NO}" lay-text="是|否"
                                            data-th-checked="${entity?.saleLayerYorN}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">交易日历</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="calendarId" name="calendarId"
                                            class="layui-input form-input input-select" allowClear="true">
                                            <option data-th-value="${entity?.calendarId}"
                                                data-th-text="${entity?.calendarName}"></option>
                                        </select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">起息日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="vdate" name="vdate" class="layui-input form-input"
                                            data-th-value="${entity?.vdate}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">到期日</label>
                                    <div class="layui-input-inline input-inline">
                                        <div class="layui-form-item">
                                            <div class="layui-inline layui-col-md6">
                                                <div class="layui-input-inline input-inline">
                                                    <input type="text" id="mdate" name="mdate"
                                                        class="layui-input form-input"
                                                        style="width: 120px; margin-top: -8px;"
                                                        data-th-value="${entity?.mdate}">
                                                </div>
                                            </div>
                                            <div class="layui-input-block"
                                                style="margin-left: 140px; margin-top: -10px;">
                                                <input name="issus" id="issus" lay-skin="primary" title="永续" disabled="disabled"
                                                    type="checkbox" data-th-checked="${entity?.susYorN}">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">实际到期日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="actmdate" name="actmdate" class="layui-input form-input"
                                            data-th-value="${entity?.actmdate}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">清盘日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="windUpDate" name="windUpDate"
                                            class="layui-input form-input" data-th-value="${entity?.actmdate}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">产品期限</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="term" name="term" class="layui-input form-input"
                                            placeholder="" data-th-value="${entity?.term}">
                                            <span class="input-right-show">天</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">计息基础</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="basis" name="basis" class="layui-input form-input input-select"
                                            data-th-data-result="${BASIS}" allowClear="true"
                                            data-th-initValue="${entity?.basis}">
                                        </select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">利率类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="intType" name="intType"
                                            class="layui-input form-input input-checkbox" disabled="disabled"
                                            data-th-data-result="${INT_TYPE}" data-th-initValue="${intType}"
                                            allowClear="true">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">预期收益率</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="proprate" name="proprate" class="layui-input form-input"
                                            placeholder="%" data-th-value="${entity?.yield}">
                                            <span class="input-right-show">%</span>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">基准利率</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="prodavgrate" name="prodavgrate"
                                            class="layui-input form-input" placeholder="%"
                                            data-th-value="${dao?.prodlowrate}">
                                            <span class="input-right-show">%</span>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">利息计提规则</label>
                                    <div class="layui-input-inline input-inline">
                                        <!--                                      <input type="text" id="calculationType" name="calculationType" class="layui-input form-input input-checkbox"
                                         data-th-data-result="${CALCULATION_TYPE}" 
                                         data-th-initValue="${calculationType}" allowClear="true">  -->
                                        <input type="text" id="issueType" name="issueType"
                                            class="layui-input form-input input-checkbox" 
                                            data-result="[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;区间累计&quot;,&quot;col&quot;:&quot;&quot;},
                                                     {&quot;id&quot;:&quot;02&quot;,&quot;text&quot;:&quot;每日计提&quot;,&quot;col&quot;:&quot;&quot;}]"
                                            initvalue="01"  disabled="disabled">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">募集币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="ccy" name="ccy" class="layui-input form-input input-select"
                                            data-th-data-result="${CCY}" allowClear="true"
                                            data-th-initValue="${entity?.ccy}">
                                        </select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">利率小数位</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="yeildDecDigits" name="yeildDecDigits"
                                            class="layui-input form-input" data-th-value="${entity?.yeildDecDigits}">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">利率处理方式</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" id="valuationRoundRule" name="valuationRoundRule"
                                            class="layui-input form-input input-checkbox"
                                            data-th-data-result="${VALUATION_ROUND_RULE}"
                                            data-th-initValue="${valuationRoundRule}" allowClear="true" disabled="disabled">
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">托管活期利率计提</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="checkbox" name="isTrustCurrent" lay-skin="switch"
                                            data-th-value="${YES_OR_NO}" lay-text="是|否"
                                            data-th-checked="${entity?.isTrustCurrent}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">托管机构</label>
                                    <div class="layui-input-inline input-inline">
                                        <select id="truDep" name="truDep" class="layui-input form-input input-select"
                                            allowClear="true"
                                            data-th-initValue="${entity?.registOrg}">
                                        </select>
                                    </div>
                                </div>
                                <div class="layui-inline layui-col-md4">
                                    <label class="layui-form-label form-lable">是否对账</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="checkbox" name="isReconciliation" lay-skin="switch"
                                            data-th-value="${YES_OR_NO}" lay-text="是|否"
                                            data-th-checked="${entity?.isReconciliation}">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </fieldset>
            <div class="layui-collapse">
                <div class="layui-colla-item">
                    <h2 class="layui-colla-title">
                        <a href="javascript:;">产品费用</a>
                    </h2>
                    <div class="layui-colla-content layui-show">
                        <div>
                            <table class="layui-table" id="dataTable_cpfy"></table>
                        </div>
                    </div>
                </div>
            </div>
            <fieldset class="layui-elem-field layui-field-title">
                <div class="layui-collapse">
                    <div class="layui-colla-item">
                        <h2 class="layui-colla-title">
                            <a href="javascript:;">资金账户</a>
                        </h2>
                        <div class="layui-colla-content layui-show">
                            <div>
                                <table class="layui-table" id="dataTable_zjzh"></table>
                            </div>
                        </div>
                    </div>
                </div>
            </fieldset>
           <div class="layui-form-item"></div>
           <div class="layui-collapse">
                <div class="layui-colla-item">
                    <h2 class="layui-colla-title">
                        <a href="javascript:;">证券账户</a>
                    </h2>
                    <div class="layui-colla-content layui-show">
                        <div>
                            <table class="layui-table" id="dataTable_zqzh"></table>
                        </div>
                    </div>
                </div>
         </div>            
        </form>
        <div class="layui-col-md11" style="margin: 50px;">
            <div class="text-center">
                <!--                 <a id="ValManualVoucher003_btn_save" class="layui-btn layui-btn-sm btn-save" 
                       data-th-text="#{SysCommon.save}">保存</a> 
                  <a id="ValManualVoucher003_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                      data-th-text="#{SysCommon.submit}">提交</a>-->
                <a id="ValManualVoucher003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                    data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/basedata/productinfoquery/ValProductInfoQuery002.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
