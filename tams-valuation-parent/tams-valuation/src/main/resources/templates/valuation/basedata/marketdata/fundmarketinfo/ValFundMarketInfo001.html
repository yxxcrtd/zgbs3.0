<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>每日基金行情</title>
</head>
<body>
	<div layout:fragment="content">
		<!-- 画面内容 -->
		<div class="form-button-area">
			<a id="ValFundMarketInfo001_btn_import" class="layui-btn layui-btn-sm btn-import btn-default">导入</a>
		</div>
		<div class="joyin-form-wrap joyin-filter-form condition-area">
			<form class="layui-form" id="searchForm">
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">基金代码</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="fundCode" name="fundCode"
								class="layui-input form-input" placeholder="请输入内容">
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">基金名称</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="fundName" name="fundName"
								class="layui-input form-input" placeholder="请输入内容">
						</div>
					</div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">估值日期</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="valueDate" name="valueDate"
								placeholder="请选择、支持区间"
								class="layui-input form-input input-dateRangeSelect" />
						</div>
					</div>
				</div>
				<!--  <div class="layui-form-item"> -->
				<!-- 					<div class="layui-inline layui-col-md4"> -->
				<!-- 						<label class="layui-form-label form-lable">估值来源</label> -->
				<!-- 						<div class="layui-input-inline input-inline"> -->
				<!-- 							<input id="valueSource" name="valueSource" -->
				<!-- 								class="layui-input form-input input-select" placeholder="请输入内容" -->
				<!-- 								data-th-data-result="${VALUATION_TRADE_MARKET}" -->
				<!-- 								allowClear="true"> -->
				<!-- 						</div> -->
				<!-- 					</div> -->
				<!-- </div> -->
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">基金类型</label>
						<div class="layui-input-inline input-inline">
							<!-- <input type="text" id="fundType" name="fundType"
								class="layui-input form-input input-select" placeholder="请选择"
								data-url="/system/log/SysBatchLog001/getPrdGroup"
								data-idfield="code" data-keyfield="shortName"
								data-th-data-result="${FUND_TYPE}" allowClear="true"> --> 
                            <select type="text" name="fundType" id="fundType"
                                class="layui-input form-input input-select" maxlength=60 
                                data-th-placeholder="#{SysCommon.placeholder}" data-th-data-result="${FUND_TYPE}"
                                allowClear="true" formatoption=true>
                                <option></option>      
                            </select>      
						</div>
					</div>
				</div>
			</form>
		</div>
		<div id="dataTable"></div>
	</div>
</body>
<div layout:fragment="script">
	<script
		data-th-src="@{/js/valuation/basedata/marketdata/market/ValFundMarketInfo001.js}"
		type="text/javascript"></script>
</div>
</html>
