<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title>股票行情信息</title>
</head>
<body>
    <div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="ValSharesMarketInfo001_FORM_pageForm">
     <div class="layui-form-item">
     <div class="layui-inline layui-col-md4 col-inline">
     <label class="layui-form-label form-lable">股票代码</label>
     <div class="layui-input-inline input-inline">
        <input type="text" placeholder="请输入内容" class="layui-input form-input" id="ValSharesMarketInfo001_TEXT_sharesId">
        </div>
        </div>
        <div class="layui-inline layui-col-md4 col-inline">
        <label class="layui-form-label form-lable"  >股票简称</label>
        <div class="layui-input-inline input-inline">
        <input type="text" placeholder="请输入内容" class="layui-input form-input" id="ValSharesMarketInfo001_TEXT_sharesName">
        </div>
        </div>
        <div class="layui-inline layui-col-md4 col-inline">
        <label class="layui-form-label form-lable">交易状态</label>
        <div class="layui-input-inline input-inline">
        <select id="ValSharesMarketInfo001_SELECT_sharesTradeStatus" class="input-select"  placeholder="请选择"
            data-result='[{"id":"01","text":"正常","col":"","parentId":null,"object":null},{"id":"02","text":"新股","col":"","parentId":null,"object":null},{"id":"03","text":"除权","col":"","parentId":null,"object":null},{"id":"04","text":"停牌","col":"","parentId":null,"object":null}]'
                             multiple="multiple" allowClear="true">
        </select></div>
        </div>
        </div>
         <div class="layui-form-item">
          <div class="layui-inline layui-col-md4 col-inline">
           <label class="layui-form-label form-lable">交易日期</label>
           <div class="layui-input-inline input-inline">
        <input class="layui-input form-input input-dateSelect" id="ValSharesMarketInfo001_DATE_startDate">
        </div></div>
         <div class="layui-inline layui-col-md4 col-inline">
            <label class="layui-form-label form-lable">——</label>
            <div class="layui-input-inline input-inline">
        <input class="layui-input form-input input-dateSelect" id="ValSharesMarketInfo001_DATE_endDate">
        </div></div>
         <div class="layui-inline layui-col-md4 col-inline">
        <a class="layui-btn layui-btn-sm btn-search" id="ValSharesMarketInfo001_BTN_search">查询</a>
        <a class="layui-btn layui-btn-sm btn-export" id="ValSharesMarketInfo001_BTN_export">导出</a>
        <a class="layui-btn layui-btn-sm btn-reset" id="ValSharesMarketInfo001_BTN_clear">重置</a>
        </div>
        </div>
        </form>
     <div>
     <table class="layui-table" id="dataTable"></table>
     </div></div>

</body>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/valuation/basedata/marketdata/shares/ValSharesMarketInfo001.js}" type="text/javascript"></script>
</div>
</html>
