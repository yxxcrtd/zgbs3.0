<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>汇率行情信息</title>
</head>
<body>
    <div layout:fragment="content">
        <form class="layui-form joyin-form-wrap" id="ValExchangeRateInfo001_FORM_pageForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md3 col-inline">
                    <label class="layui-form-label form-lable">
                        外汇类型
                        <b style="color: red">*</b>
                    </label>
                    <div class="layui-input-inline input-inline">
                        <select class="input-select" id="ValExchangeRateInfo001_TEXT_type"
                            data-th-data-url="@{/js/valuation/basedata/marketdata/rate/type.json}" placeholder="请选择"
                            allowClear="true">
                            <select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md3 col-inline">
                    <label class="layui-form-label form-lable">货币对</label>
                    <div class="layui-input-inline input-inline">
                        <select id="ValExchangeRateInfo001_SELECT_CurrencyPair" class="input-select"
                            data-th-data-url="@{/js/valuation/basedata/marketdata/rate/CurrencyPair.json}"
                            placeholder="请选择" multiple="multiple" allowClear="true">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md3 col-inline">
                    <label class="layui-form-label form-lable">交易日期</label>
                    <div class="layui-input-inline input-inline">
                        <input class="layui-input form-input input-dateSelect" id="ValExchangeRateInfo001_DATE">
                    </div>
                </div>
                <div class="layui-inline layui-col-md3 col-inline">
                    <a class="layui-btn layui-btn-sm btn-search" id="ValExchangeRateInfo001_BTN_search">查询</a> <a
                        class="layui-btn layui-btn-sm btn-export" id="ValExchangeRateInfo001_BTN_export">导出</a> <a
                        class="layui-btn layui-btn-sm btn-reset" id="ValExchangeRateInfo001_BTN_clear">重置</a>
                </div>
            </div>
        </form>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</body>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/valuation/basedata/marketdata/rate/ValExchangeRateInfo001.js}" type="text/javascript"></script>
</div>
</html>
