<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ValCoinFundQuotationInfo002.title}">货币型基金行情信息</title>
    <style>
        .mst-lable{
            width: 20%;
        }
    </style>
</head>
<body>
    <div layout:fragment="content">
        <div>
            <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
                <div class="layui-form-item">
                    <label class="layui-form-label form-lable mst-lable"
                           data-th-text="#{ValCoinFundQuotationInfo001.finprodId}">基金代码</label>
                    <div class="layui-input-inline input-inline mst-input">
                        <input type="text" id="finprodMarketId" maxlength="32"
                               name="finprodMarketId" class="layui-input form-input input-lenovoselect"
                               data-th-value='${entity?.finprodMarketId}' placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-data-url="@{/valuation/basedata/marketdata/valcoinfundquotationinfo/ValCoinFundQuotationInfo002/queryFinprod}"
                               required="required" data-idfield="code" data-keyfield="code"
                               data-th-data-effectivefieldsalias='|{"code":"#{ValCoinFundQuotationInfo001.productCode}","shortName":"#{ValCoinFundQuotationInfo001.productName}"}|'>
                        <input type="hidden" id="finprodId" name="finprodId"
                               data-th-value="${entity?.finprodMarketId}">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label form-lable mst-lable"
                           data-th-text="#{ValCoinFundQuotationInfo002.finprodType}">基金类型</label>
                    <div class="layui-input-inline input-inline">
                        <input id="finprodChiType" name="finprodChiType" type="text"
                               placeholder="请输入内容" data-th-value="${entity?.finprodChiType}"
                               class="layui-input form-input">
                        <input type="hidden" id="finprodType2" name="finprodType2"
                               data-th-value="${entity?.finprodType2}">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label form-lable mst-lable"
                           data-th-text="#{ValCoinFundQuotationInfo001.valDate}">估值日期</label>
                    <div class="layui-input-inline input-inline">
                        <input id="valDate" name="valDate"
                               class="layui-input form-input input-dateSelect"
                               data-th-value='${#dates.format(entity?.valDate,"yyyy-MM-dd")}'
                               placeholder="请选择时间" required="required">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label form-lable mst-lable"
                           data-th-text="#{ValCoinFundQuotationInfo002.publishDate}">公布日期</label>
                    <div class="layui-input-inline input-inline">
                        <input id="publishDate" name="publishDate"
                               class="layui-input form-input input-dateSelect"
                               data-th-value='${#dates.format(entity?.publishDate,"yyyy-MM-dd")}'
                               placeholder="请选择时间" required="required">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label form-lable mst-lable"
                           data-th-text="#{ValCoinFundQuotationInfo002.valuation}">万份收益</label>
                    <div class="layui-input-inline input-inline">
                        <input id="valuation" name="valuation" type="text" placeholder="请输入内容" data-textrange="14" maxlength="30"
                               data-th-value="${entity?.valuation}" data-pattern="" data-fixtype="2"
                               class="layui-input form-input text-number" required="required">
                    </div>
                </div>
                <div class="layui-form-item" id="day7YearYield_div">
                    <label class="layui-form-label form-lable mst-lable"
                           data-th-text="#{ValCoinFundQuotationInfo002.day7YearYield}">七日年化收益率</label>
                    <div class="layui-input-inline input-inline">
                        <input id="day7YearYield" name="day7YearYield" type="text" placeholder="请输入内容" data-textrange="4"
                               data-th-value="${entity?.day7YearYield}" class="layui-input form-input text-number" data-fixtype="2">
                    </div>
                </div>
                <div class="layui-form-item" id="totalValue_div">
                    <label class="layui-form-label form-lable mst-lable"
                           data-th-text="#{ValCoinFundQuotationInfo002.totalValue}">累计净值</label>
                    <div class="layui-input-inline input-inline">
                        <input id="totalValue" name="totalValue" type="text" placeholder="请输入内容" data-textrange="4"
                               data-th-value="${entity?.totalValue}" class="layui-input form-input text-number" data-fixtype="2">
                    </div>
                </div>
                <div class="layui-form-item" id="restNetValue_div">
                    <label class="layui-form-label form-lable mst-lable"
                           data-th-text="#{ValCoinFundQuotationInfo002.restNetValue}">复权单位净值</label>
                    <div class="layui-input-inline input-inline">
                        <input id="restNetValue" name="restNetValue" type="text" placeholder="请输入内容" data-textrange="4"
                               data-th-value="${entity?.restNetValue}" class="layui-input form-input text-number" data-fixtype="2">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label form-lable mst-lable"
                           data-th-text="#{ValCoinFundQuotationInfo001.fundManager}">基金管理人</label>
                    <div class="layui-input-inline input-inline">
                        <input id="fundManager" name="fundManager" type="text" placeholder="请输入内容"
                               data-th-value="${entity?.fundManager}" class="layui-input form-input">
                    </div>
                </div>
            </form>
            <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="position: fixed;bottom: 30px;">
                <div class="text-center">
                    <a id="ValCoinFundQuotationInfo002_btn_save" class="layui-btn layui-btn-sm btn-save"
                       data-th-text="#{SysCommon.save}">保存</a>
                    <a id="ValCoinFundQuotationInfo002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                       data-th-text="#{SysCommon.submit}">提交</a>
                    <a id="ValCoinFundQuotationInfo002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                       data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </div>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/basedata/marketdata/valcoinfundquotationinfo/ValCoinFundQuotationInfo002.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
