<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title>计划类资产净值信息新建</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm" style="background: #ffffff; padding: 10px 0;">
        <div class="layui-form-item" style="display:none;">
            <input id="operateType" name="operateType"
                   class="layui-input form-input" placeholder="请输入"
                   data-th-value="${entity?.operateType}" >
            <input id="finprodType" name="finprodType"
                   class="layui-input form-input" placeholder="请输入"
                   data-th-value="${entity?.finprodType}" >
            <input id="editFlag" name="editFlag"
                   class="layui-input form-input" placeholder="请输入"
                   data-th-value="${editFlag}">
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">
                    <i class="iconfont must" style="display: inline;">*</i>
                    资产代码
                </label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="finprodId" name="finprodId"
                           class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                           data-th-placeholder="#{SysCommon.placeholder}"
                           data-th-data-url="getFinprodId"
                           data-idfield="code" data-keyfield="code"
                           data-th-data-effectivefieldsalias='|{"code":"#{ValManualVoucher.busiId}","shortName":"#{ValManualVoucher.busiName}"}|'
                           required
                           data-th-Value="${entity?.finprodId}"
                    >
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">
                    资产名称
                </label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="finprodAbbr" name="finprodAbbr" placeholder="请输入内容"
                           class="layui-input form-input"
                           data-th-Value="${entity?.finprodAbbr}" disabled
                    >
                </div>
            </div>

            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">
                    <i class="iconfont must" style="display: inline;">*</i>
                    行情日期
                </label>
                <div class="layui-input-inline input-inline">
                    <input type="text" id="valueDate" name="valueDate"
                           class="layui-input form-input input-dateSelect"
                           allowClear="true"
                           data-th-value="${entity?.valueDate}"
                    >
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <!--   <div class="layui-inline layui-col-md4">
                 <label class="layui-form-label form-lable">
                                                                       录入方式
                 </label>
                 <div class="layui-input-inline input-inline">
                 <input type="text" id="inputType" name="inputType" class="layui-input form-input input-select"
                             data-th-initvalue="${entity?.inputType}"
                             data-th-data-result="${INPUT_TYPE}" allowClear="true">
                 </div>
             </div> -->

            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">
                    <i class="iconfont must" style="display: inline;">*</i>
                    资产净值
                </label>
                <div class="input-inline layui-input-block">
                    <input type="text" id="valueAsset" name="valueAsset" class="layui-input form-input"
                           data-th-placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.valueAsset}">
                </div>
            </div>

        </div>
    </form>

    <input type="text" id="workflowId" name="workflowId" class="layui-input form-input" data-th-value="${workflowId}" disabled="disabled" style = "display:none;">

    <div class="layui-col-md11" style="margin: 50px;">
        <div class="text-center">
            <a id="ValNetPlanQuotation003_btn_save" class="layui-btn layui-btn-sm btn-save"
               data-th-text="#{SysCommon.save}">保存</a>
            <a id="ValNetPlanQuotation003_btn_submit" class="layui-btn layui-btn-sm btn-submit"
               data-th-text="#{SysCommon.submit}">提交</a>
            <a id="ValNetPlanQuotation003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
               data-th-text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/valuation/basedata/marketdata/netplanquotation/ValNetPlanQuotation003.js}"
            type="text/javascript"></script>
</div>



</body>
</html>
