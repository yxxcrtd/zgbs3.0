<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>账套管理</title>
</head>

<body>

<div layout:fragment="content">
	<div class="layui-col-md12" style="margin:10px;">
        <a class="layui-btn layui-btn-sm" id="ValBaseInterestInfo001_btn_add"><i class="iconfont icon-found"></i><span>&nbsp;&nbsp;新建</span></a>
        <a class="layui-btn layui-btn-sm" id="ValBaseInterestInfo001_btn_delete"><i class="iconfont icon-delete"></i><span>&nbsp;&nbsp;删除</span></a>
        <a class="layui-btn layui-btn-sm" id="ValBaseInterestInfo001_btn_export"><i class="iconfont icon-export"></i><span>&nbsp;&nbsp;导出</span></a>
        <a id="ValFundSubscribe001_btn_filter" class="layui-btn layui-btn-sm btn-filter"><i class="iconfont icon-btn-filter"></i><span>筛选</span></a>
    </div>
    <form class="layui-form joyin-form-wrap joyin-filter-form" id="searchForm">
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">发布日</label>
                <div class="layui-input-inline input-inline">
                <input type="text" class="layui-input form-input input-dateSelect" placeholder="请选择日期">
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">利率代码</label>
                <div class="layui-input-inline input-inline">
                    <input type="text" class="layui-input form-input" value="">
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">利率名称</label>
                <div class="layui-input-inline input-inline">
                  <input type="text" class="layui-input form-input" value="">
                </div>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">交易方向</label>
                <div class="layui-input-inline input-inline">
                  <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;01:是&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;10&quot;,&quot;text&quot;:&quot;02:否&quot;,&quot;col&quot;:&quot;&quot;}]'>
                </div>
            </div>
            <div class="layui-inline layui-col-md4">
                <label class="layui-form-label form-lable">有效状态</label>
                <div class="layui-input-inline input-inline">
                  <input type="text" class="layui-input form-input input-select" placeholder="请选择" data-result='[{&quot;id&quot;:&quot;01&quot;,&quot;text&quot;:&quot;有效&quot;,&quot;col&quot;:&quot;&quot;},{&quot;id&quot;:&quot;10&quot;,&quot;text&quot;:&quot;无效&quot;,&quot;col&quot;:&quot;&quot;}]'>
                </div>
            </div>
         	<div class="layui-inline layui-col-md4">
                <a class="layui-btn layui-btn-sm" id="ValBaseInterestInfo001_btn_search"><i class="iconfont icon-search"></i><span>&nbsp;&nbsp;查询</span></a>
                <a class="layui-btn layui-btn-sm" id="ValBaseInterestInfo001_btn_reset"><i class="iconfont icon-reset"></i><span>&nbsp;&nbsp;重置</span></a>
            </div>
        </div>
    </form>
    <div id="dataTable"></div>
</div>
</body>
<div layout:fragment="script">
  <script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script>
  <script data-th-src="@{/js/valuation/basedata/marketdata/interest/ValBaseInterestInfo001.js}" type="text/javascript"></script>
</div>

</html>
