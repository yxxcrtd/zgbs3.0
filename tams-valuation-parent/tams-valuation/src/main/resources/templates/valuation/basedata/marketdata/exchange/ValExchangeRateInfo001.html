<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<meta charset="UTF-8">
<title>汇率信息</title>
</head>

<body>
	<div layout:fragment="content">

		<!-- 画面内容 -->
		<div class="form-button-area"></div>
		<div class="joyin-form-wrap joyin-filter-form condition-area">
			<form class="layui-form" id="searchForm">
				<div class="layui-form-item">
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">货币对</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="currencyPair" name="currencyPair"
								class="layui-input form-input input-select" placeholder="请选择"
								data-url="/system/log/SysBatchLog001/getPrdGroup"
								data-idfield="code" data-keyfield="shortName"
								data-th-data-result="${FUND_TYPE}" allowClear="true">
						</div>
					</div>
					 <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable" >外汇类型</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="foreignExchangeType" name="foreignExchangeType"
                             class="layui-input form-input input-checkbox"
                             data-th-data-result='${VALUATION_TRADE_MARKET}'
                            >
                        </div>
                    </div>
					<div class="layui-inline layui-col-md4">
						<label class="layui-form-label form-lable">交易日期</label>
						<div class="layui-input-inline input-inline">
							<input type="text" id="tradeDate" name="tradeDate"
								class="layui-input form-input input-dateRangeSelect" placeholder="请选择、支持区间"/>
						</div>
					</div>
				</div>
			</form>
		</div>
		<div id="dataTable"></div>

	</div>
	
</body>
<div layout:fragment="script">
	<script data-th-src="@{/js/valuation/common.js}" type="text/javascript"></script>
	<script
		data-th-src="@{/js/valuation/basedata/marketdata/exchange/ValExchangeRateInfo001.js}"
		type="text/javascript"></script>
</div>

</html>
