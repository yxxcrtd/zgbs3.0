<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{ValProfitQuery001}">利润表-账套明细列表</title>
<script th:inline="javascript">
	// 报表期限类型
	var reportTermType = [[${entity?.reportTermType}]];
	// 上期维度
	var lastDimen = [[${entity?.lastDimen}]];
	// 期限
	var reportTerm = [[${entity?.reportTerm}]];
	
</script>
</head>
<body>
    <div layout:fragment="content">
        <div class="form-button-area"></div>
        <div class="joyin-form-wrap joyin-filter-form condition-area">
            <form class="layui-form" id="searchForm" autocomplete="off">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                    	<label class="layui-form-label form-lable">日期</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="reportDate" name="reportDate" class="layui-input form-input" data-th-value="${entity?.reportDate}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable2">指标</label>
                        <div class="layui-input-inline input-inline">
                        	<input type="text" id="project" name="project" class="layui-input form-input" data-th-value="${entity?.project}">
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable2">本期金额</label>
                        <div class="layui-input-inline input-inline">
                        	<input type="text" id="thisTermAmt" name="thisTermAmt" class="layui-input form-input" data-th-value="${entity?.thisTermAmt}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4">
                        <label class="layui-form-label form-lable2">上期金额</label>
                        <div class="layui-input-inline input-inline">
                        	<input type="text" id="lastTermAmt" name="lastTermAmt" class="layui-input form-input" data-th-value="${entity?.lastTermAmt}">
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
        <script data-th-src="@{/js/valuation/accounadjustmanage/valprofitquery/ValProfitQuery002.js}"
            type="text/javascript"></script>
    </div>
</body>
</html>
