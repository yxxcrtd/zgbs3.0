<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{OwnerEquityChange001}">所有者权益变动查询</title>
<script th:inline="javascript">
    var isInit = [[${isInit}]]; 
    var hzSchemeSwitch = [[${hzSchemeSwitch}]];  
</script>
</head>
<body>
	<div layout:fragment="content">
		<div class="form-button-area"></div>
		<div class="joyin-form-wrap joyin-filter-form condition-area">
			<form class="layui-form" id="searchForm" autocomplete="off"; >
				<div class="layui-form-item">
                    <div class="layui-inline layui-col-md3">
                        <label class="layui-form-label form-lable2" data-th-text="#{ValProfitQuery001.booksetId}">产品</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="booksetId" name="booksetId"
                                class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/valuation/accounadjustmanage/ownerequitychange/OwnerEquityChange001/getBooksetId2}"
                                data-idfield="code" data-keyfield="code"
                                data-th-data-effectivefieldsalias='|{"code":"#{ValProfitQuery001.booksetId}","shortName":"#{ValProfitQuery001.booksetName}"}|'
                                required data-th-Value="${finprodId}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md3">
                        <label class="layui-form-label form-lable">筛选条件</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" class="layui-input form-input input-select" id="reportTermType"
                                name="reportTermType" placeholder="请选择报表期限类型" allowClear="true"
                                data-th-data-result="${REPORT_TERM_TYPE}" childrenIds="reportTerm" required>
                                <option></option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md2">
                        <div class="layui-input-inline input-inline" id="c_year_reportDate" style="display: none;">
                            <input type="text" class="layui-input form-input" id="year_reportDate" name="valDate"
                                placeholder="请选择日期">
                        </div>
                        <div class="layui-input-inline input-inline" id="c_month_reportDate" style="display: none;">
                            <input type="text" class="layui-input form-input" id="month_reportDate" name="valDate"
                                placeholder="请选择日期">
                        </div>
                        <div class="layui-input-inline input-inline" id="c_date_reportDate" style="display: none;">
                            <input type="text" class="layui-input form-input" id="date_reportDate" name="valDate"
                                placeholder="请选择日期">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md2">
                        <label class="layui-form-label form-lable">上期维度</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" class="layui-input form-input input-select" id="lastDimen"
                                name="lastDimen" placeholder="请选择上期维度" allowClear="true"
                                data-th-data-result="${LAST_DIMEN}" required>
                                <option></option>
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md2" id="c_reportTerm" style="display: none;">
	                    <label class="layui-form-label form-lable">期限</label>
	                    <div class="layui-input-inline input-inline">
		                    <select type="text" class="layui-input form-input input-select" id="reportTerm" 
		                        name="reportTerm" placeholder="请选择期限" allowClear="true" data-url="getTermLink"
		                        parentIds="reportTermType" required>
		                        <option></option>
		                    </select>
	                    </div>
                    </div>
                </div>
			</form>
		</div>
		<div>
			<div class="layui-form-item">
				<div class="layui-inline layui-col-md12">
					<h2 style="text-align: center; font-weight: bold;">所有者权益变动表</h2>
				</div>
			</div>
			<div class="layui-form-item" id="profttInfo" >
				<h3 class="layui-inline layui-col-md4" style="text-align: left;" id="org">编制单位：</h3>
				<h3 class="layui-inline layui-col-md4" style="text-align: center;">
					<span id="valueDateStart"></span>-<span></span><span id="valueDateEnd"></span>
				</h3>
				<h3 class="layui-inline layui-col-md4" style="text-align: right;">单位：元</h3>
			</div>
			<table class="layui-table" id="dataTable"></table>
		</div>
	</div>
	<div layout:fragment="script">
		<script
			data-th-src="@{/js//valuation/accounadjustmanage/ownerequitychange/OwnerEquityChange001.js}"
			type="text/javascript"></script>
	</div>
</body>
</html>
