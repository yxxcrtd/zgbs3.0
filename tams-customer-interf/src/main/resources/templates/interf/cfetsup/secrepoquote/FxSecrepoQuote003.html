<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{FxSecrepoQuote003}">质押券添加</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area" export="false">
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
        <form class="layui-form" id="submitForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxSecrepoQuote003.finprodId}">债券代码</label>
                    <div class="layui-input-inline input-inline">
                        <select  type="text" id="finprodId" name="finprodId"
                                 class="layui-input form-input input-select" placeholder="请输入内容"
                                 data-th-placeholder="#{SysCommon.placeholder}"
                                 data-th-data-url="@{/interf/cfetsup/secrepoquote/FxSecrepoQuote003/getFinprodId}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxSecrepoQuote003.type3}">资产三级类型</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="type3" name="type3"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/business/common/CommonSelect/getEntrustId}"
                                data-th-value="${entity?.type3}"
                                multiple="true">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxSecrepoQuote003.type4}">资产四级类型</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="type4" name="type4"
                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-data-url="@{/business/common/CommonSelect/getInsideQuotationId}"
                               data-th-value="${entity?.type4}">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
        <div class="row text-center" style="margin: 20px 0;">
            <a th:id="FxSecrepoQuote003_btn_submit" class="layui-btn layui-btn-sm btn-submit"
               th:text="#{SysCommon.submit}">确认</a>
            <a th:id="FxSecrepoQuote003_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
               th:text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var entrustId = /*[[${entrustId}]]*/''; //
    </script>
    <script data-th-src="@{/js/interf/cfetsup/secrepoquote/FxSecrepoQuote003.js}" type="text/javascript"></script>
</div>
</body>
</html>
