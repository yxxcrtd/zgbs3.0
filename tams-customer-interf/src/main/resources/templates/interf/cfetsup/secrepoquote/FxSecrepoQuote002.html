<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title>新建回购报价</title>
    <style>
        .label-text{
            color: #0b72f1;
            line-height: 24px;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base">
                <!--基本信息-->
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <input  type="hidden" id="finprodList" name="finprodList" th:value="${finprodList}">
                        <input  type="hidden" id="seqno" name="seqno" th:value="${entity?.seqno}">
                        <input  type="hidden" id="nbquoteid" name="nbquoteid" th:value="${entity?.nbquoteid}">
                        <input  type="hidden" id="tradestatus" name="tradestatus" th:value="${entity?.tradestatus}">
                        <input  type="hidden" id="sendstatus" name="sendstatus" th:value="${entity?.sendstatus}">
                        <input  type="hidden" id="effectflag" name="effectflag" th:value="${entity?.effectflag}">
                        <input  type="hidden" id="operateType2" name="operateType2" th:value="${entity?.operateType2}">
                        <h3 class="pro-module-title">
                            <span class="title-des"
                                  th:text="#{FxSecrepoQuote002.baseInfo}">基本信息
                            </span>
                            （<span class="star-sign">*</span>必填）
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item pro-item-wrap">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecrepoQuote002.trustid}">委托编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="trustid" name="trustid" disabled
                                               class="layui-input form-input" required maxlength="50" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.trustid}">
                                    </div>
                                    <a id='magnifier' class="input-right-show" href='javascript:;' style='color:#4893e6;left: 32.2%; top: 42px;'><i class='iconfont icon-search'></i></a>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecrepoQuote002.quoteid}">报价编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="quoteid" name="quoteid" disabled
                                                class="layui-input form-input" required maxlength="50" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${entity?.quoteid}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap" id="replyTypeDiv" hidden="hidden">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecrepoQuote002.replyType}">回复类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="replyType" name="replyType" required
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" data-th-data-result="${REPLY_TYPE}"
                                                allowClear="true" th:initValue="${entity?.replyType}"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecrepoQuote002.dealdate}">交易日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required  type="text" id="dealdate" name="dealdate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.dealdate==null ? sysdate : #dates.format(entity?.dealdate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecrepoQuote002.vsettledate}">首次清算日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input required  type="text" id="vsettledate" name="vsettledate"
                                                   class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                                   th:placeholder="#{SysCommon.placeholder}"
                                                   th:value="${entity?.vsettledate==null ? sysdate : #dates.format(entity?.vsettledate,'yyyy-MM-dd')}">
                                        </div>
                                </div>
                                <div class="form-inline-wrap" id="repoTypeDiv">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecrepoQuote002.msettledate}">到期清算日</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required  type="text" id="msettledate" name="msettledate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.msettledate==null ? sysdate : #dates.format(entity?.msettledate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecrepoQuote002.portfolioId}">组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text"  id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:data-url="@{/interf/cfetsup/secrepoquote/FxSecrepoQuote001/getPortfolioId}" allowClear="true"
                                                formatoption="true"
                                                th:initValue="${entity?.portfolioId}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecrepoQuote002.portfolioName}">组合名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <select  type="text" disabled id="portfolioName" name="portfolioName"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:data-url="@{/interf/cfetsup/secrepoquote/FxSecrepoQuote001/getPortfolioName}" allowClear="true"
                                                formatoption="true"
                                                th:initValue="${entity?.portfolioName}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecrepoQuote002.jycs}">交易场所</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="jycs" name="jycs"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                data-th-data-result='${JYCS}' allowClear="true"
                                                formatoption="true"
                                                th:initValue="${entity?.jycs}"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecrepoQuote002.homerole}">本方角色</label>
                                    <div class="layui-input-inline input-inline" >
                                        <select required type="text" id="homerole" name="homerole" class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${HOMEROLE}' allowClear="true" formatoption="true"
                                                th:initValue="*{entity?.homerole}"></select>
                                    </div>
                                </div>
                                
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecrepoQuote002.avalibleCash}">组合T日可用现金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" disabled id="avalibleCash" name="avalibleCash" maxlength="10"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" data-fixtype="2" data-textrange="0"
                                               th:value="${entity?.avalibleCash}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <!--<label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecrepoQuote002.basis}">计息基础</label>
                                    <div class="layui-input-inline input-inline">
                                        <select  required type="text" id="basis" name="basis" class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${BASIS}' allowClear="true" formatoption="true"
                                                th:initValue="${entity?.basis?:BASIS_default}"></select>
                                    </div>-->
                                </div>
                            </div>
                </div>
                <!--报价信息-->
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des"
                                  th:text="#{FxSecrepoQuote002.quoteInfo}">报价要素</span>
                            （<span class="star-sign">*</span>必填）
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item pro-item-wrap">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecrepoQuote002.ps}">本方交易方向</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="ps" name="ps" class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${HGJYFX}' allowClear="true" formatoption="true"
                                                th:initValue="*{entity?.ps}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <!--<label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecrepoQuote002.prinAmt}">本金金额</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="prinAmt" name="prinAmt" maxlength="16"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.prinAmt}">
                                        <span class="input-right-show"
                                              th:text="#{FxSecrepoQuote002.yuan}">元</span>
                                    </div>-->
                                </div>
                                <div class="form-inline-wrap">
                                    <!--<label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecrepoQuote002.rebackPrice}">回购利率%</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="rebackPrice" name="rebackPrice"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               data-fixtype="2" data-textrange="6" maxlength="10"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.rebackPrice}">
                                        <span class="input-right-show">%</span>
                                    </div>-->
                                </div>
                                
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecrepoQuote002.counterid}">本币对手方</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text"  id="counterid" name="countertrader"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:data-url="@{/interf/cfetsup/secrepoquote/FxSecrepoQuote001/getMenInfo}" allowClear="true"
                                                formatoption="true"
                                                th:initValue="${entity?.counterid}"></select>
                                        <!--<input  type="text" id="counterid" name="counterid" maxlength="10"
                                               class="layui-input form-input" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.counterid}">-->
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecrepoQuote002.countertrader}">本币对手方交易员</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text"  id="countertrader" name="countertrader"
                                                class="layui-input form-input input-select choose-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:data-url="@{/interf/cfetsup/secrepoquote/FxSecrepoQuote001/getMenInfo}" allowClear="true"
                                                formatoption="true"
                                                th:initValue="${entity?.countertrader}"></select>
                                        <!--<input  type="text" id="countertrader" name="countertrader" maxlength="10"
                                               class="layui-input form-input" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.countertrader}">-->
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecrepoQuote002.ratebasic}">计息基础</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="ratebasic" name="ratebasic" class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${BASIS}' allowClear="true" formatoption="true"
                                                th:initValue="*{entity?.ratebasic}"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">回购期限（天）</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="term" name="term"  th:value="${entity?.term}"
                                               class="layui-input form-input text-number">
                                    </div>
                                </div>
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecrepoQuote002.rate}">回购利率（%）</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="rate" name="rate"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.rate}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecrepoQuote002.settlespeed}">清算速度</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="settlespeed" name="settlespeed" class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${ACCOUNT_SPEED}' allowClear="true" formatoption="true"
                                                th:initValue="*{entity?.settlespeed}"></select>
                                    </div>
                                </div>
                            </div>

                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">首次结算方式</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="vsettlemode" name="vsettlemode" class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${JSFS}' allowClear="true" formatoption="true"
                                                th:initValue="*{entity?.vsettlemode}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecrepoQuote002.msettlemode}">到期结算方式</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="msettlemode" name="msettlemode" class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${JSFS}' allowClear="true" formatoption="true"
                                                th:initValue="*{entity?.msettlemode}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecrepoQuote002.settletype}">清算类型</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="settletype" name="settletype" class="layui-input form-input input-select"
                                                 placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                 th:data-result='${SETTLETYPE}' allowClear="true" formatoption="true"
                                                 th:initValue="*{entity?.settletype}"></select>
                                    </div>
                                </div>
                            </div>

                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">债券币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="bondccy" name="bondccy" class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${CCY}' allowClear="true" formatoption="true"
                                                th:initValue="*{entity?.bondccy}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecrepoQuote002.ccy}">结算币种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="ccy" name="ccy" class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${CCY}' allowClear="true" formatoption="true"
                                                th:initValue="*{entity?.ccy}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecrepoQuote002.dealvar}">期限品种</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="dealvar" name="dealvar" class="layui-input form-input input-select"
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${TERM_TYPE_COLLATERALISED_REPO}' allowClear="true" formatoption="true"
                                                th:initValue="*{entity?.dealvar}"></select>
                                    </div>
                                </div>
                            </div>

                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap">本币本方</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text"  id="hometrader" name="hometrader"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:data-url="@{/interf/cfetsup/secrepoquote/FxSecrepoQuote001/getMenInfo}" allowClear="true"
                                                formatoption="true"
                                                th:initValue="${entity?.hometrader}"></select>
                                        <!--<input  type="text" id="hometrader" name="hometrader"  th:value="${entity?.hometrader}"
                                               class="layui-input form-input ">-->
                                    </div>
                                </div>
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecrepoQuote002.jycyid}">本币本方交易员</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text"  id="jycyid" name="jycyid"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:data-url="@{/interf/cfetsup/secrepoquote/FxSecrepoQuote001/getMenInfo}" allowClear="true"
                                                formatoption="true"
                                                th:initValue="${entity?.jycyid}"></select>
                                        <!--<input  type="text" id="jycyid" name="jycyid"
                                                class="layui-input form-input" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.jycyid}">-->
                                    </div>
                                </div>
                                <div class="form-inline-wrap" >
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecrepoQuote002.actpaydays}">实际占款天数（天）</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="actpaydays" name="actpaydays"
                                                class="layui-input form-input text-number" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.actpaydays}">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- 债券质押信息 -->
                <div class="pro-module-wrap" >
                    <div class="pro-module">
                        <h3 class="pro-module-title"><span class="title-des">质押券信息列表</span>
                            <a class="layui-btn layui-btn-sm btn-create" id="bond_btn_create"><i class="iconfont icon-found"></i><span>新建</span></a>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item">
                            <div class="pro-module-item">
                                <table class="layui-table" id="bondTable" title="#{bussFinProductFeeInfoDto.bussFinProductFeeInfoDtoList}" th:name="|${entityName}.bussFinProductFeeInfoDtoList|"></table>
                            </div>
                        </div>
                    </div>
                </div>
                        <!--计算要素-->
                        <div class="pro-module-wrap">
                            <div class="pro-module">
                                <h3 class="pro-module-title">
                            <span class="title-des"
                                  th:text="#{FxSecrepoQuote002.quoteInfo}">计算要素</span>
                                    （<span class="star-sign">*</span>必填）
                                    <i class="iconfont icon-arrow-down pro-down-icon"></i>
                                </h3>
                                <div class="pro-module-item pro-item-wrap">
                                    <div class="layui-form-item">
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-label-wrap"
                                                   th:text="#{FxSecrepoQuote002.prinamt}">券面总额合计（万元）</label>
                                            <div class="layui-input-inline input-inline">
                                                <input required type="text" id="prinamt" name="prinamt" maxlength="16"
                                                       class="layui-input form-input text-number" placeholder="请输入内容"
                                                       th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.prinamt}">
                                            </div>
                                        </div>
                                        <div class="form-inline-wrap">
                                           <label class="layui-form-label form-label-wrap"
                                                   th:text="#{FxSecrepoQuote002.zzTotalAmt}">中债登券面总额合计（万元）</label>
                                            <div class="layui-input-inline input-inline">
                                                <input required type="text" id="zzTotalAmt" name="zzTotalAmt" maxlength="16"
                                                       class="layui-input form-input text-number" placeholder="请输入内容"
                                                       th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.zzTotalAmt}">
