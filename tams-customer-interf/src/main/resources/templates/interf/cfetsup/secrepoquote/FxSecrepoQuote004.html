<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{FxSecrepoQuote004}">选择委托</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area" export="false">
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
        <form class="layui-form" id="submitForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxSecrepoQuote004.portfolioId}">组合代码</label>
                    <div class="layui-input-inline input-inline">
                        <select  type="text" id="portfolioId" name="portfolioId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-data-url="@{/interf/cfetsup/secrepoquote/FxSecrepoQuote001/getPortfolioId}"></select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxSecrepoQuote004.vdate}">委托开始日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="vdate" name="vdate"
                                class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"/>

                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxSecrepoQuote004.mdate}">委托结束日</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="mdate" name="mdate"
                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}"/>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
        <div class="row text-center" style="margin: 20px 0;">
            <a th:id="FxSecrepoQuote004_btn_submit" class="layui-btn layui-btn-sm btn-submit"
               th:text="#{SysCommon.submit}">确认</a>
            <a th:id="FxSecrepoQuote004_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
               th:text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/interf/cfetsup/secrepoquote/FxSecrepoQuote004.js}" type="text/javascript"></script>
</div>
</body>
</html>
