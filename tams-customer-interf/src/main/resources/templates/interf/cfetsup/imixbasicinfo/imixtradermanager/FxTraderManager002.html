<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{FxTraderManager002}">新建交易员</title>
    <style>
        .label-text{
            color: #0b72f1;
            line-height: 24px;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
        <form class="layui-form joyin-form-wrap pro-module-form" id="informationForm">
            <div class="pro-module-wrapper pro-module-base">
                <!--基本信息-->
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <div class="pro-module-item pro-item-wrap">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxTraderManager.user}">用户名</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="staffid" name="staffid"
                                               class="layui-input form-input input-select"  placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.staffid}" allowClear="true"
                                                data-th-data-url="@{/interf/cfetsup/imixbasicinfo/imixtradermanager/FxTraderManager001/getUser}"
                                                 th:initValue="${entity?.staffid}"
                                        ></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxTraderManager.cstpjyyid}">外汇交易中心交易员ID</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" id="cstptraderid" name="cstptraderid"
                                                class="layui-input form-input "
                                                placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                 allowClear="true" formatoption="true" data-th-value="${entity?.cstptraderid}">

                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxTraderManager.cstptrader}">外汇交易中心交易员名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required  type="text" id="cstptrader" name="cstptrader"
                                               class="layui-input form-input"  placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.cstptrader}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-input-inline input-inline" style="display: none">
                                <input required type="text" id="seqno" name="seqno"
                                       data-th-value="${entity?.seqno}"
                                ></input>
                            </div>
                        </div>
                    </div>
                </div>
                </div>
        </form>
    </div>
    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 30px;">
            <div class="text-center">
            <a id="FxTraderManager002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">确认</a>
            <a id="FxTraderManager001_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
            </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/interf/cfetsup/imixbasicinfo/imixtradermanager/FxTraderManager002.js}" type="text/javascript"></script>
</div>
</body>

</html>
