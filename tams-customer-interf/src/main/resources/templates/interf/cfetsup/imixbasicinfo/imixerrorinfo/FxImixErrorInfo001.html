<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{FxImixErrorInfo001}">错误码查询</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
        <form class="layui-form" id="submitForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxImixErrorInfo001.marketindicator}">市场描述</label>
                    <div class="layui-input-inline input-inline">
                        <input  type="text" id="marketindicator" name="marketindicator"
                                class="layui-input form-input" placeholder="请输入内容"
                                th:placeholder="#{SysCommon.placeholder}" >
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxImixErrorInfo001.applerrorcode}">错误代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="applerrorcode" name="applerrorcode"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/interf/cfetsup/imixbasicinfo/imixerrorinfo/FxImixErrorInfo001/getApplerrorcode}">
                        </select>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/interf/cfetsup/imixbasicinfo/imixerrorinfo/FxImixErrorInfo001.js}" type="text/javascript"></script>
</div>
</body>
</html>
