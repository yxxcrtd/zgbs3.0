<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{FxQuoteLogInfo001}">银行间报文信息</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area" export="false"></div>
    <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
        <form class="layui-form" id="submitForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxQuoteLogInfo001.quoteid}">外部报价编码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="quoteid" name="quoteid"
                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-value="${entity?.quoteid}">
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxQuoteLogInfo001.nbquoteid}">内部报价编码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="nbquoteid" name="nbquoteid"
                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-value="${entity?.nbquoteid}">
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxQuoteLogInfo001.sendtype}">发送类型</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="sendtype" name="sendtype" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${SEND_TYPE}' allowClear="true" formatoption="true"
                                data-th-initValue="${entity?.sendtype}"></select>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/interf/cfetsup/imixbasicinfo/quoteloginfo/FxQuoteLogInfo001.js}" type="text/javascript"></script>
</div>
</body>
</html>
