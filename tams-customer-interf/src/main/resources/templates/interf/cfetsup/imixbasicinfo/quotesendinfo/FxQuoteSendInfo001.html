<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{FxQuoteSendInfo001}">银行间报文发送记录</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area" export="false"></div>
    <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
        <form class="layui-form" id="submitForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxQuoteSendInfo001.nbquoteid}">内部报价编号</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="nbquoteid" name="nbquoteid"
                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item"><div class="layui-input-inline input-inline" style="height:30px;"></div></div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/interf/cfetsup/imixbasicinfo/quotesendinfo/FxQuoteSendInfo001.js}" type="text/javascript"></script>
</div>
</body>
</html>
