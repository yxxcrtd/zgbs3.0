<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{FxImixMenInfo001}">交易成员基本信息</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
        <form class="layui-form" id="submitForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxImixMenInfo001.jycyid}">交易成员id</label>
                    <div class="layui-input-inline input-inline">
                        <input  type="text" id="jycyid" name="jycyid"
                                class="layui-input form-input" placeholder="请输入内容"
                                th:placeholder="#{SysCommon.placeholder}" >
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxImixMenInfo001.jycyqc}">交易成员全称</label>
                    <div class="layui-input-inline input-inline">
                        <input  type="text" id="jycyqc" name="jycyqc"
                                class="layui-input form-input" placeholder="请输入内容"
                                th:placeholder="#{SysCommon.placeholder}" >
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/interf/cfetsup/imixbasicinfo/imixmeninfo/FxImixMenInfo001.js}" type="text/javascript"></script>
</div>
</body>
</html>
