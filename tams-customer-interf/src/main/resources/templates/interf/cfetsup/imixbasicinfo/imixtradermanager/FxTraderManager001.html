<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{FxTraderManager001}">外汇交易中心交易员查询</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area" export="false">
        <a id="FxTraderManager_btn_create" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新增</a>
       <!-- <a id="FxTraderManager_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}">删除</a>-->
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
        <form class="layui-form" id="submitForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxTraderManager.user}">用户名</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="staffcode" name="staffcode"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" allowClear="true"
                               data-th-data-url="@{/interf/cfetsup/imixbasicinfo/imixtradermanager/FxTraderManager001/getUser}"
                        >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxTraderManager.username}">人员姓名</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="staffname" name="staffname   "
                               class="layui-input form-input " placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxTraderManager.cstptrader}">外汇交易中心交易员名称</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="cstptrader" name="cstptrader"
                                class="layui-input form-input" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}">
                        </input>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/interf/cfetsup/imixbasicinfo/imixtradermanager/FxTraderManager001.js}" type="text/javascript"></script>
</div>
</body>
</html>
