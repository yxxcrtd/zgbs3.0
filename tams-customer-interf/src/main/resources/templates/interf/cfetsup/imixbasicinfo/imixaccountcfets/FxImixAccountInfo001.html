<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{FxImixAccountInfo001}">cfets交易账户设置</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="layui-col-md12 form-button-area" export="false" style="margin: 10px;">
            <a id="FxImixAccountInfo001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}" >新建</a>
        </div>
        <div class='joyin-form-wrap joyin-filter-form condition-area'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{FxImixAccountInfo001.accountid}">产品名称</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="accountid" name="accountid"
                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}" allowClear="true"
                                    data-th-data-url="@{/interf/cfetsup/imixbasicinfo/imixaccountcfets/FxImixAccountInfo001/getProductid}">
                            </select>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4  layui-col-sm4 layui-col-lg4 layui-col-xs4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{FxImixAccountInfo001.cfetsid}">产品交易账户21位机构代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="cfetsid" name="cfetsid"
                                   class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md4  layui-col-xs4 layui-col-sm4 layui-col-lg4">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{FxImixAccountInfo001.effectflag}">有效状态</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="effectflag" name="effectflag"
                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                    data-th-placeholder="#{SysCommon.placeholder}" allowClear="true"
                                    th:initValue="${effectflag}"
                                    data-th-data-url="@{/interf/cfetsup/imixbasicinfo/imixaccountcfets/FxImixAccountInfo001/getEffectfalg}">
                            </select>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/interf/cfetsup/imixbasicinfo/imixaccountcfets/FxImixAccountInfo001.js}"></script>
</div>
</body>
</html>
