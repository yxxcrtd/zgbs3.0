<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{FxImixAccountInfo002}">CFETS产品交易账户关联详情</title>
    <style>
        .label-text {
            color: #0b72f1;
            line-height: 24px;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base">
                <!--基本信息-->
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <h3 class="pro-module-title">
                            <span class="title-des"
                                  th:text="#{FxImixAccountInfo002.baseInfo}">基本信息
                            </span>
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item pro-item-wrap">
                            <input hidden data-th-value="${entity?.seqno}" name="seqno">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxImixAccountInfo002.accountid}">产品名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="accountid" name="accountid"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" allowClear="true"
                                                data-th-data-url="@{/interf/cfetsup/imixbasicinfo/imixaccountcfets/FxImixAccountInfo001/getProductid}"
                                                th:initValue="${entity?.accountid}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxImixAccountInfo002.jycs}">交易场所</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required disabled type="text" id="jycs" name="jycs"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                allowClear="true"
                                                formatoption="true" th:initValue="${entity?.jycs}"
                                                data-th-data-url="@{/interf/cfetsup/imixbasicinfo/imixaccountcfets/FxImixAccountInfo002/getJycs}"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxImixAccountInfo002.cstpid}">外汇交易中心6位码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="cstpid" name="cstpid"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                data-th-placeholder="#{SysCommon.placeholder}" allowClear="true"
                                                data-th-data-url="@{/interf/cfetsup/imixbasicinfo/imixaccountcfets/FxImixAccountInfo001/getCfetsid}"
                                                th:initValue="${entity?.cstpid}">
                                        </select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxImixAccountInfo002.cfetsid}">21位机构代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" required disabled id="cfetsid" name="cfetsid"
                                               class="layui-input form-input" placeholder="请输入内容"
                                               maxlength="21"
                                               th:placeholder="#{SysCommon.placeholder}" data-th-value="${entity?.cfetsid}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxImixAccountInfo002.cfetsname}">机构简称</label>
                                    <div class="layui-input-inline input-inline">
                                        <input type="text" required disabled id="cfetsname" name="cfetsname"
                                               class="layui-input form-input" maxlength="6"
                                               placeholder="请输入内容" data-th-value="${entity?.cfetsname}">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
                        <div class="row text-center" style="margin: 20px 0;">
                            <a th:id="FxImixAccountInfo002_btn_save" class="layui-btn layui-btn-sm btn-save"
                               th:text="#{SysCommon.save}">保存</a>
                            <a th:id="FxImixAccountInfo002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                               th:text="#{SysCommon.cancel}">取消</a>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/interf/cfetsup/imixbasicinfo/imixaccountcfets/FxImixAccountInfo002.js}"></script>

</div>
</body>

</html>
