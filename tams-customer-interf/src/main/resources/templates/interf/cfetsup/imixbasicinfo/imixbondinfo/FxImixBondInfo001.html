<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{FxImixBondInfo001}">银行间债券基本信息</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area" export="false"></div>
    <div class="joyin-form-wrap joyin-filter-form condition-area">
        <form class="layui-form" id="submitForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable" data-th-text="#{FxImixBondInfo001.secid}">债券代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="secid" name="secid"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/interf/cfetsup/imixbasicinfo/imixbondinfo/FxImixBondInfo001/querySecId}"
                                data-th-value="${entity?.secid}"
                                multiple="true" >
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxImixBondInfo001.specialdebt}">是否特殊债</label>
                    <div class="layui-input-inline input-inline">
                        <select id="specialdebt" name="specialdebt"
                                class="layui-input form-input input-select" allowClear="true"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-initValue="${entity?.specialdebt}"
                                data-th-data-url="@{/interf/cfetsup/imixbasicinfo/imixbondinfo/FxImixBondInfo001/getSpecialdebt}"
                                formatoption=true>
                        </select>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/interf/cfetsup/imixbasicinfo/imixbondinfo/FxImixBondInfo001.js}" type="text/javascript"></script>
</div>
</body>
</html>
