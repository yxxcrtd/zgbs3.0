<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{FxSecRequestQuote}">现券买卖请求报价</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a id="FxSecRequestQuote001_btn_add" class="layui-btn layui-btn-sm btn-add" data-th-text="#{FxSecRequestQuote.add}">新增</a>
        <a id="FxSecRequestQuote001_btn_reply" class="layui-btn layui-btn-sm btn-reply" data-th-text="#{FxSecRequestQuote.reply}">回复报价</a>
        <a id="FxSecRequestQuote001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke" data-th-text="#{FxSecRequestQuote.revoke}">撤回报价</a>
        <a id="FxSecRequestQuote001_btn_resend" class="layui-btn layui-btn-sm btn-resend" data-th-text="#{FxSecRequestQuote.resend}">再次发送</a>
        <a id="FxSecRequestQuote001_btn_copy" class="layui-btn layui-btn-sm btn-copy" data-th-text="#{FxSecRequestQuote.copy}">复制</a>
        <a id="FxSecRequestQuote001_btn_delete" class="layui-btn layui-btn-sm" data-th-text="#{FxSecRequestQuote.delete}">删除</a>
        <a id="FxSecRequestQuote001_btn_cancel" class="layui-btn layui-btn-sm" data-th-text="#{FxSecRequestQuote.cancel}">撤销</a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
        <form class="layui-form" id="submitForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxSecRequestQuote.quoteid}">报价编号</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="quoteid" name="quoteid"
                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxSecRequestQuote.trustid}">委托编号</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="trustid" name="trustid"
                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxSecRequestQuote.nbquoteid}">内部报价编号</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="nbquoteid" name="insideQuotationId"
                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxSecRequestQuote.dealdate}">交易日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="dealdate" name="dealdate"
                               class="layui-input form-input input-dateRangeSelect" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxSecRequestQuote.accountid}">产品名称</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="accountid" name="accountid"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" allowClear="true"
                                data-th-data-url="@{/interf/cfetsup/secrequestquote/FxSecRequestQuote002/getProductid}">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxSecRequestQuote.seccode}">债券代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="seccode" name="seccode"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}" allowClear="true"
                                data-th-data-url="@{/interf/cfetsup/secrequestquote/FxSecRequestQuote002/getSeccode}">
                        </select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxSecRequestQuote.tradestatus}">交易状态</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="tradestatus" name="tradestatus"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                allowClear="true" formatoption="true"
                                data-th-data-url="@{/interf/cfetsup/secrequestquote/FxSecRequestQuote002/getDataDict?key=QUOTETRADESTATUS}"></select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxSecRequestQuote.ps}">本方交易方向</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="ps" name="ps" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                allowClear="true"
                                data-th-data-url="@{/interf/cfetsup/secrequestquote/FxSecRequestQuote002/getDataDict?key=JYFX}"></select>
                    </div>
                </div>

                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxSecRequestQuote.sendstatus}">发送状态</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="sendstatus" name="sendstatus"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                allowClear="true" formatoption="true"
                                data-th-data-url="@{/interf/cfetsup/secrequestquote/FxSecRequestQuote002/getDataDict?key=SENDSTATUS}"></select>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/interf/cfetsup/secrequestquote/FxSecRequestQuote001.js}" type="text/javascript"></script>
</div>
</body>
</html>
