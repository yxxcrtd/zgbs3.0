<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{FxSecRequestQuote}">现券买卖请求报价</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
        <form class="layui-form" id="submitForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxSecRequestQuoteCounter.jycyid}">交易成员id</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="jycyid" name="jycyid"
                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxSecRequestQuoteCounter.jycyname}">本币对手方</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="countername" name="countername"
                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="counterTable"></table>
    </div>
    <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:30px;">
        <div class="row text-center" style="margin: 20px 0;">
            <a th:id="FxSecRequestQuote003_btn_confirm" class="layui-btn layui-btn-sm btn-submit"
               th:text="#{SysCommon.submit}">确认</a>
            <a th:id="FxSecRequestQuote003_btn_cnacel" class="layui-btn layui-btn-sm btn-cancel"
               th:text="#{SysCommon.cancel}">取消</a>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/interf/cfetsup/secrequestquote/FxSecRequestQuote003.js}" type="text/javascript"></script>
</div>
</body>
</html>
