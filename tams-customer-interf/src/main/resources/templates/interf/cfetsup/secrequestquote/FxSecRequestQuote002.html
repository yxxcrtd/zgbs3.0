<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title>请求报价详情信息</title>
    <style>
        .label-text{
            color: #0b72f1;
            line-height: 24px;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper">
                <!--基本信息-->
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <input  type="hidden" id="operateType" name="operateType" th:value="${entity?.operateType}">
                        <input  type="hidden" id="businessType" name="businessType" th:value="${entity?.businessType}">
                        <input  type="hidden" id="seqno" name="seqno" th:value="${entity?.seqno}">
                        <input  type="hidden" id="hometrader" name="hometrader" th:value="${entity?.hometrader}">
                        <input  type="hidden" id="homecstpid" name="homecstpid" th:value="${entity?.homecstpid}">
                        <input  type="hidden" id="counterList" name="counterList" th:value="${counterList}">
                        <h3 class="pro-module-title">
                            <span class="title-des"
                                  th:text="#{FxSecRequestQuote.baseInfo}">基本信息
                            </span>
                        </h3>
                        <div class="pro-module-wrap">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecRequestQuote.trustid}">委托编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="trustid" name="trustid"
                                                class="layui-input form-input reply" required maxlength="50" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                data-th-value="${entity?.trustid}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecRequestQuote.quoteid}">报价编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" disabled id="quoteid" name="quoteid"
                                                class="layui-input form-input" maxlength="50"
                                                data-th-value="${entity?.quoteid}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecRequestQuote.nbquoteid}">内部报价编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" disabled id="nbquoteid" name="nbquoteid"
                                                class="layui-input form-input" maxlength="50"
                                                data-th-value="${entity?.nbquoteid}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecRequestQuote.dealdate}">交易日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required  type="text" id="dealdate" name="dealdate"
                                               class="layui-input form-input input-dateSelect reply" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.dealdate==null ? dealdate : #dates.format(entity?.dealdate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecRequestQuote.settledate}">交割日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required  type="text" id="settledate" name="settledate"
                                               class="layui-input form-input input-dateSelect reply" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               data-th-value="${entity?.dealdate==null ? dealdate : #dates.format(entity?.dealdate,'yyyy-MM-dd')}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecRequestQuote.jycs}">交易场所</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required disabled type="text" id="jycs" name="jycs"
                                                class="layui-input form-input input-select reply" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                formatoption="true" th:initValue="${entity?.jycs}"
                                                data-th-data-url="@{/interf/cfetsup/secrequestquote/FxSecRequestQuote002/getDataDict?key=JYCS}"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecRequestQuote.accountname}">组合名称</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text"  id="accountname" name="accountname"
                                                class="layui-input form-input input-select reply" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                formatoption="true" allowClear="true"
                                                th:initValue="${entity?.accountid}"
                                                data-th-data-url="@{/interf/cfetsup/secrequestquote/FxSecRequestQuote002/getProductid}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecRequestQuote.accountid}">组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required type="text" disabled id="accountid" name="accountid" maxlength="10"
                                               class="layui-input form-input  reply" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" data-fixtype="2" data-textrange="0"
                                               data-th-value="${entity?.accountid}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecRequestQuote.homerole}">本方角色</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="homerole" name="homerole"
                                                class="layui-input form-input input-select reply" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                formatoption="true" th:initValue="${entity?.homerole}"
                                                data-th-data-url="@{/interf/cfetsup/secrequestquote/FxSecRequestQuote002/getDataDict?key=HOMEROLE}"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecRequestQuote.avalibleCash}">组合T日可用现金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" disabled id="avalibleCash" name="avalibleCash" maxlength="10"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" data-fixtype="2" data-textrange="0"
                                                data-th-value="${entity?.avalibleCash}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecRequestQuote.avaliblePosition}">组合T日可用持仓</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" disabled id="avaliblePosition" name="avaliblePosition" maxlength="10"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" data-fixtype="2" data-textrange="0"
                                                data-th-value="${entity?.avaliblePosition}">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!--委托价格参考-->
                        <div class="pro-module-wrap">
                            <div class="pro-module">
                                <h3 class="pro-module-title">
                            <span class="title-des"
                                  th:text="#{FxSecRequestQuote.trustprice}">委托价格参考</span>
                                </h3>
                                <div class="pro-module-item pro-item-wrap">
                                    <div class="layui-form-item">
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-label-wrap"
                                                   th:text="#{FxSecRequestQuote.cleanprice}">净价</label>
                                            <div class="layui-input-inline input-inline">
                                                <input  type="text" disabled id="cleanprice" name="        " maxlength="10"
                                                       class="layui-input form-input text-number" placeholder="请输入内容"
                                                       th:placeholder="#{SysCommon.placeholder}" data-fixtype="2" data-textrange="0"
                                                        data-th-value="${entity?.cleanprice}">
                                            </div>
                                        </div>
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-label-wrap"
                                                   th:text="#{FxSecRequestQuote.dirtyprice}">全价</label>
                                            <div class="layui-input-inline input-inline">
                                                <input  type="text" disabled id="dirtyprice" name="dirtyprice" maxlength="10"
                                                       class="layui-input form-input text-number" placeholder="请输入内容"
                                                       th:placeholder="#{SysCommon.placeholder}" data-fixtype="2" data-textrange="0"
                                                        data-th-value="${entity?.dirtyprice}">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="layui-form-item">
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-label-wrap"
                                                   th:text="#{FxSecRequestQuote.matureyield}">到期收益率</label>
                                            <div class="layui-input-inline input-inline">
                                                <input  type="text" disabled id="matureyield" name="matureyield" maxlength="10"
                                                        class="layui-input form-input text-number" placeholder="请输入内容"
                                                        data-th-value="${entity?.matureyield}">
                                            </div>
                                        </div>
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-label-wrap"
                                                   th:text="#{FxSecRequestQuote.exerciseyield}">行权收益率</label>
                                            <div class="layui-input-inline input-inline">
                                                <input  type="text" disabled id="exerciseyield" name="exerciseyield" maxlength="10"
                                                        class="layui-input form-input text-number" placeholder="请输入内容"
                                                        data-th-value="${entity?.exerciseyield}">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- 报价要素 -->
                        <div class="pro-module-wrap">
                            <div class="pro-module">
                                <h3 class="pro-module-title">
                            <span class="title-des"
                                  th:text="#{FxSecRequestQuote.quoteInfo}">报价要素</span>
                                </h3>
                                <div class="pro-module-item pro-item-wrap">
                                    <div class="layui-form-item">
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-label-wrap"
                                                   th:text="#{FxSecRequestQuote.secname}">债券简称</label>
                                            <div class="layui-input-inline input-inline">
                                                <select required type="text"  id="secname" name="secname"
                                                        class="layui-input form-input input-select reply" placeholder="请输入内容"
                                                        th:placeholder="#{SysCommon.placeholder}"
                                                        allowClear="true"
                                                        formatoption="true"
                                                        th:initValue="${entity?.seccode}"
                                                        data-th-data-url="@{/interf/cfetsup/secrequestquote/FxSecRequestQuote002/getSeccode}"></select>
                                            </div>
                                        </div>
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-label-wrap"
                                                   th:text="#{FxSecRequestQuote.seccode}">债券代码</label>
                                            <div class="layui-input-inline input-inline">
                                                <input required type="text" disabled id="seccode" name="seccode" maxlength="10"
                                                       class="layui-input form-input " placeholder="请输入内容"
                                                       th:placeholder="#{SysCommon.placeholder}" data-fixtype="2" data-textrange="0"
                                                       data-th-value="${entity?.seccode}">
                                            </div>
                                        </div>
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-label-wrap"
                                                   th:text="#{FxSecRequestQuote.ps}">交易方向</label>
                                            <div class="layui-input-inline input-inline">
                                                <select required type="text"  id="ps" name="ps"
                                                        class="layui-input form-input input-select reply" placeholder="请输入内容"
                                                        th:placeholder="#{SysCommon.placeholder}"
                                                        allowClear="true"
                                                        formatoption="true"
                                                        th:initValue="${entity?.ps}"
                                                        data-th-data-url="@{/interf/cfetsup/secrequestquote/FxSecRequestQuote002/getDataDict?key=JYFX}"></select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="layui-form-item">
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-label-wrap"
                                                   th:text="#{FxSecRequestQuote.prinamt}">券面总额(万元)</label>
                                            <div class="layui-input-inline input-inline">
                                                <input  type="text" required id="prinamt" name="prinamt" maxlength="10"
                                                        class="layui-input form-input reply" placeholder="请输入内容"
                                                        data-th-value="${entity?.prinamt}">
                                            </div>
                                        </div>
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-label-wrap"
                                                   th:text="#{FxSecRequestQuote.settlespeed}">清算速度</label>
                                            <div class="layui-input-inline input-inline">
                                                <select required type="text"  id="settlespeed" name="settlespeed"
                                                        class="layui-input form-input input-select reply" placeholder="请输入内容"
                                                        th:placeholder="#{SysCommon.placeholder}"
                                                        allowClear="true"
                                                        formatoption="true"
                                                        th:initValue="${entity?.settlespeed}"
                                                        data-th-data-url="@{/interf/cfetsup/secrequestquote/FxSecRequestQuote002/getDataDict?key=SETTLESPEED}"></select>
                                            </div>
                                        </div>
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-label-wrap"
                                                   th:text="#{FxSecRequestQuote.settletype}">清算类型</label>
                                            <div class="layui-input-inline input-inline">
                                                <select required type="text"  id="settletype" name="settletype"
                                                        class="layui-input form-input input-select reply" placeholder="请输入内容"
                                                        th:placeholder="#{SysCommon.placeholder}"
                                                        allowClear="true"
                                                        formatoption="true"
                                                        th:initValue="${entity?.settletype}"
                                                        data-th-data-url="@{/interf/cfetsup/secrequestquote/FxSecRequestQuote002/getDataDict?key=SETTLETYPE}"></select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="layui-form-item">
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-label-wrap"
                                                   th:text="#{FxSecRequestQuote.settlemode}">结算方式</label>
                                            <div class="layui-input-inline input-inline">
                                                <select required type="text"  id="settlemode" name="settlemode"
                                                        class="layui-input form-input input-select reply" placeholder="请输入内容"
                                                        th:placeholder="#{SysCommon.placeholder}"
                                                        allowClear="true"
                                                        formatoption="true"
                                                        th:initValue="${entity?.settlemode}"
                                                        data-th-data-url="@{/interf/cfetsup/secrequestquote/FxSecRequestQuote002/getDataDict?key=JSFS}"></select>
                                            </div>
                                        </div>
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-label-wrap"
                                                   th:text="#{FxSecRequestQuote.ccy}">结算币种</label>
                                            <div class="layui-input-inline input-inline">
                                                <select required type="text"  id="ccy" name="ccy"
                                                        class="layui-input form-input input-select reply" placeholder="请输入内容"
                                                        th:placeholder="#{SysCommon.placeholder}"
                                                        allowClear="true"
                                                        formatoption="true"
                                                        th:initValue="${entity?.ccy}"
                                                        data-th-data-url="@{/interf/cfetsup/secrequestquote/FxSecRequestQuote002/getDataDict?key=CCY}"></select>
                                            </div>
                                        </div>
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-label-wrap"
                                                   th:text="#{FxSecRequestQuote.accuir}">应计利息</label>
                                            <div class="layui-input-inline input-inline">
                                                <input  type="text" required id="accuir" name="accuir" maxlength="10"
                                                        class="layui-input form-input reply" placeholder="请输入内容"
                                                        data-th-value="${entity?.accuir}">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="layui-form-item">
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-label-wrap"
                                                   th:text="#{FxSecRequestQuote.homecstpname}">本币本方</label>
                                            <div class="layui-input-inline input-inline">
                                                <input  type="text" disabled required id="homecstpname" name="homecstpname" maxlength="10"
                                                        class="layui-input form-input reply" placeholder="请输入内容"
                                                        data-th-value="${entity?.homecstpname}">
                                            </div>
                                        </div>
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-label-wrap"
                                                   th:text="#{FxSecRequestQuote.hometrader}">本方交易员</label>
                                            <div class="layui-input-inline input-inline">
                                                <input  type="text" disabled id="hometradername" name="hometradername" maxlength="10"
                                                        class="layui-input form-input reply" placeholder="请输入内容"
                                                        data-th-value="${entity?.hometradername}">
                                            </div>
                                        </div>
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-label-wrap"
                                                   th:text="#{FxSecRequestQuote.exchangerate}">汇率</label>
                                            <div class="layui-input-inline input-inline">
                                                <input  type="text" id="exchangerate" name="exchangerate" maxlength="10"
                                                        class="layui-input form-input reply" placeholder="请输入内容"
                                                        data-th-value="${entity?.exchangerate}">
                                            </div>
                                        </div>
                                    </div>
                                    <div class="layui-form-item">
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-label-wrap"
                                                   th:text="#{FxSecRequestQuote.effecttime}">报价有效时间</label>
                                            <div class="layui-input-inline input-inline">
                                                <input disabled type="text" id="effecttime" name="effecttime" maxlength="10"
                                                        class="layui-input form-input" placeholder="请输入内容"
                                                        data-th-value="${entity?.effecttime==null ? effecttime : #dates.format(entity?.effecttime,'yyyy-MM-dd HH:mm:ss.sss')}">
                                            </div>
                                        </div>
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-label-wrap"
                                                   th:text="#{FxSecRequestQuote.hunprincipalamt}">每百元金额(元)</label>
                                            <div class="layui-input-inline input-inline">
                                                <input  type="text" id="hunprincipalamt" name="hunprincipalamt" maxlength="10"
                                                        class="layui-input form-input reply" placeholder="请输入内容"
                                                        data-th-value="${entity?.hunprincipalamt}">
                                            </div>
                                        </div>
                                        <div class="form-inline-wrap">
                                            <label class="layui-form-label form-label-wrap"
                                                   th:text="#{FxSecRequestQuote.principalamt}">本金额(元)</label>
                                            <div class="layui-input-inline input-inline">
                                                <input  type="text" id="principalamt" name="principalamt" maxlength="10"
                                                        class="layui-input form-input reply" placeholder="请输入内容"
                                                        data-th-value="${entity?.hunprincipalamt}">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!--交易对手选择-->
                        <div class="pro-module-wrap">
                            <div class="pro-module">
                                <h3 class="pro-module-title">
                                    <span class="title-des" th:text="#{FxSecRequestQuote.counter}">交易对手</span>
                                    <a class="layui-btn layui-btn-sm btn-create" id="FxSecRequestQuote002_btn_add"><i class="iconfont icon-found"></i><span>新建</span></a>
                                    <a class="layui-btn layui-btn-sm btn-delete" id="FxSecRequestQuote002_btn_delete"><i class="iconfont icon-found"></i><span>删除</span></a>
                                </h3>

                                <div class="pro-module-item">
                                    <div class="pro-module-item">
                                        <table class="layui-table" id="counterTable"></table>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!--备注-->
                        <div class="pro-module-wrap">
                            <div class="pro-module">

                                <h3 class="pro-module-title">
                            <span class="title-des"
                                  th:text="#{FxSecRequestQuote.remark}">备注</span>
                                    <i class="iconfont icon-arrow-down pro-down-icon"></i>
                                </h3>
                                <div class="pro-module-item pro-item-wrap">
                                    <div class="layui-form-item">
                                        <div class="layui-form-item">
                                            <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                        <textarea id="remark" name="remark" maxlength="1000" th:text="${entity?.remark}"
                                                  class="layui-textarea reply" placeholder="请输入内容"
                                                  th:placeholder="#{SysCommon.placeholder}"></textarea>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- 风险试算 -->
                        <div id="baseRiskMathComm" class="page-component" th:data-path="@{/component/common/BaseRiskMathComm/init}" th:data-params="|{entity: '${riskTrialRetDto}',workflowId:'${workflowId?: ''}',entityName:'riskTrialRetDto',tradeId:'${tradeId}'}|"></div>
                        <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin:50px;">
                            <div class="row text-center" style="margin: 20px 0;">
                                <a th:id="FxSecRequestQuote002_btn_risk" class="layui-btn layui-btn-sm"
                                   th:text="#{FxSecRequestQuote.riskcal}">风险试算</a>
                                <a th:id="FxSecRequestQuote002_btn_save" class="layui-btn layui-btn-sm btn-save"
                                   th:text="#{SysCommon.save}">保存</a>
                                <a th:id="FxSecRequestQuote002_btn_submit" class="layui-btn layui-btn-sm btn-submit"
                                   th:text="#{SysCommon.submit}">提交</a>
                                <a th:id="FxSecRequestQuote002_btn_confirm" class="layui-btn layui-btn-sm"
                                   th:text="#{FxSecRequestQuote002.confirm}">成交</a>
                                <a th:id="FxSecRequestQuote002_btn_revoke" class="layui-btn layui-btn-sm"
                                   th:text="#{FxSecRequestQuote002.revoke}">撤回</a>
                                <a th:id="FxSecRequestQuote002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel"
                                   th:text="#{SysCommon.cancel}">取消</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
