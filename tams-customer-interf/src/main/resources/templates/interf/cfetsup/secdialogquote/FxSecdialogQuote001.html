<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">

<head>
    <title data-th-text="#{FxSecdialogQuote001}">现券买卖对话报价</title>
</head>
<body>
<div layout:fragment="content">
    <div class="form-button-area">
        <a id="FxSecdialogQuote001_btn_quotation_reply" class="layui-btn layui-btn-sm btn-reply" data-th-text="#{FxSecdialogQuote001.reply}">回复报价</a>
        <a id="FxSecdialogQuote001_btn_quotation_update" class="layui-btn layui-btn-sm btn-update" data-th-text="#{FxSecdialogQuote001.update}">修改报价</a>
        <a id="FxSecdialogQuote001_btn_quotation_revoke" class="layui-btn layui-btn-sm btn-revoke" data-th-text="#{FxSecdialogQuote001.revoke}">撤回报价</a>
        <a id="FxSecdialogQuote001_btn_riskcal" class="layui-btn layui-btn-sm btn-riskcal" data-th-text="#{FxSecdialogQuote001.riskcal}">风险试算</a>
        <a id="FxSecdialogQuote001_btn_send" class="layui-btn layui-btn-sm btn-send" data-th-text="#{FxSecdialogQuote001.send}">发送</a>
        <a id="FxSecdialogQuote001_btn_copy" class="layui-btn layui-btn-sm btn-copy" data-th-text="#{FxSecdialogQuote001.copy}">复制</a>
        <a id="FxSecdialogQuote001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
        <a id="FxSecdialogQuote001_btn_revoke" class="layui-btn layui-btn-sm btn-revoke" ><i class="iconfont icon-revoke"></i><span data-th-text="#{SysCommon.revoke}">撤销</span></a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
        <form class="layui-form" id="submitForm">
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxSecdialogQuote001.quoteid}">报价编号</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="quoteid" name="quoteid"
                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-value="${entity?.quoteid}">
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxSecdialogQuote001.trustid}">委托编号</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="trustid" name="trustid"
                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-value="${entity?.trustid}">
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxSecdialogQuote001.seccode}">资产代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="seccode" name="seccode"
                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-value="${entity?.seccode}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxSecdialogQuote001.portfolioId}">组合代码</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="portfolioId" name="portfolioId"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-url="@{/interf/cfetsup/secdialogquote/FxSecdialogQuote001/getPortfolioId}"
                                data-th-value="${entity?.portfolioId}"
                                multiple="true">
                        </select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxSecdialogQuote001.ps}">交易方向</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="ps" name="ps" class="layui-input form-input input-select"
                                placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${PS_XQ}' allowClear="true" formatoption="true"
                                data-th-initValue="${entity?.ps}"></select>
                    </div>
                </div>
                <div class="layui-inline layui-col-md4 layui-col-xs4 layui-col-sm4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{FxSecdialogQuote001.dealdate}">交易日期</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="dealdate" name="dealdate"
                               class="layui-input form-input input-dateRangeSelect" placeholder="请输入时间区间"
                               data-th-placeholder="#{SysCommon.placeholder}">
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxSecdialogQuote001.tradestatus}">交易状态</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="tradestatus" name="tradestatus"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${TRADESTATUS}'
                                allowClear="true" formatoption="true"
                                data-th-initValue="${entity?.tradestatus}"></select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxSecdialogQuote001.sendstatus}">发送状态</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" id="sendstatus" name="sendstatus"
                                class="layui-input form-input input-select" placeholder="请输入内容"
                                data-th-placeholder="#{SysCommon.placeholder}"
                                data-th-data-result='${SENDSTATUS}'
                                allowClear="true" formatoption="true"
                                data-th-initValue="${entity?.sendstatus}"></select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FxSecdialogQuote001.nbquoteid}">内部报价编号</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="nbquoteid" name="insideQuotationId"
                               class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}"
                               data-th-data-url="@{/interf/cfetsup/secdialogquote/FxSecdialogQuote001/getNbquoteid}"
                               data-th-value="${entity?.nbquoteid}">
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-src="@{/js/interf/cfetsup/secdialogquote/FxSecdialogQuote001.js}" type="text/javascript"></script>
</div>
</body>
</html>
