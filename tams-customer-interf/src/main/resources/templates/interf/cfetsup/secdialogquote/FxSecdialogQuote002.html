<!DOCTYPE html>
<html xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.springframework.org/schema/mvc"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{FxSecdialogQuote002}">现券买卖对话报价新建</title>
</head>
<body>
<div layout:fragment="content">
    <style type="text/css">
        .layui-form-radio div {
            font-size: 12px;
        }
        .layui-form-radio i{
            font-size: 14px;
            margin-right: -16px;
            margin-top: -7px;
        }
    </style>
    <div class="pro-module-container">
        <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
            <div class="pro-module-wrapper pro-module-base">
                <!--基本信息-->
                <div class="pro-module-wrap">
                    <div class="pro-module">
                        <input  type="hidden" id="seqno" name="seqno" th:value="${entity?.seqno}">
                        <h3 class="pro-module-title">
                            <span class="title-des"
                                  th:text="#{FxSecdialogQuote002.baseInfo}">基本信息
                            </span>
                            （<span class="star-sign">*</span>必填）
                            <i class="iconfont icon-arrow-down pro-down-icon"></i>
                        </h3>
                        <div class="pro-module-item pro-item-wrap">
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecdialogQuote002.trustid}">委托编号</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  type="text" id="trustid" name="trustid"
                                                class="layui-input form-input" required  placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:value="${entity?.trustid}">
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecdialogQuote002.dealdate}">交易日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required disabled type="text" id="dealdate" name="dealdate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${entity?.dealdate==null ? platDate : #dates.format(entity?.dealdate,'yyyy-MM-dd')}" />
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecdialogQuote002.settledate}">交割日期</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required  disabled type="text" id="settledate" name="settledate"
                                               class="layui-input form-input input-dateSelect" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}"
                                               th:value="${#dates.format(entity?.settledate,'yyyy-MM-dd')}" />
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecdialogQuote002.jycs}">交易场所</label>
                                    <div class="layui-input-inline input-inline">
                                        <select required type="text" id="jycs" name="jycs"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                data-th-data-result='${TRADE_PLACE}' allowClear="true"
                                                formatoption="true"
                                                th:initValue="${entity?.jycs}"></select>
                                    </div>
                                </div>
                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecdialogQuote002.portfolioId}">组合代码</label>
                                    <div class="layui-input-inline input-inline">
                                        <select type="text" id="portfolioId" name="portfolioId"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:data-url="@{/interf/cfetsup/secdialogquote/FxSecdialogQuote001/getPortfolioId}"
                                                allowClear="true" th:initValue="${entity?.portfolioId}"></select>
                                    </div>
                                </div>
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecdialogQuote002.portfolioName}">组合名称</label>
                                    <div class="layui-input-inline input-inline hidden">
                                        <input  disabled type="text" id="portfolioName" name="portfolioName"
                                                class="layui-input form-input" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.portfolioName}">
                                    </div>
                                </div>

                            </div>
                            <div class="layui-form-item">
                                <div class="form-inline-wrap">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecdialogQuote002.homerole}">本方角色</label>
                                    <div class="layui-input-inline input-inline" id="termTypeRebackDiv">
                                        <select required type="text" id="homerole" name="homerole"
                                                class="layui-input form-input input-select"
                                                data-th-placeholder="#{SysCommon.placeholder}"
                                                th:data-result='${HOMEROLE}'
                                                data-th-initvalue="${entity?.homerole}"></select>
                                    </div>
                                </div>

                                <div class="form-inline-wrap" id="avaliblecash_div">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecdialogQuote002.avaliblecash}">组合T日可用现金</label>
                                    <div class="layui-input-inline input-inline">
                                        <input  required disabled type="text" id="avaliblecash" name="avaliblecash"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" data-fixtype="2" data-textrange="0"
                                               th:value="${entity?.avaliblecash}">
                                    </div>
                                </div>
                                <div class="form-inline-wrap" id="avalibleholdposition_div">
                                    <label class="layui-form-label form-label-wrap"
                                           th:text="#{FxSecdialogQuote002.avalibleholdposition}">组合T日可用持仓</label>
                                    <div class="layui-input-inline input-inline">
                                        <input required disabled type="text" id="avalibleholdposition" name="avalibleholdposition"
                                               class="layui-input form-input text-number" placeholder="请输入内容"
                                               th:placeholder="#{SysCommon.placeholder}" data-fixtype="2" data-textrange="0"
                                               th:value="${entity?.avalibleholdposition}">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <input type="hidden" id="calendarId" name="calendarId" th:value="${entity?.calendarId}" />
                    </div>
                    <!--报价信息-->
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                            <span class="title-des"
                                  th:text="#{FxSecdialogQuote002.quoteInfo}">报价要素</span>
                                （<span class="star-sign">*</span>必填）
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item pro-item-wrap">
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               th:text="#{FxSecdialogQuote002.seccode}">债券代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <select required type="text" id="seccode" name="seccode"
                                                    class="layui-input form-input input-select" placeholder="请输入内容"
                                                    th:placeholder="#{SysCommon.placeholder}" th:data-url="@{/interf/cfetsup/secdialogquote/FxSecdialogQuote002/getFinprodId}"
                                                    allowClear="true" th:initValue="${entity?.seccode}"></select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               th:text="#{FxSecdialogQuote002.secname}">债券简称</label>
                                        <div class="layui-input-inline input-inline hidden">
                                            <input  disabled type="text" id="secname" name="secname"
                                                    class="layui-input form-input" placeholder="请输入内容"
                                                    th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.secname}">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               th:text="#{FxSecdialogQuote002.ps}">交易方向</label>
                                        <div class="layui-input-inline input-inline">
                                            <select required type="text" id="ps" name="ps" class="layui-input form-input input-select"
                                                    placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                    th:data-result='${PS_XQ}' allowClear="true" formatoption="true"
                                                    th:initValue="*{entity?.ps}"></select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               th:text="#{FxSecdialogQuote002.homecstpid}">本币本方</label>
                                        <div class="layui-input-inline input-inline">
                                            <select required type="text"  id="homecstpid" name="homecstpid"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:data-url="@{/interf/cfetsup/secrepoquote/FxSecrepoQuote001/getMenInfo}" allowClear="true"
                                                formatoption="true"
                                                th:initValue="${entity?.homecstpid}"></select>
                                                
                                                 <!--    <input  type="text" id="homecstpid" name="homecstpid"
                                                    class="layui-input form-input" placeholder="请输入内容"
                                                    th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.homecstpid}"> -->
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               th:text="#{FxSecdialogQuote002.hometrader}">本币本方交易员</label>
                                        <div class="layui-input-inline input-inline">
                                           <select required type="text"  id="hometrader" name="hometrader"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:data-url="@{/interf/cfetsup/secrepoquote/FxSecrepoQuote001/getMenInfo}" allowClear="true"
                                                formatoption="true"
                                                th:initValue="${entity?.hometrader}"></select>
                                        
                                            <!-- <input  type="text" id="hometrader" name="hometrader"
                                                    class="layui-input form-input" placeholder="请输入内容"
                                                    th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.hometrader}"> -->
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               th:text="#{FxSecdialogQuote002.counterid}">本币对手方</label>
                                        <div class="layui-input-inline input-inline">
                                           
                                        <select required type="text"  id="counterid" name="counterid"
                                                class="layui-input form-input input-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:data-url="@{/interf/cfetsup/secrepoquote/FxSecrepoQuote001/getMenInfo}" allowClear="true"
                                                formatoption="true"
                                                th:initValue="${entity?.counterid}"></select>
                                                
                                            <!-- <input  type="text" id="counterid" name="counterid"
                                                    class="layui-input form-input" placeholder="请输入内容"
                                                    th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.counterid}"> -->
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               th:text="#{FxSecdialogQuote002.countertrader}">本币对手方交易员</label>
                                        <div class="layui-input-inline input-inline">
                                            <select required type="text"  id="countertrader" name="countertrader"
                                                class="layui-input form-input input-select choose-select" placeholder="请输入内容"
                                                th:placeholder="#{SysCommon.placeholder}"
                                                th:data-url="@{/interf/cfetsup/secrepoquote/FxSecrepoQuote001/getMenInfo}" allowClear="true"
                                                formatoption="true"
                                                th:initValue="${entity?.countertrader}"></select>
                                                
                                            <!-- <input  type="text" id="countertrader" name="countertrader"
                                                    class="layui-input form-input" placeholder="请输入内容"
                                                    th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.countertrader}"> -->
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">
                                            <input type="radio" id="calculateField_cleanprice" name="calculateField" value="cleanprice" th:text="#{FxSecdialogQuote002.cleanprice}">
                                        </label>
                                        <div class="layui-input-inline input-inline">
                                            <input required type="text" id="cleanprice" name="cleanprice"  th:value="${entity?.cleanprice}"
                                                    formatoption="true" allowclear="true"
                                                    class="layui-input form-input text-number">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">
                                            净价总额
                                        </label>
                                        <div class="layui-input-inline input-inline">
                                            <input  type="text" id="cpriceamt" name="cpriceamt"  th:value="${entity?.cpriceamt}"
                                                    formatoption="true" allowclear="true"
                                                    class="layui-input form-input text-number">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" >
                                        <label class="layui-form-label form-label-wrap">
                                              <input type="radio" id="calculateField_matureyield" name="calculateField" value="matureyield" th:text="#{FxSecdialogQuote002.matureyield}">
                                        </label>
                                        <div class="layui-input-inline input-inline">
                                            <input required type="text" id="matureyield" name="matureyield"
                                                    style="width: 200px; display: inline-block;"
                                                    class="layui-input form-input text-number" placeholder="请输入内容"
                                                    data-textrange="12"
                                                    th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.matureyield}">
                                            <div class="layui-input-inline input-inline"
                                                 style="width: 20px!important; float: right;">
                                                <a th:id="|${pageId}_btn_calculate|" class="layui-btn layui-btn-sm"
                                                   data-th-text="#{FxSecdialogQuote002.calculate}">计算</a>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">全价（元）</label>
                                        <div class="layui-input-inline input-inline">
                                            <input  type="text" id="dirtyprice" name="dirtyprice"  th:value="${entity?.dirtyprice}"
                                                    class="layui-input form-input text-number">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">
                                            <input type="radio" id="calculateField_dpriceamt" name="calculateField" value="dpriceamt" th:text="#{FxSecdialogQuote002.dpriceamt}">
                                        </label>
                                        <div required class="layui-input-inline input-inline">
                                            <input  type="text" id="dpriceamt" name="dpriceamt"  th:value="${entity?.dpriceamt}"
                                                    class="layui-input form-input text-number">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" id="exerciseyieldDiv">
                                        <label class="layui-form-label form-label-wrap">
                                            <input type="radio" id="calculateField_exerciseyield" name="calculateField" value="exerciseyield" th:text="#{FxSecdialogQuote002.exerciseyield}">
                                        </label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="exerciseyield" name="exerciseyield"
                                                   class="layui-input form-input text-number" placeholder="请输入内容"
                                                    data-textrange="12"
                                                   th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.exerciseyield}" />
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">券面总额（万元）</label>
                                        <div class="layui-input-inline input-inline">
                                            <input required type="text" id="prinamt" name="prinamt"  th:value="${entity?.prinamt}"
                                                    class="layui-input form-input text-number">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">结算方式</label>
                                        <div class="layui-input-inline input-inline">
                                            <select required type="text" id="settlemode" name="settlemode" class="layui-input form-input input-select"
                                                    placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                    th:data-result='${BUYCLEARINGFORM}' allowClear="true" formatoption="true"
                                                    th:initValue="*{entity?.settlemode}"></select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" >
                                        <label class="layui-form-label form-label-wrap"
                                               th:text="#{FxSecdialogQuote002.settletype}">清算类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <select required type="text" id="settletype" name="settletype" class="layui-input form-input input-select"
                                                    placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                    th:data-result='${SETTLETYPE_XQ}' allowClear="true" formatoption="true"
                                                    th:initValue="*{entity?.settletype}"></select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" >
                                        <label class="layui-form-label form-label-wrap"
                                               th:text="#{FxSecdialogQuote002.settlespeed}">清算速度</label>
                                        <div class="layui-input-inline input-inline">
                                            <select required type="text" id="settlespeed" name="settlespeed" class="layui-input form-input input-select"
                                                    placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                    th:data-result='${ACCOUNT_SPEED}' allowClear="true" formatoption="true"
                                                    th:initValue="*{entity?.settlespeed}"></select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" >
                                        <label class="layui-form-label form-label-wrap"
                                               th:text="#{FxSecdialogQuote002.ccy}">结算币种</label>
                                        <div class="layui-input-inline input-inline">
                                            <select required type="text" id="ccy" name="ccy" class="layui-input form-input input-select"
                                                    placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                    th:data-result='${CCY}' allowClear="true" formatoption="true"
                                                    th:initValue="*{entity?.ccy}"></select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" >
                                        <label class="layui-form-label form-label-wrap"
                                               th:text="#{FxSecdialogQuote002.exchangerate}">汇率</label>
                                        <div class="layui-input-inline input-inline">
                                            <input  type="text" id="exchangerate" name="exchangerate"
                                                    class="layui-input form-input text-number" placeholder="请输入内容"
                                                    th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.exchangerate}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap" >
                                        <label class="layui-form-label form-label-wrap"
                                               th:text="#{FxSecdialogQuote002.accuir}">应计利息（元）</label>
                                        <div class="layui-input-inline input-inline">
                                            <input  type="text" id="accuir" name="accuir"
                                                    class="layui-input form-input text-number" placeholder="请输入内容"
                                                    th:placeholder="#{SysCommon.placeholder}" th:value="${entity?.accuir}">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">应计利息总额（元）</label>
                                        <div class="layui-input-inline input-inline">
                                            <input  type="text" id="accuiramt" name="accuiramt"  th:value="${entity?.accuiramt}"
                                                    class="layui-input form-input text-number">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">交易金额（元）</label>
                                        <div class="layui-input-inline input-inline">
                                            <input  type="text" id="tradeamt" name="tradeamt"  th:value="${entity?.tradeamt}"
                                                    class="layui-input form-input text-number">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">结算金额（元）</label>
                                        <div class="layui-input-inline input-inline">
                                            <input  type="text" id="settleamt" name="settleamt"  th:value="${entity?.settleamt}"
                                                    class="layui-input form-input text-number">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">每百元金额（元）</label>
                                        <div class="layui-input-inline input-inline">
                                            <input  type="text" id="hunprincipalamt" name="hunprincipalamt"  th:value="${entity?.hunprincipalamt}"
                                                    class="layui-input form-input text-number">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">本金额（元）</label>
                                        <div class="layui-input-inline input-inline">
                                            <input  type="text" id="principalamt" name="principalamt"  th:value="${entity?.principalamt}"
                                                    class="layui-input form-input text-number">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap" id="replyType_div" style="display: none" >
                                        <label class="layui-form-label form-label-wrap"
                                               th:text="#{FxSecdialogQuote002.replyType}">回复报价</label>
                                        <div class="layui-input-inline input-inline">
                                            <select required type="text" id="replyType" name="replyType" class="layui-input form-input input-select"
                                                    placeholder="请输入内容" th:placeholder="#{SysCommon.placeholder}"
                                                    th:data-result='${REPLY_TYPE}' allowClear="true" formatoption="true"
                                                    th:initValue="*{entity?.replyType}"></select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!--备注-->
                    <div class="pro-module-wrap">
                        <div class="pro-module">

                            <h3 class="pro-module-title">
                            <span class="title-des"
                                  th:text="#{FxSecdialogQuote002.remark}">备注</span>
                                <i class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item pro-item-wrap">
                                <div class="layui-form-item">
                                    <div class="layui-form-item">
                                        <div class="layui-input-inline input-inline" style="margin:0 10px;width: 98%!important;">
                                        <textarea id="remark" name="remark" maxlength="1000" th:text="${entity?.remark}"
                                                  class="layui-textarea" placeholder="请输入内容"
                                                  th:placeholder="#{SysCommon.placeholder}"></textarea>
                                        </div>
                                    </div>
                                </div>
                            </div>
