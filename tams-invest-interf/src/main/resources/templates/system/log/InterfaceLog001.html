<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{InterfaceLog001}">接口日志信息查询</title>
</head>
<body>
    <div layout:fragment="content" id="InterfaceLog001_DIV">
        <div class="form-button-area">

        </div>
        <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
        <form class="layui-form" id="searchForm" >

            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
					<label class="layui-form-label form-lable">接口编号 </label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" name="interfId" id="interfId" class="layui-input form-input"  >
                    </div>
				</div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
					<label class="layui-form-label form-lable" >发送状态 </label>
					<div class="layui-input-inline input-inline">
						<select id="interfSts" name="interfSts"
							class="layui-input form-input input-select" allowClear="true"
							data-th-data-result="${interfStsType}"></select>
					</div>
				</div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4" >
					<label class="layui-form-label form-lable">发送日期 </label>
                    <div class="layui-input-inline input-inline">
                        <input name="createTime" id="createTime"
                               class="layui-input form-input input-dateRangeSelect"
                               placeholder="请选择、支持区间"
                               data-th-placeholder="#{SysCommon.dateInterval}">
                    </div>
				</div>
				
			</div>

            </form>   
        </div> 
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
    <div layout:fragment="script">
    	<script data-th-inline="javascript" type="text/javascript">

    	</script>
        <script data-th-src="@{/js/system/log/InterfaceLog001.js}" type="text/javascript"></script>

    </div>
</body>

</html>
