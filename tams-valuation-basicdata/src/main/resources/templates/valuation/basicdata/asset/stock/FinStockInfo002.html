<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{FinStockInfo002}">股票标的信息</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
        <div class="pro-module-wrapper pro-module-base">
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <input id="finprodId" name="finprodId"
                           data-th-value="${entity?.finprodId}" type="hidden" />
                    <input id="gp" name="gp"
                           data-th-value="${gp}" type="hidden" />
                    <input id="realFinProductId" name="realFinProductId"
                           data-th-value="${entity?.realFinProductId}" type="hidden" />
                    <h3 class="pro-module-title">
                        <span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i
                        class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item">
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{FinStockInfo002.finprodMarketId}">资产代码</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="finprodMarketId"
                                           name="finprodMarketId" required="required"
                                           style=" width: 85%!important; display: inline-block;"
                                           class="layui-input form-input" placeholder="" maxlength="18"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value="${entity?.finprodMarketId}" />
                                    <input type="text" id="tradeMarketId" name="tradeMarketId"
                                           data-th-value="${entity?.tradeMarketId}"
                                           class="layui-input form-input" style="width: 15%!important; display: inline-block;" readonly />
                                </div>

                            </div>
                            <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{FinStockInfo002.finprodAbbr}">资产名称</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="finprodName" name="finprodName"
                                           required="required" class="layui-input form-input "
                                           placeholder="" maxlength="100"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           data-th-value="${entity?.finprodAbbr}"/>
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{FinStockInfo002.finCompanyName}"> 公司名称</label>
                                <div class="layui-input-inline input-inline">
                                    <select type="text" id="issuer" name="issuer"
                                            required="required"
                                            class="layui-input form-input input-select"
                                            placeholder=""
                                            data-th-data-url="@{/valuation/basicdata/asset/ValAssetCommon/getCustomerName(finprodType=${FINPROD_TYPE_F10},isIssuer=${YES_OR_NO_Y})}"
                                            data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-initValue="${entity?.issuer}" >
                                    </select>
                                </div>
                            </div>
                        </div>
                       <!--  <a id='magnifier' class="input-right-show" href='javascript:;'
                           style='color:#4893e6;left: 33.5%; top: 43px;'><i class='iconfont icon-search'></i></a> -->
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-xs4 layui-col-md4 layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-lable"
                                       data-th-text="#{FinStockInfo002.tradeMarket}">交易场所</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="tradeMarket" name="tradeMarket"
                                           class="layui-input form-input input-select" th:allowclear="true"
                                           placeholder="请选择交易场所" data-th-placeholder="#{SysCommon.placeholder}"
                                           aria-hidden="true"
                                           childrenIds="board"
                                           data-th-value="${entity?.tradeMarket}"
                                           data-th-data-result="${TRADE_PLACE}" th:formatoption="true" required />
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{FinStockInfo002.board}">上市板</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="board" name="board"
                                            class="layui-input form-input input-select"
                                            data-th-data-result='${BOARD}' th:allowClear="true"
                                            th:placeholder="请输入内容"
                                           parentIds="tradeMarket"
                                            data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-value="${entity?.board}" required />
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{FinStockInfo002.vDate}">上市日期</label>
                                <div class="layui-input-inline input-inline">
                                    <input id="vdate" name="vdate"
                                           class="layui-input form-input input-dateSelect"
                                           placeholder="请选择时间"
                                           data-th-value="${#dates.format(entity?.vdate,'yyyy-MM-dd')}"
                                           required="required"
                                           data-th-placeholder="#{SysCommon.placeholder}"/>
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{FinStockInfo002.mDate}">退市日期</label>
                                <div class="layui-input-inline input-inline">
                                    <input id="mdate" name="mdate"
                                           class="layui-input form-input input-dateSelect"
                                           placeholder="请选择时间"
                                           data-th-value="${#dates.format(entity?.mdate,'yyyy-MM-dd')}"
                                           data-th-placeholder="#{SysCommon.placeholder}"/>
                                </div>
                            </div>
                            <div id="shOrZh_div" class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{FinStockInfo002.shOrZh}">港股通市场</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="shOrZh" name="shOrZh"
                                           class="layui-input form-input input-select"
                                           data-th-data-result='${SH_OR_ZH}' th:allowClear="true"
                                           th:placeholder="请输入内容"
                                           data-th-value="${entity?.shOrZh}"
                                           data-th-placeholder="#{SysCommon.placeholder}"
                                           required
                                           th:formatoption="true" />
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{FinStockInfo002.isMarginFinprod}">是否融资融券标的</label>
                                <div class="layui-input-inline input-inline">
                                    <input type="text" id="isMarginFinprod" name="isMarginFinprod"
                                            class="layui-input form-input input-select"
                                            data-th-data-result='${YES_OR_NO}' th:allowClear="true"
                                            th:placeholder="请输入内容"
                                            data-th-value="${entity?.isMarginFinprod}" 
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                    th:formatoption="true"
                                    required="required" />
                                </div>
                            </div>
                        </div>
                        <div class="layui-form-item">
                            <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{FinStockInfo002.currency }">币种</label>
                                <div class="layui-input-inline input-inline">
                                    <select type="text" id="ccy" name="ccy"
                                            class="layui-input form-input input-select"
                                            data-th-data-result='${CCY}' th:allowClear="true"
                                            th:placeholder="请输入内容"
                                            data-th-initValue="${entity?.ccy}"
                                            data-th-placeholder="#{SysCommon.placeholder}"
                                            th:formatoption="true"
                                            required="required">
                                    </select>
                                </div>
                            </div>
                            <div class="layui-inline layui-col-md4 layui-col-sm4 layui-col-lg4">
                                <label class="layui-form-label form-label-wrap"
                                       data-th-text="#{FinStockInfo002.calendarId}"> 交易日历</label>
                                <div class="layui-input-inline input-inline">
                                    <select type="text" id="calendarId" name="calendarId"
                                            required="required"
                                            class="layui-input form-input input-select"
                                            placeholder=""
                                            data-th-data-url="@{/valuation/basicdata/asset/ValAssetCommon/selectCalendarIdForPge}"
                                            data-th-placeholder="#{SysCommon.placeholder}"
                                            data-th-initValue="${entity?.calendarId}" >
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- 文件上传 -->
            <div class="page-component" th:data-path="@{/valuation/filecommonutil/FileCommon/init}" th:data-params="|{entityName: 'FileCommon', COPY_FLAG: '${COPY_FLAG ?: ''}', businessId: '${businessId ?: ''}'}|"></div>
            <div class="pro-module-wrap">
                <div class="pro-module">
                    <h3 class="pro-module-title">
                        <span class="title-des">备注</span><i
                        class="iconfont icon-arrow-down pro-down-icon"></i>
                    </h3>
                    <div class="pro-module-item" style="padding-top: 8px;">
									<textarea id="remark" name="remark" placeholder="请输入内容"
                                              style="width: 99%; margin: 0 auto;"
                                              class="layui-input layui-textarea"
                                              data-th-placeholder="#{SysCommon.placeholder}"
                                              data-th-text="${entity?.remark}" maxlength="300">
                                </textarea>
                    </div>
                </div>
            </div>
           <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                <div class="text-center">
                    <a id="FinStockInfo002_btn_save"
                       class="layui-btn layui-btn-sm btn-save"
                       data-th-text="#{SysCommon.save}">保存</a> <a
                    id="FinStockInfo002_btn_submit"
                    class="layui-btn layui-btn-sm btn-submit"
                    data-th-text="#{SysCommon.submit}">提交</a> <a
                    id="FinStockInfo002_btn_cancel"
                    class="layui-btn layui-btn-sm btn-cancel"
                    data-th-text="#{SysCommon.cancel}">取消</a>
                </div>
            </div>
        </div>
    </form>

</div>

<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var initgp = [[${gp}]];
        var publicOffPlan = /*[[${publicOffPlan}]]*/'';
        var line = /*[[${line}]]*/'';
        var workflowId = /*[[${entity?.workflowId}]]*/'';
        var PAGE_finprodId = /*[[${entity?.finprodId}]]*/'';
        var getChange = /*[[@{/invest/asset/plan/planProfit/FinPlanProfitAsset002/getChange}]]*/'';
        var isTransInAsset = /*[[${isTransInAsset}]]*/'';//该资产是否有交易
        var CE_MODEL = /*[[${CE_MODEL}]]*/'02';
        var COPY_FLAG = /*[[${COPY_FLAG}]]*/'N';
        var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'Y';
    </script>
    <script data-th-src="@{/js/valuation/basicdata/asset/common/BussAssetFiveType.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/valuation/basicdata/asset/common/AssetCommon.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/valuation/basicdata/asset/stock/FinStockInfo002.js}"></script>
</div>
</body>
</html>
