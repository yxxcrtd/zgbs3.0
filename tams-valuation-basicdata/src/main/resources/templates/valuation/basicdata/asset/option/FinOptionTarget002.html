<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{FinOptionTarget002}">期权标的信息新建</title>
</head>
<body>
<div layout:fragment="content">
    <form class="layui-form joyin-form-wrap" id="submitForm">
        <div class="pro-module-container">
            <div class="pro-module-wrapper pro-module-base">
                <div class="pro-module-item">
                    <div class="layui-form-item">
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable"
                                   data-th-text="#{FinOptionTarget001.targetId}">标的代码</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="targetId" name="targetId"
                                       required="required" class="layui-input form-input"
                                       placeholder="" maxlength="75"
                                       data-th-placeholder="#{SysCommon.placeholder}"
                                       data-th-value="${entity?.targetId}" />
                            </div>
                        </div>
                        <div class="form-inline-wrap">
                            <label class="layui-form-label form-lable"
                                   data-th-text="#{FinOptionTarget001.targetName}">标的名称</label>
                            <div class="layui-input-inline input-inline">
                                <input type="text" id="targetName" name="targetName"
                                       required="required" class="layui-input form-input"
                                       placeholder="" maxlength="75"
                                       data-th-placeholder="#{SysCommon.placeholder}"
                                       data-th-value="${entity?.targetName}" />
                            </div>
                        </div>
                    </div>
                    <div class="layui-form-item">
                    <div class="form-inline-wrap">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{FinOptionTarget001.targetType}">标的类型</label>
                        <div class="layui-input-inline input-inline">
                            <select type="text" id="targetType" name="targetType"
                                    class="layui-input form-input input-select"
                                    required="required" placeholder="请选择标的类型"
                                    data-th-placeholder="#{SysCommon.placeholder}"
                                     data-th-data-result='${OPTION_TYPE}'
                                     data-th-initValue="${entity?.targetType}">
                            </select>
                        </div>
                    </div>
                    </div>
                </div>
            </div>
<!--           &lt;!&ndash; 引业务组件附件信息组件 &ndash;&gt;-->
<!--                <div class="page-component" th:data-path="@{/component/core/FileCommon/init}"-->
<!--                     th:data-params="|{entityName: 'FileCommon', businessId: '${businessId ?: ''}'}|"></div>-->

            <div class="pro-module-wrapper pro-module-block">
                <div
                        class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11"
                        style="margin: 50px;">
                    <div class="text-center">
                        <a id="FinOptionTarget002_btn_save"
                           class="layui-btn layui-btn-sm btn-save"
                           data-th-text="#{SysCommon.save}">保存</a> <a
                            id="FinOptionTarget002_btn_submit"
                            class="layui-btn layui-btn-sm btn-submit"
                            data-th-text="#{SysCommon.submit}">提交</a> <a
                            id="FinOptionTarget002_btn_cancel"
                            class="layui-btn layui-btn-sm btn-cancel"
                            data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </div>
            </div>
    </form>
</div>
</div>
<div layout:fragment="script">
    <script th:inline="javascript" type="text/javascript">
        var workflowId = /*[[${entity?.workflowId}]]*/'';
    </script>
    <script data-th-src="@{/js/valuation/basicdata/asset/option/FinOptionTarget002.js}" type="text/javascript"></script>
</div>
</body>

</html>
