<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{ValProfitproject002}">非标债权及利率型资产</title>
    <style>
        .input-btn-append a {
            line-height: 20px;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="pro-module-container">
        <form class="layui-form joyin-form-wrap pro-module-form"
              id="submitForm">
            <!--	kuailu add by zhuyongkang 2019/09/30-->
            <!-- 隐藏字段 快录、模板 -->
            <input type="text" id="ValProfitproject002_quickFlag" data-th-value='Y' hidden>
            <!--	kuailu add by zhuyongkang 2019/09/30-->
            <div class="pro-module-wrapper pro-module-base step" title="基本信息">
                <div class="pro-module-wrapper pro-module-base">
                    <div class="pro-module-wrap">
                        <div class="pro-module">
                            <h3 class="pro-module-title">
                                <span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i
                                    class="iconfont icon-arrow-down pro-down-icon"></i>
                            </h3>
                            <div class="pro-module-item">
                                <div class="layui-form-item">
                                    <input type="text" id="finprodId" name="finprodId"
                                           class="layui-input form-input"
                                           data-th-value="${entity?.finprodId}" style="display: none">
                                    <input type="text" id="finprodType" name="finprodType"
                                           class="layui-input form-input"
                                           data-th-value="${entity?.finprodType}" style="display: none">
                                    <input id="workflowId" name="workflowId"
                                           data-th-value="${workflowId}" hidden>
                                    <input
                                            type="text" id="fjId" name="fjId"
                                            class="layui-input form-input"
                                            data-th-value="${entity?.fjId}" style="display: none">
                                    <input
                                            type="text" id="seqno" name="seqno"
                                            class="layui-input form-input"
                                            data-th-value="${entity?.seqno}" style="display: none">
                                    <input
                                            type="text" id="creditMstId" name="creditMstId"
                                            class="layui-input form-input"
                                            data-th-value="${entity?.creditMstId}" style="display: none">
                                    <input type="text" id="pfhId" name="pfhId"
                                           class="layui-input form-input"
                                           data-th-value="${entity?.pflsh}" style="display: none">
                                    <input type="text" id="hapCreditAmt" name="hapCreditAmt"
                                           class="layui-input form-input"
                                           data-th-value="${entity?.hapCreditAmt}" style="display: none">
                                    <input type="text" id="creditFlag" name="creditFlag" style="display: none"
                                           data-th-value="${entity?.creditFlag}">
                                </div>
                                <div class="layui-form-item">
                                    <div class=" form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{ValProfitproject002.finprodMarketId}">资产代码</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="finprodMarketId" required="required"
                                                   placeholder="请输入内容"
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   name="finprodMarketId" class="layui-input form-input"
                                                   maxlength="32" data-th-value="${entity?.finprodMarketId}">
                                        </div>
                                    </div>
                                    <div class=" form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{ValProfitproject002.finprodName}">资产名称</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" class="layui-input form-input"
                                                   placeholder="请输入内容"
                                                   data-th-placeholder="#{SysCommon.placeholder}"
                                                   id="finprodName" maxlength="80" name="finprodName"
                                                   data-th-value="${entity?.finprodName}" required="required">
                                        </div>
                                    </div>
                                    <div class=" form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">证券品种</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="type18" name="type18"
                                                    class="layui-input form-input input-select"
                                                    data-th-data-result='${SEC_TYPE}' formatoption="true"
                                                    required="required" allowClear="true" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue='${entity?.type18}'>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable">资产类型</label>
                                        <div class="layui-input-inline input-inline">
                                            <select id="assetType" name="assetType"
                                                    class="layui-input form-input input-select"
                                                    data-th-data-result='${PLANNED_TYPE}' allowClear="true"
                                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                                    required="required" formatoption="true" readonly="readonly"
                                                    data-th-initvalue="${entity?.assetType}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable">币种</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="ccy" name="ccy"
                                                    class="layui-input form-input input-select"
                                                    placeholder="请输入内容" required="required"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue="${entity?.ccy}"
                                                    data-th-data-result='${CCY}'>
                                            </select>
                                        </div>
                                    </div>
                                    <div class=" form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{ValProfitproject002.transMode}">清算速度</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="transMode" name="transMode"
                                                   required="required" class="layui-input form-input input-checkbox"
                                                   data-th-data-result='${ACCOUNT_SPEED}'
                                                   data-th-initValue='${entity?.transMode}'/>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class=" form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{ValProfitproject002.issueAmt}">发行规模</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" data-fixtype="2" unit="1"
                                                   class="layui-input form-input text-number" id="issueAmt"
                                                   name="issueAmt" data-th-value="${entity?.issueAmt}"
                                                   data-moneymemory="" data-th-data-textrange="2">
<!--
                                            <span class="input-right-show">（万）</span>
-->
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap layui-col-xs4">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{ValProfitproject002.vDate}">起息日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input id="vdate" name="vdate"
                                                   class="layui-input form-input input-dateSelect"
                                                   placeholder="请选择时间"
                                                   data-th-value="${#dates.format(entity?.vdate,'yyyy-MM-dd')}"
                                                   data-th-placeholder="#{SysCommon.placeholder}" required="required">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap layui-col-xs4">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{ValProfitproject002.mDate}">到期日</label>
                                        <div class="layui-input-inline input-inline">
                                            <input id="mdate" name="mdate"
                                                   class="layui-input form-input input-dateSelect"
                                                   placeholder="请选择时间" required="required"
                                                   data-th-value="${#dates.format(entity?.mdate,'yyyy-MM-dd')}"
                                                   data-th-placeholder="#{SysCommon.placeholder}">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item" id="lxDiv">
                                    <div class=" form-inline-wrap" id="issuerDiv">
                                        <label class="layui-form-label form-label-wrap">发行人</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="issuer" name="issuer"
                                                    class="layui-input form-input input-select"
                                                    data-th-data-url="@{/valuation/basicdata/asset/plan/profitproject/ValProfitproject002/getIssuerId}"
                                                    formatoption="true" allowClear="true"
                                                    data-th-initValue='${entity?.issuer}'
                                                    placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}" required>
                                            </select>
                                        </div>
                                    </div>
                                    <div class=" form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{ValProfitproject002.manager}">管理人</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="manager" name="manager"
                                                    class="layui-input form-input input-select"
                                                    data-th-data-url="@{/valuation/basicdata/asset/plan/profitproject/ValProfitproject002/getManagerId}"
                                                    formatoption="true" allowClear="true"
                                                    data-th-initValue='${entity?.manager}'
                                                    placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}">
                                            </select>
                                        </div>
                                    </div>
                                    <div class=" form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{ValProfitproject002.trusteeId}">托管人</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="trusteeId" name="trusteeId"
                                                    class="layui-input form-input input-select"
                                                    data-th-data-url="@{/valuation/basicdata/asset/plan/profitproject/ValProfitproject002/getTrusteeId}"
                                                    formatoption="true" allowClear="true"
                                                    data-th-initValue='${entity?.trusteeId}'
                                                    placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item" id="zqDiv">
                                    <div class=" form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">融资人</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="financier" name="financier"
                                                    class="layui-input form-input input-select"
                                                    data-th-data-url="@{/valuation/basicdata/asset/plan/profitproject/ValProfitproject002/getFinancier}"
                                                    formatoption="true" allowClear="true"
                                                    data-th-initValue='${entity?.financier}'
                                                    placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}" required>
                                            </select>
                                        </div>
                                    </div>
                                    <div class=" form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">担保人</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="sponsor" name="sponsor"
                                                    class="layui-input form-input input-select"
                                                    data-th-data-url="@{/valuation/basicdata/asset/plan/profitproject/ValProfitproject002/getGuarantee}"
                                                    formatoption="true" allowClear="true"
                                                    data-th-initValue='${entity?.sponsor}'
                                                    placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}">
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable">期限</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" class="layui-input form-input text-money" id="termDays"
                                                   name="termDays" data-th-value="${entity?.termDays}" disabled="disabled">
                                        </div>
                                    </div>

                                    <div class=" form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{ValProfitproject002.calendarId}">交易日历</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="calendarId" name="calendarId"
                                                   data-th-data-result="${TRANSACTION_CALENDAR}" required="required"
                                                   class="layui-input form-input input-select" allowClear="true"
                                                   data-th-value="${entity?.calendarId}">
                                        </div>
                                    </div>
                                    <div class=" form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">境内外</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="blnArea" name="blnArea"
                                                   class="layui-input form-input input-checkbox"
                                                   data-th-data-result="${BLN_AREA}" required="required"
                                                   data-th-initvalue="${entity?.blnArea}" allowClear="true">
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-lable">本金收益特征</label>
                                        <div class="layui-input-inline input-inline">
                                            <input type="text" id="capiIncomeFeature" name="capiIncomeFeature"
                                                   class="layui-input form-input input-checkbox"
                                                   data-th-data-result="${AMT_INCOME_TYPE}" required="required"
                                                   data-th-initvalue="${entity?.capiIncomeFeature}" allowClear="true">
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{ValProfitproject002.accountintType}">核算分类</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="accountintType" name="accountintType"
                                                    class="layui-input form-input input-select"
                                                    data-th-data-result='${MNG_ACCOUNTING_CLASSIFICATIO}' formatoption="true"
                                                    disabled="disabled" allowClear="true" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue='${entity?.accountintType}'>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap"
                                               data-th-text="#{ValProfitproject002.taxType}">税务分类</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="taxType" name="taxType"
                                                    class="layui-input form-input input-select"
                                                    data-th-data-result='${TAX_ASSET_TYPE}' formatoption="true"
                                                    disabled="disabled" allowClear="true" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue='${entity?.taxType}'>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="layui-form-item">
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">是否包含有效抵质押物</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="isEffPledge" name="isEffPledge"
                                                    class="layui-input form-input input-select"
                                                    data-th-data-result='${YES_OR_NO}' formatoption="true"
                                                    allowClear="true" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue='${entity?.isEffPledge}' required>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="form-inline-wrap">
                                        <label class="layui-form-label form-label-wrap">风险五级分类</label>
                                        <div class="layui-input-inline input-inline">
                                            <select type="text" id="bondRiskType" name="bondRiskType"
                                                    class="layui-input form-input input-select"
                                                    data-th-data-result='${BOND_RISK_TYPE}' formatoption="true"
                                                     allowClear="true" placeholder="请输入内容"
                                                    data-th-placeholder="#{SysCommon.placeholder}"
                                                    data-th-initValue='${entity?.bondRiskType}'>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- 计息要素业务 -->
                    <div class="page-component"
                         th:data-path="@{/valuation/component/asset/FinInterestFactor/init}"
                         th:data-params="|{entityName:'finInterestFactorDto',entityNamePayInterest:'finPayInterestStdInfoDto',entityNamebussFinRepayment:'bussFinRepaymentDto',entityNamebusiFinExercisePlan:'busiFinExercisePlanDto',vdate:'${#dates.format(entity?.vdate,'yyyy-MM-dd')}',finprodId:'${entity?.finprodId?:''}',couponSpecies:'${entity?.couponSpecies}',workflowId:'${workflowId?:''}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}'}|"></div>
                    <!-- 付息信息业务 -->
                    <!--标的类型objectType：01 债权类资产  【标的类型用于区分‘无明确融资金额’按钮】-->
                    <div class="page-component"
                         th:data-path="@{/valuation/component/asset/FinPayInterestStdInfo/init}"
                         th:data-params="|{entityName:'finPayInterestStdInfoDto',entityNameFinInterestFactor:'finInterestFactorDto',finprodId:'${entity?.finprodId?:''}',vdate:'${#dates.format(entity?.vdate,'yyyy-MM-dd')}',workflowId:'${workflowId?:''}',int_asset_type:'${INT_ASSET_TYPE}', objectType:'01',pageId:'${pageId}'}|"></div>
                    <!-- 还本信息业务 -->
                    <div class="page-component"
                         th:data-path="@{/valuation/component/asset/BussFinRepayment/init}"
                         th:data-params="|{entityName:'bussFinRepaymentDto',entityNameFinInterestFactor:'finInterestFactorDto',entityNameFinPayInterestStdInfo:'finPayInterestStdInfoDto',finprodId:'${entity?.finprodId?:''}',vdate:'${#dates.format(entity?.vdate,'yyyy-MM-dd')}',workflowId:'${workflowId?:''}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}'}|"></div>

                </div>
            </div>
            <div class="pro-module-wrapper pro-module-block">
                <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="margin: 50px;">
                    <div class="text-center">
                        <a id="ValProfitproject002_btn_save"
                           class="layui-btn layui-btn-sm btn-save"
                           data-th-text="#{SysCommon.save}">保存</a> <a
                            id="ValProfitproject002_btn_submit"
                            class="layui-btn layui-btn-sm btn-submit"
                            data-th-text="#{SysCommon.submit}">提交</a> <a
                            id="ValProfitproject002_btn_cancel"
                            class="layui-btn layui-btn-sm btn-cancel"
                            data-th-text="#{SysCommon.cancel}">取消</a>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var publicOffPlan = /*[[${publicOffPlan}]]*/'';
        var workflowId = /*[[${entity?.workflowId}]]*/'';
        var PAGE_finprodId = /*[[${entity?.finprodId}]]*/'';
        var FINPROD_TYPE_TG_F17 = /*[[${FINPROD_TYPE_TG_F17}]]*/'';
        var FINPROD_TYPE_F17 = /*[[${FINPROD_TYPE_F17}]]*/'';
        var CE_MODEL = /*[[${CE_MODEL}]]*/'02';
        var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
        var COPY_FLAG = /*[[${COPY_FLAG}]]*/'N';
        var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'Y';
        var isTransInAsset = /*[[${isTransInAsset}]]*/'';//该资产是否有交易
        var SEC_TYPE_13 = /*[[${SEC_TYPE_13}]]*/'';
        var SEC_TYPE_12 = /*[[${SEC_TYPE_12}]]*/'';
        var ACCOUNT_SPEED_01 = /*[[${ACCOUNT_SPEED_01}]]*/'';
        var PLANNED_TYPE = /*[[${PLANNED_TYPE}]]*/'';
        var ASSET_TYPE = /*[[${ASSET_TYPE}]]*/'';
    </script>
    <script data-th-src="@{/js/valuation/basicdata/asset/common/AssetCommon.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/valuation/basicdata/asset/plan/profitproject/ValProfitproject002.js}"></script>
</div>
</body>
</html>
