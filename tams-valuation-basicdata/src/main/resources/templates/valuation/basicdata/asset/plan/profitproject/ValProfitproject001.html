<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{ValProfitproject001}">非标债权及利率型资产</title>
</head>
<body>
<div layout:fragment="content">
    <div class='layui-fluid'>
        <div class="layui-col-md12 form-button-area" style="margin: 10px;">
            <a id="ValProfitproject001_btn_create"
               class="layui-btn layui-btn-sm btn-create"
               data-th-text="#{SysCommon.create}">新建</a>
            <a id="ValProfitproject001_btn_delete"
               class="layui-btn layui-btn-sm btn-delete"
               data-th-text="#{SysCommon.delete}">删除</a>
        </div>
        <div class='joyin-form-wrap joyin-filter-form condition-area'>
            <form class="layui-form" id="searchForm">
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md6 layui-col-sm6 layui-col-lg6">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{ValProfitproject001.finProdMarketId}">资产代码</label>
                        <div class="layui-input-inline input-inline">
                            <input type="text" id="finprodMarketId"  name="finprodMarketId"
                                   class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                                   data-th-placeholder="#{SysCommon.placeholder}"
                                   data-th-data-url="@{/valuation/basicdata/asset/plan/profitproject/ValProfitproject001/getAssetSelect/}"
                                   data-idfield="code" data-keyfield="code"
                                   data-th-data-effectivefieldsalias='|{"shortName":"#{ValProfitproject001.finProdName}","code":"#{ValProfitproject001.finProdMarketId}"}|'>
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md6 layui-col-sm6 layui-col-lg6">
                        <label class="layui-form-label form-lable">资产类型</label>
                        <div class="layui-input-inline input-inline">
                            <select id="assetType" name="assetType"
                                    class="layui-input form-input input-select"
                                    data-th-data-result='${PLANNED_TYPE}' allowClear="true"
                                    placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}"
                                    formatoption="true"
                                    data-th-initvalue="${entity?.assetType}">
                            </select>
                        </div>
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-inline layui-col-md6 layui-col-sm6 layui-col-lg6">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{ValProfitproject001.vDate}">起息日</label>
                        <div class="layui-input-inline input-inline">
                            <input id="vdate" name="vdate"
                                   class="layui-input form-input input-dateRangeSelect"
                                   placeholder="请选择时间区间"
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                    <div class="layui-inline layui-col-md6 layui-col-sm6 layui-col-lg6">
                        <label class="layui-form-label form-lable"
                               data-th-text="#{ValProfitproject001.mDate}">到期日</label>
                        <div class="layui-input-inline input-inline">
                            <input id="mdate" name="mdate"
                                   class="layui-input form-input input-dateRangeSelect"
                                   placeholder="请选择时间区间"
                                   data-th-placeholder="#{SysCommon.placeholder}">
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div>
            <table class="layui-table" id="dataTable"></table>
        </div>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
        var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'Y';
    </script>
    <script data-th-src="@{/js/valuation/basicdata/asset/plan/profitproject/ValProfitproject001.js}"></script>
</div>
</body>
</html>
