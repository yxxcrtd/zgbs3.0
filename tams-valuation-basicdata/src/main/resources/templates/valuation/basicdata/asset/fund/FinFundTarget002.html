<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinFundTarget002}">基金类标的信息新建</title>
</head>
<body>
	<div layout:fragment="content">
		<form class="layui-form joyin-form-wrap" id="submitForm">
			<div class="pro-module-container">
				<div class="pro-module-wrapper pro-module-base">
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title">
								<span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i
									class="iconfont icon-arrow-down pro-down-icon"></i>
							</h3>
							<div class="pro-module-item">
								<div class="layui-form-item">
									<div style="display: none">
										<input type="text" id="finprodId" name="finprodId" data-th-value="${entity?.finprodId}"/>
										<input type="text" id="tempTrmFundType" name="tempTrmFundType" data-th-value="${entity?.trmFundType}"/>
										<input
												type="text" id="seqno" name="seqno"
												class="layui-input form-input"
												data-th-value="${entity?.seqno}" style="display: none">
											<input
												type="text" id="creditMstId" name="creditMstId"
												class="layui-input form-input"
												data-th-value="${entity?.creditMstId}" style="display: none">
											<input type="text" id="pfhId" name="pfhId"
												class="layui-input form-input"
												data-th-value="${entity?.pflsh}" style="display: none">
											<input type="text" id="hapCreditAmt" name="hapCreditAmt"
												class="layui-input form-input"
												data-th-value="${entity?.hapCreditAmt}" style="display: none">
											<input type="text" id="creditFlag" name="creditFlag" style="display: none"
												data-th-value="${entity?.creditFlag}">
											<input type="text" id="dataSource" name="dataSource" style="display: none"
												   data-th-value="${entity?.dataSource}">
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											data-th-text="#{FinFundTarget001.finprodMarketId}">资产代码</label>
										<div class="layui-input-inline input-inline">
											   <input type="text" id="finprodMarketId"
												name="finprodMarketId" required="required"
												class="layui-input form-input" placeholder="请输入内容" maxlength="75"
												data-th-placeholder="#{SysCommon.placeholder}"
											    style="width: 85%!important; display: inline-block;"
												data-th-value="${entity?.finprodMarketId}"/>
												<input type="text" id="tradeMarketId" name="tradeMarketId"
													   data-th-value="${tradeMarketId}"
													   class="layui-input form-input"
													   style="width: 15%!important; display: inline-block;" readonly />
										 </div>

									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											data-th-text="#{FinFundTarget001.finprodAbbr}">资产简称</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="finprodAbbr" name="finprodAbbr"
												required="required" class="layui-input form-input"
												placeholder="" maxlength="75"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-value="${entity?.finprodAbbr}" />
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											data-th-text="#{FinFundTarget001.finprodName}">资产名称</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="finprodName" name="finprodName"
												required="required" class="layui-input form-input"
												placeholder="" maxlength="75"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-value="${entity?.finprodName}" />
										</div>
									</div>
								</div>
								<div class="layui-form-item">
								<!-- 资产五级分类  王贵奇 开始 -->
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinFundTarget001.fundType}">基金类型
										</label>
										<div class="layui-input-inline input-inline">
											<select id="fundType" name="fundType"
												th:initValue="*{entity?.fundType}" required="required"
												class="layui-input form-input input-select"
												allowClear="true" placeholder="请选择"
												data-th-placeholder="#{SysCommon.placeholder}"
												data-th-data-result="${FUND_TYPE}"
												formatoption=true></select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{FinFundTarget001.manager}"> 管理人</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="manager" name="manager"
													required="required"
													class="layui-input form-input input-select" placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-data-url="@{/valuation/basicdata/asset/fund/FinFundTarget002/getManager}"
													data-th-initValue="${entity?.manager}">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{FinFundTarget002.idate}"> 发行日期</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="idate" name="idate"
												   required="required"
												   class="layui-input form-input input-dateSelect"
												   placeholder=""
												   data-th-placeholder="#{SysCommon.placeholder}"
												   data-th-value='${#dates.format(entity?.idate,"yyyy-MM-dd")}' />
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{FinFundTarget002.vdate}">成立日期</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="vdate" name="vdate"
												   class="layui-input form-input input-dateSelect"
												   required="required" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}"
												   data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'/>

										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{FinFundTarget001.tradeMarket}">交易场所</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="tradeMarket" name="tradeMarket"
													required="required"
													class="layui-input form-input input-select" placeholder=""
													maxlength="75"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-initValue="${entity?.tradeMarket}"
													data-th-data-result='${TRADE_PLACE}'>
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{FinBondTargetAsset002.mdate}">到期日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="mdate" name="mdate"
												   class="layui-input form-input input-dateSelect"
												   placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}"
												   data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'/>

										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{FinFundTarget002.calendarId}"> 交易日历</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="calendarId" name="calendarId"
													class="layui-input form-input input-select"
													placeholder="请输入内容" required="required"
													data-th-data-url="@{/valuation/basicdata/asset/fund/FinFundTarget002/getCalendarIdList}"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-initValue="${entity?.calendarId}" >
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{FinFundTarget001.ccy}">币种</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="ccy" name="ccy"
													class="layui-input form-input input-select"
													required="required" placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-initValue="*{entity?.ccy?:CCY_default}" data-th-data-result='${CCY}' >
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<!--修改标的投资性质为资产投资性质 lishuping 20190911 start-->
										<label class="layui-form-label form-label-wrap">资产投资性质</label>
										<!--修改标的投资性质为资产投资性质 lishuping 20190911 end-->
										<div class="layui-input-inline input-inline">
											<select id="investNature" name="investNature"
													class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-data-result="${INVEST_TYPE}" data-th-initvalue="${entity?.investNature}">
											</select>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" >本金收益特征</label>
										<div class="layui-input-inline input-inline">
											<input type="checkbox" id="capiIncomeFeature" name="capiIncomeFeature"
												   lay-skin="switch" th:value="${NO}"
												   lay-text="保本|非保本" required
												   th:checked="${entity?.capiIncomeFeature!=null && entity?.capiIncomeFeature!=NO && entity?.capiIncomeFeature!='02' ?true:false}" />
										</div>
									</div>
									<div class=" form-inline-wrap">
										<label class="layui-form-label form-label-wrap purSpeed"
											   data-th-text="#{FinFundTarget002.purSpeed}">申购确认速度</label>
										<div class="layui-input-inline input-inline delaytime-inline-wrap">
											<select type="text" id="purSpeed" name="purSpeed"
													class="layui-input form-input input-select"
													style="float: left;display: inline-block; width: 89%;"
													required="required" placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-initValue="${entity?.purSpeed}" data-th-data-result='${SHENSHU_SPEED}' >
											</select>
	<!--										<input type="text" id="purSpeed" name="purSpeed"  th:value="${entity?.purSpeed}" class="layui-input form-input" required-->
	<!--											   onkeyup="if(this.value.length<=1){this.value=this.value.replace(/[^0-9]/g,'')}else{this.value=parseInt(this.value.replace(/\D/g,''))}" onafterpaste="if(this.value.length<=1){this.value=this.value.replace(/[^0-9]/g,'0')}else{this.value=parseInt(this.value.replace(/\D/g,''))}"-->
	<!--											   style="float: left;display: inline-block; width: 89%;"/>-->
										</div>
									</div>
									<div class=" form-inline-wrap">
										<label class="layui-form-label form-label-wrap redSpeed"
											   data-th-text="#{FinFundTarget002.redSpeed}">赎回确认速度</label>
										<div class="layui-input-inline input-inline delaytime-inline-wrap">
	<!--										<label class="layui-form-label form-label-wrap rate-text" style="float: left;display: inline-block;width: 6%;">T+</label>-->
											<select type="text" id="redSpeed" name="redSpeed" placeholder="请输入内容"
													class="layui-input form-input input-select" required
													style="float: left;display: inline-block; width: 89%;"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-initValue="${entity?.redSpeed}" data-th-data-result='${SHENSHU_SPEED}' >
											</select>
	<!--										<input type="text" id="redSpeed" name="redSpeed"  th:value="${entity?.redSpeed}" class="layui-input form-input" required-->
	<!--											   onkeyup="if(this.value.length<=1){this.value=this.value.replace(/[^0-9]/g,'')}else{this.value=parseInt(this.value.replace(/\D/g,''))}" onafterpaste="if(this.value.length<=1){this.value=this.value.replace(/[^0-9]/g,'0')}else{this.value=parseInt(this.value.replace(/\D/g,''))}"-->
	<!--											   style="float: left;display: inline-block; width: 89%;"/>-->
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{FinFundTarget002.circulationCode}">上市流通代码</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="circulationCode" name="circulationCode"
												   class="layui-input form-input"
												   placeholder=""
												   data-th-placeholder="#{SysCommon.placeholder}"
												   data-th-value="${entity?.circulationCode}" />
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{FinFundTarget002.trmFundType}">场内基金类型</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="trmFundType" name="trmFundType"
													class="layui-input form-input input-select"
													placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}" parentIds="fundType,tradeMarket"
													data-th-data-url="@{/valuation/basicdata/asset/fund/FinFundTarget002/getTrmFundTypeList}"
													data-th-initValue="${entity?.trmFundType}">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{FinFundTarget002.shareUnit}">份额单位</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="shareUnit" name="shareUnit"
												   class="layui-input form-input"
												   placeholder="" disabled="disabled"
												   data-th-placeholder="#{SysCommon.placeholder}"
												   data-th-value="${entity?.shareUnit}" />
										</div>
									</div>

								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{FinFundTarget002.blnArea}">境内外</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="blnArea" name="blnArea"
												   class="layui-input form-input input-checkbox"
												   placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}"
												   data-th-data-result="${BLN_AREA}" required="required"
												   data-th-initvalue="${entity?.blnArea}" allowClear="true"/>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{FinFundTarget002.hsfl}">核算分类</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="hsfl" name="hsfl"
													class="layui-input form-input input-select"
													data-th-data-result='${FUND_ACCOUNTING_TYPE}' formatoption="true"
													disabled="disabled" allowClear="true" placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-initValue='${entity?.hsfl}'>
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-lable"
											   data-th-text="#{FinFundTarget002.swfl}">税务分类</label>
										<div class="layui-input-inline input-inline">
											<select type="text" id="swfl" name="swfl"
													class="layui-input form-input input-select"
													data-th-data-result='${TAX_ASSET_TYPE}' formatoption="true"
													disabled="disabled" allowClear="true" placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-initValue='${entity?.swfl}'>
											</select>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
					<!-- 分红计划组件 -->
					<div class="page-component" th:data-path="@{/valuation/component/asset/BussFinIntPay/init}" th:data-params="|{pageModel:pageModel,fundTypeElement: 'fundType', entityName: 'bussFinIntPayDto',finprodId:'${entity?.finprodId ?:''}',workflowId: '${entity?.workflowId ?:'' }' ,pageId:pageId}|"></div>
				</div>
			</div>
			<div class="pro-module-wrapper pro-module-block">
				<div
					class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11"
					style="margin: 50px;">
					<div class="text-center">
						<a id="FinFundTarget002_btn_save"
							class="layui-btn layui-btn-sm btn-save"
							data-th-text="#{SysCommon.save}">保存</a> <a
							id="FinFundTarget002_btn_submit"
							class="layui-btn layui-btn-sm btn-submit"
							data-th-text="#{SysCommon.submit}">提交</a> <a
							id="FinFundTarget002_btn_cancel"
							class="layui-btn layui-btn-sm btn-cancel"
							data-th-text="#{SysCommon.cancel}">取消</a>
					</div>
				</div>
			</div>
		</form>
	</div>
	<div layout:fragment="script">
		<script th:inline="javascript" type="text/javascript">
			var workflowId = /*[[${entity?.workflowId}]]*/'';
			var PAGE_finprodId = /*[[${entity?.finprodId}]]*/'';
			var F01 = /*[[${F01}]]*/'';
			var F06 = /*[[${F06}]]*/'';
			var h_01 = /*[[${h_01}]]*/'';
			var finprodType2 = /*[[${entity?.finprodType2}]]*/'';
			var isTransInAsset = /*[[${entity?.isTransInAsset}]]*/'N';
			var CE_MODEL = /*[[${CE_MODEL}]]*/'02';
			var INTI_BONUS_MODE = /*[[${INTI_BONUS_MODE}]]*/'02';
			var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
			var TRM_FUND_TYPE_01 = /*[[${TRM_FUND_TYPE_01}]]*/'01';
			var TRM_FUND_TYPE_02 = /*[[${TRM_FUND_TYPE_02}]]*/'02';
			var TRM_FUND_TYPE_03 = /*[[${TRM_FUND_TYPE_03}]]*/'03';
			var TRM_FUND_TYPE_04 = /*[[${TRM_FUND_TYPE_04}]]*/'04';
			var TRM_FUND_TYPE_05 = /*[[${TRM_FUND_TYPE_05}]]*/'05';
			var GRA_FUND_TYPE_M = /*[[${GRA_FUND_TYPE_M}]]*/'M';
			var GRA_FUND_TYPE_A = /*[[${GRA_FUND_TYPE_A}]]*/'A';
			var GRA_FUND_TYPE_B = /*[[${GRA_FUND_TYPE_B}]]*/'B';
			var ETF_TYPE_01 = /*[[${ETF_TYPE_01}]]*/'01';
			var ETF_TYPE_02 = /*[[${ETF_TYPE_02}]]*/'02';
			var ETF_TYPE_03 = /*[[${ETF_TYPE_03}]]*/'03';
			var ETF_TYPE_04 = /*[[${ETF_TYPE_04}]]*/'04';
			var ETF_TYPE_05 = /*[[${ETF_TYPE_05}]]*/'05';
			var ETF_TYPE_06 = /*[[${ETF_TYPE_06}]]*/'06';
			var FUND_ASSET_SECOND_TYPE_01 = /*[[${FUND_ASSET_SECOND_TYPE_01}]]*/'01';
			var FUND_ASSET_SECOND_TYPE_02 = /*[[${FUND_ASSET_SECOND_TYPE_02}]]*/'02';
			var FUND_ASSET_SECOND_TYPE_03 = /*[[${FUND_ASSET_SECOND_TYPE_03}]]*/'03';
			var FUND_ASSET_SECOND_TYPE_06 = /*[[${FUND_ASSET_SECOND_TYPE_06}]]*/'06';
			//暂存临时值
			var TRM_FUND_TYPE = /*[[${entity?.trmFundType}]]*/'';
			var ETF_TYPE = /*[[${entity?.etfType}]]*/'';
			//暂存临时值
        </script>
        <script data-th-src="@{/js/valuation/basicdata/asset/common/BussAssetFiveType.js}" type="text/javascript"></script>
		<script data-th-src="@{/js/valuation/basicdata/asset/common/AssetCommon.js}" type="text/javascript"></script>
		<script data-th-src="@{/js/valuation/basicdata/asset/fund/FinFundTarget002.js}" type="text/javascript"></script>
	</div>
</body>

</html>
