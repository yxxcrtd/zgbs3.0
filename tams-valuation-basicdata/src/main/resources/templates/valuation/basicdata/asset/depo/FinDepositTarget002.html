<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinDepositTarget002}">存款类资产新建</title>
</head>
<body>
	<div layout:fragment="content" id="FinDepositTarget002_DIV">
		<div class="pro-module-container">
			<form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
				<input id="oldVdate" name="oldVdate" data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}' hidden>
				<input id="pageId" name="pageId" data-th-value="${pageId}" hidden>
				<input id="finprodId" name="finprodId" data-th-value="${entity?.finprodId}" hidden>
				<input id="finprodType2" name="finprodType2" data-th-value="${entity?.finprodType2}" hidden>
				<input id="workflowId" name="workflowId" data-th-value="${workflowId}" hidden>
				<input id="oldMdate" name="oldMdate" data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}' hidden>
				<input id="dataSource" name="dataSource" data-th-value="${entity?.dataSource}" hidden>
				<input id="accountintType" name="accountintType" data-th-value="${entity?.accountintType}" hidden>
				<input type="text" id="seqno" name="seqno" class="layui-input form-input" data-th-value="${entity?.seqno}" style="display: none">
				<input type="text" id="creditMstId" name="creditMstId" class="layui-input form-input" data-th-value="${entity?.creditMstId}" style="display: none">
				<input type="text" id="pfhId" name="pfhId" class="layui-input form-input" data-th-value="${entity?.pflsh}" style="display: none">
				<input type="text" id="hapCreditAmt" name="hapCreditAmt" class="layui-input form-input" data-th-value="${entity?.hapCreditAmt}" style="display: none">
				<input type="text" id="creditFlag" name="creditFlag" style="display: none" data-th-value="${entity?.creditFlag}">
				<div class="pro-module-wrapper pro-module-base " title="基本信息">
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title">
								<span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i
									class="iconfont icon-arrow-down pro-down-icon"></i>
							</h3>
							<div class="pro-module-item pro-item-wrap">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinDepositTarget002.finprodId}">资产代码</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="finprodMarketId" id="finprodMarketId"
												   data-th-value="${entity?.finprodMarketId}"
												   required
												   class="layui-input form-input" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}">
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinDepositTarget002.finprodName}">资产名称</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="finprodName"
												data-th-value="${entity?.finprodName}"
												class="layui-input form-input" placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinDepositTarget002.assetType}">资产类型</label>
										<div class="layui-input-inline input-inline">
											<select id="assetType"
													name="assetType" parentIds="tradeMarket"
													th:initValue="${entity?.assetType}"
													class="layui-input form-input input-select"
													placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}" required
													data-th-data-result="${DEPOSIT_TYPE}">
											</select>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinDepositTarget002.capiIncomeFeature}">本金收益特征</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="capiIncomeFeature" name="capiIncomeFeature"
												   th:initValue="${entity?.capiIncomeFeature}"
												   required
												   class="layui-input form-input input-checkbox"
												   data-th-data-result="${AMT_INCOME_TYPE}" />
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinBondTargetAsset002.ccy}">币种</label>
										<div class="layui-input-inline input-inline">
											<select name="ccy" id="ccy"
													th:initValue="*{entity?.ccy?:CCY_INIT}"
													class="layui-input form-input input-select"
													placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}" required
													data-th-data-result="${CCY}">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinDepositTarget002.issuer}">存款机构</label>
										<div class="layui-input-inline input-inline">
											<!--匹配融资人属性 modified by lishuping 20190925 start-->
											<select id="orgClass" name="orgClass"
													class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}"
													required="required"
													th:initValue="${entity?.orgClass}"
													data-th-data-url="@{/valuation/basicdata/asset/depo/FinDepositTarget002/getCustomerName}">
											</select>
											<!--匹配融资人属性 modified by lishuping 20190925 end-->
										</div>
									</div>
								</div>

								<div class="layui-form-item">
									<div class="form-inline-wrap" id="issueAmt_div">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinDepositTarget002.issueAmt}">存款本金</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="issueAmt" name="issueAmt"
												data-th-value="${entity?.issueAmt}"
												class="layui-input form-input text-number"
												placeholder="请输入内容"
												data-th-placeholder="#{SysCommon.placeholder}" required>
											<span class="input-right-show">元</span>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinDepositTarget002.vdate}">起息日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="vdate" name="vdate"
												   data-th-value='${#dates.format(entity?.vdate,"yyyy-MM-dd")}'
												   required="required"
												   class="layui-input form-input input-dateSelect" />
										</div>
									</div>
									<div class="form-inline-wrap" id="mdate_div">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinDepositTarget002.mdate}">到期日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="mdate" name="mdate"
												   data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
												   required="required"
												   class="layui-input form-input input-dateSelect" />
										</div>
									</div>
								</div>

								<div class="layui-form-item">
									<div class="form-inline-wrap" id="termDays_div">
										<label class="layui-form-label form-label-wrap"
											data-th-text="#{FinDepositTarget002.termDays}">期限（天）</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="termDays"
												data-th-value="${entity?.termDays}"
												class="layui-input form-input" readonly/>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinDepositTarget002.calendarId}">交易日历</label>
										<div class="layui-input-inline input-inline">
											<select name="calendarId" id="calendarId"
													class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}"
													required="required"
													data-th-data-url="@{/valuation/basicdata/asset/ValAssetCommon/selectCalendarIdForPge}"
													data-th-initValue='${entity?.calendarId}'>
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinDepositTarget002.blnArea}">境内外</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="blnArea" name="blnArea"
												   th:initValue="${entity?.blnArea}" required
												   class="layui-input form-input input-checkbox"
												   data-th-data-result="${BLN_AREA}" />
										</div>
									</div>
								</div>

								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinBondTargetAsset002.accountintType}">核算分类</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="accountingClassName"
												   data-th-value="${entity?.accountingClassName}"
												   class="layui-input form-input" readonly/>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinBondTargetAsset002.taxType}">税务分类</label>
										<div class="layui-input-inline input-inline">
											<select id="taxType"
													name="taxType"
													th:initValue="${entity?.taxType}"
													class="layui-input form-input input-select"
													placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}" disabled = true
													data-th-data-result="${TAX_ASSET_TYPE}" readonly>
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinBondTargetAsset002.riskType}">风险五级分类</label>
										<div class="layui-input-inline input-inline">
											<select id="bondRiskType"
													name="bondRiskType"
													class="layui-input form-input input-select"
													placeholder="请输入内容"
													data-th-initValue='${entity?.bondRiskType}'
													data-th-placeholder="#{SysCommon.placeholder}" required
													data-th-data-result="${BOND_RISK_TYPE}">
											</select>
										</div>
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
					<!-- 计息要素业务 -->
					<div class="page-component"
						 th:data-path="@{/valuation/component/asset/FinInterestFactor/init}"
						 th:data-params="|{entityName:'finInterestFactorDto',entityNamePayInterest:'finPayInterestStdInfoDto',entityNamebussFinRepayment:'bussFinRepaymentDto',entityNamebusiFinExercisePlan:'busiFinExercisePlanDto',vdate:'${#dates.format(entity?.vdate,'yyyy-MM-dd')}',finprodId:'${entity?.finprodId?:''}',couponSpecies:'${entity?.couponSpecies}',workflowId:'${workflowId?:''}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}'}|"></div>
					<!-- 付息信息业务 -->
					<div class="page-component" id="PayInterestStdInfo_Div"
						th:data-path="@{/valuation/component/asset/FinPayInterestStdInfo/init}"
						th:data-params="|{entityName:'finPayInterestStdInfoDto',finprodId:'${entity?.finprodId?:''}',vdate:'${#dates.format(entity?.vdate,'yyyy-MM-dd')}',workflowId:'${workflowId}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}'}|"></div>

					 <div class="row text-center stepbar">
						<a id="FinDepositTarget002_btn_save" class="layui-btn layui-btn-sm btn-save" data-th-text="#{SysCommon.save}">保存</a>
					    <a id="FinDepositTarget002_btn_submit" class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
					    <a id="FinDepositTarget002_btn_cancel" class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
					</div>
			</form>
		</div>
	</div>

	<div layout:fragment="script">
		<script data-th-inline="javascript" type="text/javascript">
            var FINPROD_TYPE_TG_F01 = /*[[${FINPROD_TYPE_TG_F01}]]*/'F01'; //债券资产类型code
            var FINPROD_TYPE_TG_F07 = /*[[${FINPROD_TYPE_TG_F07}]]*/'F07'; //存款资产类型code
            var FINPROD_TYPE_TG_F17 = /*[[${FINPROD_TYPE_TG_F17}]]*/'F17'; //计划类资产类型code
            var FINPROD_TYPE_TG_F18 = /*[[${FINPROD_TYPE_TG_F18}]]*/'F17'; //项目类资产类型code
            var DEPO_ASSET_TYPE_01 = /*[[${DEPO_ASSET_TYPE_01}]]*/'01'; //同业借款

            var CALC_METHOD_01 = /*[[${CALC_METHOD_01}]]*/'01'; //起息日向后
            var INTPAY_CYCLE_01 = /*[[${INTPAY_CYCLE_01}]]*/'01'; //到期支付
            var iPlatformDate = /*[[${iPlatformDate}]]*/'';//平台日期
            var isTransInAsset = /*[[${isTransInAsset}]]*/'';//该资产是否有交易
            var CE_MODEL = /*[[${CE_MODEL}]]*/'02';
            var IS_SHOW_TYPE = /*[[${isShowType}]]*/'01';
			var INT_ASSET_TYPE = /*[[${INT_ASSET_TYPE}]]*/'F07';
			var DEPO_ASSET_TYPE_02 = /*[[${DEPO_ASSET_TYPE_02}]]*/'02'; //活期存放
			var DEPO_ASSET_TYPE_03 = /*[[${DEPO_ASSET_TYPE_03}]]*/'03'; //同业借款
			var isCalLoadrate = /*[[${isCalLoadrate}]]*/'01';  //是否以借款利率计提
			var isQuickInput = /*[[${isQuickInput}]]*/'';
			 var OPT_TYPE=/*[[${optType}]]*/'';//操作标识
			 var COPY_FLAG = /*[[${COPY_FLAG}]]*/'N';
			 var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'Y';
			 var _data=/*[[${_data}]]*/'';
        </script>
		<script data-th-src="@{/js/valuation/basicdata/asset/depo/FinDepositTarget002.js}"
			type="text/javascript"></script>
         <script data-th-src="@{/js/valuation/basicdata/asset/common/AssetCommon.js}" type="text/javascript"></script>
	</div>
</body>

</html>
