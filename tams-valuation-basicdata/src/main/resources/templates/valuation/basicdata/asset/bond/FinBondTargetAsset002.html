<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{FinBondTargetAsset002}">债券类资产新建</title>
</head>
<body>
	<div layout:fragment="content" id="FinBondTargetAsset002_DIV">
		<div class="pro-module-container">
			<form class="layui-form joyin-form-wrap pro-module-form" id="submitForm">
				<input id="finprodType" name="finprodType" data-th-value="${entity?.finprodType}" hidden>
				<input id="finprodId" name="finprodId" data-th-value="${entity?.finprodId}" hidden>
				<input id="finprodType2" name="finprodType2" data-th-value="${entity?.finprodType2}" hidden>
				<input id="workflowId" name="workflowId" data-th-value="${workflowId}" hidden>
				<input id="dataSource" name="dataSource" data-th-value="${entity?.dataSource}" hidden>
				<input type="text" id="seqno" name="seqno" class="layui-input form-input" data-th-value="${entity?.seqno}" style="display: none">
				<input type="text" id="creditMstId" name="creditMstId" class="layui-input form-input" data-th-value="${entity?.creditMstId}" style="display: none">
				<input type="text" id="pfhId" name="pfhId" class="layui-input form-input" data-th-value="${entity?.pflsh}" style="display: none">
				<input type="text" id="hapCreditAmt" name="hapCreditAmt" class="layui-input form-input" data-th-value="${entity?.hapCreditAmt}" style="display: none">
				<input type="text" id="creditFlag" name="creditFlag" style="display: none" data-th-value="${entity?.creditFlag}">
				<div class="pro-module-wrapper pro-module-base" title="基本信息">
					<div class="pro-module-wrap">
						<div class="pro-module">
							<h3 class="pro-module-title">
								<span class="title-des">基本信息</span>（<span class="star-sign">*</span>必填）<i
									class="iconfont icon-arrow-down pro-down-icon"></i>
							</h3>
							<div class="pro-module-item pro-item-wrap">
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinBondTargetAsset002.finprodId}">资产代码</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="finprodMarketId"												   name="finprodMarketId"
												   data-th-value="${entity?.finprodMarketId}"
												   class="layui-input form-input" placeholder="请输入内容"
												   style="width: 85%!important; display: inline-block;"
												   data-th-placeholder="#{SysCommon.placeholder}" required>
											<input type="text" id="tradeMarketId" name="tradeMarketId"
												   data-th-value="${tradeMarketId}"
												   class="layui-input form-input"
												   style="width: 15%!important; display: inline-block;" readonly>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinBondTargetAsset002.circulationCode}">上市流通代码</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="circulationCode" id="circulationCode"
												   data-th-value="${entity?.circulationCode}"
												   class="layui-input form-input" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}" >
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinBondTargetAsset002.finprodName}">资产名称</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="finprodName" id="finprodName"
												   data-th-value="${entity?.finprodName}"
												   class="layui-input form-input" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}" >
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinBondTargetAsset002.finprodAbbr}">资产简称</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="finprodAbbr" id="finprodAbbr"
												   data-th-value="${entity?.finprodAbbr}"
												   class="layui-input form-input" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}" required>
										</div>
									</div>
									<!--<a id='magnifier' class="input-right-show" href='javascript:;' style='color:#4893e6;left: 32.5%; top: 42px;'><i class='iconfont icon-search'></i></a>-->
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinBondTargetAsset002.tradeMarket}">交易场所</label>
										<div class="layui-input-inline input-inline">
											<select id="tradeMarket" name="tradeMarket"
													th:initValue="*{entity?.tradeMarket}"
													childrenIds="assetType"
													class="layui-input form-input input-select"
													placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}" required
													data-th-data-result="${TRADE_PLACE}">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinBondTargetAsset002.issuePrice}">发行价格</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="issuePrice" name="issuePrice"
												   data-th-value="${entity?.issuePrice}"
												   class="layui-input form-input text-number"
												   data-textrange="5" placeholder="请输入内容"
												   data-th-placeholder="#{SysCommon.placeholder}" required>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinBondTargetAsset002.idate}">发行日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="idate"
												   data-th-value='${#dates.format(entity?.idate,"yyyy-MM-dd")}'
												   required="required"
												   class="layui-input form-input input-dateSelect" />
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinBondTargetAsset002.vdate}">起息日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="vdate" name="vdate"
												   data-th-value='${#dates.format(entity?.vdate?:iPlatformDate,"yyyy-MM-dd")}'
												   required="required"
												   class="layui-input form-input input-dateSelect" />
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinBondTargetAsset002.mdate}">到期日</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="mdate" name="mdate"
												   data-th-value='${#dates.format(entity?.mdate,"yyyy-MM-dd")}'
												   required="required"
												   class="layui-input form-input input-dateSelect" />
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinBondTargetAsset002.assetType}">资产分类</label>
										<div class="layui-input-inline input-inline">
											<select id="assetType"
													name="assetType" parentIds="tradeMarket"
													th:initValue="${entity?.assetType}"
													class="layui-input form-input input-select"
													placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}" required
													data-th-data-result="${BOND_TYPE}">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinBondTargetAsset002.repRegistOrg}">登记托管机构</label>
										<div class="layui-input-inline input-inline">
											<select id="registOrg"
													name="registOrg"
													th:initValue="${entity?.registOrg}"
													class="layui-input form-input input-select"
													placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}" required
													data-th-data-result="${REGIST_ORG}">
											</select>
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinBondTargetAsset002.issuer}">发行人</label>
										<div class="layui-input-inline input-inline">
											<select name="issuer" id="issuer"
													class="layui-input form-input input-select"
													data-th-placeholder="#{SysCommon.placeholder}"
													data-th-data-url="@{/valuation/basicdata/asset/ValAssetCommon/getIssuerId}"
													data-th-initValue='${entity?.issuer}'>
											</select>
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinBondTargetAsset002.isSecBond}">是否次级债</label>
										<div class="layui-input-inline input-inline">
											<input type="checkbox" id="isSecBond" name="isSecBond"
												   lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
												   data-th-checked="${YES_OR_NO_Y} ==${entity?.isSecBond}">
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinBondTargetAsset002.isRight}">是否含权债</label>
										<div class="layui-input-inline input-inline">
											<input type="checkbox" id="isRight" name="isRight"
												   lay-skin="switch" lay-filter="isRight"
												   data-th-value="${YES}" lay-text="是|否"
												   data-th-checked="${YES_OR_NO_Y} ==${entity?.isRight}">
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinBondTargetAsset002.issueType}">发行方式</label>
										<div class="layui-input-inline input-inline">
											<input type="text" name="issueType"
												   data-th-initValue="${entity?.issueType}"
												   class="layui-input form-input input-checkbox"
												   data-th-data-result="${ISSUE_TYPE}" />
										</div>
									</div>
								</div>
								<div class="layui-form-item">
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinBondTargetAsset002.blnArea}">境内外</label>
										<div class="layui-input-inline input-inline">
											<input type="text" id="blnArea" name="blnArea"
												   th:initValue="${entity?.blnArea}" required
												   class="layui-input form-input input-checkbox"
												   data-th-data-result="${BLN_AREA}" />
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap" data-th-text="#{FinBondTargetAsset002.faceValue}">面值</label>
										<div class="layui-input-inline input-inline">
											<input type="text" required name="faceValue" data-th-value="${entity?.faceValue?:100}" class="layui-input form-input text-number" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}" >
										</div>
									</div>
									<div class="form-inline-wrap">
										<label class="layui-form-label form-label-wrap"
											   data-th-text="#{FinBondTargetAsset002.ccy}">币种</label>
										<div class="layui-input-inline input-inline">
											<select name="ccy" id="ccy"
													th:initValue="*{entity?.ccy?:CCY_INIT}"
													class="layui-input form-input input-select"
													placeholder="请输入内容"
													data-th-placeholder="#{SysCommon.placeholder}" required
													data-th-data-result="${CCY}">
											</select>
										</div>
									</div>
									<div class="layui-form-item">
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												   data-th-text="#{FinBondTargetAsset002.capiIncomeFeature}">本金收益特征</label>
											<div class="layui-input-inline input-inline">
												<input type="text" name="capiIncomeFeature"
													   th:initValue="${entity?.capiIncomeFeature}" required
													   class="layui-input form-input input-checkbox"
													   data-th-data-result="${AMT_INCOME_TYPE}" /> </select>
											</div>
										</div>
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												   data-th-text="#{FinBondTargetAsset002.tradeCalendarCode}">交易日历</label>
											<div class="layui-input-inline input-inline">
												<select name="calendarId" id="calendarId"
														class="layui-input form-input input-select"
														data-th-placeholder="#{SysCommon.placeholder}"
														data-th-data-url="@{/valuation/basicdata/asset/ValAssetCommon/selectCalendarIdForPge}"
														data-th-initValue='${entity?.calendarId}'
														required="required">
												</select>
											</div>
										</div>
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												   data-th-text="#{FinBondTargetAsset002.isSus}">是否永续</label>
											<div class="layui-input-inline input-inline">
												<input type="checkbox" id="isSus" name="isSus"
													   lay-skin="switch" data-th-value="${YES}" lay-text="是|否"
													   data-th-checked="${YES_OR_NO_Y} ==${entity?.isSus}">
											</div>
										</div>
									</div>
									<div class="layui-form-item">
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												   data-th-text="#{FinBondTargetAsset002.accountintType}">核算分类</label>
											<div class="layui-input-inline input-inline">
												<select id="accountintType"
														name="accountintType"
														th:initValue="${entity?.accountintType}"
														class="layui-input form-input input-select"
														placeholder="请输入内容"
														data-th-placeholder="#{SysCommon.placeholder}" disabled = true
														data-th-data-result="${BOND_ACCOUNTING_CLASSIFICATION}" readonly>
												</select>
											</div>
										</div>
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												   data-th-text="#{FinBondTargetAsset002.taxType}">税务分类</label>
											<div class="layui-input-inline input-inline">
												<select id="taxType"
														name="taxType"
														th:initValue="${entity?.taxType}"
														class="layui-input form-input input-select"
														placeholder="请输入内容"
														data-th-placeholder="#{SysCommon.placeholder}" disabled = true
														data-th-data-result="${TAX_ASSET_TYPE}" readonly>
												</select>
											</div>
										</div>
										<div class="form-inline-wrap">
											<label class="layui-form-label form-label-wrap"
												   data-th-text="#{FinBondTargetAsset002.riskType}">风险五级分类</label>
											<div class="layui-input-inline input-inline">
												<select id="riskType"
														name="riskType"
														class="layui-input form-input input-select"
														placeholder="请输入内容"
														data-th-initValue='${entity?.riskType}'
														data-th-placeholder="#{SysCommon.placeholder}" required
														data-th-data-result="${BOND_RISK_TYPE}">
												</select>
											</div>
										</div>

									</div>
								</div>
							</div>
						</div>
					</div>
					<div class="pro-module" id="FinProductConvertible_div" style="display: none">
						<h3 class="pro-module-title"><span class="aleft stuff" data-th-text="#{FinBondTargetAsset002.finProductConvertible}">转股信息</span>（<span class="star-sign">*</span>必填）<i class="iconfont icon-arrow-down pro-down-icon"></i></h3>
						<div class="pro-module-item">
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<input type="hidden" id="conFinprodId" name="finProductConvertible.conFinprodId" data-th-value='${entity?.finProductConvertible?.conFinprodId}'>
									<label class="layui-form-label form-label-wrap" data-th-text="#{FinBondTargetAsset002.finProductConvertible.conFinprodName}" >正股代码</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="conFinprodMarketId" name="conFinprodMarketId"
												class="layui-input form-input input-select"
												data-th-data-url="@{/valuation/basicdata/asset/ValAssetCommon/getAssetIdOption(finprodType=${FINPROD_TYPE_F10})}"
												formatoption="true" allowClear="true" required
												data-th-initValue='${entity?.conFinprodMarketId}'>
										</select>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap" data-th-text="#{FinBondTargetAsset002.finProductConvertible.conFinprodId}" >正股名称</label>
									<div class="layui-input-inline input-inline">
										<select type="text" id="conFinprodName" name="conFinprodName"
												class="layui-input form-input input-select" disabled="disabled"
												data-th-data-url="@{/valuation/basicdata/asset/bond/FinBondTargetAsset002/getAssetIdOption(finprodType=${FINPROD_TYPE_F10})}"
												formatoption="true" allowClear="true"
												data-th-initValue='${entity?.conFinprodMarketId}'>
										</select>
									</div>
								</div>
								<div class="form-inline-wrap" style="display: none">
									<label class="layui-form-label form-label-wrap" data-th-text="#{FinBondTargetAsset002.finProductConvertible.conShareId}" >转股代码</label>
									<div class="layui-input-inline input-inline">
										<input id="conShareId" name="finProductConvertible.conShareId" th:value="${entity?.finProductConvertible?.conShareId}"
											   class="layui-input form-input" placeholder="请输入内容" data-th-placeholder="#{SysCommon.placeholder}">
										</input>
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap" style="display: none;">
									<label class="layui-form-label form-label-wrap"
										   data-th-text="#{FinBondTargetAsset002.finProductConvertible.conVdate}">转股起始日</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="conVdate" name="finProductConvertible.conVdate"
											   data-th-value='${#dates.format(entity?.finProductConvertible?.conVdate?:iPlatformDate,"yyyy-MM-dd")}'
											   required="required"
											   class="layui-input form-input input-dateSelect" />
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap" data-th-text="#{FinBondTargetAsset002.finProductConvertible.conPrice}">转股价格</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="conPrice" name="finProductConvertible.conPrice"   th:value="${entity?.finProductConvertible?.conPrice}"  required
											   class="layui-input form-input text-number" data-textrange="2"/>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap" data-th-text="#{FinBondTargetAsset002.finProductConvertible.conPrent }">转股比例</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="conPrent"
											   disabled="disabled"  class="layui-input form-input text-number" data-textrange="2"/>
									</div>
								</div>
							</div>
							<div class="layui-form-item">
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap" data-th-text="#{FinBondTargetAsset002.finProductConvertible.resalePrice }">回售触发价</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="resalePrice" name="finProductConvertible.resalePrice"   th:value="${entity?.finProductConvertible?.resalePrice}"
											   class="layui-input form-input text-number" data-textrange="2"/>
									</div>
								</div>
								<div class="form-inline-wrap">
									<label class="layui-form-label form-label-wrap" data-th-text="#{FinBondTargetAsset002.finProductConvertible.redeemPrice }">赎回触发价</label>
									<div class="layui-input-inline input-inline">
										<input type="text" id="redeemPrice" name="finProductConvertible.redeemPrice"   th:value="${entity?.finProductConvertible?.redeemPrice}" required
											   class="layui-input form-input text-number" data-textrange="2"/>
									</div>
								</div>
							</div>
						</div>
					</div>
					<!-- 计息要素业务 -->
					<div class="page-component"
						th:data-path="@{/valuation/component/asset/FinInterestFactor/init}"
						th:data-params="|{entityName:'finInterestFactorDto',entityNamePayInterest:'finPayInterestStdInfoDto',entityNamebussFinRepayment:'bussFinRepaymentDto',entityNamebusiFinExercisePlan:'busiFinExercisePlanDto',vdate:'${#dates.format(entity?.vdate,'yyyy-MM-dd')}',finprodId:'${entity?.finprodId?:''}',couponSpecies:'${entity?.couponSpecies}',workflowId:'${workflowId?:''}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}'}|"></div>
					<!-- 付息信息业务 -->
					<div class="page-component"
						th:data-path="@{/valuation/component/asset/FinPayInterestStdInfo/init}"
						th:data-params="|{entityName:'finPayInterestStdInfoDto',entityNameFinInterestFactor:'finInterestFactorDto',finprodId:'${entity?.finprodId?:''}',vdate:'${#dates.format(entity?.vdate,'yyyy-MM-dd')}',workflowId:'${workflowId?:''}',int_asset_type:'${INT_ASSET_TYPE}', pageId:'${pageId}'}|"></div>
					<!-- 还本信息业务 -->
					<div class="page-component"
						th:data-path="@{/valuation/component/asset/BussFinRepayment/init}"
