<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/default}">
<head>
    <title data-th-text="#{FinBondTargetAsset001}">债券类资产</title>
</head>
<body>
<div layout:fragment="content" id="FinBondTargetAsset001_DIV">
    <div class="form-button-area">
        <a id="FinBondTargetAsset001_btn_add" class="layui-btn layui-btn-sm btn-create" data-th-text="#{SysCommon.create}">新建</a>
        <a id="FinBondTargetAsset001_btn_delete" class="layui-btn layui-btn-sm btn-delete" data-th-text="#{SysCommon.delete}" style="display: none">删除</a>
        <a id="FinBondTargetAsset001_btn_rateAdj" class="layui-btn layui-btn-sm btn-rateAdj">
            <i class="iconfont icon-tiaozheng"></i><span data-th-text="#{FinAssetRateAdj001.rateAdj}">利率调整</span></a>
    </div>
    <div class="joyin-form-wrap joyin-filter-form condition-area curr-form">
        <form class="layui-form" id="searchForm" >
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{FinBondTargetAsset002.finprodId}">资产代码</label>
                    <div class="layui-input-inline input-inline">
                        <input type="text" id="finprodId"  name="finprodId" class="layui-input form-input input-lenovoselect" placeholder="请输入内容"
                               data-th-placeholder="#{SysCommon.placeholder}"  data-th-data-url="@{/valuation/basicdata/asset/ValAssetCommon/getAssetId(finprodType=${FINPROD_TYPE_F01})}"
                               data-idfield="code" data-keyfield="code"
                               data-th-data-effectivefieldsalias='|{"shortName":"#{FinBondTargetAsset002.finprodName}","code":"#{FinBondTargetAsset002.finprodId}"}|'>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{FinBondTargetAsset002.couponSpecies}">息票品种</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" name="couponSpecies"  class="layui-input form-input input-select"  data-th-data-result="${COUPON_SPECIES}"></select>
                    </div>
                </div>
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable" data-th-text="#{FinBondTargetAsset002.accountintType}">核算分类</label>
                    <div class="layui-input-inline input-inline">
                        <select type="text" name="accountintType"  class="layui-input form-input input-select"  data-th-data-result="${BOND_ACCOUNTING_CLASSIFICATION}"></select>
                    </div>
                </div>
            </div>
            <div class="layui-form-item">
                <div class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FinBondTargetAsset002.vdate}">起息日</label>
                    <div class="layui-input-inline input-inline">
                        <input name="vdate" class="layui-input form-input input-dateRangeSelect"
                               placeholder="请选择、支持区间"
                               data-th-placeholder="#{SysCommon.dateInterval}">
                    </div>
                </div>
                <div
                        class="layui-inline layui-col-xs4 layui-col-sm4 layui-col-md4 layui-col-lg4">
                    <label class="layui-form-label form-lable"
                           data-th-text="#{FinBondTargetAsset002.mdate}">到期日</label>
                    <div class="layui-input-inline input-inline">
                        <input name="mdate"
                               class="layui-input form-input input-dateRangeSelect"
                               placeholder="请选择、支持区间"
                               data-th-placeholder="#{SysCommon.dateInterval}">
                    </div>
                </div>
            </div>

        </form>
    </div>
    <div>
        <table class="layui-table" id="dataTable"></table>
    </div>
</div>
<div layout:fragment="script">
    <script data-th-inline="javascript" type="text/javascript">
        var YES_OR_NO_Y = /*[[${YES_OR_NO_Y}]]*/'Y';
    </script>
    <script data-th-src="@{/js/valuation/basicdata/asset/bond/FinBondTargetAsset001.js}" type="text/javascript"></script>
    <script data-th-src="@{/js/valuation/basicdata/asset/common/AssetCommon.js}" type="text/javascript"></script>
</div>
</body>

</html>
