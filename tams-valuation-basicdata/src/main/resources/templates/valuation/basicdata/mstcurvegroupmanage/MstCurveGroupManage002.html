<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{layout/default}">
<head>
<title data-th-text="#{MstCurveDefManage002}">收益率曲线详情</title>
    <style>
        .height30{
            height:30px;
            padding-top:0px;
        }

        .checkRed{
            font-weight: bolder;
            vertical-align: middle;
            display: inline-block;
            height: 22px;
            color: red;
            font-size: 20px !important;
        }
    </style>
</head>
<body>
     <div layout:fragment="content">
           <form class="layui-form"  id="submitForm">
               <div class="layui-form-item">
                   <div class="layui-inline layui-col-md6">
                       <label class="layui-form-label form-lable" >曲线代码</label>
                       <div class="layui-input-inline input-inline">
                           <input type="text" id="curveGroupCode" name="curveGroupCode" maxlength="50"
                                  class="layui-input form-input"
                                  placeholder="请输入内容" data-th-value = "${entity?.curveGroupCode}"
                                  data-th-placeholder="#{SysCommon.placeholder}" required
                           >
                       </div>
                   </div>

                   <div class="layui-inline layui-col-md6">
                       <label class="layui-form-label form-lable" >曲线名称</label>
                       <div class="layui-input-inline input-inline">
                           <input type="text" id="curveGroupName" name="curveGroupName"
                                  class="layui-input form-input"
                                  placeholder="请输入内容"
                                  data-th-placeholder="#{SysCommon.placeholder}"
                                  data-th-value = "${entity?.curveGroupName}" required
                           >
                       </div>
                   </div>
               </div>

               <div class="layui-form-item">
                   <div class="layui-inline layui-col-md6">
                       <label class="layui-form-label form-lable" >曲线来源</label>
                       <div class="layui-input-inline input-inline">
                           <select formatoption = "true" type="text" id="valueSource"
                                   name="valueSource"class="layui-input form-input input-select"
                                   data-th-data-result='${CURVE_SOURCE}' data-th-initValue="${entity?.valueSource}"
                                   allowClear="true"placeholder="请输入内容"data-th-placeholder="#{SysCommon.placeholder}" required>
                           </select>
                       </div>
                   </div>

                   <div class="layui-inline layui-col-md6">
                       <label class="layui-form-label form-lable" >描述<span class="checkRed" id="remark_redId">*</span>
                       </label>
                       <div class="layui-input-inline input-inline">
                           <input type="text" id="remark" name="remark"
                                  class="layui-input form-input"
                                  placeholder="请输入内容"
                                  data-th-placeholder="#{SysCommon.placeholder}"
                                  data-th-value = "${entity?.remark}" >
                       </div>
                   </div>
               </div>


               <div class="layui-col-md11 layui-col-xs11 layui-col-sm11 layui-col-lg11" style="position: fixed;bottom: 30px;">
                   <div class="text-center">
                       <!--<a id="ModGradePdConfig002_btn_save" class="layui-btn layui-btn-sm btn-save"
                          data-th-text="#{SysCommon.save}">保存</a>-->
                       <a id="MstCurveGroupManage002_btn_submit"
                          class="layui-btn layui-btn-sm btn-submit" data-th-text="#{SysCommon.submit}">提交</a>
                       <a id="MstCurveGroupManage002_btn_cancel"
                          class="layui-btn layui-btn-sm btn-cancel" data-th-text="#{SysCommon.cancel}">取消</a>
                   </div>
               </div>
           </form>

     </div>
     <div layout:fragment="script">
         <script data-th-src="@{/js/valuation/basicdata/mstcurvegroupmanage/MstCurveGroupManage002.js}" type="text/javascript"></script>
     </div>
</body>

</html>
